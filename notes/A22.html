Design**. Set Caption **Stock check**.","**Form Design › Controls › List Box**, draw it, and in the wizard choose **get the values from another table or query** › **Queries** › **qryLowStock** › add all fields › Finish.","Name it **lstLowStock**; set **Column Heads** Yes and **Column Count** 5. Save as **frmStockCheck**."],"answer":"In Form view the list shows P0004, P0002 and P0007 with their stock and reorder levels."},{"t":"tip","text":"The **Column** property counts from **0**. With Row Source CustomerID, Surname, FirstName, Postcode, a text box with Control Source **=[cboCustomer].[Column](3)** shows the chosen customer's postcode."},{"t":"warn","text":"If a combo box shows numbers instead of names, or saves the wrong value, check **Column Widths** (first width 0 to hide the ID) and **Bound Column** (1 = the ID). If the Row Source has fewer columns than Column Count, the extra columns are just blank."},{"t":"key","title":"Check it works","items":["In frmOrder, cboCustomer lists surnames alphabetically and order 1 shows *Maguire*.","Change order 3's customer to Graham, then check tblOrder: CustomerID for order 3 is now 4. Change it back to McCaffrey (2).","Typing a surname that is not in the list gives *The text you entered isn't an item in the list*."]}],"diagram":{"kind":"match","title":"Combo box properties","caption":"Match each property to what it controls.","pairs":[["Row Source","The table, query or SQL that supplies the list"],["Control Source","The field the chosen value is saved in"],["Bound Column","Which column's value is stored"],["Column Widths","How wide each column is; 0 hides it"],["Limit To List","Whether values not in the list are refused"],["Column(2)","The third column of the selected row"]]},"check":[{"q":"cboCustomer shows surnames but must save the CustomerID. Which setting makes that happen?","o":["Column Count 1","Limit To List No","Bound Column 1 with the first column width 0cm","Row Source Type Value List"],"a":2,"why":"The hidden first column (CustomerID) is the bound column."},{"q":"A combo's Row Source is SELECT ProductID, Description, Price FROM tblProduct. What does Column(2) return?","o":["ProductID","Price","Description","An error"],"a":1,"why":"Columns are numbered from 0, so 2 is the third column."},{"q":"When is a list box better than a combo box?","o":["When you want the whole list visible at all times","When space is tight","When the list has thousands of items","When values must be typed"],"a":0,"why":"A list box displays its items permanently."}],"exam":[],"practice":[{"q":"Try it yourself: add an unbound combo box **cboCategoryFilter** to frmStockCheck that lists the four categories, and change lstLowStock so it shows only low-stock items in the chosen category.","m":5,"a":"Combo Box tool (wizard) › I will type in the values › Parts, Accessories, Clothing, Tools › Remember the value for later use (unbound) › name cboCategoryFilter. lstLowStock Row Source: SELECT ProductID, Description, Category, StockLevel, ReorderLevel FROM tblProduct WHERE StockLevel<=ReorderLevel AND (Category=[Forms]![frmStockCheck]![cboCategoryFilter] OR [Forms]![frmStockCheck]![cboCategoryFilter] Is Null) ORDER BY StockLevel; cboCategoryFilter › Event › After Update › [Event Procedure]:\n\nPrivate Sub cboCategoryFilter_AfterUpdate()\n    Me.lstLowStock.Requery   ' re-run the list's Row Source with the new category\nEnd Sub\n\nTest: choose Parts → only P0002; clear the combo → all three."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Combo box","List box","Bound column","Record Source"]},{"id":"c04-p04","spec":"Build a main form with a subform: orders and order lines","lessons":["AD04"],"summary":"Create sfrmOrderLine with a product combo box and put it inside frmOrder, linked on OrderID.","blocks":[{"t":"p","text":"One order has many lines, so the order form needs a [[subform|Subform]]: a form inside a form. The main form (frmOrder) shows one order; the subform (sfrmOrderLine) shows that order's lines in rows. Access links them on **OrderID**, so new lines automatically get the right OrderID."},{"t":"key","title":"You will need / By the end","items":["frmOrder from the previous page; tblOrderLine and tblProduct.","By the end you can add an order with several product lines on one screen."]},{"t":"example","title":"Tutorial: Create sfrmOrderLine","steps":["**Create › Form Wizard**.","**Table: tblOrderLine**: add OrderLineID, OrderID, ProductID, Quantity. Then **Table: tblProduct**: add **Price** › Next.","*How do you want to view your data?* **by tblOrderLine** › Next › **Tabular** › Next › title **sfrmOrderLine** › *Modify the form's design* › Finish.","Check the form's **Record Source** (Property Sheet › Form › Data). It is a SELECT joining the two tables — see the SQL below. Set **Default View** to **Continuous Forms**.","Delete the **OrderLineID** and **OrderID** text boxes and their header labels (the fields stay in the record source).","If ProductID is a text box, right-click it › **Change To › Combo Box**. Name it **cboProduct** and set: Row Source **SELECT ProductID, Description, Price FROM tblProduct ORDER BY Description;**, Column Count **3**, Column Widths **1.5cm;5cm;2cm**, List Width **8.5cm**, Bound Column **1**, Limit To List **Yes**.","Rename **Quantity** → **txtQuantity**. Rename **Price** → **txtPrice** and set Locked **Yes**, Tab Stop **No**, Format **Currency**.","**Ctrl+S** and close."]},{"t":"code","lang":"sql","code":"SELECT tblOrderLine.OrderLineID, tblOrderLine.OrderID, tblOrderLine.ProductID,\n       tblOrderLine.Quantity, tblProduct.Price\nFROM tblProduct INNER JOIN tblOrderLine ON tblProduct.ProductID = tblOrderLine.ProductID;","title":"Record Source of sfrmOrderLine"},{"t":"example","title":"Tutorial: Put the subform into frmOrder","steps":["Open **frmOrder** in Design view and drag the bottom of the Detail section down to make room.","**Form Design › Controls › Subform/Subreport** (wizards on), draw a large rectangle.","Choose **Use an existing form** › **sfrmOrderLine** › Next.","Choose **Show tblOrderLine for each record in tblOrder using OrderID** › Next. Name **sfrmOrderLine** › Finish.","Click the subform's border once to select the *subform control* and check on the Data tab: Source Object **sfrmOrderLine**, Link Master Fields **OrderID**, Link Child Fields **OrderID**.","**Ctrl+S**, switch to Form view."]},{"t":"tip","text":"Because the record source joins tblOrderLine to tblProduct, choosing a product in cboProduct makes Access fill in **Price** by itself (an *AutoLookup*). The price is still stored only once, in tblProduct."},{"t":"warn","text":"Selecting the subform: one click on the border selects the **subform control** (Source Object, Link fields); clicking inside it selects the **form inside** (Record Source, Default View). If you can't find a property, you have selected the other one."},{"t":"key","title":"Check it works","items":["Open frmOrder: order 1 shows two lines (Inner tube × 2, LED front light × 1).","Go to a new order, choose a customer, then add a line in the subform: the price fills in. Check tblOrderLine: the new line has the new OrderID.","Move between orders: the subform changes to show only that order's lines."]}],"diagram":{"kind":"hotspot","title":"frmOrder with its subform","caption":"Click the parts of the order form.","rows":[[{"label":"txtOrderID","detail":"Bound to tblOrder.OrderID (AutoNumber, locked).","span":1},{"label":"cboCustomer","detail":"Shows the surname, stores CustomerID.","span":2},{"label":"txtOrderDate / cboStatus","detail":"Default today's date and 'Open' come from the table.","span":1}],[{"label":"Link Master Fields: OrderID","detail":"The field on the main form the subform follows.","span":2},{"label":"Link Child Fields: OrderID","detail":"The matching field in the subform's record source; filled in automatically for new lines.","span":2}],[{"label":"sfrmOrderLine (subform control)","detail":"Continuous form: one row per order line with cboProduct, txtQuantity, txtPrice and txtLineTotal.","span":4}],[{"label":"Totals on the main form","detail":"txtOrderSubtotal, txtOrderVAT and txtOrderTotal read the subform footer (next page).","span":4}]],"links":[["Link Master Fields: OrderID","Link Child Fields: OrderID"],["Link Child Fields: OrderID","sfrmOrderLine (subform control)"]]},"check":[{"q":"Which properties make the subform show only the current order's lines?","o":["Record Source and Control Source","Row Source and Bound Column","Default View and Data Entry","Link Master Fields and Link Child Fields"],"a":3,"why":"The link fields filter the subform to match the main form's OrderID."},{"q":"Why is sfrmOrderLine set to Continuous Forms?","o":["To stop new lines","Because subforms can't be single forms","To show several order lines at once, with a footer for totals","To hide the price"],"a":2,"why":"Continuous Forms shows many records and (unlike Datasheet) shows the form footer."},{"q":"You choose a product in cboProduct and the price appears by itself. Why?","o":["VBA code copies it","The record source joins tblProduct, so Access looks up the price","Price is a default value","The combo's Column Count is 3"],"a":1,"why":"An AutoLookup join fills the 'one' side fields when the foreign key is entered."}],"exam":[],"practice":[{"q":"Try it yourself: add a subform to **frmCustomer** that lists the customer's orders (OrderID, OrderDate, Status) read-only.","m":4,"a":"Create › Form Wizard › Table: tblOrder › OrderID, CustomerID, OrderDate, Status › Tabular › title sfrmCustomerOrders. In its Property Sheet (Form): Allow Edits No, Allow Additions No, Allow Deletions No; delete the CustomerID control. Open frmCustomer in Design view › Subform/Subreport › Use an existing form › sfrmCustomerOrders › Show tblOrder for each record in tblCustomer using CustomerID › Finish. Check Link Master/Child Fields = CustomerID. Test: Maguire shows orders 1 and 4; Graham shows none."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Subform","Record Source","Combo box"]},{"id":"c04-p05","spec":"Add calculated controls: line totals, subtotal, VAT and order total","lessons":["AD04"],"summary":"Show each line total in the subform, a subtotal in the subform footer and VAT and total on frmOrder.","blocks":[{"t":"p","text":"A [[calculated control|Calculated control]] is a text box whose Control Source starts with **=**. It works the answer out on screen and stores nothing. You add a line total to each row, a Sum in the subform footer, and then read that sum onto the main form to work out VAT and the order total."},{"t":"key","title":"You will need / By the end","items":["frmOrder with sfrmOrderLine.","By the end order 2 shows Subtotal £88.99, VAT £17.80 and Total £106.79."]},{"t":"example","title":"Tutorial: Line total in the subform","steps":["Open **sfrmOrderLine** in Design view.","Add a **Text Box** in the Detail row after txtPrice; delete its label. Put a label **Line total** in the Form Header above it.","Name: **txtLineTotal**; Control Source: **=[Quantity]*[Price]**; Format **Currency**; Locked **Yes**; Tab Stop **No**."]},{"t":"example","title":"Tutorial: Subtotal in the subform footer","steps":["Make sure the Form Footer is visible (right-click › **Form Header/Footer**) and drag it open.","Add a text box in the **Form Footer** under the line totals. Name **txtSubtotal**; Control Source **=Sum([Quantity]*[Price])**; Format **Currency**. Label it **Subtotal**.","**Ctrl+S**, close."]},{"t":"example","title":"Tutorial: VAT and total on the main form","steps":["Open **frmOrder** in Design view. Below the subform add three text boxes with labels.","**txtOrderSubtotal**: **=Nz([sfrmOrderLine].[Form]![txtSubtotal],0)**","**txtOrderVAT**: **=Round([txtOrderSubtotal]*0.2,2)**","**txtOrderTotal**: **=[txtOrderSubtotal]+[txtOrderVAT]**","Set all three to Format **Currency** and Locked **Yes**; make txtOrderTotal bold. **Ctrl+S**, Form view."]},{"t":"code","lang":"excel","code":"=[Quantity]*[Price]                          ' txtLineTotal (subform detail)\n=Sum([Quantity]*[Price])                     ' txtSubtotal (subform footer)\n=Nz([sfrmOrderLine].[Form]![txtSubtotal],0)  ' txtOrderSubtotal (main form)\n=Round([txtOrderSubtotal]*0.2,2)             ' txtOrderVAT\n=[txtOrderSubtotal]+[txtOrderVAT]            ' txtOrderTotal","title":"Control Sources (type each into the Control Source property)"},{"t":"warn","text":"**Sum() only works on fields, not on other calculated controls.** =Sum([txtLineTotal]) gives #Error; repeat the expression instead: =Sum([Quantity]*[Price]). And in the main-form reference, *sfrmOrderLine* must be the name of the **subform control** on frmOrder (check its Name on the Other tab)."},{"t":"tip","text":"The subtotal updates when a line is **saved** — when you move to the next line or press Shift+Enter — not while you are still typing the quantity. In Chapter 7 you add VBA to recalculate and to store totals."},{"t":"key","title":"Check it works","items":["Order 1: lines £11.98 and £24.99, Subtotal £36.97, VAT £7.39, Total £44.36.","Change a quantity, press Shift+Enter: all three totals update.","A brand-new order with no lines shows £0.00 rather than an error, thanks to Nz()."]}],"diagram":{"kind":"calc","title":"Check an order's total","caption":"Enter two order lines. Order 2 (1 × 59.99 and 2 × 14.50) should give £106.79 after rounding.","inputs":[{"id":"q1","label":"Line 1 quantity","value":1},{"id":"p1","label":"Line 1 price (£)","value":59.99},{"id":"q2","label":"Line 2 quantity","value":2},{"id":"p2","label":"Line 2 price (£)","value":14.5}],"formula":"(q1*p1+q2*p2)*1.2","result":{"label":"Order total including 20% VAT","unit":"£"}},"check":[{"q":"Which Control Source correctly totals the order lines in the subform footer?","o":["=Sum([Quantity]*[Price])","=Sum([txtLineTotal])","=Total([LineTotal])","=[Quantity]*[Price]"],"a":0,"why":"Sum must work on fields in the record source, so repeat the calculation."},{"q":"What does Nz([sfrmOrderLine].[Form]![txtSubtotal],0) do when the order has no lines yet?","o":["Shows #Error","Deletes the order","Adds a line","Shows 0 instead of a blank (Null)"],"a":3,"why":"Nz replaces Null with the value you give."},{"q":"Order 4 has a subtotal of £51.97. What does txtOrderVAT show?","o":["£10.40","£62.36","£10.39","£5.20"],"a":2,"why":"51.97 × 0.2 = 10.394, rounded to £10.39."}],"exam":[],"practice":[{"q":"Try it yourself: add a text box **txtItemCount** to the subform footer that shows how many items (not lines) are on the order, and show it on the main form as 'Items: 3'.","m":3,"a":"Subform footer: text box txtItemCount, Control Source =Sum([Quantity]). Main form: text box txtItems, Control Source =\"Items: \" & Nz([sfrmOrderLine].[Form]![txtItemCount],0). Test: order 2 has 1 jacket + 2 gloves → Items: 3; order 4 → Items: 4."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Calculated control","Subform"]},{"id":"c04-p06","spec":"Highlight data with conditional formatting","lessons":["AD04"],"summary":"Make low stock show in red on frmProduct and open orders stand out on frmOrder.","blocks":[{"t":"p","text":"[[Conditional formatting]] changes how a control looks when a condition is true, so problems jump out without any code. On frmProduct the stock level turns red and bold when it is at or below the reorder level; on frmOrder an Open status is shaded amber."},{"t":"key","title":"You will need / By the end","items":["frmProduct (controls renamed: txtStockLevel) and frmOrder (cboStatus).","By the end D-lock, Brake pads and Multi-tool show red stock levels."]},{"t":"example","title":"Tutorial: Low stock in red on frmProduct","steps":["Open **frmProduct** in **Design view** and click **txtStockLevel**.","**Format tab › Conditional Formatting**. The *Conditional Formatting Rules Manager* opens, showing rules for txtStockLevel.","Click **New Rule**. Choose **Check values in the current record or use an expression**.","Under *Format only cells where the:* choose **Expression Is** and type **[StockLevel]<=[ReorderLevel]**.","Click **Bold** and set **Font colour** to red › **OK** › **OK**.","**Ctrl+S**, Form view, and step through the products."]},{"t":"example","title":"Tutorial: Open orders in amber on frmOrder","steps":["Open **frmOrder** in Design view, click **cboStatus** › **Format › Conditional Formatting › New Rule**.","Choose **Field Value Is** › **equal to** › type **\"Open\"**.","Set **Background colour** to a light amber › OK › OK. **Ctrl+S**."]},{"t":"table","head":["Rule type","Example","Use"],"rows":[["Field Value Is","less than 5","Compare this control's own value with a number or text"],["Expression Is","[StockLevel]<=[ReorderLevel]","Compare with other fields, or any true/false expression"],["Field Has Focus","—","Highlight the box the user is typing in"],["Data Bar","Compare to other records","A bar inside the box (continuous forms)"]],"caption":"Rule types"},{"t":"tip","text":"Expression rules can refer to any field in the form's record source, even one without a control. On a continuous form like frmProductList each row is formatted separately, so you see every low-stock row in red at once — try adding the same rule there."},{"t":"warn","text":"Rules are checked from the top of the list down and the first true rule wins. If a 'red when low' rule never shows, check that an earlier rule (e.g. 'blue when > 0') isn't catching it first — use the up/down arrows in the Rules Manager to reorder them."},{"t":"key","title":"Check it works","items":["frmProduct: P0002, P0004 and P0007 show red bold stock; P0001 shows normal black.","Change P0001's stock to 10 in the form and move off the record: it turns red. Put it back to 40.","frmOrder: orders 3 and 4 (Open) show amber; orders 1 and 2 do not."]}],"diagram":{"kind":"table-reveal","title":"Which stock levels turn red?","caption":"Rule: [StockLevel]<=[ReorderLevel]. Predict, then reveal.","head":["ProductID","StockLevel","ReorderLevel","Red?"],"rows":[["P0001","40","10","No"],["P0002","4","6","Yes"],["P0004","3","5","Yes"],["P0005","7","4","No"],["P0007","5","5","Yes (equal counts)"],["P0008","9","3","No"]],"hidden":[[0,3],[1,3],[2,3],[3,3],[4,3],[5,3]]},"check":[{"q":"Which rule type do you need to compare StockLevel with ReorderLevel?","o":["Field Has Focus","Expression Is","Field Value Is","Data Bar"],"a":1,"why":"Comparing two fields needs an expression."},{"q":"Two rules both apply to a value. Which formatting is shown?","o":["The first true rule in the list","Both, mixed together","The last rule's","Neither"],"a":0,"why":"The first rule that is true wins."}],"exam":[],"practice":[{"q":"Try it yourself: on sfrmOrderLine, make the quantity show red if the customer has ordered more than are in stock.","m":3,"a":"Add StockLevel to the subform's Record Source (SELECT …, tblProduct.Price, tblProduct.StockLevel FROM …). Select txtQuantity › Format › Conditional Formatting › New Rule › Expression Is: [Quantity]>[StockLevel] › red bold › OK. Test: on order 3 change the brake pads quantity to 5 (stock 4) → red. (Chapter 7 adds VBA to stop the order being confirmed.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Conditional formatting"]},{"id":"c04-p07","spec":"Add command buttons with the wizard and with VBA event procedures","lessons":["AD04"],"summary":"Add navigation buttons with the wizard, then Save, New and Close buttons written in VBA.","blocks":[{"t":"p","text":"A [[command button|Command button]] runs something when clicked — the click is an [[event|Event]]. The Button Wizard attaches a ready-made macro; writing an [[event procedure|Event procedure]] in [[VBA]] gives you full control, with messages and checks. You will write a lot of VBA in Chapters 6–7; this page shows exactly how to attach your first procedures."},{"t":"anim","scene":"access-event","caption":"A click fires an event, and the event runs its VBA procedure."},{"t":"key","title":"You will need / By the end","items":["frmCustomer with controls renamed (txtFirstName etc.) and a Form Footer; the database trusted.","By the end frmCustomer has Previous/Next buttons (wizard) and Save/New/Close buttons (VBA)."]},{"t":"example","title":"Tutorial: Buttons with the wizard","steps":["Open **frmCustomer** in Design view. Make sure **Use Control Wizards** is on.","**Form Design › Controls › Button**, click in the **Form Footer**.","Categories **Record Navigation** › Actions **Go To Previous Record** › Next › choose Text **Previous** › Next › name **cmdPrevious** › Finish.","Repeat for **Go To Next Record** → **cmdNext**.","Look at the Property Sheet › **Event › On Click**: it says **[Embedded Macro]** — the wizard made a macro, not VBA."]},{"t":"example","title":"Tutorial: Buttons with VBA","steps":["Turn **Use Control Wizards** off (Controls gallery ▾). Add a Button in the footer.","Property Sheet: **Other › Name** = **cmdSave**; **Format › Caption** = **&Save** (the & makes Alt+S a shortcut).","**Event › On Click** › choose **[Event Procedure]** from the drop-down › click the **…** button. The VBA editor opens with an empty `Private Sub cmdSave_Click()`.","Make sure the top of the module has **Option Compare Database** and **Option Explicit**, then type the cmdSave code below between Sub and End Sub.","Back in Access, add **cmdNew** (Caption **&New**) and **cmdClose** (Caption **&Close**) the same way and type their code.","In the VBA editor click **Debug › Compile** (the menu item includes your project's name) — no message means no syntax errors. **Ctrl+S**, close the editor (Alt+Q), Form view."]},{"t":"code","lang":"ps","code":"Option Compare Database\nOption Explicit\n\n' frmCustomer – code for the buttons in the Form Footer\n\n' Save the current customer (runs the table's validation rules)\nPrivate Sub cmdSave_Click()\n    On Error GoTo SaveFailed\n    If Me.Dirty Then Me.Dirty = False      ' setting Dirty to False saves the record\n    MsgBox \"Customer saved.\", vbInformation, \"Riverside Bikes\"\n    Exit Sub\nSaveFailed:\n    MsgBox \"The customer could not be saved: \" & Err.Description, vbExclamation, \"Riverside Bikes\"\nEnd Sub\n\n' Go to a blank new record ready for typing\nPrivate Sub cmdNew_Click()\n    DoCmd.GoToRecord , , acNewRec\n    Me.txtFirstName.SetFocus\nEnd Sub\n\n' Close this form\nPrivate Sub cmdClose_Click()\n    DoCmd.Close acForm, Me.Name\nEnd Sub","title":"VBA: frmCustomer module (Property Sheet › each button › Event › On Click › [Event Procedure])"},{"t":"table","head":["Line","What it does"],"rows":[["If Me.Dirty Then Me.Dirty = False","Dirty is True when the record has unsaved changes; setting it to False saves the record"],["DoCmd.GoToRecord , , acNewRec","Moves to a new blank record (the first two arguments are left empty)"],["DoCmd.Close acForm, Me.Name","Closes this form; Me means 'the form this code belongs to'"],["MsgBox text, buttons, title","Shows a message box; vbInformation adds an (i) icon"],["On Error GoTo SaveFailed","If saving fails (e.g. a validation rule), jump to the message instead of crashing"]],"caption":"Reading the code"},{"t":"tip","text":"If clicking **…** shows a *Choose Builder* box, pick **Code Builder**. To skip it every time: **File › Options › Object Designers › Always use event procedures**."},{"t":"warn","text":"**Compile error: Variable not defined** usually means a misspelt control name, e.g. Me.txtFirstname when the control is txtFirstName — Option Explicit is catching it for you. Also check the button's **Name** matches the Sub: a Sub called cmdSave_Click does nothing if the button is still named Command12."},{"t":"key","title":"Check it works","items":["Change a phone number and click **Save**: 'Customer saved.' appears and tblCustomer shows the change.","Clear Surname and click Save: Access shows that Surname is required, then your 'could not be saved' message.","**New** moves to a blank record with the cursor in First name; **Close** closes the form; Alt+S saves."]}],"diagram":{"kind":"flow","title":"What happens when Save is clicked","caption":"Step through the event and the VBA it runs.","direction":"tb","nodes":[{"id":"a","label":"User clicks cmdSave","detail":"The Click event fires for the button named cmdSave.","shape":"start"},{"id":"b","label":"On Click = [Event Procedure]","detail":"Access runs Private Sub cmdSave_Click() in frmCustomer's module.","shape":"process"},{"id":"c","label":"Me.Dirty?","detail":"Are there unsaved changes on this record?","shape":"decision"},{"id":"d","label":"Me.Dirty = False","detail":"Saves the record; table validation rules are checked.","shape":"store"},{"id":"e","label":"Save OK?","detail":"A broken rule raises an error.","shape":"decision"},{"id":"f","label":"MsgBox 'Customer saved.'","detail":"Confirmation for the user.","shape":"io"},{"id":"g","label":"MsgBox 'could not be saved'","detail":"On Error GoTo SaveFailed shows Err.Description.","shape":"io"},{"id":"h","label":"End Sub","detail":"Control returns to the form.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","yes"],["c","f","no"],["d","e"],["e","f","yes"],["e","g","no"],["f","h"],["g","h"]]},"check":[{"q":"How do you attach VBA to a button's click?","o":["Type the code into the button's Caption","Form Design › Tab Order","Right-click the button › Change To","Property Sheet › Event › On Click › [Event Procedure] › …"],"a":3,"why":"The event property points to the event procedure in the form's module."},{"q":"What does Me.Dirty = False do?","o":["Clears the form","Deletes the record","Saves the current record","Undoes changes"],"a":2,"why":"Setting Dirty to False forces Access to save the record."},{"q":"Clicking your button does nothing at all and there is no error. Which is a likely cause?","o":["Option Explicit is on","The button's Name does not match the Sub name","The form has a footer","The caption has an &"],"a":1,"why":"cmdSave_Click only runs for a button named cmdSave (also check the database is trusted)."}],"exam":[],"practice":[{"q":"Try it yourself: add a button **cmdOrders** to frmCustomer that opens frmOrder showing only the current customer's orders. Give the complete code and where it goes.","m":4,"a":"Add a button (wizards off), Name cmdOrders, Caption &Orders. Property Sheet › Event › On Click › [Event Procedure] › … and type the code in the VBA block below. Test: on Aoife Maguire click Orders → frmOrder opens filtered to orders 1 and 4 (the navigation bar shows 'Filtered'). On a blank new record the message appears instead.\n\n' frmCustomer – open frmOrder showing only this customer's orders\nPrivate Sub cmdOrders_Click()\n    If Me.Dirty Then Me.Dirty = False               ' save any changes first\n    If Me.NewRecord Then\n        MsgBox \"Save the customer before viewing orders.\", vbExclamation, \"Riverside Bikes\"\n        Exit Sub\n    End If\n    ' CustomerID is a number, so no quotes are needed in the WhereCondition\n    DoCmd.OpenForm \"frmOrder\", , , \"CustomerID = \" & Me.txtCustomerID\nEnd Sub"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Command button","Event","Event procedure","VBA","DoCmd","MsgBox","Option Explicit"]},{"id":"c04-p08","spec":"Set form properties: Record Source, Data Entry, Allow Additions, Pop Up, Modal and navigation","lessons":["AD04"],"summary":"Use form properties to make a new-customer-only form and a pop-up login window that must be answered.","blocks":[{"t":"p","text":"Form properties control how a whole form behaves: where its data comes from, whether existing records can be seen or changed, and whether it floats above other windows. Set them with the **Selection type: Form** in the Property Sheet. You build two variations: **frmNewCustomer** (add only) and the **frmLogin** window used in Chapter 7."},{"t":"key","title":"You will need / By the end","items":["frmCustomer.","By the end you have a data-entry form and an unbound pop-up login form."]},{"t":"table","head":["Property (tab)","Setting","Effect"],"rows":[["Record Source (Data)","tblCustomer / a query / SQL","Where the form's records come from; blank = unbound form"],["Data Entry (Data)","Yes","Opens on a blank new record and hides existing records"],["Allow Additions / Edits / Deletions (Data)","Yes / No","Whether users can add, change or delete records"],["Default View (Format)","Single Form / Continuous Forms / Datasheet","One record at a time or many rows"],["Pop Up (Other)","Yes","The form stays on top of other windows"],["Modal (Other)","Yes","Users must close the form before they can use anything else"],["Navigation Buttons (Format)","No","Hides the record navigation bar"],["Record Selectors (Format)","No","Hides the grey bar down the left"],["Border Style (Format)","Dialog","Fixed size, no maximise"],["Auto Center (Format)","Yes","Opens in the middle of the screen"]],"caption":"Key form properties"},{"t":"example","title":"Tutorial: frmNewCustomer: add-only form","steps":["Right-click **frmCustomer** in the Navigation Pane › **Copy**, then right-click › **Paste**, name **frmNewCustomer**.","Open it in Design view, F4, Selection type **Form**.","Data tab: **Data Entry Yes**, **Allow Deletions No**. Format tab: Caption **New customer**.","Save and open in Form view: it starts on a blank record and the existing customers are not shown."]},{"t":"example","title":"Tutorial: frmLogin: an unbound pop-up form","steps":["**Create › Form Design**. Leave **Record Source** blank (it is unbound).","Format tab: Caption **Riverside Bikes – Log in**, Default View **Single Form**, Record Selectors **No**, Navigation Buttons **No**, Scroll Bars **Neither**, Dividing Lines **No**, Auto Center **Yes**, Border Style **Dialog**.","Other tab: **Pop Up Yes**, **Modal Yes**.","Add two unbound text boxes named **txtUsername** and **txtPassword** (set txtPassword's Input Mask to **Password**), with labels *Username* and *Password*.","Add a button **cmdLogin**, Caption **&Log in**; set its **Default** property to **Yes** so Enter clicks it.","Save as **frmLogin**. The login code is written in Chapter 7."]},{"t":"tip","text":"To make a pop-up window fit its controls, drag the form's right edge and the bottom of the Detail section in until they just enclose the controls, and set **Auto Resize Yes** (Format tab) so the window opens at that size."},{"t":"warn","text":"A **Modal** form you can't close traps you. Add a Close button before testing, or press **Ctrl+F4**. If a pop-up is stuck, switch to it with the taskbar and use Esc / Ctrl+F4, or reopen the database holding **Shift**."},{"t":"key","title":"Check it works","items":["frmNewCustomer opens empty; saving a customer and reopening it shows an empty form again (the customer is in tblCustomer).","frmLogin opens centred, without navigation buttons or record selector, and you cannot click the Navigation Pane until you close it."]}],"diagram":{"kind":"match","title":"Which form property?","caption":"Match each requirement to the property you set.","pairs":[["Open on a blank record and hide existing customers","Data Entry = Yes"],["Stop orders being deleted from the form","Allow Deletions = No"],["User must deal with the login window first","Modal = Yes"],["Keep the window floating above others","Pop Up = Yes"],["Hide the record navigation bar","Navigation Buttons = No"],["Choose the table or query the form shows","Record Source"]]},"check":[{"q":"Which property makes a form open on a blank record without showing existing records?","o":["Data Entry","Allow Additions","Pop Up","Default View"],"a":0,"why":"Data Entry = Yes opens in add mode only."},{"q":"Why is frmLogin unbound?","o":["Unbound forms load faster","Pop-up forms cannot be bound","Modal forms cannot have a record source","It must not show or change staff records; code checks the typed values"],"a":3,"why":"Login details are checked in code against tblStaff rather than displayed from it."},{"q":"A form must be closed before the user can do anything else in Access. Which property?","o":["Pop Up","Border Style","Modal","Auto Center"],"a":2,"why":"Modal forms keep the focus until they close."}],"exam":[],"practice":[{"q":"Try it yourself: make frmOrder safe for shop assistants: they can add and edit orders but cannot delete them, and the form always opens at the most recent order. Say which properties to set and give any code.","m":4,"a":"frmOrder › Property Sheet › Form › Data: Allow Deletions No (Allow Additions/Edits Yes). Newest first: Data tab › Order By: OrderID DESC and Order By On Load: Yes (or set the Record Source to SELECT * FROM tblOrder ORDER BY OrderID DESC;). Alternatively keep the ascending order and jump to the last order when the form opens (Form › Event › On Load › [Event Procedure]):\n\nPrivate Sub Form_Load()\n    DoCmd.GoToRecord , , acLast   ' show the most recent order\nEnd Sub\n\n Also set the subform's Allow Deletions as required (deleting a line is reasonable)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Record Source","Modal","Unbound control"]},{"id":"c04-p09","spec":"Build a main menu and set it as the Display Form at start-up with the Navigation Pane hidden","lessons":["AD04"],"summary":"Create frmMenu with VBA buttons and make Riverside Bikes open straight to it, like a finished application.","blocks":[{"t":"p","text":"A finished system should open on a menu, not a list of tables. **frmMenu** is an unbound form of buttons that open the other forms. Access's start-up options then show it automatically, give the window the shop's name and hide the Navigation Pane so staff can't wander into the tables."},{"t":"key","title":"You will need / By the end","items":["frmCustomer, frmProduct, frmOrder and frmStockCheck.","By the end opening the database shows *Riverside Bikes* in the title bar and the main menu."]},{"t":"example","title":"Tutorial: Build frmMenu","steps":["**Create › Form Design**. Selection type Form: Caption **Riverside Bikes – Main Menu**, Record Selectors **No**, Navigation Buttons **No**, Scroll Bars **Neither**, Auto Center **Yes**.","Add a large label heading in the Form Header: **Riverside Bikes**.","Turn control wizards **off**. Add six buttons and set Name and Caption: **cmdCustomers** (&Customers), **cmdProducts** (&Products), **cmdNewOrder** (&New order), **cmdOrders** (&Orders), **cmdStockCheck** (&Stock check), **cmdExit** (E&xit).","For each button: **Event › On Click › [Event Procedure] › …** and type its code from the module below.","**Debug › Compile**, **Ctrl+S**, save the form as **frmMenu** and test every button."]},{"t":"code","lang":"ps","code":"Option Compare Database\nOption Explicit\n\n' frmMenu – the main menu buttons\n\nPrivate Sub cmdCustomers_Click()\n    DoCmd.OpenForm \"frmCustomer\"\nEnd Sub\n\nPrivate Sub cmdProducts_Click()\n    DoCmd.OpenForm \"frmProduct\"\nEnd Sub\n\n' Open the order form on a blank new order (DataMode is the 5th argument)\nPrivate Sub cmdNewOrder_Click()\n    DoCmd.OpenForm \"frmOrder\", , , , acFormAdd\nEnd Sub\n\n' Open the order form to browse existing orders\nPrivate Sub cmdOrders_Click()\n    DoCmd.OpenForm \"frmOrder\"\nEnd Sub\n\nPrivate Sub cmdStockCheck_Click()\n    DoCmd.OpenForm \"frmStockCheck\"\nEnd Sub\n\n' Ask before closing Access\nPrivate Sub cmdExit_Click()\n    If MsgBox(\"Close Riverside Bikes?\", vbYesNo + vbQuestion, \"Riverside Bikes\") = vbYes Then\n        DoCmd.Quit acQuitSaveAll\n    End If\nEnd Sub","title":"VBA: frmMenu module (each button's On Click › [Event Procedure])"},{"t":"example","title":"Tutorial: Make it open at start-up","steps":["**File › Options › Current Database**.","**Application Title**: Riverside Bikes. **Display Form**: **frmMenu**.","Under *Navigation*, **untick Display Navigation Pane**.","(Optional, only when finished) untick **Allow Full Menus** and **Use Access Special Keys** to stop users opening the Navigation Pane (F11) or the VBA editor (Alt+F11).","Click **OK**. Access says you must close and reopen the database — do so."]},{"t":"note","text":"Alternatives: **Create › Navigation** builds a [[navigation form|Navigation form]] with tabs instead of buttons, and a macro named **[[AutoExec]]** runs automatically when the database opens. In Chapter 7 you change the Display Form to **frmLogin**, whose code then opens frmMenu."},{"t":"warn","text":"To get back into design after hiding everything, hold **Shift** while you open the database (keep holding until it has opened). This bypasses the start-up options. Keep a backup before you untick Use Access Special Keys."},{"t":"tip","text":"DoCmd.OpenForm's arguments are in a fixed order: FormName, View, FilterName, WhereCondition, DataMode, WindowMode, OpenArgs. That's why acFormAdd needs four commas: `DoCmd.OpenForm \"frmOrder\", , , , acFormAdd`."},{"t":"key","title":"Check it works","items":["Close and reopen the database: the title bar says Riverside Bikes, frmMenu opens, and there is no Navigation Pane.","**New order** opens frmOrder on a blank order; **Orders** opens it at order 1; **Exit** asks before closing.","Hold Shift while opening: the Navigation Pane is back and frmMenu does not open."]}],"diagram":{"kind":"flow","title":"What happens when Riverside Bikes opens","caption":"Step through start-up with and without Shift held down.","direction":"tb","nodes":[{"id":"a","label":"Double-click Riverside Bikes.accdb","detail":"The file opens from its trusted folder.","shape":"start"},{"id":"b","label":"Shift held down?","detail":"Holding Shift bypasses start-up options (for the developer).","shape":"decision"},{"id":"c","label":"Normal Access window","detail":"Navigation Pane visible, no form opens.","shape":"end"},{"id":"d","label":"Apply Current Database options","detail":"Application Title, hide Navigation Pane, menus and special keys.","shape":"process"},{"id":"e","label":"Open Display Form","detail":"frmMenu (later frmLogin) opens.","shape":"io"},{"id":"f","label":"AutoExec macro (if any)","detail":"Runs after the Display Form opens.","shape":"process"},{"id":"g","label":"Staff use the menu","detail":"Buttons run DoCmd.OpenForm for each screen.","shape":"end"}],"edges":[["a","b"],["b","c","yes"],["b","d","no"],["d","e"],["e","f"],["f","g"]]},"check":[{"q":"Where do you set the form that opens automatically?","o":["Database Tools › Relationships","File › Options › Current Database › Display Form","Form Design › Tab Order","Create › Form Wizard"],"a":1,"why":"Display Form is a Current Database option."},{"q":"Which line opens frmOrder on a blank new order?","o":["DoCmd.OpenForm \"frmOrder\", , , , acFormAdd","DoCmd.OpenForm \"frmOrder\", acFormAdd","DoCmd.GoToRecord \"frmOrder\"","DoCmd.OpenForm acFormAdd, \"frmOrder\""],"a":0,"why":"acFormAdd is the 5th argument (DataMode)."},{"q":"You have hidden the Navigation Pane and need to edit a table. What do you do?","o":["Delete the database","Press Ctrl+Z","Compact and repair","Hold Shift while opening the database"],"a":3,"why":"Shift bypasses the start-up options."}],"exam":[],"practice":[{"q":"Try it yourself: add a button **cmdLowStock** to frmMenu that opens the low-stock report (built in Chapter 5) in Print Preview, and a button **cmdNewCustomer** that opens frmNewCustomer as a pop-up dialog.","m":4,"a":"Two buttons, wizards off, each On Click › [Event Procedure]:\n\nPrivate Sub cmdLowStock_Click()\n    DoCmd.OpenReport \"rptLowStock\", acViewPreview\nEnd Sub\n\nPrivate Sub cmdNewCustomer_Click()\n    DoCmd.OpenForm \"frmNewCustomer\", , , , acFormAdd, acDialog   ' WindowMode is the 6th argument\nEnd Sub\n\nacDialog makes the form pop-up and modal, and the code waits until it closes. Test: Low stock shows rptLowStock in preview (once Chapter 5 is done — until then you get run-time error 2103 because the report doesn't exist yet); New customer opens the add-only form on top."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Navigation form","AutoExec","DoCmd","Modal"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/04 Forms"},{"id":"c05","n":5,"title":"Reports","intro":"Turn your tables and queries into printable output: a low-stock list, sales grouped by category with totals, and a customer receipt with VAT that opens for one order and saves as a PDF.","pages":[{"id":"c05-p01","spec":"Create a report with the Report Wizard and find your way round its sections","lessons":["AD04"],"summary":"Build rptLowStock from qryLowStock with the Report Wizard, then tidy it in Layout and Design view.","blocks":[{"t":"p","text":"A [[Report]] presents data for reading or printing: a reorder list, a receipt, a sales summary. Reports cannot change data, so they are safe to hand to anyone. The quickest start is the [[Report Wizard]], then you tidy the result by hand."},{"t":"key","title":"You will need / By the end","items":["**You will need:** Riverside Bikes with `tblProduct` and the select [[Query]] `qryLowStock` (StockLevel <= ReorderLevel) from Chapter 3.","**By the end:** a report `rptLowStock` listing every product that needs reordering, sorted by description, with a count of products at the bottom."]},{"t":"example","title":"Tutorial 1: Run the Report Wizard","steps":["Close any open objects. On the ribbon choose **Create tab › Reports group › Report Wizard**.","In **Tables/Queries** pick **Query: qryLowStock**. Click **>>** to move every field across. Click **Next**.","Grouping levels: add none for now (you will group on the next page). Click **Next**.","Sort order: choose **Description**, **Ascending**. Click **Next**.","Layout: **Tabular**, Orientation **Portrait**, keep **Adjust the field width so all fields fit on a page** ticked. Click **Next**.","Title: type **rptLowStock** (this becomes the object name). Choose **Preview the report** and click **Finish**.","The report opens in [[Print Preview]]. Click **Close Print Preview** to drop into Design view."],"answer":"rptLowStock appears under Reports in the Navigation Pane."},{"t":"example","title":"Tutorial 2: Tidy the report in Layout and Design view","steps":["**Home tab › View › Layout View**. Layout view shows real data while you resize columns: drag the right edge of the Description column until long names fit.","Double-click the title label (it says *rptLowStock*) and change it to **Riverside Bikes – Low stock reorder list**. The object name stays rptLowStock.","**Home tab › View › Design View**. In the **Report Footer** section, choose **Report Design tab › Controls › Text Box** and click in the footer. (In Access 2016/2019 the tab is just called **Design**.)","Click inside the new text box and type `=Count(*)`. Change its label to **Products to reorder:**.","Add a calculated column: in the Detail section add a text box to the right of ReorderLevel with Control Source `=[ReorderLevel]-[StockLevel]`, and a Page Header label **Short by**.","Press **Ctrl+S** to save, then **Home › View › Print Preview** to check."]},{"t":"p","text":"The four expressions below are typed into text boxes, in order: the count (Report Footer), the shortfall (Detail), and the date printed and page numbers that the wizard puts in the Page Footer. Type each one exactly, starting with =."},{"t":"code","lang":"excel","title":"Control Source expressions on rptLowStock","code":"=Count(*)\n=[ReorderLevel]-[StockLevel]\n=Now()\n=\"Page \" & [Page] & \" of \" & [Pages]"},{"t":"table","head":["Section","Prints","Use it for"],"rows":[["Report Header","Once, at the very start","Title, shop name, logo"],["Page Header","Top of every page","Column headings"],["Group Header","Before each group (next page)","The group's name, e.g. the category"],["Detail","Once per record","The fields of each product or order line"],["Group Footer","After each group","Subtotals such as `=Sum([LineTotal])`"],["Page Footer","Bottom of every page","Page numbers, date printed"],["Report Footer","Once, at the very end","Grand totals, counts"]],"caption":"Report sections in Design view"},{"t":"warn","text":"If an **Enter Parameter Value** box pops up when the report opens, a text box refers to a field name that is not in the record source (often a typo such as `[StockLvl]`, or a field renamed in the query after the wizard ran). Fix the Control Source or the query."},{"t":"tip","text":"Quick alternative: select qryLowStock in the Navigation Pane and click **Create › Report**. Access builds a tabular report in one click, which you then tidy in Layout view."},{"t":"key","title":"Check it works","items":["Open rptLowStock in Print Preview: only products with StockLevel at or below ReorderLevel appear (with the Chapter 2 sample data, three: D-lock, Brake pads (pair) and Multi-tool 15-in-1).","The footer count matches the number of rows. Change one StockLevel in tblProduct to 50, reopen the report and that product has gone."]}],"diagram":{"kind":"hotspot","title":"A report in Design view","caption":"Click each section to see what it prints and when.","rows":[[{"label":"Report Header","detail":"Prints once at the start of the report. Holds the title 'Riverside Bikes – Low stock reorder list'.","span":3}],[{"label":"Page Header","detail":"Prints at the top of every page: the column heading labels the wizard created.","span":3}],[{"label":"Detail","detail":"Repeats once for every record in the record source (qryLowStock): ProductID, Description, StockLevel, ReorderLevel, Short by.","span":3}],[{"label":"Page Footer","detail":"Bottom of every page: =Now() and =\"Page \" & [Page] & \" of \" & [Pages].","span":2},{"label":"Report Footer","detail":"Prints once at the very end: =Count(*) shows how many products need reordering. Aggregate functions belong here or in a group footer.","span":1}],[{"label":"Property Sheet (F4)","detail":"Shows the properties of whatever is selected: Control Source for a text box, Record Source for the whole report (click the grey square at the top left to select the report).","span":3}]],"links":[]},"check":[{"q":"Which section prints once for every record in the record source?","o":["Report Header","Page Header","Detail","Report Footer"],"a":2,"why":"The Detail section repeats for each record; headers and footers print once per report, page or group."},{"q":"You want a count of all listed products at the very end. Where does `=Count(*)` go?","o":["Report Footer","Page Footer","Detail","Page Header"],"a":0,"why":"Totals for the whole report go in the Report Footer. Aggregates in the Page Footer show #Error."},{"q":"An 'Enter Parameter Value' box appears when you open the report. The most likely cause is…","o":["the report has no Report Footer","a control refers to a field name that is not in the record source","Print Preview is not supported","the query has no criteria"],"a":1,"why":"Access asks for a value when it cannot find a name, so it treats the unknown name as a parameter."}],"exam":[],"practice":[{"q":"Create **rptCustomerList** from tblCustomer with the Report Wizard, sorted by Surname then FirstName, landscape, with a count of customers in the Report Footer.","m":4,"a":"1 Create › Report Wizard › Table: tblCustomer › >> all fields › Next. 2 No grouping › Next. 3 Sort 1: Surname Ascending; Sort 2: FirstName Ascending › Next. 4 Tabular, Landscape › Next. 5 Title rptCustomerList › Finish. 6 Design view: add a text box in the Report Footer with Control Source `=Count(*)` and label 'Customers:'. 7 Change the title label caption to 'Riverside Bikes – Customer list'. Save and preview: the count equals the number of rows in tblCustomer."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic reports","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-create-basic-reports"}],"terms":["Report","Report Wizard","Report section","Print Preview","Query"]},{"id":"c05-p02","spec":"Group and sort a report and add group totals","lessons":["AD04"],"summary":"Build rptSalesByCategory: order lines grouped by Category with a subtotal per category and a grand total.","blocks":[{"t":"p","text":"[[Grouping]] collects records with the same value (here the product Category) together, with a header before and a [[Group footer]] after each group. Totals in a group footer add up just that group; the same total in the Report Footer adds up everything."},{"t":"anim","scene":"query-filter","caption":"A report’s sorting and grouping work on the records its record source picks out."},{"t":"key","title":"You will need / By the end","items":["**You will need:** `qryOrderLines` from Chapter 3. It already has **Category**, **Description**, **Quantity**, **Price** and the calculated field **LineTotal** (`[Quantity]*[Price]`), plus OrderID, OrderDate and the customer's name.","**By the end:** `rptSalesByCategory` showing each category's lines, a category subtotal and a grand total, all formatted as currency."]},{"t":"example","title":"Tutorial 1: Start the report and add the grouping","steps":["**Create › Report Wizard**, Query: **qryOrderLines**. Move across Category, Description, Quantity, Price and LineTotal. **Next**.","If asked *How do you want to view your data?*, choose **by tblOrderLine** (or by the query) so each line is a detail row. **Next**.","Grouping levels: select **Category** and click **>**. **Next**.","Sort the detail records by **Description**. Click **Summary Options…**, tick **Sum** for LineTotal, choose **Detail and Summary**, tick **Calculate percent of total for sums** if you like, **OK**, **Next**.","Layout **Stepped**, Portrait › **Next** › title **rptSalesByCategory** › **Finish**."]},{"t":"example","title":"Tutorial 2: Build or check the group footer by hand","steps":["Open the report in **Design view**. Click **Report Design tab › Grouping & Totals › Group & Sort**. The *Group, Sort, and Total* pane opens at the bottom.","You should see **Group on Category** and **Sort by Description**. (If you built the report without the wizard, click **Add a group › Category**, then **Add a sort › Description**.)","On the *Group on Category* bar click **More ▸** and make sure it says **with a header section** and **with a footer section**.","In the new **Category Footer**, add a text box. Property Sheet (F4) › **Other** tab › Name: **txtCatTotal**; **Data** tab › Control Source: `=Sum([LineTotal])`; **Format** tab › Format: **Currency**. Label: **Category total:**","In the **Report Footer**, add a text box named **txtGrandTotal** with the same `=Sum([LineTotal])`, Format **Currency**, label **Grand total:**","Delete the long *Summary for 'Category' = …* text box the wizard adds if you find it cluttered. Save (Ctrl+S) and preview."]},{"t":"p","text":"The same expression gives different answers in different sections: in the Category Footer it adds one category; in the Report Footer it adds everything. Other useful footer totals are the items sold and the category's share of all sales (Format: Percent)."},{"t":"code","lang":"excel","title":"Footer expressions on rptSalesByCategory","code":"=Sum([LineTotal])\n=Sum([Quantity])\n=Sum([LineTotal])/[txtGrandTotal]"},{"t":"warn","text":"`=Sum()` only works on fields in the record source, not on other text boxes. `=Sum([txtLineTotal])` gives **#Error**; use `=Sum([LineTotal])` or `=Sum([Quantity]*[Price])`. Sums in the **Page Footer** also show #Error: put them in a group or report footer."},{"t":"tip","text":"Want a summary report with no detail rows? Click the **Detail** section bar, then Property Sheet › Format › **Visible: No**. Only the category headers and totals print."},{"t":"key","title":"Check it works","items":["Each category appears once, with its order lines under it and a subtotal after it.","Add up the category totals with a calculator: they must equal the grand total. With the Chapter 2 sample data: Accessories £58.99, Clothing £88.99, Parts £46.95, Tools £29.95, grand total £224.88 (the four order subtotals added together)."]}],"diagram":{"kind":"table-reveal","title":"rptSalesByCategory with the Chapter 2 order lines","caption":"Click the hidden cells to reveal each group total and the grand total. Work them out first.","head":["Category / line","Qty","Price","LineTotal"],"rows":[["Accessories","","",""],["  D-lock","1","£34.00","£34.00"],["  LED front light","1","£24.99","£24.99"],["  Category total","","","£58.99"],["Clothing","","",""],["  Cycling gloves","2","£14.50","£29.00"],["  Waterproof jacket","1","£59.99","£59.99"],["  Category total","","","£88.99"],["Parts","","",""],["  Brake pads (pair)","2","£8.50","£17.00"],["  Inner tube 700x25c","2","£5.99","£11.98"],["  Inner tube 700x25c","3","£5.99","£17.97"],["  Category total","","","£46.95"],["Tools","","",""],["  Track pump","1","£29.95","£29.95"],["  Category total","","","£29.95"],["Grand total","","","£224.88"]],"hidden":[[3,3],[7,3],[12,3],[15,3],[16,3]]},"check":[{"q":"Where must `=Sum([LineTotal])` go to show a subtotal for each category?","o":["Detail section","Page Footer","Category Footer","Page Header"],"a":2,"why":"A group footer prints after each group, and an aggregate there covers only that group's records."},{"q":"`=Sum([txtLineTotal])` shows #Error. Why?","o":["Sum cannot add currency","Sum works on record-source fields, not on other controls","The report needs a Page Footer","txtLineTotal must be in the Report Header"],"a":1,"why":"Aggregate functions add up fields or expressions of fields. Sum the field (LineTotal) or the expression ([Quantity]*[Price])."},{"q":"Which pane lets you add a group on Category after the report is built?","o":["Group, Sort, and Total pane","Navigation Pane","Relationships window","Field List"],"a":0,"why":"Report Design tab › Grouping & Totals › Group & Sort opens the Group, Sort, and Total pane."}],"exam":[],"practice":[{"q":"Add a column to the Category Footer of rptSalesByCategory showing that category's share of all sales as a percentage, and an items-sold count.","m":4,"a":"1 Make sure the Report Footer text box is named txtGrandTotal with `=Sum([LineTotal])`. 2 In the Category Footer add a text box, Control Source `=Sum([LineTotal])/[txtGrandTotal]`, Format **Percent**, Decimal Places 1, label 'Share of sales'. 3 Add another text box `=Sum([Quantity])`, label 'Items sold'. 4 Preview: Parts shows 20.9% (46.95 ÷ 224.88) and 7 items (2 + 2 + 3); the percentages add to 100%."},{"q":"Make a second version, **rptSalesSummary**, that shows only one line per category (no detail rows).","m":2,"a":"Right-click rptSalesByCategory › Copy, then Paste as rptSalesSummary. Open it in Design view, click the Detail section bar, Property Sheet › Format › Visible: No. Move the category name into the Category Footer beside the total (or keep the header). Preview: four lines plus the grand total."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic reports","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-create-basic-reports"}],"terms":["Grouping","Group footer","Report","Calculated field"]},{"id":"c05-p03","spec":"Build an order receipt report with subtotal, VAT and total","lessons":["AD04"],"summary":"Build rptOrderReceipt on qryOrderLines: one page per order with customer details, order lines, subtotal, VAT at 20% and total.","blocks":[{"t":"p","text":"A receipt needs data from four tables: the order, its customer, its order lines and each line's product. `qryOrderLines` from Chapter 3 already joins them, so the report is built on it and grouped on OrderID: each order gets its own header (customer details), lines, and footer (money)."},{"t":"key","title":"You will need / By the end","items":["**You will need:** `qryOrderLines` (Chapter 3) and the four sample orders from Chapter 2.","**By the end:** `rptOrderReceipt`, which shows every order on its own page with Subtotal, VAT (20%) and Total."]},{"t":"example","title":"Tutorial 1: Check the record source","steps":["Open **qryOrderLines** in Datasheet view: 8 rows, one per order line, with OrderID, OrderDate, Status, FirstName, Surname, ProductID, Description, Price, Quantity and LineTotal.","Optional: to print the customer's postcode on the receipt, open the query in Design view, double-click **Postcode** in the tblCustomer box to add it, and save. (Adding a field does not affect anything else built on the query.)","Close the query."]},{"t":"example","title":"Tutorial 2: Lay out rptOrderReceipt","steps":["**Create › Report Design**. Property Sheet (F4) › select **Report** › Data › Record Source: **qryOrderLines**.","**Report Design › Group & Sort › Add a group › OrderID**. Click **More ▸** › **with a footer section**.","**Report Design › Add Existing Fields** opens the Field List. Drag OrderID, OrderDate, FirstName and Surname (and Postcode if you added it) into the **OrderID Header**.","Drag ProductID, Description, Quantity, Price and LineTotal into the **Detail** section. Cut their labels (select, Ctrl+X), click the OrderID Header and paste (Ctrl+V) so the headings sit above the lines.","In the **OrderID Footer** add three text boxes, names and Control Sources as in the table below, all Format **Currency**.","Click the **OrderID Footer** bar › Property Sheet › Format › **Force New Page: After Section**, so each order starts a new page.","Add a label **Riverside Bikes – Receipt** at the top of the **OrderID Header** (not the Report Header, which prints only once, on the first page). Save as **rptOrderReceipt**."]},{"t":"table","head":["Name","Control Source","Shows (order 1)"],"rows":[["txtSubtotal","`=Sum([LineTotal])`","£36.97"],["txtVAT","`=Round([txtSubtotal]*0.2,2)`","£7.39"],["txtTotal","`=[txtSubtotal]+[txtVAT]`","£44.36"]],"caption":"Text boxes in the OrderID Footer"},{"t":"note","text":"`txtVAT` may refer to `txtSubtotal` because it is not an aggregate; it just reads another control. Round(…, 2) stops the VAT showing fractions of a penny, so the three figures always add up exactly."},{"t":"warn","text":"Don't name a text box the same as a field (for example a text box called **LineTotal** with Control Source `=[Quantity]*[Price]`): Access then shows **#Error** (circular reference). Give calculated controls a txt prefix."},{"t":"key","title":"Check it works","items":["Preview: order 1 (Aoife Maguire) shows 2 × Inner tube 700x25c £11.98 and 1 × LED front light £24.99; Subtotal £36.97, VAT £7.39, Total £44.36. The other orders total £106.79, £56.34 and £62.36, matching qryOrderTotals.","Each order begins on a new page. Next page you open just one order from frmOrder."]}],"diagram":{"kind":"calc","title":"Receipt totals","caption":"Enter a subtotal and VAT rate to see the total the receipt should show (VAT is rounded to the penny on the report).","inputs":[{"id":"s","label":"Subtotal (£)","value":36.97},{"id":"r","label":"VAT rate (%)","value":20}],"formula":"s + Math.floor(s*r + 0.5)/100","result":{"label":"Total including VAT","unit":"£"}},"check":[{"q":"Why is rptOrderReceipt grouped on OrderID?","o":["To sort the products alphabetically","So each order gets its own header, lines and totals footer","Because reports must always be grouped","To hide the customer's details"],"a":1,"why":"Grouping on OrderID gives a header (customer and date) and a footer (subtotal, VAT, total) for every order."},{"q":"Which setting makes every order start on a new page?","o":["Keep Together: Yes on the Detail section","Can Grow on txtTotal","Force New Page: After Section on the OrderID Footer","Running Sum: Over All"],"a":2,"why":"Force New Page is a Format property of a section; After Section breaks the page once that order's footer has printed."},{"q":"Subtotal £45.50. What does txtVAT show?","o":["£9.10","£4.55","£54.60","£9.00"],"a":0,"why":"45.50 × 0.2 = 9.10. The total would be £54.60."}],"exam":[],"practice":[{"q":"Add the number of items in the order (total quantity) and the order Status to rptOrderReceipt, and show 'PAID' in large red text only when Status is Paid.","m":4,"a":"1 OrderID Footer: text box `=Sum([Quantity])`, label 'Items:'. 2 Drag Status from the Field List into the OrderID Header. 3 Add a text box in the header with Control Source `=IIf([Status]=\"Paid\",\"PAID\",\"\")`, Font Size 20, Fore Color red. 4 Preview order 1 (Paid: shows PAID) and order 3 (Open: blank)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Report","Grouping","Group footer","Query"]},{"id":"c05-p04","spec":"Add running sums, line numbers and page numbers to a report","lessons":["AD04"],"summary":"Use the Running Sum property to number receipt lines and keep running totals, and add page numbers and the print date.","blocks":[{"t":"p","text":"A [[Running sum]] keeps adding as the report goes down the page: 1, 2, 3 for line numbers, or a running total of money. You do not write a loop; you set a text box's **Running Sum** property."},{"t":"key","title":"You will need / By the end","items":["**You will need:** rptOrderReceipt (previous page) and rptSalesByCategory.","**By the end:** numbered lines on each receipt that restart at 1 for every order, and a running total column on the sales report."]},{"t":"example","title":"Tutorial 1: Number the lines on each receipt","steps":["Open **rptOrderReceipt** in Design view. Make space at the left of the **Detail** section (select all detail controls and drag them right).","Add a text box at the left, delete its label, and name it **txtLineNo**.","Property Sheet › **Data** tab › Control Source: `=1`.","Still on the Data tab set **Running Sum: Over Group**.","Add a label **No.** above it in the OrderID Header. Save and preview: lines read 1, 2, 3 and restart at 1 on the next order."]},{"t":"example","title":"Tutorial 2: A running total on the sales report","steps":["Open **rptSalesByCategory** in Design view and add a text box in the Detail section to the right of LineTotal. Name it **txtRunCat**.","Control Source `=[LineTotal]`, Format **Currency**, **Running Sum: Over Group**. Label: **Category so far**.","Add a second text box **txtRunAll** with the same Control Source but **Running Sum: Over All**. Label: **All sales so far**.","Preview. txtRunCat restarts in each category; txtRunAll keeps climbing and its last value equals the grand total."]},{"t":"table","head":["Running Sum setting","What the text box shows","Typical use"],"rows":[["No (default)","Just this record's value","Normal fields"],["Over Group","Total so far within the current group; restarts each group","Line numbers on each receipt; category running total"],["Over All","Total so far through the whole report","Cumulative sales; numbering every line in the report"]]},{"t":"code","lang":"excel","title":"Useful footer expressions (the last one only in a group or report footer)","code":"=\"Page \" & [Page] & \" of \" & [Pages]\n=\"Printed \" & Format(Date(),\"dd/mm/yyyy\")\n=Count(*) & \" lines\""},{"t":"tip","text":"A running sum in the Report Footer is pointless: it prints once. Running sums belong in the Detail section (or in a group footer to number the groups)."},{"t":"warn","text":"Line numbers that never restart mean the property is **Over All** instead of **Over Group**. Numbers that are all 1 mean Running Sum is still **No**."},{"t":"key","title":"Check it works","items":["Receipt for order 1: lines numbered 1–2; order 2 starts at 1 again.","Sales report: the last *All sales so far* value equals the grand total (£224.88 with the sample data)."]}],"diagram":{"kind":"table-reveal","title":"Running sums down the Parts and Tools groups","caption":"Over Group restarts in each category; Over All never restarts. Reveal the hidden values after working them out (Accessories and Clothing, £147.98 between them, come first).","head":["Line","LineTotal","Category so far (Over Group)","All sales so far (Over All)"],"rows":[["Brake pads (pair)","£17.00","£17.00","£164.98"],["Inner tube 700x25c","£11.98","£28.98","£176.96"],["Inner tube 700x25c","£17.97","£46.95","£194.93"],["Track pump","£29.95","£29.95","£224.88"]],"hidden":[[1,2],[1,3],[2,2],[2,3],[3,2],[3,3]]},"check":[{"q":"A text box with Control Source `=1` and Running Sum **Over Group** shows…","o":["1 on every line","1, 2, 3… restarting for each group","the number of groups","1, 2, 3… never restarting"],"a":1,"why":"Each record adds 1 to the running total; Over Group resets it at the start of each group."},{"q":"Which expression gives 'Page 2 of 5'?","o":["=\"Page \" & [Page] & \" of \" & [Pages]","=Page(2,5)","=Count([Page])","=Sum([Pages])"],"a":0,"why":"[Page] is the current page number and [Pages] the total number of pages."},{"q":"Every receipt's line numbers carry on from the previous order (4, 5, 6…). What is wrong?","o":["Control Source should be =0","Running Sum is set to Over All","Force New Page is off","The report is not grouped"],"a":1,"why":"Over All never resets. Change it to Over Group so numbering restarts with each OrderID."}],"exam":[],"practice":[{"q":"On rptSalesByCategory number the categories 1, 2, 3, 4 in the Category Header, and show the number of lines in each category in its footer.","m":3,"a":"1 Category Header: text box txtCatNo, Control Source `=1`, Running Sum **Over All** (one record per group header, so it counts groups). 2 Category Footer: text box `=Count(*)`, label 'Lines:'. 3 Preview: categories numbered 1–4; Parts shows 3 lines."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Running sum","Report","Grouping"]},{"id":"c05-p05","spec":"Open a report for one record from a form using a WhereCondition","lessons":["AD04"],"summary":"Put a button on frmOrder that opens rptOrderReceipt for the order on screen, and a date-range button that filters rptSalesByCategory.","blocks":[{"t":"p","text":"rptOrderReceipt shows every order. Staff want the receipt for **this** order. `DoCmd.OpenReport` has a [[WhereCondition]] argument: a filter written like an SQL WHERE clause without the word WHERE, such as `OrderID = 4`."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmOrder (Chapter 4) and rptOrderReceipt. Content enabled (Trust Center) so [[VBA]] runs.","**By the end:** a **Receipt** button on frmOrder and a **Sales report** button on frmMenu that filters by two dates."]},{"t":"example","title":"Tutorial 1: Add the Receipt button to frmOrder","steps":["Open **frmOrder** in Design view. **Form Design tab › Controls**: make sure **Use Control Wizards** is *off* (Controls gallery › untick it), then draw a **Button** in the form header.","Property Sheet › **Other** › Name: **cmdReceipt**; **Format** › Caption: **Receipt**.","**Event** tab › **On Click** › click the **…** button › **Code Builder** › **OK**. The VBA editor opens inside `Private Sub cmdReceipt_Click()`.","Type the two lines of code below between `Private Sub` and `End Sub`. Press **Ctrl+S**, close the editor (Alt+Q).","Switch frmOrder to Form view, move to an order and click **Receipt**."]},{"t":"code","lang":"ps","title":"VBA: frmOrder module – cmdReceipt On Click","code":"Private Sub cmdReceipt_Click()\n    ' Save the order first so the report sees the latest data\n    If Me.Dirty Then Me.Dirty = False\n    ' Open the receipt filtered to the order on screen (OrderID is a number, so no quotes)\n    DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = \" & Me.OrderID\nEnd Sub"},{"t":"table","head":["Argument","Value here","Meaning"],"rows":[["ReportName","\"rptOrderReceipt\"","Report to open (in quotes)"],["View","acViewPreview","Print Preview. acViewNormal prints straight away; acViewReport opens Report view"],["FilterName","(left empty)","A saved query used as a filter; rarely used, but keep the comma"],["WhereCondition","\"OrderID = \" & Me.OrderID","Becomes `OrderID = 4`; only matching records are shown"]],"caption":"DoCmd.OpenReport arguments"},{"t":"example","title":"Tutorial 2: Sales report between two dates","steps":["Open **frmMenu** in Design view. Add two unbound text boxes named **txtFrom** and **txtTo**; set each one's **Format** to **Short Date** (this also gives a date picker). Labels: *From* and *To*.","Add a button **cmdSalesReport**, caption **Sales report**, and create its On Click event procedure as before.","Type the code below. It checks both dates are present, then builds the WhereCondition.","rptSalesByCategory is based on qryOrderLines, which includes **OrderDate**, so the filter can use it."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – cmdSalesReport On Click","code":"Private Sub cmdSalesReport_Click()\n    Dim strWhere As String\n    ' Presence check on both dates\n    If IsNull(Me.txtFrom) Or IsNull(Me.txtTo) Then\n        MsgBox \"Enter both a From and a To date.\", vbExclamation, \"Sales report\"\n        Exit Sub\n    End If\n    ' Dates in a WhereCondition must be written #mm/dd/yyyy# (US order)\n    strWhere = \"OrderDate Between \" & Format(Me.txtFrom, \"\\#mm\\/dd\\/yyyy\\#\") & _\n               \" And \" & Format(Me.txtTo, \"\\#mm\\/dd\\/yyyy\\#\")\n    DoCmd.OpenReport \"rptSalesByCategory\", acViewPreview, , strWhere\nEnd Sub","output":"strWhere = OrderDate Between #10/01/2026# And #10/31/2026#"},{"t":"warn","text":"Dates in a WhereCondition or SQL string are read as **month/day/year** whatever your Windows settings. 05/10/2026 typed as UK 5 October becomes 10 May if you just join the text in. Always use the `Format(…, \"\\#mm\\/dd\\/yyyy\\#\")` pattern."},{"t":"tip","text":"Text values need single quotes inside the WhereCondition, for example `\"Category = '\" & Me.cboCategory & \"'\"`. Numbers (OrderID) need none; dates need # marks."},{"t":"key","title":"Check it works","items":["On frmOrder, move to order 1 and click Receipt: one page, for order 1 only (£44.36). Move to order 2 and click again: a different receipt (£106.79).","On frmMenu enter 01/10/2026 and 14/10/2026: the sales report only includes orders 1 and 2 (grand total £125.96). Leave a date blank: you get the warning, not an error."]}],"diagram":{"kind":"flow","direction":"lr","title":"What happens when you click Receipt","caption":"Step through the event procedure from the click to the filtered report.","nodes":[{"id":"a","label":"Click Receipt","detail":"The On Click event of cmdReceipt fires and runs cmdReceipt_Click.","shape":"start"},{"id":"b","label":"Unsaved changes?","detail":"Me.Dirty is True if the order on screen has been edited but not saved.","shape":"decision"},{"id":"c","label":"Save record","detail":"Me.Dirty = False saves it, so the report reads the latest data.","shape":"process"},{"id":"d","label":"Build WhereCondition","detail":"\"OrderID = \" & Me.OrderID gives the text OrderID = 1.","shape":"process"},{"id":"e","label":"OpenReport","detail":"DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = 1\"","shape":"process"},{"id":"f","label":"Filtered preview","detail":"The report's query runs with the filter: only order 1's lines and totals appear.","shape":"end"}],"edges":[["a","b"],["b","c","yes"],["b","d","no"],["c","d"],["d","e"],["e","f"]]},"check":[{"q":"Which line opens the receipt for the order on screen?","o":["DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, \"OrderID = \" & Me.OrderID","DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = \" & Me.OrderID","DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = Me.OrderID\"","DoCmd.OpenForm \"rptOrderReceipt\", , , \"OrderID = \" & Me.OrderID"],"a":1,"why":"The WhereCondition is the 4th argument (keep the empty FilterName comma) and Me.OrderID must be outside the quotes so its value is joined in."},{"q":"Why does the code start with `If Me.Dirty Then Me.Dirty = False`?","o":["To clear the form","To save the current order before the report reads it","To close the form","To stop the report printing"],"a":1,"why":"An unsaved order (or a brand-new one) is not in the table yet, so the report would miss it."},{"q":"A pupil writes `\"OrderDate >= #\" & Me.txtFrom & \"#\"` and enters 05/10/2026. What date does the filter use?","o":["5 October 2026","10 May 2026","An error always","Today's date"],"a":1,"why":"Access reads # dates in US order, so 05/10/2026 is 10 May. Format the date as #mm/dd/yyyy# first."}],"exam":[],"practice":[{"q":"On frmCustomer add a button **cmdCustomerOrders** that opens a report **rptCustomerOrders** (based on qryOrderLines) showing only the current customer's orders.","m":4,"a":"1 Build rptCustomerOrders from qryOrderLines (which already includes CustomerID) with the wizard, grouped on OrderID. 2 On frmCustomer add button cmdCustomerOrders, On Click [Event Procedure]:\n```\nPrivate Sub cmdCustomerOrders_Click()\n    If Me.Dirty Then Me.Dirty = False\n    ' CustomerID is a number, so no quotes are needed\n    DoCmd.OpenReport \"rptCustomerOrders\", acViewPreview, , \"CustomerID = \" & Me.CustomerID\nEnd Sub\n```\n3 Test with Aoife Maguire (orders 1 and 4 shown) and Niamh Corrigan (no orders: blank report)."},{"q":"Add a combo box **cboCategory** to frmMenu and change cmdSalesReport so that, if a category is chosen, the report is also filtered to that category.","m":3,"a":"Add after the date line:\n```\n    ' Text criteria need single quotes round the value\n    If Not IsNull(Me.cboCategory) Then\n        strWhere = strWhere & \" And Category = '\" & Me.cboCategory & \"'\"\n    End If\n```\nRow Source of cboCategory: Value List \"Parts\";\"Accessories\";\"Clothing\";\"Tools\". Test with and without a category chosen."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["WhereCondition","Report","VBA","DoCmd","Event procedure"]},{"id":"c05-p06","spec":"Preview, set up, print and export a report to PDF","lessons":["AD04"],"summary":"Fix page size and margins, avoid blank pages, print, and save reports as PDF by hand and with DoCmd.OutputTo.","blocks":[{"t":"p","text":"Before anything is printed, check it in Print Preview: orientation, margins, blank pages and controls that cut text off. Reports are often emailed, so you also export them as PDF files, either from the ribbon or with one line of VBA."},{"t":"key","title":"You will need / By the end","items":["**You will need:** rptLowStock, rptOrderReceipt and rptSalesByCategory.","**By the end:** reports that fit A4 with no blank pages, a PDF of the low-stock list, and an **Export PDF** button on frmMenu."]},{"t":"example","title":"Tutorial 1: Page setup in Print Preview","steps":["Open rptSalesByCategory in **Print Preview** (right-click it › Print Preview).","**Print Preview tab › Page Layout**: choose **Portrait** or **Landscape**. **Page Size › Margins › Normal**.","Use **Zoom › Two Pages** to see whether pages alternate with blank ones.","If text is cut off (e.g. long descriptions), close the preview, go to Design view, select the text box and set **Can Grow: Yes** (Format tab) or widen it.","To keep a group's lines on one page: Group & Sort pane › More ▸ › **keep whole group together on one page**."]},{"t":"example","title":"Tutorial 2: Export to PDF from the ribbon","steps":["Open rptLowStock in Print Preview.","**Print Preview tab › Data group › PDF or XPS**. (Or close the preview, select the report in the Navigation Pane and use **External Data tab › Export › PDF or XPS**.)","Choose a folder, file name **LowStock.pdf**, Save as type **PDF**, tick **Open file after publishing**, click **Publish**.","Click **Close** on the *Save Export Steps* dialog (or tick it to save the steps for next time)."]},{"t":"example","title":"Tutorial 3: An Export PDF button","steps":["Open **frmMenu** in Design view and add a button **cmdLowStockPDF**, caption **Low stock PDF**.","Property Sheet › Event › On Click › … › Code Builder, and type the code below.","Save, switch to Form view and click the button. The PDF is saved next to the database file and opens."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – cmdLowStockPDF On Click","code":"Private Sub cmdLowStockPDF_Click()\n    Dim strFile As String\n    ' Save in the same folder as the database, with today's date in the name\n    strFile = CurrentProject.Path & \"\\LowStock_\" & Format(Date, \"yyyy-mm-dd\") & \".pdf\"\n    ' acFormatPDF = PDF; True = open the file afterwards\n    DoCmd.OutputTo acOutputReport, \"rptLowStock\", acFormatPDF, strFile, True\n    MsgBox \"Saved as \" & strFile, vbInformation, \"Low stock PDF\"\nEnd Sub","output":"Saved as C:\\RiversideBikes\\LowStock_2026-10-29.pdf"},{"t":"warn","text":"Blank pages every other page? The report is wider than the paper. Report width + left margin + right margin must be no more than the paper width (A4 portrait 21 cm). Drag the report's right edge in Design view back in; Access warns *The section width is greater than the page width*."},{"t":"tip","text":"Use `yyyy-mm-dd` in file names: the files then sort into date order in File Explorer, and Windows does not allow / in file names."},{"t":"key","title":"Check it works","items":["Two Pages zoom shows no blank pages.","Clicking Low stock PDF saves a file named with today's date in the database folder and opens it; the PDF matches the preview."]}],"diagram":{"kind":"calc","title":"Will the report fit the paper?","caption":"Space left across the page. If the result is negative you will get blank pages.","inputs":[{"id":"p","label":"Paper width (cm) – A4 portrait 21, landscape 29.7","value":21},{"id":"w","label":"Report width in Design view (cm)","value":19.5},{"id":"l","label":"Left margin (cm)","value":0.635},{"id":"r","label":"Right margin (cm)","value":0.635}],"formula":"p - w - l - r","result":{"label":"Space left","unit":"cm"}},"check":[{"q":"Reports print with a blank page after every page. The most likely fix is…","o":["Set Can Grow to Yes","Reduce the report width so width plus margins fits the paper","Turn on Running Sum","Use acViewNormal"],"a":1,"why":"Anything wider than the printable area spills onto an extra page."},{"q":"Which statement saves rptLowStock as a PDF?","o":["DoCmd.OpenReport \"rptLowStock\", acFormatPDF","DoCmd.PrintOut acFormatPDF","DoCmd.TransferText acFormatPDF, \"rptLowStock\"","DoCmd.OutputTo acOutputReport, \"rptLowStock\", acFormatPDF, strFile"],"a":3,"why":"OutputTo takes the object type, object name, output format and file name."},{"q":"A long Description is cut off
