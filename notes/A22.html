vbBinaryCompare) = 0)\n    End If\n\n    If blnOK Then\n        ' Remember who logged in, for frmMenu and later forms\n        TempVars.RemoveAll\n        TempVars.Add \"Username\", strUser\n        TempVars.Add \"AccessLevel\", Nz(DLookup(\"AccessLevel\", \"tblStaff\", strCriteria), \"Staff\")\n        DoCmd.OpenForm \"frmMenu\"\n        DoCmd.Close acForm, Me.Name\n    Else\n        intAttempts = intAttempts + 1\n        If intAttempts >= 3 Then\n            MsgBox \"Three failed attempts. Riverside Bikes will now close.\", vbCritical, \"Log in\"\n            DoCmd.Quit\n        Else\n            MsgBox \"Username or password not recognised. \" & (3 - intAttempts) & _\n                   \" attempt(s) left.\", vbExclamation, \"Log in\"\n            Me.txtPassword = Null\n            Me.txtPassword.SetFocus\n        End If\n    End If\nEnd Sub\n\nPrivate Sub cmdCancel_Click()\n    DoCmd.Quit\nEnd Sub"},{"t":"example","title":"Tutorial 2: Make frmMenu respond to the access level, and start on frmLogin","steps":["Open frmMenu's module and add the two procedures below (if Form_Load already exists, merge the lines into it).","**File › Options › Current Database › Display Form**: change frmMenu (set in Chapter 4) to **frmLogin**. Click OK, close and reopen the database.","Hold **Shift** while opening the database to bypass the start-up form when you need to do design work."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – Form_Open and Form_Load","code":"' Refuse to open the menu if nobody has logged in\nPrivate Sub Form_Open(Cancel As Integer)\n    If IsNull(TempVars!AccessLevel) Then\n        Cancel = True\n        DoCmd.OpenForm \"frmLogin\"\n    End If\nEnd Sub\n\nPrivate Sub Form_Load()\n    Dim blnAdmin As Boolean\n    blnAdmin = (TempVars!AccessLevel = \"Admin\")\n    Me.lblWelcome.Caption = \"Logged in as \" & TempVars!Username & \" (\" & TempVars!AccessLevel & \")\"\n    ' Admin-only buttons\n    Me.cmdStaff.Enabled = blnAdmin\n    Me.cmdPriceChange.Enabled = blnAdmin\nEnd Sub"},{"t":"warn","text":"Passwords stored as plain text in a table can be read by anyone who opens tblStaff. That is acceptable for this project, but say so: a real system stores a *hash* of each password and hides the tables. Hide the Navigation Pane (Chapter 4) so staff cannot simply open tblStaff."},{"t":"tip","text":"If **Default: Yes** is set on cmdLogin, pressing Enter in the password box logs in. If nothing happens when you click, check the On Click property still says [Event Procedure] (renaming a button detaches its code)."},{"t":"key","title":"Check it works","items":["admin / Bikes#2026 → menu opens, *Logged in as admin (Admin)*, all buttons enabled.","shop1 / Pedal#77 → cmdStaff and cmdPriceChange greyed out.","admin / bikes#2026 (wrong case) → *2 attempt(s) left*; three failures → message then Access closes. Blank boxes → presence message, no attempt counted."]}],"diagram":{"kind":"flow","direction":"tb","title":"Login logic","caption":"Step through cmdLogin_Click.","nodes":[{"id":"a","label":"Click Log in","detail":"cmdLogin_Click runs (or Enter, because Default = Yes).","shape":"start"},{"id":"b","label":"Both boxes filled?","detail":"Presence check with Len(Nz(…, \"\")) = 0.","shape":"decision"},{"id":"c","label":"Message: enter details","detail":"Exit Sub; no attempt counted.","shape":"end"},{"id":"d","label":"DLookup password","detail":"DLookup(\"Password\", \"tblStaff\", \"Username = 'admin'\") returns the stored password or Null.","shape":"store"},{"id":"e","label":"Password matches?","detail":"StrComp(…, vbBinaryCompare) = 0, so the case must match too.","shape":"decision"},{"id":"f","label":"Store TempVars","detail":"TempVars.Add \"Username\" and \"AccessLevel\" (Admin or Staff).","shape":"process"},{"id":"g","label":"Open frmMenu, close login","detail":"frmMenu's Form_Load enables or disables admin buttons.","shape":"end"},{"id":"h","label":"intAttempts + 1","detail":"Module-level variable keeps its value between clicks.","shape":"process"},{"id":"i","label":"Attempts >= 3?","detail":"Third failure?","shape":"decision"},{"id":"j","label":"Quit Access","detail":"vbCritical message, then DoCmd.Quit.","shape":"end"},{"id":"k","label":"Clear password, try again","detail":"Message shows attempts left; focus back to txtPassword.","shape":"io"}],"edges":[["a","b"],["b","c","no"],["b","d","yes"],["d","e"],["e","f","yes"],["f","g"],["e","h","no"],["h","i"],["i","j","yes"],["i","k","no"]]},"check":[{"q":"Why is intAttempts declared at the top of the module, not inside cmdLogin_Click?","o":["So it can be a String","So it keeps its value between clicks","Because Option Explicit requires it","So frmMenu can read it"],"a":1,"why":"A variable declared inside a procedure is reset every time the procedure runs; a module-level variable lasts while the form is open."},{"q":"What does DLookup return if the username is not in tblStaff?","o":["0","An empty string","An error","Null"],"a":3,"why":"DLookup returns Null when no record matches, which the code treats as a failed login."},{"q":"Which property makes txtPassword show asterisks?","o":["Format: Password","Input Mask: Password","Validation Rule: Password","Locked: Yes"],"a":1,"why":"The Password input mask displays * for each character typed."}],"exam":[],"practice":[{"q":"Add a **Log out** button to frmMenu that clears the stored login and returns to frmLogin.","m":2,"a":"```\nPrivate Sub cmdLogout_Click()\n    TempVars.RemoveAll                 ' forget who was logged in\n    DoCmd.OpenForm \"frmLogin\"\n    DoCmd.Close acForm, Me.Name\nEnd Sub\n```\nTest: log in as admin, log out, log in as shop1: admin buttons now disabled. (The attempt counter starts again at 0 because frmLogin was reopened.)"},{"q":"Make the login accept usernames typed with spaces at either end (e.g. ' admin') by trimming them, and record the date and time of each successful login in a new table tblLoginLog (LogID AutoNumber, Username Short Text 20, LoginTime Date/Time).","m":3,"a":"1 Create tblLoginLog. 2 Change `strUser = Me.txtUsername` to `strUser = Trim(Me.txtUsername)`. 3 Inside `If blnOK Then`, before opening the menu, add:\n```\n        CurrentDb.Execute \"INSERT INTO tblLoginLog (Username, LoginTime) VALUES ('\" & _\n            Replace(strUser, \"'\", \"''\") & \"', Now())\", dbFailOnError\n```\nTest: log in twice; tblLoginLog has two rows with the right times."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["TempVars","DLookup","Unbound control","Input mask","Variable"]},{"id":"c07-p02","spec":"Update stock levels automatically when an order line is saved","lessons":["AD04"],"summary":"Check there is enough stock before an order line is saved, then take the quantity off StockLevel (and put it back if the line is edited).","blocks":[{"t":"p","text":"When a line is added to an order, the shop has fewer of that product. The subform's form-level **Before Update** event checks there is enough stock (and can cancel the save); its **After Update** event runs an UPDATE on tblProduct. If a line is edited, the old quantity is put back first."},{"t":"anim","scene":"stock-update","caption":"Before Update checks the stock; After Update takes the quantity off."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmOrder with the subform **sfrmOrderLine** (controls **cboProduct** bound to ProductID and **txtQuantity** bound to Quantity) from Chapter 4, and the ShowProductInfo procedure from Chapter 6.","**By the end:** saving a line for 2 LED front lights (P0003) takes StockLevel from 12 to 10; asking for more than are in stock is refused with a message."]},{"t":"example","title":"Tutorial: Add the stock code to the subform","steps":["Open **sfrmOrderLine** in Design view (open it on its own from the Navigation Pane, not inside frmOrder).","Click the form selector (grey square, top left) › Event tab › **Before Update** › … › Code Builder. Then do the same for **After Update**.","Type the module-level variables at the top (under Option Explicit) and the two procedures below. Keep ShowProductInfo from Chapter 6.","Debug › Compile, save, close, and test through **frmOrder**."]},{"t":"code","lang":"ps","title":"VBA: sfrmOrderLine module – stock check and stock update","code":"' Module-level: remembered between BeforeUpdate and AfterUpdate\nPrivate mblnNew As Boolean\nPrivate mstrOldProduct As String\nPrivate mintOldQty As Integer\n\nPrivate Sub Form_BeforeUpdate(Cancel As Integer)\n    Dim intAvailable As Integer\n\n    ' Presence and range checks\n    If IsNull(Me.cboProduct) Then\n        MsgBox \"Choose a product.\", vbExclamation, \"Order line\"\n        Cancel = True\n        Me.cboProduct.SetFocus\n        Exit Sub\n    End If\n    If Nz(Me.txtQuantity, 0) < 1 Then\n        MsgBox \"Quantity must be at least 1.\", vbExclamation, \"Order line\"\n        Cancel = True\n        Me.txtQuantity.SetFocus\n        Exit Sub\n    End If\n\n    ' Remember what this line was before the edit (Null on a new line)\n    mblnNew = Me.NewRecord\n    mstrOldProduct = Nz(Me.cboProduct.OldValue, \"\")\n    mintOldQty = Nz(Me.txtQuantity.OldValue, 0)\n\n    ' Stock available = current stock, plus what this line already took if same product\n    intAvailable = Nz(DLookup(\"StockLevel\", \"tblProduct\", \"ProductID = '\" & Me.cboProduct & \"'\"), 0)\n    If Not mblnNew And mstrOldProduct = Me.cboProduct Then\n        intAvailable = intAvailable + mintOldQty\n    End If\n\n    If Me.txtQuantity > intAvailable Then\n        MsgBox \"Only \" & intAvailable & \" in stock.\", vbExclamation, \"Not enough stock\"\n        Cancel = True\n        Me.txtQuantity.SetFocus\n    End If\nEnd Sub\n\nPrivate Sub Form_AfterUpdate()\n    Dim db As DAO.Database\n    Set db = CurrentDb\n    ' 1 Edited line: give back the stock the old version took\n    If Not mblnNew And mstrOldProduct <> \"\" Then\n        db.Execute \"UPDATE tblProduct SET StockLevel = StockLevel + \" & mintOldQty & _\n                   \" WHERE ProductID = '\" & mstrOldProduct & \"'\", dbFailOnError\n    End If\n    ' 2 Take the new quantity out of stock\n    db.Execute \"UPDATE tblProduct SET StockLevel = StockLevel - \" & Me.txtQuantity & _\n               \" WHERE ProductID = '\" & Me.cboProduct & \"'\", dbFailOnError\n    Set db = Nothing\n    ShowProductInfo          ' footer now shows the new stock figure\nEnd Sub"},{"t":"table","head":["Event (subform)","Fires","Job here"],"rows":[["Form Before Update","Just before the line is saved","Validate; check stock; Cancel = True stops the save"],["Form After Update","Just after the line is saved (new or edited)","UPDATE tblProduct"],["`.OldValue`","Readable in Before Update","The value before this edit; Null on a new line"]]},{"t":"warn","text":"Read `.OldValue` in **Before Update**. By After Update the record is saved and OldValue already equals the new value, so an edit from 2 to 5 would look like 5 to 5 and the stock would be wrong."},{"t":"note","text":"Another design, promised in Chapter 3: leave stock alone while the order is built and add a **Confirm order** button on frmOrder that checks every line and then subtracts the quantities once (see the second Try it yourself task). Use **one** design or the other, never both, or stock is taken off twice."},{"t":"tip","text":"Don't try `CurrentDb.Execute \"qryUpdateStock\"`: it is a parameter query, so Execute fails with *run-time error 3061: Too few parameters. Expected 1*. Build the SQL string yourself, with the value joined in, as this code does."},{"t":"key","title":"Check it works","items":["Note LED front light's StockLevel in tblProduct (12). On a new order add a line: P0003 × 2 → 10.","Edit that line to 5 → 7 (back 2, out 5). Change the product to P0001 → P0003 back to 12, Inner tube 700x25c down by 5 (40 → 35).","Try a quantity of 999 → *Only … in stock*, and the line is not saved. Quantity 0 → refused."]}],"diagram":{"kind":"table-reveal","title":"StockLevel of LED front light (P0003) as lines are saved","caption":"Work out the stock after each action, then reveal.","head":["Action on the order line","Check in Before Update","StockLevel after"],"rows":[["Start","–","12"],["New line: P0003 × 2","2 <= 12, allowed","10"],["Edit quantity 2 → 5","available 10 + 2 = 12; 5 <= 12, allowed","7"],["Edit quantity 5 → 15","available 7 + 5 = 12; 15 > 12, cancelled","7"],["New line on another order: P0003 × 7","7 <= 7, allowed","0"]],"hidden":[[1,2],[2,2],[3,1],[3,2],[4,2]]},"check":[{"q":"Which event can stop an order line being saved when there is not enough stock?","o":["Form After Update","Form Before Update","On Current","On Load"],"a":1,"why":"Before Update has a Cancel argument; Cancel = True stops the save."},{"q":"A line is edited from 3 to 4 of the same product. What should happen to StockLevel?","o":["Down 4","Down 7","Down 1 overall (up 3, then down 4)","No change"],"a":2,"why":"The code puts back the old 3, then takes off the new 4: a net change of −1."},{"q":"Why are mstrOldProduct and mintOldQty declared at module level?","o":["So they keep their values from Before Update into After Update","So they can be used in queries","Because DAO requires it","To make them case-sensitive"],"a":0,"why":"Variables declared inside a procedure vanish when it ends; module-level ones are still there when After Update runs."}],"exam":[],"practice":[{"q":"Return the stock when an order line is **deleted** from the subform.","m":4,"a":"Capture the line in the Delete event (it fires for each record before the confirmation), then update after the user confirms:\n```\nPrivate mstrDelProduct As String\nPrivate mintDelQty As Integer\n\nPrivate Sub Form_Delete(Cancel As Integer)\n    mstrDelProduct = Nz(Me.cboProduct, \"\")\n    mintDelQty = Nz(Me.txtQuantity, 0)\nEnd Sub\n\nPrivate Sub Form_AfterDelConfirm(Status As Integer)\n    ' Only if the delete really happened\n    If Status = acDeleteOK And mstrDelProduct <> \"\" Then\n        CurrentDb.Execute \"UPDATE tblProduct SET StockLevel = StockLevel + \" & mintDelQty & _\n                          \" WHERE ProductID = '\" & mstrDelProduct & \"'\", dbFailOnError\n    End If\nEnd Sub\n```\n(Deletes one line at a time; for multi-row deletes you would store a list.) Test: delete a line of 2 LED front lights: StockLevel rises by 2. Click No at the confirmation: no change."},{"q":"Instead of the subform events, write the **Confirm order** button (cmdConfirm on frmOrder) that Chapter 3 promised: it works only on an Open order, refuses if any product is short, otherwise takes every line off stock once and sets Status to Paid.","m":5,"a":"Remove (or don't add) the subform's Form_AfterUpdate stock code first. Then in frmOrder:\n```\nPrivate Sub cmdConfirm_Click()\nOn Error GoTo Err_Handler\n    Dim db As DAO.Database\n    Dim rs As DAO.Recordset\n    Dim strShort As String\n    If Me.Dirty Then Me.Dirty = False\n    If IsNull(Me.OrderID) Then Exit Sub\n    If Me.cboStatus <> \"Open\" Then\n        MsgBox \"Only Open orders can be confirmed.\", vbExclamation, \"Confirm order\"\n        Exit Sub\n    End If\n    If DCount(\"*\", \"tblOrderLine\", \"OrderID = \" & Me.OrderID) = 0 Then\n        MsgBox \"This order has no lines.\", vbExclamation, \"Confirm order\"\n        Exit Sub\n    End If\n    Set db = CurrentDb\n    ' One row per product, in case a product is on two lines\n    Set rs = db.OpenRecordset(\"SELECT tblOrderLine.ProductID, Sum(tblOrderLine.Quantity) AS Qty, tblProduct.StockLevel \" & _\n        \"FROM tblOrderLine INNER JOIN tblProduct ON tblOrderLine.ProductID = tblProduct.ProductID \" & _\n        \"WHERE tblOrderLine.OrderID = \" & Me.OrderID & \" GROUP BY tblOrderLine.ProductID, tblProduct.StockLevel\", dbOpenSnapshot)\n    ' 1 Check every product first\n    Do While Not rs.EOF\n        If rs!Qty > rs!StockLevel Then\n            strShort = strShort & rs!ProductID & \": need \" & rs!Qty & \", have \" & rs!StockLevel & vbCrLf\n        End If\n        rs.MoveNext\n    Loop\n    If strShort <> \"\" Then\n        MsgBox \"Not enough stock:\" & vbCrLf & strShort, vbExclamation, \"Confirm order\"\n        GoTo Exit_Here\n    End If\n    ' 2 Take everything off stock (own SQL, not the parameter query)\n    rs.MoveFirst\n    Do While Not rs.EOF\n        db.Execute \"UPDATE tblProduct SET StockLevel = StockLevel - \" & rs!Qty & _\n                   \" WHERE ProductID = '\" & rs!ProductID & \"'\", dbFailOnError\n        rs.MoveNext\n    Loop\n    Me.cboStatus = \"Paid\"           ' so it cannot be confirmed twice\n    Me.Dirty = False\n    MsgBox \"Order confirmed and stock updated.\", vbInformation, \"Confirm order\"\nExit_Here:\n    On Error Resume Next\n    If Not rs Is Nothing Then rs.Close\n    Set rs = Nothing\n    Set db = Nothing\n    Exit Sub\nErr_Handler:\n    MsgBox \"Stock was not updated.\" & vbCrLf & Err.Description, vbExclamation, \"Confirm order\"\n    Resume Exit_Here\nEnd Sub\n```\nTest on order 3 (Open): Track pump 9 → 8 and Brake pads 4 → 2, Status Paid; clicking again is refused. Set a line's quantity above the stock on another Open order: the shortage message appears and nothing changes. Restore your backup afterwards."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Event procedure","DLookup","Subform","Update query","Validation rule","Parameter query"]},{"id":"c07-p03","spec":"Calculate and display order totals with VAT on the order form","lessons":["AD04"],"summary":"Write ShowTotals on frmOrder to work out subtotal, VAT and total with DSum over qryOrderLines, and keep them up to date as lines change.","blocks":[{"t":"p","text":"The order form needs Subtotal, VAT and Total that are right the moment a line is added, edited or deleted. One procedure on frmOrder uses [[DSum]] over qryOrderLines for the order on screen; the subform calls it whenever a line changes. Totals are calculated, never stored, so they cannot go out of date."},{"t":"key","title":"You will need / By the end","items":["**You will need:** `qryOrderLines` with **OrderID** and **LineTotal** (`[Quantity]*[Price]`); frmOrder with sfrmOrderLine, and its Status combo box named **cboStatus**.","**By the end:** txtOrderSubtotal, txtOrderVAT and txtOrderTotal on frmOrder filled by VBA and always agreeing with the lines, and a **Take payment** button. (Chapter 4's calculated controls also work; this page shows the VBA way, which you need when code must use the total.)"]},{"t":"example","title":"Tutorial 1: The totals boxes and ShowTotals","steps":["Open **frmOrder** in Design view. In Chapter 4 **txtOrderSubtotal**, **txtOrderVAT** and **txtOrderTotal** were calculated controls reading the subform footer. Select each one and **delete its Control Source** so it becomes unbound (VBA will fill it). Keep Format **Currency**; set **Locked Yes** and **Tab Stop No**.","View Code and add `ShowTotals` and `Form_Current` below (if Form_Current exists, add the `ShowTotals` line to it).","Note **Public** on ShowTotals: that lets the subform call it."]},{"t":"code","lang":"ps","title":"VBA: frmOrder module – ShowTotals and Form_Current","code":"' Works out the money for the order on screen. Public so the subform can call it.\nPublic Sub ShowTotals()\n    Dim curSub As Currency\n    Dim curVAT As Currency\n\n    If IsNull(Me.OrderID) Then\n        curSub = 0                                   ' new order: no lines yet\n    Else\n        curSub = Nz(DSum(\"LineTotal\", \"qryOrderLines\", \"OrderID = \" & Me.OrderID), 0)\n    End If\n    curVAT = Round(curSub * 0.2, 2)                  ' VAT at 20%, to the penny\n\n    Me.txtOrderSubtotal = curSub\n    Me.txtOrderVAT = curVAT\n    Me.txtOrderTotal = curSub + curVAT\nEnd Sub\n\nPrivate Sub Form_Current()\n    ShowTotals\nEnd Sub"},{"t":"example","title":"Tutorial 2: Recalculate when lines change","steps":["Open the **sfrmOrderLine** module. At the end of `Form_AfterUpdate` (previous page), add the line `Me.Parent.ShowTotals`.","Select the subform › Event › **After Del Confirm** › Code Builder and add the procedure below (combine it with the stock code if you did that practice task).","On frmOrder add a button **cmdTakePayment** (caption *Take payment*) with the code below."]},{"t":"code","lang":"ps","title":"VBA: sfrmOrderLine module (additions) and frmOrder cmdTakePayment","code":"' ---- sfrmOrderLine: last line of Form_AfterUpdate ----\n    Me.Parent.ShowTotals          ' tell the main form to recalculate\n\n' ---- sfrmOrderLine: after a line is deleted ----\nPrivate Sub Form_AfterDelConfirm(Status As Integer)\n    If Status = acDeleteOK Then Me.Parent.ShowTotals\nEnd Sub\n\n' ---- frmOrder module ----\nPrivate Sub cmdTakePayment_Click()\n    If Me.Dirty Then Me.Dirty = False\n    ShowTotals\n    If Nz(Me.txtOrderTotal, 0) = 0 Then\n        MsgBox \"This order has no lines yet.\", vbExclamation, \"Take payment\"\n        Exit Sub\n    End If\n    If MsgBox(\"Take payment of \" & Format(Me.txtOrderTotal, \"Currency\") & \"?\", _\n              vbYesNo + vbQuestion, \"Take payment\") = vbYes Then\n        Me.cboStatus = \"Paid\"\n        Me.Dirty = False                             ' save the new status\n    End If\nEnd Sub"},{"t":"table","head":["Method","How","Good for"],"rows":[["Calculated controls (Chapter 4)","Subform footer `=Sum([Quantity]*[Price])`; main form `=Nz([sfrmOrderLine].[Form]![txtSubtotal],0)`","No code; updates by itself"],["DSum in VBA (this page)","`DSum(\"LineTotal\", \"qryOrderLines\", \"OrderID = \" & Me.OrderID)`","Using the total in code: payment messages, checks, reports"],["`Format(x, \"Currency\")`","Turns 44.36 into the text £44.36","Messages and labels. Don't store the result: it is text"]]},{"t":"warn","text":"`Me.Parent` only works when sfrmOrderLine is open *inside* frmOrder. Opened on its own, the subform gives *run-time error 2452: The expression you entered has an invalid reference to the Parent property*. Always test subform code through the main form."},{"t":"key","title":"Check it works","items":["Order 1: Subtotal £36.97, VAT £7.39, Total £44.36. Orders 2–4: £106.79, £56.34, £62.36 (the same as qryOrderTotals).","On order 1 add 1 × Chain lube 100ml (£6.49): £43.46 / £8.69 / £52.15 at once. Delete it: back to £44.36.","Take payment on order 3 (Open) asks *Take payment of £56.34?*; Yes sets Status to Paid."]}],"diagram":{"kind":"calc","title":"Order total with VAT","caption":"Type up to three line totals to see what txtOrderTotal should show (VAT rounded to the penny). Starts with order 1.","inputs":[{"id":"a","label":"Line 1 (£)","value":11.98},{"id":"b","label":"Line 2 (£)","value":24.99},{"id":"c","label":"Line 3 (£)","value":0}],"formula":"(a+b+c) + Math.floor((a+b+c)*20 + 0.5)/100","result":{"label":"Total including VAT","unit":"£"}},"check":[{"q":"Why is ShowTotals declared Public?","o":["So queries can use it","So the subform can call it with Me.Parent.ShowTotals","Because it returns a value","So it runs on load"],"a":1,"why":"Private procedures can only be called from their own module."},{"q":"What does DSum return for a new order with no lines, and how is it handled?","o":["0, nothing needed","Null, so it is wrapped in Nz(…, 0)","An error, so On Error is needed","An empty string"],"a":1,"why":"DSum returns Null when no records match."},{"q":"Subtotal £79.98. What is the total?","o":["£95.98","£95.97","£96.00","£79.98"],"a":0,"why":"VAT = Round(15.996, 2) = £16.00; 79.98 + 16.00 = £95.98."}],"exam":[],"practice":[{"q":"Show the number of items on the order in a box **txtItems** next to the totals, updated by ShowTotals.","m":2,"a":"Add an unbound, locked text box txtItems. In ShowTotals add:\n```\n    If IsNull(Me.OrderID) Then\n        Me.txtItems = 0\n    Else\n        Me.txtItems = Nz(DSum(\"Quantity\", \"tblOrderLine\", \"OrderID = \" & Me.OrderID), 0)\n    End If\n```\nTest: order 1 shows 3 (2 + 1); order 4 shows 4 (1 + 3)."},{"q":"Apply a 10% discount to orders whose subtotal is £200 or more, before VAT, showing the discount in **txtDiscount**.","m":3,"a":"Add a locked text box txtDiscount. In ShowTotals add `Dim curDiscount As Currency` with the other Dims, then replace everything from `curVAT = …` to the end of the procedure with:\n```\n    If curSub >= 200 Then\n        curDiscount = Round(curSub * 0.1, 2)\n    Else\n        curDiscount = 0\n    End If\n    curVAT = Round((curSub - curDiscount) * 0.2, 2)\n    Me.txtOrderSubtotal = curSub\n    Me.txtDiscount = curDiscount\n    Me.txtOrderVAT = curVAT\n    Me.txtOrderTotal = curSub - curDiscount + curVAT\n```\nTest boundaries: £199.99 → no discount; £200.00 → £20.00 off, VAT £36.00, total £216.00."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["DSum","Nz","Subform","Unbound control"]},{"id":"c07-p04","spec":"Show a low-stock alert when the menu opens","lessons":["AD04"],"summary":"Use DCount to count products at or below their reorder level when frmMenu opens, show the count on the menu, and offer to open rptLowStock.","blocks":[{"t":"p","text":"Staff should not have to remember to check stock. When frmMenu opens, a [[DCount]] counts products where StockLevel <= ReorderLevel. If any are low, a message offers the low-stock report, and a label on the menu keeps showing the count."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmMenu (with the login code from the first page), rptLowStock (Chapter 5), and cmdLowStock if you did the Chapter 4 practice task.","**By the end:** a label **lblLowStock** and a button **cmdLowStock** on frmMenu; a pop-up alert at log-in when stock is low."]},{"t":"example","title":"Tutorial","steps":["Open **frmMenu** in Design view. Add a label **lblLowStock** (type *Stock* in it, font size 12, bold). If cmdLowStock is not there yet (Chapter 4 practice), add it with caption *Low stock report*.","View Code. Add the function `CountLowStock`, the `Form_Activate` procedure and the extra lines at the end of `Form_Load`, as below. Add `cmdLowStock_Click` only if Chapter 4 did not already give you one (two procedures with the same name give *Ambiguous name detected*).","Compile, save, close the database and reopen it (log in) to see the alert."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – low-stock code","code":"' Counts low-stock products, updates the label, and returns the count\nPrivate Function CountLowStock() As Long\n    Dim lngLow As Long\n    ' Criteria compares two fields in the same record\n    lngLow = DCount(\"*\", \"tblProduct\", \"StockLevel <= ReorderLevel\")\n    If lngLow > 0 Then\n        Me.lblLowStock.Caption = lngLow & \" product(s) at or below reorder level\"\n        Me.lblLowStock.ForeColor = vbRed\n    Else\n        Me.lblLowStock.Caption = \"Stock levels OK\"\n        Me.lblLowStock.ForeColor = RGB(0, 128, 0)\n    End If\n    CountLowStock = lngLow\nEnd Function\n\nPrivate Sub Form_Load()\n    ' ... the login lines from the first page stay here ...\n    Dim lngLow As Long                       ' (put this Dim with blnAdmin at the top)\n    lngLow = CountLowStock()\n    If lngLow > 0 Then\n        If MsgBox(lngLow & \" product(s) need reordering.\" & vbCrLf & _\n                  \"Open the low-stock report now?\", vbYesNo + vbExclamation, \"Low stock\") = vbYes Then\n            DoCmd.OpenReport \"rptLowStock\", acViewPreview\n        End If\n    End If\nEnd Sub\n\n' Each time the menu becomes active again (e.g. after restocking), refresh the label\nPrivate Sub Form_Activate()\n    CountLowStock\nEnd Sub\n\n' Already there if you did the Chapter 4 practice task\nPrivate Sub cmdLowStock_Click()\n    DoCmd.OpenReport \"rptLowStock\", acViewPreview\nEnd Sub"},{"t":"tip","text":"`DCount(\"*\", \"qryLowStock\")` gives the same answer using the Chapter 3 query: change the rule in one place (the query) and the menu, report and alert all follow."},{"t":"warn","text":"Field names in DCount criteria are written inside the quotes with no `&`: `\"StockLevel <= ReorderLevel\"`. Writing `\"StockLevel <= \" & ReorderLevel` makes VBA look for a variable called ReorderLevel: *Variable not defined*."},{"t":"key","title":"Check it works","items":["With the sample data, logging in shows *3 product(s) need reordering*; Yes opens rptLowStock with 3 rows (D-lock, Brake pads (pair), Multi-tool 15-in-1); the label is red.","Restock all three above their reorder levels in tblProduct (or with the goods-in form, next page), return to the menu: *Stock levels OK* in green and no alert at next login."]}],"diagram":{"kind":"table-reveal","title":"Which products does DCount count?","caption":"StockLevel <= ReorderLevel is tested on every row. Reveal the result column.","head":["ProductID","Description","StockLevel","ReorderLevel","Counted?"],"rows":[["P0001","Inner tube 700x25c","40","10","No"],["P0002","Brake pads (pair)","4","6","Yes"],["P0003","LED front light","12","5","No"],["P0004","D-lock","3","5","Yes"],["P0005","Waterproof jacket","7","4","No"],["P0006","Cycling gloves","20","8","No"],["P0007","Multi-tool 15-in-1","5","5","Yes (5 <= 5)"],["P0008","Track pump","9","3","No"],["P0009","Chain lube 100ml","15","5","No"],["P0010","Puncture repair kit","25","8","No"],["P0011","Saddle bag","6","3","No"],["","","","DCount =","3"]],"hidden":[[0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[10,4],[11,4]]},"check":[{"q":"Which counts products at or below their reorder level?","o":["DCount(\"*\", \"tblProduct\", \"StockLevel <= ReorderLevel\")","DSum(\"StockLevel\", \"tblProduct\")","DLookup(\"*\", \"tblProduct\", \"StockLevel < 5\")","DCount(\"StockLevel\", \"tblProduct\", \"ReorderLevel\")"],"a":0,"why":"DCount counts matching records; the criteria compares the two fields in each record."},{"q":"Why call CountLowStock in Form_Activate as well as Form_Load?","o":["Load does not allow DCount","So the label refreshes when the user returns to the menu after changing stock","To show the message twice","Activate fires before Load"],"a":1,"why":"Load fires once when the form opens; Activate fires every time the menu becomes the active window again."},{"q":"A product has StockLevel 5 and ReorderLevel 5. Is it counted?","o":["No, it must be below","Yes, because <= includes equal","Only if Price > 0","Only in the report"],"a":1,"why":"<= means less than or equal to; 5 <= 5 is true."}],"exam":[],"practice":[{"q":"Change the alert so it lists the descriptions of the low-stock products in the message (one per line).","m":3,"a":"Build the list with a recordset loop (see the recordset page):\n```\nPrivate Function LowStockList() As String\n    Dim rs As DAO.Recordset\n    Dim strList As String\n    Set rs = CurrentDb.OpenRecordset(\"SELECT Description, StockLevel FROM tblProduct \" & _\n                                     \"WHERE StockLevel <= ReorderLevel ORDER BY Description\")\n    Do While Not rs.EOF\n        strList = strList & rs!Description & \" (\" & rs!StockLevel & \" left)\" & vbCrLf\n        rs.MoveNext\n    Loop\n    rs.Close\n    Set rs = Nothing\n    LowStockList = strList\nEnd Function\n```\nIn Form_Load use `MsgBox lngLow & \" product(s) need reordering:\" & vbCrLf & LowStockList() & \"Open the report?\", …`. Test: Brake pads (pair), D-lock and Multi-tool 15-in-1 appear, in alphabetical order."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["DCount","Report","Event"]},{"id":"c07-p05","spec":"Build a goods-in form that adds delivered stock with validation and confirmation","lessons":["AD04"],"summary":"frmRestock: choose a product, type the quantity delivered, validate it, confirm with a MsgBox and add it to StockLevel with an UPDATE.","blocks":[{"t":"p","text":"When a delivery arrives, staff record it on an unbound form. The code checks the quantity is a sensible whole number, shows what the new stock level will be, asks for confirmation and then adds it with one UPDATE statement."},{"t":"key","title":"You will need / By the end","items":["**You will need:** tblProduct; frmMenu to put a **Goods in** button on.","**By the end:** frmRestock that accepts 1–500 items for a chosen product and updates StockLevel; frmMenu opens it."]},{"t":"example","title":"Tutorial 1: Build the form","steps":["**Create › Form Design** (unbound). Add a **Combo Box** (wizard off) named **cboProduct**.","cboProduct › Data: **Row Source** `SELECT ProductID, Description, StockLevel FROM tblProduct ORDER BY Description;`, **Bound Column 1**, **Limit To List Yes**. Format: **Column Count 3**, **Column Widths** `0cm;5cm;1.5cm`, **List Width** 6.5cm. The ProductID column is hidden but is the value.","Add text boxes **txtCurrent** (label *In stock now*, Locked Yes, Tab Stop No) and **txtDelivered** (label *Quantity delivered*).","Add buttons **cmdAddStock** (*Add to stock*) and **cmdClose** (*Close*). Save as **frmRestock**.","On frmMenu add **cmdRestock** with `DoCmd.OpenForm \"frmRestock\"`."]},{"t":"code","lang":"ps","title":"VBA: frmRestock module (whole module)","code":"Option Compare Database\nOption Explicit\n\n' Show current stock as soon as a product is chosen (Column(2) = third column)\nPrivate Sub cboProduct_AfterUpdate()\n    Me.txtCurrent = Me.cboProduct.Column(2)\nEnd Sub\n\nPrivate Sub cmdAddStock_Click()\nOn Error GoTo Err_Handler\n    Dim intQty As Integer\n    Dim intCurrent As Integer\n\n    ' 1 Presence check\n    If IsNull(Me.cboProduct) Then\n        MsgBox \"Choose a product.\", vbExclamation, \"Goods in\"\n        Me.cboProduct.SetFocus\n        Exit Sub\n    End If\n    ' 2 Type, range and whole-number checks\n    If Not IsNumeric(Me.txtDelivered) Then\n        MsgBox \"Enter the quantity as a number.\", vbExclamation, \"Goods in\"\n        Me.txtDelivered.SetFocus\n        Exit Sub\n    End If\n    If Val(Me.txtDelivered) < 1 Or Val(Me.txtDelivered) > 500 _\n       Or Val(Me.txtDelivered) <> Int(Val(Me.txtDelivered)) Then\n        MsgBox \"Quantity must be a whole number from 1 to 500.\", vbExclamation, \"Goods in\"\n        Me.txtDelivered.SetFocus\n        Exit Sub\n    End If\n    intQty = Val(Me.txtDelivered)\n\n    ' 3 Confirm, showing before and after\n    intCurrent = Nz(DLookup(\"StockLevel\", \"tblProduct\", \"ProductID = '\" & Me.cboProduct & \"'\"), 0)\n    If MsgBox(\"Add \" & intQty & \" x \" & Me.cboProduct.Column(1) & \"?\" & vbCrLf & _\n              \"Stock will go from \" & intCurrent & \" to \" & (intCurrent + intQty) & \".\", _\n              vbYesNo + vbQuestion, \"Confirm delivery\") = vbNo Then\n        Exit Sub\n    End If\n\n    ' 4 Update the table\n    CurrentDb.Execute \"UPDATE tblProduct SET StockLevel = StockLevel + \" & intQty & _\n                      \" WHERE ProductID = '\" & Me.cboProduct & \"'\", dbFailOnError\n    MsgBox \"Stock updated. New level: \" & (intCurrent + intQty), vbInformation, \"Goods in\"\n\n    ' 5 Reset for the next delivery\n    Me.cboProduct.Requery              ' reload the list so its stock column is current\n    Me.cboProduct = Null\n    Me.txtCurrent = Null\n    Me.txtDelivered = Null\n    Me.cboProduct.SetFocus\n\nExit_Here:\n    Exit Sub\nErr_Handler:\n    MsgBox \"Stock was not updated.\" & vbCrLf & Err.Description, vbExclamation, \"Goods in\"\n    Resume Exit_Here\nEnd Sub\n\nPrivate Sub cmdClose_Click()\n    DoCmd.Close acForm, Me.Name\nEnd Sub"},{"t":"table","head":["Check","Test value","Why"],"rows":[["Presence","no product chosen","Nothing to update"],["Type","abc","IsNumeric is False"],["Range","0, 501","Outside 1–500"],["Whole number","2.5","Val ≠ Int(Val)"]],"caption":"What the validation stops"},{"t":"warn","text":"An unbound text box with no Format holds **text**, so `\"9\" > \"10\"` style comparisons go wrong. That is why the code converts with `Val()` before comparing. Setting txtDelivered's **Format** to *General Number* also makes Access treat it as a number."},{"t":"key","title":"Check it works","items":["Choose D-lock: *In stock now* shows 3. Enter 20, confirm (*from 3 to 23*): StockLevel is 23 in tblProduct and the form clears.","Try blank, abc, 0, 501 and 2.5: each gives the right message and nothing changes. Click No at the confirmation: nothing changes.","Back on frmMenu, the low-stock label updates (Form_Activate)."]}],"diagram":{"kind":"flow","direction":"tb","title":"cmdAddStock_Click","caption":"Validate, confirm, update, reset.","nodes":[{"id":"a","label":"Click Add to stock","detail":"cmdAddStock_Click runs.","shape":"start"},{"id":"b","label":"Product chosen?","detail":"IsNull(Me.cboProduct)","shape":"decision"},{"id":"c","label":"Whole number 1–500?","detail":"IsNumeric, then Val between 1 and 500 and equal to Int(Val).","shape":"decision"},{"id":"d","label":"Show message, focus box","detail":"Exit Sub without changing anything.","shape":"end"},{"id":"e","label":"Confirm Yes?","detail":"MsgBox shows 'Stock will go from 3 to 23'.","shape":"decision"},{"id":"f","label":"UPDATE tblProduct","detail":"CurrentDb.Execute \"UPDATE tblProduct SET StockLevel = StockLevel + 20 WHERE ProductID = 'P0004'\", dbFailOnError","shape":"store"},{"id":"g","label":"Clear form","detail":"Requery the combo, clear the boxes, focus back to cboProduct.","shape":"end"},{"id":"h","label":"Do nothing","detail":"No clicked: Exit Sub.","shape":"end"}],"edges":[["a","b"],["b","d","no"],["b","c","yes"],["c","d","no"],["c","e","yes"],["e","f","yes"],["e","h","no"],["f","g"]]},"check":[{"q":"cboProduct's columns are ProductID, Description, StockLevel. Which gives the description?","o":["Me.cboProduct","Me.cboProduct.Column(1)","Me.cboProduct.Column(2)","Me.cboProduct.Column(3)"],"a":1,"why":"Columns are numbered from 0, so Description is Column(1); the bound value (Me.cboProduct) is ProductID."},{"q":"Which input does the whole-number check reject?","o":["20","1","500","2.5"],"a":3,"why":"Val(\"2.5\") = 2.5 but Int(2.5) = 2, so they differ."},{"q":"Why `StockLevel = StockLevel + 20` rather than setting StockLevel to the number shown on the form?","o":["It is shorter","It adds to whatever is in the table at that moment, even if it changed since the form showed it","Access does not allow constants in UPDATE","So that dbFailOnError works"],"a":1,"why":"Relative updates are safe if a sale happened between choosing the product and clicking the button."}],"exam":[],"practice":[{"q":"Add a delivery log: each confirmed delivery adds a row to **tblDelivery** (DeliveryID AutoNumber, ProductID Short Text 5, Quantity Integer, DeliveryDate Date/Time, Username Short Text 20).","m":3,"a":"Create tblDelivery with a relationship to tblProduct. After the UPDATE line add:\n```\n    CurrentDb.Execute \"INSERT INTO tblDelivery (ProductID, Quantity, DeliveryDate, Username) \" & _\n        \"VALUES ('\" & Me.cboProduct & \"', \" & intQty & \", Now(), '\" & Nz(TempVars!Username, \"\") & \"')\", dbFailOnError\n```\nTest: two deliveries give two rows with the right product, quantity, time and user."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Combo box","Unbound control","Validation rule","MsgBox","Update query"]},{"id":"c07-p06","spec":"Build a search form that filters as you type part of a name","lessons":["AD04"],"summary":"frmSearch: type part of a surname, first name or postcode, click Search to filter with Like and wildcards, Clear to show all, and double-click a result to open it.","blocks":[{"t":"p","text":"A search form lists customers and narrows the list to the ones that match what is typed anywhere in the name or postcode. The code builds a [[Filter]] such as `Surname Like '*mag*'` and switches it on; Clear switches it off."},{"t":"key","title":"You will need / By the end","items":["**You will need:** tblCustomer with the five Chapter 2 customers, plus a test customer **Sean O'Neill, BT74 5AA** to try the apostrophe; frmCustomer.","**By the end:** frmSearch where typing *mag* finds Maguire but not McCaffrey; double-clicking a customer opens frmCustomer on that record."]},{"t":"example","title":"Tutorial 1: Build frmSearch","steps":["Select tblCustomer › **Create › More Forms › Multiple Items** (a continuous form). Save it as **frmSearch**.","Design view: in the **Form Header** add an unbound text box **txtSearch** (label *Find*), a button **cmdSearch** (caption *Search*, Other tab › **Default: Yes**) and **cmdClear** (caption *Clear*).","Select all the detail text boxes › Data › **Locked: Yes** so results cannot be changed by mistake.","Form properties: **Allow Additions No**, **Allow Deletions No**, Order By `Surname, FirstName`, **Order By On Load Yes**. Keep **Allow Edits Yes** (see the warning).","Name the Surname text box **txtSurname** (Other tab). View Code and type the module below."]},{"t":"code","lang":"ps","title":"VBA: frmSearch module (whole module)","code":"Option Compare Database\nOption Explicit\n\nPrivate Sub cmdSearch_Click()\n    Dim strText As String\n    strText = Trim(Nz(Me.txtSearch, \"\"))\n    If strText = \"\" Then\n        cmdClear_Click                       ' nothing typed: show everyone\n        Exit Sub\n    End If\n    strText = Replace(strText, \"'\", \"''\")    ' O'Neill would break the quotes\n    ' * matches any characters, so '*mag*' finds mag anywhere in the field\n    Me.Filter = \"Surname Like '*\" & strText & \"*' Or FirstName Like '*\" & strText & _\n                \"*' Or Postcode Like '*\" & strText & \"*'\"\n    Me.FilterOn = True\n    If Me.RecordsetClone.RecordCount = 0 Then\n        MsgBox \"No customers match '\" & Me.txtSearch & \"'.\", vbInformation, \"Search\"\n    End If\nEnd Sub\n\nPrivate Sub cmdClear_Click()\n    Me.txtSearch = Null\n    Me.Filter = \"\"\n    Me.FilterOn = False\n    Me.txtSearch.SetFocus\nEnd Sub\n\n' Double-click a surname to open that customer's full record\nPrivate Sub txtSurname_DblClick(Cancel As Integer)\n    DoCmd.OpenForm \"frmCustomer\", , , \"CustomerID = \" & Me.CustomerID\nEnd Sub"},{"t":"table","head":["Typed","Filter built","Finds (sample)"],"rows":[["mag","Surname Like '*mag*' Or FirstName Like '*mag*' Or Postcode Like '*mag*'","Aoife Maguire"],["BT74","… Postcode Like '*BT74*'","Aoife Maguire, Hannah Irvine (and Sean O'Neill)"],["o'n","Surname Like '*o''n*' …","Sean O'Neill (test customer)"]]},{"t":"warn","text":"If a form's **Allow Edits** is No, you cannot type into *any* control on it, including the unbound search box. Leave Allow Edits Yes and lock the bound detail controls instead."},{"t":"tip","text":"Search as you type: put the filter code in **txtSearch › On Change** and use `Me.txtSearch.Text` (the text being typed) instead of `Me.txtSearch`, then add `Me.txtSearch.SelStart = Len(Me.txtSearch.Text)` so the cursor stays at the end."},{"t":"key","title":"Check it works","items":["Type *mag* and press Enter: only Aoife Maguire. *BT74*: only the BT74 postcodes. *o'n*: Sean O'Neill, no error. *zzz*: the 'No customers match' message.","Clear: all customers again. Double-click a surname: frmCustomer opens on that customer."]}],"diagram":{"kind":"table-reveal","title":"What does Like '*mag*' match?","caption":"Decide whether each surname matches Surname Like '*mag*' (case is ignored), then reveal.","head":["Surname","Matches?"],"rows":[["Maguire","Yes – 'Mag' at the start"],["McCaffrey","No – no 'mag' anywhere"],["Irvine","No"],["Graham","No – 'ham', not 'mag'"],["Corrigan","No"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[4,1]]},"check":[{"q":"Which filter finds 'mag' anywhere in the surname?","o":["Surname = '*mag*'","Surname Like '*mag*'","Surname Like 'mag'","Surname Like '*' & mag & '*'"],"a":1,"why":"Like with * on both sides matches any characters before and after. = does not use wildcards."},{"q":"What does `Me.FilterOn = False` do?","o":["Deletes the filter text","Removes the filter so all records show","Closes the form","Saves the filter"],"a":1,"why":"FilterOn switches the filter on or off; the Filter property keeps its text."},{"q":"Why does the code use Replace(strText, \"'\", \"''\")?","o":["To remove spaces","So a name like O'Neill does not end the quoted text early","To make it uppercase","Access requires it for all searches"],"a":1,"why":"A single apostrophe would close the quotes; doubling it means 'a literal apostrophe'."}],"exam":[],"practice":[{"q":"Build **frmStockCheck**: an unbound main form with **txtFind** and a subform control **sfrmStockList** (a continuous form on tblProduct showing ProductID, Description, Category, StockLevel). A **Find** button changes the subform's RecordSource to products whose description contains the text.","m":4,"a":"Create the continuous form sfrmStockList (record source tblProduct), then drag it onto unbound frmStockCheck; name the subform control sfrmStockList. Code:\n```\nPrivate Sub cmdFind_Click()\n    Dim strSQL As String\n    strSQL = \"SELECT ProductID, Description, Category, StockLevel FROM tblProduct\"\n    If Len(Trim(Nz(Me.txtFind, \"\"))) > 0 Then\n        strSQL = strSQL & \" WHERE Description Like '*\" & Replace(Trim(Me.txtFind), \"'\", \"''\") & \"*'\"\n    End If\n    strSQL = strSQL & \" ORDER BY Description;\"\n    ' .Form reaches the form inside the subform control\n    Me.sfrmStockList.Form.RecordSource = strSQL\nEnd Sub\n```\nTest: 'tube' shows Inner tube 700x25c; 'lock' shows D-lock; blank shows all 11 products."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Filter","Wildcard","Form"]},{"id":"c07-p07","spec":"Validate data in VBA with Before Update and Cancel","lessons":["AD04"],"summary":"Check presence, format and range on frmCustomer and frmProduct before a record is saved, show a clear message and put the cursor on the faulty box.","blocks":[{"t":"p","text":"Table validation rules (Chapter 2) catch simple mistakes. VBA in the form's **Before Update** event can do more: several checks in order, friendly messages, rules that compare fields, and moving the cursor to the box that needs fixing. `Cancel = True` stops the save."},{"t":"anim","scene":"validation","caption":"Before Update does the checks; Cancel = True stops a save that fails one."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmCustomer (controls txtFirstName, txtSurname, txtPhone, txtEmail, txtPostcode) and frmProduct.","**By the end:** customers cannot be saved without names or with a badly formed NI postcode, email or phone number; products cannot have silly prices or negative stock."]},{"t":"example","title":"Tutorial","steps":["Open **frmCustomer** in Design view, select the form › Event › **Before Update** › … › Code Builder.","Type the procedure below. Each check follows the same pattern: test → message → `Cancel = True` → SetFocus → Exit Sub.","Do the same on **frmProduct** with the second procedure.","Compile, save, and try to save bad records."]},{"t":"code","lang":"ps","title":"VBA: frmCustomer module – Form_BeforeUpdate","code":"Private Sub Form_BeforeUpdate(Cancel As Integer)\n    Dim strDigits As String\n\n    ' Presence checks\n    If Len(Trim(Nz(Me.txtFirstName, \"\"))) = 0 Then\n        MsgBox \"Enter the customer's first name.\", vbExclamation, \"Missing data\"\n        Cancel = True\n        Me.txtFirstName.SetFocus\n        Exit Sub\n    End If\n    If Len(Trim(Nz(Me.txtSurname, \"\"))) = 0 Then\n        MsgBox \"Enter the customer's surname.\", vbExclamation, \"Missing data\"\n        Cancel = True\n        Me.txtSurname.SetFocus\n        Exit Sub\n    End If\n\n    ' Format check: Northern Ireland postcode, e.g. BT74 6AB or BT1 1AA\n    If Not IsNull(Me.txtPostcode) Then\n        Me.txtPostcode = UCase(Trim(Me.txtPostcode))\n        If Not (Me.txtPostcode Like \"BT# #[A-Z][A-Z]\" Or Me.txtPostcode Like \"BT## #[A-Z][A-Z]\") Then\n            MsgBox \"Postcode must look like BT74 6AB (with a space).\", vbExclamation, \"Check postcode\"\n            Cancel = True\n            Me.txtPostcode.SetFocus\n            Exit Sub\n        End If\n    End If\n\n    ' Format check: email has text@text.text and no spaces\n    If Not IsNull(Me.txtEmail) Then\n        If Not (Me.txtEmail Like \"*?@?*.?*\") Or InStr(Me.txtEmail, \" \") > 0 Then\n            MsgBox \"Email must look like name@example.com.\", vbExclamation, \"Check email\"\n            Cancel = True\n            Me.txtEmail.SetFocus\n            Exit Sub\n        End If\n    End If\n\n    ' Length/format check: phone is 11 digits once spaces are removed\n    strDigits = Replace(Nz(Me.txtPhone, \"\"), \" \", \"\")\n    If Len(strDigits) > 0 And Not (strDigits Like \"###########\") Then\n        MsgBox \"Phone must be 11 digits, e.g. 028 6632 1234.\", vbExclamation, \"Check phone\"\n        Cancel = True\n        Me.txtPhone.SetFocus\n        Exit Sub\n    End If\nEnd Sub"},{"t":"code","lang":"ps","title":"VBA: frmProduct module – Form_BeforeUpdate (range checks)","code":"Private Sub Form_BeforeUpdate(Cancel As Integer)\n    If Len(Trim(Nz(Me.txtDescription, \"\"))) = 0 Then\n        MsgBox \"Enter a description.\", vbExclamation, \"Missing data\"\n        Cancel = True\n        Me.txtDescription.SetFocus\n        Exit Sub\n    End If\n    ' Range check: price above £0 and no more than £5,000\n    If Nz(Me.txtPrice, 0) <= 0 Or Nz(Me.txtPrice, 0) > 5000 Then\n        MsgBox \"Price must be more than £0 and no more than £5,000.\", vbExclamation, \"Check price\"\n        Cancel = True\n        Me.txtPrice.SetFocus\n        Exit Sub\n    End If\n    ' Range check: stock 0 to 9999\n    If Nz(Me.txtStockLevel, -1) < 0 Or Nz(Me.txtStockLevel, -1) > 9999 Then\n        MsgBox \"Stock level must be from 0 to 9999.\", vbExclamation, \"Check stock\"\n        Cancel = True\n        Me.txtStockLevel.SetFocus\n        Exit Sub\n    End If\nEnd Sub"},{"t":"compare","head":["Table validation rule","VBA Before Update"],"rows":[["Where","Field property in table Design view","Form event procedure"],["Applies","Everywhere data is entered, including queries and imports","Only on that form"],["Checks","One field (or a simple record rule)","Anything: several fields, lookups, patterns"],["Message","One Validation Text per field","A tailored message, and the cursor moved to the problem box"]]},{"t":"warn","text":"In a **control's** own Before Update (e.g. `txtQuantity_BeforeUpdate`) set `Cancel = True` but do **not** call `Me.txtQuantity.SetFocus`: the focus is already there and Access raises *run-time error 2108: You must save the field before you execute the GoToControl action*. SetFocus is fine in the **form's** Before Update."},{"t":"key","title":"Check it works","items":["Blank surname → message, cursor in Surname, record not saved. Esc undoes the changes.","Postcodes: BT74 6AB and bt1 1aa accepted (stored as BT1 1AA); BT746AB and SW1A 1AA refused. Email ciara@example.com accepted; ciara@example refused.","Product price 0 or 5000.01 refused; 0.01 and 5000 accepted (boundaries)."]}],"diagram":{"kind":"table-reveal","title":"Accepted or refused?","caption":"Predict what Form_BeforeUpdate does with each value, then reveal.","head":["Field","Value typed","Result"],"rows":[["Postcode","BT74 6AB","Accepted"],["Postcode","bt9 5bs","Accepted, stored as BT9 5BS"],["Postcode","BT746AB","Refused – no space"],["Email","ciara.maguire@example.com","Accepted"],["Email","ciara@example","Refused – no dot after the @"],["Phone","028 6632 1234","Accepted – 11 digits"],["Phone","6632 1234","Refused – only 8 digits"],["Price","0","Refused – must be above £0"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2]]},"check":[{"q":"What does `Cancel = True` do in a form's Before Update event?","o":["Deletes the record","Stops the record being saved and keeps the user on it","Closes the form","Undoes all changes"],"a":1,"why":"The save is cancelled; the user can correct the data (or press Esc to undo)."},{"q":"Which pattern accepts BT74 6AB?","o":["\"BT# #[A-Z][A-Z]\"","\"BT## #[A-Z][A-Z]\"","\"BT####\"","\"BT* [0-9]\""],"a":1,"why":"# is one digit, [A-Z] one letter: B T 7 4 space 6 A B."},{"q":"Why is the presence check done before the format checks?","o":["Format checks are slower","Like gives an error on empty text","The most basic problem is reported first and the procedure exits","Access requires it"],"a":2,"why":"Exit Sub after each failure means the user fixes one problem at a time, starting with the most basic."}],"exam":[],"practice":[{"q":"Add a check to frmOrder's Before Update that refuses an order date in the future or more than 30 days in the past.","m":3,"a":"```\nPrivate Sub Form_BeforeUpdate(Cancel As Integer)\n    If IsNull(Me.txtOrderDate) Then\n        MsgBox \"Enter the order date.\", vbExclamation, \"Missing data\"\n        Cancel = True\n        Me.txtOrderDate.SetFocus\n    ElseIf Me.txtOrderDate > Date Or Me.txtOrderDate < Date - 30 Then\n        MsgBox \"Order date must be within the last 30 days.\", vbExclamation, \"Check date\"\n        Cancel = True\n        Me.txtOrderDate.SetFocus\n    End If\nEnd Sub\n```\n(Name the OrderDate text box txtOrderDate.) Test: today and 30 days ago accepted; tomorrow and 31 days ago refused."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Validation rule","Event procedure","Wildcard"]},{"id":"c07-p08","spec":"Generate the next ProductID automatically and set default values in code","lessons":["AD04"],"summary":"Use DMax, Mid, Val and Format to make the next ID (P0042 → P0043) when a new product is started, and set default values from code.","blocks":[{"t":"p","text":"ProductID is text (P0001), so AutoNumber cannot make it. When a new product is started, the form's **Before Insert** event finds the highest existing ID with [[DMax]], takes the number part, adds 1 and formats it back to P plus four digits."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct with txtProductID and cboCategory.","**By the end:** typing anything into a new product fills in the next ProductID; the category defaults to the last one used."]},{"t":"example","title":"Tutorial","steps":["Open **frmProduct** in Design view. Select **txtProductID** › Data › **Locked: Yes**; Other › **Tab Stop: No** (users no longer type IDs). If Form_Current contains `Me.txtProductID.Locked = Not Me.NewRecord` (Chapter 4 practice / Chapter 6), delete that line, or it unlocks the box again on a new record.","Select the form › Event › **Before Insert** › … › Code Builder, and type the procedure below.","Find the existing `cboCategory_AfterUpdate` (from Chapter 6) and add the DefaultValue line to it as shown.","Compile, save, open in Form view, go to a new record and type a description."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – Form_BeforeInsert and cboCategory_AfterUpdate","code":"' Fires when the user types the first character into a new record\nPrivate Sub Form_BeforeInsert(Cancel As Integer)\n    Dim varMax As Variant\n    Dim lngNext As Long\n\n    varMax = DMax(\"ProductID\", \"tblProduct\")       ' e.g. \"P0042\"; Null if the table is empty\n    If IsNull(varMax) Then\n        lngNext = 1\n    Else\n        lngNext = Val(Mid(varMax, 2)) + 1          ' \"0042\" -> 42 -> 43\n    End If\n\n    If lngNext > 9999 Then\n        MsgBox \"No more product codes available.\", vbCritical, \"New product\"\n        Cancel = True\n        Exit Sub\n    End If\n    Me.txtProductID = \"P\" & Format(lngNext, \"0000\")   ' 43 -> \"P0043\"\nEnd Sub\n\nPrivate Sub cboCategory_AfterUpdate()\n    ShowLocation                                   ' from Chapter 6\n    ' Next new product starts with the same category (DefaultValue is text: needs quotes inside)\n    Me.cboCategory.DefaultValue =  & Me.cboCategory & \nEnd Sub"},{"t":"table","head":["Default to set","Code (e.g. in Form_Load)","Note"],"rows":[["Text","`Me.cboCategory.DefaultValue = \"\"\"Parts\"\"\"`","The property holds \"Parts\" including quotes"],["Number","`Me.txtReorderLevel.DefaultValue = 5`","No quotes needed"],["Today's date","`Me.txtOrderDate.DefaultValue = \"=Date()\"`","An expression, evaluated for each new record"],["Order status","`Me.cboStatus.DefaultValue = \"\"\"Open\"\"\"`","Same pattern as text"]]},{"t":"warn","text":"DMax on text compares character by character, which only gives the right answer because every ID has exactly four digits. If someone saved **P43** instead of P0043, \"P43\" would count as larger than \"P0099\" (4 > 0), so DMax would keep returning P43 and every new product would be given P0044, a duplicate. Keep the input mask `>\"P\"0000;0;_` and the validation rule `Like \"P####\"` from Chapter 2 so every ID has four digits (the `;0` makes Access store the P, which this code relies on)."},{"t":"note","text":"In a shared database two people starting new products at the same moment could get the same ID; the primary key then refuses the second save (error 3022). For this project, one user at a time, that is fine."},{"t":"key","title":"Check it works","items":["Highest ID P0011 (Saddle bag) → a new product gets P0012 as soon as you type its description; save, start another → P0013.","Choose Clothing for one new product: the next new product starts with Clothing."]}],"diagram":{"kind":"table-reveal","title":"From P0042 to P0043","caption":"Trace each step of Form_BeforeInsert, then reveal.","head":["Step","Expression","Result"],"rows":[["1","DMax(\"ProductID\", \"tblProduct\")","\"P0042\""],["2","Mid(\"P0042\", 2)","\"0042\""],["3","Val(\"0042\")","42"],["4","42 + 1","43"],["5","Format(43, \"0000\")","\"0043\""],["6","\"P\" & \"0043\"","\"P0043\""]],"hidden":[[1,2],[2,2],[3,2],[4,2],[5,2]]},"check":[{"q":"What does `Format(7, \"0000\")` return?","o":["\"7\"","\"0007\"","\"7000\"","7.000"],"a":1,"why":"Each 0 in the format is a digit place filled with a leading zero if needed."},{"q":"Why does the code use Mid(varMax, 2)?","o":["To skip the leading P","To get the last two digits","To convert to a number","To find the maximum"],"a":0,"why":"Mid from position 2 returns everything after the first character."},{"q":"Which line sets the default category to Parts?","o":["Me.cboCategory.DefaultValue = Parts","Me.cboCategory.DefaultValue = \"Parts\"","Me.cboCategory.DefaultValue = \"\"\"Parts\"\"\"","Me.cboCategory = Default(\"Parts\")"],"a":2,"why":"DefaultValue is an expression, so text must arrive with quotes round it: \"\"\"Parts\"\"\" produces \"Parts\"."}],"exam":[],"practice":[{"q":"Customers want a reference number for each order in the form RB-2026-0001 (year and a counter that restarts each year). Write the code for frmOrder's Before Insert, assuming a new field OrderRef (Short Text 12) and a text box txtOrderRef.","m":4,"a":"```\nPrivate Sub Form_BeforeInsert(Cancel As Integer)\n    Dim strPrefix As String\n    Dim varMax As Variant\n    Dim lngNext As Long\n    strPrefix = \"RB-\" & Year(Date) & \"-\"\n    ' Highest reference for this year only\n    varMax = DMax(\"OrderRef\", \"tblOrder\", \"OrderRef Like '\" & strPrefix & \"*'\")\n    If IsNull(varMax) Then\n        lngNext = 1\n    Else\n        lngNext = Val(Right(varMax, 4)) + 1\n    End If\n    Me.txtOrderRef = strPrefix & Format(lngNext, \"0000\")\nEnd Sub\n```\nTest: the first 2026 order gets RB-2026-0001, the next RB-2026-0002; change the PC date to 2027 and the next is RB-2027-0001."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["DMax","Primary key","Input mask"]},{"id":"c07-p09","spec":"Loop through a recordset to change prices or build a list","lessons":["AD04"],"summary":"Open a DAO recordset of one category's products, loop through it with Edit/Update/MoveNext to change every price by a percentage, and close it tidily.","blocks":[{"t":"p","text":"A [[Recordset]] is a set of records opened in code, which you move through one at a time. Here an admin chooses a category and a percentage, and the code visits every product in that category, changes its price and counts how many changed."},{"t":"key","title":"You will need / By the end","items":["**You will need:** the admin-only **cmdPriceChange** button on frmMenu (login page).","**By the end:** an unbound form **frmPriceChange** with **cboCategory**, **txtPercent** and **cmdApply** that raises or lowers prices safely; cmdPriceChange opens it."]},{"t":"example","title":"Tutorial","steps":["**Create › Form Design** (unbound). Add a combo box **cboCategory**: Row Source Type **Value List**, Row Source `\"Parts\";\"Accessories\";\"Clothing\";\"Tools\"`, Limit To List Yes.","Add a text box **txtPercent** (label *Change %, e.g. 10 or -5*) and a button **cmdApply** (*Apply*). Save as **frmPriceChange**.","frmMenu: cmdPriceChange On Click → `DoCmd.OpenForm \"frmPriceChange\"`.","Back‑up first (File › Save As › Back Up Database): this changes many records at once. Then type the code below, compile and test."]},{"t":"code","lang":"ps","title":"VBA: frmPriceChange module – cmdApply On Click","code":"Private Sub cmdApply_Click()\nOn Error GoTo Err_Handler\n    Dim db As DAO.Database\n    Dim rs As DAO.Recordset\n    Dim dblFactor As Double\n    Dim lngCount As Long\n\n    ' Validate the inputs\n    If IsNull(Me.cboCategory) Then\n        MsgBox \"Choose a category.\", vbExclamation, \"Price change\"\n        Exit Sub\n    End If\n    If Not IsNumeric(Me.txtPercent) Then\n        MsgBox \"Enter the change as a number, e.g. 10 or -5.\", vbExclamation, \"Price change\"\n        Exit Sub\n    End If\n    If Val(Me.txtPercent) < -50 Or Val(Me.txtPercent) > 50 Or Val(Me.txtPercent) = 0 Then\n        MsgBox \"The change must be between -50% and 50% (not 0).\", vbExclamation, \"Price change\"\n        Exit Sub\n    End If\n    If MsgBox(\"Change every \" & Me.cboCategory & \" price by \" & Val(Me.txtPercent) & \"%?\", _\n              vbYesNo + vbQuestion, \"Price change\") = vbNo Then Exit Sub\n\n    dblFactor = 1 + Val(Me.txtPercent) / 100          ' 10 -> 1.1, -5 -> 0.95\n\n    Set db = CurrentDb\n    Set rs = db.OpenRecordset(\"SELECT ProductID, Price FROM tblProduct WHERE Category = '\" & _\n                              Me.cboCategory & \"'\", dbOpenDynaset)\n    Do While Not rs.EOF                               ' until past the last record\n        rs.Edit                                       ' 1 start editing this record\n        rs!Price = Round(rs!Price * dblFactor, 2)     ' 2 change the field\n        rs.Update                                     ' 3 save it\n        lngCount = lngCount + 1\n        rs.MoveNext                                   ' 4 next record (never forget!)\n    Loop\n    MsgBox lngCount & \" price(s) updated.\", vbInformation, \"Price change\"\n\nExit_Here:\n    On Error Resume Next                              ' tidy up even after an error\n    If Not rs Is Nothing Then rs.Close\n    Set rs = Nothing\n    Set db = Nothing\n    Exit Sub\nErr_Handler:\n    MsgBox \"Prices were not all updated.\" & vbCrLf & Err.Description, vbExclamation, \"Price change\"\n    Resume Exit_Here\nEnd Sub"},{"t":"table","head":["Recordset member","Does"],"rows":[["`db.OpenRecordset(sql, dbOpenDynaset)`","Open an editable set of records"],["`rs.EOF`","True when you have moved past the last record"],["`rs!Price`","The Price field of the current record"],["`rs.Edit` … `rs.Update`","Change the current record and save it (`rs.AddNew` … `rs.Update` adds one)"],["`rs.MoveNext`","Go to the next record"],["`rs.Close`, `Set rs = Nothing`","Release the recordset when finished"]]},{"t":"tip","text":"One UPDATE query does the same job in a single statement: `UPDATE tblProduct SET Price = Round(Price*1.1,2) WHERE Category='Parts'`. Use a recordset when each record needs a decision or calculation that SQL cannot easily express, or when you build a list from the records."},{"t":"warn","text":"Forgetting `rs.Update` loses the change with no error. Forgetting `rs.MoveNext` loops for ever on the first record (Ctrl+Break to stop). If the table has a validation rule such as Price > 0, a −100% change would raise an error on Update: that is why the code limits the range."},{"t":"key","title":"Check it works","items":["Back up, then note the Accessories prices: LED front light £24.99, D-lock £34.00, Chain lube 100ml £6.49, Saddle bag £18.00. Apply 10 to Accessories → *4 price(s) updated*: £27.49, £37.40, £7.14, £19.80.","Apply abc, 0 and 60: all refused. Other categories are unchanged. Restore the backup so the sample prices (and the order totals in Chapter 5) are back."]}],"diagram":{"kind":"table-reveal","title":"+10% on Accessories, one record per pass","caption":"Work out each new price (rounded to the penny), then reveal. The records may come out in a different order.","head":["Pass","rs!Description","Old price","New price","lngCount after"],"rows":[["1","LED front light","£24.99","£27.49","1"],["2","D-lock","£34.00","£37.40","2"],["3","Chain lube 100ml","£6.49","£7.14","3"],["4","Saddle bag","£18.00","£19.80","4"],["–","rs.EOF is True","","loop ends","4"]],"hidden":[[0,3],[1,3],[2,3],[3,3],[4,4]]},"check":[{"q":"What is the correct order inside the loop?","o":["MoveNext, Edit, Update","Edit, change field, Update, MoveNext","Update, Edit, MoveNext","Edit, MoveNext, Update"],"a":1,"why":"Edit the current record, change it, save it with Update, then move on."},{"q":"When does `Do While Not rs.EOF` stop?","o":["At the first record","When the recordset has moved past the last record","After 100 records","When a price is 0"],"a":1,"why":"EOF (end of file) becomes True after MoveNext from the last record."},{"q":"Prices rise by 10%. What is dblFactor?","o":["0.1","10","1.1","110"],"a":2,"why":"1 + 10/100 = 1.1, so each price is multiplied by 1.1."}],"exam":[],"practice":[{"q":"Write a procedure in modRiverside, **ReorderList**, that loops through qryLowStock and prints a line for each product in the Immediate window: ProductID, Description and how many to order to reach double the reorder level.","m":3,"a":"```\nPublic Sub ReorderList()\n    Dim rs As DAO.Recordset\n    Set rs = CurrentDb.OpenRecordset(\"qryLowStock\", dbOpenSnapshot)   ' read-only is enough\n    Do While Not rs.EOF\n        Debug.Print rs!ProductID; \"  \"; rs!Description; \"  order \"; rs!ReorderLevel * 2 - rs!StockLevel\n        rs.MoveNext\n    Loop\n    rs.Close\n    Set rs = Nothing\nEnd Sub\n```\n(qryLowStock must include ProductID, Description, StockLevel and ReorderLevel.) Run with F5 and open the Immediate window (qryLowStock lists lowest stock first): P0004 D-lock order 7; P0002 Brake pads (pair) order 8; P0007 Multi-tool 15-in-1 order 5."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Recordset","Iteration","Update query","Error handling"]},{"id":"c07-p10","spec":"Print or save the receipt for the current order","lessons":["AD04"],"summary":"A robust Print receipt button on frmOrder: save first, check the order has lines, preview or print rptOrderReceipt for this order, and save it as a PDF.","blocks":[{"t":"p","text":"Chapter 5 opened the receipt with one line. A button staff rely on must also cope with an unsaved order, an order with no lines, and the user cancelling. This page adds those checks and a second button that saves the receipt as a PDF to email."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmOrder with sfrmOrderLine; rptOrderReceipt (Chapter 5).","**By the end:** **cmdPrintReceipt** and **cmdReceiptPDF** on frmOrder, both with error handling."]},{"t":"example","title":"Tutorial","steps":["Open frmOrder in Design view. Replace the Chapter 5 **cmdReceipt** code with cmdPrintReceipt below (or add a new button named cmdPrintReceipt, caption *Print receipt*).","Add a button **cmdReceiptPDF**, caption *Save receipt as PDF*.","Type both procedures, compile, save and test on several orders."]},{"t":"code","lang":"ps","title":"VBA: frmOrder module – cmdPrintReceipt and cmdReceiptPDF","code":"Private Sub cmdPrintReceipt_Click()\nOn Error GoTo Err_Handler\n    ' 1 Save the order so the report reads the latest data\n    If Me.Dirty Then Me.Dirty = False\n    ' 2 There must be a saved order with at least one line\n    If IsNull(Me.OrderID) Then\n        MsgBox \"Enter the order first.\", vbExclamation, \"Receipt\"\n        Exit Sub\n    End If\n    If DCount(\"*\", \"tblOrderLine\", \"OrderID = \" & Me.OrderID) = 0 Then\n        MsgBox \"This order has no lines yet.\", vbExclamation, \"Receipt\"\n        Exit Sub\n    End If\n    ' 3 Preview the receipt for this order only (acViewNormal would print straight away)\n    DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = \" & Me.OrderID\nExit_Here:\n    Exit Sub\nErr_Handler:\n    If Err.Number <> 2501 Then          ' 2501 = the user cancelled: say nothing\n        MsgBox \"Could not open the receipt.\" & vbCrLf & Err.Description, vbExclamation, \"Receipt\"\n    End If\n    Resume Exit_Here\nEnd Sub\n\nPrivate Sub cmdReceiptPDF_Click()\nOn Error GoTo Err_Handler\n    Dim strFile As String\n    If Me.Dirty Then Me.Dirty = False\n    If IsNull(Me.OrderID) Then Exit Sub\n    strFile = CurrentProject.Path & \"\\Receipt_\" & Me.OrderID & \".pdf\"\n    ' OutputTo has no WhereCondition, so open the filtered report hidden first...\n    DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = \" & Me.OrderID, acHidden\n    ' ...then output that open (filtered) report, and close it\n    DoCmd.OutputTo acOutputReport, \"rptOrderReceipt\", acFormatPDF, strFile, False\n    DoCmd.Close acReport, \"rptOrderReceipt\"\n    MsgBox \"Receipt saved as \" & strFile, vbInformation, \"Receipt\"\nExit_Here:\n    Exit Sub\nErr_Handler:\n    MsgBox \"The PDF was not saved.\" & vbCrLf & Err.Description, vbExclamation, \"Receipt\"\n    Resume Exit_Here\nEnd Sub","output":"Receipt saved as C:\\RiversideBikes\\Receipt_1.pdf"},{"t":"table","head":["Problem","Without the checks","With them"],"rows":[["Order just typed, not saved","Receipt blank or missing the latest change","Saved first by Me.Dirty = False"],["New order, no lines","Empty receipt","'No lines yet' message"],["User closes a print dialog / report cancelled","Run-time error 2501 box","Ignored quietly"],["PDF already open in a reader","Run-time error box","Friendly message: close the PDF and try again"]]},{"t":"tip","text":"The subform's unsaved line is saved automatically when you click a button on the main form, because the focus leaves the subform. `Me.Dirty` only covers the main form's own record."},{"t":"warn","text":"If rptOrderReceipt is already open (e.g. in preview from an earlier click), OpenReport with acHidden reuses it *with its old filter*, and the PDF shows the wrong order. Close any open receipt preview first; you could add `DoCmd.Close acReport, \"rptOrderReceipt\"` at the start of cmdReceiptPDF_Click."},{"t":"key","title":"Check it works","items":["Order 1: Print receipt previews one page with £44.36. Change a quantity, click again without saving: the receipt shows the new figures.","A new order with no lines: message, no report. Save as PDF creates Receipt_1.pdf beside the database containing order 1 only."]}],"diagram":{"kind":"flow","direction":"tb","title":"cmdPrintReceipt_Click","caption":"Every check that happens before the report opens.","nodes":[{"id":"a","label":"Click Print receipt","detail":"Focus leaves the subform, so any unsaved line is saved.","shape":"start"},{"id":"b","label":"Me.Dirty?","detail":"Unsaved changes on the main order record?","shape":"decision"},{"id":"c","label":"Me.Dirty = False","detail":"Saves the order record.","shape":"process"},{"id":"d","label":"Order has lines?","detail":"DCount(\"*\", \"tblOrderLine\", \"OrderID = 1\") > 0","shape":"decision"},{"id":"e","label":"Message: no lines","detail":"Exit Sub.","shape":"end"},{"id":"f","label":"OpenReport filtered","detail":"DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = 1\"","shape":"process"},{"id":"g","label":"Error?","detail":"2501 = cancelled: ignored. Anything else: friendly message.","shape":"decision"},{"id":"h","label":"Receipt on screen","detail":"One order, one page.","shape":"end"}],"edges":[["a","b"],["b","c","yes"],["b","d","no"],["c","d"],["d","e","no"],["d","f","yes"],["f","g"],["g","h","no"]]},"check":[{"q":"Which view argument sends the receipt straight to the printer?","o":["acViewPreview","acViewNormal","acViewDesign","acHidden"],"a":1,"why":"acViewNormal prints immediately; acViewPreview shows Print Preview."},{"q":"Why does the PDF code open the report hidden before OutputTo?","o":["OutputTo is faster that way","OutputTo has no WhereCondition, so it uses the already-open filtered report","PDFs need a hidden window","To stop error 2501"],"a":1,"why":"OutputTo outputs the open copy of the report if there is one, which carries the filter."},{"q":"What is error 2501?","o":["Report not found","The OpenReport (or other) action was cancelled","Disk full","Syntax error in criteria"],"a":1,"why":"It is raised when an action such as OpenReport is cancelled; it is safe to ignore."}],"exam":[],"practice":[{"q":"Add a **NoData** event to rptOrderReceipt so that if it is ever opened for an order with no lines it shows a message and cancels, and make sure cmdPrintReceipt still behaves.","m":3,"a":"In rptOrderReceipt's module (Report › Event › On No Data › Code Builder):\n```\nPrivate Sub Report_NoData(Cancel As Integer)\n    MsgBox \"There is nothing to print for this order.\", vbInformation, \"Receipt\"\n    Cancel = True          ' do not open an empty report\nEnd Sub\n```\nCancelling makes OpenReport raise error 2501 in cmdPrintReceipt, which its handler already ignores, so the user sees only the friendly message. Test by temporarily removing the DCount check and clicking on an order with no lines."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["WhereCondition","Error handling","DCount","Report"]},{"id":"c07-p11","spec":"Test your database with normal, boundary and erroneous data","lessons":["AD05"],"summary":"Run a practical set of tests against the validation and VBA you built, and step through code to track down any test that fails.","blocks":[{"t":"p","text":"Testing means trying the system with data chosen to prove it works and to try to break it. For each rule pick [[Normal data]] (should be accepted), [[Boundary data]] (on and just beyond the edge) and [[Erroneous data]] (wrong type or nonsense, should be refused). Note the stock and totals before and after each test."},{"t":"key","title":"You will need / By the end","items":["**You will need:** everything built in Chapters 2–7 and a backup copy of the database (File › Save As › Back Up Database) to restore afterwards.","**By the end:** you have run every test below, fixed anything that failed, and can use breakpoints to find why a test failed."]},{"t":"table","head":["Feature","Normal","Boundary","Erroneous","Expected result"],"rows":[["Order line quantity (LED front light, stock 12)","2","12 (all stock); 13; 1; 0","abc","2, 12 and 1 saved and stock reduced; 13 → *Only 12 in stock*; 0 → *at least 1*; abc → type error from the field"],["Product price","24.99","0.01; 5000; 0; 5000.01","-3","0.01 and 5000 accepted; 0, 5000.01 and -3 refused with the price message"],["Goods in quantity","20","1; 500; 0; 501","2.5, abc, blank","1, 20, 500 added; others refused, stock unchanged"],["Postcode","BT74 6AB","BT1 1AA (shortest)","BT746AB, SW1A 1AA","First two accepted; others refused"],["Email","ciara@example.com","a@b.co","ciara@example, ciara example.com","First two accepted; others refused"],["Login","admin / Bikes#2026","3rd wrong attempt","admin / bikes#2026, blank","Menu opens; 3rd failure quits; wrong case refused; blank → presence message (not counted)"],["Price change","10 on Accessories","50; -50; 51","abc, 0","±50 accepted; 51, abc, 0 refused"],["New ProductID","after P0011","first product in an empty table","–","P0012; P0001"]],"caption":"A test plan for Riverside Bikes"},{"t":"example","title":"Tutorial 1: Run a stock test properly","steps":["Back up first. Open tblProduct and note LED front light's (P0003) StockLevel: 12. Close the table.","Open frmOrder, start a new order for any customer, add P0003 × 12, move to the next line (this saves it).","Reopen tblProduct: StockLevel should be 0. Check the totals on frmOrder: 12 × £24.99 = £299.88, VAT £59.98, total £359.86.","Add a second line P0003 × 1: the *Only 0 in stock* message appears and the line is not saved.","Delete the order lines (stock goes back if you did the delete practice task) or restore your backup."]},{"t":"example","title":"Tutorial 2: A test fails – find out why","steps":["Suppose quantity 13 is *accepted*. Open sfrmOrderLine's module and put a breakpoint (F9) on `If Me.txtQuantity > intAvailable Then`.","Repeat the test. When the code stops, hover over **intAvailable** and **Me.txtQuantity**, or type `? intAvailable, Me.txtQuantity` in the Immediate window (Ctrl+G).","If intAvailable is 25, step back through the logic: perhaps the old quantity was added on a *new* line because `mblnNew` was set after it was used. Fix the order of the lines, remove the breakpoint, and re-run the **whole** test, not just the failing step.","Also re-run tests that passed before: a fix in one place can break another (regression)."]},{"t":"tip","text":"Test the boundaries on both sides: if 1 to 500 is allowed, try 0, 1, 500 and 501. Most faults are a `<` that should have been `<=`."},{"t":"warn","text":"Test through the forms a user would use, not by typing into tables. Code in form events (stock updates, validation) does not run when you edit a table directly, so a table edit proves nothing about your VBA."},{"t":"key","title":"Check it works","items":["Every row of the test plan gives the expected result; anything that did not is fixed and retested.","Restore your backup (or reset the test data) so the database is clean."]}],"diagram":{"kind":"table-reveal","title":"Predict the result","caption":"Decide whether each test value should be accepted or refused, then reveal.","head":["Test","Type of data","Accepted?"],"rows":[["Goods in: 500","Boundary","Accepted"],["Goods in: 501","Boundary (just outside)","Refused"],["Price: 0.01","Boundary","Accepted"],["Price: -3","Erroneous","Refused"],["Quantity 12 with 12 in stock","Boundary","Accepted"],["Postcode: SW1A 1AA","Erroneous (not NI)","Refused"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2]]},"check":[{"q":"A rule allows 1 to 500. Which set gives the best boundary tests?","o":["1, 250, 500","0, 1, 500, 501","-100, 1000","abc, xyz"],"a":1,"why":"Test on each edge and just outside it."},{"q":"Typing 'abc' into a Number field is…","o":["normal data","boundary data","erroneous data","extreme data that should be accepted"],"a":2,"why":"It is the wrong type and should be rejected."},{"q":"Why should stock-update tests be done through frmOrder, not by typing into tblOrderLine?","o":
