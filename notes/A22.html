hem in Design View.","Parameter prompts in square brackets; wildcards with Like.","Calculated fields as Name: expression; IIf for conditions.","Totals with Group By and Count/Sum; action queries tested on a copy."]}],"diagram":{"kind":"table-reveal","title":"Check qryOverdueLoans by hand (today is 29/10/2026)","caption":"Work out DaysOverdue and the Fine (10p per day, capped at £20) for each loan, then reveal.","head":["Book","DueDate","DaysOverdue","Fine"],"rows":[["The Secret Garden","22/10/2026","7","£0.70"],["Wild Atlantic Way Guide","01/10/2026","28","£2.80"],["Ulster Folk Tales","15/06/2026","136","£13.60"],["Learn Access in a Week","10/01/2026","292","£20.00 (cap)"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,2],[2,3],[3,2],[3,3]]},"check":[{"q":"What does Is Null on ReturnDate select?","o":["Returned loans","Loans with a zero fine","Deleted loans","Loans not yet returned"],"a":3,"why":"An empty ReturnDate means the book is still out."},{"q":"In a totals query to count loans per month, which Total setting goes on LoanID?","o":["Group By","Count","Sum","Where"],"a":1,"why":"Count the loans; Group By the month."},{"q":"Why test an action query on a copy of the database?","o":["They run slower on the original","Copies are required by CCEA","They change or delete data permanently","Access blocks them otherwise"],"a":2,"why":"An update or delete cannot simply be undone."},{"q":"A loan was due 32 days ago. What fine does the IIf expression give?","o":["£3.20","£20.00","£0.32","£32.00"],"a":0,"why":"32 × 0.1 = 3.20, below the £20 cap."}],"exam":[],"practice":[{"q":"A library wants a query to list all loans made between two dates entered by the user. Describe how this query would be created.","m":3,"a":"Use tblLoan (and tblMember/tblBook for names) in Query Design (1) / add the criteria Between [Start date] And [End date] to LoanDate so the user is prompted for both dates (1) / sort by LoanDate and run, checking results against the data (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-basic-queries"}],"terms":[]},{"id":"c03-p04","spec":"Develop forms with validation, queries including parameter queries and calculated fields, reports and navigation","lessons":["AD04"],"summary":"Build forms from your wireframes: start with the wizard if you like, then rename controls, use combo boxes that store IDs, add a subform for related records, lock calculated controls and add command buttons.","blocks":[{"t":"p","text":"Forms are how staff use your system, so they carry much of the usability and validation. You may start a form with the Form Wizard, but then work in Layout and Design View to make it match your wireframe exactly, and say what you changed."},{"t":"h","text":"Rename every control first"},{"t":"p","text":"Before writing any code, rename controls with a prefix: `txt` text box, `cbo` combo box, `lst` list box, `cmd` command button, `lbl` label, `chk` check box, `sub` subform. Code full of Text14 and Command22 is unreadable, and renaming later breaks event procedures."},{"t":"h","text":"Useful form techniques"},{"t":"table","head":["Technique","Library use","How"],"rows":[["Combo box: pick by name, store the ID","cboMember shows Surname, Forename but stores MemberID","Row Source query with MemberID first; Bound Column 1; Column Widths 0cm;4cm; Limit To List = Yes"],["Main form with subform","frmMember shows the member with a list of their loans below","Drag frmLoanSub onto frmMember; Link Master/Child Fields = MemberID"],["Locked calculated control","txtDueDate cannot be typed in","Locked = Yes, Enabled = No or grey back colour"],["Default value","LoanDate is today","Default Value =Date()"],["Conditional formatting","Overdue loans shown in red in the subform","Format › Conditional Formatting: expression [DueDate]<Date() And IsNull([ReturnDate])"],["Tooltips","Hover help on every control","ControlTip Text property"],["Command buttons","Save, New, Close, Print","Command Button Wizard (embedded macro) or your own VBA in On Click"]]},{"t":"p","text":"A combo box that lists only available books is validation by design: the user simply cannot choose a book that is already on loan. Its Row Source might be:"},{"t":"code","lang":"sql","code":"SELECT BookID, Title FROM tblBook WHERE Status = \"Available\" ORDER BY Title;","title":"Row Source of cboBook"},{"t":"p","text":"After a loan is issued, the list must refresh, so the code runs `Me.cboBook.Requery`."},{"t":"warn","text":"Wizard-built forms left exactly as generated look identical across a class and show little of your own work. Customise the layout, controls and behaviour to match your design, and evidence the changes."},{"t":"key","title":"Key points","items":["Rename controls with prefixes before writing code.","Combo boxes show names but store IDs; Limit To List = Yes.","Subforms show related records (Link Master/Child Fields).","Lock calculated controls; add defaults, tooltips and conditional formatting."]}],"diagram":{"kind":"hotspot","title":"frmMember with its loans subform","caption":"Click each part of the finished form to see how it was built.","rows":[[{"label":"Header: Members","detail":"Same title style and colours as every other form, from the design.","span":3}],[{"label":"txtSurname","detail":"Bound to Surname. Required; Form_BeforeUpdate shows 'Enter the member's surname.' if blank.","span":1},{"label":"txtPostcode","detail":"Validation rule Like \"BT#* #[A-Z][A-Z]\" with custom Validation Text.","span":1},{"label":"cboMembershipType","detail":"Combo box from tblMembershipType; Limit To List = Yes.","span":1}],[{"label":"subLoans","detail":"Subform control holding frmLoanSub (datasheet). Link Master Fields and Link Child Fields = MemberID, so only this member's loans appear. Overdue rows turn red by conditional formatting.","span":3}],[{"label":"cmdNew","detail":"DoCmd.GoToRecord , , acNewRec","span":1},{"label":"cmdSave","detail":"DoCmd.RunCommand acCmdSaveRecord, then a confirmation message.","span":1},{"label":"cmdClose","detail":"DoCmd.Close acForm, Me.Name, then the main menu is shown.","span":1}]],"links":[["txtSurname","subLoans"],["cboMembershipType","subLoans"],["subLoans","cmdSave"]]},"check":[{"q":"A combo box shows member names but stores MemberID. Which property makes it store the ID?","o":["Column Widths","Limit To List","Default Value","Bound Column"],"a":3,"why":"The bound column is the value saved; Column Widths 0cm hides it."},{"q":"What links a subform to its main form?","o":["The Row Source","Link Master Fields and Link Child Fields","The Tab Order","Conditional formatting"],"a":1,"why":"These fields filter the subform to the main record's key."},{"q":"Why rename controls before writing code?","o":["Access requires it","It makes forms faster","Readable code, and event procedures are named after controls","To change the colour"],"a":2,"why":"cmdIssue_Click is meaningful; Command22_Click is not, and renaming later detaches the code."}],"exam":[],"practice":[{"q":"Describe two features that could be added to a library loan form to reduce data entry errors.","m":4,"a":"Combo box listing only available books (1) so a book already on loan cannot be chosen / the user picks rather than types the ID (1). Default value =Date() for the loan date (1) so the date is not mistyped (1). Also credit: locked calculated due date; validation rules with custom messages; Limit To List."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":[]},{"id":"c03-p05","spec":"Develop forms with validation, queries including parameter queries and calculated fields, reports and navigation","lessons":["AD04"],"summary":"Build reports with grouping, sorting and totals, a report for the current record only, then a main menu set as the start-up form, with the navigation pane hidden and an optional AutoExec macro.","blocks":[{"t":"h","text":"Reports"},{"t":"p","text":"Base each report on its designed query. The Report Wizard is a quick start; then use **Group, Sort and Total** (Design › Group & Sort) to add grouping, sorting and totals, and Design View to place calculated controls in the right sections. Evidence each report in Design View and Print Preview."},{"t":"p","text":"A useful report prints only the **current** record, for example a loan slip for the loan on screen. The button opens the report with a WHERE condition:"},{"t":"code","lang":"ps","code":"Private Sub cmdPrintSlip_Click()\n    ' UR8: print a loan slip for this loan only\n    DoCmd.RunCommand acCmdSaveRecord\n    DoCmd.OpenReport \"rptLoanSlip\", acViewPreview, , \"LoanID = \" & Me.LoanID\nEnd Sub","title":"VBA: open a report filtered to the current record"},{"t":"h","text":"The main menu"},{"t":"p","text":"Build frmMainMenu as an unbound form with a command button for every module of your structure diagram. The Command Button Wizard creates buttons with embedded macros; writing your own VBA gives more control and better evidence."},{"t":"h","text":"Start-up options"},{"t":"list","items":["File › Options › Current Database › **Display Form**: frmLogin (or frmMainMenu).","Untick **Display Navigation Pane** so staff cannot open tables directly.","Set an **Application Title** and icon so the window shows the system's name.","Optionally create a macro named **AutoExec**, which runs automatically when the database opens."],"ordered":false},{"t":"note","text":"Holding Shift while opening the file bypasses the start-up options. That is how you (and the moderator) get back into design. Mention it in your technical notes; do not hide it from your teacher."},{"t":"warn","text":"Do not submit a database the moderator cannot open. CCEA moderators' reports ask centres not to submit password-protected databases; if you have a login form, give the test usernames and passwords in a separate text file as your centre instructs."},{"t":"key","title":"Key points","items":["Reports: grouping, sorting, totals; evidence in Design View and Print Preview.","OpenReport with a WHERE condition prints just the current record.","Main menu as start-up form; navigation pane hidden; AutoExec optional.","Never lock the moderator out."]}],"diagram":{"kind":"hotspot","title":"Navigation map as built","caption":"Click each object to see how users reach it. Lines are the navigation paths.","rows":[[{"label":"frmLogin","detail":"Start-up form (Display Form). Checks username and password, then opens the menu.","span":3}],[{"label":"frmMainMenu","detail":"Unbound form, one button per module. The navigation pane is hidden, so this is the only way in.","span":3}],[{"label":"frmMember","detail":"Members module: add, edit and search members, with the loans subform.","span":1},{"label":"frmIssueLoan","detail":"Loans module: issue a loan (VBA checks the limit).","span":1},{"label":"frmReportsMenu","detail":"Buttons for each report, some with parameters.","span":1}],[{"label":"frmReturn","detail":"Return a book and calculate the fine.","span":1},{"label":"rptLoanSlip","detail":"Opened from frmIssueLoan with a WHERE condition for the current loan.","span":1},{"label":"rptOverdueLetters","detail":"Opened from frmReportsMenu in Print Preview.","span":1}]],"links":[["frmLogin","frmMainMenu"],["frmMainMenu","frmMember"],["frmMainMenu","frmIssueLoan"],["frmMainMenu","frmReportsMenu"],["frmMainMenu","frmReturn"],["frmIssueLoan","rptLoanSlip"],["frmReportsMenu","rptOverdueLetters"]]},"check":[{"q":"How do you make a form open automatically when the database starts?","o":["File › Options › Current Database › Display Form","Name it Startup","Put it first in the navigation pane","Use a totals query"],"a":0,"why":"Display Form sets the start-up form."},{"q":"What does the WHERE condition in DoCmd.OpenReport do?","o":["Sorts the report","Prints it twice","Opens it in design view","Filters the report, e.g. to the current loan"],"a":3,"why":"\"LoanID = \" & Me.LoanID limits it to one loan."},{"q":"What does a macro named AutoExec do?","o":["Runs every hour","Runs when the database opens","Compacts the database","Exports a PDF"],"a":1,"why":"Access runs AutoExec at start-up."}],"exam":[],"practice":[{"q":"Describe how a developer can stop users opening tables directly while still letting them use the system.","m":3,"a":"Create a main menu form with buttons to every form and report (1) / set it (or a login form) as the Display Form in Current Database options (1) / untick Display Navigation Pane so tables are hidden (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":[]},{"id":"c03-p06","spec":"Use macros or code to automate processing and improve usability","lessons":["AD04"],"summary":"VBA code lives in event procedures behind forms; start every module with Option Explicit, declare variables with types, use Me to reach controls, Nz to handle empty values and MsgBox to talk to the user.","blocks":[{"t":"p","text":"Macros automate simple actions; **VBA** (Visual Basic for Applications) lets you write real logic with decisions, calculations and updates. Most of your code will be [[event procedures|Event procedure]]: subroutines that run when something happens on a form, such as a button click or a value changing."},{"t":"h","text":"Getting started"},{"t":"list","items":["Save the database in a **trusted location** (File › Options › Trust Center) or click **Enable Content**, or no code will run.","Open the VBA editor with Alt + F11, or from a control's Property Sheet › Event › On Click › [...] › Code Builder.","Put `Option Explicit` at the top of every module (Tools › Options › Require Variable Declaration adds it automatically). It forces you to declare every variable, so a typing mistake becomes a compile error instead of a silent bug."],"ordered":false},{"t":"code","lang":"ps","code":"Option Compare Database\nOption Explicit\n\n' Shows how many books the chosen member has out (UR5 support)\nPrivate Sub cboMember_AfterUpdate()\n    Dim lngOut As Long\n\n    lngOut = DCount(\"*\", \"tblLoan\", _\n        \"MemberID = \" & Nz(Me.cboMember, 0) & \" AND ReturnDate Is Null\")\n    Me.txtBooksOut = lngOut\n\n    If lngOut >= 5 Then\n        MsgBox \"This member has \" & lngOut & \" books out (limit 6).\", _\n            vbInformation, \"Loan limit\"\n    End If\nEnd Sub","title":"VBA: an After Update event procedure"},{"t":"h","text":"The essentials"},{"t":"table","head":["Item","Meaning"],"rows":[["`Dim curFine As Currency`","Declare a variable with a type: Long, Integer, Double, Currency, String, Date, Boolean, Variant"],["`Me.txtSurname`","A control on the form the code belongs to"],["`Nz(Me.cboMember, 0)`","Use 0 (or \"\") if the control is empty (Null), avoiding errors"],["`CLng`, `CCur`, `CDate`","Convert a value to a type"],["`MsgBox \"text\", vbExclamation, \"Title\"`","Show a message; vbYesNo returns the button clicked"],["`' comment`","An apostrophe starts a comment"],["`_` at line end","Continue a statement on the next line"]]},{"t":"warn","text":"Null is not the same as zero or an empty string. A test such as `If Me.txtReturnDate = Null` is never true; use `IsNull(Me.txtReturnDate)` or `Nz`."},{"t":"key","title":"Key points","items":["Trusted location or Enable Content, or code will not run.","Option Explicit in every module; declare variables with types.","Event procedures are named Control_Event, e.g. cmdIssue_Click.","Me for controls, Nz and IsNull for empty values, MsgBox for messages."]}],"diagram":{"kind":"flow","direction":"tb","title":"When form events fire","caption":"Step through the order of events as a form opens, a value is edited and the record is saved. Choosing the right event is half the battle.","nodes":[{"id":"o","label":"Form opens: Open → Load","shape":"start","detail":"Open can be cancelled (e.g. if the user's role is wrong). Load is good for setting up defaults."},{"id":"c","label":"Current","shape":"process","detail":"Fires each time a record becomes current: recalculate displayed values here."},{"id":"e","label":"User edits a control","shape":"io","detail":"Typing or choosing a value."},{"id":"cb","label":"Control BeforeUpdate","shape":"decision","detail":"Check the single value; set Cancel = True to reject it."},{"id":"ca","label":"Control AfterUpdate","shape":"process","detail":"The value is accepted: recalculate dependent controls (e.g. the fine)."},{"id":"fb","label":"Form BeforeUpdate","shape":"decision","detail":"Before the record is saved: check the whole record; Cancel = True stops the save."},{"id":"fa","label":"Form AfterUpdate","shape":"store","detail":"The record has been saved to the table."},{"id":"x","label":"Unload → Close","shape":"end","detail":"Form closes; Unload can be cancelled to stop closing."}],"edges":[["o","c"],["c","e"],["e","cb"],["cb","e","cancel"],["cb","ca","ok"],["ca","fb"],["fb","e","cancel"],["fb","fa","ok"],["fa","x"]]},"check":[{"q":"What does Option Explicit do?","o":["Speeds up code","Makes code case-sensitive","Forces every variable to be declared","Turns on error handling"],"a":2,"why":"Undeclared or misspelt variables become compile errors."},{"q":"Which test correctly checks whether a return date is empty?","o":["If IsNull(Me.txtReturnDate)","If Me.txtReturnDate = Null","If Me.txtReturnDate = 0","If Me.txtReturnDate = \"Null\""],"a":0,"why":"Comparisons with Null are never true; use IsNull."},{"q":"Which event should recalculate the fine after a return date is entered?","o":["Form Open","Form Unload","cmdClose Click","txtReturnDate AfterUpdate"],"a":3,"why":"AfterUpdate fires once the new value is accepted."},{"q":"What does Nz(Me.cboMember, 0) return if no member is chosen?","o":["Null","0","An error","\"\""],"a":1,"why":"Nz replaces Null with the value given."}],"exam":[],"practice":[{"q":"Explain why the statement Option Explicit should be used at the top of every VBA module.","m":2,"a":"It forces all variables to be declared before use (1), so misspelt variable names are caught as compile errors rather than creating new empty variables that cause hard-to-find bugs (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Event procedure"]},{"id":"c03-p07","spec":"Use macros or code to automate processing and improve usability","lessons":["AD04"],"summary":"Use code where table rules cannot reach: Form_BeforeUpdate to check a whole record and cancel the save, If and Select Case for decisions, and DLookup, DCount and DSum to look things up in tables.","blocks":[{"t":"h","text":"Validation in code"},{"t":"p","text":"Some checks are impossible in a table rule: an email pattern on an optional field, or a limit that depends on other records. The form's **Before Update** event runs just before a record is saved; setting `Cancel = True` stops the save."},{"t":"code","lang":"ps","code":"' UR1: check member details before saving\nPrivate Sub Form_BeforeUpdate(Cancel As Integer)\n    If Len(Nz(Me.txtSurname, \"\")) = 0 Then\n        MsgBox \"Enter the member's surname.\", vbExclamation, \"Member\"\n        Me.txtSurname.SetFocus\n        Cancel = True\n        Exit Sub\n    End If\n\n    ' Email is optional, but if given it must look like an address\n    If Len(Nz(Me.txtEmail, \"\")) > 0 Then\n        If Not (Me.txtEmail Like \"*?@?*.?*\") Then\n            MsgBox \"Enter an email such as name@example.com\", vbExclamation, \"Member\"\n            Me.txtEmail.SetFocus\n            Cancel = True\n        End If\n    End If\nEnd Sub","title":"VBA: Form_BeforeUpdate on frmMember"},{"t":"h","text":"Decisions: If and Select Case"},{"t":"code","lang":"ps","code":"' Chooses the wording of an overdue reminder\nPrivate Function ReminderLevel(ByVal daysLate As Long) As String\n    Select Case daysLate\n        Case Is <= 0\n            ReminderLevel = \"Not overdue\"\n        Case 1 To 7\n            ReminderLevel = \"First reminder\"\n        Case 8 To 28\n            ReminderLevel = \"Second reminder\"\n        Case Else\n            ReminderLevel = \"Final notice\"\n    End Select\nEnd Function","title":"VBA: Select Case with ranges"},{"t":"h","text":"Domain functions"},{"t":"table","head":["Function","Returns","Library example"],"rows":[["`DLookup(\"Status\", \"tblBook\", \"BookID = \" & Me.cboBook)`","One value from a table (or Null)","The chosen book's status"],["`DCount(\"*\", \"tblLoan\", \"MemberID = \" & Me.cboMember & \" AND ReturnDate Is Null\")`","How many records match","Books the member has out"],["`DSum(\"Fine\", \"tblLoan\", \"MemberID = \" & Me.cboMember)`","Total of a field (or Null)","Fines the member has paid"]]},{"t":"p","text":"The third argument is a criteria string. Numbers are joined straight in; **text needs single quotes**: `\"Surname = '\" & Me.txtSurname & \"'\"`; dates need # and US order: `\"LoanDate = #\" & Format(Me.txtDate, \"mm/dd/yyyy\") & \"#\"`."},{"t":"warn","text":"Writing `ReturnDate = Null` in a criteria string never matches anything; use `ReturnDate Is Null`. This exact slip is a common cause of a failed limit test."},{"t":"key","title":"Key points","items":["Form_BeforeUpdate + Cancel = True stops a bad record being saved.","Select Case handles ranges neatly; If…ElseIf for mixed conditions.","DLookup, DCount, DSum read tables from code; wrap with Nz.","Criteria strings: numbers bare, text in single quotes, dates in # (mm/dd/yyyy)."]}],"diagram":{"kind":"table-reveal","title":"Trace ReminderLevel","caption":"Work out the value returned for each input before revealing.","head":["daysLate","Case matched","Returned"],"rows":[["0","Is <= 0","Not overdue"],["1","1 To 7","First reminder"],["7","1 To 7","First reminder"],["8","8 To 28","Second reminder"],["29","Case Else","Final notice"]],"hidden":[[0,2],[1,1],[1,2],[2,2],[3,2],[4,1],[4,2]]},"check":[{"q":"What does Cancel = True do in Form_BeforeUpdate?","o":["Closes the form","Deletes the record","Stops the record being saved","Undoes all edits since opening"],"a":2,"why":"The save is cancelled and the user stays on the record to correct it."},{"q":"Which criteria string is correct for a text field?","o":["\"Surname = '\" & Me.txtSurname & \"'\"","\"Surname = \" & Me.txtSurname","\"Surname = #\" & Me.txtSurname & \"#\"","Surname = Me.txtSurname"],"a":0,"why":"Text values must be enclosed in quotes in the criteria."},{"q":"What does DLookup return if nothing matches?","o":["0","An empty string","An error","Null"],"a":3,"why":"Use Nz around it if you need a default."}],"exam":[],"practice":[{"q":"Write VBA for the Before Update event of a form that prevents the record being saved if the Surname text box is empty, displaying a suitable message.","m":4,"a":"Private Sub Form_BeforeUpdate(Cancel As Integer) (1) / If IsNull(Me.txtSurname) or Len(Nz(Me.txtSurname,\"\")) = 0 Then (1) / MsgBox with a clear message (1) / Cancel = True (and SetFocus), End If, End Sub (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":[]},{"id":"c03-p08","spec":"Use macros or code to automate processing and improve usability","lessons":["AD04"],"summary":"Use DoCmd to open, save and close; CurrentDb.Execute to run SQL updates; recordsets to loop through records; a login form with attempts and roles; and On Error GoTo so users never land in the VBA editor.","blocks":[{"t":"h","text":"Saving, updating and error handling together"},{"t":"code","lang":"ps","code":"' UR4, UR5: issue a loan if the member is under the 6-book limit\nPrivate Sub cmdIssue_Click()\n    On Error GoTo ErrHandler\n    Dim lngOut As Long\n\n    If IsNull(Me.cboMember) Or IsNull(Me.cboBook) Then\n        MsgBox \"Choose a member and a book.\", vbExclamation, \"Missing details\"\n        Exit Sub\n    End If\n\n    lngOut = DCount(\"*\", \"tblLoan\", _\n        \"MemberID = \" & Me.cboMember & \" AND ReturnDate Is Null\")\n    If lngOut >= 6 Then\n        MsgBox \"This member already has 6 books out.\", vbExclamation, \"Limit reached\"\n        Exit Sub\n    End If\n\n    Me.txtDueDate = DateAdd(\"d\", 21, Me.txtLoanDate)\n    DoCmd.RunCommand acCmdSaveRecord\n\n    CurrentDb.Execute \"UPDATE tblBook SET Status = 'On loan' \" & _\n        \"WHERE BookID = \" & Me.cboBook, dbFailOnError\n    Me.cboBook.Requery\n\n    MsgBox \"Loan saved. Due back on \" & Format(Me.txtDueDate, \"dd/mm/yyyy\") & \".\", _\n        vbInformation, \"Loan issued\"\n    Exit Sub\n\nErrHandler:\n    MsgBox \"The loan could not be saved (\" & Err.Number & \"): \" & Err.Description, _\n        vbCritical, \"Error\"\nEnd Sub","title":"VBA: cmdIssue_Click, built from the design pseudocode"},{"t":"p","text":"`On Error GoTo ErrHandler` sends any run-time error to your own handler, which shows a clear message instead of dropping the user into the editor. `dbFailOnError` makes a failed SQL statement raise an error you can trap."},{"t":"h","text":"A login form"},{"t":"code","lang":"ps","code":"Private intAttempts As Integer   ' kept while frmLogin is open\n\n' UR14: only staff with a valid username and password can continue\nPrivate Sub cmdLogin_Click()\n    Dim varRole As Variant\n\n    varRole = DLookup(\"Role\", \"tblStaff\", _\n        \"Username = '\" & Replace(Nz(Me.txtUser, \"\"), \"'\", \"''\") & _\n        \"' AND Pwd = '\" & Replace(Nz(Me.txtPassword, \"\"), \"'\", \"''\") & \"'\")\n\n    If IsNull(varRole) Then\n        intAttempts = intAttempts + 1\n        If intAttempts >= 3 Then\n            MsgBox \"Too many failed attempts. The system will close.\", vbCritical, \"Log in\"\n            DoCmd.Quit\n        Else\n            MsgBox \"Username or password not recognised. \" & (3 - intAttempts) & _\n                \" attempt(s) left.\", vbExclamation, \"Log in\"\n            Me.txtPassword = Null\n            Me.txtPassword.SetFocus\n        End If\n    Else\n        TempVars.Add \"UserRole\", varRole     ' e.g. hide admin buttons for volunteers\n        DoCmd.OpenForm \"frmMainMenu\"\n        DoCmd.Close acForm, Me.Name\n    End If\nEnd Sub","title":"VBA: login with three attempts and a role"},{"t":"note","text":"This compares passwords as stored text, and Access text comparisons ignore case. A real system would store a hashed password; say so as a limitation in your evaluation. The field is called Pwd because PASSWORD is a reserved word in Access SQL."},{"t":"h","text":"Looping through records"},{"t":"code","lang":"ps","code":"' Counts members who have at least one overdue book\nPrivate Function CountMembersOverdue() As Long\n    Dim rs As DAO.Recordset\n    Dim n As Long\n    Set rs = CurrentDb.OpenRecordset( _\n        \"SELECT DISTINCT MemberID FROM tblLoan \" & _\n        \"WHERE DueDate < Date() AND ReturnDate Is Null\", dbOpenSnapshot)\n    Do While Not rs.EOF\n        n = n + 1\n        rs.MoveNext\n    Loop\n    rs.Close\n    Set rs = Nothing\n    CountMembersOverdue = n\nEnd Function","title":"VBA: a DAO recordset loop"},{"t":"h","text":"Debugging"},{"t":"p","text":"Click in the grey margin to set a **breakpoint**, then press F8 to step through line by line. Hover over a variable to see its value, or type `? lngOut` in the **Immediate window** (Ctrl + G). `Debug.Print` writes values there while the code runs."},{"t":"key","title":"Key points","items":["DoCmd: OpenForm, OpenReport, RunCommand acCmdSaveRecord, Close, Quit.","CurrentDb.Execute \"SQL\", dbFailOnError runs update, insert and delete statements.","On Error GoTo + a handler in every procedure that saves or changes data.","Breakpoints, F8 and the Immediate window find logic errors."]}],"diagram":{"kind":"flow","direction":"tb","title":"The login algorithm","caption":"Step through a failed and a successful login. The attempt counter is a module-level variable, so it survives between clicks.","nodes":[{"id":"s","label":"Click Log in","shape":"start","detail":"cmdLogin_Click runs."},{"id":"l","label":"Look up Role for username + password","shape":"store","detail":"DLookup on tblStaff; Null means no matching staff record."},{"id":"d","label":"Role found?","shape":"decision","detail":"Null = wrong username or password."},{"id":"i","label":"attempts ← attempts + 1","shape":"process","detail":"Module-level counter."},{"id":"d2","label":"attempts >= 3?","shape":"decision","detail":"Three failures close the system."},{"id":"q","label":"Message, then DoCmd.Quit","shape":"end","detail":"Access closes."},{"id":"m","label":"Message: n attempts left; clear password","shape":"io","detail":"User can try again."},{"id":"ok","label":"Store role, open menu, close login","shape":"end","detail":"TempVars holds the role so the menu can hide admin buttons."}],"edges":[["s","l"],["l","d"],["d","ok","yes"],["d","i","no"],["i","d2"],["d2","q","yes"],["d2","m","no"],["m","s","retry"]]},"check":[{"q":"What does dbFailOnError do in CurrentDb.Execute?","o":["Ignores errors","Raises a trappable error if the SQL fails","Undoes the last change","Logs the user out"],"a":1,"why":"Without it, a failed update can fail silently."},{"q":"Why use On Error GoTo in procedures that save data?","o":["It speeds them up","It is required by Access","Users see a clear message instead of the VBA editor","It prevents all errors"],"a":2,"why":"Error handling traps run-time errors gracefully."},{"q":"Why is intAttempts declared at the top of the form module, not inside cmdLogin_Click?","o":["So it keeps its value between clicks","To make it public","Access requires it","To save memory"],"a":0,"why":"A local variable would reset to 0 each click."},{"q":"Which key steps through code one line at a time?","o":["F5","F11","Ctrl + G","F8"],"a":3,"why":"F8 steps; F5 runs; Ctrl + G opens the Immediate window."}],"exam":[],"practice":[{"q":"Describe how error handling should be used in a VBA procedure that saves a record.","m":3,"a":"Start with On Error GoTo a labelled handler (1) / Exit Sub before the handler so it only runs when an error occurs (1) / the handler shows a user-friendly message using Err.Number/Err.Description (and may log it) instead of a crash into the editor (1)."},{"q":"Explain why a counter of failed login attempts must be declared outside the click event procedure.","m":2,"a":"Variables declared inside a procedure are reset each time it runs (1), so a module-level variable is needed for the count to persist across clicks and reach the limit of three (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":[]},{"id":"c03-p09","spec":"Provide annotated evidence of the development of the solution","lessons":["AD04","AD06"],"summary":"Show that you built what you designed: cropped, captioned, annotated screenshots of every object in design view and in use, all VBA commented, and every change from the design explained.","blocks":[{"t":"p","text":"The moderator assesses your write-up, not your database, so a feature that is not evidenced will not be credited. Show both the **set-up** (Design View, the property sheet, SQL, the code) and the **outcome** (the form in use, the query results, the report in Print Preview)."},{"t":"table","head":["Object","Evidence to include"],"rows":[["Tables","Design View of each, with field properties (validation, masks, defaults) visible"],["Relationships","The Relationships window with referential integrity symbols"],["Queries","Design or SQL View plus results, with the UR met"],["Forms","Design View and Form View; property sheet for key controls"],["Reports","Design View and Print Preview"],["Macros and VBA","All code, commented, with the form, event and UR it meets"],["Start-up","Current Database options; the menu as the first screen"]]},{"t":"h","text":"Annotated screenshots"},{"t":"p","text":"An [[Annotated screenshot]] is cropped to the relevant part, readable at normal zoom, marked with arrows or numbered callouts on the key settings, and captioned with a figure number, the requirement and the design item. Use Windows + Shift + S to clip just the part you need, then Picture Format › Crop in Word."},{"t":"compare","head":["Weak evidence","Strong evidence"],"rows":[["Screenshot","Full screen, unreadable property sheet","Cropped to the property sheet, callout on Validation Rule"],["Caption","None","Figure 31: tblLoan.Fine validation (UR7, data dictionary row 5)"],["Commentary","\"I added validation.\"","\"Validation rule Between 0 And 20 with my custom message, as designed, so a fine can never exceed the library's £20 cap.\""],["Changes","Silently different from the design","\"I added txtBooksOut, not in the design, so staff see the limit coming. See Figure 40.\""]]},{"t":"h","text":"Portfolio-ready code"},{"t":"list","items":["Every procedure starts with a comment saying what it does and which UR it meets.","Meaningful names (cmdIssue, lngOut, curFine) and consistent indentation.","Option Explicit and error handling visible.","Paste code as text in a monospace font (or a clear screenshot), never as a blurry image."],"ordered":false},{"t":"note","text":"Moderators' reports note that stronger candidates also discuss implementation: installing the system, converting existing records (legacy data), training staff and the changeover method. See the implementation page in Chapter 5."},{"t":"key","title":"Key points","items":["Set-up and outcome for every object.","Cropped, readable, annotated, captioned (figure number + UR + design item).","Explain why, not just what; justify every change from the design.","Commented, well-named VBA with Option Explicit and error handling."]},{"t":"tip","text":"Capture evidence as you build, not at the end. A failed attempt and the fix, captured at the time, is good evidence of iterative development."}],"diagram":{"kind":"compare","title":"One feature, three levels of evidence","caption":"Toggle between the levels for the same feature: the 6-book limit.","states":[{"label":"Not credited","points":["Feature works in the database","No screenshot or code in the write-up","The moderator cannot see it, so it earns nothing"],"art":null},{"label":"Weak","points":["Full-screen screenshot of frmIssueLoan","Caption: 'Issue loan form'","No code, no link to UR5 or the design"],"art":null},{"label":"Strong","points":["Commented cmdIssue_Click code, matching the pseudocode","Cropped screenshot of the 'already has 6 books out' message","Captions link to UR5, design item V1 and test T5","Comment explains a change from the design and why"],"art":null}]},"check":[{"q":"Why must development be evidenced in the write-up?","o":["To make it longer","The moderator assesses the portfolio, not the running database","CCEA cannot open Access files","It isn't necessary"],"a":1,"why":"Unevidenced features cannot be credited."},{"q":"Which caption is best?","o":["Screenshot 4","Form","Figure 31: tblLoan.Fine validation rule (UR7, data dictionary row 5)","My table"],"a":2,"why":"It names what it shows and links to the requirement and design."},{"q":"What should you do if your build differs from your design?","o":["Keep the design and explain the change and the reason","Change the design to match","Hide the difference","Rebuild to match"],"a":0,"why":"Justified changes are normal and creditworthy."}],"exam":[],"practice":[{"q":"Describe two features of a good annotated screenshot in a development section.","m":4,"a":"Cropped to the relevant part and readable at normal zoom (1) so the moderator can see the setting without zooming (1). Captioned with a figure number and the requirement/design item it evidences (1) so it can be cross-referenced in testing and evaluation (1). Also credit: callouts highlighting the key setting; explanation of why."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Annotated screenshot"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]}},{"id":"c04","n":4,"title":"Testing","intro":"How to plan and carry out testing for the write-up: strategy and test plan, choosing valid, extreme and invalid data, unit, integration and system testing with evidence, corrective action, and user acceptance testing.","pages":[{"id":"c04-p01","spec":"Produce a test plan mapped to the requirements using valid, invalid and extreme (boundary) data","lessons":["AD05"],"summary":"Plan testing before you test: a short strategy (unit, integration, system, acceptance) and a numbered test plan in which every requirement has tests with precise test data and expected results.","blocks":[{"t":"p","text":"Testing proves two things: that every requirement works, and that the system rejects data it should not accept. It is planned **before** you test, from your requirements and design, so that the expected results are honest predictions rather than descriptions of what happened."},{"t":"h","text":"A testing strategy"},{"t":"p","text":"Start with a short [[Test strategy]] explaining how *your* system will be tested at each level:"},{"t":"table","head":["Level","What is tested","Library example"],"rows":[["[[Unit testing]]","Each part on its own","The Fine validation rule; the fine calculation; one query; one button"],["[[Integration testing]]","Parts working together","Issuing a loan on the form updates tblLoan and tblBook and appears in qryOverdueLoans"],["[[System testing]]","The whole system against the requirements","A librarian's full Saturday routine: log in, issue, return, print overdue letters"],["[[User acceptance testing]]","The client confirms it meets their needs","The librarian (or someone acting as the client) carries out set tasks"]]},{"t":"h","text":"The test plan"},{"t":"p","text":"A [[Test plan]] lists each test with a number, the requirement it covers, its purpose, the test data, the type of data and the [[Expected result]]. Columns for actual result, pass or fail and evidence reference are filled in during testing."},{"t":"table","head":["No.","UR","Purpose","Test data","Type","Expected result"],"rows":[["T1","UR7","Fine field accepts a normal value","5.00","Valid","Accepted"],["T2","UR7","Fine field upper boundary","20.00","Extreme","Accepted"],["T3","UR7","Fine field just above the boundary","20.01","Invalid","Rejected: \"Fines must be between £0 and £20.\""],["T4","UR5","Loan limit: member with 5 books out","Member M0012 (5 out)","Extreme","Loan saved; message \"Loan saved. Due back on …\""],["T5","UR5","Loan limit: member with 6 books out","Member M0007 (6 out)","Invalid","Refused: \"This member already has 6 books out.\""],["T6","UR3","Parameter search by part of surname","\"rob\"","Valid","Lists Robinson and Robb only"],["T7","UR14","Login with wrong password","staff1 / wrongpass","Invalid","\"Username or password not recognised. 2 attempt(s) left.\""]],"caption":"Part of the library test plan, written before testing."},{"t":"warn","text":"A common weakness is testing only validation. Test calculations, queries, reports, navigation, security and non-functional requirements too, and quote exact messages in the expected result: \"error message\" is weaker than the message itself."},{"t":"key","title":"Key points","items":["Strategy: unit, integration, system and acceptance testing, applied to your system.","Plan columns: test no., UR, purpose, test data, type, expected result (then actual, pass/fail, evidence).","Every UR covered by at least one test; tests numbered for cross-referencing.","Write expected results before testing."]},{"t":"tip","text":"Moderators' reports say test plans should be detailed and closely linked to the user requirements, and that vague requirements lead to poorly structured testing. A UR column in your plan makes the link visible."}],"diagram":{"kind":"layers","title":"Levels of testing","caption":"Click each level. Each one builds on the one below; acceptance testing is the client's final check.","items":[{"label":"User acceptance testing","detail":"The client or an end user carries out realistic tasks and confirms the system meets their needs. Feedback recorded."},{"label":"System testing","detail":"The whole system tested against every requirement with realistic volumes of data, including non-functional requirements."},{"label":"Integration testing","detail":"Data followed through several objects: form → table → query → report. Do the parts work together?"},{"label":"Unit testing","detail":"Every validation rule, input mask, calculated field, query, button and VBA procedure tested on its own."}]},"check":[{"q":"When should the expected results in a test plan be written?","o":["After testing","During the evaluation","Before testing","Only for failed tests"],"a":2,"why":"Expected results are predictions from the design; writing them afterwards is not testing."},{"q":"Which is an integration test?","o":["Checking an issued loan appears correctly in the overdue report","Testing the Fine validation rule alone","The client trying the system","Checking a field size"],"a":0,"why":"It follows data through several objects."},{"q":"Which expected result is best?","o":["Error","It works","Fine","Rejected with \"Fines must be between £0 and £20.\""],"a":3,"why":"Precise, quoting the exact message."}],"exam":[],"practice":[{"q":"State four columns that should appear in a test plan.","m":4,"a":"Any four: test number (1) / requirement tested (1) / purpose or description (1) / test data (1) / type of data: valid, extreme, invalid (1) / expected result (1) / actual result (1) / evidence reference (1)."},{"q":"Explain why a test plan should be mapped to the numbered requirements.","m":2,"a":"It shows every requirement has been tested / none is missed (1), and the test results can then be used as evidence in the evaluation of each requirement (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Test strategy","Test plan","Expected result","Unit testing","Integration testing","System testing","User acceptance testing"]},{"id":"c04-p02","spec":"Produce a test plan mapped to the requirements using valid, invalid and extreme (boundary) data","lessons":["AD05"],"summary":"For every rule, choose valid (normal) data, extreme (boundary) data at the edges of the range, and invalid (erroneous) data including values just outside the range, wrong types and blanks.","blocks":[{"t":"p","text":"Tests that always pass prove little. For every validation rule and calculation, pick test data of three kinds:"},{"t":"list","items":["[[Valid data]] (normal): typical data that should be accepted, e.g. a fine of £5.00.","[[Extreme data]] (boundary): data at the very edges of the acceptable range, which should still be accepted, e.g. £0.00 and £20.00.","[[Invalid data]] (erroneous): data that should be rejected: just outside the range (£20.01, −£0.01), the wrong type (\"abc\") or missing when required (blank)."],"ordered":false},{"t":"p","text":"The values *just outside* each boundary matter most, because off-by-one mistakes (`>` instead of `>=`) hide there."},{"t":"table","head":["Field / rule","Valid","Extreme","Invalid"],"rows":[["Fine: Between 0 And 20","5.00, 12.50","0.00, 20.00","20.01, -0.01, abc"],["LoanDate: <=Date()","Last week","Today","Tomorrow, 31/02/2026"],["Loan limit: fewer than 6 out","Member with 2 out","Member with 5 out","Member with 6 out"],["Postcode: Like \"BT#* #[A-Z][A-Z]\"","BT74 7AB","BT1 1AA (shortest)","74BT 7AB, blank if required"],["Surname: Required, 30 chars","Robinson","30-character name","Blank; 31 characters (cannot be typed)"]]},{"t":"example","title":"Worked example: testing the fine calculation","steps":["Rule: 10p per day late, capped at £20. The cap is reached at 20 ÷ 0.10 = 200 days.","Valid: 10 days late → £1.00.","Extreme: 0 days late (returned on the due date) → £0.00; 1 day late → £0.10.","Extreme: exactly 200 days late → £20.00 (the cap reached exactly).","Just beyond the cap: 201 days late → still £20.00 (the cap applies).","Early return: −3 days → £0.00, not a negative fine."],"context":"Pick the test data for UR7.","answer":"Six tests (T8 to T13) cover every path through the fine algorithm."},{"t":"note","text":"Exam boards use different names: normal / valid; boundary / extreme; erroneous / invalid. Use one set consistently in your write-up and say what each means."},{"t":"key","title":"Key points","items":["Valid = typical, accepted. Extreme = at the edges, accepted. Invalid = should be rejected.","Test both boundaries and the values just outside them.","Include wrong types and blanks for required fields.","Test calculations at their decision points (e.g. the 200-day cap)."]}],"diagram":{"kind":"table-reveal","title":"Predict the fine for each test","caption":"10p per day late, capped at £20. Work out each fine before revealing.","head":["Test","Days late","Type","Expected fine"],"rows":[["T8","10","Valid","£1.00"],["T9","0","Extreme","£0.00"],["T10","1","Extreme","£0.10"],["T11","200","Extreme","£20.00"],["T12","201","Beyond the cap","£20.00"],["T13","-3 (returned early)","Valid","£0.00"]],"hidden":[[0,3],[1,3],[2,3],[3,3],[4,3],[5,3]]},"check":[{"q":"Fine must be Between 0 And 20. Which is extreme data?","o":["5.00","20.00","20.01","abc"],"a":1,"why":"20.00 is on the boundary and should be accepted."},{"q":"Which is invalid data for the same rule?","o":["0.00","12.50","-0.01","20.00"],"a":2,"why":"-0.01 is just below the lower boundary and should be rejected."},{"q":"Why test values just outside a boundary?","o":["Off-by-one errors such as > instead of >= show up there","They always pass","They are easier to type","CCEA requires exactly two"],"a":0,"why":"Boundary mistakes only appear at the edges."},{"q":"For the 6-book limit, which member is extreme (boundary) data that should be accepted?","o":["0 books out","6 books out","10 books out","5 books out"],"a":3,"why":"With 5 out, a sixth loan is the last one allowed."}],"exam":[],"practice":[{"q":"A Days field must hold a whole number from 1 to 14. Give one example each of valid, extreme and invalid test data.","m":3,"a":"Valid: e.g. 7 (1). Extreme: 1 or 14 (1). Invalid: e.g. 0, 15, -3 or abc (1)."},{"q":"Evaluate the importance of testing with extreme and invalid data, as well as valid data, in a database application.","m":6,"a":"Valid data only shows the normal path works (1). Extreme data checks the boundaries are set correctly, e.g. >= versus > (1). Invalid data shows bad data is rejected, protecting data integrity (1) and that helpful error messages appear (1). Without them, errors may only appear in use, causing wrong fines or corrupted records (1). Judgement: all three are needed for confidence that each requirement is fully met (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Valid data","Extreme data","Invalid data"]},{"id":"c04-p03","spec":"Carry out testing with annotated evidence of results, corrective action and retesting","lessons":["AD05"],"summary":"Run each planned unit test, record the actual result and pass or fail, and evidence every test with a captioned screenshot cross-referenced by test number.","blocks":[{"t":"p","text":"Unit testing checks each part of the system on its own: every validation rule, input mask and default, every calculated field and query, every button and VBA procedure. Run each test exactly as planned and record what actually happened."},{"t":"table","head":["No.","Actual result","Pass/Fail","Evidence"],"rows":[["T1","5.00 accepted","Pass","Figure 52"],["T2","20.00 accepted","Pass","Figure 53"],["T3","Rejected with \"Fines must be between £0 and £20.\"","Pass","Figure 54"],["T4","Loan saved; due date 21 days later","Pass","Figure 55"],["T5","Loan was saved: limit not enforced","Fail","Figure 56 → see C1"],["T6","Robinson and Robb listed","Pass","Figure 57"]],"caption":"Results columns completed during testing (continuing the test plan)."},{"t":"h","text":"Evidence for each test"},{"t":"list","items":["A screenshot showing the **data entered** and the **result** (the accepted record, the error message, the query output).","A caption with the test number: *Figure 54: T3, Fine 20.01 rejected*.","For queries, check the result against the data by hand and say so (\"three loans due on 12/11/2026, matching tblLoan\").","For calculations, show the input and the output side by side."],"ordered":false},{"t":"p","text":"Group several small tests on one page where you can: a cropped screenshot per test, two to a row, keeps the section readable without losing evidence."},{"t":"warn","text":"Hiding failures is a mistake. A failed test followed by a clear fix and a passing retest earns credit and looks genuine; a perfect run of passes, first time, does not."},{"t":"key","title":"Key points","items":["Test every validation rule, calculation, query, button and procedure.","Record actual result, pass/fail and evidence reference for each test.","Captioned screenshot per test, cross-referenced by test number.","Failures are recorded honestly and lead to corrective action."]},{"t":"tip","text":"Moderators' reports note that most candidates now verify their results against the test plan they created earlier. Keep the plan and the results in the same table so the comparison is obvious."}],"diagram":{"kind":"table-reveal","title":"Pass or fail?","caption":"Compare the expected and actual result for each test, then reveal the verdict.","head":["Test","Expected","Actual","Verdict"],"rows":[["T3 Fine 20.01","Rejected with custom message","Rejected with custom message","Pass"],["T5 Member with 6 out","Refused: already has 6 books out","Loan saved","Fail: corrective action C1"],["T9 Returned on due date","Fine £0.00","Fine £0.00","Pass"],["T13 Returned 3 days early","Fine £0.00","Fine -£0.30","Fail: negative fine, corrective action C2"]],"hidden":[[0,3],[1,3],[2,3],[3,3]]},"check":[{"q":"What makes a test pass?","o":["The system doesn't crash","The actual result matches the expected result","The screenshot is clear","The data was valid"],"a":1,"why":"Pass means actual = expected, including a correct rejection."},{"q":"A test of invalid data shows the record being rejected with the planned message. The test…","o":["fails, because data was rejected","is not needed","passes","is inconclusive"],"a":2,"why":"Rejecting invalid data is the expected result."},{"q":"What should a test evidence caption include?","o":["The test number","Your name","The date of birth","Nothing"],"a":0,"why":"The number links the evidence to the plan and evaluation."}],"exam":[],"practice":[{"q":"Describe how evidence of testing should be presented in a portfolio.","m":3,"a":"Annotated screenshot showing the data entered and the actual result (1) / captioned and cross-referenced to the test number (1) / actual result and pass/fail recorded against the expected result in the test plan table (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":[]},{"id":"c04-p04","spec":"Carry out testing with annotated evidence of results, corrective action and retesting","lessons":["AD05"],"summary":"Integration tests follow data through several objects; system tests walk through complete real tasks against the requirements, with realistic data volumes and non-functional checks.","blocks":[{"t":"p","text":"Once the parts work alone, test that they work **together**. An integration test follows a piece of data through several objects, checking each step. A system test walks through a complete, realistic task from start to finish and is linked to all the requirements it proves."},{"t":"table","head":["No.","Scenario","Checks","URs"],"rows":[["T20","Issue a loan, then change its due date to last week and run the overdue report","The loan appears on rptOverdueLetters with the correct days overdue and fine","UR4, UR7, UR9"],["T21","Return the book","Book status changes to Available and it reappears in cboBook","UR6"],["T22","Add a member, then issue six loans and try a seventh","Sixth accepted, seventh refused; subform shows six loans","UR1, UR5"],["T23","Log in as a volunteer","Admin buttons hidden on the menu","UR14"]],"caption":"Integration and system tests."},{"t":"h","text":"Non-functional requirements"},{"t":"p","text":"Test non-functional requirements against their measurable targets. If UR15 says *a surname search returns results in under 3 seconds with 5000 loans*, generate 5000 loans of test data and time it. If UR16 says *every main form opens from the menu in no more than two clicks*, count them for each form."},{"t":"p","text":"Use a **realistic amount** of test data. Five records hide problems that 500 reveal: slow searches, reports that spill onto extra pages, or combo boxes too long to use."},{"t":"key","title":"Key points","items":["Integration: data followed form → table → query → report.","System: complete real tasks, linked to every UR they prove.","Non-functional requirements tested against their measurable targets.","Realistic data volumes."]},{"t":"tip","text":"Moderators' reports note that unit, system and integration testing are generally well covered. What lifts testing further is linking every system test to the requirements it proves, so the evaluation can cite it."}],"diagram":{"kind":"flow","direction":"lr","title":"Integration test T20: following one loan","caption":"Step through the objects one loan passes through. Each arrow is a point where an integration fault can appear.","nodes":[{"id":"f","label":"frmIssueLoan","shape":"io","detail":"Member and book chosen; cmdIssue clicked."},{"id":"v","label":"cmdIssue_Click VBA","shape":"process","detail":"Checks the limit, sets the due date, saves."},{"id":"t","label":"tblLoan + tblBook","shape":"store","detail":"New loan record; book status On loan. Check both tables directly."},{"id":"q","label":"qryOverdueLoans","shape":"process","detail":"After the due date is moved to last week, the loan must appear with the right DaysOverdue."},{"id":"r","label":"rptOverdueLetters","shape":"end","detail":"A letter for the member listing the book and the correct fine."}],"edges":[["f","v"],["v","t"],["t","q"],["q","r"]]},"check":[{"q":"What distinguishes integration testing from unit testing?","o":["It uses more data","It is done by the client","It only tests validation","It checks parts working together"],"a":3,"why":"Integration tests follow data across objects."},{"q":"How should a non-functional requirement such as 'search in under 3 seconds with 5000 loans' be tested?","o":["Ask the teacher","Load 5000 loans of test data and time the search","Assume it's fine","Test with 5 records"],"a":1,"why":"Test against the measurable target with realistic data."},{"q":"Why use realistic volumes of test data?","o":["CCEA counts records","It looks impressive","Problems like slow searches only appear with many records","Access needs it"],"a":2,"why":"Small data sets hide performance and layout problems."}],"exam":[],"practice":[{"q":"Describe what is meant by integration testing, using an example from a library database.","m":3,"a":"Testing that separate parts of the system work together correctly (1) by following data through several objects (1), e.g. a loan issued on the form is saved in the loan table, updates the book status and appears in the overdue report with the right fine (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":[]},{"id":"c04-p05","spec":"Carry out testing with annotated evidence of results, corrective action and retesting","lessons":["AD05"],"summary":"For every failed test record the cause, the fix with before-and-after evidence, and a retest with the same data, numbered so the evaluation can refer to it.","blocks":[{"t":"p","text":"[[Corrective action]] is what you do when a test fails. Moderators' reports say most candidates now show corrective action and fixes arising from testing, and that the better candidates document it clearly. Give each a reference (C1, C2…) linked to the test."},{"t":"table","head":["Ref","Test","Cause","Fix","Retest"],"rows":[["C1","T5","The DCount criteria used `ReturnDate = Null`, which is never true in Access, so every member counted 0 books out","Changed to `ReturnDate Is Null` (Figure 58, before and after)","T5a: refused with the correct message. Pass (Figure 59)"],["C2","T13","The fine code did not handle early returns, so daysLate was negative and the fine became −£0.30","Added `If daysLate <= 0 Then curFine = 0` (Figure 60)","T13a: £0.00. Pass (Figure 61)"]]},{"t":"code","lang":"ps","code":"' Before (T5 failed)\nlngOut = DCount(\"*\", \"tblLoan\", \"MemberID = \" & Me.cboMember & \" AND ReturnDate = Null\")\n\n' After (C1)\nlngOut = DCount(\"*\", \"tblLoan\", \"MemberID = \" & Me.cboMember & \" AND ReturnDate Is Null\")","title":"VBA: the fix for C1"},{"t":"h","text":"Writing it up"},{"t":"list","items":["Say **why** it failed, not just that it did: name the line, rule or property at fault.","Show the change: before-and-after screenshots or code.","Retest with the **same** data, and record the result and evidence.","If the fix could affect other parts, rerun the related tests (regression testing) and say so."],"ordered":true},{"t":"p","text":"Sentence starters: \"Test … failed because …\"; \"To fix this, I changed … (see Figure …)\"; \"I retested with the same data and the result was …\"."},{"t":"warn","text":"\"It didn't work so I fixed it\" earns little. The cause, the change and the retest evidence are what show understanding."},{"t":"key","title":"Key points","items":["Each failure gets a C number linked to its test.","Cause identified precisely.","Fix evidenced before and after.","Retest with the same data; rerun related tests."]}],"diagram":{"kind":"cycle","title":"The corrective action cycle","caption":"Play through the cycle. It repeats until the retest passes.","items":[{"label":"Run test","detail":"Enter the planned test data exactly as in the test plan."},{"label":"Compare","detail":"Actual result against expected. A mismatch is a fail: record it honestly with evidence."},{"label":"Find the cause","detail":"Breakpoints, F8 and the Immediate window; check criteria strings, properties and boundaries."},{"label":"Fix","detail":"Change the code or property; capture before-and-after evidence; give it a C number."},{"label":"Retest","detail":"Same data, new test number (T5a). Rerun related tests in case the fix broke something else."}]},"check":[{"q":"Why was ReturnDate = Null in the criteria a bug?","o":["Comparisons with Null are never true, so no loans were counted","Null is a reserved word","It should be ReturnDate = 0","DCount can't use dates"],"a":0,"why":"Use Is Null to test for an empty field."},{"q":"What should a retest use?","o":["New, easier data","No data","Only valid data","The same data as the failed test"],"a":3,"why":"The same data proves that the fix worked."},{"q":"What is regression testing?","o":["Testing the oldest code first","Rerunning earlier tests to check a fix hasn't broken anything","Testing backwards","Testing by the client"],"a":1,"why":"Fixes can have side effects."}],"exam":[],"practice":[{"q":"A test of a 'maximum six loans' rule fails because a seventh loan is accepted. Describe the corrective action that should be documented.","m":4,"a":"Record the failed result and evidence against the test number (1) / identify the cause, e.g. a criteria error in the count of current loans (1) / describe and evidence the fix with before/after code or properties (1) / retest with the same data, record the pass and evidence, and rerun related tests (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Corrective action"]},{"id":"c04-p06","spec":"Carry out user acceptance testing","lessons":["AD05"],"summary":"The client or an end user carries out realistic tasks with the finished system against the requirements; record what they did, how long it took and their feedback, and act on it.","blocks":[{"t":"p","text":"[[User acceptance testing]] (UAT) is the final check: the client, or someone acting as an end user, uses the finished system to carry out real tasks, and confirms whether it meets their needs. It gives independent evidence, especially for usability requirements that you cannot judge fairly yourself."},{"t":"h","text":"Running a UAT session"},{"t":"list","items":["Prepare a **task list** linked to the requirements, e.g. *Register a new junior member (UR1)*, *Issue two books to member M0012 (UR4)*, *Print this week's overdue letters (UR9)*.","Give the user only what a real user would have: the user guide and a short demonstration if the requirement says so.","Observe without helping. Note what they did, any hesitations or errors, and the time each task took.","Ask them to complete a short **feedback form** with a rating and comments for each task and for the system overall, signed and dated."],"ordered":true},{"t":"table","head":["Task","UR","Time","Completed?","User comment"],"rows":[["Register a new member","UR1","1 min 40 s","Yes","Clear; postcode message helped"],["Issue two books","UR4, UR5","50 s","Yes","Quick; liked the books-out count"],["Return a late book","UR6, UR7","1 min 10 s","Yes, with one hesitation","Not sure where the fine appears"],["Print overdue letters","UR9","30 s","Yes","Exactly what we need"]],"caption":"UAT record (the user's name is not needed; describe their role)."},{"t":"p","text":"Act on the feedback where you can (here, making the fine box larger and labelling it) and record the change. Feedback you cannot act on goes into your evaluation as a limitation or future extension."},{"t":"note","text":"In school the client is often role-played by your teacher or another adult. Say who acted as the user and in what role. Check your centre's arrangements."},{"t":"key","title":"Key points","items":["The client or an end user performs realistic tasks linked to URs.","Record actions, times, problems and signed feedback.","Act on feedback or carry it into the evaluation.","UAT is independent evidence, especially for usability."]},{"t":"tip","text":"If a non-functional requirement had a time target (\"issue a loan in under 1 minute\"), UAT is the place to measure it with a real user."}],"diagram":{"kind":"timeline","title":"A UAT session, step by step","caption":"Click each step of a typical 30-minute session with the librarian.","items":[{"label":"Prepare","detail":"Task list linked to URs, a copy of the user guide, test data loaded, feedback form printed."},{"label":"Brief","detail":"Explain the purpose; give the 5-minute demonstration only if the requirement allows it."},{"label":"Observe","detail":"The user works through the tasks unaided while you time them and note problems."},{"label":"Feedback","detail":"User rates each task and comments; signs and dates the form."},{"label":"Act","detail":"Fix what you can (e.g. relabel the fine box), retest, and record the change."},{"label":"Evaluate","detail":"Use the feedback as evidence for usability requirements and future extensions."}]},"check":[{"q":"Who carries out user acceptance testing?","o":["The developer alone","The moderator","The client or an end user","Microsoft"],"a":2,"why":"UAT is the client's or users' confirmation."},{"q":"What is the main value of UAT evidence in the evaluation?","o":["It is independent evidence that the system meets the user's needs","It is longer","It replaces the test plan","It proves the code compiles"],"a":0,"why":"It gives a view other than the developer's."},{"q":"A user hesitates finding the fine. What should you do?","o":["Ignore it","Delete the feedback","Help them next time","Act on it (e.g. relabel the box) and record the change, or carry it to the evaluation"],"a":3,"why":"Feedback should lead to changes or justified limitations."}],"exam":[],"practice":[{"q":"Describe what is meant by user acceptance testing and why it is carried out.","m":3,"a":"The client or end users test the finished system (1) by carrying out realistic tasks with real or realistic data (1), to confirm that it meets their requirements and is usable before it is accepted (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["User acceptance testing"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]}},{"id":"c05","n":5,"title":"Evaluation, user guide and the finished portfolio","intro":"Evaluating against every requirement, limitations and extensions, implementation, the user guide, personal reflection, and turning everything into a well-organised, cross-referenced and fully acknowledged PDF portfolio.","pages":[{"id":"c05-p01","spec":"Evaluate the solution against each requirement as fully, partially or not met, with evidence and justified improvements","lessons":["AD05"],"summary":"Go through every numbered requirement and judge it fully, partly or not met, citing test numbers, figures and user feedback, and explain any shortfall honestly.","blocks":[{"t":"p","text":"The [[Evaluation]] judges how well the finished system meets the client's needs. Work through **every** requirement from your analysis, in order, and for each one give a judgement (fully met, partly met or not met), the **evidence** (test numbers, figure numbers, page numbers, user feedback) and a short comment."},{"t":"table","head":["UR","Judgement","Evidence","Comment"],"rows":[["UR4 Issue a loan, due in 21 days","Fully met","T4, T20; Figures 55, 63","Due date set automatically; the librarian issued two loans in 50 s during UAT"],["UR5 6-book limit","Fully met","T4, T5a, T22; Figure 59","Limit enforced in VBA before saving, after corrective action C1"],["UR7 Calculate fines","Fully met","T8 to T13a; Figure 61","All paths of the algorithm tested, including the £20 cap and early returns (C2)"],["UR15 Search in under 3 s with 5000 loans","Fully met","T24; Figure 66","Measured at under 1 second on the desk PC"],["UR16 Every form within two clicks","Partly met","T25","All forms except the fines history need three clicks; a menu button would fix this"],["UR12 Email reminders","Not met","–","Non-essential; time went on the fine calculation. See future extensions"]]},{"t":"h","text":"Evaluative, not descriptive"},{"t":"p","text":"Descriptive writing says what you made; evaluative writing judges how well it meets a requirement and proves it. Compare:"},{"t":"compare","head":["Descriptive (weak)","Evaluative (strong)"],"rows":[["The search","\"I made a search form and the client liked it.\"","\"UR3 is fully met: T6 shows a partial surname returns only the matching members, and the librarian found members in under 10 seconds during UAT.\""],["The limit","\"The loan limit works.\"","\"UR5 is fully met: T4 accepts a fifth-to-sixth loan and T5a refuses a seventh with the planned message (Figure 59).\""]]},{"t":"p","text":"Finish with an overall judgement: how well does the system solve the problems you identified in the current system (the queues, the hand-calculated fines, the missed reminders)?"},{"t":"warn","text":"A column of ticks proves nothing. Every judgement needs a test, figure or page number. Be honest about partly met and not met requirements: honesty with reasons scores better than unsupported claims."},{"t":"key","title":"Key points","items":["Every UR appears, in order, with fully / partly / not met.","Every judgement cites evidence: tests, figures, pages, UAT feedback.","Shortfalls explained honestly with reasons.","Overall comment on how well the original problems are solved."]},{"t":"tip","text":"Sentence starters: \"UR… has been fully met; this is shown in test …, where …\"; \"UR… has only been partly met because …\"; \"Compared with the original system, the client can now …\"."}],"diagram":{"kind":"table-reveal","title":"Judge each requirement from its evidence","caption":"Read the evidence, decide the judgement, then reveal.","head":["Requirement","Evidence","Judgement"],"rows":[["UR9 Print overdue letters","T20 and T26 pass; UAT 'exactly what we need'","Fully met"],["UR16 Any form in two clicks","T25: one form needs three clicks","Partly met"],["UR12 Email reminders","Not built","Not met (non-essential), so a future extension"],["UR14 Staff login","T7 and T27 pass; passwords stored as plain text","Fully met as specified; plain-text storage is a limitation"]],"hidden":[[0,2],[1,2],[2,2],[3,2]]},"check":[{"q":"Which is an evaluative statement?","o":["I made a booking form.","The client liked it.","UR5 is fully met: T5a refuses a seventh loan with the planned message (Figure 59).","The database has four tables."],"a":2,"why":"It judges a requirement and cites evidence."},{"q":"A requirement was not met. What should the evaluation do?","o":["Say why honestly and link it to a future extension","Leave it out","Say it was met","Delete it from the analysis"],"a":0,"why":"Honest explanation with a way forward is credited."},{"q":"Which evidence best supports a usability requirement?","o":["Your own opinion","The number of forms","The file size","UAT feedback with timings"],"a":3,"why":"Independent user evidence is strongest for usability."}],"exam":[],"practice":[{"q":"A candidate writes: 'The search works well and the client liked it.' Explain why this is a weak evaluation and rewrite it.","m":4,"a":"It is descriptive / opinion, not linked to a numbered requirement (1) and gives no evidence such as test or figure numbers (1). Rewrite, e.g. 'UR3 is fully met: test T6 shows a partial surname returns only matching members (Figure 57)' (1) 'and in UAT the librarian found a member in under 10 seconds' (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Evaluation"]},{"id":"c05-p02","spec":"Evaluate the solution against each requirement as fully, partially or not met, with evidence and justified improvements","lessons":["AD05"],"summary":"Discuss the system's real strengths and limitations, then suggest realistic extensions, each linked to a limitation, an unmet non-essential requirement or user feedback, saying how it would be done and how it would help.","blocks":[{"t":"p","text":"After judging the requirements, step back. What are the system's genuine **strengths** (with evidence) and its [[limitations|Limitation]]? Then suggest [[future extensions|Future extension]]. Moderators' reports say good candidates derive their extensions from the **non-essential requirements**."},{"t":"table","head":["Limitation","Effect on the library"],"rows":[["Single-user database file on one PC","The second desk cannot issue loans at the same time"],["Passwords stored as plain text in tblStaff","Anyone opening the table could read them"],["BookID typed or chosen from a list","Slow at busy times; risk of choosing the wrong copy"],["No remote access","Members cannot see their own loans from home"]]},{"t":"h","text":"Extensions: why and how"},{"t":"table","head":["Extension","Why (link)","How"],"rows":[["Email overdue reminders","UR12 not met (non-essential)","VBA loop through qryOverdueLoans using DoCmd.SendObject to email each member's letter"],["Barcode scanning","UAT: issuing is slowest when finding the book","A USB scanner acts as a keyboard into the BookID box; add barcodes to tblBook"],["Split database","Second desk needs access","Database Tools › Access Database: back-end tables on a shared drive, front-end forms on each PC"],["Hashed passwords","Plain-text limitation","Store a hash of each password and compare hashes at login"]]},{"t":"p","text":"Each extension should be realistic for the client's budget and staff, specific, and explained in a sentence or two of technical detail. \"Make it look better\" or \"add more features\" earns nothing."},{"t":"warn","text":"Do not invent limitations to look modest or claim none at all. Base both on your test results, UAT feedback and the constraints you identified in analysis."},{"t":"key","title":"Key points","items":["Strengths and limitations are specific and evidenced.","Each extension links to a limitation, an unmet non-essential requirement or user feedback.","Say how it would be done (briefly, technically) and how it helps the client."]}],"diagram":{"kind":"compare","title":"Single file or split database?","caption":"Toggle between the current design and the proposed extension for two desks.","states":[{"label":"Now: one .accdb file","points":["Tables, forms, queries, reports and code in one file","Simple to install and back up","Only practical on one PC at a time","A corrupted file loses everything"],"art":null},{"label":"Extension: split database","points":["Back-end file: tables only, on a shared drive","Front-end file: forms, queries, reports and VBA on each PC, linked to the back-end","Two desks can work at once","Front-ends can be updated without touching the data"],"art":null}]},"check":[{"q":"Where do moderators say good extensions come from?","o":["Random ideas","The non-essential requirements","Other pupils' projects","The hardware list"],"a":1,"why":"Extensions derived from non-essential requirements are credited."},{"q":"Which extension is best expressed?","o":["Make it better","Add more features","Barcode scanning: a USB scanner enters BookID, because UAT showed finding the book is the slowest step","Use a newer computer"],"a":2,"why":"It is specific, justified and says how."},{"q":"What does splitting a database do?","o":["Separates tables (back-end) from forms and code (front-end)","Deletes half the data","Creates two copies of the data","Encrypts it"],"a":0,"why":"Each PC's front-end links to shared back-end tables."}],"exam":[],"practice":[{"q":"Suggest two realistic future extensions for a library loans database, explaining how each would be implemented and how it would benefit the library.","m":4,"a":"e.g. Email reminders (1): VBA loop through overdue loans sending each member an email; saves postage and reminds members sooner (1). Split database (1): back-end tables on a shared drive with a front-end on each PC, so two desks can issue loans at once (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Limitation","Future extension"]},{"id":"c05-p03","spec":"Plan the implementation of the solution: installation, data conversion, changeover and training","lessons":["AD04","AD05"],"summary":"Explain how the system would go live: installing it, converting existing records, choosing and justifying a changeover method, and training staff.","blocks":[{"t":"note","text":"CCEA moderators' reports (2023) note that stronger candidates addressed changeover methods, user training and legacy data conversion. Check the current marking criteria to see where your centre expects this; it often sits at the end of development or within the evaluation."},{"t":"p","text":"A finished database is not yet a working system. Explain how it would be put into use at the client's organisation."},{"t":"h","text":"Installation and data conversion"},{"t":"p","text":"Describe how the database is installed (copy the .accdb to a trusted location, install Access or Access Runtime, set up backups). Then explain [[data conversion|Data conversion]]: how the existing records get into the new system. The library's card index would be typed in, or a list kept in Excel could be imported with External Data › New Data Source › From File, then checked by validation queries for duplicates and gaps."},{"t":"h","text":"Changeover methods"},{"t":"table","head":["Method","How it works","Library judgement"],"rows":[["[[Direct changeover]]","Old system stops, new one starts on a set day","Risky: if the system fails on a Saturday there is no fallback"],["[[Parallel running]]","Both systems run together until the new one is trusted","Safe but doubles the work for volunteers"],["[[Phased changeover]]","Introduce one module at a time (members, then loans, then reports)","Workable, but loans need members and books first"],["[[Pilot changeover]]","One branch or one desk uses it first","Suitable: run it on one desk for two weeks, then the second"]]},{"t":"example","title":"Worked example: justifying a changeover for the library","steps":["The library has two desks and opens six days a week, so it cannot close to switch over.","Volunteers have limited time, so running two full systems for weeks (parallel) would be a burden.","A pilot on one desk lets problems be found while the card index is still in use at the other.","After two weeks without problems, the second desk switches and the card index is archived."],"context":"Choose and justify a method.","answer":"A pilot changeover, justified by the two desks, volunteer time and the need for a fallback."},{"t":"h","text":"Training"},{"t":"p","text":"Plan short, practical training: a demonstration of each main task using the user guide, a practice session with test data, and a named person to contact for help."},{"t":"key","title":"Key points","items":["Installation: file location, Access or Runtime, trusted location, backups.","Data conversion: how existing records are entered or imported and checked.","Changeover: direct, parallel, phased or pilot, justified for this client.","Training linked to the user guide."]}],"diagram":{"kind":"compare","title":"Four changeover methods","caption":"Toggle between the methods and compare risk, cost and suitability for the library.","states":[{"label":"Direct","points":["Old system off, new system on, same day","Cheapest and quickest","Highest risk: no fallback","Library: too risky with no IT support on site"],"art":null},{"label":"Parallel","points":["Both systems run together","Results can be compared; old system is a fallback","Double the work and cost","Library: too much extra work for volunteers"],"art":null},{"label":"Phased","points":["One module at a time","Problems limited to one part","Slow; modules depend on each other","Library: loans need members and books in place first"],"art":null},{"label":"Pilot","points":["One desk or site first","Problems found on a small scale","Other desk keeps the old system meanwhile","Library: chosen, one desk for two weeks"],"art":null}]},"check":[{"q":"Which changeover method has no fallback if the new system fails?","o":["Parallel","Pilot",
