<meta charset="utf-8">
<title>A2 2 Coursework Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: an e-reader. Sticky slim top bar, outline rail on the left, ONE A4 sheet at a time on a quiet desk. */
:root{
  --desk:#E2E6EC; --paper:#FFFFFF; --paper-2:#F4F6F9; --ink:#1B2230; --ink-2:#465063; --ink-3:#687386;
  --line:#D3D9E2; --line-2:#E7EBF0; --bar:#FBFCFD;
  --accent:#2445B4; --accent-ink:#FFFFFF; --accent-soft:#E5EAFA;
  --mark:#FFE27A; --mark-ink:#1B2230;
  --good:#18744A; --good-soft:#E0F2E8; --bad:#B3261E; --bad-soft:#FBE6E4;
  --warn:#8E5300; --warn-soft:#FFF0D6; --note:#5A49B5; --note-soft:#EEEBFB;
  --c1:#2F5FD0; --c2:#0E8079; --c3:#B87200; --c4:#C2416B; --c5:#6E54C9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 28px rgba(20,30,50,.10);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
  --barh:52px; --railw:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; }

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{height:var(--barh);display:flex;align-items:center;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ib{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--paper-2);color:var(--ink)}
.ib[disabled]{opacity:.35;cursor:default;background:transparent}
.ib svg{width:20px;height:20px}
.ib[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.bt{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.bt b{font-family:var(--serif);font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;gap:2px;flex:none}
.pn{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);min-width:58px;text-align:center;white-space:nowrap}
.pn b{color:var(--ink);font-weight:700}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--good);transition:width .3s;max-width:100%}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);align-items:start}
body.rail-off .shell{grid-template-columns:minmax(0,1fr)}
body.rail-off .rail{display:none}
.rail{position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--barh) - env(safe-area-inset-top,0px));overflow:auto;background:var(--paper-2);border-right:1px solid var(--line);padding:18px 14px 28px max(14px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.r-head{padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.r-qual{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.r-title{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25;margin:4px 0 12px;text-wrap:balance}
.meter{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.r-prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.r-ch{margin:12px 0 4px}
.r-ch h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 4px;font-weight:700;display:flex;gap:6px}
.r-ch h2 span{color:var(--ink);letter-spacing:0;text-transform:none;font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3}
.r-pg{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13.5px;line-height:1.35}
.r-pg:hover{background:var(--line-2);color:var(--ink)}
.r-pg[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.tk{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tk svg{width:10px;height:10px;opacity:0}
.r-pg.done .tk{background:var(--good);border-color:var(--good);color:var(--paper)}
.r-pg.done .tk svg{opacity:1}
.r-pg[aria-current="page"] .tk{border-color:var(--accent)}
.r-foot{margin-top:18px;padding:12px 6px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:70}

main{min-width:0;padding-block:32px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

@media (max-width:999px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:80;top:0;left:0;bottom:0;height:auto;width:min(340px,88vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.rail-open .rail{transform:none}
  body.rail-off .rail{display:block}
}

/* ---------- the sheet ---------- */
.sheet{max-width:820px;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;aspect-ratio:210/297;padding:48px 64px 40px;display:flex;flex-direction:column;font-family:var(--serif);font-size:16.5px;line-height:1.68;overflow-wrap:break-word}
.sheet > *{min-width:0}
.strip{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;border-bottom:2px solid var(--ink);font-weight:700}
.strip span:last-child{letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chintro{margin:18px 0 0;padding:14px 16px;background:var(--paper-2);border-radius:6px;font-size:15px;color:var(--ink-2)}
.chintro b{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sheet h1{font-size:30px;line-height:1.2;font-weight:700;margin:22px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.sheet h1:focus{outline:none}
.sheet h1 .cont{font-weight:400;color:var(--ink-3);font-size:.7em}
.lede{font-size:18px;line-height:1.5;color:var(--ink-2);margin:0 0 20px;font-style:italic}
.notes{display:flex;flex-direction:column;gap:14px}
.notes p{margin:0}
.notes h2{font-size:20px;margin:12px 0 -4px;line-height:1.3;text-wrap:balance}
.notes ul,.notes ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.notes code,.sheet code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);border:1px solid var(--line-2);padding:.05em .35em;border-radius:4px}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:help;text-align:inherit}
.term:hover{background:var(--accent-soft)}
.boxed{border-radius:8px;padding:14px 18px;background:var(--paper-2);border:1px solid var(--line)}
.boxed > b{display:block;font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.key{border:1.5px solid var(--ink);background:var(--paper)}
.key ul{gap:6px}
.call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border-radius:8px;padding:12px 16px;font-size:15.5px}
.call b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.call.tip{background:var(--accent-soft)}.call.tip b{color:var(--accent)}
.call.warn{background:var(--warn-soft)}.call.warn b{color:var(--warn)}
.call.note{background:var(--note-soft)}.call.note b{color:var(--note)}
@media (max-width:520px){.call{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tw table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.tw th,.tw td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.tw thead th{background:var(--paper-2);font-size:13px;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:700}
.tw.plain td:first-child{font-weight:400}
.tw caption{caption-side:bottom;text-align:left;font-size:13px;color:var(--ink-3);padding:8px 12px;font-style:italic}
figure{margin:0}

.ex{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex-h{padding:10px 16px;background:var(--paper-2);font-family:var(--sans);font-weight:700;border-bottom:1px solid var(--line)}
.ex-b{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.ex-ctx{color:var(--ink-2)}
.ex ol{counter-reset:st;list-style:none;padding:0}
.ex ol li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;animation:rise .25s ease}
.ex ol li::before{content:counter(st);font-family:var(--sans);font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:3px}
.ex-ans{border-top:1px dashed var(--line);padding-top:10px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;line-height:1.3;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
@keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.code{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;max-width:100%;background:var(--paper-2)}
.mcq fieldset{min-width:0;max-width:100%}.mcq legend{max-width:100%;overflow-wrap:anywhere;white-space:normal}
.code-h{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;font-family:var(--sans);font-size:13px;border-bottom:1px solid var(--line)}
.code-h span:last-child{color:var(--ink-3);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;tab-size:4}
.code pre code{background:none;border:0;padding:0;font-size:inherit;display:block;min-width:max-content}
.ln{display:block;padding:0 16px}
.numbered .ln{padding-left:0}
.numbered .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--ink-3);opacity:.7;user-select:none}
.h-k{color:var(--c5);font-weight:600}.h-s{color:var(--c2)}.h-c{color:var(--ink-3);font-style:italic}.h-n{color:var(--c3)}.h-f{color:var(--c1)}.h-t{color:var(--c4)}.h-o{color:var(--c4)}.h-r{color:var(--c1);font-weight:600}.h-a{color:var(--c3)}
.out{border-top:1px solid var(--line);background:var(--paper)}
.out b{display:block;padding:6px 16px 0;font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.out pre{padding:4px 16px 12px}

/* ---------- sections ---------- */
.sec{margin-top:34px}
.sec > h2{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--ink);padding-top:10px}
.sec > h2 small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:400;margin-left:auto}
.mcq{display:flex;flex-direction:column;gap:20px;font-family:var(--sans);font-size:15px}
.mcq fieldset{border:0;margin:0;padding:0;min-width:0}
.mcq legend{font-weight:700;margin-bottom:8px;padding:0;display:flex;gap:8px}
.mcq legend span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;line-height:1.4}
.opt i{font-style:normal;font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right i{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong i{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.why{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--paper-2);font-size:14.5px}
.why b.ok{color:var(--good)}.why b.no{color:var(--bad)}
.exq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-family:var(--sans)}
.exq li{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.exq .meta{font-size:12.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.exq .meta b{color:var(--ink)}
.exq .sum{font-family:var(--serif);font-size:16px}
.exq .tipbox{background:var(--accent-soft);border-radius:6px;padding:9px 12px;font-size:14.5px}
.lk{font-family:var(--sans);font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700}
.lk:hover{text-decoration:underline}
.lk svg{width:13px;height:13px}
.prac{display:flex;flex-direction:column;gap:14px}
.pq{border-left:3px solid var(--ink);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px}
.pq-q{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.pq-q span{flex:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pq-a{background:var(--good-soft);border-radius:6px;padding:10px 14px;font-size:15px}
.pq-a ul{margin:0;padding-left:1.2em}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vid{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);font-family:var(--sans);background:var(--paper)}
.vid:hover{border-color:var(--accent)}
.vid .src{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.vid .src .s-hub{color:var(--accent)}.vid .src .s-bbc{color:var(--c4)}.vid .src .s-yt{color:var(--bad)}.vid .src .s-cc{color:var(--c2)}
.vid .t{font-weight:700;line-height:1.35;font-size:14.5px}
.vid .go{margin-top:auto;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:4px}
.vid .go svg{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:5px 12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:auto;padding-top:40px}
.done-row{display:flex;justify-content:center;margin:12px 0 22px}
.donebtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;border:1.5px solid var(--good);color:var(--good);background:var(--paper);border-radius:999px;padding:9px 18px}
.donebtn svg{width:16px;height:16px}
.donebtn[aria-pressed="true"]{background:var(--good);color:var(--paper)}
.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--sans)}
.np{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--ink);min-width:0}
.np:hover{border-color:var(--accent)}
.np small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.np span{font-size:14px;line-height:1.35}
.np.nx{text-align:right;grid-column:2}
.folio{text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
@media (max-width:520px){.nextprev{grid-template-columns:minmax(0,1fr)}.np.nx{grid-column:1}}

@media (max-width:699px){
  main{padding:0}
  .sheet{aspect-ratio:auto;border-radius:0;box-shadow:none;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:16px;min-height:calc(100vh - var(--barh))}
  .sheet h1{font-size:25px}
  .lede{font-size:16.5px}
  .bt span{display:none}
}
@media (max-width:420px){ .pn{min-width:44px;font-size:12px} .sep{display:none} .bar-in{gap:2px} .ib{width:34px} }

/* ---------- drawers & popover ---------- */
.drawer{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-family:var(--serif);font-size:19px;flex:1}
.dr-s{padding:12px 18px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper-2);font-size:15px}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.dr-b{flex:1;overflow:auto;padding:8px 18px 28px;overscroll-behavior:contain}
.az{display:flex;flex-wrap:wrap;gap:2px}
.az button{border:0;background:none;width:24px;height:26px;border-radius:5px;font-size:13px;font-weight:700;color:var(--accent);padding:0}
.az button[disabled]{color:var(--line);cursor:default}
.az button:hover:not([disabled]){background:var(--accent-soft)}
.gl-l{font-family:var(--serif);font-size:22px;font-weight:700;margin:16px 0 4px;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.gl-e{padding:10px 0;border-bottom:1px solid var(--line-2)}
.gl-e dt{font-weight:700;font-size:15.5px}
.gl-e dd{margin:2px 0 0;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink-2)}
.gl-e .alt{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:4px}
.gl-e a{font-size:13px;font-weight:700;text-decoration:none}
.res{list-style:none;margin:0;padding:0}
.res a{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink);border-radius:6px}
.res a:hover{background:var(--paper-2)}
.res small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.res b{font-size:15px;line-height:1.35}
.res span{font-family:var(--serif);font-size:14px;color:var(--ink-2);line-height:1.5}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.pop{position:fixed;z-index:100;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;font-family:var(--sans);display:flex;flex-direction:column;gap:6px}
.pop h3{margin:0;font-family:var(--serif);font-size:17px;padding-right:28px}
.pop p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.55}
.pop .alt{font-size:13px;color:var(--ink-3)}
.pop .x{position:absolute;top:6px;right:6px;width:30px;height:30px}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.empty{padding:60px 20px;text-align:center;font-family:var(--sans);color:var(--ink-2)}

/* ---------- diagrams ---------- */
.dg{margin-top:30px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--sans);font-size:14.5px;line-height:1.45;overflow:hidden}
.dg-head{padding:12px 16px 10px;border-bottom:1px solid var(--line-2);background:var(--paper-2)}
.dg-kicker{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.dg-head h3{margin:2px 0 0;font-family:var(--serif);font-size:18px;line-height:1.3;text-wrap:balance}
.dg-stage{padding:16px;container-type:inline-size;display:flex;flex-direction:column;gap:12px;min-width:0}
.dg-scroll{overflow-x:auto;min-width:0}
.dg-scroll svg{margin:0 auto;height:auto}
.dg-detail{margin:0 16px 14px;padding:10px 14px;border-radius:8px;background:var(--paper-2);min-height:3.2em;font-size:14.5px}
.dg-detail strong{display:block;font-size:13px;letter-spacing:.03em;color:var(--accent)}
.dg-detail:empty{display:none}
.dg figcaption{padding:10px 16px 12px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-3);font-style:italic}
.dg-err{color:var(--bad)}
.dg .btn{font-size:13.5px;padding:5px 11px}
.stat{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
/* svg parts */
.sv-btn{cursor:pointer;outline:none}
.sv-btn .shp{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.5;transition:fill .15s,stroke .15s}
.sv-btn text{fill:var(--ink);font-family:var(--sans);font-size:13px}
.sv-btn:hover .shp{stroke:var(--accent)}
.sv-btn:focus-visible .shp{stroke:var(--accent);stroke-width:3}
.sv-btn.on .shp{fill:var(--accent);stroke:var(--accent)}
.sv-btn.on text{fill:var(--accent-ink);font-weight:700}
.sv-btn.seen .shp{fill:var(--accent-soft);stroke:var(--accent)}
.sv-line{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.sv-line.on{stroke:var(--accent);stroke-width:2.5}
.sv-track{stroke:var(--line);stroke-width:10;fill:none}
.sv-chev{stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-mk{fill:var(--ink-3)}.sv-mk.on{fill:var(--accent)}
.sv-lbl{pointer-events:none}
.sv-lbl rect{fill:var(--paper);opacity:.92}
.sv-lbl text{fill:var(--ink-2);font-size:12px;font-family:var(--sans)}
.sv-center{fill:var(--ink-2);font-size:13px;font-family:var(--sans)}
.sv-center.big{fill:var(--ink);font-family:var(--serif);font-size:17px;font-weight:700}
.sv-ax{stroke:var(--line);stroke-width:1}
.sv-ax-t{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
/* hotspot */
.hs{position:relative;display:flex;flex-direction:column;gap:26px}
.hs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hs-row{display:flex;gap:12px;position:relative}
.hs-part{flex:1 1 0;min-width:0;border:1.5px solid var(--ink-3);background:var(--paper);border-radius:8px;padding:12px 8px;font-weight:700;font-size:14px;line-height:1.3;min-height:54px;position:relative;z-index:1}
.hs-part:hover{border-color:var(--accent)}
.hs-part.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hs-part.near{background:var(--accent-soft);border-color:var(--accent)}
/* layers */
.lay{display:flex;flex-direction:column;gap:4px}
.lay button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1.5px solid transparent;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--ink)}
.lay button span{font-weight:400;font-size:12px;color:var(--ink-3);white-space:nowrap}
.lay button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* compare */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmp{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cmp-art{flex:0 1 240px;min-width:0;max-width:100%}
.cmp-art svg{width:100%;height:auto}
.cmp ul{flex:1 1 240px;min-width:0;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.art-l{stroke:var(--accent);stroke-width:2.2;fill:none}
.art-n{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.art-t{fill:var(--ink-2);font-size:10px;font-family:var(--sans)}
.art-hub{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.art-term{fill:var(--ink-2)}
/* bits */
.bits{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 8px}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 46px;min-width:30px}
.bit small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.bit button{width:100%;aspect-ratio:3/4;max-height:58px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink-3);padding:0}
.bit button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bit.nib{margin-left:8px}
.bpt{align-self:flex-end;font-size:26px;line-height:1;font-weight:700;color:var(--c4);margin:0 -1px 10px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rd{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.rd.cur{border-color:var(--accent);background:var(--accent-soft)}
.rd small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.rd b{font-family:var(--mono);font-size:19px;font-weight:600}
.rd div{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
/* pixels */
.px-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.px-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:min(100%,320px);touch-action:none;user-select:none}
.px-grid button{border:0;padding:0;aspect-ratio:1;min-width:0;border-radius:0}
.px-grid button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:1}
.px-side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);padding:0}
.pal.dense button{width:15px;height:15px;border-radius:2px}
.pal button[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.rowcodes{font-family:var(--mono);font-size:12.5px;line-height:1.35;color:var(--ink-2);white-space:pre;overflow-x:auto}
/* wave */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink-2)}
.ctl label b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.chk input{accent-color:var(--accent)}
.wv-orig{stroke:var(--c1);stroke-width:2;fill:none;opacity:.55}
.wv-step{stroke:var(--c4);stroke-width:2.2;fill:none}
.wv-dot{fill:var(--c4)}
.wv-stem{stroke:var(--c4);stroke-width:1;opacity:.45}
.wv-lvl{stroke:var(--line-2);stroke-width:1}
.calcbox{font-size:14px;background:var(--paper-2);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
/* sort */
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:6px}
.barc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.barc .b{width:100%;max-width:48px;border-radius:4px 4px 0 0;background:var(--c1);opacity:.35;transition:height .25s,background .2s,opacity .2s;display:flex;align-items:flex-end;justify-content:center;min-height:20px}
.barc .b span{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);padding-bottom:2px}
.barc.cmp .b{background:var(--c3);opacity:1}
.barc.swap .b{background:var(--c4);opacity:1}
.barc.sorted .b{background:var(--c2);opacity:.9}
.barc.found .b{background:var(--good);opacity:1}
.barc.out .b{opacity:.12}
.barc.range .b{opacity:.6}
.barc .ix{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.barc .ptr{font-size:10.5px;font-weight:700;color:var(--accent);height:14px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* calc */
.cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cin label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink-2)}
.cin input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--paper-2);font-variant-numeric:tabular-nums;width:100%;min-width:0}
.cres{border:1.5px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cres small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.cres b{font-size:22px;font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}
.ctab td,.ctab th{font-variant-numeric:tabular-nums}
.ctab td:first-child{font-weight:700}
/* match */
.mt{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px 12px}
.mt-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mt button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.mt button.term-b{font-weight:700}
.mt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mt button.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.mt button.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.mt button i{font-style:normal;flex:none;font-size:11px;font-weight:700;background:var(--good);color:var(--paper);border-radius:10px;padding:1px 6px;margin-top:1px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:var(--line);border-radius:2px}
.tl li{flex:1 1 0;min-width:0;position:relative}
.tl button{width:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;text-align:center;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink-2)}
.tl button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ink-3);margin-top:3px;box-sizing:border-box}
.tl button.seen::before{border-color:var(--accent)}
.tl button.on{color:var(--accent)}
.tl button.on::before{background:var(--accent);border-color:var(--accent);width:22px;height:22px;margin-top:0}
@container (max-width:520px){
  .tl{flex-direction:column;gap:2px}
  .tl::before{left:9px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .tl button{flex-direction:row;align-items:center;text-align:left;padding:6px 0;gap:12px}
  .tl button::before{flex:none;margin:0 0 0 1px}
  .tl button.on::before{margin-left:-2px}
}
/* gantt */
.gt .gt-bar{fill:color-mix(in srgb,var(--c1) 30%,var(--paper));stroke:var(--c1);stroke-width:1.5}
.gt.crit .gt-bar{fill:var(--c4);stroke:var(--c4)}
.gt.sel .gt-bar{stroke:var(--ink);stroke-width:2.5}
.gt:focus-visible .gt-bar{stroke:var(--accent);stroke-width:3}
.gt-in{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--sans);pointer-events:none}
.gt.crit .gt-in{fill:var(--paper)}
.gt-out{fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--sans)}
.gt-float{fill:none;stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1.2}
.gt-lab{fill:var(--ink)!important;font-size:12.5px!important}
/* dfd */
.sv-btn .shp.ent{fill:var(--paper-2)}
.sv-btn.on .shp.ent{fill:var(--accent)}
.dfd-rule{stroke:var(--ink-3);stroke-width:1.2}
.sv-btn.on .dfd-rule{stroke:var(--accent-ink)}
.dfd-id{fill:var(--ink-2);font-size:11.5px;font-weight:700;font-family:var(--sans)}
.sv-btn.on .dfd-id{fill:var(--accent-ink)}
/* ---------- hub links: learn panel, chapter card, library menu ---------- */
.learn{margin:0 0 24px;border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;font-family:var(--sans);display:flex;flex-direction:column;gap:8px}
.learn-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;line-height:1.35}
.learn-h b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.learn-h span{color:var(--ink-2);min-width:0}
.learn-h span em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700;margin-right:4px}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl a{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:4px 11px 4px 10px;line-height:1.3}
.hl a:hover{border-color:var(--accent);color:var(--accent)}
.hl a svg{width:12px;height:12px;color:var(--ink-3)}
.hl a:hover svg{color:var(--accent)}
.learn details{font-size:13px;border-top:1px solid var(--line-2);padding-top:8px}
.learn summary{cursor:pointer;color:var(--ink-2);font-weight:700}
.learn details[open] summary{margin-bottom:8px}
.more-l{display:flex;flex-direction:column;gap:10px}
.chcard{margin:18px 0 0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;font-family:var(--sans)}
.chcard-h{padding:12px 16px 10px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.chcard-h small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.chcard-h p{margin:4px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink-2)}
.chcard-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line-2)}
.cl{background:var(--paper);padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cl > b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cl a.lk{font-size:14px;line-height:1.35;align-items:flex-start}
.cl a.lk svg{margin-top:3px;flex:none}
.cl .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cl .fname{font-family:var(--mono);font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.libwrap{position:relative;flex:none}
.libmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:95;width:min(320px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;font-family:var(--sans)}
.libmenu > b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.libmenu a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.libmenu a:hover{background:var(--paper-2)}
.libmenu a small{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.libmenu a span{font-size:14px;font-weight:700;line-height:1.3}
.libmenu a[aria-current="page"]{background:var(--accent-soft)}
.libmenu a[aria-current="page"] small::after{content:" · open now";color:var(--accent)}

<script>
const BOOK = {"book":{"id":"A22","title":"A2 2: Application Development (coursework guide)","qual":"CCEA GCE Digital Technology","hub":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP","edition":"2026–27","lessonNames":{"AD01":"Understanding the task: case study, planning and authentication","AD06":"Producing the portfolio","AD02":"Analysis: client, current system and requirements","AD03":"Design: ER diagrams, normalisation, data dictionary and interfaces","AD04":"Development: building and evidencing the database application","AD05":"Testing and evaluation against the requirements"}},"chapters":[{"id":"c01","n":1,"title":"Getting started and analysis","intro":"How the A2 2 project works, how to set up and plan your write-up, and every section of the analysis: scenario, constraints, numbered requirements, DFDs and hardware and software.","pages":[{"id":"c01-p01","spec":"Understand the requirements of the internally assessed A2 2 task: a relational database application produced in response to a CCEA pre-released case study","lessons":["AD01"],"summary":"A2 2 is a 60-hour coursework project: you analyse a pre-released case study, then design, build, test and evaluate a relational database application in Microsoft Access, and present the evidence as one PDF portfolio.","blocks":[{"t":"p","text":"A2 2 Application Development is the coursework unit of the A level. It is worth **20%** of the full qualification and takes about **60 hours**, most of it in supervised lessons. CCEA releases a [[case study|Case study]] describing an organisation with a data-handling problem. Your job is to act as the developer: find out exactly what the client needs, then design, build, test and evaluate a relational database application that solves the problem."},{"t":"p","text":"In this course the application is built in **Microsoft Access**, with forms, queries, reports and **VBA** code. Everything you do is evidenced in a single [[Portfolio]] (your write-up, exported as PDF), and a separate **user guide** for the client's staff. Your teacher marks the work against CCEA's marking criteria, and CCEA [[moderates|Moderation]] a sample of the centre's work."},{"t":"h","text":"The stages you will evidence"},{"t":"table","head":["Stage","What you do","Typical evidence"],"rows":[["Analysis","Investigate the problem and agree what the system must do","Scenario and introduction, constraints, numbered user requirements (essential / non-essential), DFDs, hardware and software"],["Design","Plan the solution in enough detail for someone else to build it","Structure diagram, ERD, normalisation to 3NF, data dictionaries, form, query and report designs, algorithms"],["Development","Build the database from the design","Annotated screenshots of tables, relationships, forms, queries, reports, macros and VBA"],["Testing","Prove each requirement works and bad data is rejected","Test plan, unit, integration and system tests, corrective action, user testing"],["Evaluation and user guide","Judge the system against every requirement; support the users","Requirement-by-requirement evaluation, extensions, user guide, reflection"]],"caption":"The write-up follows the system life cycle. This notebook's five chapters follow the same order."},{"t":"p","text":"Throughout this notebook every worked example uses one made-up system: a loans and membership database for **Riverbank Community Library**. It has nothing to do with any CCEA case study. Use it to see what each section needs, then do the same thinking for your own scenario."},{"t":"warn","text":"Your work, your words. Copying wording, tables or code from this notebook, a textbook, a website, another pupil or an AI tool is malpractice. The library examples show the *kind* of evidence needed, not text to reuse."},{"t":"note","text":"The case study, task instructions and marking criteria are reissued by CCEA. Always check the current year's documents on the CCEA website: the hours, submission format and file names can change."},{"t":"key","title":"Key points","items":["A2 2 = 20% of the A level, about 60 hours, internally marked and externally moderated.","You respond to a CCEA pre-released case study with a relational database application (Access + VBA).","The moderator sees your PDF write-up: anything not evidenced there cannot be credited.","Requirement numbers link analysis, design, testing and evaluation together."]},{"t":"tip","text":"Moderators' reports repeatedly say that candidates who documented clear, detailed user requirements produced better solutions. Time spent getting the requirements right pays off in every later section."}],"diagram":{"kind":"flow","direction":"lr","title":"The A2 2 project from start to finish","caption":"Step through the stages. Notice the loop back from testing: a failed test leads to a fix and a retest, which is good evidence.","nodes":[{"id":"s","label":"Case study released","shape":"start","detail":"Read and annotate it: data to store, processes, outputs, rules and numbers."},{"id":"a","label":"Analysis","shape":"process","detail":"Introduction, constraints, numbered user requirements, essential / non-essential, DFDs, hardware and software."},{"id":"d","label":"Design","shape":"process","detail":"Structure diagram, ERD, normalisation to 3NF, data dictionaries, interface, query, report and algorithm designs."},{"id":"b","label":"Build in Access + VBA","shape":"process","detail":"Tables, relationships, queries, forms, reports, menu, macros and VBA, with annotated evidence."},{"id":"t","label":"Test","shape":"process","detail":"Test plan with valid, extreme and invalid data; unit, integration and system tests; user testing."},{"id":"q","label":"All tests pass?","shape":"decision","detail":"If not, record the cause, fix it and retest. Do not hide failures."},{"id":"e","label":"Evaluate + user guide","shape":"process","detail":"Judge every requirement fully, partly or not met with evidence; suggest extensions; write the user guide."},{"id":"z","label":"Submit PDF portfolio","shape":"end","detail":"Final checks, contents updated, exported to PDF, authentication signed."}],"edges":[["s","a"],["a","d"],["d","b"],["b","t"],["t","q"],["q","b","no: fix"],["q","e","yes"],["e","z"]]},"check":[{"q":"What does a candidate produce for A2 2?","o":["A written exam answer on databases","A website for a CCEA client","A relational database application with a portfolio of evidence","A spreadsheet model of a case study"],"a":2,"why":"A2 2 is the coursework unit: a relational database application plus a portfolio evidencing every stage."},{"q":"Who marks A2 2 portfolios first?","o":["The candidate's teacher, with CCEA moderating a sample","CCEA examiners only","The client in the case study","Another school"],"a":0,"why":"Teachers mark against CCEA's criteria; CCEA moderates a sample to check the standard."},{"q":"Why must requirement numbers appear throughout the portfolio?","o":["They make it longer","CCEA counts them","Access needs them","They let the moderator trace each requirement from analysis to evaluation"],"a":3,"why":"Numbered requirements are the thread linking design items, tests and evaluation judgements."}],"exam":[],"practice":[{"q":"Explain why the moderator's view of your project depends on the quality of your PDF portfolio rather than on the database alone.","m":3,"a":"The moderator assesses the evidence in the portfolio (1) / so a feature that is built but not evidenced (screenshots, code, test results) cannot be credited (1) / clear structure, captions and cross-references let the moderator find and credit the evidence (1)."},{"q":"Describe what should happen at the testing stage of the project when a test fails.","m":3,"a":"Record the failure honestly with the actual result (1) / identify the cause and make a corrective change, with evidence of the change (1) / retest with the same data and record the new result and evidence (1)."}],"videos":[{"title":"Understanding the task: case study, planning and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD01-video"}],"terms":["Case study","Portfolio","Moderation"]},{"id":"c01-p02","spec":"Structure the portfolio of evidence so that it follows the stages of the system life cycle","lessons":["AD01","AD06"],"summary":"Set up the Word write-up properly on day one: anonymous title page, header and footer, heading styles, an automatic contents page and figure captions, with chapters that follow the life cycle.","blocks":[{"t":"p","text":"Before you write a word of analysis, set up the document you will spend six months filling. A well-built Word file saves hours later and makes your evidence easy for the moderator to find. The write-up is exported to PDF at the end, so everything Word builds automatically (contents, page numbers, captions, bookmarks) carries across."},{"t":"h","text":"Title page, header and footer"},{"t":"list","items":["Name the file as your centre instructs, usually with the unit and your **candidate number**. Do not put your **name** anywhere: not on the title page, header, footer or file properties.","The title page gives the qualification, unit (A2 2 Application Development), the system title, centre number, candidate number and year.","Insert › Header shows the centre and candidate numbers on every page; Insert › Page Number puts a page number **field** in the footer. Tick **Different First Page** so the title page stays clean.","File › Info › Check for Issues › Inspect Document removes hidden author details. Word often stores your login name as the author."],"ordered":false},{"t":"h","text":"Styles, contents and captions"},{"t":"p","text":"Use **Heading 1** for each chapter, **Heading 2** for sections and **Heading 3** below that. Then References › Table of Contents builds the contents page for you, and View › Navigation Pane shows the structure exactly as the moderator will see it. Give every screenshot and diagram a caption (References › Insert Caption › Figure) so you can write \"see Figure 23\" in your testing and evaluation."},{"t":"code","lang":"ps","code":"Analysis                          (Heading 1)\n  Scenario and introduction       (Heading 2)\n  Internal and external constraints\n  User requirements\n    Inputs                        (Heading 3)\n    Processes\n    Outputs\n  Essential and non-essential requirements\n  Data flow diagrams\n  Hardware and software\nDesign                            (Heading 1)\n  Structure diagrams\n  Entity relationship diagram\n  Normalisation\n  ...","title":"How the library write-up looks in the Navigation Pane"},{"t":"p","text":"Long material such as a full interview transcript, the project log or a complete code listing can go in a clearly labelled appendix, so the main chapters stay readable. Start each chapter on a new page with Insert › Page Break."},{"t":"warn","text":"Bold, enlarged text is not a heading. If you fake headings, the contents page stays empty and the Navigation Pane is useless. Update the table of contents (Update Table › entire table) as the very last job before export."},{"t":"key","title":"Key points","items":["Anonymous: candidate and centre numbers only, never your name (check file properties).","Heading styles drive an automatic contents page and PDF bookmarks.","Chapters follow the life cycle: Analysis, Design, Development, Testing, Evaluation, then the User Guide.","Caption every figure so it can be cross-referenced by number."]},{"t":"tip","text":"A logo or decorative cover earns nothing. Spend the time on the requirements instead."}],"diagram":{"kind":"layers","title":"The portfolio, top to bottom","caption":"Click each layer to see what it contains. The order mirrors the system life cycle.","items":[{"label":"Title page and contents","detail":"Qualification, unit, system title, centre and candidate numbers, year. Automatic contents page and list of figures."},{"label":"1 Analysis","detail":"Scenario and introduction, constraints, numbered user requirements (inputs, processes, outputs), essential / non-essential, DFDs level 0 and 1, hardware and software. Gantt chart."},{"label":"2 Design","detail":"Structure diagrams, ERD (showing how many-to-many was resolved), normalisation 0NF to 3NF, data dictionaries, form, menu, query, report and VBA designs."},{"label":"3 Development","detail":"Annotated screenshots of every table, the Relationships window, queries, forms, reports, macros and commented VBA, with changes from the design explained."},{"label":"4 Testing","detail":"Test strategy and plan, unit, integration and system test results with evidence, corrective actions and retests, user acceptance feedback."},{"label":"5 Evaluation","detail":"Every requirement judged fully, partly or not met with evidence; strengths, limitations and future extensions; personal reflection."},{"label":"User guide and appendices","detail":"The user guide (its own contents), references and acknowledgements, project log, transcripts."}]},"check":[{"q":"Which Word feature makes the contents page build itself?","o":["Making headings bold and larger","Using Heading 1/2/3 styles","Typing page numbers","Inserting text boxes"],"a":1,"why":"The automatic table of contents is built from heading styles only."},{"q":"Where might your name still be hidden even if it isn't on any page?","o":["In the footer field","In the caption numbers","In the file's document properties","In the PDF bookmarks"],"a":2,"why":"Word stores the author name in the file properties; Inspect Document removes it."},{"q":"Why caption every figure?","o":["So you can refer to evidence by figure number in testing and evaluation","Captions are worth marks on their own","Word requires it to export PDF","To make the file larger"],"a":0,"why":"Numbered figures make cross-referencing possible: \"T5 passed, see Figure 45\"."}],"exam":[],"practice":[{"q":"Describe three features of a well-structured coursework write-up that help a moderator find evidence.","m":3,"a":"Automatic contents page built from heading styles with correct page numbers (1) / chapters in life-cycle order, each starting on a new page (1) / numbered, captioned figures that are cross-referenced in the text (1). Also credit: page number fields in the footer; appendices for long material."}],"videos":[{"title":"Understanding the task: case study, planning and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD01-video"}],"terms":["Portfolio","Cross-reference"]},{"id":"c01-p03","spec":"Plan and manage a project of about 60 hours using a Gantt chart, milestones and a project log","lessons":["AD01"],"summary":"A Gantt chart plans every task against real dates, shows dependencies and milestones, avoids holidays and leaves slack; a project log records what really happened so you can comment on slippage.","blocks":[{"t":"p","text":"A [[Gantt chart]] lists tasks down the side and time along the top, with a bar for each task. It shows at a glance what should be happening this week, which tasks overlap and which must wait. Moderators' reports note that many Gantt charts are too basic, with no dates or task detail, so make yours specific."},{"t":"h","text":"What a good project plan shows"},{"t":"list","items":["Every stage broken into real tasks (\"normalise loan data\", not just \"Design\"), each with a start date, end date and duration in weeks.","[[Dependencies|Dependency]]: forms need tables first; testing needs the build; the evaluation needs test results.","[[Milestones|Milestone]] such as *requirements agreed with client*, *design complete*, *test plan complete*.","School holidays and mock exam weeks shaded, with no work scheduled in them.","Slack at the end for corrections before the hand-in date."],"ordered":false},{"t":"p","text":"The [[Critical path]] is the longest chain of dependent tasks. Any delay on it delays the whole project; tasks off the critical path have *float* and can slip a little. In a database project the critical path usually runs through analysis, the data design, the build and testing."},{"t":"table","head":["Stage","Rough share of 60 hours","Target month"],"rows":[["Analysis","about 8 hours","October"],["Design","about 14 hours","November"],["Development","about 20 hours","December"],["Testing","about 10 hours","January"],["Evaluation, user guide, final checks","about 8 hours","February to March"]],"caption":"A suggested split. Use your centre's real calendar and deadlines."},{"t":"h","text":"The project log"},{"t":"p","text":"A [[Project log]] is a short dated record of what you did each lesson and what you plan next. It lets you compare progress with the plan honestly. Keep your *original* Gantt chart and add a comment on any slippage and how you recovered: a plan that exactly matches what happened looks as if it was drawn at the end."},{"t":"code","lang":"excel","code":"=AND(D$1>=$B2, D$1<=$C2)","title":"Quick Gantt in Excel: conditional formatting rule for the week grid (column B = start, C = end, row 1 = Monday of each week)"},{"t":"key","title":"Key points","items":["Tasks, dates, durations, dependencies, milestones, holidays and slack.","Critical path = longest chain of dependent tasks; zero float.","Keep a project log and comment on slippage against the original plan."]},{"t":"tip","text":"Plan the build to finish before Christmas if you can. Testing, corrective action and the evaluation always take longer than expected."}],"diagram":{"kind":"gantt","title":"Riverbank Library project plan (calendar days from 1 September)","caption":"Show the critical path: analysis, normalisation, interface design, the build, testing and evaluation are critical. The test plan, data dictionaries, table build and user guide have float. Holidays are not shown here, so the real plan stretches into March.","tasks":[{"id":"A","label":"Read case study, set up write-up","start":0,"dur":7,"deps":[]},{"id":"B","label":"Analysis: requirements and DFDs","start":7,"dur":35,"deps":["A"]},{"id":"C","label":"Normalisation and ERD","start":42,"dur":14,"deps":["B"]},{"id":"F","label":"Test plan","start":42,"dur":14,"deps":["B"]},{"id":"D","label":"Data dictionaries","start":56,"dur":10,"deps":["C"]},{"id":"E","label":"Form, query, report and VBA design","start":56,"dur":21,"deps":["C"]},{"id":"G","label":"Build tables and relationships","start":66,"dur":10,"deps":["D"]},{"id":"H","label":"Build queries, forms, reports, VBA","start":77,"dur":35,"deps":["E","G"]},{"id":"I","label":"Testing and corrective action","start":112,"dur":21,"deps":["H","F"]},{"id":"J","label":"User guide","start":112,"dur":21,"deps":["H"]},{"id":"K","label":"Evaluation","start":133,"dur":14,"deps":["I"]},{"id":"L","label":"Final checks and PDF","start":147,"dur":7,"deps":["K","J"]}]},"check":[{"q":"In the library plan, why does task H have to wait for both E and G?","o":["It doesn't; they are unrelated","H is a milestone","G is on holiday","Forms, queries and code need both the interface designs and the tables to exist"],"a":3,"why":"H depends on E (what to build) and G (the tables it is built on)."},{"q":"What is the critical path?","o":["The tasks the teacher checks","The longest chain of dependent tasks; a delay on it delays the project","The shortest route through the project","Tasks that can be done in any order"],"a":1,"why":"Critical tasks have zero float, so any slip moves the end date."},{"q":"Why keep the original plan and comment on slippage?","o":["CCEA requires two Gantt charts","So the plan matches what happened","It shows honest project management and how you recovered","It isn't needed"],"a":2,"why":"A plan redrawn to match reality looks invented; commentary on slippage is real evidence of management."},{"q":"Task F (test plan) has float. What does that mean?","o":["It can be delayed a little without delaying the whole project","It must start immediately","It is on the critical path","It can be skipped"],"a":0,"why":"Float is how far a task can slip before it affects the end date."}],"exam":[],"practice":[{"q":"A pupil's Gantt chart has five bars labelled Analysis, Design, Development, Testing and Evaluation with no dates. Explain three improvements.","m":3,"a":"Break each stage into specific tasks (1) / add start and end dates or week numbers with durations (1) / show dependencies, milestones and holidays, with slack before the deadline (1)."},{"q":"Explain the purpose of a project log alongside a Gantt chart.","m":2,"a":"The log records what was actually done each session (1) / so progress can be compared with the plan and slippage explained and managed (1)."}],"videos":[{"title":"Understanding the task: case study, planning and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD01-video"}],"terms":["Gantt chart","Dependency","Milestone","Critical path","Project log"]},{"id":"c01-p04","spec":"Understand the rules on academic honesty and authentication of coursework","lessons":["AD01","AD06"],"summary":"Coursework must be your own work, produced under supervision and authenticated by you and your teacher; every source, tutorial, template and permitted AI use must be acknowledged.","blocks":[{"t":"p","text":"Because your teacher marks A2 2, CCEA needs confidence that the work really is yours. [[Authentication]] means you and your teacher both sign declarations confirming that the work is your own and was produced under the required conditions. Your teacher can only sign if they have seen the work develop, which is why most of it is done in supervised lessons."},{"t":"h","text":"What counts as malpractice"},{"t":"list","items":["Copying another pupil's database, design, tables or wording, even with names changed.","**Collusion**: working with someone else on work that should be individual.","Submitting text, designs or code generated by an AI tool as your own work.","Copying theory, examples or code from a website, textbook or this notebook without acknowledgement."],"ordered":false},{"t":"p","text":"[[Malpractice]] can lead to penalties, including losing marks for the unit or disqualification. Moderators also report a different problem: projects that follow a teacher's template too closely. A template limits your own problem solving, so your solution should show *your* decisions."},{"t":"h","text":"What is allowed, and how to show it"},{"t":"table","head":["Allowed","How you acknowledge it"],"rows":[["General guidance from your teacher on what a section needs","As your centre requires; your teacher records it"],["Hub tutorials and Microsoft help pages that taught you a technique","References section: title, publisher, URL, date accessed"],["A tool or template, e.g. a Gantt template","Name it in references and say what you changed"],["AI tools, only if your centre's policy allows them","Say exactly what you used it for; never present its output as your own"]]},{"t":"p","text":"Keep dated versions of both the database and the write-up (for example *library v3 2026-11-14.accdb*). They show how your work developed and protect you if a file is corrupted."},{"t":"warn","text":"Your teacher can give general feedback, but cannot correct your work or tell you what to write. Use the checklists in this notebook to review your own sections."},{"t":"key","title":"Key points","items":["You and your teacher sign authentication declarations.","Acknowledge every source, tutorial, template and any permitted AI use.","Copying, collusion or passing off generated work is malpractice.","Dated versions of your files are evidence of your own progress."]},{"t":"note","text":"Rules on AI use in coursework are set by JCQ and CCEA and can change. Check your centre's current policy before using any AI tool."}],"diagram":{"kind":"match","title":"Honest practice or malpractice?","caption":"Match each situation to the right response.","pairs":[["Learning DCount from a hub tutorial","Fine: list the tutorial in your references"],["Re-using a friend's ERD with field names changed","Malpractice: copying"],["Pasting a textbook's definition of normalisation","Earns nothing and is plagiarism if unacknowledged"],["Teacher says 'your requirements need numbers'","Allowed general guidance"],["Asking an AI tool to write your evaluation","Malpractice: presenting generated work as your own"]]},"check":[{"q":"What does authentication of coursework mean?","o":["Logging in to the CCEA portal","Password-protecting the database","Checking spelling","Confirmation by candidate and teacher that the work is the candidate's own"],"a":3,"why":"Both sign declarations that the work is the candidate's own, produced under the required conditions."},{"q":"Which of these is acceptable?","o":["Copying a classmate's data dictionary","Using a hub tutorial and referencing it","Having an AI tool write your test plan","Your teacher correcting your normalisation"],"a":1,"why":"Learning a technique from a tutorial is fine if you acknowledge it."},{"q":"Why keep dated versions of your files?","o":["CCEA marks each version","To make the database faster","To show how the work developed and as a backup","To hide changes"],"a":2,"why":"Dated versions show progress over time and protect against corruption."}],"exam":[],"practice":[{"q":"Describe two things a candidate must do to ensure their A2 2 coursework can be authenticated.","m":4,"a":"Complete the work under the required supervised conditions (1) so the teacher can confirm it is the candidate's own (1) / acknowledge all sources, tutorials, templates and any permitted AI use in a references section (1) so it is clear which work is the candidate's own (1). Also credit: sign the candidate declaration; keep dated versions showing development."}],"videos":[{"title":"Understanding the task: case study, planning and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD01-video"}],"terms":["Authentication","Malpractice","Referencing"]},{"id":"c01-p05","spec":"Use appropriate fact-finding methods, including interviewing the client, to investigate a problem","lessons":["AD02"],"summary":"Annotate the scenario, then write an introduction that builds a full picture of the organisation, its people and its current system, explaining how you found out and why each method suited the situation.","blocks":[{"t":"p","text":"Analysis starts with the scenario. Read it several times with three highlighters: one for **data to store** (nouns such as member, book, loan), one for **processes** (verbs such as issue, return, calculate a fine) and one for **outputs** (lists, letters, reports). Circle every rule and number: loan periods, limits, prices, volumes. These lists become your user requirements."},{"t":"p","text":"Then write an introduction that tells the story of the organisation: who is involved and what they do, how the work is done now, the volumes and prices involved, and what the new system will do. Add detail beyond the scenario rather than restating it."},{"t":"h","text":"Fact-finding methods"},{"t":"table","head":["Method","Library example","Why it suits","What it revealed"],"rows":[["Interview","Head librarian","She knows the rules and problems in depth; follow-up questions possible","Loans are 21 days; fines 10p per day capped at £20; 6 books per member"],["Observation","Front desk on a Saturday","Shows what really happens, not what staff think happens","Staff search a card index for every return, causing a queue"],["Document sampling","Membership form, loan slip","Shows the exact data captured now","Postcode and phone are collected but never used"],["Questionnaire","20 members","Many views gathered quickly","Most members want overdue reminders"]]},{"t":"p","text":"An interview uses **open questions** to explore (\"How do you deal with a late return now?\") and **closed questions** to confirm facts (\"Is the loan period always 21 days?\"). Record the answers and show how each finding became a numbered requirement."},{"t":"note","text":"CCEA moderators' reports (2023) say that a separate fact-finding section is not required, because the case study supplies the facts. If you include one, keep it short and use it to justify requirements; do not let it replace a detailed introduction and requirements list. Check the current marking criteria."},{"t":"warn","text":"Copying the scenario back into your introduction earns very little. Add the people, volumes, rules and problems you identified, and give a reason for every method you name."},{"t":"key","title":"Key points","items":["Annotate the scenario: data (nouns), processes (verbs), outputs, rules and numbers.","The introduction describes the organisation, users, current system, problems and the new system's purpose.","Each fact-finding method needs a reason for choosing it and a finding linked to a requirement."]},{"t":"tip","text":"Sentence starters for your own write-up: \"[Organisation] currently manages … using …\", \"I chose to interview … because …\", \"Observing … showed me that …\", \"The new system will allow … to …\"."}],"diagram":{"kind":"table-reveal","title":"Strengths and weaknesses of each method","caption":"Predict each hidden cell, then click to check.","head":["Method","Main advantage","Main disadvantage"],"rows":[["Interview","Depth; can ask follow-up questions","Time-consuming; one person's view"],["Questionnaire","Many views quickly; easy to total","No follow-up; low response rates"],["Observation","Sees real practice and problems people forget","People may act differently when watched"],["Document sampling","Shows the real fields, formats and volumes","Shows no opinions or problems"]],"hidden":[[0,1],[0,2],[1,2],[2,1],[2,2],[3,1]]},"check":[{"q":"Which method best shows the exact data items a membership form collects?","o":["Document sampling","Questionnaire","Interview","Observation"],"a":0,"why":"Sampling the real form shows every field, its format and what is actually captured."},{"q":"Which is a closed question?","o":["How do you handle late returns?","What problems do you have with the card index?","Describe a busy Saturday.","Is the loan period always 21 days?"],"a":3,"why":"A closed question has a short factual answer; it confirms a detail."},{"q":"What should highlighted verbs in the scenario suggest?","o":["Entities","Processes such as forms, queries and code","Field sizes","Hardware"],"a":1,"why":"Verbs (issue, return, calculate) are processes; nouns are data."}],"exam":[],"practice":[{"q":"Give one advantage and one disadvantage of interviewing the client as a fact-finding method.","m":2,"a":"Advantage: detailed answers, and follow-up questions can clarify points (1). Disadvantage: time-consuming / gives only one person's view, which may be biased or incomplete (1)."},{"q":"A candidate writes 'I used observation.' Explain how this could be improved.","m":2,"a":"State what or who was observed and why observation suited it, e.g. it shows real practice at the desk (1) / state what was found and link it to a numbered requirement (1)."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":["Fact-finding","Case study"]},{"id":"c01-p06","spec":"Describe the current system, its data, processes and problems","lessons":["AD02"],"summary":"Describe how the organisation works now (inputs, processing, storage, outputs), list its specific problems, and identify the internal and external constraints that shape your design.","blocks":[{"t":"p","text":"Describe the current system as a set of inputs, processes, stores and outputs, then pin down its problems. Every problem you identify should lead to at least one requirement in the new system, and later to a test and an evaluation comment."},{"t":"table","head":["Part","Riverbank Library now","Problem"],"rows":[["Input","Membership forms filled in by hand","Illegible details; duplicate members"],["Processing","Due dates counted on a calendar; fines worked out by hand","Errors and complaints about fines"],["Storage","Card index of members and loans","Slow to search; cards lost"],["Output","Handwritten reminder notes","Reminders sent late or not at all"]]},{"t":"h","text":"Internal and external constraints"},{"t":"p","text":"A [[Constraint]] is anything that limits the solution. **Internal** constraints come from inside the organisation: budget, staff IT skills, existing hardware and software, time and policies. **External** constraints are outside its control: legislation, suppliers and deadlines set by others. For each one, say *how it affects your design*."},{"t":"table","head":["Constraint","Type","Effect on the library system"],"rows":[["Staff have basic IT skills","Internal","Clear labels, combo boxes and tooltips; a step-by-step user guide"],["Two desk PCs with Windows 11 and Microsoft 365","Internal","Must run in Access on that hardware, with no server"],["UK GDPR and the Data Protection Act 2018","External","Store only the personal data needed; restrict access with a login; back up securely"],["Copyright, Designs and Patents Act 1988","External","Book cover images cannot be copied into the system without permission"]]},{"t":"p","text":"Apply the law to the *actual* personal data your system stores. For the library that means members' names, addresses, phone numbers and emails: collect them only for a clear purpose (contacting members about loans), keep them accurate, and delete them when membership ends. The UK regulator for data protection is the **Information Commission** (formerly the ICO)."},{"t":"warn","text":"A list of every Act you know earns little. Link each law to specific fields or features in your system."},{"t":"key","title":"Key points","items":["Describe current inputs, processing, storage and outputs, with specific problems.","Every problem should lead to a requirement.","Internal constraints: budget, skills, hardware, time, policies. External: law, suppliers, outside deadlines.","Say how each constraint changes your design."]}],"diagram":{"kind":"table-reveal","title":"Internal or external, and what it changes","caption":"Decide the type and the design effect of each constraint before revealing.","head":["Constraint","Type","Design effect"],"rows":[["Library budget allows no new hardware","Internal","Must run on the existing desk PCs"],["UK GDPR: data minimisation","External","No date of birth field unless junior membership needs it"],["Volunteers work a single Saturday shift","Internal","Main tasks reachable from the menu in two clicks"],["Council requires annual loan statistics by 31 March","External","A totals report of loans per month"]],"hidden":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]]},"check":[{"q":"Which is an external constraint?","o":["Staff IT skills","The library's budget","Data protection legislation","Existing PCs"],"a":2,"why":"Legislation is set outside the organisation and is outside its control."},{"q":"What should follow from each problem in the current system?","o":["At least one requirement for the new system","A paragraph of theory","A new table","Nothing"],"a":0,"why":"Problems justify requirements, which are then tested and evaluated."},{"q":"Which is the best constraint statement?","o":["The Data Protection Act applies.","There are many laws.","Computers are needed.","UK GDPR: store members' contact details only to contact them about loans, and protect them with a login."],"a":3,"why":"It names the law, the data and the effect on the design."}],"exam":[],"practice":[{"q":"Identify one internal and one external constraint on a database for a community library, and explain the effect of each on the design.","m":4,"a":"Internal: e.g. volunteers with limited IT skills (1) so forms use combo boxes, clear labels and helpful error messages (1). External: e.g. UK GDPR (1) so only necessary personal data is stored and access is restricted (1)."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":["Constraint"]},{"id":"c01-p07","spec":"Produce a requirements specification with numbered, measurable functional and non-functional requirements","lessons":["AD02"],"summary":"Write numbered user requirements under inputs, processes and outputs, plus non-functional ones, each specific enough to test and later judge as met or not.","blocks":[{"t":"p","text":"The [[Requirements specification]] is the most important page of your analysis. Everything later is measured against it: designs reference it, tests prove it and the evaluation judges it. Give each requirement a reference number (UR1, UR2…) and keep those numbers for the whole project."},{"t":"p","text":"A [[Functional requirement]] says what the system must **do**: the data it stores (inputs), the processing it carries out (searches, calculations, updates, checks) and the outputs it produces. A [[Non-functional requirement]] says how **well** it must do it: usability, performance, security, reliability."},{"t":"table","head":["Ref","Type","Requirement","Why"],"rows":[["UR1","Input","Record member ID, name, address, postcode, phone, email and membership type","Needed to contact members about loans"],["UR4","Process","Issue a loan and set the due date to 21 days after the loan date","Removes manual date counting"],["UR5","Process","Prevent a loan if the member already has 6 books out","Enforces the library's limit"],["UR7","Process","Calculate the fine on return at 10p per day overdue, up to £20","Fines are worked out by hand and often wrong"],["UR9","Output","Print an overdue letter for each member with late books","Replaces handwritten reminders"],["UR14","Non-functional","Only staff with a valid username and password can open the loan forms","Protects members' personal data"]],"caption":"Part of the library requirements specification."},{"t":"h","text":"Make every requirement measurable"},{"t":"p","text":"A [[Measurable requirement]] has a target you can test objectively. If you cannot imagine a test with an expected result, rewrite it. Vague words such as *easy*, *fast* and *efficient* need numbers attached."},{"t":"p","text":"Include processes the client would really run, not just data entry: for example, *list books not borrowed for two years so they can be withdrawn*, or *count loans per month for the council*. Rich processes lead to richer queries, reports and code later, and moderators note that candidates with too few requirements struggle to produce detailed designs."},{"t":"warn","text":"\"The system should be easy to use\" cannot be tested. \"Every command button has a tooltip and every main form opens from the menu in no more than two clicks\" can."},{"t":"key","title":"Key points","items":["Number every requirement (UR1…) and reuse the numbers everywhere.","Functional = what it does (inputs, processes, outputs); non-functional = how well.","Every requirement must be specific and testable.","Give a reason (\"why\") linked to the client's problems."]},{"t":"tip","text":"Aim for enough requirements to drive a rich design: several inputs, a range of processes (validation, calculations, searches, updates) and several outputs."}],"diagram":{"kind":"table-reveal","title":"From weak to measurable","caption":"Work out why each requirement is weak and how you would rewrite it, then reveal.","head":["Weak requirement","Why it is weak","Measurable version"],"rows":[["The system should be fast","Fast compared with what?","A surname search returns results in under 3 seconds with 5000 loans stored"],["Store member details","Which details?","Store member ID, forename, surname, address, postcode, phone, email and membership type"],["Stop mistakes with fines","Which mistakes? How?","Fine calculated as 10p per day overdue, capped at £20, with no manual entry"],["Easy for volunteers
