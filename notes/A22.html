","Cannot be judged objectively","A new volunteer can issue a loan in under 1 minute after a 5-minute demonstration"]],"hidden":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]]},"check":[{"q":"Which is a non-functional requirement?","o":["Calculate the fine at 10p per day","Only logged-in staff can open loan forms","Print overdue letters","Store the member's email"],"a":1,"why":"Security is a quality of the system, not a function it performs."},{"q":"Why number requirements?","o":["Access needs numbers","To show how many there are","So designs, tests and evaluation can refer back to them","CCEA sets the numbers"],"a":2,"why":"Numbers make traceability possible."},{"q":"Which requirement is measurable?","o":["A search by surname returns results in under 3 seconds","The system will be user-friendly","Reports should look good","The system must be efficient"],"a":0,"why":"It has a specific, testable target."}],"exam":[],"practice":[{"q":"Distinguish between a functional and a non-functional requirement, giving an example of each for a library system.","m":4,"a":"Functional: what the system must do (1), e.g. calculate a fine at 10p per day overdue (1). Non-functional: how well it performs, e.g. usability, security, performance (1), e.g. a search returns results in under 3 seconds (1)."},{"q":"Explain why the requirement 'The system should be user-friendly' is weak and rewrite it.","m":3,"a":"It is vague / cannot be tested objectively (1) because there is no measurable target (1). Rewrite with a target, e.g. a new volunteer can issue a loan in under 1 minute after a 5-minute demonstration (1)."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":["Requirements specification","Functional requirement","Non-functional requirement","Measurable requirement"]},{"id":"c01-p08","spec":"Produce a requirements specification with numbered, measurable functional and non-functional requirements","lessons":["AD02"],"summary":"Categorise every user requirement as essential or non-essential, with a justification linked to the client's needs; non-essential requirements later feed your future extensions.","blocks":[{"t":"p","text":"Once your requirements are listed, categorise each one. An [[Essential requirement]] is one the system cannot do without: if it is missing, the client cannot replace the current system. A [[Non-essential requirement]] would improve the system, but the client could still manage without it. Moderators' reports note that requirements are usually categorised this way and that good candidates later use the non-essential ones as their future extensions."},{"t":"table","head":["Ref","Requirement","Category","Justification"],"rows":[["UR4","Issue a loan with due date 21 days later","Essential","The card index cannot be replaced without it"],["UR5","Prevent a seventh loan","Essential","The 6-book limit is a library rule that is often broken now"],["UR7","Calculate fines on return","Essential","Hand calculation is the main cause of complaints"],["UR9","Print overdue letters","Essential","Reminders are currently late or missed"],["UR12","Email overdue reminders","Non-essential","Useful, but printed letters already meet the need"],["UR13","Show a chart of loans per month","Non-essential","The totals report gives the council the figures it needs"]]},{"t":"h","text":"How to justify a category"},{"t":"p","text":"Link every justification to the client's problems or rules, not to how hard the feature is to build. \"Essential because it is easy\" or \"non-essential because I might not have time\" are not justifications. Ask: *could the library run without this on day one?*"},{"t":"example","title":"Worked example: categorising UR10","steps":["UR10: \"Search for a book by part of its title.\"","Without it, staff could still find a book by scrolling the book form, but slowly, with a queue at the desk.","The observation showed long queues are a key problem, so search speed matters to the client.","Decision: essential, because without a search the main desk problem identified in the analysis is not solved."],"context":"Decide whether this requirement is essential.","answer":"UR10 is essential, justified by the queueing problem found in observation."},{"t":"p","text":"Prioritise your build in the same order: essential requirements first, non-essential ones if time allows. In the evaluation, an unmet non-essential requirement becomes a well-justified future extension rather than a failure."},{"t":"key","title":"Key points","items":["Every requirement appears with a category and a justification.","Essential: the client cannot replace the current system without it.","Non-essential: improves the system but the client can manage without it.","Build essential requirements first; non-essential ones feed future extensions."]},{"t":"tip","text":"Sentence starters: \"This requirement is essential because, without it, the client could not …\"; \"This is non-essential because the client can still … but it would improve …\"."}],"diagram":{"kind":"compare","title":"Essential or non-essential?","caption":"Toggle between the two categories to compare what belongs in each for the library.","states":[{"label":"Essential","points":["Record members and books (UR1, UR2)","Issue a loan with a due date (UR4)","Enforce the 6-book limit (UR5)","Record returns and calculate fines (UR6, UR7)","Overdue letters (UR9)","Staff login (UR14)"],"art":null},{"label":"Non-essential","points":["Email reminders (UR12)","Chart of loans per month (UR13)","Reserve a book that is on loan (UR15)","Barcode scanning (UR16)","Each would improve the service, but the library can open without them"],"art":null}]},"check":[{"q":"What makes a requirement essential?","o":["It is easy to build","It uses VBA","It is listed first","The client could not replace the current system without it"],"a":3,"why":"Essential means the system fails its main purpose without it."},{"q":"Which is a valid justification for 'non-essential'?","o":["I may not have time","Printed letters already meet the need; email would improve it","It is hard to code","The teacher said so"],"a":1,"why":"Justifications must be linked to the client's needs."},{"q":"How are unmet non-essential requirements best used in the evaluation?","o":["Ignored","Marked as fully met","As future extensions, with how they would be done","Deleted from the analysis"],"a":2,"why":"Moderators credit extensions derived from the non-essential requirements."}],"exam":[],"practice":[{"q":"A library wants overdue reminders sent by email. Explain whether this should be essential or non-essential if printed overdue letters are already a requirement.","m":2,"a":"Non-essential (1) because printed letters already meet the need to remind members, so email is an improvement rather than something the library cannot manage without (1)."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":["Essential requirement","Non-essential requirement"]},{"id":"c01-p09","spec":"Model the proposed system using data flow diagrams","lessons":["AD02"],"summary":"A Level 0 (context) DFD shows the whole system as one process with its external entities; Level 1 breaks it into numbered processes and data stores, keeping every Level 0 flow.","blocks":[{"t":"p","text":"A [[Data flow diagram]] (DFD) shows how **data moves** through the proposed system. It has four symbols: [[external entities|External entity]] (people or organisations outside the system that send or receive data), **processes** (numbered, named with a verb, transforming data), [[data stores|Data store]] (data at rest, labelled D1, D2…) and **data flows** (labelled arrows naming the data)."},{"t":"h","text":"Level 0: the context diagram"},{"t":"p","text":"The [[Context diagram]] shows the whole system as a single process with every external entity and every flow in and out. No data store appears, and no flow goes directly between two entities."},{"t":"h","text":"Level 1"},{"t":"p","text":"Level 1 explodes the single process into the main processes (1, 2, 3…) and adds the data stores. The data stores should match your tables (D1 Members ↔ tblMember). Level 1 must **balance** with Level 0: every flow to or from an external entity at Level 0 appears at Level 1, attached to the process that handles it."},{"t":"table","head":["Rule","Why"],"rows":[["Every process has at least one input and one output","A process transforms data; nothing in or nothing out is an error"],["Data never flows store-to-store or entity-to-entity","A process must move or change it"],["Flows are labelled with nouns (Loan details); processes with verb phrases (Issue loan)","Clear meaning"],["One notation, used consistently, with a key","The moderator can read it"]]},{"t":"warn","text":"A DFD is not a flowchart. No decision diamonds, no yes/no arrows, no loops. Moderators report that DFDs often lack accuracy, especially in the data flows, so check every arrow has a label and connects to a process."},{"t":"key","title":"Key points","items":["Four symbols: external entity, process, data store, data flow.","Level 0: one process, all entities and flows, no stores.","Level 1: numbered processes and data stores (matching your tables), balanced with Level 0.","Use the notation in the CCEA specification, with a key."]},{"t":"tip","text":"Draw the DFDs in draw.io (diagrams.net) or Visio, export at high resolution and caption them. Toggle the levels in the diagram here and check that the Member and Librarian flows match exactly."}],"diagram":{"kind":"dfd","title":"Riverbank Library: Level 0 and Level 1","caption":"Toggle the levels. The two entities and seven external flows are the same on both, so the diagram balances.","levels":[{"label":"Context diagram (Level 0)","entities":["Member","Librarian"],"processes":[{"id":"0","label":"Library Loans System"}],"stores":[],"flows":[["Member","0","Membership details"],["0","Member","Membership card"],["0","Member","Overdue letter"],["Librarian","0","Book details"],["Librarian","0","Loan details"],["Librarian","0","Return details"],["0","Librarian","Loans report"]]},{"label":"Level 1","entities":["Member","Librarian"],"processes":[{"id":"1","label":"Register member"},{"id":"2","label":"Add book"},{"id":"3","label":"Issue loan"},{"id":"4","label":"Return book"},{"id":"5","label":"Produce reports"}],"stores":[{"id":"D1","label":"Members"},{"id":"D2","label":"Books"},{"id":"D3","label":"Loans"}],"flows":[["Member","1","Membership details"],["1","D1","New member record"],["1","Member","Membership card"],["Librarian","2","Book details"],["2","D2","New book record"],["Librarian","3","Loan details"],["D1","3","Member status"],["D3","3","Books currently out"],["D2","3","Book status"],["3","D3","Loan record"],["3","D2","Status: on loan"],["Librarian","4","Return details"],["D3","4","Loan record"],["4","D3","Return date and fine"],["4","D2","Status: available"],["D1","5","Member contact details"],["D3","5","Overdue loans"],["5","Member","Overdue letter"],["5","Librarian","Loans report"]]}]},"check":[{"q":"What does a context diagram show?","o":["The whole system as one process with its external entities and flows","Every table","The order of steps with decisions","Field validation"],"a":0,"why":"Level 0 = one process plus entities and flows, no stores."},{"q":"Which flow is NOT allowed?","o":["Member → Register member","Loans store → Return book","Produce reports → Librarian","Members store → Loans store"],"a":3,"why":"Data cannot move store-to-store without a process."},{"q":"What does it mean for Level 1 to balance with Level 0?","o":["Both have the same number of processes","Every external flow at Level 0 appears at Level 1","Both have data stores","Flows are the same length"],"a":1,"why":"Balancing keeps the external inputs and outputs identical."},{"q":"How should Level 1 data stores relate to the database?","o":["They are unrelated","They must be queries","They should match the tables","They should be forms"],"a":2,"why":"D1 Members, D2 Books, D3 Loans correspond to tblMember, tblBook, tblLoan."}],"exam":[],"practice":[{"q":"State the purpose of each DFD symbol: external entity, process, data store and data flow.","m":4,"a":"External entity: a source or destination of data outside the system (1). Process: transforms or acts on data (1). Data store: holds data at rest, e.g. a table (1). Data flow: shows data moving between the other symbols, labelled with the data (1)."},{"q":"Describe the difference between a context diagram and a level 1 DFD.","m":2,"a":"A context diagram shows the whole system as one process with its external entities and no data stores (1); a level 1 DFD breaks that process into its main numbered processes and shows the data stores (1)."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":["Data flow diagram","Context diagram","External entity","Data store"]},{"id":"c01-p10","spec":"State the hardware and software needed to run and document the solution","lessons":["AD02"],"summary":"List the hardware and software needed to run the database, write the documentation and read it as a PDF, with a reason for every item linked to the client's system.","blocks":[{"t":"p","text":"The last analysis section states what the client needs to run your system. Use your own school or home computer as a rough guide, but write it for the client's situation. Give separate headings for hardware and software, and a **reason** for every item."},{"t":"table","head":["Item","Requirement","Reason"],"rows":[["Processor","Dual-core 1.6 GHz or faster","Meets the Microsoft 365 minimum; queries on a few thousand records run quickly"],["RAM","8 GB","Access, Word and a browser open together at the desk"],["Storage","SSD with at least 10 GB free","Office installation plus the database, which grows as loans are added"],["Display","1920 × 1080 monitor","Forms are designed for this resolution, so nothing is cut off"],["Input","Keyboard and mouse (barcode scanner later)","Data entry at the desk"],["Printer","Laser printer","Overdue letters and reports printed weekly"],["Backup","OneDrive or a USB drive","The database is one .accdb file and must be backed up daily"]]},{"t":"h","text":"Software"},{"t":"list","items":["**Operating system**: Windows 11 (Access runs only on Windows).","**Microsoft Access** (Microsoft 365) to run the database and its VBA. Staff without a licence can use the free **Access Runtime**, which runs the forms and code but cannot change the design.","**Word** to maintain the user guide, and a **PDF reader** to view the guide and write-up."],"ordered":false},{"t":"note","text":"Check the minimum requirements on Microsoft's website at the time you write; they change between versions. Give the versions you actually used to build and test the system."},{"t":"warn","text":"Out-of-date specifications (old versions of Windows or Office) look copied from an old write-up, and a list with no reasons earns little."},{"t":"key","title":"Key points","items":["Separate hardware and software headings.","Hardware: processor, RAM, storage, display, input, printer, backup, each with a reason.","Software: OS, Access (or Access Runtime), Word and a PDF reader, current versions."]}],"diagram":{"kind":"hotspot","title":"The library desk set-up","caption":"Click each part for its requirement and the reason it matters to the library.","rows":[[{"label":"Desk PC","detail":"Windows 11, dual-core 1.6 GHz or faster, 8 GB RAM, SSD. Runs Access with the forms and VBA.","span":2},{"label":"Monitor","detail":"1920 × 1080 so every form fits without scrolling.","span":1}],[{"label":"Keyboard and mouse","detail":"Data entry for members, books and loans.","span":1},{"label":"Barcode scanner","detail":"Future extension: acts as a keyboard to enter BookID quickly.","span":1},{"label":"Laser printer","detail":"Overdue letters, loan slips and the monthly loans report.","span":1}],[{"label":"Access / Access Runtime","detail":"Runs the database. Runtime is free but cannot edit the design.","span":2},{"label":"Backup to OneDrive","detail":"Daily backup of the single .accdb file; restore steps go in the user guide.","span":1}]],"links":[["Desk PC","Monitor"],["Desk PC","Keyboard and mouse"],["Desk PC","Barcode scanner"],["Desk PC","Laser printer"],["Desk PC","Access / Access Runtime"],["Desk PC","Backup to OneDrive"]]},"check":[{"q":"What lets a member of staff without an Access licence run your database?","o":["Access Runtime","Word","A PDF reader","Excel"],"a":0,"why":"The free Access Runtime runs forms, reports and code but not design view."},{"q":"Which is the best hardware statement?","o":["8 GB RAM","Lots of RAM","A fast computer","8 GB RAM so Access, Word and a browser can run together at the desk"],"a":3,"why":"Each item needs a reason linked to the system."},{"q":"Why is a backup device listed?","o":["Access needs it to run","The whole database is a single file that must be protected","To print reports","For the barcode scanner"],"a":1,"why":"One corrupted .accdb file could lose every record."}],"exam":[],"practice":[{"q":"State two items of hardware needed to run a library database at a front desk and give a reason for each.","m":4,"a":"Laser printer (1) to print overdue letters and reports (1). Backup device or cloud storage (1) because the database is a single file that must be backed up (1). Also credit: monitor of suitable resolution so forms fit; sufficient RAM to run Access and other software together."}],"videos":[{"title":"Analysis: client, current system and requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD02-video"}],"terms":[]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]}},{"id":"c02","n":2,"title":"Design","intro":"Every design section of the write-up: structure diagrams, the ERD, normalisation from 0NF to 3NF, data dictionaries, and designs for forms, queries, reports and VBA algorithms.","pages":[{"id":"c02-p01","spec":"Break the problem down with structure diagrams before designing the detail","lessons":["AD03"],"summary":"A structure diagram decomposes the whole system into modules, then each module into smaller sub-tasks, until every box is one simple job you could build in one go.","blocks":[{"t":"p","text":"Good design starts by breaking the problem down. A [[Structure diagram]] shows the whole system at the top, its main **modules** on the next level, and each module broken into smaller and smaller sub-tasks below that. This is **top-down design** (decomposition): you keep going until each box at the bottom is one simple job you could build in one sitting."},{"t":"p","text":"The modules should match the way users will see the system: usually one module per menu option. That makes the structure diagram a bridge between your requirements and your menus, forms and code."},{"t":"code","lang":"ps","code":"Library Loans System\n├── Members\n│   ├── Add member ── validate details ── save record\n│   └── Search member by surname\n├── Loans\n│   ├── Issue loan ── check member limit ── check book available ── save loan ── set book On loan\n│   └── Return loan ── record return date ── calculate fine ── set book Available\n├── Books\n│   ├── Add book\n│   └── Withdraw old stock\n└── Reports\n    ├── Overdue letters\n    └── Loans per month","title":"The library system decomposed (text version of the diagram)"},{"t":"h","text":"What moderators look for"},{"t":"list","items":["A top-level diagram showing the system and every main module.","Each module broken down **at least two more levels**, with its own diagram if it is large.","Lowest-level boxes that are small enough to become one form control, one query or one procedure.","Names that match your menus, forms and requirement numbers."],"ordered":false},{"t":"warn","text":"A single row of boxes is not a breakdown. If a box says \"Loans\" with nothing below it, you haven't designed anything yet."},{"t":"key","title":"Key points","items":["Top-down decomposition: system → modules → sub-tasks → simple tasks.","Modules normally match menu options.","Lowest boxes become specific forms, queries, reports and procedures."]},{"t":"tip","text":"Label each lowest-level box with the requirement it meets (\"check member limit, UR5\"). It makes the link to your later designs obvious."}],"diagram":{"kind":"hotspot","title":"Structure diagram: Library Loans System","caption":"Click a box to see what it becomes in the finished database. Lines show the breakdown from system to modules to tasks.","rows":[[{"label":"Library Loans System","detail":"The whole system. Its main menu (frmMainMenu) has one button per module.","span":4}],[{"label":"Members","detail":"Module behind the Members menu button: frmMember and qrySearchMember.","span":1},{"label":"Loans","detail":"Module behind Issue and Return: frmIssueLoan and frmReturn with their VBA.","span":1},{"label":"Books","detail":"Module for stock: frmBook and the withdraw-old-stock query.","span":1},{"label":"Reports","detail":"Module behind the Reports menu: rptOverdueLetters and rptLoansPerMonth.","span":1}],[{"label":"Add member","detail":"frmMember in add mode with validation on postcode, email and phone (UR1).","span":1},{"label":"Issue loan","detail":"cmdIssue_Click: check the 6-book limit, check the book is available, save, set status (UR4, UR5).","span":1},{"label":"Return loan","detail":"Record ReturnDate, calculate fine at 10p per day up to £20, set book Available (UR6, UR7).","span":1},{"label":"Overdue letters","detail":"rptOverdueLetters based on qryOverdueLoans, one page per member (UR9).","span":1}]],"links":[["Library Loans System","Members"],["Library Loans System","Loans"],["Library Loans System","Books"],["Library Loans System","Reports"],["Members","Add member"],["Loans","Issue loan"],["Loans","Return loan"],["Reports","Overdue letters"]]},"check":[{"q":"What is the purpose of a structure diagram?","o":["To show data moving between entities","To show table relationships","To break the system into modules and smaller sub-tasks","To plan dates"],"a":2,"why":"It is a top-down decomposition of the problem."},{"q":"When should you stop breaking a box down?","o":["When each box is one simple task you could build in one go","After one level","When the diagram fills a page","Never"],"a":0,"why":"Lowest-level boxes should be simple enough to implement directly."},{"q":"The modules in a structure diagram usually match…","o":["the tables","the data types","the hardware","the menu options"],"a":3,"why":"One module per menu option keeps design and build aligned."}],"exam":[],"practice":[{"q":"Explain how a structure diagram helps a developer design a database application.","m":3,"a":"It breaks the problem into manageable modules and sub-tasks (top-down) (1) / each lowest-level task can be designed and built as a specific form, query, report or procedure (1) / it shows how parts relate to the menu and to requirements, so nothing is missed (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Structure diagram"]},{"id":"c02-p02","spec":"Design a relational database using an entity relationship diagram and normalised tables in third normal form","lessons":["AD03"],"summary":"Show how your ER diagram developed: identify entities and relationships, resolve each many-to-many with a link entity, and make the final ERD match your normalised tables and Access relationships.","blocks":[{"t":"p","text":"An [[Entity relationship diagram]] (ERD) shows the [[entities|Entity]] the system stores data about and the relationships between them. Relationships are one-to-one (1:1), one-to-many (1:M) or many-to-many (M:M), usually drawn with crow's foot notation (the \"foot\" is at the many end)."},{"t":"h","text":"Show the process, not just the answer"},{"t":"p","text":"Moderators want to see how you reached your ERD, and they expect it to link to your normalised tables. Present it in stages."},{"t":"example","title":"Worked example: resolving the library's many-to-many","steps":["Stage 1. Entities identified from the scenario: MEMBER, BOOK, MEMBERSHIP_TYPE.","A member borrows many books, and over time a book is borrowed by many members: MEMBER M:M BOOK.","A relational database cannot implement M:M directly: there is nowhere to store the loan date, due date or return date of each borrowing.","Stage 2. Introduce a [[link entity|Link entity]] LOAN. Each loan belongs to one member and one book: MEMBER 1:M LOAN and BOOK 1:M LOAN.","LOAN holds data about the borrowing itself (LoanDate, DueDate, ReturnDate, Fine) and the foreign keys MemberID and BookID.","MEMBERSHIP_TYPE 1:M MEMBER: each type (Adult, Junior, Concession) applies to many members."],"context":"MEMBER borrows BOOK.","answer":"Final ERD: MEMBERSHIP_TYPE 1:M MEMBER 1:M LOAN M:1 BOOK, with every relationship one-to-many."},{"t":"h","text":"Keys"},{"t":"p","text":"Every entity has a [[Primary key]] that uniquely identifies each record. The relationship is created by a [[Foreign key]] at the *many* end: MemberID and BookID in LOAN, MembershipType in MEMBER. Show both on the final diagram."},{"t":"table","head":["Check","Library ERD"],"rows":[["Every M:M resolved","MEMBER–BOOK resolved by LOAN"],["Foreign key at the many end","LOAN.MemberID, LOAN.BookID, MEMBER.MembershipType"],["Matches the 3NF tables","Four entities = four tables after normalisation"],["Matches Access","Same four tables and three relationships in the Relationships window"]]},{"t":"warn","text":"Presenting only the finished diagram loses the marks for the process. And search your write-up for \"insert\" before hand-in: a forgotten \"insert ERD here\" placeholder is a common, costly slip."},{"t":"key","title":"Key points","items":["Stage 1: entities and relationships as first found, including M:M.","Stage 2: each M:M resolved with a link entity, explained.","Final: all 1:M (or 1:1 with a reason), keys shown, matching normalisation and Access."]}],"diagram":{"kind":"compare","title":"Library ERD: before and after","caption":"Toggle between the first attempt and the resolved design. The link entity LOAN carries data that had nowhere to go.","states":[{"label":"Stage 1: first attempt","points":["MEMBERSHIP_TYPE 1 ── M MEMBER","MEMBER M ── borrows ── M BOOK","Problem: no place for LoanDate, DueDate, ReturnDate or Fine","Access cannot store a many-to-many relationship directly"],"art":null},{"label":"Stage 2: resolved","points":["MEMBERSHIP_TYPE 1 ── M MEMBER","MEMBER 1 ── M LOAN","BOOK 1 ── M LOAN","LOAN is a link entity: LoanID (PK), MemberID (FK), BookID (FK), LoanDate, DueDate, ReturnDate, Fine"],"art":null},{"label":"In Access","points":["tblMembershipType, tblMember, tblLoan, tblBook","Three one-to-many relationships in the Relationships window","Enforce Referential Integrity ticked on each","Screenshot this in the Development chapter"],"art":null}]},"check":[{"q":"Why must a many-to-many relationship be resolved?","o":["Access draws it badly","A relational database cannot implement it directly and the shared data has nowhere to go","It is always wrong","It slows queries"],"a":1,"why":"A link entity stores the data about each pairing and creates two 1:M relationships."},{"q":"In the library, where does the foreign key BookID go?","o":["BOOK","MEMBER","LOAN","MEMBERSHIP_TYPE"],"a":2,"why":"Foreign keys sit at the many end of a relationship: one book has many loans."},{"q":"What should the final ERD agree with?","o":["The normalised 3NF tables and the Access relationships","The Gantt chart","The hardware list","The user guide"],"a":0,"why":"Inconsistent names between ERD, tables and data dictionary are a common weakness."}],"exam":[],"practice":[{"q":"Explain why a many-to-many relationship between Member and Book must be resolved, and how it is resolved.","m":3,"a":"Relational databases cannot implement M:M directly / data about each loan (dates, fine) has nowhere to be stored (1). Create a link entity LOAN (1) with a 1:M relationship from MEMBER to LOAN and from BOOK to LOAN, containing MemberID and BookID as foreign keys (1)."},{"q":"Define the term foreign key.","m":2,"a":"A field in one table that is the primary key of another table (1), used to link the tables in a relationship (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Entity relationship diagram","Entity","Link entity","Primary key","Foreign key"]},{"id":"c02-p03","spec":"Design a relational database using an entity relationship diagram and normalised tables in third normal form","lessons":["AD03"],"summary":"Normalisation starts from all the data on a source document (0NF), then removes repeating groups to reach 1NF, explaining each change and marking keys.","blocks":[{"t":"p","text":"[[Normalisation]] organises data into related tables so that each fact is stored once. This removes **redundancy** and prevents [[anomalies|Anomaly]]: an *update* anomaly (changing a fee in hundreds of records), an *insertion* anomaly (cannot add a new book until someone borrows it) and a *deletion* anomaly (deleting a member's last loan loses the book's details)."},{"t":"h","text":"0NF: unnormalised"},{"t":"p","text":"List every data item from your source documents (membership form, loan slip) as one relation, with the [[repeating group|Repeating group]] in braces. A repeating group is a set of fields that occurs many times for one key value."},{"t":"code","lang":"ps","code":"MEMBER (MemberID, Name, Phone, MembershipType, AnnualFee,\n        {BookID, Title, Author, LoanDate, DueDate})","title":"0NF: underline the key in your write-up; braces mark the repeating group"},{"t":"p","text":"The braces repeat because one member has many loans."},{"t":"h","text":"1NF: remove the repeating group"},{"t":"p","text":"A relation is in [[First normal form]] when it has no repeating groups, every field is **atomic** (one value), and it has a primary key. Move the repeating group to its own table, taking the original key with it, and choose a key for the new table."},{"t":"code","lang":"ps","code":"MEMBER      (MemberID, Name, Phone, MembershipType, AnnualFee)\nMEMBER_LOAN (MemberID*, BookID, LoanDate, Title, Author, DueDate)\n\nKey of MEMBER_LOAN: MemberID + BookID + LoanDate (composite)\n* = foreign key","title":"1NF"},{"t":"p","text":"Why that composite key? MemberID + BookID is not enough, because the same member can borrow the same book again later. Adding LoanDate makes each row unique."},{"t":"note","text":"Name should really be split into Forename and Surname to be fully atomic and to let staff sort by surname. Say so in your write-up: it shows you understand atomicity."},{"t":"key","title":"Key points","items":["0NF: all data as one relation; repeating group in braces.","1NF: no repeating groups, atomic fields, primary key; repeating group moved out with the original key.","Explain each step in a sentence or two, naming the fields you moved."]},{"t":"tip","text":"Sentence starters: \"In 0NF, the repeating group is … because one … can have many …\"; \"To reach 1NF, I moved … into a separate table and chose … as the key because …\"."}],"diagram":{"kind":"table-reveal","title":"0NF to 1NF: predict each step","caption":"Work out each hidden cell before you reveal it.","head":["Stage","Relation(s)","What changed and why"],"rows":[["0NF","MEMBER (MemberID, Name, Phone, MembershipType, AnnualFee, {BookID, Title, Author, LoanDate, DueDate})","All data from the membership form and loan slips; one member has many loans, so the loan fields repeat"],["1NF","MEMBER (MemberID, Name, Phone, MembershipType, AnnualFee)","Non-repeating fields stay with key MemberID"],["1NF","MEMBER_LOAN (MemberID*, BookID, LoanDate, Title, Author, DueDate)","Repeating group moved out with MemberID; key MemberID + BookID + LoanDate because a member can borrow the same book twice"]],"hidden":[[0,2],[1,1],[2,1],[2,2]]},"check":[{"q":"What is a repeating group?","o":["A field with a default value","Two tables with the same key","A query that runs twice","A set of fields that occurs many times for one key value"],"a":3,"why":"e.g. the loan fields repeat for each member."},{"q":"Why does MEMBER_LOAN need LoanDate in its key?","o":["Access needs dates in keys","The same member can borrow the same book more than once","LoanDate is unique on its own","To sort the table"],"a":1,"why":"MemberID + BookID alone would repeat for a second loan of the same book."},{"q":"Which is an insertion anomaly in the 0NF data?","o":["Changing a fee in many rows","Deleting a member","A new book cannot be recorded until someone borrows it","A slow query"],"a":2,"why":"Book details only exist inside loan rows, so an unborrowed book cannot be stored."}],"exam":[],"practice":[{"q":"Explain what is meant by first normal form and describe how data in 0NF is converted to 1NF.","m":4,"a":"1NF: no repeating groups (1), every field atomic and a primary key identified (1). Conversion: move the repeating group into a new table (1) taking the original primary key with it as part of a (composite) key / choose a key for the new table (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Normalisation","Anomaly","Repeating group","First normal form"]},{"id":"c02-p04","spec":"Design a relational database using an entity relationship diagram and normalised tables in third normal form","lessons":["AD03"],"summary":"2NF removes partial dependencies on part of a composite key; 3NF removes transitive dependencies between non-key fields; the 3NF tables then become your Access tables.","blocks":[{"t":"h","text":"2NF: remove partial dependencies"},{"t":"p","text":"A relation is in [[Second normal form]] when it is in 1NF and no non-key field depends on only **part** of a composite key (a [[Partial dependency]]). This only matters for tables with composite keys."},{"t":"p","text":"In MEMBER_LOAN the key is MemberID + BookID + LoanDate. Title and Author depend only on BookID, so they move to a new BOOK table. DueDate depends on the whole key (this member, this book, this date), so it stays."},{"t":"code","lang":"ps","code":"MEMBER (MemberID, Name, Phone, MembershipType, AnnualFee)\nLOAN   (MemberID*, BookID*, LoanDate, DueDate)\nBOOK   (BookID, Title, Author)","title":"2NF"},{"t":"h","text":"3NF: remove transitive dependencies"},{"t":"p","text":"A relation is in [[Third normal form]] when it is in 2NF and no non-key field depends on another non-key field (a [[Transitive dependency]]). In MEMBER, AnnualFee depends on MembershipType, not on MemberID: every Adult pays the same fee. So it moves to its own table."},{"t":"code","lang":"ps","code":"MEMBERSHIP_TYPE (MembershipType, AnnualFee)\nMEMBER          (MemberID, Forename, Surname, Phone, MembershipType*)\nLOAN            (MemberID*, BookID*, LoanDate, DueDate)\nBOOK            (BookID, Title, Author)","title":"3NF"},{"t":"p","text":"The summary rule: every non-key field depends on **the key, the whole key, and nothing but the key**."},{"t":"h","text":"From 3NF to Access"},{"t":"p","text":"Each 3NF relation becomes a table (tblMembershipType, tblMember, tblLoan, tblBook). In Access you may replace LOAN's three-part composite key with an AutoNumber **LoanID** for simplicity; say so and explain that MemberID and BookID remain as foreign keys. Fields such as ReturnDate and Fine are then added to tblLoan as the design develops."},{"t":"note","text":"DueDate could be calculated from LoanDate + 21, which would make it derived data. It is stored here because staff can renew a loan and change the due date. Justify decisions like this in your write-up."},{"t":"warn","text":"Tables alone do not show understanding. Write one or two sentences per stage naming the fields you moved and the dependency you removed, and mark primary keys (underlined) and foreign keys (*) at every stage."},{"t":"key","title":"Key points","items":["2NF: no partial dependencies (only relevant with a composite key).","3NF: no transitive dependencies between non-key fields.","The key, the whole key and nothing but the key.","Your 3NF tables must match your ERD and data dictionaries."]}],"diagram":{"kind":"table-reveal","title":"1NF to 3NF: the dependency removed at each step","caption":"Reveal the field that moves and the reason at each stage.","head":["Stage","Field(s) moved","Depends on","New table"],"rows":[["1NF → 2NF","Title, Author","BookID only (part of the key)","BOOK (BookID, Title, Author)"],["1NF → 2NF","DueDate stays","The whole key MemberID + BookID + LoanDate","LOAN"],["2NF → 3NF","AnnualFee","MembershipType, a non-key field","MEMBERSHIP_TYPE (MembershipType, AnnualFee)"]],"hidden":[[0,1],[0,2],[0,3],[1,2],[2,1],[2,2],[2,3]]},"check":[{"q":"A partial dependency exists when a non-key field depends on…","o":["only part of a composite key","another non-key field","the whole key","a foreign key in another table"],"a":0,"why":"Removing these gives 2NF."},{"q":"A table BOOK (BookID, Title, PublisherID, PublisherPhone). Which normal form is broken?","o":["1NF","2NF","None","3NF"],"a":3,"why":"PublisherPhone depends on PublisherID, a non-key field: a transitive dependency."},{"q":"Which tables does the library have in 3NF?","o":["MEMBER and LOAN","MEMBERSHIP_TYPE, MEMBER, LOAN, BOOK","One table with all fields","MEMBER_LOAN and BOOK"],"a":1,"why":"Four tables, matching the four entities on the ERD."},{"q":"Why does 2NF only matter where a key is composite?","o":["Composite keys are illegal","Access requires it","Single-field keys cannot have parts, so partial dependency is impossible","It doesn't"],"a":2,"why":"With a one-field key there is no 'part' to depend on."}],"exam":[],"practice":[{"q":"A Book table contains BookID, Title, PublisherID and PublisherPhone, where the phone number depends on the publisher. Explain which normal form is not satisfied and how to correct it.","m":4,"a":"Not in 3NF (1) because PublisherPhone depends on PublisherID, a non-key attribute, i.e. a transitive dependency (1). Create PUBLISHER (PublisherID, PublisherPhone) (1) and keep PublisherID in BOOK as a foreign key (1)."},{"q":"State what is meant by a table being in third normal form.","m":2,"a":"It is in 2NF (1) and no non-key attribute depends on another non-key attribute / there are no transitive dependencies (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Second normal form","Third normal form","Partial dependency","Transitive dependency"]},{"id":"c02-p05","spec":"Produce a data dictionary showing field names, data types, sizes, validation and keys","lessons":["AD03"],"summary":"One data dictionary per table: every field's name, description, type, size, format or input mask, a real validation rule with its reason and exact error message, and its key status.","blocks":[{"t":"p","text":"A [[Data dictionary]] is the exact specification of every field in every table. Someone else should be able to build your tables from it without asking you anything. Give one per table, each introduced with a sentence saying what the table stores."},{"t":"table","head":["Field","Description","Type","Size","Format / mask","Validation","Reason","Error message"],"rows":[["LoanID (PK)","Unique loan number","AutoNumber","Long Integer","–","–","Generated by Access","–"],["MemberID (FK)","Member borrowing the book","Number","Long Integer","–","Must exist in tblMember (referential integrity)","No loans to non-members","Choose a member from the list."],["LoanDate","Date issued","Date/Time","–","Short Date; default =Date()","<=Date()","A loan cannot be in the future","The loan date can't be after today."],["DueDate","Date the book must be returned","Date/Time","–","Short Date","[DueDate]>[LoanDate] (table rule)","Due date must follow the loan","The due date must be after the loan date."],["Fine","Fine charged on return","Currency","–","£0.00","Between 0 And 20","The library caps fines at £20","Fines must be between £0 and £20."]],"caption":"tblLoan: one record for each time a book is borrowed."},{"t":"h","text":"Choosing types, sizes and rules"},{"t":"list","items":["Use **Short Text** for codes and phone numbers (they are not calculated and may start with 0); **Number** (Long Integer) for foreign keys that point at AutoNumber keys; **Currency** for money; **Date/Time** for dates; **Yes/No** for flags.","Give a sensible field size: 30 for a surname, 8 for a postcode.","Write the actual rule, e.g. `Between 1 And 20`, not \"range check\". Add a reason and the exact message the user will see.","Do not set optional fields (second phone, email) to Required: staff would be forced to type junk.","Show calculated fields with their expression, and label primary, foreign and composite keys."],"ordered":false},{"t":"p","text":"A format check on a Northern Ireland postcode can use a validation rule such as `Like \"BT#* #[A-Z][A-Z]\"`, which accepts both BT1 1AA and BT74 7AB. A single fixed input mask often rejects real postcodes because they vary in length, so test whichever you choose."},{"t":"warn","text":"\"Short text, field size 30\" is not a validation rule. And a paragraph defining *validation* copied from a textbook earns nothing: apply the idea to your own fields."},{"t":"key","title":"Key points","items":["One dictionary per table; all eight columns.","Real rules (Between 0 And 20), reasons and exact error messages.","Keys labelled; names consistent with the ERD, 3NF tables and Access (tblLoan, LoanID…)."]},{"t":"tip","text":"Moderators' reports say data dictionaries are generally detailed with appropriate validation. Matching the dictionary exactly to what you build is what lifts it further."}],"diagram":{"kind":"table-reveal","title":"Complete the data dictionary for tblMember","caption":"Decide the type and validation for each field, then reveal.","head":["Field","Type and size","Validation","Error message"],"rows":[["MemberID (PK)","AutoNumber, Long Integer","None: generated by Access","–"],["Surname","Short Text, 30","Required = Yes (presence)","Enter the member's surname."],["Postcode","Short Text, 8","Like \"BT#* #[A-Z][A-Z]\"","Enter a postcode like BT74 7AB."],["Phone","Short Text, 15","Like \"0*\" (must start with 0)","Phone numbers start with 0."],["MembershipType (FK)","Short Text, 12","Must exist in tblMembershipType (combo box, Limit To List)","Choose a membership type from the list."]],"hidden":[[0,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,2]]},"check":[{"q":"Why should a phone number be Short Text, not Number?","o":["It may start with 0 and is never used in calculations","Numbers are slower","Short Text uses less space always","Access forbids numbers"],"a":0,"why":"A Number field would drop the leading 0."},{"q":"Which is a proper validation entry?","o":["Range check","Short Text, 30","Validation used","Between 0 And 20, with reason and error message"],"a":3,"why":"A rule, reason and message are needed, not a label."},{"q":"A foreign key that links to an AutoNumber primary key should be…","o":["AutoNumber","Number, Long Integer","Short Text","Currency"],"a":1,"why":"Matching data types are needed for the relationship."},{"q":"Why should an optional second phone number not be Required?","o":["Access cannot do it","It breaks relationships","It forces staff to type junk data","It slows the form"],"a":2,"why":"Required on optional data leads to invalid entries."}],"exam":[],"practice":[{"q":"State four items that should be recorded in a data dictionary for each field.","m":4,"a":"Any four: field name (1) / data type (1) / field size or format (1) / validation rule (1) / validation (error) message (1) / key status, primary or foreign (1) / description (1)."},{"q":"Give a suitable data type and validation rule for a Fine field that cannot exceed £20, and justify the type.","m":3,"a":"Currency (1) because it stores money accurately to two decimal places (1); validation rule Between 0 And 20 with a message such as 'Fines must be between £0 and £20' (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Data dictionary"]},{"id":"c02-p06","spec":"Design user interfaces, reports, queries and algorithms that meet the requirements","lessons":["AD03"],"summary":"Design each form as an annotated wireframe that names every control, its type, style and behaviour, plus a navigation map, so anyone could build it from your design alone.","blocks":[{"t":"p","text":"Design every screen before you build it. For each form, give a general layout and an annotated [[Wireframe]]: a labelled sketch that names every control, its type (text box, combo box, command button), font, size and colour, and what it does. Mark validation, error messages, default values and tooltips where they appear. The test is simple: could someone else build the form from your design alone?"},{"t":"table","head":["Control","Type","Style","Purpose and behaviour"],"rows":[["cboMember","Combo box","Arial 12, black","Lists members as Surname, Forename; stores MemberID. Tooltip: \"Start typing the surname\" (UR4)"],["cboBook","Combo box","Arial 12","Lists only books with Status = Available"],["txtLoanDate","Text box","Arial 12","Default =Date(); must not be after today"],["txtDueDate","Text box (locked)","Arial 12, grey background","Shows LoanDate + 21, calculated, cannot be edited"],["cmdIssue","Command button","Arial 12 bold, white on green","Runs VBA: checks the 6-book limit, saves the loan, sets the book On loan, confirms (UR4, UR5)"],["cmdClose","Command button","Arial 12","Closes the form and returns to the main menu"]],"caption":"frmIssueLoan: annotations for the wireframe."},{"t":"h","text":"Menus and navigation"},{"t":"p","text":"Design a main menu with one button per module of your structure diagram, and a navigation map showing which button opens which form or report. In current Access, build the menu as a plain unbound form with command buttons (or Create › Navigation form) and set it as the start-up form. The old Switchboard Manager is hidden in current versions."},{"t":"table","head":["Menu button","Action","Opens"],"rows":[["Members","Open form","frmMember"],["Issue a loan","Open form","frmIssueLoan"],["Return a book","Open form","frmReturn"],["Reports","Open form","frmReportsMenu"],["Exit","Run VBA","Confirm, then DoCmd.Quit"]]},{"t":"p","text":"Keep a consistent layout, colour scheme and font across all forms, suited to the users you identified in analysis. Show the wireframes to the client (or your teacher acting as the client) and record any changes they ask for."},{"t":"warn","text":"A screenshot of the finished form is not a design. Design comes first; screenshots of the real form belong in the Development chapter. And \"Button 3\" tells nobody anything: name each button and say exactly what it runs."},{"t":"key","title":"Key points","items":["Wireframe for every form, including menus.","Every control: name, type, style and behaviour; validation, messages and tooltips marked.","Navigation map from the main menu.","Consistent design suited to the users; client feedback recorded."]}],"diagram":{"kind":"hotspot","title":"Wireframe: frmIssueLoan","caption":"Click each control to read its annotation, exactly as it should appear in your design.","rows":[[{"label":"Title: Issue a loan","detail":"Label, Arial 20 bold, library green. Same position on every form.","span":3}],[{"label":"cboMember","detail":"Combo box, Arial 12. Row source: members sorted by Surname; bound column MemberID; Limit To List = Yes. Tooltip: Start typing the surname.","span":2},{"label":"Books out: n","detail":"Unbound text box, locked. Shows the member's current loans with DCount so staff see the limit coming.","span":1}],[{"label":"cboBook","detail":"Combo box listing only books with Status = Available, so an on-loan book cannot be chosen.","span":2},{"label":"txtLoanDate","detail":"Default =Date(). Validation: <=Date(). Message: The loan date can't be after today.","span":1}],[{"label":"txtDueDate","detail":"Locked, grey. Calculated as LoanDate + 21 days in VBA (UR4).","span":1},{"label":"cmdIssue","detail":"White on green, bold. On Click runs VBA: missing-data check, 6-book limit (UR5), save, set book On loan, confirmation message.","span":1},{"label":"cmdClose","detail":"Closes the form and returns to frmMainMenu.","span":1}]],"links":[["cboMember","Books out: n"],["cboMember","cmdIssue"],["cboBook","cmdIssue"],["txtLoanDate","txtDueDate"]]},"check":[{"q":"What makes a wireframe annotation complete?","o":["Name, type, style and behaviour, with validation and messages","The control's colour only","A screenshot of the built form","The table name"],"a":0,"why":"The moderator should be able to rebuild the form from it."},{"q":"Why should cboBook list only available books?","o":["It looks tidier","Combo boxes need filtering","To save space","It prevents an on-loan book being issued"],"a":3,"why":"Restricting choices is validation by design."},{"q":"Where does a screenshot of the finished form belong?","o":["Design chapter","Development chapter","Analysis chapter","Appendix only"],"a":1,"why":"Design is created before the build."}],"exam":[],"practice":[{"q":"Describe what should be included in an annotated wireframe for a data entry form.","m":3,"a":"Layout of every control with its type, e.g. text box, combo box, button (1) / style details such as font, size and colour (1) / behaviour: what each button does, validation rules, error messages, defaults and tooltips (1). Also credit: data source and requirement met."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Wireframe"]},{"id":"c02-p07","spec":"Design queries that meet the requirements","lessons":["AD03"],"summary":"Design each query with its purpose, requirement, type, tables, fields, criteria, calculations and sort order, and include a range of types: multi-table, parameter, calculated, totals and action queries.","blocks":[{"t":"p","text":"Every query gets a short design: name, purpose, the requirement it meets, type, tables and fields, criteria, any calculated field and the sort order. Include the SQL or a Query Design grid. Moderators report that strong candidates cover **select, append, update and delete** queries, and reports with sorting, grouping and aggregate functions."},{"t":"table","head":["Item","qryOverdueLoans (meets UR9)"],"rows":[["Purpose","List every book that is overdue and not yet returned, with the member's contact details"],["Type","Select, multi-table, calculated field"],["Tables","tblLoan, tblMember, tblBook"],["Criteria","DueDate < Date() and ReturnDate Is Null"],["Calculated","DaysOverdue: Date() - [DueDate]"],["Sort","DueDate ascending"]]},{"t":"code","lang":"sql","code":"SELECT tblMember.Surname, tblMember.Forename, tblBook.Title,\n       tblLoan.DueDate, Date() - tblLoan.DueDate AS DaysOverdue\nFROM (tblLoan\n      INNER JOIN tblMember ON tblLoan.MemberID = tblMember.MemberID)\n      INNER JOIN tblBook ON tblLoan.BookID = tblBook.BookID\nWHERE tblLoan.DueDate < Date() AND tblLoan.ReturnDate Is Null\nORDER BY tblLoan.DueDate;","title":"qryOverdueLoans in SQL View"},{"t":"h","text":"A range of types"},{"t":"table","head":["Query","Type","Design idea","UR"],"rows":[["qrySearchMember","Parameter with wildcard","Criteria on Surname: `Like \"*\" & [Enter part of surname] & \"*\"`","UR3"],["qryLoansPerMonth","Totals (Group By, Count)","Count of LoanID grouped by month of LoanDate; feeds a report","UR11"],["qryMarkReturned","Update","Sets ReturnDate to Date() for the chosen loan","UR6"],["qryArchiveOldLoans","Append, then delete","Copies returned loans older than 2 years to tblLoanArchive, then deletes them","UR17"]]},{"t":"p","text":"A [[Parameter query]] prompts for a value when it runs, so one query serves any surname or date. A [[Calculated field]] derives a value (DaysOverdue, Fine) instead of storing it. An [[Action query]] changes data: update, append or delete."},{"t":"warn","text":"Twenty near-identical searches (one per field) show the same skill twenty times. Fewer, richer queries with joins, calculations, totals and action queries show far more. Fill in the requirement column for every query."},{"t":"key","title":"Key points","items":["Design: name, purpose, UR, type, tables, fields, criteria, calculations, sort, SQL.","Cover multi-table, parameter, calculated, totals and action queries.","Parameter prompts are clear; use wildcards where a partial match helps."]},{"t":"tip","text":"Open any query and choose View › SQL View to copy its SQL into your design in a monospace font."}],"diagram":{"kind":"match","title":"Match each query type to its library use","caption":"Pair each type with the query that uses it.","pairs":[["Parameter query","Find members whose surname contains the text typed"],["Totals query","Count loans in each month for the council"],["Update query","Set ReturnDate to today for the chosen loan"],["Append query","Copy old loans into the archive table"],["Multi-table select with calculated field","Overdue books with member details and days overdue"]]},"check":[{"q":"What does `Like \"*\" & [Enter part of surname] & \"*\"` do?","o":["Matches surnames exactly","Counts surnames","Prompts for text and finds surnames containing it anywhere","Deletes surnames"],"a":2,"why":"The * wildcards allow any characters either side of the typed text."},{"q":"Why is DaysOverdue a calculated field rather than a stored one?","o":["It changes every day and can be derived from DueDate","Access cannot store numbers","It saves typing","It is a foreign key"],"a":0,"why":"Derived, changing values should be calculated when needed."},{"q":"Which is an action query?","o":["A parameter query","A totals query","A select query","An append query"],"a":3,"why":"Action queries change data: update, append, delete (and make-table)."}],"exam":[],"practice":[{"q":"Describe what a parameter query is and give an example from a library system.","m":3,"a":"A query that asks the user to enter a value when it runs (1) and uses that value as its criteria (1), e.g. enter part of a surname to list matching members / enter a date to list loans due that day (1)."},{"q":"Explain why a fine should be produced by a calculated field rather than typed in by staff.","m":2,"a":"It is derived from days overdue × 10p, so calculating it removes human error (1) and it is always consistent with the current dates/data (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"},{"title":"Video: Create basic queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-basic-queries"}],"terms":["Parameter query","Calculated field","Action query"]},{"id":"c02-p08","spec":"Design reports that meet the requirements","lessons":["AD03"],"summary":"Design each report so a third party could build it: purpose, user, requirement, data source, grouping and sorting, calculated totals, and what goes in each header and footer.","blocks":[{"t":"p","text":"A report is designed output for printing or on-screen reading. Design each one so that someone else could build it exactly: name, purpose, who uses it, the requirement it meets, its **data source** (a table or query), a layout sketch with every control labelled, grouping and sort order, calculated controls with their expressions, and the contents of each header and footer."},{"t":"table","head":["Item","rptOverdueLetters (meets UR9)"],"rows":[["Source","qryOverdueLoans"],["Grouping","Group on MemberID; new page for each member"],["Group header","Library address, date =Date(), member name and address"],["Detail","Title, DueDate, DaysOverdue, fine so far"],["Group footer","Total fine for this member, Currency format"],["Page footer","=\"Page \" & [Page] & \" of \" & [Pages]"]]},{"t":"h","text":"The fine expression"},{"t":"p","text":"Fines are 10p per day overdue, capped at £20. In a report text box this can be designed as an expression using IIf:"},{"t":"code","lang":"excel","code":"=IIf([DaysOverdue]*0.1>20, 20, [DaysOverdue]*0.1)","title":"Control source of txtFine (detail section)"},{"t":"p","text":"A group footer total of that expression is `=Sum(IIf([DaysOverdue]*0.1>20,20,[DaysOverdue]*0.1))`. Write expressions out in full in your design: they are exactly the kind of detail a third party needs."},{"t":"h","text":"Sections of an Access report"},{"t":"p","text":"The **report header** prints once at the start; the **page header** at the top of every page; a **group header** before each group; the **detail** once per record; a **group footer** after each group (good for subtotals); the **page footer** at the bottom of every page; the **report footer** once at the end (good for grand totals)."},{"t":"warn","text":"A report that dumps every field from a table adds little. Group it, sort it, calculate with it and design it for a real task the client does."},{"t":"key","title":"Key points","items":["Name, purpose, user, UR and data source.","Grouping and sort order stated.","Calculated controls given with full expressions.","Contents of every header and footer listed."]}],"diagram":{"kind":"hotspot","title":"Design of rptOverdueLetters by section","caption":"Click each section of the report to see what it holds and why.","rows":[[{"label":"Report header","detail":"Prints once. Not needed for letters, so kept closed (height 0).","span":1}],[{"label":"Page header","detail":"Library logo and address at the top of every page.","span":1}],[{"label":"MemberID header","detail":"Group header: date =Date(), member's name and address, greeting. Force New Page: Before Section, so each member's letter starts on a new page.","span":1}],[{"label":"Detail","detail":"One line per overdue book: Title, DueDate, DaysOverdue, fine so far (IIf expression capped at £20).","span":1}],[{"label":"MemberID footer","detail":"Total fine for this member: =Sum(IIf([DaysOverdue]*0.1>20,20,[DaysOverdue]*0.1)) in Currency format, plus a request to return the books.","span":1}],[{"label":"Page footer","detail":"=\"Page \" & [Page] & \" of \" & [Pages]","span":1}]],"links":[["Report header","Page header"],["Page header","MemberID header"],["MemberID header","Detail"],["Detail","MemberID footer"],["MemberID footer","Page footer"]]},"check":[{"q":"Where would a subtotal for each member go?","o":["Report header","Group footer","Detail section","Page header"],"a":1,"why":"The group footer prints after each group, so it is the place for group totals."},{"q":"What must a report design state about its data?","o":["The colour of the table","The file size","Its data source, a table or query","The SQL of every table"],"a":2,"why":"Every report is based on a record source."},{"q":"What does =IIf([DaysOverdue]*0.1>20, 20, [DaysOverdue]*0.1) give for 250 days overdue?","o":["20","25","250","0.1"],"a":0,"why":"250 × 0.1 = 25, which is over 20, so the cap of 20 applies."}],"exam":[],"practice":[{"q":"Describe four items that should be included in the design of a database report.","m":4,"a":"Any four: data source (table or query) (1) / grouping and sort order (1) / calculated controls with expressions, e.g. totals (1) / contents of headers and footers (1) / layout sketch with labelled controls (1) / purpose and requirement met (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":[]},{"id":"c02-p09","spec":"Design macros and VBA algorithms that meet the requirements","lessons":["AD03"],"summary":"Design each piece of automation before you build it: the event that triggers it, what it checks, what it changes and what the user sees, written as pseudocode or a flowchart.","blocks":[{"t":"p","text":"Any macro or VBA procedure is designed before it is built. For each one, record its name, the form and control it belongs to, the **event** that triggers it (On Click, Before Update, After Update, On Load), its purpose and the requirement it meets. For anything with decisions, add [[Pseudocode]] or a flowchart. Write the messages the user will see word for word."},{"t":"code","lang":"ps","code":"// cmdIssue_Click on frmIssueLoan  (meets UR4, UR5)\nIF no member chosen OR no book chosen THEN\n    OUTPUT \"Choose a member and a book.\"\n    STOP\nENDIF\nbooksOut ← COUNT loans for this member WHERE ReturnDate is empty\nIF booksOut >= 6 THEN\n    OUTPUT \"This member already has 6 books out.\"\n    STOP\nENDIF\ndueDate ← loanDate + 21 days\nSAVE the loan\nSET the book's Status to \"On loan\"\nOUTPUT \"Loan saved. Due back on \" + dueDate","title":"Pseudocode for issuing a loan"},{"t":"h","text":"A calculation algorithm"},{"t":"code","lang":"ps","code":"// txtReturnDate_AfterUpdate on frmReturn  (meets UR7)\ndaysLate ← returnDate − dueDate\nIF daysLate <= 0 THEN\n    fine ← 0\nELSE\n    fine ← daysLate * 0.10\n    IF fine > 20 THEN\n        fine ← 20\n    ENDIF\nENDIF\nOUTPUT fine formatted as currency","title":"Pseudocode for the fine"},{"t":"table","head":["Procedure","Form / control","Event","Purpose","UR"],"rows":[["cmdIssue_Click","frmIssueLoan / cmdIssue","On Click","Check limit, save loan, update book","UR4, UR5"],["txtReturnDate_AfterUpdate","frmReturn / txtReturnDate","After Update","Calculate the fine","UR7"],["Form_BeforeUpdate","frmMember","Before Update","Check required fields and email format; cancel save if wrong","UR1"],["cmdLogin_Click","frmLogin","On Click","Check username and password, 3 attempts","UR14"]]},{"t":"warn","text":"Macros that only open a query or a form show very little. Design VBA with real decisions: checks, calculations and updates."},{"t":"key","title":"Key points","items":["Each procedure: name, form/control, event, purpose, UR.","Pseudocode or a flowchart for anything with decisions.","Messages and confirmations written out exactly."]},{"t":"tip","text":"Your VBA in the Development chapter should follow this pseudocode closely. If it changes, say why: that is evidence of iterative development, not a weakness."}],"diagram":{"kind":"flow","direction":"tb","title":"Flowchart: cmdIssue_Click","caption":"Step through the algorithm. The two decisions stop the loan before anything is saved.","nodes":[{"id":"s","label":"Click Issue","shape":"start","detail":"The On Click event of cmdIssue fires."},{"id":"d1","label":"Member and book chosen?","shape":"decision","detail":"Both combo boxes must have a value."},{"id":"m1","label":"Show 'Choose a member and a book.'","shape":"io","detail":"Exclamation message box; nothing saved."},{"id":"c","label":"Count member's books out","shape":"process","detail":"DCount of tblLoan where MemberID matches and ReturnDate Is Null."},{"id":"d2","label":"Books out >= 6?","shape":"decision","detail":"The library's limit is 6 books (UR5). The boundary is tested later: 5 out is allowed, 6 out is refused."},{"id":"m2","label":"Show 'already has 6 books out'","shape":"io","detail":"Loan refused."},{"id":"sv","label":"Set DueDate, save loan","shape":"store","detail":"DueDate = LoanDate + 21; the record is saved to tblLoan."},{"id":"u","label":"Set book On loan","shape":"store","detail":"UPDATE tblBook SET Status = 'On loan' for the chosen BookID."},{"id":"ok","label":"Show 'Loan saved. Due back on …'","shape":"io","detail":"Information message with the due date."},{"id":"e","label":"End","shape":"end","detail":"Procedure ends."}],"edges":[["s","d1"],["d1","m1","no"],["d1","c","yes"],["c","d2"],["d2","m2","yes"],["d2","sv","no"],["sv","u"],["u","ok"],["ok","e"],["m1","e"],["m2","e"]]},"check":[{"q":"Which event suits checking a whole record before it is saved?","o":["On Click","On Load","After Update","Form Before Update"],"a":3,"why":"Form_BeforeUpdate can cancel the save if checks fail."},{"q":"For daysLate = 250, what does the fine algorithm output?","o":["£25.00","£20.00","£2.50","£0.00"],"a":1,"why":"250 × 0.10 = 25, which is capped at 20."},{"q":"What should a VBA design include besides pseudocode?","o":["Only the procedure name","A screenshot of the code","The event, form/control, purpose, UR and exact messages","The file size"],"a":2,"why":"These tie the code to the interface and requirements."}],"exam":[],"practice":[{"q":"Write pseudocode to calculate a library fine of 10p per day late, capped at £20, given the due date and return date.","m":4,"a":"daysLate ← returnDate − dueDate (1) / IF daysLate <= 0 THEN fine ← 0 (1) / ELSE fine ← daysLate × 0.10 (1) / IF fine > 20 THEN fine ← 20, then output fine (1)."}],"videos":[{"title":"Design: ER diagrams, normalisation, data dictionary and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD03-video"}],"terms":["Pseudocode"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]}},{"id":"c03","n":3,"title":"Building in Access and VBA","intro":"How to build the designed database in Microsoft Access: tables, relationships, validation, queries, forms, reports and menus, VBA event procedures, and how to evidence it all in the write-up.","pages":[{"id":"c03-p01","spec":"Implement a relational database with tables, keys, relationships and referential integrity from the design","lessons":["AD04"],"summary":"Build the tables exactly as the data dictionary says, link primary and foreign keys in the Relationships window with referential integrity enforced, choose cascade options deliberately, then add realistic test data.","blocks":[{"t":"p","text":"Development turns your design into a working database. Follow a sensible build order: tables first, then relationships, then test data, then queries (forms and reports often use them), then forms, reports, and finally the menu and code that tie everything together. Test each part as you build it."},{"t":"h","text":"Tables"},{"t":"list","items":["Create each table in **Design View** with the field names, data types, sizes, formats, defaults, Required settings and validation from your data dictionary.","Set the primary key (right-click › Primary Key). Use the `tbl` prefix: tblMember, tblBook, tblLoan, tblMembershipType.","Give each foreign key the **same data type** as the key it points to: an AutoNumber key is matched by Number, Long Integer."],"ordered":false},{"t":"h","text":"Relationships and referential integrity"},{"t":"p","text":"Open Database Tools › Relationships, add the tables and drag each primary key onto its matching foreign key. Tick **Enforce Referential Integrity**. [[Referential integrity]] makes Access reject any foreign key value that has no matching primary key, so there can be no orphan records such as a loan for a member who does not exist. It also stops you deleting a member who still has loans."},{"t":"compare","head":["Cascade Update Related Fields","Cascade Delete Related Records"],"rows":[["What it does","If a primary key value changes, the matching foreign keys change too","Deleting a record deletes all its related records"],["In the library","Not needed: AutoNumber keys never change","Deleting a member would wipe their whole loan history"],["Decision","Leave off (state why)","Leave off; archive members instead of deleting them"]]},{"t":"p","text":"Enter realistic **test data**: enough members, books and loans (including overdue and returned loans) to make queries and reports meaningful. You can type it, or import it from Excel with External Data › New Data Source › From File."},{"t":"warn","text":"A mismatch between your design and your build is not a problem in itself, but an unexplained one is. If you change a field or table, keep the original design and explain the change (what and why) in this chapter."},{"t":"key","title":"Key points","items":["Build order: tables → relationships → test data → queries → forms → reports → menu and code.","Tables match the data dictionary exactly; foreign keys match their primary key's type.","Enforce referential integrity on every relationship; justify cascade choices.","Evidence: each table in Design View and the Relationships window, annotated."]},{"t":"tip","text":"Screenshot the Relationships window with the 1 and ∞ symbols visible: that single image evidences your keys, relationships and referential integrity, and should match your ERD exactly."}],"diagram":{"kind":"flow","direction":"lr","title":"A sensible build order","caption":"Step through the order. Each stage depends on the one before, just as on a Gantt chart.","nodes":[{"id":"t","label":"Tables","shape":"store","detail":"Field types, sizes, validation and keys from the data dictionary."},{"id":"r","label":"Relationships","shape":"process","detail":"Primary key to foreign key, referential integrity enforced, cascade options decided."},{"id":"d","label":"Test data","shape":"io","detail":"Realistic members, books and loans, including overdue and returned loans."},{"id":"q","label":"Queries","shape":"process","detail":"Built next because forms and reports often use them as their record source."},{"id":"f","label":"Forms","shape":"process","detail":"Combo boxes, subforms, validation, command buttons."},{"id":"rp","label":"Reports","shape":"process","detail":"Grouping, sorting, totals, headers and footers."},{"id":"m","label":"Menu and VBA","shape":"end","detail":"Main menu, start-up options, event procedures, login, error handling."}],"edges":[["t","r"],["r","d"],["d","q"],["q","f"],["f","rp"],["rp","m"]]},"check":[{"q":"What does enforcing referential integrity prevent?","o":["Duplicate primary keys","Text in number fields","A foreign key value with no matching primary key","Slow queries"],"a":2,"why":"It stops orphan records such as a loan for a non-existent member."},{"q":"Why is Cascade Delete usually wrong between tblMember and tblLoan?","o":["Deleting a member would delete their entire loan history","It is slower","Access doesn't allow it","It changes the keys"],"a":0,"why":"Losing loan history would damage records and statistics."},{"q":"A foreign key linking to an AutoNumber primary key should have which type?","o":["AutoNumber","Short Text","Currency","Number, Long Integer"],"a":3,"why":"AutoNumber is stored as a Long Integer, so the FK must match."}],"exam":[],"practice":[{"q":"Explain what is meant by referential integrity and why it is important in a library database.","m":3,"a":"Every foreign key value must match an existing primary key value in the related table (1). It prevents orphan records, e.g. a loan for a member or book that does not exist (1), and stops a member with loans being deleted, keeping the data consistent (1)."},{"q":"A candidate enforces referential integrity with cascade delete between Member and Loan. Discuss whether this is appropriate.","m":4,"a":"Cascade delete means deleting a member deletes all their loans (1). This loses the history of loans, fines and statistics the library may need (1), and an accidental delete would be hard to undo (1). Better to leave it off and mark members inactive or archive them (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Referential integrity"]},{"id":"c03-p02","spec":"Develop forms with validation, queries including parameter queries and calculated fields, reports and navigation","lessons":["AD04"],"summary":"Implement validation in layers: data types, field size, Required, input masks and validation rules in the table, then combo boxes and code on the form, each with a clear custom message.","blocks":[{"t":"p","text":"Validation checks that data is sensible before it is saved. In Access you can apply it in several layers, and a good solution uses the right layer for each rule. Every rule in your data dictionary should be visible in the build."},{"t":"table","head":["Check","Library example","Where it is set in Access"],"rows":[["Type","LoanDate is Date/Time","Table Design › Data Type"],["Presence","Surname must be entered","Field › Required = Yes, or form code"],["Length","Surname up to 30 characters","Field › Field Size"],["Range","Fine Between 0 And 20","Field › Validation Rule and Validation Text"],["Format","Postcode like BT74 7AB","Validation Rule `Like \"BT#* #[A-Z][A-Z]\"` or an [[Input mask]]"],["Lookup","MembershipType from a list","Combo box with Limit To List = Yes, backed by referential integrity"],["Cross-field","DueDate after LoanDate","Table Property Sheet › Validation Rule `[DueDate]>[LoanDate]`"]]},{"t":"p","text":"A rule that compares two fields cannot go on a single field. It goes in the **table's** Property Sheet (Table Design › Property Sheet) or in the form's Before Update code."},{"t":"h","text":"Custom messages"},{"t":"p","text":"Always fill in **Validation Text**. Without it, Access shows its own technical message, which confuses staff. Match the wording to your data dictionary exactly, so your tests can quote it."},{"t":"table","head":["Setting","Example value"],"rows":[["Validation Rule (Fine)","Between 0 And 20"],["Validation Text (Fine)","Fines must be between £0 and £20."],["Default Value (LoanDate)","=Date()"],["Input Mask (Phone, optional)","000\\ 0000\\ 0000 (e.g. 028 6632 1234)"],["Format (MemberID)","\"M\"0000 (shows M0042 but stores 42)"]]},{"t":"note","text":"A Format property changes only how a value is displayed, not what is stored. If you show MemberID as M0042, searches and criteria still use 42."},{"t":"warn","text":"Do not rely on the Lookup Wizard in the table for everything: it hides the real stored value and confuses queries. A combo box on the form, with referential integrity behind it, is clearer and easier to evidence."},{"t":"key","title":"Key points","items":["Table-level: type, size, Required, Validation Rule and Text, input masks, defaults.","Cross-field rules go in the table's Property Sheet or form code.","Form-level: combo boxes with Limit To List, locked calculated controls, Before Update code.","Every rule has a custom message that matches your data dictionary."]}],"diagram":{"kind":"match","title":"Which Access setting does the job?","caption":"Match each validation need to the setting that implements it.","pairs":[["Surname cannot be left blank","Required = Yes"],["Fine must be 0 to 20","Validation Rule: Between 0 And 20"],["Due date after loan date","Table Property Sheet validation rule"],["Choose only an existing membership type","Combo box with Limit To List"],["Friendly message instead of Access's error","Validation Text"],["Loan date filled in automatically","Default Value =Date()"]]},"check":[{"q":"Where does the rule [DueDate]>[LoanDate] go?","o":["DueDate's Validation Rule","The table's Property Sheet Validation Rule","The Input Mask","The Format property"],"a":1,"why":"A field rule cannot refer to another field; the table-level rule can."},{"q":"What does Validation Text do?","o":["Sets the rule","Formats the field","Gives the message shown when the rule is broken","Sets the default"],"a":2,"why":"It replaces Access's default error with your own wording."},{"q":"A Format of \"M\"0000 on MemberID 42 stores…","o":["42","M0042","M42","0042"],"a":0,"why":"Format changes display only."}],"exam":[],"practice":[{"q":"Give three validation checks that could be applied to fields in a library Loan form, stating the field and the rule.","m":3,"a":"Any three, each with field and rule: LoanDate <=Date() (1) / DueDate > LoanDate (1) / Fine Between 0 And 20 (1) / MemberID must exist in tblMember (lookup/referential integrity) (1) / BookID chosen from available books (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Input mask"]},{"id":"c03-p03","spec":"Develop forms with validation, queries including parameter queries and calculated fields, reports and navigation","lessons":["AD04"],"summary":"Build the designed queries in Query Design: joins, criteria and wildcards, parameter prompts, calculated fields with IIf, totals with Group By, and action queries, evidencing each with its design or SQL and its results.","blocks":[{"t":"p","text":"Build each query from its design in Create › Query Design. Add the tables (Access draws the joins from your relationships), drag the fields into the grid, then add criteria, sorting and calculations. Run it and check the results against the data **by hand**."},{"t":"h","text":"Criteria you will use"},{"t":"table","head":["Criteria","Meaning"],"rows":[["`Is Null` on ReturnDate","Loans not yet returned"],["`<Date()` on DueDate","Due before today"],["`Like \"*\" & [Enter part of title] & \"*\"`","Parameter with wildcards: title contains the text typed"],["`Between [Start date] And [End date]`","Parameter range on LoanDate"],["`<DateAdd(\"yyyy\",-2,Date())`","More than two years ago"]]},{"t":"h","text":"Calculated fields"},{"t":"p","text":"Type a calculated field into an empty column of the grid as *Name: expression*. Use IIf for a rule with a condition:"},{"t":"code","lang":"excel","code":"DaysOverdue: Date()-[DueDate]\nFine: IIf((Date()-[DueDate])*0.1>20, 20, (Date()-[DueDate])*0.1)","title":"Calculated fields in qryOverdueLoans"},{"t":"h","text":"Totals and action queries"},{"t":"p","text":"Click **Totals** (Σ) to add a Total row: Group By on the field to group, and Count, Sum or Avg on the field to summarise. For action queries, change the query type to **Update**, **Append** or **Delete** in the ribbon; Access warns before changing data, so test them on a copy of the database first."},{"t":"code","lang":"sql","code":"SELECT Format([LoanDate],\"yyyy-mm\") AS LoanMonth, Count(tblLoan.LoanID) AS Loans\nFROM tblLoan\nGROUP BY Format([LoanDate],\"yyyy-mm\")\nORDER BY Format([LoanDate],\"yyyy-mm\");","title":"qryLoansPerMonth: totals query"},{"t":"code","lang":"sql","code":"UPDATE tblBook SET tblBook.Status = \"Available\"\nWHERE tblBook.BookID = [Enter the Book ID being returned];","title":"qryMarkAvailable: update query with a parameter"},{"t":"p","text":"Evidence each query with the Design View (or SQL View) **and** its results, captioned with the requirement it meets."},{"t":"warn","text":"A query whose results you haven't checked is not tested. Pick two or three records and work out by hand what should appear."},{"t":"key","title":"Key points","items":["Joins come from your relationships; check t
