 on the report. Which property lets the box get taller?","o":["Can Grow","Force New Page","Running Sum","Record Source"],"a":0,"why":"Can Grow: Yes lets a text box (and its section) expand to fit the text."}],"exam":[],"practice":[{"q":"Add a button **cmdSalesPDF** to frmMenu that saves rptSalesByCategory as SalesByCategory_<date>.pdf in the database folder without opening it, then tells the user where it went.","m":3,"a":"```\nPrivate Sub cmdSalesPDF_Click()\n    Dim strFile As String\n    strFile = CurrentProject.Path & \"\\SalesByCategory_\" & Format(Date, \"yyyy-mm-dd\") & \".pdf\"\n    ' False = do not open the PDF afterwards\n    DoCmd.OutputTo acOutputReport, \"rptSalesByCategory\", acFormatPDF, strFile, False\n    MsgBox \"Saved as \" & strFile, vbInformation, \"Sales PDF\"\nEnd Sub\n```\nTest: the file appears in the folder; running it twice on the same day overwrites the file."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Print Preview","Report","DoCmd"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/05 Reports"},{"id":"c06","n":6,"title":"VBA basics","intro":"Learn to write VBA in Access: the editor and modules, events, MsgBox, variables, decisions, loops, DoCmd, DLookup/DCount/DSum, your own functions, debugging and error handling, all on Riverside Bikes forms.","pages":[{"id":"c06-p01","spec":"Open the VBA editor, add a module and switch on Option Explicit","lessons":["AD04"],"summary":"Find your way round the Visual Basic Editor, tell form modules from standard modules, and make Access insist on declared variables.","blocks":[{"t":"p","text":"[[VBA]] (Visual Basic for Applications) is the programming language built into Access. You write it in the [[Visual Basic Editor]], in [[modules|Module]]: each form has its own module for its buttons and events, and [[standard modules|Standard module]] hold code that any form can use."},{"t":"key","title":"You will need / By the end","items":["**You will need:** Riverside Bikes saved as an .accdb in a trusted location (or with **Enable Content** clicked), so code can run.","**By the end:** Require Variable Declaration switched on, a standard module **modRiverside** containing a test procedure that runs."]},{"t":"example","title":"Tutorial 1: Open the editor and set it up","steps":["Press **Alt+F11** (or **Database Tools tab › Visual Basic**). The editor opens in its own window.","If the **Project Explorer** is not showing at the left, press **Ctrl+R**. Press **F4** for the Properties window below it.","**Tools › Options › Editor** tab: tick **Require Variable Declaration** and click OK. Every *new* module now starts with `Option Explicit`.","Any module created before this (for example a form module from Chapter 4) needs the line typed in by hand at the very top, under `Option Compare Database`."]},{"t":"example","title":"Tutorial 2: Add a standard module and run a procedure","steps":["In the editor choose **Insert › Module**. A blank module (Module1) opens with `Option Compare Database` and `Option Explicit` at the top.","Type the procedure below underneath those two lines.","Click anywhere inside `Sub SayHello` and press **F5** (Run). A message box appears; click OK.","Press **Ctrl+S**. Access asks for a module name: type **modRiverside** and click OK.","Choose **Debug › Compile RiversideBikes** (the menu uses your database name). If nothing happens, there are no compile errors. Do this after every coding session."]},{"t":"code","lang":"ps","title":"VBA: standard module modRiverside (whole module)","code":"Option Compare Database\nOption Explicit\n\n' A first test procedure: run it with F5\nPublic Sub SayHello()\n    MsgBox \"Hello from Riverside Bikes! Today is \" & Format(Date, \"dddd d mmmm yyyy\"), _\n           vbInformation, \"Riverside Bikes\"\nEnd Sub","output":"Message box: Hello from Riverside Bikes! Today is Thursday 29 October 2026"},{"t":"table","head":["","Form (class) module","Standard module"],"rows":[["Where in Project Explorer","Microsoft Access Class Objects › Form_frmOrder","Modules › modRiverside"],["How you open it","Form Design view › Property Sheet › Event › … › Code Builder, or Form Design tab › View Code","Double-click it in Project Explorer or the Navigation Pane"],["Holds","Event procedures for that form's controls; can use `Me`","Public procedures and functions shared by every form, query and report"],["Deleted when","The form is deleted","You delete the module"]],"caption":"Two kinds of module"},{"t":"tip","text":"`Option Compare Database` makes text comparisons ignore case (\"riverside\" = \"RIVERSIDE\"). `Option Explicit` makes Access refuse to run code with an undeclared variable, so a typing mistake like `intQunatity` is caught at compile time instead of silently becoming a new empty variable."},{"t":"warn","text":"Never give a module the same name as a procedure in it (for example a module called **SayHello** containing `Sub SayHello`). Calls then fail with *Expected variable or procedure, not module*. Prefix module names with **mod**."},{"t":"key","title":"Check it works","items":["Insert › Module produces a module that already says Option Explicit.","F5 inside SayHello shows the message; Debug › Compile gives no error; modRiverside appears under Modules in the Navigation Pane."]}],"diagram":{"kind":"hotspot","title":"The Visual Basic Editor","caption":"Click each part of the editor window.","rows":[[{"label":"Menu and toolbar","detail":"Insert › Module adds a standard module; Debug › Compile checks all code; Run (F5), Break and Reset (the square) control running code.","span":3}],[{"label":"Project Explorer (Ctrl+R)","detail":"Tree of every module: Microsoft Access Class Objects (one per form or report that has code) and Modules (standard modules).","span":1},{"label":"Code window","detail":"Where you type. The left drop-down at the top picks an object (e.g. cmdReceipt), the right one picks its event (e.g. Click) and creates the empty procedure for you.","span":2}],[{"label":"Properties window (F4)","detail":"Shows the name of the selected module; rename a standard module here.","span":1},{"label":"Immediate window (Ctrl+G)","detail":"Type ? followed by an expression and press Enter to see its value, e.g. ? Date. Debug.Print output appears here.","span":2}]],"links":[["Project Explorer (Ctrl+R)","Code window"]]},"check":[{"q":"Which shortcut opens the Visual Basic Editor from Access?","o":["Ctrl+G","Alt+F11","F4","Ctrl+R"],"a":1,"why":"Alt+F11 switches between Access and the editor. Ctrl+G opens the Immediate window, Ctrl+R the Project Explorer."},{"q":"What does Option Explicit do?","o":["Makes text comparisons case-sensitive","Forces every variable to be declared with Dim before use","Runs the module automatically","Hides the module from users"],"a":1,"why":"With Option Explicit an undeclared or misspelt variable causes 'Compile error: Variable not defined'."},{"q":"Where should a procedure that several forms need be written?","o":["In a standard module","In each form's module","In the Immediate window","In a query"],"a":0,"why":"Public procedures in a standard module can be called from any form, report or query."}],"exam":[],"practice":[{"q":"Add a second procedure **ShowCounts** to modRiverside that shows, in one message box, today's date and the text 'Riverside Bikes database'. Run it with F5, then call it from the Immediate window.","m":2,"a":"```\nPublic Sub ShowCounts()\n    ' Two lines in one message: vbCrLf starts a new line\n    MsgBox \"Riverside Bikes database\" & vbCrLf & \"Date: \" & Format(Date, \"dd/mm/yyyy\"), vbInformation\nEnd Sub\n```\nRun: click inside it and press F5. Immediate window (Ctrl+G): type `ShowCounts` and press Enter. (After the DCount page you can add product and customer counts to the message.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["VBA","Visual Basic Editor","Module","Standard module","Option Explicit","Sub procedure"]},{"id":"c06-p02","spec":"Attach event procedures to buttons, forms and controls","lessons":["AD04"],"summary":"Learn which events fire when, name your controls for code, and attach On Click, On Load, On Current and After Update procedures to frmProduct.","blocks":[{"t":"p","text":"Access code is driven by [[events|Event]]: a click, a form opening, a record being saved. You attach an [[Event procedure]] to the event and Access runs it each time that event happens. First give the controls you will use in code sensible names."},{"t":"anim","scene":"access-event","caption":"A click fires an event, and the event runs its VBA procedure."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct from Chapter 4.","**By the end:** frmProduct controls named for code, a Close button, a caption set on Load, a low-stock label updated on Current, and a price tidied After Update."]},{"t":"example","title":"Tutorial 1: Name the controls","steps":["Open **frmProduct** in Design view. Click the **StockLevel** text box. Property Sheet (F4) › **Other** tab › **Name**: type **txtStockLevel**.","Do the same for the others in the table below. The Control Source (Data tab) stays as the field name: only the control's name changes.","Add a label (Form Design › Controls › Label), type **Stock** in it, and name it **lblStockMsg**.","Save. From now on code refers to `Me.txtStockLevel` and the bound field is still StockLevel."]},{"t":"table","head":["Control (bound to)","Name","Prefix means"],"rows":[["Text box (ProductID)","txtProductID","txt = text box"],["Text box (Description)","txtDescription",""],["Combo box (Category)","cboCategory","cbo = combo box"],["Text box (Price)","txtPrice",""],["Text box (StockLevel)","txtStockLevel",""],["Text box (ReorderLevel)","txtReorderLevel",""],["Label","lblStockMsg","lbl = label"],["Button","cmdClose","cmd = command button"]],"caption":"Control names used in Chapters 6 and 7. If you did the Chapter 4 practice task, frmProduct's controls already have these names; frmCustomer's are txtCustomerID, txtFirstName, txtSurname, txtPhone, txtEmail, txtPostcode"},{"t":"example","title":"Tutorial 2: Attach the event procedures","steps":["Add a button (Control Wizards off), Name **cmdClose**, Caption **&Close** (frmCustomer already has one from Chapter 4; this is the same idea on frmProduct). Property Sheet › **Event** › **On Click** › **…** › **Code Builder** › OK. Type the cmdClose code below.","Back in Access, click the grey square at the top left of the form to select the **Form**. Event tab › **On Load** › … › Code Builder. Type the Form_Load code.","Form selected again › Event › **On Current** › … › Code Builder. Type Form_Current.","Select **txtPrice** › Event › **After Update** › … › Code Builder. Type txtPrice_AfterUpdate.","Add `Option Explicit` under `Option Compare Database` at the top of the module if it is missing. Debug › Compile, Ctrl+S, then open the form in Form view."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module (whole module so far)","code":"Option Compare Database\nOption Explicit\n\n' Close button: close this form\nPrivate Sub cmdClose_Click()\n    DoCmd.Close acForm, Me.Name\nEnd Sub\n\n' On Load: runs once when the form opens\nPrivate Sub Form_Load()\n    Me.Caption = \"Products – \" & Format(Date, \"dd/mm/yyyy\")\nEnd Sub\n\n' On Current: runs every time you move to a different record\nPrivate Sub Form_Current()\n    ' Keep this line if you did the Chapter 4 practice task (ID editable only on a new product)\n    Me.txtProductID.Locked = Not Me.NewRecord\n    If Nz(Me.txtStockLevel, 0) <= Nz(Me.txtReorderLevel, 0) Then\n        Me.lblStockMsg.Caption = \"Low stock\"\n    Else\n        Me.lblStockMsg.Caption = \"In stock\"\n    End If\nEnd Sub\n\n' After Update on txtPrice: runs after a new price is typed and accepted\nPrivate Sub txtPrice_AfterUpdate()\n    ' Round to whole pence in case someone types 7.999\n    Me.txtPrice = Round(Nz(Me.txtPrice, 0), 2)\nEnd Sub"},{"t":"table","head":["Event","Fires when…","Good for"],"rows":[["On Click","A button (or control) is clicked","Opening forms, running tasks"],["On Load","The form opens and shows its first record","Setting captions, defaults, enabling buttons"],["On Current","The form moves to a record (including the first one and a new one)","Updating labels or totals for that record"],["Before Update","Just before a control's or record's changes are saved; can be cancelled","Validation (Cancel = True stops the save)"],["After Update","Just after a control's value or the record has been saved","Follow-on actions: recalculate, update stock"],["After Insert","After a brand-new record has been saved","Actions for new records only"]]},{"t":"warn","text":"The procedure name must match the control name: `cmdClose_Click`. If you rename a button *after* writing its code, the code is no longer attached (the On Click box goes blank). Rename the procedure to match, or set On Click back to **[Event Procedure]**."},{"t":"tip","text":"Tired of choosing Code Builder every time? **File › Options › Object Designers › Form/Report design view › Always use event procedures** sends the … button straight to the code."},{"t":"key","title":"Check it works","items":["The form's title bar shows today's date. Moving between products changes lblStockMsg (D-lock, stock 3, says *Low stock*; Inner tube 700x25c says *In stock*).","Type 7.999 as a price and press Tab: it becomes 8. Close shuts the form."]}],"diagram":{"kind":"match","title":"Which event fires when?","caption":"Match each event to the moment it fires.","pairs":[["On Click","The user clicks a button"],["On Load","The form opens, once"],["On Current","The form moves to a different record"],["Before Update","Changes are about to be saved; can be cancelled"],["After Update","A value or record has just been saved"],["After Insert","A brand-new record has just been saved"]]},"check":[{"q":"You want a label to change every time the user moves to a different product. Which form event?","o":["On Load","On Current","On Click","After Insert"],"a":1,"why":"On Current fires for each record the form moves to; On Load fires only once when the form opens."},{"q":"A button named cmdOpenOrders is clicked. Which procedure runs?","o":["Sub OpenOrders()","Private Sub cmdOpenOrders_Click()","Private Sub Click_cmdOpenOrders()","Private Sub Form_Click()"],"a":1,"why":"Event procedures are named ControlName_EventName."},{"q":"Which event can stop a record being saved?","o":["After Update","On Current","Before Update","On Load"],"a":2,"why":"Before Update has a Cancel argument; setting Cancel = True stops the save."}],"exam":[],"practice":[{"q":"On frmCustomer, add a label **lblFullName** that shows the customer's full name in capitals (e.g. CIARA MAGUIRE) for whichever record is on screen, and a Close button.","m":3,"a":"Name the controls txtFirstName, txtSurname; add label lblFullName and button cmdClose. Form › Event › On Current › Code Builder:\n```\nPrivate Sub Form_Current()\n    ' & joins text; Nz stops an error on a new, empty record\n    Me.lblFullName.Caption = UCase(Nz(Me.txtFirstName, \"\") & \" \" & Nz(Me.txtSurname, \"\"))\nEnd Sub\n\nPrivate Sub cmdClose_Click()\n    DoCmd.Close acForm, Me.Name\nEnd Sub\n```\nTest: move between customers; the label changes each time; on a new record it is blank."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Event","Event procedure","Property Sheet","Control","Me"]},{"id":"c06-p03","spec":"Show messages and ask questions with MsgBox","lessons":["AD04"],"summary":"Use MsgBox to inform, warn and ask Yes/No questions, and act on the button the user clicks.","blocks":[{"t":"p","text":"[[MsgBox]] shows a message and waits for a click. Used as a *statement* it just informs; used as a *function* (with brackets) it returns which button was clicked, so your code can ask \"Are you sure?\" and act on the answer."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmMenu and frmProduct.","**By the end:** an Exit button that asks for confirmation, and a product summary message over several lines."]},{"t":"table","head":["Part","Example","What it does"],"rows":[["Prompt","\"Close Riverside Bikes?\"","The message text (join values with &; vbCrLf = new line)"],["Buttons + icon","vbYesNo + vbQuestion","Which buttons and which icon; add them together"],["Default button","+ vbDefaultButton2","Makes the second button (No) the one Enter presses"],["Title","\"Exit\"","Text in the title bar"],["Return value","vbYes / vbNo / vbOK / vbCancel","Which button was clicked (MsgBox as a function only)"]],"caption":"MsgBox(prompt, buttons, title)"},{"t":"example","title":"Tutorial 1: Rewrite the Exit button's confirmation","steps":["frmMenu's **cmdExit** (Chapter 4) already tests `If MsgBox(…) = vbYes Then`. Here you rewrite it in the longer form, storing the answer in a variable and making **No** the default button.","Open **frmMenu** in Design view, select **cmdExit** › Property Sheet › Event › On Click › **…**. The editor opens at the existing procedure; replace it with the code below.","Save, open frmMenu in Form view and click Exit. Click **No** first (nothing happens), then **Yes** (Access closes)."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – cmdExit On Click","code":"Private Sub cmdExit_Click()\n    Dim intAnswer As Integer\n    ' MsgBox used as a function: brackets, and the result is stored\n    intAnswer = MsgBox(\"Close Riverside Bikes?\", vbYesNo + vbQuestion + vbDefaultButton2, \"Exit\")\n    If intAnswer = vbYes Then\n        DoCmd.Quit acQuitSaveAll\n    End If\nEnd Sub"},{"t":"example","title":"Tutorial 2: A multi-line summary message","steps":["Open **frmProduct** in Design view and add a button **cmdSummary**, caption **Summary**.","On Click › Code Builder, type the code below. Note: MsgBox as a statement has no brackets round its arguments.","Form view: go to *LED front light* and click Summary."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – cmdSummary On Click","code":"Private Sub cmdSummary_Click()\n    ' MsgBox as a statement: no brackets, nothing returned\n    MsgBox \"Product: \" & Me.txtProductID & \" \" & Me.txtDescription & vbCrLf & _\n           \"Price: \" & Format(Me.txtPrice, \"Currency\") & vbCrLf & _\n           \"In stock: \" & Me.txtStockLevel, vbInformation, \"Product summary\"\nEnd Sub","output":"Product: P0003 LED front light\nPrice: £24.99\nIn stock: 12"},{"t":"table","head":["Icon constant","Use for"],"rows":[["vbInformation","Something worked: 'Stock updated'"],["vbExclamation","A warning the user can fix: 'Enter a quantity'"],["vbCritical","Something serious: 'Three failed log-ins'"],["vbQuestion","Asking Yes/No or OK/Cancel"]]},{"t":"warn","text":"`MsgBox(\"Saved\", vbInformation)` on its own line gives *Compile error: Expected: =*. Brackets mean you want the answer, so you must store or test it. Either drop the brackets or write `If MsgBox(…) = vbYes Then`."},{"t":"tip","text":"The space-underscore ` _` at the end of a line continues a statement on the next line. It must be a space then an underscore, and it cannot go inside quotes."},{"t":"key","title":"Check it works","items":["Exit: pressing Enter straight away chooses **No** (default button 2), so Access stays open; Yes closes it.","Summary shows three lines with the price as £24.99."]}],"diagram":{"kind":"flow","direction":"tb","title":"Asking a Yes/No question","caption":"Step through cmdExit_Click.","nodes":[{"id":"a","label":"Click Exit","detail":"cmdExit_Click runs.","shape":"start"},{"id":"b","label":"MsgBox Yes/No","detail":"MsgBox(\"Close Riverside Bikes?\", vbYesNo + vbQuestion + vbDefaultButton2, \"Exit\") shows two buttons and waits.","shape":"io"},{"id":"c","label":"intAnswer = vbYes?","detail":"The clicked button's value (vbYes = 6, vbNo = 7) is stored in intAnswer and tested.","shape":"decision"},{"id":"d","label":"DoCmd.Quit acQuitSaveAll","detail":"DoCmd.Quit acQuitSaveAll closes the database, saving any design changes.","shape":"end"},{"id":"e","label":"End Sub","detail":"Nothing happens; the menu stays open.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","yes"],["c","e","no"]]},"check":[{"q":"Which shows Yes and No buttons with a question-mark icon?","o":["vbOKOnly + vbQuestion","vbYesNo + vbQuestion","vbYesNo + vbCritical","vbOKCancel + vbInformation"],"a":1,"why":"vbYesNo gives the buttons; vbQuestion the icon."},{"q":"`MsgBox(\"Done\", vbInformation)` on a line by itself causes…","o":["a run-time error 13","nothing; it works","Compile error: Expected: =","a blank message"],"a":2,"why":"With brackets, VBA expects you to use the returned value. Remove the brackets for a plain message."},{"q":"Which constant starts a new line inside a message?","o":["vbCrLf","vbNewForm","vbTab","vbLine"],"a":0,"why":"vbCrLf is carriage return + line feed. vbTab inserts a tab."}],"exam":[],"practice":[{"q":"On frmProduct add a **Delete** button that asks 'Delete <description>?' with Yes/No (No as default) and deletes the product only on Yes.","m":3,"a":"```\nPrivate Sub cmdDelete_Click()\n    If MsgBox(\"Delete \" & Me.txtDescription & \"?\", vbYesNo + vbQuestion + vbDefaultButton2, \"Delete product\") = vbYes Then\n        ' Turn off Access's own confirmation, delete, then turn it back on\n        DoCmd.SetWarnings False\n        DoCmd.RunCommand acCmdDeleteRecord\n        DoCmd.SetWarnings True\n    End If\nEnd Sub\n```\nTest with a product on no orders (deleted) and with No (kept). A product used on an order line will be refused by referential integrity; the DCount page shows how to check that first."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["MsgBox","Event procedure","DoCmd"]},{"id":"c06-p04","spec":"Store values in variables and read controls with Me and Nz","lessons":["AD04"],"summary":"Declare variables of the right type, read values from controls with Me, protect against empty boxes with Nz, and calculate a stock value.","blocks":[{"t":"p","text":"A [[Variable]] is a named store for a value while code runs. You declare it with `Dim`, choosing a type that suits the data. `Me` means \"the form this code belongs to\", so `Me.txtPrice` is the price box on this form. Empty boxes hold **Null**, which [[Nz]] turns into a safe value."},{"t":"anim","scene":"variable","caption":"A variable holds one value at a time; a constant never changes."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct with the control names from the events page.","**By the end:** a **Stock value** button that multiplies StockLevel by Price using typed variables, and a constant for the VAT rate."]},{"t":"table","head":["Type","Holds","Prefix","Riverside example"],"rows":[["String","Text","str","strProductID = \"P0003\""],["Integer","Whole numbers −32,768 to 32,767","int","intQuantity = 2"],["Long","Whole numbers up to about ±2.1 billion","lng","lngOrderID = 1007"],["Currency","Money, exact to 4 decimal places","cur","curPrice = 6.5"],["Double","Numbers with decimals","dbl","dblRate = 0.2"],["Date","Dates and times","dte","dteToday = Date"],["Boolean","True or False","bln","blnLow = True"],["Variant","Anything, including Null","var","varPrice = DLookup(…)"]],"caption":"VBA data types"},{"t":"example","title":"Tutorial: A Stock value button","steps":["Open frmProduct in Design view. Add a button **cmdStockValue**, caption **Stock value**.","On Click › … › Code Builder. Type the procedure below.","At the very top of the module, under Option Explicit, add the constant line `Private Const VAT_RATE As Currency = 0.2` (a constant cannot change while the code runs).","Debug › Compile, save, and test on *Waterproof jacket* (7 × £59.99)."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – constant at the top, plus cmdStockValue On Click","code":"Private Const VAT_RATE As Currency = 0.2   ' goes under Option Explicit\n\nPrivate Sub cmdStockValue_Click()\n    Dim intStock As Integer\n    Dim curPrice As Currency\n    Dim curValue As Currency\n\n    ' Read the controls; Nz turns an empty (Null) box into 0\n    intStock = Nz(Me.txtStockLevel, 0)\n    curPrice = Nz(Me.txtPrice, 0)\n\n    curValue = intStock * curPrice\n    MsgBox Me.txtDescription & vbCrLf & _\n           \"Stock value: \" & Format(curValue, \"Currency\") & vbCrLf & _\n           \"Including VAT: \" & Format(curValue * (1 + VAT_RATE), \"Currency\"), _\n           vbInformation, \"Stock value\"\nEnd Sub","output":"Waterproof jacket\nStock value: £419.93\nIncluding VAT: £503.92"},{"t":"table","head":["Writing","Meaning"],"rows":[["`Me.txtPrice`","The control called txtPrice on this form (its value)"],["`Me.txtPrice.Visible = False`","A property of the control"],["`Me!StockLevel`","The StockLevel field of the form's record source, even if no control shows it"],["`Nz(Me.txtPrice, 0)`","The value, or 0 if the box is empty"],["`CInt(\"12\")`, `CCur(\"6.50\")`","Convert text to a number type"]]},{"t":"warn","text":"*Run-time error '94': Invalid use of Null* means you put an empty box straight into a String, Integer or Currency variable. Wrap it: `Nz(Me.txtStockLevel, 0)` or `Nz(Me.txtSurname, \"\")`. *Run-time error '6': Overflow* means a number is too big for its type (e.g. 40,000 in an Integer); use Long."},{"t":"tip","text":"Declare variables at the top of the procedure, one per line, with a prefix that shows the type. `Dim a, b As Integer` makes **a** a Variant, not an Integer."},{"t":"key","title":"Check it works","items":["Waterproof jacket: Stock value £419.93, including VAT £503.92.","Go to a new (blank) record and click the button: £0.00, not an error."]}],"diagram":{"kind":"table-reveal","title":"Trace cmdStockValue_Click for the Waterproof jacket","caption":"Work out each variable after each line, then reveal.","head":["Line","intStock","curPrice","curValue"],"rows":[["intStock = Nz(Me.txtStockLevel, 0)","7","0","0"],["curPrice = Nz(Me.txtPrice, 0)","7","59.99","0"],["curValue = intStock * curPrice","7","59.99","419.93"],["curValue * (1 + VAT_RATE)","7","59.99","419.93 (message shows £503.92)"]],"hidden":[[0,1],[1,2],[2,3],[3,3]]},"check":[{"q":"Which type should hold a price such as £24.99?","o":["Integer","String","Currency","Boolean"],"a":2,"why":"Currency stores money exactly to four decimal places with no rounding errors."},{"q":"`intStock = Me.txtStockLevel` fails with 'Invalid use of Null'. The fix is…","o":["intStock = Nz(Me.txtStockLevel, 0)","Dim intStock As String","intStock = Me!txtStockLevel.Null","Remove Option Explicit"],"a":0,"why":"An empty box is Null; Nz replaces Null with 0."},{"q":"What does `Me` refer to in a form module?","o":["The current user","The form whose module the code is in","The database file","The last control clicked"],"a":1,"why":"Me is the form (or report) the code belongs to."}],"exam":[],"practice":[{"q":"On frmProduct add a button **cmdReorderQty** that works out how many to order to bring stock up to double the reorder level (never negative) and shows it in a message.","m":3,"a":"```\nPrivate Sub cmdReorderQty_Click()\n    Dim intStock As Integer\n    Dim intReorder As Integer\n    Dim intOrder As Integer\n    intStock = Nz(Me.txtStockLevel, 0)\n    intReorder = Nz(Me.txtReorderLevel, 0)\n    intOrder = intReorder * 2 - intStock\n    If intOrder < 0 Then intOrder = 0   ' already well stocked\n    MsgBox \"Order \" & intOrder & \" of \" & Me.txtDescription, vbInformation, \"Reorder\"\nEnd Sub\n```\nTest: Brake pads (pair) (stock 4, reorder 6) → order 8; Inner tube 700x25c (40, 10) → 0."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Variable","Me","Nz","Constant"]},{"id":"c06-p05","spec":"Make decisions with If…ElseIf…Else and Select Case","lessons":["AD04"],"summary":"Use If…ElseIf to show Out of stock / Low stock / In stock, and Select Case to choose a storage location by category.","blocks":[{"t":"p","text":"Code often has to choose: is the stock zero, low, or fine? `If…ElseIf…Else` tests conditions in order and runs the first block that is true. When one value is compared against a list of options, `Select Case` is neater."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct with lblStockMsg (events page).","**By the end:** a coloured stock message with three outcomes, and a label showing where each category is stored."]},{"t":"example","title":"Tutorial 1: Three-way stock message","steps":["Open the frmProduct module (Form Design tab › **View Code**, or Alt+F11 and double-click **Form_frmProduct**).","Replace the old `Form_Current` procedure with the one below.","Compile, save and move through the products in Form view."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – Form_Current (replaces the earlier version)","code":"Private Sub Form_Current()\n    Dim intStock As Integer\n    Dim intReorder As Integer\n\n    Me.txtProductID.Locked = Not Me.NewRecord      ' keep from Chapter 4, if you have it\n    intStock = Nz(Me.txtStockLevel, 0)\n    intReorder = Nz(Me.txtReorderLevel, 0)\n\n    If Me.NewRecord Then\n        Me.lblStockMsg.Caption = \"New product\"\n        Me.lblStockMsg.ForeColor = vbBlack\n    ElseIf intStock = 0 Then\n        Me.lblStockMsg.Caption = \"OUT OF STOCK\"\n        Me.lblStockMsg.ForeColor = vbRed\n    ElseIf intStock <= intReorder Then\n        Me.lblStockMsg.Caption = \"Low stock – reorder\"\n        Me.lblStockMsg.ForeColor = RGB(204, 102, 0)    ' orange\n    Else\n        Me.lblStockMsg.Caption = \"In stock\"\n        Me.lblStockMsg.ForeColor = RGB(0, 128, 0)      ' green\n    End If\n    ShowLocation    ' runs the Select Case procedure below\nEnd Sub"},{"t":"example","title":"Tutorial 2: Select Case for storage location","steps":["Add a label **lblLocation** to frmProduct (type *Location* in it).","In the module, below Form_Current, type the `ShowLocation` procedure.","Also call it when the category changes: select **cboCategory** › Event › **After Update** › Code Builder, and type `ShowLocation` inside `cboCategory_AfterUpdate`."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – ShowLocation and cboCategory After Update","code":"' Shows where products of this category are kept\nPrivate Sub ShowLocation()\n    Select Case Nz(Me.cboCategory, \"\")\n        Case \"Parts\", \"Tools\"\n            Me.lblLocation.Caption = \"Workshop shelves\"\n        Case \"Accessories\"\n            Me.lblLocation.Caption = \"Shop floor\"\n        Case \"Clothing\"\n            Me.lblLocation.Caption = \"Upstairs rails\"\n        Case Else\n            Me.lblLocation.Caption = \"Choose a category\"\n    End Select\nEnd Sub\n\nPrivate Sub cboCategory_AfterUpdate()\n    ShowLocation\nEnd Sub"},{"t":"table","head":["Operator","Meaning","Example"],"rows":[["=  <>","equal, not equal","`Me.cboStatus = \"Paid\"`"],["<  <=  >  >=","comparisons","`intStock <= intReorder`"],["And","both true","`intQty >= 1 And intQty <= 99`"],["Or","either true","`IsNull(Me.txtFrom) Or IsNull(Me.txtTo)`"],["Not","reverses","`Not Me.NewRecord`"],["Case 1 To 4, Case Is >= 10","ranges in Select Case","`Case Is >= 10`"]]},{"t":"warn","text":"Order matters in an ElseIf chain. If `intStock <= intReorder` came first, a stock of 0 would show *Low stock* and never reach the *OUT OF STOCK* test, because only the first true branch runs."},{"t":"tip","text":"Every `If` block needs an `End If`, every `Select Case` an `End Select`. *Compile error: Block If without End If* means one is missing; indenting each block by four spaces makes it obvious which."},{"t":"key","title":"Check it works","items":["Set Track pump's stock to 0 in tblProduct (put it back to 9 afterwards) → OUT OF STOCK in red; D-lock (3, reorder 5) → Low stock in orange; Inner tube 700x25c (40) → In stock in green; new record → New product.","Change a product's category from Parts to Clothing: the location changes straight away."]}],"diagram":{"kind":"flow","direction":"tb","title":"If…ElseIf…Else in Form_Current","caption":"Only the first true branch runs. Step through for a stock of 0.","nodes":[{"id":"a","label":"Move to record","detail":"Form_Current fires; intStock and intReorder are read.","shape":"start"},{"id":"b","label":"New record?","detail":"Me.NewRecord is True on the blank new-record row.","shape":"decision"},{"id":"c","label":"intStock = 0?","detail":"Tested only if not a new record.","shape":"decision"},{"id":"d","label":"intStock <= intReorder?","detail":"Tested only if stock is not zero.","shape":"decision"},{"id":"e","label":"\"New product\"","detail":"Black text.","shape":"process"},{"id":"f","label":"\"OUT OF STOCK\"","detail":"Red text (vbRed).","shape":"process"},{"id":"g","label":"\"Low stock – reorder\"","detail":"Orange text, RGB(204, 102, 0).","shape":"process"},{"id":"h","label":"\"In stock\"","detail":"Green text: the Else branch.","shape":"process"},{"id":"i","label":"ShowLocation","detail":"Select Case on the category sets lblLocation.","shape":"end"}],"edges":[["a","b"],["b","e","yes"],["b","c","no"],["c","f","yes"],["c","d","no"],["d","g","yes"],["d","h","no"],["e","i"],["f","i"],["g","i"],["h","i"]]},"check":[{"q":"Stock 4, reorder level 5. Which message does Form_Current show?","o":["In stock","OUT OF STOCK","Low stock – reorder","New product"],"a":2,"why":"Not new, not zero, and 4 <= 5 is true, so the second ElseIf runs."},{"q":"Which Select Case line matches both Parts and Tools?","o":["Case \"Parts\" And \"Tools\"","Case \"Parts\", \"Tools\"","Case \"Parts\" Or \"Tools\"","Case Is = \"Parts\" + \"Tools\""],"a":1,"why":"List several values separated by commas."},{"q":"Compile error: 'Block If without End If' means…","o":["an If has no matching End If","a variable is not declared","a control name is wrong","the code needs Option Explicit"],"a":0,"why":"Each block If must close with End If."}],"exam":[],"practice":[{"q":"On sfrmOrderLine (txtQuantity), when the quantity is updated show a discount message: 1–4 items no discount, 5–9 items 5%, 10 or more 10%. Use Select Case.","m":3,"a":"txtQuantity › Event › After Update › Code Builder:\n```\nPrivate Sub txtQuantity_AfterUpdate()\n    Dim intQty As Integer\n    intQty = Nz(Me.txtQuantity, 0)\n    Select Case intQty\n        Case 1 To 4\n            MsgBox \"No discount.\", vbInformation\n        Case 5 To 9\n            MsgBox \"5% discount applies.\", vbInformation\n        Case Is >= 10\n            MsgBox \"10% discount applies.\", vbInformation\n        Case Else\n            MsgBox \"Quantity must be at least 1.\", vbExclamation\n    End Select\nEnd Sub\n```\nTest with 4, 5, 9, 10 and 0 (boundaries of each range)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Selection","Select Case","Me"]},{"id":"c06-p06","spec":"Repeat steps with For…Next and Do…Loop","lessons":["AD04"],"summary":"Use a For loop to build a price list for 1–10 items and a Do…Loop to keep asking until a valid quantity is entered.","blocks":[{"t":"p","text":"A loop repeats code. Use **For…Next** when you know how many times (1 to 10). Use **Do…Loop** when you repeat until something happens (until the user types a valid number). Later you will loop through records with a [[Recordset]]."},{"t":"anim","scene":"flowchart-run","caption":"The same loop logic you will write with Do…Loop or For…Next."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct.","**By the end:** a **Price list** button (1 to 10 items) and a **Quick sale** button that keeps asking until it gets a valid quantity."]},{"t":"example","title":"Tutorial 1: A price list with For…Next","steps":["Add a button **cmdPriceList** (caption *Price list*) to frmProduct, On Click › Code Builder.","Type the code below. `strList = strList & …` adds a new line to the end of the text each time round.","Test on *Inner tube 700x25c* (£5.99)."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – cmdPriceList On Click","code":"Private Sub cmdPriceList_Click()\n    Dim intQty As Integer\n    Dim curPrice As Currency\n    Dim strList As String\n\n    curPrice = Nz(Me.txtPrice, 0)\n    strList = Me.txtDescription & vbCrLf\n    ' Repeat for 1, 2, 3 ... 10 items\n    For intQty = 1 To 10\n        strList = strList & intQty & \" x \" & Format(intQty * curPrice, \"Currency\") & vbCrLf\n    Next intQty\n    MsgBox strList, vbInformation, \"Price list\"\nEnd Sub","output":"Inner tube 700x25c\n1 x £5.99\n2 x £11.98\n…\n10 x £59.90"},{"t":"example","title":"Tutorial 2: Keep asking with Do…Loop Until","steps":["Add a button **cmdQuickSale** (caption *Quick sale*), On Click › Code Builder, and type the code below.","`InputBox` shows a box for typing and returns what was typed as text, or \"\" if Cancel is clicked.","The loop repeats until the text is a whole number from 1 to 99. Cancel leaves the procedure."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – cmdQuickSale On Click","code":"Private Sub cmdQuickSale_Click()\n    Dim strInput As String\n    Dim intQty As Integer\n\n    Do\n        strInput = InputBox(\"How many \" & Me.txtDescription & \"? (1 to 99)\", \"Quick sale\")\n        If strInput = \"\" Then Exit Sub          ' Cancel clicked or nothing typed\n    Loop Until IsNumeric(strInput) And Val(strInput) >= 1 And Val(strInput) <= 99 _\n               And Val(strInput) = Int(Val(strInput))\n\n    intQty = Val(strInput)                      ' Val, not CInt: \"1,000\" would pass the test as 1\n    MsgBox intQty & \" x \" & Me.txtDescription & \" = \" & _\n           Format(intQty * Nz(Me.txtPrice, 0), \"Currency\"), vbInformation, \"Quick sale\"\nEnd Sub"},{"t":"table","head":["Loop","Repeats","Riverside use"],"rows":[["For i = 1 To 10 … Next i","A fixed number of times","Price list; numbered labels"],["Do While condition … Loop","While true; may run 0 times","While not at the end of a recordset (Do While Not rs.EOF)"],["Do … Loop Until condition","Until true; always runs at least once","Ask until valid input"],["For Each ctl In Me.Controls … Next","Once per item in a collection","Clear every text box on a form"]]},{"t":"warn","text":"A loop whose condition never changes runs for ever and Access freezes. Press **Ctrl+Break** (on laptops often **Ctrl+Fn+B** or **Ctrl+Pause**) to stop it, then click **End**. In a Do loop over records, forgetting `rs.MoveNext` is the classic cause."},{"t":"tip","text":"Test boundaries: in Quick sale try 0, 1, 99, 100, 2.5, abc and Cancel. Only 1 and 99 should get through."},{"t":"key","title":"Check it works","items":["Price list for the inner tube ends with 10 x £59.90.","Quick sale keeps asking for 0, 100, 2.5 and abc; accepts 3 (3 x £5.99 = £17.97); Cancel closes quietly."]}],"diagram":{"kind":"table-reveal","title":"Trace the For loop (curPrice = £5.99, first three passes)","caption":"Work out intQty and the line added each time round.","head":["Pass","intQty","Line added to strList"],"rows":[["1","1","1 x £5.99"],["2","2","2 x £11.98"],["3","3","3 x £17.97"],["After Next on pass 10","11","(loop ends: 11 > 10)"]],"hidden":[[1,2],[2,2],[3,1]]},"check":[{"q":"Which loop always runs its body at least once?","o":["For…Next","Do While … Loop","Do … Loop Until","For Each"],"a":2,"why":"The condition is tested at the bottom, after the first pass."},{"q":"After `For intQty = 1 To 10 … Next intQty` finishes, intQty holds…","o":["10","11","0","1"],"a":1,"why":"Next adds 1 and the loop stops when intQty passes 10, so it ends at 11."},{"q":"Access freezes in a Do loop over records. The most likely missing line is…","o":["rs.MoveNext","rs.Edit","Option Explicit","Me.Requery"],"a":0,"why":"Without MoveNext the recordset never reaches EOF, so Do While Not rs.EOF never ends."}],"exam":[],"practice":[{"q":"Add a **Clear** button to an unbound search form that uses `For Each` to empty every text box on the form.","m":3,"a":"```\nPrivate Sub cmdClear_Click()\n    Dim ctl As Control\n    ' Visit every control; only change the text boxes\n    For Each ctl In Me.Controls\n        If ctl.ControlType = acTextBox Then\n            ctl.Value = Null\n        End If\n    Next ctl\nEnd Sub\n```\nTest: type into several boxes and click Clear; all empty. (Use only on unbound forms: on a bound form this would wipe the record's data.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Iteration","Recordset","Variable"]},{"id":"c06-p07","spec":"Use DoCmd to open, close and move between forms and run action SQL","lessons":["AD04"],"summary":"Open forms (filtered or for data entry), close them, go to a new record, and run an UPDATE safely with CurrentDb.Execute.","blocks":[{"t":"p","text":"[[DoCmd]] carries out the same actions as the ribbon and menus: open a form, close it, go to a new record, print. For changing data with SQL, `CurrentDb.Execute` is the safer partner to `DoCmd.RunSQL`."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmMenu, frmCustomer, frmOrder and frmProduct from Chapter 4 (frmMenu's buttons already use DoCmd).","**By the end:** a Customer button on frmOrder, a New product button on frmProduct, and a menu button that marks Paid orders as Dispatched."]},{"t":"example","title":"Tutorial 1: Read the DoCmd code you already have, then add two buttons","steps":["Open frmMenu's module (Chapter 4): cmdProducts_Click is `DoCmd.OpenForm \"frmProduct\"`; cmdNewOrder_Click is `DoCmd.OpenForm \"frmOrder\", , , , acFormAdd`. On frmCustomer, cmdNew uses `DoCmd.GoToRecord , , acNewRec` and cmdClose uses `DoCmd.Close acForm, Me.Name`.","Open **frmOrder** in Design view, add a button **cmdViewCustomer** (caption *Customer*) and give it the first procedure below: it opens frmCustomer at this order's customer.","Open **frmProduct**, add **cmdNewProduct** (caption *New product*) with the second procedure.","Test: on order 3 click Customer → frmCustomer opens on Ciaran McCaffrey (the navigation bar says *Filtered*). New product jumps to a blank record with the cursor in Description."]},{"t":"code","lang":"ps","title":"VBA: frmOrder and frmProduct modules","code":"' ---- frmOrder module ----\nPrivate Sub cmdViewCustomer_Click()\n    If IsNull(Me.CustomerID) Then Exit Sub          ' no customer chosen yet\n    If Me.Dirty Then Me.Dirty = False               ' save the order first\n    ' WhereCondition: CustomerID is a number, so no quotes\n    DoCmd.OpenForm \"frmCustomer\", , , \"CustomerID = \" & Me.CustomerID\nEnd Sub\n\n' ---- frmProduct module ----\nPrivate Sub cmdNewProduct_Click()\n    DoCmd.GoToRecord , , acNewRec                   ' blank new record\n    Me.txtDescription.SetFocus\nEnd Sub"},{"t":"table","head":["Statement","Does"],"rows":[["`DoCmd.OpenForm \"frmProduct\"`","Open a form normally"],["`DoCmd.OpenForm \"frmOrder\", , , \"CustomerID = 3\"`","Open filtered (4th argument = WhereCondition)"],["`DoCmd.OpenForm \"frmOrder\", , , , acFormAdd`","Open for adding a new record (5th argument = DataMode)"],["`DoCmd.Close acForm, Me.Name`","Close this form"],["`DoCmd.GoToRecord , , acNewRec`","Move to a new blank record on this form"],["`DoCmd.OpenReport \"rptLowStock\", acViewPreview`","Preview a report"],["`DoCmd.SetWarnings False` / `True`","Hide / show Access's 'You are about to update…' prompts"],["`DoCmd.RunSQL \"UPDATE …\"`","Run action SQL (shows prompts unless SetWarnings False)"],["`CurrentDb.Execute \"UPDATE …\", dbFailOnError`","Run action SQL with no prompts; raises an error if it fails"]]},{"t":"example","title":"Tutorial 2: Mark Paid orders as Dispatched","steps":["On **frmMenu** add a button **cmdDispatch** (caption *Dispatch paid orders*).","On Click › Code Builder, and type the code below. It asks first, runs one UPDATE and reports how many orders changed.","Test: with the sample data only order 1 is Paid. Click the button, then check in tblOrder that order 1 now says Dispatched (restore it to Paid afterwards)."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – cmdDispatch On Click","code":"Private Sub cmdDispatch_Click()\n    Dim db As DAO.Database\n    If MsgBox(\"Mark all Paid orders as Dispatched?\", vbYesNo + vbQuestion, \"Dispatch\") = vbNo Then\n        Exit Sub\n    End If\n    Set db = CurrentDb\n    ' Text values in SQL need single quotes\n    db.Execute \"UPDATE tblOrder SET Status = 'Dispatched' WHERE Status = 'Paid'\", dbFailOnError\n    MsgBox db.RecordsAffected & \" order(s) marked as Dispatched.\", vbInformation, \"Dispatch\"\n    Set db = Nothing\nEnd Sub","output":"1 order(s) marked as Dispatched."},{"t":"warn","text":"If you use `DoCmd.SetWarnings False`, always set it back to **True** straight after, or Access stops asking before *every* delete and action query for the rest of the session, including ones done by hand. `CurrentDb.Execute … , dbFailOnError` avoids the problem: it never prompts, and it raises an error instead of failing silently."},{"t":"tip","text":"`db.RecordsAffected` only works on the same Database variable that ran Execute. `CurrentDb.RecordsAffected` on a new line always says 0, because each CurrentDb is a new object."},{"t":"key","title":"Check it works","items":["Customer on order 3 opens Ciaran McCaffrey; New product gives a blank product.","Dispatch reports the right number and tblOrder shows the change; clicking it again reports 0."]}],"diagram":{"kind":"match","title":"Pick the right DoCmd","caption":"Match each task to the statement that does it.","pairs":[["Open frmOrder on a blank record","DoCmd.OpenForm \"frmOrder\", , , , acFormAdd"],["Open frmOrder for customer 3 only","DoCmd.OpenForm \"frmOrder\", , , \"CustomerID = 3\""],["Close the form the code is in","DoCmd.Close acForm, Me.Name"],["Jump to a new record on this form","DoCmd.GoToRecord , , acNewRec"],["Run an UPDATE with no prompts, error if it fails","CurrentDb.Execute strSQL, dbFailOnError"]]},"check":[{"q":"Which argument position holds the WhereCondition in DoCmd.OpenForm?","o":["2nd","3rd","4th","5th"],"a":2,"why":"FormName, View, FilterName, WhereCondition, DataMode… so the WhereCondition is 4th: DoCmd.OpenForm \"frmOrder\", , , \"CustomerID = 3\"."},{"q":"Why is CurrentDb.Execute with dbFailOnError preferred to DoCmd.RunSQL?","o":["It is the only way to run SELECT queries","It shows no prompts and raises an error if the update fails","It works without VBA","It automatically backs up the table"],"a":1,"why":"RunSQL needs SetWarnings to hide prompts and can fail silently; Execute with dbFailOnError does neither."},{"q":"Which closes the current form?","o":["DoCmd.Close acForm, Me.Name","DoCmd.Quit","Me.Close","DoCmd.CloseForm"],"a":0,"why":"DoCmd.Close takes the object type and name; DoCmd.Quit closes Access entirely."}],"exam":[],"practice":[{"q":"On frmOrder add a **Paid** button that saves the order, sets its Status to Paid using CurrentDb.Execute, and shows the change on screen.","m":3,"a":"```\nPrivate Sub cmdPaid_Click()\n    If Me.Dirty Then Me.Dirty = False      ' save first to avoid a write conflict\n    CurrentDb.Execute \"UPDATE tblOrder SET Status = 'Paid' WHERE OrderID = \" & Me.OrderID, dbFailOnError\n    Me.Refresh                              ' show the new status\nEnd Sub\n```\n(On a bound form `Me.cboStatus = \"Paid\"` followed by `Me.Dirty = False` does the same job; the SQL version shows the pattern you need when the record is not on the form.) Test: Status changes to Paid and stays after closing and reopening."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["DoCmd","SQL","Update query","WhereCondition"]},{"id":"c06-p08","spec":"Look up, count and total data with DLookup, DCount, DSum and Nz","lessons":["AD04"],"summary":"Use the domain aggregate functions with correctly quoted criteria to show a product's price, count a customer's orders and total units sold.","blocks":[{"t":"p","text":"DLookup, DCount and DSum fetch one answer from any table or query, without the form needing it as its record source. Each takes **what**, **from where**, and an optional **criteria** string, which is a WHERE clause without the word WHERE. Getting the quotes right in that string is the main skill."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct, frmCustomer and sfrmOrderLine (cboProduct, txtQuantity).","**By the end:** a sales-info button on frmProduct, an order count on frmCustomer, and the price and stock of the chosen product shown under the order lines."]},{"t":"table","head":["Function","Returns","If nothing matches","Example"],"rows":[["[[DLookup]](field, domain, criteria)","One value from the first matching record","Null","`DLookup(\"Price\", \"tblProduct\", \"ProductID = 'P0003'\")` → 24.99"],["[[DCount]](field, domain, criteria)","How many records match","0","`DCount(\"*\", \"tblOrder\", \"CustomerID = 3\")`"],["[[DSum]](field, domain, criteria)","Total of a field over matching records","Null","`DSum(\"Quantity\", \"tblOrderLine\", \"ProductID = 'P0003'\")`"]],"caption":"Domain aggregate functions (domain = a table or query name)"},{"t":"table","head":["Field type","Criteria pattern in VBA","Becomes"],"rows":[["Number","`\"CustomerID = \" & Me.CustomerID`","CustomerID = 3"],["Text","`\"ProductID = '\" & Me.cboProduct & \"'\"`","ProductID = 'P0003'"],["Date","`\"OrderDate = \" & Format(Me.txtDate, \"\\#mm\\/dd\\/yyyy\\#\")`","OrderDate = #10/29/2026#"]],"caption":"Quoting the criteria"},{"t":"example","title":"Tutorial 1: Sales info on frmProduct","steps":["Add a button **cmdSalesInfo** to frmProduct, On Click › Code Builder, and type the first procedure below.","Test on Inner tube 700x25c (2 lines, 5 units), then on Multi-tool 15-in-1, which has never been ordered (0 lines, 0 units, not blank)."]},{"t":"code","lang":"ps","title":"VBA: frmProduct module – cmdSalesInfo On Click","code":"Private Sub cmdSalesInfo_Click()\n    Dim strCriteria As String\n    Dim lngLines As Long\n    Dim lngUnits As Long\n\n    ' ProductID is TEXT, so the value goes inside single quotes\n    strCriteria = \"ProductID = '\" & Me.txtProductID & \"'\"\n    lngLines = DCount(\"*\", \"tblOrderLine\", strCriteria)\n    lngUnits = Nz(DSum(\"Quantity\", \"tblOrderLine\", strCriteria), 0)   ' DSum gives Null if none\n\n    MsgBox Me.txtDescription & vbCrLf & _\n           \"Order lines: \" & lngLines & vbCrLf & _\n           \"Units sold: \" & lngUnits, vbInformation, \"Sales info\"\nEnd Sub"},{"t":"example","title":"Tutorial 2: Look up the price when a product is chosen","steps":["Open **sfrmOrderLine** in Design view (Continuous Forms from Chapter 4, so its Form Footer shows). txtPrice already fills in by AutoLookup; this adds the stock level. Add a label **lblProductInfo** in the **Form Footer** beside txtSubtotal and type *Product info* in it.","Select **cboProduct** › Event › **After Update** › Code Builder, and type the code below.","Also call the same procedure from the subform's **On Current**, so the footer describes whichever line you click on.","On **frmCustomer** add a label **lblOrders** and put the DCount line in its Form_Current."]},{"t":"code","lang":"ps","title":"VBA: sfrmOrderLine module and frmCustomer module","code":"' ---- sfrmOrderLine module ----\nPrivate Sub ShowProductInfo()\n    Dim varPrice As Variant\n    Dim varStock As Variant\n    If IsNull(Me.cboProduct) Then\n        Me.lblProductInfo.Caption = \"Choose a product\"\n        Exit Sub\n    End If\n    ' ProductID is text: single quotes round the value\n    varPrice = DLookup(\"Price\", \"tblProduct\", \"ProductID = '\" & Me.cboProduct & \"'\")\n    varStock = DLookup(\"StockLevel\", \"tblProduct\", \"ProductID = '\" & Me.cboProduct & \"'\")\n    Me.lblProductInfo.Caption = \"Price \" & Format(varPrice, \"Currency\") & \" – \" & _\n                                Nz(varStock, 0) & \" in stock\"\nEnd Sub\n\nPrivate Sub cboProduct_AfterUpdate()\n    ShowProductInfo\nEnd Sub\n\nPrivate Sub Form_Current()\n    ShowProductInfo\nEnd Sub\n\n' ---- frmCustomer module ----\nPrivate Sub Form_Current()\n    If Me.NewRecord Then\n        Me.lblOrders.Caption = \"\"\n    Else\n        Me.lblOrders.Caption = DCount(\"*\", \"tblOrder\", \"CustomerID = \" & Me.CustomerID) & \" order(s)\"\n    End If\nEnd Sub"},{"t":"warn","text":"*Run-time error 3075: Syntax error (missing operator) in query expression* usually means wrong quoting. Text without quotes (`ProductID = P0003`) is read as a field name; a name with an apostrophe such as **O'Neill** breaks single quotes. For surnames use doubled double-quotes: `\"Surname = \"\"\" & Me.txtSurname & \"\"\"\"`."},{"t":"tip","text":"Build the criteria in a variable and test it: `Debug.Print strCriteria` shows exactly what Access will receive in the Immediate window (Ctrl+G)."},{"t":"key","title":"Check it works","items":["Inner tube 700x25c: 2 order lines, 5 units sold; Multi-tool 15-in-1: 0 lines, 0 units (no error).","Choosing P0003 on an order line shows *Price £24.99 – 12 in stock* in the subform footer; Aoife Maguire shows 2 order(s), Niamh Corrigan 0."]}],"diagram":{"kind":"hotspot","title":"Anatomy of a DLookup","caption":"Click each part of DLookup(\"Price\", \"tblProduct\", \"ProductID = '\" & Me.cboProduct & \"'\").","rows":[[{"label":"DLookup","detail":"Returns one value from the first record that matches, or Null if none matches. DCount and DSum take the same three arguments.","span":1},{"label":"\"Price\"","detail":"Expression: the field you want back, in quotes. For DCount use \"*\" to count records.","span":1},{"label":"\"tblProduct\"","detail":"Domain: the table or saved query to look in, in quotes.","span":1}],[{"label":"\"ProductID = '\"","detail":"Start of the criteria text, ending with an opening single quote because ProductID is a text field.","span":1},{"label":"& Me.cboProduct &","detail":"The value from the form is joined in OUTSIDE the double quotes, e.g. P0003.","span":1},{"label":"\"'\"","detail":"The closing single quote. The finished criteria is ProductID = 'P0003'.","span":1}]],"links":[["DLookup","\"Price\""],["\"Price\"","\"tblProduct\""],["\"ProductID = '\"","& Me.cboProduct &"],["& Me.cboProduct &","\"'\""]]},"check":[{"q":"ProductID is a Short Text field. Which criteria is correct?","o":["\"ProductID = \" & Me.cboProduct","\"ProductID = '\" & Me.cboProduct & \"'\"","\"ProductID = 'Me.cboProduct'\"","\"ProductID = #\" & Me.cboProduct & \"#\""],"a":1,"why":"Text values need single quotes inside the criteria, with the control's value joined in outside the double quotes."},{"q":"What does DSum return when no records match?","o":["0","An error","Null","An empty string"],"a":2,"why":"DSum and DLookup return Null; wrap DSum in Nz(…, 0). DCount returns 0."},{"q":"Which counts the orders for customer 3?","o":["DCount(\"*\", \"tblOrder\", \"CustomerID = 3\")","DSum(\"*\", \"tblOrder\", \"CustomerID = 3\")","DLookup(\"Count\", \"tblOrder\", 3)","DCount(tblOrder, CustomerID = 3)"],"a":0,"why":"DCount(\"*\", domain, criteria) counts matching records; all arguments are strings."}],"exam":[],"practice":[{"q":"Improve the Delete button from the MsgBox page so it refuses to delete a product that appears on any order line.","m":3,"a":"```\nPrivate Sub cmdDelete_Click()\n    ' Referential integrity would block it anyway: check first and explain\n    If DCount(\"*\", \"tblOrderLine\", \"ProductID = '\" & Me.txtProductID & \"'\") > 0 Then\n        MsgBox \"This product is on existing orders and cannot be deleted.\", vbExclamation, \"Delete product\"\n        Exit Sub\n    End If\n    If MsgBox(\"Delete \" & Me.txtDescription & \"?\", vbYesNo + vbQuestion + vbDefaultButton2, \"Delete product\") = vbYes Then\n        DoCmd.SetWarnings False\n        DoCmd.RunCommand acCmdDeleteRecord\n        DoCmd.SetWarnings True\n    End If\nEnd Sub\n```\nTest: P0003 (on order 1) → refused; a new test product with no orders → deleted after Yes."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["DLookup","DCount","DSum","Nz","Domain aggregate function"]},{"id":"c06-p09","spec":"Write your own functions in a standard module and use them anywhere","lessons":["AD04"],"summary":"Write VatOn and IsLowStock as Public Functions in modRiverside and call them from code, a form control and a query.","blocks":[{"t":"p","text":"A [[Sub procedure]] does a job; a [[Function]] does a job **and returns a value**. Public functions in a standard module can be used in VBA, in a text box's Control Source and in a query, so a rule like the VAT calculation is written once and used everywhere."},{"t":"key","title":"You will need / By the end","items":["**You will need:** modRiverside (first page of this chapter).","**By the end:** two working functions, tested in the Immediate window and used on a form and in a query."]},{"t":"example","title":"Tutorial: Add the functions","steps":["Alt+F11, double-click **modRiverside**. Under the Option lines add the constant and the two functions below.","**Debug › Compile**, then Ctrl+S.","Press **Ctrl+G** for the Immediate window and type `? VatOn(36.97)` then Enter: it prints **7.39** (order 1's VAT). Type `? IsLowStock(\"P0004\")`: **True** (D-lock, 3 ≤ 5).","On frmOrder, txtOrderVAT could now use `=VatOn(Nz([txtOrderSubtotal],0))` as its Control Source instead of the Round expression from Chapter 4.","In a query on tblProduct, add a field `Low: IsLowStock([ProductID])` and run it."]},{"t":"code","lang":"ps","title":"VBA: modRiverside – add below the Option lines","code":"Public Const VAT_RATE As Currency = 0.2\n\n' Returns the VAT due on an amount, rounded to the nearest penny\nPublic Function VatOn(curAmount As Currency) As Currency\n    VatOn = Round(curAmount * VAT_RATE, 2)\nEnd Function\n\n' Returns True if the product's stock is at or below its reorder level\nPublic Function IsLowStock(strProductID As String) As Boolean\n    Dim varStock As Variant\n    Dim varReorder As Variant\n    varStock = DLookup(\"StockLevel\", \"tblProduct\", \"ProductID = '\" & strProductID & \"'\")\n    varReorder = DLookup(\"ReorderLevel\", \"tblProduct\", \"ProductID = '\" & strProductID & \"'\")\n    If IsNull(varStock) Then\n        IsLowStock = False                  ' no such product\n    Else\n        IsLowStock = (varStock <= Nz(varReorder, 0))\n    End If\nEnd Function","output":"? VatOn(36.97)\n 7.39\n? IsLowStock(\"P0004\")\nTrue"},{"t":"table","head":["","Sub procedure","Function"],"rows":[["Returns a value?","No","Yes: assign it to the function's own name"],["Called by","Its name: `ShowLocation`","Using the result: `curVAT = VatOn(curSub)`"],["Use in a query or Control Source?","No","Yes, if Public and in a standard module"],["Event procedures are…","Subs (`Private Sub cmdClose_Click()`)","–"]]},{"t":"warn","text":"A function with a Currency or String parameter cannot take Null. `=VatOn([txtOrderSubtotal])` on a new, empty order shows **#Error**; pass `Nz([txtOrderSubtotal],0)` instead. In a query on tblProduct `IsLowStock([ProductID])` is fine because ProductID is never Null."},{"t":"note","text":"IsLowStock runs two DLookups per call. In a query over thousands of rows that is slow; a criteria of `[StockLevel]<=[ReorderLevel]` is faster. Functions are best for rules used in many places."},{"t":"key","title":"Check it works","items":["Immediate window: `? VatOn(45.5)` → 9.1; `? IsLowStock(\"P0001\")` → False (40 > 10); `? IsLowStock(\"P9999\")` → False.","The query column shows -1 (True) for P0002, P0004 and P0007 and 0 (False) for the rest."]}],"diagram":{"kind":"flow","direction":"lr","title":"Calling a function","caption":"How a value goes into VatOn and comes back out.","nodes":[{"id":"a","label":"Caller","detail":"curVAT = VatOn(36.97) in a form, or =VatOn(Nz([txtOrderSubtotal],0)) in a text box.","shape":"start"},{"id":"b","label":"Argument passed","detail":"36.97 arrives in the parameter curAmount.","shape":"io"},{"id":"c","label":"Calculate","detail":"Round(36.97 * 0.2, 2) = Round(7.394, 2) = 7.39","shape":"process"},{"id":"d","label":"Assign to name","detail":"VatOn = 7.39 sets the value the function will return.","shape":"process"},{"id":"e","label":"Return","detail":"End Function hands 7.39 back; the caller stores or displays it (£7.39).","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[{"q":"How does a function return its answer?","o":["With a Return statement","By assigning the value to the function's own name","With MsgBox","With Debug.Print"],"a":1,"why":"In VBA you write FunctionName = value before End Function."},{"q":"Where must a function be to use it in a query?","o":["In a form module, Private","In a standard module, Public","In the Immediate window","In a macro"],"a":1,"why":"Queries can only see Public functions in standard modules."},{"q":"What does `? VatOn(20)` print?","o":["4","24","0.2","20.2"],"a":0,"why":"20 × 0.2 = 4."}],"exam":[],"practice":[{"q":"Write a Public function **PriceWithVat** that takes a price and returns it including VAT, rounded to pennies, and use it in a query showing every product's price with VAT.","m":3,"a":"In modRiverside:\n```\n' Returns the price including VAT, rounded to the nearest penny\nPublic Function PriceWithVat(curPrice As Currency) As Currency\n    PriceWithVat = curPrice + VatOn(curPrice)\nEnd Function\n```\nQuery Design on tblProduct: fields Description, Price and `IncVAT: PriceWithVat([Price])` (set its Format to Currency in the field's properties). Test: £24.99 → £29.99 (24.99 + 5.00); Immediate window `? PriceWithVat(6.5)` → 7.8."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Function","Sub procedure","Standard module","Immediate window","Constant"]},{"id":"c06-p10","spec":"Debug code with breakpoints, stepping and the Immediate window","lessons":["AD04"],"summary":"Find faults by stopping code at a breakpoint, stepping line by line with F8, checking values, and recognising common error messages.","blocks":[{"t":"p","text":"Bugs come in three kinds: **compile errors** (VBA cannot understand the code), **run-time errors** (it crashes while running) and **logic errors** (it runs but gives the wrong answer). The editor's debugging tools let you pause code and watch values change."},{"t":"anim","scene":"trace-table","caption":"Stepping through code with F8 and watching values is a live trace table."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmProduct with cmdSalesInfo (DLookup page).","**By the end:** you can set a [[Breakpoint]], step through with F8, read values in the [[Immediate window]], and fix the bug in the code below."]},{"t":"example","title":"Tutorial: Step through cmdSalesInfo_Click","steps":["Alt+F11, open **Form_frmProduct**. Click in the grey margin to the left of the line `strCriteria = …`: a red dot appears. That is a breakpoint (or press **F9** on the line).","Switch to Access (Alt+F11), open frmProduct, go to Inner tube 700x25c and click **Sales info**. The editor appears with the line highlighted in yellow: it has **not run yet**.","Press **F8** to run one line. Hover the mouse over `strCriteria`: a tip shows its value, ProductID = 'P0001'.","Press **Ctrl+G** to open the Immediate window and type `? strCriteria` then Enter, or `? DCount(\"*\", \"tblOrderLine\", strCriteria)`.","Keep pressing F8 to the end, or **F5** to run on. Click the red dot to remove the breakpoint.","**View › Locals Window** lists every variable and its value while paused."]},{"t":"table","head":["Key","Action"],"rows":[["F9","Toggle breakpoint on the current line"],["F8","Step Into: run one line, going inside called procedures"],["Shift+F8","Step Over: run a called procedure in one go"],["Ctrl+F8","Run to the line the cursor is on"],["F5","Continue running"],["Ctrl+G","Immediate window; `? expression` prints a value"],["Reset (square button)","Stop the code completely"]]},{"t":"code","lang":"ps","title":"VBA: A buggy version to fix (in a standard module)","code":"' Should show the total value of all stock; it shows the wrong figure\nPublic Sub StockValueReport()\n    Dim curTotal As Currency\n    Dim curLine As Currency\n    curTotal = 0\n    curLine = DSum(\"StockLevel * Price\", \"tblProduct\")\n    Debug.Print \"Value of all stock: \"; curLine\n    curTotal = curTotal + curLine\n    MsgBox \"Total stock value: \" & Format(curTotol, \"Currency\")\nEnd Sub"},{"t":"p","text":"In a module **without** Option Explicit this runs, and the message shows £0.00 although the Immediate window shows the right value: a logic error. Paste it into modRiverside (which has Option Explicit) and choose Debug › Compile: *Compile error: Variable not defined* highlights `curTotol`, a typo. Without Option Explicit VBA silently invents a new empty variable, which is why that line belongs at the top of every module."},{"t":"table","head":["Message","Usual cause","Fix"],"rows":[["Compile error: Variable not defined","Typo or missing Dim","Correct the spelling / add Dim"],["Compile error: Method or data member not found","Wrong control name after Me.","Check the Name property"],["Run-time error 94: Invalid use of Null","Empty box put into a typed variable","Nz()"],["Run-time error 13: Type mismatch","Text where a number is expected","Check input with IsNumeric; CInt/CCur"],["Run-time error 3075: Syntax error (missing operator)","Bad quotes in criteria or SQL","Debug.Print the string and read it"],["Run-time error 3061: Too few parameters. Expected 1","Misspelt field name inside SQL","Check field names in the SQL string"],["Run-time error 2501: The OpenReport action was cancelled","Report cancelled (e.g. no data)","Trap error 2501 (next page)"],["#Name? in a text box","Control Source names a field that does not exist","Fix the Control Source"]]},{"t":"tip","text":"When a run-time error box appears, click **Debug** (not End): the editor opens on the failing line with the values still there to inspect."},{"t":"key","title":"Check it works","items":["You stopped at a breakpoint, stepped with F8 and printed a value in the Immediate window.","After fixing `curTotol` to `curTotal`, StockValueReport shows the same figure as the Immediate window."]}],"diagram":{"kind":"match","title":"Error message → likely cause","caption":"Match each message to what usually causes it.","pairs":[["Variable not defined","A misspelt or undeclared variable (Option Explicit is on)"],["Invalid use of Null (94)","An empty control assigned to a String/Integer/Currency variable"],["Type mismatch (13)","Text such as 'abc' used where a number is needed"],["Syntax error (missing operator) (3075)","Missing quotes round a text value in criteria"],["Method or data member not found","Me.txtQty used when the control is called txtQuantity"],["#Name? in a text box","The Control Source refers to a field that is not there"]]},"check":[{"q":"Code stops on a breakpoint with a line highlighted yellow. That line has…","o":["just run","not run yet","an error","been deleted"],"a":1,"why":"The highlighted line is the next one to run; press F8 to run it."},{"q":"Which key runs the code one line at a time?","o":["F5","F9","F8","Ctrl+G"],"a":2,"why":"F8 is Step Into. F9 toggles a breakpoint; F5 continues; Ctrl+G opens the Immediate window."},{"q":"A procedure runs with no error but the answer is wrong. This is a…","o":["compile error","run-time error","logic error","syntax error"],"a":2,"why":"Logic errors give wrong results without crashing; trace the values to find them."}],"exam":[],"practice":[{"q":"This line gives run-time error 3075. Explain why and correct it: `lngOrders = DCount(\"*\", \"tblOrder\", \"Status = \" & Me.cboStatus)`","m":2,"a":"Status is a text field, so the criteria becomes `Status = Paid`; Access reads Paid as a name, not a value. Add single quotes: `lngOrders = DCount(\"*\", \"tblOrder\", \"Status = '\" & Me.cboStatus & \"'\")`, giving `Status = 'Paid'`. Check with `Debug.Print \"Status = '\" & Me.cboStatus & \"'\"` before the line."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Breakpoint","Immediate window","Option Explicit","Compile error","Run-time error"]},{"id":"c06-p11","spec":"Handle run-time errors with On Error GoTo","lessons":["AD04"],"summary":"Add a standard error handler so that failures give a friendly message and tidy up instead of dropping the user into the code.","blocks":[{"t":"p","text":"Even good code meets problems it cannot prevent: a report cancelled, a file locked, a rule broken by an update. [[Error handling]] catches the run-time error, shows a clear message and leaves the procedure tidily, so users never see the *Debug / End* box."},{"t":"anim","scene":"on-error-vba","caption":"On Error GoTo sends a run-time error to your own handler."},{"t":"key","title":"You will need / By the end","items":["**You will need:** frmMenu with cmdDispatch (DoCmd page).","**By the end:** cmdDispatch protected by an error handler, and a template you can paste into any procedure."]},{"t":"code","lang":"ps","title":"VBA: The template: every important procedure follows this shape","code":"Private Sub cmdExample_Click()\nOn Error GoTo Err_Handler          ' from here on, errors jump to Err_Handler\n\n    ' ... the normal code goes here ...\n\nExit_Here:\n    ' tidy-up code (close recordsets, set objects to Nothing)\n    Exit Sub                       ' stops the normal path falling into the handler\n\nErr_Handler:\n    MsgBox \"Sorry, something went wrong.\" & vbCrLf & _\n           \"Error \" & Err.Number & \": \" & Err.Description, vbExclamation, \"Riverside Bikes\"\n    Resume Exit_Here               ' carry on at the tidy-up label\nEnd Sub"},{"t":"example","title":"Tutorial: Protect cmdDispatch","steps":["Open the frmMenu module and find `cmdDispatch_Click`.","Replace it with the version below. Labels (`Exit_Here:`, `Err_Handler:`) start at the left margin and end with a colon.","Test the error path on purpose: temporarily change `tblOrder` in the SQL to `tblOrders`, click the button: a friendly message *Error 3078: The Microsoft Access database engine cannot find the input table or query 'tblOrders'…* appears instead of the Debug box. Put the name back."]},{"t":"code","lang":"ps","title":"VBA: frmMenu module – cmdDispatch with error handling","code":"Private Sub cmdDispatch_Click()\nOn Error GoTo Err_Handler\n    Dim db As DAO.Database\n\n    If MsgBox(\"Mark all Paid orders as Dispatched?\", vbYesNo + vbQuestion, \"Dispatch\") = vbNo Then\n        GoTo Exit_Here\n    End If\n    Set db = CurrentDb\n    db.Execute \"UPDATE tblOrder SET Status = 'Dispatched' WHERE Status = 'Paid'\", dbFailOnError\n    MsgBox db.RecordsAffected & \" order(s) marked as Dispatched.\", vbInformation, \"Dispatch\"\n\nExit_Here:\n    Set db = Nothing\n    Exit Sub\n\nErr_Handler:\n    MsgBox \"The orders could not be updated.\" & vbCrLf & _\n           \"Error \" & Err.Number & \": \" & Err.Description, vbExclamation, \"Dispatch\"\n    Resume Exit_Here\nEnd Sub"},{"t":"table","head":["Statement","Meaning"],"rows":[["`On Error GoTo Err_Handler`","Jump to the label if a run-time error happens"],["`Err.Number`, `Err.Description`","Which error happened, in numbers and words"],["`Resume Exit_Here`","Leave the handler and continue at a label"],["`Resume Next`","Continue at the line after the one that failed"],["`If Err.Number = 2501 Then …`","Treat one expected error differently (e.g. a cancelled report: say nothing)"],["`On Error Resume Next`","Ignore errors completely – only for one-line tidy-ups"]]},{"t":"warn","text":"Forgetting `Exit Sub` before `Err_Handler:` means the handler runs every time, showing *Error 0* even when nothing went wrong. Using `On Error Resume Next` at the top of a procedure hides every bug and should be avoided."},{"t":"tip","text":"While you are still developing, put an apostrophe in front of the `On Error GoTo` line to switch the handler off; errors then give the Debug button, which takes you to the failing line. Remove the apostrophe when the code is finished."},{"t":"key","title":"Check it works","items":["Normal click: orders dispatched, no extra messages.","Broken table name: one friendly message with the error number, no Debug box; after fixing the name it works again."]}],"diagram":{"kind":"flow","direction":"tb","title":"Normal path and error path","caption":"Step through both routes through an error-handled procedure.","nodes":[{"id":"a","label":"On Error GoTo Err_Handler","detail":"Switches error handling on for the rest of the procedure.","shape":"start"},{"id":"b","label":"Normal code","detail":"Set db = CurrentDb; db.Execute …; MsgBox count.","shape":"process"},{"id":"c","label":"Run-time error?","detail":"e.g. 3078 table not found, 3022 duplicate key, 2501 report cancelled.","shape":"decision"},{"id":"d","label":"Exit_Here: tidy up","detail":"Set db = Nothing, then Exit Sub.","shape":"process"},{"id":"e","label":"Err_Handler","detail":"MsgBox with Err.Number and Err.Description.","shape":"io"},{"id":"f","label":"Resume Exit_Here","detail":"Clears the error and jumps to the tidy-up.","shape":"process"},{"id":"g","label":"End","detail":"Procedure ends cleanly either way.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","no"],["c","e","yes"],["e","f"],["f","d"],["d","g"]]},"check":[{"q":"Why is `Exit Sub` placed just before the `Err_Handler:` label?","o":["To close the form","So the normal path does not run into the error handler","To clear Err.Number","It is required by Option Explicit"],"a":1,"why":"Without it, the code would fall through into the handler and show a message even when there was no error."},{"q":"Which gives the text of the error?","o":["Err.Number","Err.Description","Err.Source","Error.Text"],"a":1,"why":"Err.Description is the message; Err.Number is the code."},{"q":"After showing the error message, which statement leaves the handler and goes to the tidy-up code?","o":["Resume Exit_Here","GoTo Err_Handler","Exit Function","On Error Resume Next"],"a":0,"why":"Resume clears the error and continues at the named label."}],"exam":[],"practice":[{"q":"Add error handling to cmdReceipt_Click on frmOrder (Chapter 5) so that error 2501 (report cancelled) is ignored silently and any other error shows a friendly message.","m":3,"a":"```\nPrivate Sub cmdReceipt_Click()\nOn Error GoTo Err_Handler\n    If Me.Dirty Then Me.Dirty = False\n    DoCmd.OpenReport \"rptOrderReceipt\", acViewPreview, , \"OrderID = \" & Me.OrderID\nExit_Here:\n    Exit Sub\nErr_Handler:\n    ' 2501 = the report was cancelled: nothing to tell the user\n    If Err.Number <> 2501 Then\n        MsgBox \"Could not open the receipt.\" & vbCrLf & Err.Description, vbExclamation, \"Receipt\"\n    End If\n    Resume Exit_Here\nEnd Sub\n```\nTest: normal order opens; temporarily misspell the report name to see the friendly message (error 2103)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Error handling","Run-time error"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/06 VBA basics"},{"id":"c07","n":7,"title":"VBA task tutorials","intro":"Complete, working VBA for the jobs a real shop database needs: logging in, keeping stock right, order totals with VAT, low-stock alerts, goods in, searching, validation, automatic IDs, bulk price changes, receipts and testing.","pages":[{"id":"c07-p01","spec":"Build a login form that checks tblStaff and controls access to the menu","lessons":["AD04"],"summary":"frmLogin checks the username and password against tblStaff with DLookup, allows three attempts, opens frmMenu, and AccessLevel decides which menu buttons are enabled.","blocks":[{"t":"p","text":"Riverside Bikes should open on a login form. The code looks up the typed username in `tblStaff`, compares the password, counts failed attempts, and remembers who logged in using [[TempVars]] so that frmMenu can switch admin-only buttons on or off."},{"t":"key","title":"You will need / By the end","items":["**You will need:** tblStaff with the Chapter 2 rows **admin / Bikes#2026 / Admin** and **shop1 / Pedal#77 / Staff**; frmLogin from Chapter 4 (unbound pop-up, txtUsername, txtPassword with the Password input mask, cmdLogin with Default Yes).","**Add to frmMenu:** a label **lblWelcome** and two admin-only buttons: **cmdStaff** (caption *Staff*, opens **frmStaff**, a quick form made with Create › Form on tblStaff) and **cmdPriceChange** (caption *Price change*, opens frmPriceChange from the recordset page).","**By the end:** frmLogin opens at start-up; correct details open frmMenu; Staff users see admin buttons greyed out; three wrong tries close Access."]},{"t":"example","title":"Tutorial 1: Finish frmLogin","steps":["Open **frmLogin** (Chapter 4) in Design view. Check: no Record Source; Pop Up and Modal **Yes**; txtPassword Input Mask **Password**; cmdLogin **Default: Yes** (so Enter clicks it).","Add a button **cmdCancel**, caption *Cancel*, Other tab › **Cancel: Yes** (so Esc clicks it).","Form Design tab › **View Code** and type the whole module below. Debug › Compile, save."]},{"t":"code","lang":"ps","title":"VBA: frmLogin module (whole module)","code":"Option Compare Database\nOption Explicit\n\nPrivate intAttempts As Integer      ' failed tries; module-level so it keeps its value between clicks\n\nPrivate Sub cmdLogin_Click()\n    Dim strUser As String\n    Dim strCriteria As String\n    Dim varPassword As Variant\n    Dim blnOK As Boolean\n\n    ' Presence check on both boxes\n    If Len(Nz(Me.txtUsername, \"\")) = 0 Or Len(Nz(Me.txtPassword, \"\")) = 0 Then\n        MsgBox \"Enter your username and password.\", vbExclamation, \"Log in\"\n        Exit Sub\n    End If\n\n    strUser = Me.txtUsername\n    ' Username is text: single quotes, and double any apostrophe typed in\n    strCriteria = \"Username = '\" & Replace(strUser, \"'\", \"''\") & \"'\"\n    varPassword = DLookup(\"Password\", \"tblStaff\", strCriteria)   ' Null if no such user\n\n    If IsNull(varPassword) Then\n        blnOK = False\n    Else\n        ' vbBinaryCompare makes the password check case-sensitive\n        blnOK = (StrComp(varPassword, Me.txtPassword,
