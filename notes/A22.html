"Phased","Direct"],"a":3,"why":"Direct changeover switches off the old system immediately."},{"q":"What is data conversion?","o":["Changing data types in a table","Getting existing records into the new system in the right format","Converting the database to PDF","Encrypting data"],"a":1,"why":"Legacy data must be entered or imported and checked."},{"q":"Why is parallel running a burden for the library?","o":["It is risky","It needs a new PC","Volunteers would have to record everything twice","It only works with one desk"],"a":2,"why":"Running two systems doubles the workload."}],"exam":[],"practice":[{"q":"Evaluate the use of parallel running as the changeover method for a small volunteer-run library.","m":4,"a":"Parallel running operates the old and new systems together (1). Advantage: the card index remains as a fallback and results can be compared (1). Disadvantage: every loan must be recorded twice, doubling volunteers' work (1). Judgement: a pilot on one desk may be more suitable as it gives a fallback without doubling all work (1)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Data conversion","Direct changeover","Parallel running","Phased changeover","Pilot changeover"]},{"id":"c05-p04","spec":"Produce a user guide that supports the client's staff in installing, using and maintaining the system","lessons":["AD06"],"summary":"Write a user guide for non-technical staff: its own contents, overview, requirements, installation and start-up, step-by-step instructions with annotated screenshots for every task, data entry rules, backups and troubleshooting, saved as PDF.","blocks":[{"t":"p","text":"The [[User guide]] is written for the client's staff, not for the moderator or for you. Library volunteers are not technical, so write instructions directly (\"Click **Issue loan**\"), in plain English, with annotated screenshots. Moderators' reports say most user guides are of excellent quality with clearly identified sections; aim for that."},{"t":"h","text":"What it must cover"},{"t":"table","head":["Section","Contents"],"rows":[["Contents","Its own contents page"],["Overview","What the system does, in plain English"],["Requirements","Hardware and software needed"],["Installing and opening","Copying the file, Enable Content or adding a trusted location"],["Logging in","How to log in and change a password, without printing any real password"],["Using each menu option","Step-by-step tasks with annotated, numbered screenshots"],["Data entry rules","What each field accepts, in a table per form"],["Searching","Worked examples: what to type and what appears"],["Printing reports","How to open, preview and print each report"],["Backup and restore","Daily backup steps and how to restore a copy"],["Troubleshooting","Every message the user might see, what it means and what to do"]]},{"t":"table","head":["You see","What it means","What to do"],"rows":[["\"This member already has 6 books out.\"","The member has reached the loan limit","Return one of their books first, or check the Loans screen for a book returned but not booked in"],["Yellow bar: Security Warning, some active content has been disabled","Access has blocked the code","Click Enable Content. To stop it appearing, ask for the folder to be added as a trusted location"]],"caption":"Two entries from the library troubleshooting section."},{"t":"h","text":"How-to"},{"t":"list","items":["Annotate screenshots in Word with numbered circles and arrows (Insert › Shapes), then group them with the picture so they move together.","Save as PDF (File › Save As › PDF) with Options › Create bookmarks using Headings ticked, then open it to check."],"ordered":false},{"t":"warn","text":"Never print the password in the guide: it defeats the security. Avoid writing \"the user should click…\" over and over; write to the user. And repeating the same validation paragraph for every field is hard to use: one table per form is clearer."},{"t":"key","title":"Key points","items":["Written for non-technical staff, addressed to them.","Covers install, log in, every task, data rules, searches, reports, backup and troubleshooting.","Annotated screenshots; its own contents; saved and checked as PDF."]}],"diagram":{"kind":"layers","title":"The library user guide, front to back","caption":"Click each section to see what goes in it.","items":[{"label":"Contents and overview","detail":"Its own contents page. What the system does: members, books, loans, returns and fines, reports."},{"label":"Getting started","detail":"Hardware and software, installing the file, Enable Content or trusted location, logging in and changing a password."},{"label":"Everyday tasks","detail":"Register a member, issue a loan, return a book, search: numbered steps with annotated screenshots."},{"label":"Data entry rules","detail":"A table per form: field, what to enter, example, the message if it's wrong."},{"label":"Reports","detail":"Overdue letters, loans per month, loan slips: how to preview and print."},{"label":"Looking after the system","detail":"Daily backup to OneDrive, restoring a backup, Compact and Repair."},{"label":"Troubleshooting","detail":"Every message the user might see, what it means and what to do."}]},"check":[{"q":"Who is the user guide written for?","o":["The client's non-technical staff","The moderator","The developer","CCEA"],"a":0,"why":"It supports the people who will use the system."},{"q":"Which instruction style is best?","o":["The user should click the Issue button.","cmdIssue_Click runs.","Issuing occurs.","Click Issue loan."],"a":3,"why":"Direct, plain instructions addressed to the user."},{"q":"What should the guide say about passwords?","o":["Print the default password","Explain how to log in and change a password, without printing it","Nothing","List every user's password"],"a":1,"why":"Printing passwords defeats the security."}],"exam":[],"practice":[{"q":"Describe four sections that should be included in a user guide for a library database.","m":4,"a":"Any four: installing and opening the system, including enabling content (1) / how to carry out each main task step by step with screenshots (1) / data entry rules for each form (1) / how to print reports (1) / backup and restore (1) / troubleshooting of error messages (1) / hardware and software requirements (1)."}],"videos":[{"title":"Producing the portfolio – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD06-video"}],"terms":["User guide"]},{"id":"c05-p05","spec":"Reflect on your own performance during the project","lessons":["AD05"],"summary":"A short, honest paragraph: what went smoothly and why, a real difficulty and exactly how you solved it (naming the resource or topic), and what you would do differently.","blocks":[{"t":"p","text":"Close your evaluation with a short [[Personal reflection]] on your own performance as a developer. Keep it to about one paragraph, and make it specific."},{"t":"list","items":["One or two things you found straightforward, **with reasons**.","At least one real difficulty, and **specifically** how you overcame it: the tutorial, help page or theory topic that helped. \"I asked the teacher\" on its own is not enough.","Something you would do differently next time, and why.","A comment on your time management against your Gantt chart."],"ordered":false},{"t":"example","title":"Worked example: improving a reflection","steps":["Weak: \"The project went well. Some bits were hard but I got through them with help.\"","What's missing: which bits, why they were hard, how exactly they were solved, what was learned.","Better: \"I found building tables straightforward because my data dictionary already gave every type and rule.\"","\"The hardest part was the loan limit: my DCount always returned 0. Using breakpoints and the Immediate window, I found that ReturnDate = Null is never true, and the hub tutorial on domain functions showed me Is Null (C1).\"","\"Next time I would start the test plan during design, because writing it late meant my first tests missed the 200-day fine cap.\""],"context":"A pupil's first draft and an improved version.","answer":"The improved version is specific, honest and shows what was learned."},{"t":"p","text":"Reflection is not a list of complaints or praise. It shows that you can judge your own process: what worked, what didn't, and how you adapted."},{"t":"warn","text":"Do not reflect on the client's system here; that belongs in the evaluation. This section is about you and your process."},{"t":"key","title":"Key points","items":["About one paragraph; specific and honest.","What was easy and why; what was hard and exactly how you solved it.","Name the resource or topic that helped.","What you would do differently, and why."]},{"t":"tip","text":"Sentence starters: \"I found … straightforward because …\"; \"The most difficult part was … because …\"; \"To overcome this, I researched … and found that …\"; \"If I did this again, I would … earlier, because …\"."}],"diagram":{"kind":"table-reveal","title":"Make it specific","caption":"For each vague line, think of a specific version before revealing one.","head":["Vague","Specific"],"rows":[["Normalisation was hard.","Spotting the transitive dependency of AnnualFee on MembershipType was hard until I listed what each non-key field depended on."],["I asked for help.","The hub tutorial on combo boxes showed me how to store MemberID while showing the surname."],["I ran out of time.","Testing slipped two weeks behind my Gantt chart because I built the reports before finishing the forms."]],"hidden":[[0,1],[1,1],[2,1]]},"check":[{"q":"Which reflection sentence is strongest?","o":["It was fine.","I asked my teacher.","Breakpoints showed my DCount criteria used = Null; changing it to Is Null fixed the limit.","Access is hard."],"a":2,"why":"It names the problem, the method and the fix."},{"q":"How long should the reflection be?","o":["About one paragraph","Several pages","One word","As long as the evaluation"],"a":0,"why":"Short and specific."},{"q":"Where does a judgement of the client's system belong?","o":["In the reflection","In the user guide","In the analysis","In the evaluation"],"a":3,"why":"The reflection is about your own performance."}],"exam":[],"practice":[{"q":"Explain what makes a personal reflection on a coursework project effective.","m":3,"a":"Specific examples of what went well with reasons (1) / an honest account of a difficulty and exactly how it was overcome, naming the resource or technique (1) / what would be done differently next time and why (1)."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Personal reflection"]},{"id":"c05-p06","spec":"Present the evidence of analysis, design, development, testing and evaluation as a single, well-organised PDF portfolio","lessons":["AD06"],"summary":"Finish the write-up properly: update the contents and captions, check against the criteria, remove padding, proofread, export to PDF with bookmarks, and open the PDF to check every page.","blocks":[{"t":"p","text":"The portfolio is submitted as a single PDF, so its organisation directly affects how easily your evidence can be credited. Good presentation never replaces content, but poor organisation can hide good work."},{"t":"h","text":"Before you export"},{"t":"list","items":["Every chapter in life-cycle order, each starting on a new page.","Search the document for \"insert\", \"TODO\" and \"xx\" to catch forgotten placeholders.","Every figure captioned and referred to by number; References › Insert Table of Figures if you use one.","Remove padding: long generic theory, repeated screenshots, pasted definitions.","Proofread for spelling and technical accuracy (field and object names must match the database).","Read the current marking criteria and check every heading has clearly labelled evidence.","Update the table of contents (Update Table › entire table) as the last edit."],"ordered":true},{"t":"h","text":"Exporting and checking"},{"t":"list","items":["File › Save As › PDF, with Options › Create bookmarks using Headings ticked.","Open the PDF: check page order, that images are clear, that the contents page numbers are right and that the bookmarks work.","Name the file exactly as your centre instructs (usually with the candidate number), and check no name appears in it."],"ordered":false},{"t":"p","text":"Long supporting material (the project log, full interview notes, a complete code listing) goes in clearly labelled appendices at the end, referenced from the main text."},{"t":"warn","text":"Do not include a password-protected database in the submission unless your centre instructs you to, and supply any test logins separately. Moderators need to open everything without help."},{"t":"key","title":"Key points","items":["One well-organised PDF in life-cycle order.","No placeholders, padding or unexplained screenshots.","Contents updated last; PDF bookmarks from headings.","Open and check the PDF before submitting."]}],"diagram":{"kind":"flow","direction":"tb","title":"Final checks to submission","caption":"Step through the last-day routine. The loop catches anything the PDF check finds.","nodes":[{"id":"a","label":"Search for placeholders","shape":"start","detail":"'insert', 'TODO', 'xx', '????'."},{"id":"b","label":"Check against the marking criteria","shape":"process","detail":"Every criterion heading has labelled evidence."},{"id":"c","label":"Proofread and remove padding","shape":"process","detail":"Spelling, object names, generic theory removed."},{"id":"d","label":"Update contents and figures","shape":"process","detail":"Update Table › entire table."},{"id":"e","label":"Save as PDF with bookmarks","shape":"io","detail":"Create bookmarks using Headings."},{"id":"f","label":"PDF correct?","shape":"decision","detail":"Order, images, page numbers, bookmarks, no name."},{"id":"g","label":"Submit with declaration","shape":"end","detail":"File named as instructed; authentication signed."}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"],["f","c","no"],["f","g","yes"]]},"check":[{"q":"Why should the table of contents be updated last?","o":["It is quicker","Page numbers change as you edit","Word requires it","So it isn't included"],"a":1,"why":"Any edit can shift page numbers."},{"q":"Where should a full code listing or project log go?","o":["The first page","Nowhere","A labelled appendix","The user guide"],"a":2,"why":"Appendices keep main chapters readable."},{"q":"What should you do after exporting the PDF?","o":["Open it and check order, images, page numbers and bookmarks","Submit immediately","Delete the Word file","Password-protect it"],"a":0,"why":"Exports can go wrong; check before submitting."}],"exam":[],"practice":[{"q":"State three features that make a PDF portfolio easy for a moderator to navigate.","m":3,"a":"Any three: contents page with correct page numbers (1) / PDF bookmarks from headings (1) / numbered sections in life-cycle order (1) / numbered, captioned figures (1) / clearly labelled appendices (1)."},{"q":"Give two common presentation mistakes in coursework portfolios and how to avoid them.","m":4,"a":"Unreadable full-screen screenshots (1): crop and annotate them (1). Out-of-date contents page (1): update the table as the last step before export (1). Also credit: forgotten placeholders, generic copied theory."}],"videos":[{"title":"Producing the portfolio – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD06-video"}],"terms":["Portfolio","Appendix"]},{"id":"c05-p07","spec":"Annotate evidence clearly and cross-reference it to requirements, designs and tests","lessons":["AD06"],"summary":"Use requirement numbers, design item names, test numbers and figure numbers consistently so any requirement can be traced from analysis to evaluation; a traceability table proves nothing is missing.","blocks":[{"t":"p","text":"A [[Cross-reference]] points the reader from one part of the portfolio to another: \"see Figure 45\", \"tested in T5a\", \"designed in W2\". Used consistently, they let a moderator trace any requirement through the whole project in seconds."},{"t":"h","text":"The numbering system"},{"t":"table","head":["Item","Numbered as","Appears again in"],"rows":[["User requirements","UR1, UR2…","Every design, query, test and the evaluation"],["Design items","W1 (wireframes), Q1 (queries), R1 (reports), V1 (VBA)","Development captions"],["Tests","T1, T2…, retests T5a","Results, corrective actions, evaluation"],["Corrective actions","C1, C2…","Testing and evaluation"],["Figures","Figure 1, 2… (Word captions)","Anywhere evidence is cited"]]},{"t":"h","text":"A traceability table"},{"t":"p","text":"A [[Traceability table]] lists each requirement with its design, development, test and evaluation references. Build it at the end as a final check: any empty cell shows a gap to fix before submission."},{"t":"table","head":["UR","Design","Development","Tests","Evaluation"],"rows":[["UR4 Issue loan","W2, V1","Figures 40–42","T4, T20","Fully met"],["UR5 6-book limit","V1","Figure 42","T4, T5, T5a, T22","Fully met"],["UR7 Fines","V2, R1","Figures 44–45","T8–T13a","Fully met"],["UR12 Email reminders","–","–","–","Not met (non-essential)"]]},{"t":"p","text":"Annotation is the other half: each screenshot is cropped, marked with callouts on the important settings, and captioned with its figure number and the UR, design item or test it relates to, plus a sentence on what it shows and why."},{"t":"key","title":"Key points","items":["Consistent numbering: UR, design items, T, C and Figure numbers.","Every caption names what it evidences.","A traceability table checks every UR runs from analysis to evaluation."]},{"t":"tip","text":"Use Word's cross-reference feature (References › Cross-reference › Figure) so figure numbers in your text update automatically when you add a figure."}],"diagram":{"kind":"table-reveal","title":"Fill the traceability gaps","caption":"Work out where each missing reference would come from, then reveal.","head":["UR","Design","Development","Test","Evaluation"],"rows":[["UR3 Search by surname","Q2 qrySearchMember","Figure 38","T6","Fully met"],["UR9 Overdue letters","R1 rptOverdueLetters","Figures 47–48","T20, T26","Fully met"],["UR16 Two-click navigation","W1 menu map","Figure 50","T25","Partly met"]],"hidden":[[0,1],[0,3],[1,2],[1,4],[2,3],[2,4]]},"check":[{"q":"What is a traceability table?","o":["A table of test data","The data dictionary","A Gantt chart","A table linking each requirement to its design, development, test and evaluation evidence"],"a":3,"why":"It proves every requirement is carried through."},{"q":"What does an empty cell in a traceability table show?","o":["Nothing","A gap: a requirement not designed, built, tested or evaluated","A non-essential requirement","An error in Word"],"a":1,"why":"Gaps must be fixed or explained."},{"q":"Why use Word's cross-reference feature for figure numbers?","o":["It's required","It makes figures bigger","They update automatically when figures are added","It hides them"],"a":2,"why":"Typed numbers go out of date."}],"exam":[],"practice":[{"q":"What is a traceability table and why is it useful?","m":2,"a":"A table linking each requirement to its design, development, testing and evaluation evidence (1); it shows that every requirement has been carried through the project / reveals any gaps before submission (1)."}],"videos":[{"title":"Producing the portfolio – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD06-video"}],"terms":["Cross-reference","Traceability table"]},{"id":"c05-p08","spec":"Acknowledge sources and complete the authentication requirements","lessons":["AD06"],"summary":"List every source in a consistent reference style, acknowledge help and any permitted AI use, and sign the declaration; explain your own system in your own words instead of copying theory.","blocks":[{"t":"p","text":"[[Referencing]] means acknowledging every source that informed your work, in a consistent format, so it is clear which work is your own. It is part of [[authenticating|Authentication]] the portfolio. List tutorials, help pages, books, templates, images and any AI tools your centre allows, in a References section at the end."},{"t":"h","text":"A consistent style"},{"t":"table","head":["Source","Reference (Harvard-style example)"],"rows":[["Help page","Microsoft (2026) *Use parameters to ask for input when running a query*. Available at: https://support.microsoft.com/en-gb/access/use-parameters-to-ask-for-input-when-running-a-query (Accessed: 12 November 2026)."],["Hub tutorial","Digital Technology hub (2026) *Domain functions: DLookup, DCount and DSum*. Tutorial VB06 (Accessed: 3 December 2026)."],["Template","Gantt chart template adapted from the school's planning template; tasks and dates are my own."],["Image","Library logo used with the client's permission."]]},{"t":"p","text":"Acknowledge help from others as your centre requires: feedback from the client on wireframes, or general guidance from your teacher. Then sign the candidate declaration."},{"t":"h","text":"Your words, your system"},{"t":"p","text":"Copying theory from websites adds nothing to your evidence and can be treated as plagiarism. Instead of pasting a definition of normalisation, show it happening to *your* data and explain each step in your own words. The same goes for code: if a tutorial taught you DCount, reference it, then write and explain your own procedure for your own requirement."},{"t":"key","title":"Key points","items":["Reference every source in one consistent style.","Acknowledge help, templates and any permitted AI use.","Sign the declaration.","Explain your own system in your own words; no copied theory."]},{"t":"warn","text":"Referencing a source does not make copying acceptable. A referenced paragraph of someone else's text still earns nothing; your marks come from applying ideas to your system."}],"diagram":{"kind":"match","title":"What does each source need?","caption":"Match each situation to the correct way to acknowledge it.","pairs":[["Microsoft help page that explained parameter queries","Reference with title, URL and date accessed"],["Client feedback on your wireframes","Acknowledge as your centre requires and record changes made"],["A Gantt template you adapted","Name it and say what is your own"],["AI tool allowed by your centre to check spelling","State exactly what it was used for"],["A definition of 3NF from a website","Don't paste it: show 3NF on your own data"]]},"check":[{"q":"Why must tutorials and templates be referenced?","o":["So it is clear which work is the candidate's own","To lengthen the portfolio","CCEA counts references","It isn't necessary"],"a":0,"why":"Acknowledgement is part of authentication."},{"q":"Which reference is best?","o":["google","Microsoft help","A website I used","Microsoft (2026) Use parameters to ask for input when running a query. Available at: URL (Accessed: date)"],"a":3,"why":"Author, date, title, URL and access date in a consistent style."},{"q":"Does referencing a copied paragraph make it creditworthy?","o":["Yes","No: marks come from your own application to your system","Only in the analysis","Only if it is short"],"a":1,"why":"Referenced copying is not plagiarism, but it isn't your evidence either."}],"exam":[],"practice":[{"q":"Explain why all sources, including tutorials and templates, must be referenced in the portfolio.","m":2,"a":"To show which work is the candidate's own and which came from elsewhere, as part of authentication (1); failing to do so could be treated as plagiarism/malpractice (1)."}],"videos":[{"title":"Producing the portfolio – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD06-video"}],"terms":["Referencing","Authentication"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]}}],"glossary":[{"term":"Action query","def":"A query that changes data rather than just displaying it: an update, append, delete or make-table query.","alt":"","page":"c02-p07"},{"term":"Annotated screenshot","def":"A cropped screen capture with callouts and a caption explaining what it shows and which requirement and design item it evidences.","alt":"","page":"c03-p09"},{"term":"Anomaly","def":"A problem caused by redundant data: an update anomaly (changing one fact in many places), an insertion anomaly (cannot add data without other data) or a deletion anomaly (deleting one fact loses another).","alt":"","page":"c02-p03"},{"term":"Appendix","def":"A labelled section at the end of the portfolio holding supporting material, such as the project log or full interview notes, referred to from the main text.","alt":"","page":"c05-p06"},{"term":"Authentication","def":"Confirmation by the candidate and teacher, through signed declarations, that coursework is the candidate's own work produced under the required conditions.","alt":"","page":"c01-p04"},{"term":"Calculated field","def":"A field in a query, form or report whose value is derived from other fields, such as days overdue from the due date and today's date.","alt":"Derived field","page":"c02-p07"},{"term":"Case study","def":"A scenario pre-released by CCEA describing an organisation and its data-handling problem, which candidates analyse and solve with a database application.","alt":"Scenario","page":"c01-p01"},{"term":"Constraint","def":"A factor that limits the solution; internal constraints come from within the organisation (budget, skills, hardware) and external ones from outside it (legislation, suppliers).","alt":"","page":"c01-p06"},{"term":"Context diagram","def":"A Level 0 data flow diagram showing the whole system as a single process together with its external entities and data flows.","alt":"Level 0 DFD","page":"c01-p09"},{"term":"Corrective action","def":"The documented response to a failed test: identifying the cause, making and evidencing a fix, and retesting with the same data.","alt":"","page":"c04-p05"},{"term":"Critical path","def":"The longest sequence of dependent tasks in a project; the tasks on it have no float, so a delay to any of them delays the whole project.","alt":"","page":"c01-p03"},{"term":"Cross-reference","def":"A reference from one part of the portfolio to another, such as a requirement, test or figure number, so evidence can be traced.","alt":"","page":"c05-p07"},{"term":"Data conversion","def":"Transferring existing records from the old system into the new one in the correct format, by typing or importing, and checking them.","alt":"Legacy data conversion","page":"c05-p03"},{"term":"Data dictionary","def":"A document recording, for every field in every table, its name, description, data type, size, format, validation rule, error message and key status.","alt":"","page":"c02-p05"},{"term":"Data flow diagram","def":"A diagram that models how data moves between external entities, processes and data stores in a system.","alt":"DFD","page":"c01-p09"},{"term":"Data store","def":"A place in a DFD where data is held at rest, such as a file or database table, labelled D1, D2 and so on.","alt":"","page":"c01-p09"},{"term":"Dependency","def":"A relationship between tasks in which one task cannot start until another has finished, such as building forms only after the tables exist.","alt":"","page":"c01-p03"},{"term":"Direct changeover","def":"A changeover in which the old system stops and the new system starts on the same day.","alt":"Big bang","page":"c05-p03"},{"term":"Entity","def":"A thing about which data is stored, such as a member, book or loan; it becomes a table in the database.","alt":"","page":"c02-p02"},{"term":"Entity relationship diagram","def":"A diagram showing the entities in a system and the one-to-one, one-to-many or many-to-many relationships between them.","alt":"ERD; ER diagram","page":"c02-p02"},{"term":"Essential requirement","def":"A requirement the system cannot do without; if it is missing, the client cannot replace the current system.","alt":"","page":"c01-p08"},{"term":"Evaluation","def":"A judgement of how well the finished system meets each requirement, as fully, partly or not met, supported by evidence and followed by justified improvements.","alt":"","page":"c05-p01"},{"term":"Event procedure","def":"A VBA subroutine that runs automatically when a particular event occurs on a form or control, such as a button being clicked or a value being updated.","alt":"","page":"c03-p06"},{"term":"Expected result","def":"The outcome a test should produce if the system works as designed, written in the test plan before the test is run.","alt":"","page":"c04-p01"},{"term":"External entity","def":"A person, organisation or system outside the system being modelled that supplies data to it or receives data from it.","alt":"Source or sink","page":"c01-p09"},{"term":"Extreme data","def":"Data at the edges of the acceptable range, which the system should still accept.","alt":"Boundary data","page":"c04-p02"},{"term":"Fact-finding","def":"Investigating how a system works and what users need, using methods such as interviews, questionnaires, observation and document sampling.","alt":"Investigation","page":"c01-p05"},{"term":"First normal form","def":"A relation is in 1NF when it has no repeating groups, every field is atomic and it has a primary key.","alt":"1NF","page":"c02-p03"},{"term":"Foreign key","def":"A field in one table that is the primary key of another table, used to create a relationship between them.","alt":"","page":"c02-p02"},{"term":"Functional requirement","def":"A statement of what the system must do: the data it stores, the processes it carries out or the outputs it produces.","alt":"","page":"c01-p07"},{"term":"Future extension","def":"A realistic improvement to the system, linked to a limitation, an unmet non-essential requirement or user feedback, with a brief explanation of how it would be done.","alt":"Future development","page":"c05-p02"},{"term":"Gantt chart","def":"A planning chart showing each task as a horizontal bar against a timeline, so durations, overlaps and dependencies can be seen.","alt":"","page":"c01-p03"},{"term":"Input mask","def":"A pattern that controls the format of data as it is typed into a field, such as the number of digits in a phone number.","alt":"","page":"c03-p02"},{"term":"Integration testing","def":"Testing that separate parts of a system work together correctly, for example by following data from a form through tables and queries to a report.","alt":"","page":"c04-p01"},{"term":"Invalid data","def":"Data that the system should reject, such as values just outside the acceptable range, the wrong data type or a blank required field.","alt":"Erroneous data","page":"c04-p02"},{"term":"Limitation","def":"A genuine weakness or restriction of the finished system, such as single-user access, identified from testing, user feedback or constraints.","alt":"","page":"c05-p02"},{"term":"Link entity","def":"An entity introduced to resolve a many-to-many relationship into two one-to-many relationships, holding the keys of both entities and data about their pairing.","alt":"Junction table; associative entity","page":"c02-p02"},{"term":"Malpractice","def":"Any act that gives an unfair advantage in assessment, such as copying, collusion or presenting another person's or an AI tool's work as your own.","alt":"Plagiarism (for copying)","page":"c01-p04"},{"term":"Measurable requirement","def":"A requirement with a specific, testable target so that it can be judged objectively as met or not met.","alt":"Testable requirement","page":"c01-p07"},{"term":"Milestone","def":"A significant checkpoint in a project, such as the requirements being agreed or the design being complete, used to monitor progress.","alt":"","page":"c01-p03"},{"term":"Moderation","def":"The process in which CCEA re-marks a sample of a centre's coursework to check that the teacher's marking matches the agreed standard.","alt":"","page":"c01-p01"},{"term":"Non-essential requirement","def":"A requirement that would improve the system but that the client could manage without; often the basis of future extensions.","alt":"Desirable requirement","page":"c01-p08"},{"term":"Non-functional requirement","def":"A statement of how well the system must perform, covering qualities such as usability, performance, security or reliability.","alt":"","page":"c01-p07"},{"term":"Normalisation","def":"The process of organising data into related tables to remove redundancy and prevent update, insertion and deletion anomalies.","alt":"","page":"c02-p03"},{"term":"Parallel running","def":"A changeover in which the old and new systems run together until the new one is trusted.","alt":"","page":"c05-p03"},{"term":"Parameter query","def":"A query that prompts the user to enter a value when it runs and uses that value as its criteria.","alt":"","page":"c02-p07"},{"term":"Partial dependency","def":"Where a non-key field depends on only part of a composite primary key.","alt":"","page":"c02-p04"},{"term":"Personal reflection","def":"A short, specific account of the candidate's own performance on the project: what went well, what was difficult and how it was overcome, and what they would do differently.","alt":"","page":"c05-p05"},{"term":"Phased changeover","def":"A changeover in which the new system is introduced one part or module at a time.","alt":"","page":"c05-p03"},{"term":"Pilot changeover","def":"A changeover in which the new system is used first in one location or by one group before being rolled out to the rest.","alt":"","page":"c05-p03"},{"term":"Portfolio","def":"The single document, submitted as a PDF, containing all of the candidate's evidence of analysis, design, development, testing and evaluation.","alt":"Write-up","page":"c01-p01"},{"term":"Primary key","def":"A field (or combination of fields) whose value uniquely identifies each record in a table.","alt":"","page":"c02-p02"},{"term":"Project log","def":"A dated record of the work done in each session and the next steps, used to compare actual progress with the plan.","alt":"Diary","page":"c01-p03"},{"term":"Pseudocode","def":"A structured, language-independent description of an algorithm, using keywords such as IF, WHILE and OUTPUT, written before the code.","alt":"","page":"c02-p09"},{"term":"Referencing","def":"Acknowledging the sources used in a piece of work in a consistent format, so it is clear which work is the candidate's own.","alt":"Citing sources","page":"c05-p08"},{"term":"Referential integrity","def":"A rule enforced by the database that every foreign key value must match an existing primary key value in the related table, preventing orphan records.","alt":"","page":"c03-p01"},{"term":"Repeating group","def":"A set of fields that occurs many times for a single value of the key in an unnormalised relation.","alt":"","page":"c02-p03"},{"term":"Requirements specification","def":"A numbered, agreed list of the functional and non-functional requirements that the new system must meet.","alt":"User requirements","page":"c01-p07"},{"term":"Second normal form","def":"A relation is in 2NF when it is in 1NF and no non-key field depends on only part of a composite key.","alt":"2NF","page":"c02-p04"},{"term":"Structure diagram","def":"A hierarchical diagram that breaks a system down into modules and then into smaller sub-tasks (top-down decomposition).","alt":"Top-down design diagram","page":"c02-p01"},{"term":"System testing","def":"Testing the complete system against all of its requirements, including non-functional ones, using realistic tasks and volumes of data.","alt":"","page":"c04-p01"},{"term":"Test plan","def":"A planned list of tests, each with a number, the requirement it covers, its purpose, the test data, the type of data and the expected result.","alt":"","page":"c04-p01"},{"term":"Test strategy","def":"A short explanation of how a system will be tested, covering the levels of testing (unit, integration, system, acceptance) and the types of test data used.","alt":"","page":"c04-p01"},{"term":"Third normal form","def":"A relation is in 3NF when it is in 2NF and no non-key field depends on another non-key field.","alt":"3NF","page":"c02-p04"},{"term":"Traceability table","def":"A table linking each requirement to its design, development, test and evaluation evidence.","alt":"Requirements traceability matrix","page":"c05-p07"},{"term":"Transitive dependency","def":"Where a non-key field depends on another non-key field rather than directly on the primary key.","alt":"Non-key dependency","page":"c02-p04"},{"term":"Unit testing","def":"Testing each individual part of a system, such as one validation rule, query or procedure, on its own.","alt":"Component testing","page":"c04-p01"},{"term":"User acceptance testing","def":"Testing by the client or end users, who carry out realistic tasks to confirm that the system meets their requirements before it is accepted.","alt":"UAT; acceptance testing","page":"c04-p06"},{"term":"User guide","def":"Documentation for the end users of a system explaining how to install, use, maintain and troubleshoot it, written in plain language with annotated screenshots.","alt":"User documentation","page":"c05-p04"},{"term":"Valid data","def":"Normal, typical data within the acceptable range that the system should accept.","alt":"Normal data","page":"c04-p02"},{"term":"Wireframe","def":"A labelled sketch of the layout of a form, report or screen, showing its controls, their properties and navigation, produced before it is built.","alt":"Storyboard (for a sequence of screens)","page":"c02-p06"}]};

  const lines = wrapText(text, maxc, 2), w = Math.max(...lines.map(l => l.length)) * 6.4 + 10, h = lines.length * 14 + 4;
  const lg = sv('g', { class: 'sv-lbl', transform: rot ? `rotate(${rot} ${x} ${y})` : null }, g);
  sv('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 4 }, lg);
  svText(lg, lines, x, y, null, 14);
}
function playBtn() { return el('button', { type: 'button', class: 'btn pri' }, 'Play'); }

const DIAG = {};

/* ---- 1 cycle ---- */
DIAG.cycle = (d, st, cx) => {
  const items = d.items || [], n = items.length; let cur = -1, timer = null; const seen = new Set();
  const wrap = el('div', { class: 'dg-scroll' });
  const play = playBtn(), next = el('button', { type: 'button', class: 'btn' }, 'Next stage');
  st.append(wrap, el('div', { class: 'btns' }, play, next, el('span', { class: 'muted' }, 'or select a stage')));
  let G = [], centre = null;
  function draw() {
    const W = Math.min(cx.width(), 620);
    const nw = clamp(W * 0.27, 92, 136), cpl = Math.floor((nw - 14) / 7.2);
    const lines = items.map(it => wrapText(it.label, cpl, 3));
    const nh = Math.max(...lines.map(l => l.length)) * 15 + 20;
    const Rx = Math.min(W / 2 - nw / 2 - 12, 210);
    const ang = k => -Math.PI / 2 + 2 * Math.PI * k / n;
    let Ry = Math.max(Rx * 0.8, nh * 1.2);
    for (; Ry < 520; Ry += 6) {
      let ok = true;
      for (let k = 0; k < n && ok; k++) { const a = ang(k), b = ang((k + 1) % n); const dx = Math.abs(Rx * (Math.cos(a) - Math.cos(b))), dy = Math.abs(Ry * (Math.sin(a) - Math.sin(b))); if (dx < nw + 6 && dy < nh + 6) ok = false; }
      if (ok) break;
    }
    const H = 2 * Ry + nh + 16, cxp = W / 2, cyp = H / 2;
    const svg = svgRoot(W, H, d.title);
    sv('ellipse', { cx: cxp, cy: cyp, rx: Rx, ry: Ry, class: 'sv-track' }, svg);
    for (let k = 0; k < n; k++) {
      const m = ang(k + 0.5), x = cxp + Rx * Math.cos(m), y = cyp + Ry * Math.sin(m);
      const tx = -Rx * Math.sin(m), ty = Ry * Math.cos(m), deg = Math.atan2(ty, tx) * 180 / Math.PI;
      sv('path', { d: 'M-5,-7 L4,0 L-5,7', class: 'sv-chev', transform: `translate(${x},${y}) rotate(${deg})` }, svg);
    }
    centre = sv('g', {}, svg); centre.dataset.cx = cxp; centre.dataset.cy = cyp; centre.dataset.w = Math.max(80, 2 * Rx - nw - 20);
    G = items.map((it, k) => {
      const a = ang(k), x = cxp + Rx * Math.cos(a), y = cyp + Ry * Math.sin(a);
      const g = svBtn(svg, `Stage ${k + 1}: ${it.label}`, () => { stop(); select(k); });
      sv('rect', { x: x - nw / 2, y: y - nh / 2, width: nw, height: nh, rx: 10, class: 'shp' }, g);
      svText(g, lines[k], x, y + 2, null, 15);
      const c = sv('g', { class: 'num' }, g);
      sv('circle', { cx: x - nw / 2 + 2, cy: y - nh / 2 + 2, r: 10, style: 'fill:var(--ink);stroke:var(--paper);stroke-width:2' }, c);
      sv('text', { x: x - nw / 2 + 2, y: y - nh / 2 + 2, 'text-anchor': 'middle', 'dominant-baseline': 'central', style: 'fill:var(--paper);font-size:11px;font-weight:700', text: k + 1 }, c);
      return g;
    });
    wrap.innerHTML = ''; wrap.append(svg); update();
  }
  function update() {
    G.forEach((g, k) => { g.classList.toggle('on', k === cur); g.classList.toggle('seen', seen.has(k) && k !== cur); g.setAttribute('aria-pressed', String(k === cur)); });
    if (!centre) return; centre.innerHTML = '';
    const x = +centre.dataset.cx, y = +centre.dataset.cy, cpl = Math.max(10, Math.floor(+centre.dataset.w / 8.5));
    if (cur < 0) svText(centre, wrapText(`${n} stages`, cpl), x, y, 'sv-center big', 20);
    else { svText(centre, [`Stage ${cur + 1} of ${n}`], x, y - 18, 'sv-center', 16); svText(centre, wrapText(items[cur].label, cpl, 2), x, y + 6, 'sv-center big', 20); }
  }
  function select(k) { cur = k; seen.add(k); cx.detail(`${k + 1}. ${items[k].label}`, items[k].detail); update(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; play.textContent = 'Play'; } }
  play.addEventListener('click', () => {
    if (timer) return stop();
    let left = n; play.textContent = 'Pause'; select((cur + 1) % n); left--;
    timer = cx.timer(() => { if (left-- <= 0) return stop(); select((cur + 1) % n); }, 2600);
  });
  next.addEventListener('click', () => { stop(); select((cur + 1) % n); });
  draw(); cx.onResize(draw);
  cx.detail('', 'Select a stage, or press Play to go round the cycle.');
};

/* ---- 2 flow ---- */
DIAG.flow = (d, st, cx) => {
  const nodes = d.nodes || [], idx = new Map(nodes.map((n, i) => [n.id, i]));
  const edges = (d.edges || []).map(e => ({ a: idx.get(e[0]), b: idx.get(e[1]), label: e[2] || '' })).filter(e => e.a != null && e.b != null);
  const N = nodes.length, out = nodes.map(() => []);
  edges.forEach((e, k) => out[e.a].push(k));

  const stateV = new Array(N).fill(0), back = new Set();
  const inDeg = new Array(N).fill(0); edges.forEach(e => inDeg[e.b]++);
  const roots = nodes.map((n, i) => i).filter(i => nodes[i].shape === 'start' || inDeg[i] === 0);
  const order = roots.concat(nodes.map((n, i) => i).filter(i => !roots.includes(i)));
  function dfs(v) { stateV[v] = 1; for (const k of out[v]) { const w = edges[k].b; if (stateV[w] === 1) back.add(k); else if (!stateV[w]) dfs(w); } stateV[v] = 2; }
  order.forEach(v => { if (!stateV[v]) dfs(v); });
  const rank = new Array(N).fill(0), fin = new Array(N).fill(0); edges.forEach((e, k) => { if (!back.has(k)) fin[e.b]++; });
  const q = nodes.map((n, i) => i).filter(i => !fin[i]);
  while (q.length) { const v = q.shift(); for (const k of out[v]) { if (back.has(k)) continue; const w = edges[k].b; rank[w] = Math.max(rank[w], rank[v] + 1); if (--fin[w] === 0) q.push(w); } }
  const R = Math.max(0, ...rank) + 1, layers = Array.from({ length: R }, () => []);
  nodes.forEach((n, i) => layers[rank[i]].push(i));
  for (let r = 1; r < R; r++) {
    const pos = new Map(layers[r - 1].map((v, j) => [v, j]));
    const bc = v => { const ps = edges.filter((e, k) => !back.has(k) && e.b === v && pos.has(e.a)).map(e => pos.get(e.a)); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 1e3; };
    layers[r] = layers[r].map((v, j) => [v, bc(v), j]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);
  }
  // step sequence (BFS in edge order)
  const seq = [], vis = new Set(), qq = roots.length ? roots.slice(0, 1).concat(roots.slice(1)) : [0];
  qq.forEach(v => vis.add(v)); qq.forEach(v => seq.push({ v, via: [] }));
  for (let h = 0; h < seq.length; h++) {
    for (const k of out[seq[h].v]) { const w = edges[k].b; if (!vis.has(w)) { vis.add(w); seq.push({ v: w, via: [k] }); } else { const s = seq.find(x => x.v === w); if (s && seq.indexOf(s) > h) s.via.push(k); } }
  }
  nodes.forEach((n, i) => { if (!vis.has(i)) { vis.add(i); seq.push({ v: i, via: [] }); } });
  let step = -1, sel = -1;
  const wrap = el('div', { class: 'dg-scroll' });
  const bStep = el('button', { type: 'button', class: 'btn pri' }, 'Step'), bReset = el('button', { type: 'button', class: 'btn' }, 'Reset');
  const cnt = el('span', { class: 'muted' });
  st.append(wrap, el('div', { class: 'btns' }, bStep, bReset, cnt));
  let NG = [], EG = [];
  const mid = 'm' + cx.id;
  function draw() {
    const W = cx.width();
    let dir = d.direction === 'tb' ? 'tb' : 'lr';
    const K = Math.max(...layers.map(l => l.length));
    if (dir === 'lr') { const nwTry = (W - 20 - (R - 1) * 44) / R; if (nwTry < 104) dir = 'tb'; }
    const hasBack = back.size > 0, longE = edges.some((e, k) => !back.has(k) && rank[e.b] - rank[e.a] > 1);
    let nw, gapA, gapC, margin = hasBack ? 34 : 6, mL = 0;
    if (dir === 'tb') { mL = longE ? 30 : 0; if (longE) margin += hasBack ? 14 : 24; gapC = 18; nw = clamp((W - margin - mL - 6 - (K - 1) * gapC) / K, 92, 170); gapA = 40; }
    else { gapA = 44; nw = clamp((W - 20 - (R - 1) * gapA) / R, 104, 170); gapC = 22; }
    const cpl = Math.floor((nw - 16) / 7.1), cplD = Math.floor((nw * 0.6) / 7.1);
    const lines = nodes.map(n => wrapText(n.label, n.shape === 'decision' ? Math.max(8, cplD) : cpl, 4));
    const hOf = i => { const L = lines[i].length * 15 + 22; return nodes[i].shape === 'decision' ? L + 22 : L; };
    const P = new Array(N);
    if (dir === 'tb') {
      let y = 8; const totalW = Math.max(W, K * nw + (K - 1) * gapC + margin + mL + 6);

      });
      var SW = totalW, SH = y - gapA + 8 + (hasBack ? 0 : 0);

      let x = 10 + nw / 2;
      layers.forEach((L, r) => { let y = 8 + (H0 - colH[r]) / 2; L.forEach(v => { const h = hOf(v); P[v] = { x, y: y + h / 2, w: nw, h }; y += h + gapC; }); x += nw + gapA; });
      var SW = Math.max(W, x - gapA + nw / 2 - nw / 2 + 10), SH = H0 + 16 + (hasBack ? margin : 0);
    }
    const svg = svgRoot(SW, SH, d.title);

    const eg = sv('g', {}, svg), lg = sv('g', {}, svg), ng = sv('g', {}, svg);

        else { const Y = SH - 12; path = `M${s.x},${s.y + s.h / 2} V${Y} H${t.x} V${t.y + t.h / 2}`; lx = (s.x + t.x) / 2; ly = Y; }
      } else if (dir === 'tb') {

        else if (rank[e.b] - rank[e.a] > 1) { const left = t.x <= SW / 2, X = left ? 12 : SW - (hasBack ? 28 : 14), sx = s.x + (left ? -1 : 1) * s.w / 2, tx = t.x + (left ? -1 : 1) * t.w / 2; path = `M${sx},${s.y} H${X} V${t.y} H${tx}`; lx = X; ly = (s.y + t.y) / 2; lrot = -90; }
        else { const sy = s.y + s.h / 2, ty = t.y - t.h / 2, m = (sy + ty) / 2; path = `M${s.x},${sy} C${s.x},${m} ${t.x},${m} ${t.x},${ty}`; lx = (s.x + t.x) / 2; ly = m; }
      } else {
        const sx = s.x + s.w / 2, tx = t.x - t.w / 2, m = (sx + tx) / 2; path = `M${sx},${s.y} C${m},${s.y} ${m},${t.y} ${tx},${t.y}`; lx = m; ly = (s.y + t.y) / 2;
      }
      const p = sv('path', { d: path, class: 'sv-line', 'marker-end': `url(#${mid})` }, eg);
      edgeLabel(lg, lx, ly, e.label, lrot ? 24 : 14, lrot);
      return p;
    });
    NG = nodes.map((n, i) => {
      const p = P[i], g = svBtn(ng, n.label, () => { sel = i; showNode(i); paint(); });
      const l = p.x - p.w / 2, t = p.y - p.h / 2, w = p.w, h = p.h; let shp;
      if (n.shape === 'decision') shp = sv('polygon', { points: `${p.x},${t} ${l + w},${p.y} ${p.x},${t + h} ${l},${p.y}` }, g);
      else if (n.shape === 'io') shp = sv('polygon', { points: `${l + 12},${t} ${l + w},${t} ${l + w - 12},${t + h} ${l},${t + h}` }, g);
      else if (n.shape === 'store') { const e = 7; shp = sv('path', { d: `M${l},${t + e} a${w / 2},${e} 0 0 0 ${w},0 a${w / 2},${e} 0 0 0 ${-w},0 v${h - 2 * e} a${w / 2},${e} 0 0 0 ${w},0 v${-(h - 2 * e)}` }, g); }
      else shp = sv('rect', { x: l, y: t, width: w, height: h, rx: (n.shape === 'start' || n.shape === 'end') ? h / 2 : 5 }, g);
      shp.setAttribute('class', 'shp');

      return g;
    });
    wrap.innerHTML = ''; wrap.append(svg); paint();
  }
  function showNode(i) { const n = nodes[i]; const shapeName = { start: 'Start', end: 'End', decision: 'Decision', io: 'Input / output', store: 'Data store', process: 'Process' }[n.shape || 'process'] || ''; cx.detail(n.label + (shapeName ? ` · ${shapeName}` : ''), n.detail || ''); }
  function paint() {
    const on = new Set(), seenN = new Set(), onE = new Set();
    for (let s = 0; s <= step && s < seq.length; s++) { seenN.add(seq[s].v); seq[s].via.forEach(k => onE.add(k)); }

  draw(); cx.onResize(draw);

};

/* ---- 3 hotspot ---- */

  const parts = new Map(); const links = (d.links || []).filter(l => l && l.length >= 2);
  (d.rows || []).forEach(row => {

      b.addEventListener('click', () => select(it.label)); parts.set(it.label, { b, it }); r.append(b);
    });

  st.append(box);
  function lines() {

    links.forEach(([a, b]) => {

      const ra = A.b.getBoundingClientRect(), rb = Bp.b.getBoundingClientRect();
      const l = sv('line', { x1: ra.left + ra.width / 2 - br.left, y1: ra.top + ra.height / 2 - br.top, x2: rb.left + rb.width / 2 - br.left, y2: rb.top + rb.height / 2 - br.top, class: 'sv-line' }, svg);

    sv('rect', { x: 10, y: 68, width: 8, height: 14, class: 'art-term' }, s); sv('rect', { x: 222, y: 68, width: 8, height: 14, class: 'art-term' }, s);

    sv('rect', { x: 96, y: 62, width: 48, height: 26, rx: 5, class: 'art-hub' }, s); sv('text', { x: 120, y: 75.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'art-t', text: 'Switch' }, s);

  return s;
}

  const tabs = el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'DFD level' });
  const wrap = el('div', { class: 'dg-scroll', role: 'tabpanel', id: cx.id + '-p' });
  const bs = levels.map((L, i) => { const b = el('button', { type: 'button', role: 'tab', 'aria-controls': wrap.id }, L.label || `Level ${i}`); b.addEventListener('click', () => { lv = i; sel = null; draw(); cx.detail(L.label || '', 'Select a box to see the data flowing in and out of it.'); }); tabs.append(b); return b; });
  tabs.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const j = (lv + (e.key === 'ArrowRight' ? 1 : -1) + levels.length) % levels.length; bs[j].click(); bs[j].focus(); } });
  if (levels.length > 1) st.append(tabs);
  st.append(wrap);
  const mid = 'f' + cx.id;
  function model(L) {
    const N = [];
    (L.entities || []).forEach((e, i) => N.push({ key: String(e), label: String(e), type: 'ent', i }));
    (L.processes || []).forEach(p => N.push({ key: String(p.id), label: p.label, id: String(p.id), type: 'proc' }));
    (L.stores || []).forEach((s, i) => { const o = typeof s === 'string' ? { id: 'D' + (i + 1), label: s } : s; N.push({ key: String(o.id || 'D' + (i + 1)), label: o.label || o.id, id: String(o.id || 'D' + (i + 1)), type: 'store' }); });
    const find = name => { const k = String(name).toLowerCase(); return N.find(n => n.key.toLowerCase() === k) || N.find(n => String(n.label).toLowerCase() === k); };
    const F = (L.flows || []).map(f => ({ a: find(f[0]), b: find(f[1]), label: f[2] || '' })).filter(f => f.a && f.b);
    return { N, F };
  }
  function draw() {
    bs.forEach((b, i) => { b.setAttribute('aria-selected', String(i === lv)); b.tabIndex = i === lv ? 0 : -1; });
    const L = levels[lv]; if (!L) return;
    const { N, F } = model(L), W = Math.max(cx.width(), 300);
    // ---- layered layout: orient flows (DFS from entities), rank by longest path, add dummy waypoints
    const id = new Map(N.map((n, i) => [n, i])), E = F.map(f => ({ f, a: id.get(f.a), b: id.get(f.b) }));
    const outs = N.map(() => []); E.forEach((e, k) => outs[e.a].push(k));
    const vs = new Array(N.length).fill(0), rev = new Set();
    const dfs = v => { vs[v] = 1; for (const k of outs[v]) { const w = E[k].b; if (vs[w] === 1 || w === v) rev.add(k); else if (!vs[w]) dfs(w); } vs[v] = 2; };
    const startOrder = N.map((n, i) => i).sort((x, y) => (N[x].type === 'ent' ? 0 : 1) - (N[y].type === 'ent' ? 0 : 1) || outs[y].length - outs[x].length);
    startOrder.forEach(v => { if (!vs[v]) dfs(v); });
    const DE = E.map((e, k) => rev.has(k) ? { s: e.b, t: e.a, k } : { s: e.a, t: e.b, k }).filter(e => e.s !== e.t);
    const rank = new Array(N.length).fill(0);
    for (let it = 0; it < N.length; it++) DE.forEach(e => { if (rank[e.t] < rank[e.s] + 1) rank[e.t] = rank[e.s] + 1; });
    const R = Math.max(0, ...rank) + 1, layers = Array.from({ length: R }, () => []);
    N.forEach((n, i) => layers[rank[i]].push({ n, i }));
    const chains = new Map();
    DE.forEach(e => {
      const ch = [];
      for (let r = rank[e.s] + 1; r < rank[e.t]; r++) { const dmy = { dummy: true, k: e.k }; layers[r].push(dmy); ch.push(dmy); }
      chains.set(e.k, { dir: !rev.has(e.k), ch });
    });
    // neighbour lists for barycentre ordering
    const nb = x => { const out = []; DE.forEach(e => { const c = chains.get(e.k).ch, pts = [N[e.s], ...c, N[e.t]]; const j = pts.indexOf(x.n || x); if (j > 0) out.push([pts[j - 1], -1]); if (j >= 0 && j < pts.length - 1) out.push([pts[j + 1], 1]); }); return out; };
    const key = x => x.n || x;
    for (let sweep = 0; sweep < 4; sweep++) {
      const down = sweep % 2 === 0;
      for (let r = down ? 1 : R - 2; down ? r < R : r >= 0; r += down ? 1 : -1) {
        const ref = layers[r + (down ? -1 : 1)], posR = new Map(ref.map((x, j) => [key(x), j]));
        layers[r] = layers[r].map((x, j) => { const ps = nb(x).filter(([y, d]) => d === (down ? -1 : 1) && posR.has(y)).map(([y]) => posR.get(y)); return [x, ps.length ? ps.reduce((a, c) => a + c, 0) / ps.length : j, j]; }).sort((p, q) => p[1] - q[1] || p[2] - q[2]).map(z => z[0]);
      }
    }
    const pos = new Map();
    const cols = R * 112 + (R - 1) * 120 <= W;
    let SW = W, SH;
    const DW = 30;
    if (cols) {
      const nw = clamp((W - (R - 1) * 120) / R, 110, 170), gap = R > 1 ? clamp((W - R * nw) / (R - 1), 120, 220) : 0, cpl = Math.floor((nw - 16) / 7);
      N.forEach(n => { n.w = nw; n.lines = wrapText(n.label, cpl, 3); n.h = n.lines.length * 15 + (n.type === 'proc' ? 40 : 24); });
      const hOf = x => x.dummy ? 28 : x.n.h, colH = layers.map(Lr => Lr.reduce((a, x) => a + hOf(x), 0) + (Lr.length - 1) * 40), H0 = Math.max(...colH);
      const xs = (W - (R * nw + (R - 1) * gap)) / 2;
      layers.forEach((Lr, c) => { let y = 16 + (H0 - colH[c]) / 2; Lr.forEach(x => { pos.set(key(x), { x: xs + c * (nw + gap) + nw / 2, y: y + hOf(x) / 2 }); y += hOf(x) + 40; }); });
      SH = H0 + 32;
    } else {
      let y = 12;
      layers.forEach(Lr => {
        const real = Lr.filter(x => !x.dummy).length, dum = Lr.length - real;
        const nw = Math.min(170, (W - (Lr.length - 1) * 18 - dum * DW) / Math.max(1, real)), cpl = Math.floor((nw - 12) / 6.8);
        Lr.forEach(x => { if (!x.dummy) { x.n.w = nw; x.n.lines = wrapText(x.n.label, cpl, 4); x.n.h = x.n.lines.length * 15 + (x.n.type === 'proc' ? 40 : 24); } });
        const rh = Math.max(24, ...Lr.filter(x => !x.dummy).map(x => x.n.h)), tw = real * nw + dum * DW + (Lr.length - 1) * 18;
        let x0 = (W - tw) / 2;
        Lr.forEach(x => { const w = x.dummy ? DW : nw; pos.set(key(x), { x: x0 + w / 2, y: y + rh / 2 }); x0 += w + 18; });
        y += rh + 78;
      });
      SH = y - 78 + 14;
    }
    const svg = svgRoot(SW, SH, (L.label || 'DFD')); const defs = sv('defs', {}, svg); marker(defs, mid, 'sv-mk'); marker(defs, mid + 'on', 'sv-mk on');
    const fg = sv('g', {}, svg), ng = sv('g', {}, svg), lg = sv('g', {}, svg);
    const clip = (n, p, toward) => { const dx = toward.x - p.x, dy = toward.y - p.y; const sx = n.w / 2 / Math.abs(dx || 1e-9), sy = n.h / 2 / Math.abs(dy || 1e-9), s = Math.min(sx, sy, 1); return { x: p.x + dx * s, y: p.y + dy * s }; };
    const pairCount = new Map(), pairIdx = new Map();
    E.forEach(e => { const k = [e.a, e.b].sort().join('|'); pairCount.set(k, (pairCount.get(k) || 0) + 1); });
    E.forEach((e, k) => {
      const f = e.f, pk = [e.a, e.b].sort().join('|'), m = pairCount.get(pk), j = pairIdx.get(pk) || 0; pairIdx.set(pk, j + 1);
      const c = chains.get(k) || { dir: true, ch: [] };
      let pts = [pos.get(f.a), ...(c.dir ? c.ch : c.ch.slice().reverse()).map(x => pos.get(x)), pos.get(f.b)].map(p => ({ x: p.x, y: p.y }));
      // parallel offset, measured in the canonical direction so opposite flows separate
      const can = e.a < e.b ? [pts[0], pts[pts.length - 1]] : [pts[pts.length - 1], pts[0]];
      const dx0 = can[1].x - can[0].x, dy0 = can[1].y - can[0].y, l0 = Math.hypot(dx0, dy0) || 1;
      const off = (j - (m - 1) / 2) * 22, ox = -dy0 / l0 * off, oy = dx0 / l0 * off;
      pts = pts.map(p => ({ x: p.x + ox, y: p.y + oy }));
      pts[0] = clip(f.a, pts[0], pts[1]); pts[pts.length - 1] = clip(f.b, pts[pts.length - 1], pts[pts.length - 2]);
      const on = sel && (sel === f.a || sel === f.b);
      let d = `M${pts[0].x},${pts[0].y}`;
      for (let q = 1; q < pts.length; q++) d += ` L${pts[q].x},${pts[q].y}`;
      sv('path', { d, class: 'sv-line' + (on ? ' on' : ''), 'marker-end': `url(#${mid}${on ? 'on' : ''})`, 'stroke-linejoin': 'round' }, fg);
      // label on the longest segment
      let best = 0, bl = -1; for (let q = 0; q < pts.length - 1; q++) { const ll = Math.hypot(pts[q + 1].x - pts[q].x, pts[q + 1].y - pts[q].y); if (ll > bl) { bl = ll; best = q; } }
      const A = pts[best], Bq = pts[best + 1]; let lx = (A.x + Bq.x) / 2, ly = (A.y + Bq.y) / 2;
      if (m > 1 && off) { const sg = Math.sign(off), lw = Math.min(16, f.label.length) * 6.4 + 10; if (Math.abs(oy) < Math.abs(ox)) lx += sg * Math.sign(ox || 1) * (lw / 2 + 2); else ly += sg * Math.sign(oy || 1) * 12; }
      edgeLabel(lg, lx, ly, f.label, 16);
    });
    N.forEach(n => {
      const p = pos.get(n), l = p.x - n.w / 2, t = p.y - n.h / 2;
      const g = svBtn(ng, `${{ ent: 'External entity', proc: 'Process', store: 'Data store' }[n.type]}: ${n.label}`, () => { sel = n; draw(); showN(n, F); }, sel === n ? 'on' : '');
      if (n.type === 'ent') sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 2, class: 'shp ent' }, g);
      else if (n.type === 'proc') { sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 10, class: 'shp' }, g); sv('line', { x1: l, x2: l + n.w, y1: t + 22, y2: t + 22, class: 'dfd-rule' }, g); sv('text', { x: p.x, y: t + 11.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      else { sv('rect', { x: l, y: t, width: n.w, height: n.h, class: 'shp store' }, g); sv('line', { x1: l + 34, x2: l + 34, y1: t, y2: t + n.h, class: 'dfd-rule' }, g); sv('text', { x: l + 17, y: p.y, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      svText(g, n.lines, n.type === 'store' ? l + 34 + (n.w - 34) / 2 : p.x, n.type === 'proc' ? p.y + 11 : p.y, null, 15);
    });
    wrap.innerHTML = ''; wrap.append(svg);
  }
  function showN(n, F) {
    const ins = F.filter(f => f.b === n), outs = F.filter(f => f.a === n);
    const nm = x => x.type === 'proc' ? `${x.id} ${x.label}` : x.type === 'store' ? `${x.id} ${x.label}` : x.label;
    cx.detailHTML(`<strong>${esc(nm(n))} · ${{ ent: 'external entity', proc: 'process', store: 'data store' }[n.type]}</strong><div>${ins.length ? 'In: ' + ins.map(f => `<b>${esc(f.label)}</b> from ${esc(nm(f.a))}`).join('; ') : 'No data flows in.'}</div><div>${outs.length ? 'Out: ' + outs.map(f => `<b>${esc(f.label)}</b> to ${esc(nm(f.b))}`).join('; ') : 'No data flows out.'}</div>`);
  }
  draw(); cx.onResize(draw);
  cx.detail(levels[0] ? levels[0].label : '', 'Select a box to see the data flowing in and out of it.');
};

/* ---- 15 table-reveal ---- */
DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));
  function paint() {
    rows.forEach((r, ri) => r.forEach((c, ci) => {
      const k = key(ri, ci), td = cells.get(k);
      if (H.has(k) && !shown.has(k)) { td.className = ''; td.innerHTML = ''; const b = el('button', { type: 'button', class: 'cellbtn', 'aria-label': `Reveal ${plain(head[ci] || 'cell')} in row ${ri + 1}` }, '?'); b.addEventListener('click', () => reveal(ri, ci, true)); td.append(b); }
      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }
    }));
    cnt.textContent = `${shown.size} of ${H.size} revealed`;
    next.disabled = all.disabled = shown.size === H.size; hide.disabled = !shown.size;
  }
  function reveal(r, c, focusNext) {
    shown.add(key(r, c)); paint();
    cx.detail(`${plain(head[c] || '')}, row ${r + 1}`, String(rows[r][c]));
    if (focusNext) { const nb = body.querySelector('.cellbtn'); if (nb) nb.focus(); else next.focus(); }
  }
  next.addEventListener('click', () => { const h = order.find(h => !shown.has(key(h[0], h[1]))); if (h) reveal(h[0], h[1]); });
  all.addEventListener('click', () => { order.forEach(h => shown.add(key(h[0], h[1]))); paint(); cx.detail('', 'All cells revealed.'); });
  hide.addEventListener('click', () => { shown.clear(); paint(); cx.detail('', 'Work out each hidden cell, then select it to check.'); });
  paint(); cx.detail('', 'Work out each hidden cell, then select it to check.');
};

  h.push(`<a class="hubl" href="${esc((ON_WEB ? '../index.html' : FRONT_WEB) + '#' + course)}"${ON_WEB ? '' : ' target="_blank" rel="noopener"'}><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5L8 3l5.5 4.5M4 6.5V13h8V6.5"/></svg>All units and topic PowerPoints</a><hr>`);
  const books = (Array.isArray(LIBRARY) ? LIBRARY : []).filter(x => x && (safeUrl(x.url) || x.file));
  if (books.length) {
    h.push('<b>Revision notebooks</b>');
    books.forEach(x => {
      const here = x.id === BK.id;
      const href = here ? '#' + PAGES[cur].p.id : (ON_WEB && x.file && /^[\w.-]+\.html$/i.test(x.file) ? x.file : safeUrl(x.url));
      if (!href) return;

    });

})();
function setLib(open) { libMenu.hidden = !open; libBtn.setAttribute('aria-expanded', String(open)); if (open) { const a = libMenu.querySelector('a'); a && a.focus(); } }
libBtn.addEventListener('click', e => { e.stopPropagation(); setLib(libMenu.hidden); });
