/* =====================================================================
   DISPLAY FONT: Lemon Milk (all-caps display face, the teacher's PowerPoint font) for titles, section
   headers, buttons, tabs and glossary terms only. Body text, tables, definitions, captions and code keep
   the readable faces. --font-hero (Saira Hero, a free stand-in for Designer) is for the cover and chapter banner titles only.
   ===================================================================== */
@font-face{font-family:'Lemon Milk';src:url('../fonts/lemonmilk-light.woff') format('woff');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Lemon Milk';src:url('../fonts/lemonmilk-regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Lemon Milk';src:url('../fonts/lemonmilk-medium.woff') format('woff');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Lemon Milk';src:url('../fonts/lemonmilk-bold.woff') format('woff');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Saira Hero';src:url('../fonts/saira-hero.woff') format('woff');font-weight:900;font-style:normal;font-display:swap}
:root{--display:'Lemon Milk','Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;--font-hero:'Saira Hero','Lemon Milk',sans-serif}
.cv-t{font-family:var(--font-hero);font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(28px,5vw,46px);line-height:1.05;max-width:18ch}
.cbn-t{font-family:var(--font-hero);font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(22px,3.6vw,31px);line-height:1.1}
.sheet .phero h1{font-family:var(--display);font-weight:500;letter-spacing:.03em;font-size:clamp(18px,2.2vw,22px)!important;line-height:1.3;max-width:34ch}
.sheet .phero h1 .cont{font-family:var(--sans);text-transform:none;letter-spacing:0;font-weight:400}
.sec > h2,.kt > summary b,.dg-head h3,.an-h b,.ncard > h2,.cv-tile b{font-family:var(--display);letter-spacing:.03em;font-weight:500}
.sec > h2{font-size:14.5px}.kt > summary b{font-size:14px}.dg-head h3{font-size:16px;line-height:1.35}.an-h b{font-size:13.5px}
.ncard > h2{font-size:18px;line-height:1.3}.cv-tile b{font-size:14.5px;line-height:1.3}
.btn,.lp-tabs button,.gv-modes button,.chip,.donebtn,.code-cp,.an-k{font-family:var(--display);letter-spacing:.03em;font-weight:500}
.btn,.lp-tabs button,.gv-modes button{font-size:12.5px}

/*ANIM-CSS*/
/* =====================================================================
   ANIMATIONS (anim blocks): a looping scene on a chapter-tinted dotted stage,
   with a story-style step bar under it. Colours come from the chapter hue (--cc)
   and a partner hue rotated from it (--a2), so every chapter gets its own pair.
   ===================================================================== */
.anim{--k:var(--cc);--a2:var(--b-vid);--a2:oklch(from var(--cc) l c calc(h + 155));
  --ks:color-mix(in srgb,var(--k) 15%,var(--paper));--kt:color-mix(in srgb,var(--k) 6%,var(--paper));--as:color-mix(in srgb,var(--a2) 16%,var(--paper));
  --gs:color-mix(in srgb,var(--good) 16%,var(--paper));--bs:color-mix(in srgb,var(--bad) 15%,var(--paper));
  margin:4px 0;border-radius:16px;background:var(--paper);box-shadow:var(--soft-shadow);outline:1px solid color-mix(in srgb,var(--k) 22%,var(--line));overflow:hidden;font-family:var(--sans)}
.an-h{display:flex;align-items:center;gap:9px;padding:10px 14px 10px 14px;font-size:14.5px;line-height:1.3;border-bottom:1px solid color-mix(in srgb,var(--k) 18%,var(--line))}
.an-h .bi{--bc:var(--k);width:26px;height:26px;border-radius:8px;background:var(--k);color:var(--paper)}
.an-h b{min-width:0;flex:1;text-wrap:balance}
.an-k{flex:none;font-size:12px;font-weight:700;color:var(--k);background:var(--kt);border:1px solid color-mix(in srgb,var(--k) 28%,transparent);border-radius:999px;padding:1px 9px}
.an-st{padding:14px 12px 6px;background-color:var(--kt);background-image:radial-gradient(color-mix(in srgb,var(--k) 18%,transparent) 1px,transparent 1.3px);background-size:16px 16px}
.an-svg{display:block;width:100%;height:auto;max-width:var(--mw,540px);margin:0 auto;overflow:visible;transition:opacity .3s ease}
.an-svg.an-out{opacity:0}
.an-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 0;background:var(--kt)}
.an-b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid color-mix(in srgb,var(--k) 30%,var(--line));background:var(--paper);color:var(--k);padding:0;transition:background-color .15s,transform .12s}
.an-b svg{width:18px;height:18px;fill:currentColor}
.an-prev svg,.an-next svg{fill:none}
.an-b:hover{background:var(--ks)}
.an-b:active{transform:scale(.94)}
.an-pp{background:var(--k);color:var(--paper);border-color:var(--k)}
.an-pp:hover{background:var(--k);filter:brightness(1.08)}
.an-pips{flex:1;min-width:0;display:flex;gap:4px;align-items:center;height:34px}
.an-pip{flex:1;min-width:0;height:34px;border:0;background:none;padding:0;display:grid;align-items:center;cursor:pointer}
.an-pip i{display:block;height:6px;border-radius:6px;background:color-mix(in srgb,var(--k) 18%,var(--paper));position:relative;overflow:hidden;transition:height .15s}
.an-pip i::after{content:"";position:absolute;inset:0;background:var(--k);transform-origin:left;transform:scaleX(var(--f,0))}
.an-pip.on i{height:8px}
.an-pip:hover i{height:9px}
.an-pip:focus-visible{outline-offset:-2px}
.an-cap{display:flex;gap:10px;align-items:baseline;margin:0;padding:8px 14px 12px;background:var(--kt);font-size:14.5px;line-height:1.45;min-height:3.9em;color:var(--ink)}
.an-n{flex:none;font-size:12px;font-weight:700;color:var(--k);font-variant-numeric:tabular-nums;min-width:2.6em}
.an-ct{min-width:0}
.anim figcaption{padding:9px 14px 11px;border-top:1px solid color-mix(in srgb,var(--k) 14%,var(--line));font-size:13.5px;color:var(--ink-2);font-style:italic}
.anim .an-all{display:none;margin:0;padding:6px 14px 10px 34px;font-size:14px;color:var(--ink-2);background:var(--kt);gap:2px;flex-direction:column}
.an-all li::marker{color:var(--k);font-weight:700}
@media (prefers-reduced-motion:reduce){ .anim .an-all{display:flex} .an-pp{display:none} .an-cap{display:none} }
@media print{ .an-bar,.an-cap{display:none} .anim .an-all{display:flex} }
@media (max-width:520px){ .an-st{padding:10px 4px 4px} .an-h{padding:9px 12px} .an-cap{padding:8px 12px 11px;font-size:14px} .an-bar{padding:8px 8px 0} }
/* scene vocabulary: f* = fill, s* = stroke, t* = text colour */
.an-svg text{white-space:pre;font-family:var(--sans);font-size:15px;fill:var(--ink);dominant-baseline:central;text-anchor:middle}
.an-svg .m{font-family:var(--mono);font-size:14px}
.an-svg .b{font-weight:700}
.an-svg .sm{font-size:12.5px}
.an-svg .lg{font-size:19px}
.an-svg .xl{font-size:26px}
.an-svg .tl{text-anchor:start}.an-svg .tr{text-anchor:end}
.an-svg .on{fill:var(--paper)}
.an-svg .tk{fill:var(--k)}.an-svg .ta{fill:var(--a2)}.an-svg .t2{fill:var(--ink-2)}.an-svg .t3{fill:var(--ink-3)}.an-svg .tg{fill:var(--good)}.an-svg .tb{fill:var(--bad)}
.an-svg rect,.an-svg circle,.an-svg path,.an-svg line,.an-svg polygon{stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.an-svg .fk{fill:var(--k)}.an-svg .fks{fill:var(--ks)}.an-svg .fkt{fill:var(--kt)}
.an-svg .fa{fill:var(--a2)}.an-svg .fas{fill:var(--as)}
.an-svg .fp{fill:var(--paper)}.an-svg .fp2{fill:var(--paper-2)}.an-svg .fi{fill:var(--ink)}.an-svg .fl{fill:var(--line)}
.an-svg .fg{fill:var(--good)}.an-svg .fgs{fill:var(--gs)}.an-svg .fb{fill:var(--bad)}.an-svg .fbs{fill:var(--bs)}.an-svg .fw{fill:var(--warn)}
.an-svg .fn{fill:none}
.an-svg .sk{stroke:var(--k)}.an-svg .sa{stroke:var(--a2)}.an-svg .sl{stroke:var(--line)}.an-svg .si{stroke:var(--ink-3)}.an-svg .si2{stroke:var(--ink-2)}.an-svg .sg{stroke:var(--good)}.an-svg .sb{stroke:var(--bad)}.an-svg .sp{stroke:var(--paper)}
.an-svg .w0{stroke-width:0}.an-svg .w1{stroke-width:1}.an-svg .w2{stroke-width:2.2}.an-svg .w3{stroke-width:3.2}.an-svg .w5{stroke-width:5}
.an-svg .dsh{stroke-dasharray:5 5}
.an-svg .ar-s{fill:none;stroke:currentColor;stroke-width:2.2}
.an-svg .ar-h{fill:currentColor;stroke:none}
.an-svg .ak{color:var(--k)}.an-svg .aa{color:var(--a2)}.an-svg .ai{color:var(--ink-3)}.an-svg .ag{color:var(--good)}.an-svg .ab{color:var(--bad)}
.an-svg .sh{filter:drop-shadow(0 1px 1.5px rgba(20,30,50,.18))}
:root[data-theme="dark"] .an-svg .sh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .an-svg .sh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))} }

/* =====================================================================
   NOTES MOTION: key points in sequence, table rows, code typing, example steps,
   tutorial steps, and a gentle pulse on interactive diagrams until first used.
   Elements only get .mo when IntersectionObserver exists and motion is allowed.
   ===================================================================== */
@keyframes mo-rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes mo-fade{from{opacity:0}to{opacity:1}}
@keyframes mo-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mo-caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes mo-step{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes mo-pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes dg-pulse{0%,100%{box-shadow:var(--card-shadow),0 0 0 0 color-mix(in srgb,var(--cc) 0%,transparent)}50%{box-shadow:var(--card-shadow),0 0 0 5px color-mix(in srgb,var(--cc) 26%,transparent)}}
.mo.boxed.key li,.mo.tut .tut-s li,.mo.tw tbody tr{opacity:0}
.mo-in.boxed.key li,.mo-in.tut .tut-s li{animation:mo-rise .38s var(--ease) both;animation-delay:calc(var(--i,0) * 75ms + 40ms)}
.mo-in.tw tbody tr{animation:mo-fade .42s ease both;animation-delay:calc(var(--i,0) * 45ms)}
.mo.code .ln{opacity:0}
.mo.code .ln.ty{width:max-content}
.mo-in.code .ln{animation:mo-fade .35s ease both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty{animation:mo-type var(--tt,600ms) steps(var(--tn,20),end) both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty.last::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:1px;vertical-align:-.15em;background:currentColor;opacity:0;animation:mo-caret .5s steps(1) 3;animation-delay:calc(var(--td,0ms) + var(--tt,600ms))}
.ex ol li{animation:mo-step .32s var(--ease)}
.ex ol li::before{animation:mo-pop .4s var(--ease)}
.dg.fresh{animation:dg-pulse 2.8s ease-in-out .8s 5}
@media (prefers-reduced-motion:reduce){ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} .dg.fresh{animation:none} }
@media print{ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} }

const BOOK = {"book":{"id":"A22","title":"A2 2: Building in Access and VBA (tutorials)","qual":"CCEA GCE Digital Technology","hub":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP","edition":"2026–27","lessonNames":{"AD04":"Development: building and evidencing the database application","AD05":"Testing and evaluation against the requirements"}},"chapters":[{"id":"c01","n":1,"title":"Getting started with Access","intro":"Set up the Riverside Bikes database: create and save the file, find your way round Access, trust it so VBA will run, and keep it safe with backups and Compact and Repair.","pages":[{"id":"c01-p01","spec":"Create and save a new blank Access database","lessons":["AD04"],"summary":"Create the Riverside Bikes database file, save it in a sensible folder and reopen it safely.","blocks":[{"t":"p","text":"Every Access project lives in **one file** with the extension `.accdb`. All of your [[tables|Table]], [[queries|Query]], [[forms|Form]], [[reports|Report]] and VBA code are stored inside it, so where you save it and what you call it matter from the very first click."},{"t":"key","title":"You will need / By the end","items":["Microsoft 365 Access for Windows (Access is not available on Mac or in a web browser).","A folder you own, for example `Documents\\A2 Digital Technology\\Riverside Bikes`.","By the end you will have an empty database called **Riverside Bikes.accdb** that opens without warnings."]},{"t":"example","title":"Tutorial: Make the project folder","steps":["Open **File Explorer** and go to your **Documents** folder (or your school home drive, usually `H:`).","Click **New folder**, name it **Riverside Bikes** and press **Enter**.","Keep this folder for the database only. Later you will add a **Backups** folder inside it."]},{"t":"example","title":"Tutorial: Create the blank database","steps":["Start **Access**. On the start screen click **Blank database** (or **File › New › Blank database** if Access is already open).","In the **File Name** box file, and it should vanish when you close Access."]}],"diagram":{"kind":"flow","title":"Creating the database file","caption":"Click Step to follow the order of the clicks.","direction":"lr","nodes":[{"id":"a","label":"Start Access","detail":"Open Microsoft 365 Access for Windows.","shape":"start"},{"id":"b","label":"Blank database","detail":"Choose Blank database on the start screen, or File › New › Blank database.","shape":"process"},{"id":"c","label":"Name the file","detail":"Type Riverside Bikes.accdb in the File Name box.","shape":"io"},{"id":"d","label":"Choose the folder","detail":"Use the folder icon to browse to your Riverside Bikes folder.","shape":"process"},{"id":"e","label":"Create","detail":"Access creates the .accdb file immediately — it is already saved.","shape":"store"},{"id":"f","label":"Close Table1","detail":"Close the starter table without saving; you will build tables in Design view.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[{"q":"What file extension does a Microsoft 365 Access database use?","o":[".xlsx",".accdb",".mdbx",".laccdb"],"a":1,"why":".accdb is the Access database format; .laccdb is only the temporary lock file."},{"q":"You type three new customers into a table and close it. What happens to the data?","o":["It was saved automatically as you left each record","It is lost unless you press Ctrl+S","It is saved only when you close Access","It is saved only after Compact and Repair"],"a":0,"why":"Access writes each record to the file as soon as you move off it. Ctrl+S is for design changes."}],"exam":[],"practice":[{"q":"Try it yourself: create a second practice database called **Sandbox.accdb** in a separate folder that you can use to test ideas without risking your project. Then explain why keeping it separate is sensible.","m":3,"a":"1. File › New › Blank database. 2. File Name: Sandbox.accdb; folder icon › choose a different folder (e.g. Documents\\Access Sandbox) › Create. 3. Close Table1. Why: experiments (deleting objects, running delete/update queries, testing code) cannot damage the Riverside Bikes file; anything that works can be imported later with External Data › New Data Source › Database › Access."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Design and build tables for a database (Access basics, part 1)","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/video-design-and-build-tables-for-a-database-access-basics-part-1"}],"terms":["Table","Query","Form","Report"]},{"id":"c01-p02","spec":"Find your way around the Access window and the Navigation Pane","lessons":["AD04"],"summary":"Learn the parts of the Access window you will use in every later tutorial.","blocks":[{"t":"p","text":"The tutorials in this workbook give menu paths such as **Create tab › Table Design**. This page shows where each of those things is, so you can follow them quickly. Open **Riverside Bikes.accdb** before you start."},{"t":"key","title":"You will need / By the end","items":["Riverside Bikes.accdb open (empty is fine).","By the end you can find the ribbon tabs, the [[Navigation Pane]], object tabs, the status bar view buttons and the message bar."]},{"t":"table","head":["Part of the window","Where","What you use it for"],"rows":[["**File** tab (Backstage)","Far left of the ribbon","Open, save as, back up, compact and repair, Options (Trust Center, start-up settings)."],["**Ribbon** tabs","Across the top: Home, Create, External Data, Database Tools, Help","Every command. Extra *contextual* tabs (e.g. **Table Design**, **Query Design**, **Form Design**) appear only while you are designing that kind of object."],["**Navigation Pane**","Down the left","Lists every object. Double-click to open; right-click for Design View, Rename, Delete, Copy."],["**Object tabs**","Above the work area","Each open object has a tab. Right-click a tab to Save, Close or switch view."],["**Status bar**","Bottom of the window","Shows the current view, and has small **view buttons** at the bottom right."],["**Message bar**","Just under the ribbon (yellow)","Security warnings such as *Some active content has been disabled* with the **Enable Content** button."]],"caption":"The parts of the Access window"},{"t":"example","title":"Tutorial: Set up the Navigation Pane so you can see everything","steps":["Click the heading at the top of the Navigation Pane (it may say **All Access Objects** or **Tables**).","Under *Navigate To Category* choose **Object Type**; under *Filter By Group* choose **All Access Objects**.","Objects are now grouped as Tables, Queries, Forms, Reports, Macros and Modules. Click a group heading to collapse or expand it.","Press **F11** to hide the pane and **F11** again to show it. The **«** button at the top does the same.","Type into the **Search** box at the top of the pane to find an object by name — useful once you have 30+ objects."]},{"t":"example","title":"Tutorial: Choose tabbed documents (recommended)","steps":["**File › Options › Current Database**.","Under *Document Window Options* choose **Tabbed Documents** and tick **Display Document Tabs**.","Click **OK**, then close and reopen the database for the change to take effect."],"answer":"Each object now opens as a tab, like browser tabs, instead of in overlapping windows."},{"t":"tip","text":"Use a prefix on every object name so it is obvious what it is and so names sort together: **tbl** tables, **qry** queries, **frm** forms, **sfrm** subforms, **rpt** reports, **mod** modules. Never use spaces in object or field names — it makes SQL and VBA harder (you would need square brackets every time)."},{"t":"warn","text":"Access is Windows-only. If the ribbon looks very different (no **Table Design** tab, only **Design**), you are on Access 2016 or 2019: the commands are the same, just on a tab called **Design**. This workbook names the Microsoft 365 tabs and gives the older name where it differs."},{"t":"key","title":"Check it works","items":["Press F11 twice: the Navigation Pane hides and returns.","Click **Create** on the ribbon and point to **Table Design**, **Query Design**, **Form Design** and **Report Design** — you will use all four.","Open File › Options and find **Current Database** and **Trust Center** in the list on the left."]}],"diagram":{"kind":"hotspot","title":"The Access window","caption":"Click each part to see what it does.","rows":[[{"label":"File tab","detail":"Backstage view: Open, Save As, Back Up Database, Compact & Repair, Options.","span":1},{"label":"Ribbon","detail":"Home, Create, External Data, Database Tools. Contextual tabs such as Table Design or Form Design appear while you design an object.","span":3}],[{"label":"Message bar","detail":"Yellow security bar. 'Enable Content' lets VBA and action queries run in an untrusted file.","span":4}],[{"label":"Navigation Pane","detail":"Every table, query, form, report, macro and module. F11 shows or hides it.","span":1},{"label":"Object tabs and work area","detail":"Each open object has a tab; right-click a tab to save, close or change view.","span":3}],[{"label":"Status bar","detail":"Shows the current view. The view buttons at the bottom right switch between Datasheet, Form, Layout and Design view.","span":4}]],"links":[["Navigation Pane","Object tabs and work area"]]},"check":[{"q":"Which key shows or hides the Navigation Pane?","o":["F4","Alt+F11","F8","F11"],"a":3,"why":"F11 toggles the Navigation Pane. Alt+F11 opens the VBA editor and F4 opens the Property Sheet in Design view."},{"q":"You cannot see the Table Design tab on the ribbon. What is the most likely reason?","o":["The database is not trusted","The Navigation Pane is hidden","No table is open in Design view","You need to compact the database"],"a":2,"why":"Contextual tabs such as Table Design appear only while that kind of object is open in Design view."},{"q":"Which object name follows the naming convention used in this workbook?","o":["Customer Table","tblCustomer","customers.tbl","Tbl Customer"],"a":1,"why":"A three-letter prefix and no spaces: tblCustomer."}],"exam":[],"practice":[{"q":"Try it yourself: make Access open your database with tabbed documents and the Navigation Pane showing objects grouped by type, then list the six object groups you can see.","m":2,"a":"File › Options › Current Database › Document Window Options: Tabbed Documents, tick Display Document Tabs › OK › close and reopen. Click the Navigation Pane heading › Object Type and All Access Objects. Groups: Tables, Queries, Forms, Reports, Macros, Modules (empty groups only appear once an object of that type exists)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Design and build tables for a database (Access basics, part 1)","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/video-design-and-build-tables-for-a-database-access-basics-part-1"}],"terms":["Navigation Pane"]},{"id":"c01-p03","spec":"Recognise the Access object types and switch between Datasheet, Design and Layout view","lessons":["AD04"],"summary":"Know what each type of Access object does in Riverside Bikes and how to change view.","blocks":[{"t":"p","text":"An Access application is built from six kinds of object. In Riverside Bikes, **tables** hold the data, **queries** pick out and calculate, **forms** are the screens staff use, **reports** are what gets printed, and **macros** and **modules** hold the automation. Each object can be opened in more than one *view*: one view for using it, and one or two for building it."},{"t":"key","title":"You will need / By the end","items":["Riverside Bikes.accdb open.","By the end you can say which object to build for a job and which view to use."]},{"t":"table","head":["Object","Prefix","Job in Riverside Bikes","Example you will build"],"rows":[["[[Table]]","tbl","Stores the data, one table per thing (customers, products, orders).","tblProduct"],["[[Query]]","qry","Finds, sorts, joins and calculates; action queries change data.","qryLowStock, qryOrderTotals"],["[[Form]]","frm / sfrm","On-screen windows for entering and viewing data, with buttons.","frmOrder with sfrmOrderLine"],["[[Report]]","rpt","Formatted output for printing or PDF, with grouping and totals.","rptOrderReceipt"],["[[Macro]]","mcr","A list of ready-made actions (the button wizard creates these).","AutoExec (optional)"],["[[Module]]","mod","A container for VBA code that can be called from anywhere.","modStock"]],"caption":"The six Access object types"},{"t":"table","head":["View","Used for","Objects"],"rows":[["[[Datasheet view]]","Typing and checking data in rows and columns; seeing query results.","Tables, queries, forms"],["[[Design view]]","Building: fields and properties, query grid, exact control positions, code events.","All except macros (which open in the Macro Builder)"],["[[Layout view]]","Adjusting a form or report while seeing real data.","Forms, reports"],["Form view / Report view / Print Preview","Using the finished form or report as a member of staff would.","Forms, reports"],["SQL view","Reading or typing the SQL behind a query.","Queries"]],"caption":"Views"},{"t":"example","title":"Tutorial: Switch views three ways","steps":["Right-click an object in the Navigation Pane › **Design View** opens it ready to build. Double-clicking opens it for use.","With an object open, use **Home › View** (the top half of the button flips to the most likely view; the bottom half shows a list of all views).","Or click the small **view buttons** at the far right of the status bar.","If you switch from Design view after changing something, Access asks you to save first — click **Yes**."]},{"t":"tip","text":"Design view is for building; the other views are for using. If you cannot type data, you are probably in Design view. If you cannot find a property such as Validation Rule or a control's name, you are probably not in Design view."},{"t":"note","text":"A *split form* and a *navigation form* are just special layouts of the Form object; you will meet the main menu form in Chapter 4."},{"t":"key","title":"Check it works","items":["Create a throwaway table (Create › Table), then use Home › View to switch between Datasheet view and Design view. Access asks you to name it on the way into Design view — call it **tblTest**.","Right-click **tblTest** in the Navigation Pane › **Delete** › **Yes**. Your database is empty again."]}],"diagram":{"kind":"match","title":"Which object does the job?","caption":"Match each Access object to the job it does in Riverside Bikes.","pairs":[["Table","Stores every product's price and stock level"],["Query","Lists products whose stock is at or below the reorder level"],["Form","Lets a shop assistant enter a new order on screen"],["Report","Prints a customer receipt with VAT and total"],["Module","Holds VBA procedures used by several forms"],["Design view","Where you set field properties and control positions"]]},"check":[{"q":"A shop assistant needs a screen to add new customers. Which object should you build?","o":["A form","A report","A query","A macro"],"a":0,"why":"Forms are the on-screen windows for entering and viewing data."},{"q":"Which view lets you move form controls while still seeing real data?","o":["Datasheet view","SQL view","Print Preview","Layout view"],"a":3,"why":"Layout view shows real data while you resize and arrange controls."}],"exam":[],"practice":[{"q":"Try it yourself: for each of these Riverside Bikes jobs name the object type and an object name using the prefix convention: (a) a printed list of products to reorder; (b) the screen used to search for a customer by surname; (c) the list of total sales for each category.","m":3,"a":"(a) Report – rptLowStock (based on qryLowStock). (b) Form – frmSearch (it may use a parameter query or VBA filter). (c) Query – a totals query qrySalesByCategory (and optionally a report rptSalesByCategory to print it)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Design and build tables for a database (Access basics, part 1)","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/video-design-and-build-tables-for-a-database-access-basics-part-1"}],"terms":["Table","Query","Form","Report","Macro","Module","Datasheet view","Design view","Layout view"]},{"id":"c01-p04","spec":"Trust your database so VBA and action queries run: Enable Content and trusted locations","lessons":["AD04"],"summary":"Stop the security warning and make sure your VBA code and action queries will run every time.","blocks":[{"t":"p","text":"Access protects you from harmful code. When you open a database that is **not** in a [[trusted location|Trusted location]], it disables VBA, macros and action queries and shows a yellow message bar. Your code will silently do nothing until you trust the file, so sort this out before you write any VBA."},{"t":"key","title":"You will need / By the end","items":["Riverside Bikes.accdb in your Riverside Bikes folder.","By the end the database opens with **no** yellow security bar."]},{"t":"h","text":"Quick fix: Enable Content"},{"t":"example","title":"Tutorial: Enable content for this session","steps":["Open the database. If you see **SECURITY WARNING Some active content has been disabled. Click for more details.**, click **Enable Content**.","Access remembers this for this file on this computer (it becomes a *trusted document*), but if you move the file or use another computer you may be asked again."]},{"t":"h","text":"Proper fix: make your folder a trusted location"},{"t":"example","title":"Tutorial: Add a trusted location","steps":["**File › Options › Trust Center › Trust Center Settings…**","Click **Trusted Locations** on the left, then **Add new location…**","Click **Browse…**, select your **Riverside Bikes** folder and click **OK**.","Tick **Subfolders of this location are also trusted** (so your Backups folder is trusted too) and click **OK**.","If your folder is on a school network drive and Access refuses it, tick **Allow Trusted Locations on my network (not recommended)** on the same page first — or ask your teacher, as school IT policy may control this.","Click **OK** twice, then close and reopen the database."],"answer":"The database now opens with no message bar and all code is enabled."},{"t":"table","head":["What you see","What it means","What to do"],"rows":[["Yellow bar: *Some active content has been disabled*","File is not trusted; VBA and action queries are blocked.","Enable Content, or add the folder as a trusted location."],["Red bar: *Microsoft has blocked macros from running because the source of this file is untrusted*","The file came from the internet or email (it carries the *Mark of the Web*).","Close Access. In File Explorer right-click the file › **Properties** › tick **Unblock** › OK. Reopen."],["Clicking a button does nothing, no error","Code is disabled.","Check for the yellow bar; trust the file."],["*The expression On Click you entered as the event property setting produced the following error*","Often a compile error in the module, or code disabled.","Trust the file, then in the VBA editor use **Debug › Compile**."]],"caption":"Security messages and fixes"},{"t":"warn","text":"Only trust folders that contain your own work. Never add Downloads, the Desktop or a whole drive (such as C:\\) as a trusted location — anything placed there would run without warning."},{"t":"tip","text":"If you email the database home or download it from Teams/Google Drive, Windows marks it as coming from the internet. Use **Properties › Unblock** before opening, then save it in your trusted folder."},{"t":"key","title":"Check it works","items":["Close and reopen Riverside Bikes.accdb: there should be no yellow or red bar.","After Chapter 4 you will have a button that runs VBA. If it works first time after reopening, the trust setting is correct."]}],"diagram":{"kind":"flow","title":"Will my VBA run?","caption":"Step through what Access checks when a database opens.","direction":"tb","nodes":[{"id":"o","label":"Open .accdb","detail":"You double-click Riverside Bikes.accdb.","shape":"start"},{"id":"m","label":"Marked as from the internet?","detail":"Files downloaded or emailed carry the Mark of the Web.","shape":"decision"},{"id":"u","label":"Red bar: blocked","detail":"Close Access, right-click the file › Properties › Unblock, reopen.","shape":"process"},{"id":"t","label":"In a trusted location?","detail":"File › Options › Trust Center › Trusted Locations.","shape":"decision"},{"id":"d","label":"Trusted document already?","detail":"You clicked Enable Content for this file on this PC before.","shape":"decision"},{"id":"y","label":"Yellow bar","detail":"Click Enable Content.","shape":"process"},{"id":"r","label":"VBA and action queries run","detail":"Code, macros and action queries are all enabled.","shape":"end"}],"edges":[["o","m"],["m","u","yes"],["u","o"],["m","t","no"],["t","r","yes"],["t","d","no"],["d","r","yes"],["d","y","no"],["y","r"]]},"check":[{"q":"Your Save button does nothing and there is no error message. What should you check first?","o":["Whether the table has a primary key","Whether the form is in Layout view","Whether the yellow security bar is showing","Whether Compact on Close is ticked"],"a":2,"why":"Disabled content fails silently — the yellow bar is the clue."},{"q":"Which folder is the most sensible to add as a trusted location?","o":["C:\\","Your Riverside Bikes project folder","Downloads","The Desktop"],"a":1,"why":"Trust only a folder that holds your own project, never a broad or download folder."},{"q":"A red bar says macros are blocked because the file's source is untrusted. What fixes it?","o":["File Explorer › Properties › Unblock","Enable Content","Compact and Repair","Pressing F11"],"a":0,"why":"Files with the Mark of the Web must be unblocked in their file properties; Enable Content is not offered."}],"exam":[],"practice":[{"q":"Try it yourself: you copy your database to a USB stick to work on it at home and the yellow bar appears every time. Give the steps to stop it permanently on the home PC.","m":3,"a":"1. Copy the file from the USB into a folder on the home PC, e.g. Documents\\Riverside Bikes (working directly from USB risks corruption). 2. File › Options › Trust Center › Trust Center Settings › Trusted Locations › Add new location › Browse to that folder › tick Subfolders are also trusted › OK › OK. 3. Close and reopen the database: no bar appears. (If the file was emailed/downloaded rather than copied, first right-click › Properties › Unblock.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Trusted location"]},{"id":"c01-p05","spec":"Keep the database healthy: compact and repair, back up and restore","lessons":["AD04"],"summary":"Set up a backup routine and use Compact and Repair so your project never gets lost or corrupted.","blocks":[{"t":"p","text":"An Access file grows as you work, because deleted records and replaced designs leave empty space behind. [[Compact and repair]] rebuilds the file to remove that space and fix minor damage. A [[backup|Backup]] is a dated copy you can go back to if something goes wrong — such as a delete query that removes the wrong records."},{"t":"anim","scene":"backup-restore","caption":"The general idea behind any backup routine, including your database’s."},{"t":"key","title":"You will need / By the end","items":["Riverside Bikes.accdb open; a **Backups** folder inside your Riverside Bikes folder.","By the end you will have made a dated backup, compacted the database and set it to compact automatically."]},{"t":"example","title":"Tutorial: Back up the database","steps":["Close all open objects (right-click any object tab › **Close All**).","**File › Save As**. Under *Save Database As* choose **Back Up Database**, then click **Save As**.","Access suggests a name with today's date, e.g. **Riverside Bikes_2026-10-29.accdb**. Browse to your **Backups** folder and click **Save**.","You are still working in the original file; the backup is a separate copy."]},{"t":"example","title":"Tutorial: Compact and repair now","steps":["Close all open objects.","**Database Tools › Compact and Repair Database** (or **File › Info › Compact & Repair Database**).","Access closes, rebuilds and reopens the file. Check the file size in File Explorer before and after."]},{"t":"example","title":"Tutorial: Compact automatically when you close","steps":["**File › Options › Current Database**.","Under *Application Options* tick **Compact on Close** and click **OK**."]},{"t":"example","title":"Tutorial: Restore from a backup","steps":["Close Access.","In File Explorer rename the damaged file, e.g. **Riverside Bikes BROKEN.accdb** (keep it until you are sure).","Copy the most recent good backup from **Backups** into the Riverside Bikes folder and rename the copy **Riverside Bikes.accdb**.","Open it and check your latest tables, forms and code are there; redo anything made after the backup date."]},{"t":"table","head":["When","Do this"],"rows":[["Start of every lesson","Back Up Database into the Backups folder."],["Before running any update, append or delete query","Back up first — action queries cannot be undone."],["Before big VBA changes","Back up, or export the module (VBA editor › right-click module › Export File)."],["End of every lesson","Close all objects; let Compact on Close run."]],"caption":"A simple backup routine"},{"t":"warn","text":"**Ctrl+Z will not undo an action query or a deleted record.** Once a delete or update query has run and you click Yes, the change is permanent. Your backup is the only way back."},{"t":"tip","text":"If Access says *Unrecognized database format* or *The database cannot be opened because the VBA project contained in it cannot be read*, do not keep trying: make a copy of the file, then try Compact and Repair on the copy, and if that fails restore yesterday's backup."},{"t":"key","title":"Check it works","items":["Your Backups folder contains a file named **Riverside Bikes_** plus today's date.","After Compact and Repair the database reopens normally.","File › Options › Current Database shows **Compact on Close** ticked."]}],"diagram":{"kind":"cycle","title":"A safe working routine","caption":"Play through the routine you should follow every lesson.","items":[{"label":"Open","detail":"Open Riverside Bikes.accdb from your trusted folder — no security bar."},{"label":"Back up","detail":"File › Save As › Back Up Database into the Backups folder (date added automatically)."},{"label":"Build","detail":"Work on tables, queries, forms and code; save design changes with Ctrl+S."},{"label":"Test","detail":"Try the new feature with normal, boundary and wrong data before moving on."},{"label":"Close and compact","detail":"Close all objects; Compact on Close tidies the file as Access exits."}]},"check":[{"q":"You ran a delete query that removed the wrong products. How do you get them back?","o":["Press Ctrl+Z","Run Compact and Repair","Close without saving","Restore the backup you made before running the query"],"a":3,"why":"Action queries cannot be undone; only a backup restores the data."},{"q":"What does Compact and Repair do?","o":["Encrypts the database","Deletes test data","Removes unused space and fixes minor faults in the file","Creates a backup copy"],"a":2,"why":"It rebuilds the file to reclaim space and repair small problems; it does not make a backup."}],"exam":[],"practice":[{"q":"Try it yourself: write a one-line checklist that you will stick inside your notebook for starting and ending each lesson, then carry it out once.","m":2,"a":"Start: open from the trusted Riverside Bikes folder › File › Save As › Back Up Database › save to Backups (dated). Before any action query: back up again. End: right-click a tab › Close All › close Access (Compact on Close runs). Evidence you did it: a new dated file in Backups and a smaller .accdb after closing."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Compact and repair","Backup"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/01 Getting started with Access"},{"id":"c02","n":2,"title":"Tables and relationships","intro":"Build all five Riverside Bikes tables in Design view with the right data types, keys and validation, link them with referential integrity, then enter, import and test data.","pages":[{"id":"c02-p01","spec":"Create a table in Design view: fields, data types, field sizes and a primary key","lessons":["AD04"],"summary":"Build tblCustomer in Design view with the right data type and size for every field and an AutoNumber primary key.","blocks":[{"t":"p","text":"Design view is where you decide exactly what each [[field|Field]] can hold. Choosing the right [[data type]] and [[field size]] now saves you from errors later — for example a phone number stored as a Number loses its leading zero. Every table also needs a [[primary key]] so each [[record|Record]] can be identified."},{"t":"key","title":"You will need / By the end","items":["Riverside Bikes.accdb open from your trusted folder.","By the end you will have **tblCustomer** with six fields and CustomerID as its primary key."]},{"t":"example","title":"Tutorial: Create tblCustomer","steps":["**Create tab › Table Design**. A blank grid opens with columns *Field Name*, *Data Type* and *Description (Optional)*, and the **Field Properties** pane underneath.","Row 1: Field Name **CustomerID**, Data Type **AutoNumber**.","With the CustomerID row selected, click **Table Design tab › Primary Key** (the key icon; on Access 2016/2019 it is on the **Design** tab). A key appears beside the row. You can also right-click the row › **Primary Key**.","Row 2: **FirstName**, Data Type **Short Text**. In Field Properties (General tab) set **Field Size 30** and **Required Yes**.","Row 3: **Surname**, **Short Text**, Field Size **30**, Required **Yes**.","Row 4: **Phone**, **Short Text**, Field Size **15**.","Row 5: **Email**, **Short Text**, Field Size **60**.","Row 6: **Postcode**, **Short Text**, Field Size **8**, Format **>** (shows the postcode in capitals).","Press **Ctrl+S**, type **tblCustomer** and click **OK**. Close the table."]},{"t":"table","head":["Field","Data type","Field size / properties","Why"],"rows":[["CustomerID","AutoNumber","Primary key; Long Integer","Access gives every customer a unique number automatically."],["FirstName","Short Text","30, Required Yes","Names are text; 30 characters is plenty."],["Surname","Short Text","30, Required Yes","Needed for searching and receipts."],["Phone","Short Text","15","Keeps the leading 0 and spaces, e.g. 028 9649 6123. You never do arithmetic on it."],["Email","Short Text","60","Validated on the next page with a validation rule."],["Postcode","Short Text","8, Format >","Northern Ireland postcodes such as BT74 6AB are 7–8 characters including the space."]],"caption":"tblCustomer design"},{"t":"table","head":["Data type","Use it for","Riverside Bikes example"],"rows":[["Short Text","Words and codes up to 255 characters, and 'numbers' you never calculate with","Surname, Phone, ProductID"],["Long Text","Long notes (more than 255 characters)","Delivery instructions"],["Number","Whole numbers or decimals you calculate with; set Field Size (Integer, Long Integer, Double)","StockLevel, Quantity"],["Currency","Money (accurate to 4 decimal places, shown as £)","Price"],["Date/Time","Dates and times","OrderDate"],["AutoNumber","A unique number Access fills in for a primary key","CustomerID, OrderID"],["Yes/No","True/false values","a 'Discontinued' tick box"]],"caption":"Main data types"},{"t":"warn","text":"Do not use Access reserved words as field or table names: **Date**, **Time**, **Name**, **Value**, **Order**, **Year** and **Month** all clash with built-in functions or SQL, giving odd errors such as *#Name?* on forms or *Syntax error in FROM clause*. Use **OrderDate**, **Surname**, **tblOrder** instead."},{"t":"tip","text":"Number field sizes matter: **Integer** holds whole numbers from −32,768 to 32,767 (fine for stock and quantities), **Long Integer** goes to about ±2.1 billion and is the size you must use for any field that links to an AutoNumber."},{"t":"key","title":"Check it works","items":["Open tblCustomer in Datasheet view (double-click it) and type one customer. CustomerID fills in by itself as **(New)** then **1**.","Try to leave Surname empty and move to the next record: Access refuses because Required is Yes.","Type 40 letters into FirstName: Access stops at 30."]}],"diagram":{"kind":"match","title":"Pick the data type","caption":"Match each Riverside Bikes field to the best data type.","pairs":[["CustomerID","AutoNumber"],["Phone","Short Text"],["Price","Currency"],["StockLevel","Number (Integer)"],["OrderDate","Date/Time"],["Customer notes over 255 characters","Long Text"]]},"check":[{"q":"Why is Phone stored as Short Text rather than Number?","o":["Number fields cannot be indexed","Short Text uses less space","A Number field would drop the leading 0 and cannot hold spaces","Phone numbers are too long for any Number field size"],"a":2,"why":"You never calculate with phone numbers, and a Number type removes the leading zero."},{"q":"Which field size must a foreign key have if it links to an AutoNumber primary key?","o":["Integer","Long Integer","Byte","Double"],"a":1,"why":"AutoNumber is a Long Integer, and a relationship needs matching types."},{"q":"Which field name will cause problems?","o":["Date","OrderDate","Surname","StockLevel"],"a":0,"why":"Date is the name of a built-in function — a reserved word."}],"exam":[],"practice":[{"q":"Try it yourself: add a field **DateJoined** to tblCustomer that fills in today's date automatically and a field **Marketing** that records whether the customer agreed to receive emails. Give the data types and properties.","m":3,"a":"Open tblCustomer in Design view. New row: DateJoined, Date/Time, Format Short Date, Default Value =Date(). New row: Marketing, Yes/No, Default Value No (consent must be opted in, not assumed). Ctrl+S. Test in Datasheet view: a new customer shows today's date and an unticked box."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Build tables and set data types","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-build-tables-and-set-data-types"},{"title":"Video: Design and build tables for a database (Access basics, part 1)","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/video-design-and-build-tables-for-a-database-access-basics-part-1"}],"terms":["Field","Record","Data type","Field size","Primary key","AutoNumber"]},{"id":"c02-p02","spec":"Use input masks, validation rules, validation text and default values","lessons":["AD04"],"summary":"Build tblProduct with a P0001-style text key, an input mask, validation rules with friendly messages and default values.","blocks":[{"t":"p","text":"Validation stops obviously wrong data getting into the table, whichever form or query tries to add it. In tblProduct the ProductID must look like **P0001**, prices must be above £0 and stock can never be negative. An [[input mask]] controls *how* data is typed; a [[validation rule]] checks *what* was typed; [[validation text]] is the message the user sees; a [[default value]] is filled in for every new record."},{"t":"anim","scene":"validation","caption":"A validation rule works like this: Access checks the entry and shows your validation text if it fails."},{"t":"key","title":"You will need / By the end","items":["tblCustomer finished.","By the end you will have **tblProduct** that rejects bad IDs, prices and stock levels with clear messages."]},{"t":"example","title":"Tutorial: Create tblProduct with its rules","steps":["**Create › Table Design**.","**ProductID**, Short Text, Field Size **5**. Make it the **Primary Key** (Table Design › Primary Key).","ProductID Input Mask: **>\"P\"0000;0;_** — users type four digits and the P appears for them.","ProductID Validation Rule: **Like \"P####\"**; Validation Text: **Product ID must be P followed by 4 digits, e.g. P0001.**","**Description**, Short Text, Field Size **50**, Required **Yes**.","**Category**, Short Text, Field Size **20**, Required **Yes** (you turn this into a drop-down list on the next page).","**Price**, Currency, Required **Yes**, Validation Rule **>0**, Validation Text **Price must be more than £0.**","**StockLevel**, Number, Field Size **Integer**, Default Value **0**, Validation Rule **>=0**, Validation Text **Stock level cannot be negative.**","**ReorderLevel**, Number, Field Size **Integer**, Default Value **5**, Validation Rule **>=0**, Validation Text **Reorder level cannot be negative.**","**Ctrl+S**, name it **tblProduct**."]},{"t":"code","lang":"excel","code":"Like \"P####\"          ' tblProduct.ProductID: P then exactly 4 digits\n>0                     ' tblProduct.Price\n>=0                    ' tblProduct.StockLevel and ReorderLevel\n>0                     ' tblOrderLine.Quantity (next pages)\nIs Null Or Like \"*?@?*.?*\"   ' tblCustomer.Email: blank, or something@something.something","title":"Validation rules (type only the rule, not the ' comment)"},{"t":"p","text":"Go back to **tblCustomer** in Design view and add the Email rule above with Validation Text **Email must contain @ and a dot, e.g. name@example.com.** Save; Access asks *Data integrity rules have been changed…* — click **Yes** to test the existing data."},{"t":"table","head":["Input mask character","Meaning"],"rows":[["0","A digit is required (0–9)."],["9","A digit is optional."],["L","A letter is required."],["?","A letter is optional."],["A / a","A letter or digit, required / optional."],[">","Convert everything after it to capitals."],["\"P\"","A literal character shown in the mask."],[";0;_","Second part 0 = **store** the literal characters; third part = the placeholder shown while typing."]],"caption":"Input mask codes"},{"t":"warn","text":"If you leave out **;0** the mask is **>\"P\"0000** and Access stores only the four digits (e.g. `0001`) without the P — then your `Like \"P####\"` rule rejects every record and your DLookups for 'P0001' never match. Always add **;0** when a literal is part of the real value."},{"t":"tip","text":"Write the Validation Text as an instruction that tells the user how to fix it. Without it Access shows a technical message quoting your rule, e.g. *One or more values are prohibited by the validation rule '>0' set for 'tblProduct.Price'*."},{"t":"key","title":"Check it works","items":["In Datasheet view try each value in the diagram below and check you get the expected result.","Your own messages (not Access's technical ones) appear for the rejected values."]}],"diagram":{"kind":"table-reveal","title":"Test the tblProduct rules","caption":"Predict the result, then click the hidden cells to check.","head":["Field","Typed","Result"],"rows":[["ProductID","0001","Accepted — stored as P0001"],["ProductID","12","Rejected by the input mask (4 digits required)"],["Price","0","Rejected: 'Price must be more than £0.'"],["Price","24.99","Accepted, shown as £24.99"],["StockLevel","0","Accepted (boundary of >=0)"],["StockLevel","-1","Rejected: 'Stock level cannot be negative.'"],["StockLevel","40000","Rejected: too big for an Integer field"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2]]},"check":[{"q":"Which validation rule makes sure a quantity is at least 1?","o":[">=0","<1","Is Not Null",">0"],"a":3,"why":">0 rejects 0 and negatives; for whole numbers that means at least 1."},{"q":"What does the ;0 at the end of the input mask >\"P\"0000;0;_ do?","o":["Makes the field required","Sets the default to 0","Stores the literal P as part of the value","Allows zero-length strings"],"a":2,"why":"The second part of an input mask controls whether literal characters are stored (0) or not (1 or blank)."},{"q":"Where does the message a user sees when a rule is broken come from?","o":["The Caption property","The Validation Text property","The Description column","The Format property"],"a":1,"why":"Validation Text is shown whenever the Validation Rule is broken."}],"exam":[],"practice":[{"q":"Try it yourself: add a validation rule to **Postcode** in tblCustomer so that only Northern Ireland postcodes such as BT1 1AA or BT74 6AB are accepted. Give the rule, the validation text and three test values.","m":4,"a":"Validation Rule: Like \"BT# #[A-Z][A-Z]\" Or Like \"BT## #[A-Z][A-Z]\" (# = one digit, [A-Z] = one letter; Access's Like ignores case, and Format > shows it in capitals). Validation Text: Enter a Northern Ireland postcode, e.g. BT74 6AB. Tests: BT74 6AB accepted (normal); BT1 1AA accepted (boundary – shortest form); BT746AB rejected (no space); G1 1AA rejected (not NI)."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Build tables and set data types","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-build-tables-and-set-data-types"}],"terms":["Input mask","Validation rule","Validation text","Default value"]},{"id":"c02-p03","spec":"Create value-list lookup fields and the order table with a date default","lessons":["AD04"],"summary":"Turn Category into a drop-down list and build tblOrder with an automatic date and an order Status list.","blocks":[{"t":"p","text":"A [[lookup field|Lookup field]] shows a drop-down list in the table and on any form built from it, so staff choose *Parts* rather than typing *prats*. When the list is short and fixed you type the values in (a *value list*). You then build **tblOrder**, whose OrderDate fills in today's date by itself."},{"t":"key","title":"You will need / By the end","items":["tblProduct with a Category field.","By the end Category and Status are drop-down lists that refuse anything not on the list, and tblOrder exists."]},{"t":"example","title":"Tutorial: Make Category a value-list lookup","steps":["Open **tblProduct** in **Design view**.","Click the Data Type of **Category** and choose **Lookup Wizard…**","Choose **I will type in the values that I want** › **Next**.","Number of columns **1**. Type **Parts**, **Accessories**, **Clothing**, **Tools** in the column (press Tab or the down arrow between them) › **Next**.","Label: **Category**. Tick **Limit To List**. Leave *Allow Multiple Values* **unticked** › **Finish**.","Click the **Lookup** tab in Field Properties and check: Display Control **Combo Box**, Row Source Type **Value List**, Row Source **\"Parts\";\"Accessories\";\"Clothing\";\"Tools\"**, Limit To List **Yes**. Set **Allow Value List Edits** to **No** so users cannot add their own categories.","Back on the General tab check Field Size is still **20**. **Ctrl+S**."]},{"t":"example","title":"Tutorial: Create tblOrder","steps":["**Create › Table Design**.","**OrderID**, AutoNumber, **Primary Key**.","**CustomerID**, Number, Field Size **Long Integer**, Required **Yes**. (This is the [[foreign key]] that links to tblCustomer. Delete the 0 that Access may put in Default Value, so a missing customer is noticed.)","**OrderDate**, Date/Time, Format **Short Date**, Default Value **=Date()**, Required **Yes**.","**Status**, Lookup Wizard › type the values **Open**, **Paid**, **Dispatched** › Limit To List ticked › Finish. Then set Field Size **12** and Default Value **\"Open\"** on the General tab.","**Ctrl+S**, name it **tblOrder**."]},{"t":"table","head":["Field","Type","Key properties"],"rows":[["OrderID","AutoNumber","Primary key"],["CustomerID","Number (Long Integer)","Required; foreign key → tblCustomer"],["OrderDate","Date/Time","Short Date; Default =Date(); Required"],["Status","Short Text 12 (lookup)","Open; Paid; Dispatched; Default \"Open\"; Limit To List"]],"caption":"tblOrder design"},{"t":"code","lang":"excel","code":"=Date()      ' OrderDate: today's date when the record is created\n\"Open\"       ' Status: every new order starts as Open\n0            ' StockLevel\n5            ' ReorderLevel","title":"Default values (type only the value, not the ' comment)"},{"t":"tip","text":"Use **Date()** for a date only. **Now()** stores the time as well, which then makes criteria such as `=#29/10/2026#` miss orders placed after midnight."},{"t":"warn","text":"Do not tick **Allow Multiple Values** — it creates a multi-valued field that is hard to query and cannot be used properly in SQL or VBA."},{"t":"key","title":"Check it works","items":["Open tblProduct in Datasheet view: Category shows a drop-down arrow; typing *Bikes* gives *The text you entered isn't an item in the list*.","Open tblOrder in Datasheet view: a new record shows today's date and Status **Open** before you type anything."]}],"diagram":{"kind":"flow","title":"The Lookup Wizard for a value list","caption":"Step through the wizard screens.","direction":"lr","nodes":[{"id":"a","label":"Data Type › Lookup Wizard","detail":"In Design view open the Data Type list for the field.","shape":"start"},{"id":"b","label":"Type the values","detail":"Choose 'I will type in the values that I want'.","shape":"decision"},{"id":"c","label":"1 column, enter list","detail":"Parts, Accessories, Clothing, Tools.","shape":"io"},{"id":"d","label":"Limit To List","detail":"Tick it so only list items are accepted; do not allow multiple values.","shape":"process"},{"id":"e","label":"Check Lookup tab","detail":"Combo Box, Value List, Row Source, Allow Value List Edits = No.","shape":"process"},{"id":"f","label":"Save","detail":"Ctrl+S, then test in Datasheet view.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[{"q":"Which Default Value puts today's date into OrderDate?","o":["=Date()","=Today()","=Now","Date"],"a":0,"why":"=Date() returns today's date with no time part."},{"q":"Which lookup property stops users entering a category that is not in the list?","o":["Bound Column","Column Widths","Row Source Type","Limit To List"],"a":3,"why":"Limit To List = Yes rejects any value not in the list."},{"q":"CustomerID in tblOrder must be which data type?","o":["AutoNumber","Short Text","Number (Long Integer)","Number (Integer)"],"a":2,"why":"A foreign key must match the primary key's AutoNumber, which is a Long Integer."}],"exam":[],"practice":[{"q":"Try it yourself: add a field **PaymentMethod** to tblOrder that only allows Cash, Card or Bank transfer and defaults to Card.","m":3,"a":"tblOrder Design view › new row PaymentMethod › Data Type Lookup Wizard › I will type in the values › 1 column: Cash, Card, Bank transfer › Next › label PaymentMethod › tick Limit To List › Finish. General tab: Field Size 15, Default Value \"Card\". Lookup tab: Allow Value List Edits No. Ctrl+S. Test: a new order shows Card; typing Cheque is rejected."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Build tables and set data types","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-build-tables-and-set-data-types"}],"terms":["Lookup field","Foreign key","Default value"]},{"id":"c02-p04","spec":"Create table lookups and indexes: the order line and staff tables","lessons":["AD04"],"summary":"Build tblOrderLine with a product lookup from tblProduct and tblStaff with a no-duplicates username index.","blocks":[{"t":"p","text":"**tblOrderLine** holds one row for each product on an order, so an order can have many lines. Its ProductID can look up its list from **tblProduct** (a *table lookup*), so staff see product names. **tblStaff** stores logins, and its Username must be unique — you enforce that with an [[index|Index]] set to *No Duplicates*."},{"t":"key","title":"You will need / By the end","items":["tblProduct and tblOrder finished.","By the end all five Riverside Bikes tables exist."]},{"t":"example","title":"Tutorial: Create tblOrderLine","steps":["**Create › Table Design**.","**OrderLineID**, AutoNumber, **Primary Key**.","**OrderID**, Number, Field Size **Long Integer**, Required **Yes**, Indexed **Yes (Duplicates OK)**.","**ProductID**, Short Text, Field Size **5**, Required **Yes**, Indexed **Yes (Duplicates OK)**.","**Quantity**, Number, Field Size **Integer**, Default Value **1**, Validation Rule **>0**, Validation Text **Quantity must be at least 1.**","**Ctrl+S**, name it **tblOrderLine**."]},{"t":"example","title":"Tutorial: Make ProductID a table lookup (optional but useful)","steps":["In tblOrderLine Design view, click ProductID's Data Type › **Lookup Wizard…**","Choose **I want the lookup field to get the values from another table or query** › Next.","Choose **Table: tblProduct** › Next. Move **ProductID** and **Description** to *Selected Fields* › Next.","Sort by **Description** › Next. **Untick Hide key column** so staff can see the code as well as the name › Next.","Choose **ProductID** as the value to store › Next. Label **ProductID**. Leave *Enable Data Integrity* unticked (you set it in the Relationships window next) › **Finish** › **Yes** to save.","Check Field Size is still **5**."],"answer":"In Datasheet view ProductID is now a drop-down showing code and description, but the table still stores only the code, e.g. P0003."},{"t":"example","title":"Tutorial: Create tblStaff with a unique username","steps":["**Create › Table Design**.","**StaffID**, AutoNumber, **Primary Key**.","**Username**, Short Text **20**, Required **Yes**, Indexed **Yes (No Duplicates)**.","**Password**, Short Text **20**, Required **Yes**, Input Mask **Password** (shows asterisks).","**AccessLevel**, Lookup Wizard › type **Admin**, **Staff** › Limit To List › Finish; Field Size **10**, Default Value **\"Staff\"**.","**Ctrl+S**, name it **tblStaff**.","Click **Table Design › Indexes** to see every index: *PrimaryKey* on StaffID and *Username* with Unique = Yes."]},{"t":"table","head":["Indexed setting","Use it when","Example"],"rows":[["No","The field is rarely searched or sorted","Phone"],["Yes (Duplicates OK)","The field is often searched, sorted or joined on, and values repeat","tblOrderLine.OrderID, tblCustomer.Surname"],["Yes (No Duplicates)","Every value must be unique but it is not the primary key","tblStaff.Username"]],"caption":"Indexes"},{"t":"warn","text":"A table lookup shows the description but **stores the key**. In a query, criteria on tblOrderLine.ProductID must be the code (`\"P0003\"`), not the description (`\"LED front light\"`), or you get no results or *Data type mismatch in criteria expression*."},{"t":"note","text":"Table lookups are a convenience, not a requirement. The Lookup Wizard also creates a relationship line between the tables, which you will edit on the next page. Forms in Chapter 4 use their own combo boxes either way."},{"t":"key","title":"Check it works","items":["Open tblStaff in Datasheet view and add **admin** twice: the second save gives *The changes you requested to the table were not successful because they would create duplicate values in the index, primary key, or relationship.*","In tblOrderLine, Quantity 0 shows your message *Quantity must be at least 1.*"]}],"diagram":{"kind":"compare","title":"Value-list lookup or table lookup?","caption":"Toggle between the two kinds of lookup.","states":[{"label":"Value list","points":["You type the items into the Lookup Wizard","Row Source Type: Value List","Best for short fixed lists: Category, Status, AccessLevel","Changing the list means editing the table design","Set Allow Value List Edits = No"],"art":null},{"label":"Table lookup","points":["Items come from another table (tblProduct, tblCustomer)","Row Source Type: Table/Query, Row Source is a SELECT statement","New products appear in the list automatically","Shows a description but stores the key","The wizard also creates a relationship line"],"art":null}]},"check":[{"q":"Which Indexed setting should tblStaff.Username have?","o":["No","Yes (No Duplicates)","Yes (Duplicates OK)","It must be the primary key"],"a":1,"why":"Usernames must be unique, but StaffID is already the primary key, so use a unique index."},{"q":"ProductID in tblOrderLine is a table lookup showing descriptions. What value is stored?","o":["The product code, e.g. P0003","The description","The row number in the list","Both, separated by a semicolon"],"a":0,"why":"A lookup stores the bound column — the key — and only displays the description."}],"exam":[],"practice":[{"q":"Try it yourself: make **CustomerID** in tblOrder a table lookup that shows the customer's surname and first name (sorted by surname) but stores the CustomerID.","m":4,"a":"Open tblOrder in Design view › CustomerID Data Type › Lookup Wizard › get values from another table › Table: tblCustomer › fields CustomerID, Surname, FirstName › sort Surname then FirstName › leave Hide key column (recommended) ticked › label CustomerID › Finish › Yes to save. Check: Field Size still Long Integer; Lookup tab shows Bound Column 1, Column Count 3, Column Widths 0cm;… (the 0 hides the ID). Datasheet view shows surnames; the table stores the number."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create relationships with the Lookup Wizard","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-relationships-with-the-lookup-wizard"}],"terms":["Index","Lookup field","Foreign key"]},{"id":"c02-p05","spec":"Create relationships and enforce referential integrity with the right cascade options","lessons":["AD04"],"summary":"Link the four Riverside Bikes tables in the Relationships window and enforce referential integrity.","blocks":[{"t":"p","text":"A [[relationship|Relationship]] tells Access that a [[foreign key]] in one table matches a [[primary key]] in another. With [[referential integrity]] enforced, Access will not let you create an order for a customer who does not exist, or delete a product that appears on an order. You choose cascade options only where they are safe."},{"t":"anim","scene":"key-join","caption":"Referential integrity in action: Access rejects an order for a customer who doesn’t exist."},{"t":"key","title":"You will need / By the end","items":["All five tables saved and **closed** (Access cannot change relationships on an open table).","By the end the Relationships window shows three one-to-many lines with 1 and ∞ symbols."]},{"t":"example","title":"Tutorial: Open the Relationships window and add the tables","steps":["Right-click any object tab › **Close All**.","**Database Tools › Relationships**.","If the tables are not shown: **Relationship Design tab › Add Tables** (Access 2016/2019: **Design › Show Table**). Double-click **tblCustomer**, **tblOrder**, **tblOrderLine** and **tblProduct**, then close the pane. tblStaff is not linked to anything, so it can be left out.","Drag the boxes into a line: tblCustomer, tblOrder, tblOrderLine, tblProduct. Stretch each box so you can see all fields."]},{"t":"example","title":"Tutorial: Create the three relationships","steps":["Drag **CustomerID** from tblCustomer onto **CustomerID** in tblOrder. In *Edit Relationships* tick **Enforce Referential Integrity**; leave both cascade boxes unticked › **Create**.","Drag **OrderID** from tblOrder onto **OrderID** in tblOrderLine. Tick **Enforce Referential Integrity** and **Cascade Delete Related Records** › **Create**.","Drag **ProductID** from tblProduct onto **ProductID** in tblOrderLine. If the Lookup Wizard already drew this line, double-click the line instead. Tick **Enforce Referential Integrity** and **Cascade Update Related Fields** › **Create** (or **OK**).","Check each line shows **1** at the primary-key end and **∞** at the foreign-key end, then **Ctrl+S** and **Relationship Design › Close**."]},{"t":"table","head":["Relationship","Enforce RI","Cascade Update","Cascade Delete","Reason"],"rows":[["tblCustomer 1–∞ tblOrder","Yes","No","No","CustomerID is an AutoNumber (never changes). Deleting a customer must not wipe out their sales history."],["tblOrder 1–∞ tblOrderLine","Yes","No","Yes","Order lines mean nothing without their order, so deleting an order removes its lines."],["tblProduct 1–∞ tblOrderLine","Yes","Yes","No","If a product code is ever changed (P0004 → P0040) the order lines follow it; a product that has been sold must not be deleted."]],"caption":"Which options to tick"},{"t":"table","head":["Message","Cause","Fix"],"rows":[["*Relationship must be on the same number of fields with the same data types.*","Foreign key type does not match, e.g. CustomerID is Integer or Short Text.","Make the foreign key Number, Long Integer (or Short Text 5 for ProductID)."],["*Data in the table 'tblOrder' violates referential integrity rules.*","Existing test data has an order for a customer that does not exist.","Fix or delete the bad rows, then try again."],["*The database engine could not lock table … because it is already in use…*","A table or form is open.","Close All, then edit the relationship."]],"caption":"Common errors"},{"t":"warn","text":"Do not tick Cascade Delete on every relationship 'to be safe' — it is the opposite of safe. On tblCustomer → tblOrder it would mean deleting one customer silently deletes all their orders and order lines."},{"t":"key","title":"Check it works","items":["In tblOrderLine try to add a line for ProductID **P0099** (which does not exist): *You cannot add or change a record because a related record is required in table 'tblProduct'.*","Try to delete a customer who has an order: *The record cannot be deleted or changed because table 'tblOrder' includes related records.*"]}],"diagram":{"kind":"hotspot","title":"Riverside Bikes relationships","caption":"Click a table to see its keys and role; lines show the one-to-many links.","rows":[[{"label":"tblCustomer","detail":"PK CustomerID (AutoNumber). One customer → many orders.","span":1},{"label":"tblOrder","detail":"PK OrderID; FK CustomerID (Long Integer). One order → many order lines.","span":1},{"label":"tblOrderLine","detail":"PK OrderLineID; FK OrderID (Long Integer) and FK ProductID (Short Text 5). The 'many' end of two relationships.","span":1},{"label":"tblProduct","detail":"PK ProductID (Short Text 5). One product → appears on many order lines.","span":1}],[{"label":"tblStaff","detail":"Stands alone: used only by the login form (Chapter 7). Username has a no-duplicates index.","span":4}]],"links":[["tblCustomer","tblOrder"],["tblOrder","tblOrderLine"],["tblProduct","tblOrderLine"]]},"check":[{"q":"Which relationship should have Cascade Delete Related Records ticked?","o":["tblCustomer–tblOrder","tblProduct–tblOrderLine","All three","tblOrder–tblOrderLine"],"a":3,"why":"Order lines belong to their order; nothing else should cascade deletes."},{"q":"With referential integrity enforced, what happens if you add an order for CustomerID 99 when no such customer exists?","o":["Access creates customer 99","The order is saved with a blank customer","Access refuses: a related record is required in tblCustomer","Nothing until you compact"],"a":2,"why":"Referential integrity prevents orphan foreign keys."},{"q":"Why can't you create a relationship between tblCustomer.CustomerID and tblOrder.CustomerID if the second is Short Text?","o":["Short Text can't be indexed","The data types must match","AutoNumber can't be related","Short Text needs cascade update"],"a":1,"why":"Related fields must have the same data type (AutoNumber ↔ Number Long Integer)."}],"exam":[],"practice":[{"q":"Try it yourself: the shop wants a **tblSupplier** table (SupplierID AutoNumber, SupplierName, Phone) where each product comes from one supplier. Add it and relate it correctly.","m":5,"a":"1. Create › Table Design: SupplierID AutoNumber PK; SupplierName Short Text 50 Required; Phone Short Text 15 › save tblSupplier. 2. tblProduct Design view: add SupplierID, Number, Long Integer (optionally a table lookup to tblSupplier) › save › close all. 3. Database Tools › Relationships › Add Tables › tblSupplier › drag SupplierID from tblSupplier to tblProduct.SupplierID › tick Enforce Referential Integrity, no cascades (deleting a supplier must not delete products) › Create › Ctrl+S. 4. Test: a product with SupplierID 99 is rejected."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create relationships with the Relationships pane","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-US/Access/training/video-create-relationships-with-the-relationships-pane"},{"title":"Video: Create table relationships (Access basics, part 2)","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-au/office/video-create-table-relationships-access-basics-part-2-a93d9491-8724-4cd3-96df-ce504914692f"}],"terms":["Relationship","Referential integrity","Cascade update","Cascade delete","Primary key","Foreign key"]},{"id":"c02-p06","spec":"Enter test data in Datasheet view in the right order","lessons":["AD04"],"summary":"Type a realistic set of Riverside Bikes customers, products, orders and order lines that later tutorials use.","blocks":[{"t":"p","text":"Queries, forms and code can only be tested with data. Because of referential integrity you must enter the 'one' side before the 'many' side: customers and products first, then orders, then order lines. The data below is used in the examples throughout this workbook, so enter it exactly."},{"t":"key","title":"You will need / By the end","items":["All tables and relationships finished.","By the end each table has the sample records below."]},{"t":"example","title":"Tutorial: Type the data","steps":["Double-click **tblCustomer** to open it in Datasheet view. Skip CustomerID (it fills itself) and type each customer, pressing **Tab** to move between fields.","Open **tblProduct** and type the eight products. For ProductID type only the digits (e.g. **0001**) — the mask adds the P.","Open **tblOrder**: choose/type the CustomerID, overtype the OrderDate and choose the Status.","Open **tblOrderLine** and type the order lines.","Open **tblStaff** and add two users: **admin** / **Bikes#2026** / **Admin** and **shop1** / **Pedal#77** / **Staff**."]},{"t":"table","head":["CustomerID","FirstName","Surname","Phone","Email","Postcode"],"rows":[["1","Aoife","Maguire","028 9649 6101","aoife.maguire@example.com","BT74 6AB"],["2","Ciaran","McCaffrey","07700 900123","c.mccaffrey@example.com","BT92 1FB"],["3","Hannah","Irvine","028 9649 6188","hannah.irvine@example.com","BT74 7DQ"],["4","Jack","Graham","07700 900456","jack.g@example.com","BT93 3EZ"],["5","Niamh","Corrigan","07700 900789","niamh.corrigan@example.com","BT94 1HT"]],"caption":"tblCustomer"},{"t":"table","head":["ProductID","Description","Category","Price","StockLevel","ReorderLevel"],"rows":[["P0001","Inner tube 700x25c","Parts","£5.99","40","10"],["P0002","Brake pads (pair)","Parts","£8.50","4","6"],["P0003","LED front light","Accessories","£24.99","12","5"],["P0004","D-lock","Accessories","£34.00","3","5"],["P0005","Waterproof jacket","Clothing","£59.99","7","4"],["P0006","Cycling gloves","Clothing","£14.50","20","8"],["P0007","Multi-tool 15-in-1","Tools","£19.99","5","5"],["P0008","Track pump","Tools","£29.95","9","3"]],"caption":"tblProduct"},{"t":"table","head":["OrderID","CustomerID","OrderDate","Status","Order lines (ProductID × Quantity)"],"rows":[["1","1","01/10/2026","Paid","P0001 × 2, P0003 × 1"],["2","3","03/10/2026","Dispatched","P0005 × 1, P0006 × 2"],["3","2","15/10/2026","Open","P0008 × 1, P0002 × 2"],["4","1","22/10/2026","Open","P0004 × 1, P0001 × 3"]],"caption":"tblOrder and tblOrderLine (enter each line as its own row in tblOrderLine: OrderLineIDs 1–8)"},{"t":"table","head":["Keys","Does"],"rows":[["Tab / Shift+Tab","Next / previous field"],["Esc (twice)","Cancel the changes to the current record"],["Shift+Enter","Save the current record now"],["Ctrl+'","Copy the value from the same field in the record above"],["Ctrl+;","Insert today's date"]],"caption":"Datasheet shortcuts"},{"t":"tip","text":"A pencil icon on the record selector means the record has unsaved changes. Access saves it when you move to another record or press Shift+Enter."},{"t":"warn","text":"If you start a record and cancel it, the AutoNumber is used up and you get a gap (e.g. customers 1, 2, 4). That is normal — AutoNumbers only need to be unique. Do not delete and re-type records to 'fix' it; just use the real CustomerID values when you enter orders."},{"t":"key","title":"Check it works","items":["tblProduct shows 8 records, tblOrder 4 and tblOrderLine 8.","Click the **+** at the left of a customer in tblCustomer: a *subdatasheet* shows that customer's orders — proof that the relationship works."]}],"diagram":{"kind":"flow","title":"Order of data entry","caption":"Parent ('one') tables first, then the tables that refer to them.","direction":"lr","nodes":[{"id":"c","label":"tblCustomer","detail":"No foreign keys — enter first.","shape":"store"},{"id":"p","label":"tblProduct","detail":"No foreign keys — enter first.","shape":"store"},{"id":"o","label":"tblOrder","detail":"Needs an existing CustomerID.","shape":"store"},{"id":"l","label":"tblOrderLine","detail":"Needs an existing OrderID and ProductID.","shape":"store"},{"id":"s","label":"tblStaff","detail":"Not related — enter any time.","shape":"store"}],"edges":[["c","o"],["o","l"],["p","l"]]},"check":[{"q":"Why must tblOrder be filled in before tblOrderLine?","o":["Each order line needs an existing OrderID because of referential integrity","Access sorts tables alphabetically","tblOrderLine has no primary key","AutoNumbers must be in order"],"a":0,"why":"Referential integrity rejects order lines whose OrderID does not exist."},{"q":"Which shortcut saves the current record without moving off it?","o":["Ctrl+S","Ctrl+;","Esc","Shift+Enter"],"a":3,"why":"Shift+Enter saves the record; Ctrl+S saves design changes."}],"exam":[],"practice":[{"q":"Try it yourself: add a fifth order for Jack Graham dated today with two lines (P0007 × 1 and P0006 × 1) and work out its subtotal and total with 20% VAT by hand, so you can check your queries in Chapter 3.","m":3,"a":"tblOrder: CustomerID 4, OrderDate today (default), Status Open → OrderID 5 (if no gaps). tblOrderLine: OrderID 5, P0007, 1; OrderID 5, P0006, 1. Subtotal = 19.99 + 14.50 = £34.49; VAT = 34.49 × 0.2 = £6.898 → £6.90; Total = £41.39. (Delete this order again afte
