["Tables cannot be edited","Form event code only runs when the form is used","It is faster","Tables have no validation"],"a":1,"why":"The Before Update and After Update procedures belong to the subform; editing the table directly bypasses them."}],"exam":[],"practice":[{"q":"Write five tests (value, type of data, expected result) for the ProductID generator and frmProduct validation, then carry them out.","m":3,"a":"Example plan: 1 New product after P0011 (normal) → P0012 filled in when the description is typed. 2 Save without a description (erroneous) → *Enter a description*, not saved. 3 Price 5000 (boundary) → accepted. 4 Price 5000.01 (boundary) → refused. 5 StockLevel -1 (erroneous) → *Stock level must be from 0 to 9999*. Carry out each in Form view; any failure: breakpoint in Form_BeforeInsert / Form_BeforeUpdate, F8 through, fix, re-run all five."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Normal data","Boundary data","Erroneous data","Breakpoint"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/07 VBA task tutorials"}],"glossary":[{"term":"Action query","def":"A query that changes data when it runs (update, append, delete or make-table); its changes cannot be undone.","alt":"","page":"c03-p07"},{"term":"Append query","def":"An action query that adds records selected from one table or query to the end of another table.","alt":"","page":"c03-p08"},{"term":"AutoExec","def":"A macro named AutoExec that Access runs automatically each time the database opens (unless Shift is held).","alt":"","page":"c04-p09"},{"term":"AutoNumber","def":"A data type for which Access generates a unique Long Integer for each new record, often used as the primary key.","alt":"","page":"c02-p01"},{"term":"Backup","def":"A separate, dated copy of the database kept so that work can be restored if the file is damaged or data is wrongly changed.","alt":"","page":"c01-p05"},{"term":"Bound column","def":"The column of a combo or list box whose value is stored or returned, often a hidden ID column.","alt":"","page":"c04-p03"},{"term":"Bound control","def":"A control whose Control Source is a field in the form's record source, so it displays and saves that field's value.","alt":"","page":"c04-p02"},{"term":"Boundary data","def":"Test data on the edge of an allowed range and just outside it (e.g. 1, 500 and 0, 501 for a 1–500 rule), used to check that comparisons are exactly right.","alt":"Extreme data","page":"c07-p11"},{"term":"Breakpoint","def":"A marked line (F9) at which running code pauses so the programmer can inspect values and step through the following lines.","alt":"","page":"c06-p10"},{"term":"Calculated control","def":"A control whose Control Source is an expression starting with =, such as =[Quantity]*[Price], calculated on screen and not stored.","alt":"","page":"c04-p05"},{"term":"Calculated field","def":"A query column whose value is worked out from other fields each time the query runs, such as LineTotal: [Quantity]*[Price].","alt":"","page":"c03-p05"},{"term":"Cascade delete","def":"A referential integrity option that automatically deletes related 'many' records when the 'one' record is deleted.","alt":"Cascade Delete Related Records","page":"c02-p05"},{"term":"Cascade update","def":"A referential integrity option that automatically changes matching foreign keys when a primary key value is changed.","alt":"Cascade Update Related Fields","page":"c02-p05"},{"term":"Combo box","def":"A drop-down control that lets the user pick a value from a list taken from a table, query or value list, optionally allowing typing.","alt":"","page":"c04-p03"},{"term":"Command button","def":"A control the user clicks to carry out an action, run by a macro or a VBA event procedure.","alt":"","page":"c04-p07"},{"term":"Compact and repair","def":"An Access tool that rebuilds the database file to remove unused space left by deleted data and designs and to fix minor corruption.","alt":"","page":"c01-p05"},{"term":"Compile error","def":"An error found before code runs because a statement breaks VBA's rules, such as an undeclared variable or an If without End If.","alt":"Syntax error","page":"c06-p10"},{"term":"Conditional formatting","def":"Formatting (colour, bold) that Access applies to a control only when a stated condition is true.","alt":"","page":"c04-p06"},{"term":"Constant","def":"A named value that cannot change while the program runs, declared with Const, e.g. Const VAT_RATE As Currency = 0.2.","alt":"","page":"c06-p04"},{"term":"Control","def":"Any object placed on a form or report, such as a label, text box, combo box or command button.","alt":"","page":"c04-p02"},{"term":"Criteria","def":"Conditions in a query that a record must satisfy to be included, such as >20 or Like \"*light*\".","alt":"","page":"c03-p01"},{"term":"Data type","def":"The kind of data a field can hold (Short Text, Number, Currency, Date/Time, AutoNumber, Yes/No…), which controls what can be entered and what operations work on it.","alt":"","page":"c02-p01"},{"term":"Datasheet view","def":"A view that shows records in rows and fields in columns, like a spreadsheet, for entering data or viewing query results.","alt":"","page":"c01-p03"},{"term":"DCount","def":"A domain aggregate function that returns how many records in a table or query match the criteria (0 if none).","alt":"","page":"c06-p08"},{"term":"Default value","def":"A value automatically placed in a field when a new record is created, such as =Date() or \"Open\".","alt":"","page":"c02-p02"},{"term":"Delete query","def":"An action query that permanently removes all records meeting its criteria from a table.","alt":"","page":"c03-p08"},{"term":"Design view","def":"The view used to build an object: setting fields and properties in a table, the grid of a query, or the exact layout and events of a form or report.","alt":"","page":"c01-p03"},{"term":"DLookup","def":"A domain aggregate function that returns the value of a field from the first record in a table or query that matches the criteria, or Null if none does.","alt":"","page":"c06-p08"},{"term":"DMax","def":"A domain aggregate function that returns the largest value of a field in a table or query (optionally matching criteria), e.g. the highest existing ProductID.","alt":"","page":"c07-p08"},{"term":"DoCmd","def":"The VBA object whose methods carry out Access actions, such as DoCmd.OpenForm, DoCmd.Close and DoCmd.OpenReport.","alt":"","page":"c04-p07"},{"term":"Domain aggregate function","def":"An Access function (DLookup, DCount, DSum, DMax, DMin, DAvg) that calculates a value from a set of records, the domain, defined by a table or query name and optional criteria.","alt":"","page":"c06-p08"},{"term":"DSum","def":"A domain aggregate function that returns the total of a field over the records in a table or query that match the criteria, or Null if none match.","alt":"","page":"c06-p08"},{"term":"Erroneous data","def":"Test data that is of the wrong type or otherwise invalid (e.g. text in a number field), which the system should reject with a helpful message.","alt":"Invalid data","page":"c07-p11"},{"term":"Error handling","def":"Code (On Error GoTo label … Err.Number, Err.Description … Resume) that catches run-time errors, shows a helpful message and exits tidily instead of crashing.","alt":"Error trapping","page":"c06-p11"},{"term":"Event","def":"Something that happens to a form, report or control, such as a click, opening, or updating a value, to which code can respond.","alt":"","page":"c04-p07"},{"term":"Event procedure","def":"A VBA Sub in a form's or report's module that runs automatically when a particular event occurs, e.g. cmdSave_Click.","alt":"","page":"c04-p07"},{"term":"Field","def":"A single item of data stored about each record, shown as a column in a table, such as Surname or Price.","alt":"","page":"c02-p01"},{"term":"Field size","def":"The maximum length of a Short Text field, or the range and precision of a Number field (Integer, Long Integer, Double…).","alt":"","page":"c02-p01"},{"term":"Filter","def":"A condition applied to a form or report (Me.Filter, switched on with Me.FilterOn = True) so that only matching records are shown, without changing the record source.","alt":"","page":"c07-p06"},{"term":"Foreign key","def":"A field in one table that holds the primary key value of a related record in another table, such as CustomerID in tblOrder.","alt":"","page":"c02-p03"},{"term":"Form","def":"An Access object that provides an on-screen window for entering, viewing and editing data, usually with controls and buttons.","alt":"","page":"c01-p03"},{"term":"Function","def":"A named block of VBA code (Function … End Function) that returns a value by assigning it to its own name; Public functions in a standard module can be used in queries and controls.","alt":"","page":"c06-p09"},{"term":"Group footer","def":"The report section printed after each group; aggregate expressions such as =Sum([LineTotal]) placed here total only that group's records.","alt":"","page":"c05-p02"},{"term":"Grouping","def":"Organising a report's records into groups that share a value, such as Category or OrderID, each with an optional header and footer for the group name and group totals.","alt":"Group by","page":"c05-p02"},{"term":"Immediate window","def":"A pane of the Visual Basic Editor (Ctrl+G) where expressions can be evaluated with ? and output from Debug.Print appears.","alt":"Debug window","page":"c06-p10"},{"term":"Import","def":"Bringing data from an outside file such as an Excel workbook or CSV file into an Access table, either appended to an existing table or as a new table.","alt":"","page":"c02-p07"},{"term" /* teacher's topic PowerPoint: any .pptx/.ppt/.pdf in the chapter's folder under slides/ (ch.slidesFolder, from slides/folders.json).

const GH_SLIDES = 'https://api.github.com/repos/popcorn483/ergsDigitalTechnology/contents/notes/slides/';

document.addEventListener('keydown', e => {
  const t = e.target, typing = t.closest && t.closest('input, textarea, select, [contenteditable], [role=tablist]');
  if (e.key === 'Escape') {
    if (!pop.hidden) { closePop(true); return; }
    if (anyDrawer()) { closeDrawers(true); return; }
    if (isNarrow() && document.body.classList.contains('rail-open')) { setRailOpen(false); $('#b-menu').focus(); return; }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey || typing) return;
  if (e.key === '/') { e.preventDefault(); openDrawer('search'); return; }
  if (anyDrawer()) return;
  if (onCover) { if (e.key === 'ArrowRight') { e.preventDefault(); go(0); } return; }
  if (e.key === 'ArrowLeft' && cur > 0) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'ArrowLeft' && cur === 0) { e.preventDefault(); goCover(); }
  else if (e.key === 'ArrowRight' && cur < PAGES.length - 1) { e.preventDefault(); go(cur + 1); }
});

    sv('rect', { x: 10, y: 68, width: 8, height: 14, class: 'art-term' }, s); sv('rect', { x: 222, y: 68, width: 8, height: 14, class: 'art-term' }, s);

    sv('rect', { x: 96, y: 62, width: 48, height: 26, rx: 5, class: 'art-hub' }, s); sv('text', { x: 120, y: 75.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'art-t', text: 'Switch' }, s);
    pts.forEach(([x, y], i) => node(x, y, 'PC' + (i + 1)));
  } else if (kind === 'ring') {

    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; node(120 + 82 * Math.cos(a), 75 + 52 * Math.sin(a), 'PC' + (i + 1)); }

  return s;
}

/* ---- 6 bits ---- */
DIAG.bits = (d, st, cx) => {
  const n = clamp(d.n || 8, 1, 32), modes = (d.modes && d.modes.length) ? d.modes : ['unsigned'];
  const fp = modes.includes('fixed') ? clamp(d.fixedPoint || 0, 0, n) : 0;
  let b = String(d.start || '').replace(/[^01]/g, '').slice(-n).padStart(n, '0').split('').map(Number);
  let view = modes.find(m => m === 'unsigned' || m === 'twos' || m === 'fixed') || 'unsigned';
  const nibbles = n >= 8 || modes.includes('hex') || modes.includes('bcd');
  const row = el('div', { class: 'bits', role: 'group', 'aria-label': `${n} bits` });
  const reads = el('div', { class: 'reads' });
  const ctl = el('div', { class: 'btns' });
  st.append(row, reads, ctl);
  const P = k => n - 1 - k;
  const weight = (k, v) => v === 'twos' && k === 0 ? -Math.pow(2, n - 1) : v === 'fixed' ? Math.pow(2, P(k) - fp) : Math.pow(2, P(k));
  const fr = { 0.5: '½', 0.25: '¼', 0.125: '⅛' };
  const wl = w => w >= 1 || w <= -1 ? fmt(w, 0).replace('-', '−') : fr[w] || ('1/' + Math.round(1 / w));
  const cells = [];
  for (let k = 0; k < n; k++) {
    if (fp > 0 && k === n - fp) row.append(el('span', { class: 'bpt', 'aria-hidden': 'true' }, '.'));
    const btn = el('button', { type: 'button', 'aria-pressed': 'false' });
    btn.addEventListener('click', () => { b[k] ^= 1; upd(`Bit ${k + 1} set to ${b[k]}`); });
    const small = el('small');
    cells.push({ btn, small });
    row.append(el('div', { class: 'bit' + (nibbles && k > 0 && (n - k) % 4 === 0 && !(fp > 0 && k === n - fp) ? ' nib' : '') }, small, btn));
  }
  const mk = (t, f) => el('button', { type: 'button', class: 'btn', onclick: f }, t);
  ctl.append(mk('Clear', () => { b.fill(0); upd('All bits cleared'); }), mk('+1', () => { for (let k = n - 1; k >= 0; k--) { if (b[k]) b[k] = 0; else { b[k] = 1; break; } } upd('Added 1'); }),
    mk('Invert', () => { b = b.map(x => x ^ 1); upd('Every bit flipped (the first step of two’s complement)'); }),
    mk('Shift left', () => { const lost = b[0]; b = b.slice(1).concat(0); upd(lost ? 'Shifted left: a 1 fell off the end, so the result overflowed' : 'Shifted left one place: unsigned value doubled'); }),
    mk('Shift right', () => { const lost = b[n - 1]; b = [0].concat(b.slice(0, -1)); upd(lost ? 'Shifted right: a 1 fell off, so the result was rounded down' : 'Shifted right one place: unsigned value halved'); }));

    const u = b.reduce((a, x, k) => a + x * Math.pow(2, P(k)), 0);

  }
  function working(v) { const ws = []; b.forEach((x, k) => { if (x) ws.push(weight(k, v)); }); return ws.length ? ws.map((w, i) => (i && w >= 0 ? '+ ' : i ? '' : '') + (w < 0 ? (i ? '− ' : '−') + wl(-w) : wl(w))).join(' ') : '0'; }
  function upd(msg) {
    cells.forEach((c, k) => { c.btn.textContent = b[k]; c.btn.setAttribute('aria-pressed', String(!!b[k])); c.small.textContent = wl(weight(k, view)); c.btn.setAttribute('aria-label', `Bit worth ${wl(weight(k, view))}, currently ${b[k]}`); });
    const { u, s } = vals(), h = [];
    const card = (m, label, value, sub) => `<${['unsigned', 'twos', 'fixed'].includes(m) ? `button type="button" data-v="${m}" aria-pressed="${view === m}"` : 'div'} class="rd${view === m ? ' cur' : ''}" style="text-align:left;font:inherit;color:inherit;background:${view === m ? 'var(--accent-soft)' : 'var(--paper)'}"><small>${label}</small><b>${esc(value)}</b><div>${esc(sub)}</div></${['unsigned', 'twos', 'fixed'].includes(m) ? 'button' : 'div'}>`;
    const bin = b.join('');
    for (const m of modes) {
      if (m === 'unsigned') h.push(card(m, 'Unsigned denary', fmt(u, 0), working('unsigned')));

    }
    reads.innerHTML = h.join('');
    reads.querySelectorAll('[data-v]').forEach(x => x.addEventListener('click', () => { view = x.dataset.v; upd(`Place values now shown for ${x.querySelector('small').textContent}`); const nx = reads.querySelector(`[data-v="${view}"]`); nx && nx.focus(); }));
    cx.detail(msg || 'Select a bit to flip it', `Binary ${bin}${modes.includes('unsigned') || !modes.includes('twos') ? ' = ' + fmt(u, 0) + ' unsigned' : ''}${modes.includes('twos') ? ', ' + fmt(s, 0).replace('-', '−') + ' in two’s complement' : ''}. Select a reading card to change the place values shown above the bits.`);
  }

};

    const clip = (n, p, toward) => { const dx = toward.x - p.x, dy = toward.y - p.y; const sx = n.w / 2 / Math.abs(dx || 1e-9), sy = n.h / 2 / Math.abs(dy || 1e-9), s = Math.min(sx, sy, 1); return { x: p.x + dx * s, y: p.y + dy * s }; };

    E.forEach((e, k) => {

      const c = chains.get(k) || { dir: true, ch: [] };
      let pts = [pos.get(f.a), ...(c.dir ? c.ch : c.ch.slice().reverse()).map(x => pos.get(x)), pos.get(f.b)].map(p => ({ x: p.x, y: p.y }));
      // parallel offset, measured in the canonical direction so opposite flows separate

      const dx0 = can[1].x - can[0].x, dy0 = can[1].y - can[0].y, l0 = Math.hypot(dx0, dy0) || 1;
      const off = (j - (m - 1) / 2) * 22, ox = -dy0 / l0 * off, oy = dx0 / l0 * off;

      pts[0] = clip(f.a, pts[0], pts[1]); pts[pts.length - 1] = clip(f.b, pts[pts.length - 1], pts[pts.length - 2]);

      // label on the longest segment

      if (m > 1 && off) { const sg = Math.sign(off), lw = Math.min(16, f.label.length) * 6.4 + 10; if (Math.abs(oy) < Math.abs(ox)) lx += sg * Math.sign(ox || 1) * (lw / 2 + 2); else ly += sg * Math.sign(oy || 1) * 12; }

};

/* ---- 15 table-reveal ---- */
DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));
  function paint() {
    rows.forEach((r, ri) => r.forEach((c, ci) => {
      const k = key(ri, ci), td = cells.get(k);
      if (H.has(k) && !shown.has(k)) { td.className = ''; td.innerHTML = ''; const b = el('button', { type: 'button', class: 'cellbtn', 'aria-label': `Reveal ${plain(head[ci] || 'cell')} in row ${ri + 1}` }, '?'); b.addEventListener('click', () => reveal(ri, ci, true)); td.append(b); }
      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }
    }));
    cnt.textContent = `${shown.size} of ${H.size} revealed`;
    next.disabled = all.disabled = shown.size === H.size; hide.disabled = !shown.size;
  }
  function reveal(r, c, focusNext) {
    shown.add(key(r, c)); paint();
    cx.detail(`${plain(head[c] || '')}, row ${r + 1}`, String(rows[r][c]));
    if (focusNext) { const nb = body.querySelector('.cellbtn'); if (nb) nb.focus(); else next.focus(); }
  }
  next.addEventListener('click', () => { const h = order.find(h => !shown.has(key(h[0], h[1]))); if (h) reveal(h[0], h[1]); });
  all.addEventListener('click', () => { order.forEach(h => shown.add(key(h[0], h[1]))); paint(); cx.detail('', 'All cells revealed.'); });
  hide.addEventListener('click', () => { shown.clear(); paint(); cx.detail('', 'Work out each hidden cell, then select it to check.'); });
  paint(); cx.detail('', 'Work out each hidden cell, then select it to check.');
};
