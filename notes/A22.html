rwards if you want your results to match the examples in this workbook.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Record","Referential integrity"]},{"id":"c02-p07","spec":"Import data from Excel or a CSV file into a table","lessons":["AD04"],"summary":"Append rows from a supplier spreadsheet to tblProduct, and import a separate file into a new table.","blocks":[{"t":"p","text":"Typing hundreds of rows is slow and error-prone. Access can import a spreadsheet or CSV file either by **appending** it to an existing table (all your validation still applies) or into a **new table** that you tidy up first. Riverside Bikes' supplier sends new products as an Excel file."},{"t":"key","title":"You will need / By the end","items":["Excel; tblProduct with data.","By the end tblProduct has been topped up from a spreadsheet and you have a new table **tblProductImport** for use in Chapter 3."]},{"t":"example","title":"Tutorial: Prepare the spreadsheet","steps":["In Excel make a sheet whose row 1 headings are exactly the field names: **ProductID, Description, Category, Price, StockLevel, ReorderLevel**.","Add rows such as: P0009, Chain lube 100ml, Accessories, 6.49, 15, 5 and P0010, Puncture repair kit, Tools, 4.99, 25, 8.","Check every value obeys your rules (P + 4 digits, a listed category, price > 0). Save as **NewProducts.xlsx** and **close Excel** (Access cannot read a workbook that is open)."]},{"t":"example","title":"Tutorial: Append it to tblProduct","steps":["Close tblProduct. **External Data › New Data Source › From File › Excel**.","**Browse…** to NewProducts.xlsx. Choose **Append a copy of the records to the table:** and pick **tblProduct** › **OK**.","Choose the worksheet › **Next**. *First Row Contains Column Headings* is ticked › **Next**.","Import to Table: **tblProduct** › **Finish**. Leave *Save import steps* unticked › **Close**.","Open tblProduct: P0009 and P0010 are there."]},{"t":"example","title":"Tutorial: Import into a new table instead","steps":["Make **SupplierUpdate.xlsx** with the same headings and one new row: P0011, Saddle bag, Accessories, 18.00, 6, 3.","**External Data › New Data Source › From File › Excel** › Browse › choose **Import the source data into a new table in the current database** › OK.","Follow the wizard: headings ticked › Next › check each field's data type (set ProductID to **Short Text**) › Next › **No primary key** › Next › Import to Table: **tblProductImport** › Finish › Close.","You will append this table to tblProduct with an append query in Chapter 3."]},{"t":"tip","text":"For a CSV file use **External Data › New Data Source › From File › Text File**, choose *Delimited*, *Comma*, and tick *First Row Contains Field Names*."},{"t":"warn","text":"When appending, rows that break a rule are dropped, not fixed. Access reports something like *…records were lost due to key violations* (duplicate ProductID) or *…due to validation rule violations*. Always count the rows before and after an import, and fix the spreadsheet rather than switching your rules off."},{"t":"key","title":"Check it works","items":["tblProduct now has 10 records (8 typed + 2 appended).","tblProductImport exists with one record, P0011.","Change one spreadsheet price to 0 and try the append again: that row is rejected, proving validation still applies."]}],"diagram":{"kind":"flow","title":"Importing a spreadsheet","caption":"Two routes: append to an existing table or create a new one.","direction":"tb","nodes":[{"id":"a","label":"Close Excel and the table","detail":"Both files must be closed.","shape":"start"},{"id":"b","label":"External Data › From File › Excel","detail":"Browse to the .xlsx file.","shape":"io"},{"id":"c","label":"Append or new table?","detail":"Append keeps your validation; new table lets you tidy the data first.","shape":"decision"},{"id":"d","label":"Append to tblProduct","detail":"Headings must exactly match the field names.","shape":"process"},{"id":"e","label":"New table tblProductImport","detail":"Check data types; no primary key.","shape":"process"},{"id":"f","label":"Count rows before and after","detail":"Rows breaking rules or keys are dropped with a warning.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","append"],["c","e","new"],["d","f"],["e","f"]]},"check":[{"q":"What must be true of the spreadsheet's first row when you append to tblProduct?","o":["It must be blank","It must contain the primary key only","The headings must match the field names exactly","It must be in bold"],"a":2,"why":"Access matches columns to fields by name when appending."},{"q":"An append import reports that 2 records were lost due to key violations. What is the most likely cause?","o":["Excel was open","Two ProductIDs already exist in tblProduct","Price had a £ sign","The table was not compacted"],"a":1,"why":"Key violations usually mean duplicate primary key values (or a missing related record)."}],"exam":[],"practice":[{"q":"Try it yourself: import five extra customers from a CSV file **customers.csv** into tblCustomer. Write the CSV contents and the steps.","m":4,"a":"CSV (no CustomerID column — AutoNumber fills it): FirstName,Surname,Phone,Email,Postcode / Orla,Breen,07700 900222,orla.breen@example.com,BT74 4GH / Sean,Doherty,028 9649 6222,sean.d@example.com,BT92 0AA / … (three more). Steps: close tblCustomer › External Data › New Data Source › From File › Text File › Browse › Append a copy to tblCustomer › OK › Delimited › Next › Comma, First Row Contains Field Names › Next › Import to tblCustomer › Finish. Check the record count rose by 5 and the new CustomerIDs follow on."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Import","Validation rule"]},{"id":"c02-p08","spec":"Test your tables with normal, boundary and erroneous data","lessons":["AD05"],"summary":"Try planned test values against every rule and relationship you built, and fix anything that lets bad data in.","blocks":[{"t":"p","text":"Before you build queries and forms on top of your tables, prove that the rules work. Try **normal** data (should be accepted), **boundary** data (right on the edge of the rule) and **erroneous** data (should be rejected with your message). Fix any rule that behaves unexpectedly now — it is much harder later."},{"t":"key","title":"You will need / By the end","items":["A backup made today (the cascade-delete test deletes data).","By the end you know every rule, key and relationship works."]},{"t":"example","title":"Tutorial: Run the tests","steps":["**File › Save As › Back Up Database** first.","Open each table in Datasheet view and type each test value from the diagram below.","For each one note whether Access accepted it and what message appeared. Compare with the expected result.","Where the result is wrong, open the table in Design view, correct the property, save, and test again.","For the cascade-delete test, delete order 4 in tblOrder: Access warns *Relationships that specify cascading deletes are about to cause 1 record(s) in this table and in related tables to be deleted.* Click Yes, check its two order lines have gone, then restore your backup (or re-enter the order) so the sample data is complete."]},{"t":"table","head":["Rule","Normal","Boundary","Erroneous"],"rows":[["tblProduct.Price >0","24.99","0.01","0, -5, abc"],["tblProduct.StockLevel >=0 (Integer)","12","0 and 32767","-1, 40000, 2.5 (rounded, not rejected — see tip)"],["tblOrderLine.Quantity >0","2","1","0"],["tblProduct.ProductID Like \"P####\"","P0012","P9999","P12, X0001"],["tblCustomer.Email","a.b@example.com","x@y.z","ab.example.com"],["tblStaff.Username no duplicates","shop2","—","admin (already exists)"]],"caption":"A test plan for the table rules"},{"t":"tip","text":"Integer fields **round** decimals rather than rejecting them: 2.5 becomes 2 (Access rounds halves to the even number), so there is no error. If decimals must be refused, add a rule such as **>=0 And Int([StockLevel])=[StockLevel]** — or accept it, as forms will use whole-number controls."},{"t":"warn","text":"Testing a delete on your only copy is how projects get lost. Back up first, every time."},{"t":"key","title":"Check it works","items":["Every erroneous value is rejected with *your* validation text.","Every normal and boundary value is accepted.","Referential integrity blocks an order line for P0099 and blocks deleting customer 1, who has orders."]}],"diagram":{"kind":"table-reveal","title":"Predict the outcome","caption":"Decide whether each test is accepted or rejected, then reveal.","head":["Test","Type","Expected result"],"rows":[["Price = 0.01","Boundary","Accepted"],["Price = 0","Erroneous","Rejected: Price must be more than £0."],["Quantity = 1","Boundary","Accepted"],["Order line for ProductID P0099","Erroneous","Rejected: related record required in tblProduct"],["Delete customer 1 (has orders)","Erroneous","Rejected: tblOrder includes related records"],["Delete order 4","Normal","Accepted; its 2 order lines are cascade-deleted"],["Username admin (again)","Erroneous","Rejected: duplicate values in the index"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2]]},"check":[{"q":"For the rule >=0 on StockLevel, which value is boundary data?","o":["0","12","-1","40"],"a":0,"why":"0 sits exactly on the edge of the rule and should be accepted."},{"q":"What should you do immediately before testing cascade delete?","o":["Compact the database","Remove referential integrity","Close Access","Make a backup"],"a":3,"why":"Deletes cannot be undone; a backup lets you restore the sample data."}],"exam":[],"practice":[{"q":"Try it yourself: write normal, boundary and erroneous test data for the ReorderLevel rule (>=0, Integer, default 5) and say what you expect for each.","m":3,"a":"Normal: 5 → accepted (also the default for a new record). Boundary: 0 → accepted; 32767 → accepted (largest Integer). Erroneous: -1 → rejected with 'Reorder level cannot be negative.'; 50000 → rejected because it does not fit an Integer field; ten → rejected (type mismatch: 'The value you entered does not match the Number data type in this column')."}],"videos":[{"title":"Testing and evaluation against the requirements – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD05-video"}],"terms":["Validation rule","Referential integrity","Cascade delete"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/02 Tables and relationships"},{"id":"c03","n":3,"title":"Queries","intro":"Ask Riverside Bikes questions with select, parameter, multi-table and totals queries, change data safely with update, append and delete queries, and read the SQL behind them.","pages":[{"id":"c03-p01","spec":"Build a select query in Design view with criteria and sorting","lessons":["AD04"],"summary":"Build qryLowStock, which lists every product at or below its reorder level, lowest stock first.","blocks":[{"t":"p","text":"A [[select query|Select query]] picks out the fields and records you want without changing the data. The shop needs to know which products to reorder, so your first query compares each product's StockLevel with its own ReorderLevel. The same query will feed the low-stock report and the menu alert later."},{"t":"anim","scene":"query-filter","caption":"In Design view, criteria do the WHERE and the sort row does the ORDER BY."},{"t":"key","title":"You will need / By the end","items":["tblProduct with the sample data from Chapter 2.","By the end you will have **qryLowStock** showing three products: P0004, P0002 and P0007."]},{"t":"example","title":"Tutorial: Create qryLowStock","steps":["**Create › Query Design**. The *Add Tables* pane opens on the right (Access 2016/2019: the *Show Table* dialog).","Double-click **tblProduct** to add it, then close the pane.","In the table box double-click **ProductID**, **Description**, **Category**, **StockLevel** and **ReorderLevel**. Each appears in a column of the design grid.","In the **Criteria** row under **StockLevel** type **<=[ReorderLevel]** (square brackets mean 'the field called ReorderLevel', not the text).","In the **Sort** row under **StockLevel** choose **Ascending**.","Click **Query Design › Run** (the red !). Check the results, then **Ctrl+S** and name it **qryLowStock**."],"answer":"Three records: P0004 D-lock (3/5), P0002 Brake pads (4/6), P0007 Multi-tool (5/5)."},{"t":"table","head":["ProductID","Description","Category","StockLevel","ReorderLevel"],"rows":[["P0004","D-lock","Accessories","3","5"],["P0002","Brake pads (pair)","Parts","4","6"],["P0007","Multi-tool 15-in-1","Tools","5","5"]],"caption":"qryLowStock results with the sample data"},{"t":"table","head":["Grid row","What it does"],"rows":[["Field","Which field (or calculation) appears in this column"],["Table","Which table the field comes from"],["Sort","Ascending / Descending; columns are sorted left to right"],["Show","Untick to use a field for criteria or sorting without displaying it"],["Criteria","Conditions a record must meet; conditions on the same row are joined with AND"],["or","A second row of conditions joined with OR"]],"caption":"The query design grid"},{"t":"tip","text":"Text criteria need quotes and number criteria do not: under Category type **\"Parts\"** (Access adds the quotes if you forget); under Price type **>20**."},{"t":"warn","text":"If a box pops up saying **Enter Parameter Value** with a field name you did not expect (e.g. *ReorderLvl*), you have misspelt a field name in square brackets. Click Cancel, go to Design view and fix the spelling."},{"t":"key","title":"Check it works","items":["Run qryLowStock: exactly three products appear, P0007 included because 5 is *equal to* its reorder level.","In tblProduct change P0001's StockLevel to 10, run the query again: P0001 now appears. Change it back to 40."]}],"diagram":{"kind":"hotspot","title":"The Query Design window","caption":"Click each part of the Query Design window.","rows":[[{"label":"Run (!)","detail":"Runs the query. For select queries Datasheet view does the same.","span":1},{"label":"Query Type group","detail":"Select, Make Table, Append, Update, Crosstab, Delete — changes what kind of query this is.","span":2},{"label":"Totals (Σ)","detail":"Adds the Total row for Group By, Sum, Count, Avg…","span":1}],[{"label":"Table pane","detail":"The tables or queries the query uses, with join lines from your relationships.","span":4}],[{"label":"Field and Table rows","detail":"Which fields appear and where they come from. Double-click a field in the table pane to add it.","span":2},{"label":"Sort and Show","detail":"Order the results; untick Show to hide a criteria-only field.","span":2}],[{"label":"Criteria row","detail":"Conditions on the same row are ANDed: e.g. <=[ReorderLevel] under StockLevel.","span":2},{"label":"or row","detail":"Conditions on different rows are ORed.","span":2}]],"links":[["Table pane","Field and Table rows"]]},"check":[{"q":"Which criterion under StockLevel lists products at or below their own reorder level?","o":["<=ReorderLevel","<=\"ReorderLevel\"","<=5","<=[ReorderLevel]"],"a":3,"why":"Square brackets refer to the field; quotes would compare with the text 'ReorderLevel'."},{"q":"Running a query unexpectedly shows an 'Enter Parameter Value' box asking for 'Prise'. Why?","o":["The table is not trusted","The query has no sort","A field name in brackets is misspelt","Price needs quotes"],"a":2,"why":"Access treats any unknown name in brackets as a parameter and asks for it."},{"q":"You want products in the Parts category with stock under 10. Where do the two criteria go?","o":["One on Criteria, one on the or row","On the same Criteria row","Both in the Sort row","In the Show row"],"a":1,"why":"Criteria on the same row are joined with AND."}],"exam":[],"practice":[{"q":"Try it yourself: build **qryAccessories** that lists the Description, Price and StockLevel of every Accessories product, most expensive first, without showing the Category column.","m":3,"a":"Create › Query Design › add tblProduct. Fields: Description, Price, StockLevel, Category. Category Criteria \"Accessories\", untick Show. Price Sort Descending. Run: D-lock £34.00 (3), LED front light £24.99 (12), Chain lube 100ml £6.49 (15) if you imported it. Save as qryAccessories. SQL: SELECT Description, Price, StockLevel FROM tblProduct WHERE Category=\"Accessories\" ORDER BY Price DESC;"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-basic-queries"},{"title":"Video: Get started with queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-get-started-with-queries"}],"terms":["Select query","Criteria"]},{"id":"c03-p02","spec":"Use criteria with wildcards, Like, Between, dates, And and Or","lessons":["AD04"],"summary":"Write criteria that find text patterns, number and date ranges, and combinations of conditions.","blocks":[{"t":"p","text":"Most of the work in a query is in the Criteria row. Access [[criteria|Criteria]] are short expressions: you combine comparison operators, the [[wildcards|Wildcard]] `*` and `?` with **Like**, ranges with **Between**, and **And**/**Or** to find exactly the records you need."},{"t":"key","title":"You will need / By the end","items":["tblProduct and tblOrder with sample data.","By the end you can write and test each criterion below."]},{"t":"table","head":["Criterion (in the grid)","Under field","Finds","Sample results"],"rows":[["\"Parts\"","Category","Exactly Parts","P0001, P0002"],["Not \"Parts\"","Category","Everything except Parts","8 products"],[">20","Price","Prices over £20","P0003, P0004, P0005, P0008"],["Between 10 And 30","Price","£10 to £30 inclusive","P0003, P0006, P0007, P0008"],["Like \"*light*\"","Description","Contains 'light' anywhere","P0003 LED front light"],["Like \"P000?\"","ProductID","P000 then any one character","P0001 to P0009"],["\"Parts\" Or \"Tools\"","Category","Either category","P0001, P0002, P0007, P0008, P0010"],["Between #01/10/2026# And #15/10/2026#","OrderDate","Orders from 1 to 15 October 2026","Orders 1, 2, 3"],[">=Date()-30","OrderDate","Orders in the last 30 days","Depends on today"],["Is Null","Email","Customers with no email","None in the sample"]],"caption":"Criteria you will use (sample data from Chapter 2, including the two imported products)"},{"t":"example","title":"Tutorial: Try a combined And/Or query","steps":["**Create › Query Design**, add **tblProduct**, add Description, Category, Price and StockLevel.","Row **Criteria**: Category **\"Clothing\"**, StockLevel **<10** (same row = AND). Run: only P0005 Waterproof jacket.","Back in Design view, on the **or** row put Category **\"Tools\"** with no stock criterion. Run: P0005 plus P0007, P0008 and P0010 — every Tools product *or* low-stock clothing.","Close without saving (it was practice)."]},{"t":"code","lang":"excel","code":"Like \"*\" & \"pump\" & \"*\"     ' contains pump\nLike \"B*\"                     ' starts with B\nLike \"*[0-9]\"                 ' ends with a digit\nBetween 5 And 10              ' 5 to 10 inclusive\n>=#01/09/2026# And <#01/10/2026#   ' any time in September 2026\nIs Not Null                   ' has a value","title":"Criteria patterns"},{"t":"tip","text":"Dates go between **#** signs. In the grid type them the UK way (#15/10/2026#) — Access converts them. If you look in SQL view you will see Access has stored them US-style (#10/15/2026#); that is correct, so don't 'fix' it."},{"t":"warn","text":"**Between 10 And 30** includes both ends. And Access wildcards are `*` (any number of characters) and `?` (one character), not `%` and `_` as in other SQL — `Like \"%light%\"` finds nothing in Access."},{"t":"key","title":"Check it works","items":["Each criterion in the first table returns exactly the sample results listed.","Swap a criterion from the Criteria row to the or row and predict the change before you run it."]}],"diagram":{"kind":"match","title":"Criteria and their meanings","caption":"Match each criterion to the records it finds.","pairs":[["Like \"*light*\"","Description contains 'light'"],["Between 10 And 30","From 10 to 30 including both"],["Not \"Parts\"","Every category except Parts"],[">=Date()-30","Dates in the last 30 days"],["Is Null","The field is empty"],["Like \"P000?\"","P000 followed by exactly one character"]]},"check":[{"q":"Which criterion finds products whose description starts with 'Brake'?","o":["Like \"Brake*\"","Like \"*Brake\"","= \"Brake\"","Like \"%Brake%\""],"a":0,"why":"The * goes after the fixed text for 'starts with'."},{"q":"Two criteria are on different rows of the grid (Criteria and or). How are they combined?","o":["AND","NOT","Only the first is used","OR"],"a":3,"why":"Different rows are ORed; the same row is ANDed."},{"q":"Which is a correctly written date criterion in Access?","o":["\"01/10/2026\"","[01/10/2026]","#01/10/2026#","'01/10/2026'"],"a":2,"why":"Dates are enclosed in # signs."}],"exam":[],"practice":[{"q":"Try it yourself: write a query **qryOctoberOpen** that lists open orders placed in October 2026 with the customer's surname, newest first.","m":4,"a":"Create › Query Design › add tblCustomer and tblOrder (joined on CustomerID). Fields: OrderID, OrderDate, Status, Surname. OrderDate Criteria Between #01/10/2026# And #31/10/2026#, Sort Descending. Status Criteria \"Open\" (same row). Run: order 4 Maguire 22/10/2026 and order 3 McCaffrey 15/10/2026. SQL: SELECT tblOrder.OrderID, OrderDate, Status, Surname FROM tblCustomer INNER JOIN tblOrder ON tblCustomer.CustomerID = tblOrder.CustomerID WHERE OrderDate Between #10/1/2026# And #10/31/2026# AND Status=\"Open\" ORDER BY OrderDate DESC;"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-basic-queries"}],"terms":["Criteria","Wildcard"]},{"id":"c03-p03","spec":"Create parameter queries that ask the user for a value","lessons":["AD04"],"summary":"Build qryCustomerSearch, which asks for part of a surname, and a date-range query that asks for two dates.","blocks":[{"t":"p","text":"A [[parameter query|Parameter query]] asks a question each time it runs, so one query can search for any customer. You write a prompt in square brackets in the Criteria row; anything Access does not recognise as a field becomes a question. Combining it with Like and wildcards lets staff type just part of a name."},{"t":"key","title":"You will need / By the end","items":["tblCustomer and tblOrder with sample data.","By the end **qryCustomerSearch** finds Irvine and Maguire when you type *ir*."]},{"t":"example","title":"Tutorial: Create qryCustomerSearch","steps":["**Create › Query Design**, add **tblCustomer**, close the pane.","Add **CustomerID**, **FirstName**, **Surname**, **Phone** and **Postcode**.","In Surname's Criteria type: **Like \"*\" & [Enter part of the surname] & \"*\"**","Sort **Surname** Ascending and **FirstName** Ascending.","Run. The box *Enter part of the surname* appears. Type **ir** › OK.","**Ctrl+S**, name it **qryCustomerSearch**."],"answer":"Hannah Irvine and Aoife Maguire (both contain 'ir'; Access ignores capitals). Leave the box empty and click OK: every customer is listed, because Like \"**\" matches any surname."},{"t":"code","lang":"sql","code":"SELECT CustomerID, FirstName, Surname, Phone, Postcode\nFROM tblCustomer\nWHERE Surname Like \"*\" & [Enter part of the surname] & \"*\"\nORDER BY Surname, FirstName;","title":"SQL view of qryCustomerSearch"},{"t":"example","title":"Tutorial: Create a date-range parameter query","steps":["**Create › Query Design**, add **tblOrder**; add OrderID, CustomerID, OrderDate and Status.","In OrderDate's Criteria type **Between [Start date] And [End date]**.","Click **Query Design › Parameters**. Type **Start date** with Data Type **Date/Time**, and **End date** with **Date/Time** › OK. (The names must match the brackets exactly, without the brackets.)","Run, enter **01/10/2026** and **15/10/2026**. Save as **qryOrdersBetweenDates**."],"answer":"Orders 1, 2 and 3. Declaring the parameters as Date/Time makes Access treat 01/10/2026 as a date, not text."},{"t":"code","lang":"sql","code":"PARAMETERS [Start date] DateTime, [End date] DateTime;\nSELECT OrderID, CustomerID, OrderDate, Status\nFROM tblOrder\nWHERE OrderDate Between [Start date] And [End date]\nORDER BY OrderDate;","title":"SQL view of qryOrdersBetweenDates"},{"t":"tip","text":"Make the prompt a clear instruction (\"Enter part of the surname\"), not just a field name. A prompt must never be exactly the same as a field name, or Access uses the field instead of asking."},{"t":"warn","text":"Later, in VBA, you cannot run a saved parameter query with `CurrentDb.Execute` — no one is there to answer the prompt, so you get run-time error 3061 *Too few parameters*. In code you build the SQL with the value already joined in (Chapter 7)."},{"t":"key","title":"Check it works","items":["Run qryCustomerSearch with *mc*: Ciaran McCaffrey only. With *xyz*: no records (not an error).","Run qryOrdersBetweenDates with 16/10/2026 and 31/10/2026: order 4 only."]}],"diagram":{"kind":"flow","title":"What happens when a parameter query runs","caption":"Step through a search for 'ir'.","direction":"lr","nodes":[{"id":"a","label":"Run query","detail":"Double-click qryCustomerSearch or click Run.","shape":"start"},{"id":"b","label":"Unknown name found","detail":"[Enter part of the surname] is not a field, so it is a parameter.","shape":"decision"},{"id":"c","label":"Prompt box","detail":"User types ir and clicks OK.","shape":"io"},{"id":"d","label":"Criteria built","detail":"Like \"*\" & \"ir\" & \"*\" becomes Like \"*ir*\".","shape":"process"},{"id":"e","label":"Records tested","detail":"Each surname is checked against *ir* (not case-sensitive).","shape":"process"},{"id":"f","label":"Results","detail":"Irvine, Maguire.","shape":"end"}],"edges":[["a","b"],["b","c","parameter"],["c","d"],["d","e"],["e","f"]]},"check":[{"q":"Which criterion lets the user type any part of a surname?","o":["[Enter surname]","Like \"*\" & [Enter surname] & \"*\"","Like [Enter surname] & \"*\"","\"*[Enter surname]*\""],"a":1,"why":"The wildcards must be joined to the parameter on both sides with &."},{"q":"What does Query Design › Parameters let you do?","o":["Set the data type of each parameter","Rename the query","Hide fields","Run the query twice"],"a":0,"why":"Declaring a parameter's data type makes Access check and convert what is typed."},{"q":"A user leaves the prompt of qryCustomerSearch blank. What happens?","o":["An error appears","No records are shown","Access asks again","All customers are shown"],"a":3,"why":"Like \"**\" matches any surname that is not empty."}],"exam":[],"practice":[{"q":"Try it yourself: build **qryProductsByCategory** that asks for a category and shows matching products with price and stock, cheapest first.","m":3,"a":"Create › Query Design › add tblProduct › fields ProductID, Description, Category, Price, StockLevel. Category Criteria: [Enter category (Parts, Accessories, Clothing or Tools)]. Price Sort Ascending. Run with Tools: P0010 Puncture repair kit £4.99 (if imported), P0007 Multi-tool £19.99, P0008 Track pump £29.95. SQL: SELECT ProductID, Description, Category, Price, StockLevel FROM tblProduct WHERE Category=[Enter category (Parts, Accessories, Clothing or Tools)] ORDER BY Price;"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Use parameter queries to filter query results","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/office/video-use-parameter-queries-to-filter-query-results-99b34461-91a2-40a8-b7e3-a4fca2f63b85"}],"terms":["Parameter query","Criteria","Wildcard"]},{"id":"c03-p04","spec":"Build multi-table queries using joins","lessons":["AD04"],"summary":"Join customers, orders, order lines and products in one query, and find customers with no orders using an outer join.","blocks":[{"t":"p","text":"Most useful questions need data from more than one table: *which customer bought what, and at what price?* When you add related tables to a query, Access uses your relationships to draw [[join|Join]] lines, so each order line is matched with its order, customer and product. This query becomes **qryOrderLines**, the base for totals, the order form and receipts."},{"t":"anim","scene":"key-join","caption":"A multi-table query joins rows through the relationship."},{"t":"key","title":"You will need / By the end","items":["All four related tables with sample data; relationships from Chapter 2.","By the end **qryOrderLines** shows the 8 order lines with customer and product details."]},{"t":"example","title":"Tutorial: Create qryOrderLines (part 1: the joins)","steps":["**Create › Query Design**. In Add Tables double-click **tblCustomer**, **tblOrder**, **tblOrderLine** and **tblProduct**; close the pane. Join lines appear between them.","Add from **tblOrder**: OrderID, OrderDate, Status, CustomerID.","Add from **tblCustomer**: FirstName, Surname.","Add from **tblOrderLine**: OrderLineID, ProductID.","Add from **tblProduct**: Description, Category, Price.","Add from **tblOrderLine**: Quantity.","Sort **OrderID** Ascending and **OrderLineID** Ascending.","Run (8 records), then **Ctrl+S** as **qryOrderLines**. You add the LineTotal calculation on the next page."]},{"t":"table","head":["OrderID","Surname","ProductID","Description","Price","Quantity"],"rows":[["1","Maguire","P0001","Inner tube 700x25c","£5.99","2"],["1","Maguire","P0003","LED front light","£24.99","1"],["2","Irvine","P0005","Waterproof jacket","£59.99","1"],["2","Irvine","P0006","Cycling gloves","£14.50","2"],["3","McCaffrey","P0008","Track pump","£29.95","1"],["3","McCaffrey","P0002","Brake pads (pair)","£8.50","2"],["4","Maguire","P0004","D-lock","£34.00","1"],["4","Maguire","P0001","Inner tube 700x25c","£5.99","3"]],"caption":"qryOrderLines so far (some columns hidden here)"},{"t":"example","title":"Tutorial: Find customers with no orders (outer join)","steps":["**Create › Query Design**, add **tblCustomer** and **tblOrder**.","Double-click the **join line** between them. In *Join Properties* choose **2: Include ALL records from 'tblCustomer' and only those records from 'tblOrder' where the joined fields are equal** › OK. The line now has an arrow.","Add CustomerID, FirstName, Surname from tblCustomer and **OrderID** from tblOrder.","Under OrderID type Criteria **Is Null** and untick Show.","Run: Jack Graham and Niamh Corrigan. Save as **qryCustomersNoOrders**."]},{"t":"code","lang":"sql","code":"SELECT tblCustomer.CustomerID, tblCustomer.FirstName, tblCustomer.Surname\nFROM tblCustomer LEFT JOIN tblOrder ON tblCustomer.CustomerID = tblOrder.CustomerID\nWHERE tblOrder.OrderID Is Null;","title":"SQL view of qryCustomersNoOrders"},{"t":"warn","text":"If two tables in a query have **no join line**, Access pairs every record of one with every record of the other (a *Cartesian product*): 5 customers × 10 products = 50 meaningless rows. If you see far too many rows, check the join lines, and don't add tables you don't need."},{"t":"tip","text":"When the same field name exists in two tables (OrderID is in tblOrder and tblOrderLine), add it only **once**. Two copies would be named *tblOrder.OrderID* and *tblOrderLine.OrderID*, which makes later queries and code awkward."},{"t":"key","title":"Check it works","items":["qryOrderLines returns exactly 8 rows — one per order line.","qryCustomersNoOrders returns customers 4 and 5 only."]}],"diagram":{"kind":"table-reveal","title":"What does an inner join return?","caption":"For each pair, decide whether it appears in qryOrderLines, then reveal.","head":["Record","In qryOrderLines?","Why"],"rows":[["Order line 3 (order 2, P0005)","Yes","It matches order 2, customer 3 and product P0005"],["Customer 4, Jack Graham","No","Inner joins drop customers with no matching orders"],["Product P0007 Multi-tool","No","It has not appeared on any order line"],["Order 1","Twice","Once for each of its two order lines"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2]]},"check":[{"q":"Why does Jack Graham not appear in qryOrderLines?","o":["His postcode is invalid","The query is sorted","An inner join only shows customers with matching orders","CustomerID is an AutoNumber"],"a":2,"why":"Inner joins show only records that match on both sides."},{"q":"Which join type lists every customer, even those without orders?","o":["Inner join","Join option 2 (all records from tblCustomer)","A cross join with no line","Join option 3 (all records from tblOrder)"],"a":1,"why":"Option 2 is a left outer join from tblCustomer."},{"q":"A query returns 50 rows when you expected 8. What is the likely cause?","o":["A missing join line between two tables","A sort on OrderID","Too many criteria","The Show box is ticked"],"a":0,"why":"Unjoined tables produce every combination of rows."}],"exam":[],"practice":[{"q":"Try it yourself: build **qryProductsNeverSold** to list products that have never appeared on an order line.","m":4,"a":"Create › Query Design › add tblProduct and tblOrderLine › double-click the join line › option 2 (ALL records from tblProduct) › fields ProductID, Description from tblProduct and OrderLineID from tblOrderLine › OrderLineID Criteria Is Null, untick Show › Run: P0007 Multi-tool, plus P0009 and P0010 if imported. SQL: SELECT tblProduct.ProductID, tblProduct.Description FROM tblProduct LEFT JOIN tblOrderLine ON tblProduct.ProductID = tblOrderLine.ProductID WHERE tblOrderLine.OrderLineID Is Null;"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Get started with queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-get-started-with-queries"}],"terms":["Join","Select query"]},{"id":"c03-p05","spec":"Add calculated fields to a query: line total and price with VAT","lessons":["AD04"],"summary":"Add LineTotal to qryOrderLines and build a price list showing prices including 20% VAT.","blocks":[{"t":"p","text":"A [[calculated field|Calculated field]] works something out for every record, such as quantity × price. You never store these results in a table — they would go out of date if a price changed. Instead, the query calculates them fresh every time it runs."},{"t":"key","title":"You will need / By the end","items":["qryOrderLines from the previous page.","By the end qryOrderLines has a **LineTotal** column and **qryPriceList** shows prices with VAT."]},{"t":"example","title":"Tutorial: Add LineTotal to qryOrderLines","steps":["Right-click **qryOrderLines** › **Design View**.","In the first empty column of the Field row type: **LineTotal: [Quantity]*[Price]** (the name before the colon is the column heading).","With that column selected, open **Query Design › Property Sheet** (or press **F4**) and set **Format** to **Currency**.","Run: order line 1 shows £11.98 (2 × £5.99). **Ctrl+S**."]},{"t":"code","lang":"sql","code":"SELECT tblOrder.OrderID, tblOrder.OrderDate, tblOrder.Status, tblOrder.CustomerID,\n       tblCustomer.FirstName, tblCustomer.Surname,\n       tblOrderLine.OrderLineID, tblOrderLine.ProductID, tblProduct.Description,\n       tblProduct.Category, tblProduct.Price, tblOrderLine.Quantity,\n       [Quantity]*[Price] AS LineTotal\nFROM tblCustomer INNER JOIN (tblProduct INNER JOIN (tblOrder INNER JOIN tblOrderLine\n       ON tblOrder.OrderID = tblOrderLine.OrderID)\n       ON tblProduct.ProductID = tblOrderLine.ProductID)\n       ON tblCustomer.CustomerID = tblOrder.CustomerID\nORDER BY tblOrder.OrderID, tblOrderLine.OrderLineID;","title":"SQL view of the finished qryOrderLines"},{"t":"example","title":"Tutorial: Build qryPriceList with VAT","steps":["**Create › Query Design**, add **tblProduct**; add ProductID, Description and Price.","Next column: **PriceIncVAT: Round([Price]*1.2,2)** › Format **Currency**.","Next column: **VATAmount: Round([Price]*0.2,2)** › Format **Currency**.","Run and save as **qryPriceList**."],"answer":"P0003 LED front light: £24.99, £29.99 inc. VAT, VAT £5.00. P0006 Cycling gloves: £14.50 → £17.40."},{"t":"table","head":["Calculated field","Expression","Order line 6 (P0002 × 2)"],"rows":[["LineTotal","[Quantity]*[Price]","2 × £8.50 = £17.00"],["LineVAT","Round([Quantity]*[Price]*0.2,2)","£3.40"],["LineIncVAT","[Quantity]*[Price]*1.2","£20.40"],["PriceIncVAT","Round([Price]*1.2,2)","£10.20"]],"caption":"Useful calculated fields"},{"t":"tip","text":"Use **Query Design › Builder** (the Expression Builder) if you are unsure of a field name: double-click fields to insert them in brackets, so you can't misspell them."},{"t":"warn","text":"Don't name a calculated field the same as a field it uses, e.g. **Price: [Price]*1.2** — Access gives *Circular reference caused by alias 'Price'*. Use a new name such as PriceIncVAT."},{"t":"key","title":"Check it works","items":["qryOrderLines: line 8 (P0001 × 3) shows LineTotal £17.97.","qryPriceList: P0004 D-lock shows £40.80 including VAT."]}],"diagram":{"kind":"calc","title":"Order line calculator","caption":"Enter a quantity and price to see what LineTotal × 1.2 gives. Try 3 and 5.99: £17.97 before VAT.","inputs":[{"id":"q","label":"Quantity","value":2},{"id":"p","label":"Price (£)","value":8.5},{"id":"v","label":"VAT rate (%)","value":20}],"formula":"q*p*(1+v/100)","result":{"label":"Line total including VAT","unit":"£"}},"check":[{"q":"Which Field row entry creates a column headed LineTotal?","o":["LineTotal = [Quantity]*[Price]","[LineTotal]: Quantity x Price","=[Quantity]*[Price] AS LineTotal","LineTotal: [Quantity]*[Price]"],"a":3,"why":"In the grid the alias comes first, followed by a colon."},{"q":"Why is LineTotal calculated in a query rather than stored in tblOrderLine?","o":["Tables cannot hold currency","Queries run faster with stored totals","A stored total could become wrong when the price or quantity changes","Calculated fields cannot be formatted"],"a":2,"why":"Derived data should be recalculated, not stored, to avoid inconsistency."},{"q":"What is Round([Price]*1.2,2) for P0001 at £5.99?","o":["£7.18","£7.19","£7.20","£5.99"],"a":1,"why":"5.99 × 1.2 = 7.188, rounded to 2 decimal places = 7.19."}],"exam":[],"practice":[{"q":"Try it yourself: add a column **StockValue** to a new query **qryStockValue** that shows the value of stock held for each product (StockLevel × Price), and a total for the whole shop.","m":4,"a":"Create › Query Design › add tblProduct › ProductID, Description, StockLevel, Price, then StockValue: [StockLevel]*[Price] (Format Currency). Run: e.g. P0001 40 × £5.99 = £239.60; P0005 7 × £59.99 = £419.93. For the shop total make a second query qryStockTotal: add tblProduct, click Totals, and use a single column TotalStockValue: Sum([StockLevel]*[Price]) with Total set to Expression (adding ProductID with Group By would split it back into one row per product). With the 8 original products: 239.60 + 34.00 + 299.88 + 102.00 + 419.93 + 290.00 + 99.95 + 269.55 = £1,754.91."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Get started with queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-get-started-with-queries"}],"terms":["Calculated field"]},{"id":"c03-p06","spec":"Work out totals with totals queries: order totals and sales by category","lessons":["AD04"],"summary":"Build qryOrderTotals (subtotal, VAT and total for each order) and qrySalesByCategory.","blocks":[{"t":"p","text":"A [[totals query|Totals query]] groups records together and calculates one answer per group — a sum, count, average, minimum or maximum. Grouping qryOrderLines by OrderID gives each order's subtotal; grouping by Category gives sales for each part of the shop."},{"t":"key","title":"You will need / By the end","items":["qryOrderLines with LineTotal.","By the end qryOrderTotals shows 4 orders and qrySalesByCategory shows 4 categories."]},{"t":"example","title":"Tutorial: Create qryOrderTotals","steps":["**Create › Query Design**. In *Add Tables* click the **Queries** tab and add **qryOrderLines**.","Add **OrderID**, **OrderDate** and **Surname**.","Click **Query Design › Totals** (Σ). A **Total** row appears with *Group By* in every column.","Next column Field: **NumberOfLines: OrderLineID** with Total **Count**.","Next column Field: **OrderSubtotal: LineTotal** with Total **Sum**.","Next: **VAT: Round(Sum([LineTotal])*0.2,2)** with Total **Expression**.","Next: **OrderTotal: Sum([LineTotal])+Round(Sum([LineTotal])*0.2,2)** with Total **Expression**.","Set Format **Currency** on the last three (Property Sheet), sort OrderID Ascending, Run, save as **qryOrderTotals**."]},{"t":"code","lang":"sql","code":"SELECT OrderID, OrderDate, Surname,\n       Count(OrderLineID) AS NumberOfLines,\n       Sum(LineTotal) AS OrderSubtotal,\n       Round(Sum(LineTotal)*0.2, 2) AS VAT,\n       Sum(LineTotal) + Round(Sum(LineTotal)*0.2, 2) AS OrderTotal\nFROM qryOrderLines\nGROUP BY OrderID, OrderDate, Surname\nORDER BY OrderID;","title":"SQL view of qryOrderTotals"},{"t":"example","title":"Tutorial: Create qrySalesByCategory","steps":["**Create › Query Design**, add **qryOrderLines**, click **Totals**.","**Category** – Group By. **NumberOfLines: OrderLineID** – Count. **ItemsSold: Quantity** – Sum. **SalesValue: LineTotal** – Sum, Sort **Descending**.","Run and save as **qrySalesByCategory**."],"answer":"Clothing 2 lines, 3 items, £88.99; Accessories 2, 2, £58.99; Parts 3, 7, £46.95; Tools 1, 1, £29.95."},{"t":"code","lang":"sql","code":"SELECT Category, Count(OrderLineID) AS NumberOfLines,\n       Sum(Quantity) AS ItemsSold, Sum(LineTotal) AS SalesValue\nFROM qryOrderLines\nGROUP BY Category\nORDER BY Sum(LineTotal) DESC;","title":"SQL view of qrySalesByCategory"},{"t":"table","head":["Total row option","Does"],"rows":[["Group By","One output row per different value"],["Sum / Avg","Adds up / averages a number field in each group"],["Count","Counts non-empty values in each group"],["Min / Max","Smallest / largest value in each group"],["Expression","A calculation that itself uses Sum(), Count() etc."],["Where","A criterion applied *before* grouping; the column is not shown"]],"caption":"The Total row"},{"t":"warn","text":"Every column in a totals query must be either grouped or aggregated. Adding Description with *Group By* splits the totals into one row per product; leaving a field with no Total gives *Your query does not include the specified expression … as part of an aggregate function*. Also don't write **LineTotal: LineTotal** with Sum — that is a circular reference; use a new name such as OrderSubtotal."},{"t":"tip","text":"To total only completed sales, add **Status** with Total **Where** and Criteria **\"Paid\" Or \"Dispatched\"**. A Where column filters records before they are grouped."},{"t":"key","title":"Check it works","items":["qryOrderTotals matches the diagram below, e.g. order 2: £88.99 + £17.80 = £106.79.","Adding the four OrderSubtotal values (£224.88) gives the same answer as adding the four SalesValue values in qrySalesByCategory — a good cross-check."]}],"diagram":{"kind":"table-reveal","title":"qryOrderTotals results","caption":"Work out VAT and total for each order, then reveal to check.","head":["OrderID","Surname","OrderSubtotal","VAT (20%)","OrderTotal"],"rows":[["1","Maguire","£36.97","£7.39","£44.36"],["2","Irvine","£88.99","£17.80","£106.79"],["3","McCaffrey","£46.95","£9.39","£56.34"],["4","Maguire","£51.97","£10.39","£62.36"]],"hidden":[[0,3],[0,4],[1,3],[1,4],[2,3],[2,4],[3,3],[3,4]]},"check":[{"q":"Which Total setting gives one row per order?","o":["Group By on OrderID","Sum on OrderID","Count on OrderID","Where on OrderID"],"a":0,"why":"Group By creates one output row for each different value."},{"q":"You want only Paid and Dispatched orders included in the totals, without showing Status. Which Total option goes under Status?","o":["Group By","Expression","First","Where"],"a":3,"why":"Where filters before grouping and the column is not displayed."},{"q":"Order 3 has lines of £29.95 and £17.00. What is its OrderTotal including 20% VAT?","o":["£46.95","£55.34","£56.34","£58.69"],"a":2,"why":"£46.95 + £9.39 VAT = £56.34."}],"exam":[],"practice":[{"q":"Try it yourself: build **qryCustomerSpend** showing each customer's number of orders and total spend (before VAT), highest spender first.","m":4,"a":"Base it on qryOrderTotals, which already has one row per order (counting OrderLineID in qryOrderLines would count lines, not orders). Create › Query Design › Queries tab › add qryOrderTotals, and add tblOrder; join qryOrderTotals.OrderID to tblOrder.OrderID by dragging if no line appears. Click Totals. Fields: CustomerID (tblOrder) Group By; Surname Group By; NumberOfOrders: OrderID (qryOrderTotals) Count; TotalSpend: OrderSubtotal Sum, Sort Descending, Format Currency. Results: Irvine 1 order £88.99; Maguire 2 orders £88.94 (£36.97 + £51.97); McCaffrey 1 order £46.95. SQL: SELECT tblOrder.CustomerID, qryOrderTotals.Surname, Count(qryOrderTotals.OrderID) AS NumberOfOrders, Sum(qryOrderTotals.OrderSubtotal) AS TotalSpend FROM qryOrderTotals INNER JOIN tblOrder ON qryOrderTotals.OrderID = tblOrder.OrderID GROUP BY tblOrder.CustomerID, qryOrderTotals.Surname ORDER BY Sum(qryOrderTotals.OrderSubtotal) DESC;"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Get started with queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-us/access/training/video-get-started-with-queries"}],"terms":["Totals query","Calculated field"]},{"id":"c03-p07","spec":"Change data with update queries: stock levels and prices","lessons":["AD04"],"summary":"Build qryUpdateStock, which takes an order's quantities off stock, and a price-rise update query.","blocks":[{"t":"p","text":"An [[update query|Update query]] changes values in many records at once. It is an [[action query|Action query]]: running it changes the table permanently and cannot be undone. Riverside Bikes uses one to reduce stock when an order is confirmed, and another to put prices up in one category."},{"t":"key","title":"You will need / By the end","items":["A backup made **now** (File › Save As › Back Up Database).","The database trusted (action queries are blocked otherwise).","By the end **qryUpdateStock** reduces stock for any order number you enter."]},{"t":"example","title":"Tutorial: Create qryUpdateStock","steps":["**Create › Query Design**, add **tblProduct** and **tblOrderLine** (joined on ProductID); close the pane.","Click **Query Design › Update** in the Query Type group. The grid gains an **Update To** row.","Add **StockLevel** from tblProduct. In its **Update To** row type **[tblProduct].[StockLevel]-[tblOrderLine].[Quantity]**.","Add **OrderID** from tblOrderLine. In its **Criteria** row type **[Enter order number]**.","**Query Design › Parameters**: *Enter order number*, Data Type **Long Integer** › OK.","Click **Home › View › Datasheet View** first: it shows the StockLevel values that *will* change, without changing them. Enter **3**: two rows (9 and 4).","Back to Design view, **Ctrl+S** as **qryUpdateStock**, then click **Run**, enter **3**. Access warns *You are about to update 2 row(s)* › **Yes**."]},{"t":"code","lang":"sql","code":"PARAMETERS [Enter order number] Long;\nUPDATE tblProduct INNER JOIN tblOrderLine\n       ON tblProduct.ProductID = tblOrderLine.ProductID\nSET tblProduct.StockLevel = [tblProduct].[StockLevel] - [tblOrderLine].[Quantity]\nWHERE tblOrderLine.OrderID = [Enter order number];","title":"SQL view of qryUpdateStock"},{"t":"example","title":"Tutorial: Create a price-rise query","steps":["**Create › Query Design**, add **tblProduct**, click **Update**.","Add **Price**; Update To **Round([Price]*1.05,2)** (a 5% rise).","Add **Category**; Criteria **[Enter category]**.","Save as **qryPriceRise**. Back up, then run it with **Tools** to try it; restore the backup afterwards if you want to keep the sample prices."]},{"t":"code","lang":"sql","code":"UPDATE tblProduct\nSET Price = Round([Price]*1.05, 2)\nWHERE Category = [Enter category];","title":"SQL view of qryPriceRise"},{"t":"warn","text":"Every run changes the data **again**. Running qryUpdateStock twice for order 3 takes the stock off twice. On a third run P0002 would go below 0, so Access reports that it *didn't update … record(s) due to validation rule violations* and asks whether to run anyway — click **No**. In Chapter 7 a *Confirm order* button runs this update once and checks there is enough stock first."},{"t":"tip","text":"Double-clicking an action query in the Navigation Pane runs it straight away. Right-click › **Design View** when you only want to look at it, and consider giving action queries an obvious prefix in the name, e.g. **qryUpdateStock**, so they stand out."},{"t":"key","title":"Check it works","items":["After running qryUpdateStock with 3 once, tblProduct shows P0008 = 8 and P0002 = 2.","Restore your backup (or type 9 and 4 back in) so the sample data matches the rest of the workbook."]}],"diagram":{"kind":"table-reveal","title":"tblProduct before and after qryUpdateStock (order 3)","caption":"Order 3 contains P0008 × 1 and P0002 × 2. Reveal the new stock levels.","head":["ProductID","Description","Before","Quantity on order 3","After"],"rows":[["P0008","Track pump","9","1","8"],["P0002","Brake pads (pair)","4","2","2"],["P0001","Inner tube 700x25c","40","0 (not on order 3)","40"]],"hidden":[[0,4],[1,4],[2,4]]},"check":[{"q":"What is the safest way to see which records an update query will change before running it?","o":["Run it and press Ctrl+Z","Switch it to Datasheet view","Compact the database","Open the table in Design view"],"a":1,"why":"Datasheet view of an action query previews the affected records without changing them."},{"q":"In the Update To row for StockLevel, which expression takes the order quantity off stock?","o":["[tblProduct].[StockLevel]-[tblOrderLine].[Quantity]","[Quantity]-[StockLevel]","StockLevel - 1","=Sum([Quantity])"],"a":0,"why":"The new value is the current stock minus the quantity ordered."},{"q":"Why can't you undo an update query with Ctrl+Z?","o":["Update queries are read-only","Ctrl+Z only works in forms","Undo is disabled in trusted locations","Access saves action-query changes to the table immediately and permanently"],"a":3,"why":"Action queries write straight to the table; restoring a backup is the only way back."}],"exam":[],"practice":[{"q":"Try it yourself: build **qryRestock** that adds a delivered quantity to one product's stock, asking for both the product ID and the quantity.","m":4,"a":"Back up first. Create › Query Design › add tblProduct › Update. StockLevel Update To: [StockLevel]+[Enter quantity delivered]. ProductID Criteria: [Enter product ID]. Query Design › Parameters: Enter quantity delivered = Integer; Enter product ID = Short Text. Save as qryRestock. SQL: PARAMETERS [Enter quantity delivered] Short, [Enter product ID] Text ( 255 ); UPDATE tblProduct SET StockLevel = [StockLevel]+[Enter quantity delivered] WHERE ProductID=[Enter product ID]; Test: P0004 and 10 → stock 3 becomes 13 (1 row updated). Declaring the quantity as a number matters: without it Access may join it as text."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Update query","Action query","Parameter query"]},{"id":"c03-p08","spec":"Use append and delete queries safely","lessons":["AD04"],"summary":"Append the imported supplier products to tblProduct, then clear the import table with a delete query.","blocks":[{"t":"p","text":"An [[append query|Append query]] copies records from one table or query into another; a [[delete query|Delete query]] removes every record that meets its criteria. Both are action queries, so you preview, back up and only then run. Here you move new products from **tblProductImport** (imported in Chapter 2) into **tblProduct** and then empty the import table, ready for the next delivery."},{"t":"key","title":"You will need / By the end","items":["**tblProductImport** containing P0011 Saddle bag; a fresh backup.","By the end tblProduct includes P0011 and tblProductImport is empty."]},{"t":"example","title":"Tutorial: Create qryAppendNewProducts","steps":["**Create › Query Design**, add **tblProductImport**; close the pane.","Click **Query Design › Append**. In the dialog choose Table Name **tblProduct**, *Current Database* › **OK**.","Double-click **ProductID**, **Description**, **Category**, **Price**, **StockLevel** and **ReorderLevel**. The **Append To** row fills in matching field names automatically — check each one.","**Home › View › Datasheet View** to preview: 1 record.","Return to Design view, **Ctrl+S** as **qryAppendNewProducts**, then **Run** › *You are about to append 1 row(s)* › **Yes**."]},{"t":"code","lang":"sql","code":"INSERT INTO tblProduct (ProductID, Description, Category, Price, StockLevel, ReorderLevel)\nSELECT ProductID, Description, Category, Price, StockLevel, ReorderLevel\nFROM tblProductImport;","title":"SQL view of qryAppendNewProducts"},{"t":"example","title":"Tutorial: Create qryClearImport","steps":["**Create › Query Design**, add **tblProductImport**, click **Query Design › Delete**.","Double-click the **\\*** at the top of the field list. The Delete row shows **From**.","Preview in Datasheet view (1 record), save as **qryClearImport**, **Run** › *You are about to delete 1 row(s)* › **Yes**."]},{"t":"code","lang":"sql","code":"DELETE * FROM tblProductImport;","title":"SQL view of qryClearImport"},{"t":"table","head":["Message","Meaning","Fix"],"rows":[["*…didn't add N record(s) to the table due to key violations*","Those ProductIDs already exist in tblProduct, or a related record is missing.","Remove or renumber the duplicates in the import table."],["*…due to validation rule violations*","Values break your rules (price 0, unknown category).","Correct the import data; never switch off the rule."],["*…set N field(s) to Null due to a type conversion failure*","Text in a number field, e.g. '£6.49' or 'six'.","Fix the data types in the import table."],["*Could not delete from specified tables*","The delete query has more than one table or uses a non-updatable query.","Delete from one table only; use criteria on that table."]],"caption":"Action query warnings"},{"t":"warn","text":"A delete query with **no criteria deletes every record in the table**. Before running one on a real table (e.g. removing test customers with Surname = \"Test\"), check the Datasheet preview count, and remember referential integrity will refuse to delete customers who have orders — that is protecting you."},{"t":"tip","text":"Click **No** when Access asks *Do you want to run the action query anyway?* unless you are sure. Then read the counts in the message to find out what was wrong."},{"t":"key","title":"Check it works","items":["tblProduct now contains P0011 Saddle bag (£18.00, stock 6).","tblProductImport is empty; running qryAppendNewProducts again appends 0 rows.","Run qryAppendNewProducts on a copy of the import table that still has P0011: Access reports 1 record not added due to key violations."]}],"diagram":{"kind":"flow","title":"Running an action query safely","caption":"Follow this routine for every update, append or delete query.","direction":"tb","nodes":[{"id":"a","label":"Back up","detail":"File › Save As › Back Up Database.","shape":"start"},{"id":"b","label":"Build in Design view","detail":"Choose Append, Update or Delete in the Query Type group.","shape":"process"},{"id":"c","label":"Preview in Datasheet view","detail":"Shows the records that will be affected; nothing changes yet.","shape":"process"},{"id":"d","label":"Right records and count?","detail":"Compare with what you expected.","shape":"decision"},{"id":"e","label":"Fix criteria","detail":"Adjust the criteria or fields and preview again.","shape":"process"},{"id":"f","label":"Run (!) › Yes","detail":"Read the warning count before clicking Yes.","shape":"io"},{"id":"g","label":"Check the table","detail":"Open the target table and confirm the change.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e","no"],["e","c"],["d","f","yes"],["f","g"]]},"check":[{"q":"What does an append query do?","o":["Changes values in existing records","Removes records","Copies records from one table or query into another table","Creates a new database"],"a":2,"why":"Append = INSERT INTO … SELECT …"},{"q":"A delete query on tblProductImport has no criteria. What will it delete?","o":["Nothing","Every record in tblProductImport","Only the first record","Every record in tblProduct"],"a":1,"why":"No criteria means every record matches."},{"q":"An append reports '1 record(s) not added due to key violations'. What is the most likely reason?","o":["The ProductID already exists in tblProduct","Excel is open","The query is not saved","The price has too many decimals"],"a":0,"why":"A duplicate primary key is a key violation."}],"exam":[],"practice":[{"q":"Try it yourself: Riverside Bikes wants to keep old dispatched orders out of the way. Write the SQL for an append query that copies dispatched orders into a table **tblOrderArchive** (same fields as tblOrder), and explain why you should NOT then simply delete them from tblOrder.","m":4,"a":"First create tblOrderArchive (right-click tblOrder › Copy, Paste › Structure Only, name tblOrderArchive; change OrderID to Number Long Integer). SQL: INSERT INTO tblOrderArchive (OrderID, CustomerID, OrderDate, Status) SELECT OrderID, CustomerID, OrderDate, Status FROM tblOrder WHERE Status=\"Dispatched\"; Deleting them from tblOrder would cascade-delete their order lines (Cascade Delete is on), losing the details of what was sold and breaking sales totals — you would also need to archive tblOrderLine first, so for a small shop it is better to keep them and filter by Status instead."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Append query","Delete query","Action query"]},{"id":"c03-p09","spec":"Read and write the SQL behind your queries in SQL view","lessons":["AD04"],"summary":"Switch each Riverside Bikes query to SQL view, understand each clause, and write a query directly in SQL.","blocks":[{"t":"p","text":"Every query you build in Design view is stored as [[SQL]]. Reading it helps you check a query at a glance, and you will need to write SQL inside VBA in Chapter 7. [[SQL view]] shows the same query as text; changes in one view appear in the other."},{"t":"key","title":"You will need / By the end","items":["The queries from this chapter.","By the end you can match each grid row to its SQL clause and write a query from scratch in SQL view."]},{"t":"example","title":"Tutorial: Look at the SQL of qryLowStock","steps":["Open **qryLowStock** in Design view.","**Home › View › SQL View** (or right-click the query's tab › **SQL View**).","Compare the SQL with the grid. Access adds extra brackets and table names, e.g. `WHERE (((tblProduct.StockLevel)<=[ReorderLevel]))` — it means exactly the same as the tidy version below.","Switch back with **Home › View › Design View**."]},{"t":"code","lang":"sql","code":"SELECT ProductID, Description, Category, StockLevel, ReorderLevel\nFROM tblProduct\nWHERE StockLevel <= ReorderLevel\nORDER BY StockLevel;","title":"qryLowStock written by hand"},{"t":"example","title":"Tutorial: Write a query directly in SQL","steps":["**Create › Query Design**; close the *Add Tables* pane without adding anything.","**Query Design › View › SQL View** (or **Home › View › SQL View**) — a text box shows `SELECT;`.","Replace it with the SQL for qrySalesByCategory from this chapter, or this short one: `SELECT Description, Price FROM tblProduct WHERE Price > 20 ORDER BY Price DESC;`","Click **Run**. If there is a typo Access highlights the problem (e.g. *Syntax error in FROM clause*).","Switch to Design view to see the grid Access builds from your SQL. Save as **qrySQLPractice**."]},{"t":"table","head":["Design grid","SQL clause","Example"],"rows":[["Field row","SELECT","SELECT ProductID, Description"],["Table pane","FROM (+ JOIN … ON …)","FROM tblProduct"],["Criteria / or rows","WHERE … AND / OR …","WHERE StockLevel <= ReorderLevel"],["Total row: Group By","GROUP BY","GROUP BY Category"],["Criteria on a Sum/Count column","HAVING","HAVING Sum(LineTotal) > 50"],["Sort row","ORDER BY … ASC / DESC","ORDER BY StockLevel"],["Update To row","UPDATE … SET …","SET Price = Round([Price]*1.05,2)"],["Append To row","INSERT INTO … SELECT …","INSERT INTO tblProduct (…)"],["Delete query","DELETE … FROM … WHERE …","DELETE * FROM tblProductImport"]],"caption":"Grid rows and SQL"},{"t":"table","head":["Access SQL","Standard SQL"],"rows":[["Wildcards * and ?","Wildcards % and _"],["Dates in #…# in US order, e.g. #10/15/2026#","Dates in quotes, e.g. '2026-10-15'"],["Text in \"double\" or 'single' quotes","Text in 'single' quotes"],["Several joins must be nested in brackets","Brackets optional"],["Unknown names in [ ] become parameters","Unknown names are errors"]],"caption":"Access SQL quirks"},{"t":"tip","text":"Keep a text file of the SQL for each query. It is the fastest way to rebuild a query, and you will reuse it when you write `CurrentDb.Execute \"UPDATE …\"` in VBA."},{"t":"key","title":"Check it works","items":["Open each query from this chapter in SQL view and find its SELECT, FROM, WHERE, GROUP BY and ORDER BY parts.","qrySQLPractice returns P0005, P0004, P0008 and P0003 in that order."]}],"diagram":{"kind":"match","title":"Grid row ↔ SQL clause","caption":"Match each part of the design grid to the SQL it creates.","pairs":[["Field row","SELECT"],["Table pane with join lines","FROM … INNER JOIN … ON"],["Criteria row","WHERE"],["Total row: Group By","GROUP BY"],["Sort row","ORDER BY"],["Update To row","UPDATE … SET"]]},"check":[{"q":"Which clause holds the conditions from the Criteria row?","o":["SELECT","FROM","ORDER BY","WHERE"],"a":3,"why":"WHERE filters records."},{"q":"In Access SQL, which criterion finds descriptions containing 'pump'?","o":["LIKE '%pump%'","= \"pump\"","Like \"*pump*\"","CONTAINS pump"],"a":2,"why":"Access uses * as its multi-character wildcard."},{"q":"A totals query must show only categories with sales over £50. Which clause applies the condition after grouping?","o":["WHERE","HAVING","ORDER BY","GROUP BY"],"a":1,"why":"HAVING filters groups after they are summed; WHERE filters records before grouping."}],"exam":[],"practice":[{"q":"Try it yourself: write, in SQL view, a query **qryBigOrders** that lists the OrderID and OrderTotal of orders whose total including VAT is over £60, using qryOrderTotals.","m":3,"a":"SQL: SELECT OrderID, Surname, OrderTotal FROM qryOrderTotals WHERE OrderTotal > 60 ORDER BY OrderTotal DESC; Results: order 2 Irvine £106.79, order 4 Maguire £62.36. (Because OrderTotal is already calculated in qryOrderTotals, WHERE works here; if you calculated it in this query with Sum you would need HAVING Sum([LineTotal])*1.2 > 60.)"}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"},{"title":"Video: Create basic queries","source":"Video – Microsoft Support","url":"https://support.microsoft.com/en-gb/access/training/video-create-basic-queries"}],"terms":["SQL","SQL view","Select query"]}],"topic":"G24","topicName":"Application development project","links":{"tests":[{"id":"GL","title":"Topic test: Application development project","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GL"}],"papers":[]},"slidesFolder":"A level/A2 2/03 Queries"},{"id":"c04","n":4,"title":"Forms","intro":"Build the Riverside Bikes screens: wizard forms, named controls, combo and list boxes, an order form with a subform and live totals, conditional formatting, buttons in VBA and a start-up menu.","pages":[{"id":"c04-p01","spec":"Create forms with the Form Wizard and switch between Form, Layout and Design view","lessons":["AD04"],"summary":"Make frmCustomer and frmProduct with the Form Wizard and learn what each form view is for.","blocks":[{"t":"p","text":"A [[form|Form]] is the screen staff use instead of typing into tables. The Form Wizard gives you a working form in under a minute; you then polish it in Layout and Design view. You start with the two simple single-table forms, **frmCustomer** and **frmProduct**."},{"t":"key","title":"You will need / By the end","items":["tblCustomer and tblProduct with data.","By the end both forms open and show one record at a time."]},{"t":"example","title":"Tutorial: Create frmCustomer with the wizard","steps":["**Create › Form Wizard**.","Tables/Queries: **Table: tblCustomer**. Click **>>** to move all fields across › **Next**.","Layout: **Columnar** › **Next**.","Title: **frmCustomer**. Choose **Modify the form's design** › **Finish**. The form opens in Design view.","Press **F4** to open the Property Sheet. In the *Selection type* list choose **Form**, then on the **Format** tab set **Caption** to **Customers** (the title bar text; the object name stays frmCustomer).","**Ctrl+S**, then **Home › View › Form View** to try it."]},{"t":"example","title":"Tutorial: Create frmProduct the same way","steps":["**Create › Form Wizard** › **Table: tblProduct** › **>>** › Next › **Columnar** › Next › title **frmProduct** › Finish.","Set the form's **Caption** to **Products**. Notice Category is already a drop-down: forms inherit lookups, input masks and validation from the table."]},{"t":"table","head":["View","Use it to","Can you edit data?"],"rows":[["Form view","Use the form as staff will: enter, edit and browse records","Yes"],["[[Layout view]]","Resize and rearrange controls while seeing real data; change fonts and colours","No"],["[[Design view]]","Full control: add any control, set properties, write event code, use header/footer sections","No"]],"caption":"Form views"},{"t":"tip","text":"The quickest form of all is **Create › Form**: select a table in the Navigation Pane first and Access builds a form instantly. Use the wizard when you want to choose fields or a layout."},{"t":"warn","text":"The wizard puts controls in a *stacked layout*, so moving one moves them all. To place controls freely in Design view, select them all (Ctrl+A) and click **Arrange › Remove Layout**."},{"t":"key","title":"Check it works","items":["Open frmCustomer in Form view and use the navigation buttons at the bottom to move through the 5 customers.","Click the **New (blank) record** button (▶*) and add a customer; check it appears in tblCustomer.","In frmProduct type a price of 0: your table validation text appears."]}],"diagram":{"kind":"compare","title":"The three form views","caption":"Toggle between the views of frmCustomer.","states":[{"label":"Form view","points":["What staff see","Type and edit data","Navigation buttons move between records","Buttons and VBA run"],"art":null},{"label":"Layout view","points":["Real data is shown","Drag edges to resize controls","Change fonts, colours and themes","Cannot type data"],"art":null},{"label":"Design view","points":["Form Header, Detail and Form Footer sections","Add any control from the Controls gallery","Property Sheet (F4) for every setting","Event procedures for VBA"],"art":null}]},"check":[{"q":"Which view should you use to write VBA for a button?","o":["Design view","Form view","Layout view","Datasheet view"],"a":0,"why":"Event properties and the code builder are reached from Design view."},{"q":"You changed the form's Caption to 'Customers'. What changes?","o":["The form's name in the Navigation Pane","The table name","The record source","The text in the form's title bar or tab"],"a":3,"why":"Caption is display text; the object name stays frmCustomer."},{"q":"Why does frmProduct reject a price of 0 even though you didn't add any validation to the form?","o":["The wizard adds validation","Currency can't be 0","Forms inherit field validation rules from the table","The form is in Layout view"],"a":2,"why":"Table-level validation applies wherever the data is entered."}],"exam":[],"practice":[{"q":"Try it yourself: make a form **frmProductList** that shows all products as a list, one per row, for quickly checking stock.","m":3,"a":"Create › Form Wizard › Table: tblProduct › choose ProductID, Description, Category, Price, StockLevel, ReorderLevel › Next › Tabular › Next › title frmProductList › Open the form. (Alternatively select tblProduct and use Create › More Forms › Multiple Items.) Set Caption 'Product list'. In Form view each product is one row; you can scroll through all of them."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Form","Layout view","Design view"]},{"id":"c04-p02","spec":"Work with controls, labels, text boxes and the Property Sheet in Design view","lessons":["AD04"],"summary":"Tidy frmCustomer in Design view: name every control, add a heading, lock the ID and set the tab order.","blocks":[{"t":"p","text":"Everything on a form is a [[control|Control]]: labels, text boxes, buttons, combo boxes. A [[bound control|Bound control]] shows a field from the form's record source; an [[unbound control|Unbound control]] does not (a heading, a search box). Every control has properties in the [[Property Sheet]] — and a sensible **Name**, because VBA refers to controls by name."},{"t":"key","title":"You will need / By the end","items":["frmCustomer from the previous page.","By the end its controls are named txtCustomerID, txtFirstName, … and the form has a proper heading."]},{"t":"example","title":"Tutorial: Rename the controls","steps":["Open **frmCustomer** in **Design view**. Press **F4** for the Property Sheet.","Click the **FirstName** text box (the white box, not its label). On the **Other** tab change **Name** from *FirstName* to **txtFirstName**. The **Data** tab's *Control Source* stays **FirstName** — that is the field it is bound to.","Rename the others the same way: **txtCustomerID**, **txtSurname**, **txtPhone**, **txtEmail**, **txtPostcode**.","Select **txtCustomerID**: set **Locked** Yes, **Tab Stop** No and **Back Style** Transparent (Data, Other and Format tabs), so nobody tries to type an AutoNumber."]},{"t":"example","title":"Tutorial: Add a heading and set the tab order","steps":["If there is no Form Header, right-click the form background › **Form Header/Footer**.","**Form Design › Controls › Label** (Aa). Click in the Form Header and type **Riverside Bikes – Customers**. Set Font Size 16, Bold (Format tab).","**Form Design › Tab Order** › **Auto Order** › OK, then check the order is CustomerID, FirstName, Surname, Phone, Email, Postcode.","**Ctrl+S** and test in Form view: Tab moves through the fields in a sensible order and skips CustomerID."]},{"t":"table","head":["Prefix","Control","Example"],"rows":[["lbl","Label","lblTitle"],["txt","Text box","txtSurname, txtLineTotal"],["cbo","Combo box","cboProduct, cboCustomer"],["lst","List box","lstLowStock"],["cmd","Command button","cmdSave"],["chk","Check box","chkMarketing"],["sfrm","Subform control","sfrmOrderLine"]],"caption":"Control naming"},{"t":"table","head":["Property (tab)","What it does"],"rows":[["Name (Other)","The name VBA uses: Me.txtSurname"],["Control Source (Data)","The field it is bound to, or an expression starting with = for a calculated control"],["Format / Decimal Places (Format)","How the value is displayed, e.g. Currency"],["Default Value / Validation Rule (Data)","Form-level defaults and checks (table rules still apply)"],["Locked / Enabled (Data)","Locked = can't change; Enabled No = greyed out and can't click"],["Visible (Format)","Hide a control that holds a value you need but users needn't see"],["Tab Stop / Tab Index (Other)","Whether and in which order Tab visits it"]],"caption":"Properties you will use most"},{"t":"warn","text":"**#Name?** in a text box means its Control Source names a field or control that doesn't exist (often a typo, or a field not in the form's record source). **#Error** means a calculation failed — often because a calculated text box is named the same as a field it uses, e.g. a box called *Quantity* containing =[Quantity]*[Price]."},{"t":"key","title":"Check it works","items":["In Form view the heading shows, Tab skips the ID, and each control's Name in the Property Sheet starts with txt.","Type a letter into CustomerID: nothing happens because it is locked."]}],"diagram":{"kind":"hotspot","title":"Form Design view","caption":"Click each part of the Design view workspace.","rows":[[{"label":"Controls gallery","detail":"Form Design tab: Label, Text Box, Button, Combo Box, List Box, Subform/Subreport. 'Use Control Wizards' toggles the wizards.","span":2},{"label":"Add Existing Fields","detail":"Opens the Field List: drag a field onto the form to create a bound control with a label.","span":1},{"label":"Property Sheet (F4)","detail":"Format, Data, Event, Other and All tabs for whatever is selected.","span":1}],[{"label":"Form Header","detail":"Top of every page: titles, logos, search boxes.","span":3},{"label":"Selection type","detail":"The drop-down at the top of the Property Sheet: choose Form to set form-wide properties.","span":1}],[{"label":"Detail section","detail":"Repeats for each record: the bound text boxes and their labels.","span":4}],[{"label":"Form Footer","detail":"Bottom of the form: buttons, totals in a continuous form.","span":4}]],"links":[["Property Sheet (F4)","Selection type"]]},"check":[{"q":"A text box shows #Name? in Form view. What is the most likely cause?","o":["The record is new","Its Control Source names a field that does not exist","The form is not trusted","The value is too long"],"a":1,"why":"#Name? means Access can't find the name used in the Control Source."},{"q":"Which property does VBA use to refer to a control?","o":["Name","Caption","Control Source","Tag"],"a":0,"why":"Code such as Me.txtSurname uses the control's Name."},{"q":"Which kind of control is a heading label in the Form Header?","o":["Bound","Calculated","Subform","Unbound"],"a":3,"why":"It is not linked to any field."}],"exam":[],"practice":[{"q":"Try it yourself: on frmProduct rename the controls (txtProductID, txtDescription, cboCategory, txtPrice, txtStockLevel, txtReorderLevel), add a heading, and stop users changing the ProductID of an existing product while still allowing it for a new one.","m":4,"a":"Design view › F4 › rename each control on the Other tab (Category is a combo box, so cboCategory). Form Header label 'Riverside Bikes – Products'. For the ID, Locked on its own would stop new products too, so use VBA in the form's On Current event (Property Sheet › Form › Event › On Current › [Event Procedure]):\n\nPrivate Sub Form_Current()\n    ' lock the ID on existing products, unlock it on a new one\n    Me.txtProductID.Locked = Not Me.NewRecord\nEnd Sub\n\nOn an existing record Locked is True; on a new record it is False. Test by moving between records and to a new record."}],"videos":[{"title":"Development: building and evidencing the database application – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#AD04-video"}],"terms":["Control","Bound control","Unbound control","Property Sheet"]},{"id":"c04-p03","spec":"Add combo boxes and list boxes that take their values from a table","lessons":["AD04"],"summary":"Build frmOrder with a customer combo box, and a stock-check form with a list box of low-stock products.","blocks":[{"t":"p","text":"A [[combo box|Combo box]] is a drop-down list; a [[list box|List box]] shows the list all the time. Both take their items from a **Row Source** (a table, query or SQL) and store the value from their **[[bound column|Bound column]]**. On the order form staff pick a customer by name, but the combo stores the CustomerID."},{"t":"key","title":"You will need / By the end","items":["tblOrder and tblCustomer; qryLowStock.","By the end **frmOrder** has **cboCustomer**, and **frmStockCheck** lists low-stock items."]},{"t":"example","title":"Tutorial: Create frmOrder","steps":["**Create › Form Wizard** › **Table: tblOrder** › **>>** › Next › **Columnar** › Next › title **frmOrder** › *Modify the form's design* › Finish.","Set the form's Caption to **Orders**. Rename the controls **txtOrderID** (Locked Yes, Tab Stop No), **txtOrderDate** and **cboStatus**.","Delete the **CustomerID** control (click it, press Delete) — you replace it with a combo box next.","Leave space below the controls for the order lines (next page). **Ctrl+S**."]},{"t":"example","title":"Tutorial: Add cboCustomer with the Combo Box Wizard","steps":["Check **Use Control Wizards** is on (Form Design › Controls › click the gallery's ▾ to see it).","**Form Design › Controls › Combo Box**, then draw it where CustomerID was.","Choose **I want the combo box to get the values from another table or query** › Next › **Table: tblCustomer** › Next.","Move **CustomerID**, **Surname**, **FirstName** and **Postcode** across › Next. Sort by **Surname** then **FirstName** › Next.","Keep **Hide key column (recommended)** ticked; widen the columns › Next.","Choose **Store that value in this field:** **CustomerID** › Next. Label **Customer** › Finish.","In the Property Sheet set **Name** to **cboCustomer** and check the settings in the table below. **Ctrl+S**."]},{"t":"table","head":["Property","cboCustomer setting","Meaning"],"rows":[["Control Source","CustomerID","The field in tblOrder that the chosen value is saved into"],["Row Source","SELECT CustomerID, Surname, FirstName, Postcode FROM tblCustomer ORDER BY Surname, FirstName;","Where the list comes from"],["Column Count","4","Number of columns in the list"],["Column Widths","0cm;3cm;3cm;2cm","0 hides the ID column"],["Bound Column","1","The column whose value is stored (CustomerID)"],["Limit To List","Yes","Only listed customers can be chosen"]],"caption":"Combo box properties"},{"t":"example","title":"Tutorial: Create frmStockCheck with a list box","steps":["**Create › Form
