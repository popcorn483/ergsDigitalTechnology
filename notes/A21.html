 new surrogate key such as LoanID."],"ordered":true},{"t":"table","head":["Before","After"],"rows":[["Pupil  >———<  Course (M:N)","Pupil  —<  Enrolment  >—  Course"],["Pupil(PupilID, Surname, Forename)","Pupil(PupilID, Surname, Forename)"],["Course(CourseID, Title, Level)","Course(CourseID, Title, Level)"],["(nowhere to store the link)","Enrolment(PupilID*, CourseID*, StartDate, Grade)"]],"caption":"Resolving Pupil–Course"},{"t":"example","title":"Worked example: library loans","steps":["Rule: a member borrows many books over time; a book is borrowed by many members over time → Member M:N Book.","Insert link entity Loan between them: Member 1 —< Loan >— 1 Book.","Key choice: (MemberID, BookID) is not unique, because a member may borrow the same book again next year.","So use Loan(LoanID, MemberID*, BookID*, DateOut, DateDue, DateReturned), or the composite (MemberID, BookID, DateOut)."],"answer":"Two 1:M relationships, and loan-specific facts (dates) now have a home."},{"t":"key","title":"Key points","items":["M:N cannot be implemented because a field cannot hold a list of keys.","Insert a link entity → two 1:M relationships, crow's feet at the link entity.","Link entity key = composite of the two foreign keys (plus a date if pairs repeat), or a new surrogate key.","Facts about the pairing (grade, date, quantity) belong in the link entity."]},{"t":"tip","text":"For 'explain why a link entity is needed', the two marks are: an M:N relationship cannot be implemented directly in a relational database (1) / the link entity turns it into two 1:M relationships (1)."}],"diagram":{"kind":"compare","title":"Resolving Pupil M:N Course","caption":"Toggle between the conceptual M:N design and the implemented design with a link entity.","states":[{"label":"Before: M:N","art":null,"points":["Pupil >——< Course","A pupil studies many courses","A course has many pupils","No single field can hold the list of links","Cannot be implemented as tables"]},{"label":"After: link entity","art":null,"points":["Pupil —< Enrolment >— Course","Enrolment(PupilID*, CourseID*, StartDate, Grade)","Composite key = both foreign keys","Two 1:M relationships","Grade now stored once per pupil per course"]}]},"check":[{"q":"Why can an M:N relationship not be implemented directly in a relational database?","o":["Tables cannot have more than one foreign key","Primary keys must be numeric","SQL cannot join tables","A field cannot hold a list of key values"],"a":3,"why":"Fields must be atomic, so a list of links has nowhere to go."},{"q":"After resolving Member M:N Book with a Loan entity, where do the crow's feet go?","o":["At Member and Book","At Member only","At Loan, on both lines","At Book only"],"a":2,"why":"The link entity is at the 'many' end of both new relationships."},{"q":"Which attribute belongs in the link entity Enrolment rather than in Pupil or Course?","o":["Surname","Grade achieved on that course","CourseTitle","Room number of the course"],"a":1,"why":"A grade depends on both the pupil and the course."}],"exam":[],"practice":[{"q":"A Portadown football club has players and matches. A player plays in many matches and each match has many players. The club wants to record the minutes each player played in each match. Explain how this relationship should be implemented and write entity descriptions for the tables.","m":5,"a":"The relationship is M:N, which cannot be implemented directly (1) / insert a link entity, e.g. Appearance (1) / Player(PlayerID, Name, …) and Match(MatchID, MatchDate, Opponent) (1) / Appearance(PlayerID*, MatchID*, MinutesPlayed) (1) with composite key (PlayerID, MatchID) identified (1)."}],"videos":[{"title":"Entity-relationship modelling – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS02-video"},{"title":"AQA A Level SLR23 – Databases","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1638"}],"terms":["Link entity","Composite key","Atomic"]},{"id":"c01-p08","spec":"Explain the purpose of normalisation","lessons":["IS03"],"summary":"Normalisation organises attributes into relations so each fact is stored once, removing redundancy and the update, insertion and deletion anomalies it causes.","blocks":[{"t":"p","text":"[[Normalisation]] is a formal, step-by-step process for deciding which attributes belong in which table. Its aim is a set of relations in which every fact is stored once, every non-key attribute depends on the key, and the database can be changed without contradiction."},{"t":"h","text":"The three anomalies it prevents"},{"t":"p","text":"Consider one unnormalised table of orders for a Fermanagh farm-shop delivery service:"},{"t":"table","head":["OrderNo","CustID","CustName","ProductID","ProductName","UnitPrice","Qty"],"rows":[["5001","C12","Niamh Maguire","P03","Free-range eggs (12)","3.20","2"],["5001","C12","Niamh Maguire","P07","Soda bread","2.10","1"],["5002","C15","Ciarán Doherty","P03","Free-range eggs (12)","3.20","1"]],"caption":"Repeated customer and product details"},{"t":"list","items":["**[[Update anomaly]]** – the price of eggs is stored in two rows. If it rises to £3.40 and only one row is changed, the table holds two prices for the same product.","**[[Insertion anomaly]]** – a new product (say, honey) cannot be recorded until somebody orders it, because every row needs an OrderNo.","**[[Deletion anomaly]]** – if order 5002 is cancelled and its row deleted, all record of the customer Ciarán Doherty is lost."],"ordered":false},{"t":"h","text":"Benefits of a normalised design"},{"t":"list","items":["Minimal [[Data redundancy]] – less storage and, more importantly, no inconsistent copies.","Updates happen in one place, so data integrity is easier to maintain.","Tables represent single subjects, so the structure is easier to understand and extend.","Smaller tables with clear keys support flexible SQL queries."],"ordered":false},{"t":"p","text":"Normalisation does have a cost: more tables means queries need more joins. For read-heavy reporting systems such as data warehouses, designers sometimes *denormalise* deliberately to make queries faster – a trade-off you may be asked to evaluate."},{"t":"key","title":"Key points","items":["Purpose: minimise redundancy so each fact is held once.","Prevents update, insertion and deletion anomalies.","Result: every non-key attribute depends on the key, the whole key and nothing but the key.","Trade-off: more joins; sometimes denormalised for analysis."]},{"t":"tip","text":"When asked for 'reasons to normalise', give two different anomalies or benefits with a consequence, not 'reduce redundancy' twice in different words."}],"diagram":{"kind":"match","title":"Name that anomaly","caption":"Match each problem in an unnormalised orders table to the anomaly it illustrates.","pairs":[["Changing a price in one row but not another","Update anomaly"],["Cannot add a product until it is ordered","Insertion anomaly"],["Deleting an order loses the customer's details","Deletion anomaly"],["Same customer name stored on every order","Data redundancy"],["Two rows show two prices for one product","Data inconsistency"]]},"check":[{"q":"A new tutor cannot be entered into a database until they are assigned a class. This is…","o":["an insertion anomaly","an update anomaly","a deletion anomaly","referential integrity"],"a":0,"why":"Being unable to add data because unrelated data is missing is an insertion anomaly."},{"q":"Which is the main purpose of normalisation?","o":["To make every table as large as possible","To encrypt the data","To remove the need for primary keys","To minimise data redundancy and prevent anomalies"],"a":3,"why":"Normalisation removes unnecessary duplication and the anomalies it causes."},{"q":"Which is a valid drawback of a highly normalised design?","o":["More data redundancy","More update anomalies","Queries may need many joins, which can be slower","Primary keys are not allowed"],"a":2,"why":"More tables means more joins for combined views."}],"exam":[],"practice":[{"q":"State two reasons why data is normalised.","m":2,"a":"To minimise data redundancy (1) / to prevent update/insertion/deletion anomalies (1) / to maintain data consistency/integrity (1). Any two."},{"q":"Explain what is meant by a deletion anomaly, using an example.","m":2,"a":"Deleting a record removes other useful data that is not stored anywhere else (1) e.g. deleting a pupil's only club membership row also deletes the only record of the club's meeting room (1)."}],"videos":[{"title":"Normalisation to third normal form – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS03-video"},{"title":"AQA A Level SLR23 – Normalisation to 3NF","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr23-normalisation-to-3nf/"}],"terms":["Normalisation","Update anomaly","Insertion anomaly","Deletion anomaly","Data redundancy"]},{"id":"c01-p09","spec":"Normalise data from un-normalised form (0NF) to first, second and third normal form","lessons":["IS03"],"summary":"Start in 0NF by listing all attributes and the repeating group; reach 1NF by moving the repeating group into its own table with the original key, giving a composite key.","blocks":[{"t":"p","text":"You will be given a source document – an order form, a timetable, a report – and asked to normalise it, showing every stage. This page covers the first two stages; the next page completes the process."},{"t":"h","text":"Stage 0: un-normalised form (0NF)"},{"t":"list","items":["List **every** attribute on the document (leave out calculated values such as line totals and order totals – they can be derived).","Choose a key that identifies the whole document, e.g. OrderNo.","Identify the [[Repeating group]]: attributes that occur several times for one value of the key. Show them in braces { }."],"ordered":true},{"t":"code","lang":"sql","code":"Order(OrderNo, OrderDate, CustID, CustName, CustTown,\n      {ProductID, ProductName, UnitPrice, Qty})","title":"Fermanagh Fresh order form in 0NF"},{"t":"h","text":"Stage 1: first normal form (1NF)"},{"t":"p","text":"**Rule:** no repeating groups, and every attribute is [[Atomic]] (holds one value)."},{"t":"list","items":["Remove the repeating group into a new table.","**Take the original key with it** – OrderNo goes into the new table so each line still belongs to its order.","Choose a key for the new table: normally the original key plus the key of the repeating group, giving a [[Composite key]]."],"ordered":true},{"t":"code","lang":"sql","code":"Order(OrderNo, OrderDate, CustID, CustName, CustTown)\nOrderLine(OrderNo*, ProductID, ProductName, UnitPrice, Qty)\n  -- primary key of OrderLine is (OrderNo, ProductID)","title":"1NF"},{"t":"p","text":"Each table is now a proper relation: one value per cell, and every row identified by its key. But there is still redundancy – ProductName and UnitPrice repeat on every line for that product, and CustName repeats on every order by that customer. Second and third normal form deal with those."},{"t":"warn","text":"The most common lost mark at 1NF is forgetting to carry the original key (OrderNo) into the new table. Without it, the order lines are cut adrift from their orders."},{"t":"key","title":"Key points","items":["0NF: list all attributes, choose a key, put the repeating group in { }.","1NF: no repeating groups; atomic values.","Move the repeating group out, carrying the original key; new table gets a composite key.","Leave out derived values such as totals."]},{"t":"tip","text":"Count your attributes at 0NF and check that every one appears in your final tables – losing an attribute costs marks at each stage."}],"diagram":{"kind":"table-reveal","title":"From 0NF to 1NF, step by step","caption":"Reveal each cell to check your own working before moving on to 2NF.","head":["Stage","Table","Attributes (key first; * = foreign key)","What was done"],"rows":[["0NF","Order","OrderNo, OrderDate, CustID, CustName, CustTown, {ProductID, ProductName, UnitPrice, Qty}","All attributes listed; key OrderNo; repeating group in braces"],["1NF","Order","OrderNo, OrderDate, CustID, CustName, CustTown","Repeating group removed"],["1NF","OrderLine","OrderNo*, ProductID, ProductName, UnitPrice, Qty","Repeating group moved here with OrderNo; key (OrderNo, ProductID)"]],"hidden":[[0,3],[1,2],[1,3],[2,2],[2,3]]},"check":[{"q":"What is a repeating group?","o":["A field that is a foreign key","Attributes that occur several times for one value of the key","Two tables with the same primary key","A field holding a calculated value"],"a":1,"why":"A repeating group is a set of attributes with multiple values per key."},{"q":"When moving the repeating group to a new table at 1NF, what must go with it?","o":["The original table's primary key","Nothing else","All the other attributes","A calculated total"],"a":0,"why":"The original key links each row back to its parent."},{"q":"Why are values such as LineTotal normally left out when normalising?","o":["They are not atomic","They are foreign keys","SQL cannot store decimals","They can be calculated from other attributes"],"a":3,"why":"Derived data can be calculated when needed, so storing it adds redundancy."}],"exam":[],"practice":[{"q":"Student(StudentID, Name, {CourseCode, CourseTitle, TutorID, TutorName, Grade}). Show this data in first normal form.","m":3,"a":"Student(StudentID, Name) (1) / StudentCourse(StudentID*, CourseCode, CourseTitle, TutorID, TutorName, Grade) (1) / composite key (StudentID, CourseCode) identified (1)."}],"videos":[{"title":"Normalisation to third normal form – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS03-video"},{"title":"OCR A Level SLR10 – Normalisation to 3NF","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-normalisation-to-3nf/"},{"title":"OCR A Level SLR10 – Normalisation to 3NF revisited","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-normalisation-to-3nf-2/"}],"terms":["Repeating group","Atomic","First normal form (1NF)","Composite key"]},{"id":"c01-p10","spec":"Normalise data from un-normalised form (0NF) to first, second and third normal form","lessons":["IS03"],"summary":"2NF removes partial dependencies on part of a composite key; 3NF removes transitive dependencies between non-key attributes, leaving every attribute dependent on the key, the whole key and nothing but the key.","blocks":[{"t":"h","text":"Stage 2: second normal form (2NF)"},{"t":"p","text":"**Rule:** in 1NF and no [[partial dependencies|Partial dependency]] – no non-key attribute depends on only *part* of a composite key."},{"t":"p","text":"Test each non-key attribute in OrderLine(OrderNo, ProductID, ProductName, UnitPrice, Qty): does it need the whole key?"},{"t":"list","items":["ProductName – depends on ProductID alone → partial dependency.","UnitPrice – depends on ProductID alone → partial dependency.","Qty – needs both: how many of *this* product on *this* order → stays."],"ordered":false},{"t":"code","lang":"sql","code":"Order(OrderNo, OrderDate, CustID, CustName, CustTown)   -- single key: already 2NF\nOrderLine(OrderNo*, ProductID*, Qty)\nProduct(ProductID, ProductName, UnitPrice)","title":"2NF"},{"t":"p","text":"A table whose primary key is a single attribute cannot have a partial dependency, so it is automatically in 2NF once it is in 1NF."},{"t":"h","text":"Stage 3: third normal form (3NF)"},{"t":"p","text":"**Rule:** in 2NF and no [[transitive dependencies|Transitive dependency]] – no non-key attribute depends on another non-key attribute."},{"t":"p","text":"In Order, CustName and CustTown depend on CustID, which is not the key. OrderNo → CustID → CustName is a transitive chain. Move them into their own table, keyed by CustID, and **leave CustID behind** in Order as a foreign key."},{"t":"code","lang":"sql","code":"Customer(CustID, CustName, CustTown)\nOrder(OrderNo, OrderDate, CustID*)\nProduct(ProductID, ProductName, UnitPrice)\nOrderLine(OrderNo*, ProductID*, Qty)","title":"3NF – final design"},{"t":"example","title":"Check the final design","steps":["Attributes at 0NF: 9. Attributes in 3NF (ignoring repeated foreign keys): OrderNo, OrderDate, CustID, CustName, CustTown, ProductID, ProductName, UnitPrice, Qty = 9. None lost.","Every table has a primary key; every link has a foreign key.","The egg price is now held once, in Product; Ciarán's details survive if his order is deleted; honey can be added to Product before anyone orders it."],"answer":"All three anomalies from the previous page are gone."},{"t":"note","text":"If the price a customer actually paid must be kept even after the catalogue price changes, store PriceCharged in OrderLine. That is not redundancy: it records a different fact (the historic price) that depends on the whole key."},{"t":"key","title":"Key points","items":["2NF: remove partial dependencies (only possible with a composite key).","3NF: remove transitive dependencies (non-key → non-key); leave the determinant behind as a foreign key.","Every non-key attribute depends on the key, the whole key and nothing but the key."]},{"t":"warn","text":"At 3NF students often move CustName and CustTown out but forget to leave CustID in Order. Without the foreign key, orders can no longer be linked to customers."}],"diagram":{"kind":"table-reveal","title":"From 1NF to 3NF, step by step","caption":"Reveal the tables and reasons at each stage. Primary key first; * marks a foreign key.","head":["Stage","Table","Attributes","Reason"],"rows":[["2NF","OrderLine","OrderNo*, ProductID*, Qty","Qty depends on the whole composite key"],["2NF","Product","ProductID, ProductName, UnitPrice","Partial dependency on ProductID removed"],["2NF","Order","OrderNo, OrderDate, CustID, CustName, CustTown","Single-attribute key, so already in 2NF"],["3NF","Customer","CustID, CustName, CustTown","Transitive dependency via CustID removed"],["3NF","Order","OrderNo, OrderDate, CustID*","CustID stays as foreign key"],["3NF","Product, OrderLine","Unchanged","No transitive dependencies"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,3],[3,2],[3,3],[4,2],[4,3],[5,3]]},"check":[{"q":"Which table can contain a partial dependency?","o":["Only a table with a single-field key","Any table with a foreign key","Only a table with a composite primary key","Only a table in 3NF"],"a":2,"why":"Partial means dependent on part of the key, so the key must have parts."},{"q":"Order(OrderNo, OrderDate, CustID, CustName). CustName depends on CustID. This is a…","o":["partial dependency","transitive dependency","repeating group","composite key"],"a":1,"why":"A non-key attribute depending on another non-key attribute is transitive."},{"q":"When removing a transitive dependency, what must remain in the original table?","o":["The determinant (e.g. CustID) as a foreign key","Nothing","All the moved attributes","A new composite key"],"a":0,"why":"The determinant stays to link the tables."}],"exam":[],"practice":[{"q":"Student(StudentID, Name, {CourseCode, CourseTitle, TutorID, TutorName, Grade}). Each course has one tutor. Normalise this relation to third normal form, showing each stage.","m":6,"a":"1NF: Student(StudentID, Name); StudentCourse(StudentID*, CourseCode, CourseTitle, TutorID, TutorName, Grade) with key (StudentID, CourseCode) (1). 2NF: CourseTitle, TutorID and TutorName depend only on CourseCode (1) → Course(CourseCode, CourseTitle, TutorID, TutorName); StudentCourse(StudentID*, CourseCode*, Grade) (1). 3NF: TutorName depends on TutorID, a non-key attribute (1) → Tutor(TutorID, TutorName); Course(CourseCode, CourseTitle, TutorID*) (1). Keys underlined/foreign keys marked correctly throughout (1)."}],"videos":[{"title":"Normalisation to third normal form – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS03-video"},{"title":"OCR A Level SLR10 – Normalisation to 3NF","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-normalisation-to-3nf/"},{"title":"AQA A Level SLR23 – Normalisation to 3NF","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr23-normalisation-to-3nf/"}],"terms":["Partial dependency","Transitive dependency","Second normal form (2NF)","Third normal form (3NF)"]},{"id":"c01-p11","spec":"Identify partial and transitive dependencies","lessons":["IS03"],"summary":"A functional dependency A → B means A determines B; it is partial if B depends on only part of a composite key and transitive if B depends on a non-key attribute.","blocks":[{"t":"h","text":"Functional dependency"},{"t":"p","text":"Attribute B is [[functionally dependent|Functional dependency]] on attribute A (written A → B) if each value of A is associated with exactly one value of B. ProductID → ProductName: knowing the product ID tells you its name. A is called the *determinant*."},{"t":"h","text":"Partial dependency"},{"t":"p","text":"A [[Partial dependency]] exists when a non-key attribute depends on only part of a [[Composite key]]. It can only occur when the key has two or more attributes."},{"t":"p","text":"In Enrolment(PupilID, CourseID, PupilSurname, Grade): Grade needs both parts of the key, but PupilSurname depends on PupilID alone – a partial dependency."},{"t":"h","text":"Transitive dependency"},{"t":"p","text":"A [[Transitive dependency]] exists when a non-key attribute depends on another non-key attribute, which in turn depends on the key: Key → X → Y. Y depends on the key only *through* X."},{"t":"p","text":"In Pupil(PupilID, Surname, FormID, FormRoom): PupilID → FormID and FormID → FormRoom, so FormRoom depends transitively on PupilID."},{"t":"table","head":["Ask this of each non-key attribute","If the answer is…","Then"],"rows":[["Does it depend on the whole key?","No – only part of it","Partial dependency → fix for 2NF"],["Does it depend on another non-key attribute?","Yes","Transitive dependency → fix for 3NF"],["Neither problem?","It depends on the key, the whole key and nothing but the key","Fully dependent – leave it"]]},{"t":"example","title":"Worked example: hotel bookings","steps":["Booking(RoomNo, ArrivalDate, GuestID, GuestName, RoomType, NightlyRate, Nights). Key: (RoomNo, ArrivalDate).","RoomType depends on RoomNo only → partial.","NightlyRate depends on RoomType (non-key) → transitive (once RoomType is moved, it is transitive within Room).","GuestName depends on GuestID (non-key) → transitive.","GuestID and Nights depend on the whole key → fully dependent."],"answer":"Room(RoomNo, RoomType*), RoomRate(RoomType, NightlyRate), Guest(GuestID, GuestName), Booking(RoomNo*, ArrivalDate, GuestID*, Nights)"},{"t":"key","title":"Key points","items":["A → B: A determines B.","Partial: non-key attribute depends on part of a composite key.","Transitive: non-key attribute depends on another non-key attribute.","Fully dependent: on the key, the whole key and nothing but the key."]},{"t":"tip","text":"When explaining a step, name the dependency and the attributes involved: 'RoomType depends only on RoomNo, which is part of the composite key, so it is a partial dependency'."}],"diagram":{"kind":"table-reveal","title":"Partial, transitive or fully dependent?","caption":"Booking(RoomNo, ArrivalDate, GuestID, GuestName, RoomType, NightlyRate, Nights) with composite key (RoomNo, ArrivalDate). Reveal the classification of each attribute.","head":["Attribute","Determined by","Classification"],"rows":[["GuestID","(RoomNo, ArrivalDate)","Fully dependent"],["Nights","(RoomNo, ArrivalDate)","Fully dependent"],["RoomType","RoomNo only","Partial dependency"],["NightlyRate","RoomType","Transitive (via a non-key attribute)"],["GuestName","GuestID","Transitive (via a non-key attribute)"]],"hidden":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]]},"check":[{"q":"Result(StudentID, ModuleID, StudentName, Mark). StudentName is…","o":["fully dependent","transitively dependent","a candidate key","partially dependent"],"a":3,"why":"It depends on StudentID only – part of the composite key."},{"q":"Car(Reg, Model, Manufacturer, ManufacturerCountry). ManufacturerCountry is…","o":["partially dependent","fully dependent","transitively dependent on Reg via Manufacturer","a repeating group"],"a":2,"why":"Reg → Manufacturer → ManufacturerCountry."},{"q":"Which kind of table can never contain a partial dependency?","o":["One with a composite key","One with a single-attribute primary key","Any table in 1NF","A link table"],"a":1,"why":"There is no 'part' of a single-attribute key."}],"exam":[],"practice":[{"q":"Define a transitive dependency and give an example.","m":2,"a":"A non-key attribute depends on another non-key attribute rather than directly on the primary key (1) e.g. in Pupil(PupilID, FormID, FormRoom), FormRoom depends on FormID (1)."},{"q":"Lesson(TutorID, LessonDate, TutorName, PupilID, PupilName). Primary key (TutorID, LessonDate). Identify one partial and one transitive dependency.","m":2,"a":"Partial: TutorName depends on TutorID only (1). Transitive: PupilName depends on PupilID, a non-key attribute (1)."}],"videos":[{"title":"Normalisation to third normal form – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS03-video"},{"title":"OCR A Level SLR10 – Normalisation to 3NF revisited","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-normalisation-to-3nf-2/"}],"terms":["Functional dependency","Partial dependency","Transitive dependency","Composite key"]},{"id":"c01-p12","spec":"Describe the purpose and contents of a data dictionary","lessons":["IS04"],"summary":"A data dictionary is the central store of metadata – tables, fields, types, keys, rules, indexes, relationships and permissions – used by developers to understand the database and by the DBMS to enforce rules.","blocks":[{"t":"p","text":"A [[Data dictionary]] is a central store of [[Metadata]] – data about the data. It does not hold the customers or orders themselves; it holds the description of how they are stored and the rules they must obey."},{"t":"table","head":["Item recorded","Example entry"],"rows":[["Table names and descriptions","Customer – one row per account holder"],["Field names","Customer.CustTown"],["Data type and size / format","VARCHAR(30); DATE in YYYY-MM-DD"],["Primary and foreign keys","CustID is the primary key; Order.CustID references Customer"],["Validation rules and default values","Qty > 0; Country defaults to 'UK'"],["Whether a field is required","CustName NOT NULL"],["Indexes","Index on Customer.Surname"],["Relationships","Customer 1:M Order"],["Users and access rights","Reception role: SELECT only on Booking"]]},{"t":"h","text":"Who uses it and why"},{"t":"list","items":["**The DBMS** reads it constantly – to check that a field exists, that a value meets its type and rule, that a user has permission, and to choose an index when running a query.","**Developers** use it to understand the structure, keep field names and types consistent across programs, and avoid creating duplicate fields with different names.","**Database administrators** use it to manage security, plan changes and assess the impact of altering a field.","**Maintenance teams** use it as documentation when the original designers have left."],"ordered":false},{"t":"p","text":"Because every rule is defined once, in the dictionary, every application that uses the database obeys the same rules – one of the main reasons a DBMS improves [[Data integrity]]."},{"t":"note","text":"In a DBMS the 'active' data dictionary (sometimes called the system catalogue) is maintained automatically as tables are created. A designer's paper or spreadsheet data dictionary in a design document is a planning version of the same information."},{"t":"key","title":"Key points","items":["Data dictionary = metadata about the database, not the data itself.","Contents: tables, fields, types/sizes, keys, validation, defaults, indexes, relationships, users/permissions.","Used by the DBMS to enforce rules and by people to understand and maintain the database."]},{"t":"tip","text":"'State three items of metadata' – give three distinct items (field name, data type, validation rule), not three examples of one item."}],"diagram":{"kind":"table-reveal","title":"A data dictionary extract","caption":"Entries for a Customer table. Reveal the missing metadata to test yourself.","head":["Field","Data type","Size","Key","Validation / rule"],"rows":[["CustID","VARCHAR","6","Primary key","Required; format C followed by digits"],["CustName","VARCHAR","40","–","Required (NOT NULL)"],["CustTown","VARCHAR","30","–","Optional"],["DateJoined","DATE","–","–","Not later than today"],["CreditLimit","DECIMAL","(7,2)","–","Between 0 and 5000; default 500"]],"hidden":[[0,3],[0,4],[1,4],[3,1],[3,4],[4,1],[4,4]]},"check":[{"q":"Which of these is NOT stored in a data dictionary?","o":["A customer's actual address","The data type of a field","A validation rule","The primary key of a table"],"a":0,"why":"The dictionary holds metadata, not the data values themselves."},{"q":"How does the DBMS use the data dictionary?","o":["To store backup copies","To encrypt data","To display web pages","To check requests against field definitions, rules and permissions"],"a":3,"why":"The DBMS refers to the metadata to enforce rules."},{"q":"What is metadata?","o":["Data that has been deleted","Data stored on a web server","Data that describes other data","Data with no primary key"],"a":2,"why":"Metadata is data about data."}],"exam":[],"practice":[{"q":"State three items of metadata held in a data dictionary.","m":3,"a":"Any three: field name (1) / data type (1) / field size (1) / primary/foreign key (1) / validation rule (1) / default value (1) / index (1) / relationships (1) / access rights (1)."},{"q":"Explain one way a data dictionary benefits the developers of a large database system.","m":2,"a":"It documents every field's name and type in one place (1) so developers use consistent names/types across programs and do not create duplicate or conflicting fields (1)."}],"videos":[{"title":"Data integrity: data dictionary, integrity rules, validation and indexing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS04-video"},{"title":"OCR A Level SLR10 – Introduction to database concepts","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-databases-part-1/"}],"terms":["Data dictionary","Metadata","Data integrity"]},{"id":"c01-p13","spec":"Explain entity integrity and referential integrity","lessons":["IS04"],"summary":"Entity integrity requires a unique, non-null primary key in every table; referential integrity requires every foreign key to match an existing primary key, enforced by restrict, cascade update or cascade delete.","blocks":[{"t":"p","text":"[[Data integrity]] means data is accurate, complete, consistent and valid throughout its life. Two rules built into every relational DBMS protect the structure of the data."},{"t":"h","text":"Entity integrity"},{"t":"list","items":["Every table must have a primary key.","Every primary key value must be **unique**.","No part of a primary key may be **null** (empty)."],"ordered":false},{"t":"p","text":"[[Entity integrity]] guarantees that every record can be identified and retrieved unambiguously. The DBMS rejects an INSERT that would create a duplicate or empty key."},{"t":"h","text":"Referential integrity"},{"t":"p","text":"[[Referential integrity]] requires that every foreign key value matches an existing primary key value in the related table (or is null, if the design allows the link to be optional). It prevents [[orphan records|Orphan record]] – child rows that point to a parent that does not exist, such as an order for customer C999 when there is no C999."},{"t":"p","text":"The DBMS must also decide what happens when a *parent* record is changed or deleted:"},{"t":"table","head":["Option","Effect when parent changes or is deleted","Suitable when…"],"rows":[["Restrict (no action)","The DBMS refuses to delete or re-key a parent that still has children","Children must never be lost, e.g. a customer with unpaid orders"],["[[Cascade delete]]","Deleting the parent automatically deletes all its child records","Children have no meaning alone, e.g. deleting an order deletes its order lines"],["Cascade update","Changing a parent's primary key value updates every matching foreign key","Keys may occasionally change, e.g. a product code is re-issued"],["Set null","Child foreign keys are set to null when the parent is deleted","The link is optional, e.g. a pupil's form tutor leaves"]]},{"t":"example","title":"Worked example: Customer and Order","steps":["Order.CustID is a foreign key referencing Customer.CustID.","A clerk tries to add Order 6001 for CustID 'C999'. No such customer exists → the DBMS rejects the insert (referential integrity).","The manager tries to delete customer C12, who has three orders. With *restrict*, the delete is refused; with *cascade delete*, C12 and the three orders are all removed.","Choice: for a business, losing order history is usually unacceptable, so restrict is chosen for Customer → Order, while cascade delete suits Order → OrderLine."],"answer":"The rule chosen should follow the business rules, not convenience."},{"t":"key","title":"Key points","items":["Entity integrity: primary key present, unique and never null.","Referential integrity: every foreign key matches an existing primary key (or is null if allowed) – no orphans.","Parent changes handled by restrict, cascade delete, cascade update or set null."]},{"t":"tip","text":"Explain the rule *in context*: 'referential integrity would stop an Order being added for a CustID that does not exist in Customer (1), so every order can be traced to a real customer (1)'."}],"diagram":{"kind":"compare","title":"Deleting a parent: restrict or cascade?","caption":"Customer C12 has three orders. Toggle to see what each referential-integrity option does when the manager deletes C12.","states":[{"label":"Restrict","art":null,"points":["DELETE of C12 is refused","Error: related records exist in Order","Orders must be dealt with first","No data lost by accident"]},{"label":"Cascade delete","art":null,"points":["C12 is deleted","All three of C12's orders are deleted automatically","Their order lines are deleted too if that link also cascades","Fast, but history is lost"]},{"label":"No integrity enforced","art":null,"points":["C12 is deleted","Three orders remain pointing to C12","These are orphan records","Reports cannot show who placed them"]}]},"check":[{"q":"Which rule is broken if two records in Pupil have the same PupilID?","o":["Referential integrity","Entity integrity","Cascade update","Data independence"],"a":1,"why":"Entity integrity requires unique primary keys."},{"q":"An OrderLine refers to ProductID P99, but no product P99 exists. This is…","o":["an orphan record breaking referential integrity","a composite key","a partial dependency","an index"],"a":0,"why":"The foreign key has no matching primary key."},{"q":"Which option automatically removes the child records when a parent is deleted?","o":["Restrict","Cascade update","Validation","Cascade delete"],"a":3,"why":"Cascade delete propagates the deletion."}],"exam":[],"practice":[{"q":"Explain what is meant by entity integrity.","m":2,"a":"Every table must have a primary key (1) whose values are unique and never null, so each record can be identified (1)."},{"q":"Describe the difference between cascade delete and restrict delete.","m":2,"a":"Cascade delete: deleting a parent automatically deletes its related child records (1). Restrict: the DBMS refuses to delete a parent while related child records exist (1)."}],"videos":[{"title":"Data integrity: data dictionary, integrity rules, validation and indexing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS04-video"},{"title":"OCR A Level SLR10 – Referential integrity","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-referential-integrity/"}],"terms":["Data integrity","Entity integrity","Referential integrity","Orphan record","Cascade delete"]},{"id":"c01-p14","spec":"Describe how validation maintains data integrity","lessons":["IS04"],"summary":"Validation rules defined in the DBMS automatically reject data that is missing, out of range, of the wrong type or format, or not in an allowed list; verification checks data matches its source.","blocks":[{"t":"p","text":"[[Validation]] is an automatic check, carried out by the computer when data is entered, that the data is *reasonable* and obeys the rules set for it. In a database, validation rules are held in the data dictionary and enforced by the DBMS on every insert and update, whichever program the data comes from."},{"t":"table","head":["Check","Purpose","Database example"],"rows":[["Presence","Field is not left empty","Surname NOT NULL"],["Range","Value lies between limits","Qty BETWEEN 1 AND 50"],["Type","Value is the correct data type","UnitPrice must be numeric"],["Length","Number of characters is within limits","MobileNo exactly 11 digits"],["Format (picture)","Value matches a pattern","Postcode like BT74 6AA"],["Lookup / list","Value is in a list or another table","Size IN ('S','M','L'); foreign key must exist"],["Check digit","A calculated digit detects keying errors in codes","ISBN-13 or a barcode"],["Cross-field","Fields are consistent with each other","DateReturned ≥ DateOut"]]},{"t":"h","text":"Validation is not verification"},{"t":"p","text":"[[Verification]] checks that data has been copied or entered *accurately* from its source – for example, typing an email address twice, or reading back details to a caller. Validation checks the data is *sensible*; verification checks it is *what was intended*."},{"t":"warn","text":"Neither check guarantees the data is correct. A date of birth of 03/04/2009 is valid and may be typed accurately from a form that itself was wrong. Validation stops impossible values; it cannot stop wrong-but-possible values."},{"t":"h","text":"Where validation fits in integrity"},{"t":"list","items":["Validation stops invalid values entering the database.","Entity integrity makes every record identifiable.","Referential integrity keeps links between tables meaningful (a lookup check against another table).","Transactions keep related changes all-or-nothing (see the multi-user database page)."],"ordered":false},{"t":"key","title":"Key points","items":["Validation = automatic check that data is reasonable and obeys rules.","Main checks: presence, range, type, length, format, lookup, check digit, cross-field.","Held in the data dictionary and enforced by the DBMS for every application.","Verification = checks data matches its source; neither guarantees accuracy."]},{"t":"tip","text":"Name the check *and* apply it to a field in the scenario: 'a range check on Qty so only values 1 to 50 are accepted'. A generic list of check names earns little."}],"diagram":{"kind":"match","title":"Pick the validation check","caption":"Match each database rule to the type of validation check it is.","pairs":[["CustName cannot be empty","Presence check"],["Qty must be 1 to 50","Range check"],["Postcode like BT74 6AA","Format check"],["Size must be S, M or L","Lookup check"],["DateReturned on or after DateOut","Cross-field check"],["Email typed twice and compared","Verification (double entry)"]]},"check":[{"q":"Which check would reject a booking for 0 people?","o":["Presence check","Format check","Range check","Verification"],"a":2,"why":"A range check enforces a minimum and maximum."},{"q":"Why can validation not guarantee that data is correct?","o":["Validation only works on numbers","Data can be valid (sensible) but still wrong","Validation is carried out by people","It is applied only after data is saved"],"a":1,"why":"A plausible but wrong value passes all checks."},{"q":"Asking a user to enter a new password twice is an example of…","o":["verification","a range check","a lookup check","referential integrity"],"a":0,"why":"Double entry checks the data matches what was intended."}],"exam":[],"practice":[{"q":"Explain why validation alone cannot guarantee that data is correct.","m":2,"a":"Validation only checks that data is reasonable/obeys rules (1); a value can be within the rules but still wrong, e.g. a mistyped but valid date (1)."},{"q":"A Lisburn dental surgery stores appointments. Describe two validation checks that could be applied to the Appointment table.","m":4,"a":"Presence check (1) on PatientID so every appointment belongs to a patient (1) / Range check (1) on ApptTime, e.g. between 08:30 and 17:30 (1) / Lookup check (1) on DentistID against the Dentist table (1). Any two, 1 for check + 1 for application."}],"videos":[{"title":"Data integrity: data dictionary, integrity rules, validation and indexing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS04-video"}],"terms":["Validation","Verification"]},{"id":"c01-p15","spec":"Explain the purpose of indexing and its trade-offs","lessons":["IS04"],"summary":"An index is a sorted structure of key values and pointers that lets the DBMS find, sort and join records without scanning the whole table, at the cost of storage and slower inserts, updates and deletes.","blocks":[{"t":"p","text":"Without help, the only way for a DBMS to find every customer called 'Gallagher' is a **full table scan** – reading every row. In a table of a million rows that is slow. An [[Index]] solves this, in the same way as the index at the back of a textbook."},{"t":"h","text":"How an index works"},{"t":"p","text":"An index is a separate data structure holding the values of one or more fields in sorted order, each with a pointer to the location of the matching record. The DBMS searches the small, sorted index (quickly, like a binary search) and then jumps straight to the records."},{"t":"note","text":"Real DBMSs usually store indexes as B-trees, a balanced tree structure that stays efficient as rows are added. You should know the idea of a sorted structure with pointers; the internal details of B-trees are beyond what you need to explain."},{"t":"list","items":["The primary key is indexed automatically, so lookups by key are always fast.","Extra (secondary) indexes are created on fields often used in WHERE, ORDER BY or JOIN, e.g. Surname or a foreign key.","An index can also enforce uniqueness, e.g. on an email field that is not the primary key."],"ordered":false},{"t":"compare","head":["Benefit","Cost"],"rows":[["Searching","Matching rows found without a full table scan","–"],["Sorting and joining","Rows already in key order; joins on indexed foreign keys are faster","–"],["Storage","–","Each index takes extra disk space"],["Data entry","–","Every INSERT, UPDATE and DELETE must also update each index, so writes slow down"],["Small tables","Little gain – a scan is already quick","Overhead not worth it"]]},{"t":"example","title":"Worked example: is an index worth it?","steps":["A Belfast parcel firm's Delivery table has 5 million rows. Drivers search by Postcode thousands of times a day; new rows are added about 20 000 times a day.","Without an index: every postcode search scans 5 million rows.","With an index on Postcode: the search reads a few index pages and then the matching rows.","Cost: each of the 20 000 daily inserts must also add an entry to the index – a small extra cost per insert."],"answer":"Searches vastly outnumber inserts, so indexing Postcode is justified. An index on a rarely searched Notes field would not be."},{"t":"key","title":"Key points","items":["Index = sorted values + pointers to records.","Purpose: faster searching, sorting and joining on large tables.","Costs: extra storage; slower inserts, updates and deletes.","Index fields that are searched or joined often; avoid indexing small or rarely queried tables and fields."]},{"t":"tip","text":"'Evaluate the use of indexes' needs both sides – faster retrieval versus storage and update overhead – and a conclusion linked to how the table is used (read-heavy or write-heavy)."}],"diagram":{"kind":"sort","title":"Why a sorted index is faster","caption":"Without an index the DBMS must check rows one by one (linear search); a sorted index lets it halve the search each step, as in a binary search. Step through the binary search for 52.","algo":"binary","data":[4,11,17,23,30,38,45,52,60,71,83,96],"target":52},"check":[{"q":"What is the main purpose of an index?","o":["To validate data on entry","To encrypt sensitive fields","To link tables together","To find and sort records faster without scanning the whole table"],"a":3,"why":"An index speeds up retrieval."},{"q":"Why can too many indexes slow a database down?","o":["Indexes stop queries from running","Indexes delete old records","Every insert, update and delete must also update each index","Indexes break referential integrity"],"a":2,"why":"Indexes must be maintained on every write."},{"q":"Which field is the best candidate for an extra index in a large Customer table?","o":["Notes (free text, rarely searched)","Surname (searched many times a day)","A Boolean 'Newsletter' field","A field that is always empty"],"a":1,"why":"Index fields that are frequently searched."}],"exam":[],"practice":[{"q":"Evaluate the use of indexes in a large relational database.","m":4,"a":"Benefit: records can be found without a full table scan, so searches are faster (1) / joins and sorts on indexed fields are faster (1). Drawback: indexes take extra storage (1) / every insert/update/delete must also update the index, slowing data entry (1). Conclusion: worthwhile on large, frequently searched fields; not on small or rarely searched ones (1). Max 4."}],"videos":[{"title":"Data integrity: data dictionary, integrity rules, validation and indexing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS04-video"},{"title":"AQA A Level SLR23 – Databases","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1638"}],"terms":["Index","Secondary key"]}],"topic":"G18","topicName":"Relational database design","links":{"tests":[{"id":"GI","title":"A2 1 topic test I: Relational databases and SQL","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GI"}],"papers":[{"id":"GP3","title":"A2 1 Practice Paper","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GP3"}]}},{"id":"c02","n":2,"title":"SQL and database management","intro":"Using SQL to build and query relational databases, keeping shared databases reliable with transactions and locking, and how organisations use big data, data warehouses and data mining – and the privacy questions they raise.","pages":[{"id":"c02-p01","spec":"Use SQL data definition language (DDL) to create tables with data types, primary keys and foreign keys","lessons":["IS05"],"summary":"DDL statements – CREATE, ALTER and DROP TABLE – define the structure of a database, including data types and the PRIMARY KEY, FOREIGN KEY, NOT NULL and CHECK constraints the DBMS enforces.","blocks":[{"t":"p","text":"[[SQL]] (Structured Query Language) is the standard language for relational databases. It has two main parts. The [[Data definition language (DDL)]] creates and changes the *structure*: CREATE TABLE, ALTER TABLE, DROP TABLE. The [[Data manipulation language (DML)]] works with the *data* itself. SQL is **declarative**: you state what you want, and the DBMS decides how to do it."},{"t":"h","text":"Data types"},{"t":"table","head":["Data type","Stores","Example field"],"rows":[["INT / INTEGER","Whole numbers","Qty INT"],["DECIMAL(p,s)","Exact decimals: p digits in total, s after the point","UnitPrice DECIMAL(6,2) – up to 9999.99"],["CHAR(n)","Fixed-length text of n characters","Gender CHAR(1)"],["VARCHAR(n)","Variable-length text up to n characters","CustName VARCHAR(40)"],["DATE / DATETIME","Dates, or dates with times","OrderDate DATE"],["BOOLEAN / BIT","True or false","Paid BOOLEAN"]]},{"t":"h","text":"Creating tables with keys"},{"t":"code","lang":"sql","code":"CREATE TABLE Customer (\n  CustID    VARCHAR(6)  NOT NULL,\n  CustName  VARCHAR(40) NOT NULL,\n  CustTown  VARCHAR(30),\n  PRIMARY KEY (CustID)\n);\n\nCREATE TABLE CustOrder (\n  OrderNo   INT         NOT NULL,\n  OrderDate DATE        NOT NULL,\n  CustID    VARCHAR(6)  NOT NULL,\n  PRIMARY KEY (OrderNo),\n  FOREIGN KEY (CustID) REFERENCES Customer(CustID)\n);","title":"Parent table first, then the child that refers to it"},{"t":"p","text":"Each line defines a field: name, data type and optional [[constraints|Constraint]]. The child table (CustOrder) is created after its parent (Customer), because the FOREIGN KEY must reference a table that already exists."},{"t":"code","lang":"sql","code":"CREATE TABLE OrderLine (\n  OrderNo   INT        NOT NULL,\n  ProductID VARCHAR(5) NOT NULL,\n  Qty       INT        NOT NULL CHECK (Qty > 0),\n  PRIMARY KEY (OrderNo, ProductID),\n  FOREIGN KEY (OrderNo)   REFERENCES CustOrder(OrderNo),\n  FOREIGN KEY (ProductID) REFERENCES Product(ProductID)\n);","title":"A composite key – each part is also a foreign key"},{"t":"table","head":["Constraint","Integrity it enforces"],"rows":[["PRIMARY KEY","[[Entity integrity]] – values unique and not null"],["FOREIGN KEY … REFERENCES","[[Referential integrity]] – value must exist in the parent table"],["NOT NULL","Presence check"],["CHECK (condition)","Range or other validation rule"],["UNIQUE","No duplicates in a non-key field, e.g. Email"]]},{"t":"h","text":"Changing structure"},{"t":"code","lang":"sql","code":"ALTER TABLE Customer ADD Phone VARCHAR(15);\n\nDROP TABLE OrderLine;   -- removes the table AND all of its data","title":"ALTER and DROP"},{"t":"key","title":"Key points","items":["DDL = CREATE, ALTER, DROP: defines structure. DML = SELECT, INSERT, UPDATE, DELETE: works with data.","Each field needs a name and a sensible data type and size.","PRIMARY KEY, FOREIGN KEY … REFERENCES, NOT NULL and CHECK let the DBMS enforce integrity automatically.","Create parent tables before child tables."]},{"t":"tip","text":"Use the exact table and field names in the question, choose sensible sizes (a postcode needs 8 characters, not 255), and include PRIMARY KEY and FOREIGN KEY … REFERENCES whenever keys are mentioned – they are usually separate marks."}],"diagram":{"kind":"table-reveal","title":"What does each line of the DDL do?","caption":"Reveal the effect of each part of the CREATE TABLE statements above.","head":["SQL fragment","Effect"],"rows":[["CustName VARCHAR(40) NOT NULL","Text field of up to 40 characters that must not be empty"],["PRIMARY KEY (CustID)","CustID must be unique and not null in every row"],["FOREIGN KEY (CustID) REFERENCES Customer(CustID)","Every order's CustID must already exist in Customer"],["Qty INT NOT NULL CHECK (Qty > 0)","Whole number that is required and must be at least 1"],["PRIMARY KEY (OrderNo, ProductID)","Composite key: the pair must be unique"],["DROP TABLE OrderLine","Deletes the table structure and all its rows"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]]},"check":[{"q":"Which of these is a DDL command?","o":["SELECT","INSERT","ALTER TABLE","UPDATE"],"a":2,"why":"ALTER TABLE changes structure, so it is DDL."},{"q":"Which constraint enforces referential integrity?","o":["NOT NULL","FOREIGN KEY … REFERENCES","CHECK","VARCHAR"],"a":1,"why":"The foreign key constraint ensures values exist in the parent table."},{"q":"Which data type is most suitable for a price such as 12.50?","o":["DECIMAL(6,2)","INT","CHAR(5)","BOOLEAN"],"a":0,"why":"DECIMAL stores exact values with a fixed number of decimal places."}],"exam":[],"practice":[{"q":"Write an SQL statement to create a table Member with fields MemberID (6 characters, primary key), Surname (up to 30 characters, required) and JoinDate (date).","m":4,"a":"CREATE TABLE Member ( (1) MemberID CHAR(6) NOT NULL, (1 – accept VARCHAR(6)) Surname VARCHAR(30) NOT NULL, JoinDate DATE, (1) PRIMARY KEY (MemberID) ); (1)"},{"q":"Explain how the FOREIGN KEY constraint in a CREATE TABLE statement helps maintain data integrity.","m":2,"a":"It makes the DBMS check that every value entered in the foreign key field exists as a primary key in the referenced table (1), so orphan records cannot be created / referential integrity is enforced (1)."}],"videos":[{"title":"SQL data definition and data manipulation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS05-video"},{"title":"OCR A Level SLR10 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-sql/"}],"terms":["SQL","Data definition language (DDL)","Data manipulation language (DML)","Constraint","Entity integrity","Referential integrity"]},{"id":"c02-p02","spec":"Use SQL data manipulation language (DML) to insert, update and delete records","lessons":["IS05"],"summary":"INSERT INTO adds records, UPDATE … SET … WHERE changes them and DELETE FROM … WHERE removes them; the WHERE clause decides which rows are affected.","blocks":[{"t":"h","text":"INSERT INTO"},{"t":"code","lang":"sql","code":"INSERT INTO Customer (CustID, CustName, CustTown)\nVALUES ('C101', 'Niamh Maguire', 'Enniskillen');\n\nINSERT INTO CustOrder (OrderNo, OrderDate, CustID)\nVALUES (5001, '2026-10-12', 'C101');","title":"Adding records"},{"t":"list","items":["List the fields, then the values in the **same order**.","Text and dates go in single quotes; numbers do not.","The DBMS rejects the row if it breaks a constraint – a duplicate key, a missing NOT NULL value, a CHECK rule, or a foreign key with no matching parent."],"ordered":false},{"t":"h","text":"UPDATE"},{"t":"code","lang":"sql","code":"UPDATE Product\nSET UnitPrice = UnitPrice * 1.10\nWHERE Category = 'Fruit';\n\nUPDATE Customer\nSET CustTown = 'Lisnaskea', CustName = 'Niamh Corrigan'\nWHERE CustID = 'C101';","title":"Changing existing values"},{"t":"p","text":"SET lists the new values (several can be changed at once, separated by commas). WHERE chooses which rows change. A new value can be calculated from the old one, as in the 10% price rise."},{"t":"h","text":"DELETE"},{"t":"code","lang":"sql","code":"DELETE FROM OrderLine\nWHERE OrderNo = 5001 AND ProductID = 'P07';","title":"Removing records"},{"t":"p","text":"DELETE removes *whole rows* that match the WHERE clause. To blank a single field, use UPDATE … SET field = NULL instead."},{"t":"warn","text":"Without a WHERE clause, UPDATE changes and DELETE removes **every** row in the table. `DELETE FROM Booking;` empties the whole Booking table. Safe practice: run a SELECT with the same WHERE first to see which rows will be affected, use the primary key in the condition where possible, and wrap the change in a transaction so it can be rolled back."},{"t":"example","title":"Worked example: price rise","steps":["Product before: P11 Organic apples 1kg, Fruit, 2.80; P09 Organic carrots 1kg, Veg, 1.50.","Run: UPDATE Product SET UnitPrice = UnitPrice * 1.10 WHERE Category = 'Fruit';","Only rows where Category is 'Fruit' match, so only P11 changes: 2.80 × 1.10 = 3.08.","P09 is a Veg product, so it does not match the WHERE clause and keeps 1.50."],"answer":"One row updated."},{"t":"key","title":"Key points","items":["INSERT INTO table (fields) VALUES (values);","UPDATE table SET field = value WHERE condition;","DELETE FROM table WHERE condition;","Quote text and dates, not numbers. A missing WHERE affects every row.","Constraints can cause the DBMS to reject an INSERT, UPDATE or DELETE."]},{"t":"tip","text":"Marks are usually per clause: UPDATE + table (1), SET (1), WHERE (1). Leaving out the WHERE when one is needed loses the mark and changes the meaning entirely."}],"diagram":{"kind":"table-reveal","title":"Product table after the UPDATE","caption":"UPDATE Product SET UnitPrice = UnitPrice * 1.10 WHERE Category = 'Fruit'; – reveal the new price and whether each row changed.","head":["ProductID","Category","Old price","New price","Changed?"],"rows":[["P03","Dairy","3.20","3.20","No – not Fruit"],["P07","Bakery","2.10","2.10","No – not Fruit"],["P09","Veg","1.50","1.50","No – not Fruit"],["P11","Fruit","2.80","3.08","Yes – 2.80 × 1.10"],["P14","Dairy","4.50","4.50","No – not Fruit"]],"hidden":[[0,3],[0,4],[1,3],[1,4],[2,3],[2,4],[3,3],[3,4],[4,3],[4,4]]},"check":[{"q":"What is the effect of DELETE FROM Booking; ?","o":["Deletes the Booking table structure","Deletes the first record only","Produces an error","Deletes every record in Booking"],"a":3,"why":"Without WHERE, every row matches; the empty table remains."},{"q":"Which statement changes the town of customer C101?","o":["INSERT INTO Customer (CustTown) VALUES ('Omagh');","ALTER TABLE Customer SET CustTown = 'Omagh';","UPDATE Customer SET CustTown = 'Omagh' WHERE CustID = 'C101';","SELECT CustTown = 'Omagh' FROM Customer;"],"a":2,"why":"UPDATE … SET … WHERE changes existing values."},{"q":"Why might the DBMS reject INSERT INTO CustOrder VALUES (5009, '2026-10-20', 'C999'); ?","o":["Dates cannot be inserted","C999 does not exist in Customer, breaking referential integrity","OrderNo must be text","INSERT needs a WHERE clause"],"a":1,"why":"The foreign key has no matching parent."}],"exam":[],"practice":[{"q":"Write an SQL statement to add a member with ID M0042, surname Corrigan, who joined on 1 September 2026, to Member(MemberID, Surname, JoinDate).","m":2,"a":"INSERT INTO Member (MemberID, Surname, JoinDate) (1) VALUES ('M0042', 'Corrigan', '2026-09-01'); (1)"},{"q":"A user runs DELETE FROM Booking; Explain the effect and how the database could have been protected.","m":3,"a":"Every record in Booking is deleted because there is no WHERE clause (1). Protection: restrict DELETE permission to authorised users (1) / run inside a transaction so it could be rolled back / keep regular backups to restore from (1)."}],"videos":[{"title":"SQL data definition and data manipulation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS05-video"},{"title":"AQA A Level SLR23 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr23-sql/"}],"terms":["Data manipulation language (DML)","Constraint"]},{"id":"c02-p03","spec":"Write SQL SELECT queries using WHERE, ORDER BY, AND, OR, LIKE and BETWEEN","lessons":["IS06"],"summary":"SELECT chooses fields, FROM the table, WHERE filters rows with comparison operators, AND/OR, LIKE patterns and inclusive BETWEEN ranges, and ORDER BY sorts the result.","blocks":[{"t":"code","lang":"sql","code":"SELECT field1, field2      -- which columns (* = all)\nFROM table                -- which table\nWHERE condition           -- which rows (optional)\nORDER BY field ASC|DESC;  -- sort order (optional, ASC is default)","title":"Shape of a query"},{"t":"h","text":"Conditions"},{"t":"list","items":["Comparison operators: = , <> (not equal), <, >, <=, >=.","Combine with AND, OR and NOT. **AND is evaluated before OR**, so use brackets to make your meaning clear.","**LIKE** matches a pattern: `%` means any number of characters (including none), `_` means exactly one character.","**BETWEEN a AND b** is inclusive – both limits are included.","**IN (list)** tests membership of a list: House IN ('Erne', 'Lough')."],"ordered":false},{"t":"code","lang":"sql","code":"SELECT Surname, Forename, Merits\nFROM Pupil\nWHERE YearGroup = 13 AND (House = 'Erne' OR House = 'Fermanagh')\nORDER BY Merits DESC, Surname ASC;","title":"Example 1 – brackets and a two-level sort"},{"t":"p","text":"The brackets matter. Without them, the condition would be read as `(YearGroup = 13 AND House = 'Erne') OR House = 'Fermanagh'`, which would include Fermanagh pupils from every year. The second sort key (Surname) only decides the order of pupils with equal Merits."},{"t":"code","lang":"sql","code":"SELECT Surname, Forename FROM Pupil\nWHERE Surname LIKE 'Mc%'\nORDER BY Surname;\n\nSELECT ProductName, UnitPrice FROM Product\nWHERE UnitPrice BETWEEN 2.10 AND 3.20\nORDER BY UnitPrice;","title":"Example 2 – LIKE and BETWEEN"},{"t":"example","title":"Worked example: state the output","steps":["Pupil holds 8 rows (see the diagram). Example 1 keeps only Year 13 pupils in Erne or Fermanagh: Maguire (Erne, 42), Gallagher (Fermanagh, 28), Corrigan (Erne, 35). Doherty is Year 13 but in Lough, so is excluded.","Sort by Merits descending: 42, 35, 28.","Only the three selected fields are shown, in the order listed in SELECT."],"answer":"Maguire, Niamh, 42 / Corrigan, Jack, 35 / Gallagher, Sean, 28"},{"t":"key","title":"Key points","items":["SELECT fields FROM table WHERE condition ORDER BY field [DESC];","Text in single quotes; numbers unquoted.","LIKE with % (any characters) and _ (one character); BETWEEN is inclusive; IN tests a list.","Use brackets when mixing AND and OR."]},{"t":"warn","text":"Use LIKE, not =, with wildcards: `Surname = 'Mc%'` looks for someone literally called Mc%. Note too that Microsoft Access uses * and ? as wildcards in its own query designer; standard SQL uses % and _."}],"diagram":{"kind":"table-reveal","title":"Run the query: Year 13 in Erne or Fermanagh","caption":"The Pupil table with Example 1 applied. Reveal whether each row is returned and its position in the result.","head":["Surname","Forename","YearGroup","House","Merits","Returned?"],"rows":[["Maguire","Niamh","13","Erne","42","Yes – 1st"],["Doherty","Ciaran","13","Lough","35","No – wrong house"],["McCaffrey","Orla","14","Erne","51","No – Year 14"],["Gallagher","Sean","13","Fermanagh","28","Yes – 3rd"],["McManus","Aoife","12","Lough","47","No – Year 12"],["Corrigan","Jack","13","Erne","35","Yes – 2nd"],["Fitzpatrick","Erin","14","Fermanagh","39","No – Year 14"],["Mulligan","Tom","12","Erne","22","No – Year 12"]],"hidden":[[0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5]]},"check":[{"q":"Which condition finds postcodes beginning with BT74?","o":["Postcode LIKE 'BT74%'","Postcode = 'BT74%'","Postcode LIKE '%BT74'","Postcode BETWEEN 'BT74'"],"a":0,"why":"LIKE with % after the fixed part matches anything that starts with BT74."},{"q":"WHERE Price BETWEEN 2 AND 5 includes which values?","o":["Only values greater than 2 and less than 5","Only 2 and 5","Values below 2 or above 5","Values from 2 to 5 inclusive"],"a":3,"why":"BETWEEN is inclusive at both ends."},{"q":"Using the Pupil table in the diagram, how many rows does WHERE Surname LIKE 'Mc%' return?","o":["1","2","3","4"],"a":1,"why":"McCaffrey and McManus."}],"exam":[],"practice":[{"q":"Write an SQL query to list the Surname and Forename of all pupils in YearGroup 14, in alphabetical order of Surname.","m":3,"a":"SELECT Surname, Forename FROM Pupil (1) WHERE YearGroup = 14 (1) ORDER BY Surname; (1 – ASC optional)"},{"q":"Write an SQL query to display the name and price of all products whose name begins with 'Organic' and whose price is between £1 and £3.","m":3,"a":"SELECT ProductName, UnitPrice FROM Product (1) WHERE ProductName LIKE 'Organic%' (1) AND UnitPrice BETWEEN 1 AND 3; (1)"}],"videos":[{"title":"SQL queries: SELECT, aggregates, grouping and joins – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS06-video"},{"title":"OCR A Level SLR10 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-sql/"},{"title":"AQA A Level SLR23 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr23-sql/"}],"terms":["Wildcard"]},{"id":"c02-p04","spec":"Use aggregate functions with GROUP BY","lessons":["IS06"],"summary":"COUNT, SUM, AVG, MIN and MAX calculate one value from many rows; GROUP BY gives one result row per group, and HAVING filters the groups after they are calculated.","blocks":[{"t":"p","text":"An [[Aggregate function]] calculates a single value from a set of rows."},{"t":"table","head":["Function","Returns","Example on the farm-shop data","Result"],"rows":[["COUNT(*)","Number of rows","SELECT COUNT(*) FROM OrderLine;","7"],["SUM(field)","Total of the values","SELECT SUM(Qty) FROM OrderLine;","12"],["AVG(field)","Mean value","SELECT AVG(UnitPrice) FROM Product;","2.82"],["MIN(field)","Smallest value","SELECT MIN(UnitPrice) FROM Product;","1.50"],["MAX(field)","Largest value","SELECT MAX(Qty) FROM OrderLine;","3"]]},{"t":"h","text":"GROUP BY"},{"t":"p","text":"Used alone, an aggregate summarises the whole result. [[GROUP BY]] splits the rows into groups that share a value and calculates the aggregate *for each group*, giving one output row per group. AS gives a calculated column a readable name (an *alias*)."},{"t":"code","lang":"sql","code":"SELECT House, COUNT(*) AS Pupils, AVG(Merits) AS AvgMerits\nFROM Pupil\nGROUP BY House\nHAVING COUNT(*) > 2\nORDER BY AvgMerits DESC;","title":"One row per house – but only houses with more than 2 pupils"},{"t":"h","text":"WHERE versus HAVING"},{"t":"compare","head":["WHERE","HAVING"],"rows":[["Filters","Individual rows","Whole groups"],["When","Before grouping","After the aggregates are calculated"],["Can use aggregates?","No – WHERE COUNT(*) > 2 is an error","Yes – HAVING COUNT(*) > 2"],["Example","WHERE YearGroup >= 12","HAVING AVG(Merits) > 40"]]},{"t":"p","text":"The clauses always appear in this order: SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY."},{"t":"warn","text":"Every field in SELECT that is not inside an aggregate must appear in GROUP BY. `SELECT House, Surname, COUNT(*) … GROUP BY House` is invalid, because there is no single Surname for a whole house."},{"t":"key","title":"Key points","items":["COUNT, SUM, AVG, MIN, MAX calculate one value from many rows.","GROUP BY → one result row per group.","WHERE filters rows before grouping; HAVING filters groups after aggregation.","Non-aggregated fields in SELECT must be in GROUP BY."]},{"t":"tip","text":"When asked to 'state the output' of a GROUP BY query, first group the rows by hand, calculate each aggregate, apply HAVING, then sort. Show the column headings, using the aliases."}],"diagram":{"kind":"table-reveal","title":"Run the query: pupils per house","caption":"Groups formed from the 8-row Pupil table on the previous page. Reveal each aggregate and whether HAVING COUNT(*) > 2 keeps the group.","head":["House","Merits in group","Pupils (COUNT)","AvgMerits (AVG)","Kept by HAVING?"],"rows":[["Erne","42, 51, 35, 22","4","37.5","Yes – 4 > 2"],["Lough","35, 47","2","41.0","No – 2 is not > 2"],["Fermanagh","28, 39","2","33.5","No – 2 is not > 2"]],"hidden":[[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,2],[2,3],[2,4]]},"check":[{"q":"Which clause filters groups after aggregation?","o":["WHERE","HAVING","ORDER BY","FROM"],"a":1,"why":"HAVING works on groups."},{"q":"SELECT COUNT(*) FROM Pupil WHERE House = 'Erne'; on the diagram's data returns…","o":["2","3","4","8"],"a":2,"why":"Maguire, McCaffrey, Corrigan and Mulligan."},{"q":"Without the HAVING clause, the query in the diagram would return how many rows?","o":["1","2","3","8"],"a":2,"why":"One row per house: Erne, Lough and Fermanagh."}],"exam":[],"practice":[{"q":"Explain the difference between WHERE and HAVING.","m":2,"a":"WHERE filters individual rows before grouping (1); HAVING filters groups after aggregate functions have been calculated (1)."},{"q":"Customer(CustID, CustName, CustTown). Write an SQL query to show each customer town and the number of customers in it, only for towns with more than five customers.","m":4,"a":"SELECT CustTown, COUNT(*) (1) FROM Customer (1) GROUP BY CustTown (1) HAVING COUNT(*) > 5; (1)"}],"videos":[{"title":"SQL queries: SELECT, aggregates, grouping and joins – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS06-video"},{"title":"AQA A Level SLR23 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr23-sql/"}],"terms":["Aggregate function","GROUP BY","HAVING"]},{"id":"c02-p05","spec":"Write queries that join two or three tables","lessons":["IS06"],"summary":"A join recombines normalised tables by matching each foreign key to its primary key; n tables need n − 1 join conditions, and omitting one produces a Cartesian product.","blocks":[{"t":"p","text":"Normalisation splits data across tables, so most useful questions need a [[Join]] to put it back together. An **inner join** returns only the rows where the foreign key in one table matches the primary key in the other."},{"t":"p","text":"Tables used on this page: Customer(CustID, CustName, CustTown) · CustOrder(OrderNo, OrderDate, CustID*) · Product(ProductID, ProductName, Category, UnitPrice) · OrderLine(OrderNo*, ProductID*, Qty)."},{"t":"h","text":"Joining two tables"},{"t":"code","lang":"sql","code":"SELECT c.CustName, o.OrderNo, o.OrderDate\nFROM Customer c\nINNER JOIN CustOrder o ON c.CustID = o.CustID\nWHERE c.CustTown = 'Enniskillen'\nORDER BY o.OrderDate;\n\n-- equivalent older 'WHERE-join' style, also accepted\nSELECT Customer.CustName, CustOrder.OrderNo, CustOrder.OrderDate\nFROM Customer, CustOrder\nWHERE Customer.CustID = CustOrder.CustID\n  AND Customer.CustTown = 'Enniskillen'\nORDER BY CustOrder.OrderDate;","title":"Customers from Enniskillen and their orders"},{"t":"list","items":["The ON clause (or WHERE condition) matches the foreign key to the primary key.","Where a field name appears in both tables (CustID), prefix it with the table name or an alias (c., o.) to avoid ambiguity.","A customer with no orders does not appear in an inner join, because there is nothing to match."],"ordered":false},{"t":"h","text":"Joining three or more tables"},{"t":"p","text":"Follow the path of relationships in the ER diagram: Customer → CustOrder → OrderLine → Product. Each extra table needs one more join condition, so **n tables need n − 1 join conditions**. Aggregates work across joins:"},{"t":"code","lang":"sql","code":"SELECT c.CustName, SUM(ol.Qty * p.UnitPrice) AS TotalSpent\nFROM Customer c\nINNER JOIN CustOrder o  ON c.CustID = o.CustID\nINNER JOIN OrderLine ol ON o.OrderNo = ol.OrderNo\nINNER JOIN Product p    ON ol.ProductID = p.ProductID\nGROUP BY c.CustName\nORDER BY TotalSpent DESC;","title":"Total spent by each customer (four tables, three conditions)","output":"Niamh Maguire  18.60\nCiaran Doherty  7.70\nOrla Murphy     4.20"},{"t":"h","text":"The Cartesian product"},{"t":"p","text":"If the join condition is left out, every row of one table is paired with every row of the other – a [[Cartesian product]]. Four customers and four orders give 4 × 4 = 16 rows, most of them meaningless. In large tables this can produce millions of rows."},{"t":"key","title":"Key points","items":["Inner join = rows where foreign key matches primary key.","INNER JOIN … ON pk = fk, or FROM A, B WHERE A.pk = B.fk.","n tables → n − 1 join conditions, following the ER diagram.","Prefix shared field names; a missing join condition gives a Cartesian product."]},{"t":"tip","text":"Marks are usually per clause: SELECT fields (1), FROM tables (1), each join condition (1), each criterion (1), ORDER BY (1). Write the join condition even if you use the WHERE style – it is the most commonly missed mark."}],"diagram":{"kind":"table-reveal","title":"Run the query: total spent per customer","caption":"Order lines after joining all four tables. Reveal each line value, then the grouped totals. Sean Kelly (C21) has no orders, so the inner join leaves him out.","head":["CustName","OrderNo","Product","Qty × UnitPrice","Line value"],"rows":[["Niamh Maguire","5001","Free-range eggs (12)","2 × 3.20","6.40"],["Niamh Maguire","5001","Soda bread","1 × 2.10","2.10"],["Niamh Maguire","5003","Organic apples 1kg","2 × 2.80","5.60"],["Niamh Maguire","5003","Farmhouse butter","1 × 4.50","4.50"],["Ciaran Doherty","5002","Free-range eggs (12)","1 × 3.20","3.20"],["Ciaran Doherty","5002","Organic carrots 1kg","3 × 1.50","4.50"],["Orla Murphy","5004","Soda bread","2 × 2.10","4.20"],["Result","GROUP BY CustName","ORDER BY TotalSpent DESC","–","Maguire 18.60, Doherty 7.70, Murphy 4.20"]],"hidden":[[0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4]]},"check":[{"q":"A query joins four tables. How many join conditions are needed?","o":["2","3","4","5"],"a":1,"why":"n tables need n − 1 join conditions."},{"q":"What is returned if the join condition between Customer (4 rows) and CustOrder (4 rows) is omitted?","o":["4 rows","16 rows – a Cartesian product","8 rows","An empty result"],"a":1,"why":"Every row is paired with every row: 4 × 4."},{"q":"Why is CustID written as c.CustID in the query?","o":["Because CustID exists in both tables, so it must be made unambiguous","To sort by it","To make it a primary key","Because it is text"],"a":0,"why":"The prefix states which table's field is meant."}],"exam":[],"practice":[{"q":"Using Customer(CustID, CustName), CustOrder(OrderNo, OrderDate, CustID) and OrderLine(OrderNo, ProductID, Qty), write a query to list the names of customers who ordered product 'P07', with the order date.","m":5,"a":"SELECT Customer.CustName, CustOrder.OrderDate (1) FROM Customer, CustOrder, OrderLine (1) WHERE Customer.CustID = CustOrder.CustID (1) AND CustOrder.OrderNo = OrderLine.OrderNo (1) AND OrderLine.ProductID = 'P07'; (1). Equivalent INNER JOIN syntax accepted."},{"q":"State what is returned if the join condition is omitted when querying two tables.","m":1,"a":"A Cartesian product: every row of one table combined with every row of the other (1)."}],"videos":[{"title":"SQL queries: SELECT, aggregates, grouping and joins – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS06-video"},{"title":"OCR A Level SLR10 – SQL","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-sql/"}],"terms":["Join","Cartesian product","Aggregate function"]},{"id":"c02-p06","spec":"Explain transactions and the ACID properties","lessons":["IS07"],"summary":"A transaction is a group of operations treated as one unit; ACID – atomicity, consistency, isolation, durability – are the properties that make transactions reliable.","blocks":[{"t":"p","text":"A [[Transaction]] is a sequence of database operations that must be treated as **one logical unit of work**: either all of it happens, or none of it does. Moving £50 from a savings account to a current account is two updates – a debit and a credit – but one transaction."},{"t":"code","lang":"sql","code":"BEGIN TRANSACTION;\nUPDATE Account SET Balance = Balance - 50 WHERE AccNo = 'S123';\nUPDATE Account SET Balance = Balance + 50 WHERE AccNo = 'C123';\nCOMMIT;   -- or ROLLBACK if anything went wrong","title":"A bank transfer as one transaction"},{"t":"h","text":"The ACID properties"},{"t":"table","head":["Property","Meaning","Bank transfer example"],"rows":[["**Atomicity**","All operations in the transaction take effect, or none do","The debit is never kept without the matching credit"],["**Consistency**","The transaction moves the database from one valid state to another, obeying every integrity rule","Total money is unchanged; no rule (e.g. no overdraft) is broken"],["**Isolation**","Concurrent transactions do not interfere; the result is as if they had run one after another","A second withdrawal cannot see or use the half-finished transfer"],["**Durability**","Once committed, changes are permanent, even after a power cut or crash","After the server restarts, the transfer is still recorded"]]},{"t":"p","text":"[[ACID]] is achieved by several DBMS mechanisms working together: a **transaction log** (written before the data is changed) supports atomicity and durability; **locking** supports isolation; **constraints** and validation support consistency."},{"t":"example","title":"Worked example: a power cut mid-transfer","steps":["10:00:01 – the debit of £50 from S123 is written.","10:00:02 – power fails before the credit to C123 is written and before COMMIT.","On restart, the DBMS reads its log, finds a transaction with no COMMIT, and undoes the debit (atomicity).","Had the power failed one second *after* COMMIT, the DBMS would use the log to make sure both changes were kept (durability)."],"answer":"The customer never loses £50 to a half-finished transfer."},{"t":"key","title":"Key points","items":["Transaction = one logical unit of work: all or nothing.","Atomicity – all or none. Consistency – valid state to valid state. Isolation – no interference. Durability – committed changes survive failures.","Supported by the transaction log, locking and constraints."]},{"t":"tip","text":"Each ACID property needs a definition *and* an applied example from the scenario for full marks. Do not define consistency as 'data is consistent' – say what rule stays true."}],"diagram":{"kind":"match","title":"Which ACID property?","caption":"Match each guarantee to the ACID property that provides it.","pairs":[["The debit is never kept without the credit","Atomicity"],["No integrity rule is broken by the transaction","Consistency"],["Two cashiers' transactions do not see each other's half-finished work","Isolation"],["A committed payment survives a server crash","Durability"]]},"check":[{"q":"Which ACID property ensures that a committed transaction survives a power failure?","o":["Atomicity","Consistency","Isolation","Durability"],"a":3,"why":"Durability means committed changes are permanent."},{"q":"Which property means 'all or nothing'?","o":["Consistency","Isolation","Atomicity","Durability"],"a":2,"why":"An atomic transaction cannot be partly applied."},{"q":"Which DBMS mechanism mainly provides isolation?","o":["Indexes","Locking","Views","Data types"],"a":1,"why":"Locking stops concurrent transactions interfering."}],"exam":[],"practice":[{"q":"Define the term transaction in the context of databases.","m":2,"a":"A sequence/group of database operations (1) treated as a single logical unit that must either complete entirely or not at all (1)."},{"q":"Explain atomicity and durability, using a bank transfer as an example.","m":4,"a":"Atomicity: all operations in the transaction happen or none do (1), e.g. if the credit fails the debit is undone so money is not lost (1). Durability: once committed the changes are permanent even after a failure (1), e.g. a completed transfer is still recorded after a power cut, using the transaction log (1)."}],"videos":[{"title":"Multi-user databases: transactions, ACID, locking and distributed databases – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS07-video"},{"title":"OCR A Level SLR10 – Transaction processing","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-transaction-processing/"}],"terms":["Transaction","ACID"]},{"id":"c02-p07","spec":"Describe record locking, deadlock and how deadlock is handled","lessons":["IS07"],"summary":"Record locking prevents the lost update problem by giving one transaction exclusive use of a record; deadlock occurs when two transactions each hold a lock the other needs and is resolved by rolling one back.","blocks":[{"t":"h","text":"The lost update problem"},{"t":"p","text":"When two users update the same record at the same time without any control, one change can silently overwrite the other. This breaks isolation."},{"t":"h","text":"Record locking"},{"t":"p","text":"[[Record locking]] stops this. When a transaction reads a record intending to update it, the DBMS **locks** the record. Any other transaction that wants to update it must wait until the lock is released at COMMIT or ROLLBACK."},{"t":"list","items":["**Shared (read) lock** – many transactions may read the record at once, but none may write it.","**Exclusive (write) lock** – one transaction may read and write; all others must wait.","**Granularity** – locking a single r
