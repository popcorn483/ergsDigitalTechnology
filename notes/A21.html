tems":["No manual configuration, so no typing errors and no **duplicate addresses**.","Addresses are **reused** when leases expire – efficient when devices come and go, like guests' phones.","Servers and printers are usually given a **fixed (reserved)** address so others can always find them."],"ordered":false},{"t":"h","text":"NAT"},{"t":"p","text":"[[Network address translation (NAT)]] lets many devices with private addresses share a single public IPv4 address. The router rewrites the private *source* address of each outgoing packet with its own public address, and records the connection in a translation table. When a reply arrives, the router looks up the table and forwards it to the correct private device."},{"t":"list","items":["**Conserves public IPv4 addresses** – a whole household or school can share one.","**Hides internal addresses** – devices are not directly reachable from the internet, which adds a layer of protection (though NAT is not a substitute for a firewall).","Drawback: incoming connections (e.g. hosting a game server) need extra set-up such as port forwarding."],"ordered":false},{"t":"example","title":"Worked example: NAT in a home","steps":["Laptop 192.168.1.20 requests a web page. The packet leaves with source 192.168.1.20 : 50111.","The router replaces the source with its public address 81.2.69.160 : 40001 and records 40001 ↔ 192.168.1.20 : 50111.","The web server replies to 81.2.69.160 : 40001.","The router looks up port 40001, rewrites the destination to 192.168.1.20 : 50111 and forwards it to the laptop."],"answer":"The web server only ever sees the router's public address."},{"t":"note","text":"The port-number translation shown here is strictly called PAT or NAT overload, and it is how home routers work. For this unit, describing it as NAT is accepted."},{"t":"key","title":"Key points","items":["DHCP: automatically leases IP address, subnet mask, default gateway, DNS server.","Benefits: no manual configuration, no duplicates, addresses reused.","NAT: router swaps private source addresses for its public address and tracks connections in a table.","Benefits: many devices share one public IPv4 address; internal addresses hidden."]},{"t":"tip","text":"For NAT (3 marks): devices use private addresses (1); the router replaces the private address with its public address on outgoing packets (1); it uses a translation table to send replies back to the correct device (1)."}],"diagram":{"kind":"table-reveal","title":"The router's NAT table","caption":"Three devices share the public address 81.2.69.160. Reveal the public side of each translation and where a reply to it is sent.","head":["Private address : port","Public address : port","Reply to that public port goes to"],"rows":[["192.168.1.20 : 50111 (laptop)","81.2.69.160 : 40001","192.168.1.20 : 50111"],["192.168.1.31 : 61002 (phone)","81.2.69.160 : 40002","192.168.1.31 : 61002"],["192.168.1.45 : 50111 (console)","81.2.69.160 : 40003","192.168.1.45 : 50111"]],"hidden":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2]]},"check":[{"q":"Which of these does DHCP NOT normally supply?","o":["IP address","Default gateway","MAC address","DNS server address"],"a":2,"why":"The MAC address is fixed in the NIC."},{"q":"What is the main purpose of NAT?","o":["To encrypt traffic","To let many devices with private addresses share one public IP address","To assign MAC addresses","To detect transmission errors"],"a":1,"why":"NAT maps private addresses to a public address."},{"q":"Why does DHCP prevent duplicate IP addresses?","o":["The server tracks which addresses in its pool are leased","It uses MAC addresses instead","It assigns IPv6 only","It turns off devices with the same address"],"a":0,"why":"Central allocation avoids clashes."}],"exam":[],"practice":[{"q":"Describe the purpose of DHCP.","m":2,"a":"To automatically assign an IP address (and subnet mask, gateway, DNS) to a device when it joins the network (1), avoiding manual configuration errors/duplicate addresses and allowing addresses to be reused (1)."},{"q":"Explain how network address translation (NAT) allows several devices in a home to access the internet.","m":3,"a":"Devices in the home have private IP addresses (1); the router replaces the private source address with its single public address on outgoing packets (1); it records each connection in a table so it can forward replies to the correct private device (1)."}],"videos":[{"title":"IP addressing, switching and routing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS11-video"},{"title":"AQA A Level SLR22 – DHCP","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr22-dhcp/"},{"title":"AQA A Level SLR22 – NAT and port forwarding","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr22-nat-and-port-forwarding/"}],"terms":["DHCP","Network address translation (NAT)"]},{"id":"c03-p09","spec":"Compare packet switching and circuit switching","lessons":["IS11"],"summary":"Circuit switching reserves a dedicated path for the whole communication; packet switching splits data into addressed packets that travel independently over shared links and are reassembled at the destination.","blocks":[{"t":"h","text":"Circuit switching"},{"t":"p","text":"In [[Circuit switching]] a dedicated path is set up between sender and receiver **before** communication starts and is reserved for the whole session. The traditional landline telephone network worked this way: dialling set up the circuit, and it stayed yours until you hung up – even during silences."},{"t":"h","text":"Packet switching"},{"t":"p","text":"In [[Packet switching]] the data is split into small packets. Each packet carries a header with its source and destination addresses and a sequence number. Packets travel **independently** across shared links, possibly by different routes, and are **reassembled in order** at the destination using their sequence numbers. The internet is packet-switched."},{"t":"compare","head":["Circuit switching","Packet switching"],"rows":[["Path","Dedicated path set up for the whole communication","No fixed path; each packet routed separately"],["Use of links","Capacity reserved even when silent – wasteful","Links shared by many users – efficient"],["Delivery","Constant rate, in order, low and predictable delay","Packets may arrive out of order or with varying delay; reassembled"],["Failure","A broken link drops the connection","Packets rerouted round failed or congested links"],["Set-up","Delay to establish the circuit first","No set-up; send immediately"],["Example","Traditional landline telephone network","The internet; VoIP calls"]]},{"t":"example","title":"Worked example: sending a photo by packet switching","steps":["A 3 MB photo is split into about 2000 packets, each with source and destination IP addresses and a sequence number.","Packet 17 goes Belfast → Dublin → London; packet 18 is sent via Glasgow because the Dublin link is congested.","Packet 18 arrives first. The receiver holds it until packet 17 arrives, then reorders them by sequence number.","Packet 941 is lost; TCP at the receiver does not acknowledge it, so the sender retransmits it."],"answer":"The photo is reassembled exactly, even though the packets took different routes."},{"t":"key","title":"Key points","items":["Circuit: dedicated path reserved for the whole call; constant rate; wastes capacity; fails if a link breaks.","Packet: data split into packets with headers; independent routes over shared links; reassembled by sequence number.","Packet switching uses capacity efficiently and is resilient; circuit switching gives predictable delay."]},{"t":"tip","text":"When explaining packet switching, each of these is a creditable point: split into packets – header with destination address – sequence number – independent routes – reassembly at destination."}],"diagram":{"kind":"compare","title":"Circuit or packet?","caption":"Toggle between the two methods of moving data across a network.","states":[{"label":"Circuit switching","art":null,"points":["Path set up before any data is sent","Path reserved for the whole call","Data arrives at a constant rate, in order","Capacity wasted during silences","Link failure ends the call"]},{"label":"Packet switching","art":"mesh","points":["Data split into packets with headers","Each packet routed independently","Links shared by many users","Packets reordered by sequence number","Routes avoid failed or congested links"]}]},"check":[{"q":"Which feature belongs to circuit switching?","o":["Packets take different routes","Packets are reassembled using sequence numbers","Links are shared between many users","A dedicated path is reserved for the whole communication"],"a":3,"why":"Circuit switching reserves the path."},{"q":"Why can packets arrive out of order?","o":["They are encrypted","Routers sort them alphabetically","They may travel by different routes with different delays","The circuit is broken"],"a":2,"why":"Independent routing causes different arrival times."},{"q":"Why is packet switching an efficient use of network capacity?","o":["Each user has a reserved link","Links are shared and only used when data is sent","Packets are never lost","It needs no addresses"],"a":1,"why":"No capacity is reserved during silence."}],"exam":[],"practice":[{"q":"Compare packet switching and circuit switching.","m":4,"a":"Circuit switching sets up a dedicated path for the whole communication whereas packet switching sends packets independently by possibly different routes (1) / circuit reserves capacity even when unused whereas packet switching shares links efficiently (1) / circuit data arrives in order at constant rate whereas packets may arrive out of order and are reassembled using sequence numbers (1) / a link failure breaks a circuit whereas packets can be rerouted (1)."}],"videos":[{"title":"IP addressing, switching and routing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS11-video"},{"title":"AQA A Level SLR21 – Packets and packet switching","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-packets-and-packet-switching/"}],"terms":["Circuit switching","Packet switching"]},{"id":"c03-p10","spec":"Describe how routing works","lessons":["IS11"],"summary":"Each router reads a packet's destination IP address, looks it up in its routing table to choose the next hop, decrements the time-to-live and forwards it; routing protocols keep the tables up to date.","blocks":[{"t":"h","text":"Packet structure"},{"t":"table","head":["Part","Contents"],"rows":[["Header","Source IP address, destination IP address, time to live (TTL), protocol (e.g. TCP), length, header checksum; the TCP segment inside also carries the sequence number"],["Payload","The chunk of actual data"],["Trailer (frame)","An error-check value such as a CRC, added by the link layer for each hop"]]},{"t":"h","text":"What a router does with each packet"},{"t":"list","items":["Receives the frame on one interface and extracts the packet.","Reads the **destination IP address**.","Looks it up in its [[Routing table]] to find the best matching network and the **next hop** (the next router) and outgoing interface.","Decrements the [[Time to live (TTL)]]; if it reaches 0, the packet is discarded so it cannot circle for ever.","Wraps the packet in a new frame for the next link and forwards it."],"ordered":true},{"t":"p","text":"No single router knows the whole route. Each makes a local decision about the next hop, and the packet moves **hop by hop** to its destination."},{"t":"h","text":"Keeping routing tables up to date"},{"t":"p","text":"Routers exchange information with their neighbours using **routing protocols**, sharing which networks they can reach and at what cost. If a link fails or becomes congested, tables are updated and later packets are sent another way. Small networks may use simple *static* routes set by an administrator; the internet relies on *dynamic* routing."},{"t":"example","title":"Worked example: a routing table lookup","steps":["A school router has these entries: 192.168.10.0/24 → interface LAN1 (staff); 192.168.20.0/24 → interface LAN2 (pupils); 0.0.0.0/0 (default) → next hop 81.2.69.1 (ISP).","Packet for 192.168.20.57: matches 192.168.20.0/24 → sent out of LAN2.","Packet for 151.101.1.69: matches no specific network → follows the default route to the ISP's router 81.2.69.1.","At the ISP router the process repeats with its own, much larger table."],"answer":"Most specific match wins; otherwise use the default route."},{"t":"key","title":"Key points","items":["Routers forward packets hop by hop using the destination IP address.","Routing table: destination network → next hop / interface; a default route catches everything else.","TTL decremented at each hop; packet discarded at 0.","Routing protocols update tables so traffic avoids failed or congested links."]},{"t":"tip","text":"A full description of routing mentions: destination IP address read – routing table – next hop – tables updated dynamically – TTL. Avoid saying a router 'knows the whole route'."}],"diagram":{"kind":"flow","title":"Inside a router","direction":"tb","caption":"Step through what a router does with each packet it receives.","nodes":[{"id":"a","label":"Frame arrives","detail":"Received on an interface; link-layer header and trailer checked and removed.","shape":"start"},{"id":"b","label":"Read destination IP","detail":"Taken from the IP header of the packet.","shape":"process"},{"id":"c","label":"TTL − 1 = 0?","detail":"Time to live is decremented at every hop.","shape":"decision"},{"id":"d","label":"Discard packet","detail":"Stops packets looping for ever; an error message may be sent to the source.","shape":"end"},{"id":"e","label":"Look up routing table","detail":"Find the most specific matching network, or use the default route.","shape":"process"},{"id":"f","label":"Build new frame","detail":"New MAC addresses for the next link; IP addresses unchanged.","shape":"process"},{"id":"g","label":"Forward to next hop","detail":"Sent out of the chosen interface towards the next router or the destination network.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","yes"],["c","e","no"],["e","f"],["f","g"]]},"check":[{"q":"Which field does a router use to decide where to send a packet?","o":["Destination IP address","Source MAC address","Sequence number","Payload"],"a":0,"why":"Routing decisions use the destination IP."},{"q":"What is the purpose of the time to live (TTL) field?","o":["To encrypt the packet","To order packets","To store the port number","To stop packets circulating for ever"],"a":3,"why":"A packet is discarded when TTL reaches 0."},{"q":"A packet's destination matches no specific network in the routing table. What happens?","o":["It is always discarded","It is broadcast to every network","It follows the default route","It is returned to the sender"],"a":2,"why":"The default route handles unmatched destinations."}],"exam":[],"practice":[{"q":"Describe how a packet is routed across the internet.","m":4,"a":"Each router reads the packet's destination IP address (1) / looks it up in its routing table (1) to choose the next hop / best route (1) / routing tables are updated so packets avoid congested/failed links (1) / TTL is reduced at each hop and the packet is discarded at zero (1). Max 4."}],"videos":[{"title":"IP addressing, switching and routing – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS11-video"},{"title":"AQA A Level SLR21 – Structure of the internet","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-structure-of-the-internet/"},{"title":"AQA A Level SLR21 – Packets and packet switching","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-packets-and-packet-switching/"}],"terms":["Routing table","Time to live (TTL)","Router"]},{"id":"c03-p11","spec":"Compare transmission media","lessons":["IS12"],"summary":"Twisted-pair copper is cheap but limited to about 100 m and prone to interference; fibre carries light with very high bandwidth over long distances; wireless gives mobility at the cost of interference and security.","blocks":[{"t":"table","head":["Medium","How data travels","Strengths","Weaknesses"],"rows":[["Twisted-pair copper (e.g. Cat6)","Electrical signals; twisting reduces interference","Cheap, flexible, easy to install and terminate","Electromagnetic interference and crosstalk; about 100 m per run for Ethernet"],["Coaxial copper","Electrical signals inside a shielded cable","Less interference than unshielded twisted pair","Bulkier; largely replaced by fibre and twisted pair"],["[[Fibre-optic cable]]","Pulses of light along glass fibres","Very high bandwidth; long distances (kilometres); immune to electrical interference; very hard to tap","Expensive; fragile; specialist installation and joining"],["Wireless (Wi-Fi radio, microwave, satellite)","Electromagnetic waves through the air","Mobility; no cabling; reaches remote areas","Interference and obstacles; speed falls with distance; easier to intercept (needs encryption); satellite latency"]]},{"t":"h","text":"Choosing a medium"},{"t":"p","text":"Choose by weighing the same criteria every time: **distance**, **bandwidth needed**, **interference** in the environment, **security**, **cost** and **mobility**."},{"t":"compare","head":["Copper twisted pair","Fibre-optic"],"rows":[["Distance per run","About 100 m","Many kilometres"],["Bandwidth","Up to 10 Gbps over short runs","Far higher; easily upgraded by changing the equipment at each end"],["Interference","Affected by electrical noise, e.g. near machinery","Immune – carries light"],["Security","Can be tapped more easily","Very hard to tap without detection"],["Cost","Cheap cable and connectors","Higher cost of cable, connectors and installation"]]},{"t":"example","title":"Worked example: linking two school buildings 400 m apart","steps":["Distance 400 m is beyond the roughly 100 m limit for a twisted-pair Ethernet run.","The link carries all traffic for one building, so high bandwidth is needed.","The cable may run near the sports hall's electrical plant, so interference is a risk.","Wireless (a point-to-point link) is possible but affected by weather and obstacles."],"answer":"Fibre-optic: handles 400 m, gives high bandwidth and is immune to interference; the extra cost is justified for a backbone link."},{"t":"key","title":"Key points","items":["Copper: cheap, ~100 m, interference.","Fibre: light, very high bandwidth, long distance, immune to interference, secure, expensive.","Wireless: mobile, no cables, but interference, range and interception issues.","Justify by distance, bandwidth, interference, security, cost, mobility."]},{"t":"tip","text":"A 'recommend and justify' answer needs the recommendation plus reasons tied to the scenario's numbers – '400 m is too far for copper, which is limited to about 100 m'."}],"diagram":{"kind":"compare","title":"Copper, fibre or wireless?","caption":"Toggle between the three main media and compare them on the same criteria.","states":[{"label":"Twisted-pair copper","art":null,"points":["Electrical signals","About 100 m per run","Cheap and easy to install","Affected by electrical interference","Used for desk-to-switch links"]},{"label":"Fibre-optic","art":null,"points":["Pulses of light","Kilometres per run","Very high bandwidth","Immune to interference; hard to tap","Expensive; used for backbones and between buildings"]},{"label":"Wireless","art":null,"points":["Radio or microwave signals","Range tens of metres for Wi-Fi","Mobility; no cables","Interference, walls and distance reduce speed","Must be encrypted as signals can be intercepted"]}]},"check":[{"q":"Which medium is immune to electrical interference?","o":["Twisted-pair copper","Fibre-optic","Coaxial copper","Wi-Fi"],"a":1,"why":"Fibre carries light, not electrical signals."},{"q":"What is the approximate maximum run length for twisted-pair Ethernet?","o":["100 m","10 m","1 km","10 km"],"a":0,"why":"About 100 m per run."},{"q":"Which is a disadvantage of wireless transmission?","o":["No mobility","It needs more cabling","It cannot carry data","Signals can be intercepted more easily"],"a":3,"why":"Radio signals spread beyond the building."}],"exam":[],"practice":[{"q":"Recommend a transmission medium to link two buildings 400 m apart on a school campus, justifying your answer.","m":3,"a":"Fibre-optic (1). It works over long distances, whereas copper is limited to about 100 m (1); it provides high bandwidth for all of one building's traffic / is immune to electrical interference (1)."}],"videos":[{"title":"Data transmission and error control – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS12-video"},{"title":"AQA A Level SLR20 – Data transmission basics","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr20-data-transmission-basics/"}],"terms":["Fibre-optic cable"]},{"id":"c03-p12","spec":"Distinguish bandwidth and bit rate and explain broadband","lessons":["IS12"],"summary":"Bandwidth is a channel's capacity (range of frequencies) and sets the maximum rate; bit rate is the number of bits actually sent per second; broadband carries many signals on different frequencies at once; transfer time = bits ÷ bit rate.","blocks":[{"t":"h","text":"Bandwidth"},{"t":"p","text":"[[Bandwidth]] is the range of frequencies a communication channel can carry. It determines the channel's **maximum capacity**: the wider the range, the more data can be carried per second. In everyday use, bandwidth is loosely quoted in bits per second ('a 100 Mbps connection')."},{"t":"h","text":"Bit rate"},{"t":"p","text":"[[Bit rate]] is the number of bits **actually transmitted** per second, measured in bps, kbps, Mbps or Gbps (1 Mbps = 1 000 000 bits per second). A higher bandwidth allows a higher maximum bit rate, but the real bit rate falls with congestion, distance, interference and how many users share the link."},{"t":"compare","head":["Bandwidth","Bit rate"],"rows":[["What it is","Capacity of the channel (range of frequencies)","Bits actually sent per second"],["Sets","The maximum possible rate","The rate achieved in practice"],["Affected by","The medium and equipment","Congestion, distance, interference, sharing"]]},{"t":"h","text":"Broadband"},{"t":"p","text":"[[Broadband]] is a high-capacity connection that carries **multiple signals on different frequencies at the same time** over one medium. A broadband line can carry voice, TV and internet data at once. In everyday language it means any 'always-on', high-speed internet connection, such as full-fibre (FTTP) or fibre-to-the-cabinet."},{"t":"h","text":"Transfer time"},{"t":"p","text":"**Transfer time = file size in bits ÷ bit rate.** Remember there are 8 bits in a byte, and use the same prefix (mega with mega) on both sides."},{"t":"example","title":"Worked calculation: downloading a 600 MB file at 40 Mbps","steps":["Convert to bits: 600 MB × 8 = 4800 Mb (megabits).","Divide by the bit rate: 4800 Mb ÷ 40 Mbps = 120 seconds.","Convert: 120 s = 2 minutes.","If 1 MB is taken as 1024 × 1024 bytes and 1 Mbps as 10⁶ bps, the answer is about 126 seconds – say which convention you use."],"answer":"120 seconds (2 minutes)"},{"t":"key","title":"Key points","items":["Bandwidth: capacity / range of frequencies; sets the maximum rate.","Bit rate: bits actually sent per second.","Broadband: many signals on different frequencies at once over one medium.","Transfer time = bits ÷ bit rate; ×8 to turn bytes into bits."]},{"t":"tip","text":"Always show the ×8 conversion and give units. Method marks are awarded for the conversion and the division even if the final answer is wrong."}],"diagram":{"kind":"calc","title":"Transfer time calculator","caption":"Enter a file size in megabytes and a bit rate in megabits per second (decimal units, 1 MB = 8 Mb).","inputs":[{"id":"size","label":"File size (MB)","value":600},{"id":"rate","label":"Bit rate (Mbps)","value":40}],"formula":"size * 8 / rate","result":{"label":"Transfer time","unit":"seconds"},"show":["seconds"]},"check":[{"q":"Which best describes bit rate?","o":["The range of frequencies a channel can carry","The length of a cable","The number of bits actually transmitted per second","The number of devices on a network"],"a":2,"why":"Bit rate is the actual data rate."},{"q":"How long does a 250 MB file take at 20 Mbps (1 MB = 8 Mb)?","o":["12.5 s","100 s","50 s","200 s"],"a":1,"why":"250 × 8 = 2000 Mb; 2000 ÷ 20 = 100 s."},{"q":"What makes a connection 'broadband' in the technical sense?","o":["It carries several signals on different frequencies at once","It uses copper","It is wireless","It has a static IP address"],"a":0,"why":"Broadband shares the medium across frequencies."}],"exam":[],"practice":[{"q":"Distinguish between bandwidth and bit rate.","m":2,"a":"Bandwidth is the capacity of the channel / range of frequencies it can carry, setting the maximum data rate (1); bit rate is the number of bits actually transmitted per second (1)."},{"q":"Calculate how long it would take to transfer a 250 MB file over a 20 Mbps connection. Show your working.","m":3,"a":"250 × 8 = 2000 Mb (1); 2000 ÷ 20 (1) = 100 seconds (1). (Accept ≈105 s if binary prefixes used and stated.)"}],"videos":[{"title":"Data transmission and error control – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS12-video"},{"title":"AQA A Level SLR20 – Data transmission basics","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr20-data-transmission-basics/"}],"terms":["Bandwidth","Bit rate","Broadband"]},{"id":"c03-p13","spec":"Compare serial and parallel, simplex, half-duplex and full-duplex, and synchronous and asynchronous transmission","lessons":["IS12"],"summary":"Serial sends one bit at a time and suits long distances; parallel sends several at once but suffers skew; simplex, half- and full-duplex describe direction; synchronous uses a shared clock and blocks, asynchronous frames each character with start and stop bits.","blocks":[{"t":"h","text":"Serial and parallel"},{"t":"compare","head":["Serial","Parallel"],"rows":[["Method","Bits sent one after another along a single channel","Several bits sent at the same time on separate wires"],["Distance","Reliable over long distances","Short distances only"],["Problems","Fewer wires; no skew","[[Skew]] – bits on different wires arrive at slightly different times – and crosstalk between wires"],["Examples","USB, SATA, Ethernet, PCIe lanes","Older printer ports; some internal buses"]]},{"t":"p","text":"Parallel looks faster on paper, but skew forces the clock to be slowed so all bits can arrive before the next set. Fast serial links avoid this, which is why modern connections (USB, SATA, PCIe) are serial."},{"t":"h","text":"Direction"},{"t":"table","head":["Mode","Meaning","Example"],"rows":[["Simplex","Data in one direction only","Broadcast TV; a sensor sending readings to a controller"],["Half-duplex","Both directions, but only one at a time","Walkie-talkie (\"over\")"],["[[Full-duplex]]","Both directions at the same time","A phone call; switched Ethernet"]]},{"t":"h","text":"Timing"},{"t":"compare","head":["Synchronous","Asynchronous"],"rows":[["Clock","Sender and receiver share a clock signal (or keep in step with timing information)","No shared clock"],["Data sent as","Continuous blocks of data","Individual characters, each framed by a start bit and stop bit(s)"],["Overhead","Low – no per-character framing","Higher – e.g. 2 extra bits per 8-bit character"],["Suited to","Large, steady transfers; network links; inside the CPU","Irregular, occasional data, e.g. keyboard input"]]},{"t":"example","title":"Worked example: asynchronous overhead","steps":["Each 8-bit character is sent with 1 start bit and 1 stop bit = 10 bits on the line.","Useful data is 8 of every 10 bits, so 20% of the bit rate is overhead.","At 9600 bps, the maximum is 9600 ÷ 10 = 960 characters per second."],"answer":"Synchronous transmission avoids this per-character overhead, so suits large transfers."},{"t":"key","title":"Key points","items":["Serial: one bit at a time, long distances, no skew. Parallel: several bits at once, short distances, skew and crosstalk.","Simplex: one way. Half-duplex: both ways, one at a time. Full-duplex: both ways at once.","Synchronous: shared clock, continuous blocks. Asynchronous: start and stop bits per character."]},{"t":"tip","text":"'Explain why serial is used over long distances' (2 marks): parallel bits travel on separate wires and arrive at different times (skew) (1), corrupting data over distance; serial sends bits one after another on one channel so skew cannot occur (1)."}],"diagram":{"kind":"match","title":"Name the transmission mode","caption":"Match each situation to the transmission mode it uses.","pairs":[["Walkie-talkie: press to talk, release to listen","Half-duplex"],["Video call where both people talk at once","Full-duplex"],["A temperature sensor reporting to a heating controller","Simplex"],["Keystrokes each framed by start and stop bits","Asynchronous"],["Continuous blocks timed by a shared clock","Synchronous"],["USB sending bits one after another","Serial"]]},"check":[{"q":"Why is parallel transmission unsuitable over long distances?","o":["It uses only one wire","It cannot send numbers","It is always simplex","Skew means bits on different wires arrive at different times"],"a":3,"why":"Skew grows with distance."},{"q":"A phone call where both people can speak at the same time is…","o":["simplex","half-duplex","full-duplex","asynchronous"],"a":2,"why":"Both directions simultaneously."},{"q":"In asynchronous transmission, how is each character marked?","o":["With a shared clock signal","With start and stop bits","With a parity byte at the end of the block","With an IP address"],"a":1,"why":"Start and stop bits frame each character."}],"exam":[],"practice":[{"q":"Explain why serial transmission is used over long distances instead of parallel.","m":2,"a":"In parallel transmission bits travel on separate wires and arrive at slightly different times (skew) / crosstalk occurs (1); serial sends bits one after another on a single channel, so there is no skew and data stays reliable over distance (1)."},{"q":"Describe the difference between synchronous and asynchronous transmission.","m":2,"a":"Synchronous: sender and receiver share a clock signal and data is sent in continuous blocks (1). Asynchronous: no shared clock; each character is framed with start and stop bits (1)."}],"videos":[{"title":"Data transmission and error control – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS12-video"},{"title":"AQA A Level SLR20 – Data transmission basics","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr20-data-transmission-basics/"}],"terms":["Skew","Full-duplex","Asynchronous transmission"]},{"id":"c03-p14","spec":"Describe error detection (parity, checksum, CRC) and correction (ARQ)","lessons":["IS12"],"summary":"Parity bits, checksums and cyclic redundancy checks detect corrupted data; automatic repeat request corrects it by acknowledgement, timeout and retransmission.","blocks":[{"t":"p","text":"Noise and interference can flip bits during transmission. Error **detection** lets the receiver know data has been corrupted; error **correction** gets a good copy."},{"t":"h","text":"Parity"},{"t":"p","text":"A [[Parity bit]] is an extra bit added to a group of bits so that the total number of 1s is even (**even parity**) or odd (**odd parity**). Sender and receiver agree the scheme; the receiver counts the 1s and flags an error if the count is wrong."},{"t":"list","items":["Even parity, data 1101001: it has four 1s – already even – so the parity bit is 0 → **11010010**.","If one bit flips in transit, the count becomes odd and the error is detected.","**Limitations:** if two bits (or any even number) flip, the count is even again and the error is missed; and parity cannot show *which* bit is wrong."],"ordered":false},{"t":"h","text":"Checksum"},{"t":"p","text":"A [[Checksum]] is a value calculated from a whole block of data – for example, the sum of all the bytes MOD 256 – and sent with it. The receiver performs the same calculation and compares. If the values differ, the block is corrupted."},{"t":"p","text":"For bytes 23, 250, 117 and 64: sum = 454; 454 MOD 256 = **198**. If the receiver calculates anything other than 198, an error is detected. Simple checksums can miss errors that cancel out (one byte +1, another −1)."},{"t":"h","text":"Cyclic redundancy check (CRC)"},{"t":"p","text":"A [[Cyclic redundancy check (CRC)]] treats the block of data as one long binary number and divides it by an agreed binary 'generator' value (a polynomial) using XOR arithmetic. The **remainder** is sent with the data. The receiver repeats the division; a different remainder means an error. CRC is very effective at detecting **burst errors** (several neighbouring bits corrupted), which is why Ethernet and Wi-Fi frames carry a CRC in their trailer."},{"t":"h","text":"Error correction: automatic repeat request"},{"t":"p","text":"[[Automatic repeat request (ARQ)]] corrects errors by retransmission. It needs a detection method (usually CRC), **acknowledgements** and a **timeout**."},{"t":"list","items":["The sender transmits a block and starts a timer.","The receiver checks the block. If it is correct, it sends a positive acknowledgement (ACK).","If an error is detected, the receiver sends a negative acknowledgement (NAK) – or sends nothing.","If the sender receives a NAK, or the timer expires without an ACK, it retransmits the block.","This repeats until the block is acknowledged (or a retry limit is reached)."],"ordered":true},{"t":"note","text":"Echo checking (the receiver sends the data back for the sender to compare) is a simpler alternative that doubles traffic. Forward error correction, such as Hamming codes, lets the receiver fix errors without retransmission; it is beyond the hub lesson and may not be required."},{"t":"key","title":"Key points","items":["Parity: makes the count of 1s even or odd; detects single-bit errors; misses an even number of errors; cannot locate the error.","Checksum: value calculated from the block, recalculated and compared.","CRC: remainder from binary division by a generator; strong against burst errors.","ARQ: ACK / NAK, timeout and retransmission corrects errors."]},{"t":"tip","text":"A full ARQ answer (4 marks) mentions: error check on receipt – acknowledgement sent if correct – NAK or no ACK if wrong – timeout – retransmission. For parity limitations, say it cannot detect an even number of bit errors *and* cannot locate the error."}],"diagram":{"kind":"bits","title":"Even parity checker","caption":"The 8 bits are 7 data bits plus an even parity bit (rightmost). Toggle any bit and count the 1s: an odd count means an error has been detected. Flip two bits and notice the error goes undetected.","n":8,"modes":["unsigned","hex"],"start":"11010010"},"check":[{"q":"Using even parity, what is the parity bit for 1011001?","o":["0","1","It cannot be calculated","2"],"a":0,"why":"1011001 has four 1s – already even – so the parity bit is 0."},{"q":"Which error does a single parity bit fail to detect?","o":["One bit flipped","The parity bit flipped","The first bit flipped","Two bits flipped"],"a":3,"why":"Two flips leave the count of 1s with the same parity."},{"q":"In ARQ, what does the sender do if its timer expires before an ACK arrives?","o":["Deletes the data","Sends the next block","Retransmits the block","Switches to parallel transmission"],"a":2,"why":"A timeout triggers retransmission."}],"exam":[],"practice":[{"q":"Add an even parity bit to 1101001 and explain one limitation of parity checking.","m":3,"a":"1101001 has four 1s so the parity bit is 0 (1) → 11010010 (1). Limitation: cannot detect an even number of bit errors because the count stays even / cannot identify which bit is wrong (1)."},{"q":"Describe how automatic repeat request (ARQ) is used to correct transmission errors.","m":4,"a":"Receiver checks each block using an error detection method, e.g. CRC (1) / sends a positive acknowledgement if the block is correct (1) / sends a negative acknowledgement or nothing if an error is found (1) / sender retransmits the block if it gets a NAK or if a timeout expires before an ACK (1)."}],"videos":[{"title":"Data transmission and error control – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS12-video"},{"title":"AQA A Level SLR12 – Error checking and correction","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1600"}],"terms":["Parity bit","Checksum","Cyclic redundancy check (CRC)","Automatic repeat request (ARQ)"]}],"topic":"G20","topicName":"Networks","links":{"tests":[{"id":"GJ","title":"A2 1 topic test J: Networks, security and the cloud","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GJ"}],"papers":[{"id":"GP3","title":"A2 1 Practice Paper","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GP3"}]}},{"id":"c04","n":4,"title":"Network security and cloud computing","intro":"How organisations protect their networks and data – from firewalls and encryption to authentication and VPNs – and how cloud computing and virtualisation change where and how their systems run.","pages":[{"id":"c04-p01","spec":"Describe threats to networks and data","lessons":["IS13"],"summary":"Networks and the data on them face malware, social engineering, unauthorised access, denial-of-service attacks, interception and insider misuse; each threat calls for its own mix of technical and procedural countermeasures.","blocks":[{"t":"p","text":"Any organisation that connects its computers to a network – and especially to the internet – exposes its data to people who want to steal, alter or destroy it, or simply to stop the system working. In the exam you need to name a threat precisely, explain **how** it works and **what harm** it does to the organisation in the scenario, then match it to a countermeasure."},{"t":"h","text":"The main threats"},{"t":"table","head":["Threat","How it works","Typical harm"],"rows":[["[[Malware]]","Malicious software: a *virus* attaches to files and spreads when they are run; a *worm* spreads across a network by itself; a *trojan* hides inside software that looks useful; *spyware* secretly records activity; *[[ransomware]]* encrypts files and demands payment","Data deleted, stolen or locked; systems unusable; ransom demands"],["[[Phishing]] and [[social engineering]]","Deceiving people rather than computers: fake emails or websites, phone calls pretending to be IT support, or targeted *spear-phishing* of named staff","Passwords handed over; malware run by the victim"],["Hacking ([[unauthorised access]])","Guessing or cracking weak passwords, exploiting unpatched software, or attacks such as SQL injection through badly validated web forms","Data stolen or altered; attacker gains a foothold for further attacks"],["[[Denial of service (DoS)]]","Flooding a server or network with so many requests that genuine users cannot be served; a *distributed* attack (DDoS) uses a [[botnet]] of thousands of hijacked devices","Website or service offline; lost sales and reputation"],["Interception ([[man-in-the-middle attack|Man-in-the-middle attack]])","Capturing or altering data as it travels, e.g. on unsecured public Wi-Fi or through a fake access point","Credentials and confidential data read or changed in transit"],["[[Insider threat]]","Staff or contractors misusing their legitimate access, deliberately or by accident (e.g. emailing a spreadsheet to the wrong person)","Data leaks that bypass perimeter defences"]],"caption":"Threats to networks and data"},{"t":"h","text":"Defence in depth"},{"t":"p","text":"No single control stops every threat, so organisations layer them – an approach called [[defence in depth]]. Technical controls include firewalls, anti-malware software, prompt patching, encryption, strong authentication and VPNs. Procedural controls include staff training (especially about phishing), access rights based on job role, an acceptable use policy, and regular off-site or offline backups so that ransomware cannot hold the only copy of the data to ransom."},{"t":"example","title":"Worked example: matching threats to countermeasures","steps":["Threat 1 – a receptionist receives an email 'from the bank' asking her to confirm the practice's login. Countermeasure: phishing-awareness training plus multi-factor authentication, so a stolen password alone is useless.","Threat 2 – the booking server is unpatched. Countermeasure: an automatic patch-management policy; the vulnerability is closed before it can be exploited.","Threat 3 – ransomware could encrypt patient files. Countermeasure: daily backups kept offline or immutable, tested by regular restores.","Threat 4 – staff can open every record. Countermeasure: role-based access rights and audit logs, limiting what an insider can see and recording what they do."],"context":"A dental practice in Omagh stores patient records on a small network with internet access."},{"t":"key","title":"Key points","items":["Know at least five threats: malware, phishing/social engineering, unauthorised access, DoS/DDoS, interception, insider threats.","For each, explain the mechanism and the harm – not just the name.","Countermeasures combine technical controls and procedures; defence in depth assumes any one layer may fail."]},{"t":"tip","text":"In 'describe a threat' questions, the second mark usually comes from the consequence: 'a DDoS attack floods the web server with requests from a botnet **so genuine customers cannot place orders**'."},{"t":"warn","text":"Do not call every piece of malware a 'virus'. A worm spreads without a host file or user action; a trojan relies on the user installing it. Using the correct type shows A-level precision."}],"diagram":{"kind":"match","title":"Threat and countermeasure","caption":"Match each threat to the countermeasure that most directly reduces it.","pairs":[["Ransomware","Regular offline backups that can be restored"],["Phishing email","Staff awareness training and multi-factor authentication"],["DDoS attack","Traffic filtering and scalable capacity from the hosting provider"],["Interception on café Wi-Fi","Encrypting traffic through a VPN or HTTPS"],["Insider browsing records","Role-based access rights and audit logs"],["Exploited software bug","Prompt patching and updates"]]},"check":[{"q":"Malware that spreads across a network by itself, without attaching to a file, is a…","o":["trojan","worm","virus","spyware program"],"a":1,"why":"A worm self-replicates across networks; a virus needs a host file to be run."},{"q":"A DDoS attack differs from a DoS attack because it…","o":["steals passwords","uses many devices, often a botnet","only targets email servers","encrypts files"],"a":1,"why":"'Distributed' means the flood comes from many sources at once, which makes it harder to block."},{"q":"Which countermeasure best limits the damage an insider can do?","o":["A firewall","A proxy server","Role-based access rights with audit logs","Anti-malware software"],"a":2,"why":"Insiders are already inside the firewall; limiting and logging what they can access is the key control."}],"exam":[],"practice":[{"q":"A housing association in Lisburn stores tenants' details on its network. Describe two threats to this data and, for each, a suitable countermeasure.","m":4,"a":"Phishing: staff tricked into giving login details through fake emails (1); countermeasure – training to recognise phishing / MFA so a password alone is not enough (1). Ransomware: malware encrypts files and demands payment (1); countermeasure – regular backups held offline so data can be restored (1). Also credit DoS + filtering/extra capacity, insider + access rights, unpatched software + patch management."},{"q":"Explain why defence in depth is recommended rather than relying on a firewall alone.","m":2,"a":"A firewall cannot stop threats that arrive through permitted routes, e.g. phishing emails or insiders (1); several layers mean that if one control fails another still protects the data (1)."}],"videos":[{"title":"Network security: threats, firewalls, encryption and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS13-video"},{"title":"OCR A Level SLR11 – Network security threats","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr11-network-security-threats/"}],"terms":["Malware","Ransomware","Phishing","Social engineering","Unauthorised access","Denial of service (DoS)","Botnet","Man-in-the-middle attack","Insider threat","Defence in depth"]},{"id":"c04-p02","spec":"Explain the use of firewalls and proxy servers","lessons":["IS13"],"summary":"A firewall allows or blocks traffic according to rules; a proxy server makes requests on users' behalf, hiding internal addresses, filtering content and caching pages – but neither stops threats arriving by permitted routes.","blocks":[{"t":"p","text":"A [[firewall]] sits at the boundary between a trusted network and an untrusted one, usually the internet. It examines every packet passing in either direction and **allows or blocks** it according to a set of rules written by the network administrator. Firewalls can be hardware appliances, software on a router, or software on each individual computer (a host firewall)."},{"t":"h","text":"What a firewall checks"},{"t":"table","head":["Type","What it examines","Strength / weakness"],"rows":[["Packet filtering","Each packet's header on its own: source and destination [[IP address]], port number and protocol","Fast and simple, but cannot see the content or whether a packet belongs to a genuine conversation"],["[[Stateful inspection]]","Keeps a table of open connections and only admits incoming packets that belong to a conversation started from inside","Blocks unsolicited incoming traffic; slightly more processing"],["Application-level (next generation)","Looks inside the payload, e.g. the HTTP request, and can block particular applications or malicious content","Most thorough; slowest and most expensive"]],"caption":"Types of firewall"},{"t":"example","title":"Worked example: a simple rule set","steps":["Rule 1: allow incoming TCP to port 443 on the web server – customers can reach the HTTPS site.","Rule 2: allow outgoing traffic from staff PCs to ports 80 and 443 – staff can browse the web.","Rule 3: block incoming traffic to port 3389 (remote desktop) from outside – attackers cannot try to log in remotely.","Final rule: deny everything not explicitly allowed. Rules are checked top to bottom and the first match wins."],"context":"A Belfast web shop's firewall is configured so that only what is needed gets through."},{"t":"h","text":"Proxy servers"},{"t":"p","text":"A [[proxy server]] is an intermediary: staff browsers send their web requests to the proxy, which fetches the page from the internet and passes it back. Because the outside world only ever sees the proxy, it provides several benefits:"},{"t":"list","items":["**Anonymity** – internal IP addresses are hidden from websites and attackers.","**Content filtering** – requests to blocked categories of site are refused, as the C2k filtering service does in Northern Ireland schools.","**Caching** – popular pages are stored locally, so repeat requests are served faster and less internet bandwidth is used.","**Logging** – every request can be recorded, supporting acceptable use policies and investigations."],"ordered":false},{"t":"key","title":"Key points","items":["Firewall: monitors traffic and allows or blocks it by rules on addresses, ports, protocols (and, in advanced firewalls, content).","Proxy: makes requests on users' behalf – hides addresses, filters, caches, logs.","Neither can stop a threat that arrives by an allowed route, such as a malicious attachment in permitted email or an insider."]},{"t":"tip","text":"A two-mark 'describe a firewall' answer needs both halves: **what it checks** (incoming and outgoing packets against rules) and **what it does** (blocks or allows them)."},{"t":"warn","text":"A firewall is not anti-malware software. It does not scan files on the disk for viruses; it controls which traffic may pass."}],"diagram":{"kind":"flow","title":"How a stateful firewall decides","caption":"Step through the checks an incoming packet faces before it reaches the internal network.","direction":"tb","nodes":[{"id":"a","label":"Packet arrives from internet","detail":"Every incoming packet carries a header with source and destination IP addresses, ports and protocol.","shape":"start"},{"id":"b","label":"Part of an existing connection?","detail":"The state table records conversations started from inside. Replies to those are expected.","shape":"decision"},{"id":"c","label":"Check rule list top to bottom","detail":"Rules match on address, port and protocol, e.g. allow TCP 443 to the web server.","shape":"process"},{"id":"d","label":"Rule says allow?","detail":"The first matching rule decides. If nothing matches, the default rule applies – normally deny.","shape":"decision"},{"id":"e","label":"Forward to internal host","detail":"The packet passes through to its destination.","shape":"end"},{"id":"f","label":"Drop and log","detail":"The packet is discarded and the attempt is logged for the administrator.","shape":"end"}],"edges":[["a","b"],["b","e","yes"],["b","c","no"],["c","d"],["d","e","yes"],["d","f","no"]]},"check":[{"q":"Which is NOT normally a function of a proxy server?","o":["Caching web pages","Hiding internal IP addresses","Issuing digital certificates","Filtering content"],"a":2,"why":"Certificates are issued by certificate authorities."},{"q":"A firewall that only admits incoming packets belonging to conversations started from inside is using…","o":["stateful inspection","packet caching","asymmetric encryption","port forwarding"],"a":0,"why":"It tracks the state of each connection."},{"q":"Why can a firewall not stop a phishing email that contains a malicious link?","o":["Firewalls only work on wireless networks","The email arrives through a permitted route","Firewalls cannot read IP addresses","Phishing uses UDP"],"a":1,"why":"Email traffic is allowed, so the firewall passes it; training and filtering are needed."}],"exam":[],"practice":[{"q":"Describe the purpose of a firewall.","m":2,"a":"Monitors/filters incoming and outgoing network traffic (1) and allows or blocks it according to a set of rules, e.g. on IP address, port or protocol (1)."},{"q":"A grammar school uses a proxy server for all pupil web access. Explain two benefits of this to the school.","m":4,"a":"Content filtering (1) – requests to inappropriate sites are blocked, helping safeguarding (1). Caching (1) – frequently used pages are stored locally so they load faster and save bandwidth (1). Also: logging for acceptable use enforcement; hiding internal addresses from outside."}],"videos":[{"title":"Network security: threats, firewalls, encryption and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS13-video"},{"title":"AQA A Level SLR21 – How firewalls work","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-how-firewalls-work/"}],"terms":["Firewall","Stateful inspection","Proxy server","IP address"]},{"id":"c04-p03","spec":"Explain symmetric and asymmetric encryption, digital signatures and digital certificates","lessons":["IS13"],"summary":"Symmetric encryption uses one shared key and is fast but has a key distribution problem; asymmetric encryption uses a public/private key pair that solves it but is slow, so protocols such as TLS combine them.","blocks":[{"t":"p","text":"[[Encryption]] scrambles plaintext into ciphertext using an algorithm and a key, so that anyone who intercepts the data cannot read it. Only someone holding the correct key can decrypt it. Encryption protects **confidentiality**; it does not stop data being intercepted, only being understood."},{"t":"h","text":"Symmetric encryption"},{"t":"p","text":"In [[symmetric encryption]] the **same secret key** encrypts and decrypts. Algorithms such as AES are very fast, so symmetric encryption is used for bulk data: whole disks, files, database backups and the data in a web session. Its weakness is the [[key distribution problem]]: the sender must somehow get the key to the receiver securely. If the key is sent over the same network, an eavesdropper can capture it and read everything."},{"t":"h","text":"Asymmetric (public key) encryption"},{"t":"p","text":"[[Asymmetric encryption]] uses a mathematically related **key pair**. The [[public key]] can be given to anyone; the [[private key]] is kept secret by its owner. Data encrypted with one key of the pair can only be decrypted with the other. To send Bob a confidential message, Alice encrypts it with **Bob's public key**; only **Bob's private key** can decrypt it. Nothing secret ever has to be sent, so the key distribution problem disappears. Algorithms such as RSA rely on mathematical problems, like factorising the product of two huge primes, that are easy one way and infeasible to reverse."},{"t":"compare","head":["Symmetric","Asymmetric"],"rows":[["Keys","One shared secret key","Public key + private key pair"],["Speed","Fast – suitable for large volumes","Much slower – used for small items"],["Key distribution","Key must be shared securely in advance","Public key can be published openly"],["Typical use","Disk, file and session encryption","Exchanging session keys; digital signatures"],["Example algorithm","AES","RSA, elliptic-curve cryptography"]]},{"t":"h","text":"Combining the two: HTTPS"},{"t":"p","text":"Because asymmetric encryption is slow, real systems use it only to set up a secure channel. When you visit an HTTPS site, the TLS handshake uses the server's public key (from its certificate) and asymmetric techniques to agree a fresh symmetric [[session key]]. The rest of the session is then encrypted symmetrically for speed. You get the easy key exchange of public key cryptography with the speed of symmetric encryption."},{"t":"key","title":"Key points","items":["Symmetric: one key, fast, key distribution problem.","Asymmetric: key pair; encrypt with the recipient's public key, decrypt with their private key; slow.","TLS/HTTPS uses asymmetric methods to agree a symmetric session key, then encrypts the session symmetrically."]},{"t":"tip","text":"Always say **whose** key and **which** key: 'encrypted with the recipient's public key'. 'Encrypted with the key' earns nothing."},{"t":"warn","text":"Encrypting a confidential message with your **own private key** does not keep it secret – anyone with your public key could decrypt it. That operation is used for signing, not confidentiality."}],"diagram":{"kind":"flow","title":"Hybrid encryption in HTTPS","caption":"Step through how a browser and server agree a symmetric session key using public key methods.","direction":"lr","nodes":[{"id":"a","label":"Browser connects","detail":"The browser asks the server for a secure (TLS) connection.","shape":"start"},{"id":"b","label":"Server sends certificate","detail":"The certificate contains the server's public key, signed by a certificate authority.","shape":"io"},{"id":"c","label":"Browser checks certificate","detail":"It verifies the CA's signature, the domain name and the expiry date.","shape":"decision"},{"id":"d","label":"Agree session key","detail":"Public key techniques are used so both sides end up with the same secret symmetric key, which is never sent in readable form.","shape":"process"},{"id":"e","label":"Symmetric session","detail":"All page data is now encrypted with the fast symmetric session key (e.g. AES).","shape":"end"},{"id":"f","label":"Warning shown","detail":"If the certificate is invalid, the browser warns the user not to continue.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","valid"],["c","f","invalid"],["d","e"]]},"check":[{"q":"Alice wants to send Bob a message that only Bob can read. Which key does she use to encrypt it?","o":["Alice's private key","Alice's public key","Bob's public key","Bob's private key"],"a":2,"why":"Only Bob's private key can decrypt data encrypted with Bob's public key."},{"q":"The main drawback of symmetric encryption is…","o":["it is slow","the key must be distributed securely","it needs two keys","it cannot encrypt files"],"a":1,"why":"Both parties need the same secret key – getting it to them safely is the problem."},{"q":"Why does HTTPS not encrypt the whole session asymmetrically?","o":["Asymmetric encryption is too slow for bulk data","Asymmetric keys cannot be shared","Browsers do not support it","It would be less secure"],"a":0,"why":"Asymmetric is used for key exchange; symmetric is much faster for the data."}],"exam":[],"practice":[{"q":"Explain the key distribution problem in symmetric encryption and how asymmetric encryption overcomes it.","m":3,"a":"In symmetric encryption both parties need the same secret key (1); sending the key across the network risks it being intercepted, letting the attacker decrypt everything (1). In asymmetric encryption the sender uses the recipient's public key, which can be shared openly, and only the recipient's private key – never transmitted – can decrypt (1)."}],"videos":[{"title":"Network security: threats, firewalls, encryption and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS13-video"},{"title":"AQA A Level SLR21 – Symmetric and asymmetric encryption","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-symmetric-asymmetric-encryption/"}],"terms":["Encryption","Symmetric encryption","Key distribution problem","Asymmetric encryption","Public key","Private key","Session key"]},{"id":"c04-p04","spec":"Explain symmetric and asymmetric encryption, digital signatures and digital certificates","lessons":["IS13"],"summary":"A digital signature – a hash encrypted with the sender's private key – proves who sent a message and that it is unchanged; a digital certificate from a certificate authority proves that a public key really belongs to its claimed owner.","blocks":[{"t":"p","text":"Encryption keeps data secret, but organisations also need to know **who** sent something and that it has **not been altered**. Asymmetric keys can be used the other way round to provide this."},{"t":"h","text":"Digital signatures"},{"t":"p","text":"A [[hash]] function turns a message of any length into a short, fixed-length digest. Change even one character of the message and the digest changes completely, and it is infeasible to work backwards from the digest to the message. A [[digital signature]] is the hash of a message encrypted with the **sender's private key**."},{"t":"example","title":"Worked example: signing and verifying a contract","steps":["Signing: Ciara's software hashes the contract to produce a digest.","It encrypts the digest with Ciara's private key – this encrypted digest is the signature – and sends it with the contract.","Verifying: the solicitor's software decrypts the signature with Ciara's public key, recovering the original digest.","It hashes the received contract itself and compares the two digests.","Match: the signature could only have been made with Ciara's private key (authenticity) and the contract is unchanged (integrity). No match: it has been altered or was not signed by Ciara."],"context":"Ciara, a farmer near Dungannon, signs a land-lease contract and emails it to a solicitor."},{"t":"p","text":"A valid signature also gives **non-repudiation**: Ciara cannot later deny signing, because only she holds her private key. Note that signing alone does not make the contract confidential – it could also be encrypted with the solicitor's public key if secrecy were needed."},{"t":"h","text":"Digital certificates"},{"t":"p","text":"Verification depends on having the genuine public key. An attacker could publish their own public key while claiming to be the bank. A [[digital certificate]] solves this: it is an electronic document, issued and digitally signed by a trusted [[certificate authority (CA)|Certificate authority (CA)]], that binds a public key to an identity such as a domain name or organisation. It contains the owner's name, their public key, the issuing CA, a serial number and validity dates. Browsers and operating systems ship with the public keys of trusted root CAs, so they can check the CA's signature on any certificate automatically."},{"t":"table","head":["Purpose","Achieved by"],"rows":[["Confidentiality","Encrypting with the recipient's public key (or a shared symmetric key)"],["Authenticity and integrity","Digital signature with the sender's private key"],["Trust in a public key","Digital certificate signed by a CA"]]},{"t":"key","title":"Key points","items":["Signature = hash of the message encrypted with the sender's private key; verified with the sender's public key.","It proves authenticity, integrity and non-repudiation – not confidentiality.","Certificate = CA-signed document binding a public key to an identity, so users know the key is genuine."]},{"t":"tip","text":"Four-mark 'describe how a digital signature is created and verified' answers need all of: hash the message; encrypt the hash with the sender's private key; receiver decrypts with the sender's public key; compares with a fresh hash of the message."},{"t":"warn","text":"A certificate is not issued by the browser or the website itself. It is issued by a certificate authority; a self-signed certificate is not trusted by browsers."}],"diagram":{"kind":"flow","title":"Creating and checking a digital signature","caption":"Step through signing (top row) and verification (bottom row).","direction":"lr","nodes":[{"id":"m","label":"Message","detail":"The document to be sent.","shape":"start"},{"id":"h1","label":"Hash message","detail":"Produces a short fixed-length digest.","shape":"process"},{"id":"s","label":"Encrypt digest with sender's private key","detail":"The result is the digital signature, sent with the message.","shape":"process"},{"id":"d","label":"Decrypt signature with sender's public key","detail":"The receiver recovers the digest the sender calculated.","shape":"process"},{"id":"h2","label":"Hash received message","detail":"The receiver calculates a fresh digest.","shape":"process"},{"id":"c","label":"Digests match?","detail":"Comparing the two digests.","shape":"decision"},{"id":"ok","label":"Authentic and unaltered","detail":"Sender proven, message unchanged.","shape":"end"},{"id":"bad","label":"Reject","detail":"The message was altered or not signed by the claimed sender.","shape":"end"}],"edges":[["m","h1"],["h1","s"],["s","d","sent"],["d","c"],["m","h2","sent"],["h2","c"],["c","ok","yes"],["c","bad","no"]]},"check":[{"q":"A digital signature is created by encrypting the message's hash with…","o":["the receiver's public key","the sender's private key","the CA's public key","a symmetric session key"],"a":1,"why":"Only the sender holds their private key, which proves who signed."},{"q":"What does a digital certificate do?","o":["Encrypts all web traffic","Binds a public key to the identity of its owner","Stores the user's password","Blocks malicious packets"],"a":1,"why":"It is a CA's signed statement that this key belongs to this organisation."},{"q":"Which property does a digital signature on its own NOT provide?","o":["Integrity","Authenticity","Non-repudiation","Confidentiality"],"a":3,"why":"The message can still be read; encryption is needed for confidentiality."}],"exam":[],"practice":[{"q":"Describe how a digital signature is created and verified.","m":4,"a":"Sender hashes the message to create a digest (1); encrypts the digest with the sender's private key to form the signature (1); receiver decrypts the signature using the sender's public key (1); receiver hashes the received message and compares – if the digests match the message is authentic and unaltered (1)."},{"q":"State the purpose of a digital certificate.","m":2,"a":"To prove that a public key belongs to a particular person/organisation/website (1), because it is issued and signed by a trusted certificate authority (1)."}],"videos":[{"title":"Network security: threats, firewalls, encryption and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS13-video"},{"title":"AQA A Level SLR21 – Digital certificates and signatures","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/aqa-alevel-slr21-digital-certificates-and-signatures/"}],"terms":["Hash","Digital signature","Digital certificate","Certificate authority (CA)"]},{"id":"c04-p05","spec":"Describe authentication methods and the use of virtual private networks (VPNs)","lessons":["IS13"],"summary":"Authentication confirms identity using something you know, have or are, ideally combined in multi-factor authentication; a VPN gives remote users an encrypted tunnel into the organisation's network across the internet.","blocks":[{"t":"p","text":"[[Authentication]] is the process of confirming that users are who they claim to be. It is different from [[authorisation]], which decides what an authenticated user is **allowed** to do – their access rights. A pupil authenticates by logging in; authorisation then lets them open their own work but not the teacher's markbook."},{"t":"h","text":"Authentication factors"},{"t":"table","head":["Factor","Examples","Weaknesses"],"rows":[["Something you **know**","Password, PIN, passphrase, security question","Guessed, reused, phished or seen over a shoulder"],["Something you **have**","Phone receiving a code or push prompt, authenticator app, smart card, hardware security key","Lost or stolen; SIM-swap attacks on text codes"],["Something you **are** ([[biometrics]])","Fingerprint, face, iris, voice","Cannot be changed if compromised; false accepts/rejects; privacy concerns (biometric data is special category data)"]],"caption":"The three authentication factors"},{"t":"p","text":"[[Multi-factor authentication (MFA)]] requires factors from **two or more different categories**, for example a password plus a code from an authenticator app. A phished password is then useless on its own. Two passwords are not MFA – they are the same factor twice. Strong password policies still matter: long passphrases, no reuse, checks against known-breached passwords and account lockout or delays after repeated failures."},{"t":"h","text":"Virtual private networks"},{"t":"p","text":"A [[virtual private network (VPN)]] creates an encrypted **tunnel** across a public network. A remote worker's VPN client authenticates to the organisation's VPN server, then all traffic between them is encapsulated and encrypted. The worker can use internal file shares and systems as if on site, and anyone intercepting the traffic on hotel or café Wi-Fi sees only ciphertext. Businesses also use site-to-site VPNs to join branch networks over the internet instead of leasing private lines."},{"t":"compare","head":["Benefits of a VPN","Limitations of a VPN"],"rows":[["Confidentiality","Data encrypted in transit over untrusted networks","Data is only protected in transit, not on the device or server"],["Access","Secure remote access to internal systems","Extra latency; depends on the VPN server's capacity"],["Cost","Uses the internet rather than leased lines","Needs configuration, licences and support"],["Security","Can be combined with MFA at login","A malware-infected laptop can bring threats straight into the network"]]},{"t":"key","title":"Key points","items":["Authentication = proving identity; authorisation = permissions after login.","Factors: know, have, are. MFA combines different categories.","VPN = encrypted tunnel across a public network for secure remote access; it does not protect a compromised endpoint."]},{"t":"tip","text":"In 'evaluate' questions, link each measure to the threat it addresses: MFA counters stolen passwords; a VPN counters interception on public Wi-Fi. Then give a limitation of each."},{"t":"warn","text":"Do not say a VPN makes the user 'anonymous' or 'protects against viruses'. In an organisation its job is encrypting traffic between the remote device and the network."}],"diagram":{"kind":"compare","title":"Remote working with and without a VPN","caption":"Toggle to compare what an eavesdropper on public Wi-Fi can see.","states":[{"label":"Without VPN","points":["Traffic travels across the café Wi-Fi and the internet in the clear (unless the app uses HTTPS)","An attacker on the same network can capture logins and file contents","Internal systems must be exposed to the internet to be reachable","No central control over the route the data takes"],"art":null},{"label":"With VPN","points":["Client authenticates to the VPN server, ideally with MFA","All traffic is encapsulated and encrypted inside a tunnel","An eavesdropper sees only encrypted packets to the VPN server","Internal systems stay hidden behind the firewall"],"art":null}]},"check":[{"q":"A fingerprint scan is authentication by…","o":["something you know","something you have","something you are","something you share"],"a":2,"why":"Biometrics are a physical characteristic."},{"q":"Which of these is genuine multi-factor authentication?","o":["Password and PIN","Password and code from an authenticator app","Two different passwords","Username and password"],"a":1,"why":"Different categories: know + have."},{"q":"Deciding which folders a logged-in user may open is…","o":["authentication","authorisation","encryption","tunnelling"],"a":1,"why":"Authorisation sets access rights after identity is confirmed."}],"exam":[],"practice":[{"q":"An accountancy firm in Newry lets its staff work from home. Evaluate the use of a VPN and multi-factor authentication to protect the firm's network.","m":6,"a":"VPN encrypts data between home and office (1) so client financial data intercepted on home or public Wi-Fi cannot be read (1); but it adds latency/cost and does not protect an infected home PC, which could spread malware into the network (1). MFA means a stolen or phished password alone cannot be used to log in (1); but it adds inconvenience/cost and staff may lose phones or tokens (1). Conclusion: used together with device security/anti-malware and training they give strong protection; neither alone is sufficient (1)."}],"videos":[{"title":"Network security: threats, firewalls, encryption and authentication – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS13-video"},{"title":"OCR A Level SLR11 – Network security threats","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr11-network-security-threats/"}],"terms":["Authentication","Authorisation","Biometrics","Multi-factor authentication (MFA)","Virtual private network (VPN)"]},{"id":"c04-p06","spec":"Describe cloud service models: infrastructure, platform and software as a service","lessons":["IS14"],"summary":"Cloud computing delivers resources over the internet on demand; in IaaS the customer rents virtual infrastructure, in PaaS they rent a ready platform to deploy code, and in SaaS they simply use the provider's finished application.","blocks":[{"t":"p","text":"[[Cloud computing]] is the on-demand delivery of computing resources – processing, storage, databases, networking and software – over the internet from a provider's data centres, usually paid for by subscription or by use. The widely used NIST definition gives five essential characteristics: on-demand self-service, broad network access, resource pooling between customers, rapid elasticity, and measured service (you pay for what you use)."},{"t":"h","text":"The three service models"},{"t":"p","text":"The models differ in **how much of the stack the provider manages** and how much is left to the customer."},{"t":"table","head":["Model","Provider manages","Customer manages","Examples"],"rows":[["[[Infrastructure as a service (IaaS)]]","Data centre, physical servers, storage, networking, virtualisation","Operating system, runtime, middleware, applications, data","Renting virtual machines and storage on AWS EC2 or Azure Virtual Machines"],["[[Platform as a service (PaaS)]]","All of the above plus the OS, runtime, database engine and scaling","Their own application code and data","Deploying a web app to Azure App Service or Google App Engine"],["[[Software as a service (SaaS)]]","The whole application","Only their data, users and settings","Microsoft 365, Gmail, Google Classroom, a cloud payroll package"]],"caption":"Who manages what"},{"t":"example","title":"Worked example: choosing a model","steps":["The IT team wants to move its own customised stock-control server out of the back office and keep full control of the operating system: **IaaS** – rent a virtual machine.","The developers are building a new online booking site and do not want to patch servers: **PaaS** – deploy code to a managed platform that scales automatically.","The office staff need email, word processing and shared calendars: **SaaS** – subscribe to an office suite used through a browser."],"context":"A garden-centre chain with branches in Ballymena and Coleraine is moving to the cloud."},{"t":"key","title":"Key points","items":["Cloud = on-demand computing resources over the internet, pooled and paid for by use.","IaaS: rent infrastructure, manage your own OS and software.","PaaS: rent a platform, deploy and manage only your code.","SaaS: use a finished application, manage only your data and settings."]},{"t":"tip","text":"To distinguish IaaS and PaaS, mention the operating system: in IaaS the **customer** installs and patches it; in PaaS the **provider** does."},{"t":"warn","text":"SaaS is not 'any website'. The key point is that a complete application, normally licensed by subscription, is hosted and maintained by the provider and accessed over the internet."}],"diagram":{"kind":"table-reveal","title":"The responsibility stack","caption":"Click a hidden cell to reveal who manages that layer in each model (P = provider, C = customer).","head":["Layer","On-premises","IaaS","PaaS","SaaS"],"rows":[["Applications","C","C","C","P"],["Data","C","C","C","C"],["Runtime and database engine","C","C","P","P"],["Operating system","C","C","P","P"],["Virtualisation","C","P","P","P"],["Servers, storage, networking","C","P","P","P"]],"hidden":[[0,4],[2,2],[2,3],[3,2],[3,3],[4,2],[5,2]]},"check":[{"q":"A developer deploys web app code without managing any servers or operating systems. This is…","o":["IaaS","PaaS","SaaS","on-premises hosting"],"a":1,"why":"Platform as a service: the provider runs the OS and runtime."},{"q":"In IaaS, who installs and patches the operating system?","o":["The cloud provider","The customer","The certificate authority","The ISP"],"a":1,"why":"IaaS supplies virtual hardware only."},{"q":"Which is an example of SaaS?","o":["Renting a virtual server","An online office suite used in a browser","A hypervisor","A managed database runtime for developers"],"a":1,"why":"The whole application is provided."}],"exam":[],"practice":[{"q":"Describe what is meant by software as a service (SaaS) and give an example.","m":2,"a":"Application software hosted and maintained by the provider and accessed over the internet/browser, usually by subscription (1); e.g. Microsoft 365 / Gmail / Google Classroom (1)."},{"q":"Explain the difference between IaaS and PaaS.","m":2,"a":"In IaaS the provider supplies virtual hardware (servers, storage, networking) and the customer installs and manages the OS and software (1); in PaaS the provider also manages the OS, runtime and database so the customer only develops/deploys their applications (1)."}],"videos":[{"title":"Cloud computing and virtualisation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS14-video"}],"terms":["Cloud computing","Infrastructure as a service (IaaS)","Platform as a service (PaaS)","Software as a service (SaaS)"]},{"id":"c04-p07","spec":"Compare public, private and hybrid cloud deployment","lessons":["IS14"],"summary":"A public cloud is shared by many customers and is cheap and scalable; a private cloud serves one organisation and gives more control at higher cost; a hybrid cloud combines them so sensitive work stays private while peaks use public capacity.","blocks":[{"t":"p","text":"The service model says **what** is rented; the deployment model says **where it runs and who shares it**."},{"t":"table","head":["Model","Description","Typical users"],"rows":[["[[Public cloud]]","Infrastructure owned and run by a provider and shared (multi-tenant) by many organisations over the internet","Start-ups, small firms, workloads with variable demand"],["[[Private cloud]]","Cloud-style pooled, self-service infrastructure used by one organisation only – in its own data centre or hosted by a provider on dedicated hardware","Banks, health bodies, government – strict security or regulatory requirements"],["[[Hybrid cloud]]","A private cloud (or on-premises systems) and public cloud linked so that data and applications can move between them","Organisations with sensitive core data and fluctuating demand"]],"caption":"Deployment models"},{"t":"compare","head":["Public cloud","Private cloud"],"rows":[["Cost","No capital outlay; pay per use; cheapest for most workloads","High capital and staffing costs"],["Scalability","Effectively unlimited, available in minutes","Limited to the hardware the organisation owns"],["Control and customisation","Limited – provider sets the platform and upgrade schedule","Full control over hardware, configuration and location"],["Security and compliance","Strong provider security but shared infrastructure and data may be stored abroad","Dedicated resources; easier to prove where data is held"],["Maintenance","Done by the provider","Done by in-house staff"]]},{"t":"h","text":"Why hybrid is common"},{"t":"p","text":"Many organisations end up hybrid. Core systems and special category data stay in the private environment, while less sensitive workloads – the public website, email, development and testing – run in the public cloud. **Cloud bursting** lets an application that normally runs privately overflow into public capacity at peaks, such as the night exam results are published. The price is complexity: two environments to secure, connect and manage."},{"t":"example","title":"Worked example: recommending a model","steps":["Patient records are special category data and the trust wants tight control over location and access – keep them in a private cloud.","The appointment-booking website has heavy peaks every Monday morning – run it in the public cloud, which can scale on demand.","Recommendation: a **hybrid cloud**, because it meets the security needs for records while giving cheap scalability for the public-facing service."],"context":"A health and social care trust in Northern Ireland is planning its cloud strategy."},{"t":"key","title":"Key points","items":["Public: shared, cheap, highly scalable, less control.","Private: one organisation, more control and easier compliance, more expensive.","Hybrid: both linked; sensitive work private, peaks and less sensitive work public; more complex."]},{"t":"tip","text":"'Compare' questions need both sides of each point in th
