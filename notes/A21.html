2","s3","s3A"],"a":2,"why":"It is an unauthorised act intended to impair the operation of a computer."},{"q":"Selling a ransomware kit on the dark web is an offence under…","o":["s1","s2","s3A","No section – it is only software"],"a":2,"why":"Making or supplying articles for use in CMA offences."},{"q":"What is the maximum sentence for an offence under s3ZA where there is serious damage to human welfare?","o":["2 years","5 years","10 years","Life imprisonment"],"a":3,"why":"The most serious attacks on critical infrastructure."}],"exam":[],"practice":[{"q":"A pupil uses a teacher's password to log in and change their exam marks. Identify which offences under the Computer Misuse Act 1990 have been committed and explain why.","m":4,"a":"Section 1 – unauthorised access (1), because the pupil knowingly used someone else's password to access material they had no right to (1). Section 3 – unauthorised modification/impairment (1), because altering the marks impairs the reliability of the data (1). (Credit s2 if argued as access with intent to commit further offence, e.g. fraud.)"},{"q":"Describe the offence created by section 3A of the Computer Misuse Act 1990.","m":2,"a":"Making, adapting, supplying or obtaining an article/tool (1) intending or believing it will be used to commit an offence under s1, s3 or s3ZA, e.g. selling malware (1)."}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Computer Misuse Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr16-computer-misuse-act/"}],"terms":["Computer Misuse Act 1990","Unauthorised access"]},{"id":"c06-p04","spec":"Describe the purpose of the Copyright, Designs and Patents Act 1988, the Freedom of Information Act 2000 and the Regulation of Investigatory Powers Act 2000","lessons":["IS17"],"summary":"The Copyright, Designs and Patents Act 1988 protects creators' work, including software, from being copied, adapted or distributed without permission; organisations use software under licences that set what they may do.","blocks":[{"t":"p","text":"The **Copyright, Designs and Patents Act 1988** (CDPA) gives creators exclusive rights over their original work. [[Copyright]] arises **automatically** when an original work is recorded – there is no need to register it or use the © symbol, although the symbol is a useful reminder. Computer programs (including their source code and design materials) are protected as literary works, and databases, websites, images, music, video and fonts are all protected too."},{"t":"h","text":"What copyright prevents"},{"t":"list","items":["Copying a work, including installing software on more machines than the licence allows.","Distributing or sharing copies, e.g. uploading pirated software or film files.","Adapting a work, e.g. modifying someone else's code and publishing it as your own.","Renting or lending it out, or communicating it to the public online, without permission."],"ordered":false},{"t":"p","text":"For literary works such as program code, copyright generally lasts for the **author's life plus 70 years**; for computer-generated works with no human author, it currently lasts 50 years from creation. Limited exceptions allow, for example, a legitimate user to make a back-up copy of a program and to decompile it where necessary for interoperability. Ideas and algorithms themselves are not protected by copyright – only their expression in code or text."},{"t":"h","text":"Software licences"},{"t":"table","head":["Licence","What it permits"],"rows":[["Single-user","Installation for one user or device"],["Multi-user / site licence","Installation on a set number of machines, or every machine at one site"],["Subscription (SaaS)","Use for as long as payments continue; updates included"],["[[Open source]]","Free use, study, modification and redistribution under the licence's conditions (e.g. GPL requires changes to be shared under the same licence)"],["Freeware / shareware","Free use (freeware) or free trial before payment (shareware), but the code remains protected"]],"caption":"Common types of software [[software licence|Software licence]]"},{"t":"example","title":"Worked example: a licensing breach","steps":["A school buys one single-user licence for a design package and installs it on 30 computers.","29 installations are unauthorised copies – a breach of the CDPA.","The software company can sue for damages and the cost of the missing licences; deliberate commercial-scale infringement can be a criminal offence.","Prevention: a software asset register, licence audits, locked-down installation rights and an acceptable use policy for staff."]},{"t":"key","title":"Key points","items":["Copyright is automatic and protects software, websites, images, music, video and databases.","It prevents copying, distributing, adapting and renting without permission; code is protected for the author's life + 70 years.","Software is used under licence; organisations need licence management to stay legal."]},{"t":"tip","text":"For licensing questions, name the Act, say exactly what has been copied or shared without permission, and state a consequence – legal action, damages, fines or reputational harm."},{"t":"note","text":"The UK government has been consulting on how copyright should apply to AI training data and AI-generated works. Any changes would post-date this edition; check current guidance before relying on the computer-generated works rule."}],"diagram":{"kind":"match","title":"Licence or infringement?","caption":"Match each situation to the correct description.","pairs":[["Installing a site-licensed package on every PC in the school","Permitted by the licence"],["Copying a friend's game installer to avoid buying it","Infringement – unauthorised copying"],["Modifying GPL code and sharing it under the GPL","Permitted by an open source licence"],["Using a photo from a website in a printed brochure without permission","Infringement – the image is protected automatically"],["Writing your own program that uses the same sorting algorithm as a rival","Not infringement – algorithms and ideas are not copyright"]]},"check":[{"q":"When does copyright protection begin?","o":["When the work is registered","Automatically when the original work is recorded","When the © symbol is added","After one year"],"a":1,"why":"No registration is needed in the UK."},{"q":"How long does copyright in program code generally last?","o":["10 years","25 years from publication","The author's life plus 70 years","For ever"],"a":2,"why":"Program code is a literary work."},{"q":"Which is NOT protected by copyright?","o":["Source code","A database","An idea for an app","A website's images"],"a":2,"why":"Only the expression of an idea is protected."}],"exam":[],"practice":[{"q":"A software company discovers that a school has installed one licensed copy of its program on 50 computers. Explain which law has been broken and the possible consequences.","m":4,"a":"The Copyright, Designs and Patents Act 1988 (1), because the school has made 49 unauthorised copies beyond its single-user licence (1). Consequences: the company could take legal action/claim damages or the cost of the licences (1); damage to the school's reputation / staff could face disciplinary action / the software would have to be removed (1)."}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Copyright, Designs and Patents Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr16-copyright-design-patents-act/"}],"terms":["Copyright","Software licence","Open source"]},{"id":"c06-p05","spec":"Describe the purpose of the Copyright, Designs and Patents Act 1988, the Freedom of Information Act 2000 and the Regulation of Investigatory Powers Act 2000","lessons":["IS17"],"summary":"The Freedom of Information Act 2000 lets anyone request recorded information from public authorities within 20 working days, subject to exemptions; the Regulation of Investigatory Powers Act 2000 controls covert surveillance and powers to demand decryption of protected data.","blocks":[{"t":"h","text":"Freedom of Information Act 2000"},{"t":"p","text":"The [[Freedom of Information Act 2000]] (FOIA) promotes **openness and accountability** in the public sector. It gives anyone, anywhere, the right to request **recorded information** held by a public authority – government departments, councils, health and social care trusts, the PSNI, universities and grant-aided schools (including grammar schools) in Northern Ireland. It does **not** apply to private companies."},{"t":"list","items":["The authority must say whether it holds the information and normally provide it **within 20 working days**.","Requests must be in writing (email counts) and need not give a reason or mention the Act.","Exemptions apply – some absolute (e.g. personal data of others, security bodies), some qualified by a public interest test (e.g. commercial interests, prejudice to law enforcement). A request may also be refused if it would cost more than the appropriate limit.","Authorities must also publish information proactively through a **publication scheme**.","Complaints go first to the authority, then to the [[Information Commission]]."],"ordered":false},{"t":"compare","head":["Freedom of information request","Subject access request"],"rows":[["Law","Freedom of Information Act 2000","UK GDPR / Data Protection Act 2018"],["Who it applies to","Public authorities only","Any data controller, public or private"],["What you get","Recorded information about the authority's activities","Your own personal data"],["Time limit","20 working days","One month"]]},{"t":"h","text":"Regulation of Investigatory Powers Act 2000"},{"t":"p","text":"The **Regulation of Investigatory Powers Act 2000** (RIPA) sets out when public bodies – police, intelligence agencies, HMRC, and some councils – may carry out covert investigation, and makes sure it is **authorised, necessary and proportionate**, in line with the right to respect for private life under the Human Rights Act 1998."},{"t":"table","head":["Part","Covers"],"rows":[["Part I","Interception of communications and access to communications data – now largely replaced by the Investigatory Powers Act 2016"],["Part II","Directed and intrusive covert surveillance, and covert human intelligence sources (undercover officers and informants)"],["Part III","Power to require **protected (encrypted) electronic data** to be disclosed in intelligible form, or the key to be handed over; failing to comply with such a notice is a criminal offence"]],"caption":"Parts of RIPA"},{"t":"p","text":"The [[Investigatory Powers Act 2016]] (amended in 2024) now governs interception, bulk data collection, equipment interference (lawful hacking) and requirements on communications providers to retain communications data, overseen by the Investigatory Powers Commissioner. The debate it raises is about balance: national security and the detection of serious crime against individual privacy and the risk of misuse."},{"t":"key","title":"Key points","items":["FOIA 2000: anyone can request information from public authorities; 20 working days; exemptions; publication schemes; not private firms.","RIPA 2000: regulates covert surveillance and informants (Part II) and the power to demand decryption keys (Part III).","Interception is now mainly under the Investigatory Powers Act 2016."]},{"t":"tip","text":"Do not confuse a freedom of information request (information about a public body) with a subject access request (your own personal data). Examiners regularly penalise this."},{"t":"warn","text":"RIPA does not let employers or private individuals intercept communications. It regulates **public bodies'** investigative powers."}],"diagram":{"kind":"compare","title":"Three Acts at a glance","caption":"Toggle between the Acts to compare their purpose and who they affect.","states":[{"label":"CDPA 1988","points":["Purpose: protect creators' rights","Applies to everyone using others' work","Software used under licence","Enforced through civil action and criminal law"],"art":null},{"label":"FOIA 2000","points":["Purpose: openness and accountability","Applies to public authorities only","Requests answered within 20 working days","Regulated by the Information Commission"],"art":null},{"label":"RIPA 2000","points":["Purpose: lawful, proportionate covert investigation","Applies to police, agencies and some public bodies","Part III: power to demand decryption keys","Interception now mainly under the Investigatory Powers Act 2016"],"art":null}]},"check":[{"q":"A journalist asks the Department of Health for data on hospital waiting times. Which law gives this right?","o":["UK GDPR","Freedom of Information Act 2000","Computer Misuse Act 1990","RIPA 2000"],"a":1,"why":"FOIA covers recorded information held by public authorities."},{"q":"A private supermarket chain receives an FOI request. It…","o":["must reply within 20 working days","is not covered by FOIA","must reply within one month","must publish the data"],"a":1,"why":"FOIA applies only to public authorities."},{"q":"Which part of RIPA allows the police to require someone to hand over an encryption key?","o":["Part I","Part II","Part III","Part IV"],"a":2,"why":"Part III covers protected electronic information."}],"exam":[],"practice":[{"q":"Explain the purpose of the Freedom of Information Act 2000.","m":2,"a":"To promote openness/transparency and accountability of public bodies (1) by giving anyone the right to request recorded information held by public authorities, which must be provided within 20 working days unless an exemption applies (1)."},{"q":"Describe two powers given to public bodies by the Regulation of Investigatory Powers Act 2000.","m":4,"a":"Covert surveillance (1) – police/agencies may carry out authorised, proportionate surveillance and use covert human intelligence sources (1). Access to encrypted data (1) – they may require a person to decrypt protected data or hand over the key, with refusal an offence (1). (Credit interception/communications data with reference to IPA 2016.)"}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Investigatory Powers Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr16-investigatory-powers-act/"}],"terms":["Freedom of Information Act 2000","Investigatory Powers Act 2016"]},{"id":"c06-p06","spec":"Apply legislation to scenarios involving information systems","lessons":["IS17"],"summary":"Applying legislation means identifying the precise Act and principle, right or section that a scenario involves, explaining why it applies, and stating the consequence or the action the organisation should take.","blocks":[{"t":"p","text":"Scenario questions test whether you can **diagnose** which law applies and **apply** it precisely. Use a three-step method every time:"},{"t":"list","items":["**Identify** the Act – and the specific principle, right or section.","**Explain** why it applies, quoting facts from the scenario.","**State** the consequence or the remedy – what the organisation must do, or what could happen to it."],"ordered":true},{"t":"example","title":"Worked example 1: a lost memory stick","steps":["Scenario: a teacher loses an unencrypted USB stick holding pupils' names and medical conditions.","Identify: UK GDPR / Data Protection Act 2018 – integrity and confidentiality principle; health data is special category data.","Explain: the school, as data controller, failed to use appropriate security such as encryption.","Consequence: the school must assess the breach, report it to the Information Commission within 72 hours if it risks pupils' rights, tell families if the risk is high, and could face enforcement action; it should require encrypted devices in future."]},{"t":"example","title":"Worked example 2: an ex-employee's login","steps":["Scenario: a sacked sales rep uses his still-active password to download the customer list for his new employer.","Computer Misuse Act s1 (unauthorised access – his authorisation ended when he left), possibly s2 if intended for further offences.","Data protection: the rep obtained personal data without the controller's consent – an offence under the Data Protection Act 2018; the firm also breached the security principle by not disabling his account.","Remedy: leaver procedures that remove access on the last day; audit logs."]},{"t":"table","head":["Scenario","Main law","Key point"],"rows":[["Council refuses to reveal how much it spent on IT consultants","FOIA 2000","Must answer within 20 working days unless an exemption (e.g. commercial interests) applies and passes the public interest test"],["Company copies photos from a competitor's website onto its own","CDPA 1988","Images are protected automatically; unauthorised copying and publication"],["Gym keeps former members' bank details for ten years","UK GDPR","Storage limitation – no longer necessary"],["Hacker sells a botnet service to take down websites","Computer Misuse Act","s3A (supplying articles) and s3 (impairing operation)"],["Police need a suspect's encrypted laptop decrypted","RIPA 2000 Part III","Notice to disclose key; refusal is an offence"]],"caption":"Quick diagnosis"},{"t":"key","title":"Key points","items":["Identify the Act and specific provision; explain using the scenario; state the consequence or remedy.","One scenario often involves more than one Act – data protection and the Computer Misuse Act often overlap.","Use the correct names: Information Commission, data controller, special category data, s1/s3."]},{"t":"tip","text":"Quote the scenario. 'The school breached integrity and confidentiality because the stick was unencrypted and held pupils' health data, which is special category data' earns far more than 'they broke the Data Protection Act'."},{"t":"warn","text":"Do not invent penalties or time limits. If unsure of an exact figure, describe the type of consequence – enforcement notice, fine, prosecution – instead."}],"diagram":{"kind":"match","title":"Which law applies?","caption":"Match each scenario to the main law it involves.","pairs":[["A member of the public asks a health trust for its cyber security spending","Freedom of Information Act 2000"],["An employee installs pirated video-editing software at work","Copyright, Designs and Patents Act 1988"],["A pupil guesses the network administrator's password","Computer Misuse Act 1990"],["A website shares customers' emails with advertisers without telling them","UK GDPR and Data Protection Act 2018"],["Police use an undercover officer to investigate an online fraud gang","Regulation of Investigatory Powers Act 2000"]]},"check":[{"q":"A retailer's database is hacked because it never applied security patches. Which data protection principle is most clearly breached?","o":["Accuracy","Storage limitation","Integrity and confidentiality","Purpose limitation"],"a":2,"why":"Failure to protect data with appropriate security."},{"q":"A former employee uses an account that was never disabled to read confidential files. This is…","o":["legal, because the password still works","unauthorised access under s1 of the Computer Misuse Act","an FOI request","a breach of copyright only"],"a":1,"why":"His authorisation ended when he left, even if the system still let him in."},{"q":"Which of these must a private company respond to?","o":["An FOI request","A subject access request","A RIPA Part III notice from a citizen","None of these"],"a":1,"why":"Any data controller must answer SARs; FOI applies only to public authorities."}],"exam":[],"practice":[{"q":"A leisure centre emails a newsletter to all members, accidentally showing every recipient's email address in the 'To' field. Explain which law applies and what the centre should do.","m":4,"a":"UK GDPR/Data Protection Act 2018 (1): email addresses are personal data and disclosing them to others breaches the integrity and confidentiality principle (1). The centre should assess the risk and, if it is likely to affect members' rights, report to the Information Commission within 72 hours (1); apologise/inform members and use BCC or a mailing system in future, with staff training (1)."},{"q":"A student copies code from a commercial app, changes the variable names and sells it as his own. Identify the law broken and explain why.","m":3,"a":"Copyright, Designs and Patents Act 1988 (1); program code is protected automatically as a literary work (1); copying/adapting and selling it without the owner's permission infringes copyright – changing variable names does not make it an original work (1)."}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Data Protection Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1891"}],"terms":["Special category data","Data controller","Unauthorised access"]},{"id":"c06-p07","spec":"Discuss ethical issues including privacy and surveillance","lessons":["IS18"],"summary":"Digital technology makes it easy to monitor and profile people; surveillance can protect security and convenience, but raises concerns about privacy, consent, proportionality, bias and misuse, so it should be lawful, necessary, proportionate and transparent.","blocks":[{"t":"p","text":"**Legal** issues concern what the law allows or forbids; **ethical** issues concern what is morally right. Not everything legal is ethical. Ethical arguments usually weigh **consequences** (who benefits and who is harmed), **rights** (privacy, consent, freedom of expression) and **fairness**. Professional bodies such as BCS, The Chartered Institute for IT, expect members to act in the public interest and respect the privacy of others."},{"t":"h","text":"Privacy and surveillance technologies"},{"t":"table","head":["Technology","Benefit","Concern"],"rows":[["CCTV and live facial recognition","Deters and detects crime; finds missing people","Mass monitoring of innocent people; misidentification, with error rates that can differ between groups"],["Employee monitoring (email, keystrokes, location, webcams)","Security, compliance, protecting the firm","Erodes trust; stress; intrusion into private life, especially when working from home"],["Location tracking by apps","Navigation, safety, convenience","Detailed movement profiles sold on to advertisers or data brokers"],["Cookies and online tracking","Free services funded by advertising; personalisation","Profiling people without real understanding or consent"],["State interception of communications","National security and serious crime","Proportionality; chilling effect on free expression"]],"caption":"Surveillance: benefits and concerns"},{"t":"h","text":"Key ethical arguments"},{"t":"list","items":["**Security vs privacy** – 'nothing to hide, nothing to fear' versus the right to private life (Article 8 of the European Convention on Human Rights, given effect by the Human Rights Act 1998).","**Consent and transparency** – do people know what is collected and could they realistically refuse?","**Function creep** – data collected for one purpose (e.g. Covid contact tracing, school attendance) being reused for another.","**Accuracy and bias** – automated systems can wrongly flag people, with greater harm to some groups.","**Power imbalance** – employers and the state hold far more power than the individuals they monitor.","**[[Chilling effect]]** – people change lawful behaviour, or stop speaking freely, because they know they are watched."],"ordered":false},{"t":"example","title":"Worked example: monitoring staff who work from home","steps":["For: the firm must protect client data and show compliance; monitoring can detect data leaks and support staff who are struggling.","Against: keystroke logging and webcam checks intrude on home life, damage trust and cause stress; productivity is not the same as keystrokes.","Law: monitoring is personal data processing – it must have a lawful basis, be transparent and proportionate; a data protection impact assessment is expected.","Judgement: monitoring of security events on company devices, clearly explained to staff, is justifiable; covert webcam or keystroke monitoring is not."],"context":"A Belfast insurance firm considers software that records home workers' activity."},{"t":"key","title":"Key points","items":["Legal ≠ ethical; weigh consequences, rights and fairness for each stakeholder.","Surveillance can improve security but threatens privacy, consent and trust; risks include function creep, bias and chilling effects.","Ethical and lawful surveillance is necessary, proportionate and transparent."]},{"t":"tip","text":"Extended answers need distinct issues, each explained with a technical point and an applied example, considered from different stakeholders' viewpoints, ending in a judgement."},{"t":"warn","text":"Avoid one-sided answers. 'Surveillance is bad' or 'surveillance keeps everyone safe' will not reach the top band; examiners want balance."}],"diagram":{"kind":"compare","title":"Facial recognition in a shopping centre","caption":"Toggle stakeholders to see different views of the same technology.","states":[{"label":"Centre owner","points":["Deters shoplifting and antisocial behaviour","Helps find lost children quickly","Costs and legal compliance burden","Reputational risk if customers object"],"art":null},{"label":"Shoppers","points":["May feel safer","Biometric data captured without meaningful choice","Risk of being wrongly flagged","Chilling effect – feeling watched"],"art":null},{"label":"Police","points":["Faster identification of wanted people","Must act lawfully and proportionately","Errors could lead to wrongful stops"],"art":null},{"label":"Society","points":["Normalises mass surveillance","Possible unequal error rates across groups","Debate about clearer regulation"],"art":null}]},"check":[{"q":"Data collected for one purpose gradually being used for others is called…","o":["data minimisation","function creep","cloud bursting","phishing"],"a":1,"why":"The system's function 'creeps' beyond its original purpose."},{"q":"Which statement about law and ethics is correct?","o":["Anything legal is ethical","Ethics concerns what is morally right, which may differ from what is legal","Ethics is only about the environment","Ethical rules are enforced by the courts"],"a":1,"why":"Not everything legal is ethical."},{"q":"People avoiding lawful protest because they know they are being filmed is an example of…","o":["a chilling effect","the digital divide","algorithmic bias","e-waste"],"a":0,"why":"Surveillance changes behaviour."}],"exam":[],"practice":[{"q":"Discuss the ethical issues raised by an employer monitoring staff who work from home.","m":8,"a":"Indicative content: security/compliance benefit – detecting data leaks (1); protects the firm and clients (1); privacy intrusion into home life (1); trust and morale damaged, stress (1); proportionality – keystroke/webcam monitoring excessive for the aim (1); consent and transparency – staff must be told, power imbalance means consent is not freely given (1); legal requirements – lawful basis, transparency, impact assessment (1); judgement – limited, transparent monitoring of company systems acceptable, covert monitoring not (1)."}],"videos":[{"title":"Ethical, social and environmental issues – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS18-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 3 (censorship and monitoring)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1943"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 4 (analysing personal information)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-4/"}],"terms":["Surveillance","Chilling effect"]},{"id":"c06-p08","spec":"Discuss social issues including the digital divide, employment and health and safety","lessons":["IS18"],"summary":"Digital technology widens a divide between those with and without access and skills, reshapes employment through automation and remote working, and creates health risks such as RSI, eye strain and stress that employers must manage.","blocks":[{"t":"h","text":"The digital divide"},{"t":"p","text":"The [[digital divide]] is the gap between people who have affordable access to digital technology **and** the skills and confidence to use it, and those who do not. As banking, job applications, benefits, healthcare appointments and education move online, people on the wrong side of the divide are increasingly excluded and pay more – they miss online discounts and rely on costlier channels."},{"t":"table","head":["Cause","Northern Ireland example","Response"],"rows":[["Cost of devices and broadband","Low-income households relying on a phone with limited data","Social tariffs; device lending by libraries and schools"],["Poor connectivity","Rural areas of Fermanagh and Tyrone with slow broadband","Government-funded full-fibre roll-out such as Project Stratum"],["Age and confidence","Older people unfamiliar with online banking","Community and library digital-skills classes"],["Disability","Websites not usable with screen readers","Accessible design to WCAG standards"],["Global inequality","Lower access in poorer countries","Investment in infrastructure and education"]],"caption":"Causes and responses"},{"t":"h","text":"Employment"},{"t":"list","items":["**Job losses** in routine work through automation – self-service tills, automated warehouses, chatbots.","**New jobs** in software, data, cyber security and technical support, so **[[upskilling]]** and retraining are vital.","**[[Deskilling]]** – some roles become simpler as technology does the expert part (e.g. a till that calculates change).","**Remote and hybrid working** – less commuting and a wider talent pool, but isolation, blurred work–home boundaries and an 'always-on' culture.","**Gig economy** platforms offer flexibility but often less job security, sick pay and holiday."],"ordered":false},{"t":"h","text":"Health and safety"},{"t":"p","text":"In Northern Ireland employers' general duties come from the **Health and Safety at Work (Northern Ireland) Order 1978**, and the **Health and Safety (Display Screen Equipment) Regulations (Northern Ireland) 1992** require employers to assess workstations, plan breaks or changes of activity, provide eye tests for regular screen users on request and give training."},{"t":"table","head":["Problem","Cause","Prevention"],"rows":[["[[Repetitive strain injury (RSI)]]","Repeated keyboard and mouse movements","Ergonomic keyboards and mice, wrist rests, regular breaks"],["Eye strain and headaches","Long periods looking at screens, glare, poor lighting","Anti-glare screens, correct lighting, breaks, eye tests"],["Back and neck problems","Poor posture, unsuitable chairs or screen height","Adjustable chairs and monitors, posture training, workstation assessment"],["Stress and mental health","Always-on culture, monitoring, online abuse","Right-to-disconnect policies, workload management, support services"]],"caption":"Health risks of computer use"},{"t":"key","title":"Key points","items":["Digital divide: access + skills; causes include cost, connectivity, age, disability; it excludes people from services and work.","Employment: automation removes routine jobs and creates skilled ones; upskilling, deskilling, remote working, gig economy.","Health: RSI, eye strain, back problems, stress – prevented by ergonomics, breaks, assessments and policies under NI health and safety law."]},{"t":"tip","text":"For each health problem, give the **cause and the specific prevention**. 'Take breaks' alone is too vague – say what the break prevents."},{"t":"warn","text":"The digital divide is not only about owning a device. Skills, confidence, connectivity and accessibility all count."}],"diagram":{"kind":"match","title":"Health problem and prevention","caption":"Match each problem with the most effective prevention.","pairs":[["Repetitive strain injury","Ergonomic keyboard, wrist rest and regular breaks"],["Eye strain","Anti-glare screen, good lighting and regular eye tests"],["Back pain","Adjustable chair and monitor set at eye level"],["Stress from an always-on culture","A right-to-disconnect policy and manageable workloads"]]},"check":[{"q":"Which best defines the digital divide?","o":["The gap between fast and slow processors","The gap between those with and without access to digital technology and the skills to use it","The split between hardware and software jobs","The difference between LANs and WANs"],"a":1,"why":"Access and skills both matter."},{"q":"A job becoming simpler and less skilled because software does the expert part is…","o":["upskilling","deskilling","outsourcing","teleworking"],"a":1,"why":"Deskilling."},{"q":"Which law sets employers' general health and safety duties in Northern Ireland?","o":["Health and Safety at Work etc. Act 1974","Health and Safety at Work (Northern Ireland) Order 1978","Computer Misuse Act 1990","Equality Act 2010"],"a":1,"why":"The 1974 Act applies in Great Britain; NI has the 1978 Order."}],"exam":[],"practice":[{"q":"Give two causes of the digital divide in Northern Ireland and suggest a way to reduce each.","m":4,"a":"Poor rural broadband (1) – government full-fibre roll-out schemes (1). Cost of devices/data (1) – device lending/social tariffs (1). Also credit lack of skills/confidence – community digital-skills classes; disability – accessible design."},{"q":"Describe two health problems that can result from prolonged computer use and how each can be prevented.","m":4,"a":"RSI caused by repeated typing/mouse use (1) – ergonomic equipment and regular breaks (1). Eye strain from long screen use/glare (1) – anti-glare screens, correct lighting, breaks and eye tests (1)."}],"videos":[{"title":"Ethical, social and environmental issues – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS18-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 1 (workplace and automated decisions)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-1/"}],"terms":["Digital divide","Upskilling","Deskilling","Repetitive strain injury (RSI)"]},{"id":"c06-p09","spec":"Discuss environmental issues including energy use, sustainability and e-waste","lessons":["IS18"],"summary":"Making, powering and disposing of digital technology uses scarce materials and large amounts of energy and creates toxic e-waste; organisations can reduce their impact by extending device life, recycling properly, using efficient hardware and renewable-powered services.","blocks":[{"t":"h","text":"The environmental costs"},{"t":"list","items":["**Manufacturing** devices uses energy, water and scarce materials such as cobalt, lithium and rare earth elements, often mined in poor conditions; most of a laptop's lifetime carbon footprint comes from making it.","**Energy use** – data centres and networks consume large amounts of electricity for processing and cooling; training and running large AI models has sharply increased demand.","**[[E-waste]]** – discarded devices contain toxic substances such as lead, mercury and cadmium; when sent to landfill or illegally exported they pollute soil and water and harm workers who strip them by hand.","**Short product lifecycles** – fashion, unsupported software and [[planned obsolescence]] lead to devices being replaced while still working."],"ordered":false},{"t":"h","text":"Positive environmental effects"},{"t":"list","items":["Video conferencing and remote working reduce travel emissions.","Smart meters, IoT heating controls and analytics cut energy waste in buildings and industry.","Precision agriculture uses sensors to apply fertiliser only where needed.","Paperless systems reduce paper and printing."],"ordered":false},{"t":"h","text":"Towards [[sustainability]]"},{"t":"table","head":["Action","Effect"],"rows":[["Extend replacement cycles; repair and refurbish","Spreads the manufacturing footprint over more years"],["Recycle through approved schemes under the WEEE Regulations 2013","Toxic materials handled safely; valuable metals recovered"],["Buy energy-efficient hardware; enable power management","Lower electricity use and bills"],["Virtualise servers","Fewer physical machines, less power and cooling"],["Choose cloud providers using renewable energy","Lower carbon footprint of hosted services"],["Write efficient software and store less data","Less processing and storage means less energy"]],"caption":"Reducing the environmental impact of IT"},{"t":"example","title":"Worked example: a school's IT sustainability plan","steps":["Extend laptop replacement from four to six years by upgrading memory and replacing batteries.","Send retired equipment to a WEEE-compliant refurbisher that wipes data securely and re-uses or recycles it.","Set PCs to sleep after 15 minutes and shut down overnight.","Consolidate servers through virtualisation and move suitable services to a renewable-powered cloud provider."],"context":"An Enniskillen grammar school wants to cut the environmental impact of its IT."},{"t":"key","title":"Key points","items":["Costs: materials and manufacturing, energy for data centres and AI, toxic e-waste, short lifecycles.","Benefits: less travel, smarter energy use, precision agriculture.","Reduce impact: extend life, repair, recycle under WEEE, efficient hardware, virtualisation, renewable-powered cloud."]},{"t":"tip","text":"For 'explain two ways an organisation can reduce its environmental impact', link each action to its effect: 'virtualising servers reduces the number of physical machines, **so less electricity is used for power and cooling**'."},{"t":"warn","text":"Recycling is not the first step. Reducing and re-using – keeping devices in service longer – usually saves more than recycling them early."}],"diagram":{"kind":"cycle","title":"The life of a digital device","caption":"Click each stage, or press Play, to see its environmental impact and how to reduce it.","items":[{"label":"Extraction","detail":"Mining cobalt, lithium and rare earths – energy, water and human cost. Reduce by buying fewer new devices."},{"label":"Manufacture","detail":"Often the largest share of a device's carbon footprint. Choose durable, repairable products."},{"label":"Distribution","detail":"Global shipping adds emissions. Buy refurbished or local where possible."},{"label":"Use","detail":"Electricity for the device and the data centres it relies on. Use power management and efficient software."},{"label":"End of life","detail":"E-waste – toxic if dumped. Repair, refurbish, then recycle through WEEE-compliant schemes so materials return to the start of the cycle."}]},"check":[{"q":"Which law governs the disposal and recycling of electrical and electronic equipment in the UK?","o":["Computer Misuse Act 1990","WEEE Regulations 2013","Freedom of Information Act 2000","RIPA 2000"],"a":1,"why":"Waste Electrical and Electronic Equipment Regulations."},{"q":"Designing products to become out of date or unsupported quickly is called…","o":["sustainability","planned obsolescence","virtualisation","deskilling"],"a":1,"why":"It shortens product lifecycles."},{"q":"Which action usually saves the most environmental impact for a working laptop?","o":["Recycling it after two years","Keeping it in use longer and repairing it","Buying a new one every year","Sending it to landfill"],"a":1,"why":"Most of the footprint is in manufacture, so extending life saves most."}],"exam":[],"practice":[{"q":"Explain two ways an organisation can reduce the environmental impact of its IT.","m":4,"a":"Extend the life of devices by repairing/upgrading (1), so fewer new devices are manufactured, reducing materials, energy and e-waste (1). Virtualise servers/use renewable-powered cloud (1), reducing the electricity used for running and cooling hardware (1). Also credit: WEEE recycling; power management; energy-efficient hardware."},{"q":"Discuss the environmental issues associated with the growth of data centres.","m":6,"a":"Large electricity demand for servers and cooling (1); carbon emissions if powered by fossil fuels (1); water use for cooling (1); hardware replaced frequently creates e-waste (1); but data centres can be more efficient than many small server rooms and can use renewable energy/heat reuse (1); cloud services enable remote working, cutting travel (1). Judgement required for top marks."}],"videos":[{"title":"Ethical, social and environmental issues – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS18-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 2 (AI and environment)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-2/"}],"terms":["E-waste","Planned obsolescence","Sustainability"]}],"topic":"G23","topicName":"Legal, ethical and social issues","links":{"tests":[{"id":"GK","title":"A2 1 topic test K: Information systems, law and ethics","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GK"}],"papers":[{"id":"GP3","title":"A2 1 Practice Paper","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GP3"}]}}],"glossary":[{"term":"ACID","def":"Atomicity, consistency, isolation and durability: the properties that guarantee database transactions are processed reliably.","alt":"","page":"c02-p06"},{"term":"Actuator","def":"A device that carries out a physical action, such as moving a motor or opening a valve, in response to a control signal.","alt":"","page":"c05-p06"},{"term":"Aggregate function","def":"An SQL function that calculates a single value from a set of rows, such as COUNT, SUM, AVG, MIN or MAX.","alt":"","page":"c02-p04"},{"term":"Algorithmic bias","def":"Systematic unfairness in the outputs of an algorithm or AI system, usually caused by biased or unrepresentative training data or design choices.","alt":"","page":"c05-p07"},{"term":"Artificial intelligence (AI)","def":"The ability of computer systems to perform tasks that normally require human intelligence, such as recognising images and speech, understanding language and making decisions.","alt":"AI","page":"c05-p05"},{"term":"Asymmetric encryption","def":"Encryption using a mathematically related key pair: data encrypted with one key (e.g. the public key) can only be decrypted with the other (the private key).","alt":"public key encryption","page":"c04-p03"},{"term":"Asynchronous transmission","def":"Transmission without a shared clock, in which each character is framed by a start bit and stop bit(s).","alt":"","page":"c03-p13"},{"term":"Atomic","def":"Describes a field holding a single, indivisible value rather than a list or group of values.","alt":"","page":"c01-p07"},{"term":"Attribute","def":"A property or characteristic of an entity; it becomes a field in a table.","alt":"field","page":"c01-p04"},{"term":"Authentication","def":"Confirming that a user or device is who or what it claims to be, using something the user knows, has or is.","alt":"","page":"c04-p05"},{"term":"Authorisation","def":"Determining what an authenticated user is permitted to access or do, i.e. their access rights.","alt":"access rights","page":"c04-p05"},{"term":"Automatic repeat request (ARQ)","def":"An error-correction method in which the receiver acknowledges each correct block and the sender retransmits any block that is negatively acknowledged or not acknowledged before a timeout.","alt":"ARQ","page":"c03-p14"},{"term":"Automation","def":"Using technology to carry out tasks with little or no human involvement.","alt":"","page":"c05-p07"},{"term":"Bandwidth","def":"The capacity of a communication channel (the range of frequencies it can carry), which determines the maximum rate at which data can be transmitted.","alt":"","page":"c03-p12"},{"term":"Batch processing","def":"Processing in which transactions are collected over a period and then processed together as a group, often at off-peak times.","alt":"","page":"c05-p01"},{"term":"Big data","def":"Data sets so large, fast-arriving or varied that they cannot be stored or processed efficiently with traditional database tools; characterised by volume, velocity and variety (often also veracity and value).","alt":"","page":"c02-p10"},{"term":"Biometrics","def":"Authentication using a person's unique physical or behavioural characteristics, such as fingerprint, face or voice.","alt":"","page":"c04-p05"},{"term":"Bit rate","def":"The number of bits actually transmitted per second over a communication channel.","alt":"","page":"c03-p12"},{"term":"Botnet","def":"A network of malware-infected devices controlled remotely by an attacker, often used for DDoS attacks or spam.","alt":"","page":"c04-p01"},{"term":"Broadband","def":"A high-capacity transmission method that carries multiple signals on different frequencies at the same time over one medium.","alt":"","page":"c03-p12"},{"term":"Candidate key","def":"Any attribute, or minimal set of attributes, that could uniquely identify every record and so could be chosen as the primary key.","alt":"","page":"c01-p05"},{"term":"Cartesian product","def":"The result of combining two tables without a join condition, in which every row of one table is paired with every row of the other.","alt":"cross join","page":"c02-p05"},{"term":"Cascade delete","def":"A referential integrity option in which deleting a parent record automatically deletes all its related child records.","alt":"","page":"c01-p13"},{"term":"Certificate authority (CA)","def":"A trusted organisation that verifies identities and issues and signs digital certificates.","alt":"","page":"c04-p04"},{"term":"Checksum","def":"A value calculated from a block of data and sent with it; the receiver recalculates it and compares to detect errors.","alt":"","page":"c03-p14"},{"term":"Chilling effect","def":"The discouragement of lawful behaviour, such as free expression, because people know or fear they are being monitored.","alt":"","page":"c06-p07"},{"term":"Circuit switching","def":"A method of transmission in which a dedicated path is set up and reserved between sender and receiver for the whole communication.","alt":"","page":"c03-p09"},{"term":"Client–server database","def":"A database held with its DBMS on a central server, to which client applications send requests over a network and from which they receive only the results.","alt":"","page":"c02-p09"},{"term":"Cloud computing","def":"The on-demand delivery of computing resources such as servers, storage and software over the internet, usually paid for by subscription or use.","alt":"","page":"c04-p06"},{"term":"Composite key","def":"A primary key made up of two or more attributes which together, but not separately, uniquely identify a record.","alt":"compound key","page":"c01-p05"},{"term":"Computer Misuse Act 1990","def":"UK law creating offences of unauthorised access to computer material, access with intent to commit further offences, unauthorised acts that impair a computer, acts causing serious damage, and making or supplying tools for these offences.","alt":"","page":"c06-p03"},{"term":"Constraint","def":"A rule defined on a table, such as PRIMARY KEY, FOREIGN KEY, NOT NULL, UNIQUE or CHECK, that the DBMS enforces on every change to the data.","alt":"","page":"c02-p01"},{"term":"Copyright","def":"The automatic legal right of the creator of an original work, including software, to control its copying, adaptation and distribution; protected by the Copyright, Designs and Patents Act 1988.","alt":"","page":"c06-p04"},{"term":"Cyclic redundancy check (CRC)","def":"An error-detection method in which the data is divided by an agreed binary generator and the remainder is sent and checked by the receiver; effective against burst errors.","alt":"CRC","page":"c03-p14"},{"term":"Data controller","def":"The person or organisation that decides the purposes for which, and the means by which, personal data is processed, and is responsible for compliance.","alt":"controller","page":"c06-p01"},{"term":"Data definition language (DDL)","def":"The part of SQL used to create and change the structure of a database, e.g. CREATE TABLE, ALTER TABLE and DROP TABLE.","alt":"DDL","page":"c02-p01"},{"term":"Data dictionary","def":"A central store of metadata describing every table, field, data type, key, validation rule, index, relationship and access right in a database.","alt":"system catalogue","page":"c01-p12"},{"term":"Data inconsistency","def":"A situation in which copies of the same data item hold different values, so it is unclear which is correct; usually caused by redundant data being updated in some places but not others.","alt":"","page":"c01-p03"},{"term":"Data independence","def":"The separation of the logical view of data used by programs from the way it is stored, so storage (physical independence) or structure (logical independence) can change without changing the programs.","alt":"","page":"c01-p03"},{"term":"Data integrity","def":"The accuracy, completeness, consistency and validity of data throughout its life.","alt":"","page":"c01-p13"},{"term":"Data manipulation language (DML)","def":"The part of SQL used to retrieve and change the data held in tables, e.g. SELECT, INSERT, UPDATE and DELETE.","alt":"DML","page":"c02-p02"},{"term":"Data minimisation","def":"The data protection principle that personal data must be adequate, relevant and limited to what is necessary for the purpose.","alt":"","page":"c06-p01"},{"term":"Data mining","def":"The process of analysing large data sets with statistical and machine-learning techniques to discover previously unknown patterns, relationships and trends.","alt":"","page":"c02-p12"},{"term":"Data processor","def":"A person or organisation that processes personal data on behalf of, and on the instructions of, a data controller.","alt":"processor","page":"c06-p01"},{"term":"Data redundancy","def":"The unnecessary storage of the same data item more than once.","alt":"duplication of data","page":"c01-p03"},{"term":"Data sovereignty","def":"The principle that data is subject to the laws of the country in which it is physically stored.","alt":"","page":"c04-p08"},{"term":"Data subject","def":"The identified or identifiable living individual whom personal data is about.","alt":"","page":"c06-p01"},{"term":"Data warehouse","def":"A large central store of integrated, historical, read-only data copied from many operational systems and organised for analysis and decision-making.","alt":"","page":"c02-p11"},{"term":"Database management system (DBMS)","def":"Software that sits between users or programs and the stored data, allowing a database to be defined, queried and updated while controlling security, integrity, concurrent access, backup and recovery.","alt":"DBMS","page":"c01-p02"},{"term":"Deadlock","def":"A situation in which two or more transactions each hold a lock that another needs, so none of them can proceed.","alt":"","page":"c02-p07"},{"term":"Decision support system (DSS)","def":"An interactive information system that combines internal and external data with models to help managers make semi-structured and unstructured decisions, for example through what-if analysis.","alt":"DSS","page":"c05-p03"},{"term":"Defence in depth","def":"Protecting systems with several layers of technical and procedural controls so that if one fails others still provide protection.","alt":"layered security","page":"c04-p01"},{"term":"Degree of relationship","def":"The number of occurrences of one entity that can be associated with an occurrence of another: one-to-one (1:1), one-to-many (1:M) or many-to-many (M:N).","alt":"cardinality","page":"c01-p06"},{"term":"Deletion anomaly","def":"The unintended loss of data about one thing when a record about something else is deleted.","alt":"","page":"c01-p08"},{"term":"Denial of service (DoS)","def":"An attack that floods a server or network with traffic so that it cannot respond to genuine users; a distributed (DDoS) attack uses many devices at once.","alt":"DDoS","page":"c04-p01"},{"term":"Deskilling","def":"The reduction in the skill needed for a job because technology now performs the skilled part of the work.","alt":"","page":"c06-p08"},{"term":"DHCP","def":"Dynamic Host Configuration Protocol: a service that automatically leases an IP address, subnet mask, default gateway and DNS server to each device that joins a network.","alt":"","page":"c03-p08"},{"term":"Digital certificate","def":"An electronic document, issued and signed by a certificate authority, that binds a public key to the identity of its owner.","alt":"public key certificate","page":"c04-p04"},{"term":"Digital divide","def":"The gap between people who have affordable access to digital technology and the skills to use it, and those who do not.","alt":"","page":"c06-p08"},{"term":"Digital signature","def":"A hash of a message encrypted with the sender's private key, allowing the receiver to verify the sender's identity and that the message has not been altered.","alt":"","page":"c04-p04"},{"term":"Distributed database","def":"A single logical database whose data is stored at several sites linked by a network, using fragmentation and/or replication, but which appears to users as one database.","alt":"","page":"c02-p09"},{"term":"E-waste","def":"Discarded electrical and electronic equipment, which may contain toxic substances as well as valuable recoverable materials.","alt":"WEEE","page":"c06-p09"},{"term":"Encapsulation (networking)","def":"The process by which each layer adds its own header (and sometimes trailer) to data as it passes down the layers before transmission.","alt":"","page":"c03-p05"},{"term":"Encryption","def":"Converting plaintext into unreadable ciphertext using an algorithm and a key, so only holders of the correct key can read it.","alt":"","page":"c04-p03"},{"term":"Entity","def":"An object, person, place or event about which data is stored; it becomes a table in a relational database.","alt":"","page":"c01-p04"},{"term":"Entity integrity","def":"The rule that every table has a primary key whose values are unique and never null.","alt":"","page":"c01-p13"},{"term":"Entity-relationship (ER) diagram","def":"A diagram showing the entities in a system as boxes and the relationships between them as lines, with crow's feet marking the 'many' ends.","alt":"ERD","page":"c01-p06"},{"term":"ETL","def":"Extract, transform, load: the process of copying data from source systems, cleaning and converting it into a consistent format, and loading it into a data warehouse.","alt":"extract–transform–load","page":"c02-p11"},{"term":"Exception report","def":"A report that lists only the items falling outside pre-set limits, so managers can concentrate on problems.","alt":"","page":"c05-p02"},{"term":"Expert system","def":"A computer system that emulates the decision-making of a human expert in a narrow domain using a knowledge base of rules and an inference engine.","alt":"","page":"c05-p04"},{"term":"Explanation facility","def":"The part of an expert system's interface that shows the user which rules and facts were used to reach a conclusion.","alt":"","page":"c05-p04"},{"term":"Fibre-optic cable","def":"A transmission medium that carries data as pulses of light along glass fibres, giving very high bandwidth over long distances with immunity to electrical interference.","alt":"","page":"c03-p11"},{"term":"Firewall","def":"Hardware or software that monitors incoming and outgoing network traffic and allows or blocks it according to a set of security rules.","alt":"","page":"c04-p02"},{"term":"First normal form (1NF)","def":"A relation with no repeating groups in which every attribute holds a single atomic value and every record is identified by a primary key.","alt":"1NF","page":"c01-p09"},{"term":"Flat file","def":"A database held as a single table or file of records with no relationships to any other table.","alt":"","page":"c01-p01"},{"term":"Foreign key","def":"An attribute in one table that is the primary key of another table, used to create a relationship between the two tables.","alt":"","page":"c01-p05"},{"term":"Freedom of Information Act 2000","def":"UK law giving anyone the right to request recorded information held by public authorities, normally within 20 working days, subject to exemptions.","alt":"FOIA","page":"c06-p05"},{"term":"Full-duplex","def":"A transmission mode in which data can travel in both directions at the same time.","alt":"","page":"c03-p13"},{"term":"Functional dependency","def":"A relationship A → B in which each value of attribute A determines exactly one value of attribute B.","alt":"","page":"c01-p11"},{"term":"Gateway","def":"A device that connects two networks using different protocols and translates between them; in IP networking, the 'default gateway' is the router used to reach other networks.","alt":"","page":"c03-p03"},{"term":"GROUP BY","def":"An SQL clause that groups rows sharing a value so that aggregate functions are calculated for each group, giving one result row per group.","alt":"","page":"c02-p04"},{"term":"Hash","def":"A fixed-length value calculated from data by a one-way function; any change to the data produces a different hash.","alt":"digest","page":"c04-p04"},{"term":"HAVING","def":"An SQL clause that filters groups after aggregation, in the way WHERE filters individual rows before grouping.","alt":"","page":"c02-p04"},{"term":"HTTPS","def":"HTTP sent over an encrypted TLS connection, so web data cannot be read or altered in transit and the server's identity is verified.","alt":"","page":"c03-p06"},{"term":"Hybrid cloud","def":"A deployment that links a private cloud or on-premises systems with public cloud services so data and applications can move between them.","alt":"","page":"c04-p07"},{"term":"Hypervisor","def":"Software that creates, runs and manages virtual machines on a physical host, sharing its resources between them.","alt":"virtual machine monitor","page":"c04-p09"},{"term":"Index","def":"A sorted data structure of field values and pointers to records that lets the DBMS locate, sort and join records quickly without scanning the whole table.","alt":"","page":"c01-p15"},{"term":"Inference engine","def":"The part of an expert system that applies the rules in the knowledge base to the facts supplied, by forward or backward chaining, to reach conclusions.","alt":"","page":"c05-p04"},{"term":"Information Commission","def":"The independent UK regulator for data protection and information rights, including freedom of information, which replaced the Information Commissioner's Office (ICO) on 30 September 2026; it issues guidance, investigates and enforces.","alt":"formerly the Information Commissioner's Office (ICO)","page":"c06-p01"},{"term":"Information system","def":"A system of people, data, procedures and technology that collects, stores and processes data to provide information that supports an organisation's operations and decision-making.","alt":"","page":"c05-p01"},{"term":"Infrastructure as a service (IaaS)","def":"A cloud model in which the provider supplies virtualised servers, storage and networking, and the customer manages the operating system and software.","alt":"IaaS","page":"c04-p06"},{"term":"Insertion anomaly","def":"The inability to add data about one thing because data about something else, needed to complete the record or its key, does not yet exist.","alt":"","page":"c01-p08"},{"term":"Insider threat","def":"A risk to an organisation's systems or data from employees or contractors who misuse their legitimate access, deliberately or accidentally.","alt":"","page":"c04-p01"},{"term":"Internet of Things (IoT)","def":"A network of everyday physical objects with embedded sensors, processors and connectivity that collect and exchange data automatically.","alt":"IoT","page":"c05-p06"},{"term":"Investigatory Powers Act 2016","def":"UK law governing interception of communications, retention of and access to communications data, equipment interference and bulk powers by public bodies, with independent oversight.","alt":"","page":"c06-p05"},{"term":"IP address","def":"A logical numerical address that identifies a device on a network so that data can be routed to it.","alt":"","page":"c03-p07"},{"term":"Join","def":"An operation that combines rows from two or more tables by matching a foreign key with the related primary key.","alt":"inner join","page":"c02-p05"},{"term":"Key distribution problem","def":"The difficulty, in symmetric encryption, of getting the shared secret key to the recipient without it being intercepted.","alt":"","page":"c04-p03"},{"term":"Knowledge base","def":"The part of an expert system that stores the facts and IF–THEN rules gathered from human experts.","alt":"","page":"c05-p04"},{"term":"Knowledge engineer","def":"A specialist who gathers knowledge from human experts and encodes it as facts and rules in an expert system's knowledge base.","alt":"","page":"c05-p04"},{"term":"Lawful basis","def":"One of the legal grounds – such as consent, contract, legal obligation, vital interests, public task, legitimate interests or recognised legitimate interests – on which personal data may be processed.","alt":"","page":"c06-p01"},{"term":"Link entity","def":"An entity introduced to resolve a many-to-many relationship into two one-to-many relationships; its key is usually a composite of the two foreign keys.","alt":"associative entity; junction table","page":"c01-p07"},{"term":"Local area network (LAN)","def":"A network covering a single site or building, with infrastructure owned and managed by the organisation.","alt":"LAN","page":"c03-p01"},{"term":"MAC address","def":"A unique 48-bit hardware address assigned to a network interface card, used to deliver frames on a local network.","alt":"physical address","page":"c03-p03"},{"term":"Machine learning","def":"A branch of AI in which algorithms improve their performance at a task by learning patterns from data rather than following explicitly programmed rules.","alt":"ML","page":"c05-p05"},{"term":"Malware","def":"Malicious software, such as viruses, worms, trojans, spyware and ransomware, designed to damage, disrupt, steal from or gain unauthorised control of a computer system.","alt":"malicious software","page":"c04-p01"},{"term":"Man-in-the-middle attack","def":"An attack in which data travelling between two parties is secretly intercepted and possibly altered.","alt":"interception","page":"c04-p01"},{"term":"Management information system (MIS)","def":"An information system that summarises data from transaction systems into scheduled, exception and on-demand reports to help middle managers monitor performance and make tactical decisions.","alt":"MIS","page":"c05-p02"},{"term":"Metadata","def":"Data that describes other data, such as a field's name, data type, size and validation rule.","alt":"data about data","page":"c01-p02"},{"term":"Metropolitan area network (MAN)","def":"A network covering a town or city, linking sites such as council buildings or university campuses.","alt":"MAN","page":"c03-p01"},{"term":"Multi-factor authentication (MFA)","def":"Authentication that requires evidence from two or more different categories – something you know, have or are.","alt":"two-factor authentication (2FA)","page":"c04-p05"},{"term":"Network address translation (NAT)","def":"A router technique that replaces private IP addresses with its public IP address on outgoing traffic and tracks connections, so many devices can share one public address.","alt":"NAT","page":"c03-p08"},{"term":"Network interface card (NIC)","def":"Hardware that connects a device to a network medium, converting data into signals, and holds the device's unique MAC address.","alt":"network adapter","page":"c03-p03"},{"term":"Neural network","def":"A machine learning model made of layers of connected nodes whose weighted connections are adjusted during training; many layers form a deep learning model.","alt":"artificial neural network","page":"c05-p05"},{"term":"Normalisation","def":"A formal process of organising attributes into relations to minimise data redundancy and prevent update, insertion and deletion anomalies.","alt":"","page":"c01-p08"},{"term":"OLAP","def":"Online analytical processing: tools that let users analyse multidimensional data, for example by slicing, rolling up and drilling down.","alt":"","page":"c02-p11"},{"term":"Open source","def":"Software whose source code is published under a licence that allows anyone to use, study, modify and redistribute it, subject to the licence's conditions.","alt":"","page":"c06-p04"},{"term":"Orphan record","def":"A child record whose foreign key refers to a parent record that does not exist.","alt":"","page":"c01-p13"},{"term":"OSI model","def":"A seven-layer reference model of network communication: physical, data link, network, transport, session, presentation and application.","alt":"","page":"c03-p05"},{"term":"Packet switching","def":"A method of transmission in which data is split into addressed packets that travel independently across shared links, possibly by different routes, and are reassembled at the destination.","alt":"","page":"c03-p09"},{"term":"Parity bit","def":"An extra bit added to a group of bits so that the total number of 1s is even (even parity) or odd (odd parity), used to detect transmission errors.","alt":"","page":"c03-p14"},{"term":"Partial dependency","def":"Where a non-key attribute depends on only part of a composite primary key.","alt":"","page":"c01-p11"},{"term":"Personal area network (PAN)","def":"A network linking one person's own devices over a few metres, usually by Bluetooth or USB.","alt":"PAN","page":"c03-p01"},{"term":"Personal data","def":"Any information relating to an identified or identifiable living individual.","alt":"","page":"c06-p01"},{"term":"Phishing","def":"Fraudulent messages or websites that impersonate a trusted organisation to trick people into revealing credentials or running malware.","alt":"","page":"c04-p01"},{"term":"Planned obsolescence","def":"Designing products to become outdated, unsupported or unusable after a limited time so they must be replaced.","alt":"","page":"c06-p09"},{"term":"Platform as a service (PaaS)","def":"A cloud model in which the provider supplies and manages the hardware, operating system and runtime so customers only develop and manage their own applications.","alt":"PaaS","page":"c04-p06"},{"term":"Predictive maintenance","def":"Using sensor data and analytics to predict when equipment is likely to fail so it can be repaired beforehand.","alt":"","page":"c05-p06"},{"term":"Primary key","def":"An attribute, or combination of attributes, chosen to uniquely identify each record in a table; its value must be unique and never null.","alt":"","page":"c01-p05"},{"term":"Private cloud","def":"Cloud infrastructure dedicated to a single organisation, located on its premises or hosted on dedicated hardware.","alt":"","page":"c04-p07"},{"term":"Private key","def":"The key of an asymmetric pair kept secret by its owner; ximise reward.","alt":"","page":"c05-p05"},{"term":"Relational database","def":"A database in which data is stored in separate tables (relations), each about one entity, linked by primary and foreign keys.","alt":"","page":"c01-p01"},{"term":"Relationship","def":"A link between two entities showing how their occurrences are associated, implemented by a foreign key.","alt":"","page":"c01-p04"},{"term":"Repeating group","def":"A set of attributes that occurs several times for a single value of the key in un-normalised data.","alt":"","page":"c01-p09"},{"term":"Repetitive strain injury (RSI)","def":"Pain or damage to muscles, tendons or nerves caused by repeated movements such as typing or using a mouse.","alt":"RSI","page":"c06-p08"},{"term":"Robotics","def":"The design and use of programmable machines that sense their environment, process the data and carry out physical actions.","alt":"","page":"c05-p06"},{"term":"Rollback","def":"Undoing all changes made by a transaction since it began, returning the database to its previous consistent state.","alt":"","page":"c02-p08"},{"term":"Router","def":"A device that connects different networks and forwards packets towards their destination using IP addresses and a routing table.","alt":"","page":"c03-p03"},{"term":"Routing table","def":"A table held by a router that maps destination networks to the next hop and outgoing interface, including a default route.","alt":"","page":"c03-p10"},{"term":"Scalability","def":"The ability of a system to increase or decrease its capacity quickly to match demand.","alt":"elasticity","page":"c04-p08"},{"term":"Schema","def":"A description of the structure of a database – its tables, fields, types, keys and relationships – held by the DBMS between programs and the stored data.","alt":"","page":"c01-p03"},{"term":"Second normal form (2NF)","def":"A relation in 1NF with no partial dependencies, so every non-key attribute depends on the whole of a composite key.","alt":"2NF","page":"c01-p10"},{ rd declarative language for defining, querying and manipulating relational databases.","alt":"","page":"c02-p01"},{"term":"Stateful inspection","def":"A firewall technique that tracks open connections and only admits incoming packets that belong to an established conversation.","alt":"","page":"c04-p02"},{"term":"Subject access request (SAR)","def":"A request by an individual for a copy of the personal data an organisation holds about them; normally free and answered within one month.","alt":"right of access","page":"c06-p02"},{"term":"Subnet mask","def":"A value that identifies which bits of an IP address form the network part and which form the host part, e.g. 255.255.255.0 (/24).","alt":"","page":"c03-p07"},{"term":"Supervised learning","def":"Machine learning in which a model is trained on labelled examples whose correct outputs are known, so it can predict outputs for new inputs.","alt":"","page":"c05-p05"},{"term":"Surveillance","def":"The monitoring of people's behaviour, activities or communications, for example by CCTV, facial recognition, location tracking or interception.","alt":"monitoring","page":"c06-p07"},{"term":"Sustainability","def":"Meeting present needs without compromising the ability of future generations to meet theirs, for example by reducing energy use and e-waste.","alt":"","page":"c06-p09"},{"term":"Switch","def":"A device that connects devices within a LAN and forwards each frame only to the port of its destination, using MAC addresses.","alt":"","page":"c03-p03"},{"term":"Symmetric encryption","def":"Encryption in which the same secret key is used both to encrypt and to decrypt data.","alt":"private-key / shared-key encryption","page":"c04-p03"},{"term":"TCP","def":"Transmission Control Protocol: a connection-oriented transport protocol giving reliable, ordered delivery using sequence numbers, acknowledgements and retransmission.","alt":"","page":"c03-p06"},{"term":"TCP/IP model","def":"The four-layer model used by the internet: applicat DIAG.flow = (d, st, cx) => {

  const rank = new Array(N).fill(0), fin = new Array(N).fill(0); edges.forEach((e, k) => { if (!back.has(k)) fin[e.b]++; });

  while (q.length) { const v = q.shift(); for (const k of out[v]) { if (back.has(k)) continue; const w = edges[k].b; rank[w] = Math.max(rank[w], rank[v] + 1); if (--fin[w] === 0) q.push(w); } }
  const R = Math.max(0, ...rank) + 1, layers = Array.from({ length: R }, () => []);
  nodes.forEach((n, i) => layers[rank[i]].push(i));
  for (let r = 1; r < R; r++) {
    const pos = new Map(layers[r - 1].map((v, j) => [v, j]));
    const bc = v => { const ps = edges.filter((e, k) => !back.has(k) && e.b === v && pos.has(e.a)).map(e => pos.get(e.a)); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 1e3; };

  }

  let step = -1, sel = -1;
  const wrap = el('div', { class: 'dg-scroll' });
  const bStep = el('button', { type: 'button', class: 'btn pri' }, 'Step'), bReset = el('button', { type: 'button', class: 'btn' }, 'Reset');
  const cnt = el('span', { class: 'muted' });
  st.append(wrap, el('div', { class: 'btns' }, bStep, bReset, cnt));
  let NG = [], EG = [];

    const K = Math.max(...layers.map(l => l.length));

    const hasBack = back.size > 0, longE = edges.some((e, k) => !back.has(k) && rank[e.b] - rank[e.a] > 1);
    let nw, gapA, gapC, margin = hasBack ? 34 : 6, mL = 0;
    if (dir === 'tb') { mL = longE ? 30 : 0; if (longE) margin += hasBack ? 14 : 24; gapC = 18; nw = clamp((W - margin - mL - 6 - (K - 1) * gapC) / K, 92, 170); gapA = 40; }
    else { gapA = 44; nw = clamp((W - 20 - (R - 1) * gapA) / R, 104, 170); gapC = 22; }
    const cpl = Math.floor((nw - 16) / 7.1), cplD = Math.floor((nw * 0.6) / 7.1);

    } else {

      var SW = Math.max(W, x - gapA + nw / 2 - nw / 2 + 10), SH = H0 + 16 + (hasBack ? margin : 0);

        else { const sy = s.y + s.h / 2, ty = t.y - t.h / 2, m = (sy + ty) / 2; path = `M${s.x},${sy} C${s.x},${m} ${t.x},${m} ${t.x},${ty}`; lx = (s.x + t.x) / 2; ly = m; }

/* ---- 6 bits ---- */

      }

    let SW = W, SH;
    const DW = 30;
    if (cols) {
      const nw = clamp((W - (R - 1) * 120) / R, 110, 170), gap = R > 1 ? clamp((W - R * nw) / (R - 1), 120, 220) : 0, cpl = Math.floor((nw - 16) / 7);
      N.forEach(n => { n.w = nw; n.lines = wrapText(n.label, cpl, 3); n.h = n.lines.length * 15 + (n.type === 'proc' ? 40 : 24); });
      const hOf = x => x.dummy ? 28 : x.n.h, colH = layers.map(Lr => Lr.reduce((a, x) => a + hOf(x), 0) + (Lr.length - 1) * 40), H0 = Math.max(...colH);
      const xs = (W - (R * nw + (R - 1) * gap)) / 2;

    } else {

        const nw = Math.min(170, (W - (Lr.length - 1) * 18 - dum * DW) / Math.max(1, real)), cpl = Math.floor((nw - 12) / 6.8);
        Lr.forEach(x => { if (!x.dummy) { x.n.w = nw; x.n.lines = wrapText(x.n.label, cpl, 4); x.n.h = x.n.lines.length * 15 + (x.n.type === 'proc' ? 40 : 24); } });
        const rh = Math.max(24, ...Lr.filter(x => !x.dummy).map(x => x.n.h)), tw = real * nw + dum * DW + (Lr.length - 1) * 18;
        let x0 = (W - tw) / 2;
        Lr.forEach(x => { const w = x.dummy ? DW : nw; pos.set(key(x), { x: x0 + w / 2, y: y + rh / 2 }); x0 += w + 18; });
        y += rh + 78;
      });
      SH = y - 78 + 14;
    }
    const svg = svgRoot(SW, SH, (L.label || 'DFD')); const defs = sv('defs', {}, svg); marker(defs, mid, 'sv-mk'); marker(defs, mid + 'on', 'sv-mk on');
    const fg = sv('g', {}, svg), ng = sv('g', {}, svg), lg = sv('g', {}, svg);
    const clip = (n, p, toward) => { const dx = toward.x - p.x, dy = toward.y - p.y; const sx = n.w / 2 / Math.abs(dx || 1e-9), sy = n.h / 2 / Math.abs(dy || 1e-9), s = Math.min(sx, sy, 1); return { x: p.x + dx * s, y: p.y + dy * s }; };
    const pairCount = new Map(), pairIdx = new Map();
    E.forEach(e => { const k = [e.a, e.b].sort().join('|'); pairCount.set(k, (pairCount.get(k) || 0) + 1); });
    E.forEach((e, k) => {
      const f = e.f, pk = [e.a, e.b].sort().join('|'), m = pairCount.get(pk), j = pairIdx.get(pk) || 0; pairIdx.set(pk, j + 1);
      const c = chains.get(k) || { dir: true, ch: [] };
      let pts = [pos.get(f.a), ...(c.dir ? c.ch : c.ch.slice().reverse()).map(x => pos.get(x)), pos.get(f.b)].map(p => ({ x: p.x, y: p.y }));

      const dx0 = can[1].x - can[0].x, dy0 = can[1].y - can[0].y, l0 = Math.hypot(dx0, dy0) || 1;
      const off = (j - (m - 1) / 2) * 22, ox = -dy0 / l0 * off, oy = dx0 / l0 * off;

      pts[0] = clip(f.a, pts[0], pts[1]); pts[pts.length - 1] = clip(f.b, pts[pts.length - 1], pts[pts.length - 2]);
      const on = sel && (sel === f.a || sel === f.b);

      sv('path', { d, class: 'sv-line' + (on ? ' on' : ''), 'marker-end': `url(#${mid}${on ? 'on' : ''})`, 'stroke-linejoin': 'round' }, fg);
      // label on the longest segment
      let best = 0, bl = -1; for (let q = 0; q < pts.length - 1; q++) { const ll = Math.hypot(pts[q + 1].x - pts[q].x, pts[q + 1].y - pts[q].y); if (ll > bl) { bl = ll; best = q; } }
      const A = pts[best], Bq = pts[best + 1]; let lx = (A.x + Bq.x) / 2, ly = (A.y + Bq.y) / 2;
      if (m > 1 && off) { const sg = Math.sign(off), lw = Math.min(16, f.label.length) * 6.4 + 10; if (Math.abs(oy) < Math.abs(ox)) lx += sg * Math.sign(ox || 1) * (lw / 2 + 2); else ly += sg * Math.sign(oy || 1) * 12; }

    N.forEach(n => {
      const p = pos.get(n), l = p.x - n.w / 2, t = p.y - n.h / 2;
      const g = svBtn(ng, `${{ ent: 'External entity', proc: 'Process', store: 'Data store' }[n.type]}: ${n.label}`, () => { sel = n; draw(); showN(n, F); }, sel === n ? 'on' : '');
      if (n.type === 'ent') sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 2, class: 'shp ent' }, g);
      else if (n.type === 'proc') { sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 10, class: 'shp' }, g); sv('line', { x1: l, x2: l + n.w, y1: t + 22, y2: t + 22, class: 'dfd-rule' }, g); sv('text', { x: p.x, y: t + 11.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      else { sv('rect', { x: l, y: t, width: n.w, height: n.h, class: 'shp store' }, g); sv('line', { x1: l + 34, x2: l + 34, y1: t, y2: t + n.h, class: 'dfd-rule' }, g); sv('text', { x: l + 17, y: p.y, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      svText(g, n.lines, n.type === 'store' ? l + 34 + (n.w - 34) / 2 : p.x, n.type === 'proc' ? p.y + 11 : p.y, null, 15);
    });
    wrap.innerHTML = ''; wrap.append(svg);
  }
  function showN(n, F) {
    const ins = F.filter(f => f.b === n), outs = F.filter(f => f.a === n);
    const nm = x => x.type === 'proc' ? `${x.id} ${x.label}` : x.type === 'store' ? `${x.id} ${x.label}` : x.label;
    cx.detailHTML(`<strong>${esc(nm(n))} · ${{ ent: 'external entity', proc: 'process', store: 'data store' }[n.type]}</strong><div>${ins.length ? 'In: ' + ins.map(f => `<b>${esc(f.label)}</b> from ${esc(nm(f.a))}`).join('; ') : 'No data flows in.'}</div><div>${outs.length ? 'Out: ' + outs.map(f => `<b>${esc(f.label)}</b> to ${esc(nm(f.b))}`).join('; ') : 'No data flows out.'}</div>`);
  }

  cx.detail(levels[0] ? levels[0].label : '', 'Select a box to see the data flowing in and out of it.');
};

/* ---- 15 table-reveal ---- */
DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));
  function paint() {
    rows.forEach((r, ri) => r.forEach((c, ci) => {
      const k = key(ri, ci), td = cells.get(k);
      if (H.has(k) && !shown.has(k)) { td.className = ''; td.innerHTML = ''; const b = el('button', { type: 'button', class: 'cellbtn', 'aria-label': `Reveal ${plain(head[ci] || 'cell')} in row ${ri + 1}` }, '?'); b.addEventListener('click', () => reveal(ri, ci, true)); td.append(b); }
      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }
    }));
    cnt.textContent = `${shown.size} of ${H.size} revealed`;
    next.disabled = all.disabled = shown.size === H.size; hide.disabled = !shown.size;
  }
  function reveal(r, c, focusNext) {
    shown.add(key(r, c)); paint();
    cx.detail(`${plain(head[c] || '')}, row ${r + 1}`, String(rows[r][c]));
    if (focusNext) { const nb = body.querySelector('.cellbtn'); if (nb) nb.focus(); else next.focus(); }
  }
  next.addEventListener('click', () => { const h = order.find(h => !shown.has(key(h[0], h[1]))); if (h) reveal(h[0], h[1]); });
  all.addEventListener('click', () => { order.forEach(h => shown.add(key(h[0], h[1]))); paint(); cx.detail('', 'All cells revealed.'); });
  hide.addEventListener('click', () => { shown.clear(); paint(); cx.detail('', 'Work out each hidden cell, then select it to check.'); });
  paint(); cx.detail('', 'Work out each hidden cell, then select it to check.');
};
