e same sentence: 'a public cloud is cheaper because there is no hardware to buy, **whereas** a private cloud needs capital investment but gives full control'."},{"t":"warn","text":"A private cloud is not the same as 'no cloud'. It still uses virtualisation, pooling and self-service – just for one organisation."}],"diagram":{"kind":"compare","title":"Three deployment models","caption":"Toggle between the models to compare their key features.","states":[{"label":"Public","points":["Owned by a provider such as AWS, Azure or Google","Shared by many tenants","Pay as you go; scales in minutes","Least control over location and upgrades"],"art":null},{"label":"Private","points":["Dedicated to one organisation","On-site or hosted on dedicated hardware","Most control; easier to show compliance","Highest cost; capacity limited by owned hardware"],"art":null},{"label":"Hybrid","points":["Private and public linked together","Sensitive data private; peaks or less sensitive work public","Cloud bursting at busy times","Most complex to secure and manage"],"art":null}]},"check":[{"q":"Which deployment model is shared by many organisations?","o":["Public cloud","Private cloud","Hybrid cloud","On-premises"],"a":0,"why":"Public cloud resources are pooled between tenants."},{"q":"Using public cloud capacity only when a private system is overloaded is called…","o":["virtualisation","cloud bursting","data sovereignty","packet switching"],"a":1,"why":"The workload 'bursts' into the public cloud at peaks."},{"q":"A bank keeps customer accounts on dedicated infrastructure but runs its marketing website on AWS. This is a…","o":["public cloud","private cloud","hybrid cloud","community intranet"],"a":2,"why":"It combines private and public."}],"exam":[],"practice":[{"q":"Describe a hybrid cloud and give one reason an organisation might choose it.","m":2,"a":"A combination of private cloud/on-premises and public cloud services linked so data/apps can move between them (1); e.g. keeps sensitive data under its own control while using cheap, scalable public resources for peaks or less sensitive work (1)."},{"q":"Compare public and private cloud deployment for a small online retailer.","m":4,"a":"Public cloud has no upfront hardware cost/pay as you go (1) whereas private requires investment in hardware and staff (1); public scales quickly to meet sales peaks (1) whereas private capacity is limited to owned hardware but gives more control over security and data location (1)."}],"videos":[{"title":"Cloud computing and virtualisation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS14-video"}],"terms":["Public cloud","Private cloud","Hybrid cloud"]},{"id":"c04-p08","spec":"Evaluate the use of cloud computing by organisations","lessons":["IS14"],"summary":"Cloud computing offers scalability, lower upfront cost, anywhere access, provider-managed maintenance and resilience, but brings dependence on connectivity, third-party security and legal risks, data location issues, lock-in and long-term costs.","blocks":[{"t":"p","text":"Evaluation questions on cloud computing are usually extended answers. Build the answer around specific benefits and drawbacks applied to the organisation, then reach a judgement."},{"t":"h","text":"Benefits"},{"t":"list","items":["**[[Scalability]] and elasticity** – capacity is added or removed in minutes, so an organisation pays for peak capacity only when it needs it.","**Cost structure** – little capital expenditure on servers, rooms, power and cooling; costs become predictable operating expenditure.","**Access and collaboration** – staff can work from any location and device; several people can edit the same document at once.","**Maintenance** – the provider patches, upgrades and physically secures the infrastructure, freeing scarce IT staff.","**Resilience** – data is replicated across data centres, giving better backup and disaster recovery than a single server room.","**Advanced services** – AI, analytics and large databases are available without buying specialist hardware."],"ordered":false},{"t":"h","text":"Drawbacks and risks"},{"t":"list","items":["**Connectivity** – no internet, no service; bandwidth may be poor in parts of rural Northern Ireland.","**Security and legal responsibility** – data is held by a third party. The organisation remains the [[data controller]] under the UK GDPR and must have a contract with the provider (its [[data processor]]) that guarantees appropriate security.","**[[Data sovereignty]]** – data held in another country is subject to that country's laws; transfers of personal data outside the UK must meet the UK GDPR's international transfer rules.","**Loss of control** – the provider decides upgrade timing, feature changes and outage handling.","**[[Vendor lock-in]]** – proprietary formats and services make it costly to switch providers.","**Long-term cost** – subscriptions continue for ever and can exceed the cost of owning hardware over many years, especially for steady workloads."],"ordered":false},{"t":"example","title":"Worked example: building a balanced judgement","steps":["Benefit applied: during the summer season bookings treble, and the cloud system scales up without the firm buying servers it would not use in winter.","Drawback applied: drivers' tablets lose signal in rural areas, so the app must cache bookings offline and sync later.","Legal point: customer details are personal data; the firm must choose a provider with UK-compliant security and transfer arrangements.","Judgement: the scalability and lower upfront cost outweigh the risks **provided** the firm chooses a reputable UK-region provider, keeps independent backups and plans for offline working."],"context":"A coach-tour company based in Fermanagh is considering a cloud-based booking system."},{"t":"key","title":"Key points","items":["Benefits: scalability, low upfront cost, access anywhere, provider maintenance, resilience, advanced services.","Drawbacks: connectivity, third-party security and legal responsibility, data sovereignty, loss of control, lock-in, ongoing cost.","Top-band answers apply every point to the scenario and finish with a justified recommendation."]},{"t":"tip","text":"Name the law correctly: the organisation stays responsible under the **UK GDPR and the Data Protection Act 2018** (as amended by the Data (Use and Access) Act 2025). The regulator is now the **Information Commission**."},{"t":"warn","text":"'The cloud is not secure' is too vague to earn credit. Explain the specific risk – e.g. a misconfigured storage area exposing records, or data held abroad – and how it can be managed."}],"diagram":{"kind":"calc","title":"Five-year cost comparison","caption":"Adjust the figures to compare buying a server with renting equivalent cloud capacity. A positive result means the cloud option costs more over the period.","inputs":[{"id":"cloud","label":"Cloud cost per month (£)","value":450},{"id":"years","label":"Number of years","value":5},{"id":"capex","label":"Server purchase and installation (£)","value":12000},{"id":"run","label":"On-premises running cost per year: power, support (£)","value":2500}],"formula":"cloud*12*years-(capex+run*years)","result":{"label":"Cloud minus on-premises cost","unit":"£"},"show":[]},"check":[{"q":"Which is a drawback of cloud computing?","o":["Scalability","Access from anywhere","Dependence on internet connectivity","No upfront hardware cost"],"a":2,"why":"No connection means no access."},{"q":"Data stored in another country being subject to that country's laws is an issue of…","o":["elasticity","virtualisation","data sovereignty","redundancy"],"a":2,"why":"Where data physically lives matters legally."},{"q":"When a school stores pupil data with a cloud provider, under data protection law the school is…","o":["no longer responsible","the data processor","the data controller","the data subject"],"a":2,"why":"The school decides why and how the data is processed; the provider is its processor."}],"exam":[],"practice":[{"q":"Discuss the advantages and disadvantages for a GP surgery of storing patient records in a public cloud.","m":8,"a":"Indicative content – advantages: records accessible to authorised staff from any site/home visits (1); provider handles backups and disaster recovery (1); no need to buy/maintain servers, predictable costs (1); scalable storage (1). Disadvantages: patient data is special category data – the surgery remains controller and must ensure the provider's security and contract (1); data location/sovereignty if stored outside UK (1); outage or loss of connection stops access to records during clinics (1); lock-in/ongoing cost (1). Top band: points applied to the surgery and a justified conclusion, e.g. acceptable with a UK-region, health-accredited provider, encryption and offline contingency."}],"videos":[{"title":"Cloud computing and virtualisation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS14-video"}],"terms":["Scalability","Data controller","Data processor","Data sovereignty","Vendor lock-in"]},{"id":"c04-p09","spec":"Explain virtualisation and its benefits","lessons":["IS14"],"summary":"Virtualisation uses a hypervisor to run several isolated virtual machines on one physical server, cutting hardware and energy costs and speeding provisioning and recovery, at the price of a single point of failure and some overhead.","blocks":[{"t":"p","text":"[[Virtualisation]] uses software to create virtual versions of physical resources – servers, storage, networks or desktops. The most important form is **server virtualisation**: a [[hypervisor]] divides one physical server into several [[virtual machine (VM)|Virtual machine (VM)]]s. Each VM has its own virtual processor, memory, disk and network card and runs its own operating system and applications, unaware that it shares the hardware."},{"t":"h","text":"Types of hypervisor"},{"t":"table","head":["Type","Runs on","Typical use"],"rows":[["Type 1 (bare metal)","Directly on the server hardware, with no host OS","Data centres and cloud providers, e.g. VMware ESXi, Microsoft Hyper-V, KVM"],["Type 2 (hosted)","As an application on a normal host operating system","Testing and teaching on a desktop, e.g. VirtualBox"]]},{"t":"p","text":"Virtualisation is the technology that makes cloud computing possible: a provider pools thousands of physical servers and allocates VMs to customers on demand, moving them between hosts as needed."},{"t":"h","text":"Evaluating server virtualisation"},{"t":"compare","head":["Benefits","Drawbacks"],"rows":[["Cost","[[Server consolidation]]: one host replaces many under-used servers, saving hardware, space, power and cooling","Powerful hosts, hypervisor licences and specialist skills are needed"],["Speed","A new server is created from a template in minutes","Some performance overhead compared with dedicated hardware"],["Reliability","VMs are isolated – one crashing does not affect others","The host is a single point of failure for all its VMs unless hosts are clustered"],["Recovery","[[Snapshot]]s allow instant roll-back; VMs can be migrated live to another host","Many VMs ('VM sprawl') can become hard to track and secure"],["Testing","Software can be tested on several operating systems safely","Resource contention if too many VMs share one host"]]},{"t":"example","title":"Worked example: consolidation savings","steps":["Before: 10 physical servers, each drawing 400 W and on average 12% utilised.","After: 2 hosts drawing 600 W each run all ten workloads as VMs.","Power: 10 × 400 W = 4000 W before; 2 × 600 W = 1200 W after – a 70% reduction.","Energy per year: 2.8 kW × 8760 h = 24 528 kWh saved – plus less cooling and floor space."],"context":"A further education college in Derry virtualises its server room.","answer":"Fewer, busier servers cut energy use by 70% in this case."},{"t":"key","title":"Key points","items":["A hypervisor runs multiple isolated VMs, each with its own OS, on one physical host.","Type 1 runs on bare metal; type 2 runs on a host OS.","Benefits: consolidation, fast provisioning, isolation, snapshots and migration. Drawbacks: host failure, overhead, complexity."]},{"t":"tip","text":"When explaining virtualisation, name the **hypervisor** and say that each VM runs its **own operating system** – those two details usually carry the marks."},{"t":"warn","text":"Virtualisation and cloud computing are not the same thing. Virtualisation is a technology you can use in your own server room; cloud computing is a service model that relies on it."}],"diagram":{"kind":"layers","title":"Inside a virtualised server","caption":"Click each layer of a type 1 virtualised host, from the applications down to the hardware.","items":[{"label":"Applications","detail":"Each VM runs its own software – e.g. a web server in one VM, the MIS database in another."},{"label":"Guest operating systems","detail":"Every VM has its own OS (Windows Server, Linux…), isolated from the others."},{"label":"Virtual machines","detail":"Virtual CPU, memory, disk and network card presented to each guest OS."},{"label":"Hypervisor","detail":"Creates, runs and manages the VMs, sharing out the physical resources and keeping VMs isolated."},{"label":"Physical hardware","detail":"One server's real processors, RAM, storage and network interfaces."}]},"check":[{"q":"What does a hypervisor do?","o":["Encrypts cloud data","Creates and manages virtual machines","Assigns IP addresses","Filters web traffic"],"a":1,"why":"It shares the host's resources between VMs."},{"q":"A type 2 hypervisor…","o":["runs directly on the hardware","runs as an application on a host OS","is only used by cloud providers","cannot run Linux"],"a":1,"why":"Hosted hypervisors such as VirtualBox sit on an existing OS."},{"q":"Which is a drawback of server virtualisation?","o":["Faster provisioning","Snapshots","The physical host is a single point of failure","Lower energy use"],"a":2,"why":"If an unclustered host fails, every VM on it stops."},{"q":"Running ten under-used servers as VMs on two hosts is called…","o":["server consolidation","cloud bursting","load balancing","data warehousing"],"a":0,"why":"Fewer, fuller servers."}],"exam":[],"practice":[{"q":"Explain what is meant by virtualisation and the role of a hypervisor.","m":3,"a":"Using software to create virtual versions of hardware such as servers (1); a hypervisor creates, runs and manages virtual machines on a physical host (1), sharing its resources so several VMs, each with its own OS, run in isolation on one machine (1)."},{"q":"Give two benefits of server virtualisation to an organisation.","m":2,"a":"Any two: fewer physical servers so lower hardware/power/cooling/space costs (1); new servers created quickly from templates (1); isolation so failures/testing do not affect other systems (1); snapshots/live migration aid backup and disaster recovery (1)."}],"videos":[{"title":"Cloud computing and virtualisation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS14-video"},{"title":"OCR A Level SLR4 – Virtual machines","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr04-virtual-machines/"}],"terms":["Virtualisation","Hypervisor","Virtual machine (VM)","Server consolidation","Snapshot"]}],"topic":"G21","topicName":"Network security and cloud computing","links":{"tests":[{"id":"GJ","title":"A2 1 topic test J: Networks, security and the cloud","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GJ"}],"papers":[{"id":"GP3","title":"A2 1 Practice Paper","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GP3"}]}},{"id":"c05","n":5,"title":"Information systems in organisations","intro":"The information systems that support each level of an organisation – transaction processing, management information, decision support and expert systems – and the impact of artificial intelligence, machine learning, the Internet of Things and robotics.","pages":[{"id":"c05-p01","spec":"Describe the characteristics and purpose of transaction processing systems (TPS)","lessons":["IS15"],"summary":"A TPS records and processes an organisation's routine transactions – in real time or in batches – accurately, quickly and securely, supporting operational staff and supplying the data every other information system depends on.","blocks":[{"t":"p","text":"An [[information system]] collects, stores and processes data to provide information that supports an organisation's operations and decisions. Different systems serve different levels of management, and the base of the pyramid is the [[transaction processing system (TPS)|Transaction processing system (TPS)]]."},{"t":"table","head":["Level","Decisions","Information needed","Typical system"],"rows":[["Strategic (directors)","Long-term, unstructured – open a new branch?","Summarised, internal and external, forecasts","DSS / executive information system"],["Tactical (middle managers)","Medium-term, semi-structured – staffing next month","Summary and exception reports, trends","MIS"],["Operational (supervisors, staff)","Day-to-day, structured – reorder this item","Detailed, current, internal","TPS"]],"caption":"Information systems and levels of management"},{"t":"h","text":"What a TPS does"},{"t":"p","text":"A **transaction** is a single business event that must be recorded: a sale, a payment, a booking, a stock delivery, a timesheet. A TPS captures each transaction, validates it, updates the master files or database and produces outputs such as receipts, tickets, invoices and payslips. Its users are mainly operational staff and customers."},{"t":"compare","head":["Real-time (online) processing","Batch processing"],"rows":[["How it works","Each transaction updates the records immediately","Transactions are collected and processed together later as a batch"],["Examples","Seat booking, ATM withdrawal, online stock check","Payroll, utility billing, cheque clearing overnight"],["Why chosen","Records must be current to avoid double-booking","Large volumes, no need for instant update; runs off-peak"],["Drawback","Needs continuous availability and record locking","Data out of date until the batch runs"]]},{"t":"h","text":"Characteristics of a good TPS"},{"t":"list","items":["**Fast** – handles high volumes at peak times (results day, Black Friday).","**Accurate and reliable** – validation on input; consistent results every time.","**Secure** – access control, audit trails and encryption of payment data.","**ACID transactions** – each transaction is atomic, consistent, isolated and durable, so a failure half-way through never leaves records half-updated (see the database chapter).","**Controlled** – standard, structured procedures with little need for judgement."],"ordered":false},{"t":"key","title":"Key points","items":["TPS = records and processes routine transactions for operational staff.","Real-time for immediate updates (bookings); batch for high-volume periodic jobs (payroll).","The TPS supplies the detailed data that MIS, DSS and data warehouses summarise."]},{"t":"tip","text":"When describing a TPS in a scenario, give its **inputs, processing and outputs** in context: 'input – customer ID and seat number; processing – check seat free and update booking file; output – e-ticket'."},{"t":"warn","text":"Do not describe batch processing as 'old-fashioned'. It is the right choice whenever data does not need instant updating and volumes are large, e.g. a monthly payroll run."}],"diagram":{"kind":"flow","title":"A real-time booking transaction","caption":"Step through a cinema seat booking processed by a TPS.","direction":"lr","nodes":[{"id":"a","label":"Customer selects seat","detail":"Input: film, showing, seat number and payment details.","shape":"io"},{"id":"b","label":"Validate input","detail":"Checks the showing exists and card details are in the correct format.","shape":"process"},{"id":"c","label":"Seat still free?","detail":"The record is locked while it is checked so two customers cannot book the same seat.","shape":"decision"},{"id":"d","label":"Take payment and update bookings","detail":"Done as one atomic transaction – both succeed or neither does.","shape":"process"},{"id":"s","label":"Bookings database","detail":"Master data updated immediately; later summarised by the MIS.","shape":"store"},{"id":"e","label":"Issue e-ticket","detail":"Output: confirmation email with QR code.","shape":"end"},{"id":"f","label":"Offer another seat","detail":"Transaction rejected; nothing is changed.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d","yes"],["c","f","no"],["d","s"],["s","e"]]},"check":[{"q":"Which is best suited to batch processing?","o":["Airline seat booking","Monthly payroll","ATM withdrawal","Online stock check"],"a":1,"why":"Payroll can be run once for all employees at the end of the period."},{"q":"Who are the main users of a TPS?","o":["Directors","Operational staff and customers","Shareholders only","Regulators"],"a":1,"why":"It supports day-to-day operations."},{"q":"Which level of management makes long-term, unstructured decisions?","o":["Operational","Tactical","Strategic","Clerical"],"a":2,"why":"Directors decide strategy."}],"exam":[],"practice":[{"q":"State the difference between batch and real-time transaction processing, giving an example of each.","m":4,"a":"Real-time: each transaction is processed and records updated immediately (1), e.g. a theatre seat booking (1). Batch: transactions are collected and processed together later (1), e.g. a monthly payroll run (1)."},{"q":"Describe two characteristics of a transaction processing system.","m":2,"a":"Any two: high-speed processing of large volumes (1); accuracy through validation (1); reliability/ACID so transactions are never half-completed (1); security/audit trail (1); structured, repetitive procedures (1)."}],"videos":[{"title":"Types of information system – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS15-video"}],"terms":["Information system","Transaction processing system (TPS)","Real-time processing","Batch processing"]},{"id":"c05-p02","spec":"Describe management information systems (MIS) and decision support systems (DSS)","lessons":["IS15"],"summary":"An MIS summarises TPS data into scheduled, exception and on-demand reports that help middle managers monitor performance and make tactical decisions.","blocks":[{"t":"p","text":"A [[management information system (MIS)|Management information system (MIS)]] takes the detailed data captured by transaction processing systems and turns it into **summarised, structured reports** for middle managers. Its purpose is to help them monitor performance against targets, spot problems and make tactical, semi-structured decisions such as staffing levels, budgets and stock policy."},{"t":"h","text":"Types of MIS report"},{"t":"table","head":["Report type","What it is","Example"],"rows":[["Scheduled (periodic)","Produced automatically at regular intervals in a fixed format","Weekly sales by branch every Monday"],["[[Exception report]]","Only lists items outside set limits, so managers focus on problems","Branches more than 10% below their sales target"],["On-demand (ad hoc)","Produced when a manager requests it","Sales of one product line in the last 30 days"],["Drill-down","Starts at a summary and lets the manager open the detail beneath","Region → branch → till → individual transactions"]],"caption":"MIS reports"},{"t":"h","text":"Qualities of good management information"},{"t":"list","items":["**Relevant** to the decision and the manager receiving it.","**Accurate** – based on validated TPS data.","**Timely** – available when the decision has to be made.","**Complete** enough without overloading the reader.","**Appropriately summarised** and presented, e.g. with charts and highlighting."],"ordered":false},{"t":"example","title":"Worked example: MIS in a hotel group","steps":["TPS data: every room booking and restaurant bill at four hotels.","Scheduled report: weekly occupancy and revenue per hotel for the operations manager.","Exception report: flags any hotel whose occupancy falls below 60% so marketing can act.","Decision supported: the manager moves two housekeeping staff from a quiet hotel to a busy one next month – a tactical decision."],"context":"A group of hotels around Lough Erne."},{"t":"p","text":"The main limitations of an MIS are that it relies mostly on **internal, historical** data and **pre-defined** report formats. It tells managers what has happened, but it is not designed to explore 'what if' questions about the future – that is the job of a decision support system."},{"t":"key","title":"Key points","items":["MIS: summarises TPS data into reports for middle managers.","Report types: scheduled, exception, on-demand, drill-down.","Supports tactical, semi-structured decisions; limited by internal, historic, fixed-format data."]},{"t":"tip","text":"An exception report question usually wants both **what** it is (only items outside limits) and **why** it helps (managers can focus on problems without reading every line)."},{"t":"warn","text":"Do not confuse an MIS with the TPS that feeds it. The TPS records each transaction; the MIS **summarises** many transactions for managers."}],"diagram":{"kind":"flow","title":"From transactions to management information","caption":"Step through how TPS data becomes MIS reports and a tactical decision.","direction":"lr","nodes":[{"id":"a","label":"Bookings and sales","detail":"Thousands of individual transactions captured by the TPS.","shape":"io"},{"id":"b","label":"Transaction database","detail":"Detailed, current operational data.","shape":"store"},{"id":"c","label":"MIS summarises","detail":"Totals, averages and comparisons with targets by hotel and week.","shape":"process"},{"id":"d","label":"Below limit?","detail":"Checks each hotel's occupancy against the 60% threshold.","shape":"decision"},{"id":"e","label":"Exception report","detail":"Lists only the hotels below the threshold.","shape":"io"},{"id":"f","label":"Scheduled weekly report","detail":"Every hotel's figures in a standard format.","shape":"io"},{"id":"g","label":"Manager decides","detail":"Tactical decision such as moving staff or running a promotion.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","f"],["c","d"],["d","e","yes"],["e","g"],["f","g"]]},"check":[{"q":"A report listing only the stores that missed their sales target is…","o":["a scheduled report","an exception report","a drill-down report","a transaction log"],"a":1,"why":"It shows only exceptions to a set limit."},{"q":"Which level of management mainly uses an MIS?","o":["Operational","Tactical (middle)","Strategic only","Customers"],"a":1,"why":"Middle managers monitor performance with MIS reports."},{"q":"A key limitation of an MIS is that it…","o":["cannot summarise data","relies mainly on internal, historical data in fixed formats","only works in real time","replaces the TPS"],"a":1,"why":"It reports what has happened rather than modelling the future."}],"exam":[],"practice":[{"q":"Describe three types of report that a management information system might produce.","m":3,"a":"Scheduled – produced at regular intervals in a set format, e.g. weekly sales (1). Exception – shows only items outside set limits, e.g. branches below target (1). On-demand – produced when requested by a manager for a specific query (1). Also credit drill-down."},{"q":"Explain one benefit of exception reports to a busy area manager.","m":2,"a":"Only problem items are shown (1), so the manager can focus attention and act quickly without reading through every branch's figures (1)."}],"videos":[{"title":"Types of information system – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS15-video"}],"terms":["Management information system (MIS)","Exception report"]},{"id":"c05-p03","spec":"Describe management information systems (MIS) and decision support systems (DSS)","lessons":["IS15"],"summary":"A DSS combines data, a model base and an interactive interface so managers can explore what-if scenarios, goal-seek and forecast when facing semi-structured or unstructured decisions – supporting, not replacing, their judgement.","blocks":[{"t":"p","text":"A [[decision support system (DSS)|Decision support system (DSS)]] is an interactive information system that helps managers – usually senior and middle managers – tackle **semi-structured or unstructured** problems where there is no fixed procedure for finding the answer: where to open a new branch, whether to launch a product, how to price a service."},{"t":"h","text":"Components of a DSS"},{"t":"table","head":["Component","Contents"],"rows":[["Database","Internal data from TPS and MIS plus external data – market research, economic forecasts, competitor prices, population statistics"],["Model base","Financial, statistical, forecasting and optimisation models that manipulate the data"],["User interface","Interactive dashboards, charts and forms that let a manager change assumptions and see the results immediately"]]},{"t":"h","text":"What managers do with it"},{"t":"list","items":["**[[What-if analysis]]** – change one or more inputs and see the effect: 'What happens to profit if fuel costs rise by 10%?'","**Goal seeking** – work backwards from a target: 'What ticket price gives £50 000 profit?'","**Scenario comparison** – best, expected and worst cases side by side.","**Forecasting** – project trends forward from historical data."],"ordered":false},{"t":"compare","head":["MIS","DSS"],"rows":[["Type of decision","Structured or semi-structured, tactical","Semi-structured or unstructured, often strategic"],["Data","Mainly internal, historical","Internal and external, including forecasts"],["Output","Pre-defined, regular reports","Interactive, flexible analysis"],["Question answered","What has happened?","What would happen if…?"],["Interaction","Low – read the report","High – manager changes assumptions"]]},{"t":"example","title":"Worked example: what-if analysis","steps":["Base case: 120 rooms at 70% average occupancy and £95 per night gives annual room revenue of 120 × 0.70 × 95 × 365 ≈ £2.91 million.","What if 40 rooms are added and occupancy falls to 65%? 160 × 0.65 × 95 × 365 ≈ £3.61 million.","The model base also adds building costs, extra staff and loan interest to show whether the extra revenue covers them.","The board compares scenarios and makes the final decision, using the DSS as evidence – not as the decision-maker."],"context":"A hotel group's board is considering an extension in Enniskillen."},{"t":"key","title":"Key points","items":["DSS = database + model base + interactive interface.","Supports semi-structured and unstructured decisions with what-if analysis, goal seeking and forecasting.","It supports, not replaces, human judgement."]},{"t":"tip","text":"'Explain how a DSS differs from an MIS' – a good answer contrasts **fixed reports vs interactive modelling** and **internal historical data vs internal plus external data**."},{"t":"warn","text":"A spreadsheet model can act as a simple DSS. Do not assume a DSS must be an expensive specialist package – the defining feature is interactive modelling to support a decision."}],"diagram":{"kind":"calc","title":"What-if: room revenue","caption":"Change the number of rooms, occupancy or price to see the effect on annual room revenue – a tiny DSS model.","inputs":[{"id":"rooms","label":"Number of rooms","value":160},{"id":"occ","label":"Average occupancy (%)","value":65},{"id":"price","label":"Average price per night (£)","value":95}],"formula":"rooms*occ/100*price*365","result":{"label":"Annual room revenue","unit":"£"},"show":[]},"check":[{"q":"'What price gives us £50 000 profit?' is an example of…","o":["exception reporting","goal seeking","batch processing","drill-down"],"a":1,"why":"It works backwards from a target outcome."},{"q":"Which component of a DSS holds forecasting and financial models?","o":["The knowledge base","The model base","The inference engine","The TPS"],"a":1,"why":"The model base manipulates the data."},{"q":"A DSS mainly supports decisions that are…","o":["fully structured","semi-structured or unstructured","made by machines alone","only operational"],"a":1,"why":"There is no fixed procedure, so managers explore options."}],"exam":[],"practice":[{"q":"Explain how a decision support system differs from a management information system.","m":4,"a":"An MIS produces regular, pre-defined reports (1) whereas a DSS is interactive, letting managers model scenarios such as what-if analysis (1). An MIS mainly uses internal historical data (1) whereas a DSS also uses external data and forecasts to support semi-structured/unstructured, often strategic, decisions (1)."}],"videos":[{"title":"Types of information system – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS15-video"}],"terms":["Decision support system (DSS)","What-if analysis"]},{"id":"c05-p04","spec":"Describe expert systems, including the knowledge base, inference engine and user interface","lessons":["IS15"],"summary":"An expert system mimics a human expert in a narrow field: its knowledge base holds facts and IF–THEN rules, its inference engine applies them by forward or backward chaining, and its user interface asks questions and explains its conclusions.","blocks":[{"t":"p","text":"An [[expert system]] is a computer system that emulates the decision-making of a human expert in a **narrow, well-defined domain**, such as diagnosing faults in a milking machine, approving credit or suggesting a possible diagnosis. It is an early form of rule-based artificial intelligence."},{"t":"h","text":"The three components"},{"t":"table","head":["Component","What it does"],"rows":[["[[Knowledge base]]","Stores the facts and rules of the domain, usually IF … THEN … rules collected from human experts by a [[knowledge engineer]]"],["[[Inference engine]]","Reasoning software that applies the rules in the knowledge base to the facts supplied by the user to reach conclusions"],["User interface","Asks questions, accepts answers and presents conclusions; its [[explanation facility]] shows which rules led to each conclusion"]]},{"t":"h","text":"How the inference engine reasons"},{"t":"compare","head":["Forward chaining","Backward chaining"],"rows":[["Direction","Data-driven: from known facts towards a conclusion","Goal-driven: starts from a hypothesis and looks for facts to prove it"],["Process","Fires every rule whose IF part is satisfied, adds new facts, repeats","Finds rules that would conclude the goal and asks for the facts they need"],["Suits","Monitoring, planning, configuration","Diagnosis – 'is it fault X?'"]]},{"t":"example","title":"Worked example: forward chaining","steps":["Rules: R1 IF engine cranks = no AND lights dim = yes THEN battery flat. R2 IF battery flat THEN charge or replace battery. R3 IF engine cranks = yes AND fuel = empty THEN refuel.","Facts entered by user: engine cranks = no; lights dim = yes.","Cycle 1: R1's conditions are true, so it fires and adds the fact 'battery flat'.","Cycle 2: R2's condition is now true, so it fires and concludes 'charge or replace battery'. R3 never fires.","Explanation facility: 'Conclusion reached because R1 and R2 fired.'"],"context":"A simple tractor fault-finding expert system used by a farm machinery dealer in Tyrone."},{"t":"h","text":"Evaluating expert systems"},{"t":"compare","head":["Advantages","Disadvantages"],"rows":[["Availability","Expertise available 24/7, in many places at once","Cannot handle situations outside its rules; no common sense"],["Consistency","Same inputs always give the same advice; does not tire","Only as good as the rules – errors in the knowledge base are repeated"],["Knowledge","Preserves the knowledge of retiring experts; supports training","Expensive and slow to build; tacit expert knowledge is hard to capture; must be maintained"],["Responsibility","Explanation facility makes advice transparent","Unclear who is liable if advice is wrong; users may over-trust it"]]},{"t":"key","title":"Key points","items":["Expert system: knowledge base + inference engine + user interface (with explanation facility).","Forward chaining: facts → conclusion. Backward chaining: hypothesis → supporting facts.","Consistent, always available, preserves expertise; but narrow, costly, no common sense, accountability issues."]},{"t":"tip","text":"Name each component **and** say what it does. 'Knowledge base, inference engine, user interface' on its own rarely earns more than one mark."},{"t":"warn","text":"The knowledge base is not just a database of records. It holds the **rules** that encode expertise; the facts about the current case come from the user."}],"diagram":{"kind":"table-reveal","title":"Forward chaining trace","caption":"Click the hidden cells to follow the inference engine cycle by cycle.","head":["Cycle","Facts known at start","Rule that fires","New fact or conclusion"],"rows":[["1","engine cranks = no; lights dim = yes","R1","battery flat"],["2","engine cranks = no; lights dim = yes; battery flat","R2","charge or replace battery"],["3","all of the above","none","stop – no further rules can fire"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,3]]},"check":[{"q":"Which part of an expert system applies the rules to the facts?","o":["Knowledge base","Inference engine","User interface","Explanation facility"],"a":1,"why":"The inference engine does the reasoning."},{"q":"Starting from a hypothesis and searching for facts that support it is…","o":["forward chaining","backward chaining","what-if analysis","batch processing"],"a":1,"why":"Goal-driven reasoning."},{"q":"Who gathers rules from human experts to build the knowledge base?","o":["The end user","A knowledge engineer","The data subject","The inference engine"],"a":1,"why":"Knowledge engineers interview experts and encode their knowledge."}],"exam":[],"practice":[{"q":"Describe the three main components of an expert system.","m":6,"a":"Knowledge base (1) – stores facts and IF–THEN rules gathered from human experts (1). Inference engine (1) – applies the rules to the facts entered, using forward/backward chaining, to reach a conclusion (1). User interface (1) – asks the user questions and presents conclusions/advice, often with an explanation of the reasoning (1)."},{"q":"Discuss the use of an expert system to help GPs diagnose illnesses.","m":6,"a":"Benefits: consistent advice/does not forget rare conditions (1); available at any time and in rural practices (1); explanation facility helps GP check reasoning and train (1). Drawbacks: lacks common sense and cannot read the patient as a doctor can (1); rules may be out of date / costly to maintain (1); liability unclear and GP may over-rely on it (1). Conclusion: best used to support, not replace, the GP's judgement."}],"videos":[{"title":"Types of information system – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS15-video"}],"terms":["Expert system","Knowledge base","Knowledge engineer","Inference engine","Explanation facility"]},{"id":"c05-p05","spec":"Describe artificial intelligence and machine learning, including supervised, unsupervised and reinforcement learning","lessons":["IS16"],"summary":"AI is computers performing tasks that need human intelligence; in machine learning, models learn patterns from data – supervised from labelled examples, unsupervised by finding structure in unlabelled data, and reinforcement by trial, error and reward.","blocks":[{"t":"p","text":"[[Artificial intelligence (AI)]] is the ability of computer systems to perform tasks that normally require human intelligence – recognising speech and images, understanding and generating language, making predictions and decisions. All AI in use today is **narrow AI**: it performs specific tasks, sometimes better than people, but cannot transfer its ability to unrelated tasks. **General AI** that matches humans across any task has not been achieved."},{"t":"p","text":"There are two broad approaches. **Rule-based AI**, such as expert systems, follows rules written by people. [[Machine learning]] (ML) instead lets an algorithm **learn patterns from data**, improving its performance without being explicitly programmed for each case. Most modern AI, including **generative AI** that produces text, images and code, is built with machine learning."},{"t":"h","text":"How a machine learning model is built"},{"t":"list","items":["**Collect and prepare data** – clean it, remove errors, check it is representative.","**Train** – the algorithm is given [[training data]] and repeatedly adjusts the model's parameters to reduce its errors.","**Test** – the model is evaluated on separate data it has never seen, to check it generalises rather than memorising the training set (overfitting).","**Deploy and monitor** – the model makes predictions on new data; performance is monitored and the model retrained as conditions change."],"ordered":true},{"t":"p","text":"Many models are [[neural network]]s: layers of connected nodes whose weighted links are adjusted during training. Networks with many layers ('deep learning') power image recognition, speech recognition and large language models."},{"t":"h","text":"Three types of machine learning"},{"t":"table","head":["Type","How it learns","Example uses"],"rows":[["[[Supervised learning]]","From **labelled** examples – each input is paired with the correct output – so it can predict the label for new inputs","Spam filtering; predicting house prices; recognising cattle breeds from photos"],["[[Unsupervised learning]]","From **unlabelled** data – finds hidden structure such as clusters or unusual items itself","Grouping customers into segments; detecting unusual card transactions"],["[[Reinforcement learning]]","By **trial and error** – an agent acts in an environment and receives rewards or penalties, learning a strategy that maximises reward","Game-playing AI; a robot learning to walk; optimising traffic-light timings"]],"caption":"Types of machine learning"},{"t":"key","title":"Key points","items":["AI: machines doing tasks that need human intelligence; all current AI is narrow.","ML: learning patterns from data – train, test on unseen data, deploy, monitor.","Supervised = labelled data; unsupervised = unlabelled, finds structure; reinforcement = rewards for actions."]},{"t":"tip","text":"To distinguish supervised and unsupervised learning, the key word is **labelled**. Give an example of each to secure the second mark."},{"t":"warn","text":"Avoid science-fiction claims such as 'AI thinks like a human' or 'AI understands what it says'. Describe what the system does: it learns statistical patterns from data."}],"diagram":{"kind":"match","title":"Which type of machine learning?","caption":"Match each scenario to the type of learning it uses.","pairs":[["Supervised learning","Thousands of X-rays labelled 'fracture' or 'no fracture' train a model to flag new X-rays"],["Unsupervised learning","A supermarket's loyalty-card data is grouped into customer segments nobody defined in advance"],["Reinforcement learning","A warehouse robot is rewarded each time it picks an item quickly without dropping it"],["Rule-based AI","A knowledge engineer writes IF–THEN rules for diagnosing boiler faults"]]},"check":[{"q":"A model trained on emails already marked 'spam' or 'not spam' uses…","o":["unsupervised learning","supervised learning","reinforcement learning","forward chaining"],"a":1,"why":"The training examples are labelled."},{"q":"Why is a model tested on data it was not trained on?","o":["To make training faster","To check it generalises to new cases","To label the data","To reduce storage"],"a":1,"why":"Good performance only on training data suggests overfitting."},{"q":"Which statement about current AI is accurate?","o":["It has achieved general intelligence","It is narrow – designed for specific tasks","It never makes mistakes","It does not need data"],"a":1,"why":"All deployed AI is narrow AI."}],"exam":[],"practice":[{"q":"Define machine learning.","m":2,"a":"A branch of AI in which algorithms learn/improve their performance at a task (1) from data/experience rather than being explicitly programmed with rules (1)."},{"q":"Distinguish between supervised and unsupervised learning, giving an example of each.","m":4,"a":"Supervised learning trains on labelled data where the correct output is known (1), e.g. predicting whether a transaction is fraudulent from past labelled cases (1). Unsupervised learning finds patterns/clusters in unlabelled data (1), e.g. segmenting customers by buying behaviour (1)."}],"videos":[{"title":"Artificial intelligence, machine learning and emerging technologies – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS16-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 2 (artificial intelligence)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-2/"}],"terms":["Artificial intelligence (AI)","Machine learning","Training data","Neural network","Supervised learning","Unsupervised learning","Reinforcement learning"]},{"id":"c05-p06","spec":"Describe emerging technologies including the Internet of Things and robotics","lessons":["IS16"],"summary":"The Internet of Things connects everyday objects with sensors and network links so they collect and share data automatically; robotics uses programmable machines that sense and act physically – and combined with AI they enable automation and real-time decisions.","blocks":[{"t":"p","text":"The [[Internet of Things (IoT)]] is the network of everyday physical objects – meters, vehicles, machines, wearables, livestock collars – fitted with [[sensor]]s, a processor and a network connection so they can collect and exchange data without human input. Data usually flows to a cloud platform, where it is stored, analysed and used to trigger actions or alerts, often through [[actuator]]s that make something happen."},{"t":"h","text":"IoT in organisations"},{"t":"table","head":["Sector","Example","Benefit"],"rows":[["Agriculture","Collars monitor dairy cows' activity and rumination on a Fermanagh farm","Early detection of illness and the best time for breeding"],["Utilities","Smart electricity meters send readings every half hour","No meter readers; accurate bills; demand data for the network"],["Health","Wearable monitors send patients' heart rate and blood oxygen to a clinic","Patients monitored at home; earlier intervention"],["Manufacturing","Vibration sensors on machines feed [[predictive maintenance]] models","Repairs before breakdown; less downtime"],["Buildings","Smart heating and lighting in a school respond to occupancy","Lower energy bills and emissions"]],"caption":"IoT examples"},{"t":"h","text":"Robotics"},{"t":"p","text":"[[Robotics]] is the design and use of programmable machines that **sense** their environment, **process** the data and **act** physically. Industrial robot arms weld and assemble with high precision; warehouse robots carry shelves to human pickers; surgical robots let surgeons make very precise movements; agricultural robots milk cows or pick fruit; autonomous vehicles and drones deliver goods. Robots are especially valuable for tasks that are repetitive, dangerous or need precision beyond human ability."},{"t":"h","text":"Putting the technologies together"},{"t":"p","text":"The technologies reinforce each other. IoT sensors supply streams of real-time data; machine learning models find patterns and make predictions from that data; robots and actuators carry out the resulting actions. A modern distribution centre, for example, uses sensors to track every item, ML to forecast demand and route picks, and robots to move goods – with humans supervising exceptions."},{"t":"key","title":"Key points","items":["IoT: everyday objects with sensors, processing and connectivity exchanging data automatically.","Robotics: programmable machines that sense, process and act in the physical world.","Together with AI they enable automation, predictive maintenance and real-time decisions."]},{"t":"tip","text":"For IoT questions, describe the **data flow**: what the sensor measures, where the data goes, and what decision or action results. 'The fridge is connected to the internet' is not enough."},{"t":"warn","text":"IoT devices are often cheap with weak default passwords and few security updates. Mention this risk in evaluations – compromised devices have been recruited into large botnets."}],"diagram":{"kind":"flow","title":"An IoT system on a dairy farm","caption":"Step through how data moves from a sensor to an action.","direction":"lr","nodes":[{"id":"a","label":"Sensor collar","detail":"Measures a cow's activity and rumination every few minutes.","shape":"start"},{"id":"b","label":"Wireless gateway","detail":"Collects readings from all collars and sends them over the internet.","shape":"io"},{"id":"c","label":"Cloud platform","detail":"Stores readings for every animal over time.","shape":"store"},{"id":"d","label":"Analytics / ML model","detail":"Compares each cow's pattern with its normal behaviour.","shape":"process"},{"id":"e","label":"Unusual pattern?","detail":"E.g. rumination down 30% for six hours.","shape":"decision"},{"id":"f","label":"Alert farmer's phone","detail":"Farmer checks the cow – early treatment.","shape":"end"},{"id":"g","label":"Keep monitoring","detail":"No action needed.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f","yes"],["e","g","no"]]},"check":[{"q":"Which best describes the Internet of Things?","o":["Websites about everyday objects","Physical objects with sensors and connectivity that exchange data","A type of cloud service model","A network of only computers and phones"],"a":1,"why":"The 'things' are everyday physical objects."},{"q":"Using sensor data to repair a machine before it breaks down is…","o":["predictive maintenance","batch processing","cloud bursting","goal seeking"],"a":0,"why":"Models predict failure from sensor readings."},{"q":"A component that makes something happen in response to a signal, such as opening a valve, is…","o":["a sensor","an actuator","a gateway","a hypervisor"],"a":1,"why":"Sensors measure; actuators act."}],"exam":[],"practice":[{"q":"Describe the Internet of Things and give one example of its use by an organisation.","m":3,"a":"Everyday physical objects/devices with embedded sensors and processors (1) connected to a network/internet so they collect and exchange data automatically (1); e.g. an energy company's smart meters sending readings so bills are accurate without meter readers (1)."},{"q":"Explain one benefit and one risk for a food manufacturer of installing IoT sensors on its production line.","m":4,"a":"Benefit: sensors detect vibration/temperature changes (1) so maintenance happens before breakdown, reducing downtime and waste (1). Risk: devices may have weak security (1) and could be hacked to disrupt production or enter the network (1)."}],"videos":[{"title":"Artificial intelligence, machine learning and emerging technologies – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS16-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 2 (artificial intelligence)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-2/"}],"terms":["Internet of Things (IoT)","Sensor","Actuator","Predictive maintenance","Robotics"]},{"id":"c05-p07","spec":"Evaluate the impact of these technologies on organisations","lessons":["IS16"],"summary":"AI, IoT and robotics can raise productivity, improve decisions and create new services, but bring job displacement, bias, accountability, security, privacy and cost risks that organisations must manage lawfully and responsibly.","blocks":[{"t":"p","text":"'Evaluate' questions want benefits **and** drawbacks for different stakeholders – the organisation, its employees, its customers and society – followed by a justified judgement."},{"t":"h","text":"Benefits to organisations"},{"t":"list","items":["**[[Automation]]** of repetitive tasks raises productivity, works 24/7 and reduces human error.","**Better decisions** from predictive analytics – demand forecasting, fraud detection, predictive maintenance from sensor data.","**Customer service** – chatbots answer routine questions instantly; recommendations personalise offers and increase sales.","**Safety and precision** – robots work in dangerous environments and to tolerances people cannot achieve.","**New products and business models**, giving competitive advantage."],"ordered":false},{"t":"h","text":"Risks and issues"},{"t":"table","head":["Issue","Explanation"],"rows":[["Employment","Routine jobs are displaced; new roles need new skills, so retraining is needed"],["[[Algorithmic bias]]","A model trained on biased or unrepresentative data makes unfair decisions, e.g. in recruitment or lending"],["Transparency and accountability","Complex 'black box' models are hard to explain; who is responsible when an automated decision is wrong?"],["Security","IoT devices with weak security can be hijacked; AI systems can be attacked or manipulated"],["Privacy and law","Large-scale collection of personal data must comply with the UK GDPR and Data Protection Act 2018"],["Cost and reliance","High set-up costs, scarce specialist staff, dependence on suppliers and on data quality"]],"caption":"Risks of AI and emerging technologies"},{"t":"h","text":"Automated decisions and the law"},{"t":"p","text":"Since 5 February 2026 the Data (Use and Access) Act 2025 has replaced the UK GDPR's old general restriction on solely automated decisions. Organisations may now make significant decisions about people by purely automated means on most lawful bases, but they must provide **safeguards**: tell people about such decisions, let them make representations, obtain **human intervention** and contest the decision. Tighter restrictions remain where special category data is involved. Regulation is by the **Information Commission** (formerly the ICO)."},{"t":"note","text":"The detail of the automated decision-making rules goes beyond what CCEA is likely to expect; knowing that people have a right to safeguards including human review is the useful point for exam answers."},{"t":"example","title":"Worked example: evaluating AI in recruitment","steps":["Benefit: the firm receives 2 000 applications for graduate posts; an ML screening tool shortlists in hours rather than weeks.","Risk: if past hiring favoured one group, the training data encodes that bias and the model repeats it – unfair and potentially unlawful discrimination.","Mitigation: audit the training data and outcomes for bias, keep a human reviewer for every rejection, explain the process to applicants.","Judgement: worthwhile only as a decision-support tool with human oversight, not as a fully automated gatekeeper."],"context":"A Belfast software company considers AI to screen job applications."},{"t":"key","title":"Key points","items":["Benefits: automation, productivity, better decisions, 24/7 service, safety, new services.","Risks: jobs, algorithmic bias, accountability, security, privacy/legal compliance, cost.","Good practice: pilot, measure, audit for bias, keep a human in the loop, retrain staff."]},{"t":"tip","text":"Use technical vocabulary – training data, algorithmic bias, automation, predictive analytics – and apply each point to the named organisation. End with a conclusion that follows from your points, not a repeated summary."},{"t":"warn","text":"Do not write that AI will 'replace all jobs'. Examiners reward balanced, realistic points: some tasks are automated, some roles change, new roles appear."}],"diagram":{"kind":"compare","title":"Stakeholder view: robots in a warehouse","caption":"Toggle stakeholders to see how the same investment affects each group.","states":[{"label":"Organisation","points":["Faster, more accurate order picking; 24/7 operation","Lower labour costs over time","High upfront investment and specialist maintenance","Reliance on supplier and on systems staying online"],"art":null},{"label":"Employees","points":["Fewer manual picking jobs; some redundancies","New skilled roles: robot technicians, supervisors","Less heavy lifting and fewer injuries","Need for retraining; possible monitoring of performance"],"art":null},{"label":"Customers","points":["Faster delivery and fewer wrong orders","Possibly lower prices","Less human contact when things go wrong"],"art":null},{"label":"Society","points":["Productivity gains for the economy","Job losses concentrated in some areas","Pressure for retraining schemes","Energy use and e-waste from equipment"],"art":null}]},"check":[{"q":"A loan-approval model trained on past decisions that favoured one postcode area is likely to show…","o":["data sovereignty","algorithmic bias","overclocking","denial of service"],"a":1,"why":"Bias in training data is reproduced in decisions."},{"q":"Which is a recommended safeguard for significant automated decisions about people?","o":["Hiding the decision logic","Allowing human review and the ability to contest the decision","Deleting the input data immediately","Using only unsupervised learning"],"a":1,"why":"Human intervention and the right to contest are required safeguards."},{"q":"Which UK body regulates data protection, including AI processing of personal data?","o":["Ofcom","The Information Commission","The Competition and Markets Authority","The BCS"],"a":1,"why":"The Information Commission replaced the Information Commissioner's Office on 30 September 2026."}],"exam":[],"practice":[{"q":"Explain what is meant by algorithmic bias and how it can occur.","m":3,"a":"Systematic unfairness in the outputs/decisions of an AI system (1); it occurs when training data is biased or unrepresentative, e.g. reflects past discrimination or under-represents a group (1), so the model learns and repeats these patterns when making new decisions (1)."},{"q":"Evaluate the impact of introducing robots and AI in a large warehouse on the business and its employees.","m":8,"a":"Business: faster, more accurate picking and 24/7 working increase capacity (1); lower long-term labour costs (1); but high investment, maintenance and specialist staff (1); dependence on systems/suppliers – breakdown halts operations (1). Employees: some routine jobs lost (1); new skilled roles and retraining (1); safer work with less heavy lifting (1); possible stress from performance monitoring (1). Top band: balanced, applied, with a justified conclusion."}],"videos":[{"title":"Artificial intelligence, machine learning and emerging technologies – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS16-video"},{"title":"OCR A Level SLR17 – Moral, social and ethical issues part 1 (automation and automated decisions)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr17-moral-social-ethical-issues-part-1/"}],"terms":["Automation","Algorithmic bias"]}],"topic":"G22","topicName":"Information systems in organisations","links":{"tests":[{"id":"GK","title":"A2 1 topic test K: Information systems, law and ethics","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GK"}],"papers":[{"id":"GP3","title":"A2 1 Practice Paper","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#GP3"}]}},{"id":"c06","n":6,"title":"Legal, ethical and social issues","intro":"The UK laws that govern information systems – data protection, computer misuse, copyright, freedom of information and investigatory powers – and the ethical, social and environmental impacts of digital technology.","pages":[{"id":"c06-p01","spec":"Describe the principles, rights and roles in the Data Protection Act 2018 and UK GDPR","lessons":["IS17"],"summary":"The UK GDPR and Data Protection Act 2018, as amended by the Data (Use and Access) Act 2025, require controllers to process personal data under seven principles and a lawful basis, with extra protection for special category data.","blocks":[{"t":"p","text":"Data protection law in the UK is made up of the **UK GDPR**, which sets the main rules, and the **Data Protection Act 2018**, which sits alongside it with UK-specific provisions, exemptions and the regulator's powers. Both were significantly amended by the **Data (Use and Access) Act 2025** (DUAA), whose main data protection changes came into force on 5 February 2026. The law applies across the whole UK, including Northern Ireland, and is enforced by the [[Information Commission]] – the body that replaced the Information Commissioner's Office (ICO) on 30 September 2026."},{"t":"h","text":"What the law covers"},{"t":"p","text":"It applies to the processing – collecting, storing, using, sharing, deleting – of [[personal data]]: any information relating to an identified or identifiable **living** individual, such as a name, address, pupil number, photograph, IP address or location history. [[Special category data]] needs extra protection: racial or ethnic origin, political opinions, religious or philosophical beliefs, trade union membership, genetic data, biometric data used for identification, health data, and data about a person's sex life or sexual orientation. Criminal offence data has its own separate safeguards."},{"t":"h","text":"The seven principles"},{"t":"table","head":["Principle","What it means in practice"],"rows":[["Lawfulness, fairness and transparency","Have a lawful basis; do not mislead; tell people clearly how their data is used (a privacy notice)"],["Purpose limitation","Collect for specified, explicit purposes; do not reuse for incompatible purposes"],["[[Data minimisation]]","Collect only what is adequate, relevant and necessary"],["Accuracy","Keep data accurate and up to date; correct or erase errors promptly"],["Storage limitation","Keep identifiable data no longer than necessary; have a retention schedule"],["Integrity and confidentiality (security)","Protect against unauthorised access, loss or damage with appropriate technical and organisational measures"],["Accountability","The controller is responsible for, and must be able to demonstrate, compliance – records, policies, impact assessments"]],"caption":"The data protection principles"},{"t":"h","text":"Lawful bases for processing"},{"t":"p","text":"Every processing activity needs a [[lawful basis]]: **consent**; **contract** (needed to deliver a contract with the person); **legal obligation**; **vital interests** (protecting someone's life); **public task**; **legitimate interests** (balanced against the person's rights); and, since the DUAA, **recognised legitimate interests** – a short list set out in the law, such as safeguarding vulnerable people, preventing or detecting crime, responding to emergencies and national security, for which no balancing test is needed. Special category data also needs an additional condition, such as explicit consent."},{"t":"h","text":"The roles"},{"t":"table","head":["Role","Who"],"rows":[["[[Data subject]]","The living individual the data is about"],["[[Data controller]]","The organisation that decides why and how personal data is processed – it carries the main legal responsibility"],["[[Data processor]]","An organisation that processes data on the controller's behalf under a written contract, e.g. a cloud or payroll provider"],["Data protection officer (DPO)","Advises on and monitors compliance; required for public authorities (including schools) and some large-scale processors"],["[[Information Commission]]","The independent regulator: gives guidance, investigates complaints and enforces the law"]]},{"t":"key","title":"Key points","items":["Personal data = information about an identifiable living person; special category data needs extra protection.","Seven principles: lawfulness/fairness/transparency, purpose limitation, data minimisation, accuracy, storage limitation, integrity and confidentiality, accountability.","Roles: data subject, controller, processor, DPO, and the Information Commission as regulator."]},{"t":"tip","text":"Quote principles accurately. Invented 'principles' such as 'data must not be kept for more than six months' or 'data must be kept secure for five years' earn nothing."},{"t":"warn","text":"The old Data Protection Act 1998 and its eight principles are repealed. Do not mix them up with the current seven principles."}],"diagram":{"kind":"match","title":"Which principle has been broken?","caption":"Match each situation to the data protection principle it breaches.","pairs":[["Purpose limitation","A gym uses members' emergency contact numbers to send sales texts"],["Data minimisation","A school trip form asks for parents' salaries"],["Accuracy","A council keeps sending bills to a resident's old address after being told of the move"],["Storage limitation","A recruiter keeps every unsuccessful applicant's CV indefinitely"],["Integrity and confidentiality","An unencrypted laptop with patient records is left on a train"],["Lawfulness, fairness and transparency","An app secretly collects location data without telling users"]]},"check":[{"q":"Which of these is special category data?","o":["A pupil's home address","A staff member's trade union membership","A customer's email address","An employee's salary"],"a":1,"why":"Trade union membership is listed as special category data."},{"q":"A school uses a cloud provider to host its pupil records. The cloud provider is the…","o":["data controller","data subject","data processor","Information Commission"],"a":2,"why":"It processes data on the school's behalf."},{"q":"Who regulates data protection in Northern Ireland?","o":["The Information Commission","The PSNI","Ofcom","The Department of Education"],"a":0,"why":"The Information Commission regulates across the whole UK; it replaced the ICO on 30 September 2026."},{"q":"Collecting only the data you actually need is the principle of…","o":["accuracy","purpose limitation","data minimisation","accountability"],"a":2,"why":"Adequate, relevant and limited to what is necessary."}],"exam":[],"practice":[{"q":"State four of the seven data protection principles.","m":4,"a":"Any four (1 each): lawfulness, fairness and transparency; purpose limitation; data minimisation; accuracy; storage limitation; integrity and confidentiality (security); accountability."},{"q":"Explain the difference between a data controller and a data processor.","m":2,"a":"A controller decides the purposes and means of processing personal data and is responsible for compliance (1); a processor processes the data on the controller's behalf and following its instructions, e.g. a cloud host (1)."}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Data Protection Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1891"}],"terms":["Information Commission","Personal data","Special category data","Data minimisation","Lawful basis","Data subject","Data controller","Data processor"]},{"id":"c06-p02","spec":"Describe the principles, rights and roles in the Data Protection Act 2018 and UK GDPR","lessons":["IS17"],"summary":"Data subjects have rights to be informed, of access, rectification, erasure, restriction, portability, objection and safeguards over automated decisions; the Information Commission enforces the law with fines of up to £17.5 million or 4% of global turnover.","blocks":[{"t":"h","text":"Rights of the data subject"},{"t":"table","head":["Right","What it allows"],"rows":[["Right to be informed","To be told who is processing your data, why, on what lawful basis and for how long (privacy notice)"],["Right of access","To obtain a copy of your personal data through a [[subject access request (SAR)|Subject access request (SAR)]]"],["Right to rectification","To have inaccurate data corrected or incomplete data completed"],["Right to erasure ('right to be forgotten')","To have data deleted in certain cases, e.g. consent withdrawn or no longer needed"],["Right to restrict processing","To limit use of the data while, for example, its accuracy is checked"],["Right to data portability","To receive data you supplied in a machine-readable format and move it to another provider"],["Right to object","To object to processing based on legitimate interests or public task, and absolutely to direct marketing"],["Rights about automated decision-making","To safeguards when significant decisions are made solely by automated means: information, the chance to make representations, human intervention and the right to contest"]],"caption":"Data subject rights"},{"t":"h","text":"Subject access requests"},{"t":"p","text":"A SAR is normally free and must be answered **without undue delay and within one month**, extendable by up to two further months for complex requests. Following the DUAA, the time limit starts once the organisation has any identity confirmation it reasonably needs, and organisations are expected to make **reasonable and proportionate searches** for the data rather than every conceivable search."},{"t":"h","text":"What changed with the Data (Use and Access) Act 2025"},{"t":"list","items":["A new lawful basis of **recognised legitimate interests** (e.g. crime prevention, safeguarding, emergencies).","Wider permission for **solely automated decisions**, balanced by mandatory safeguards; tighter rules remain for special category data.","Clarified rules on SAR searches and on using data for scientific research.","Some cookies (e.g. for website statistics or remembering preferences) no longer need consent, and fines for breaches of the Privacy and Electronic Communications Regulations (PECR) rose to the UK GDPR level.","From 19 June 2026, organisations must have a process for handling **data protection complaints** themselves before people escalate to the regulator.","From 30 September 2026 the Information Commissioner's Office became the **Information Commission**, a body corporate run by a board rather than a single commissioner."],"ordered":false},{"t":"h","text":"Enforcement"},{"t":"p","text":"The [[Information Commission]] can carry out audits, issue information notices, assessment notices, reprimands and enforcement notices (ordering an organisation to stop or change processing), and impose fines of up to **£17.5 million or 4% of annual worldwide turnover**, whichever is higher. Organisations must report a personal data breach likely to risk people's rights to the regulator within **72 hours** of becoming aware of it, and tell the affected people without undue delay if the risk is high."},{"t":"key","title":"Key points","items":["Rights: informed, access, rectification, erasure, restriction, portability, object, automated decision safeguards.","SAR: free, one month (extendable by two), reasonable and proportionate search.","Regulator: Information Commission (from 30 September 2026); fines up to £17.5m or 4% of turnover; breaches reported within 72 hours."]},{"t":"tip","text":"When asked to 'describe a right', say what the data subject can **do** and give an example in context: 'a former customer can ask the gym to erase their data once their membership has ended'."},{"t":"note","text":"The DUAA changes are recent and some guidance is still being finalised. Examiners will credit correct points about the long-established principles, rights and roles; the DUAA details here are for accuracy and stretch."}],"diagram":{"kind":"timeline","title":"How UK data protection law got here","caption":"Click each milestone to see what changed.","items":[{"label":"1998","detail":"Data Protection Act 1998 – eight principles (now repealed)."},{"label":"25 May 2018","detail":"GDPR applies across the EU; the Data Protection Act 2018 replaces the 1998 Act."},{"label":"1 Jan 2021","detail":"After Brexit the EU GDPR is retained in UK law as the UK GDPR, alongside the DPA 2018."},{"label":"19 June 2025","detail":"Data (Use and Access) Act 2025 receives Royal Assent; its provisions are commenced in stages."},{"label":"5 Feb 2026","detail":"Main DUAA data protection changes commence: recognised legitimate interests, automated decision-making, SAR clarifications, cookie exemptions, higher PECR fines."},{"label":"19 June 2026","detail":"Organisations must have a process to handle data protection complaints."},{"label":"30 Sept 2026","detail":"The Information Commissioner's Office is replaced by the Information Commission, governed by a board."}]},"check":[{"q":"Within what time limit must a subject access request normally be answered?","o":["Five working days","One month","Three months","Twenty working days"],"a":1,"why":"One month, extendable by two months for complex requests. (Twenty working days is the FOI limit.)"},{"q":"A customer asks a shop to move her purchase history to a rival's app in a machine-readable file. Which right is this?","o":["Rectification","Data portability","Restriction","Objection"],"a":1,"why":"Portability lets her reuse her data elsewhere."},{"q":"What is the maximum fine under the UK GDPR?","o":["£500 000","£1 million","£17.5 million or 4% of worldwide turnover, whichever is higher","Unlimited"],"a":2,"why":"The higher maximum applies to the most serious breaches."}],"exam":[],"practice":[{"q":"Describe two rights of a data subject.","m":4,"a":"Right of access (1) – to request a copy of the personal data an organisation holds about them via a SAR (1). Right to erasure (1) – to have their data deleted when, for example, it is no longer needed or consent is withdrawn (1). Credit any two rights accurately described."},{"q":"A sixth-form pupil believes her school holds incorrect information about her. Explain how data protection law helps her.","m":3,"a":"She can make a subject access request to see what data is held (1), which the school must answer within one month (1); she can then use the right to rectification to have inaccurate data corrected (1). (Also credit: complain to the school, then the Information Commission.)"}],"videos":[{"title":"Legislation: data protection, computer misuse, copyright, FOI and RIPA – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS17-video"},{"title":"OCR A Level SLR16 – Data Protection Act","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1891"}],"terms":["Subject access request (SAR)","Information Commission"]},{"id":"c06-p03","spec":"Describe the offences under the Computer Misuse Act 1990","lessons":["IS17"],"summary":"The Computer Misuse Act 1990 makes it an offence to access computer material without authorisation, to do so intending further crime, to impair a computer's operation, to cause serious damage, or to make or supply tools for these offences.","blocks":[{"t":"p","text":"The **Computer Misuse Act 1990** (CMA) applies throughout the UK, including Northern Ireland. It was passed because existing laws on theft and criminal damage did not fit 'hacking'. The key idea is **authorisation**: an offence is committed when someone knowingly does something to a computer that they are not entitled to do."},{"t":"table","head":["Section","Offence","Example","Maximum penalty (indictment)"],"rows":[["s1","[[Unauthorised access]] to computer material","Using a friend's password to read their files; guessing an admin password 'just to look'","2 years"],["s2","Unauthorised access with intent to commit or facilitate further offences","Logging into a bank system intending to transfer money; accessing records to blackmail someone","5 years"],["s3","Unauthorised acts with intent to impair, or reckless as to impairing, the operation of a computer","Spreading malware or ransomware; launching a DoS attack; deleting or altering files","10 years"],["s3ZA","Unauthorised acts causing, or creating a significant risk of, serious damage","Attacking a hospital, power grid or water system","14 years; life if serious damage to human welfare or national security"],["s3A","Making, supplying or obtaining articles for use in a CMA offence","Selling malware kits, writing a DDoS tool for others, buying stolen credentials","2 years"]],"caption":"Offences under the Computer Misuse Act 1990"},{"t":"example","title":"Worked example: applying the Act","steps":["A pupil watches a teacher type her password, later logs in as her and views the markbook: **s1** – he knew he was not authorised.","He then changes his own coursework mark to gain a better grade: altering data impairs the reliability of the data, so **s3** applies (and arguably s2 if done to commit further offences such as fraud).","He posts the password on a group chat so friends can do the same: supplying an article for use in an offence – **s3A**.","Each offence is separate; the more serious sections carry higher penalties."],"context":"A school network incident."},{"t":"p","text":"The CMA is often criticised for having no defence for ethical security researchers who test systems in good faith; the government announced in 2026 that it intends to reform cybercrime law, but at the time of writing no change has been made."},{"t":"key","title":"Key points","items":["s1 unauthorised access; s2 with intent to commit further offences; s3 impairing operation (malware, DoS, deleting data); s3ZA serious damage; s3A making or supplying tools.","The test is whether the person knew they were not authorised.","Penalties rise with seriousness – up to life under s3ZA."]},{"t":"tip","text":"In scenario questions, identify each act separately and name the section that fits: viewing, then altering, then distributing are three different offences."},{"t":"warn","text":"Using a computer you are allowed to use for a purpose you are not allowed (e.g. a police officer searching a database for personal reasons) can still be unauthorised access. Authorisation covers what you may access, not just whether you can log in."}],"diagram":{"kind":"flow","title":"Which CMA offence?","caption":"Step through the questions to classify an act under the Computer Misuse Act.","direction":"tb","nodes":[{"id":"a","label":"Act involving a computer","detail":"Start with what the person actually did.","shape":"start"},{"id":"b","label":"Made, supplied or obtained a hacking tool?","detail":"E.g. selling malware or credentials.","shape":"decision"},{"id":"c","label":"Accessed material without authorisation?","detail":"Did they know they were not entitled to access it?","shape":"decision"},{"id":"d","label":"Impaired operation or data?","detail":"Malware, DoS, deleting or altering data.","shape":"decision"},{"id":"e","label":"Intended further offence?","detail":"E.g. fraud, theft or blackmail.","shape":"decision"},{"id":"f","label":"s3A","detail":"Making, supplying or obtaining articles – up to 2 years.","shape":"end"},{"id":"g","label":"s3 (or s3ZA if serious damage)","detail":"Up to 10 years; s3ZA up to 14 years or life.","shape":"end"},{"id":"h","label":"s2","detail":"Access with intent – up to 5 years.","shape":"end"},{"id":"i","label":"s1","detail":"Unauthorised access – up to 2 years.","shape":"end"},{"id":"j","label":"No CMA offence","detail":"Other laws may still apply.","shape":"end"}],"edges":[["a","b"],["b","f","yes"],["b","d","no"],["d","g","yes"],["d","c","no"],["c","e","yes"],["c","j","no"],["e","h","yes"],["e","i","no"]]},"check":[{"q":"Launching a denial-of-service attack against a council website is an offence under…","o":["s1","s
