<meta charset="utf-8">
<title>A2 1 Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: an e-reader. Sticky slim top bar, outline rail on the left, ONE A4 sheet at a time on a quiet desk. */
:root{
  --desk:#E2E6EC; --paper:#FFFFFF; --paper-2:#F4F6F9; --ink:#1B2230; --ink-2:#465063; --ink-3:#687386;
  --line:#D3D9E2; --line-2:#E7EBF0; --bar:#FBFCFD;
  --accent:#2445B4; --accent-ink:#FFFFFF; --accent-soft:#E5EAFA;
  --mark:#FFE27A; --mark-ink:#1B2230;
  --good:#18744A; --good-soft:#E0F2E8; --bad:#B3261E; --bad-soft:#FBE6E4;
  --warn:#8E5300; --warn-soft:#FFF0D6; --note:#5A49B5; --note-soft:#EEEBFB;
  --c1:#2F5FD0; --c2:#0E8079; --c3:#B87200; --c4:#C2416B; --c5:#6E54C9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 28px rgba(20,30,50,.10);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
  --barh:52px; --railw:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; }

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{height:var(--barh);display:flex;align-items:center;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ib{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--paper-2);color:var(--ink)}
.ib[disabled]{opacity:.35;cursor:default;background:transparent}
.ib svg{width:20px;height:20px}
.ib[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.bt{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.bt b{font-family:var(--serif);font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;gap:2px;flex:none}
.pn{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);min-width:58px;text-align:center;white-space:nowrap}
.pn b{color:var(--ink);font-weight:700}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--good);transition:width .3s;max-width:100%}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);align-items:start}
body.rail-off .shell{grid-template-columns:minmax(0,1fr)}
body.rail-off .rail{display:none}
.rail{position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--barh) - env(safe-area-inset-top,0px));overflow:auto;background:var(--paper-2);border-right:1px solid var(--line);padding:18px 14px 28px max(14px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.r-head{padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.r-qual{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.r-title{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25;margin:4px 0 12px;text-wrap:balance}
.meter{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.r-prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.r-ch{margin:12px 0 4px}
.r-ch h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 4px;font-weight:700;display:flex;gap:6px}
.r-ch h2 span{color:var(--ink);letter-spacing:0;text-transform:none;font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3}
.r-pg{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13.5px;line-height:1.35}
.r-pg:hover{background:var(--line-2);color:var(--ink)}
.r-pg[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.tk{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tk svg{width:10px;height:10px;opacity:0}
.r-pg.done .tk{background:var(--good);border-color:var(--good);color:var(--paper)}
.r-pg.done .tk svg{opacity:1}
.r-pg[aria-current="page"] .tk{border-color:var(--accent)}
.r-foot{margin-top:18px;padding:12px 6px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:70}

main{min-width:0;padding-block:32px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

@media (max-width:999px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:80;top:0;left:0;bottom:0;height:auto;width:min(340px,88vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.rail-open .rail{transform:none}
  body.rail-off .rail{display:block}
}

/* ---------- the sheet ---------- */
.sheet{max-width:820px;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;aspect-ratio:210/297;padding:48px 64px 40px;display:flex;flex-direction:column;font-family:var(--serif);font-size:16.5px;line-height:1.68;overflow-wrap:break-word}
.sheet > *{min-width:0}
.strip{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;border-bottom:2px solid var(--ink);font-weight:700}
.strip span:last-child{letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chintro{margin:18px 0 0;padding:14px 16px;background:var(--paper-2);border-radius:6px;font-size:15px;color:var(--ink-2)}
.chintro b{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sheet h1{font-size:30px;line-height:1.2;font-weight:700;margin:22px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.sheet h1:focus{outline:none}
.sheet h1 .cont{font-weight:400;color:var(--ink-3);font-size:.7em}
.lede{font-size:18px;line-height:1.5;color:var(--ink-2);margin:0 0 20px;font-style:italic}
.notes{display:flex;flex-direction:column;gap:14px}
.notes p{margin:0}
.notes h2{font-size:20px;margin:12px 0 -4px;line-height:1.3;text-wrap:balance}
.notes ul,.notes ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.notes code,.sheet code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);border:1px solid var(--line-2);padding:.05em .35em;border-radius:4px}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:help;text-align:inherit}
.term:hover{background:var(--accent-soft)}
.boxed{border-radius:8px;padding:14px 18px;background:var(--paper-2);border:1px solid var(--line)}
.boxed > b{display:block;font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.key{border:1.5px solid var(--ink);background:var(--paper)}
.key ul{gap:6px}
.call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border-radius:8px;padding:12px 16px;font-size:15.5px}
.call b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.call.tip{background:var(--accent-soft)}.call.tip b{color:var(--accent)}
.call.warn{background:var(--warn-soft)}.call.warn b{color:var(--warn)}
.call.note{background:var(--note-soft)}.call.note b{color:var(--note)}
@media (max-width:520px){.call{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tw table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.tw th,.tw td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.tw thead th{background:var(--paper-2);font-size:13px;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:700}
.tw.plain td:first-child{font-weight:400}
.tw caption{caption-side:bottom;text-align:left;font-size:13px;color:var(--ink-3);padding:8px 12px;font-style:italic}
figure{margin:0}

.ex{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex-h{padding:10px 16px;background:var(--paper-2);font-family:var(--sans);font-weight:700;border-bottom:1px solid var(--line)}
.ex-b{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.ex-ctx{color:var(--ink-2)}
.ex ol{counter-reset:st;list-style:none;padding:0}
.ex ol li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;animation:rise .25s ease}
.ex ol li::before{content:counter(st);font-family:var(--sans);font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:3px}
.ex-ans{border-top:1px dashed var(--line);padding-top:10px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;line-height:1.3;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
@keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.code{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;max-width:100%;background:var(--paper-2)}
.mcq fieldset{min-width:0;max-width:100%}.mcq legend{max-width:100%;overflow-wrap:anywhere;white-space:normal}
.code-h{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;font-family:var(--sans);font-size:13px;border-bottom:1px solid var(--line)}
.code-h span:last-child{color:var(--ink-3);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;tab-size:4}
.code pre code{background:none;border:0;padding:0;font-size:inherit;display:block;min-width:max-content}
.ln{display:block;padding:0 16px}
.numbered .ln{padding-left:0}
.numbered .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--ink-3);opacity:.7;user-select:none}
.h-k{color:var(--c5);font-weight:600}.h-s{color:var(--c2)}.h-c{color:var(--ink-3);font-style:italic}.h-n{color:var(--c3)}.h-f{color:var(--c1)}.h-t{color:var(--c4)}.h-o{color:var(--c4)}.h-r{color:var(--c1);font-weight:600}.h-a{color:var(--c3)}
.out{border-top:1px solid var(--line);background:var(--paper)}
.out b{display:block;padding:6px 16px 0;font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.out pre{padding:4px 16px 12px}

/* ---------- sections ---------- */
.sec{margin-top:34px}
.sec > h2{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--ink);padding-top:10px}
.sec > h2 small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:400;margin-left:auto}
.mcq{display:flex;flex-direction:column;gap:20px;font-family:var(--sans);font-size:15px}
.mcq fieldset{border:0;margin:0;padding:0;min-width:0}
.mcq legend{font-weight:700;margin-bottom:8px;padding:0;display:flex;gap:8px}
.mcq legend span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;line-height:1.4}
.opt i{font-style:normal;font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right i{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong i{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.why{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--paper-2);font-size:14.5px}
.why b.ok{color:var(--good)}.why b.no{color:var(--bad)}
.exq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-family:var(--sans)}
.exq li{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.exq .meta{font-size:12.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.exq .meta b{color:var(--ink)}
.exq .sum{font-family:var(--serif);font-size:16px}
.exq .tipbox{background:var(--accent-soft);border-radius:6px;padding:9px 12px;font-size:14.5px}
.lk{font-family:var(--sans);font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700}
.lk:hover{text-decoration:underline}
.lk svg{width:13px;height:13px}
.prac{display:flex;flex-direction:column;gap:14px}
.pq{border-left:3px solid var(--ink);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px}
.pq-q{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.pq-q span{flex:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pq-a{background:var(--good-soft);border-radius:6px;padding:10px 14px;font-size:15px}
.pq-a ul{margin:0;padding-left:1.2em}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vid{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);font-family:var(--sans);background:var(--paper)}
.vid:hover{border-color:var(--accent)}
.vid .src{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.vid .src .s-hub{color:var(--accent)}.vid .src .s-bbc{color:var(--c4)}.vid .src .s-yt{color:var(--bad)}.vid .src .s-cc{color:var(--c2)}
.vid .t{font-weight:700;line-height:1.35;font-size:14.5px}
.vid .go{margin-top:auto;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:4px}
.vid .go svg{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:5px 12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:auto;padding-top:40px}
.done-row{display:flex;justify-content:center;margin:12px 0 22px}
.donebtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;border:1.5px solid var(--good);color:var(--good);background:var(--paper);border-radius:999px;padding:9px 18px}
.donebtn svg{width:16px;height:16px}
.donebtn[aria-pressed="true"]{background:var(--good);color:var(--paper)}
.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--sans)}
.np{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--ink);min-width:0}
.np:hover{border-color:var(--accent)}
.np small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.np span{font-size:14px;line-height:1.35}
.np.nx{text-align:right;grid-column:2}
.folio{text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
@media (max-width:520px){.nextprev{grid-template-columns:minmax(0,1fr)}.np.nx{grid-column:1}}

@media (max-width:699px){
  main{padding:0}
  .sheet{aspect-ratio:auto;border-radius:0;box-shadow:none;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:16px;min-height:calc(100vh - var(--barh))}
  .sheet h1{font-size:25px}
  .lede{font-size:16.5px}
  .bt span{display:none}
}
@media (max-width:420px){ .pn{min-width:44px;font-size:12px} .sep{display:none} .bar-in{gap:2px} .ib{width:34px} }

/* ---------- drawers & popover ---------- */
.drawer{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-family:var(--serif);font-size:19px;flex:1}
.dr-s{padding:12px 18px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper-2);font-size:15px}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.dr-b{flex:1;overflow:auto;padding:8px 18px 28px;overscroll-behavior:contain}
.az{display:flex;flex-wrap:wrap;gap:2px}
.az button{border:0;background:none;width:24px;height:26px;border-radius:5px;font-size:13px;font-weight:700;color:var(--accent);padding:0}
.az button[disabled]{color:var(--line);cursor:default}
.az button:hover:not([disabled]){background:var(--accent-soft)}
.gl-l{font-family:var(--serif);font-size:22px;font-weight:700;margin:16px 0 4px;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.gl-e{padding:10px 0;border-bottom:1px solid var(--line-2)}
.gl-e dt{font-weight:700;font-size:15.5px}
.gl-e dd{margin:2px 0 0;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink-2)}
.gl-e .alt{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:4px}
.gl-e a{font-size:13px;font-weight:700;text-decoration:none}
.res{list-style:none;margin:0;padding:0}
.res a{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink);border-radius:6px}
.res a:hover{background:var(--paper-2)}
.res small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.res b{font-size:15px;line-height:1.35}
.res span{font-family:var(--serif);font-size:14px;color:var(--ink-2);line-height:1.5}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.pop{position:fixed;z-index:100;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;font-family:var(--sans);display:flex;flex-direction:column;gap:6px}
.pop h3{margin:0;font-family:var(--serif);font-size:17px;padding-right:28px}
.pop p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.55}
.pop .alt{font-size:13px;color:var(--ink-3)}
.pop .x{position:absolute;top:6px;right:6px;width:30px;height:30px}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.empty{padding:60px 20px;text-align:center;font-family:var(--sans);color:var(--ink-2)}

/* ---------- diagrams ---------- */
.dg{margin-top:30px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--sans);font-size:14.5px;line-height:1.45;overflow:hidden}
.dg-head{padding:12px 16px 10px;border-bottom:1px solid var(--line-2);background:var(--paper-2)}
.dg-kicker{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.dg-head h3{margin:2px 0 0;font-family:var(--serif);font-size:18px;line-height:1.3;text-wrap:balance}
.dg-stage{padding:16px;container-type:inline-size;display:flex;flex-direction:column;gap:12px;min-width:0}
.dg-scroll{overflow-x:auto;min-width:0}
.dg-scroll svg{margin:0 auto;height:auto}
.dg-detail{margin:0 16px 14px;padding:10px 14px;border-radius:8px;background:var(--paper-2);min-height:3.2em;font-size:14.5px}
.dg-detail strong{display:block;font-size:13px;letter-spacing:.03em;color:var(--accent)}
.dg-detail:empty{display:none}
.dg figcaption{padding:10px 16px 12px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-3);font-style:italic}
.dg-err{color:var(--bad)}
.dg .btn{font-size:13.5px;padding:5px 11px}
.stat{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
/* svg parts */
.sv-btn{cursor:pointer;outline:none}
.sv-btn .shp{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.5;transition:fill .15s,stroke .15s}
.sv-btn text{fill:var(--ink);font-family:var(--sans);font-size:13px}
.sv-btn:hover .shp{stroke:var(--accent)}
.sv-btn:focus-visible .shp{stroke:var(--accent);stroke-width:3}
.sv-btn.on .shp{fill:var(--accent);stroke:var(--accent)}
.sv-btn.on text{fill:var(--accent-ink);font-weight:700}
.sv-btn.seen .shp{fill:var(--accent-soft);stroke:var(--accent)}
.sv-line{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.sv-line.on{stroke:var(--accent);stroke-width:2.5}
.sv-track{stroke:var(--line);stroke-width:10;fill:none}
.sv-chev{stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-mk{fill:var(--ink-3)}.sv-mk.on{fill:var(--accent)}
.sv-lbl{pointer-events:none}
.sv-lbl rect{fill:var(--paper);opacity:.92}
.sv-lbl text{fill:var(--ink-2);font-size:12px;font-family:var(--sans)}
.sv-center{fill:var(--ink-2);font-size:13px;font-family:var(--sans)}
.sv-center.big{fill:var(--ink);font-family:var(--serif);font-size:17px;font-weight:700}
.sv-ax{stroke:var(--line);stroke-width:1}
.sv-ax-t{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
/* hotspot */
.hs{position:relative;display:flex;flex-direction:column;gap:26px}
.hs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hs-row{display:flex;gap:12px;position:relative}
.hs-part{flex:1 1 0;min-width:0;border:1.5px solid var(--ink-3);background:var(--paper);border-radius:8px;padding:12px 8px;font-weight:700;font-size:14px;line-height:1.3;min-height:54px;position:relative;z-index:1}
.hs-part:hover{border-color:var(--accent)}
.hs-part.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hs-part.near{background:var(--accent-soft);border-color:var(--accent)}
/* layers */
.lay{display:flex;flex-direction:column;gap:4px}
.lay button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1.5px solid transparent;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--ink)}
.lay button span{font-weight:400;font-size:12px;color:var(--ink-3);white-space:nowrap}
.lay button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* compare */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmp{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cmp-art{flex:0 1 240px;min-width:0;max-width:100%}
.cmp-art svg{width:100%;height:auto}
.cmp ul{flex:1 1 240px;min-width:0;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.art-l{stroke:var(--accent);stroke-width:2.2;fill:none}
.art-n{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.art-t{fill:var(--ink-2);font-size:10px;font-family:var(--sans)}
.art-hub{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.art-term{fill:var(--ink-2)}
/* bits */
.bits{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 8px}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 46px;min-width:30px}
.bit small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.bit button{width:100%;aspect-ratio:3/4;max-height:58px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink-3);padding:0}
.bit button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bit.nib{margin-left:8px}
.bpt{align-self:flex-end;font-size:26px;line-height:1;font-weight:700;color:var(--c4);margin:0 -1px 10px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rd{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.rd.cur{border-color:var(--accent);background:var(--accent-soft)}
.rd small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.rd b{font-family:var(--mono);font-size:19px;font-weight:600}
.rd div{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
/* pixels */
.px-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.px-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:min(100%,320px);touch-action:none;user-select:none}
.px-grid button{border:0;padding:0;aspect-ratio:1;min-width:0;border-radius:0}
.px-grid button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:1}
.px-side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);padding:0}
.pal.dense button{width:15px;height:15px;border-radius:2px}
.pal button[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.rowcodes{font-family:var(--mono);font-size:12.5px;line-height:1.35;color:var(--ink-2);white-space:pre;overflow-x:auto}
/* wave */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink-2)}
.ctl label b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.chk input{accent-color:var(--accent)}
.wv-orig{stroke:var(--c1);stroke-width:2;fill:none;opacity:.55}
.wv-step{stroke:var(--c4);stroke-width:2.2;fill:none}
.wv-dot{fill:var(--c4)}
.wv-stem{stroke:var(--c4);stroke-width:1;opacity:.45}
.wv-lvl{stroke:var(--line-2);stroke-width:1}
.calcbox{font-size:14px;background:var(--paper-2);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
/* sort */
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:6px}
.barc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.barc .b{width:100%;max-width:48px;border-radius:4px 4px 0 0;background:var(--c1);opacity:.35;transition:height .25s,background .2s,opacity .2s;display:flex;align-items:flex-end;justify-content:center;min-height:20px}
.barc .b span{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);padding-bottom:2px}
.barc.cmp .b{background:var(--c3);opacity:1}
.barc.swap .b{background:var(--c4);opacity:1}
.barc.sorted .b{background:var(--c2);opacity:.9}
.barc.found .b{background:var(--good);opacity:1}
.barc.out .b{opacity:.12}
.barc.range .b{opacity:.6}
.barc .ix{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.barc .ptr{font-size:10.5px;font-weight:700;color:var(--accent);height:14px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* calc */
.cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cin label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink-2)}
.cin input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--paper-2);font-variant-numeric:tabular-nums;width:100%;min-width:0}
.cres{border:1.5px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cres small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.cres b{font-size:22px;font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}
.ctab td,.ctab th{font-variant-numeric:tabular-nums}
.ctab td:first-child{font-weight:700}
/* match */
.mt{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px 12px}
.mt-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mt button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.mt button.term-b{font-weight:700}
.mt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mt button.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.mt button.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.mt button i{font-style:normal;flex:none;font-size:11px;font-weight:700;background:var(--good);color:var(--paper);border-radius:10px;padding:1px 6px;margin-top:1px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:var(--line);border-radius:2px}
.tl li{flex:1 1 0;min-width:0;position:relative}
.tl button{width:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;text-align:center;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink-2)}
.tl button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ink-3);margin-top:3px;box-sizing:border-box}
.tl button.seen::before{border-color:var(--accent)}
.tl button.on{color:var(--accent)}
.tl button.on::before{background:var(--accent);border-color:var(--accent);width:22px;height:22px;margin-top:0}
@container (max-width:520px){
  .tl{flex-direction:column;gap:2px}
  .tl::before{left:9px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .tl button{flex-direction:row;align-items:center;text-align:left;padding:6px 0;gap:12px}
  .tl button::before{flex:none;margin:0 0 0 1px}
  .tl button.on::before{margin-left:-2px}
}
/* gantt */
.gt .gt-bar{fill:color-mix(in srgb,var(--c1) 30%,var(--paper));stroke:var(--c1);stroke-width:1.5}
.gt.crit .gt-bar{fill:var(--c4);stroke:var(--c4)}
.gt.sel .gt-bar{stroke:var(--ink);stroke-width:2.5}
.gt:focus-visible .gt-bar{stroke:var(--accent);stroke-width:3}
.gt-in{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--sans);pointer-events:none}
.gt.crit .gt-in{fill:var(--paper)}
.gt-out{fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--sans)}
.gt-float{fill:none;stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1.2}
.gt-lab{fill:var(--ink)!important;font-size:12.5px!important}
/* dfd */
.sv-btn .shp.ent{fill:var(--paper-2)}
.sv-btn.on .shp.ent{fill:var(--accent)}
.dfd-rule{stroke:var(--ink-3);stroke-width:1.2}
.sv-btn.on .dfd-rule{stroke:var(--accent-ink)}
.dfd-id{fill:var(--ink-2);font-size:11.5px;font-weight:700;font-family:var(--sans)}
.sv-btn.on .dfd-id{fill:var(--accent-ink)}
/* ---------- hub links: learn panel, chapter card, library menu ---------- */
.learn{margin:0 0 24px;border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;font-family:var(--sans);display:flex;flex-direction:column;gap:8px}
.learn-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;line-height:1.35}
.learn-h b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.learn-h span{color:var(--ink-2);min-width:0}
.learn-h span em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700;margin-right:4px}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl a{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:4px 11px 4px 10px;line-height:1.3}
.hl a:hover{border-color:var(--accent);color:var(--accent)}
.hl a svg{width:12px;height:12px;color:var(--ink-3)}
.hl a:hover svg{color:var(--accent)}
.learn details{font-size:13px;border-top:1px solid var(--line-2);padding-top:8px}
.learn summary{cursor:pointer;color:var(--ink-2);font-weight:700}
.learn details[open] summary{margin-bottom:8px}
.more-l{display:flex;flex-direction:column;gap:10px}
.chcard{margin:18px 0 0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;font-family:var(--sans)}
.chcard-h{padding:12px 16px 10px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.chcard-h small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.chcard-h p{margin:4px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink-2)}
.chcard-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line-2)}
.cl{background:var(--paper);padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cl > b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cl a.lk{font-size:14px;line-height:1.35;align-items:flex-start}
.cl a.lk svg{margin-top:3px;flex:none}
.cl .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cl .fname{font-family:var(--mono);font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.libwrap{position:relative;flex:none}
.libmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:95;width:min(320px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;font-family:var(--sans)}
.libmenu > b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.libmenu a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.libmenu a:hover{background:var(--paper-2)}
.libmenu a small{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.libmenu a span{font-size:14px;font-weight:700;line-height:1.3}
.libmenu a[aria-current="page"]{background:var(--accent-soft)}
.libmenu a[aria-current="page"] small::after{content:" · open now";color:var(--accent)}

<script>
const BOOK = {"book":{"id":"A21","title":"A2 1: Information Systems","qual":"CCEA GCE Digital Technology","hub":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP","edition":"2026–27","lessonNames":{"IS01":"Data management: flat files, relational databases and the DBMS","IS02":"Entity-relationship modelling","IS03":"Normalisation to third normal form","IS04":"Data integrity: data dictionary, integrity rules, validation and indexing","IS05":"SQL data definition and data manipulation","IS06":"SQL queries: SELECT, aggregates, grouping and joins","IS07":"Multi-user databases: transactions, ACID, locking and distributed databases","IS08":"Big data, data warehousing, data mining and analytics","IS09":"Network types, topologies and hardware","IS10":"Layered network models and protocols","IS11":"IP addressing, switching and routing","IS12":"Data transmission and error control","IS13":"Network security: threats, firewalls, encryption and authentication","IS14":"Cloud computing and virtualisation","IS15":"Types of information system","IS16":"Artificial intelligence, machine learning and emerging technologies","IS17":"Legislation: data protection, computer misuse, copyright, FOI and RIPA","IS18":"Ethical, social and environmental issues"}},"chapters":[{"id":"c01","n":1,"title":"Relational database design","intro":"Why organisations store data in relational databases controlled by a DBMS, and how to design them: entities and keys, ER diagrams, normalisation to third normal form and the rules that keep data integral.","pages":[{"id":"c01-p01","spec":"Compare flat-file and relational approaches to storing data","lessons":["IS01"],"summary":"A flat file keeps everything in one table, so data is repeated and copies drift apart; a relational database splits data into linked tables so each fact is stored once.","blocks":[{"t":"p","text":"A [[Flat file]] stores all of its data in a single table (or a single file of records) with no links to any other file. Many early business systems were *file-based*: each department kept its own files, written around its own programs. Sales held customer names and addresses for invoicing; Accounts held the same customers again for credit control."},{"t":"h","text":"What goes wrong with flat files"},{"t":"list","items":["**Repetition** – the same details (a member's address, a product's price) appear in many records and often in several files. This is [[Data redundancy]].","**Disagreeing copies** – when one copy is changed and another is missed, the organisation holds [[inconsistent|Data inconsistency]] data and cannot tell which value is correct.","**Programs tied to files** – each program is written around the exact layout of its file, so adding one field can force the program to be rewritten ([[Program-data dependence]]).","**Weak security** – it is hard to let a user see some fields but not others in the same file.","**Hard to combine data** – a question that needs two separate files (\"which members booked squash *and* owe fees?\") needs a new program."],"ordered":false},{"t":"h","text":"The relational approach"},{"t":"p","text":"A [[Relational database]] splits the data into several tables, each about one [[Entity]] – Member, Booking, Activity. Every table has a [[Primary key]], and tables are linked by [[foreign keys|Foreign key]]. Each fact is stored once, so a change is made in one place. When a combined view is needed, a query joins the tables back together. All the tables are controlled by a [[DBMS|Database management system (DBMS)]] rather than by individual programs."},{"t":"example","title":"Worked example: Erne Leisure Centre","steps":["The flat file has fields BookingID, Date, Activity, MemberName, Address, Phone – about 4000 rows for 600 members, so each member's address is stored on average almost seven times.","A member who moves house needs every one of her booking rows edited. If one row is missed, two different addresses now exist for the same person – an inconsistency.","Relational design: Member(MemberID, Name, Address, Phone) and Booking(BookingID, Date, Activity, MemberID*).","The address now lives in one row of Member. One update corrects it everywhere, because every booking simply points to the member through MemberID."],"answer":"Redundancy removed, inconsistency prevented, and bookings can still be listed with names by joining the two tables."},{"t":"compare","head":["Flat file","Relational database"],"rows":[["Redundancy","High – details repeated in many rows","Minimised – each fact stored once after normalisation"],["Consistency","Copies can disagree","One copy, so updates cannot be partly applied"],["Set-up","Quick and simple; no design skills needed","Needs design (ER model, normalisation) and a DBMS"],["Querying","Limited to one file","SQL joins combine any related tables"],["Security and sharing","Whole-file access; poor multi-user support","Access rights per table or view; record locking"],["Best suited to","Small, single-user lists, e.g. a club mailing list","Organisational systems with shared, changing data"]]},{"t":"key","title":"Key points","items":["Flat file = one table, no relationships; relational = many tables linked by primary and foreign keys.","Flat files cause redundancy, which leads to inconsistency; they also tie programs to file structure.","Relational databases store each fact once and use queries to recombine data.","A flat file is still a sensible choice for a small, simple, single-user list."]},{"t":"tip","text":"In a 'compare' or 'discuss' question, use matching criteria for both approaches (redundancy, consistency, security, querying, cost of set-up) and finish with a judgement in context – a flat file is not always wrong."}],"diagram":{"kind":"compare","title":"One flat file or linked tables?","caption":"Toggle between the two designs for the leisure centre and compare what happens when a member moves house.","states":[{"label":"Flat file","art":null,"points":["Booking(BookingID, Date, Activity, MemberName, Address, Phone)","Address repeated on every booking a member makes","Change of address = edit many rows","One missed row → two addresses for the same member","Cannot record a member who has not booked yet"]},{"label":"Relational","art":null,"points":["Member(MemberID, Name, Address, Phone)","Booking(BookingID, Date, Activity, MemberID*)","Address stored once, in Member","Change of address = edit one row","MemberID links each booking to its member"]}]},"check":[{"q":"What is the main cause of data inconsistency in a flat-file system?","o":["Fields with the wrong data type","The same data stored in several places and not all copies updated","Too few records in the file","Using a primary key"],"a":1,"why":"Inconsistency arises when duplicated (redundant) data is updated in some places but not others."},{"q":"In a relational database, how are two tables linked?","o":["By a foreign key in one table matching the primary key of the other","By storing them in the same file","By giving both tables the same name","By sorting both tables on the same field"],"a":0,"why":"A foreign key holds values of another table's primary key, creating the relationship."},{"q":"For which situation is a flat file most appropriate?","o":["A hospital patient records system","A bank's account system used by hundreds of staff","An online shop with orders, products and customers","A teacher's single list of names for a school trip"],"a":3,"why":"A small, single-user list with no related data gains little from a relational design."}],"exam":[],"practice":[{"q":"A Newry music school keeps one spreadsheet of lessons: LessonDate, Instrument, PupilName, PupilAddress, ParentPhone, TutorName, TutorPhone. Explain two problems this flat-file design could cause.","m":4,"a":"Data redundancy (1): a pupil's address/parent phone is repeated on every lesson row, wasting storage (1) / Data inconsistency (1): if a parent changes phone number and only some rows are updated, two different numbers are held and staff do not know which is correct (1) / Also credit: insertion problem – a new tutor cannot be recorded until they have a lesson (1) with explanation (1). Max 4."},{"q":"Discuss whether the music school should replace its spreadsheet with a relational database.","m":6,"a":"Benefits: each pupil/tutor stored once so less redundancy (1) and no inconsistent copies (1); queries can combine data, e.g. all lessons for one tutor (1); access rights can protect personal data (1). Drawbacks: needs time/skill to design tables and keys (1); cost of DBMS/training (1); for a very small school a spreadsheet may be adequate (1). Conclusion in context, e.g. recommend relational because personal data and growing lesson numbers (1). Max 6, must include a justified conclusion for full marks."}],"videos":[{"title":"Data management: flat files, relational databases and the DBMS – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS01-video"},{"title":"OCR A Level SLR10 – Introduction to database concepts","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-databases-part-1/"}],"terms":["Flat file","Data redundancy","Data inconsistency","Program-data dependence","Relational database","Entity","Primary key","Foreign key","Database management system (DBMS)"]},{"id":"c01-p02","spec":"Describe the functions of a database management system (DBMS)","lessons":["IS01"],"summary":"A DBMS is the software layer between users and the stored data: it defines, stores and retrieves data and enforces security, integrity, concurrency control and recovery centrally.","blocks":[{"t":"p","text":"A [[Database management system (DBMS)]] is software that lets a database be defined, created, queried, updated and controlled. Users and application programs never touch the stored files directly; every request goes through the DBMS. Examples include Microsoft Access, MySQL, PostgreSQL, Oracle and Microsoft SQL Server."},{"t":"h","text":"The main functions"},{"t":"table","head":["Function","What the DBMS does","Example"],"rows":[["Data definition","Creates and changes the structure of tables, fields, types and keys","CREATE TABLE Member (…)"],["Data manipulation","Stores, retrieves, updates and deletes data through a query language, usually [[SQL]]","SELECT, INSERT, UPDATE, DELETE"],["Data dictionary","Maintains [[Metadata]] about every table, field, type, key, rule and user","Member.Phone is VARCHAR(15)"],["Integrity","Enforces validation rules, [[Entity integrity|entity]] and [[referential|Referential integrity]] integrity","Rejects a booking for MemberID M999 that does not exist"],["Security","User accounts, passwords and access rights to tables, views or fields","Reception may read bookings but not payment details"],["Concurrency control","Lets many users work at once without losing updates, using locking and transactions","Two staff cannot overwrite each other's change to one booking"],["Backup and recovery","Logs changes and restores the database to a consistent state after a failure","Rebuilds committed changes after a power cut"],["Data independence","Hides physical storage details from programs through the schema","Moving to a new server does not break the booking app"]]},{"t":"p","text":"Because the rules live *inside* the DBMS rather than inside each program, every application is forced to obey them. A new mobile app cannot skip the validation that the reception desktop applies, because both send their requests to the same DBMS."},{"t":"p","text":"The DBMS also provides **views**: tailored windows on the data that show a user only the rows and fields they need. Views support both security (hide what a user should not see) and simplicity (a user sees a ready-joined table)."},{"t":"note","text":"Some textbooks also list query optimisation (choosing the fastest way to run a query) and report and form generators as DBMS functions. These are valid extra points but are not needed to answer a standard 'describe the functions' question."},{"t":"key","title":"Key points","items":["DBMS = software between users/programs and the data.","Functions: data definition, data manipulation (SQL), data dictionary, integrity, security, concurrency control, backup and recovery.","Rules held centrally in the DBMS apply to every application that uses the data."]},{"t":"tip","text":"When asked for several functions, each must be a *different* function. 'Passwords' and 'access rights' are both security – they earn one mark for function plus one for description, not two separate functions."}],"diagram":{"kind":"hotspot","title":"Everything goes through the DBMS","caption":"Click each part to see its role. Users and programs never read the stored files directly.","rows":[[{"label":"Reception app","detail":"A desktop program used at the front desk. It sends SQL requests to the DBMS and displays the results.","span":1},{"label":"Members' web app","detail":"Members book online. It uses the same DBMS, so the same integrity and security rules apply.","span":1},{"label":"Manager reports","detail":"Ad hoc queries and reports, run through the DBMS's query language.","span":1}],[{"label":"DBMS","detail":"Checks each request against the data dictionary, access rights and integrity rules; manages locking, transactions, logging and recovery; translates requests into reads and writes on storage.","span":3}],[{"label":"Data dictionary","detail":"Metadata: tables, fields, types, keys, validation rules, indexes, users and permissions.","span":1},{"label":"Stored data","detail":"The tables and indexes held on disk.","span":1},{"label":"Transaction log","detail":"A record of changes used to roll back incomplete transactions and recover committed ones after a failure.","span":1}]],"links":[["Reception app","DBMS"],["Members' web app","DBMS"],["Manager reports","DBMS"],["DBMS","Data dictionary"],["DBMS","Stored data"],["DBMS","Transaction log"]]},"check":[{"q":"Which DBMS function prevents two users overwriting each other's changes to the same record?","o":["Data dictionary","Data definition","Concurrency control","Backup"],"a":2,"why":"Concurrency control uses locking and transactions so simultaneous updates do not interfere."},{"q":"Where does the DBMS hold the description of every table, field and validation rule?","o":["The transaction log","The data dictionary","An index","A view"],"a":1,"why":"The data dictionary is the store of metadata."},{"q":"Why is it an advantage that integrity rules are enforced by the DBMS rather than each program?","o":["Every application must obey the same rules, so none can bypass them","Programs run faster without rules","Rules no longer need to be written","Users can switch the rules off"],"a":0,"why":"Central enforcement means one set of rules applies to all access."}],"exam":[],"practice":[{"q":"A chain of pharmacies in County Tyrone uses a DBMS for its stock system. Describe three functions the DBMS would perform.","m":6,"a":"Security (1): user accounts and access rights so, e.g., only pharmacists can change controlled-drug records (1) / Integrity (1): validation and referential integrity, e.g. stock movements must refer to an existing product (1) / Concurrency control (1): record locking so two branches cannot overwrite one stock level at the same time (1) / Backup and recovery (1): logs changes so data can be restored after a failure (1) / Data dictionary (1): stores metadata about tables/fields (1) / Query language (1): staff can retrieve/update stock with SQL (1). Any three functions, 1 for function + 1 for description."}],"videos":[{"title":"Data management: flat files, relational databases and the DBMS – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS01-video"},{"title":"AQA A Level SLR23 – Databases","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1638"}],"terms":["Database management system (DBMS)","SQL","Metadata","Entity integrity","Referential integrity","View"]},{"id":"c01-p03","spec":"Explain data independence, data redundancy and data inconsistency","lessons":["IS01"],"summary":"Redundancy is unnecessary duplication; inconsistency is disagreeing copies that redundancy allows; data independence lets storage or structure change without rewriting programs.","blocks":[{"t":"h","text":"Data redundancy"},{"t":"p","text":"[[Data redundancy]] is the unnecessary storage of the same data item more than once. It wastes storage, but its real danger is what it makes possible: every copy must be updated together. Note the word *unnecessary* – a foreign key value repeated in many rows is controlled duplication that the design needs, not redundancy."},{"t":"h","text":"Data inconsistency"},{"t":"p","text":"[[Data inconsistency]] occurs when two copies of the same data item hold different values. It is a *consequence* of redundancy: if a price is held in three places and a clerk updates two of them, the database now contradicts itself, and reports based on different copies will disagree."},{"t":"warn","text":"Redundancy and inconsistency are different points. Redundancy = the data is duplicated. Inconsistency = the duplicates no longer match. Examiners credit them separately, so explain the link: redundancy (1) *can lead to* inconsistency when one copy is updated and another is not (1)."},{"t":"h","text":"Data independence"},{"t":"p","text":"[[Data independence]] is the separation between the way data is *used* by programs and the way it is *stored*. The DBMS keeps a [[Schema]] – a description of the data – between the programs and the stored files, so one side can change without breaking the other. It is the cure for [[Program-data dependence]]."},{"t":"table","head":["Type","What can change","Example"],"rows":[["Physical data independence","How and where data is stored: disks, file organisation, indexes","An index is added on Surname to speed up searches – the booking program is untouched"],["Logical data independence","The logical structure: new fields or tables","A field for an emergency contact is added – existing reports and screens still work"]]},{"t":"example","title":"Worked example: why independence matters","steps":["A Derry hotel's booking program reads guest data through the DBMS using field names, not byte positions.","The IT team moves the database to a faster server and adds an index on CheckInDate (a physical change).","They also add a LoyaltyNo field to Guest (a logical change).","Neither change requires the booking program to be edited or retested, because the program asks the DBMS for named fields."],"answer":"Lower maintenance cost and the database can grow with the business."},{"t":"key","title":"Key points","items":["Redundancy = unnecessary duplicated data.","Inconsistency = copies disagree; caused by redundancy plus partial updates.","Data independence = programs are insulated from changes to storage (physical) or structure (logical), via the schema held by the DBMS.","Benefit of independence: less maintenance, quicker development of new applications."]},{"t":"tip","text":"For 'explain data independence', give the definition *and* a consequence for the organisation, e.g. 'the storage can be upgraded without rewriting applications (1), reducing maintenance costs (1)'."}],"diagram":{"kind":"layers","title":"How the schema gives data independence","caption":"Click each layer. Programs talk to the logical view; the DBMS maps it to physical storage, so either side can change.","items":[{"label":"Application programs and users","detail":"Ask for data by table and field name, e.g. Guest.Surname. They know nothing about disks or file layouts."},{"label":"External views","detail":"Each user group sees only the tables and fields it needs. A new field can be added without changing an existing view (logical independence)."},{"label":"Logical schema","detail":"The whole database described as tables, fields, types, keys and relationships – held in the data dictionary."},{"label":"DBMS mapping","detail":"Translates logical requests into physical reads and writes, choosing indexes and access paths."},{"label":"Physical storage","detail":"Files, disks, indexes and their organisation. Can be changed or moved without affecting programs (physical independence)."}]},"check":[{"q":"A customer's address is stored in the Orders table on every order. This is an example of…","o":["data independence","referential integrity","a composite key","data redundancy"],"a":3,"why":"The same address is stored unnecessarily many times."},{"q":"A database administrator adds an index to speed up searches and no application needs changing. This shows…","o":["logical data independence","data inconsistency","physical data independence","program-data dependence"],"a":2,"why":"An index is a physical storage change hidden from programs."},{"q":"Which statement best describes data inconsistency?","o":["Data is stored in more than one table","Two copies of the same data item hold different values","A field is left empty","Data is held in a flat file"],"a":1,"why":"Inconsistency means contradictory copies."}],"exam":[],"practice":[{"q":"Explain how data redundancy can lead to data inconsistency. Use an example.","m":3,"a":"Redundancy means the same item is stored more than once (1) / when it changes, one copy may be updated and another missed (1) / e.g. a pupil's address on two class lists – updated on one, so the school holds two different addresses (1)."},{"q":"Explain what is meant by data independence and give one benefit to an organisation.","m":3,"a":"Programs are separated from how data is physically stored / structured (1) through the DBMS schema, so storage or structure can change without changing programs (1). Benefit: lower maintenance cost / new fields or hardware can be introduced without rewriting existing applications (1)."}],"videos":[{"title":"Data management: flat files, relational databases and the DBMS – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS01-video"},{"title":"OCR A Level SLR10 – Introduction to database concepts","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-databases-part-1/"}],"terms":["Data redundancy","Data inconsistency","Data independence","Schema","Program-data dependence"]},{"id":"c01-p04","spec":"Describe entities, attributes and relationships","lessons":["IS02"],"summary":"An entity is a thing we store data about, attributes are its properties, and relationships record how occurrences of entities are linked.","blocks":[{"t":"p","text":"Before any table is built, the designer models the data. The building blocks of that model are entities, attributes and relationships."},{"t":"table","head":["Term","Meaning","Becomes in the database","Example"],"rows":[["[[Entity]]","An object, person, place or event about which data is stored","A table","Pupil, Course, Teacher"],["Entity occurrence","One particular instance of an entity","A record (row)","The pupil Aoife Kelly"],["[[Attribute]]","A property describing an entity","A field (column)","PupilID, Surname, DateOfBirth"],["[[Relationship]]","A link between two entities","A foreign key in one table","A Form class *contains* Pupils"]]},{"t":"h","text":"Entity descriptions"},{"t":"p","text":"An entity is written in a standard shorthand: the entity name, then its attributes in brackets, with the [[Primary key]] underlined (or shown in bold in typed notes) and foreign keys marked with an asterisk."},{"t":"code","lang":"sql","code":"Pupil(PupilID, Surname, Forename, DateOfBirth, FormID*)\nForm(FormID, Room, TutorID*)\nTeacher(TutorID, Title, Surname)","title":"Entity descriptions (primary key first; * = foreign key)"},{"t":"p","text":"Entity names are singular nouns (Pupil, not Pupils), because the entity describes the type of thing; the table will hold many occurrences."},{"t":"h","text":"Relationships"},{"t":"p","text":"A relationship describes how occurrences of two entities are associated – 'a form *contains* pupils', 'a teacher *tutors* a form'. Every relationship has a [[degree|Degree of relationship]]: one-to-one, one-to-many or many-to-many. Finding the degree is the subject of the ER diagram page; for now notice that a relationship is *implemented* by placing a foreign key in one of the two tables."},{"t":"example","title":"Worked example: finding entities in a scenario","steps":["Scenario: 'Lough Erne Kayak Hire rents kayaks to customers. Each hire has a date and a number of hours. Each kayak has a type and a colour.'","Nouns that need several facts stored about them: Customer, Kayak, Hire – these are entities.","Nouns that are single facts: date, hours, type, colour – these are attributes of an entity.","Verbs linking entities: a customer *makes* hires; a kayak *is used in* hires – these are relationships."],"answer":"Customer(CustomerID, Name, Phone); Kayak(KayakID, Type, Colour); Hire(HireID, HireDate, Hours, CustomerID*, KayakID*)"},{"t":"key","title":"Key points","items":["Entity → table; occurrence → record; attribute → field.","Entity description: Name(Key, Attr, Attr, ForeignKey*).","A relationship links entities and is implemented by a foreign key."]},{"t":"tip","text":"When asked to 'identify entities', pick things that need *several* attributes stored about them. A single value such as 'colour' is an attribute, not an entity."}],"diagram":{"kind":"match","title":"Model term to database term","caption":"Match each modelling idea to what it becomes, or means, in a relational database.","pairs":[["Entity","A table"],["Entity occurrence","A record (row)"],["Attribute","A field (column)"],["Relationship","Implemented by a foreign key"],["Primary key","Uniquely identifies each record"],["Degree","1:1, 1:M or M:N"]]},"check":[{"q":"In a cinema booking system, which of these is most likely to be an attribute rather than an entity?","o":["Seat price","Customer","Screening","Film"],"a":0,"why":"A price is a single value describing something else."},{"q":"What does an attribute become when the design is implemented?","o":["A table","A record","A relationship","A field"],"a":3,"why":"Attributes become fields (columns)."},{"q":"How is a relationship between two tables implemented in a relational database?","o":["By an index","By a validation rule","By a foreign key","By a view"],"a":2,"why":"A foreign key in one table refers to the primary key of the other."}],"exam":[],"practice":[{"q":"Omagh Library lends books to members. For each loan, the library records the date borrowed and date due. Identify three entities and write an entity description for one of them.","m":4,"a":"Entities: Member (1), Book (1), Loan (1). Entity description, e.g. Loan(LoanID, BookID*, MemberID*, DateBorrowed, DateDue) with a suitable primary key identified (1)."}],"videos":[{"title":"Entity-relationship modelling – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS02-video"},{"title":"AQA A Level SLR23 – Databases","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1638"}],"terms":["Entity","Attribute","Relationship","Primary key","Degree of relationship"]},{"id":"c01-p05","spec":"Explain primary, foreign, composite and candidate keys","lessons":["IS02"],"summary":"Candidate keys could each identify a record uniquely; one is chosen as the primary key; a composite key uses two or more attributes; a foreign key links to another table's primary key.","blocks":[{"t":"p","text":"Keys are the mechanism that makes relational databases work: they identify records and link tables."},{"t":"table","head":["Key","Definition","Example"],"rows":[["[[Candidate key]]","Any attribute (or minimal set of attributes) that could uniquely identify every record","In Pupil: PupilID, or the pupil's C2k username"],["[[Primary key]]","The candidate key chosen to uniquely identify each record; must be unique and never null","PupilID"],["[[Composite key]]","A primary key made of two or more attributes which are unique only in combination","(PupilID, CourseID) in Enrolment"],["[[Foreign key]]","An attribute in one table that is the primary key of another table, used to link them","FormID in Pupil refers to Form"],["[[Secondary key]]","A non-unique field indexed for fast searching or sorting","Surname"]]},{"t":"h","text":"Choosing a primary key"},{"t":"list","items":["It must be **unique** for every record, now and in the future – a surname or date of birth is not.","It must **never be null** – every record must have a value.","It should be **stable** – it should not need to change (an email address can change).","It should be **short and simple**, because it is copied into other tables as a foreign key.","So designers often create a *surrogate* key such as an auto-numbered ID when no natural candidate key is suitable."],"ordered":false},{"t":"h","text":"Composite keys"},{"t":"p","text":"In a table such as Enrolment, neither PupilID nor CourseID is unique on its own: a pupil takes several courses, and each course has many pupils. The *pair* is unique, because a pupil enrols on a given course only once. Each part of a composite key is usually also a foreign key to its own parent table."},{"t":"h","text":"Foreign keys"},{"t":"p","text":"A foreign key creates the relationship. The values in Pupil.FormID must match values that exist in Form.FormID – this is [[Referential integrity]]. The foreign key always sits at the 'many' end of a one-to-many relationship."},{"t":"warn","text":"A foreign key does not have to be unique in its own table – many pupils share the same FormID. Saying 'a foreign key uniquely identifies a record' is a common error."},{"t":"key","title":"Key points","items":["Candidate key: could be the primary key. Primary key: the one chosen; unique and not null.","Composite key: two or more attributes together form the primary key.","Foreign key: primary key of another table, used to link; sits at the 'many' end.","Secondary key: non-unique field indexed for searching."]},{"t":"tip","text":"Define the key *and* state its purpose: 'a foreign key is the primary key of another table (1) used to create a relationship/link between the tables (1)'."}],"diagram":{"kind":"table-reveal","title":"Spot the key","caption":"Click a hidden cell to reveal which kind of key each field is in the Enrolment table, and why.","head":["Table","Field(s)","Kind of key","Why"],"rows":[["Pupil","PupilID","Primary key","Unique, never null, chosen from the candidates"],["Pupil","C2kUsername","Candidate key (not chosen)","Also unique, but can change, so less stable"],["Pupil","FormID","Foreign key","Primary key of Form; many pupils share it"],["Enrolment","(PupilID, CourseID)","Composite primary key","Neither is unique alone; the pair is"],["Pupil","Surname","Secondary key","Indexed for searching; not unique"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,2],[2,3],[3,2],[3,3],[4,2],[4,3]]},"check":[{"q":"Which statement about a foreign key is correct?","o":["It must be unique in its own table","It is the primary key of another table and links the two tables","It can only be a number","It is always part of a composite key"],"a":1,"why":"A foreign key references the primary key of another table."},{"q":"Why is Surname a poor choice of primary key?","o":["Two people can share a surname","It is too short","It cannot be indexed","It is a foreign key"],"a":0,"why":"A primary key must be unique for every record."},{"q":"A table Result(StudentID, ExamID, Mark) has which key?","o":["Mark as primary key","No key is needed","ExamID only","A composite primary key (StudentID, ExamID)"],"a":3,"why":"A student sits many exams and an exam has many students, so only the pair is unique."}],"exam":[],"practice":[{"q":"Explain the purpose of a foreign key.","m":2,"a":"It is an attribute that is the primary key in another table (1) and is used to link/create a relationship between the two tables, allowing data to be joined (1)."},{"q":"A Banbridge gym stores Attendance(MemberID, ClassID, ClassDate). State a suitable primary key and justify your choice.","m":3,"a":"Composite key (MemberID, ClassID, ClassDate) (1). A member attends many classes so MemberID alone is not unique (1); a class runs every week, so the date is needed to make each attendance unique (1)."}],"videos":[{"title":"Entity-relationship modelling – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS02-video"},{"title":"OCR A Level SLR10 – Introduction to database concepts","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-alevel-slr10-databases-part-1/"}],"terms":["Candidate key","Primary key","Composite key","Foreign key","Secondary key","Referential integrity"]},{"id":"c01-p06","spec":"Draw and interpret entity-relationship (ER) diagrams showing 1:1, 1:M and M:N relationships","lessons":["IS02"],"summary":"An ER diagram shows entities as boxes and relationships as lines whose crow's-foot ends show the degree: one-to-one, one-to-many or many-to-many.","blocks":[{"t":"p","text":"An [[Entity-relationship (ER) diagram]] is a picture of the data model. Each entity is drawn as a box; each relationship is a line between two boxes. The ends of the line show the [[Degree of relationship]]."},{"t":"h","text":"The three degrees"},{"t":"table","head":["Degree","Meaning","Crow's foot drawing","Example"],"rows":[["One-to-one (1:1)","One A relates to one B, and one B to one A","Plain line at both ends","A Department has one Head; a Head runs one Department"],["One-to-many (1:M)","One A relates to many B; each B relates to one A","Crow's foot (three prongs) at the B end","A Form has many Pupils; a Pupil is in one Form"],["Many-to-many (M:N)","One A relates to many B, and one B to many A","Crow's foot at both ends","A Pupil studies many Courses; a Course has many Pupils"]]},{"t":"h","text":"Working out the degree"},{"t":"p","text":"Ask the question in **both directions** and combine the answers: 'One form has how many pupils? *Many.* One pupil is in how many forms? *One.*' – so Form to Pupil is 1:M. Always read the scenario's business rules; the same pair of entities can have different degrees in different organisations."},{"t":"example","title":"Worked example: Lakeland Vets","steps":["An owner can register many pets; each pet has one owner → Owner 1:M Pet.","A pet has many appointments; each appointment is for one pet → Pet 1:M Appointment.","A vet holds many appointments; each appointment is with one vet → Vet 1:M Appointment.","So Vet and Pet are related M:N (a vet sees many pets; a pet sees many vets) – but the design already resolves it through Appointment."],"answer":"Owner —< Pet —< Appointment >— Vet. The crow's feet all point at the table holding the foreign key."},{"t":"p","text":"When reading an ER diagram, the crow's foot tells you where the foreign key goes: **the table at the 'many' end holds the foreign key**. In Owner —< Pet, Pet contains OwnerID."},{"t":"h","text":"One-to-one relationships"},{"t":"p","text":"A 1:1 relationship can often be merged into one table. It is kept separate when the data in one entity is optional (most pupils have no medical plan), when it needs extra security, or when the tables are large and rarely used together."},{"t":"note","text":"Some textbooks show optionality (a circle for 'zero') on crow's foot lines, or use Chen notation with diamonds for relationships. The CCEA hub lessons use plain crow's foot notation; if a question supplies a different notation, follow the one given."},{"t":"key","title":"Key points","items":["Entity = box (singular name); relationship = line, optionally labelled with a verb.","Crow's foot at the 'many' end; plain end = 'one'.","Test both directions to find 1:1, 1:M or M:N.","The foreign key goes in the table at the 'many' end."]},{"t":"tip","text":"Marks are given per entity and per relationship with the crow's foot at the correct end. Draw neat boxes, label each with a singular noun, and check the final logical design has no M:N lines left."}],"diagram":{"kind":"hotspot","title":"ER diagram: Lakeland Vets","caption":"Click each entity to see its attributes and the degree of each relationship. Lines join related entities; the 'many' ends are noted in the details.","rows":[[{"label":"Owner","detail":"Owner(OwnerID, Name, Phone). Owner 1 —< many Pet: one owner registers many pets.","span":1},{"label":"Pet","detail":"Pet(PetID, Name, Species, OwnerID*). Many end of Owner—Pet; one end of Pet—Appointment.","span":1}],[{"label":"Vet","detail":"Vet(VetID, Name). Vet 1 —< many Appointment: one vet holds many appointments.","span":1},{"label":"Appointment","detail":"Appointment(ApptID, PetID*, VetID*, ApptDate, ApptTime). Many end of both Pet—Appointment and Vet—Appointment, so it holds both foreign keys.","span":1}]],"links":[["Owner","Pet"],["Pet","Appointment"],["Vet","Appointment"]]},"check":[{"q":"In crow's foot notation, what does the three-pronged end of a line show?","o":["The primary key","An optional relationship","The 'many' end of the relationship","A one-to-one link"],"a":2,"why":"The crow's foot marks the many end."},{"q":"A school bus route has many stops, and each stop is served by many routes. The degree is…","o":["1:1","M:N","1:M","M:1"],"a":1,"why":"Many in both directions gives many-to-many."},{"q":"Owner —< Pet. Which table contains the foreign key?","o":["Pet","Owner","Both","Neither"],"a":0,"why":"The foreign key goes at the many end."}],"exam":[],"practice":[{"q":"A Fermanagh driving school has instructors and pupils. Each pupil is taught by one instructor; an instructor teaches many pupils. Each pupil books many lessons; each lesson is for one pupil. Draw an ER diagram for Instructor, Pupil and Lesson.","m":4,"a":"Three entities drawn and named correctly (1) / Instructor to Pupil 1:M with crow's foot at Pupil (1) / Pupil to Lesson 1:M with crow's foot at Lesson (1) / no other relationships drawn; or relationships labelled appropriately (1)."},{"q":"Identify the degree of the relationship between a Translink bus route and its stops, and justify your answer.","m":2,"a":"Many-to-many (1): a route calls at many stops and a stop is served by many routes (1)."}],"videos":[{"title":"Entity-relationship modelling – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/4QJmiYYmf3Xpupq3QHDeeP#IS02-video"},{"title":"AQA A Level SLR23 – Databases","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1638"}],"terms":["Entity-relationship (ER) diagram","Degree of relationship","Entity","Foreign key"]},{"id":"c01-p07","spec":"Resolve many-to-many relationships using a link entity","lessons":["IS02"],"summary":"An M:N relationship cannot be implemented directly, so a link entity with a composite key is inserted, turning it into two 1:M relationships.","blocks":[{"t":"h","text":"Why M:N cannot be implemented"},{"t":"p","text":"Imagine Pupil M:N Course. To link them, Pupil would need a field holding a *list* of CourseIDs, or Course a list of PupilIDs. A relational field must hold a single [[Atomic]] value, so neither works – and adding CourseID1, CourseID2, CourseID3… fields wastes space, sets an arbitrary limit and makes queries awkward."},{"t":"h","text":"The link entity"},{"t":"p","text":"The solution is a [[Link entity]] (also called an associative entity) placed between the two. Each row records *one* pairing – one pupil on one course. The single M:N becomes two 1:M relationships, with both crow's feet pointing at the link entity."},{"t":"list","items":["Name the link entity after the event or fact it records: Enrolment, Loan, Booking, OrderLine.","Its primary key is usually a [[Composite key]] made of the two foreign keys: (PupilID*, CourseID*).","It often holds attributes that belong to the *pairing* rather than to either entity – StartDate, Grade.","If the same pair can occur more than once (a member borrowing the same book twice), add a date to the key or use a
