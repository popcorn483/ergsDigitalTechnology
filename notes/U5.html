"check":[],"exam":[],"practice":[{"q":"Complete four more rows of the Ballyvaren inputs table for the New Sale and Reports screens (input numbers 14–17).","m":4,"a":"14 | btnAdd | Click | New Sale | (click) | To check the quantity against the stock and add the line to the basket\n15 | btnComplete | Click | New Sale | (click) | To check the payment, show the change, reduce the stock and save the sale\n16 | btnRefresh | Click | Reports | (click) | To recalculate the low-stock list, best sellers and daily takings\n17 | btnBack | Click | Reports | (click) | To close the screen and return to the menu"}],"videos":[],"terms":[]},{"id":"c02-p06","spec":"Objects and attributes (booklet page 5, not a numbered task)","lessons":[],"summary":"Read the scenario to find the objects the program needs, list the attributes to store about each, and turn them into a class design.","blocks":[{"t":"task","label":"Booklet page 5","title":"Objects and attributes (not a numbered task)","brief":"Read the scenario to find the objects the program needs, list the attributes to store about each, and check whether another object is needed.","where":{"chapter":"Design chapter","heading":"Heading 2: Objects (or inside Data Requirements)","after":"Task 10 (Data requirements)","pages":"1–2 pages"},"approach":["Underline nouns that have several details: those are objects.","List each object's attributes with data types; declare every attribute, including optional ones.","Ask whether another object is needed for the program to run (e.g. something that happens, like a sale and its lines).","Note what each object does: these become methods.","Draw one object diagram per object, or a simple class diagram."],"deliver":["Each object named","Every attribute listed with a data type","Check for a further object, with a reason","Methods noted","One diagram per object"],"marks":{"criteria":["design","build"],"evidence":"Objects and attributes give the data structures for the design and the class you build. Design (13), Build (27).","top_band":"Include every attribute with a data type; this becomes your class in Task 16."}},{"t":"table","head":["Class","Attribute","Type","Notes"],"rows":[["Product","productID","string","Unique, made by the program, e.g. P003"],["Product","name","string","Presence and length check (max 25), no commas"],["Product","category","string","Chosen from Snack, Drink, Fruit"],["Product","price","decimal","Range check £0.10–£5.00"],["Product","stockLevel / reorderLevel","int","Range check 0–500"],["Sale","saleID","string","Unique, e.g. S0005"],["Sale","saleDateTime","DateTime","Set by the program when the sale is made"],["Sale","items","List of SaleLine","One line per product in the basket"],["SaleLine","productID / qty / lineTotal","string / int / decimal","Quantity 1–20; lineTotal = price × qty"],["Staff","username / password","string / string","Read from logins.txt"]],"caption":"Ballyvaren class design (practice only)"},{"t":"example","title":"How to find the objects (Ballyvaren practice)","steps":["Underline the nouns that have details: '*each product* has a *name, category, price, stock level and reorder level*; *a sale* has a *date and time* and *one or more items*, each with a *quantity*'.","Things with several details become objects: **Product** and **Sale**. Single values (price, quantity) become attributes.","List Product's attributes: productID, name, category, price, stockLevel, reorderLevel.","Ask 'does another object need to be made?': a sale can contain several products, each with its own quantity and line total, so **SaleLine** is a third object, and a sale holds a list of them. **Staff** holds the login details.","Things the object can *do* become methods: a Sale can total its lines; a Product can say whether it needs reordering and reduce its stock."]}],"diagram":{"kind":"hotspot","title":"Product object","caption":"Click each part of the object diagram.","rows":[[{"label":"OBJECT: Product","detail":"The class name. Each item the tuck shop sells is one object (instance) of this class.","span":3}],[{"label":"productID","detail":"string – unique ID, e.g. P003.","span":1},{"label":"name","detail":"string, max 25.","span":1},{"label":"category","detail":"string – Snack, Drink or Fruit.","span":1}],[{"label":"price","detail":"decimal, £0.10–£5.00.","span":1},{"label":"stockLevel","detail":"int, 0–500; reduced when a sale is completed.","span":1},{"label":"reorderLevel","detail":"int; reorder when stock falls to this level.","span":1}],[{"label":"Methods","detail":"NeedsReorder(), ReduceStock(), ToCsv(), FromCsv(). Things the object can do.","span":3}]],"links":[["OBJECT: Product","productID"],["OBJECT: Product","Methods"]]},"check":[],"exam":[],"practice":[{"q":"A fictional brief: 'A school library lends books. Each book has an ID, a title, an author and a category. Pupils (with a pupil number, name and form class) borrow books; each loan has a date out and a due date.' Identify the objects and list the attributes with data types for each.","m":4,"a":"Three objects. **Book**: bookID (string), title (string), author (string), category (string). **Pupil**: pupilNumber (string or int), name (string), formClass (string). **Loan** (the event linking them): bookID (string), pupilNumber (string), dateOut (DateTime), dueDate (DateTime). Methods might include Loan.IsOverdue() and Pupil.ToCsv()."}],"videos":[],"terms":[]},{"id":"c02-p07","spec":"TASK 11: Wireframe diagrams / initial designs","lessons":[],"summary":"Create a wireframe for every screen in a separate Word document: a basic layout made from shapes, with labels explaining what each part does.","blocks":[{"t":"task","label":"TASK 11","title":"Wireframe diagrams / initial designs","brief":"Create a wireframe for every screen: a basic layout made from shapes in Word, with labels explaining what each part does.","where":{"chapter":"Design chapter (separate document first)","heading":"Heading 2: User Interface Design › Heading 3: Initial Designs (one heading per screen)","after":"Task 10 / Objects","pages":"About 1 page per screen (6–10 pages)"},"approach":["PREP: decide every screen you need from the scenario.","Make the wireframes in a separate document in Initial Designs.","Draw each screen with simple shapes: title, boxes, lists, buttons.","Add a callout for every element, joined by a line or arrow, saying what it is and what happens when it is used.","Group each wireframe so it moves as one piece.","Put the screen name above each one."],"deliver":["Separate wireframe document in Initial Designs","One wireframe per screen","Screen name as a heading","A callout for every element","Each button says what it does or opens"],"marks":{"criteria":["design"],"evidence":"Initial interface designs; the starting point for refinement. Design (13).","top_band":"Design every screen, labelled, so later changes after feedback can be seen."}},{"t":"table","head":["Callout on the Ballyvaren sale wireframe","Explains"],"rows":[["'The title will appear here, telling the user which screen they are on.'","Title label"],["'The product is chosen from a drop-down list showing its name and price.'","Product combo box"],["'The quantity is typed here; Add puts the product in the basket after checking the stock.'","Quantity box and Add button"],["'The basket lists each item with its line total; the running total appears underneath.'","Basket list and total label"],["'The amount paid is typed here and the change is shown beside it.'","Paid box and change label"],["'Complete Sale saves the sale and reduces the stock; Cancel Sale empties the basket; Back returns to the menu.'","Three buttons"]],"caption":"What the labels should say"},{"t":"example","title":"How to draw a wireframe in Word","steps":["Create a new Word document in Initial Designs, for example *Wireframes*.","**Insert › Shapes › Rectangle**. Draw a grey rectangle the shape of a window: this is the form.","Add smaller rectangles for text boxes, lists and buttons, and **Insert › Text Box** for the title and labels. Type the text that will appear (e.g. *New Sale*).","Add callout text boxes outside the form, each with an **arrow** (Insert › Shapes › Arrow) pointing at the part it explains.","Select everything (click each with Shift held) and **Shape Format › Group** so the wireframe moves as one piece.","Repeat for every screen. Put the screen name above each wireframe."]}],"diagram":{"kind":"hotspot","title":"Wireframe: Ballyvaren New Sale screen","caption":"Click each part of the practice wireframe.","rows":[[{"label":"Title","detail":"'New Sale' – tells the user which screen they are on.","span":4}],[{"label":"Product list","detail":"Drop-down list of products with ID, name and price.","span":2},{"label":"Quantity + Add","detail":"Quantity 1–20; Add checks the stock and adds the line.","span":2}],[{"label":"Basket","detail":"Each line: quantity, product, line total.","span":2},{"label":"Total","detail":"Running total of the basket.","span":2}],[{"label":"Amount paid","detail":"Typed by staff.","span":2},{"label":"Change","detail":"Shown as soon as the amount paid covers the total.","span":2}],[{"label":"Complete Sale","detail":"Saves the sale and reduces the stock.","span":1},{"label":"Cancel Sale","detail":"Empties the basket.","span":1},{"label":"Help","detail":"Explains the screen.","span":1},{"label":"Back","detail":"Returns to the menu.","span":1}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"List the screens needed for the Ballyvaren practice system and write two wireframe labels for the menu screen.","m":3,"a":"Screens: Login, Menu, Products, New Sale, Reports (five screens). Menu labels: (1) 'These buttons take the user to the Products, New Sale or Reports screen.' (2) 'The Log Out button closes the menu and returns to the login screen so that another member of staff can log in.' (Also good: 'The name of the logged-in user appears here.')"}],"videos":[],"terms":[]},{"id":"c02-p08","spec":"TASK 12: User Feedback I","lessons":[],"summary":"Explain, screen by screen, how the designs were reviewed, under the subtitles Issues Identified and Alterations to Design, and how the client agreed the changes.","blocks":[{"t":"task","label":"TASK 12","title":"User Feedback I","brief":"Explain how the designs were reviewed, under the subtitles Issues Identified and Alterations to Design, screen by screen, and how the client agreed the changes.","where":{"chapter":"Design chapter","heading":"Heading 3: User Feedback I (subtitles Issues Identified, Alterations to Design)","after":"Task 11 (Initial designs)","pages":"2–3 pages"},"approach":["Start with who reviewed the designs and their overall view.","Under Issues Identified, number the screens and letter each issue (1 a, 1 b…).","Under Alterations to Design, use the same numbers and letters so every issue has its fix.","Look for real problems: input method, missing Help or Back, layout order, consistency, readability.","Don't just copy the booklet's suggestions (colours, button layout, logo).","Say how the client agreed, and keep each redraft."],"deliver":["Heading 3 'User Feedback I'","Subtitle 'Issues Identified'","Subtitle 'Alterations to Design'","Every screen covered","Each alteration matches an issue","Client's agreement stated","Redrafts saved"],"marks":{"criteria":["design"],"evidence":"'Use of user feedback to refine the solution' is a top-band Design feature. Design (13).","top_band":"Show the issues identified and the alterations made, screen by screen. Moderators note this is often missing."}},{"t":"example","title":"Worked example: Ballyvaren New Sale screen","steps":["**Issues Identified:** 'When the New Sale screen was reviewed with the shop manager, three issues were identified. The product name was typed into a text box, which would allow names to be misspelt and would not find the right price. There was no Help button, unlike the login screen. The change was only shown in a message after the sale was saved, so staff could not tell the customer before completing it.'","**Alterations to Design:** 'The name text box was replaced with a drop-down list of products showing their ID, name and price. A Help button was added in the same bottom-right position as on every other screen. A change label was added beside the amount-paid box, updating as the amount is typed. The shop manager reviewed the redraft and agreed that the changes make serving quicker and less error-prone.'"]}],"diagram":{"kind":"compare","title":"Before and after review","caption":"Toggle between the first wireframe and the redraft.","states":[{"label":"First draft","points":["Product name typed into a text box","No Help button","Change only shown after saving","Title font different from the login screen"],"art":null},{"label":"After feedback","points":["Product chosen from a drop-down list with its price","Help button bottom-right, as on every screen","Change label updates as the amount paid is typed","Same Century Gothic title as every screen"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write an Issues Identified and an Alterations to Design paragraph for a fictional login screen whose first draft had a password box that showed the password, no title and a 'Forgotten password?' link in red.","m":4,"a":"**Issues Identified:** 'When the login screen was reviewed with the client, it was noted that the password was visible as it was typed, which is a security risk when others are nearby. The screen had no title, so users could not tell which screen they were on, and the red link looked like an error message.' **Alterations to Design:** 'The password box was set to show * characters (PasswordChar). A title label \"Staff Login\" was added in the same font and position as on every other screen. The link was changed to the dark blue used for links throughout. The client approved the redrafted design.'"}],"videos":[],"terms":[]},{"id":"c02-p09","spec":"TASK 13A: Final designs / outputs","lessons":[],"summary":"Produce final designs (storyboards) detailed enough for third-party implementation: what and where each control is, fonts, sizes, colours, validation and help features.","blocks":[{"t":"task","label":"TASK 13A","title":"Final designs / outputs","brief":"Produce detailed final designs (storyboards) for every screen, detailed enough for third-party implementation.","where":{"chapter":"Design chapter (separate document first, in Final Designs)","heading":"Heading 3: Final Designs › Heading 4 per screen","after":"Task 12 (User Feedback I)","pages":"About 1 page per screen (6–10 pages)"},"approach":["Make the changes agreed in User Feedback I.","Use a screenshot of the real form in Visual Studio, or a detailed drawing.","Add a callout for every control: purpose, font, size, colour, alignment.","For buttons, say exactly what happens, including validation and which screen opens.","Put help features (Help button, tooltips, where errors appear) in a different-coloured callout.","State the source of any image or icon."],"deliver":["Every screen designed","Changes from User Feedback I made","Purpose and position of every control","Font, size, colour and alignment","Validation for every input","Help features for every screen (Help button or F1, tooltips, placeholder hints, where error messages appear), in a different-coloured callout","Image sources stated"],"marks":{"criteria":["design","build"],"evidence":"Interface and output/report design, with validation and help shown. Design (13); also the reference the Build is matched against.","top_band":"Show validation, error messages and help (e.g. tooltips) on every storyboard, detailed enough for third-party build."}},{"t":"table","head":["Each final design should include","Ballyvaren New Sale screen example"],"rows":[["What the buttons do (in more detail than before)","btnAdd: checks a product is chosen and the quantity is 1–20 and not more than the stock (counting what is already in the basket), then adds the line and updates the total. btnComplete: checks the basket is not empty and the amount paid covers the total, shows the change, reduces the stock, saves the sale and starts a new basket."],["Where the buttons go","Add beside the quantity box; bottom row, left to right: Complete Sale, Cancel Sale, Back; Help in the bottom-right corner."],["What validation will be done on the inputs","Product: presence (must be chosen). Quantity: whole number 1–20, not more than the stock. Amount paid: a number, at least the total, no more than £50.00. Basket: at least one item before completing."],["What help features are available","Help button (or F1) opens a message explaining the screen. Each error message names the box to fix. Tooltips on every box; grey hints in empty boxes ('1 to 20', 'e.g. 2.00')."],["Font, size, colour, alignment of each control","Title: Century Gothic, Bold, 20 pt, black, centred. Labels: Century Gothic 10 pt, left. Background: pale yellow. Text boxes: white."]],"caption":"The detail needed"},{"t":"example","title":"How to build a storyboard","steps":["Either draw the screen in Word with shapes, or build the empty form in Visual Studio and paste a screenshot (the booklet's example is a screenshot of the real form).","Put the screen title above, e.g. *New Sale Screen*.","Add an annotation box for every control: its purpose, font, size, colour, alignment and, for inputs, its validation.","Put the **help features in a different-coloured text box** from your other labels, as the booklet asks.","Repeat for every screen."]},{"t":"warn","text":"A storyboard that only says 'This is a text box' is not enough for third-party implementation. Ask yourself: could a classmate build this exact screen from my design without asking me anything?"}],"diagram":{"kind":"hotspot","title":"Storyboard annotations","caption":"Click each annotation type on a final design.","rows":[[{"label":"Title label","detail":"Text, font, size, colour, alignment and why it is there.","span":2},{"label":"Logo / branding","detail":"Where it appears and that it is the same on every screen.","span":2}],[{"label":"Input boxes","detail":"What is entered, the validation applied, colour and font.","span":2},{"label":"Lists","detail":"What items they hold and where those come from.","span":2}],[{"label":"Buttons","detail":"Exactly what happens when clicked, including which screen opens next.","span":2},{"label":"Help (different colour)","detail":"Help button or F1, tooltips, placeholder hints, where error messages appear.","span":2}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write the full storyboard annotation for the Ballyvaren 'amount paid' text box.","m":3,"a":"'tbPaid – a text box where staff type the amount the customer hands over. Positioned below the basket total, with the change label (lblChange) to its right. Font: Century Gothic, regular, 10 pt, black text on white. Validation: must be a number (type check using decimal.TryParse), at least the basket total and no more than £50.00 (range checks); the basket must not be empty. If invalid, a message box explains the rule and the cursor returns to this box. The change label updates each time the amount changes.' **Help (different-coloured box):** 'Tooltip: \"Amount the customer hands over, e.g. 2.00\". Grey hint in the empty box: \"e.g. 2.00\".'"}],"videos":[],"terms":[]},{"id":"c02-p10","spec":"TASK 13B: Control tables","lessons":[],"summary":"For each final storyboard, make a control table listing every control's item number, name, type, value and function.","blocks":[{"t":"task","label":"TASK 13B","title":"Control tables","brief":"For each final storyboard, make a control table listing every control's item number, name, type, value and function.","where":{"chapter":"Design chapter","heading":"Under each screen's final design","after":"That screen's storyboard (Task 13A)","pages":"1–2 pages per screen (8–12 pages)"},"approach":["List every control, including labels and pictures, not only inputs and buttons.","Name each in camel case with a type prefix: lbl, llbl, tb, btn, cmb, nud, dtp, chk, lst, dgv.","Many write-ups add a Screen column so each row says which form it belongs to.","Give the value it is set to ((blank) for empty boxes) and why it is there.","Use exactly these names in Visual Studio."],"deliver":["A control table for every screen","Item number, name, type, value and function columns","Every control listed","Help controls listed (Help button, ToolTip) with what each explains","Prefixed camel-case names","Names match the data requirements and code"],"marks":{"criteria":["design"],"evidence":"Detailed interface design (controls, names, types). Design (13).","top_band":"Every control, named and typed, for every screen."}},{"t":"table","head":["Item Number","Control Name","Control Type","Value","Function of Control"],"rows":[["1","lblTitle","Label","New Sale","To display the title of the screen"],["2","cmbProduct","Combobox","(list of products)","To choose the product being sold"],["3","tbQty","Textbox","(blank)","To enter the quantity (1–20)"],["4","btnAdd","Button","Add","To check the stock and add the product to the basket"],["5","lstBasket","ListBox","(items in the basket)","To show each item with its line total"],["6","lblTotal","Label","Total: £0.00","To show the running total of the basket"],["7","tbPaid","Textbox","(blank)","To enter the amount the customer pays"],["8","lblChange","Label","Change: –","To show the change as the amount paid is typed"],["9","btnComplete","Button","Complete Sale","To check the payment, reduce the stock and save the sale"],["10","btnCancelSale","Button","Cancel Sale","To empty the basket"],["11","btnHelp","Button","Help","To explain how to use the screen (also F1)"],["12","btnBack","Button","Back","To close this screen and return to the menu"],["13","tips","ToolTip","(a hint for each box and button)","To show a short help hint when the mouse rests on a control"]],"caption":"Control table: Ballyvaren New Sale screen (practice)"}],"diagram":{"kind":"match","title":"Match the prefix","caption":"Match each control name to its control type.","pairs":[["tbPaid","Textbox"],["btnComplete","Button"],["cmbCategory","Combobox (drop-down list)"],["lstBasket","ListBox"],["dgvTakings","DataGridView"],["nudQty","Numeric up down"]]},"check":[],"exam":[],"practice":[{"q":"Write the control table for the Ballyvaren login screen (title, username, password, a link label to a help message, login button).","m":4,"a":"1 | lblTitle | Label | Staff Login | To display the title of the screen\n2 | tbUsername | Textbox | (blank) | To allow the user to enter their username\n3 | tbPassword | Textbox | (blank), PasswordChar * | To allow the user to enter their password, hidden as it is typed\n4 | llblForgot | Link label | Forgotten password? | To show a message telling staff to contact the shop manager\n5 | btnLogin | Button | Login | To check the username and password against logins.txt and, if valid, open the menu"}],"videos":[],"terms":[]},{"id":"c02-p11","spec":"TASK 13C: Processes – flowcharts or pseudocode","lessons":[],"summary":"Design at least one process per screen as a flowchart or pseudocode, including validation and error messages, covering a whole section of inputs at once.","blocks":[{"t":"task","label":"TASK 13C","title":"Processes – flowcharts or pseudocode","brief":"Design at least one process per screen as a flowchart or pseudocode, including validation and error messages.","where":{"chapter":"Design chapter (separate document first)","heading":"Under each screen's control table","after":"That screen's control table (Task 13B)","pages":"Half to one page per screen (4–8 pages)"},"approach":["Pick flowcharts for simple screens and pseudocode for longer processes.","Write one block per event, starting with the trigger: 'When the user presses the Save button'.","Design whole sections of input together, not one flowchart per box.","Show every validation check with the exact error message.","Show calculations step by step.","Number the lines and use consistent keywords (IF … END IF, FOR EACH … END FOR)."],"deliver":["At least one process per screen","Validation with error messages","Calculations shown","Line-numbered pseudocode or a clear flowchart","Each block names its trigger"],"marks":{"criteria":["design"],"evidence":"Flowcharts/pseudocode: 'appropriate design tools' giving a 'fully decomposed solution', including validation and error trapping. Design (13).","top_band":"Cover every process, including validation and error trapping, so the whole program is decomposed."}},{"t":"code","lang":"ps","title":"Pseudocode: frmSale – when the user presses the Add and Complete Sale buttons","code":"When the user presses the Add button:\n1.  IF no product chosen THEN\n2.      DISPLAY \"Please choose a product\"\n3.      STOP\n4.  END IF\n5.  IF tbQty.Text is not a whole number OR qty < 1 OR qty > 20 THEN\n6.      DISPLAY \"The quantity must be between 1 and 20\"\n7.      STOP\n8.  END IF\n9.  SET wanted AS qty + quantity of this product already in the basket\n10. IF wanted > product stock level THEN\n11.     DISPLAY \"Only \" + stock level + \" of \" + product name + \" left in stock\"\n12.     STOP\n13. END IF\n14. SET lineTotal AS product price * qty\n15. ADD line to basket\n16. SET total AS total + lineTotal\n17. DISPLAY total\n\nWhen the user presses the Complete Sale button:\n18. IF basket is empty THEN\n19.     DISPLAY \"The basket is empty\"\n20.     STOP\n21. END IF\n22. IF tbPaid.Text is not a number OR paid < total THEN\n23.     DISPLAY \"The amount paid must be at least £\" + total\n24.     STOP\n25. END IF\n26. SET change AS paid - total\n27. FOR EACH line IN basket\n28.     SET product stock level AS stock level - line qty\n29. END FOR\n30. ADD sale to sales list\n31. SAVE products.csv AND sales.csv\n32. DISPLAY \"Change: £\" + change"}],"diagram":{"kind":"flow","direction":"tb","title":"Flowchart: complete a sale","caption":"Step through the Ballyvaren Complete Sale process (practice).","nodes":[{"id":"s","label":"START: Complete Sale clicked","detail":"Event: btnComplete_Click.","shape":"start"},{"id":"b","label":"Basket empty?","detail":"At least one item must be in the basket.","shape":"decision"},{"id":"i","label":"INPUT amount paid","detail":"From tbPaid.","shape":"io"},{"id":"n","label":"A number?","detail":"decimal.TryParse.","shape":"decision"},{"id":"p","label":"Paid ≥ total?","detail":"Range check (and no more than £50.00).","shape":"decision"},{"id":"e","label":"DISPLAY error","detail":"Say what is wrong; return to the box.","shape":"io"},{"id":"c","label":"Change = paid − total","detail":"e.g. 2.00 − 1.90 = 0.10.","shape":"process"},{"id":"r","label":"Reduce stock for each line","detail":"Stock level − quantity sold.","shape":"process"},{"id":"v","label":"Save products and sales","detail":"products.csv and sales.csv.","shape":"store"},{"id":"x","label":"DISPLAY change; new basket","detail":"e.g. 'Sale S0006 complete. Change: £0.10'.","shape":"end"}],"edges":[["s","b"],["b","e","yes"],["b","i","no"],["i","n"],["n","p","yes"],["n","e","no"],["p","c","yes"],["p","e","no"],["c","r"],["r","v"],["v","x"]]},"check":[],"exam":[],"practice":[{"q":"Write pseudocode, in the booklet's numbered style, for the low-stock report: list every product at or below its reorder level, lowest stock first.","m":4,"a":"1. SET low AS empty list\n2. FOR EACH product IN products\n3.     IF product stock level <= product reorder level THEN\n4.         ADD product TO low\n5.     END IF\n6. END FOR\n7. REPEAT for each pass through low\n8.     FOR EACH pair of neighbours in low\n9.         IF left stock level > right stock level THEN\n10.            SWAP them\n11.        END IF\n12.    END FOR\n13. UNTIL a pass makes no swaps\n14. DISPLAY low in dgvLowStock"}],"videos":[],"terms":[]},{"id":"c02-p12","spec":"TASK 14: Navigational structure","lessons":[],"summary":"Draw a navigational structure diagram showing every screen and how the user gets from one form to another.","blocks":[{"t":"task","label":"TASK 14","title":"Navigational structure","brief":"Draw a diagram showing every screen and how the user moves from one form to another.","where":{"chapter":"Design chapter","heading":"Heading 2: Navigational Structure","after":"The last screen's final design (Task 13)","pages":"1 page"},"approach":["PREP: list every button that opens a form.","Draw a tree with the form names: login at the top, the screens it opens below.","Use arrows for every route, including Back and Log Out.","Branch by user type if the scenario has more than one.","Check every form in your control tables appears."],"deliver":["Heading 2 'Navigational Structure'","Every screen included","Form names match my designs","Arrows show direction","Back and log-out routes shown"],"marks":{"criteria":["design"],"evidence":"Navigation design (part of a fully decomposed solution and interface design). Design (13).","top_band":"Show every screen and every route between them."}},{"t":"table","head":["From","Button","To"],"rows":[["frmLogin","btnLogin (valid login)","frmMenu"],["frmMenu","btnProducts","frmProducts"],["frmMenu","btnSale","frmSale"],["frmMenu","btnReports","frmReports"],["frmProducts / frmSale / frmReports","btnBack","frmMenu"],["frmMenu","btnLogOut","frmLogin"]],"caption":"Ballyvaren navigation (practice)"},{"t":"example","title":"How to draw it in Word","steps":["**Insert › SmartArt › Hierarchy › Organization Chart** gives a ready-made tree, or use **Insert › Shapes** with rectangles and arrows.","Put **frmLogin** at the top: the program always starts there.","Below it put the screen a successful login opens (**frmMenu**).","Below the menu put each screen its buttons open (**frmProducts**, **frmSale**, **frmReports**).","Add arrows for every route, including back routes (Back buttons, Log Out). Label arrows with the button that causes the move."]}],"diagram":{"kind":"flow","direction":"tb","title":"Navigation structure: Ballyvaren (practice)","caption":"Step through how the user moves between forms.","nodes":[{"id":"l","label":"frmLogin","detail":"Start screen. Three attempts.","shape":"start"},{"id":"m","label":"frmMenu","detail":"Opened by a valid login. Log Out returns to frmLogin.","shape":"process"},{"id":"a","label":"frmProducts","detail":"Add, edit and search products. Back returns to the menu.","shape":"process"},{"id":"r","label":"frmSale","detail":"Basket, payment and change. Back returns to the menu.","shape":"process"},{"id":"b","label":"frmReports","detail":"Low stock, best sellers, daily takings. Back returns to the menu.","shape":"process"}],"edges":[["l","m","valid login"],["m","a","Products"],["m","r","New Sale"],["m","b","Reports"],["m","l","Log Out"]]},"check":[],"exam":[],"practice":[{"q":"The shop manager asks for a Staff screen (frmStaff) where helpers' logins can be added, opened from the menu and only visible to the user 'manager'. Update the navigation table and say how the diagram changes.","m":2,"a":"Add: frmMenu | btnStaff (shown only when the logged-in user is manager) | frmStaff, and frmStaff | btnBack | frmMenu. On the diagram, add a fourth box under frmMenu labelled frmStaff with an arrow labelled 'Staff (manager only)', and a back arrow to the menu."}],"videos":[],"terms":[]},{"id":"c02-p13","spec":"TASK 15: User Feedback II","lessons":[],"summary":"Write a paragraph explaining that the client has approved the final designs, and come back to it later if the finished product differs from the designs.","blocks":[{"t":"task","label":"TASK 15","title":"User Feedback II","brief":"Write a paragraph saying the client has approved the designs, and return to it later to explain any differences between the designs and the finished program.","where":{"chapter":"Design chapter","heading":"Heading 2: User Feedback II","after":"Task 14 (Navigational structure)","pages":"Half to one page"},"approach":["Name the client if the scenario does.","Say what was presented and that it was approved.","After building, list each change from the design with its reason.","State that the client agreed each change.","Keep it short and factual."],"deliver":["Heading 2 'User Feedback II'","Client named (if the scenario names one)","Designs approved","Every design-to-product change explained","Client agreement to changes stated"],"marks":{"criteria":["design"],"evidence":"User Feedback II (approval of final designs) is evidence of refining the design using feedback. The 'Collate your work and submit' step under the same label earns no marks itself. Design (13).","top_band":"Record the client's approval and any final changes, and update it if the finished program differs from the design."}},{"t":"example","title":"Worked example: Ballyvaren (practice)","steps":["'The final storyboards, control tables, pseudocode and navigation structure were presented to the shop manager. The manager confirmed that the New Sale screen covers everything currently written in the sales notebook and that choosing products from a drop-down list will reduce errors.'","'The shop manager approved the designs for development.'","Added after building: 'During development, grey hints (\"1 to 20\", \"e.g. 2.00\") were added to the empty quantity and amount-paid boxes, which were not in the final design. They show new helpers what to type. The shop manager agreed that this supports requirement 17.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The final designs were presented to [client], including…*","*[Client] confirmed that the designs meet the requirements because…*","*[Client] approved the designs for development.*","*During development, … was changed from the design because… [Client] agreed because…*"],"ordered":false},{"t":"warn","text":"Do not invent a long conversation. Keep it to what was approved and, later, what changed and why."}],"diagram":{"kind":"timeline","title":"Where feedback happens","caption":"Click each point where the client sees your work.","items":[{"label":"Wireframes","detail":"Task 11: first ideas."},{"label":"User Feedback I","detail":"Task 12: issues identified, alterations made, redrafts agreed."},{"label":"Final designs","detail":"Task 13: storyboards, control tables, processes, navigation."},{"label":"User Feedback II","detail":"Task 15: the client approves the designs."},{"label":"After the build","detail":"Return to User Feedback II to explain any differences between designs and product."}]},"check":[],"exam":[],"practice":[{"q":"While building, a pupil merged the Ballyvaren 'Search Products' and 'Products' screens into one form. Write the paragraph to add to User Feedback II.","m":2,"a":"'During development, the separate Search Products screen shown in the final designs was combined with the Products screen, so the search box and the product list now appear on one form (frmProducts). This was changed because staff would otherwise have to move between two screens to find and then edit a product. The shop manager reviewed the change and agreed that it makes editing quicker; requirement 5 is still met.'"}],"videos":[],"terms":[]},{"id":"c02-p14","spec":"TASK 15: Collate your work and submit","lessons":[],"summary":"Collate all the design work into one document and submit it to Google Classroom in both PDF and Word format.","blocks":[{"t":"task","label":"TASK 15","title":"Collate your work and submit","brief":"Collate all the design work into one document and submit it to Google Classroom in both Word and PDF format.","where":{"chapter":"Design chapter (whole)","heading":"All Task 6–15 sections, in task order","after":"Task 15 (User Feedback II)","pages":"0 new pages"},"approach":["Insert the separate design documents into the Write Up in task order.","Give every screen its own heading.","Set grouped wireframes and pictures to In Line with Text.","Update the table of contents.","Save as .docx and as PDF; check the PDF page by page.","Attach both to Google Classroom and Turn in."],"deliver":["All design documents collated in task order","A heading for each design","Contents updated","Saved as Word","Saved as PDF and checked","Both turned in on Google Classroom"],"marks":{"criteria":["design"],"evidence":"User Feedback II (approval of final designs) is evidence of refining the design using feedback. The 'Collate your work and submit' step under the same label earns no marks itself. Design (13).","top_band":"Record the client's approval and any final changes, and update it if the finished program differs from the design."}},{"t":"example","title":"How to collate and export","steps":["Open your Write Up. Under the right headings, insert each design document in the order of the tasks: wireframes after the data requirements, then User Feedback I, final designs, control tables, processes, navigation, User Feedback II.","To bring in a whole document: **Insert › Object › Text from File…** and choose the document. Or open it, **Ctrl + A**, **Ctrl + C**, and paste into the Write Up.","Give each design its own heading (Heading 3, e.g. *Final Design – New Sale Screen*) so it appears in the contents.","**References › Update Table › Update entire table**.","**File › Save As › Browse** and save as **Word Document (.docx)**; then **File › Save As** again and choose **PDF (*.pdf)**.","In Google Classroom, open the assignment, **Add or create › File**, attach both files and click **Turn in**."]},{"t":"warn","text":"Inserted pictures can lose their position when pasted. Set wireframe images and grouped shapes to **In Line with Text** (Layout Options) before you export, so they stay where you put them."}],"diagram":{"kind":"flow","direction":"lr","title":"Collate and submit","caption":"Step through the submission process.","nodes":[{"id":"a","label":"Separate documents","detail":"Wireframes, final designs, control tables, processes.","shape":"store"},{"id":"b","label":"Insert into Write Up","detail":"In task order, each with a heading.","shape":"process"},{"id":"c","label":"Update contents","detail":"References › Update Table.","shape":"process"},{"id":"d","label":"Save .docx and .pdf","detail":"File › Save As twice.","shape":"process"},{"id":"e","label":"Turn in","detail":"Google Classroom: attach both files.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[],"exam":[],"practice":[{"q":"After exporting to PDF a pupil finds their wireframe labels have moved away from the arrows. Explain how to fix this before resubmitting.","m":2,"a":"In Word select all the shapes, text boxes and arrows of one wireframe (Shift + click each) and **Shape Format › Group** them so they move as one object. Then click the group's **Layout Options** and choose **In Line with Text** so it sits in the text flow. Repeat for each wireframe, save, export to PDF again and check every page before turning in. (Alternatively, take a screenshot of each grouped wireframe and insert the picture in line with text.)"}],"videos":[],"terms":[]}]},{"id":"c03","n":3,"title":"Building it in Visual Studio","intro":"TASK 16: build your program in C# (Windows Forms, Visual Studio) and record every error you fix. Step-by-step tutorials on the fictional Ballyvaren High School Tuck Shop practice project: forms with user help, classes, lists, navigation, files, validation, calculations, display, searching, sorting and debugging.","pages":[{"id":"c03-p01","spec":"TASK 16: Build the project in Visual Studio + record errors","lessons":[],"summary":"Set up a Corrective Actions document before you write any code, then build your program screen by screen, screenshotting every error, its fix and the working result.","blocks":[{"t":"task","label":"TASK 16","title":"Build the project in Visual Studio + record errors","brief":"Build the program from your designs and record every error in a Word document called Corrective Actions.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"Corrective Actions document (Building chapter if your teacher asks for one)","after":"The Design chapter","pages":"Error log 3–6 pages"},"approach":["Create the Corrective Actions document before writing any code.","Build one feature at a time and run it (F5) straight away.","For every error: screenshot the code (line numbers visible) and the wrong output, fix it, screenshot the fixed code and the working result.","Write a sentence on what was wrong and a sentence on how you fixed it.","Number the entries so the test table can refer to them.","Keep screenshots of the working program for testing."],"deliver":["Corrective Actions document","Every screen built from my designs","A class for each object","Validation on every input","User help on every screen: tooltips, clear labels and hints, and a Help button or F1","Data saved and loaded","Every error recorded with before and after screenshots"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"table","head":["Step","Build","Page in this chapter"],"rows":[["1","Create the Windows Forms project and rename Form1","Creating the Windows Forms project"],["2","Lay out every form from your control tables, with user help on each","Building forms from your control tables"],["3","Write a class for each object","Writing your class"],["4","Store objects in lists","Objects in a List"],["5","Login, menu and navigation","Navigating between forms"],["6","Save and load files","Saving and loading files"],["7","Validation on every input","Input validation"],["8","Calculations","Calculations"],["9","Display, search, sort","Displaying data; Searching and sorting"],["10","Keep the error log going all the way through","Recording errors as you build"]],"caption":"Build in small steps and run (F5) after each one"}],"diagram":{"kind":"cycle","title":"The build loop","caption":"Click each stage: repeat it for every feature.","items":[{"label":"Build one feature","detail":"One form, one button, one method: small enough to test straight away."},{"label":"Run (F5)","detail":"Start the program and try the feature with valid and invalid data."},{"label":"Screenshot the error","detail":"Error List, exception message or wrong output, with the code that caused it."},{"label":"Fix it","detail":"Read the message, find the line, change the code."},{"label":"Screenshot the fix","detail":"The corrected code and the program now working."},{"label":"Explain it","detail":"Two or three sentences in Corrective Actions: what went wrong, why, how it was fixed."}]},"check":[],"exam":[],"practice":[{"q":"Set up your Corrective Actions document so it is ready to use. Describe its layout.","m":2,"a":"Create a Word document called **Corrective Actions** in the candidate folder, with the same Normal style, header and footer as the Write Up. For each error add a Heading 2 **Corrective Action 1**, **Corrective Action 2**… and under it: (1) a screenshot of the error or the code causing it (Windows + Shift + S, then paste); (2) a screenshot of the fixed code; (3) a screenshot of the working result; (4) two or three sentences explaining what went wrong and how it was fixed. Numbering them now means the test table can later refer to 'Corrective Action 3'."}],"videos":[],"terms":[]},{"id":"c03-p02","spec":"TASK 16: Build – Creating the Windows Forms project","lessons":[],"summary":"Create a C# Windows Forms App (.NET) project in Visual Studio, rename Form1 to your first form, add forms and classes, and run it.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Creating the Windows Forms project","brief":"Create a C# Windows Forms App (.NET) project, rename Form1 and add your forms and classes.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Task 15 (design submitted)","pages":"0 pages (screenshot only)"},"approach":["Create a new project: Windows Forms App (C#), not the .NET Framework one.","Name it without spaces and save where your teacher says.","Rename Form1 to your first form and accept renaming references.","Add a form for every screen and a class for every object.","Check Program.cs starts the first form and run with F5."],"deliver":["Windows Forms App (C#) project","Form1 renamed","A form for every screen","A class file for every object","Runs without errors"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"example","title":"How to create the project and add forms","steps":["**Create the project:** Open **Visual Studio** (2022). On the start window click **Create a new project** (or **File › New › Project**).","In the search box type **Windows Forms**. Choose **Windows Forms App** with the **C#** tag, *not* the one ending *(.NET Framework)* and not the Visual Basic one. Click **Next**.","**Project name:** a short name with no spaces, e.g. *TuckShop*. **Location:** where your teacher tells you. Tick **Place solution and project in the same directory**. Click **Next**.","**Framework:** choose the newest Long Term Support version offered (e.g. .NET 8.0). Click **Create**.","Press **F5** (or the green **Start** button). An empty window appears: the project works. Close it.","**Rename Form1 and add the other forms:** In **Solution Explorer**, right-click **Form1.cs › Rename**, type **frmLogin.cs** and press Enter. Click **Yes** when asked to rename all references.","**Project › Add Form (Windows Forms)…**, name it **frmMenu.cs**, click **Add**. Repeat for each screen in your navigation structure (Ballyvaren: frmProducts, frmSale, frmReports).","**Project › Add Class…**, name it **Product.cs**, click **Add**. Repeat for each object (Ballyvaren: Sale.cs, SaleLine.cs, Staff.cs, and DataStore.cs for the shared lists).","Open **Program.cs**. Check the last line of Main says `Application.Run(new frmLogin());`."]},{"t":"code","lang":"cs","title":"C#: Program.cs – the whole file (first version)","code":"using System;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    internal static class Program\n    {\n        [STAThread]\n        static void Main()\n        {\n            ApplicationConfiguration.Initialize();\n            Application.Run(new frmLogin());       // the program starts at the login screen\n        }\n    }\n}"},{"t":"warn","text":"If the template list shows only *Windows Forms App (.NET Framework)*, the .NET desktop workload may be missing. Tell your teacher rather than choosing a different template, because some code (e.g. ApplicationConfiguration) differs."}],"diagram":{"kind":"hotspot","title":"The Visual Studio window","caption":"Click each part of Visual Studio.","rows":[[{"label":"Menu / toolbar","detail":"File, Project (Add Form, Add Class), Debug. The green Start button runs the program (F5).","span":4}],[{"label":"Toolbox","detail":"Controls to drag onto a form: Label, TextBox, Button, ComboBox, ListBox, DataGridView, ToolTip. Ctrl + Alt + X.","span":1},{"label":"Form designer","detail":"The form you are laying out. Double-click a control to create its main event handler in code.","span":2},{"label":"Solution Explorer","detail":"Every file: forms, classes, Program.cs. Right-click to rename or add.","span":1}],[{"label":"Code editor","detail":"F7 from the designer. Line numbers, colour coding and IntelliSense suggestions.","span":3},{"label":"Properties (F4)","detail":"(Name), Text, Font, BackColor… and the lightning bolt for events.","span":1}],[{"label":"Error List","detail":"Syntax errors with code (e.g. CS1002), description, file and line. Double-click to jump to the line.","span":4}]],"links":[["Toolbox","Form designer"],["Form designer","Properties (F4)"]]},"check":[],"exam":[],"practice":[{"q":"Add a Help form (frmHelp) to the Ballyvaren project and make the program start on it temporarily so you can check its layout, then put it back.","m":2,"a":"**Project › Add Form (Windows Forms)…** › name **frmHelp.cs** › Add. In **Program.cs** change the last line of Main to `Application.Run(new frmHelp());` and press F5 to view it. When you are happy, change it back to `Application.Run(new frmLogin());` so the program starts at the login screen again."}],"videos":[],"terms":[]},{"id":"c03-p03","spec":"TASK 16: Build – Building forms from your control tables","lessons":[],"summary":"Lay out each form with the Toolbox and set every control's (Name), Text and other properties in the Properties window exactly as your control table says, with user help on every screen.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Building forms from your control tables","brief":"Lay out each form and set every control's properties exactly as your control table says.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Creating the project","pages":"0 pages (screenshots of each form)"},"approach":["Work through each control table row by row.","Set (Name) before making any event handler.","Use DropDownList combo boxes so values can only be chosen.","Set MaxLength and PasswordChar as designed.","Add user help on every screen: a ToolTip with SetToolTip for each control, clear labels, PlaceholderText hints in empty boxes, and a Help button (or F1) that shows instructions in a MessageBox.","Set the Tab order and the form's AcceptButton.","Screenshot each finished form."],"deliver":["Every form laid out from its design","Every (Name) matches my control table","Fonts and colours as designed","Tab order set","User help on every screen: tooltips, clear labels and hints, Help button or F1","Screenshot of each form"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"table","head":["Property","Why it matters"],"rows":[["(Name)","The name your code uses: tbQty.Text. Must match your control table exactly (case matters)."],["Text","What the user sees on a label, button or form title bar."],["MaxLength","A built-in length check on a TextBox."],["DropDownStyle = DropDownList","Stops typing into a ComboBox, so only listed values can be chosen."],["PlaceholderText","A grey hint shown in an empty TextBox, e.g. '1 to 20'."],["ToolTip (component)","Shows a hint when the mouse rests on a control; set in code with SetToolTip."],["KeyPreview = True","Lets the form see key presses first, so F1 can open help."],["TabIndex / Tab Order","The order Tab moves through the controls."]],"caption":"Properties you will set most"},{"t":"example","title":"How to build frmSale from its control table","steps":["Open **frmSale.cs** in the designer. With the form selected, set **Text** to *Tuck Shop – New Sale*, **BackColor**, **Font** (Century Gothic 10) and **StartPosition** CenterScreen in the Properties window (F4).","From the **Toolbox** drag a **Label** to the top. Set **(Name)** *lblTitle*, **Text** *New Sale*, **Font** Century Gothic 20 Bold.","Drag a **ComboBox**; **(Name)** *cmbProduct*, **DropDownStyle** *DropDownList* so users can only choose, not type; make it wide enough to show 'P002 Chocolate Bar (£0.85)'.","Drag a **TextBox** *tbQty* (MaxLength 2) and a **Button** *btnAdd* (Text *Add*) beside it. Add a **ListBox** *lstBasket* and Labels *lblTotal* (Text *Total: £0.00*) and *lblChange* (Text *Change: –*).","Add a TextBox *tbPaid* (MaxLength 6) and Buttons *btnComplete*, *btnCancelSale*, *btnHelp*, *btnBack* with their Text.","Give every box a clear Label beside it (*Product*, *Quantity*, *Amount paid*).","**View › Tab Order**, click the controls in the order the user fills them in, then **View › Tab Order** again to finish.","Select the form and set **CancelButton** to *btnBack*."]},{"t":"code","lang":"cs","title":"C#: frmSale.cs – user help: a ToolTip for each control, placeholder hints and F1 (inside the class; SetUpHelp() is called at the end of frmSale_Load)","code":"        // ---------- user help: tooltips, placeholder hints and F1 ----------\n        private ToolTip tips = new ToolTip();\n\n        // Called at the end of frmSale_Load\n        private void SetUpHelp()\n        {\n            tips.SetToolTip(cmbProduct, \"Choose a product: ID, name and price\");\n            tips.SetToolTip(tbQty, \"Whole number from 1 to 20\");\n            tips.SetToolTip(btnAdd, \"Add this product to the basket (stock is checked first)\");\n            tips.SetToolTip(tbPaid, \"Amount the customer hands over, e.g. 2.00\");\n            tips.SetToolTip(btnComplete, \"Take payment, show the change and reduce the stock\");\n            tips.SetToolTip(btnHelp, \"How to use this screen (or press F1)\");\n            tbQty.PlaceholderText = \"1 to 20\";              // grey hint shown while the box is empty\n            tbPaid.PlaceholderText = \"e.g. 2.00\";\n            this.KeyPreview = true;                         // the form sees key presses before the controls\n            this.KeyDown += frmSale_KeyDown;                // connect the F1 handler\n        }\n\n        private void frmSale_KeyDown(object sender, KeyEventArgs e)\n        {\n            if (e.KeyCode == Keys.F1)\n            {\n                btnHelp_Click(sender, EventArgs.Empty);     // same instructions as the Help button\n                e.Handled = true;\n            }\n        }"},{"t":"warn","text":"Set (Name) **before** you double-click a control to make its event handler. If you rename afterwards, the handler keeps the old name (e.g. button1_Click), which makes your code harder to follow."}],"diagram":{"kind":"hotspot","title":"User help on the New Sale screen","caption":"Click each kind of help a user gets.","rows":[[{"label":"Clear labels","detail":"A label beside every box: Product, Quantity, Amount paid.","span":2},{"label":"Placeholder hints","detail":"Grey text in empty boxes: '1 to 20', 'e.g. 2.00'.","span":2}],[{"label":"Tooltips","detail":"A ToolTip component; SetToolTip gives each control a hint shown on mouse-over.","span":2},{"label":"Help button / F1","detail":"Shows the screen's instructions in a MessageBox; F1 does the same via KeyPreview and KeyDown.","span":2}],[{"label":"Error messages","detail":"Say which box is wrong and what is allowed, then put the cursor back in that box.","span":4}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Build frmLogin for the Ballyvaren practice project from this control table: lblTitle (Label, 'Staff Login'), tbUsername (TextBox), tbPassword (TextBox, hidden), btnLogin (Button, 'Login'), and add user help to it.","m":3,"a":"1 Open frmLogin in the designer; form **Text** 'Tuck Shop – Login', **StartPosition** CenterScreen, **FormBorderStyle** FixedSingle, **MaximizeBox** False. 2 Label: **(Name)** lblTitle, **Text** Staff Login, Font Century Gothic 20 Bold. 3 Labels 'Username' and 'Password' beside two TextBoxes: **(Name)** tbUsername and tbPassword; on tbPassword set **PasswordChar** *. 4 Button: **(Name)** btnLogin, **Text** Login. 5 Form **AcceptButton** = btnLogin. 6 **View › Tab Order**: tbUsername, tbPassword, btnLogin. 7 Help: in the form's constructor after InitializeComponent add\n```\nToolTip tips = new ToolTip();\ntips.SetToolTip(tbUsername, \"Your tuck shop username, e.g. shop1\");\ntips.SetToolTip(tbPassword, \"Your password (shown as stars)\");\ntbUsername.PlaceholderText = \"username\";\n```\n8 F5 to check the password shows as stars, Enter presses Login and the hints appear."}],"videos":[],"terms":[]},{"id":"c03-p04","spec":"TASK 16: Build – Writing your class","lessons":[],"summary":"Turn each object from your design into a C# class with private attributes, a constructor, properties and methods.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Writing your class","brief":"Turn each object from your design into a C# class with private attributes, a constructor, properties and methods.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Building the forms","pages":"0 pages"},"approach":["Make the class public.","Declare the attributes private at the top, with data types.","Write a constructor that sets every attribute.","Add properties: get to read, set only where the value may change.","Add methods for what the object does (calculations, ToCsv, FromCsv, ToString).","Build with Ctrl + Shift + B and fix every error."],"deliver":["A class for each object","Private attributes with types","Constructor sets every attribute","Properties","Methods","Builds with 0 errors"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"example","title":"How to write the Product class","steps":["In Solution Explorer open **Product.cs** (made with Project › Add Class). Visual Studio has written `internal class Product { }`. Change *internal* to **public**.","Type the attributes from your design, each `private` with its data type (decimal for the price).","Type the constructor: same name as the class, one parameter per attribute, and `this.attribute = parameter;` for each.","Add a property for each attribute. Give it a `set` only if the program needs to change it (a product's ID never changes, so ProductID has `get` only).","Add the methods. Build with **Ctrl + Shift + B** and check the Error List shows 0 errors. Then write Sale, SaleLine and Staff the same way."]},{"t":"code","lang":"cs","title":"C#: Product.cs – the whole file","code":"using System;\nusing System.Globalization;\n\nnamespace TuckShop\n{\n    public class Product\n    {\n        // ----- attributes (declared at the start of the class) -----\n        private string productID;\n        private string name;\n        private string category;         // Snack, Drink or Fruit\n        private decimal price;           // £0.10 to £5.00\n        private int stockLevel;          // 0 to 500\n        private int reorderLevel;        // reorder when stock falls to this level\n\n        // ----- constructor: runs when a new Product object is created -----\n        public Product(string productID, string name, string category, decimal price, int stockLevel, int reorderLevel)\n        {\n            this.productID = productID;\n            this.name = name;\n            this.category = category;\n            this.price = price;\n            this.stockLevel = stockLevel;\n            this.reorderLevel = reorderLevel;\n        }\n\n        // ----- properties -----\n        public string ProductID { get { return productID; } }      // read-only: an ID never changes\n        public string Name { get { return name; } set { name = value; } }\n        public string Category { get { return category; } set { category = value; } }\n        public decimal Price { get { return price; } set { price = value; } }\n        public int StockLevel { get { return stockLevel; } set { stockLevel = value; } }\n        public int ReorderLevel { get { return reorderLevel; } set { reorderLevel = value; } }\n\n        // ----- methods -----\n        public bool NeedsReorder()\n        {\n            return stockLevel <= reorderLevel;\n        }\n\n        public void ReduceStock(int qty)\n        {\n            stockLevel = stockLevel - qty;\n        }\n\n        // One line for products.csv, e.g. P001,Crisps,Snack,0.60,40,15\n        public string ToCsv()\n        {\n            return productID + \",\" + name + \",\" + category + \",\" +\n                   price.ToString(\"0.00\", CultureInfo.InvariantCulture) + \",\" + stockLevel + \",\" + reorderLevel;\n        }\n\n        // Builds a Product object from one line of products.csv\n        public static Product FromCsv(string line)\n        {\n            string[] parts = line.Split(',');\n            if (parts.Length != 6)\n            {\n                throw new FormatException(\"expected 6 values but found \" + parts.Length + \": \" + line);\n            }\n            decimal price = decimal.Parse(parts[3], CultureInfo.InvariantCulture);\n            return new Product(parts[0], parts[1], parts[2], price, int.Parse(parts[4]), int.Parse(parts[5]));\n        }\n\n        // What a ComboBox or ListBox shows for this object\n        public override string ToString()\n        {\n            return productID + \" \" + name + \" (£\" + price.ToString(\"0.00\") + \")\";\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: Sale.cs – the whole file (a sale holds a List of SaleLine objects)","code":"using System;\nusing System.Collections.Generic;\nusing System.Globalization;\n\nnamespace TuckShop\n{\n    public class Sale\n    {\n        // ----- attributes -----\n        private string saleID;\n        private DateTime saleDateTime;\n        private List<SaleLine> items;\n\n        // ----- constructor: a new sale starts with an empty basket -----\n        public Sale(string saleID, DateTime saleDateTime)\n        {\n            this.saleID = saleID;\n            this.saleDateTime = saleDateTime;\n            items = new List<SaleLine>();\n        }\n\n        // ----- properties -----\n        public string SaleID { get { return saleID; } }\n        public DateTime SaleDateTime { get { return saleDateTime; } }\n        public List<SaleLine> Items { get { return items; } }\n\n        // ----- methods -----\n        public void AddLine(SaleLine line)\n        {\n            items.Add(line);\n        }\n\n        public decimal Total()\n        {\n            decimal total = 0;\n            foreach (SaleLine line in items)\n            {\n                total = total + line.LineTotal;\n            }\n            return total;\n        }\n\n        // How many of one product are already in this basket\n        public int QtyOf(string productID)\n        {\n            int count = 0;\n            foreach (SaleLine line in items)\n            {\n                if (line.ProductID == productID)\n                {\n                    count = count + line.Qty;\n                }\n            }\n            return count;\n        }\n\n        // One CSV line per item, e.g. S0001,09/11/2026 10:42,P001,2,1.20\n        public List<string> ToCsvLines()\n        {\n            List<string> lines = new List<string>();\n            string when = saleDateTime.ToString(\"dd/MM/yyyy HH:mm\", CultureInfo.InvariantCulture);\n            foreach (SaleLine line in items)\n            {\n                lines.Add(saleID + \",\" + when + \",\" + line.ProductID + \",\" + line.Qty + \",\" +\n                          line.LineTotal.ToString(\"0.00\", CultureInfo.InvariantCulture));\n            }\n            return lines;\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: SaleLine.cs – the whole file","code":"namespace TuckShop\n{\n    public class SaleLine\n    {\n        // ----- attributes -----\n        private string productID;\n        private int qty;\n        private decimal lineTotal;\n\n        // ----- constructor -----\n        public SaleLine(string productID, int qty, decimal lineTotal)\n        {\n            this.productID = productID;\n            this.qty = qty;\n            this.lineTotal = lineTotal;\n        }\n\n        // ----- properties -----\n        public string ProductID { get { return productID; } }\n        public int Qty { get { return qty; } }\n        public decimal LineTotal { get { return lineTotal; } }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: Staff.cs – the whole file","code":"using System;\n\nnamespace TuckShop\n{\n    public class Staff\n    {\n        // ----- attributes -----\n        private string username;\n        private string password;\n\n        // ----- constructor -----\n        public Staff(string username, string password)\n        {\n            this.username = username;\n            this.password = password;\n        }\n\n        // ----- properties -----\n        public string Username { get { return username; } }\n\n        // ----- methods -----\n        public bool CheckLogin(string usernameEntered, string passwordEntered)\n        {\n            return username == usernameEntered && password == passwordEntered;\n        }\n\n        // One line of logins.txt, e.g. shop1,Crisps#7\n        public static Staff FromCsv(string line)\n        {\n            string[] parts = line.Split(',');\n            if (parts.Length != 2)\n            {\n                throw new FormatException(\"expected username,password: \" + line);\n            }\n            return new Staff(parts[0], parts[1]);\n        }\n    }\n}"}],"diagram":{"kind":"hotspot","title":"Inside the Sale class","caption":"Click each part of the class.","rows":[[{"label":"public class Sale","detail":"The class header. public so every form can use it.","span":4}],[{"label":"Attributes","detail":"private fields: saleID, saleDateTime and items, a List of SaleLine objects.","span":2},{"label":"Constructor","detail":"Sale(saleID, saleDateTime): starts with an empty basket.","span":2}],[{"label":"Properties","detail":"SaleID, SaleDateTime, Items: read access from other code.","span":2},{"label":"Methods","detail":"AddLine, Total, QtyOf, ToCsvLines.","span":2}]],"links":[["public class Sale","Attributes"],["Attributes","Properties"],["Constructor","Attributes"]]},"check":[],"exam":[],"practice":[{"q":"Add a method `ItemCount()` to the Sale class that returns the total number of items in the basket, and a read-only property `StockValue` to Product that returns price × stock level.","m":2,"a":"In Sale.cs:\n```\npublic int ItemCount()\n{\n    int count = 0;\n    foreach (SaleLine line in items)\n    {\n        count = count + line.Qty;\n    }\n    return count;\n}\n```\nIn Product.cs:\n```\npublic decimal StockValue { get { return price * stockLevel; } }\n```\nTrace: a basket of 2 Crisps and 1 Water → ItemCount() = 3. Crisps at £0.60 with 40 in stock → StockValue = £24.00."}],"videos":[],"terms":[]},{"id":"c03-p05","spec":"TASK 16: Build – Creating objects and storing them in a List","lessons":[],"summary":"Create objects with new, store them in lists held in a static DataStore class so every form shares the same data, and loop through the lists.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Creating objects and storing them in a List","brief":"Create objects with new, keep them in lists shared by every form, and loop through the lists.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Writing your classes","pages":"0 pages"},"approach":["Use a List for each kind of object: it grows as you add to it.","Keep the lists in one static class so every form shares the same data.","Create objects with new and Add them to the list.","Put shared searches and totals (e.g. quantity sold per product) in the same class.","Only add or remove items in a few clear places."],"deliver":["A List for each kind of object","Lists in one shared place","Objects created and added","Loops to search or total the lists"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"code","lang":"cs","title":"C#: List essentials (examples, inside any method)","code":"List<Product> products = new List<Product>();             // make an empty list\nProduct p = new Product(\"P001\", \"Crisps\", \"Snack\", 0.60m, 40, 15);   // create one object\nproducts.Add(p);                                          // add it to the end of the list\nint howMany = products.Count;                             // how many objects are in it (1)\nProduct first = products[0];                              // the first object (index 0)\nforeach (Product item in products)                        // visit every object in turn\n{\n    MessageBox.Show(item.Name);\n}\nproducts.Remove(p);                                       // remove that object (Count is 0 again)"},{"t":"code","lang":"cs","title":"C#: DataStore.cs – the whole file (first version; file methods are added later)","code":"using System;\nusing System.Collections.Generic;\n\nnamespace TuckShop\n{\n    // One shared place for the program's lists, so every form uses the same data\n    public static class DataStore\n    {\n        public const string LOGINS_FILE = \"logins.txt\";   // one \"username,password\" per line\n\n        public static List<Product> Products = new List<Product>();\n        public static List<Sale> Sales = new List<Sale>();\n        public static string[] Categories = { \"Snack\", \"Drink\", \"Fruit\" };\n\n        // Linear search for a product by ID; null if there is no such product\n        public static Product? FindProduct(string productID)\n        {\n            foreach (Product p in Products)\n            {\n                if (p.ProductID == productID)\n                {\n                    return p;\n                }\n            }\n            return null;\n        }\n\n        // Next ID: \"P\" + one more than the highest number used so far, e.g. P008\n        public static string NextProductID()\n        {\n            int highest = 0;\n            foreach (Product p in Products)\n            {\n                int number;\n                if (p.ProductID.Length > 1 && int.TryParse(p.ProductID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"P\" + (highest + 1).ToString(\"D3\");\n        }\n\n        // Next sale ID: \"S\" + one more than the highest used, e.g. S0006\n        public static string NextSaleID()\n        {\n            int highest = 0;\n            foreach (Sale s in Sales)\n            {\n                int number;\n                if (s.SaleID.Length > 1 && int.TryParse(s.SaleID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"S\" + (highest + 1).ToString(\"D4\");\n        }\n\n        // Total quantity of one product sold across every sale\n        public static int QuantitySold(string productID)\n        {\n            int total = 0;\n            foreach (Sale s in Sales)\n            {\n                total = total + s.QtyOf(productID);\n            }\n            return total;\n        }\n\n        // Takings for one product across every sale\n        public static decimal TakingsFor(string productID)\n        {\n            decimal total = 0;\n            foreach (Sale s in Sales)\n            {\n                foreach (SaleLine line in s.Items)\n                {\n                    if (line.ProductID == productID)\n                    {\n                        total = total + line.LineTotal;\n                    }\n                }\n            }\n            return total;\n        }\n    }\n}"},{"t":"warn","text":"A static list is shared by everything, which is convenient but means any form can change it. Only add or remove items in one or two clear places (the products and sale forms and the load methods), so a logic error is easy to trace."}],"diagram":{"kind":"table-reveal","title":"Trace QuantitySold(\"P001\") for Crisps","caption":"Practice sales. Click to reveal the running total after each sale.","head":["Sale","Crisps in this sale","total"],"rows":[["S0001","2","2"],["S0002","0","2"],["S0003","0","2"],["S0004","1","3"],["S0005","3","6"],["Result","","6 sold"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2]]},"check":[],"exam":[],"practice":[{"q":"Add a method `ProductsInCategory(string category)` to DataStore that returns a new list of every product in that category.","m":2,"a":"Inside DataStore:\n```\npublic static List<Product> ProductsInCategory(string category)\n{\n    List<Product> found = new List<Product>();\n    foreach (Product p in Products)\n    {\n        if (p.Category == category)\n        {\n            found.Add(p);\n        }\n    }\n    return found;\n}\n```\nWith the practice data, ProductsInCategory(\"Fruit\") returns two products: Apple and Banana."}],"videos":[],"terms":[]},{"id":"c03-p06","spec":"TASK 16: Build – Navigating between forms","lessons":[],"summary":"Code the login screen to check logins.txt with three attempts, open the menu with ShowDialog, pass the username across, and return to login on Log Out.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Navigating between forms","brief":"Code the login screen and the menu so the user can move between forms as your navigation structure shows.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Lists","pages":"0 pages"},"approach":["Follow the booklet's login flowchart: read the logins file, split each record, compare username then password.","Limit failed attempts and show how many are left.","Open forms with ShowDialog so the program returns to the right place when a form closes.","Pass data between forms through the constructor (e.g. the username).","Give every screen a way back.","Add logins.txt to the project and set Copy to Output Directory."],"deliver":["Login checks the logins file","Limited attempts with messages","Every navigation route works","A way back from every screen","Data passed between forms where needed"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"example","title":"How to add logins.txt to the project","steps":["**Project › Add New Item…** (Ctrl + Shift + A). Type the name **logins.txt** and click **Add** (in the full dialog choose *Text File* first).","Type two lines: `shop1,Crisps#7` and `manager,Flapjack!9`. Save.","In Solution Explorer click **logins.txt**; in Properties set **Copy to Output Directory** to **Copy if newer**. Visual Studio then copies it next to the .exe in bin\\Debug\\net8.0-windows (the folder name matches your .NET version), where the program looks for it."]},{"t":"code","lang":"cs","title":"C#: frmLogin.cs – the whole file (btnLogin_Click made by double-clicking btnLogin; each record becomes a Staff object)","code":"using System;\nusing System.Drawing;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    public partial class frmLogin : Form\n    {\n        private int attempts = 0;\n        private const int MAX_ATTEMPTS = 3;\n\n        public frmLogin()\n        {\n            InitializeComponent();\n        }\n\n        private void btnLogin_Click(object sender, EventArgs e)\n        {\n            string usernameEntered = tbUsername.Text.Trim();\n            string passwordEntered = tbPassword.Text;\n\n            // presence check\n            if (usernameEntered == \"\" || passwordEntered == \"\")\n            {\n                MessageBox.Show(\"Please enter your username and password.\", \"Login\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                return;\n            }\n\n            // open the logins file, split it into records and check each one\n            bool found = false;\n            try\n            {\n                string[] records = File.ReadAllLines(DataStore.LOGINS_FILE);\n                foreach (string record in records)\n                {\n                    if (record.Trim() == \"\")\n                    {\n                        continue;\n                    }\n                    Staff staff = Staff.FromCsv(record);\n                    if (staff.CheckLogin(usernameEntered, passwordEntered))\n                    {\n                        found = true;\n                        break;\n                    }\n                }\n            }\n            catch (FileNotFoundException)\n            {\n                MessageBox.Show(\"The logins file is missing. Ask the shop manager to restore logins.txt.\",\n                    \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n            catch (Exception ex) when (ex is IOException || ex is FormatException)\n            {\n                MessageBox.Show(\"The logins file could not be read: \" + ex.Message,\n                    \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            if (found)\n            {\n                attempts = 0;\n                tbPassword.Clear();\n                tbPassword.BackColor = SystemColors.Window;\n                frmMenu menu = new frmMenu(usernameEntered);\n                this.Hide();\n                menu.ShowDialog();          // waits here until the menu closes (Log Out)\n                this.Show();\n                tbUsername.Focus();\n            }\n            else\n            {\n                attempts++;\n                tbPassword.Clear();\n                tbPassword.BackColor = Color.MistyRose;\n                if (attempts >= MAX_ATTEMPTS)\n                {\n                    MessageBox.Show(\"Too many failed attempts. The program will now close.\", \"Login\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Stop);\n                    Application.Exit();\n                }\n                else\n                {\n                    MessageBox.Show(\"Username or password incorrect. Attempts left: \" + (MAX_ATTEMPTS - attempts),\n                        \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                    tbPassword.Focus();\n                }\n            }\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: frmMenu.cs – the whole file","code":"using System;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    public partial class frmMenu : Form\n    {\n        private string staffUsername;\n\n        // the login form passes in who has logged in\n        public frmMenu(string user
