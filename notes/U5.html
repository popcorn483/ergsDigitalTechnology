ear here as it is typed.'","Points label"],["'This table shows the places already recorded for the chosen event.'","Results grid"],["'Save records the result; Clear empties the form; Back returns to the menu.'","Three buttons"]],"caption":"What the labels should say"},{"t":"tip","text":"Wireframes are meant to be basic. Spend the time on clear labels explaining what each part does, not on colours: the detail comes in Task 13A."},{"t":"key","title":"What good work includes","items":["One wireframe per screen, each on its own page with the screen name as a heading.","A callout for every element, joined to it by a line or arrow, saying what it is and what happens when it is used (e.g. which screen a button opens, what an error does).","Simple shapes are enough; the explanation in the callouts matters more than the look."]},{"t":"note","text":"**Typical length:** About one page per screen. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 11 checklist","items":["List of every screen I need, from the scenario","Separate wireframe document in Initial Designs","One wireframe per screen","Labels with arrows explaining each part","Screen name above each wireframe"]}],"diagram":{"kind":"hotspot","title":"Wireframe: Ballyvaren results screen","caption":"Click each part of the practice wireframe.","rows":[[{"label":"Title","detail":"'Record a Result' – tells the user which screen they are on.","span":4}],[{"label":"Event list","detail":"Drop-down list of events (100m, 200m, 800m, Long Jump, Shot Put).","span":2},{"label":"Athlete list","detail":"Drop-down list of athletes, shown as ID, name, year and house.","span":2}],[{"label":"Position","detail":"Place 1–6.","span":1},{"label":"Time / distance","detail":"Seconds or metres; the unit label changes with the event.","span":1},{"label":"Points","detail":"Points for the position, shown as it is typed.","span":2}],[{"label":"Results grid","detail":"Places already recorded for the chosen event.","span":4}],[{"label":"Save","detail":"Validates and saves.","span":1},{"label":"Clear","detail":"Empties the form.","span":1},{"label":"Help","detail":"Explains the screen.","span":1},{"label":"Back","detail":"Returns to the menu.","span":1}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"List the screens needed for the Ballyvaren practice system and write two wireframe labels for the menu screen.","m":3,"a":"Screens: Login, Menu, Athletes, Results, Leaderboard (five screens). Menu labels: (1) 'These buttons take the user to the Athletes, Results or Leaderboard screen.' (2) 'The Log Out button closes the menu and returns to the login screen so that another member of staff can log in.' (Also good: 'The name of the logged-in user appears here.')"}],"videos":[],"terms":[]},{"id":"c02-p08","spec":"TASK 12: User Feedback I","lessons":[],"summary":"Explain, screen by screen, how the designs were reviewed, under the subtitles Issues Identified and Alterations to Design, and how the client agreed the changes.","blocks":[{"t":"p","text":"Designs are rarely right first time. In a few paragraphs, explain how you reviewed the designs and noticed improvements. Use two subtitles: **Issues Identified** (for example a logo, colour changes, consistent design, font) and **Alterations to Design** (a few 'redrafts', discussed, and how the client agreed). Write **one paragraph per screen**, saying how it was reviewed by the management team, manager or client and what should be changed."},{"t":"p","text":"The booklet's suggestions for fixes are colour scheme change, layout of buttons, and logo included, but do not just copy these. Look at your own wireframes and find the real weaknesses."},{"t":"table","head":["Look for","Question"],"rows":[["Consistency","Is the title, font and button position the same on every screen?"],["Layout","Do the boxes follow the order the user fills them in? Are the main buttons where the eye ends up?"],["Missing items","Is there a Help button and a way back on every screen? Is there anywhere for error messages?"],["Input method","Could a typed box be a drop-down list instead, so it cannot be mistyped?"],["Readability","Is the text big enough with good contrast?"]],"caption":"Reviewing a design"},{"t":"example","title":"Worked example: Ballyvaren results screen","steps":["**Issues Identified:** 'When the results screen was reviewed with the Head of PE, three issues were identified. The athlete's name was typed into a text box, which would allow names to be misspelt and would not link the result to the right athlete. There was no Help button, unlike the login screen. Nothing showed which places had already been recorded, so a place could easily be given twice.'","**Alterations to Design:** 'The name text box was replaced with a drop-down list of athletes showing their ID, year group and house. A Help button was added in the same bottom-right position as on every other screen. A table showing the results already recorded for the chosen event was added below the inputs. The Head of PE reviewed the redraft and agreed that the changes make recording results quicker and less error-prone.'"]},{"t":"tip","text":"Save each redraft. Put the before and after side by side in your write-up so the moderator can see what changed."},{"t":"key","title":"What good work includes","items":["An opening sentence saying who reviewed the designs and their overall view.","'Issues Identified' as a numbered list by screen, with lettered issues under each screen.","'Alterations to Design' using the same numbers and letters, so each issue is matched by the change that fixes it.","Changes that matter to the user (input method, missing help, clarity), not only colours and logos."]},{"t":"note","text":"**Typical length:** Two to three pages. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"compare","head":["Vague","Matched issue and alteration"],"rows":[["Issue","The results screen needs work.","3. Results screen – a) the athlete's name is typed, so it can be misspelt; b) there is no way to see places already given."],["Alteration","It was improved.","3. Results screen – a) the name box is replaced by a drop-down list of athletes; b) a table of results already recorded for the event is added."]]},{"t":"todo","title":"TASK 12 checklist","items":["Heading 2 'User Feedback I'","Subtitle 'Issues Identified'","Subtitle 'Alterations to Design'","One paragraph per screen","Who reviewed it (client/manager) and how they agreed","Redrafts saved and shown"]}],"diagram":{"kind":"compare","title":"Before and after review","caption":"Toggle between the first wireframe and the redraft.","states":[{"label":"First draft","points":["Athlete name typed into a text box","No Help button","No view of places already recorded","Title font different from the login screen"],"art":null},{"label":"After feedback","points":["Athlete chosen from a drop-down list","Help button bottom-right, as on every screen","Table of results already recorded for the event","Same Century Gothic title as every screen"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write an Issues Identified and an Alterations to Design paragraph for a fictional login screen whose first draft had a password box that showed the password, no title and a 'Forgotten password?' link in red.","m":4,"a":"**Issues Identified:** 'When the login screen was reviewed with the client, it was noted that the password was visible as it was typed, which is a security risk when others are nearby. The screen had no title, so users could not tell which screen they were on, and the red link looked like an error message.' **Alterations to Design:** 'The password box was set to show * characters (PasswordChar). A title label \"Staff Login\" was added in the same font and position as on every other screen. The link was changed to the dark blue used for links throughout. The client approved the redrafted design.'"}],"videos":[],"terms":[]},{"id":"c02-p09","spec":"TASK 13A: Final designs / outputs","lessons":[],"summary":"Produce final designs (storyboards) detailed enough for third-party implementation: what and where each control is, fonts, sizes, colours, validation and help features.","blocks":[{"t":"p","text":"Now implement the changes from User Feedback I and add great detail to your designs, enough for **third-party implementation**: anyone could pick up your designs and build exactly the same system. Make **separate documents** for this task in your **Final Designs** folder, and do it for every screen to this level of detail."},{"t":"table","head":["Each final design should include","Ballyvaren results screen example"],"rows":[["What the buttons do (in more detail than before)","btnSave: checks every box (see validation), saves the result to results.csv, shows the points awarded, refreshes the results table, then clears the athlete, position and time boxes but keeps the event chosen."],["Where the buttons go","Bottom row, left to right: Save, Clear, Back; Help in the bottom-right corner."],["What validation will be done on the inputs","Event and athlete: presence (must be chosen). Position: whole number 1–6, not already given in this event; athlete not already in this event. Time or distance: a number greater than 0 and no more than 600 seconds or 100 metres."],["What help features are available","Help button opens a message explaining the screen. Each error message names the box to fix. A tooltip on the position box says 'Whole number 1–6'."],["Font, size, colour, alignment of each control","Title: Century Gothic, Bold, 20 pt, black, centred. Labels: Century Gothic 10 pt, left. Background: light green. Text boxes: white."]],"caption":"The detail needed"},{"t":"example","title":"Tutorial: Build a storyboard","steps":["Either draw the screen in Word with shapes, or build the empty form in Visual Studio and paste a screenshot (the booklet's example is a screenshot of the real form).","Put the screen title above, e.g. *Record a Result Screen*.","Add an annotation box for every control: its purpose, font, size, colour, alignment and, for inputs, its validation.","Put the **help features in a different-coloured text box** from your other labels, as the booklet asks.","Repeat for every screen."]},{"t":"warn","text":"A storyboard that only says 'This is a text box' is not enough for third-party implementation. Ask yourself: could a classmate build this exact screen from my design without asking me anything?"},{"t":"key","title":"What good work includes","items":["Usually built from a screenshot of the real form in Visual Studio, with callouts all round it.","Each callout gives the purpose of the control and its formatting: font, size, colour and alignment.","Buttons say exactly what happens, including validation and which screen opens next.","Help features in a different-coloured callout; any image or icon has its source stated."]},{"t":"note","text":"**Typical length:** About one page per screen, and the final designs are the longest part of the Design chapter. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 13A checklist","items":["Separate Final Designs document","Every screen designed","Changes from User Feedback I made","Purpose and position of every button","Validation for every input","Font, size, colour and alignment for controls","Help features in a different-coloured box"]}],"diagram":{"kind":"hotspot","title":"Storyboard annotations","caption":"Click each annotation type on a final design.","rows":[[{"label":"Title label","detail":"Text, font, size, colour, alignment and why it is there.","span":2},{"label":"Logo / branding","detail":"Where it appears and that it is the same on every screen.","span":2}],[{"label":"Input boxes","detail":"What is entered, the validation applied, colour and font.","span":2},{"label":"Lists","detail":"What items they hold and where those come from.","span":2}],[{"label":"Buttons","detail":"Exactly what happens when clicked, including which screen opens next.","span":2},{"label":"Help (different colour)","detail":"Help button, tooltips, where error messages appear.","span":2}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write the full storyboard annotation for the Ballyvaren 'time or distance' text box.","m":3,"a":"'tbPerformance – a text box where staff enter the athlete's time in seconds (track events) or distance in metres (field events). Positioned beside the position box, with a label to its right (lblUnit) that shows \"seconds\" or \"metres\" for the chosen event. Font: Century Gothic, regular, 10 pt, black text on white. Validation: must be a number (type check using decimal.TryParse), greater than 0, and no more than 600 seconds or 100 metres (range check). If invalid, a message box explains the rule and the cursor returns to this box.' **Help (different-coloured box):** 'A tooltip appears when the mouse is over the box: \"e.g. 13.42 seconds or 4.62 metres\".'"}],"videos":[],"terms":[]},{"id":"c02-p10","spec":"TASK 13B: Control tables","lessons":[],"summary":"For each final storyboard, make a control table listing every control's item number, name, type, value and function.","blocks":[{"t":"p","text":"For each final storyboard you also need a **control table**. It lists every control on that screen, what value it is set to and why it is there (its purpose or function). Every box on the screen needs an appropriate name, written in camel case with a prefix showing its control type."},{"t":"table","head":["Item Number","Control Name","Control Type","Value","Function of Control"],"rows":[["1","lblTitle","Label","Record a Result","To display the title of the screen"],["2","cmbEvent","Combobox","(list of events)","To choose the event"],["3","cmbAthlete","Combobox","(list of athletes)","To choose the athlete"],["4","tbPosition","Textbox","(blank)","To enter the athlete's place (1–6)"],["5","tbPerformance","Textbox","(blank)","To enter the time in seconds or distance in metres"],["6","lblUnit","Label","seconds / metres","To show the unit for the chosen event"],["7","lblPoints","Label","Points: –","To show the points for the position as it is typed"],["8","dgvEventResults","DataGridView","(results for the event)","To show the places already recorded for the event"],["9","btnSave","Button","Save","To validate and save the result"],["10","btnClear","Button","Clear","To empty every box"],["11","btnHelp","Button","Help","To explain how to use the screen"],["12","btnBack","Button","Back","To close this screen and return to the menu"]],"caption":"Control table: Ballyvaren Results screen (practice)"},{"t":"table","head":["Prefix","Control type","Example"],"rows":[["lbl","Label","lblTitle"],["llbl","Link label","llblForgot"],["tb","Textbox","tbUsername"],["btn","Button","btnLogin"],["cmb","Combobox (drop-down)","cmbHouse"],["nud","Numeric up down","nudPosition"],["dtp","DateTimePicker","dtpDate"],["chk","CheckBox","chkMedical"],["lst","ListBox","lstAthletes"],["dgv","DataGridView","dgvHouses"],["frm","Form","frmResults"]],"caption":"Naming prefixes (camel case)"},{"t":"tip","text":"Use exactly these names when you build. In Visual Studio the **(Name)** property of each control must match your control table, so your design, your code and your testing all line up."},{"t":"key","title":"What good work includes","items":["A control table straight after each screen's storyboard.","Every control is listed, including labels and picture boxes, not just inputs and buttons.","Many write-ups add a Screen column next to the control type, so every row says which form it belongs to."]},{"t":"note","text":"**Typical length:** One to two pages per screen. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"compare","head":["Too thin","Complete row"],"rows":[["Label","lblTitle – label","lblTitle | Label | Results | Record a Result | To show the user which screen they are on"],["Button","btnSave – saves","btnSave | Button | Results | Save | To check every input and, if valid, save the result and show the points awarded"]]},{"t":"todo","title":"TASK 13B checklist","items":["A control table for every final storyboard","All five columns","Every control on the screen listed, including labels","Every name has a type prefix and is in camel case","Value and function filled in for each"]}],"diagram":{"kind":"match","title":"Match the prefix","caption":"Match each control name to its control type.","pairs":[["tbSurname","Textbox"],["btnSave","Button"],["cmbHouse","Combobox (drop-down list)"],["llblForgot","Link label"],["dgvHouses","DataGridView"],["nudPosition","Numeric up down"]]},"check":[],"exam":[],"practice":[{"q":"Write the control table for the Ballyvaren login screen (title, username, password, a link label to a help message, login button).","m":4,"a":"1 | lblTitle | Label | Staff Login | To display the title of the screen\n2 | tbUsername | Textbox | (blank) | To allow the user to enter their username\n3 | tbPassword | Textbox | (blank), PasswordChar * | To allow the user to enter their password, hidden as it is typed\n4 | llblForgot | Link label | Forgotten password? | To show a message telling staff to contact the Head of PE\n5 | btnLogin | Button | Login | To check the username and password against logins.txt and, if valid, open the menu"}],"videos":[],"terms":[]},{"id":"c02-p11","spec":"TASK 13C: Processes – flowcharts or pseudocode","lessons":[],"summary":"Design at least one process per screen as a flowchart or pseudocode, including validation and error messages, covering a whole section of inputs at once.","blocks":[{"t":"p","text":"Create flowcharts or pseudocode for how data is going to be input into each screen, or for any process that happens on the screen. **Each screen must have at least one process designed.** Make separate documents for this task."},{"t":"list","items":["Flowcharts are good for simple screens, as they take a long time to design in Microsoft Word.","Pseudocode can be written in Notepad++, which has automatic line numbering and colouring."],"ordered":false},{"t":"p","text":"Your designs should show the **validation** with suitable **error messages**, so that data entered is sensible, reasonable and within acceptable limits. Do not draw a flowchart for each single piece of data: design whole **sections** (for example, all the result details in one flowchart). Think too about the calculations: how will the points and the house totals be worked out?"},{"t":"code","lang":"ps","title":"Pseudocode: frmResults – when the user presses the Save button","code":"1.  IF no event chosen OR no athlete chosen THEN\n2.      DISPLAY \"Please choose an event and an athlete\"\n3.      STOP\n4.  END IF\n5.  IF tbPosition.Text is not a whole number THEN\n6.      DISPLAY \"The position must be a whole number\"\n7.      STOP\n8.  END IF\n9.  IF position < 1 OR position > 6 THEN\n10.     DISPLAY \"The position must be between 1 and 6\"\n11.     STOP\n12. END IF\n13. FOR EACH result IN results\n14.     IF result event = chosen event AND result position = position THEN\n15.         DISPLAY \"Position \" + position + \" has already been given\"\n16.         STOP\n17.     END IF\n18.     IF result event = chosen event AND result athlete = chosen athlete THEN\n19.         DISPLAY \"This athlete already has a result in this event\"\n20.         STOP\n21.     END IF\n22. END FOR\n23. IF tbPerformance.Text is not a number OR value <= 0 THEN\n24.     DISPLAY \"Enter a time or distance greater than 0\"\n25.     STOP\n26. END IF\n27. SET points AS POINTS[position - 1]      // 10, 8, 6, 4, 2, 1\n28. CREATE new result and ADD it to the results list\n29. SAVE the results list to results.csv\n30. DISPLAY athlete name + \" position \" + position + \": \" + points + \" points\""},{"t":"tip","text":"Hand-trace your design with valid and invalid data before you build. Position 3 → POINTS[2] = **6 points**; position 6 → POINTS[5] = **1 point**; position 7 is stopped at line 9."},{"t":"key","title":"What good work includes","items":["Pseudocode (or a flowchart) placed with each screen's final design, so every screen has its processes next to it.","One block per event, each starting with the trigger, e.g. 'When the user presses the Save button'.","Line numbers, consistent keywords (IF … END IF, FOR EACH … END FOR) and the error message text that will be shown."]},{"t":"note","text":"**Typical length:** Half a page to a page per screen. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 13C checklist","items":["Separate document for processes","At least one flowchart or pseudocode per screen","Validation and error messages shown","Inputs designed in sections, not one per item","Calculations shown step by step","Line numbers on pseudocode"]}],"diagram":{"kind":"flow","direction":"tb","title":"Flowchart: validate and save a result","caption":"Step through the Ballyvaren results process (practice).","nodes":[{"id":"s","label":"START: Save clicked","detail":"Event: btnSave_Click.","shape":"start"},{"id":"i","label":"INPUT result details","detail":"Event, athlete, position, time or distance.","shape":"io"},{"id":"p","label":"Event and athlete chosen?","detail":"Presence checks on the two drop-down lists.","shape":"decision"},{"id":"q","label":"Position 1–6?","detail":"Type check (whole number) and range check.","shape":"decision"},{"id":"d","label":"Position and athlete free in event?","detail":"Linear search of the results list.","shape":"decision"},{"id":"t","label":"Time/distance > 0?","detail":"Type check (decimal) and range check.","shape":"decision"},{"id":"e","label":"DISPLAY error","detail":"Say which box is wrong and what is allowed; return to that box.","shape":"io"},{"id":"c","label":"Points = POINTS[position − 1]","detail":"10, 8, 6, 4, 2, 1.","shape":"process"},{"id":"v","label":"Save to results.csv","detail":"Add to list, write the file.","shape":"store"},{"id":"x","label":"DISPLAY points; END","detail":"e.g. 'Aoife Kelly: position 1 in the 100m, 10 points.'","shape":"end"}],"edges":[["s","i"],["i","p"],["p","q","yes"],["p","e","no"],["q","d","yes"],["q","e","no"],["d","t","yes"],["d","e","no"],["t","c","yes"],["t","e","no"],["c","v"],["v","x"]]},"check":[],"exam":[],"practice":[{"q":"Write pseudocode, in the booklet's numbered style, for working out the house totals for the leaderboard: reset every house to 0, then add each result's points to the house of the athlete who scored them.","m":4,"a":"1. FOR EACH house IN houses\n2.     SET house total AS 0\n3. END FOR\n4. FOR EACH result IN results\n5.     FIND the athlete whose ID = result athlete ID\n6.     IF athlete not found THEN\n7.         SKIP to the next result\n8.     END IF\n9.     SET points AS POINTS[result position - 1]\n10.    FOR EACH house IN houses\n11.        IF house name = athlete house THEN\n12.            SET house total AS house total + points\n13.        END IF\n14.    END FOR\n15. END FOR\n16. SORT houses by total, highest first"}],"videos":[],"terms":[]},{"id":"c02-p12","spec":"TASK 14: Navigational structure","lessons":[],"summary":"Draw a navigational structure diagram showing every screen and how the user gets from one form to another.","blocks":[{"t":"p","text":"**PREP:** Review the scenario and your user interface designs. Think about how the screens connect to one another."},{"t":"p","text":"Create a **navigational structure diagram** that shows all the screens you have designed and how you get from one form to another. Use the form names from your control tables (frmLogin, frmMenu…). Draw it as a tree: the first screen at the top, the screens it opens below it, joined by arrows."},{"t":"example","title":"Tutorial: Draw it in Word","steps":["**Insert › SmartArt › Hierarchy › Organization Chart** gives a ready-made tree, or use **Insert › Shapes** with rectangles and arrows.","Put **frmLogin** at the top: the program always starts there.","Below it put the screen a successful login opens (**frmMenu**).","Below the menu put each screen its buttons open (**frmAthletes**, **frmResults**, **frmLeaderboard**).","Add arrows for every route, including back routes (Back buttons, Log Out) if your scenario needs them. Label arrows with the button that causes the move."]},{"t":"table","head":["From","Button","To"],"rows":[["frmLogin","btnLogin (valid login)","frmMenu"],["frmMenu","btnAthletes","frmAthletes"],["frmMenu","btnResults","frmResults"],["frmMenu","btnLeaderboard","frmLeaderboard"],["frmAthletes / frmResults / frmLeaderboard","btnBack","frmMenu"],["frmMenu","btnLogOut","frmLogin"]],"caption":"Ballyvaren navigation (practice)"},{"t":"tip","text":"Check the diagram against your control tables: every button that opens a screen should appear as an arrow, and every form should appear in the diagram."},{"t":"key","title":"What good work includes","items":["A single tree diagram using the form names (frmLogin, frmMenu…), every form included, arrows showing the direction of travel.","Different user types branch from the login form if the scenario has them."]},{"t":"note","text":"**Typical length:** One page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 14 checklist","items":["Heading 2 'Navigational Structure'","Every screen I designed appears","Form names match my control tables","Arrows show how to get from one form to another","Back and log-out routes shown"]}],"diagram":{"kind":"flow","direction":"tb","title":"Navigation structure: Ballyvaren (practice)","caption":"Step through how the user moves between forms.","nodes":[{"id":"l","label":"frmLogin","detail":"Start screen. Three attempts.","shape":"start"},{"id":"m","label":"frmMenu","detail":"Opened by a valid login. Log Out returns to frmLogin.","shape":"process"},{"id":"a","label":"frmAthletes","detail":"Add, edit and search athletes. Back returns to the menu.","shape":"process"},{"id":"r","label":"frmResults","detail":"Record results. Back returns to the menu.","shape":"process"},{"id":"b","label":"frmLeaderboard","detail":"House totals and top athletes. Back returns to the menu.","shape":"process"}],"edges":[["l","m","valid login"],["m","a","Athletes"],["m","r","Results"],["m","b","Leaderboard"],["m","l","Log Out"]]},"check":[],"exam":[],"practice":[{"q":"The Head of PE asks for an Events screen (frmEvents) where new events can be added, opened from the menu and only visible to the user 'headofpe'. Update the navigation table and say how the diagram changes.","m":2,"a":"Add: frmMenu | btnEvents (shown only when the logged-in user is headofpe) | frmEvents, and frmEvents | btnBack | frmMenu. On the diagram, add a fourth box under frmMenu labelled frmEvents with an arrow labelled 'Events (Head of PE only)', and a back arrow to the menu."}],"videos":[],"terms":[]},{"id":"c02-p13","spec":"TASK 15: User Feedback II","lessons":[],"summary":"Write a paragraph explaining that the client has approved the final designs, and come back to it later if the finished product differs from the designs.","blocks":[{"t":"p","text":"This should be a paragraph explaining that the client (if there is a name in the scenario, use it) has **approved the designs**. It closes the design stage: the client has seen the final storyboards, control tables, processes and navigation, and agreed that they meet the requirements."},{"t":"p","text":"It is important to **come back to this paragraph** once you have built the system. If your finished product differs from your designs (a button moved, a screen merged, an extra check added), explain the changes here and why the client agreed to them. That way your designs and your program never contradict each other."},{"t":"h","text":"Paragraph framework"},{"t":"list","items":["*The final designs were presented to [client name from the scenario], including…*","*[Client] confirmed that the designs meet requirements … because…*","*[Client] approved the designs on the condition that…* (optional)","**Added after building:** *During development, … was changed from the design because… [Client] agreed to this change because…*"],"ordered":true},{"t":"example","title":"Worked example: Ballyvaren (practice)","steps":["'The final storyboards, control tables, pseudocode and navigation structure were presented to the Head of PE at Ballyvaren High School. The Head of PE confirmed that the results screen records every detail written on the current paper sheets and that choosing events and athletes from drop-down lists will reduce errors.'","'The Head of PE approved the designs for development.'","Added after building: 'During development, a \"Points\" label was added to the results screen, which was not in the final design. It shows the points for the position as it is typed, so staff can check them before saving. The Head of PE agreed that this supports requirement 9.'"]},{"t":"warn","text":"Do not invent a long conversation. Keep it to what was approved and, later, what changed and why."},{"t":"key","title":"What good work includes","items":["States clearly that the client approved the designs.","Then lists each difference between the final designs and the finished program, with the reason and the client's agreement (a removed button, an extra field, a changed layout)."]},{"t":"note","text":"**Typical length:** Half a page to a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 15 (User Feedback II) checklist","items":["Heading 2 'User Feedback II'","Client named (if the scenario names one)","States the designs were approved","Revisited after building: differences explained"]}],"diagram":{"kind":"timeline","title":"Where feedback happens","caption":"Click each point where the client sees your work.","items":[{"label":"Wireframes","detail":"Task 11: first ideas."},{"label":"User Feedback I","detail":"Task 12: issues identified, alterations made, redrafts agreed."},{"label":"Final designs","detail":"Task 13: storyboards, control tables, processes, navigation."},{"label":"User Feedback II","detail":"Task 15: the client approves the designs."},{"label":"After the build","detail":"Return to User Feedback II to explain any differences between designs and product."}]},"check":[],"exam":[],"practice":[{"q":"While building, a pupil merged the Ballyvaren 'Search Athletes' and 'Athletes' screens into one form. Write the paragraph to add to User Feedback II.","m":2,"a":"'During development, the separate Search Athletes screen shown in the final designs was combined with the Athletes screen, so the search box and the list of athletes now appear on one form (frmAthletes). This was changed because staff would otherwise have to move between two screens to find and then edit an athlete. The Head of PE reviewed the change and agreed that it makes editing quicker; requirement 5 is still met.'"}],"videos":[],"terms":[]},{"id":"c02-p14","spec":"TASK 15: Collate your work and submit","lessons":[],"summary":"Collate all the design work into one document and submit it to Google Classroom in both PDF and Word format.","blocks":[{"t":"p","text":"Your design work is in several documents: the Write Up, the Initial Designs, the Final Designs and the processes. Collate it into **one document** and submit it to **Google Classroom**. Save it in both **PDF and Microsoft Word** format."},{"t":"example","title":"Tutorial: Collate and export","steps":["Open your Write Up. Under the right headings, insert each design document in the order of the tasks: wireframes after the data requirements, then User Feedback I, final designs, control tables, processes, navigation, User Feedback II.","To bring in a whole document: **Insert › Object › Text from File…** and choose the document. Or open it, **Ctrl + A**, **Ctrl + C**, and paste into the Write Up.","Give each design its own heading (Heading 3, e.g. *Final Design – Results Screen*) so it appears in the contents.","**References › Update Table › Update entire table**.","**File › Save As › Browse** and save as **Word Document (.docx)**; then **File › Save As** again and choose **PDF (*.pdf)**.","In Google Classroom, open the assignment, **Add or create › File**, attach both files and click **Turn in**."]},{"t":"table","head":["Check before you turn in","Why"],"rows":[["Open the PDF and scroll through every page","Shapes and grouped wireframes sometimes move when exported"],["Contents page updated","Page numbers change once designs are inserted"],["No name anywhere","Work is identified only by candidate and centre number"],["Both .docx and .pdf attached","The booklet asks for both formats"]],"caption":"Before turning in"},{"t":"warn","text":"Inserted pictures can lose their position when pasted. Set wireframe images and grouped shapes to **In Line with Text** (Layout Options) before you export, so they stay where you put them."},{"t":"key","title":"What good work includes","items":["Designs collated in task order with a heading for each screen, so the contents page lists every screen."]},{"t":"todo","title":"TASK 15 (submission) checklist","items":["All design documents collated into the Write Up in task order","Headings for each design","Table of contents updated","Saved as Word (.docx)","Saved as PDF","PDF checked page by page","Both turned in on Google Classroom"]}],"diagram":{"kind":"flow","direction":"lr","title":"Collate and submit","caption":"Step through the submission process.","nodes":[{"id":"a","label":"Separate documents","detail":"Wireframes, final designs, control tables, processes.","shape":"store"},{"id":"b","label":"Insert into Write Up","detail":"In task order, each with a heading.","shape":"process"},{"id":"c","label":"Update contents","detail":"References › Update Table.","shape":"process"},{"id":"d","label":"Save .docx and .pdf","detail":"File › Save As twice.","shape":"process"},{"id":"e","label":"Turn in","detail":"Google Classroom: attach both files.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[],"exam":[],"practice":[{"q":"After exporting to PDF a pupil finds their wireframe labels have moved away from the arrows. Explain how to fix this before resubmitting.","m":2,"a":"In Word select all the shapes, text boxes and arrows of one wireframe (Shift + click each) and **Shape Format › Group** them so they move as one object. Then click the group's **Layout Options** and choose **In Line with Text** so it sits in the text flow. Repeat for each wireframe, save, export to PDF again and check every page before turning in. (Alternatively, take a screenshot of each grouped wireframe and insert the picture in line with text.)"}],"videos":[],"terms":[]}]},{"id":"c03","n":3,"title":"Building it in Visual Studio","intro":"TASK 16: build your program in C# (Windows Forms, Visual Studio) and record every error you fix. Step-by-step tutorials on the fictional Ballyvaren High School Sports Day practice project: forms, classes, lists, navigation, files, validation, calculations, display, searching, sorting and debugging.","pages":[{"id":"c03-p01","spec":"TASK 16: Build the project in Visual Studio + record errors","lessons":[],"summary":"Set up a Corrective Actions document before you write any code, then build your program screen by screen, screenshotting every error, its fix and the working result.","blocks":[{"t":"p","text":"Task 16 is where you turn your designs into a working C# program. The booklet asks you to create a Microsoft Word document called **Corrective Actions** before you start. Whenever your code breaks while you build the system, screenshot and paste in:"},{"t":"list","items":["the error, or the code that caused the error;","a screenshot of the code fixed;","a short explanation of how you fixed the error."],"ordered":false},{"t":"p","text":"Then fix the code and screenshot the working product again. You will be grateful for this when it comes to testing: Task 19B needs 3–5 corrective actions with screenshots, and your evaluation asks what went well and what did not."},{"t":"h","text":"A sensible build order"},{"t":"table","head":["Step","Build","Page in this chapter"],"rows":[["1","Create the Windows Forms project and rename Form1","Creating the Windows Forms project"],["2","Lay out every form from your control tables, naming every control","Building forms from your control tables"],["3","Write a class for each object","Writing your class"],["4","Store objects in lists","Objects in a List"],["5","Login, menu and navigation","Navigating between forms"],["6","Save and load files","Saving and loading files"],["7","Validation on every input","Input validation"],["8","Calculations","Calculations"],["9","Display, search, sort","Displaying data; Searching and sorting"],["10","Keep the error log going all the way through","Recording errors as you build"]],"caption":"Build in small steps and run (F5) after each one"},{"t":"tip","text":"Build a little, run it, fix it, screenshot it. A program written all at once and run at the end produces dozens of errors at the same time, which are much harder to fix and to document."},{"t":"note","text":"Practice project only: build the Ballyvaren sports day system to learn the techniques, then write your own program for this year's CCEA scenario. The Ballyvaren code is a model of techniques; your scenario will need different classes, forms, rules and calculations."},{"t":"key","title":"What good work includes","items":["Errors captured as they happen: a screenshot of the code (with line numbers visible) and of the wrong output, then the corrected code with the changed line highlighted and the new output.","A sentence before the fix saying what was wrong, and a sentence after saying what was changed and why it works.","Small errors count too: a typing mistake in a message, a button that opens the wrong form, a total that never updates."]},{"t":"note","text":"**Typical length:** Half a page per error. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 16 checklist","items":["Corrective Actions Word document created","Every screen built from my final designs and control tables","A class for each object","Validation and error messages on every input","Data saved and loaded","Every error screenshotted with its fix and an explanation","Screenshots of the working program"]}],"diagram":{"kind":"cycle","title":"The build loop","caption":"Click each stage: repeat it for every feature.","items":[{"label":"Build one feature","detail":"One form, one button, one method: small enough to test straight away."},{"label":"Run (F5)","detail":"Start the program and try the feature with valid and invalid data."},{"label":"Screenshot the error","detail":"Error List, exception message or wrong output, with the code that caused it."},{"label":"Fix it","detail":"Read the message, find the line, change the code."},{"label":"Screenshot the fix","detail":"The corrected code and the program now working."},{"label":"Explain it","detail":"Two or three sentences in Corrective Actions: what went wrong, why, how it was fixed."}]},"check":[],"exam":[],"practice":[{"q":"Set up your Corrective Actions document so it is ready to use. Describe its layout.","m":2,"a":"Create a Word document called **Corrective Actions** in the candidate folder, with the same Normal style, header and footer as the Write Up. For each error add a Heading 2 **Corrective Action 1**, **Corrective Action 2**… and under it: (1) a screenshot of the error or the code causing it (Windows + Shift + S, then paste); (2) a screenshot of the fixed code; (3) a screenshot of the working result; (4) two or three sentences explaining what went wrong and how it was fixed. Numbering them now means the test table can later refer to 'Corrective Action 3'."}],"videos":[],"terms":[]},{"id":"c03-p02","spec":"TASK 16: Build – Creating the Windows Forms project","lessons":[],"summary":"Create a C# Windows Forms App (.NET) project in Visual Studio, rename Form1 to your first form, add forms and classes, and run it.","blocks":[{"t":"p","text":"Your program is a **Windows Forms App** written in C#. Visual Studio creates the project for you: a solution containing a project, a first form and a Program.cs file that starts the program."},{"t":"example","title":"Tutorial: Create the project","steps":["Open **Visual Studio** (2022). On the start window click **Create a new project** (or **File › New › Project**).","In the search box type **Windows Forms**. Choose **Windows Forms App** with the **C#** tag, *not* the one ending *(.NET Framework)* and not the Visual Basic one. Click **Next**.","**Project name:** a short name with no spaces, e.g. *SportsDay*. **Location:** where your teacher tells you. Tick **Place solution and project in the same directory**. Click **Next**.","**Framework:** choose the newest Long Term Support version offered (e.g. .NET 8.0). Click **Create**.","Press **F5** (or the green **Start** button). An empty window appears: the project works. Close it."]},{"t":"example","title":"Tutorial: Rename Form1 and add the other forms","steps":["In **Solution Explorer**, right-click **Form1.cs › Rename**, type **frmLogin.cs** and press Enter. Click **Yes** when asked to rename all references.","**Project › Add Form (Windows Forms)…**, name it **frmMenu.cs**, click **Add**. Repeat for each screen in your navigation structure (Ballyvaren: frmAthletes, frmResults, frmLeaderboard).","**Project › Add Class…**, name it **Athlete.cs**, click **Add**. Repeat for each object (Ballyvaren: EventResult.cs, House.cs, and DataStore.cs for the shared lists).","Open **Program.cs**. Check the last line of Main says `Application.Run(new frmLogin());`."]},{"t":"code","lang":"cs","title":"C#: Program.cs – the whole file (first version)","code":"using System;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    internal static class Program\n    {\n        [STAThread]\n        static void Main()\n        {\n            ApplicationConfiguration.Initialize();\n            DataStore.LoadHouses();                // put the four houses into the list\n            Application.Run(new frmLogin());       // the program starts at the login screen\n        }\n    }\n}"},{"t":"table","head":["Key","Does"],"rows":[["F5","Run with debugging"],["Shift + F5","Stop the running program"],["F7 / Shift + F7","Switch from designer to code / back to designer"],["F4","Properties window"],["Ctrl + Alt + X","Toolbox"],["View › Error List","Error List"]],"caption":"Shortcuts worth learning"},{"t":"warn","text":"If the template list shows only *Windows Forms App (.NET Framework)*, the .NET desktop workload may be missing. Tell your teacher rather than choosing a different template, because some code (e.g. ApplicationConfiguration) differs."},{"t":"key","title":"Check it works","items":["Solution Explorer shows frmLogin.cs, frmMenu.cs, the other forms and your class files.","F5 opens the empty login form without errors."]},{"t":"todo","title":"TASK 16 checklist – project","items":["Windows Forms App (C#, .NET) created","Form1 renamed to my first form","A form added for every screen","A class file added for every object","Program.cs starts the right form","Screenshot of the empty project running"]}],"diagram":{"kind":"hotspot","title":"The Visual Studio window","caption":"Click each part of Visual Studio.","rows":[[{"label":"Menu / toolbar","detail":"File, Project (Add Form, Add Class), Debug. The green Start button runs the program (F5).","span":4}],[{"label":"Toolbox","detail":"Controls to drag onto a form: Label, TextBox, Button, ComboBox, ListBox, DataGridView. Ctrl + Alt + X.","span":1},{"label":"Form designer","detail":"The form you are laying out. Double-click a control to create its main event handler in code.","span":2},{"label":"Solution Explorer","detail":"Every file: forms, classes, Program.cs. Right-click to rename or add.","span":1}],[{"label":"Code editor","detail":"F7 from the designer. Line numbers, colour coding and IntelliSense suggestions.","span":3},{"label":"Properties (F4)","detail":"(Name), Text, Font, BackColor… and the lightning bolt for events.","span":1}],[{"label":"Error List","detail":"Syntax errors with code (e.g. CS1002), description, file and line. Double-click to jump to the line.","span":4}]],"links":[["Toolbox","Form designer"],["Form designer","Properties (F4)"]]},"check":[],"exam":[],"practice":[{"q":"Add a Help form (frmHelp) to the Ballyvaren project and make the program start on it temporarily so you can check its layout, then put it back.","m":2,"a":"**Project › Add Form (Windows Forms)…** › name **frmHelp.cs** › Add. In **Program.cs** change the last line of Main to `Application.Run(new frmHelp());` and press F5 to view it. When you are happy, change it back to `Application.Run(new frmLogin());` so the program starts at the login screen again."}],"videos":[],"terms":[]},{"id":"c03-p03","spec":"TASK 16: Build – Building forms from your control tables","lessons":[],"summary":"Lay out each form with the Toolbox and set every control's (Name), Text and other properties in the Properties window exactly as your control table says.","blocks":[{"t":"p","text":"Your control tables (Task 13B) are your building instructions. Each row tells you which control to add, what to call it and what value to give it. Work through the table row by row so the finished form matches your final design."},{"t":"example","title":"Tutorial: Build frmResults from its control table","steps":["Open **frmResults.cs** in the designer. With the form selected, set **Text** to *Sports Day – Results*, **BackColor**, **Font** (Century Gothic 10) and **StartPosition** CenterScreen in the Properties window (F4).","From the **Toolbox** drag a **Label** to the top. Set **(Name)** *lblTitle*, **Text** *Record a Result*, **Font** Century Gothic 20 Bold.","Drag a **ComboBox**; **(Name)** *cmbEvent*, **DropDownStyle** *DropDownList* so users can only choose, not type. Add *cmbAthlete* the same way, wide enough to show 'A001 Aoife Kelly (Year 8, Lir)'.","Drag a **TextBox**; **(Name)** *tbPosition*, **MaxLength** 1. Add *tbPerformance* (MaxLength 7), each with a Label beside it. Add Labels *lblUnit* (empty Text) and *lblPoints* (Text *Points: –*).","Drag a **DataGridView**; **(Name)** *dgvEventResults*, **ReadOnly** True, **AllowUserToAddRows** False.","Add Buttons *btnSave*, *btnClear*, *btnHelp*, *btnBack* with their Text.","**View › Tab Order**, click the controls in the order the user fills them in, then **View › Tab Order** again to finish.","Select the form and set **AcceptButton** to *btnSave* so Enter saves, and **CancelButton** to *btnBack*."]},{"t":"table","head":["Property","Why it matters"],"rows":[["(Name)","The name your code uses: tbPosition.Text. Must match your control table exactly (case matters)."],["Text","What the user sees on a label, button or form title bar."],["MaxLength","A built-in length check on a TextBox."],["DropDownStyle = DropDownList","Stops typing into a ComboBox, so only listed values can be chosen."],["PasswordChar = *","Hides a password as it is typed (login form)."],["ToolTip on toolTip1","Add a ToolTip component; each control then has a 'ToolTip on toolTip1' property for hover help."],["TabIndex / Tab Order","The order Tab moves through the controls."]],"caption":"Properties you will set most"},{"t":"warn","text":"Set (Name) **before** you double-click a control to make its event handler. If you rename afterwards, the handler keeps the old name (e.g. button1_Click), which makes your code harder to follow."},{"t":"key","title":"Check it works","items":["Click each control: its (Name) in the Properties window matches your control table.","Run (F5): Tab moves in order, the event list cannot be typed in, Enter presses Save."]},{"t":"todo","title":"TASK 16 checklist – forms","items":["Every form laid out from its final design","Every control's (Name) matches my control table","Text, fonts and colours as designed","Tab order set","AcceptButton set on forms with a main button","Screenshot of each finished form"]}],"diagram":{"kind":"hotspot","title":"The Properties window","caption":"Click each part of the Properties window (F4).","rows":[[{"label":"Object box","detail":"Shows which control is selected, e.g. tbPosition System.Windows.Forms.TextBox.","span":4}],[{"label":"Categorized / A–Z","detail":"Sort properties by group or alphabetically.","span":2},{"label":"Properties button","detail":"Shows properties such as (Name), Text, Font.","span":1},{"label":"Events (lightning bolt)","detail":"Lists events such as Click, TextChanged. Double-click an empty event to create its handler.","span":1}],[{"label":"(Name)","detail":"The control's name in code. Near the top in A–Z view.","span":2},{"label":"Text","detail":"What the user sees.","span":2}],[{"label":"Description","detail":"At the bottom: explains the selected property.","span":4}]],"links":[["Properties button","(Name)"],["Events (lightning bolt)","Description"]]},"check":[],"exam":[],"practice":[{"q":"Build frmLogin for the Ballyvaren practice project from this control table: lblTitle (Label, 'Staff Login'), tbUsername (TextBox), tbPassword (TextBox, hidden), btnLogin (Button, 'Login'). Give each step and every property you set.","m":3,"a":"1 Open frmLogin in the designer; form **Text** 'Sports Day – Login', **StartPosition** CenterScreen, **FormBorderStyle** FixedSingle, **MaximizeBox** False. 2 Label: **(Name)** lblTitle, **Text** Staff Login, Font Century Gothic 20 Bold. 3 Labels 'Username' and 'Password' beside two TextBoxes: **(Name)** tbUsername and tbPassword; on tbPassword set **PasswordChar** * (or **UseSystemPasswordChar** True). 4 Button: **(Name)** btnLogin, **Text** Login. 5 Form **AcceptButton** = btnLogin. 6 **View › Tab Order**: tbUsername, tbPassword, btnLogin. 7 F5 to check the password shows as stars and Enter presses Login."}],"videos":[],"terms":[]},{"id":"c03-p04","spec":"TASK 16: Build – Writing your class","lessons":[],"summary":"Turn each object from your design into a C# class with private attributes, a constructor, properties and methods.","blocks":[{"t":"p","text":"A **class** is the template for an object; each **object** made from it holds one set of attribute values. Your object diagrams (booklet page 5) list the attributes, and the booklet reminds you that each attribute is declared at the beginning of the object. A class has four parts:"},{"t":"table","head":["Part","What it is","In Athlete"],"rows":[["Attributes","private variables holding the object's data, declared at the top","athleteID, firstName, surname, yearGroup, house"],["Constructor","a method with the class's name; runs once when you write new Athlete(…) and fills in the attributes","public Athlete(string athleteID, …)"],["Properties","public access to the attributes: get to read, set to change (encapsulation: the class decides what can change)","AthleteID (get only), FirstName, Surname, YearGroup, House (get and set, for editing)"],["Methods","what the object can do","FullName(), ToCsv(), FromCsv(), ToString()"]],"caption":"Anatomy of a class"},{"t":"anim","scene":"class-object","caption":"One Athlete class acts as the template; each pupil entered for sports day becomes its own object."},{"t":"example","title":"Tutorial: Write the Athlete class","steps":["In Solution Explorer open **Athlete.cs** (made with Project › Add Class). Visual Studio has written `internal class Athlete { }`. Change *internal* to **public**.","Type the attributes from your design, each `private` with its data type.","Type the constructor: same name as the class, one parameter per attribute, and `this.attribute = parameter;` for each.","Add a property for each attribute. Give it a `set` only if the program needs to change it (an athlete's ID never changes, so AthleteID has `get` only).","Add the methods. Build with **Ctrl + Shift + B** and check the Error List shows 0 errors."]},{"t":"code","lang":"cs","title":"C#: Athlete.cs – the whole file","code":"using System;\n\nnamespace SportsDay\n{\n    public class Athlete\n    {\n        // ----- attributes (declared at the start of the class) -----\n        private string athleteID;\n        private string firstName;\n        private string surname;\n        private int yearGroup;           // 8 to 12\n        private string house;            // Lir, Fionn, Macha or Boru\n\n        // ----- constructor: runs when a new Athlete object is created -----\n        public Athlete(string athleteID, string firstName, string surname, int yearGroup, string house)\n        {\n            this.athleteID = athleteID;\n            this.firstName = firstName;\n            this.surname = surname;\n            this.yearGroup = yearGroup;\n            this.house = house;\n        }\n\n        // ----- properties -----\n        public string AthleteID { get { return athleteID; } }     // read-only: an ID never changes\n        public string FirstName { get { return firstName; } set { firstName = value; } }\n        public string Surname { get { return surname; } set { surname = value; } }\n        public int YearGroup { get { return yearGroup; } set { yearGroup = value; } }\n        public string House { get { return house; } set { house = value; } }\n\n        // ----- methods -----\n        public string FullName()\n        {\n            return firstName + \" \" + surname;\n        }\n\n        // One line for athletes.csv, e.g. A001,Aoife,Kelly,8,Lir\n        public string ToCsv()\n        {\n            return athleteID + \",\" + firstName + \",\" + surname + \",\" + yearGroup + \",\" + house;\n        }\n\n        // Builds an Athlete object from one line of athletes.csv\n        public static Athlete FromCsv(string line)\n        {\n            string[] parts = line.Split(',');\n            if (parts.Length != 5)\n            {\n                throw new FormatException(\"expected 5 values but found \" + parts.Length + \": \" + line);\n            }\n            return new Athlete(parts[0], parts[1], parts[2], int.Parse(parts[3]), parts[4]);\n        }\n\n        // What a ComboBox or ListBox shows for this object\n        public override string ToString()\n        {\n            return athleteID + \" \" + FullName() + \" (Year \" + yearGroup + \", \" + house + \")\";\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: EventResult.cs – the whole file","code":"using System;\nusing System.Globalization;\n\nnamespace SportsDay\n{\n    public class EventResult\n    {\n        // ----- constants: points for 1st to 6th place (index 0 holds the points for 1st) -----\n        public static readonly int[] POINTS = { 10, 8, 6, 4, 2, 1 };\n        public const int MAX_POSITION = 6;\n\n        // ----- attributes -----\n        private string eventName;\n        private string athleteID;\n        private int position;            // 1 to 6\n        private decimal performance;     // seconds for track events, metres for field events\n\n        // ----- constructor -----\n        public EventResult(string eventName, string athleteID, int position, decimal performance)\n        {\n            this.eventName = eventName;\n            this.athleteID = athleteID;\n            this.position = position;\n            this.performance = performance;\n        }\n\n        // ----- properties -----\n        public string EventName { get { return eventName; } }\n        public string AthleteID { get { return athleteID; } }\n        public int Position { get { return position; } }\n        public decimal Performance { get { return performance; } }\n        public int Points { get { return PointsAwarded(); } }\n\n        // ----- methods -----\n        // Points for any position (static: also used for the live points label before a result exists)\n        public static int PointsFor(int position)\n        {\n            if (position < 1 || position > MAX_POSITION)\n            {\n                return 0;\n            }\n            return POINTS[position - 1];     // position 1 is stored at index 0\n        }\n\n        public int PointsAwarded()\n        {\n            return PointsFor(position);\n        }\n\n        // One line for results.csv, e.g. 100m,A001,1,13.42\n        public string ToCsv()\n        {\n            return eventName + \",\" + athleteID + \",\" + position + \",\" +\n                   performance.ToString(CultureInfo.InvariantCulture);\n        }\n\n        // Builds an EventResult object from one line of results.csv\n        public static EventResult FromCsv(string line)\n        {\n            string[] parts = line.Split(',');\n            if (parts.Length != 4)\n            {\n                throw new FormatException(\"expected 4 values but found \" + parts.Length + \": \" + line);\n            }\n            int position = int.Parse(parts[2]);\n            decimal performance = decimal.Parse(parts[3], CultureInfo.InvariantCulture);\n            return new EventResult(parts[0], parts[1], position, performance);\n        }\n\n        public override string ToString()\n        {\n            return eventName + \": \" + athleteID + \" position \" + position + \" (\" + PointsAwarded() + \" points)\";\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: House.cs – the whole file","code":"namespace SportsDay\n{\n    public class House\n    {\n        // ----- attributes -----\n        private string name;\n        private string colour;\n        private int totalPoints;\n\n        // ----- constructor -----\n        public House(string name, string colour)\n        {\n            this.name = name;\n            this.colour = colour;\n            totalPoints = 0;\n        }\n\n        // ----- properties -----\n        public string Name { get { return name; } }\n        public string Colour { get { return colour; } }\n        public int TotalPoints { get { return totalPoints; } }\n\n        // ----- methods -----\n        public void ResetPoints()\n        {\n            totalPoints = 0;\n        }\n\n        public void AddPoints(int points)\n        {\n            totalPoints = totalPoints + points;\n        }\n\n        public override string ToString()\n        {\n            return name;\n        }\n    }\n}"},{"t":"tip","text":"`PointsFor` is **static**: it belongs to the class, not to one object, so the results form can call `EventResult.PointsFor(3)` to show the points before any EventResult object exists. `PointsAwarded` is an ordinary (instance) method that uses this object's own position."},{"t":"key","title":"Check it works","items":["Ctrl + Shift + B builds with 0 errors.","Trace: new EventResult(\"100m\", \"A001\", 1, 13.42m).PointsAwarded() → POINTS[0] = 10; position 6 → POINTS[5] = 1; position 7 → 0."]},{"t":"todo","title":"TASK 16 checklist – classes","items":["A public class for each object in my design","Attributes declared private at the top with data types","Constructor sets every attribute","Properties to read (and where needed change) the attributes","Methods for what the object does","Builds with 0 errors"]}],"diagram":{"kind":"hotspot","title":"Inside the EventResult class","caption":"Click each part of the class.","rows":[[{"label":"public class EventResult","detail":"The class header. public so every form can use it.","span":4}],[{"label":"Constants","detail":"POINTS = {10, 8, 6, 4, 2, 1} and MAX_POSITION = 6: values that never change, named so the code explains itself.","span":2},{"label":"Attributes","detail":"private fields declared at the start: eventName, athleteID, position, performance.","span":2}],[{"label":"Constructor","detail":"EventResult(…): fills the attributes when new EventResult(…) is called.","span":2},{"label":"Properties","detail":"EventName, AthleteID, Position, Performance, Points: read access from other code.","span":2}],[{"label":"Methods","detail":"PointsFor, PointsAwarded, ToCsv, FromCsv, ToString.","span":4}]],"links":[["public class EventResult","Attributes"],["Attributes","Properties"],["Constructor","Attributes"]]},"check":[],"exam":[],"practice":[{"q":"Add a method `IsMedal()` to the EventResult class that returns true for 1st, 2nd or 3rd place, and a read-only property `Unit` that returns \"s\" for track events and \"m\" for field events (use DataStore.IsTrackEvent).","m":2,"a":"Inside the EventResult class, after the other methods:\n```\npublic bool IsMedal()\n{\n    return position >= 1 && position <= 3;\n}\n\npublic string Unit { get { return DataStore.IsTrackEvent(eventName) ? \"s\" : \"m\"; } }\n```\nTrace: position 2 → IsMedal() true; position 4 → false. A 100m result → Unit \"s\"; a Long Jump result → Unit \"m\"."}],"videos":[],"terms":[]},{"id":"c03-p05","spec":"TASK 16: Build – Creating objects and storing them in a List","lessons":[],"summary":"Create objects with new, store them in lists held in a static DataStore class so every form shares the same data, and loop through the lists.","blocks":[{"t":"p","text":"A program usually stores many objects: every athlete entered, every result recorded. A **List** is a collection that grows as you add to it, unlike an array, which has a fixed size. You put the type of object it holds in angle brackets after the word List, so a list of athletes holds Athlete objects only."},{"t":"code","lang":"cs","title":"C#: List essentials (examples, inside any method)","code":"List<Athlete> athletes = new List<Athlete>();       // make an empty list\nAthlete a = new Athlete(\"A001\", \"Aoife\", \"Kelly\", 8, \"Lir\");   // create one object\nathletes.Add(a);                                    // add it to the end of the list\nint howMany = athletes.Count;                       // how many objects are in it (1)\nAthlete first = athletes[0];                        // the first object (index 0)\nforeach (Athlete item in athletes)                  // visit every object in turn\n{\n    MessageBox.Show(item.FullName());\n}\nathletes.Remove(a);                                 // remove that object (Count is 0 again)"},{"t":"anim","scene":"array","caption":"A list is like an array that can grow: each slot holds one object, numbered from index 0."},{"t":"p","text":"Each form is a separate class, so where should the lists live? The simplest answer is a **static class**: a class that is never made into objects, whose members are shared by the whole program. Every form reads and writes `DataStore.Athletes` and `DataStore.Results`, so they all see the same data. DataStore also holds the searches and totals that several forms need."},{"t":"code","lang":"cs","title":"C#: DataStore.cs – the whole file (first version; file methods are added later)","code":"using System;\nusing System.Collections.Generic;\n\nnamespace SportsDay\n{\n    // One shared place for the program's lists, so every form uses the same data\n    public static class DataStore\n    {\n        public const string LOGINS_FILE = \"logins.txt\";   // one \"username,password\" per line\n\n        public static List<Athlete> Athletes = new List<Athlete>();\n        public static List<EventResult> Results = new List<EventResult>();\n        public static List<House> Houses = new List<House>();\n        public static string[] TrackEvents = { \"100m\", \"200m\", \"800m\" };      // timed in seconds\n        public static string[] FieldEvents = { \"Long Jump\", \"Shot Put\" };     // measured in metres\n\n        public static void LoadHouses()\n        {\n            Houses.Clear();\n            Houses.Add(new House(\"Lir\", \"Red\"));\n            Houses.Add(new House(\"Fionn\", \"Blue\"));\n            Houses.Add(new House(\"Macha\", \"Green\"));\n            Houses.Add(new House(\"Boru\", \"Yellow\"));\n        }\n\n        public static bool IsTrackEvent(string eventName)\n        {\n            foreach (string name in TrackEvents)\n            {\n                if (name == eventName)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Linear search for an athlete by ID; null if there is no such athlete\n        public static Athlete? FindAthlete(string athleteID)\n        {\n            foreach (Athlete a in Athletes)\n            {\n                if (a.AthleteID == athleteID)\n                {\n                    return a;\n                }\n            }\n            return null;\n        }\n\n        // Has this position already been given in this event?\n        public static bool PositionTaken(string eventName, int position)\n        {\n            foreach (EventResult r in Results)\n            {\n                if (r.EventName == eventName && r.Position == position)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Does this athlete already have a result in this event?\n        public static bool AthleteInEvent(string eventName, string athleteID)\n        {\n            foreach (EventResult r in Results)\n            {\n                if (r.EventName == eventName && r.AthleteID == athleteID)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Next ID: \"A\" + one more than the highest number used so far, e.g. A009\n        public static string NextAthleteID()\n        {\n            int highest = 0;\n            foreach (Athlete a in Athletes)\n            {\n                int number;\n                if (a.AthleteID.Length > 1 && int.TryParse(a.AthleteID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"A\" + (highest + 1).ToString(\"D3\");\n        }\n\n        // Total points scored by one athlete across all events\n        public static int AthletePoints(string athleteID)\n        {\n            int total = 0;\n            foreach (EventResult r in Results)\n            {\n                if (r.AthleteID == athleteID)\n                {\n                    total = total + r.PointsAwarded();\n                }\n            }\n            return total;\n        }\n\n        // Work out every house's total from every result\n        public static void CalculateHouseTotals()\n        {\n            foreach (House h in Houses)\n            {\n                h.ResetPoints();\n            }\n            foreach (EventResult r in Results)\n            {\n                Athlete? athlete = FindAthlete(r.AthleteID);\n                if (athlete == null)\n                {\n                    continue;                    // result for an unknown athlete: skip it\n                }\n                foreach (House h in Houses)\n                {\n                    if (h.Name == athlete.House)\n                    {\n                        h.AddPoints(r.PointsAwarded());\n                    }\n                }\n            }\n        }\n    }\n}"},{"t":"example","title":"Worked example: objects in the lists","steps":["`DataStore.Athletes.Add(new Athlete(\"A001\", \"Aoife\", \"Kelly\", 8, \"Lir\"));` creates one object with the constructor and adds it. Count is now 1.","`DataStore.Results.Add(new EventResult(\"100m\", \"A001\", 1, 13.42m));` records Aoife's win.","`DataStore.PositionTaken(\"100m\", 1)` loops through Results, finds that result, and returns **true**: 1st place is taken. `PositionTaken(\"100m\", 2)` returns **false**.","`DataStore.AthletePoints(\"A001\")` adds up the points of every result for A001: **10**.","`DataStore.NextAthleteID()` finds the highest number used (1) and returns **A002**."]},{"t":"warn","text":"A static list is shared by everything, which is convenient but means any form can change it. Only add or remove items in one or two clear places (the athletes and results forms and the load methods), so a logic error is easy to trace."},{"t":"key","title":"Check it works","items":["Ctrl + Shift + B: 0 errors.","In Program.cs, DataStore.LoadHouses() runs before the login form opens."]},{"t":"todo","title":"TASK 16 checklist – lists","items":["A List for each kind of object my program stores","Lists kept in one shared place","Objects created with new and added to the list","foreach loops to search or total through the list"]}],"diagram":{"kind":"table-reveal","title":"Trace AthletePoints(\"A001\")","caption":"Practice results. Click to reveal the running total after each result.","head":["Result in list","Athlete","Matches A001?","total"],"rows":[["100m, position 1","A001","Yes (+10)","10"],["100m, position 2","A004","No","10"],["Long Jump, position 1","A007","No","10"],["Long Jump, position 2","A001","Yes (+8)","18"],["800m, position 1","A005","No","18"],["Result","","","18 points"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,2],[2,3],[3,2],[3,3],[4,2],[4,3],[5,3]]},"check":[],"exam":[],"practice":[{"q":"Add a method `ResultsForAthlete(string athleteID)` to DataStore that returns a new list of every result for that athlete.","m":2,"a":"Inside DataStore:\n```\npublic static List<EventResult> ResultsForAthlete(string athleteID)\n{\n    List<EventResult> found = new List<EventResult>();\n    foreach (EventResult r in Results)\n    {\n        if (r.AthleteID == athleteID)\n        {\n            found.Add(r);\n        }\n    }\n    return found;\n}\n```\nWith the practice data, ResultsForAthlete(\"A001\") returns two results: 100m position 1 and Long Jump position 2."}],"videos":[],"terms":[]},{"id":"c03-p06","spec":"TASK 16: Build – Navigating between forms","lessons":[],"summary":"Code the login screen to check logins.txt with three attempts, open the menu with ShowDialog, pass the username across, and return to login on Log Out.","blocks":[{"t":"p","text":"Your navigation structure (Task 14) shows how the user moves between screens. In code, moving to another form means **creating an object of that form** and showing it. There are two ways to show it:"},{"t":"table","head":["Method","Behaviour","Use for"],"rows":[["form.ShowDialog()","Opens the form and waits; the code after it runs only when that form closes. The form behind cannot be clicked.","Menu → sub-screens; login → menu. Simple and safe."],["form.Show()","Opens the form and carries on straight away; both forms can be used.","Screens that can stay open together."]],"caption":"Show or ShowDialog?"},{"t":"p","text":"The login form follows the booklet's own login flowchart: open the logins file, split it into records, and for each record check the username, then the password. Here `logins.txt` holds one `username,password` per line."},{"t":"example","title":"Tutorial: Add logins.txt to the project","steps":["**Project › Add New Item…** (Ctrl + Shift + A). Type the name **logins.txt** and click **Add** (in the full dialog choose *Text File* first).","Type two lines: `pe1,Relay#4` and `headofpe,Javelin!8`. Save.","In Solution Explorer click **logins.txt**; in Properties set **Copy to Output Directory** to **Copy if newer**. Visual Studio then copies it next to the .exe in bin\\Debug\\net8.0-windows (the folder name matches your .NET version), where the program looks for it."]},{"t":"code","lang":"cs","title":"C#: frmLogin.cs – the whole file (btnLogin_Click made by double-clicking btnLogin)","code":"using System;\nusing System.Drawing;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    public partial class frmLogin : Form\n    {\n        private int attempts = 0;\n        private const int MAX_ATTEMPTS = 3;\n\n        public frmLogin()\n        {\n            InitializeComponent();\n        }\n\n        private void btnLogin_Click(object sender, EventArgs e)\n        {\n            string usernameEntered = tbUsername.Text.Trim();\n            string passwordEntered = tbPassword.Text;\n\n            // presence check\n            if (usernameEntered == \"\" || passwordEntered == \"\")\n            {\n                MessageBox.Show(\"Please enter your username and password.\", \"Login\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                return;\n            }\n\n            // open the logins file, split it into records and check each one\n            bool found = false;\n            try\n            {\n                string[] records = File.ReadAllLines(DataStore.LOGINS_FILE);\n                foreach (string record in records)\n                {\n                    string[] parts = record.Split(',');\n                    if (parts.Length == 2 && parts[0] == usernameEntered && parts[1] == passwordEntered)\n                    {\n                        found = true;\n                        break;\n                    }\n                }\n            }\n            catch (FileNotFoundException)\n            {\n                MessageBox.Show(\"The logins file is missing. Ask the Head of PE to restore logins.txt.\",\n                    \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n            catch (IOException ex)\n            {\n                MessageBox.Show(\"The logins file could not be read: \" + ex.Message,\n                    \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            if (found)\n            {\n                attempts = 0;\n                tbPassword.Clear();\n                tbPassword.BackColor = SystemColors.Window;\n                frmMenu menu = new frmMenu(usernameEntered);\n                this.Hide();\n                menu.ShowDialog();          // waits here until the menu closes (Log Out)\n                this.Show();\n                tbUsername.Focus();\n            }\n            else\n            {\n                attempts++;\n                tbPassword.Clear();\n                tbPassword.BackColor = Color.MistyRose;\n                if (attempts >= MAX_ATTEMPTS)\n                {\n                    MessageBox.Show(\"Too many failed attempts. The program will now close.\", \"Login\",\n                        MessageBoxButtons.OK, MessageBoxIcon.Stop);\n                    Application.Exit();\n                }\n                else\n                {\n                    MessageBox.Show(\"Username or password incorrect. Attempts left: \" + (MAX_ATTEMPTS - attempts),\n                        \"Login\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n                    tbPassword.Focus();\n                }\n            }\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: frmMenu.cs – the whole file","code":"using System;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    public partial class frmMenu : Form\n    {\n        private string staffUsername;\n\n        // the login form passes in who has logged in\n        public frmMenu(string username)\n        {\n            InitializeComponent();\n            staffUsername = username;\n            lblWelcome.Text = \"Logged in as: \" + staffUsername;\n        }\n\n        private void btnAthletes_Click(object sender, EventArgs e)\n        {\n            frmAthletes athletesForm = new frmAthletes();\n            athletesForm.ShowDialog();      // the menu waits until this form closes\n        }\n\n        private void btnResults_Click(object sender, EventArgs e)\n        {\n            frmResults resultsForm = new frmResults();\n            resultsForm.ShowDialog();\n        }\n\n        private void btnLeaderboard_Click(object sender, EventArgs e)\n        {\n            frmLeaderboard leaderboardForm = new frmLeaderboard();\n            leaderboardForm.ShowDialog();\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"Athletes: add, edit and search athletes.\\n\" +\n                \"Results: record each athlete's place in an event.\\n\" +\n                \"Leaderboard: house totals and top athletes.\\n\" +\n                \"Log Out: return to the login screen.\", \"Help\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnLogOut_Click(object sender, EventArgs e)\n        {\n            this.Close();                   // ShowDialog in frmLogin returns and the login screen reappears\n        }\n    }\n}"},{"t":"tip","text":"Passing data between forms: frmMenu's constructor takes the username, so `new frmMenu(usernameEntered)` hands it across. The same idea could pass an Athlete object to a separate edit form: `new frmEditAthlete(selectedAthlete)`."},{"t":"warn","text":"If you use `menu.Show(); this.Hide();` instead, closing the menu leaves the hidden login form running and the program never ends. Either use ShowDialog as here, or close the program in the menu's FormClosed event with `Application.Exit();`."},{"t":"key","title":"Check it works","items":["pe1 / Relay#4 opens the menu showing 'Logged in as: pe1'.","A wrong password shows 'Attempts left: 2', then 1; the third closes the program.","Log Out returns to the login screen."]},{"t":"todo","title":"TASK 16 checklist – navigation","items":["Login checks my logins file","Limited attempts with a message each time","Every button in my navigation structure opens the right form","A way back from every screen","Data passed between forms where needed"]}],"diagram":{"kind":"flow","direction":"tb","title":"btnLogin_Click","caption":"Step through the login code.","nodes":[{"id":"a","label":"Login clicked","detail":"Read tbUsername (trimmed) and tbPassword.","shape":"start"},{"id":"b","label":"Both entered?","detail":"Presence check.","shape":"decision"},{"id":"c","label":"Read logins.txt","detail":"File.ReadAllLines in try…catch; a missing file shows a message.","shape":"store"},{"id":"d","label":"Any record matches?","detail":"Split each line at the comma; compare username and password.","shape":"decision"},{"id":"e","label":"Open menu (ShowDialog)","detail":"Hide login, show menu, wait; show login again after Log Out.","shape":"process"},{"id":"f","label":"attempts++","detail":"Clear the password box and colour it.","shape":"process"},{"id":"g","label":"attempts = 3?","detail":"Three failures?","shape":"decision"},{"id":"h","label":"Message + close","detail":"Application.Exit().","shape":"end"},{"id":"i","label":"'Attempts left' message","detail":"Back to the password box.","shape":"io"}],"edges":[["a","b"],["b","c","yes"],["b","i","no"],["c","d"],["d","e","yes"],["d","f","no"],["f","g"],["g","h","yes"],["g","i","no"]]},"check":[],"exam":[],"practice":[{"q":"Make the Ballyvaren menu show an 'Events' button only when the Head of PE (username headofpe) is logged in.","m":2,"a":"Add a Button **btnEvents** (Text 'Events') to frmMenu. In the frmMenu constructor, after `lblWelcome.Text = …;`, add:\n```\nbtnEvents.Visible = (staffUsername == \"headofpe\");\n```\nTest: log in as headofpe, the button shows; log out and log in as pe1, it is hidden. (Its click handler would open a frmEvents form with ShowDialog in the same way as the other buttons.)"}],"videos":[],"terms":[]},{"id":"c03-p07","spec":"TASK 16: Build – Saving and loading files","lessons":[],"summary":"Save the lists of objects to CSV text files and load them back at start-up, with try…catch exception handling so a missing or damaged file gives a message, not a crash.","blocks":[{"t":"p","text":"Objects in a List disappear when the program closes. To keep them, write each object as one line of a **CSV** (comma-separated values) text file, and read the lines back when the program starts. The Athlete and EventResult classes already have `ToCsv()` (object → line) and `FromCsv()` (line → object)."},{"t":"code","lang":"cs","title":"C#
