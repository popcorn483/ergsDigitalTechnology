: DataStore.cs – the whole file (final version, with file methods)","code":"using System;\nusing System.Collections.Generic;\nusing System.IO;\n\nnamespace SportsDay\n{\n    // One shared place for the program's lists, so every form uses the same data\n    public static class DataStore\n    {\n        public const string LOGINS_FILE = \"logins.txt\";   // one \"username,password\" per line\n\n        public const string ATHLETES_FILE = \"athletes.csv\";\n        public const string RESULTS_FILE = \"results.csv\";\n\n        // Reads every line of athletes.csv into the Athletes list.\n        // Can throw IOException or FormatException: the caller catches them.\n        public static void LoadAthletes()\n        {\n            Athletes.Clear();\n            if (!File.Exists(ATHLETES_FILE))\n            {\n                return;                                  // first run: no athletes yet\n            }\n            foreach (string line in File.ReadAllLines(ATHLETES_FILE))\n            {\n                if (line.Trim() != \"\")                   // skip blank lines\n                {\n                    Athletes.Add(Athlete.FromCsv(line));\n                }\n            }\n        }\n\n        public static void LoadResults()\n        {\n            Results.Clear();\n            if (!File.Exists(RESULTS_FILE))\n            {\n                return;\n            }\n            foreach (string line in File.ReadAllLines(RESULTS_FILE))\n            {\n                if (line.Trim() != \"\")\n                {\n                    Results.Add(EventResult.FromCsv(line));\n                }\n            }\n        }\n\n        // Write a whole list to its file, one object per line.\n        // Can throw IOException or UnauthorizedAccessException: the caller catches them.\n        public static void SaveAthletes()\n        {\n            List<string> lines = new List<string>();\n            foreach (Athlete a in Athletes)\n            {\n                lines.Add(a.ToCsv());\n            }\n            File.WriteAllLines(ATHLETES_FILE, lines);\n        }\n\n        public static void SaveResults()\n        {\n            List<string> lines = new List<string>();\n            foreach (EventResult r in Results)\n            {\n                lines.Add(r.ToCsv());\n            }\n            File.WriteAllLines(RESULTS_FILE, lines);\n        }\n\n        public static List<Athlete> Athletes = new List<Athlete>();\n        public static List<EventResult> Results = new List<EventResult>();\n        public static List<House> Houses = new List<House>();\n        public static string[] TrackEvents = { \"100m\", \"200m\", \"800m\" };      // timed in seconds\n        public static string[] FieldEvents = { \"Long Jump\", \"Shot Put\" };     // measured in metres\n\n        public static void LoadHouses()\n        {\n            Houses.Clear();\n            Houses.Add(new House(\"Lir\", \"Red\"));\n            Houses.Add(new House(\"Fionn\", \"Blue\"));\n            Houses.Add(new House(\"Macha\", \"Green\"));\n            Houses.Add(new House(\"Boru\", \"Yellow\"));\n        }\n\n        public static bool IsTrackEvent(string eventName)\n        {\n            foreach (string name in TrackEvents)\n            {\n                if (name == eventName)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Linear search for an athlete by ID; null if there is no such athlete\n        public static Athlete? FindAthlete(string athleteID)\n        {\n            foreach (Athlete a in Athletes)\n            {\n                if (a.AthleteID == athleteID)\n                {\n                    return a;\n                }\n            }\n            return null;\n        }\n\n        // Has this position already been given in this event?\n        public static bool PositionTaken(string eventName, int position)\n        {\n            foreach (EventResult r in Results)\n            {\n                if (r.EventName == eventName && r.Position == position)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Does this athlete already have a result in this event?\n        public static bool AthleteInEvent(string eventName, string athleteID)\n        {\n            foreach (EventResult r in Results)\n            {\n                if (r.EventName == eventName && r.AthleteID == athleteID)\n                {\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        // Next ID: \"A\" + one more than the highest number used so far, e.g. A009\n        public static string NextAthleteID()\n        {\n            int highest = 0;\n            foreach (Athlete a in Athletes)\n            {\n                int number;\n                if (a.AthleteID.Length > 1 && int.TryParse(a.AthleteID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"A\" + (highest + 1).ToString(\"D3\");\n        }\n\n        // Total points scored by one athlete across all events\n        public static int AthletePoints(string athleteID)\n        {\n            int total = 0;\n            foreach (EventResult r in Results)\n            {\n                if (r.AthleteID == athleteID)\n                {\n                    total = total + r.PointsAwarded();\n                }\n            }\n            return total;\n        }\n\n        // Work out every house's total from every result\n        public static void CalculateHouseTotals()\n        {\n            foreach (House h in Houses)\n            {\n                h.ResetPoints();\n            }\n            foreach (EventResult r in Results)\n            {\n                Athlete? athlete = FindAthlete(r.AthleteID);\n                if (athlete == null)\n                {\n                    continue;                    // result for an unknown athlete: skip it\n                }\n                foreach (House h in Houses)\n                {\n                    if (h.Name == athlete.House)\n                    {\n                        h.AddPoints(r.PointsAwarded());\n                    }\n                }\n            }\n        }\n    }\n}"},{"t":"p","text":"Reading and writing files can go wrong in ways your code cannot prevent: the file is missing, open in another program or damaged. These cause **exceptions** at run time. `try { … } catch (…) { … }` catches them so the program shows a helpful message instead of crashing."},{"t":"anim","scene":"try-catch","caption":"Code in the try block runs; if an exception is thrown, control jumps to the matching catch block instead of crashing."},{"t":"code","lang":"cs","title":"C#: Program.cs – the whole file (final version: loads athletes and results at start-up)","code":"using System;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    internal static class Program\n    {\n        [STAThread]\n        static void Main()\n        {\n            ApplicationConfiguration.Initialize();\n            DataStore.LoadHouses();\n\n            try\n            {\n                DataStore.LoadAthletes();          // read athletes.csv into the list\n                DataStore.LoadResults();           // read results.csv into the list\n            }\n            catch (IOException ex)\n            {\n                MessageBox.Show(\"The data files could not be read: \" + ex.Message +\n                    \"\\nThe program will close so that the files are not overwritten.\",\n                    \"Sports Day\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;                            // stop: do not open the login screen\n            }\n            catch (FormatException ex)\n            {\n                MessageBox.Show(\"A data file contains a damaged line: \" + ex.Message +\n                    \"\\nThe program will close so that the files are not overwritten.\",\n                    \"Sports Day\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            Application.Run(new frmLogin());\n        }\n    }\n}"},{"t":"table","head":["Exception","When it happens","Caught in"],"rows":[["FileNotFoundException","logins.txt is missing","frmLogin"],["IOException","File open in Excel, disk problem","Program.Main, frmLogin, frmAthletes, frmResults"],["UnauthorizedAccessException","No permission to write the folder","frmAthletes and frmResults (save)"],["FormatException","A damaged line: wrong number of values, or a number that will not convert","Program.Main (load)"]],"caption":"Exceptions this program handles"},{"t":"p","text":"The forms catch the two save exceptions together with an **exception filter**: `catch (Exception ex) when (ex is IOException || ex is UnauthorizedAccessException)`. It means 'catch it only if it is one of these two kinds', so one block handles both."},{"t":"warn","text":"Do not open athletes.csv or results.csv in Excel while the program is running: Excel locks the file and saving throws an IOException. View them in Notepad instead."},{"t":"key","title":"Check it works","items":["Add two athletes and a result, close the program, run it again: they are all still there.","Open bin\\Debug\\…\\results.csv in Notepad: one line per result, e.g. 100m,A001,1,13.42.","Add a line 'rubbish' to the file: the program shows the damaged-line message and closes instead of crashing."]},{"t":"todo","title":"TASK 16 checklist – files","items":["Data saved to a file after every change","Data loaded when the program starts","File operations inside try…catch","Helpful message for a missing or damaged file","Screenshot of the file contents as evidence"]}],"diagram":{"kind":"flow","direction":"lr","title":"Objects to file and back","caption":"Step through saving and loading.","nodes":[{"id":"a","label":"List of EventResult objects","detail":"DataStore.Results: objects in memory.","shape":"store"},{"id":"b","label":"ToCsv()","detail":"Each object → '100m,A001,1,13.42'.","shape":"process"},{"id":"c","label":"WriteAllLines","detail":"Whole list written to results.csv.","shape":"io"},{"id":"d","label":"results.csv","detail":"Kept on disk after the program closes.","shape":"store"},{"id":"e","label":"ReadAllLines","detail":"At start-up, inside try…catch.","shape":"io"},{"id":"f","label":"FromCsv()","detail":"Split at commas, convert, new EventResult(…).","shape":"process"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"],["f","a"]]},"check":[],"exam":[],"practice":[{"q":"Add a 'Back up' button to the Ballyvaren menu that copies results.csv to results-backup.csv, overwriting any old backup, with suitable exception handling and messages.","m":3,"a":"Add **btnBackup** to frmMenu, add `using System.IO;` at the top, and in its Click handler:\n```\nprivate void btnBackup_Click(object sender, EventArgs e)\n{\n    try\n    {\n        File.Copy(DataStore.RESULTS_FILE, \"results-backup.csv\", true);   // true = overwrite\n        MessageBox.Show(\"Backup made.\", \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n    catch (FileNotFoundException)\n    {\n        MessageBox.Show(\"There are no results to back up yet.\", \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n    }\n    catch (IOException ex)\n    {\n        MessageBox.Show(\"Backup failed: \" + ex.Message, \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n}\n```\nTest with no results file (warning), with a file (backup made), and with the backup open in Excel (IOException message)."}],"videos":[],"terms":[]},{"id":"c03-p08","spec":"TASK 16: Build – Input validation","lessons":[],"summary":"Validate every input with presence, length, type (TryParse), range and duplicate checks, showing a MessageBox and returning the cursor to the box at the first problem.","blocks":[{"t":"p","text":"Validation checks that data is **sensible, reasonable and within acceptable limits** before the program uses it. It cannot prove data is *correct* (a valid-looking time may still be mistyped), but it stops impossible data crashing the program or corrupting the file. Your final designs (Task 13A) say which checks each input needs; now code them."},{"t":"table","head":["Check","Question it asks","C# technique","Ballyvaren example"],"rows":[["Presence","Is anything there?","text == \"\" or SelectedIndex == -1","Surname entered; a house and an event chosen"],["Length","Is it too long?","text.Length > 20, or MaxLength property","Names 20 characters or fewer"],["Type","Is it the right data type?","int.TryParse / decimal.TryParse","Year group and position whole numbers; time a decimal"],["Range","Is it between limits?","year < 8 || year > 12","Year group 8–12; position 1–6; time greater than 0"],["Lookup / duplicate","Does it clash with stored data?","Linear search of the list","Position not already given in the event; athlete not already entered"]],"caption":"Validation checks"},{"t":"anim","scene":"validation","caption":"Each input passes through the checks in turn; the first one it fails stops it with a message."},{"t":"p","text":"`TryParse` is the key to robust number input. `Convert.ToInt32(\"nine\")` or `int.Parse` would throw a FormatException and crash; TryParse returns **false** instead, and puts the number in the `out` variable when it succeeds. `decimal.TryParse` does the same for a time such as 13.42."},{"t":"code","lang":"cs","title":"C#: frmAthletes.cs – ValidateInputs, CheckName and ShowError (inside the frmAthletes class)","code":"        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out int year)\n        {\n            year = 0;\n            if (!CheckName(tbFirstName, \"first name\") || !CheckName(tbSurname, \"surname\"))\n            {\n                return false;\n            }\n            // type check: TryParse gives false instead of crashing on text like \"nine\"\n            if (!int.TryParse(tbYear.Text, out year))\n            {\n                ShowError(\"The year group must be a whole number, e.g. 9.\", tbYear);\n                return false;\n            }\n            // range check\n            if (year < 8 || year > 12)\n            {\n                ShowError(\"The year group must be between 8 and 12.\", tbYear);\n                return false;\n            }\n            // presence check on the drop-down list\n            if (cmbHouse.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a house.\", cmbHouse);\n                return false;\n            }\n            return true;\n        }\n\n        // Presence, length and comma checks shared by both name boxes\n        private bool CheckName(TextBox box, string label)\n        {\n            string text = box.Text.Trim();\n            if (text == \"\")\n            {\n                ShowError(\"Please enter the athlete's \" + label + \".\", box);\n                return false;\n            }\n            if (text.Length > 20)\n            {\n                ShowError(\"The \" + label + \" must be 20 characters or fewer.\", box);\n                return false;\n            }\n            if (text.Contains(\",\"))\n            {\n                ShowError(\"The \" + label + \" cannot contain a comma.\", box);   // it would break the CSV file\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }"},{"t":"code","lang":"cs","title":"C#: frmResults.cs – ValidateInputs and ShowError (inside the frmResults class)","code":"        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out int position, out decimal performance)\n        {\n            position = 0;\n            performance = 0;\n\n            // presence checks on the drop-down lists\n            if (cmbEvent.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose an event.\", cmbEvent);\n                return false;\n            }\n            if (cmbAthlete.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose an athlete.\", cmbAthlete);\n                return false;\n            }\n            string eventName = cmbEvent.Text;\n            Athlete athlete = (Athlete)cmbAthlete.SelectedItem;\n\n            // type and range checks on the position\n            if (!int.TryParse(tbPosition.Text, out position))\n            {\n                ShowError(\"The position must be a whole number, e.g. 3.\", tbPosition);\n                return false;\n            }\n            if (position < 1 || position > EventResult.MAX_POSITION)\n            {\n                ShowError(\"The position must be between 1 and \" + EventResult.MAX_POSITION + \".\", tbPosition);\n                return false;\n            }\n            // no duplicate positions, and each athlete only once per event\n            if (DataStore.PositionTaken(eventName, position))\n            {\n                ShowError(\"Position \" + position + \" has already been given in the \" + eventName + \".\", tbPosition);\n                return false;\n            }\n            if (DataStore.AthleteInEvent(eventName, athlete.AthleteID))\n            {\n                ShowError(athlete.FullName() + \" already has a result in the \" + eventName + \".\", cmbAthlete);\n                return false;\n            }\n\n            // the time or distance must be a positive decimal number, within sensible limits\n            bool track = DataStore.IsTrackEvent(eventName);\n            string unit = track ? \"time in seconds\" : \"distance in metres\";\n            decimal limit = track ? 600m : 100m;\n            if (!decimal.TryParse(tbPerformance.Text, out performance))\n            {\n                ShowError(\"Enter the \" + unit + \" as a number, e.g. 13.42.\", tbPerformance);\n                return false;\n            }\n            if (performance <= 0)\n            {\n                ShowError(\"The \" + unit + \" must be greater than 0.\", tbPerformance);\n                return false;\n            }\n            if (performance > limit)\n            {\n                ShowError(\"The \" + unit + \" must be no more than \" + limit + \".\", tbPerformance);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }"},{"t":"tip","text":"Check in a sensible order: presence first, then type, then range, then the checks that need the stored data. Stop at the first error and say exactly which box to fix and what is allowed. 'Invalid input' alone does not help the user."},{"t":"key","title":"Check it works","items":["Blank surname → 'Please enter the athlete's surname.' and the cursor is in tbSurname.","Year 'nine' → whole-number message (no crash). Year 13 → range message.","100m position 1 a second time → 'Position 1 has already been given in the 100m.'","Time -13.4 → 'must be greater than 0'."]},{"t":"todo","title":"TASK 16 checklist – validation","items":["Every input from my data requirements validated","TryParse for every number (no crashes on text)","Range checks on numbers","Duplicate checks where the scenario needs them","Clear error messages that name the box and the rule","Screenshots of error messages for the test table"]}],"diagram":{"kind":"flow","direction":"tb","title":"frmResults ValidateInputs: order of checks","caption":"Step through the checks; any 'no' shows a message and stops.","nodes":[{"id":"a","label":"Event chosen?","detail":"Presence check.","shape":"decision"},{"id":"b","label":"Athlete chosen?","detail":"Presence check.","shape":"decision"},{"id":"c","label":"Position a whole number?","detail":"int.TryParse.","shape":"decision"},{"id":"d","label":"Position 1–6?","detail":"Range check.","shape":"decision"},{"id":"e","label":"Position free in event?","detail":"DataStore.PositionTaken.","shape":"decision"},{"id":"f","label":"Athlete not yet in event?","detail":"DataStore.AthleteInEvent.","shape":"decision"},{"id":"g","label":"Time/distance > 0 and in limit?","detail":"decimal.TryParse, then range check.","shape":"decision"},{"id":"x","label":"ShowError + return false","detail":"MessageBox, focus the box.","shape":"io"},{"id":"z","label":"return true","detail":"All valid: save the result.","shape":"end"}],"edges":[["a","b","yes"],["b","c","yes"],["c","d","yes"],["d","e","yes"],["e","f","yes"],["f","g","yes"],["g","z","yes"],["a","x","no"],["b","x","no"],["c","x","no"],["d","x","no"],["e","x","no"],["f","x","no"],["g","x","no"]]},"check":[],"exam":[],"practice":[{"q":"The Head of PE wants athletes' names to contain only letters, spaces, hyphens and apostrophes (so 'O'Neill' and 'Smith-Jones' are allowed but 'K3lly' is not). Add this format check to CheckName.","m":3,"a":"Add a helper and call it in CheckName after the comma check:\n```\nprivate bool ValidNameCharacters(string text)\n{\n    foreach (char c in text)\n    {\n        if (!char.IsLetter(c) && c != ' ' && c != '-' && c != '\\'')\n        {\n            return false;\n        }\n    }\n    return true;\n}\n```\nIn CheckName:\n```\nif (!ValidNameCharacters(text))\n{\n    ShowError(\"The \" + label + \" can only contain letters, spaces, hyphens and apostrophes.\", box);\n    return false;\n}\n```\nTrace: \"O'Neill\" → every character is a letter or ' → true; \"Smith-Jones\" → true; \"K3lly\" → '3' is not allowed → false, message shown. (This check also rejects commas, so the comma check could be removed.)"}],"videos":[],"terms":[]},{"id":"c03-p09","spec":"TASK 16: Build – Calculations","lessons":[],"summary":"Code the scenario's calculations as methods, show live results as values change, and hand-trace them with test data before testing.","blocks":[{"t":"p","text":"Most scenarios need the program to work something out: a cost, a score, a percentage, an average, a total. Put each calculation in a **method** with a clear name, so the same code is used everywhere and you test it once. Use named constants for fixed values so the code explains itself and a rule change is one edit."},{"t":"table","head":["Calculation","Method","How"],"rows":[["Points for a position","EventResult.PointsFor(position)","POINTS[position − 1] from {10, 8, 6, 4, 2, 1}; 0 if outside 1–6"],["An athlete's total","DataStore.AthletePoints(id)","Add the points of every result for that athlete"],["House totals","DataStore.CalculateHouseTotals()","Reset each house to 0, then add each result's points to its athlete's house"],["Next athlete ID","DataStore.NextAthleteID()","'A' + (highest number used + 1) as 3 digits"]],"caption":"Ballyvaren calculations"},{"t":"p","text":"The results form calls PointsFor whenever the position box changes, so the points label is always up to date. Handlers such as `tbPosition_TextChanged` must be created from the **Events** (lightning bolt) list in the Properties window, so that Visual Studio connects them to the control. Here is the whole results form, including the validation from the previous page."},{"t":"code","lang":"cs","title":"C#: frmResults.cs – the whole file","code":"using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    public partial class frmResults : Form\n    {\n        public frmResults()\n        {\n            InitializeComponent();\n        }\n\n        private void frmResults_Load(object sender, EventArgs e)\n        {\n            cmbEvent.Items.Clear();\n            foreach (string name in DataStore.TrackEvents)\n            {\n                cmbEvent.Items.Add(name);\n            }\n            foreach (string name in DataStore.FieldEvents)\n            {\n                cmbEvent.Items.Add(name);\n            }\n            cmbAthlete.Items.Clear();\n            foreach (Athlete a in DataStore.Athletes)\n            {\n                cmbAthlete.Items.Add(a);               // the list shows a.ToString()\n            }\n            ClearForm();\n        }\n\n        // ---------- live updates (handlers made from the Properties window's Events list) ----------\n        private void cmbEvent_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            if (cmbEvent.SelectedIndex == -1)\n            {\n                lblUnit.Text = \"\";\n                ShowEventResults(\"\");\n                return;\n            }\n            lblUnit.Text = DataStore.IsTrackEvent(cmbEvent.Text) ? \"seconds\" : \"metres\";\n            ShowEventResults(cmbEvent.Text);\n        }\n\n        private void tbPosition_TextChanged(object sender, EventArgs e)\n        {\n            int position;\n            if (int.TryParse(tbPosition.Text, out position))\n            {\n                lblPoints.Text = \"Points: \" + EventResult.PointsFor(position);\n            }\n            else\n            {\n                lblPoints.Text = \"Points: –\";\n            }\n        }\n\n        // The results already recorded for one event, in position order\n        private void ShowEventResults(string eventName)\n        {\n            List<EventResult> list = new List<EventResult>();\n            foreach (EventResult r in DataStore.Results)\n            {\n                if (r.EventName == eventName)\n                {\n                    list.Add(r);\n                }\n            }\n            list.Sort((x, y) => x.Position.CompareTo(y.Position));\n            dgvEventResults.DataSource = null;\n            dgvEventResults.DataSource = list;\n        }\n\n        // ---------- buttons ----------\n        private void btnSave_Click(object sender, EventArgs e)\n        {\n            int position;\n            decimal performance;\n            if (!ValidateInputs(out position, out performance))\n            {\n                return;                                 // a message has already been shown\n            }\n\n            Athlete athlete = (Athlete)cmbAthlete.SelectedItem;\n            EventResult result = new EventResult(cmbEvent.Text, athlete.AthleteID, position, performance);\n            DataStore.Results.Add(result);\n\n            try\n            {\n                DataStore.SaveResults();\n            }\n            catch (Exception ex) when (ex is IOException || ex is UnauthorizedAccessException)\n            {\n                DataStore.Results.Remove(result);       // undo, so the list matches the file\n                MessageBox.Show(\"The result could not be saved: \" + ex.Message, \"Save failed\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            MessageBox.Show(athlete.FullName() + \": position \" + position + \" in the \" + cmbEvent.Text +\n                \", \" + result.PointsAwarded() + \" points.\", \"Result saved\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n            ShowEventResults(cmbEvent.Text);\n            // keep the event chosen so the next place can be entered straight away\n            cmbAthlete.SelectedIndex = -1;\n            tbPosition.Clear();\n            tbPerformance.Clear();\n            cmbAthlete.Focus();\n        }\n\n        private void btnClear_Click(object sender, EventArgs e)\n        {\n            ClearForm();\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"Choose the event and the athlete, type their position (1 to 6) and their \" +\n                \"time in seconds or distance in metres, then click Save. The table shows the places \" +\n                \"already recorded for the event.\", \"Help\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        private void ClearForm()\n        {\n            cmbEvent.SelectedIndex = -1;\n            cmbAthlete.SelectedIndex = -1;\n            tbPosition.Clear();\n            tbPerformance.Clear();\n            lblPoints.Text = \"Points: –\";\n            cmbEvent.Focus();\n        }\n\n        // ---------- validation ----------\n        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out int position, out decimal performance)\n        {\n            position = 0;\n            performance = 0;\n\n            // presence checks on the drop-down lists\n            if (cmbEvent.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose an event.\", cmbEvent);\n                return false;\n            }\n            if (cmbAthlete.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose an athlete.\", cmbAthlete);\n                return false;\n            }\n            string eventName = cmbEvent.Text;\n            Athlete athlete = (Athlete)cmbAthlete.SelectedItem;\n\n            // type and range checks on the position\n            if (!int.TryParse(tbPosition.Text, out position))\n            {\n                ShowError(\"The position must be a whole number, e.g. 3.\", tbPosition);\n                return false;\n            }\n            if (position < 1 || position > EventResult.MAX_POSITION)\n            {\n                ShowError(\"The position must be between 1 and \" + EventResult.MAX_POSITION + \".\", tbPosition);\n                return false;\n            }\n            // no duplicate positions, and each athlete only once per event\n            if (DataStore.PositionTaken(eventName, position))\n            {\n                ShowError(\"Position \" + position + \" has already been given in the \" + eventName + \".\", tbPosition);\n                return false;\n            }\n            if (DataStore.AthleteInEvent(eventName, athlete.AthleteID))\n            {\n                ShowError(athlete.FullName() + \" already has a result in the \" + eventName + \".\", cmbAthlete);\n                return false;\n            }\n\n            // the time or distance must be a positive decimal number, within sensible limits\n            bool track = DataStore.IsTrackEvent(eventName);\n            string unit = track ? \"time in seconds\" : \"distance in metres\";\n            decimal limit = track ? 600m : 100m;\n            if (!decimal.TryParse(tbPerformance.Text, out performance))\n            {\n                ShowError(\"Enter the \" + unit + \" as a number, e.g. 13.42.\", tbPerformance);\n                return false;\n            }\n            if (performance <= 0)\n            {\n                ShowError(\"The \" + unit + \" must be greater than 0.\", tbPerformance);\n                return false;\n            }\n            if (performance > limit)\n            {\n                ShowError(\"The \" + unit + \" must be no more than \" + limit + \".\", tbPerformance);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }\n    }\n}"},{"t":"example","title":"Hand-trace: house totals from the practice results","steps":["100m places 1–6: A001 (Lir) 10, A004 (Boru) 8, A006 (Fionn) 6, A007 (Macha) 4, A002 (Fionn) 2, A008 (Boru) 1.","Long Jump places 1–6: A007 (Macha) 10, A001 (Lir) 8, A008 (Boru) 6, A003 (Macha) 4, A005 (Lir) 2, A004 (Boru) 1.","800m places 1–4: A005 (Lir) 10, A003 (Macha) 8, A002 (Fionn) 6, A006 (Fionn) 4.","Lir 10 + 8 + 2 + 10 = **30**; Macha 4 + 10 + 4 + 8 = **26**; Fionn 6 + 2 + 6 + 4 = **18**; Boru 8 + 1 + 6 + 1 = **16**. Total 90 = 3 events' points (31 + 31 + 28)."]},{"t":"anim","scene":"trace-table","caption":"Tracing a calculation line by line shows the value of each variable, so you know the expected result before you test."},{"t":"warn","text":"Arrays start at index 0. Position 1's points are in POINTS[0], so the code must use `POINTS[position - 1]`. Writing `POINTS[position]` gives 8 points for 1st place and crashes with an IndexOutOfRangeException for 6th."},{"t":"key","title":"Check it works","items":["Type 3 in the position box: the label shows 'Points: 6' without clicking anything.","Choose the 100m: the grid shows the places already recorded, in order, with a Points column."]},{"t":"todo","title":"TASK 16 checklist – calculations","items":["Each calculation in its own method","Named constants for fixed values","Results shown to the user","Hand-traced with normal and boundary data","Screenshot of the calculation working"]}],"diagram":{"kind":"calc","title":"Try the house points calculation","caption":"Enter how many 1st, 2nd … 6th places a house won.","inputs":[{"id":"p1","label":"1st places","value":2},{"id":"p2","label":"2nd places","value":1},{"id":"p3","label":"3rd places","value":0},{"id":"p4","label":"4th places","value":0},{"id":"p5","label":"5th places","value":2},{"id":"p6","label":"6th places","value":0}],"formula":"p1*10 + p2*8 + p3*6 + p4*4 + p5*2 + p6*1","result":{"label":"House points","unit":"points"}},"check":[],"exam":[],"practice":[{"q":"Ballyvaren decides that relay events (names starting \"Relay\") are worth double points. Change PointsAwarded so a relay result gets twice the normal points, and trace it.","m":3,"a":"In EventResult.cs:\n```\npublic int PointsAwarded()\n{\n    int points = PointsFor(position);\n    if (eventName.StartsWith(\"Relay\"))\n    {\n        points = points * 2;\n    }\n    return points;\n}\n```\nPointsFor (used for the live label) is unchanged, so the label would show single points for a relay. To fix that, change the label code in frmResults to `int points = EventResult.PointsFor(position); if (cmbEvent.Text.StartsWith(\"Relay\")) { points = points * 2; }` before displaying it. Trace: \"Relay 4x100m\", position 2 → 8 × 2 = 16; \"100m\", position 2 → 8."}],"videos":[],"terms":[]},{"id":"c03-p10","spec":"TASK 16: Build – Displaying data in a ListBox or DataGridView","lessons":[],"summary":"Show a list of objects in a DataGridView (bound: one column per property; or unbound: rows added in code) or a ListBox, and refresh it when the data changes.","blocks":[{"t":"p","text":"Staff need to *see* the stored data. Windows Forms gives you two easy controls for showing a list of objects, and the DataGridView can be used in two ways."},{"t":"table","head":["","ListBox","DataGridView (bound)","DataGridView (unbound)"],"rows":[["Looks like","One line of text per object","A table: one row per object, one column per public property","A table with columns you design"],["How to fill it","Items.Add(a) for each object; shows a.ToString()","dgv.DataSource = list;","Add columns in the designer, then dgv.Rows.Add(value1, value2, …)"],["Selected item","(Athlete)lstAthletes.SelectedItem","(Athlete)dgv.Rows[i].DataBoundItem","dgv.Rows[i].Cells[0].Value"],["Ballyvaren use","–","Athletes list; house totals; results for an event","Top athletes (rank, name, house, points)"]],"caption":"Choosing a display control"},{"t":"example","title":"Tutorial: Set up the grid on frmAthletes","steps":["Drag a **DataGridView** onto frmAthletes. Close the smart-tag pop-up (do not choose a data source there).","Set **(Name)** *dgvAthletes*, **ReadOnly** True, **AllowUserToAddRows** False, **AllowUserToDeleteRows** False, **SelectionMode** FullRowSelect, **AutoSizeColumnsMode** Fill.","Add the input boxes (*tbFirstName*, *tbSurname*, *tbYear*, *cmbHouse* with DropDownList), a Label *lblID*, *tbSearch*, Buttons **btnNew**, **btnSave**, **btnSearch**, **btnShowAll**, **btnHelp**, **btnBack** and a Label **lblCount**.","Double-click the form background to create **frmAthletes_Load** and each button to create its Click handler. For the grid, open the **Events** list and double-click **CellClick**."]},{"t":"code","lang":"cs","title":"C#: frmAthletes.cs – the whole file","code":"using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    public partial class frmAthletes : Form\n    {\n        private Athlete? editing = null;        // null = adding a new athlete\n\n        public frmAthletes()\n        {\n            InitializeComponent();\n        }\n\n        private void frmAthletes_Load(object sender, EventArgs e)\n        {\n            cmbHouse.Items.Clear();\n            foreach (House h in DataStore.Houses)\n            {\n                cmbHouse.Items.Add(h.Name);\n            }\n            ShowAthletes(DataStore.Athletes);\n            ClearForm();\n        }\n\n        private void ShowAthletes(List<Athlete> list)\n        {\n            dgvAthletes.DataSource = null;          // clear first, or the grid will not refresh\n            dgvAthletes.DataSource = list;          // one column per public property, one row per object\n            lblCount.Text = list.Count + \" athlete(s)\";\n        }\n\n        // Clicking a row loads that athlete into the boxes for editing\n        private void dgvAthletes_CellClick(object sender, DataGridViewCellEventArgs e)\n        {\n            if (e.RowIndex < 0)\n            {\n                return;                             // the header row was clicked\n            }\n            Athlete selected = (Athlete)dgvAthletes.Rows[e.RowIndex].DataBoundItem;\n            editing = selected;\n            lblID.Text = selected.AthleteID;\n            tbFirstName.Text = selected.FirstName;\n            tbSurname.Text = selected.Surname;\n            tbYear.Text = selected.YearGroup.ToString();\n            cmbHouse.SelectedItem = selected.House;\n            btnSave.Text = \"Save changes\";\n        }\n\n        private void btnSave_Click(object sender, EventArgs e)\n        {\n            int year;\n            if (!ValidateInputs(out year))\n            {\n                return;                             // a message has already been shown\n            }\n\n            string firstName = tbFirstName.Text.Trim();\n            string surname = tbSurname.Text.Trim();\n            Athlete? added = null;\n            string message;\n            if (editing == null)\n            {\n                added = new Athlete(DataStore.NextAthleteID(), firstName, surname, year, cmbHouse.Text);\n                DataStore.Athletes.Add(added);\n                message = \"Athlete \" + added.AthleteID + \" added.\";\n            }\n            else\n            {\n                editing.FirstName = firstName;      // the properties' set accessors change the object\n                editing.Surname = surname;\n                editing.YearGroup = year;\n                editing.House = cmbHouse.Text;\n                message = \"Athlete \" + editing.AthleteID + \" updated.\";\n            }\n\n            try\n            {\n                DataStore.SaveAthletes();\n            }\n            catch (Exception ex) when (ex is IOException || ex is UnauthorizedAccessException)\n            {\n                if (added != null)\n                {\n                    DataStore.Athletes.Remove(added);   // undo, so the list matches the file\n                }\n                MessageBox.Show(\"The athletes could not be saved: \" + ex.Message, \"Save failed\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            MessageBox.Show(message, \"Saved\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n            ShowAthletes(DataStore.Athletes);\n            ClearForm();\n        }\n\n        private void btnNew_Click(object sender, EventArgs e)\n        {\n            ClearForm();\n        }\n\n        private void btnShowAll_Click(object sender, EventArgs e)\n        {\n            tbSearch.Clear();\n            ShowAthletes(DataStore.Athletes);\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"To add an athlete, fill in the boxes and click Add athlete. \" +\n                \"To edit, click the athlete in the table, change the boxes and click Save changes. \" +\n                \"Year group must be 8 to 12.\", \"Help\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        private void ClearForm()\n        {\n            editing = null;\n            lblID.Text = \"(new)\";\n            tbFirstName.Clear();\n            tbSurname.Clear();\n            tbYear.Clear();\n            cmbHouse.SelectedIndex = -1;\n            btnSave.Text = \"Add athlete\";\n            tbFirstName.Focus();\n        }\n\n        // ---------- linear search by ID or part of a surname ----------\n        private void btnSearch_Click(object sender, EventArgs e)\n        {\n            string searchFor = tbSearch.Text.Trim().ToLower();\n            if (searchFor == \"\")\n            {\n                MessageBox.Show(\"Type an athlete ID or part of a surname to search for.\", \"Search\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Information);\n                tbSearch.Focus();\n                return;\n            }\n\n            List<Athlete> results = new List<Athlete>();\n            foreach (Athlete a in DataStore.Athletes)                 // check every athlete in turn\n            {\n                if (a.AthleteID.ToLower() == searchFor || a.Surname.ToLower().Contains(searchFor))\n                {\n                    results.Add(a);\n                }\n            }\n\n            if (results.Count == 0)\n            {\n                MessageBox.Show(\"No athletes found for \\\"\" + tbSearch.Text.Trim() + \"\\\".\", \"Search\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Information);\n            }\n            ShowAthletes(results);\n        }\n\n        // ---------- validation ----------\n        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out int year)\n        {\n            year = 0;\n            if (!CheckName(tbFirstName, \"first name\") || !CheckName(tbSurname, \"surname\"))\n            {\n                return false;\n            }\n            // type check: TryParse gives false instead of crashing on text like \"nine\"\n            if (!int.TryParse(tbYear.Text, out year))\n            {\n                ShowError(\"The year group must be a whole number, e.g. 9.\", tbYear);\n                return false;\n            }\n            // range check\n            if (year < 8 || year > 12)\n            {\n                ShowError(\"The year group must be between 8 and 12.\", tbYear);\n                return false;\n            }\n            // presence check on the drop-down list\n            if (cmbHouse.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a house.\", cmbHouse);\n                return false;\n            }\n            return true;\n        }\n\n        // Presence, length and comma checks shared by both name boxes\n        private bool CheckName(TextBox box, string label)\n        {\n            string text = box.Text.Trim();\n            if (text == \"\")\n            {\n                ShowError(\"Please enter the athlete's \" + label + \".\", box);\n                return false;\n            }\n            if (text.Length > 20)\n            {\n                ShowError(\"The \" + label + \" must be 20 characters or fewer.\", box);\n                return false;\n            }\n            if (text.Contains(\",\"))\n            {\n                ShowError(\"The \" + label + \" cannot contain a comma.\", box);   // it would break the CSV file\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: ListBox alternative to ShowAthletes (if you use lstAthletes instead of a grid)","code":"        private void ShowAthletesInList(List<Athlete> list)\n        {\n            lstAthletes.Items.Clear();\n            foreach (Athlete a in list)\n            {\n                lstAthletes.Items.Add(a);       // the ListBox displays a.ToString()\n            }\n            lblCount.Text = list.Count + \" athlete(s)\";\n        }"},{"t":"warn","text":"If the grid does not update after a change, you reassigned the same list. Set `DataSource = null` first, as ShowAthletes does, then set it again."},{"t":"key","title":"Check it works","items":["The athletes screen shows one row per athlete with AthleteID, FirstName, Surname, YearGroup and House columns.","Clicking a row fills the boxes and the button changes to 'Save changes'; saving updates that row rather than adding a new athlete.","Users cannot type into or add rows to the grid."]},{"t":"todo","title":"TASK 16 checklist – display","items":["A screen that shows the stored data","ListBox or DataGridView filled from my list","Display refreshes after a search, sort or change","Users cannot edit the display by accident","Screenshot of the display with test data"]}],"diagram":{"kind":"compare","title":"Bound or unbound grid?","caption":"Toggle between the two ways of filling a DataGridView.","states":[{"label":"Bound (DataSource)","points":["dgvHouses.DataSource = sortedHouses;","Columns made automatically: Name | Colour | TotalPoints","One row per object; DataBoundItem gives the object back","Refresh: DataSource = null, then the list"],"art":null},{"label":"Unbound (Rows.Add)","points":["Columns added in the designer: Rank | Athlete | House | Points","dgvTopAthletes.Rows.Add(1, \"Aoife Kelly\", \"Lir\", 18);","Any values you like, e.g. a calculated rank","Refresh: Rows.Clear(), then add again"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Add a 'Results for this athlete' button to frmAthletes that shows the selected athlete's results and total points in a message box.","m":3,"a":"Add **btnShowResults** and in its Click handler:\n```\nprivate void btnShowResults_Click(object sender, EventArgs e)\n{\n    if (editing == null)\n    {\n        MessageBox.Show(\"Click an athlete in the table first.\", \"Results\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        return;\n    }\n    string text = \"\";\n    foreach (EventResult r in DataStore.Results)\n    {\n        if (r.AthleteID == editing.AthleteID)\n        {\n            text = text + r.EventName + \": position \" + r.Position + \" (\" + r.PointsAwarded() + \" points)\\n\";\n        }\n    }\n    if (text == \"\")\n    {\n        text = \"No results yet.\\n\";\n    }\n    text = text + \"Total: \" + DataStore.AthletePoints(editing.AthleteID) + \" points\";\n    MessageBox.Show(text, editing.FullName(), MessageBoxButtons.OK, MessageBoxIcon.Information);\n}\n```\nWith the practice data, Aoife Kelly shows 100m position 1 (10), Long Jump position 2 (8), Total: 18 points."}],"videos":[],"terms":[]},{"id":"c03-p11","spec":"TASK 16: Build – Searching and sorting a list","lessons":[],"summary":"Write a linear search that collects matching objects, a bubble sort that puts the houses in order of points, and the built-in List.Sort for the top athletes.","blocks":[{"t":"p","text":"**Searching:** a linear search looks at every object in turn and keeps the ones that match. It works on any list, sorted or not. In frmAthletes (previous page) an athlete matches if the ID equals the search text or the surname contains it, ignoring capitals. DataStore's PositionTaken and AthleteInEvent are linear searches too."},{"t":"anim","scene":"linear-search","caption":"A linear search checks each item in turn until it has looked at them all."},{"t":"p","text":"**Sorting:** a bubble sort compares neighbours and swaps them if they are in the wrong order. The leaderboard wants the **highest** total first, so it swaps when the left house has *fewer* points than the right one. If a pass makes no swaps, the list is sorted and the loop stops early. Sort a **copy** of the list so the original order is unchanged."},{"t":"example","title":"Tutorial: Set up the two grids on frmLeaderboard","steps":["Drag a **DataGridView** onto frmLeaderboard: **(Name)** *dgvHouses*, **ReadOnly** True, **AllowUserToAddRows** False. Its columns come from the House properties when the code sets DataSource.","Drag a second DataGridView: **(Name)** *dgvTopAthletes*, **ReadOnly** True, **AllowUserToAddRows** False. Click its smart-tag arrow › **Edit Columns… › Add** four times to make columns with Header text *Rank*, *Athlete*, *House* and *Points*. This grid is **unbound**: the code adds the rows.","Add Buttons **btnRefresh** and **btnBack**, and double-click the form background to create **frmLeaderboard_Load**."]},{"t":"code","lang":"cs","title":"C#: frmLeaderboard.cs – the whole file","code":"using System;\nusing System.Collections.Generic;\nusing System.Windows.Forms;\n\nnamespace SportsDay\n{\n    public partial class frmLeaderboard : Form\n    {\n        public frmLeaderboard()\n        {\n            InitializeComponent();\n        }\n\n        private void frmLeaderboard_Load(object sender, EventArgs e)\n        {\n            ShowLeaderboard();\n        }\n\n        private void btnRefresh_Click(object sender, EventArgs e)\n        {\n            ShowLeaderboard();\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        private void ShowLeaderboard()\n        {\n            DataStore.CalculateHouseTotals();\n            List<House> sorted = new List<House>(DataStore.Houses);   // a copy: the original order is kept\n            BubbleSortHouses(sorted);\n            dgvHouses.DataSource = null;\n            dgvHouses.DataSource = sorted;                            // columns Name, Colour, TotalPoints\n            ShowTopAthletes(5);\n        }\n\n        // ---------- bubble sort: highest total first ----------\n        private void BubbleSortHouses(List<House> list)\n        {\n            for (int pass = 0; pass < list.Count - 1; pass++)\n            {\n                bool swapped = false;\n                for (int i = 0; i < list.Count - 1 - pass; i++)\n                {\n                    if (list[i].TotalPoints < list[i + 1].TotalPoints)    // smaller one first? swap\n                    {\n                        House temp = list[i];\n                        list[i] = list[i + 1];\n                        list[i + 1] = temp;\n                        swapped = true;\n                    }\n                }\n                if (!swapped)\n                {\n                    break;                                            // no swaps: already in order\n                }\n            }\n        }\n\n        // ---------- top athletes: an unbound grid filled row by row ----------\n        private void ShowTopAthletes(int howMany)\n        {\n            List<Athlete> ranked = new List<Athlete>(DataStore.Athletes);\n            ranked.Sort((x, y) =>\n            {\n                int byPoints = DataStore.AthletePoints(y.AthleteID).CompareTo(DataStore.AthletePoints(x.AthleteID));\n                if (byPoints != 0)\n                {\n                    return byPoints;                                  // more points first\n                }\n                return string.Compare(x.Surname, y.Surname, StringComparison.OrdinalIgnoreCase);   // tie: by surname\n            });\n\n            dgvTopAthletes.Rows.Clear();\n            int rank = 0;\n            foreach (Athlete a in ranked)\n            {\n                int points = DataStore.AthletePoints(a.AthleteID);\n                if (rank == howMany || points == 0)\n                {\n                    break;                                            // enough rows, or nobody else has scored\n                }\n                rank++;\n                dgvTopAthletes.Rows.Add(rank, a.FullName(), a.House, points);\n            }\n        }\n    }\n}"},{"t":"table","head":["Pass","Comparisons (left vs right)","Swaps","Order after the pass"],"rows":[["Start","","","Lir 30, Fionn 18, Macha 26, Boru 16"],["1","30 v 18 no; 18 v 26 swap; 18 v 16 no","1","Lir 30, Macha 26, Fionn 18, Boru 16"],["2","30 v 26 no; 26 v 18 no","0","No swaps, so the loop stops"]],"caption":"Bubble sort trace with the practice house totals"},{"t":"p","text":"The top athletes use **List.Sort** with a comparison: more points first, and on a tie, surname in alphabetical order. With the practice results the top five are Aoife Kelly (Lir) 18, Saoirse Byrne (Macha) 14, Erin Campbell (Lir) 12, Niamh Doherty (Macha) 12 and Tom Gallagher (Fionn) 10. Campbell comes before Doherty because they tie on 12 and C comes before D."},{"t":"table","head":["Approach","For","Against"],"rows":[["Your own bubble sort","Shows you understand the algorithm; you control the comparison","More code; slow for very large lists (not a problem for four houses)"],["List.Sort with a comparison","Short; fast; easy to add a tie-break","Hides the algorithm"]],"caption":"Writing your own sort or using List.Sort"},{"t":"tip","text":"In your write-up, a short explanation of how your search or sort works, with a screenshot before and after, is good evidence of the processes you designed in Task 13C."},{"t":"key","title":"Check it works","items":["Search 'kel' on the athletes screen finds Aoife Kelly; 'a003' finds Niamh Doherty; 'zzz' shows the not-found message.","The leaderboard shows Lir 30, Macha 26, Fionn 18, Boru 16 in that order.","The top-athletes grid shows the five athletes above, ranked 1–5."]},{"t":"todo","title":"TASK 16 checklist – search and sort","items":["Search finds partial and case-insensitive matches","A message when nothing is found","Sort on the field the scenario needs, in the right direction","Original list order not damaged","Screenshots before and after searching and sorting"]}],"diagram":{"kind":"table-reveal","title":"Predict the bubble sort","caption":"Practice house totals 30, 18, 26, 16, highest first. Click to reveal each pass.","head":["Pass","Swaps made","Order after the pass"],"rows":[["1","1 (Fionn 18 and Macha 26)","Lir 30, Macha 26, Fionn 18, Boru 16"],["2","0","Unchanged: the sort stops early"]],"hidden":[[0,1],[0,2],[1,1],[1,2]]},"check":[],"exam":[],"practice":[{"q":"Add a year-group filter to the top athletes: a ComboBox cmbYear (items All, 8, 9, 10, 11, 12) on frmLeaderboard. When it changes, ShowTopAthletes should only rank athletes in that year group.","m":4,"a":"Give ShowTopAthletes a second parameter and filter while copying:\n```\nprivate void ShowTopAthletes(int howMany, int yearGroup)   // yearGroup 0 = all years\n{\n    List<Athlete> ranked = new List<Athlete>();\n    foreach (Athlete a in DataStore.Athletes)\n    {\n        if (yearGroup == 0 || a.YearGroup == yearGroup)\n        {\n            ranked.Add(a);\n        }\n    }\n    // ... the Sort and the Rows.Add loop stay exactly the same ...\n}\n```\nIn ShowLeaderboard call `ShowTopAthletes(5, SelectedYear());`, and add:\n```\nprivate int SelectedYear()\n{\n    int year;\n    if (int.TryParse(cmbYear.Text, out year))\n    {\n        return year;\n    }\n    return 0;                       // \"All\" or nothing chosen\n}\n\nprivate void cmbYear_SelectedIndexChanged(object sender, EventArgs e)\n{\n    ShowLeaderboard();\n}\n```\nTrace with the practice data, Year 8: Aoife Kelly 18, Conor Quinn 8."}],"videos":[],"terms":[]},{"id":"c03-p12","spec":"TASK 16: Build – Recording errors as you build","lessons":[],"summary":"Recognise syntax, runtime and logic errors, use the Error List and debugger to fix them, and record each one in Corrective Actions with screenshots and an explanation.","blocks":[{"t":"p","text":"Every programmer makes errors; the booklet asks you to **record** yours. Each entry in your Corrective Actions document needs a screenshot of the error or the code that caused it, a screenshot of the code fixed, and a short explanation. Name the type of error: it shows you understand what went wrong."},{"t":"table","head":["Type","What it is","How you find it"],"rows":[["Syntax","Code breaks the rules of C#, so it will not build","Red squiggle; Error List shows a code (CS…) and line number"],["Runtime","Code builds but crashes while running: an exception","Visual Studio stops on the line with an 'Exception Unhandled' box"],["Logic","Runs without crashing but gives the wrong result","Only by testing: compare actual with expected output; use breakpoints"]],"caption":"Three types of error"},{"t":"table","head":["No.","Type","What happened","Cause","Fix"],"rows":[["1","Syntax","CS1002 ; expected (frmResults.cs line 58)","Missing semicolon after `int position = 0`","Added the semicolon"],["2","Syntax","CS0103 The name 'tbSurnme' does not exist in the current context","Control is named tbSurname","Corrected the spelling"],["3","Syntax","CS0029 Cannot implicitly convert type 'string' to 'int'","`int year = tbYear.Text;`","Used int.TryParse(tbYear.Text, out year)"],["4","Runtime","FormatException: input string was not in a correct format","int.Parse(\"nine\") when testing invalid data","Replaced int.Parse with TryParse and an error message"],["5","Runtime","FileNotFoundException: Could not find file '…\\logins.txt'","File not copied to the output folder","Set Copy to Output Directory = Copy if newer; added catch"],["6","Runtime / logic","IndexOutOfRangeException for 6th place; 1st place got 8 points","`return POINTS[position];`","Changed to POINTS[position - 1]"],["7","Logic","Leaderboard showed the lowest house first","Bubble sort swapped when left > right","Changed the comparison to <"],["8","Logic","Editing an athlete added a new athlete instead","CellClick handler typed by hand, not connected to the grid's event, so editing stayed null","Connected it in Properties › Events › CellClick"]],"caption":"Example error log (Ballyvaren practice)"},{"t":"example","title":"Tutorial: Find a logic error with a breakpoint","steps":["Click in the grey margin beside the first line of `CalculateHouseTotals` (or press **F9**). A red dot appears.","Press **F5** and open the leaderboard. Visual Studio pauses on the red line.","Hover over a variable, or look in the **Locals** window, to see its current value.","Press **F10** (Step Over) to run one line at a time and watch each house's total change. When a value differs from your hand-trace (Lir 30, Macha 26, Fionn 18, Boru 16), you have found the line with the error.","**Shift + F5** stops; click the red dot to remove the breakpoint."]},{"t":"tip","text":"Screenshot with **Windows + Shift + S**, drag around the error and the line number, then paste straight into Corrective Actions. Include the line number so the fixed screenshot can be compared."},{"t":"key","title":"What good work includes","items":["Each entry numbered (#1, #2 …) so the test table can refer to it.","Screenshots of both the code and the result, before and after the fix.","Where data is saved, a screenshot of the file opened in Notepad as evidence of what was stored."]},{"t":"todo","title":"TASK 16 checklist – error log","items":["Every error screenshotted as it happened","Fixed code screenshotted","Working result screenshotted","Short explanation for each","Type of error named (syntax, runtime, logic)","Errors numbered so the test table can refer to them"]}],"diagram":{"kind":"table-reveal","title":"Syntax, runtime or logic?","caption":"Decide the type, then click to check.","head":["What happened","Type"],"rows":[["Red squiggle: } expected (CS1513)","Syntax"],["Program stops: Object reference not set to an instance of an object","Runtime (NullReferenceException)"],["Search for 'kelly' finds nothing although Kelly is entered","Logic (compared lower-case search text with the original-case surname)"],["Saving with Year = 'nine' crashes","Runtime (FormatException from int.Parse)"],["Boru's total is 0 although Boru athletes have places","Logic (e.g. house name stored as 'boru' but compared with 'Boru')"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[4,1]]},"check":[],"exam":[],"practice":[{"q":"A pupil's search code is `if (a.Surname.Contains(tbSearch.Text))`. Searching 'kelly' finds nothing although 'Aoife Kelly' is entered. Write up this corrective action as it should appear in Corrective Actions (type, cause, fix with code, how it was tested).","m":3,"a":"**Corrective Action 4 – Logic error.** *What happened:* searching for 'kelly' returned no athletes although A001 is Aoife Kelly (screenshot of the empty grid). *Cause:* Contains is case-sensitive, so 'kelly' does not match 'Kelly'. *Fix:* both sides are converted to lower case before comparing:\n```\nstring searchFor = tbSearch.Text.Trim().ToLower();\n...\nif (a.Surname.ToLower().Contains(searchFor))\n```\n(screenshot of the fixed code). *Retest:* 'kelly', 'KELLY' and 'Kel' now all find A001 (screenshot of the grid showing the athlete)."}],"videos":[],"terms":[]}]},{"id":"c04","n":4,"title":"Testing","intro":"Tasks 17–19: the Testing chapter subtitle page, the requirements being tested, test cases, a full test table with valid, invalid, null and extreme data, and corrective actions. Examples use the fictional Ballyvaren High School Sports Day.","pages":[{"id":"c04-p01","spec":"TASK 17: Create a Testing Chapter subtitle page","lessons":[],"summary":"Start the Testing chapter with a subtitle page and understand the types of test and test data you will use.","blocks":[{"t":"p","text":"Start the Testing chapter exactly as you started the Design chapter: a page with only **Testing Chapter** on it, styled **Heading 1**, followed by a page break. Update the table of contents so the new chapter appears."},{"t":"example","title":"Tutorial: The subtitle page","steps":["Go to the end of your Write Up (after the design and build evidence). Press **Ctrl + Enter** for a new page.","Type **Testing Chapter**, apply **Heading 1** and centre it.","Press **Ctrl + Enter** again so the next section starts on a fresh page.","**References › Update Table › Update entire table**."]},{"t":"p","text":"Before you plan tests, learn the words your test table will use. The booklet's test table asks for the **type of test** (black box or white box) and the **type of data** (valid, invalid, null or extreme)."},{"t":"table","head":["Term","Meaning","Ballyvaren example"],"rows":[["Black box test","Test what goes in and what comes out, without looking at the code","Type Year 13; check the error message appears"],["White box test","Test chosen by looking at the code, so every path or branch is tried","Test positions 1 and 6 so the first and last items of the POINTS array are used"],["Valid data","Data the system should accept","Year group 9"],["Invalid data","Data that should be rejected, with an error message","'nine', 13, a position of 7, a time of -13.4"],["Null data","Nothing entered","Blank surname, no event chosen"],["Extreme (boundary) data","Valid data at the very edge of what is allowed","Year groups 8 and 12; positions 1 and 6; a 20-character surname"]],"caption":"Testing vocabulary"},{"t":"tip","text":"For every range check, test at least three values: the extreme value just inside (12), the invalid value just outside (13) and a normal value (9). Errors hide at the boundaries."},{"t":"key","title":"What good work includes","items":["A subtitle page, then the sections in a consistent order: requirements being tested, test cases, the test table for functional requirements, corrective actions, then the tests of non-functional requirements."]},{"t":"todo","title":"TASK 17 checklist","items":["New page with 'Testing Chapter' as Heading 1","Page break after it","Table of contents updated","I know black box, white box, valid, invalid, null and extreme"]}],"diagram":{"kind":"match","title":"Test data types","caption":"Match each piece of test data to its type (year group 8–12).","pairs":[["Year: 10","Valid"],["Year: 12","Extreme"],["Year: 13","Invalid"],["Year: (blank)","Null"],["Year: nine","Invalid (wrong type)"]]},"check":[],"exam":[],"practice":[{"q":"An athlete's surname must be 1–20 characters. Give one example each of valid, invalid, null and extreme test data, and say whether each test is black box or white box.","m":2,"a":"Valid: 'Kelly' (5 characters). Invalid: a 21-character surname such as 'Fitzpatrick-MacAteers' (21 characters). Null: the box left blank. Extreme: a surname of exactly 20 characters (and of 1 character). All of these are black box tests: they check the input and the message without reading the code."}],"videos":[],"terms":[]},{"id":"c04-p02","spec":"TASK 18A: List the user requirements","lessons":[],"summary":"Copy the numbered functional and non-functional requirements from the Design chapter into the Testing chapter so every test can refer to them.","blocks":[{"t":"p","text":"**PREP:** At this stage you should have finished building a fully working solution in C#. While developing it you should have kept a document of 'failed tests': screenshots of code that did not work, followed by the code showing it working (your Corrective Actions document)."},{"t":"p","text":"List the user requirements from the Design chapter. They must be **numbered** and **easily referenced** in the write-up, because the last column of your test table names the requirement each test proves, and your evaluation goes through them one by one."},{"t":"example","title":"Tutorial: Copy them in without breaking the numbering","steps":["Under the Testing Chapter subtitle page, add a Heading 2 **User Requirements Being Tested**.","In the Design chapter, select the whole numbered list of functional requirements and **Ctrl + C**.","Paste it under the new heading. If the numbering restarts or continues wrongly, right-click the first number › **Restart at 1** or **Set Numbering Value**.","Do the same for the non-functional requirements, setting the first number to follow on (Ballyvaren: 13).","Check the numbers match the Design chapter exactly."]},{"t":"table","head":["No.","Requirement (Ballyvaren practice)"],"rows":[["1","Staff must log in with a username and password stored in logins.txt."],["8","The system will not allow the same position to be given twice in one event, or the same athlete to be entered twice in one event."],["9","Points will be awarded automatically: 1st 10, 2nd 8, 3rd 6, 4th 4, 5th 2, 6th 1."],["11","The leaderboard will show each house's total points, sorted from highest to lowest."],["14","Saving an athlete or a result will take less than 2 seconds."]],"caption":"Extract from the practice list"},{"t":"tip","text":"If you changed a requirement during development (and explained it in User Feedback II), make sure the Testing chapter uses the final wording, and that the Design chapter matches."},{"t":"warn","text":"Every requirement in this list needs at least one test in your test table. Tick them off as you plan your tests on the next pages: an untested requirement cannot be shown as met in the evaluation."},{"t":"key","title":"What good work includes","items":["The requirement list copied exactly, with the same numbers and letters as the Design chapter."]},{"t":"note","text":"**Typical length:** One to two pages. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 18A checklist","items":["Heading 2 'User Requirements Being Tested'","All functional requirements copied in","All non-functional requirements copied in","Numbers identical to the Design chapter"]}],"diagram":{"kind":"flow","direction":"lr","title":"One number, four places","caption":"Follow requirement 9 through the write-up.","nodes":[{"id":"a","label":"Design: Req 9","detail":"Written as a measurable requirement (Task 7).","shape":"start"},{"id":"b","label":"Testing: Req 9","detail":"Copied in with the same number (Task 18A).","shape":"process"},{"id":"c","label":"Tests 12, 13","detail":"Each row's User requirement column says 9.","shape":"process"},{"id":"d","label":"Evaluation: Req 9","detail":"Fully met, justified by those tests (Task 20).","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"]]},"check":[],"exam":[],"practice":[{"q":"Your Testing chapter's pasted list starts at 1 for the non-functional requirements, but in the Design chapter they are 13–17. Explain how to fix it in Word.","m":1,"a":"Right-click the first non-functional requirement's number › **Set Numbering Value…** › choose **Start new list** and set **Set value to** 13 › OK. The rest follow on as 14, 15, 16, 17. Check they now match the Design chapter."}],"videos":[],"terms":[]},{"id":"c04-p03","spec":"TASK 18B: Create a set of test cases","lessons":[],"summary":"Create numbered test cases (sets of valid 'dummy data') so the test table can refer to 'Test Case 1' instead of repeating the data.","blocks":[{"t":"p","text":"A **test case** is a set of valid example data that can be used in your system for testing; it can also be called **dummy data**. Giving each one a number means the test table can simply say *Test Case 2* instead of writing out the same name, year group and house again and again."},{"t":"table","head":["Test Case 1 (login)",""],"rows":[["Username","pe1"],["Password","Relay#4"]],"caption":"Ballyvaren practice"},{"t":"table","head":["Test Case 2 (athlete)",""],"rows":[["First name","Aoife"],["Surname","Kelly"],["Year group","8"],["House","Lir"],["Expected ID","A001 (first athlete)"]]},{"t":"table","head":["Test Case 3 (result)",""],"rows":[["Event","100m"],["Athlete","A001 Aoife Kelly"],["Position","1"],["Time","13.42 seconds"],["Expected points","10"]]},{"t":"table","head":["Test Case 4 (full practice data)","Athletes (ID, name, year, house)","Results (event: positions 1, 2, 3, …)"],"rows":[["8 athletes","A001 Aoife Kelly 8 Lir; A002 Conor Quinn 8 Fionn; A003 Niamh Doherty 9 Macha; A004 Ryan McAllister 9 Boru; A005 Erin Campbell 10 Lir; A006 Tom Gallagher 10 Fionn; A007 Saoirse Byrne 11 Macha; A008 Jack Wilson 11 Boru",""],["16 results","","100m: A001 13.42, A004 13.58, A006 13.90, A007 14.05, A002 14.31, A008 14.77. Long Jump: A007 4.62, A001 4.48, A008 4.35, A003 4.10, A005 3.95, A004 3.80. 800m: A005 158.6, A003 161.2, A002 163.9, A006 165.0"],["Expected","Top five: Kelly 18, Byrne 14, Campbell 12, Doherty 12, Gallagher 10","Houses: Lir 30, Macha 26, Fionn 18, Boru 16"]]},{"t":"h","text":"How to build your set"},{"t":"list","items":["One test case for each kind of record your system stores (a user, an athlete, a result…).","Fill in **every** field with realistic, valid data, so a test only changes the one value it is testing.","Add a larger set where totals, rankings or sorting need checking (Ballyvaren: Test Case 4).","Work out the expected results (points, totals, order) by hand now, before you run the tests.","Use made-up names and data, never real pupils' details."],"ordered":true},{"t":"tip","text":"Put the test cases in coloured boxes or a small table each, as in the booklet, so they are easy to find when you write the test table."},{"t":"key","title":"What good work includes","items":["One complete test case for each type of user or record, every field filled with realistic valid data.","Later tests start from a test case and change only one value, so the test data column stays short and clear."]},{"t":"note","text":"**Typical length:** Half a page to a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 18B checklist","items":["Heading 2 'Test Cases'","A numbered test case for each kind of record","Every field filled with valid data","Expected results worked out by hand","No real people's data"]}],"diagram":{"kind":"table-reveal","title":"Expected house totals for Test Case 4","caption":"Work out each house's points, then click to check.","head":["House","Places won","Working","Total"],"rows":[["Lir","100m 1st, LJ 2nd, LJ 5th, 800m 1st","10 + 8 + 2 + 10","30"],["Macha","100m 4th, LJ 1st, LJ 4th, 800m 2nd","4 + 10 + 4 + 8","26"],["Fionn","100m 3rd, 100m 5th, 800m 3rd, 800m 4th","6 + 2 + 6 + 4","18"],["Boru","100m 2nd, 100m 6th, LJ 3rd, LJ 6th","8 + 1 + 6 + 1","16"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,2],[2,3],[3,2],[3,3]]},"check":[],"exam":[],"practice":[{"q":"Write two test cases for a fictional school library system where a pupil (pupil number, name, form class) borrows a book (book ID, title) for 14 days, and a fine is 10p per day late.","m":3,"a":"**Test Case 1 (normal loan):** Pupil number P1023; name Niamh Quinn; form class 9B; book B0451 'The Silver Lough'; date out 02/03; expected due date 16/03; expected fine £0.00 if returned on 16/03.\n**Test Case 2 (late return):** Pupil number P0871; name Patrick Devlin; form class 11A; book B0112 'Tides of Rathlin'; date out 02/03, due 16/03, returned 21/03; expected fine 5 days × 10p = £0.50.\nA third useful case is a book returned exactly on the due date (extreme data), with an expected fine of £0.00."}],"videos":[],"terms":[]},{"id":"c04-p04","spec":"TASK 19A: Create and complete the test table","lessons":[],"summary":"Create a test table with test number, reason, test data, type of test, type of data, expected outcome, actual outcome, match or corrective action, and user requirement, with screenshot evidence.","blocks":[{"t":"p","text":"**PREP:** Have the screenshots from the building chapter to hand. You will need them."},{"t":"p","text":"The test table is the heart of the Testing chapter. Each row is one test: why you did it, the exact data, what *should* happen (written **before** you run it), what *actually* happened, and whether they match. The screenshots are your **proof**, so label each one (Figure 1, Figure 2…) and refer to it in the Actual outcome column."},{"t":"table","head":["Test No","Reason for test","Test data","Type of test","Type of data","Expected outcome","Actual outcome","Match / corrective action","User requirement"],"rows":[["1","Valid login","Test Case 1","Black box","Valid","Menu opens showing 'Logged in as: pe1'","Menu opened (Figure 1)","Match","1"],["2","Wrong password","pe1 / notMyPassword","Black box","Invalid","Message 'Username or password incorrect. Attempts left: 2'","Message shown (Figure 2)","Match","1, 2"],["3","Blank login","Username and password blank","Black box","Null","Message 'Please enter your username and password.'","Message shown (Figure 3)","Match","1"],["4","Three failed logins","Wrong password three times","Black box","Invalid","Message, then program closes","Program closed (Figure 4)","Match","2"],["5","Add a valid athlete","Test Case 2","Black box","Valid","Message 'Athlete A001 added.'; A001 shown in the grid","As expected (Figure 5)","Match","3, 10"],["6","Year group above range","Test Case 2 with Year 13","Black box","Invalid","Message 'The year group must be between 8 and 12.'","Message shown (Figure 6)","Match","3, 7"],["7","Year group at top of range","Test Case 2 with Year 12","Black box","Extreme","Athlete added","Added (Figure 7)","Match","3"],["8","Year group typed as text","Year: nine","Black box","Invalid","Message 'The year group must be a whole number, e.g. 9.'","Message shown (Figure 8)","Match","7"],["9","Surname left blank","Surname: (blank)","Black box","Null","Message 'Please enter the athlete's surname.'","Message shown (Figure 9)","Match","7"],["10","Edit an athlete","A002 Conor Quinn: house Fionn → Macha","Black box","Valid","Message 'Athlete A002 updated.'; still 8 athletes","New athlete A009 added instead (Figure 10)","Corrective Action 1","4"],["11","Search by part of a surname","Search: kel","Black box","Valid","A001 Aoife Kelly shown","Shown (Figure 11)","Match","5"],["12","Record a valid result","Test Case 3","Black box","Valid","Message '…position 1 in the 100m, 10 points.'; saved","As expected (Figure 12)","Match","6, 9, 10"],["13","Points for last place","100m, A008, position 6, 14.77","White box","Extreme","1 point","0 points shown (Figure 13)","Corrective Action 2","9"],["14","Position out of range","Position: 7","Black box","Invalid","Message 'The position must be between 1 and 6.'","Message shown (Figure 14)","Match","7"],["15","Duplicate position","100m, A002, position 1 (1st already given)","Black box","Invalid","Message 'Position 1 has already been given in the 100m.'","Message shown (Figure 15)","Match","8"],["16","Same athlete twice","100m, A001, position 2 (only Test 12 recorded)","Black box","Invalid","Message 'Aoife Kelly already has a result in the 100m.'","Message shown (Figure 16)","Match","8"],["17","Negative time","Time: -13.4","Black box","Invalid","Message 'The time in seconds must be greater than 0.'","Message shown (Figure 17)","Match","7"],["18","Time typed as text","Time: fast","Black box","Invalid","Message 'Enter the time in seconds as a number, e.g. 13.42.'","Message shown (Figure 18)","Match","7"],["19","House totals in order","Test Case 4","Black box","Valid","Lir 30, Macha 26, Fionn 18, Boru 16","Boru 16, Fionn 18, Macha 26, Lir 30 (Figure 19)","Corrective Action 3","11"],["20","Top five athletes","Test Case 4","Black box","Valid","Kelly 18, Byrne 14, Campbell 12, Doherty 12, Gallagher 10","As expected (Figure 20)","Match","12"],["21","Data reloads","Close and reopen after Test Case 4","Black box","Valid","8 athletes and 16 results still shown","Shown (Figure 21)","Match","10"],["22","Save speed","Test Case 3, timed with a stopwatch","Black box","Valid","Saved in under 2 seconds","Under 1 second (Figure 22)","Match","14"]],"caption":"Ballyvaren practice test table (rows that failed are highlighted in your own table)"},{"t":"h","text":"How to fill each column"},{"t":"table","head":["Column","What to write"],"rows":[["Reason for test","What the test proves, e.g. 'Points for last place'"],["Test data","The exact data, or 'Test Case 3'"],["Type of test","Black box or white box"],["Type of data","Valid, invalid, null or extreme"],["Expected outcome","Exactly what should happen, including the wording of the message or the value"],["Actual outcome","What did happen, with a figure number for the screenshot"],["Match / corrective action","'Match', or 'Corrective Action 1', 2… when it failed"],["User requirement","The requirement number(s) this test proves"]],"caption":"Columns"},{"t":"tip","text":"Plan enough tests to cover every requirement, every input's valid, invalid, null and extreme data, and every calculation. Because every input gets its own valid, invalid, null and extreme tests, complete test tables are long: well over 50 rows for a system with several screens."},{"t":"warn","text":"Do not change a failed result to 'Match' after fixing it. A failed test followed by a corrective action and a retest is good evidence of a proper testing process."},{"t":"key","title":"What good work includes","items":["Every input tested systematically: a valid, an invalid, a null and an extreme test for each field, then every button and calculation.","Test data written as the test case plus the one value that changes (e.g. 'Test Case 2, year group 13').","The requirement column uses the requirement's number and letter.","Failed results stand out: the actual-outcome cell is
