name)\n        {\n            InitializeComponent();\n            staffUsername = username;\n            lblWelcome.Text = \"Logged in as: \" + staffUsername;\n        }\n\n        private void btnProducts_Click(object sender, EventArgs e)\n        {\n            frmProducts productsForm = new frmProducts();\n            productsForm.ShowDialog();      // the menu waits until this form closes\n        }\n\n        private void btnSale_Click(object sender, EventArgs e)\n        {\n            frmSale saleForm = new frmSale();\n            saleForm.ShowDialog();\n        }\n\n        private void btnReports_Click(object sender, EventArgs e)\n        {\n            frmReports reportsForm = new frmReports();\n            reportsForm.ShowDialog();\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"Products: add, edit and search products.\\n\" +\n                \"New Sale: build a basket, take payment and give change.\\n\" +\n                \"Reports: low stock, best sellers and daily takings.\\n\" +\n                \"Log Out: return to the login screen.\", \"Help\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnLogOut_Click(object sender, EventArgs e)\n        {\n            this.Close();                   // ShowDialog in frmLogin returns and the login screen reappears\n        }\n    }\n}"},{"t":"warn","text":"If you use `menu.Show(); this.Hide();` instead of ShowDialog, closing the menu leaves the hidden login form running and the program never ends. Either use ShowDialog as here, or close the program in the menu's FormClosed event with `Application.Exit();`."}],"diagram":{"kind":"flow","direction":"tb","title":"btnLogin_Click","caption":"Step through the login code.","nodes":[{"id":"a","label":"Login clicked","detail":"Read tbUsername (trimmed) and tbPassword.","shape":"start"},{"id":"b","label":"Both entered?","detail":"Presence check.","shape":"decision"},{"id":"c","label":"Read logins.txt","detail":"File.ReadAllLines in try…catch; a missing file shows a message.","shape":"store"},{"id":"d","label":"Any record matches?","detail":"Each line becomes a Staff object; CheckLogin compares username and password.","shape":"decision"},{"id":"e","label":"Open menu (ShowDialog)","detail":"Hide login, show menu, wait; show login again after Log Out.","shape":"process"},{"id":"f","label":"attempts++","detail":"Clear the password box and colour it.","shape":"process"},{"id":"g","label":"attempts = 3?","detail":"Three failures?","shape":"decision"},{"id":"h","label":"Message + close","detail":"Application.Exit().","shape":"end"},{"id":"i","label":"'Attempts left' message","detail":"Back to the password box.","shape":"io"}],"edges":[["a","b"],["b","c","yes"],["b","i","no"],["c","d"],["d","e","yes"],["d","f","no"],["f","g"],["g","h","yes"],["g","i","no"]]},"check":[],"exam":[],"practice":[{"q":"Make the Ballyvaren menu show the Reports button only when the shop manager (username manager) is logged in.","m":2,"a":"In the frmMenu constructor, after `lblWelcome.Text = …;`, add:\n```\nbtnReports.Visible = (staffUsername == \"manager\");\n```\nTest: log in as manager, the Reports button shows; log out and log in as shop1, it is hidden. (Requirement 12 would then need rewording to say the reports are for the manager.)"}],"videos":[],"terms":[]},{"id":"c03-p07","spec":"TASK 16: Build – Saving and loading files","lessons":[],"summary":"Save the lists of objects to CSV text files and load them back at start-up, with try…catch exception handling so a missing or damaged file gives a message, not a crash.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Saving and loading files","brief":"Save each list to a CSV file and load it at start-up, with exception handling so file problems give messages, not crashes.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Navigation","pages":"0 pages (Notepad screenshot of the saved file)"},"approach":["Give each class ToCsv and FromCsv methods.","Write the whole list with File.WriteAllLines after every change.","Read it with File.ReadAllLines when the program starts.","Put every file operation in try…catch (FileNotFound, IO, UnauthorizedAccess, Format).","Show a clear message and never overwrite a file you could not read.","Screenshot the saved file in Notepad as evidence."],"deliver":["Data saved after every change","Data loaded at start-up","File code in try…catch","Clear messages for missing or damaged files","Screenshot of the file contents"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"code","lang":"cs","title":"C#: DataStore.cs – the whole file (final version, with file methods; each sale is saved as one line per item)","code":"using System;\nusing System.Collections.Generic;\nusing System.Globalization;\nusing System.IO;\n\nnamespace TuckShop\n{\n    // One shared place for the program's lists, so every form uses the same data\n    public static class DataStore\n    {\n        public const string LOGINS_FILE = \"logins.txt\";   // one \"username,password\" per line\n\n        public const string PRODUCTS_FILE = \"products.csv\";\n        public const string SALES_FILE = \"sales.csv\";\n\n        // Reads every line of products.csv into the Products list.\n        // Can throw IOException or FormatException: the caller catches them.\n        public static void LoadProducts()\n        {\n            Products.Clear();\n            if (!File.Exists(PRODUCTS_FILE))\n            {\n                return;                                  // first run: no products yet\n            }\n            foreach (string line in File.ReadAllLines(PRODUCTS_FILE))\n            {\n                if (line.Trim() != \"\")                   // skip blank lines\n                {\n                    Products.Add(Product.FromCsv(line));\n                }\n            }\n        }\n\n        // sales.csv has one line per item; lines with the same sale ID belong to the same Sale\n        public static void LoadSales()\n        {\n            Sales.Clear();\n            if (!File.Exists(SALES_FILE))\n            {\n                return;\n            }\n            Sale? current = null;\n            foreach (string line in File.ReadAllLines(SALES_FILE))\n            {\n                if (line.Trim() == \"\")\n                {\n                    continue;\n                }\n                string[] parts = line.Split(',');\n                if (parts.Length != 5)\n                {\n                    throw new FormatException(\"expected 5 values but found \" + parts.Length + \": \" + line);\n                }\n                if (current == null || current.SaleID != parts[0])\n                {\n                    DateTime when = DateTime.ParseExact(parts[1], \"dd/MM/yyyy HH:mm\", CultureInfo.InvariantCulture);\n                    current = new Sale(parts[0], when);\n                    Sales.Add(current);\n                }\n                decimal lineTotal = decimal.Parse(parts[4], CultureInfo.InvariantCulture);\n                current.AddLine(new SaleLine(parts[2], int.Parse(parts[3]), lineTotal));\n            }\n        }\n\n        // Write a whole list to its file.\n        // Can throw IOException or UnauthorizedAccessException: the caller catches them.\n        public static void SaveProducts()\n        {\n            List<string> lines = new List<string>();\n            foreach (Product p in Products)\n            {\n                lines.Add(p.ToCsv());\n            }\n            File.WriteAllLines(PRODUCTS_FILE, lines);\n        }\n\n        public static void SaveSales()\n        {\n            List<string> lines = new List<string>();\n            foreach (Sale s in Sales)\n            {\n                lines.AddRange(s.ToCsvLines());\n            }\n            File.WriteAllLines(SALES_FILE, lines);\n        }\n\n        public static List<Product> Products = new List<Product>();\n        public static List<Sale> Sales = new List<Sale>();\n        public static string[] Categories = { \"Snack\", \"Drink\", \"Fruit\" };\n\n        // Linear search for a product by ID; null if there is no such product\n        public static Product? FindProduct(string productID)\n        {\n            foreach (Product p in Products)\n            {\n                if (p.ProductID == productID)\n                {\n                    return p;\n                }\n            }\n            return null;\n        }\n\n        // Next ID: \"P\" + one more than the highest number used so far, e.g. P008\n        public static string NextProductID()\n        {\n            int highest = 0;\n            foreach (Product p in Products)\n            {\n                int number;\n                if (p.ProductID.Length > 1 && int.TryParse(p.ProductID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"P\" + (highest + 1).ToString(\"D3\");\n        }\n\n        // Next sale ID: \"S\" + one more than the highest used, e.g. S0006\n        public static string NextSaleID()\n        {\n            int highest = 0;\n            foreach (Sale s in Sales)\n            {\n                int number;\n                if (s.SaleID.Length > 1 && int.TryParse(s.SaleID.Substring(1), out number) && number > highest)\n                {\n                    highest = number;\n                }\n            }\n            return \"S\" + (highest + 1).ToString(\"D4\");\n        }\n\n        // Total quantity of one product sold across every sale\n        public static int QuantitySold(string productID)\n        {\n            int total = 0;\n            foreach (Sale s in Sales)\n            {\n                total = total + s.QtyOf(productID);\n            }\n            return total;\n        }\n\n        // Takings for one product across every sale\n        public static decimal TakingsFor(string productID)\n        {\n            decimal total = 0;\n            foreach (Sale s in Sales)\n            {\n                foreach (SaleLine line in s.Items)\n                {\n                    if (line.ProductID == productID)\n                    {\n                        total = total + line.LineTotal;\n                    }\n                }\n            }\n            return total;\n        }\n    }\n}"},{"t":"code","lang":"cs","title":"C#: Program.cs – the whole file (final version: loads products and sales at start-up)","code":"using System;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    internal static class Program\n    {\n        [STAThread]\n        static void Main()\n        {\n            ApplicationConfiguration.Initialize();\n\n            try\n            {\n                DataStore.LoadProducts();          // read products.csv into the list\n                DataStore.LoadSales();             // read sales.csv into the list\n            }\n            catch (IOException ex)\n            {\n                MessageBox.Show(\"The data files could not be read: \" + ex.Message +\n                    \"\\nThe program will close so that the files are not overwritten.\",\n                    \"Tuck Shop\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;                            // stop: do not open the login screen\n            }\n            catch (FormatException ex)\n            {\n                MessageBox.Show(\"A data file contains a damaged line: \" + ex.Message +\n                    \"\\nThe program will close so that the files are not overwritten.\",\n                    \"Tuck Shop\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            Application.Run(new frmLogin());\n        }\n    }\n}"},{"t":"warn","text":"Do not open products.csv or sales.csv in Excel while the program is running: Excel locks the file and saving throws an IOException. View them in Notepad instead."}],"diagram":{"kind":"flow","direction":"lr","title":"Objects to file and back","caption":"Step through saving and loading a sale.","nodes":[{"id":"a","label":"List of Sale objects","detail":"DataStore.Sales: each Sale holds its SaleLines.","shape":"store"},{"id":"b","label":"ToCsvLines()","detail":"One line per item: 'S0001,09/11/2026 10:42,P001,2,1.20'.","shape":"process"},{"id":"c","label":"WriteAllLines","detail":"Every sale's lines written to sales.csv.","shape":"io"},{"id":"d","label":"sales.csv","detail":"Kept on disk after the program closes.","shape":"store"},{"id":"e","label":"ReadAllLines","detail":"At start-up, inside try…catch.","shape":"io"},{"id":"f","label":"Group by sale ID","detail":"A new Sale when the ID changes; each line becomes a SaleLine.","shape":"process"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"],["f","a"]]},"check":[],"exam":[],"practice":[{"q":"Add a 'Back up' button to the Ballyvaren menu that copies sales.csv to sales-backup.csv, overwriting any old backup, with suitable exception handling and messages.","m":3,"a":"Add **btnBackup** to frmMenu, add `using System.IO;` at the top, and in its Click handler:\n```\nprivate void btnBackup_Click(object sender, EventArgs e)\n{\n    try\n    {\n        File.Copy(DataStore.SALES_FILE, \"sales-backup.csv\", true);   // true = overwrite\n        MessageBox.Show(\"Backup made.\", \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n    }\n    catch (FileNotFoundException)\n    {\n        MessageBox.Show(\"There are no sales to back up yet.\", \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n    }\n    catch (IOException ex)\n    {\n        MessageBox.Show(\"Backup failed: \" + ex.Message, \"Back up\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n}\n```\nTest with no sales file (warning), with a file (backup made), and with the backup open in Excel (IOException message)."}],"videos":[],"terms":[]},{"id":"c03-p08","spec":"TASK 16: Build – Input validation","lessons":[],"summary":"Validate every input with presence, length, type (TryParse), range and stock checks, showing a MessageBox and returning the cursor to the box at the first problem.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Input validation","brief":"Validate every input with presence, length, type, range and duplicate checks, showing a clear message at the first problem.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Files","pages":"0 pages (screenshots of each error message for testing)"},"approach":["Code the checks your final designs list for each input.","Use TryParse for every number so text never crashes the program.","Check in order: presence, type, range, then checks against stored data.","Stop at the first error, name the box and the rule, and put the cursor back in that box.","Use one helper method for messages so they all behave the same."],"deliver":["Every input validated","TryParse for every number","Range checks","Duplicate checks where needed","Clear messages naming the box and rule"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"table","head":["Check","Question it asks","C# technique","Ballyvaren example"],"rows":[["Presence","Is anything there?","text == \"\" or SelectedIndex == -1","Product name entered; a category and a product chosen; basket not empty"],["Length","Is it too long?","text.Length > 25, or MaxLength property","Product name 25 characters or fewer"],["Type","Is it the right data type?","int.TryParse / decimal.TryParse","Quantity and stock whole numbers; price and amount paid decimals"],["Range","Is it between limits?","price < 0.10m || price > 5.00m","Price £0.10–£5.00; stock 0–500; quantity 1–20; paid at least the total"],["Lookup","Does it agree with stored data?","Compare with the product's stock level","Quantity plus what is already in the basket not more than the stock"]],"caption":"Validation checks"},{"t":"code","lang":"cs","title":"C#: frmProducts.cs – ValidateInputs and ShowError (inside the frmProducts class)","code":"        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out decimal price, out int stock, out int reorder)\n        {\n            price = 0;\n            stock = 0;\n            reorder = 0;\n            string name = tbName.Text.Trim();\n\n            // presence, length and comma checks on the name\n            if (name == \"\")\n            {\n                ShowError(\"Please enter the product name.\", tbName);\n                return false;\n            }\n            if (name.Length > 25)\n            {\n                ShowError(\"The product name must be 25 characters or fewer.\", tbName);\n                return false;\n            }\n            if (name.Contains(\",\"))\n            {\n                ShowError(\"The product name cannot contain a comma.\", tbName);   // it would break the CSV file\n                return false;\n            }\n            // presence check on the drop-down list\n            if (cmbCategory.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a category.\", cmbCategory);\n                return false;\n            }\n            // type and range checks on the price\n            if (!decimal.TryParse(tbPrice.Text, out price))\n            {\n                ShowError(\"The price must be a number, e.g. 0.60.\", tbPrice);\n                return false;\n            }\n            if (price < 0.10m || price > 5.00m)\n            {\n                ShowError(\"The price must be between £0.10 and £5.00.\", tbPrice);\n                return false;\n            }\n            // type and range checks on the stock and reorder levels\n            if (!int.TryParse(tbStock.Text, out stock) || stock < 0 || stock > 500)\n            {\n                ShowError(\"The stock level must be a whole number from 0 to 500.\", tbStock);\n                return false;\n            }\n            if (!int.TryParse(tbReorder.Text, out reorder) || reorder < 0 || reorder > 500)\n            {\n                ShowError(\"The reorder level must be a whole number from 0 to 500.\", tbReorder);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }"},{"t":"code","lang":"cs","title":"C#: frmSale.cs – ValidateLine, ValidatePayment and ShowError (inside the frmSale class)","code":"        // Checks the product and quantity before a line is added to the basket\n        private bool ValidateLine(out Product product, out int qty)\n        {\n            product = null!;\n            qty = 0;\n            if (cmbProduct.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a product.\", cmbProduct);\n                return false;\n            }\n            product = (Product)cmbProduct.SelectedItem;\n            // type and range checks on the quantity\n            if (!int.TryParse(tbQty.Text, out qty))\n            {\n                ShowError(\"The quantity must be a whole number, e.g. 2.\", tbQty);\n                return false;\n            }\n            if (qty < 1 || qty > MAX_QTY)\n            {\n                ShowError(\"The quantity must be between 1 and \" + MAX_QTY + \".\", tbQty);\n                return false;\n            }\n            // stock check: this line plus what is already in the basket must not exceed the stock\n            int wanted = qty + basket.QtyOf(product.ProductID);\n            if (wanted > product.StockLevel)\n            {\n                ShowError(\"Only \" + product.StockLevel + \" of \" + product.Name + \" left in stock.\", tbQty);\n                return false;\n            }\n            return true;\n        }\n\n        // Checks the payment before the sale is completed\n        private bool ValidatePayment(out decimal paid)\n        {\n            paid = 0;\n            if (basket.Items.Count == 0)\n            {\n                ShowError(\"The basket is empty. Add at least one product.\", cmbProduct);\n                return false;\n            }\n            if (!decimal.TryParse(tbPaid.Text, out paid))\n            {\n                ShowError(\"Enter the amount paid as a number, e.g. 2.00.\", tbPaid);\n                return false;\n            }\n            if (paid < basket.Total())\n            {\n                ShowError(\"The amount paid must be at least £\" + basket.Total().ToString(\"0.00\") + \".\", tbPaid);\n                return false;\n            }\n            if (paid > MAX_PAID)\n            {\n                ShowError(\"The amount paid must be no more than £\" + MAX_PAID.ToString(\"0.00\") + \".\", tbPaid);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }"}],"diagram":{"kind":"flow","direction":"tb","title":"frmSale ValidateLine: order of checks","caption":"Step through the checks; any 'no' shows a message and stops.","nodes":[{"id":"a","label":"Product chosen?","detail":"Presence check.","shape":"decision"},{"id":"b","label":"Quantity a whole number?","detail":"int.TryParse.","shape":"decision"},{"id":"c","label":"Quantity 1–20?","detail":"Range check.","shape":"decision"},{"id":"d","label":"Qty + basket ≤ stock?","detail":"Stock check against the product's StockLevel.","shape":"decision"},{"id":"x","label":"ShowError + return false","detail":"MessageBox, focus the box.","shape":"io"},{"id":"z","label":"return true","detail":"Add the line to the basket.","shape":"end"}],"edges":[["a","b","yes"],["b","c","yes"],["c","d","yes"],["d","z","yes"],["a","x","no"],["b","x","no"],["c","x","no"],["d","x","no"]]},"check":[],"exam":[],"practice":[{"q":"The shop manager wants the reorder level to be no higher than the stock level when a product is first added (it would otherwise appear on the low-stock list straight away). Add this check to ValidateInputs for new products only.","m":3,"a":"After the reorder-level check in ValidateInputs, add:\n```\nif (editing == null && reorder > stock)\n{\n    ShowError(\"For a new product the reorder level cannot be higher than the stock level.\", tbReorder);\n    return false;\n}\n```\nValidateInputs is inside frmProducts, so it can read the `editing` field. Trace: new product, stock 40, reorder 15 → passes; new product, stock 5, reorder 10 → message; editing an existing product with stock 5, reorder 10 → allowed (stock may genuinely be low)."}],"videos":[],"terms":[]},{"id":"c03-p09","spec":"TASK 16: Build – Calculations","lessons":[],"summary":"Code the scenario's calculations as methods, show a running total and the change as values change, and hand-trace them with test data before testing.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Calculations","brief":"Code the scenario's calculations as named methods, show results as values change, and hand-trace them before testing.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Validation","pages":"0 pages"},"approach":["Put each calculation in its own method with a clear name.","Use named constants for fixed values (e.g. the maximum quantity or price limits).","Use decimal for money so totals and change are exact.","Show results live by calling the method from TextChanged or SelectedIndexChanged handlers.","Create handlers from the Properties window's Events list so they are connected.","Hand-trace with normal and boundary values first."],"deliver":["Each calculation in a method","Named constants","Results shown to the user","Hand-traced with boundary values","Screenshot of the calculation working"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"example","title":"Hand-trace: the practice sales","steps":["S0001: 2 × Crisps £0.60 = 1.20, 1 × Water £0.70 = 0.70 → total **£1.90**; paid £2.00 → change **£0.10**.","S0002: 3 × Chocolate Bar £0.85 = **£2.55**. S0003: 2 × Apple £0.40 = 0.80, 1 × Orange Juice £1.10 → **£1.90**.","S0004: 1 × Crisps 0.60 + 2 × Chocolate Bar 1.70 + 1 × Banana 0.35 → **£2.65**. S0005: 3 × Crisps 1.80 + 2 × Water 1.40 → **£3.20**; paid £5.00 → change **£1.80**.","Daily takings: 09/11/2026 = 1.90 + 2.55 + 1.90 = **£6.35** (3 sales); 10/11/2026 = 2.65 + 3.20 = **£5.85** (2 sales). Total £12.20."]},{"t":"code","lang":"cs","title":"C#: frmSale.cs – the whole file","code":"using System;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    public partial class frmSale : Form\n    {\n        private const int MAX_QTY = 20;\n        private const decimal MAX_PAID = 50.00m;\n        private Sale basket = new Sale(\"\", DateTime.Now);    // the sale being built\n\n        public frmSale()\n        {\n            InitializeComponent();\n        }\n\n        private void frmSale_Load(object sender, EventArgs e)\n        {\n            cmbProduct.Items.Clear();\n            foreach (Product p in DataStore.Products)\n            {\n                cmbProduct.Items.Add(p);                   // the list shows p.ToString()\n            }\n            NewBasket();\n            SetUpHelp();\n        }\n\n        private void NewBasket()\n        {\n            basket = new Sale(DataStore.NextSaleID(), DateTime.Now);\n            lstBasket.Items.Clear();\n            cmbProduct.SelectedIndex = -1;\n            tbQty.Clear();\n            tbPaid.Clear();\n            lblTotal.Text = \"Total: £0.00\";\n            lblChange.Text = \"Change: –\";\n            cmbProduct.Focus();\n        }\n\n        // ---------- live change (handler made from the Properties window's Events list) ----------\n        private void tbPaid_TextChanged(object sender, EventArgs e)\n        {\n            decimal paid;\n            if (decimal.TryParse(tbPaid.Text, out paid) && paid >= basket.Total())\n            {\n                lblChange.Text = \"Change: £\" + (paid - basket.Total()).ToString(\"0.00\");\n            }\n            else\n            {\n                lblChange.Text = \"Change: –\";\n            }\n        }\n\n        // ---------- buttons ----------\n        private void btnAdd_Click(object sender, EventArgs e)\n        {\n            Product product;\n            int qty;\n            if (!ValidateLine(out product, out qty))\n            {\n                return;                                     // a message has already been shown\n            }\n            decimal lineTotal = product.Price * qty;\n            basket.AddLine(new SaleLine(product.ProductID, qty, lineTotal));\n            lstBasket.Items.Add(qty + \" x \" + product.Name + \"  £\" + lineTotal.ToString(\"0.00\"));\n            lblTotal.Text = \"Total: £\" + basket.Total().ToString(\"0.00\");   // running basket total\n            cmbProduct.SelectedIndex = -1;\n            tbQty.Clear();\n            cmbProduct.Focus();\n        }\n\n        private void btnComplete_Click(object sender, EventArgs e)\n        {\n            decimal paid;\n            if (!ValidatePayment(out paid))\n            {\n                return;\n            }\n            decimal change = paid - basket.Total();\n\n            // reduce the stock and record the sale\n            foreach (SaleLine line in basket.Items)\n            {\n                Product? p = DataStore.FindProduct(line.ProductID);\n                if (p != null)\n                {\n                    p.ReduceStock(line.Qty);\n                }\n            }\n            DataStore.Sales.Add(basket);\n\n            try\n            {\n                DataStore.SaveProducts();\n                DataStore.SaveSales();\n            }\n            catch (Exception ex) when (ex is IOException || ex is UnauthorizedAccessException)\n            {\n                // undo, so the lists match the files\n                DataStore.Sales.Remove(basket);\n                foreach (SaleLine line in basket.Items)\n                {\n                    Product? p = DataStore.FindProduct(line.ProductID);\n                    if (p != null)\n                    {\n                        p.ReduceStock(-line.Qty);\n                    }\n                }\n                MessageBox.Show(\"The sale could not be saved: \" + ex.Message, \"Save failed\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            MessageBox.Show(\"Sale \" + basket.SaleID + \" complete.\\nTotal: £\" + basket.Total().ToString(\"0.00\") +\n                \"\\nChange: £\" + change.ToString(\"0.00\"), \"Sale complete\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n            NewBasket();\n        }\n\n        private void btnCancelSale_Click(object sender, EventArgs e)\n        {\n            NewBasket();\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"Choose a product, type the quantity (1 to 20) and click Add. \" +\n                \"When the basket is complete, type the amount paid and click Complete Sale. \" +\n                \"The change is shown and the stock is reduced.\", \"Help\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        // ---------- user help: tooltips, placeholder hints and F1 ----------\n        private ToolTip tips = new ToolTip();\n\n        // Called at the end of frmSale_Load\n        private void SetUpHelp()\n        {\n            tips.SetToolTip(cmbProduct, \"Choose a product: ID, name and price\");\n            tips.SetToolTip(tbQty, \"Whole number from 1 to 20\");\n            tips.SetToolTip(btnAdd, \"Add this product to the basket (stock is checked first)\");\n            tips.SetToolTip(tbPaid, \"Amount the customer hands over, e.g. 2.00\");\n            tips.SetToolTip(btnComplete, \"Take payment, show the change and reduce the stock\");\n            tips.SetToolTip(btnHelp, \"How to use this screen (or press F1)\");\n            tbQty.PlaceholderText = \"1 to 20\";              // grey hint shown while the box is empty\n            tbPaid.PlaceholderText = \"e.g. 2.00\";\n            this.KeyPreview = true;                         // the form sees key presses before the controls\n            this.KeyDown += frmSale_KeyDown;                // connect the F1 handler\n        }\n\n        private void frmSale_KeyDown(object sender, KeyEventArgs e)\n        {\n            if (e.KeyCode == Keys.F1)\n            {\n                btnHelp_Click(sender, EventArgs.Empty);     // same instructions as the Help button\n                e.Handled = true;\n            }\n        }\n\n        // ---------- validation ----------\n        // Checks the product and quantity before a line is added to the basket\n        private bool ValidateLine(out Product product, out int qty)\n        {\n            product = null!;\n            qty = 0;\n            if (cmbProduct.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a product.\", cmbProduct);\n                return false;\n            }\n            product = (Product)cmbProduct.SelectedItem;\n            // type and range checks on the quantity\n            if (!int.TryParse(tbQty.Text, out qty))\n            {\n                ShowError(\"The quantity must be a whole number, e.g. 2.\", tbQty);\n                return false;\n            }\n            if (qty < 1 || qty > MAX_QTY)\n            {\n                ShowError(\"The quantity must be between 1 and \" + MAX_QTY + \".\", tbQty);\n                return false;\n            }\n            // stock check: this line plus what is already in the basket must not exceed the stock\n            int wanted = qty + basket.QtyOf(product.ProductID);\n            if (wanted > product.StockLevel)\n            {\n                ShowError(\"Only \" + product.StockLevel + \" of \" + product.Name + \" left in stock.\", tbQty);\n                return false;\n            }\n            return true;\n        }\n\n        // Checks the payment before the sale is completed\n        private bool ValidatePayment(out decimal paid)\n        {\n            paid = 0;\n            if (basket.Items.Count == 0)\n            {\n                ShowError(\"The basket is empty. Add at least one product.\", cmbProduct);\n                return false;\n            }\n            if (!decimal.TryParse(tbPaid.Text, out paid))\n            {\n                ShowError(\"Enter the amount paid as a number, e.g. 2.00.\", tbPaid);\n                return false;\n            }\n            if (paid < basket.Total())\n            {\n                ShowError(\"The amount paid must be at least £\" + basket.Total().ToString(\"0.00\") + \".\", tbPaid);\n                return false;\n            }\n            if (paid > MAX_PAID)\n            {\n                ShowError(\"The amount paid must be no more than £\" + MAX_PAID.ToString(\"0.00\") + \".\", tbPaid);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }\n    }\n}"},{"t":"warn","text":"Use `decimal` for money: `double` stores 0.1 approximately, so a total of three £0.85 items can appear as 2.5499999. Write decimal literals with an m: `0.85m`."}],"diagram":{"kind":"calc","title":"Try the basket and change calculation","caption":"Two products in the basket and the amount paid.","inputs":[{"id":"p1","label":"Price of item 1 (£)","value":0.6},{"id":"q1","label":"Quantity of item 1","value":3},{"id":"p2","label":"Price of item 2 (£)","value":0.7},{"id":"q2","label":"Quantity of item 2","value":2},{"id":"paid","label":"Amount paid (£)","value":5}],"formula":"paid - (p1*q1 + p2*q2)","result":{"label":"Change","unit":"£"}},"check":[],"exam":[],"practice":[{"q":"The tuck shop introduces a healthy-choice discount: a basket that contains at least one Drink and at least one Fruit gets £0.25 off. Write a method `Saving()` in the Sale class that returns the discount for the basket, and trace it.","m":3,"a":"In Sale.cs (it needs the categories, so it looks each product up in DataStore):\n```\npublic decimal Saving()\n{\n    bool drink = false;\n    bool fruit = false;\n    foreach (SaleLine line in items)\n    {\n        Product? p = DataStore.FindProduct(line.ProductID);\n        if (p != null && p.Category == \"Drink\") drink = true;\n        if (p != null && p.Category == \"Fruit\") fruit = true;\n    }\n    if (drink && fruit)\n    {\n        return 0.25m;\n    }\n    return 0;\n}\n```\nThe amount to pay would then be Total() − Saving(). Trace: S0003 (2 × Apple, 1 × Orange Juice) has a drink and a fruit → saving £0.25, so £1.90 − 0.25 = £1.65. S0002 (Chocolate Bars only) → saving £0."}],"videos":[],"terms":[]},{"id":"c03-p10","spec":"TASK 16: Build – Displaying data in a ListBox or DataGridView","lessons":[],"summary":"Show a list of objects in a DataGridView (bound: one column per property; or unbound: rows added in code) or a ListBox, and refresh it when the data changes.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Displaying data in a ListBox or DataGridView","brief":"Show the stored data in a DataGridView or ListBox and keep it up to date.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Calculations","pages":"0 pages (screenshots for testing)"},"approach":["Choose a bound grid (DataSource = list), an unbound grid (Rows.Add) or a ListBox (ToString).","Make grids read-only with no user-added rows.","Refresh by setting DataSource to null, then to the list.","Let a row click load that object for editing.","Screenshot the display with test data."],"deliver":["Stored data displayed","Display read-only","Refreshes after every change","Selecting a row works","Screenshot with test data"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"example","title":"How to set up the products grid","steps":["Drag a **DataGridView** onto frmProducts. Close the smart-tag pop-up (do not choose a data source there).","Set **(Name)** *dgvProducts*, **ReadOnly** True, **AllowUserToAddRows** False, **AllowUserToDeleteRows** False, **SelectionMode** FullRowSelect, **AutoSizeColumnsMode** Fill.","Add the input boxes (*tbName*, *cmbCategory* with DropDownList, *tbPrice*, *tbStock*, *tbReorder*), a Label *lblID*, *tbSearch*, Buttons **btnNew**, **btnSave**, **btnSearch**, **btnShowAll**, **btnHelp**, **btnBack** and a Label **lblCount**.","Double-click the form background to create **frmProducts_Load** and each button to create its Click handler. For the grid, open the **Events** list and double-click **CellClick**.","On the New Sale screen the basket uses a **ListBox** instead: each line is added with `lstBasket.Items.Add(…)`."]},{"t":"code","lang":"cs","title":"C#: frmProducts.cs – the whole file","code":"using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    public partial class frmProducts : Form\n    {\n        private Product? editing = null;        // null = adding a new product\n\n        public frmProducts()\n        {\n            InitializeComponent();\n        }\n\n        private void frmProducts_Load(object sender, EventArgs e)\n        {\n            cmbCategory.Items.Clear();\n            foreach (string c in DataStore.Categories)\n            {\n                cmbCategory.Items.Add(c);\n            }\n            ShowProducts(DataStore.Products);\n            ClearForm();\n        }\n\n        private void ShowProducts(List<Product> list)\n        {\n            dgvProducts.DataSource = null;          // clear first, or the grid will not refresh\n            dgvProducts.DataSource = list;          // one column per public property, one row per object\n            lblCount.Text = list.Count + \" product(s)\";\n        }\n\n        // Clicking a row loads that product into the boxes for editing\n        private void dgvProducts_CellClick(object sender, DataGridViewCellEventArgs e)\n        {\n            if (e.RowIndex < 0)\n            {\n                return;                             // the header row was clicked\n            }\n            Product selected = (Product)dgvProducts.Rows[e.RowIndex].DataBoundItem;\n            editing = selected;\n            lblID.Text = selected.ProductID;\n            tbName.Text = selected.Name;\n            cmbCategory.SelectedItem = selected.Category;\n            tbPrice.Text = selected.Price.ToString(\"0.00\");\n            tbStock.Text = selected.StockLevel.ToString();\n            tbReorder.Text = selected.ReorderLevel.ToString();\n            btnSave.Text = \"Save changes\";\n        }\n\n        private void btnSave_Click(object sender, EventArgs e)\n        {\n            decimal price;\n            int stock, reorder;\n            if (!ValidateInputs(out price, out stock, out reorder))\n            {\n                return;                             // a message has already been shown\n            }\n\n            string name = tbName.Text.Trim();\n            Product? added = null;\n            string message;\n            if (editing == null)\n            {\n                added = new Product(DataStore.NextProductID(), name, cmbCategory.Text, price, stock, reorder);\n                DataStore.Products.Add(added);\n                message = \"Product \" + added.ProductID + \" added.\";\n            }\n            else\n            {\n                editing.Name = name;                // the properties' set accessors change the object\n                editing.Category = cmbCategory.Text;\n                editing.Price = price;\n                editing.StockLevel = stock;\n                editing.ReorderLevel = reorder;\n                message = \"Product \" + editing.ProductID + \" updated.\";\n            }\n\n            try\n            {\n                DataStore.SaveProducts();\n            }\n            catch (Exception ex) when (ex is IOException || ex is UnauthorizedAccessException)\n            {\n                if (added != null)\n                {\n                    DataStore.Products.Remove(added);   // undo, so the list matches the file\n                }\n                MessageBox.Show(\"The products could not be saved: \" + ex.Message, \"Save failed\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Error);\n                return;\n            }\n\n            MessageBox.Show(message, \"Saved\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n            ShowProducts(DataStore.Products);\n            ClearForm();\n        }\n\n        private void btnNew_Click(object sender, EventArgs e)\n        {\n            ClearForm();\n        }\n\n        private void btnShowAll_Click(object sender, EventArgs e)\n        {\n            tbSearch.Clear();\n            ShowProducts(DataStore.Products);\n        }\n\n        private void btnHelp_Click(object sender, EventArgs e)\n        {\n            MessageBox.Show(\"To add a product, fill in the boxes and click Add product. \" +\n                \"To edit, click the product in the table, change the boxes and click Save changes. \" +\n                \"Price £0.10 to £5.00; stock and reorder level 0 to 500.\", \"Help\",\n                MessageBoxButtons.OK, MessageBoxIcon.Information);\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        private void ClearForm()\n        {\n            editing = null;\n            lblID.Text = \"(new)\";\n            tbName.Clear();\n            cmbCategory.SelectedIndex = -1;\n            tbPrice.Clear();\n            tbStock.Clear();\n            tbReorder.Clear();\n            btnSave.Text = \"Add product\";\n            tbName.Focus();\n        }\n\n        // ---------- linear search by ID or part of a name ----------\n        private void btnSearch_Click(object sender, EventArgs e)\n        {\n            string searchFor = tbSearch.Text.Trim().ToLower();\n            if (searchFor == \"\")\n            {\n                MessageBox.Show(\"Type a product ID or part of a name to search for.\", \"Search\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Information);\n                tbSearch.Focus();\n                return;\n            }\n\n            List<Product> results = new List<Product>();\n            foreach (Product p in DataStore.Products)                 // check every product in turn\n            {\n                if (p.ProductID.ToLower() == searchFor || p.Name.ToLower().Contains(searchFor))\n                {\n                    results.Add(p);\n                }\n            }\n\n            if (results.Count == 0)\n            {\n                MessageBox.Show(\"No products found for \\\"\" + tbSearch.Text.Trim() + \"\\\".\", \"Search\",\n                    MessageBoxButtons.OK, MessageBoxIcon.Information);\n            }\n            ShowProducts(results);\n        }\n\n        // ---------- validation ----------\n        // Returns true if every input is valid; otherwise shows a message and returns false.\n        private bool ValidateInputs(out decimal price, out int stock, out int reorder)\n        {\n            price = 0;\n            stock = 0;\n            reorder = 0;\n            string name = tbName.Text.Trim();\n\n            // presence, length and comma checks on the name\n            if (name == \"\")\n            {\n                ShowError(\"Please enter the product name.\", tbName);\n                return false;\n            }\n            if (name.Length > 25)\n            {\n                ShowError(\"The product name must be 25 characters or fewer.\", tbName);\n                return false;\n            }\n            if (name.Contains(\",\"))\n            {\n                ShowError(\"The product name cannot contain a comma.\", tbName);   // it would break the CSV file\n                return false;\n            }\n            // presence check on the drop-down list\n            if (cmbCategory.SelectedIndex == -1)\n            {\n                ShowError(\"Please choose a category.\", cmbCategory);\n                return false;\n            }\n            // type and range checks on the price\n            if (!decimal.TryParse(tbPrice.Text, out price))\n            {\n                ShowError(\"The price must be a number, e.g. 0.60.\", tbPrice);\n                return false;\n            }\n            if (price < 0.10m || price > 5.00m)\n            {\n                ShowError(\"The price must be between £0.10 and £5.00.\", tbPrice);\n                return false;\n            }\n            // type and range checks on the stock and reorder levels\n            if (!int.TryParse(tbStock.Text, out stock) || stock < 0 || stock > 500)\n            {\n                ShowError(\"The stock level must be a whole number from 0 to 500.\", tbStock);\n                return false;\n            }\n            if (!int.TryParse(tbReorder.Text, out reorder) || reorder < 0 || reorder > 500)\n            {\n                ShowError(\"The reorder level must be a whole number from 0 to 500.\", tbReorder);\n                return false;\n            }\n            return true;\n        }\n\n        private void ShowError(string message, Control box)\n        {\n            MessageBox.Show(message, \"Please check\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n            box.Focus();\n        }\n    }\n}"},{"t":"warn","text":"If the grid does not update after a change, you reassigned the same list. Set `DataSource = null` first, as ShowProducts does, then set it again."}],"diagram":{"kind":"compare","title":"Bound grid, unbound grid or ListBox?","caption":"Toggle between the three ways the practice system shows data.","states":[{"label":"Bound grid","points":["dgvProducts.DataSource = list;","Columns made automatically: ProductID | Name | Category | Price | StockLevel | ReorderLevel","Refresh: DataSource = null, then the list"],"art":null},{"label":"Unbound grid","points":["Columns added in the designer: Rank | Product | Sold | Takings","dgvBestSellers.Rows.Add(1, \"Crisps\", 6, \"£3.60\");","Refresh: Rows.Clear(), then add again"],"art":null},{"label":"ListBox","points":["lstBasket.Items.Add(\"2 x Crisps  £1.20\");","One line of text per item","Clear with Items.Clear()"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Add a 'Remove last item' button to frmSale that takes the most recent line out of the basket and updates the list and total.","m":3,"a":"Add **btnRemoveLast** and in its Click handler:\n```\nprivate void btnRemoveLast_Click(object sender, EventArgs e)\n{\n    if (basket.Items.Count == 0)\n    {\n        MessageBox.Show(\"The basket is already empty.\", \"Remove\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        return;\n    }\n    basket.Items.RemoveAt(basket.Items.Count - 1);\n    lstBasket.Items.RemoveAt(lstBasket.Items.Count - 1);\n    lblTotal.Text = \"Total: £\" + basket.Total().ToString(\"0.00\");\n}\n```\nTrace: basket 2 × Crisps (1.20) then 1 × Water (0.70), total £1.90; Remove last → only the Crisps line remains, total £1.20."}],"videos":[],"terms":[]},{"id":"c03-p11","spec":"TASK 16: Build – Searching and sorting a list","lessons":[],"summary":"Write a linear search that collects matching objects, a bubble sort that lists low-stock products lowest first, and the built-in List.Sort for the best sellers.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Searching and sorting a list","brief":"Write a linear search and a sort for the data the scenario needs to find or rank.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"No write-up heading","after":"Display","pages":"0 pages (before/after screenshots)"},"approach":["Linear search: check every object and collect the matches.","Ignore capitals with ToLower on both sides.","Show a message when nothing is found.","Sort a copy of the list so the original order is kept.","Write a bubble sort to show the algorithm, or List.Sort with a comparison (with a tie-break).","Check the sort direction (lowest stock first for a reorder list; most sold first for best sellers)."],"deliver":["Case-insensitive search","Not-found message","Sort on the right field and direction","Original list unchanged","Before and after screenshots"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"table","head":["Pass","Comparisons (left vs right stock)","Swaps","Order after the pass"],"rows":[["Start","","","Chocolate Bar 12, Flapjack 8, Orange Juice 9, Banana 6"],["1","12 v 8 swap; 12 v 9 swap; 12 v 6 swap","3","Flapjack 8, Orange Juice 9, Banana 6, Chocolate Bar 12"],["2","8 v 9 no; 9 v 6 swap","1","Flapjack 8, Banana 6, Orange Juice 9, Chocolate Bar 12"],["3","8 v 6 swap","1","Banana 6, Flapjack 8, Orange Juice 9, Chocolate Bar 12"]],"caption":"Bubble sort trace with the practice low-stock products (lowest first)"},{"t":"example","title":"How to set up the three report grids","steps":["Drag a **DataGridView** onto frmReports: **(Name)** *dgvLowStock*, **ReadOnly** True, **AllowUserToAddRows** False. Its columns come from the Product properties when the code sets DataSource.","Drag a second DataGridView: **(Name)** *dgvBestSellers*, ReadOnly, no user rows. Smart-tag arrow › **Edit Columns… › Add** four columns: *Rank*, *Product*, *Sold*, *Takings*. This grid is **unbound**: the code adds the rows.","Drag a third: **(Name)** *dgvTakings*, with three columns *Day*, *Sales*, *Takings*.","Add Buttons **btnRefresh** and **btnBack**, and double-click the form background to create **frmReports_Load**."]},{"t":"code","lang":"cs","title":"C#: frmReports.cs – the whole file (search for products is in frmProducts on the previous page)","code":"using System;\nusing System.Collections.Generic;\nusing System.Windows.Forms;\n\nnamespace TuckShop\n{\n    public partial class frmReports : Form\n    {\n        public frmReports()\n        {\n            InitializeComponent();\n        }\n\n        private void frmReports_Load(object sender, EventArgs e)\n        {\n            ShowReports();\n        }\n\n        private void btnRefresh_Click(object sender, EventArgs e)\n        {\n            ShowReports();\n        }\n\n        private void btnBack_Click(object sender, EventArgs e)\n        {\n            this.Close();\n        }\n\n        private void ShowReports()\n        {\n            ShowLowStock();\n            ShowBestSellers(5);\n            ShowDailyTakings();\n        }\n\n        // ---------- low stock: products at or below their reorder level, lowest stock first ----------\n        private void ShowLowStock()\n        {\n            List<Product> low = new List<Product>();\n            foreach (Product p in DataStore.Products)\n            {\n                if (p.NeedsReorder())\n                {\n                    low.Add(p);\n                }\n            }\n            BubbleSortByStock(low);\n            dgvLowStock.DataSource = null;\n            dgvLowStock.DataSource = low;                 // bound grid: one row per Product\n        }\n\n        // bubble sort: lowest stock level first\n        private void BubbleSortByStock(List<Product> list)\n        {\n            for (int pass = 0; pass < list.Count - 1; pass++)\n            {\n                bool swapped = false;\n                for (int i = 0; i < list.Count - 1 - pass; i++)\n                {\n                    if (list[i].StockLevel > list[i + 1].StockLevel)   // bigger one first? swap\n                    {\n                        Product temp = list[i];\n                        list[i] = list[i + 1];\n                        list[i + 1] = temp;\n                        swapped = true;\n                    }\n                }\n                if (!swapped)\n                {\n                    break;                                // no swaps: already in order\n                }\n            }\n        }\n\n        // ---------- best sellers: an unbound grid filled row by row ----------\n        private void ShowBestSellers(int howMany)\n        {\n            List<Product> ranked = new List<Product>(DataStore.Products);\n            ranked.Sort((x, y) =>\n            {\n                int byQty = DataStore.QuantitySold(y.ProductID).CompareTo(DataStore.QuantitySold(x.ProductID));\n                if (byQty != 0)\n                {\n                    return byQty;                         // more sold first\n                }\n                return string.Compare(x.Name, y.Name, StringComparison.OrdinalIgnoreCase);   // tie: by name\n            });\n\n            dgvBestSellers.Rows.Clear();\n            int rank = 0;\n            foreach (Product p in ranked)\n            {\n                int sold = DataStore.QuantitySold(p.ProductID);\n                if (rank == howMany || sold == 0)\n                {\n                    break;                                // enough rows, or nothing else has sold\n                }\n                rank++;\n                dgvBestSellers.Rows.Add(rank, p.Name, sold, \"£\" + DataStore.TakingsFor(p.ProductID).ToString(\"0.00\"));\n            }\n        }\n\n        // ---------- daily takings: one row per day ----------\n        private void ShowDailyTakings()\n        {\n            List<DateTime> days = new List<DateTime>();\n            foreach (Sale s in DataStore.Sales)\n            {\n                if (!days.Contains(s.SaleDateTime.Date))\n                {\n                    days.Add(s.SaleDateTime.Date);\n                }\n            }\n            days.Sort();\n\n            dgvTakings.Rows.Clear();\n            foreach (DateTime day in days)\n            {\n                int count = 0;\n                decimal takings = 0;\n                foreach (Sale s in DataStore.Sales)\n                {\n                    if (s.SaleDateTime.Date == day)\n                    {\n                        count++;\n                        takings = takings + s.Total();\n                    }\n                }\n                dgvTakings.Rows.Add(day.ToString(\"dd/MM/yyyy\"), count, \"£\" + takings.ToString(\"0.00\"));\n            }\n        }\n    }\n}"}],"diagram":{"kind":"sort","title":"Bubble sort on stock levels","caption":"Step through the bubble sort on the four low-stock levels (12, 8, 9, 6).","algo":"bubble","data":[12,8,9,6]},"check":[],"exam":[],"practice":[{"q":"Add a category filter to the low-stock report: a ComboBox cmbFilter (items All, Snack, Drink, Fruit) on frmReports. When it changes, ShowLowStock should only list products in that category.","m":4,"a":"Change the test in ShowLowStock's loop:\n```\nif (p.NeedsReorder() && (cmbFilter.Text == \"All\" || cmbFilter.Text == \"\" || p.Category == cmbFilter.Text))\n{\n    low.Add(p);\n}\n```\nand add a handler from the Events list:\n```\nprivate void cmbFilter_SelectedIndexChanged(object sender, EventArgs e)\n{\n    ShowLowStock();\n}\n```\nTrace with the practice data: Fruit → Banana 6 only; Drink → Orange Juice 9; Snack → Flapjack 8, Chocolate Bar 12; All → all four, lowest first."}],"videos":[],"terms":[]},{"id":"c03-p12","spec":"TASK 16: Build – Recording errors as you build","lessons":[],"summary":"Recognise syntax, runtime and logic errors, use the Error List and debugger to fix them, and record each one in Corrective Actions with screenshots and an explanation.","blocks":[{"t":"task","label":"TASK 16","title":"Build – Recording errors as you build","brief":"Recognise syntax, runtime and logic errors, fix them with the Error List and debugger, and record each one with screenshots.","where":{"chapter":"Build — evidence goes in the error log and testing screenshots","heading":"Corrective Actions document: one numbered entry per error","after":"Throughout the build","pages":"Half a page per error"},"approach":["Name the type: syntax (won't build), runtime (crashes), logic (wrong result).","Screenshot the code with line numbers and the error or wrong output.","Use breakpoints (F9) and Step Over (F10) to find logic errors.","Screenshot the fixed code with the change highlighted and the working output.","Explain the fault and the fix in a sentence each.","Number the entries (#1, #2…)."],"deliver":["Every error screenshotted","Fixed code screenshotted","Working result screenshotted","Type of error named","Short explanation","Numbered entries"],"marks":{"criteria":["build","testing"],"evidence":"The program itself: IDE use, interface matching the design, annotated code with data types, data structures (class, List), control structures, string handling, functions/methods, operators, validation, help, file handling. Build (27). The Corrective Actions record also feeds Testing (10).","top_band":"High-quality, fully working, annotated code that matches ALL of your design, with validation and help features throughout the whole program."}},{"t":"table","head":["No.","Type","What happened","Cause","Fix"],"rows":[["1","Syntax","CS1002 ; expected (frmSale.cs line 64)","Missing semicolon after `decimal lineTotal = product.Price * qty`","Added the semicolon"],["2","Syntax","CS0103 The name 'tbPrcie' does not exist in the current context","Control is named tbPrice","Corrected the spelling"],["3","Syntax","CS0029 Cannot implicitly convert type 'string' to 'int'","`int qty = tbQty.Text;`","Used int.TryParse(tbQty.Text, out qty)"],["4","Runtime","FormatException: input string was not in a correct format","decimal.Parse(\"cheap\") when testing invalid data","Replaced decimal.Parse with TryParse and an error message"],["5","Runtime","FileNotFoundException: Could not find file '…\\logins.txt'","File not copied to the output folder","Set Copy to Output Directory = Copy if newer; added catch"],["6","Runtime","NullReferenceException when Add was clicked with no product chosen","Code used `product.Price` before checking SelectedIndex","Added the presence check first"],["7","Logic","Low-stock list showed the highest stock first","Bubble sort swapped when left < right","Changed the comparison to >"],["8","Logic","Editing a product added a new product instead","CellClick handler typed by hand, not connected to the grid's event, so editing stayed null","Connected it in Properties › Events › CellClick"]],"caption":"Example error log (Ballyvaren practice)"},{"t":"example","title":"How to find a logic error with a breakpoint","steps":["Click in the grey margin beside the first line of `btnAdd_Click` (or press **F9**). A red dot appears.","Press **F5**, open New Sale, choose Crisps, type 2 and click Add. Visual Studio pauses on the red line.","Hover over a variable, or look in the **Locals** window, to see its current value.","Press **F10** (Step Over) to run one line at a time and watch `lineTotal` and the basket total change. When a value differs from your hand-trace (2 × £0.60 = £1.20), you have found the line with the error.","**Shift + F5** stops; click the red dot to remove the breakpoint."]}],"diagram":{"kind":"table-reveal","title":"Syntax, runtime or logic?","caption":"Decide the type, then click to check.","head":["What happened","Type"],"rows":[["Red squiggle: } expected (CS1513)","Syntax"],["Program stops: Object reference not set to an instance of an object","Runtime (NullReferenceException)"],["Search for 'choc' finds nothing although Chocolate Bar is listed","Logic (compared lower-case search text with the original-case name)"],["Saving with Price = 'cheap' crashes","Runtime (FormatException from decimal.Parse)"],["Change shows £0.00 although £2.00 was paid for £1.90","Logic (e.g. change worked out before the last item was added)"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[4,1]]},"check":[],"exam":[],"practice":[{"q":"A pupil's product search code is `if (p.Name.Contains(tbSearch.Text))`. Searching 'choc' finds nothing although 'Chocolate Bar' is listed. Write up this corrective action as it should appear in Corrective Actions (type, cause, fix with code, how it was tested).","m":3,"a":"**Corrective Action 4 – Logic error.** *What happened:* searching for 'choc' returned no products although P002 is Chocolate Bar (screenshot of the empty grid). *Cause:* Contains is case-sensitive, so 'choc' does not match 'Choc'. *Fix:* both sides are converted to lower case before comparing:\n```\nstring searchFor = tbSearch.Text.Trim().ToLower();\n...\nif (p.Name.ToLower().Contains(searchFor))\n```\n(screenshot of the fixed code). *Retest:* 'choc', 'CHOC' and 'Bar' now all find P002 (screenshot of the grid showing the product)."}],"videos":[],"terms":[]}]},{"id":"c04","n":4,"title":"Testing","intro":"Tasks 17–19: the Testing chapter subtitle page, the requirements being tested, test cases, a full test table with valid, invalid, null and extreme data, and corrective actions. Examples use the fictional Ballyvaren High School Tuck Shop.","pages":[{"id":"c04-p01","spec":"TASK 17: Create a Testing Chapter subtitle page","lessons":[],"summary":"Start the Testing chapter with a subtitle page and understand the types of test and test data you will use.","blocks":[{"t":"task","label":"TASK 17","title":"Create a Testing Chapter subtitle page","brief":"Start the Testing chapter with a page holding only its title, and learn the test and data types the test table uses.","where":{"chapter":"Testing chapter","heading":"Heading 1: Testing Chapter","after":"The end of the Design chapter (or Building chapter)","pages":"1 page"},"approach":["Type Testing Chapter, apply Heading 1, centre it, then a page break.","Update the contents.","Learn black box and white box testing.","Learn valid, invalid, null and extreme data, and test both sides of every boundary."],"deliver":["Testing Chapter subtitle page (Heading 1)","Page break after it","Contents updated"],"marks":{"criteria":[],"evidence":"No direct marks (subtitle page). Understanding test types supports Testing (10).","top_band":"No marks of its own."}},{"t":"table","head":["Term","Meaning","Ballyvaren example"],"rows":[["Black box test","Test what goes in and what comes out, without looking at the code","Type a price of 5.01; check the error message appears"],["White box test","Test chosen by looking at the code, so every path or branch is tried","Test a quantity exactly equal to the stock, so both sides of `wanted > product.StockLevel` are tried"],["Valid data","Data the system should accept","A price of 0.60"],["Invalid data","Data that should be rejected, with an error message","'cheap', 5.01, a quantity of 21, paying £1.50 for £1.90"],["Null data","Nothing entered","Blank product name, no category chosen, an empty basket"],["Extreme (boundary) data","Valid data at the very edge of what is allowed","Prices of £0.10 and £5.00; quantities of 1 and 20; a quantity equal to the stock"]],"caption":"Testing vocabulary"},{"t":"example","title":"How to make the subtitle page","steps":["Go to the end of your Write Up (after the design and build evidence). Press **Ctrl + Enter** for a new page.","Type **Testing Chapter**, apply **Heading 1** and centre it.","Press **Ctrl + Enter** again so the next section starts on a fresh page.","**References › Update Table › Update entire table**."]}],"diagram":{"kind":"match","title":"Test data types","caption":"Match each piece of test data to its type (price £0.10–£5.00).","pairs":[["Price: 0.85","Valid"],["Price: 5.00","Extreme"],["Price: 5.01","Invalid"],["Price: (blank)","Null"],["Price: cheap","Invalid (wrong type)"]]},"check":[],"exam":[],"practice":[{"q":"A product name must be 1–25 characters. Give one example each of valid, invalid, null and extreme test data, and say whether each test is black box or white box.","m":2,"a":"Valid: 'Crisps' (6 characters). Invalid: a 26-character name such as 'Strawberry Yoghurt Raisins' (26 characters). Null: the box left blank. Extreme: a name of exactly 25 characters (and of 1 character). All of these are black box tests: they check the input and the message without reading the code."}],"videos":[],"terms":[]},{"id":"c04-p02","spec":"TASK 18A: List the user requirements","lessons":[],"summary":"Copy the numbered functional and non-functional requirements from the Design chapter into the Testing chapter so every test can refer to them.","blocks":[{"t":"task","label":"TASK 18A","title":"List the user requirements","brief":"Copy the numbered requirements from the Design chapter into the Testing chapter so each test can refer to them.","where":{"chapter":"Testing chapter","heading":"Heading 2: User Requirements Being Tested","after":"Task 17 (Testing subtitle page)","pages":"1–2 pages"},"approach":["PREP: the program should be finished and your Corrective Actions document up to date.","Copy the functional and non-functional lists exactly.","Fix any numbering that restarts (Set Numbering Value).","Use the final wording if a requirement changed (and match the Design chapter).","Plan at least one test for every requirement."],"deliver":["Heading 2 'User Requirements Being Tested'","All functional requirements","All non-functional requirements","Numbers identical to the Design chapter"],"marks":{"criteria":["testing"],"evidence":"Shows the test plan is 'derived from user requirements'. Testing (10).","top_band":"Number every requirement and refer to the numbers in each test."}},{"t":"table","head":["No.","Requirement (Ballyvaren practice)"],"rows":[["1","Staff must log in with a username and password stored in logins.txt."],["8","The system will not allow more of a product to be added to a basket than there is in stock."],["9","The system will take the amount paid, refuse an amount less than the total, and show the change."],["12","The reports screen will show products at or below their reorder level (lowest stock first), the five best sellers and the takings for each day."],["14","Saving a product or a sale will take less than 2 seconds."]],"caption":"Extract from the practice list"},{"t":"example","title":"How to copy the requirements without breaking the numbering","steps":["Under the Testing Chapter subtitle page, add a Heading 2 **User Requirements Being Tested**.","In the Design chapter, select the whole numbered list of functional requirements and **Ctrl + C**.","Paste it under the new heading. If the numbering restarts or continues wrongly, right-click the first number › **Restart at 1** or **Set Numbering Value**.","Do the same for the non-functional requirements, setting the first number to follow on (Ballyvaren: 13).","Check the numbers match the Design chapter exactly."]},{"t":"warn","text":"Every requirement in this list needs at least one test in your test table. Tick them off as you plan your tests on the next pages: an untested requirement cannot be shown as met in the evaluation."}],"diagram":{"kind":"flow","direction":"lr","title":"One number, four places","caption":"Follow requirement 9 through the write-up.","nodes":[{"id":"a","label":"Design: Req 9","detail":"Written as a measurable requirement (Task 7).","shape":"start"},{"id":"b","label":"Testing: Req 9","detail":"Copied in with the same number (Task 18A).","shape":"process"},{"id":"c","label":"Tests 12, 16, 17","detail":"Each row's User requirement column says 9.","shape":"process"},{"id":"d","label":"Evaluation: Req 9","detail":"Fully met, justified by those tests (Task 20).","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"]]},"check":[],"exam":[],"practice":[{"q":"Your Testing chapter's pasted list starts at 1 for the non-functional requirements, but in the Design chapter they are 13–17. Explain how to fix it in Word.","m":1,"a":"Right-click the first non-functional requirement's number › **Set Numbering Value…** › choose **Start new list** and set **Set value to** 13 › OK. The rest follow on as 14, 15, 16, 17. Check they now match the Design chapter."}],"videos":[],"terms":[]},{"id":"c04-p03","spec":"TASK 18B: Create a set of test cases","lessons":[],"summary":"Create numbered test cases (sets of valid 'dummy data') so the test table can refer to 'Test Case 1' instead of repeating the data.","blocks":[{"t":"task","label":"TASK 18B","title":"Create a set of test cases","brief":"Create numbered sets of valid test data so the test table can refer to 'Test Case 1' instead of repeating data.","where":{"chapter":"Testing chapter","heading":"Heading 2: Test Cases","after":"Task 18A","pages":"Half to one page"},"approach":["Make one complete test case for each type of user or record.","Fill every field with realistic, made-up valid data.","Add a larger set where reports, totals or sorting need checking.","Work out the expected totals, change and stock levels by hand now.","Later tests start from a test case and change one value."],"deliver":["Heading 2 'Test Cases'","A numbered test case for each kind of record","Every field filled with valid data","Expected results worked out","No real people's data"],"marks":{"criteria":["testing"],"evidence":"Test data for the plan. Testing (10).","top_band":"Prepare valid, invalid and extreme data sets."}},{"t":"table","head":["Test Case 1 (login)",""],"rows":[["Username","shop1"],["Password","Crisps#7"]],"caption":"Ballyvaren practice"},{"t":"table","head":["Test Case 2 (product)",""],"rows":[["Name","Crisps"],["Category","Snack"],["Price","0.60"],["Stock level","40"],["Reorder level","15"],["Expected ID","P001 (first product)"]]},{"t":"table","head":["Test Case 3 (sale)",""],"rows":[["Basket","2 × Crisps (£0.60), 1 × Water 500ml (£0.70)"],["Amount paid","£2.00"],["Expected total","£1.90"],["Expected change","£0.10"],["Expected stock after (on Test Case 4 data)","Crisps 40 → 38; Water 500ml 30 → 29"]]},{"t":"table","head":["Test Case 4 (full practice data)","Products (ID, name, category, price, stock, reorder)","Sales"],"rows":[["7 products","P001 Crisps Snack 0.60 40 15; P002 Chocolate Bar Snack 0.85 12 15; P003 Flapjack Snack 0.95 8 10; P004 Water 500ml Drink 0.70 30 12; P005 Orange Juice Drink 1.10 9 10; P006 Apple Fruit 0.40 25 10; P007 Banana Fruit 0.35 6 10",""],["5 sales","","09/11/2026: S0001 2 × P001, 1 × P004 (£1.90); S0002 3 × P002 (£2.55); S0003 2 × P006, 1 × P005 (£1.90). 10/11/2026: S0004 1 × P001, 2 × P002, 1 × P007 (£2.65); S0005 3 × P001, 2 × P004 (£3.20)"],["Expected reports","Low stock: Banana 6, Flapjack 8, Orange Juice 9, Chocolate Bar 12. Best sellers: Crisps 6, Chocolate Bar 5, Water 500ml 3, Apple 2, Banana 1","Daily takings: 09/11/2026 £6.35 (3 sales); 10/11/2026 £5.85 (2 sales)"]]}],"diagram":{"kind":"table-reveal","title":"Expected daily takings for Test Case 4","caption":"Work out each day's takings, then click to check.","head":["Day","Sales","Working","Takings"],"rows":[["09/11/2026","S0001, S0002, S0003","1.90 + 2.55 + 1.90","£6.35"],["10/11/2026","S0004, S0005","2.65 + 3.20","£5.85"]],"hidden":[[0,2],[0,3],[1,2],[1,3]]},"check":[],"exam":[],"practice":[{"q":"Write two test cases for a fictional school library system where a pupil (pupil number, name, form class) borrows a book (book ID, title) for 14 days, and a fine is 10p per day late.","m":3,"a":"**Test Case 1 (normal loan):** Pupil number P1023; name Niamh Quinn; form class 9B; book B0451 'The Silver Lough'; date out 02/03; expected due date 16/03; expected fine £0.00 if returned on 16/03.\n**Test Case 2 (late return):** Pupil number P0871; name Patrick Devlin; form class 11A; book B0112 'Tides of Rathlin'; date out 02/03, due 16/03, returned 21/03; expected fine 5 days × 10p = £0.50.\nA third useful case is a book returned exactly on the due date (extreme data), with an expected fine of £0.00."}],"videos":[],"terms":[]},{"id":"c04-p04","spec":"TASK 19A: Create and complete the test table","lessons":[],"summary":"Create a test table with test number, reason, test data, type of test, type of data, expected outcome, actual outcome, match or corrective action, and user requirement, with screenshot evidence.","blocks":[{"t":"task","label":"TASK 19A","title":"Create and complete the test table","brief":"Create and complete a test table with number, reason, data, type of test, type of data, expected and actual outcomes, match or corrective action, and user requirement.","where":{"chapter":"Testing chapter","heading":"Heading 2: Test Plan (functional), then a short table for non-functional requirements","after":"Task 18B (Test cases)","pages":"25–30 pages (often 80–110 tests)"},"approach":["PREP: have your build screenshots to hand.","For every input write valid, invalid, null and extreme tests; then every button and calculation.","Write test data as the test case plus the one value that changes.","Write the expected outcome before running the test, with the exact message or value.","Record the actual outcome with a figure number for its screenshot.","Highlight failed rows and name the corrective action; never change a failure to Match.","Test the non-functional requirements in their own short table."],"deliver":["All the booklet's columns","Every requirement tested","Valid, invalid, null and extreme data for each input","Expected outcome written before running","A labelled screenshot for every test","Failed rows highlighted and linked to a corrective action"],"marks":{"criteria":["testing"],"evidence":"The test table: tests, expected outcome, actual outcome, fixes; black/white box; valid/invalid/extreme data. Testing (10).","top_band":"A well-structured table covering black-box and white-box tests with valid, invalid AND extreme data, linked to the requirements. No screenshots needed for each test."}},{"t":"table","head":["Test No","Reason for test","Test data","Type of test","Type of data","Expected outcome","Actual outcome","Match / corrective action","User requirement"],"rows":[["1","Valid login","Test Case 1","Black box","Valid","Menu opens showing 'Logged in as: shop1'","Menu opened (Figure 1)","Match","1"],["2","Wrong password","shop1 / notMyPassword","Black box","Invalid","Message 'Username or password incorrect. Attempts left: 2'","Message shown (Figure 2)","Match","1, 2"],["3","Blank login","Username and password blank","Black box","Null","Message 'Please enter your username and password.'","Message shown (Figure 3)","Match","1"],["4","Three failed logins","Wrong password three times","Black box","Invalid","Message, then program closes","Program closed (Figure 4)","Match","2"],["5","Add a valid product","Test Case 2","Black box","Valid","Message 'Product P001 added.'; P001 shown in the grid","As expected (Figure 5)","Match","3, 11"],["6","Price above range","Test Case 2 with price 5.01","Black box","Invalid","Message 'The price must be between £0.10 and £5.00.'","Message shown (Figure 6)","Match","3, 7"],["7","Price at bottom of range","Test Case 2 with price 0.10","Black box","Extreme","Product added","Added (Figure 7)","Match","3"],["8","Price typed as text","Price: cheap","Black box","Invalid","Message 'The price must be a number, e.g. 0.60.'","Message shown (Figure 8)","Match","7"],["9","Name left blank","Name: (blank)","Black box","Null","Message 'Please enter the product name.'","Message shown (Figure 9)","Match","7"],["10","Edit a product","Test Case 4: P002 Chocolate Bar price 0.85 → 0.90","Black box","Valid","Message 'Product P002 updated.'; still 7 products","New product P008 added instead (Figure 10)","Corrective Action 1","4"],["11","Search by part of a name","Search: choc","Black box","Valid","P002 Chocolate Bar shown","Shown (Figure 11)","Match","5"],["12","Complete a valid sale","Test Case 3 (on Test Case 4 data)","Black box","Valid","Total £1.90; change £0.10; Crisps stock 40 → 38, Water 30 → 29; sale S0006 saved","As expected (Figure 12)","Match","6, 9, 10"],["13","Quantity equal to the stock","Banana (6 in stock), quantity 6","White box","Extreme","Line added; total £2.10","Message 'Only 6 of Banana left in stock.' (Figure 13)","Corrective Action 2","8"],["14","Quantity out of range","Quantity: 21","Black box","Invalid","Message 'The quantity must be between 1 and 20.'","Message shown (Figure 14)","Match","6, 7"],["15","More than the stock","Banana (6 in stock), quantity 7","Black box","Invalid","Message 'Only 6 of Banana left in stock.'","Message shown (Figure 15)","Match","8"],["16","Paid less than the total","Test Case 3 basket (£1.90), paid 1.50","Black box","Invalid","Message 'The amount paid must be at least £1.90.'","Message shown (Figure 16)","Match","9"],["17","Paid typed as text","Paid: two","Black box","Invalid","Message 'Enter the amount paid as a number, e.g. 2.00.'","Message shown (Figure 17)","Match","7, 9"],["18","Complete with an empty basket","No items added","Black box","Null","Message 'The basket is empty. Add at least one product.'","Message shown (Figure 18)","Match","7"],["19","Low-stock report order","Test Case 4","Black box","Valid","Banana 6, Flapjack 8, Orange Juice 9, Chocolate Bar 12","Chocolate Bar 12, Orange Juice 9, Flapjack 8, Banana 6 (Figure 19)","Corrective Action 3","12"],["20","Best s
