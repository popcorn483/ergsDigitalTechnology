/* =====================================================================
   NOTES MOTION: key points in sequence, table rows, code typing, example steps,
   tutorial steps, and a gentle pulse on interactive diagrams until first used.
   Elements only get .mo when IntersectionObserver exists and motion is allowed.
   ===================================================================== */
@keyframes mo-rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes mo-fade{from{opacity:0}to{opacity:1}}
@keyframes mo-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mo-caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes mo-step{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes mo-pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes dg-pulse{0%,100%{box-shadow:var(--card-shadow),0 0 0 0 color-mix(in srgb,var(--cc) 0%,transparent)}50%{box-shadow:var(--card-shadow),0 0 0 5px color-mix(in srgb,var(--cc) 26%,transparent)}}
.mo.boxed.key li,.mo.tut .tut-s li,.mo.tw tbody tr{opacity:0}
.mo-in.boxed.key li,.mo-in.tut .tut-s li{animation:mo-rise .38s var(--ease) both;animation-delay:calc(var(--i,0) * 75ms + 40ms)}
.mo-in.tw tbody tr{animation:mo-fade .42s ease both;animation-delay:calc(var(--i,0) * 45ms)}
.mo.code .ln{opacity:0}
.mo.code .ln.ty{width:max-content}
.mo-in.code .ln{animation:mo-fade .35s ease both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty{animation:mo-type var(--tt,600ms) steps(var(--tn,20),end) both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty.last::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:1px;vertical-align:-.15em;background:currentColor;opacity:0;animation:mo-caret .5s steps(1) 3;animation-delay:calc(var(--td,0ms) + var(--tt,600ms))}
.ex ol li{animation:mo-step .32s var(--ease)}
.ex ol li::before{animation:mo-pop .4s var(--ease)}
.dg.fresh{animation:dg-pulse 2.8s ease-in-out .8s 5}
@media (prefers-reduced-motion:reduce){ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} .dg.fresh{animation:none} }
@media print{ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} }

/*END-ANIM-CSS*/
/* =====================================================================
   TUTORIAL BOOK: BEGIN (book.mode "tutorial"; source notes/tutorial/tut.css, inserted by notes/tutorial/inject.py)
   project brief card + ER diagram, todo checklist with progress ring, "Your turn: build it" task cards,
   tutorial cover parts and rail part headings. Project colours: shop = hue 2 (teal), booking = hue 10 (plum).
   ===================================================================== */
/* todo checklist */
.todo{--tc:var(--good);border-radius:16px;background:color-mix(in srgb,var(--tc) 6%,var(--paper));outline:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));padding:14px 16px 10px;font-family:var(--sans)}
.todo-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.todo-ring{position:relative;flex:none;width:46px;height:46px;display:grid;place-items:center}
.todo-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.todo-ring circle{fill:none;stroke-width:4.5}
.todo-ring .tr-bg{stroke:color-mix(in srgb,var(--tc) 18%,var(--line-2))}
.todo-ring .tr-fg{stroke:var(--tc);stroke-linecap:round;transition:stroke-dasharray .45s var(--ease)}
.todo-ring b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.todo-t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.todo-t small{font-size:12px;font-weight:700;color:var(--tc);text-transform:uppercase;letter-spacing:.06em}
.todo-t b{font-family:var(--display);font-weight:500;letter-spacing:.03em;font-size:15px;color:var(--ink)}
.todo-c{flex:none;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.todo-l{list-style:none;margin:0;padding:0!important;display:flex;flex-direction:column;gap:2px!important}
.todo-l label{display:flex;gap:11px;align-items:flex-start;padding:8px 8px;border-radius:10px;cursor:pointer;font-family:var(--serif);font-size:15.5px;line-height:1.5}
.todo-l label:hover{background:color-mix(in srgb,var(--tc) 8%,var(--paper))}
.todo-l input{position:absolute;opacity:0;width:1px;height:1px}
.todo-box{flex:none;width:22px;height:22px;margin-top:2px;border-radius:7px;border:2px solid color-mix(in srgb,var(--tc) 55%,var(--line));display:grid;place-items:center;background:var(--paper);transition:background-color .18s,border-color .18s,transform .18s var(--ease)}
.todo-box svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s var(--ease);color:#fff}
.todo-l input:checked + .todo-box{background:var(--tc);border-color:var(--tc)}
.todo-l input:checked + .todo-box svg{opacity:1;transform:none}
.todo-l input:focus-visible + .todo-box{outline:2.5px solid var(--accent);outline-offset:2px}
.todo-l li.ok .todo-x{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--tc) 60%,transparent);text-decoration-thickness:1.5px}
.todo.all{outline-color:var(--tc)}
.todo.all .todo-c{color:var(--tc);font-weight:700}
:root[data-theme="dark"] .todo-box svg{color:var(--paper)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .todo-box svg{color:var(--paper)} }

/* project brief */
.proj{--pc:var(--cc);--pcd:var(--cc-d);border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:var(--soft-shadow);outline:1.5px solid color-mix(in srgb,var(--pc) 35%,var(--line));font-family:var(--sans)}
.proj.p-shop{--pc:var(--h2);--pcd:var(--h2d)}
.proj.p-booking{--pc:var(--h10);--pcd:var(--h10d)}
.proj-h{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:14px;padding:20px 22px;background:var(--pcd);color:#fff}
.proj-pat{position:absolute;inset:0;width:100%;height:100%;z-index:-1;color:#fff}
.proj-ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.proj-ic svg{width:28px;height:28px}
.proj-tt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.proj-tt small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.88}
.proj-tt b{font-family:var(--font-hero);font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(19px,3vw,25px);line-height:1.1;text-wrap:balance}
.proj-st{flex:none;display:flex;gap:14px;font-size:12px;opacity:.92}
.proj-st span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.proj-st b{font-size:22px}
.proj-b{padding:18px 22px 20px;display:flex;flex-direction:column;gap:18px}
.proj-sc{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.65;padding-left:14px;box-shadow:inset 3px 0 0 var(--pc)}
.proj h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 10px;font-family:var(--display);font-weight:500;letter-spacing:.03em;font-size:14px;color:var(--pc)}
.proj h3 > svg{width:18px;height:18px;flex:none}
.proj h3 small{font-family:var(--sans);letter-spacing:0;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-left:auto}
.proj-u{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.proj-u li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pc) 7%,var(--paper));font-size:14.5px;line-height:1.4}
.proj-u li > svg{flex:none;width:20px;height:20px;color:var(--pc);margin-top:1px}
.proj-u li b{display:block;color:var(--ink)}
.proj-u li span{color:var(--ink-2)}
.proj-n{margin:-2px 0 10px;padding:9px 13px;border-radius:10px;background:color-mix(in srgb,var(--b-note) 8%,var(--paper));box-shadow:inset 3px 0 0 var(--b-note);font-size:14px;line-height:1.5;color:var(--ink-2)}
.erd{border-radius:14px;background:color-mix(in srgb,var(--pc) 5%,var(--paper-2));background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;padding:6px;display:flex;justify-content:center;overflow:hidden}
.erd-svg{display:block;width:100%;height:auto}
.erd-l line{stroke:color-mix(in srgb,var(--pc) 70%,var(--ink-3));stroke-width:2}
.erd-ft{fill:none;stroke:color-mix(in srgb,var(--pc) 70%,var(--ink-3));stroke-width:2;stroke-linecap:round}
.erd-t{cursor:pointer;outline:none}
.erd-t rect{fill:var(--paper);stroke:color-mix(in srgb,var(--pc) 55%,var(--line));stroke-width:1.5;transition:fill .18s,stroke .18s}
.erd-t .erd-tab{fill:var(--pc);stroke:none}
.erd-n{text-anchor:middle;font-family:var(--mono);font-weight:600;fill:var(--ink)}
.erd-s{text-anchor:middle;font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.erd-t:hover rect:not(.erd-tab),.erd-t:focus-visible rect:not(.erd-tab){stroke:var(--pc);stroke-width:2.5}
.erd-t.on rect:not(.erd-tab){fill:var(--pcd);stroke:var(--pcd)}
.erd-t.on .erd-n,.erd-t.on .erd-s{fill:#fff}
.erd.picked .erd-l:not(.on){opacity:.25}
.erd.picked .erd-t:not(.on){opacity:.6}
.erd-l.on line,.erd-l.on .erd-ft{stroke:var(--pc);stroke-width:2.8}
.erd-l,.erd-t{transition:opacity .2s}
.erd-d{margin-top:10px;font-size:14px}
.erd-d .muted{margin:0;font-size:13px;color:var(--ink-3)}
.erd-dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.erd-dh b{font-family:var(--mono);font-size:15px;color:var(--pc)}
.erd-dh span{font-size:12.5px;color:var(--ink-3)}
.erd-dh .btn{margin-left:auto;padding:3px 10px;font-size:12px}
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-items:start}
.pf-t{border-radius:12px;background:var(--paper);outline:1px solid var(--line)}
.pf-t > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px}
.pf-t > summary::-webkit-details-marker{display:none}
.pf-t > summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--pc);border-bottom:2px solid var(--pc);transform:rotate(-45deg);transition:transform .2s var(--ease)}
.pf-t[open] > summary::before{transform:rotate(45deg)}
.pf-t > summary b{font-family:var(--mono);font-size:14px;color:var(--ink)}
.pf-t > summary span{margin-left:auto;font-size:12px;color:var(--ink-3)}
.pf-t[open]{outline-color:color-mix(in srgb,var(--pc) 40%,var(--line))}
.pf-t > .pf-l,.pf-t > .pf-r{margin-left:12px;margin-right:12px}
.pf-t > .pf-r{margin-bottom:10px}
.pf-l{list-style:none;margin:0 0 8px;padding:0!important;display:flex;flex-direction:column;gap:3px!important}
.pf-l li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;font-size:13.5px;line-height:1.4;padding:3px 0;border-top:1px dashed var(--line-2)}
.pf-l li:first-child{border-top:0}
.pf-l code{font-family:var(--mono);font-size:13px!important;background:none!important;border:0!important;padding:0!important;color:var(--ink);font-weight:600}
.pf-l span{color:var(--ink-3);font-size:12.5px}
.pf-k{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:0 5px;line-height:1.6}
.pf-k.pk{background:var(--pc);color:var(--paper)}
.pf-k.fk{background:color-mix(in srgb,var(--pc) 14%,var(--paper));color:var(--pc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 40%,transparent)}
.pf-r{margin:0;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-2)}
.pf-r span{font-family:var(--mono);font-size:12px}
.pf-r em{font-family:var(--sans);font-style:normal;color:var(--pc);font-weight:700;margin-left:4px}
.proj .todo{--tc:var(--pc)}
.proj-x ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.proj-x li{position:relative;padding:8px 12px 8px 34px;border-radius:10px;background:color-mix(in srgb,var(--pc) 5%,var(--paper));outline:1px dashed color-mix(in srgb,var(--pc) 35%,var(--line));font-family:var(--serif);font-size:15px;line-height:1.5}
.proj-x li::before{content:"";position:absolute;left:12px;top:14px;width:10px;height:10px;background:var(--pc);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@media (max-width:560px){
  .proj-h{padding:16px 16px;gap:11px;flex-wrap:wrap}
  .proj-ic{width:44px;height:44px;border-radius:13px}.proj-ic svg{width:24px;height:24px}
  .proj-tt{flex-basis:calc(100% - 60px)}
  .proj-st{width:100%;justify-content:flex-start;gap:18px}
  .proj-st span{flex-direction:row;align-items:baseline;gap:5px}.proj-st b{font-size:17px}
  .proj-b{padding:14px 14px 16px}
  .erd{padding:2px}
  .todo{padding:12px 10px 8px}
  .proj h3 small{margin-left:0;flex-basis:100%}
}

/* Your turn: build it */
.sec.s-turn{--bc:var(--b-prac)}
.tt-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:none}
.tt-c{border-radius:16px;background:var(--paper);outline:1.5px solid color-mix(in srgb,var(--bc) 28%,var(--line));box-shadow:var(--soft-shadow);padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;transition:outline-color .2s}
.tt-c.open{outline-color:var(--bc)}
.tt-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tt-n{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;letter-spacing:.04em;font-size:13px;color:var(--bc)}
.tt-n svg{width:16px;height:16px}
.tt-sz{--sc:var(--b-tip);margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12.5px;border-radius:999px;padding:3px 11px 3px 9px;background:color-mix(in srgb,var(--sc) 11%,var(--paper));color:var(--sc)}

.tt-go .btn{border-color:var(--bc);color:var(--bc);font-weight:700}
.tt-go .btn[aria-expanded="true"]{background:var(--bc);color:var(--paper)}
.tt-a{border-radius:12px;background:color-mix(in srgb,var(--b-tip) 7%,var(--paper));box-shadow:inset 3px 0 0 var(--b-tip);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;font-family:var(--serif);font-size:15.5px;line-height:1.6;min-width:0}

@media (max-width:560px){ .tt-c{padding:12px 12px 14px} .tt-sz{margin-left:0} .tt-a{padding:10px 10px 12px} }

/* tutorial cover and rail */
.tcv-k{display:inline-flex;align-items:center;gap:6px;margin-right:12px;padding:3px 11px 3px 8px;border-radius:999px;background:#fff;color:#16213A;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}

body.tut-book #b-gloss{display:none!important}

/* ---------- coursework task card (dominant), lighter page after it ---------- */
.tcard{--tk:var(--cc);border-radius:22px;background:var(--paper);box-shadow:var(--card-shadow),0 0 0 2px color-mix(in srgb,var(--tk) 45%,transparent);overflow:hidden;font-family:var(--sans);display:flex;flex-direction:column}

.tc-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.tc-lab{display:inline-flex;align-items:center;flex:none;font-family:var(--display);font-weight:500;letter-spacing:.04em;font-size:12.5px;line-height:1;padding:6px 10px;border-radius:8px;background:var(--cc-d);color:#fff;white-space:nowrap}
.tc-h h2{margin:0;font-family:var(--font-hero);font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(20px,3vw,27px);line-height:1.12;color:var(--ink);text-wrap:balance}
.tc-brief{margin:10px 0 0;font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink)}
.tc-where dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tc-where dl > div{border-radius:10px;background:var(--paper-2);padding:7px 11px}
.tc-where dt{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

.tc-del .todo-t small{display:none}
.tc-marks p{margin:8px 0 0;font-size:14.5px;line-height:1.5}
.mk-cs{display:flex;flex-wrap:wrap;gap:6px}
.mk-chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--b-exam) 11%,var(--paper));color:var(--b-exam);font-size:13px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--b-exam) 35%,transparent)}
.mk-chip b{font-family:var(--display);font-weight:500;letter-spacing:.03em}
.mk-chip.none{background:var(--paper-2);color:var(--ink-3);box-shadow:none}
.mk-top{padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--b-tip) 9%,var(--paper));box-shadow:inset 3px 0 0 var(--b-tip)}

.mk-b{margin-top:10px}
.mk-b > summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--tk)}
.mk-bd{margin-top:8px}

.cq-meta{font-size:13.5px;color:var(--ink-2)}
.cq-pp{display:flex;flex-direction:column;gap:12px}
.cq-note{margin:0;font-size:13.5px;color:var(--ink-3)}
.cq-big{display:flex;flex-wrap:wrap;gap:10px}

.btn.big svg{width:18px;height:18px}
.cq-tip{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--cc-d) 8%,var(--paper));border-left:4px solid var(--cc-d);font-size:14.5px;line-height:1.5}
.cq-tip b{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.cq-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cq-keys{font-size:12px;color:var(--ink-3)}
.cq-lock{display:flex;gap:14px;align-items:flex-start;margin-top:10px}

.cq-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.cq-tot{font-size:18px;margin:0}
.cq-best{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.cq-secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.cq-secs > div{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:var(--paper-2)}
.cq-secs span{font-size:20px;font-weight:700}
.cq-secs small{color:var(--ink-3)}
.cq-miss ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cq-miss li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.cq-ms2{font-weight:700;font-variant-numeric:tabular-nums}
.cq-opts{display:grid;gap:12px;margin-top:14px}
.cq-opt{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:var(--card-shadow,0 1px 2px rgba(0,0,0,.06)),inset 0 0 0 1.5px color-mix(in srgb,var(--cc-d) 30%,transparent);font-family:var(--sans)}
.cq-opt:hover,.cq-opt:focus-visible{box-shadow:inset 0 0 0 2px var(--cc-d)}
.cq-opt > svg{width:30px;height:30px;flex:none;color:var(--cc-d);padding:9px;border-radius:12px;background:color-mix(in srgb,var(--cc-d) 12%,var(--paper));box-sizing:content-box}
.cq-opt > span:not(.cq-go){flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cq-opt b{font-size:17px}
.cq-opt small{font-size:14px;color:var(--ink-2);line-height:1.45}
.cq-opt em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--cc-d)}
.cq-go{font-size:20px;color:var(--cc-d);flex:none}
.cq-chip2{margin-left:0}
.cq-pl{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:pq}
.cq-pi{padding:18px 20px;display:flex;flex-direction:column;gap:10px;counter-increment:pq}
.cq-pi .cq-meta::before{content:counter(pq) ". ";font-weight:700;color:var(--cc-d)}
.cq-pi .cq-big{display:flex;flex-wrap:wrap;gap:8px}
.cq-pi .btn{display:inline-flex;align-items:center;gap:7px}
.cq-pi .btn svg{width:18px;height:18px;flex:none}
.ppv-inl{display:flex;flex-direction:column;align-items:center;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ppv-inl canvas{display:block;max-width:100%;height:auto!important}
.ppv-inl canvas + canvas{border-top:2px dashed #C9D2DE}
.ppv-load{margin:0;padding:24px;color:#687386;font-family:var(--sans);font-size:14px}
.cq-msbox{display:flex;flex-direction:column;gap:6px}
.cq-msbox::before{content:"CCEA mark scheme";font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cq-tipd summary{cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink-2)}
.cq-tipd > div{padding:8px 0 0;font-size:15px;line-height:1.5}
.cq-rv{font-family:var(--sans);font-size:14px;font-weight:700;text-decoration:none;align-self:flex-start}
.cq-ask{border:0;padding:26px 24px 20px;border-radius:22px;width:min(440px,calc(100vw - 32px));box-sizing:border-box;background:var(--paper);color:var(--ink);text-align:center;font-family:var(--sans);box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.cq-ask::backdrop{background:rgba(10,16,30,.55)}
.cq-ask-ic{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:color-mix(in srgb,#E0A100 18%,var(--paper));color:#B07C00}
.cq-ask-ic svg{width:28px;height:28px}
.cq-ask h2{margin:0 0 8px;font-size:22px}
.cq-ask p{margin:0 0 8px;font-size:15.5px;line-height:1.5}
.cq-ask-s{color:var(--ink-2);font-size:14px!important}
.cq-ask-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}
.cq-ask-b .btn{min-width:150px;justify-content:center}
.cq-ask-n{color:var(--ink-3);font-size:12.5px!important;margin:0!important}
.cq-pop{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:12px;width:min(560px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px;border-radius:18px;background:#16213A;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);transition:opacity .5s}
.cq-pop.fade{opacity:0}
.cq-pop > div{flex:1;min-width:0;display:flex;flex-direction:column}
.cq-pop span{font-size:13px;opacity:.85}
.cq-pop .btn.pri{--cc-d:#3F5A99;flex:none}
.cq-px{flex:none;background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:4px}
@media (max-width:600px){ .cq-card{padding:16px} .cq-keys{display:none} .cq-miss li{grid-template-columns:1fr auto;} .cq-miss li .cq-sec{grid-column:1/-1} .cq-pop{flex-wrap:wrap} .cq-pop .btn.pri{width:100%;justify-content:center} }
@media (prefers-reduced-motion: reduce){ .cq-bar i,.cq-pop{transition:none} }
/* CCEA past-paper viewer (teacher's uploads, used with permission) */
body.ppv-on{overflow:hidden}
.ppv{position:fixed;inset:0;z-index:400;background:rgba(10,16,30,.6);display:grid;place-items:center;padding:12px}
.ppv-in{display:flex;flex-direction:column;width:min(980px,100%);height:min(100%,1100px);background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.ppv-h{display:flex;align-items:flex-start;gap:12px;padding:12px 14px 6px}
.ppv-h > div{flex:1;min-width:0;display:flex;flex-direction:column}
.ppv-h small{font-size:12px;color:var(--ink-3)}
.ppv-x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-size:15px}
.ppv-tabs{display:flex;gap:4px;padding:0 14px}
.ppv-tabs button{flex:1;font:inherit;font-weight:700;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);color:var(--ink-2);cursor:pointer}
.ppv-tabs button[aria-selected="true"]{background:#16213A;border-color:#16213A;color:#fff}
.ppv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line-2)}
.ppv-bar .btn{padding:6px 11px}
.ppv-pn,.ppv-zl{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:4.5em;text-align:center}
.ppv-sp{flex:1}
.ppv-c{flex:1;overflow:auto;background:var(--paper-2);padding:8px;text-align:center;touch-action:pan-x pan-y pinch-zoom}
.ppv-cr{display:flex;flex-direction:column;align-items:center;gap:0}
.ppv-cr canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);display:block}
.ppv-cr canvas + canvas{border-top:2px dashed #C9D2DE}
.ppv-cr[hidden]{display:none}
.ppv-only{margin:0;padding:6px 14px;font-size:13px;color:var(--ink-2);background:var(--accent-soft,#E4ECFA);border-bottom:1px solid var(--line-2)}
.ppv-full[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px currentColor}
.ppv-c canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);margin:0 auto}
.ppv-msg{padding:20px;color:var(--ink-2)}
.has-ppv{flex-wrap:wrap}
@media (max-width:600px){ .ppv{padding:0} .ppv-in{border-radius:0;height:100%} .ppv-dl{display:none} }
/* app update toast (source notes/app/update.js) */
.upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:500;display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;width:min(600px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px;border-radius:18px;background:#16213A;color:#fff;box-shadow:0 18px 44px -12px rgba(0,0,0,.5);font-family:var(--sans)}
.upd > svg{flex:none;width:24px;height:24px;color:#8AB6FF}
.upd > div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.upd b{font-size:15px}
.upd span{font-size:13px;opacity:.85}
.upd ul{margin:2px 0 0;padding-left:1.1em;font-size:13.5px;line-height:1.45}
.upd button{font:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:9px 14px;cursor:pointer}
.upd .upd-go{background:#8AB6FF;color:#101826;border:0}
.upd .upd-go:disabled{opacity:.7}
.upd .upd-later{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
@media (max-width:520px){ .upd{bottom:10px} .upd .upd-go{flex:1} }
.app-chk{width:100%;font:inherit;text-align:left;background:none;border:0;cursor:pointer}
.app-ver{display:block;padding:2px 10px 6px;font-size:11.5px;color:var(--ink-3)}
/* the library menu grew (My progress, My course, install, animation speed): keep it inside the screen and scrollable */
.libmenu{max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;overscroll-behavior:contain}

<script>
const BOOK = {"book":{"id":"U5","title":"Unit 5: Digital Development Practice (controlled assessment tutorials)","qual":"CCEA GCSE Digital Technology","hub":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP","edition":"2026–27","mode":"tutorial","blurb":"Your controlled assessment, task by task: set up, design, build it in C# Windows Forms, test and evaluate"},"chapters":[{"id":"c01","n":1,"title":"Getting set up","intro":"Tasks 1–5 from the guidance booklet: your OneDrive folder, a correctly formatted Write Up document, the front page, header and footer, contents page and the Design chapter subtitle page.","pages":[{"id":"c01-p01","spec":"Start here: Unit 5 at a glance (not a booklet task)","lessons":[],"summary":"What Unit 5 asks you to do, how the 24 booklet tasks fit together, and the fictional practice scenario used in every worked example.","blocks":[{"t":"warn","text":"**The practice example in this book is NOT the real task.** Every worked example uses a made-up school shop, the *Ballyvaren High School Tuck Shop*, so you can see the techniques without anyone giving you an answer. Your controlled assessment uses **this year's CCEA scenario**, which your teacher gives you. You must apply each step in this book to that scenario, in your own words and your own code. Copying the Ballyvaren examples into your write-up earns you nothing and may be treated as malpractice."},{"t":"p","text":"Unit 5: Digital Development Practice is the controlled assessment for Route B (Programming). CCEA sets a scenario: an organisation with a problem that a computer program could solve. You **design** a solution, **build** it in C# using Visual Studio, **test** it and **evaluate** it, and you write all of it up in one Word document."},{"t":"p","text":"Every task page in this book starts with a **task card**: what the booklet asks, where it goes in your write-up, how long it typically runs, how to approach it, and a tickable list of what it must deliver. After the card come one worked example on the practice scenario and, where useful, a how-to, sentence starters and the most common mistake."},{"t":"table","head":["Chapter","Tasks","Typical pages"],"rows":[["Front page and contents","Tasks 1–4","2–3"],["Design chapter","Tasks 5–15 (with the objects page)","About 50 (half the write-up)"],["  – introduction, requirements, audience","Tasks 6–9","3–4"],["  – data requirements and objects","Task 10, objects","5–8"],["  – initial designs and User Feedback I","Tasks 11–12","8–13"],["  – final designs, control tables, processes","Task 13A–C","18–30"],["  – navigation and User Feedback II","Tasks 14–15","1–2"],["Build evidence","Task 16","Error log 3–6 (in Corrective Actions, or a Building chapter if your teacher asks)"],["Testing chapter","Tasks 17–19","About 33 (a third)"],["Evaluation chapter","Tasks 20–24","About 10–12 (a tenth)"],["Whole write-up","Tasks 1–24","About 100"]],"caption":"Whole write-up map: where each task goes and how long it typically runs (patterns, not targets)"},{"t":"project","type":"shop","title":"Practice scenario: Ballyvaren High School Tuck Shop (fictional)","scenario":"Ballyvaren High School is a made-up school in County Antrim. Its tuck shop is run at break and lunch by staff and sixth-form helpers, who write sales in a notebook and count stock by hand, so popular items often run out and the takings are hard to check. The shop manager wants a Windows program that staff log in to, use to keep a list of products with prices and stock levels, sell items from a basket with the total and change worked out, and see which products need reordering, the best sellers and each day's takings. The data must be kept when the program is closed.","users":["Tuck shop staff and helpers – log in, sell items, add and edit products","Shop manager – the client who reviews designs, approves the system and uses the reports"],"tables":[{"name":"Product","fields":["productID (string, e.g. P003, the identifier)","name (string, max 25)","category (string: Snack, Drink or Fruit)","price (decimal, £0.10–£5.00)","stockLevel (int, 0–500)","reorderLevel (int, 0–500)"],"links":["productID → SaleLine.productID (1–∞)"]},{"name":"Sale","fields":["saleID (string, e.g. S0005, the identifier)","saleDateTime (DateTime)","items (a List of SaleLine objects)","Total() method: adds up the line totals"],"links":["saleID → SaleLine.saleID (1–∞)"]},{"name":"SaleLine","fields":["productID (string, matches a Product)","qty (int, 1–20)","lineTotal (decimal = price × qty)"],"links":[]},{"name":"Staff","fields":["username (string) – one line per member of staff in logins.txt","password (string)","CheckLogin() method"],"links":[]}],"note":"These are C# classes and text files, not database tables: Product and Sale objects are kept in List<> collections, products are saved one per line in products.csv, and each sale is saved as one line per item in sales.csv.","features":["Staff login checked against logins.txt with three attempts","Add, edit and search products with validation (name required, price £0.10–£5.00, stock 0–500, category from a drop-down list)","Sale screen: choose a product and quantity, running basket total, stock checked before each item is added","Take payment, calculate the change and reduce the stock when the sale is completed","Products and sales saved to and loaded from CSV files","Reports: low-stock list sorted lowest first, best sellers and daily takings in DataGridViews"],"stretch":["Refunds for returned items","Special offers (e.g. a meal deal price)","Print a reorder list for the supplier"]},{"t":"h","text":"What your teacher can and cannot do"},{"t":"p","text":"A controlled assessment has rules about help. Your teacher can teach you general skills and techniques (like the ones in this book), explain what each task is asking for, and supervise you. Your teacher cannot write, correct or improve your actual work for you, and anything you hand in must be your own. If you are unsure whether something is allowed, ask your teacher before you do it."},{"t":"tip","text":"Keep this year's CCEA scenario and your work private. Do not post either online or share your files with other pupils."}],"diagram":{"kind":"timeline","title":"The controlled assessment, start to finish","caption":"Click each stage to see which booklet tasks belong to it.","items":[{"label":"Set up (Tasks 1–5)","detail":"Folder in OneDrive, Write Up document, styles, front page, header and footer, contents page, Design chapter subtitle page."},{"label":"Analyse (Tasks 6–10)","detail":"Introduction, functional and non-functional requirements, target audience, data requirements (inputs). Also identify the objects and their attributes."},{"label":"Design (Tasks 11–15)","detail":"Wireframes, User Feedback I, final designs, control tables, flowcharts or pseudocode, navigation structure, User Feedback II, submit the design."},{"label":"Build (Task 16)","detail":"Build the program in Visual Studio. Record every error and fix in your Corrective Actions document."},{"label":"Test (Tasks 17–19)","detail":"Testing subtitle page, requirements copied in, test cases, test table, corrective actions."},{"label":"Evaluate (Tasks 20–24)","detail":"Each requirement met, partly met or not met; stage reflections; further developments; performance; robustness; personal reflection."}]},"check":[],"exam":[],"practice":[{"q":"Read this year's CCEA scenario. Using the Ballyvaren project card as a model, write your own one-paragraph summary of the scenario: the organisation, its problem, who will use the system and the three most important things it must do. (Keep it for Task 6.)","m":3,"a":"A good summary for Ballyvaren reads: 'Ballyvaren High School's tuck shop records sales in a notebook and counts stock by hand, so popular items run out and the takings are hard to check. Tuck shop staff will use the system to log in, sell items and keep the product list up to date; the shop manager is the client. The system must (1) only allow staff who log in, (2) total each sale, give the right change and reduce the stock, and (3) show which products need reordering and how much was taken each day.'\n\nYour version must be about **your** scenario: name the organisation and users the scenario names, and pick out the three needs it stresses most (look for words like *must*, *needs to*, *should be able to*)."}],"videos":[],"terms":[]},{"id":"c01-p02","spec":"TASK 1A: Let's prepare our workspace","lessons":[],"summary":"Create your candidate folder in OneDrive, named exactly as your teacher tells you, with Initial Designs and Final Designs folders and a Write Up document, then open it in desktop Word.","blocks":[{"t":"task","label":"TASK 1A","title":"Let's prepare our workspace","brief":"Create your controlled assessment folder in OneDrive, named exactly as your teacher tells you, with Initial Designs and Final Designs folders and a Word document called Write Up.","where":{"chapter":"Set-up (not part of the write-up)","heading":"No heading: this is your OneDrive folder","after":"Nothing – it is the first thing you do","pages":"0 pages"},"approach":["Open OneDrive from MySchool › Microsoft 365 › Apps.","Make one folder for everything, named exactly as your teacher tells you (centre number and candidate number, never your name).","Inside it make Initial Designs and Final Designs folders.","Add a Word document called Write Up and open it in desktop Word (Editing › Open in Desktop).","Ask your teacher where the Visual Studio project should be saved."],"deliver":["Folder named exactly as my teacher told me","No name in any folder or file name","Initial Designs folder","Final Designs folder","Write Up Word document","Write Up open in desktop Word"],"marks":{"criteria":[],"evidence":"Presentation / organisation (no direct marks; no separate QWC marks in Unit 5). Sets up the workspace and files.","top_band":"No marks of its own, but a tidy, well-organised write-up helps the moderator find your evidence."}},{"t":"table","head":["Item","Name","What goes in it"],"rows":[["Folder","The name your teacher gives you","Everything for Unit 5"],["Folder","Initial Designs","Your wireframe documents (Task 11)"],["Folder","Final Designs","Final designs/storyboards, control tables, flowcharts/pseudocode (Task 13)"],["Word document","Write Up","The main document you submit"],["Word document (later)","Corrective Actions","Errors and fixes while building (Task 16)"],["Visual Studio project (later)","your project name","Your C# solution (save where your teacher tells you)"]],"caption":"Your folder when it is finished"},{"t":"example","title":"How to create the folder and the Write Up","steps":["Open **MySchool**, select **Microsoft 365 Web Apps**, then **Apps**, and click **OneDrive**.","Select **My files**, then click **+ Add new › Folder**.","Name the folder **exactly as your teacher tells you**. The name includes the centre number and your candidate number. Press **Create**.","Open the folder. Add another folder called **Initial Designs** and another called **Final Designs**.","Click **+ Add new › Word document**. Rename it **Write Up**.","Open Write Up. In the top-right corner click **Editing** and select **Open in Desktop**, so you work in full desktop Word with all the styles and References tools."]},{"t":"warn","text":"Check the folder name against your teacher's instructions, and check your candidate number twice. A folder with a placeholder left in, or with your name in it, has to be renamed later, and files inside may lose their links."}],"diagram":{"kind":"hotspot","title":"Your candidate folder","caption":"Click each item to see what it is for.","rows":[[{"label":"Candidate folder","detail":"Your Unit 5 folder in OneDrive › My files, named as your teacher tells you (centre number and candidate number). No names.","span":3}],[{"label":"Initial Designs","detail":"One document per screen wireframe (Task 11).","span":1},{"label":"Final Designs","detail":"Final designs/storyboards, control tables and flowcharts or pseudocode (Tasks 13A–13C).","span":1},{"label":"Write Up","detail":"The main Word document. Everything is collated into it at Task 15 and it grows through testing and evaluation.","span":1}],[{"label":"Corrective Actions","detail":"Created at Task 16: screenshots of each error, the fixed code and a short explanation.","span":2},{"label":"Program","detail":"Your Visual Studio solution, saved where your teacher says.","span":1}]],"links":[["Candidate folder","Initial Designs"],["Candidate folder","Final Designs"],["Candidate folder","Write Up"]]},"check":[],"exam":[],"practice":[{"q":"A pupil with candidate number 0583 has named their folder 'Ciara' (their teacher asked for the centre number and candidate number), and it contains a file 'Document1'. List what is wrong and the steps to put it right.","m":2,"a":"Problems: (1) the folder uses a name instead of the centre and candidate numbers the teacher asked for; (2) the Write Up document has the default name; (3) the Initial Designs and Final Designs folders are missing.\n\nFix: in OneDrive select the folder › **Rename** › and type the name exactly as the teacher gave it, with candidate number 0583. Open it, select Document1 › **Rename** › **Write Up**. Then **+ Add new › Folder** twice to make **Initial Designs** and **Final Designs**. Finally open Write Up › **Editing › Open in Desktop**."}],"videos":[],"terms":[]},{"id":"c01-p03","spec":"TASK 1B: Set line spacing and layout","lessons":[],"summary":"Make justified text in Arial, Century Gothic, Times New Roman or Calibri at 12 pt with 1.5 line spacing the Normal style, so the whole write-up is consistent.","blocks":[{"t":"task","label":"TASK 1B","title":"Set line spacing and layout","brief":"Set the whole document to justified text, one of the allowed fonts at 12 pt and 1.5 line spacing, and save it as the Normal style.","where":{"chapter":"Whole document","heading":"No heading: this sets the Normal style","after":"Task 1A","pages":"0 pages"},"approach":["Select everything (Ctrl + A).","Justify (Ctrl + J), choose Arial, Century Gothic, Times New Roman or Calibri, size 12.","Set line spacing to 1.5.","Right-click Normal › Update Normal to Match Selection, so every new paragraph matches.","Paste text from elsewhere with Keep Text Only so it takes on your style."],"deliver":["Text justified","One allowed font used throughout","Size 12","Line spacing 1.5","Normal style updated to match"],"marks":{"criteria":[],"evidence":"Presentation / organisation (no direct marks; no separate QWC marks in Unit 5). Consistent formatting makes the write-up readable.","top_band":"No marks of its own, but a tidy, well-organised write-up helps the moderator find your evidence."}},{"t":"table","head":["Setting","Value","Shortcut / where"],"rows":[["Alignment","Justified","Ctrl + J"],["Font","Arial, Century Gothic, Times New Roman or Calibri","Home › Font"],["Size","12 pt","Home › Font"],["Line spacing","1.5","Home › Paragraph › Line and Paragraph Spacing (or Ctrl + 5)"],["Save as style","Normal","Right-click Normal › Update Normal to Match Selection"]],"caption":"The Task 1B settings"},{"t":"example","title":"How to set the Normal style","steps":["Press **Ctrl + A** to select everything in your blank document.","Press **Ctrl + J** to justify the text (both edges straight).","Change the font to **Arial**, **Century Gothic**, **Times New Roman** or **Calibri**. Pick one and use it throughout.","Set the **Font size** to **12**.","**Home › Paragraph › Line and Paragraph Spacing** › **1.5**.","On the **Home** tab, in the **Styles** group, right-click **Normal** and choose **Update Normal to Match Selection**."]},{"t":"warn","text":"If you paste text in from somewhere else (for example your notes), it can bring its own font with it. Use **right-click › Paste Options › Keep Text Only** so it takes on your Normal style."}],"diagram":{"kind":"hotspot","title":"Where the settings live in Word","caption":"Click each part of the Home tab.","rows":[[{"label":"Font group","detail":"Font name and size boxes. Choose one of the four fonts, size 12.","span":2},{"label":"Paragraph group","detail":"Justify button (Ctrl + J) and the Line and Paragraph Spacing button (choose 1.5).","span":2},{"label":"Styles group","detail":"Normal, Heading 1, Heading 2… Right-click a style to update it to match your selection.","span":2}],[{"label":"Document","detail":"Ctrl + A selects everything before you apply the settings.","span":6}]],"links":[["Font group","Styles group"],["Paragraph group","Styles group"]]},"check":[],"exam":[],"practice":[{"q":"Your Write Up has paragraphs in three different fonts because you pasted some text in. Explain how to make every paragraph match your Normal style without retyping anything.","m":2,"a":"1 Press **Ctrl + A** to select the whole document. 2 Press **Ctrl + Space** to clear character formatting (fonts and sizes typed over the style) and **Ctrl + Q** to clear paragraph formatting. 3 Click **Normal** in the Styles gallery. Headings will also become Normal, so re-apply **Heading 1** and **Heading 2** to your headings afterwards (or select only the body paragraphs instead of using Ctrl + A)."}],"videos":[],"terms":[]},{"id":"c01-p04","spec":"TASK 2: Create a Front Page","lessons":[],"summary":"Create a clear front page with the title, unit, candidate number and centre number, and never your name.","blocks":[{"t":"task","label":"TASK 2","title":"Create a Front Page","brief":"Create a clear front page that identifies the work by centre number and candidate number, never by your name.","where":{"chapter":"Front matter","heading":"Front page (no heading style)","after":"Nothing – it is page 1","pages":"1 page"},"approach":["Centre each line (Ctrl + E).","Type the lines in the booklet's order: Digital Technology, Controlled Assessment, Unit 5: Digital Development Practice, your system's title, candidate number, centre number.","Make the first two lines bold and larger.","Skip logos unless you have spare time: they earn no marks.","End with a page break (Ctrl + Enter)."],"deliver":["Digital Technology / Controlled Assessment","Unit 5: Digital Development Practice","A clear title for my system","Candidate number","Centre number (from my teacher)","No name anywhere","Page break after the front page"],"marks":{"criteria":[],"evidence":"Presentation / organisation (no direct marks; no separate QWC marks in Unit 5). Front page identifies the work (candidate and centre numbers).","top_band":"No marks of its own, but a tidy, well-organised write-up helps the moderator find your evidence."}},{"t":"table","head":["Front page line","What to write"],"rows":[["Digital Technology","Exactly this, bold"],["Controlled Assessment","Exactly this, bold"],["Unit 5: Digital Development Practice","Exactly this"],["TITLE HERE","A short, clear name for the system in **your** scenario"],["Candidate Number: ####","Your four-digit candidate number"],["Centre Number","The school's centre number (your teacher gives you it)"]],"caption":"What the front page must show"},{"t":"example","title":"How to build the front page","steps":["Click at the top of page 1. Press **Ctrl + E** to centre.","Type **Digital Technology**, press Enter, type **Controlled Assessment**. Make both lines bold and larger (for example 16 pt).","Add a few blank lines, then type **Unit 5: Digital Development Practice**.","Add a few more blank lines and type the title of your system (for example *Tuck Shop Stock and Sales System* in the Ballyvaren practice).","Near the bottom type **Candidate Number: ####** (your own number) and on the next line **Centre Number:** followed by the centre number your teacher gives you.","Press **Ctrl + Enter** to insert a page break, so the contents page starts on page 2."]},{"t":"warn","text":"Do not have your name on this document. Check the front page, the file name, and any screenshot you paste in later (for example a Windows login or a Visual Studio title bar showing your user name)."}],"diagram":{"kind":"hotspot","title":"Front page layout","caption":"Click each part of the front page.","rows":[[{"label":"Heading","detail":"Digital Technology / Controlled Assessment: bold, larger, centred.","span":3}],[{"label":"Unit","detail":"Unit 5: Digital Development Practice.","span":3}],[{"label":"Title","detail":"The name of your system for this year's scenario.","span":2},{"label":"Logo (optional)","detail":"Allowed, but it does not give extra marks.","span":1}],[{"label":"Numbers","detail":"Candidate number and centre number. Never your name.","span":3}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"A pupil's front page reads: 'Digital Technology – Ciara Byrne – Shop project'. List everything that is missing or wrong and write out the corrected lines.","m":2,"a":"Wrong: the name must be removed. Missing: 'Controlled Assessment', the unit line, the candidate number and the centre number. 'Shop project' is vague. Corrected, centred, one per line: **Digital Technology** / **Controlled Assessment** / Unit 5: Digital Development Practice / Tuck Shop Stock and Sales System / Candidate Number: 0583 / Centre Number: (the centre number)."}],"videos":[],"terms":[]},{"id":"c01-p05","spec":"TASK 3: Add a header and footer","lessons":[],"summary":"Add a header with the centre number and candidate number and a footer with the page number, so every page can be identified.","blocks":[{"t":"task","label":"TASK 3","title":"Add a header and footer","brief":"Add a header with the centre number and candidate number, and a footer with automatic page numbers.","where":{"chapter":"Every page","heading":"Header and footer (not a heading)","after":"Task 2 (front page)","pages":"0 pages (appears on every page)"},"approach":["Insert › Header › Blank and type the centre number and candidate number.","Go to Footer and insert an automatic page number (Insert › Page Number).","Never type the page number yourself.","Optionally tick Different First Page.","Scroll through to check every page, including screenshot-heavy ones."],"deliver":["Centre number and candidate number in the header","Automatic page number in the footer","Header and footer on every page","No name in the header or footer"],"marks":{"criteria":[],"evidence":"Presentation / organisation (no direct marks; no separate QWC marks in Unit 5). Header and footer let every page be identified.","top_band":"No marks of its own, but a tidy, well-organised write-up helps the moderator find your evidence."}},{"t":"table","head":["Part","Contains","Never contains"],"rows":[["Header","Centre number and candidate number","Your name"],["Footer","Page number (a field that updates by itself)","A typed number such as '1', which would repeat on every page"]],"caption":"Header and footer contents"},{"t":"example","title":"How to add the header and footer","steps":["**Header:** **Insert › Header › Blank**.","Type **Centre Number:** followed by the centre number.","Press **Tab** twice to jump to the right-hand side and type **Candidate Number: ####** (your number).","Optional: make it 10 pt so it does not compete with your text.","**Footer with page numbers:** With the header still open, click **Header & Footer › Go to Footer**.","**Insert › Page Number › Bottom of Page › Plain Number 2** (a centred number).","Optional: tick **Different First Page** on the Header & Footer tab if you want the front page clean (the front page already shows both numbers).","Click **Close Header and Footer**, or double-click the body of the page."]},{"t":"warn","text":"Do not type the page number yourself. A typed '1' appears as 1 on every page. Always use **Insert › Page Number** so Word counts the pages."}],"diagram":{"kind":"hotspot","title":"Header and footer","caption":"Click each area of a page.","rows":[[{"label":"Header – left","detail":"Centre number","span":2},{"label":"Header – right","detail":"Candidate Number: #### (press Tab twice to get here).","span":2}],[{"label":"Body","detail":"Your write-up. Double-click here to leave the header or footer.","span":4}],[{"label":"Footer","detail":"Insert › Page Number › Bottom of Page › Plain Number 2.","span":4}]],"links":[["Header – left","Header – right"]]},"check":[],"exam":[],"practice":[{"q":"Every page of a pupil's Write Up says 'Page 1' at the bottom. Explain why and how to fix it.","m":2,"a":"They typed '1' into the footer instead of inserting a page-number field, so the same text repeats on every page. Fix: double-click the footer, delete 'Page 1', then **Insert › Page Number › Bottom of Page › Plain Number 2** (type 'Page ' before the field if wanted). Close the footer and scroll to check the numbers go up."}],"videos":[],"terms":[]},{"id":"c01-p06","spec":"TASK 4: Create a table of contents","lessons":[],"summary":"Use Heading 1 for chapters and Heading 2 for sections so Word builds an automatic table of contents, and write professionally without I or we.","blocks":[{"t":"task","label":"TASK 4","title":"Create a table of contents","brief":"Insert an automatic table of contents built from heading styles, with chapters for Design, Building, Testing and Evaluation.","where":{"chapter":"Front matter","heading":"Contents (page 2)","after":"Task 2 (front page)","pages":"1–2 pages"},"approach":["Use Heading 1 for chapters and Heading 2/3 for sections; never format headings by hand.","Typical Design sections: Introduction; User Requirements (Functional, Non-Functional); Target Audience; Data Requirements; User Interface Design (Initial Designs, User Feedback, Final Designs); Navigational Structure; User Feedback II.","Give each screen in your designs its own Heading 3 so it appears in the contents.","References › Table of Contents › Automatic Table 1 on page 2.","From now on write professionally: 'The system will…', not 'I will…' (first person only in Tasks 21 and 24).","Update the table at the very end (Update entire table)."],"deliver":["Contents on its own page","Built with References › Table of Contents","Heading 1 for chapters","Heading 2/3 for sections and screens","Updated before submission"],"marks":{"criteria":[],"evidence":"Presentation / organisation (no direct marks; no separate QWC marks in Unit 5). A contents page helps the moderator find evidence.","top_band":"No marks of its own, but a tidy, well-organised write-up helps the moderator find your evidence."}},{"t":"table","head":["Style","Use it for","Examples"],"rows":[["Heading 1","Chapter titles","Design Chapter, Building Chapter, Testing Chapter, Evaluation"],["Heading 2","Sections inside a chapter","Introduction, User Requirements, Target Audience, Data Requirements, Test Plan"],["Heading 3 (optional)","Sub-sections","Functional Requirements, Non-Functional Requirements, one heading per screen"],["Normal","Everything else","Your paragraphs"]],"caption":"Which style to use"},{"t":"example","title":"How to insert the contents page","steps":["Click on page 2 (after the front page break).","Type **Design Chapter** and click **Heading 1** in Home › Styles. Press Enter, type **Introduction** and click **Heading 2**.","Click back at the top of page 2 and choose **References › Table of Contents › Automatic Table 1**.","Press **Ctrl + Enter** after the table so the contents page sits on its own page.","Later, when you add more headings, click the table and choose **Update Table › Update entire table**."]},{"t":"warn","text":"Writing in the first person. Outside Tasks 21 and 24, write about the system, not yourself: 'The system will check the price', not 'I am going to check the price'."}],"diagram":{"kind":"layers","title":"The shape of your Write Up","caption":"Click each layer: this is the order of your finished document.","items":[{"label":"Front page","detail":"Title, unit, candidate and centre numbers (Task 2)."},{"label":"Contents","detail":"Automatic table from Heading 1 and Heading 2 (Task 4)."},{"label":"Design Chapter","detail":"Subtitle page, introduction, requirements, target audience, data requirements, designs, navigation, feedback (Tasks 5–15)."},{"label":"Building Chapter","detail":"Evidence of the build and corrective actions (Task 16)."},{"label":"Testing Chapter","detail":"Subtitle page, requirements, test cases, test table, corrective actions (Tasks 17–19)."},{"label":"Evaluation","detail":"Requirements evaluated, stage reflections, performance, robustness, personal reflection (Tasks 20–24)."}]},"check":[],"exam":[],"practice":[{"q":"Rewrite these three sentences in a professional style: (a) 'I am going to add a help button to every screen.' (b) 'We decided to use C# because I know it.' (c) 'I made the total update when you add an item.'","m":3,"a":"(a) 'Every screen will include a Help button that explains how to use that screen.' (b) 'C# has been chosen because it is suited to Windows form-based programs and Visual Studio provides a form designer and debugger.' (Give a reason about the language, not about yourself.) (c) 'The basket total updates automatically each time an item is added.'"}],"videos":[],"terms":[]},{"id":"c01-p07","spec":"TASK 5: Create a Design Chapter subtitle page","lessons":[],"summary":"Add a Design Chapter subtitle page, then annotate the scenario so you know exactly what the program must do before you write anything.","blocks":[{"t":"task","label":"TASK 5","title":"Create a Design Chapter subtitle page","brief":"Start the Design chapter with a page holding only its title, and annotate the scenario so you know what the program must do.","where":{"chapter":"Design chapter","heading":"Heading 1: Design Chapter","after":"Task 4 (contents)","pages":"1 page"},"approach":["Type Design Chapter, apply Heading 1, centre it, then a page break.","PREP: read the scenario twice, the second time with highlighters.","Highlight users, actions, data, rules and qualities in different colours.","Note a question mark beside anything unclear and ask your teacher what it means.","Keep the annotated scenario beside you: it becomes your requirements, data and validation."],"deliver":["Design Chapter subtitle page (Heading 1)","Page break after it","Contents updated","Scenario annotated: users, actions, data, rules, qualities"],"marks":{"criteria":[],"evidence":"The subtitle page itself earns no marks. Annotating the scenario prepares you to interpret the requirements rather than copy them, which feeds Design (13).","top_band":"Annotate the scenario so you can turn it into your own detailed requirements."}},{"t":"table","head":["Highlight colour","Look for","Ballyvaren practice example","Becomes"],"rows":[["Yellow","Who uses it","'tuck shop staff', 'sixth-form helpers', 'the shop manager'","Target audience (Task 9)"],["Green","Things the system must do (verbs)","'log in', 'add products', 'sell', 'work out change', 'reorder', 'see takings'","Functional requirements (Task 7)"],["Blue","Things it stores (nouns with details)","'product', 'price', 'stock level', 'sale', 'quantity'","Objects, attributes and data requirements (Task 10)"],["Pink","Rules and numbers","'prices from 10p to £5', 'no more than 500 in stock', 'reorder when stock is low'","Validation and calculations"],["Orange","Qualities","'quick', 'simple for new staff'","Non-functional requirements (Task 8)"]],"caption":"A highlighting key for the scenario"},{"t":"example","title":"How to make the subtitle page","steps":["After the contents page, type **Design Chapter** and apply **Heading 1**.","Centre it (**Ctrl + E**) and, if you like, move it down the page with a few blank lines.","Press **Ctrl + Enter** so the Introduction starts on a new page.","Update the table of contents to check the chapter appears."]}],"diagram":{"kind":"flow","direction":"lr","title":"From scenario to design","caption":"Step through how your annotations feed the design tasks.","nodes":[{"id":"a","label":"Read scenario","detail":"Read it twice: once for the story, once with highlighters.","shape":"start"},{"id":"b","label":"Highlight users","detail":"Who uses the system? Becomes the target audience (Task 9).","shape":"process"},{"id":"c","label":"Highlight actions","detail":"Verbs: what the system must do. Becomes functional requirements (Task 7).","shape":"process"},{"id":"d","label":"Highlight data","detail":"Nouns and details: becomes objects, attributes and data requirements (Task 10).","shape":"process"},{"id":"e","label":"Highlight rules","detail":"Numbers, limits and prices: validation and calculations for designs and code.","shape":"process"},{"id":"f","label":"Write Task 6","detail":"Now write the introduction.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[],"exam":[],"practice":[{"q":"Here is a short fictional brief: 'Ardmore Library wants its volunteers to lend books to members. Members are aged 5 to 90 and have a library card number. Each member may borrow up to 6 books for 21 days. The librarian should be able to see quickly which books are overdue.' Annotate it using the five-colour key.","m":4,"a":"Yellow (users): volunteers, the librarian (members are not users, they are the people whose details are stored).\nGreen (actions): lend books; see which books are overdue (search).\nBlue (data): member (card number, name, age), book, loan (date out, due date).\nPink (rules): age 5–90 (range check); up to 6 books (limit check); 21 days (due-date calculation).\nOrange (qualities): 'quickly' (overdue list shown in under a second, a non-functional requirement)."}],"videos":[],"terms":[]}]},{"id":"c02","n":2,"title":"Design","intro":"Tasks 6–15: introduction, functional and non-functional requirements, target audience, data requirements, objects, wireframes, User Feedback I, final designs, control tables, flowcharts and pseudocode, navigation structure, User Feedback II and submission. Worked examples use the fictional Ballyvaren High School Tuck Shop – your own work must use this year's CCEA scenario.","pages":[{"id":"c02-p01","spec":"TASK 6: Introduction","lessons":[],"summary":"Write an introduction that explains the purpose of the system, the benefits of a computer system, why C# and Visual Studio suit it, and how it will be robust, efficient and meet user needs.","blocks":[{"t":"task","label":"TASK 6","title":"Introduction","brief":"Write an introduction to the system: its purpose, the benefits of a computer system, why C# and Visual Studio, and how it will be robust, efficient and meet user needs.","where":{"chapter":"Design chapter","heading":"Heading 2: Introduction","after":"Task 5 (Design Chapter subtitle page)","pages":"About 1 page"},"approach":["Name the organisation, its client and its current problem from the scenario.","Write one short paragraph per booklet question, in order: purpose, benefits, why C#, Visual Studio features, robustness, efficiency, user needs.","Give a reason for every claim (what C#'s classes allow in this system, what the debugger lets you do).","Name specific Visual Studio features: form designer, Toolbox, Properties, IntelliSense, line numbers, debugger, Error List.","Write professionally: no I or We."],"deliver":["Heading 2 'Introduction'","Purpose of the system","Benefits of a computer system","Why C#","Visual Studio features to be used","How it will be robust","How it will be efficient","How user needs will be met","No I or We"],"marks":{"criteria":["design"],"evidence":"Sets the context of the problem and the proposed solution; supporting evidence for Design (13).","top_band":"Explain the problem and how your solution solves it for this client, not in general terms."}},{"t":"compare","head":["Weak","Strong"],"rows":[["Purpose","The system is for a tuck shop.","Ballyvaren High School's tuck shop records sales in a notebook and counts stock by hand, so popular items run out and the takings are hard to check. The proposed system will allow staff to log in, sell items from a basket with the total and change worked out, and see which products need reordering."],["Why C#","C# is good and easy.","C# is suitable because Windows Forms allows a graphical interface with buttons, text boxes and drop-down lists, and its object-oriented features allow each product and each sale to be stored as an object of its own class."],["Robust","It won't crash.","Every input will be validated (for example a range check of £0.10–£5.00 on the price) and file operations will be placed in try…catch blocks so that a missing file produces a message rather than a crash."]]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The purpose of the proposed system is to…*","*Currently, the organisation… which causes…*","*A computer system would benefit the organisation because…*","*C# has been chosen because…*","*Visual Studio provides…, which…*","*To ensure the system is robust, …*"],"ordered":false}],"diagram":{"kind":"cycle","title":"The seven introduction questions","caption":"Click each question: one paragraph each.","items":[{"label":"Purpose","detail":"Who is the organisation, what is the problem, what will the system do?"},{"label":"Benefits","detail":"Why is a computer system better than the current method?"},{"label":"Why C#","detail":"Windows Forms, object-oriented classes, data types, file handling."},{"label":"Visual Studio","detail":"Form designer, code editor, line numbers, Solution Explorer, debugger, Error List."},{"label":"Robust","detail":"Validation, error messages, exception handling, testing, help."},{"label":"Efficient","detail":"Lists in memory, short files, reusable methods."},{"label":"User needs","detail":"Measurable numbered requirements, client review, testing against each one."}]},"check":[],"exam":[],"practice":[{"q":"Write the 'Benefits' paragraph of an introduction for the Ballyvaren tuck shop practice system, giving at least three benefits over the notebook method.","m":4,"a":"'A computer system would benefit the Ballyvaren tuck shop in several ways. The total of each sale and the change would be calculated automatically, so mistakes in mental arithmetic at a busy break time would be avoided. The stock level of each product would be reduced as it is sold, so the shop manager could see at once which products are at or below their reorder level instead of counting shelves by hand. Sales would be saved to a file, so the takings for each day could be checked against the cash in a few seconds and could not be lost in the way a notebook can. Validation would also stop impossible data, such as selling more of a product than is in stock.'"}],"videos":[],"terms":[]},{"id":"c02-p02","spec":"TASK 7: Functional requirements","lessons":[],"summary":"Set out what the system must include and do as a numbered list of measurable functional requirements.","blocks":[{"t":"task","label":"TASK 7","title":"Functional requirements","brief":"Set out what the system must include and do as a numbered list of measurable functional requirements.","where":{"chapter":"Design chapter","heading":"Heading 2: User Requirements › Heading 3: Functional Requirements","after":"Task 6 (Introduction)","pages":"About 1 page"},"approach":["PREP: use your green (action) highlights: each action in the scenario becomes at least one requirement.","Add what every system needs: login, save and load, validation with error messages.","Make each one measurable: a yes/no answer to 'was it met?'.","Many strong write-ups group requirements by screen with lettered sub-points (e.g. 6 a, b, c) so tests can cite '6 (b)'.","Start each with 'The system will…' or 'Staff will be able to…'.","Check every screen in your navigation structure is covered."],"deliver":["Heading 3 'Functional Requirements'","Numbered list","Every action in the scenario covered","Every requirement measurable","Login, save/load and validation included where needed","Matches this year's scenario, not the practice one"],"marks":{"criteria":["design"],"evidence":"Data/processing requirements; also the list that Testing and Evaluation are measured against. Design (13).","top_band":"Write numbered, measurable requirements in your own words. Do not copy them from the task. Moderators penalise copied requirements."}},{"t":"table","head":["No.","Type","Requirement (Ballyvaren practice only)"],"rows":[["1","Functional","Staff must log in with a username and password stored in logins.txt before any other screen opens."],["2","Functional","The program will close after three incorrect login attempts."],["3","Functional","Staff will be able to add a product with name, category (Snack, Drink or Fruit), price (£0.10–£5.00), stock level (0–500) and reorder level; the system will give each product a unique ID (P001, P002, …)."],["4","Functional","Staff will be able to edit an existing product's name, category, price, stock level and reorder level."],["5","Functional","Staff will be able to search for products by ID or name."],["6","Functional","Staff will be able to build a sale by choosing a product and a quantity (1–20); the basket and its running total will be shown."],["7","Functional","Invalid data will be rejected with an error message that says what is wrong."],["8","Functional","The system will not allow more of a product to be added to a basket than there is in stock."],["9","Functional","The system will take the amount paid, refuse an amount less than the total, and show the change."],["10","Functional","Completing a sale will reduce the stock level of each product sold and save the sale with a unique ID (S0001, S0002, …)."],["11","Functional","Products and sales will be saved to CSV files and loaded when the program starts."],["12","Functional","The reports screen will show products at or below their reorder level (lowest stock first), the five best sellers and the takings for each day."]],"caption":"Example functional requirements for the practice scenario"},{"t":"warn","text":"Do not copy the Ballyvaren list. Your requirements must come from this year's scenario. A moderator can see straight away when a list does not match the task."}],"diagram":{"kind":"flow","direction":"tb","title":"Is it a good requirement?","caption":"Step through the test for each requirement you write.","nodes":[{"id":"a","label":"Write requirement","detail":"Start with 'The system will…'.","shape":"start"},{"id":"b","label":"From the scenario?","detail":"Can you point to the sentence in the scenario it comes from (or is it needed for the system to work at all)?","shape":"decision"},{"id":"c","label":"Yes/no answer?","detail":"Could a tester say 'met' or 'not met' without arguing?","shape":"decision"},{"id":"d","label":"Rewrite it","detail":"Add the specific screen, data or number that makes it testable.","shape":"process"},{"id":"e","label":"Add to numbered list","detail":"Give it the next number.","shape":"end"}],"edges":[["a","b"],["b","c","yes"],["b","d","no"],["c","e","yes"],["c","d","no"],["d","b"]]},"check":[],"exam":[],"practice":[{"q":"Rewrite these weak requirements for a fictional school library loans system so they are measurable: (a) 'Loans should be easy.' (b) 'The system will handle fines.' (c) 'Pupils shouldn't take too many books.'","m":3,"a":"(a) 'Staff will be able to issue a book by choosing the pupil from a drop-down list and typing the book's ID.' (b) 'The system will calculate a fine of 10p for each day a book is overdue.' (c) 'The system will refuse a loan when the pupil already has 3 books out.' Each now has a clear yes/no test."}],"videos":[],"terms":[]},{"id":"c02-p03","spec":"TASK 8: Non-functional requirements","lessons":[],"summary":"State the non-functional requirements (how well the system works: speed, efficiency, learnability, consistency) as a numbered list continuing from the functional requirements.","blocks":[{"t":"task","label":"TASK 8","title":"Non-functional requirements","brief":"State how well the system must work (speed, efficiency, learnability, consistency, security) as a numbered list continuing from the functional requirements.","where":{"chapter":"Design chapter","heading":"Heading 3: Non-Functional Requirements","after":"Task 7 (Functional requirements)","pages":"About half a page"},"approach":["Continue the numbering from your functional requirements.","Aim for three to five.","Give each one a measure: a time limit, a consistency rule, a learnability target, or 'does not crash with valid, invalid, null and extreme data'.","Avoid untestable words like 'fast' or 'user friendly' on their own."],"deliver":["Heading 3 'Non-Functional Requirements'","Numbering continues from Task 7","3–5 requirements","Speed/efficiency and learnability covered","Each one measurable"],"marks":{"criteria":["design","evaluation"],"evidence":"Requirements, plus the performance and robustness points you evaluate later. Design (13).","top_band":"Make each non-functional requirement measurable so Task 22/23 can judge it."}},{"t":"table","head":["No.","Type","Requirement (Ballyvaren practice only)"],"rows":[["13","Non-functional","Every screen will use the same colours, font (Century Gothic) and title position."],["14","Non-functional","Saving a product or a sale will take less than 2 seconds."],["15","Non-functional","Every screen will have a Help button that explains how to use that screen."],["16","Non-functional","Pressing Tab will move through the boxes on each screen from top to bottom."],["17","Non-functional","A member of staff who has not used the system before will be able to complete a two-item sale in under 1 minute."]],"caption":"Example non-functional requirements, continuing from 12"}],"diagram":{"kind":"compare","title":"Functional or non-functional?","caption":"Toggle between the two kinds of requirement.","states":[{"label":"Functional","points":["What the system DOES","Log in, add a product, sell items, give change, save, search, report","Tested by doing the action with test data","Numbered first: 1, 2, 3, …"],"art":null},{"label":"Non-functional","points":["HOW WELL it does it","Speed, efficiency, learnability, consistency, help, accessibility","Tested by timing, observing a new user or checking every screen","Numbering continues: 13, 14, 15, …"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write three measurable non-functional requirements for a fictional school library loans system, continuing from requirement 10.","m":3,"a":"11. Searching for a book by title will show results in less than 1 second. 12. Every screen will have a Help button explaining how to use that screen. 13. A pupil librarian who has not used the system before will be able to issue a loan in under 2 minutes. (Other good answers: consistent fonts/colours on every screen; Tab order top to bottom; loading the loans file at start-up in under 3 seconds.)"}],"videos":[],"terms":[]},{"id":"c02-p04","spec":"TASK 9: Target audience","lessons":[],"summary":"Write a paragraph on who will use the system, how IT-literate they are, and the features that will make the system suitable for them.","blocks":[{"t":"task","label":"TASK 9","title":"Target audience","brief":"Write a paragraph on who will use the system, whether they are IT specialists, and how the system will be made suitable for them.","where":{"chapter":"Design chapter","heading":"Heading 2: Target Audience","after":"Task 8 (Non-functional requirements)","pages":"One paragraph (under half a page)"},"approach":["PREP: find every type of user in the scenario.","Say whether they are IT specialists and how often they will use the system.","Link each feature to a user need: drop-down lists, Help buttons, clear error messages, consistent layout, readable text.","Keep it to one solid paragraph of 6–10 sentences."],"deliver":["Heading 2 'Target Audience'","Who the users are (from the scenario)","Their IT skill level","Features that make it suitable, each with a reason","Help options"],"marks":{"criteria":["design","build"],"evidence":"'Target audience needs' is in every Design band; the Build band asks for an interface suited to the audience. Design (13), Build (27).","top_band":"Clearly identify the audience's needs and IT skill, and link each need to a design feature (top band: 'clearly identified')."}},{"t":"example","title":"Worked example: Ballyvaren target audience","steps":["Who: 'The system will be used by tuck shop staff and sixth-form helpers at Ballyvaren High School during break and lunch, and by the shop manager, who will also use the reports.'","Skill: 'The helpers are not IT specialists and change every year, and they will use the system with a queue of pupils waiting, so it must be quick to learn and simple to use.'","Features: 'Products will be chosen from a drop-down list showing the name and price, so they cannot be mistyped, and the basket total and the change will be calculated automatically.'","Help: 'Each screen will have a Help button and tooltips, and error messages will explain exactly which box needs to be corrected.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The system will be used by…, who…*","*They are not IT specialists, so…*","*To make the system suitable, it will include…, because…*","*If a user is unsure, …*"],"ordered":false}],"diagram":{"kind":"hotspot","title":"Suiting the audience","caption":"Click each feature to see which user need it answers.","rows":[[{"label":"Drop-down lists","detail":"Stop typing errors; faster with a queue waiting.","span":1},{"label":"Help button and tooltips","detail":"New helpers can find out how a screen works without asking.","span":1},{"label":"Clear error messages","detail":"Say which box is wrong and what is allowed.","span":1}],[{"label":"One task per screen","detail":"Less to take in for non-specialists.","span":1},{"label":"Tab order","detail":"Keyboard users move through boxes in order.","span":1},{"label":"Consistent design","detail":"Same colours, font and title position everywhere so staff learn it once.","span":1}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write a target-audience paragraph for a fictional school library system used by pupil volunteers at lunchtime.","m":4,"a":"'The system will be used by pupil volunteers in the school library at lunchtime. They are not IT specialists and each only helps once or twice a week, so the system must be easy to learn. Pupils and books will be chosen from drop-down lists or found with a search box rather than typed in full, so names are always spelt the same way. Large, clearly labelled buttons and a consistent layout will make each screen quick to use while a queue is waiting. A Help button and tooltips on every screen will explain what to do, and any invalid entry will produce a message explaining how to correct it.'"}],"videos":[],"terms":[]},{"id":"c02-p05","spec":"TASK 10: Data requirements – inputs","lessons":[],"summary":"List every input the system needs (text boxes, lists and buttons on every screen) in a table of input number, data requirement, data type, screen, example valid data and function.","blocks":[{"t":"task","label":"TASK 10","title":"Data requirements – inputs","brief":"List every input the system needs, screen by screen, in a table of input number, data requirement, data type, screen, example valid data and function.","where":{"chapter":"Design chapter","heading":"Heading 2: Data Requirements: Inputs","after":"Task 9 (Target audience)","pages":"4–6 pages"},"approach":["PREP: go through each screen and list what the user enters or clicks.","Include every text box, drop-down list, check box and button (a click is an input: example data 'click').","Use the control names you will use in the control tables and code (tbName, cmbProduct, btnSave).","Choose sensible types: int for counts, decimal for times or money, string for names, IDs and phone numbers.","Give a specific example of valid data and a clear function for each.","Expect roughly 50 rows across all screens."],"deliver":["Heading 2 'Data Requirements: Inputs'","All six booklet columns","Every screen covered, in screen order","Every button included","Sensible data type for each input","Control names match my later designs","Roughly 50 inputs"],"marks":{"criteria":["design"],"evidence":"'A comprehensive set of data requirements (inputs…)'. Design (13).","top_band":"List every input with data type, screen and validation so a third party could build it."}},{"t":"table","head":["Input Number","Data Requirement","Data Type","Screen","Example Valid Data","Function of Data Item"],"rows":[["1","tbUsername","String","Login","shop1","To store the value entered in the username box"],["2","tbPassword","String","Login","Crisps#7","To hold the password entered by the user to enter the system"],["3","btnLogin","Click","Login","(click)","To check the username and password against logins.txt"],["4","tbName","String","Products","Crisps","To store the product's name"],["5","cmbCategory","String","Products","Snack","To choose the product's category"],["6","tbPrice","Decimal","Products","0.60","To store the price (£0.10–£5.00)"],["7","tbStock","Integer","Products","40","To store how many are in stock (0–500)"],["8","tbReorder","Integer","Products","15","To store the stock level at which to reorder"],["9","btnSave","Click","Products","(click)","To validate and save the product"],["10","tbSearch","String","Products","choc","ID or part of a name to search for"],["11","cmbProduct","String (selected Product)","New Sale","P001 Crisps (£0.60)","To choose the product being sold"],["12","tbQty","Integer","New Sale","2","How many of the product (1–20), checked against the stock"],["13","tbPaid","Decimal","New Sale","2.00","The amount the customer pays, used to calculate the change"]],"caption":"Ballyvaren practice inputs (part of the table)"}],"diagram":{"kind":"table-reveal","title":"Pick the data type","caption":"Decide the type, then click a hidden cell to check.","head":["Input","Example","Data type"],"rows":[["Quantity sold","3","Integer"],["Product ID","P003","String"],["Price","0.85","Decimal"],["Date of a sale","09/11/2026","Date (DateTime)"],["On special offer?","Yes","Boolean"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2]]},
