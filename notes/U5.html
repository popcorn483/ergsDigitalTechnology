/*ANIM-CSS*/
/* =====================================================================
   ANIMATIONS (anim blocks): a looping scene on a chapter-tinted dotted stage,
   with a story-style step bar under it. Colours come from the chapter hue (--cc)
   and a partner hue rotated from it (--a2), so every chapter gets its own pair.
   ===================================================================== */
figure.anim{   /* figure only: the cover hero and chapter banners also carry .anim (their motion flag) */
  --k:var(--cc);--a2:var(--b-vid);--a2:oklch(from var(--cc) l c calc(h + 155));
  --ks:color-mix(in srgb,var(--k) 15%,var(--paper));--kt:color-mix(in srgb,var(--k) 6%,var(--paper));--as:color-mix(in srgb,var(--a2) 16%,var(--paper));
  --gs:color-mix(in srgb,var(--good) 16%,var(--paper));--bs:color-mix(in srgb,var(--bad) 15%,var(--paper));
  margin:4px 0;border-radius:16px;background:var(--paper);box-shadow:var(--soft-shadow);outline:1px solid color-mix(in srgb,var(--k) 22%,var(--line));overflow:hidden;font-family:var(--sans)}
.an-h{display:flex;align-items:center;gap:9px;padding:10px 14px 10px 14px;font-size:14.5px;line-height:1.3;border-bottom:1px solid color-mix(in srgb,var(--k) 18%,var(--line))}
.an-h .bi{--bc:var(--k);width:26px;height:26px;border-radius:8px;background:var(--k);color:var(--paper)}
.an-h b{min-width:0;flex:1;text-wrap:balance}
.an-k{flex:none;font-size:12px;font-weight:700;color:var(--k);background:var(--kt);border:1px solid color-mix(in srgb,var(--k) 28%,transparent);border-radius:999px;padding:1px 9px}
.an-st{padding:14px 12px 6px;background-color:var(--kt);background-image:radial-gradient(color-mix(in srgb,var(--k) 18%,transparent) 1px,transparent 1.3px);background-size:16px 16px}
.an-svg{display:block;width:100%;height:auto;max-width:var(--mw,540px);margin:0 auto;overflow:visible;transition:opacity .3s ease}
.an-svg.an-out{opacity:0}
.an-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 0;background:var(--kt)}
.an-b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid color-mix(in srgb,var(--k) 30%,var(--line));background:var(--paper);color:var(--k);padding:0;transition:background-color .15s,transform .12s}
.an-b svg{width:18px;height:18px;fill:currentColor}
.an-prev svg,.an-next svg{fill:none}
.an-b:hover{background:var(--ks)}
.an-b:active{transform:scale(.94)}
.an-pp{background:var(--k);color:var(--paper);border-color:var(--k)}
.an-pp:hover{background:var(--k);filter:brightness(1.08)}
.an-pips{flex:1;min-width:0;display:flex;gap:4px;align-items:center;height:34px}
.an-pip{flex:1;min-width:0;height:34px;border:0;background:none;padding:0;display:grid;align-items:center;cursor:pointer}
.an-pip i{display:block;height:6px;border-radius:6px;background:color-mix(in srgb,var(--k) 18%,var(--paper));position:relative;overflow:hidden;transition:height .15s}
.an-pip i::after{content:"";position:absolute;inset:0;background:var(--k);transform-origin:left;transform:scaleX(var(--f,0))}
.an-pip.on i{height:8px}
.an-pip:hover i{height:9px}
.an-pip:focus-visible{outline-offset:-2px}
.an-cap{display:flex;gap:10px;align-items:baseline;margin:0;padding:8px 14px 12px;background:var(--kt);font-size:14.5px;line-height:1.45;min-height:3.9em;color:var(--ink)}
.an-n{flex:none;font-size:12px;font-weight:700;color:var(--k);font-variant-numeric:tabular-nums;min-width:2.6em}
.an-ct{min-width:0}
.anim figcaption{padding:9px 14px 11px;border-top:1px solid color-mix(in srgb,var(--k) 14%,var(--line));font-size:13.5px;color:var(--ink-2);font-style:italic}
.anim .an-all{display:none;margin:0;padding:6px 14px 10px 34px;font-size:14px;color:var(--ink-2);background:var(--kt);gap:2px;flex-direction:column}
.an-all li::marker{color:var(--k);font-weight:700}
@media (prefers-reduced-motion:reduce){ .anim .an-all{display:flex} .an-pp{display:none} .an-cap{display:none} }
@media print{ .an-bar,.an-cap{display:none} .anim .an-all{display:flex} }
@media (max-width:520px){ .an-st{padding:10px 4px 4px} .an-h{padding:9px 12px} .an-cap{padding:8px 12px 11px;font-size:14px} .an-bar{padding:8px 8px 0} }
/* scene vocabulary: f* = fill, s* = stroke, t* = text colour */
.an-svg text{white-space:pre;font-family:var(--sans);font-size:15px;fill:var(--ink);dominant-baseline:central;text-anchor:middle}
.an-svg .m{font-family:var(--mono);font-size:14px}
.an-svg .b{font-weight:700}
.an-svg .sm{font-size:12.5px}
.an-svg .lg{font-size:19px}
.an-svg .xl{font-size:26px}
.an-svg .tl{text-anchor:start}.an-svg .tr{text-anchor:end}
.an-svg .on{fill:var(--paper)}
.an-svg .tk{fill:var(--k)}.an-svg .ta{fill:var(--a2)}.an-svg .t2{fill:var(--ink-2)}.an-svg .t3{fill:var(--ink-3)}.an-svg .tg{fill:var(--good)}.an-svg .tb{fill:var(--bad)}
.an-svg rect,.an-svg circle,.an-svg path,.an-svg line,.an-svg polygon{stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.an-svg .fk{fill:var(--k)}.an-svg .fks{fill:var(--ks)}.an-svg .fkt{fill:var(--kt)}
.an-svg .fa{fill:var(--a2)}.an-svg .fas{fill:var(--as)}
.an-svg .fp{fill:var(--paper)}.an-svg .fp2{fill:var(--paper-2)}.an-svg .fi{fill:var(--ink)}.an-svg .fl{fill:var(--line)}
.an-svg .fg{fill:var(--good)}.an-svg .fgs{fill:var(--gs)}.an-svg .fb{fill:var(--bad)}.an-svg .fbs{fill:var(--bs)}.an-svg .fw{fill:var(--warn)}
.an-svg .fn{fill:none}
.an-svg .sk{stroke:var(--k)}.an-svg .sa{stroke:var(--a2)}.an-svg .sl{stroke:var(--line)}.an-svg .si{stroke:var(--ink-3)}.an-svg .si2{stroke:var(--ink-2)}.an-svg .sg{stroke:var(--good)}.an-svg .sb{stroke:var(--bad)}.an-svg .sp{stroke:var(--paper)}
.an-svg .w0{stroke-width:0}.an-svg .w1{stroke-width:1}.an-svg .w2{stroke-width:2.2}.an-svg .w3{stroke-width:3.2}.an-svg .w5{stroke-width:5}
.an-svg .dsh{stroke-dasharray:5 5}
.an-svg .ar-s{fill:none;stroke:currentColor;stroke-width:2.2}
.an-svg .ar-h{fill:currentColor;stroke:none}
.an-svg .ak{color:var(--k)}.an-svg .aa{color:var(--a2)}.an-svg .ai{color:var(--ink-3)}.an-svg .ag{color:var(--good)}.an-svg .ab{color:var(--bad)}
.an-svg .sh{filter:drop-shadow(0 1px 1.5px rgba(20,30,50,.18))}
:root[data-theme="dark"] .an-svg .sh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .an-svg .sh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))} }

/* =====================================================================
   NOTES MOTION: key points in sequence, table rows, code typing, example steps,
   tutorial steps, and a gentle pulse on interactive diagrams until first used.
   Elements only get .mo when IntersectionObserver exists and motion is allowed.
   ===================================================================== */
@keyframes mo-rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes mo-fade{from{opacity:0}to{opacity:1}}
@keyframes mo-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mo-caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes mo-step{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes mo-pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes dg-pulse{0%,100%{box-shadow:var(--card-shadow),0 0 0 0 color-mix(in srgb,var(--cc) 0%,transparent)}50%{box-shadow:var(--card-shadow),0 0 0 5px color-mix(in srgb,var(--cc) 26%,transparent)}}
.mo.boxed.key li,.mo.tut .tut-s li,.mo.tw tbody tr{opacity:0}
.mo-in.boxed.key li,.mo-in.tut .tut-s li{animation:mo-rise .38s var(--ease) both;animation-delay:calc(var(--i,0) * 75ms + 40ms)}
.mo-in.tw tbody tr{animation:mo-fade .42s ease both;animation-delay:calc(var(--i,0) * 45ms)}
.mo.code .ln{opacity:0}
.mo.code .ln.ty{width:max-content}
.mo-in.code .ln{animation:mo-fade .35s ease both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty{animation:mo-type var(--tt,600ms) steps(var(--tn,20),end) both;animation-delay:var(--td,0ms)}
.mo-in.code .ln.ty.last::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:1px;vertical-align:-.15em;background:currentColor;opacity:0;animation:mo-caret .5s steps(1) 3;animation-delay:calc(var(--td,0ms) + var(--tt,600ms))}
.ex ol li{animation:mo-step .32s var(--ease)}
.ex ol li::before{animation:mo-pop .4s var(--ease)}
.dg.fresh{animation:dg-pulse 2.8s ease-in-out .8s 5}
@media (prefers-reduced-motion:reduce){ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} .dg.fresh{animation:none} }
@media print{ .mo li,.mo tr,.mo .ln{opacity:1!important;animation:none!important;clip-path:none!important} }

/*END-ANIM-CSS*/
/* =====================================================================
   TUTORIAL BOOK: BEGIN (book.mode "tutorial"; source notes/tutorial/tut.css, inserted by notes/tutorial/inject.py)
   project brief card + ER diagram, todo checklist with progress ring, "Your turn: build it" task cards,
   tutorial cover parts and rail part headings. Project colours: shop = hue 2 (teal), booking = hue 10 (plum).
   ===================================================================== */
/* todo checklist */
.todo{--tc:var(--good);border-radius:16px;background:color-mix(in srgb,var(--tc) 6%,var(--paper));outline:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));padding:14px 16px 10px;font-family:var(--sans)}
.todo-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}

<script>
const BOOK = {"book":{"id":"U5","title":"Unit 5: Digital Development Practice (controlled assessment tutorials)","qual":"CCEA GCSE Digital Technology","hub":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP","edition":"2026–27","mode":"tutorial","blurb":"Your controlled assessment, task by task: set up, design, build it in C# Windows Forms, test and evaluate"},"chapters":[{"id":"c01","n":1,"title":"Getting set up","intro":"Tasks 1–5 from the guidance booklet: your OneDrive folder, a correctly formatted Write Up document, the front page, header and footer, contents page and the Design chapter subtitle page.","pages":[{"id":"c01-p01","spec":"Start here: Unit 5 at a glance (not a booklet task)","lessons":[],"summary":"What Unit 5 asks you to do, how the 24 booklet tasks fit together, and the fictional practice scenario used in every worked example.","blocks":[{"t":"warn","text":"**The practice example in this book is NOT the real task.** Every worked example uses a made-up school event, the *Ballyvaren High School Sports Day*, so you can see the techniques without anyone giving you an answer. Your controlled assessment uses **this year's CCEA scenario**, which your teacher gives you. You must apply each step in this book to that scenario, in your own words and your own code. Copying the Ballyvaren examples into your write-up earns you nothing and may be treated as malpractice."},{"t":"p","text":"Unit 5: Digital Development Practice is the controlled assessment for Route B (Programming). CCEA sets a scenario: an organisation with a problem that a computer program could solve. You **design** a solution, **build** it in C# using Visual Studio, **test** it and **evaluate** it, and you write all of it up in one Word document."},{"t":"p","text":"This book follows your teacher's student guidance booklet task by task, from Task 1 (setting up your folder) to Task 24 (personal reflection). Each page explains one task: what it is for, how to do it, a worked example on the practice scenario, and a **checklist** you can tick off as you finish that task in your own write-up."},{"t":"table","head":["Chapter","Booklet tasks","What you produce"],"rows":[["1 Getting set up","Tasks 1–5","OneDrive folder, Word document with styles, front page, header and footer, contents page, Design chapter subtitle page"],["2 Design","Tasks 6–15","Introduction, requirements, target audience, data requirements, objects, wireframes, feedback, final designs, control tables, flowcharts/pseudocode, navigation structure"],["3 Building it in Visual Studio","Task 16","Your working C# Windows Forms program and a Corrective Actions document of errors you fixed"],["4 Testing","Tasks 17–19","Testing subtitle page, requirements list, test cases, test table, corrective actions"],["5 Evaluation","Tasks 20–24","Requirement-by-requirement evaluation, stage reflections, performance, robustness, personal reflection"],["6 Before you submit","Checklist","Final checks before you upload Word and PDF copies"]],"caption":"How the book maps onto the booklet"},{"t":"project","type":"results","title":"Practice scenario: Ballyvaren High School Sports Day (fictional)","scenario":"Ballyvaren High School is a made-up school in County Antrim. At its annual sports day, PE staff write each athlete's place on paper, add up the house points by hand and often make mistakes, so the winning house is announced late. The Head of PE wants a Windows program that PE staff log in to, use to keep a list of athletes, record each athlete's place and time or distance in every event, and see the house leaderboard and top athletes straight away. The data must be kept when the program is closed.","users":["PE staff – log in, add and edit athletes, record results, view the leaderboard","Head of PE – the client who reviews designs and approves the system"],"tables":[{"name":"Athlete","fields":["athleteID (string, e.g. A007, the identifier)","firstName (string, max 20)","surname (string, max 20)","yearGroup (int, 8–12)","house (string: Lir, Fionn, Macha or Boru)"],"links":["athleteID → EventResult.athleteID (1–∞)"]},{"name":"EventResult","fields":["eventName (string, e.g. 100m, Long Jump)","athleteID (string, matches an Athlete)","position (int, 1–6)","performance (decimal: seconds for track events, metres for field events)","PointsAwarded() method: 1st 10, 2nd 8, 3rd 6, 4th 4, 5th 2, 6th 1"],"links":[]},{"name":"House","fields":["name (string)","colour (string)","totalPoints (int, worked out from the results)"],"links":["name → Athlete.house (1–∞)"]},{"name":"Staff","fields":["username (string) – one line per member of staff in logins.txt","password (string)"],"links":[]}],"note":"These are C# classes and text files, not database tables: Athlete, EventResult and House objects are kept in List<> collections, and athletes and results are saved one per line in athletes.csv and results.csv.","features":["Staff login checked against logins.txt with three attempts","Add, edit and search athletes with validation (presence, year group 8–12, house from a drop-down list)","Record a result: no two athletes with the same position in one event, time or distance a positive decimal","Points awarded automatically (10, 8, 6, 4, 2, 1)","Athletes and results saved to and loaded from CSV files","Leaderboard: house totals sorted highest first in a DataGridView, plus the top athletes by points"],"stretch":["Record dead heats (two athletes sharing a place)","Separate leaderboards for each year group","Print certificates for the top three in each event"]},{"t":"h","text":"What your teacher can and cannot do"},{"t":"p","text":"A controlled assessment has rules about help. Your teacher can teach you general skills and techniques (like the ones in this book), explain what each task is asking for, and supervise you. Your teacher cannot write, correct or improve your actual work for you, and anything you hand in must be your own. If you are unsure whether something is allowed, ask your teacher before you do it."},{"t":"tip","text":"Keep this year's CCEA scenario and your work private. Do not post either online or share your files with other pupils."},{"t":"key","title":"What good work includes","items":["A complete write-up usually runs to around 100 pages, because most of the length comes from screenshots, tables and annotated designs, not long paragraphs.","It follows the booklet's order: front page, contents, Design chapter, Testing chapter, Evaluation chapter, each chapter opened with a subtitle page.","Most of the pages are in three places: the final designs (an annotated screen, a control table and pseudocode for every screen), the test table and the requirement-by-requirement evaluation.","In many complete write-ups the build is not written up as a long chapter of its own; it shows through the screenshots in the test table and the corrective actions. Your teacher will tell you how they want the Building chapter set out."]},{"t":"note","text":"**Typical length:** Design roughly half the document; testing roughly a third; evaluation around a tenth. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"Before you start","items":["I have read this year's CCEA scenario that my teacher gave me.","I understand the Ballyvaren sports day examples are practice only and not the real task.","I know where my teacher wants my work saved and submitted."]}],"diagram":{"kind":"timeline","title":"The controlled assessment, start to finish","caption":"Click each stage to see which booklet tasks belong to it.","items":[{"label":"Set up (Tasks 1–5)","detail":"Folder in OneDrive, Write Up document, styles, front page, header and footer, contents page, Design chapter subtitle page."},{"label":"Analyse (Tasks 6–10)","detail":"Introduction, functional and non-functional requirements, target audience, data requirements (inputs). Also identify the objects and their attributes."},{"label":"Design (Tasks 11–15)","detail":"Wireframes, User Feedback I, final designs, control tables, flowcharts or pseudocode, navigation structure, User Feedback II, submit the design."},{"label":"Build (Task 16)","detail":"Build the program in Visual Studio. Record every error and fix in your Corrective Actions document."},{"label":"Test (Tasks 17–19)","detail":"Testing subtitle page, requirements copied in, test cases, test table, corrective actions."},{"label":"Evaluate (Tasks 20–24)","detail":"Each requirement met, partly met or not met; stage reflections; further developments; performance; robustness; personal reflection."}]},"check":[],"exam":[],"practice":[{"q":"Read this year's CCEA scenario. Using the Ballyvaren project card as a model, write your own one-paragraph summary of the scenario: the organisation, its problem, who will use the system and the three most important things it must do. (Keep it for Task 6.)","m":3,"a":"A good summary for Ballyvaren reads: 'Ballyvaren High School records sports day results on paper and adds up house points by hand, which leads to mistakes and a late announcement of the winning house. PE staff will use the system to log in, keep a list of athletes, record results and view the leaderboard; the Head of PE is the client. The system must (1) only allow staff who log in, (2) record each result and award the correct points, and (3) show the house totals in order as soon as results are entered.'\n\nYour version must be about **your** scenario: name the organisation and users the scenario names, and pick out the three needs it stresses most (look for words like *must*, *needs to*, *should be able to*)."}],"videos":[],"terms":[]},{"id":"c01-p02","spec":"TASK 1A: Let's prepare our workspace","lessons":[],"summary":"Create your candidate folder in OneDrive, named exactly as your teacher tells you, with Initial Designs and Final Designs folders and a Write Up document, then open it in desktop Word.","blocks":[{"t":"p","text":"Everything for the controlled assessment lives in **one folder in your school OneDrive**. Saving in one place means nothing is lost, your teacher can find your work, and your Visual Studio project, designs and write-up stay together. Your teacher will tell you exactly what to call the folder; the name includes the centre number and your candidate number, never your name."},{"t":"example","title":"Tutorial: Create the folder and the Write Up","steps":["Open **MySchool**, select **Microsoft 365 Web Apps**, then **Apps**, and click **OneDrive**.","Select **My files**, then click **+ Add new › Folder**.","Name the folder **exactly as your teacher tells you**. The name includes the centre number and your candidate number. Press **Create**.","Open the folder. Add another folder called **Initial Designs** and another called **Final Designs**.","Click **+ Add new › Word document**. Rename it **Write Up**.","Open Write Up. In the top-right corner click **Editing** and select **Open in Desktop**, so you work in full desktop Word with all the styles and References tools."]},{"t":"table","head":["Item","Name","What goes in it"],"rows":[["Folder","The name your teacher gives you","Everything for Unit 5"],["Folder","Initial Designs","Your wireframe documents (Task 11)"],["Folder","Final Designs","Final designs/storyboards, control tables, flowcharts/pseudocode (Task 13)"],["Word document","Write Up","The main document you submit"],["Word document (later)","Corrective Actions","Errors and fixes while building (Task 16)"],["Visual Studio project (later)","your project name","Your C# solution (save where your teacher tells you)"]],"caption":"Your folder when it is finished"},{"t":"warn","text":"Check the folder name against your teacher's instructions, and check your candidate number twice. A folder with a placeholder left in, or with your name in it, has to be renamed later, and files inside may lose their links."},{"t":"note","text":"Ask your teacher where the Visual Studio project should be saved. Some schools save it in the OneDrive folder; others use a network drive and copy it across at the end, because syncing a project while Visual Studio is running can lock files."},{"t":"key","title":"Check it works","items":["OneDrive › My files shows your folder, named exactly as your teacher told you, with your own candidate number in it.","Inside are Initial Designs, Final Designs and Write Up.","Write Up is open in desktop Word (the title bar says Word, not Word for the web)."]},{"t":"key","title":"What good work includes","items":["The folder name exactly matches the teacher's instructions, and every file inside has a clear name (Write Up, Corrective Actions, the design documents).","Nothing in the folder or file names identifies the pupil."]},{"t":"todo","title":"TASK 1A checklist","items":["Folder created and named exactly as my teacher told me","Initial Designs folder created","Final Designs folder created","Write Up Word document created","Write Up opened in desktop Word"]}],"diagram":{"kind":"hotspot","title":"Your candidate folder","caption":"Click each item to see what it is for.","rows":[[{"label":"Candidate folder","detail":"Your Unit 5 folder in OneDrive › My files, named as your teacher tells you (centre number and candidate number). No names.","span":3}],[{"label":"Initial Designs","detail":"One document per screen wireframe (Task 11).","span":1},{"label":"Final Designs","detail":"Final designs/storyboards, control tables and flowcharts or pseudocode (Tasks 13A–13C).","span":1},{"label":"Write Up","detail":"The main Word document. Everything is collated into it at Task 15 and it grows through testing and evaluation.","span":1}],[{"label":"Corrective Actions","detail":"Created at Task 16: screenshots of each error, the fixed code and a short explanation.","span":2},{"label":"Program","detail":"Your Visual Studio solution, saved where your teacher says.","span":1}]],"links":[["Candidate folder","Initial Designs"],["Candidate folder","Final Designs"],["Candidate folder","Write Up"]]},"check":[],"exam":[],"practice":[{"q":"A pupil with candidate number 0583 has named their folder 'Ciara' (their teacher asked for the centre number and candidate number), and it contains a file 'Document1'. List what is wrong and the steps to put it right.","m":2,"a":"Problems: (1) the folder uses a name instead of the centre and candidate numbers the teacher asked for; (2) the Write Up document has the default name; (3) the Initial Designs and Final Designs folders are missing.\n\nFix: in OneDrive select the folder › **Rename** › and type the name exactly as the teacher gave it, with candidate number 0583. Open it, select Document1 › **Rename** › **Write Up**. Then **+ Add new › Folder** twice to make **Initial Designs** and **Final Designs**. Finally open Write Up › **Editing › Open in Desktop**."}],"videos":[],"terms":[]},{"id":"c01-p03","spec":"TASK 1B: Set line spacing and layout","lessons":[],"summary":"Make justified text in Arial, Century Gothic, Times New Roman or Calibri at 12 pt with 1.5 line spacing the Normal style, so the whole write-up is consistent.","blocks":[{"t":"p","text":"A professional write-up looks the same from the first page to the last. Rather than formatting each paragraph by hand, you set the look once and save it into Word's **Normal** style. Every paragraph you type after that, and every heading built on Normal, picks it up automatically."},{"t":"example","title":"Tutorial: Set the Normal style","steps":["Press **Ctrl + A** to select everything in your blank document.","Press **Ctrl + J** to justify the text (both edges straight).","Change the font to **Arial**, **Century Gothic**, **Times New Roman** or **Calibri**. Pick one and use it throughout.","Set the **Font size** to **12**.","**Home › Paragraph › Line and Paragraph Spacing** › **1.5**.","On the **Home** tab, in the **Styles** group, right-click **Normal** and choose **Update Normal to Match Selection**."]},{"t":"table","head":["Setting","Value","Shortcut / where"],"rows":[["Alignment","Justified","Ctrl + J"],["Font","Arial, Century Gothic, Times New Roman or Calibri","Home › Font"],["Size","12 pt","Home › Font"],["Line spacing","1.5","Home › Paragraph › Line and Paragraph Spacing (or Ctrl + 5)"],["Save as style","Normal","Right-click Normal › Update Normal to Match Selection"]],"caption":"The Task 1B settings"},{"t":"tip","text":"To check it worked, type a test sentence, press Enter and type another. Both should be justified, 12 pt and 1.5 spaced without you touching the toolbar. Delete them afterwards."},{"t":"warn","text":"If you paste text in from somewhere else (for example your notes), it can bring its own font with it. Use **right-click › Paste Options › Keep Text Only** so it takes on your Normal style."},{"t":"key","title":"Check it works","items":["Click anywhere in the document: the Styles gallery highlights Normal.","Home shows your chosen font at 12, the justify button is on and line spacing is 1.5."]},{"t":"key","title":"What good work includes","items":["One font and one size used throughout, set once in the Normal style rather than paragraph by paragraph.","Pasted text matches the rest of the document."]},{"t":"todo","title":"TASK 1B checklist","items":["Text justified","One of the four allowed fonts chosen","Font size 12","Line spacing 1.5","Normal style updated to match"]}],"diagram":{"kind":"hotspot","title":"Where the settings live in Word","caption":"Click each part of the Home tab.","rows":[[{"label":"Font group","detail":"Font name and size boxes. Choose one of the four fonts, size 12.","span":2},{"label":"Paragraph group","detail":"Justify button (Ctrl + J) and the Line and Paragraph Spacing button (choose 1.5).","span":2},{"label":"Styles group","detail":"Normal, Heading 1, Heading 2… Right-click a style to update it to match your selection.","span":2}],[{"label":"Document","detail":"Ctrl + A selects everything before you apply the settings.","span":6}]],"links":[["Font group","Styles group"],["Paragraph group","Styles group"]]},"check":[],"exam":[],"practice":[{"q":"Your Write Up has paragraphs in three different fonts because you pasted some text in. Explain how to make every paragraph match your Normal style without retyping anything.","m":2,"a":"1 Press **Ctrl + A** to select the whole document. 2 Press **Ctrl + Space** to clear character formatting (fonts and sizes typed over the style) and **Ctrl + Q** to clear paragraph formatting. 3 Click **Normal** in the Styles gallery. Headings will also become Normal, so re-apply **Heading 1** and **Heading 2** to your headings afterwards (or select only the body paragraphs instead of using Ctrl + A)."}],"videos":[],"terms":[]},{"id":"c01-p04","spec":"TASK 2: Create a Front Page","lessons":[],"summary":"Create a clear front page with the title, unit, candidate number and centre number, and never your name.","blocks":[{"t":"p","text":"It is important to have a clear front page on your write-up for the controlled assessment. The front page tells the moderator whose work this is **without naming you**: work is identified by centre number and candidate number only."},{"t":"p","text":"You *can* add an image or logo, but the booklet is clear that this does not give you extra marks, so do not spend lesson time on it. Spend that time on your requirements and designs instead."},{"t":"example","title":"Tutorial: Build the front page","steps":["Click at the top of page 1. Press **Ctrl + E** to centre.","Type **Digital Technology**, press Enter, type **Controlled Assessment**. Make both lines bold and larger (for example 16 pt).","Add a few blank lines, then type **Unit 5: Digital Development Practice**.","Add a few more blank lines and type the title of your system (for example *Sports Day Results System* in the Ballyvaren practice).","Near the bottom type **Candidate Number: ####** (your own number) and on the next line **Centre Number:** followed by the centre number your teacher gives you.","Press **Ctrl + Enter** to insert a page break, so the contents page starts on page 2."]},{"t":"table","head":["Front page line","What to write"],"rows":[["Digital Technology","Exactly this, bold"],["Controlled Assessment","Exactly this, bold"],["Unit 5: Digital Development Practice","Exactly this"],["TITLE HERE","A short, clear name for the system in **your** scenario"],["Candidate Number: ####","Your four-digit candidate number"],["Centre Number","The school's centre number (your teacher gives you it)"]],"caption":"What the front page must show"},{"t":"warn","text":"Do not have your name on this document. Check the front page, the file name, and any screenshot you paste in later (for example a Windows login or a Visual Studio title bar showing your user name)."},{"t":"note","text":"Word also stores an author name in **File › Info › Properties**. Ask your teacher whether it should be removed before you submit."},{"t":"key","title":"Check it works","items":["Page 1 shows Digital Technology, Controlled Assessment, the unit, a title, your candidate number and the centre number.","Your name does not appear anywhere on it.","The next page starts after a page break."]},{"t":"key","title":"What good work includes","items":["A simple, clean front page: the lines the booklet lists and nothing else that takes time.","Candidate and centre number only; no name anywhere."]},{"t":"note","text":"**Typical length:** One page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 2 checklist","items":["Digital Technology / Controlled Assessment heading","Unit 5: Digital Development Practice","A title for my system","Candidate number and centre number","No name on the document","Page break after the front page"]}],"diagram":{"kind":"hotspot","title":"Front page layout","caption":"Click each part of the front page.","rows":[[{"label":"Heading","detail":"Digital Technology / Controlled Assessment: bold, larger, centred.","span":3}],[{"label":"Unit","detail":"Unit 5: Digital Development Practice.","span":3}],[{"label":"Title","detail":"The name of your system for this year's scenario.","span":2},{"label":"Logo (optional)","detail":"Allowed, but it does not give extra marks.","span":1}],[{"label":"Numbers","detail":"Candidate number and centre number. Never your name.","span":3}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"A pupil's front page reads: 'Digital Technology – Ciara Byrne – Sports project'. List everything that is missing or wrong and write out the corrected lines.","m":2,"a":"Wrong: the name must be removed. Missing: 'Controlled Assessment', the unit line, the candidate number and the centre number. 'Sports project' is vague. Corrected, centred, one per line: **Digital Technology** / **Controlled Assessment** / Unit 5: Digital Development Practice / Sports Day Results System / Candidate Number: 0583 / Centre Number: (the centre number)."}],"videos":[],"terms":[]},{"id":"c01-p05","spec":"TASK 3: Add a header and footer","lessons":[],"summary":"Add a header with the centre number and candidate number and a footer with the page number, so every page can be identified.","blocks":[{"t":"p","text":"Moderators often print or separate pages. If every page has the centre number and candidate number in the **header** and a page number in the **footer**, any page can be matched back to your work and put in order. Word repeats the header and footer on every page automatically."},{"t":"example","title":"Tutorial: Header","steps":["**Insert › Header › Blank**.","Type **Centre Number:** followed by the centre number.","Press **Tab** twice to jump to the right-hand side and type **Candidate Number: ####** (your number).","Optional: make it 10 pt so it does not compete with your text."]},{"t":"example","title":"Tutorial: Footer with page numbers","steps":["With the header still open, click **Header & Footer › Go to Footer**.","**Insert › Page Number › Bottom of Page › Plain Number 2** (a centred number).","Optional: tick **Different First Page** on the Header & Footer tab if you want the front page clean (the front page already shows both numbers).","Click **Close Header and Footer**, or double-click the body of the page."]},{"t":"table","head":["Part","Contains","Never contains"],"rows":[["Header","Centre number and candidate number","Your name"],["Footer","Page number (a field that updates by itself)","A typed number such as '1', which would repeat on every page"]],"caption":"Header and footer contents"},{"t":"warn","text":"Do not type the page number yourself. A typed '1' appears as 1 on every page. Always use **Insert › Page Number** so Word counts the pages."},{"t":"key","title":"Check it works","items":["Scroll through: every page shows both numbers at the top.","The page numbers at the bottom go up by one on each page.","No name appears in the header or footer."]},{"t":"key","title":"What good work includes","items":["The same header on every page, including pages that are mostly screenshots.","Automatic page numbers, so the contents page and figure references stay correct."]},{"t":"todo","title":"TASK 3 checklist","items":["Header with the centre number","Header with my candidate number","Footer with an automatic page number","No name in the header or footer"]}],"diagram":{"kind":"hotspot","title":"Header and footer","caption":"Click each area of a page.","rows":[[{"label":"Header – left","detail":"Centre number","span":2},{"label":"Header – right","detail":"Candidate Number: #### (press Tab twice to get here).","span":2}],[{"label":"Body","detail":"Your write-up. Double-click here to leave the header or footer.","span":4}],[{"label":"Footer","detail":"Insert › Page Number › Bottom of Page › Plain Number 2.","span":4}]],"links":[["Header – left","Header – right"]]},"check":[],"exam":[],"practice":[{"q":"Every page of a pupil's Write Up says 'Page 1' at the bottom. Explain why and how to fix it.","m":2,"a":"They typed '1' into the footer instead of inserting a page-number field, so the same text repeats on every page. Fix: double-click the footer, delete 'Page 1', then **Insert › Page Number › Bottom of Page › Plain Number 2** (type 'Page ' before the field if wanted). Close the footer and scroll to check the numbers go up."}],"videos":[],"terms":[]},{"id":"c01-p06","spec":"TASK 4: Create a table of contents","lessons":[],"summary":"Use Heading 1 for chapters and Heading 2 for sections so Word builds an automatic table of contents, and write professionally without I or we.","blocks":[{"t":"p","text":"A long write-up needs a contents page so the moderator can jump straight to your requirements or your test table. If you use Word's **heading styles**, Word builds the contents page for you and keeps the page numbers right as your document grows."},{"t":"table","head":["Style","Use it for","Examples"],"rows":[["Heading 1","Chapter titles","Design Chapter, Building Chapter, Testing Chapter, Evaluation"],["Heading 2","Sections inside a chapter","Introduction, User Requirements, Target Audience, Data Requirements, Test Plan"],["Heading 3 (optional)","Sub-sections","Functional Requirements, Non-Functional Requirements, one heading per screen"],["Normal","Everything else","Your paragraphs"]],"caption":"Which style to use"},{"t":"example","title":"Tutorial: Insert the contents page","steps":["Click on page 2 (after the front page break).","Type **Design Chapter** and click **Heading 1** in Home › Styles. Press Enter, type **Introduction** and click **Heading 2**.","Click back at the top of page 2 and choose **References › Table of Contents › Automatic Table 1**.","Press **Ctrl + Enter** after the table so the contents page sits on its own page.","Later, when you add more headings, click the table and choose **Update Table › Update entire table**."]},{"t":"tip","text":"To restyle a heading (for example to change the colour), change one heading, then right-click the style in the gallery and choose **Update Heading 1 to Match Selection**. Every Heading 1 changes at once."},{"t":"h","text":"Going forward: write professionally"},{"t":"p","text":"From now on, write in a professional, impersonal style. Do **not** write in the first person (I/We). Write about the system, not about yourself. The one exception is the personal reflection at Task 24."},{"t":"compare","head":["Weak (first person)","Better (professional)"],"rows":[["Purpose","I will be making a system that records sports results.","The system will allow PE staff to record sports day results."],["Validation","We are going to check the year group.","The year group will be checked to make sure it is between 8 and 12."],["Testing","I tested the login and it worked.","Test 1 shows that a valid username and password open the main menu."]]},{"t":"key","title":"Check it works","items":["References › Table of Contents shows Design Chapter with Introduction indented under it.","Clicking an entry with Ctrl held jumps to that heading.","No sentence in your design starts with I or We."]},{"t":"key","title":"What good work includes","items":["A contents page built from Heading 1 (chapters) and Heading 2/3 (sections), updated at the very end so the page numbers are right.","Sections under the Design chapter usually appear as: Introduction; User Requirements (Functional, Non-Functional); Target Audience; Data Requirements (Inputs); User Interface Design (Initial Designs, User Feedback, Final Designs); Navigational Structure; User Feedback 2.","A heading for every screen in the designs (Heading 3), so the contents lets a reader jump straight to any screen."]},{"t":"note","text":"**Typical length:** One or two pages for the contents once everything is in. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 4 checklist","items":["Contents page inserted with References › Table of Contents","Heading 1 used for the Design Chapter","Heading 2 used for the Introduction","Contents page on its own page","I know to update the table at the end"]}],"diagram":{"kind":"layers","title":"The shape of your Write Up","caption":"Click each layer: this is the order of your finished document.","items":[{"label":"Front page","detail":"Title, unit, candidate and centre numbers (Task 2)."},{"label":"Contents","detail":"Automatic table from Heading 1 and Heading 2 (Task 4)."},{"label":"Design Chapter","detail":"Subtitle page, introduction, requirements, target audience, data requirements, designs, navigation, feedback (Tasks 5–15)."},{"label":"Building Chapter","detail":"Evidence of the build and corrective actions (Task 16)."},{"label":"Testing Chapter","detail":"Subtitle page, requirements, test cases, test table, corrective actions (Tasks 17–19)."},{"label":"Evaluation","detail":"Requirements evaluated, stage reflections, performance, robustness, personal reflection (Tasks 20–24)."}]},"check":[],"exam":[],"practice":[{"q":"Rewrite these three sentences in a professional style: (a) 'I am going to add a help button to every screen.' (b) 'We decided to use C# because I know it.' (c) 'I made the points update when you type.'","m":3,"a":"(a) 'Every screen will include a Help button that explains how to use that screen.' (b) 'C# has been chosen because it is suited to Windows form-based programs and Visual Studio provides a form designer and debugger.' (Give a reason about the language, not about yourself.) (c) 'The points awarded update automatically as the position is entered.'"}],"videos":[],"terms":[]},{"id":"c01-p07","spec":"TASK 5: Create a Design Chapter subtitle page","lessons":[],"summary":"Add a Design Chapter subtitle page, then annotate the scenario so you know exactly what the program must do before you write anything.","blocks":[{"t":"p","text":"Each chapter of your write-up starts with a **subtitle page**: a page with only the chapter title on it. It makes the document easy to navigate and shows the moderator where each stage begins. You will make one for Design now and one for Testing at Task 17."},{"t":"example","title":"Tutorial: Task 5 – the subtitle page","steps":["After the contents page, type **Design Chapter** and apply **Heading 1**.","Centre it (**Ctrl + E**) and, if you like, move it down the page with a few blank lines.","Press **Ctrl + Enter** so the Introduction starts on a new page.","Update the table of contents to check the chapter appears."]},{"t":"h","text":"PREP: annotate the scenario"},{"t":"p","text":"Before Task 6, read the scenario properly. Print it or open it in Word and **highlight and take notes** on what the program actually has to do. Most lost marks come from a system that does not do what the scenario asked."},{"t":"table","head":["Highlight colour","Look for","Ballyvaren practice example","Becomes"],"rows":[["Yellow","Who uses it","'PE staff', 'the Head of PE'","Target audience (Task 9)"],["Green","Things the system must do (verbs)","'log in', 'add athletes', 'record results', 'search', 'show the leaderboard'","Functional requirements (Task 7)"],["Blue","Things it stores (nouns with details)","'athlete', 'year group', 'house', 'event', 'position', 'time or distance'","Objects, attributes and data requirements (Task 10)"],["Pink","Rules and numbers","'Years 8 to 12', '1st = 10 points … 6th = 1 point', 'six places per event'","Validation and calculations"],["Orange","Qualities","'quick', 'simple for new staff'","Non-functional requirements (Task 8)"]],"caption":"A highlighting key for the scenario"},{"t":"tip","text":"Write a question mark beside anything unclear and ask your teacher what the scenario means. Asking what the task requires is allowed; asking how to answer it is not."},{"t":"key","title":"Check it works","items":["A page with only 'Design Chapter' (Heading 1) follows the contents page.","Your scenario copy is annotated in at least four colours with a note for each highlight."]},{"t":"key","title":"What good work includes","items":["A subtitle page for each chapter: Design, Testing and Evaluation (and Building if your teacher asks for one).","Annotations on the scenario that turn into requirements: every action the scenario mentions is later found in the numbered requirement list."]},{"t":"todo","title":"TASK 5 checklist","items":["Design Chapter subtitle page made with Heading 1","Page break after it","Contents updated","Scenario annotated: users, actions, data, rules, qualities"]}],"diagram":{"kind":"flow","direction":"lr","title":"From scenario to design","caption":"Step through how your annotations feed the design tasks.","nodes":[{"id":"a","label":"Read scenario","detail":"Read it twice: once for the story, once with highlighters.","shape":"start"},{"id":"b","label":"Highlight users","detail":"Who uses the system? Becomes the target audience (Task 9).","shape":"process"},{"id":"c","label":"Highlight actions","detail":"Verbs: what the system must do. Becomes functional requirements (Task 7).","shape":"process"},{"id":"d","label":"Highlight data","detail":"Nouns and details: becomes objects, attributes and data requirements (Task 10).","shape":"process"},{"id":"e","label":"Highlight rules","detail":"Numbers, limits and prices: validation and calculations for designs and code.","shape":"process"},{"id":"f","label":"Write Task 6","detail":"Now write the introduction.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[],"exam":[],"practice":[{"q":"Here is a short fictional brief: 'Glenarm Running Club wants its volunteer coaches to record members' times at its weekly 5 km run. Members are aged 11 to 70 and have a membership number. The club secretary should be able to see each member's best time quickly, and the fastest ten runners each week.' Annotate it using the five-colour key.","m":4,"a":"Yellow (users): volunteer coaches, the club secretary (members are not users, they are the people whose details are stored).\nGreen (actions): record members' times; see each member's best time (search); list the fastest ten (sort).\nBlue (data): member (membership number, name, age), run (date, time taken).\nPink (rules): age 11–70 (range check); 5 km run; fastest ten (sort and take the first ten).\nOrange (qualities): 'quickly' (results shown in under a second, a non-functional requirement)."}],"videos":[],"terms":[]}]},{"id":"c02","n":2,"title":"Design","intro":"Tasks 6–15: introduction, functional and non-functional requirements, target audience, data requirements, objects, wireframes, User Feedback I, final designs, control tables, flowcharts and pseudocode, navigation structure, User Feedback II and submission. Worked examples use the fictional Ballyvaren High School Sports Day – your own work must use this year's CCEA scenario.","pages":[{"id":"c02-p01","spec":"TASK 6: Introduction","lessons":[],"summary":"Write an introduction that explains the purpose of the system, the benefits of a computer system, why C# and Visual Studio suit it, and how it will be robust, efficient and meet user needs.","blocks":[{"t":"p","text":"The introduction sets the scene for everything that follows. It shows the moderator that you understand the scenario and have a plan. Answer every question the booklet asks, in this order, in full paragraphs. Write professionally: no I or We."},{"t":"table","head":["Paragraph","Booklet question","What to cover"],"rows":[["1 Purpose","What is the purpose of the system?","The organisation, its current problem, what the new system will do and who uses it"],["2 Benefits","What benefit would they have to using a computer system?","Speed, accurate calculations, no lost paperwork, quick searching, validation stops mistakes"],["3 Language","Why would you propose to use C#?","Event-driven Windows forms, object-oriented (classes for the objects in the scenario), strong data types, file handling"],["4 Visual Studio","What features of Visual Studio will you use?","Form designer, Toolbox, Properties window, code editor with IntelliSense and line numbering, Solution Explorer, debugger with breakpoints, Error List"],["5 Robust","How will you make a robust system?","Validation on every input, clear error messages, exception handling on files, testing, help"],["6 Efficient","How will you ensure the product is efficient?","Data kept in lists in memory, saved in short files, methods reused rather than repeated code"],["7 User needs","How will you ensure all user needs are met?","Numbered, measurable user requirements, reviewed with the client and tested one by one"]],"caption":"A seven-paragraph plan"},{"t":"compare","head":["Weak","Strong"],"rows":[["Purpose","The system is for a school sports day.","Ballyvaren High School currently records sports day results on paper and adds up house points by hand, which leads to mistakes and a late announcement of the winning house. The proposed system will allow PE staff to log in, record each athlete's result, award points automatically and show the house leaderboard at once."],["Why C#","C# is good and easy.","C# is suitable because Windows Forms allows a graphical interface with buttons, text boxes and drop-down lists, and its object-oriented features allow each athlete and each result to be stored as an object of its own class."],["Robust","It won't crash.","Every input will be validated (for example a range check of 8–12 on the year group) and file operations will be placed in try…catch blocks so that a missing file produces a message rather than a crash."]]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The purpose of the proposed system is to…*","*Currently, the organisation… which causes…*","*A computer system would benefit the organisation because…*","*C# has been chosen because…*","*Visual Studio provides a form designer, which…; the debugger allows…*","*To ensure the system is robust, …*","*To make the system efficient, …*","*The user requirements will be stated as a numbered list so that…*"],"ordered":false},{"t":"tip","text":"Use the names from the scenario: the organisation, the client and the users. A generic introduction that could be about any system scores poorly."},{"t":"key","title":"What good work includes","items":["Answers every booklet question in turn: purpose, benefits, why C#, Visual Studio features, robustness, efficiency, how user needs will be met.","Names the organisation, the client and what the system will actually do, using the scenario's details.","Gives a reason for each claim, e.g. not just 'C# is object-oriented' but what that allows in this system."]},{"t":"note","text":"**Typical length:** About one page: five to seven short paragraphs. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 6 checklist","items":["Heading 2 'Introduction' under the Design Chapter","Purpose of the system","Benefits of a computer system","Why C#","Visual Studio features I will use","How it will be robust","How it will be efficient","How user needs will be met","No I or We"]}],"diagram":{"kind":"cycle","title":"The seven introduction questions","caption":"Click each question: one paragraph each.","items":[{"label":"Purpose","detail":"Who is the organisation, what is the problem, what will the system do?"},{"label":"Benefits","detail":"Why is a computer system better than the current method?"},{"label":"Why C#","detail":"Windows Forms, object-oriented classes, data types, file handling."},{"label":"Visual Studio","detail":"Form designer, code editor, line numbers, Solution Explorer, debugger, Error List."},{"label":"Robust","detail":"Validation, error messages, exception handling, testing, help."},{"label":"Efficient","detail":"Lists in memory, short files, reusable methods."},{"label":"User needs","detail":"Measurable numbered requirements, client review, testing against each one."}]},"check":[],"exam":[],"practice":[{"q":"Write the 'Benefits' paragraph of an introduction for the Ballyvaren sports day practice system, giving at least three benefits over the paper method.","m":4,"a":"'A computer system would benefit Ballyvaren High School in several ways. Points would be awarded automatically from each athlete's position, so the house totals would always be added up correctly, whereas adding them by hand on the day has led to mistakes. The leaderboard would be available as soon as the last result is entered, so the winning house could be announced without delay. Results would be saved to a file, so they could not be lost in the way that paper sheets can be, and an athlete's results could be found in seconds with the search. Validation would also stop impossible data, such as two athletes being given first place in the same race.'"}],"videos":[],"terms":[]},{"id":"c02-p02","spec":"TASK 7: Functional requirements","lessons":[],"summary":"Set out what the system must include and do as a numbered list of measurable functional requirements.","blocks":[{"t":"p","text":"**PREP:** Use the scenario to outline what the system is asking you to do. What screens are needed? What data needs to be saved? What functionality is needed? What processes will be required?"},{"t":"p","text":"A **functional requirement** is something the system must *do*. Each one must be **measurable**: it has a yes/no answer to 'Did you meet this requirement?'. Number them with a numbered list, because you will refer to them by number in your designs, test table and evaluation."},{"t":"compare","head":["Weak (not measurable)","Strong (measurable)"],"rows":[["Login","The system should have a good login.","Staff must log in with a username and password stored in logins.txt before any other screen opens."],["Points","It will work out the points.","Points will be awarded automatically: 1st 10, 2nd 8, 3rd 6, 4th 4, 5th 2, 6th 1."],["Searching","Users can find stuff easily.","Staff will be able to search for athletes by ID or surname."]]},{"t":"table","head":["No.","Type","Requirement (Ballyvaren practice only)"],"rows":[["1","Functional","Staff must log in with a username and password stored in logins.txt before any other screen opens."],["2","Functional","The program will close after three incorrect login attempts."],["3","Functional","Staff will be able to add an athlete with first name, surname, year group (8–12) and house; the system will give each athlete a unique ID (A001, A002, …)."],["4","Functional","Staff will be able to edit an existing athlete's name, year group and house."],["5","Functional","Staff will be able to search for athletes by ID or surname."],["6","Functional","Staff will be able to record a result: event, athlete, position (1–6) and a time in seconds or a distance in metres."],["7","Functional","Invalid data will be rejected with an error message that says what is wrong."],["8","Functional","The system will not allow the same position to be given twice in one event, or the same athlete to be entered twice in one event."],["9","Functional","Points will be awarded automatically: 1st 10, 2nd 8, 3rd 6, 4th 4, 5th 2, 6th 1."],["10","Functional","Athletes and results will be saved to CSV files and loaded when the program starts."],["11","Functional","The leaderboard will show each house's total points, sorted from highest to lowest."],["12","Functional","The leaderboard will show the top five athletes by total points."]],"caption":"Example functional requirements for the practice scenario"},{"t":"h","text":"How to find yours"},{"t":"list","items":["Go through your green highlights from Task 5: each action the scenario mentions is at least one requirement.","Add the 'hidden' requirements every system like this needs: log in, save, load, validate, error messages.","Split anything with 'and' that could be half done into two requirements.","Start each with *The system will…* or *Staff will be able to…*."],"ordered":true},{"t":"warn","text":"Do not copy the Ballyvaren list. Your requirements must come from this year's scenario. A moderator can see straight away when a list does not match the task."},{"t":"key","title":"What good work includes","items":["Requirements grouped by screen, with lettered sub-points for each thing that screen must do. The test table and the evaluation can then refer to '5 (b)'.","Every screen in the navigation structure appears in the list, including login and menus.","Each sub-point is short and testable."]},{"t":"note","text":"**Typical length:** Usually about a page: around ten numbered requirements, most with two or three lettered sub-points. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"compare","head":["Flat list","Grouped by screen with sub-points"],"rows":[["Results","6. Staff can record results.","6. Results screen – a) choose an event and an athlete from lists; b) enter a position from 1 to 6 and a time or distance; c) show the points for the position; d) save the result to results.csv."],["Leaderboard","11. There is a leaderboard.","11. Leaderboard screen – a) show each house's total, highest first; b) show the top five athletes by points."]]},{"t":"todo","title":"TASK 7 checklist","items":["Heading 2 'User Requirements', Heading 3 'Functional Requirements'","Every action from the scenario covered","Each requirement measurable (yes/no answer)","Numbered list","Login, save/load, validation and error messages included where the scenario needs them"]}],"diagram":{"kind":"flow","direction":"tb","title":"Is it a good requirement?","caption":"Step through the test for each requirement you write.","nodes":[{"id":"a","label":"Write requirement","detail":"Start with 'The system will…'.","shape":"start"},{"id":"b","label":"From the scenario?","detail":"Can you point to the sentence in the scenario it comes from (or is it needed for the system to work at all)?","shape":"decision"},{"id":"c","label":"Yes/no answer?","detail":"Could a tester say 'met' or 'not met' without arguing?","shape":"decision"},{"id":"d","label":"Rewrite it","detail":"Add the specific screen, data or number that makes it testable.","shape":"process"},{"id":"e","label":"Add to numbered list","detail":"Give it the next number.","shape":"end"}],"edges":[["a","b"],["b","c","yes"],["b","d","no"],["c","e","yes"],["c","d","no"],["d","b"]]},"check":[],"exam":[],"practice":[{"q":"Rewrite these weak requirements for a fictional school library loans system so they are measurable: (a) 'Loans should be easy.' (b) 'The system will handle fines.' (c) 'Pupils shouldn't take too many books.'","m":3,"a":"(a) 'Staff will be able to issue a book by choosing the pupil from a drop-down list and typing the book's ID.' (b) 'The system will calculate a fine of 10p for each day a book is overdue.' (c) 'The system will refuse a loan when the pupil already has 3 books out.' Each now has a clear yes/no test."}],"videos":[],"terms":[]},{"id":"c02-p03","spec":"TASK 8: Non-functional requirements","lessons":[],"summary":"State the non-functional requirements (how well the system works: speed, efficiency, learnability, consistency) as a numbered list continuing from the functional requirements.","blocks":[{"t":"p","text":"A **non-functional requirement** describes *how well* the system does its job rather than *what* it does: efficiency, speed of loading and saving, learnability (how intuitive it is), consistency of design, accessibility. List them in a numbered list that **continues the numbering** from your functional requirements, so every requirement in your write-up has a unique number."},{"t":"table","head":["No.","Type","Requirement (Ballyvaren practice only)"],"rows":[["13","Non-functional","Every screen will use the same colours, font (Century Gothic) and title position."],["14","Non-functional","Saving an athlete or a result will take less than 2 seconds."],["15","Non-functional","Every screen will have a Help button that explains how to use that screen."],["16","Non-functional","Pressing Tab will move through the boxes on each screen from top to bottom."],["17","Non-functional","A member of staff who has not used the system before will be able to record a result in under 1 minute."]],"caption":"Example non-functional requirements, continuing from 12"},{"t":"compare","head":["Weak","Strong"],"rows":[["Speed","The system will be fast.","Saving an athlete or a result will take less than 2 seconds."],["Ease of use","It will be user friendly.","A member of staff who has not used the system before will be able to record a result in under 1 minute."],["Look","It will look nice.","Every screen will use the same colours, font (Century Gothic) and title position."]]},{"t":"h","text":"Categories to think about"},{"t":"table","head":["Category","Question to ask","Sentence starter"],"rows":[["Efficiency / speed","How long should loading, saving or searching take?","*… will take less than … seconds.*"],["Learnability","Can a new user use it without training?","*A new user will be able to … within …*"],["Consistency","Do all screens look and behave the same?","*Every screen will use the same …*"],["Help","Where does a stuck user get help?","*Every screen will have …*"],["Accessibility","Can it be used without a mouse? Is text readable?","*All text will be at least … pt; Tab will move …*"]],"caption":"Non-functional categories"},{"t":"tip","text":"Even non-functional requirements must be measurable, because you will test and evaluate them. 'Fast' cannot be tested; 'less than 2 seconds' can."},{"t":"key","title":"What good work includes","items":["Three to five non-functional requirements, numbered on from the functional ones.","Each has a measure: a time limit, a consistency rule (title always at the top, same colours on every screen), or 'does not crash when tested with valid, invalid, null and extreme data'.","Security and reliability are common choices alongside speed and ease of use."]},{"t":"note","text":"**Typical length:** Half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 8 checklist","items":["Heading 3 'Non-Functional Requirements'","Numbering continues from my functional requirements","At least one each for speed/efficiency and learnability","Each one measurable"]}],"diagram":{"kind":"compare","title":"Functional or non-functional?","caption":"Toggle between the two kinds of requirement.","states":[{"label":"Functional","points":["What the system DOES","Log in, add an athlete, record a result, award points, save, search, sort","Tested by doing the action with test data","Numbered first: 1, 2, 3, …"],"art":null},{"label":"Non-functional","points":["HOW WELL it does it","Speed, efficiency, learnability, consistency, help, accessibility","Tested by timing, observing a new user or checking every screen","Numbering continues: 13, 14, 15, …"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write three measurable non-functional requirements for a fictional school library loans system, continuing from requirement 10.","m":3,"a":"11. Searching for a book by title will show results in less than 1 second. 12. Every screen will have a Help button explaining how to use that screen. 13. A pupil librarian who has not used the system before will be able to issue a loan in under 2 minutes. (Other good answers: consistent fonts/colours on every screen; Tab order top to bottom; loading the loans file at start-up in under 3 seconds.)"}],"videos":[],"terms":[]},{"id":"c02-p04","spec":"TASK 9: Target audience","lessons":[],"summary":"Write a paragraph on who will use the system, how IT-literate they are, and the features that will make the system suitable for them.","blocks":[{"t":"p","text":"**PREP:** Review the scenario and find out who is meant to be using the system."},{"t":"p","text":"Write a paragraph that answers three questions. **Who** is using the system? Are they **IT specialists**? If they may not be, **how will you make the system suitable** for them, for example help options or a simple user interface? Link each feature to a reason."},{"t":"table","head":["User trait","Design response","Ballyvaren example"],"rows":[["Not IT specialists","Simple layout, one task per screen, plain labels","PE staff are not IT specialists, so each screen does one job: athletes, results, leaderboard."],["Busy / working at speed","Drop-down lists instead of typing, sensible Tab order, Enter triggers the main button","Events and athletes are chosen from drop-down lists so they cannot be misspelt; the event stays selected for the next place."],["Occasional users","Help button on each screen, tooltips, clear error messages","The system is used once a year, so a Help button explains each screen and error messages say what to fix."],["Outdoors on a laptop","Readable font size, good contrast","Text is at least 10 pt in dark text on a light background so it can be read outside."]],"caption":"Matching the design to the audience"},{"t":"h","text":"Paragraph framework"},{"t":"list","items":["**Who:** *The system will be used by…, who…*","**Skill level:** *They are not IT specialists / are confident computer users, so…*","**Suitability features:** *To make the system suitable, it will include…, because…*","**Help:** *If a user is unsure, …*"],"ordered":true},{"t":"example","title":"Worked example: Ballyvaren target audience","steps":["Who: 'The system will be used by PE staff at Ballyvaren High School on sports day, recording results at the finish line and the jumps and throws areas.'","Skill: 'Staff are not IT specialists and will use the system only once a year, often outdoors and under time pressure, so it must be quick to learn and simple.'","Features: 'Events and athletes will be chosen from drop-down lists so that they cannot be mistyped, and points will be awarded automatically from the position.'","Help: 'Each screen will have a Help button, and error messages will explain exactly which box needs to be corrected.'"]},{"t":"key","title":"What good work includes","items":["One solid paragraph: who the users are, whether they are IT specialists, and the specific features (help, consistent layout, validation messages) that suit them.","Mentions every type of user in the scenario (for example staff and the people whose data is stored, if they also use it)."]},{"t":"note","text":"**Typical length:** One paragraph of 6–10 sentences. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 9 checklist","items":["Heading 2 'Target Audience'","Who uses the system (from the scenario)","Whether they are IT specialists","Features that make it suitable, each with a reason","Help options"]}],"diagram":{"kind":"hotspot","title":"Suiting the audience","caption":"Click each feature to see which user need it answers.","rows":[[{"label":"Drop-down lists","detail":"Stop typing errors; faster for busy staff.","span":1},{"label":"Help button","detail":"Occasional users can find out how a screen works without asking.","span":1},{"label":"Clear error messages","detail":"Say which box is wrong and what is allowed.","span":1}],[{"label":"One task per screen","detail":"Less to take in for non-specialists.","span":1},{"label":"Tab order","detail":"Keyboard users move through boxes in order.","span":1},{"label":"Consistent design","detail":"Same colours, font and title position everywhere so staff learn it once.","span":1}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write a target-audience paragraph for a fictional swimming-club system used by volunteer parents to record lap times at the poolside on a laptop.","m":4,"a":"'The system will be used by volunteer parents at the poolside. They are not IT specialists and may only use the system a few times a season, so it must be easy to learn. Swimmers will be chosen from a drop-down list rather than typed, so names are always spelt the same way, and times will be entered in a single box with an example shown beside it (for example 65.32 seconds). Large buttons and text will make the system easy to use on a laptop in a busy, noisy environment. A Help button on every screen will explain what to do, and any invalid time will produce a message explaining the correct format.'"}],"videos":[],"terms":[]},{"id":"c02-p05","spec":"TASK 10: Data requirements – inputs","lessons":[],"summary":"List every input the system needs (text boxes, lists and buttons on every screen) in a table of input number, data requirement, data type, screen, example valid data and function.","blocks":[{"t":"p","text":"**PREP:** Look at the scenario. What data will be required from the users? How will it be added or input into the system?"},{"t":"p","text":"List the inputs required by the system: everything the user puts into it, screen by screen. Group them into sections (for example login, athletes, results). The booklet's hint: look at each screen and decide what the user needs to enter; expect **roughly 50 inputs across all screens**, including buttons, because a click is an input too."},{"t":"table","head":["Input Number","Data Requirement","Data Type","Screen","Example Valid Data","Function of Data Item"],"rows":[["1","tbUsername","String","Login","pe1","To store the value entered in the username box"],["2","tbPassword","String","Login","Relay#4","To hold the password entered by the user to enter the system"],["3","btnLogin","Click","Login","(click)","To check the username and password against logins.txt"],["4","tbFirstName","String","Athletes","Aoife","To store the athlete's first name"],["5","tbSurname","String","Athletes","Kelly","To store the athlete's surname"],["6","tbYear","Integer","Athletes","8","To store the year group (8–12)"],["7","cmbHouse","String","Athletes","Lir","To choose the athlete's house"],["8","btnSave","Click","Athletes","(click)","To validate and save the athlete"],["9","tbSearch","String","Athletes","kel","ID or part of a surname to search for"],["10","cmbEvent","String","Results","100m","To choose the event"],["11","cmbAthlete","String (selected Athlete)","Results","A001 Aoife Kelly (Year 8, Lir)","To choose the athlete the result belongs to"],["12","tbPosition","Integer","Results","1","The athlete's place (1–6), used to award points"],["13","tbPerformance","Decimal","Results","13.42","Time in seconds (track) or distance in metres (field)"]],"caption":"Ballyvaren practice inputs (part of the table)"},{"t":"h","text":"Choosing the data type"},{"t":"table","head":["C# type","Use for","Watch out"],"rows":[["string","Names, IDs, house names, phone numbers","Phone numbers are strings: an int would lose the leading 0"],["int","Whole numbers: year group, position, points","Convert with int.TryParse"],["double / decimal","Times, distances, prices","decimal is exact: 13.42 stays 13.42"],["bool","Yes/no: competing? medical note?","Use a CheckBox"],["DateTime","Dates and times","Use a DateTimePicker so the format is always valid"]],"caption":"Data types"},{"t":"tip","text":"Name the inputs now with the same control names you will use in your control tables and code (tbSurname, cmbEvent, btnSave). Then Task 10, Task 13B and your C# all match, which makes your work easy to follow."},{"t":"key","title":"What good work includes","items":["Every control on every screen, in screen order: text boxes, drop-down lists, check boxes and every button (example valid data for a button is simply 'button press' or 'click').","The same control names that later appear in the control tables and the code.","A specific example of valid data for each input, and a function that says what the input is used for."]},{"t":"note","text":"**Typical length:** Around 50 rows across all screens, often four to six pages. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 10 checklist","items":["Heading 2 'Data Requirements: Inputs'","Table with all six booklet columns","Every screen covered, including buttons","Inputs grouped by screen or section","Sensible data type for each","Roughly 50 inputs across all screens"]}],"diagram":{"kind":"table-reveal","title":"Pick the data type","caption":"Decide the type, then click a hidden cell to check.","head":["Input","Example","Data type"],"rows":[["Year group","9","Integer"],["Athlete ID","A007","String"],["100m time","13.42","Decimal / double"],["Date of sports day","19/06","Date (DateTime)"],["Has a medical note?","Yes","Boolean"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2]]},"check":[],"exam":[],"practice":[{"q":"Complete four more rows of the Ballyvaren inputs table for the Leaderboard and Results screens (input numbers 14–17).","m":4,"a":"14 | btnSave (Results) | Click | Results | (click) | To validate the result, award points and save it to results.csv\n15 | btnClear | Click | Results | (click) | To empty every box on the Results screen\n16 | btnRefresh | Click | Leaderboard | (click) | To recalculate the house totals and top athletes\n17 | btnBack | Click | Leaderboard | (click) | To close the screen and return to the menu"}],"videos":[],"terms":[]},{"id":"c02-p06","spec":"Objects and attributes (booklet page 5, not a numbered task)","lessons":[],"summary":"Read the scenario to find the objects the program needs, list the attributes to store about each, and turn them into a class design.","blocks":[{"t":"p","text":"Your program is object-oriented. An **object** is a thing in the scenario that the program has to store information about; its **attributes** are the pieces of information. The booklet's object diagrams ask you to read through this year's scenario, write out the attributes to be stored about each object, and remember that every attribute must be declared at the beginning of the object (including any optional ones). Then ask: does another object also need to be made for the program to run effectively?"},{"t":"example","title":"Worked example: finding Ballyvaren's objects","steps":["Underline the nouns that have details: '*each athlete* has a *first name, surname, year group and house*; *a result* records the *event*, the *athlete*, their *position* and their *time or distance*'.","Things with several details become objects: **Athlete** and **EventResult**. Single values (surname, position) become attributes.","List Athlete's attributes: athleteID, firstName, surname, yearGroup, house.","Ask 'does another object need to be made?': each house has a name, a colour and a running points total, so **House** is a third object with name, colour, totalPoints.","Things the object can *do* become methods: an EventResult can work out the points it awards; a House can add points to its total."]},{"t":"table","head":["Class","Attribute","Type","Notes"],"rows":[["Athlete","athleteID","string","Unique, made by the program, e.g. A007"],["Athlete","firstName / surname","string","Presence and length check (max 20), no commas"],["Athlete","yearGroup","int","Range check 8–12"],["Athlete","house","string","Chosen from Lir, Fionn, Macha, Boru"],["EventResult","eventName","string","Chosen from the events list"],["EventResult","athleteID","string","Links the result to an Athlete"],["EventResult","position","int","1–6; no duplicates in one event"],["EventResult","performance","decimal","Seconds (track) or metres (field); greater than 0"],["House","name / colour / totalPoints","string / string / int","Total worked out from the results"]],"caption":"Ballyvaren class design (practice only)"},{"t":"table","head":["EventResult (class)",""],"rows":[["Attributes","- eventName, athleteID, position, performance"],["Constructor","+ EventResult(eventName, athleteID, position, performance)"],["Properties","+ EventName, AthleteID, Position, Performance, Points"],["Methods","+ PointsAwarded() : int, + PointsFor(position) : int, + ToCsv() : string, + FromCsv(line) : EventResult"]],"caption":"A simple class diagram (– private, + public)"},{"t":"tip","text":"If your scenario stores people (pupils, members, customers), they are almost always an object. If it records something happening (a result, a loan, an order), that is usually a second object."},{"t":"key","title":"What good work includes","items":["One object diagram per object, with every attribute and its data type.","A check that a second (or third) object really is needed, with a reason."]},{"t":"note","text":"**Typical length:** One page per object. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"Objects checklist (booklet page 5)","items":["Scenario read for nouns with details","First object named and its attributes listed","Checked whether another object is needed","Each attribute has a data type","Methods noted for what each object does"]}],"diagram":{"kind":"hotspot","title":"Athlete object","caption":"Click each part of the object diagram.","rows":[[{"label":"OBJECT: Athlete","detail":"The class name. Each athlete entered is one object (instance) of this class.","span":4}],[{"label":"athleteID","detail":"string – unique ID, e.g. A007.","span":1},{"label":"firstName","detail":"string, max 20.","span":1},{"label":"surname","detail":"string, max 20.","span":1},{"label":"yearGroup","detail":"int, 8–12.","span":1}],[{"label":"house","detail":"string – Lir, Fionn, Macha or Boru; links to a House object.","span":4}],[{"label":"Methods","detail":"FullName(), ToCsv(), FromCsv(). Things the object can do.","span":4}]],"links":[["OBJECT: Athlete","athleteID"],["OBJECT: Athlete","Methods"]]},"check":[],"exam":[],"practice":[{"q":"A fictional brief: 'A school library lends books. Each book has an ID, a title, an author and a category. Pupils (with a pupil number, name and form class) borrow books; each loan has a date out and a due date.' Identify the objects and list the attributes with data types for each.","m":4,"a":"Three objects. **Book**: bookID (string), title (string), author (string), category (string). **Pupil**: pupilNumber (string or int), name (string), formClass (string). **Loan** (the event linking them): bookID (string), pupilNumber (string), dateOut (DateTime), dueDate (DateTime). Methods might include Loan.IsOverdue() and Pupil.ToCsv()."}],"videos":[],"terms":[]},{"id":"c02-p07","spec":"TASK 11: Wireframe diagrams / initial designs","lessons":[],"summary":"Create a wireframe for every screen in a separate Word document: a basic layout made from shapes, with labels explaining what each part does.","blocks":[{"t":"p","text":"**PREP:** Using the scenario, decide what screens you need to develop."},{"t":"p","text":"A **wireframe** is a first sketch of a screen: where things go and what they do. For each screen make a basic layout in Microsoft Word using shapes, and add labels with arrows explaining how the screen works. Make a **separate document** for these and save it in your **Initial Designs** folder. Repeat the process for every screen."},{"t":"example","title":"Tutorial: A wireframe in Word","steps":["Create a new Word document in Initial Designs, for example *Wireframes*.","**Insert › Shapes › Rectangle**. Draw a grey rectangle the shape of a window: this is the form.","Add smaller rectangles for text boxes, lists and buttons, and **Insert › Text Box** for the title and labels. Type the text that will appear (e.g. *Record a Result*).","Add callout text boxes outside the form, each with an **arrow** (Insert › Shapes › Arrow) pointing at the part it explains.","Select everything (click each with Shift held) and **Shape Format › Group** so the wireframe moves as one piece.","Repeat for every screen. Put the screen name above each wireframe."]},{"t":"table","head":["Callout on the Ballyvaren results wireframe","Explains"],"rows":[["'The title will appear here, telling the user which screen they are on.'","Title label"],["'The event and the athlete are chosen from drop-down lists.'","Two combo boxes"],["'The athlete's position and their time or distance are typed here.'","Two text boxes"],["'The points for the position app
