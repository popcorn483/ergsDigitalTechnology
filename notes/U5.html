ellers","Test Case 4","Black box","Valid","Crisps 6, Chocolate Bar 5, Water 500ml 3, Apple 2, Banana 1","As expected (Figure 20)","Match","12"],["21","Daily takings","Test Case 4","Black box","Valid","09/11/2026: 3 sales, £6.35; 10/11/2026: 2 sales, £5.85","As expected (Figure 21)","Match","12"],["22","Data reloads","Close and reopen after Test Case 4","Black box","Valid","7 products and 5 sales still shown","Shown (Figure 22)","Match","11"],["23","Save speed","Test Case 3, timed with a stopwatch","Black box","Valid","Saved in under 2 seconds","Under 1 second (Figure 23)","Match","14"]],"caption":"Ballyvaren practice test table (rows that failed are highlighted in your own table)"},{"t":"warn","text":"Do not change a failed result to 'Match' after fixing it. A failed test followed by a corrective action and a retest is good evidence of a proper testing process."}],"diagram":{"kind":"table-reveal","title":"Predict the expected outcome","caption":"Write the expected outcome yourself, then click to check.","head":["Test data","Type of data","Expected outcome"],"rows":[["Price: 5.00","Extreme","Product added (top of the £0.10–£5.00 range)"],["Quantity: 0","Invalid","'The quantity must be between 1 and 20.'"],["Stock level: 501","Invalid","'The stock level must be a whole number from 0 to 500.'"],["Paid exactly £1.90 for £1.90","Extreme","Sale completed; change £0.00"]],"hidden":[[0,2],[1,2],[2,2],[3,2]]},"check":[],"exam":[],"practice":[{"q":"Write three test-table rows for the Ballyvaren category drop-down list and product name: one null, one extreme and one invalid. Use the booklet's columns.","m":3,"a":"24 | No category chosen | Test Case 2 with no category | Black box | Null | Message 'Please choose a category.' and cursor in the category list | (actual + figure) | Match | 3, 7\n25 | Name at maximum length | 25-character name, rest Test Case 2 | Black box | Extreme | Product added | … | … | 3\n26 | Name containing a comma | 'Crisps, salted', rest Test Case 2 | Black box | Invalid | Message 'The product name cannot contain a comma.' | … | … | 7, 11"}],"videos":[],"terms":[]},{"id":"c04-p05","spec":"TASK 19B: Corrective actions","lessons":[],"summary":"After the test table, document 3–5 failed tests under a CORRECTIVE ACTIONS heading: what failed with a screenshot, and how it was fixed with a screenshot of it working.","blocks":[{"t":"task","label":"TASK 19B","title":"Corrective actions","brief":"Under a CORRECTIVE ACTIONS heading, document 3–5 failed tests: what failed and how it was fixed, with screenshots.","where":{"chapter":"Testing chapter","heading":"Heading 2: CORRECTIVE ACTIONS","after":"The test table (Task 19A)","pages":"3–5 pages"},"approach":["Number each corrective action to match its highlighted test row.","Screenshot the faulty code and the failure.","Explain the cause in a sentence or two.","Screenshot the fixed code (change highlighted) and the working result.","Retest and add the retest as a new row in the table."],"deliver":["Heading 'CORRECTIVE ACTIONS'","3–5 corrective actions","Each linked to a test row","Screenshot of each failure","Explanation and screenshot of each fix","Retest rows added"],"marks":{"criteria":["testing"],"evidence":"'Errors are clearly identified and a working solution developed'. Testing (10).","top_band":"Show each failed test, the fix and the retest working (screenshots here)."}},{"t":"example","title":"Worked example: Corrective Action 1 (Ballyvaren Test 10)","steps":["**What failed:** Test 10 clicked P002 Chocolate Bar in the grid, changed the price from 0.85 to 0.90 and clicked Save. Expected: 'Product P002 updated.' Actual: a new product P008 was added and P002 was unchanged (Figure 10).","**Cause:** the `dgvProducts_CellClick` method had been typed into the code by hand, so it was not connected to the grid's CellClick event. It never ran, `editing` stayed null, and Save always added a new product.","**Fix:** in the designer, the grid was selected, **Properties › Events** opened and CellClick set to dgvProducts_CellClick (Figure 10b). The extra product P008 was deleted from products.csv.","**Retest:** clicking P002 now fills the boxes, the button reads 'Save changes', and saving shows 'Product P002 updated.' with 7 products in total (Figure 10c)."]},{"t":"table","head":["Corrective Action","Test","Error type","One-line summary"],"rows":[["1","10","Logic","CellClick handler connected, so editing updates instead of adding"],["2","13","Logic (boundary)","Stock check changed from >= to > so the last items in stock can be sold"],["3","19","Logic","Bubble sort comparison changed from < to > so the lowest stock comes first"]],"caption":"Summary table (optional)"}],"diagram":{"kind":"flow","direction":"lr","title":"From failed test to corrective action","caption":"Step through what happens when a test fails.","nodes":[{"id":"a","label":"Test fails","detail":"Actual outcome differs from expected.","shape":"start"},{"id":"b","label":"Highlight row","detail":"Label it 'Corrective Action n'.","shape":"process"},{"id":"c","label":"Screenshot failure","detail":"The wrong output or error message.","shape":"io"},{"id":"d","label":"Find and fix cause","detail":"Breakpoints, Error List, hand-trace.","shape":"process"},{"id":"e","label":"Screenshot fix","detail":"Corrected code and the working result.","shape":"io"},{"id":"f","label":"Retest row","detail":"New row: now matches.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[],"exam":[],"practice":[{"q":"Write Corrective Action 3 for Ballyvaren Test 19 (the low-stock report showed Chocolate Bar 12, Orange Juice 9, Flapjack 8, Banana 6 instead of lowest first) in the booklet's format.","m":3,"a":"**Corrective Action 3 (Test 19).** *What failed:* with Test Case 4 loaded, the low-stock report listed the products highest stock first: Chocolate Bar 12, Orange Juice 9, Flapjack 8, Banana 6 (Figure 19). *Cause:* the bubble sort swapped two products when `list[i].StockLevel < list[i + 1].StockLevel`, which moves the smaller stock level towards the end, giving descending order. *Fix:* the comparison was changed to `>`, so a product is swapped back when the product after it has less stock (Figure 19b). *Retest:* the report now shows Banana 6, Flapjack 8, Orange Juice 9, Chocolate Bar 12 (Figure 19c). Test 19 is repeated as Test 19a with the result 'Match'."}],"videos":[],"terms":[]}]},{"id":"c05","n":5,"title":"Evaluation","intro":"Tasks 20–24: evaluate every user requirement (met, partially met or not met, with evidence and further developments), reflect on each stage, and write the performance, robustness and personal reflection sections, with paragraph frameworks and sentence starters.","pages":[{"id":"c05-p01","spec":"TASK 20(A): Was each user requirement fully met, partially met or not met?","lessons":[],"summary":"Copy every user requirement into the Evaluation and, in a first paragraph under each, state whether it was fully met, partially met or not met.","blocks":[{"t":"task","label":"TASK 20(A)","title":"Was each user requirement fully met, partially met or not met?","brief":"Copy every user requirement into the Evaluation and state whether it was fully met, partially met or not met.","where":{"chapter":"Evaluation chapter","heading":"Heading 1: Evaluation › Heading 2: User Requirement Evaluation","after":"The Testing chapter","pages":"Part of the 8–10 pages for Task 20"},"approach":["Copy each requirement with its number (and sub-points) under Functional and Non-Functional headings.","Write a one-sentence judgement straight after each: fully met, partially met or not met.","Make the judgement agree with your test table.","Be honest: a clear 'partially met' beats an unsupported 'fully met'."],"deliver":["Heading 'Evaluation' and 'User Requirement Evaluation'","Every requirement copied with its number","A judgement under each","Judgements agree with the test table"],"marks":{"criteria":["evaluation"],"evidence":"'The extent to which the user requirements have been met'. Evaluation (10).","top_band":"Judge every requirement as fully, partially or not met."}},{"t":"example","title":"Worked example: first paragraphs (Ballyvaren practice)","steps":["**Requirement 9:** *The system will take the amount paid, refuse an amount less than the total, and show the change.* First paragraph: 'Requirement 9 has been fully met.'","**Requirement 8:** *The system will not allow more of a product to be added to a basket than there is in stock.* First paragraph: 'Requirement 8 has been partially met.'","**Requirement 17:** *A member of staff who has not used the system before will be able to complete a two-item sale in under 1 minute.* First paragraph: 'Requirement 17 has not been met.'"]},{"t":"warn","text":"Evaluate every requirement, functional and non-functional, using the same numbers as the Design and Testing chapters. A requirement left out of the evaluation looks like one you hoped nobody would notice."}],"diagram":{"kind":"layers","title":"TASK 20 explained","caption":"Click each step: the booklet's four steps for every user requirement.","items":[{"label":"Step 1: copy the requirement","detail":"Copy your user requirements to the Evaluation, each with its number."},{"label":"Step 2: first paragraph","detail":"Say whether the requirement is met, partially met or not implemented. TASK 20(A)."},{"label":"Step 3: second paragraph","detail":"Justify how it has been implemented, with examples from your tests and screenshots. TASK 20(B)."},{"label":"Step 4: third paragraph","detail":"Show how you would extend or add to this requirement: further developments. TASK 20(C)."}]},"check":[],"exam":[],"practice":[{"q":"Using the Ballyvaren test table in the Testing chapter, write the first paragraph for requirements 1, 2 and 4, and say which tests you used.","m":2,"a":"Requirement 1 (login): 'Requirement 1 has been fully met.' (Tests 1, 2, 3 all matched.) Requirement 2 (close after three attempts): 'Requirement 2 has been fully met.' (Test 4 matched.) Requirement 4 (edit a product): 'Requirement 4 has been fully met.' Test 10 failed at first, but Corrective Action 1 fixed it and the retest matched, so the requirement is met in the final system."}],"videos":[],"terms":[]},{"id":"c05-p02","spec":"TASK 20(B): Justify your answer with examples","lessons":[],"summary":"In a second paragraph under each requirement, justify the judgement: 2–3 examples if fully met, 1–2 if partially met, and exactly why if not met.","blocks":[{"t":"task","label":"TASK 20(B)","title":"Justify your answer with examples","brief":"Justify each judgement: 2–3 examples if fully met, 1–2 if partially met, and exactly why if not met.","where":{"chapter":"Evaluation chapter","heading":"Second paragraph under each requirement","after":"That requirement's judgement (Task 20(A))","pages":"Part of the 8–10 pages for Task 20"},"approach":["Describe how the requirement is implemented: what the user sees and does.","Give 2–3 examples for fully met, 1–2 for partially met.","Point to test numbers and figure numbers.","For partially met, say exactly what is missing.","For not met, explain exactly why."],"deliver":["A justification under every requirement","2–3 examples for fully met","1–2 examples and what is missing for partially met","Exact reason for not met","Tests and figures referenced"],"marks":{"criteria":["evaluation"],"evidence":"Justifying the judgement with evidence, including analysing test results. Evaluation (10).","top_band":"Back each judgement with examples and test numbers. Evaluate; do not describe."}},{"t":"example","title":"Worked example: fully met, partially met and not met (Ballyvaren practice)","steps":["**Fully met (Requirement 9, Ballyvaren):** 'The change is calculated on the New Sale screen as soon as the amount paid is typed, and the sale cannot be completed until the amount paid covers the total.'","Example 1: 'Test Case 3 (2 × Crisps and 1 × Water, total £1.90) paid with £2.00 showed change of £0.10 (Test 12, Figure 12).'","Example 2: 'Paying £1.50 for the same basket was refused with \"The amount paid must be at least £1.90.\" (Test 16), and typing \"two\" was rejected without a crash (Test 17).'","Example 3: 'Paying exactly £1.90 completes the sale with change of £0.00, so the boundary is handled correctly.'","**Partially met (Requirement 8, Ballyvaren):** 'A basket cannot hold more of a product than is in stock: asking for 7 bananas when 6 are in stock shows \"Only 6 of Banana left in stock.\" (Test 15), and 6 bananas are accepted after Corrective Action 2 (Test 13 retest).'","'However, the stock is only reduced when a sale is completed and each till keeps its own files. If two tills were used at a busy break time, both could sell the last few items of a product, so the stock could go below zero. The requirement is therefore only partially met.'","**Not met (Requirement 17, Ballyvaren):** 'When a classmate who had not seen the system completed Test Case 3, it took 1 minute 30 seconds, which is longer than the 1-minute target. Most of the time was spent scrolling through the product list, which shows every product in one long drop-down list in the order they were added. The requirement has therefore not been met.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*This requirement has been implemented by…*","*For example, Test … shows that… (Figure …).*","*A further example is…*","*However, … which means the requirement is only partially met.*","*This requirement was not met because…*"],"ordered":false}],"diagram":null,"check":[],"exam":[],"practice":[{"q":"Write the justification paragraph for Ballyvaren requirement 3 (add a product with a price of £0.10–£5.00, stock 0–500 and a category; a unique ID is given), which you have judged fully met.","m":3,"a":"'Requirement 3 has been implemented on the Products screen, where staff enter the name, price, stock level and reorder level and choose the category from a drop-down list, so it cannot be misspelt. For example, Test Case 2 (Crisps, Snack, £0.60, 40 in stock) was saved and given the ID P001 automatically (Test 5, Figure 5). A further example is that the price is range checked: £0.10 is accepted (Test 7) but £5.01 is rejected with the message \"The price must be between £0.10 and £5.00.\" (Test 6). Finally, each new product receives the next unused ID, so no two products share an ID.'"}],"videos":[],"terms":[]},{"id":"c05-p03","spec":"TASK 20(C): How would you develop this requirement further?","lessons":[],"summary":"In a separate third paragraph under each requirement, say exactly how the system could be developed further to extend or improve that requirement, with specific examples.","blocks":[{"t":"task","label":"TASK 20(C)","title":"How would you develop this requirement further?","brief":"In a separate paragraph under each requirement, say exactly how the system could be developed to extend that requirement.","where":{"chapter":"Evaluation chapter","heading":"Third paragraph under each requirement","after":"That requirement's justification (Task 20(B))","pages":"Part of the 8–10 pages for Task 20"},"approach":["Write a separate paragraph for every requirement, non-functional ones included.","Name the feature, the data or screen it needs, and the user who benefits.","Use the stored data in new ways (think what a full school system stores).","Avoid 'make it better' or 'add more features'."],"deliver":["A separate extension paragraph under every requirement","A specific feature each time","How it would be done","Why it would help"],"marks":{"criteria":["evaluation"],"evidence":"'Refinements are clearly identified'. Evaluation (10).","top_band":"Give a specific improvement for each requirement and say why it would help."}},{"t":"table","head":["Requirement (Ballyvaren)","Further development","Why it would help"],"rows":[["1 Login","Store passwords hashed rather than as plain text in logins.txt; add a 'change password' screen","Anyone who opens the file could currently read every password"],["3 Add product","Import the supplier's price list from a CSV file instead of typing each product","New products and price changes could be added in seconds, with fewer typing errors"],["8 Stock check","Keep stock in a shared database and check it again at the moment the sale is completed","Two tills could not sell the same last items"],["9 Payment","Add quick-cash buttons (£1, £2, £5) and card payments","Faster serving and fewer typing errors at a busy break"],["12 Reports","Weekly and monthly takings, and a reorder list that suggests how many to order","Helps the manager order the right amount from the supplier"],["17 Learnability","Sort the product list by category and name, and allow typing a product ID or using a barcode scanner","Fixes the delay found when the requirement was tested"]],"caption":"Further developments, requirement by requirement"},{"t":"h","text":"Paragraph framework"},{"t":"list","items":["**What:** *To develop this requirement further, the system could…*","**How:** *This would involve… (new field, new screen, new file, new method).*","**Why:** *This would benefit [user] because…*"],"ordered":true},{"t":"warn","text":"Avoid vague answers such as 'make it better' or 'add more features'. Name the feature, the data it needs and the user who benefits."}],"diagram":{"kind":"layers","title":"TASK 20 explained","caption":"Click each step: the booklet's four steps for every user requirement.","items":[{"label":"Step 1: copy the requirement","detail":"Copy your user requirements to the Evaluation, each with its number."},{"label":"Step 2: first paragraph","detail":"Say whether the requirement is met, partially met or not implemented. TASK 20(A)."},{"label":"Step 3: second paragraph","detail":"Justify how it has been implemented, with examples from your tests and screenshots. TASK 20(B)."},{"label":"Step 4: third paragraph","detail":"Show how you would extend or add to this requirement: further developments. TASK 20(C)."}]},"check":[],"exam":[],"practice":[{"q":"Write the further-development paragraph for Ballyvaren requirement 12 (the reports screen shows low stock, best sellers and daily takings).","m":2,"a":"'To develop this requirement further, the reports screen could produce a reorder list that suggests how many of each low-stock product to order, based on how many were sold in the last week. This would involve a new method that totals each product's sales for the past seven days and subtracts the current stock, and a button that saves the list as a CSV file to send to the supplier. This would benefit the shop manager, who currently works out the order by hand, and it would mean popular items run out less often.'"}],"videos":[],"terms":[]},{"id":"c05-p04","spec":"TASK 21 (A): Design stage","lessons":[],"summary":"Reflect on the design stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"task","label":"TASK 21 (A)","title":"Design stage","brief":"Under a Design stage subheading, answer in the first person: what went well, what didn't go well, and how it could be improved.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Design stage","after":"The last requirement's evaluation (Task 20)","pages":"About half a page"},"approach":["Write in the first person: 'I chose…', 'I found…'.","Two or three sentences per question.","Name a specific design task that helped later (e.g. control tables).","Name something missed or redone, and its effect.","Say exactly what you would do differently."],"deliver":["Subheading 'Design stage'","What went well","What didn't go well","How I would improve it","Specific evidence from my design"],"marks":{"criteria":["evaluation"],"evidence":"Reflection on the design stage; supports the evaluation and refinements. Evaluation (10).","top_band":"Say what went well, what didn't and how to improve it, with reasons."}},{"t":"example","title":"Worked example: Design stage (Ballyvaren practice)","steps":["Went well: 'I made a control table for every screen, listing each control with its name and type, so I could build the forms quickly and my code used the same names as my designs. Because of this I made very few spelling mistakes in control names during development.'","Didn't go well: 'I left out of my pseudocode for the New Sale screen the check that counts what is already in the basket when checking the stock, so I only added it during development. I then had to go back and update my final design.'","Improve: 'Next time I would list every rule in the scenario and tick each one off against my pseudocode before I submit the design, so that I do not miss any validation.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*During the design stage, I… and this went well because…*","*One thing that did not go well was…, which meant that I…*","*I could improve this by…*"],"ordered":false}],"diagram":{"kind":"cycle","title":"Design stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write the 'what didn't go well' and 'how could this be improved' sentences for a design stage where the wireframes were rushed and User Feedback I found many problems.","m":2,"a":"Didn't go well: 'I produced my wireframes quickly and did not include Help buttons or back buttons, so User Feedback I found problems with every screen. I had to redraft each screen, which took longer than I had planned.' Improve: 'Next time I would check each wireframe against my non-functional requirements (such as a Help button on every screen) before it is reviewed, so that the feedback focuses on real improvements rather than missing items.'"}],"videos":[],"terms":[]},{"id":"c05-p05","spec":"TASK 21 (B): Development stage","lessons":[],"summary":"Reflect on the development (build) stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"task","label":"TASK 21 (B)","title":"Development stage","brief":"Under a Development stage subheading, answer in the first person: what went well, what didn't go well, and how it could be improved.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Development stage","after":"Task 21 (A)","pages":"About half a page"},"approach":["Write in the first person.","Name specific things you built (a screen, a method, a calculation).","Refer to corrective actions for what didn't go well.","Be honest about code that could be simpler or more efficient.","Say exactly how you would build differently."],"deliver":["Subheading 'Development stage'","What went well","What didn't go well","How I would improve it","Corrective actions referred to"],"marks":{"criteria":["evaluation"],"evidence":"Reflection on development. Evaluation (10).","top_band":"Use evaluative language with reasons, not a description of what you did."}},{"t":"example","title":"Worked example: Development stage (Ballyvaren practice)","steps":["Went well: 'I wrote Product and Sale classes with ToCsv methods, and a Sale holds a list of SaleLine objects, so totalling a basket and saving each sale needed only a few lines of code. Because every form used the shared DataStore lists, a sale completed on one screen appeared straight away in the reports.'","Didn't go well: 'I only found several logic errors during testing: editing a product added a new one instead (Corrective Action 1), the last items in stock could not be sold (Corrective Action 2) and the low-stock report was sorted the wrong way round (Corrective Action 3).'","Improve: 'Next time I would test each method with boundary values, such as a quantity equal to the stock, as soon as I write it, rather than waiting for the testing stage. I would also use breakpoints to step through new methods so that I find logic errors earlier.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*During development, I… and this worked well because…*","*The most difficult part for me was…, which caused…*","*I could improve this by…*"],"ordered":false}],"diagram":{"kind":"cycle","title":"Development stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write a 'what went well' answer for a development stage where the two name boxes were validated by one shared method.","m":2,"a":"'I wrote one ShowError method on each form that displays the message and moves the cursor to the box that needs correcting, so every error message behaves in the same way. On the New Sale screen I split the checks into ValidateLine (product, quantity and stock) and ValidatePayment (empty basket and amount paid), which made each method short and easy to test. This meant I did not repeat code, and I could add a new rule in one place.'"}],"videos":[],"terms":[]},{"id":"c05-p06","spec":"TASK 21 (C): Testing stage","lessons":[],"summary":"Reflect on the testing stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"task","label":"TASK 21 (C)","title":"Testing stage","brief":"Under a Testing stage subheading, answer in the first person: what went well, what didn't go well, and how it could be improved.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Testing stage","after":"Task 21 (B)","pages":"About half a page"},"approach":["Write in the first person.","Say how you tested (black and white box; valid, invalid, null and extreme) and what it found.","Name a requirement or situation that was hard to test.","Say what further testing you would do."],"deliver":["Subheading 'Testing stage'","What went well","What didn't go well","How I would improve it"],"marks":{"criteria":["evaluation"],"evidence":"Reflection on testing; links to 'test data is fully analysed'. Evaluation (10).","top_band":"Analyse what your test results showed."}},{"t":"example","title":"Worked example: Testing stage (Ballyvaren practice)","steps":["Went well: 'I used test cases so that each test only changed one value, which made it clear which input caused each result. Testing extreme data such as a quantity equal to the stock helped me find a real error in the stock check (Corrective Action 2), and Test Case 4 let me check the reports against totals I had worked out by hand.'","Didn't go well: 'I found the non-functional requirements harder to test. I could only test requirement 17 with one classmate, rather than with tuck shop helpers at a real break time.'","Improve: 'I would ask several people who have not seen the system to test it, and time each one, to give a fairer result for learnability. I would also test with two copies of the program open at once, to see what happens when two tills sell the same product.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*My testing was effective because I…*","*I found some aspects difficult to test, such as…*","*I could improve my testing by…*"],"ordered":false}],"diagram":{"kind":"cycle","title":"Testing stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write a 'how could this be improved' answer for a testing stage where only valid data was tested for most inputs.","m":2,"a":"'I only tested most inputs with valid data, so I cannot be certain that the validation rejects every invalid entry. Next time I would test each input with valid, invalid, null and extreme data, for example prices of £0.10, £5.00 and £5.01, so that I prove both ends of every range check. I would also add a white-box test of a quantity equal to the stock to show that both sides of the stock check work.'"}],"videos":[],"terms":[]},{"id":"c05-p07","spec":"TASK 21 (D): Further Developments","lessons":[],"summary":"Explain how the overall program could be developed further: what you would add and why.","blocks":[{"t":"task","label":"TASK 21 (D)","title":"Further Developments","brief":"Under a Further Developments subheading, explain how the overall program could be developed further: what and why.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Further Developments","after":"Task 21 (C)","pages":"About half a page"},"approach":["Write in the first person.","Look at the whole system: new users, screens, devices or data storage.","Give two or three developments, each with what, how and why.","Link at least one to a limitation you found in testing or robustness."],"deliver":["Subheading 'Further Developments'","Two or three whole-system developments","What each one is","Why each would help"],"marks":{"criteria":["evaluation"],"evidence":"'Refinements are clearly identified'. Evaluation (10).","top_band":"Give clear, justified refinements for the whole program."}},{"t":"example","title":"Worked example: one development paragraph","steps":["What: 'I would develop the overall program further by storing products and sales in a shared database instead of in CSV files on one computer.'","How: 'I would make each till read and write the same database, and check the stock again at the moment each sale is completed, wherever it was made.'","Why: 'I chose this because it would let two members of staff serve at once at a busy break, without either selling items that are no longer in stock, which my current version cannot guarantee.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*I would develop the overall system further by…*","*To do this, I would…*","*I chose this because it would help … by…*"],"ordered":false}],"diagram":{"kind":"compare","title":"Now and next","caption":"Toggle between the current system and a developed one.","states":[{"label":"Current system","points":["One computer","CSV files","Products chosen from a list","Low stock, best sellers, daily takings","Cash only"],"art":null},{"label":"Developed system","points":["Several tills sharing a database","Stock checked at the moment of sale","Barcode scanning","Suggested supplier orders","Pupil accounts"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write a further-developments paragraph (what, how, why) for adding school records to the Ballyvaren system.","m":2,"a":"'I would develop the overall system further by producing a suggested supplier order. To do this, I would add a method that totals how many of each product were sold in the last seven days, subtracts the current stock, and lists any product where the result is above zero, saved as orders.csv. I chose this because the shop manager could then order the right amount each week instead of guessing, so popular items would run out less often and less money would be tied up in slow-selling stock.'"}],"videos":[],"terms":[]},{"id":"c05-p08","spec":"TASK 21 (E): Personal Reflection","lessons":[],"summary":"Conclude with your overall thoughts on your performance across the project, and what went well, what didn't, and how it could be improved.","blocks":[{"t":"task","label":"TASK 21 (E)","title":"Personal Reflection","brief":"Under a Personal Reflection subheading, give your overall thoughts on your performance, then what went well, what didn't and how it could be improved.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Personal Reflection","after":"Task 21 (D)","pages":"About half a page"},"approach":["Write in the first person.","Start with an overall judgement ('Overall, I…').","Look back over the whole project: design, development and testing.","Two or three sentences per question.","Keep it about the project; Task 24 is about how you worked."],"deliver":["Subheading 'Personal Reflection'","Overall conclusion","What went well","What didn't go well","How I would improve"],"marks":{"criteria":["evaluation"],"evidence":"Personal reflection. It is not named in the mark scheme, but it supports a well-structured evaluation. Evaluation (10).","top_band":"Keep it brief and honest. The marks come mainly from Tasks 20, 22 and 23."}},{"t":"example","title":"Worked example (Ballyvaren practice)","steps":["Overall: 'Overall, I produced a working tuck shop stock and sales system that fully meets 14 of its 17 requirements, with two partially met (8 and 15) and one not met (17).'","Went well: 'I planned the design stage carefully, particularly the control tables and pseudocode, so my build followed the designs closely. Testing with boundary data helped me find and fix three real errors.'","Didn't go well: 'I found time management difficult near the end, so I only tested the learnability requirement with one person and did not add Help buttons to the login and reports screens.'","Improve: 'Next time I would make a plan for each stage and keep time back for testing, so that I could test the non-functional requirements more thoroughly.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*Overall, I…*","*The part of the project I am most pleased with is…, because…*","*The weakest part was…, which meant I…*","*In a future project, I would…*"],"ordered":false}],"diagram":{"kind":"cycle","title":"Personal reflection: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write an overall conclusion sentence and a 'how could this be improved' answer for a project where every functional requirement was met but the write-up was rushed.","m":2,"a":"Overall: 'Overall, I produced a system that meets all twelve functional requirements, although my evaluation and testing evidence are less detailed than my design.' Improve: 'I should collect and label screenshots during development and testing rather than at the end, so that I can complete the write-up alongside the program. Planning when I will finish each chapter would leave me time to review the whole document before submission.'"}],"videos":[],"terms":[]},{"id":"c05-p09","spec":"TASK 22: Performance","lessons":[],"summary":"In short paragraphs, answer: is the system reliable and efficient, and does it take a long time to load or save files? Justify each answer.","blocks":[{"t":"task","label":"TASK 22","title":"Performance","brief":"Answer in short paragraphs: is the system reliable and efficient, and does it take long to load or save files? Justify each answer.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Performance","after":"Task 21 (E)","pages":"About half a page"},"approach":["Write one short paragraph each for reliability, efficiency and load/save time.","Back each with evidence: test results, timings, file sizes.","Time loading and saving with a stopwatch.","Say how it would cope with much more data."],"deliver":["Heading 'Performance'","Reliability paragraph","Efficiency paragraph","Load/save time with timed evidence","Each answer justified"],"marks":{"criteria":["evaluation"],"evidence":"'The performance and robustness of the system is analysed fully'. Evaluation (10).","top_band":"Analyse performance with evidence (load/save times, reliability), not just 'it works'."}},{"t":"example","title":"Worked example: one paragraph (Ballyvaren practice)","steps":["'The system is efficient when loading and saving. Completing a sale took less than one second in Test 23 and loading at start-up was not noticeable, because products.csv and sales.csv are small text files. This is because each product and each item sold is stored as one short line of text and the lists are kept in memory while the program runs.'","'However, both files are rewritten every time a sale is completed, and the reports recalculate every total from every sale each time they open. For one tuck shop this is not a problem, but after several years of sales a database would be more efficient.'"]}],"diagram":{"kind":"compare","title":"Reliable vs efficient","caption":"Toggle between the two ideas.","states":[{"label":"Reliable","points":["Does the same correct thing every time","Doesn't crash","Evidence: test table, corrective actions, repeated runs"],"art":null},{"label":"Efficient","points":["Does the job quickly without wasting time or memory","Evidence: timed load/save, small files, reusable methods","Limit: how it would cope with much more data"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write the 'Is the system reliable?' paragraph for the Ballyvaren practice system.","m":2,"a":"'The system is reliable. All 23 tests in the test table matched the expected outcomes after three corrective actions, and the program did not crash during testing, even when text such as \"cheap\" was entered as a price or \"two\" as the amount paid, because int.TryParse and decimal.TryParse are used instead of Parse. File operations are inside try…catch blocks, so a missing logins file or a damaged sales file produces a clear message rather than a crash. Its reliability has only been shown on one computer, however, and it has not been used at a real break time.'"}],"videos":[],"terms":[]},{"id":"c05-p10","spec":"TASK 23: Robustness","lessons":[],"summary":"In short paragraphs, answer: can someone break the system, where, how would you prevent it, why wasn't it fully robust, does it crash, how do you know, and what limits your testing?","blocks":[{"t":"task","label":"TASK 23","title":"Robustness","brief":"Answer in short paragraphs: can the system be broken, where, how would you prevent it, why it isn't fully robust, does it crash and how you know, and what limits your evidence.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Robustness","after":"Task 22","pages":"Half to one page"},"approach":["Try to break your own program first and note what happens.","Answer each booklet question in its own short paragraph.","Name where it could break (inputs, files, lists, several users).","Explain limitations and constraints honestly.","Say how you know it does or doesn't crash, and the limits of that testing."],"deliver":["Heading 'Robustness'","Where it could break","How to prevent it","Why it isn't fully robust","Does it crash and how I know","Limits of my testing"],"marks":{"criteria":["evaluation","testing"],"evidence":"Robustness: a top-band Evaluation feature. It also links back to the Testing band 'testing reflects the general robustness'. Evaluation (10).","top_band":"Explain where the system could break, how you prevent it, and how you know (test numbers)."}},{"t":"table","head":["Question","Ballyvaren example answer (practice)"],"rows":[["Can someone break it? Where?","Yes: if sales.csv is edited by hand and a line is damaged, the program will not start; if two tills sell the same product, each only knows its own stock, so the stock could go below zero."],["How would you prevent it?","Keep the files in a folder staff cannot edit; skip and report damaged lines instead of stopping; move to a shared database."],["Why not fully robust?","Time constraints and the scope of a GCSE project: a single-user, single-computer system was built first."],["Does it crash? How do you know?","No crashes in any of the tests, including invalid, null and extreme data (Tests 2–4, 6–9, 13–18); every file operation is inside try…catch."],["Limitations to seeing this","Testing was done by the developer and one classmate, on one computer, with 7 products and 5 sales, not by helpers at a busy break with a queue waiting."]],"caption":"Robustness questions"}],"diagram":{"kind":"hotspot","title":"Weak points to check","caption":"Click each part of the system to see how it could break and how it is protected.","rows":[[{"label":"Inputs","detail":"Protected by validation: TryParse, range, presence and duplicate checks.","span":2},{"label":"Files","detail":"Protected by try…catch; still breaks if edited by hand.","span":2}],[{"label":"Lists","detail":"Empty list or no selection: check Count and the selected item before using them.","span":2},{"label":"Several tills","detail":"Not protected: sales made on two computers are in two separate files.","span":2}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write the 'Does the system crash? Justify how you know' paragraph for the Ballyvaren practice system, and the paragraph on the limitations of that evidence.","m":3,"a":"'The system did not crash at any point during testing. Every input on the Products and New Sale screens was tested with valid, invalid, null and extreme data (Tests 6–9 and 13–18): for example, typing \"cheap\" into the price box shows a message instead of crashing because decimal.TryParse is used. File errors are handled by try…catch blocks, which was confirmed by deleting logins.txt, which produced the message \"The logins file is missing\".'\n\n'However, these tests were carried out by the developer and one classmate on a single computer with 7 products and 5 sales. The system has not been used at a real break time, so problems that only appear with hundreds of sales, a long queue or unexpected user behaviour may not have been found.'"}],"videos":[],"terms":[]},{"id":"c05-p11","spec":"TASK 24: Personal Evaluation / Reflection","lessons":[],"summary":"Write a short first-person paragraph on your personal performance: how much help you needed, what you found easy and why, what was difficult and how you overcame it.","blocks":[{"t":"task","label":"TASK 24","title":"Personal Evaluation / Reflection","brief":"Write a short first-person paragraph on your personal performance: help needed, what was easy and why, what was difficult and how you overcame it.","where":{"chapter":"Evaluation chapter","heading":"Heading 2: Personal Evaluation/Reflection","after":"Task 23","pages":"One paragraph"},"approach":["Write in the first person.","Say honestly how independently you worked.","Name something easy and why.","Name a real difficulty and the steps you took (research, notes, debugging).","Name the theory topics that helped."],"deliver":["Heading 'Personal Evaluation/Reflection'","First person","How I worked","What was easy and why","What was difficult and how I overcame it","Topics or research that helped"],"marks":{"criteria":["evaluation"],"evidence":"Personal evaluation. It is not named in the mark scheme; it supports reflection only. Evaluation (10).","top_band":"Short and first person. Do not rely on it for marks."}},{"t":"example","title":"Worked example (fictional pupil, Ballyvaren practice)","steps":["'I found the design stage straightforward because I had practised writing requirements and control tables in class, so I knew what level of detail was needed.'","'The most difficult part was the low-stock report, which listed the products in the wrong order. I set a breakpoint in the sort and stepped through it, which showed that my comparison was the wrong way round.'","'I also revised my Unit 4 notes on sorting algorithms, which helped me understand how each pass of a bubble sort moves the largest value to the end.'","'If I did the project again, I would test each method as soon as I wrote it, because several logic errors only appeared during the testing stage.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*I found … easy because…*","*The most difficult part for me was…*","*To overcome this, I researched… / revised my notes on…*","*The topic that helped most was…*","*If I did this project again, I would…*"],"ordered":false}],"diagram":{"kind":"flow","direction":"lr","title":"Shape of the reflection","caption":"Step through a short, complete reflection.","nodes":[{"id":"a","label":"How I worked","detail":"How much help, how independently.","shape":"start"},{"id":"b","label":"What was easy","detail":"…and why.","shape":"process"},{"id":"c","label":"What was hard","detail":"A real difficulty.","shape":"process"},{"id":"d","label":"How I overcame it","detail":"Research, notes (which topic), debugging.","shape":"process"},{"id":"e","label":"Next time","detail":"One thing I would do differently.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[],"exam":[],"practice":[{"q":"Rewrite this weak reflection so it answers the booklet's questions: 'It was hard. I got a lot of help. It went OK in the end.'","m":2,"a":"'I worked on most of the project independently, although some parts took longer than I planned. I found building the forms easy because the control tables told me exactly which controls to add and what to name them. The most difficult part was the change calculation, which was wrong at first. I overcame this by using breakpoints to watch the total and the change as each item was added, which showed that I was working out the change before the last item went into the basket, and I fixed it by recalculating the change whenever the total changes. Revising my Unit 4 notes on variables and selection also helped me trace the code. Next time I would test each calculation as soon as I wrote it.'"}],"videos":[],"terms":[]}]},{"id":"c06","n":6,"title":"Before you submit","intro":"Extra help that is not a booklet task: frequently asked questions and the full checklist from the guidance booklet, with final checks before you upload your Word and PDF copies.","pages":[{"id":"c06-p01","spec":"Questions pupils ask (not a booklet task)","lessons":[],"summary":"Answers to common questions about the controlled assessment, taken from the guidance booklet, plus the questions only your teacher can answer.","blocks":[{"t":"p","text":"These answers come from the student guidance booklet. Where a question depends on CCEA's rules or your school's arrangements, the answer is: **ask your teacher**. Rules can change from year to year, and your teacher has the current CCEA instructions."},{"t":"table","head":["Question","Answer (from the booklet)"],"rows":[["Can I put my name on my work?","No. Use your candidate number and the centre number only: front page, header, folder and file names."],["Does a logo on the front page get marks?","No. You can add an image or logo, but it does not give extra marks."],["Can I write 'I' or 'we'?","Only in the reflections: Task 21 and Task 24. Everywhere else write professionally: 'The system will…'."],["How many inputs should Task 10 list?","Roughly 50 across all screens, including buttons, because a click is an input."],["Do wireframes and final designs go in the Write Up?","Make them in separate documents (Initial Designs and Final Designs folders), then collate them into one document at Task 15."],["Flowcharts or pseudocode?","Either, with at least one process per screen. Flowcharts suit simple screens; pseudocode is quicker for long processes."],["How many corrective actions do I need?","3–5 documented from your testing (Task 19B), each with screenshots of the failure and the fix."],["What if my program ends up different from my designs?","Go back to User Feedback II (Task 15) and explain the changes and that the client agreed."],["What format do I submit?","Both Microsoft Word and PDF, uploaded to Google Classroom."],["Which programming language?","C#, using Microsoft Visual Studio (Windows Forms)."]],"caption":"Frequently asked questions"},{"t":"h","text":"Ask your teacher about"},{"t":"list","items":["How long you have for each stage. Finish each one by the deadline your teacher gives you.","Which resources (notes, this book, the internet) you may use during the controlled assessment sessions, and how to acknowledge any source you use.","Where your Visual Studio project should be saved.","Whether you may take work home or must work only in supervised lessons.","Anything in this year's scenario you do not understand. Your teacher can explain what a task requires but cannot tell you how to answer it or correct your work."],"ordered":false},{"t":"warn","text":"Do not share your files, code or write-up with other pupils, and do not post the scenario or your work online. Work that is not your own can be treated as malpractice."}],"diagram":{"kind":"match","title":"Quick quiz on the rules","caption":"Match each question to the booklet's answer.","pairs":[["Name on the front page?","Never: candidate and centre number only"],["First person allowed?","Only in Tasks 21 and 24"],["Corrective actions in testing?","3–5"],["Submission formats?","Word and PDF"],["Inputs in Task 10?","Roughly 50, including buttons"]]},"check":[],"exam":[],"practice":[{"q":"A friend's front page has their name and a logo, their requirements say 'I will make…', and they have one corrective action. Using the FAQs, list what they should fix.","m":2,"a":"1 Remove the name and use the candidate number and the centre number (the logo can stay but earns no marks). 2 Rewrite the requirements professionally: 'The system will…', with no I/We (first person only in Tasks 21 and 24). 3 Document 3–5 corrective actions from testing, each with screenshots of the failure and the fix, and label the failed rows in the test table."}],"videos":[],"terms":[]},{"id":"c06-p02","spec":"Before you submit (not a booklet task)","lessons":[],"summary":"The booklet's full task checklist, plus final checks on the document, the evidence and the program before you upload the Word and PDF copies.","blocks":[{"t":"p","text":"This is the booklet's checklist (page 24) for the whole controlled assessment. Tick each task only when it is complete in **your** Write Up, for **this year's CCEA scenario**, not the Ballyvaren practice."},{"t":"todo","title":"Controlled assessment checklist (booklet page 24)","items":["TASK 1: Created a Word document within the CA folder","TASK 2: Created a title page","TASK 3: Added a header and footer","TASK 4: Inserted a table of contents","TASK 5: Design chapter subtitle page","TASK 6: Wrote the introduction","TASK 7: Functional requirements in a numbered list","TASK 8: Non-functional requirements in a numbered list","TASK 9: Wrote about the target audience","TASK 10: Listed and described all data requirements","TASK 11: Wireframe diagrams / initial designs","TASK 12: User Feedback I","TASK 13A: Final designs","TASK 13B: Control tables","TASK 13C: Flowcharts / pseudocode","TASK 14: Navigational structure","TASK 15: Submission onto Google Classroom","TASK 16: Built the project in Visual Studio and recorded errors","TASK 17: Testing subtitle page","TASK 18A: User requirements copied from the design chapter","TASK 18B: Test cases","TASK 19: Test table completed, with corrective actions","TASK 20 Part A: Functional and non-functional requirements evaluated","TASK 20 Part B: Justified with examples","TASK 20 Part C: Further developments explained","TASK 21 Part A: Design stage","TASK 21 Part B: Development stage","TASK 21 Part C: Testing","TASK 21 Part D: Further developments","TASK 21 Part E: Personal reflection","TASK 22: Performance paragraph","TASK 23: Robustness paragraph","TASK 24: Personal reflection / personal performance paragraph","SUBMITTED"]},{"t":"h","text":"Final checks on the document"},{"t":"table","head":["Check","How"],"rows":[["No name anywhere","Front page, header, file names, screenshots, File › Info › Properties"],["Contents up to date","References › Update Table › Update entire table"],["Headings consistent","Heading 1 for chapters, Heading 2 for sections; nothing formatted by hand"],["Requirement numbers match","Same numbers in Design, Testing and Evaluation"],["Every figure referenced","Each screenshot has a figure number that the test table or text refers to"],["Professional style","Search (Ctrl + F) for ' I ' and ' we ': only Tasks 21 and 24 should have them"],["PDF checked","Open the PDF and scroll through every page; shapes and pictures sometimes move"]],"caption":"Document checks"},{"t":"h","text":"Final checks on the program"},{"t":"list","items":["It runs from a fresh start (close Visual Studio, reopen the solution, press F5).","Every screen in the navigation structure opens and has a way back.","Data files are where the program expects them.","Your teacher knows where the Visual Studio project is saved."],"ordered":false},{"t":"warn","text":"Leave time. Collating, updating the contents, exporting to PDF and checking it always takes longer than expected. Finish well before the deadline your teacher gives you."},{"t":"key","title":"Submit","items":["Save the final Write Up as Word (.docx) and as PDF.","Upload both to the Google Classroom assignment and click Turn in.","Tick SUBMITTED."]}],"diagram":{"kind":"timeline","title":"The whole assessment","caption":"Click each stage to check you have everything.","items":[{"label":"Set up","detail":"Tasks 1–5: folder, Write Up, front page, header/footer, contents, Design subtitle page."},{"label":"Design","detail":"Tasks 6–15: introduction, requirements, audience, data, wireframes, feedback, final designs, control tables, processes, navigation, approval, submission."},{"label":"Build","detail":"Task 16: working C# program and Corrective Actions document."},{"label":"Test","detail":"Tasks 17–19: subtitle page, requirements, test cases, test table, corrective actions."},{"label":"Evaluate","detail":"Tasks 20–24: requirements, stages, further developments, performance, robustness, personal reflection."},{"label":"Submit","detail":"Word and PDF on Google Classroom."}]},"check":[],"exam":[],"practice":[{"q":"You have one lesson left and your evaluation is half finished. Put these jobs in a sensible order and explain why: finish Task 21, update contents, export PDF, check PDF, finish Task 20, write Task 24, upload.","m":2,"a":"1 Finish Task 20 (evaluating every requirement carries the most evidence). 2 Finish Task 21. 3 Write Task 24 (short). 4 Update the table of contents. 5 Save as Word and export to PDF. 6 Check the PDF page by page. 7 Upload both and turn in. The contents are updated only once the text is complete, so the page numbers are right, and the PDF is checked before uploading because exporting can move pictures."}],"videos":[],"terms":[]}]}],"glossary":[],"markmap":{"qualification":"CCEA GCSE Digital Technology (2017), Unit 5: Digital Development Practice (controlled assessment, Route B)","total_marks":60,"weighting":"30% of the GCSE; 36 hours; medium control; teacher-marked, CCEA-moderated; marked 'best fit' within bands","qwc_note":"The Unit 5 mark scheme has no separate QWC criterion or QWC marks. Spec section 4.4 says QWC is assessed in tasks needing extended writing, so clear, accurate writing supports the Evaluation marks but is not scored separately.","source":[{"title":"CCEA GCSE Digital Technology Unit 5 Controlled Assessment Task, Mark Scheme 2026-2027 (Summer 2027), ref 15497.01, valid from 1 June 2026","url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Live%20Tasks%3A%20Unit%205/GCSE%20Digital%20Technology%20%282017%29/2027-Summer/Controlled%20Assessment%20Task%20-%20Unit%205%20Digital%20Development%20Practice%2C%20Mark%20Scheme%20%282026-2027%29-Summer2027.pdf"},{"title":"CCEA GCSE Digital Technology Unit 5 Mark Scheme 2025-2026 (archived), ref 15390.01 - same criteria and bands","url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Archived%20Tasks%3A%20Unit%205/GCSE%20Digital%20Technology%20%282017%29/-Summer/%20Controlled%20Assessment%20Task%20-%20Unit%205%20Digital%20Development%20Practice%2C%20Mark%20Scheme%20%282025-2026%29-Summer.pdf"},{"title":"CCEA GCSE Digital Technology (2017) Specification (updated 17 Sept 2019): sections 3.5, 4.2-4.4, 6.6","url":"https://ccea.org.uk/downloads/docs/Specifications/GCSE/GCSE%20Digital%20Technology%20%282017%29/GCSE%20Digital%20Technology%20%282017%29-specification-Standard_0.pdf"},{"title":"CCEA Unit 5 Controlled Assessment Task 2026-2027 (36 hours, total mark 60)","url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Live%20Tasks%3A%20Unit%205/GCSE%20Digital%20Technology%20%282017%29/2027-Summer/Controlled%20Assessment%20Task%20-%20Unit%205%20Digital%20Development%20Practice%20%282026-2027%29-Summer2027.pdf"},{"title":"CCEA GCSE Digital Technology Controlled Assessment Teacher Guidance (v1, 21/09/18): each CA task marked out of 60, 30%","url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Guidance/GCSE%20Digital%20Technology%20%282017%29/-/GCSE%20Digital%20Technology%3A%20Controlled%20Assessment%20Teacher%20Guidance-.pdf"},{"title":"CCEA GCSE Digital Technology Chief Examiner's and Principal Moderator's Report, Summer 2025","url":"https://ccea.org.uk/downloads/docs/ExamMod-Reports/GCSE/GCSE%20Digital%20Technology%20%282017%29/2025/GCSE%20Digital%20Technology%20%282017%29-Summer2025-Report_0.pdf"},{"title":"CCEA GCSE Digital Technology Chief Examiner's and Principal Moderator's Report, Summer 2024","url":"https://ccea.org.uk/downloads/docs/ExamMod-Reports/GCSE/GCSE%20Digital%20Technology%20%282017%29/2024/GCSE%20Digital%20Technology%20%282017%29-Summer2024-Report_0.pdf"},{"title":"CCEA GCSE Digital Technology (2017) assessment page (lists the documents above)","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/assessment"}],"criteria":[{"id":"design","name":"Design a solution using appropriate tools (mark scheme section 1)","marks":13,"bands":[{"band":"Top (10–13)","needs":"A high-quality design that breaks the whole problem down fully, using proper design tools such as flowcharts or pseudocode. Complete data requirements (inputs, processes, outputs, screen and report designs) detailed enough for someone to build a fully working program. Target audience needs clearly identified. Help for the user fully planned. Validation and error trapping designed so the program will be robust. Clear evidence that user feedback was used to improve the design."},{"band":"Middle (5–9)","needs":"A basic but working design using some design tools. A basic set of data requirements, enough to build a basic working program. Target audience identified. Some validation planned. Some evidence the design was refined after problems were spotted."},{"band":"Low (1–4)","needs":"A limited design with limited data requirements (enough for only a partly working program), little validation, the target audience poorly identified, and little or no refinement."},{"band":"0","needs":"Nothing worthy of credit."}],"key_words":["fully decomposed","comprehensive data requirements","clearly identified target audience","help for the user","validation and error trapping","robust","user feedback used to refine"],"ao":"Unit 5 (like Unit 3) is 30% of the GCSE: AO1 8%, AO2 14%, AO3 8% (spec section 4.3; AO1 knowledge and understanding, AO2 apply knowledge to investigate/analyse problems and propose solutions, AO3 design, develop and evaluate solutions, making reasoned judgements). The mark scheme does not split individual criteria by AO.","source_url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Live%20Tasks%3A%20Unit%205/GCSE%20Digital%20Technology%20%282017%29/2027-Summer/Controlled%20Assessment%20Task%20-%20Unit%205%20Digital%20Development%20Practice%2C%20Mark%20Scheme%20%282026-2027%29-Summer2027.pdf","confirmed":true},{"id":"build","name":"Building a solution (mark scheme section 2)","marks":27,"bands":[{"band":"Top (21–27)","needs":"A high-quality program that makes good use of the IDE (Visual Studio). The interface suits the target audience and matches all of the data and design requirements. The code is annotated (commented) and shows suitable data types, data structures, control structures, string handling, functions and logical/arithmetic operators. Validation and help features appear throughout."},{"band":"Upper-middle (14–20)","needs":"A fully working program using some IDE features. The interface suits the audience and matches most of the design. Annotated code shows the same range of programming techniques. Basic validation and help features."},{"band":"Lower-middle (7–13)","needs":"A basic working program using a few IDE features. The audience was considered, and the program matches most of the design. Some of the programming techniques are shown. Little validation or help."},{"band":"Low (1–6)","needs":"A partly working program with some evidence of the IDE and of the features needed."},{"band":"0","needs":"Nothing worthy of credit."}],"key_words":["high quality","matches all data and design requirements","annotated","data structures","string handling","functions","validation and help throughout"],"ao":"Unit 5 (like Unit 3) is 30% of the GCSE: AO1 8%, AO2 14%, AO3 8% (spec section 4.3; AO1 knowledge and understanding, AO2 apply knowledge to investigate/analyse problems and propose solutions, AO3 design, develop and evaluate solutions, making reasoned judgements). The mark scheme does not split individual criteria by AO.","source_url":"https://ccea.org.uk/downloads/docs/Qual-Assessment/Live/GCSE%20Controlled%20Assessment/Live%20Tasks%3A%20Unit%205/GCSE%20Digital%20Technology%20%282017%29/2027-Summer/Controlled%20Assessment%20Task%20-%20Unit%205%20Digital%20Development%20Practice%2C%20Mark%20Scheme%20%282026-2027%29-Summer2027.pdf","confirmed" DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));

      if (H.has(k) && !shown.has(k)) { td.className = ''; td.innerHTML = ''; const b = el('button', { type: 'button', class: 'cellbtn', 'aria-label': `Reveal ${plain(head[ci] || 'cell')} in row ${ri + 1}` }, '?'); b.addEventListener('click', () => reveal(ri, ci, true)); td.append(b); }
      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }

    if (focusNext) { const nb = body.querySelector('.cellbtn'); if (nb) nb.focus(); else next.focus(); }
  }
  next.addEventListener('click', () => { const h = order.find(h => !shown.has(key(h[0], h[1]))); if (h) reveal(h[0], h[1]); });
  all.addEventListener('click', () => { order.forEach(h => shown.add(key(h[0], h[1]))); paint(); cx.detail('', 'All cells revealed.'); });
