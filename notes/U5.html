 highlighted and explains what went wrong, and the last column names the corrective action.","Non-functional requirements are tested in their own short table at the end (timings, consistency checks)."]},{"t":"note","text":"**Typical length:** Often 80–110 tests over about 30 pages for a system with eight to ten screens. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"compare","head":["Weak row","Strong row"],"rows":[["Test data","some numbers","Test Case 2, with Year group changed to 13"],["Expected","error","Message 'The year group must be between 8 and 12.'; athlete not saved"],["Requirement","3","3 (a)"]]},{"t":"todo","title":"TASK 19A checklist","items":["Test table with all the booklet's columns","Every requirement tested at least once","Valid, invalid, null and extreme data for each input","Expected outcome written before running","Screenshot for every test, labelled with a figure number","Failed rows highlighted and linked to a corrective action"]}],"diagram":{"kind":"table-reveal","title":"Predict the expected outcome","caption":"Write the expected outcome yourself, then click to check.","head":["Test data","Type of data","Expected outcome"],"rows":[["Year group: 8","Extreme","Athlete added (bottom of the 8–12 range)"],["Position: 0","Invalid","'The position must be between 1 and 6.'"],["Time: 0","Invalid","'The time in seconds must be greater than 0.'"],["Long Jump distance: 120","Invalid","'The distance in metres must be no more than 100.'"]],"hidden":[[0,2],[1,2],[2,2],[3,2]]},"check":[],"exam":[],"practice":[{"q":"Write three test-table rows for the Ballyvaren house drop-down list and first name: one null, one extreme and one invalid. Use the booklet's columns.","m":3,"a":"23 | No house chosen | Test Case 2 with no house | Black box | Null | Message 'Please choose a house.' and cursor in the house list | (actual + figure) | Match | 3, 7\n24 | First name at maximum length | 20-character first name, rest Test Case 2 | Black box | Extreme | Athlete added | … | … | 3\n25 | First name containing a comma | 'Aoife,' rest Test Case 2 | Black box | Invalid | Message 'The first name cannot contain a comma.' | … | … | 7, 10"}],"videos":[],"terms":[]},{"id":"c04-p05","spec":"TASK 19B: Corrective actions","lessons":[],"summary":"After the test table, document 3–5 failed tests under a CORRECTIVE ACTIONS heading: what failed with a screenshot, and how it was fixed with a screenshot of it working.","blocks":[{"t":"p","text":"After the table, create a heading called **CORRECTIVE ACTIONS**. Here you must have **3–5 errors documented from your testing**. Highlight and label the rows in the table that failed. Under this heading add, for each one:"},{"t":"list","items":["details of what failed, with a screenshot of it failing;","details of how you fixed it, with a screenshot of it now working and fully functional."],"ordered":false},{"t":"p","text":"Where the table says Match/Corrective Action, state which corrective action you mean (for example 'Corrective Action 1'). Then retest and add the retest as a new row, so the table shows the problem was solved."},{"t":"example","title":"Worked example: Corrective Action 1 (Ballyvaren Test 10)","steps":["**What failed:** Test 10 clicked A002 Conor Quinn in the grid, changed the house from Fionn to Macha and clicked Save. Expected: 'Athlete A002 updated.' Actual: a new athlete A009 was added and A002 was unchanged (Figure 10).","**Cause:** the `dgvAthletes_CellClick` method had been typed into the code by hand, so it was not connected to the grid's CellClick event. It never ran, `editing` stayed null, and Save always added a new athlete.","**Fix:** in the designer, the grid was selected, **Properties › Events** opened and CellClick set to dgvAthletes_CellClick (Figure 10b). The extra athlete A009 was deleted from athletes.csv.","**Retest:** clicking A002 now fills the boxes, the button reads 'Save changes', and saving shows 'Athlete A002 updated.' with 8 athletes in total (Figure 10c)."]},{"t":"example","title":"Worked example: Corrective Action 2 (Ballyvaren Test 13)","steps":["**What failed:** recording A008 in 6th place in the 100m showed 0 points instead of 1 (Figure 13).","**Cause:** the range guard in PointsFor was `if (position < 1 || position >= MAX_POSITION)`. With MAX_POSITION = 6, position 6 counted as out of range, so it returned 0. This is a boundary error: positions 1–5 were correct, which is why Test 12 passed.","**Fix:** changed `>=` to `>` so that 6 is inside the range (Figure 13b).","**Retest:** 6th place now gives 1 point (Figure 13c); position 7 still gives the range message (Test 14) and Test 12 still matches."]},{"t":"table","head":["Corrective Action","Test","Error type","One-line summary"],"rows":[["1","10","Logic","CellClick handler connected, so editing updates instead of adding"],["2","13","Logic (boundary)","Range guard changed from >= to > so 6th place scores 1 point"],["3","19","Logic","Bubble sort comparison changed from > to < so the highest total comes first"]],"caption":"Summary table (optional)"},{"t":"tip","text":"Your Corrective Actions document from Task 16 is a good source: errors you found while building, then confirmed by a test, make strong corrective actions."},{"t":"key","title":"What good work includes","items":["Numbered corrective actions, each matching a highlighted row in the test table.","For each: a screenshot of the faulty code and its output, a sentence explaining the fault, a screenshot of the fixed code with the change highlighted and the new output, then a sentence explaining the fix.","A retest showing the problem is solved."]},{"t":"note","text":"**Typical length:** Half a page to a page each (the booklet asks for 3–5). These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 19B checklist","items":["Heading 'CORRECTIVE ACTIONS' after the test table","3–5 corrective actions documented","Failed rows highlighted and labelled in the table","Screenshot of each failure","Explanation and screenshot of each fix","Retest rows added to the table"]}],"diagram":{"kind":"flow","direction":"lr","title":"From failed test to corrective action","caption":"Step through what happens when a test fails.","nodes":[{"id":"a","label":"Test fails","detail":"Actual outcome differs from expected.","shape":"start"},{"id":"b","label":"Highlight row","detail":"Label it 'Corrective Action n'.","shape":"process"},{"id":"c","label":"Screenshot failure","detail":"The wrong output or error message.","shape":"io"},{"id":"d","label":"Find and fix cause","detail":"Breakpoints, Error List, hand-trace.","shape":"process"},{"id":"e","label":"Screenshot fix","detail":"Corrected code and the working result.","shape":"io"},{"id":"f","label":"Retest row","detail":"New row: now matches.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","f"]]},"check":[],"exam":[],"practice":[{"q":"Write Corrective Action 3 for Ballyvaren Test 19 (the leaderboard showed Boru 16, Fionn 18, Macha 26, Lir 30 instead of highest first) in the booklet's format.","m":3,"a":"**Corrective Action 3 (Test 19).** *What failed:* with Test Case 4 loaded, the leaderboard listed the houses lowest first: Boru 16, Fionn 18, Macha 26, Lir 30 (Figure 19). *Cause:* the bubble sort swapped two houses when `list[i].TotalPoints > list[i + 1].TotalPoints`, which moves the larger total towards the end, giving ascending order. *Fix:* the comparison was changed to `<`, so a house is swapped forward when the house after it has more points (Figure 19b). *Retest:* the leaderboard now shows Lir 30, Macha 26, Fionn 18, Boru 16 (Figure 19c). Test 19 is repeated as Test 19a with the result 'Match'."}],"videos":[],"terms":[]}]},{"id":"c05","n":5,"title":"Evaluation","intro":"Tasks 20–24: evaluate every user requirement (met, partially met or not met, with evidence and further developments), reflect on each stage, and write the performance, robustness and personal reflection sections, with paragraph frameworks and sentence starters.","pages":[{"id":"c05-p01","spec":"TASK 20(A): Was each user requirement fully met, partially met or not met?","lessons":[],"summary":"Copy every user requirement into the Evaluation and, in a first paragraph under each, state whether it was fully met, partially met or not met.","blocks":[{"t":"p","text":"The Evaluation starts with a Heading 1 **Evaluation** and a Heading 2 **User Requirement Evaluation**. For each user requirement, state: was it **fully met**, **partially met**, or **not met**? This is Step 1 and Step 2 of the booklet's *TASK 20 Explained* box: copy your user requirements to the Evaluation, then under each requirement write a first paragraph saying whether it is met, partially met or not implemented."},{"t":"table","head":["Judgement","Use it when","Evidence you need"],"rows":[["Fully met","Every part of the requirement works and every test on it matched (after any corrective actions)","2–3 examples (Task 20(B))"],["Partially met","Some parts work; one part is missing, limited or failed a test that was not fixed","1–2 examples, plus exactly what is missing"],["Not met","It was not implemented, or it does not work","An explanation of exactly why"]],"caption":"Choosing a judgement"},{"t":"example","title":"Worked example: first paragraphs (Ballyvaren practice)","steps":["**Requirement 9:** *Points will be awarded automatically: 1st 10, 2nd 8, 3rd 6, 4th 4, 5th 2, 6th 1.* First paragraph: 'Requirement 9 has been fully met.'","**Requirement 8:** *The system will not allow the same position to be given twice in one event, or the same athlete to be entered twice in one event.* First paragraph: 'Requirement 8 has been partially met.'","**Requirement 17:** *A member of staff who has not used the system before will be able to record a result in under 1 minute.* First paragraph: 'Requirement 17 has not been met.'"]},{"t":"tip","text":"Be honest. A 'partially met' with a clear explanation is far more convincing than claiming everything is fully met when your own test table shows otherwise. Your judgements must agree with your test table."},{"t":"warn","text":"Evaluate every requirement, functional and non-functional, using the same numbers as the Design and Testing chapters. A requirement left out of the evaluation looks like one you hoped nobody would notice."},{"t":"key","title":"What good work includes","items":["Every requirement copied in, with its sub-points, under Functional and Non-Functional headings.","A one-sentence judgement straight after each requirement."]},{"t":"todo","title":"TASK 20(A) checklist","items":["Heading 'Evaluation' and 'User Requirement Evaluation'","Every requirement copied in with its number","First paragraph under each: fully met, partially met or not met","Judgements agree with my test table"]}],"diagram":{"kind":"layers","title":"TASK 20 explained","caption":"Click each step: the booklet's four steps for every user requirement.","items":[{"label":"Step 1: copy the requirement","detail":"Copy your user requirements to the Evaluation, each with its number."},{"label":"Step 2: first paragraph","detail":"Say whether the requirement is met, partially met or not implemented. TASK 20(A)."},{"label":"Step 3: second paragraph","detail":"Justify how it has been implemented, with examples from your tests and screenshots. TASK 20(B)."},{"label":"Step 4: third paragraph","detail":"Show how you would extend or add to this requirement: further developments. TASK 20(C)."}]},"check":[],"exam":[],"practice":[{"q":"Using the Ballyvaren test table in the Testing chapter, write the first paragraph for requirements 1, 2 and 4, and say which tests you used.","m":2,"a":"Requirement 1 (login): 'Requirement 1 has been fully met.' (Tests 1, 2, 3 all matched.) Requirement 2 (close after three attempts): 'Requirement 2 has been fully met.' (Test 4 matched.) Requirement 4 (edit an athlete): 'Requirement 4 has been fully met.' Test 10 failed at first, but Corrective Action 1 fixed it and the retest matched, so the requirement is met in the final system."}],"videos":[],"terms":[]},{"id":"c05-p02","spec":"TASK 20(B): Justify your answer with examples","lessons":[],"summary":"In a second paragraph under each requirement, justify the judgement: 2–3 examples if fully met, 1–2 if partially met, and exactly why if not met.","blocks":[{"t":"p","text":"Justify your answer with examples. For **fully met** give **2–3 examples**; for **partially met**, **1–2 examples**; for **not met**, explain **exactly why** it was not met. This is Step 3: a second paragraph under each requirement justifying *how* it has been implemented in your system."},{"t":"p","text":"Good examples point to evidence the moderator can check: a test number, a figure (screenshot), and what the user actually sees. The booklet's own example for a login requirement: the login screen appears as soon as the program runs, the user can only proceed into the system with correct credentials, so data is secure, and the user can also go to the register screen."},{"t":"example","title":"Worked example: fully met (Requirement 9, Ballyvaren)","steps":["'Points are awarded automatically by the PointsAwarded method of the EventResult class, and the points for a position are shown on the results screen as soon as it is typed.'","Example 1: '1st place in the 100m (Test Case 3) was awarded 10 points (Test 12, Figure 12).'","Example 2: '6th place is awarded 1 point after Corrective Action 2 (Test 13, Figure 13c), so both ends of the points table are correct.'","Example 3: 'With the full practice data the house totals were Lir 30, Macha 26, Fionn 18 and Boru 16, matching the totals worked out by hand (Test 19 retest).'"]},{"t":"example","title":"Worked example: partially met (Requirement 8, Ballyvaren)","steps":["'A position cannot be given twice in one event: giving 1st place in the 100m to a second athlete shows \"Position 1 has already been given in the 100m.\" (Test 15). An athlete cannot be entered twice in one event either (Test 16).'","'However, real races sometimes end in a dead heat, where two athletes share a place. The system cannot record this, so staff would have to choose one athlete for the place. The requirement is therefore only partially met.'"]},{"t":"example","title":"Worked example: not met (Requirement 17, Ballyvaren)","steps":["'When a classmate who had not seen the system recorded Test Case 3, it took 1 minute 40 seconds, which is longer than the 1-minute target. Most of the time was spent scrolling through the athlete list, which contains every athlete from Years 8 to 12 in one long drop-down list. The requirement has therefore not been met.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*This requirement has been implemented by…*","*For example, Test … shows that… (Figure …).*","*A further example is…*","*However, … which means the requirement is only partially met.*","*This requirement was not met because…*"],"ordered":false},{"t":"key","title":"What good work includes","items":["A justification paragraph that describes what the user actually sees and does, and refers to tests and figures.","Reasons given when a requirement was met in a different way from the design (e.g. a button placed on a different screen from the design)."]},{"t":"note","text":"**Typical length:** The whole requirement-by-requirement evaluation is often eight to ten pages. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 20(B) checklist","items":["Second paragraph under every requirement","2–3 examples for each fully met requirement","1–2 examples and what is missing for each partially met one","Exactly why for each not-met one","Test numbers and figure numbers referenced"]}],"diagram":null,"check":[],"exam":[],"practice":[{"q":"Write the justification paragraph for Ballyvaren requirement 3 (add an athlete with year group 8–12 and a house; a unique ID is given), which you have judged fully met.","m":3,"a":"'Requirement 3 has been implemented on the Athletes screen, where staff enter the first name, surname and year group and choose the house from a drop-down list, so it cannot be misspelt. For example, Test Case 2 (Aoife Kelly, Year 8, Lir) was saved and given the ID A001 automatically (Test 5, Figure 5). A further example is that the year group is range checked: Year 12 is accepted (Test 7) but Year 13 is rejected with the message \"The year group must be between 8 and 12.\" (Test 6). Finally, each new athlete receives the next unused ID, so no two athletes share an ID.'"}],"videos":[],"terms":[]},{"id":"c05-p03","spec":"TASK 20(C): How would you develop this requirement further?","lessons":[],"summary":"In a separate third paragraph under each requirement, say exactly how the system could be developed further to extend or improve that requirement, with specific examples.","blocks":[{"t":"p","text":"Now, in a **separate paragraph**, state exactly how you would develop the system further to develop this user requirement. This is Step 4: a third paragraph under each requirement showing how you would **extend** or **add** to it (further developments). Maybe further fields, with examples, to allow more use of the stored data (think what data a full school system such as SIMS stores). The booklet's example: for a login requirement, add Google or Facebook external logins, or two-factor authentication for added security."},{"t":"table","head":["Requirement (Ballyvaren)","Further development","Why it would help"],"rows":[["1 Login","Store passwords hashed rather than as plain text in logins.txt; add a 'change password' screen","Anyone who opens the file could currently read every password"],["3 Add athlete","Import whole classes from a CSV export of the school's records (name, form class, year, house) instead of typing each athlete","Hundreds of athletes could be added in seconds, with fewer typing errors"],["8 Duplicates","Allow a dead heat: let two athletes share a place and split the points (e.g. two 3rd places share 6 + 4 = 10, so 5 each)","Real races sometimes end in a tie"],["9 Points","Read the points table from a settings file","The Head of PE could change the scoring without editing the code"],["11 Leaderboard","Separate leaderboards for each year group and for boys' and girls' events","Matches how many sports days award trophies"],["17 Learnability","Filter the athlete list by the year group of the event, and allow typing an ID to jump to the athlete","Fixes the delay found when the requirement was tested"]],"caption":"Further developments, requirement by requirement"},{"t":"h","text":"Paragraph framework"},{"t":"list","items":["**What:** *To develop this requirement further, the system could…*","**How:** *This would involve… (new field, new screen, new file, new method).*","**Why:** *This would benefit [user] because…*"],"ordered":true},{"t":"warn","text":"Avoid vague answers such as 'make it better' or 'add more features'. Name the feature, the data it needs and the user who benefits."},{"t":"key","title":"What good work includes","items":["A separate extension paragraph under every requirement, naming a specific feature and why it would help.","Non-functional requirements get extensions too (e.g. a tighter time limit, two-step login)."]},{"t":"note","text":"**Typical length:** One short paragraph per requirement. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 20(C) checklist","items":["Separate third paragraph under every requirement","A specific further development for each","How it would be done (fields, screens, methods)","Why it would help the user"]}],"diagram":{"kind":"layers","title":"TASK 20 explained","caption":"Click each step: the booklet's four steps for every user requirement.","items":[{"label":"Step 1: copy the requirement","detail":"Copy your user requirements to the Evaluation, each with its number."},{"label":"Step 2: first paragraph","detail":"Say whether the requirement is met, partially met or not implemented. TASK 20(A)."},{"label":"Step 3: second paragraph","detail":"Justify how it has been implemented, with examples from your tests and screenshots. TASK 20(B)."},{"label":"Step 4: third paragraph","detail":"Show how you would extend or add to this requirement: further developments. TASK 20(C)."}]},"check":[],"exam":[],"practice":[{"q":"Write the further-development paragraph for Ballyvaren requirement 12 (the leaderboard shows the top five athletes by total points).","m":2,"a":"'To develop this requirement further, the leaderboard could show the top three athletes in each year group and print a certificate for each of them. This would involve filtering the athletes list by YearGroup before ranking them, and a new method that creates a certificate document with the athlete's name, year group, house and points. This would benefit the Head of PE, who currently has to write out certificates by hand after sports day, and it would recognise strong athletes in every year rather than only the oldest pupils, who tend to score the most points.'"}],"videos":[],"terms":[]},{"id":"c05-p04","spec":"TASK 21 (A): Design stage","lessons":[],"summary":"Reflect on the design stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"p","text":"TASK 21: make a subheading for each of the titles in Task 21 and, in full sentences, answer the questions under it. Aim for **two to three sentences per bullet point**. The design stage covers Tasks 6–15: introduction, requirements, data requirements, wireframes, feedback, final designs, control tables, processes and navigation."},{"t":"table","head":["Question","What to include"],"rows":[["What went well?","A design task that made building easier, e.g. control tables that matched the code"],["What didn't go well?","Something missed or changed later, e.g. a screen redesigned during building"],["How could this be improved?","What you would do differently in design next time"]],"caption":"Design stage: the questions"},{"t":"example","title":"Worked example: Design stage (Ballyvaren practice)","steps":["Went well: 'The control tables listed every control with its name and type, so the forms could be built quickly and the code used the same names as the designs. This meant there were very few spelling errors in control names during development.'","Didn't go well: 'The pseudocode for the results screen did not include the check that an athlete can only be entered once in each event, so this check was only added during development. The final design therefore had to be updated afterwards.'","Improve: 'Each rule in the scenario could be listed and ticked off against the pseudocode before the design was submitted, so that no validation rules are missed.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*During the design stage, … went well because…*","*One aspect that did not go well was…, which meant that…*","*This could be improved by…*"],"ordered":false},{"t":"tip","text":"Refer to real evidence in your write-up: a figure, a test number, a corrective action or a design change. A reflection that could be about anybody's project scores poorly."},{"t":"key","title":"What good work includes","items":["Three short paragraphs: went well, didn't go well, how to improve, each with a specific example from the design stage."]},{"t":"note","text":"**Typical length:** Around half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 21 (A) checklist","items":["Subheading 'Design stage'","What went well (2–3 sentences)","What didn't go well (2–3 sentences)","How it could be improved (2–3 sentences)"]}],"diagram":{"kind":"cycle","title":"Design stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write the 'what didn't go well' and 'how could this be improved' sentences for a design stage where the wireframes were rushed and User Feedback I found many problems.","m":2,"a":"Didn't go well: 'The wireframes were produced quickly and did not include Help buttons or back buttons, so User Feedback I identified problems with every screen. This meant that each screen had to be redrafted, which took longer than planned.' Improve: 'Next time, each wireframe could be checked against the non-functional requirements (such as a Help button on every screen) before it is reviewed, so that the feedback stage concentrates on genuine improvements rather than missing items.'"}],"videos":[],"terms":[]},{"id":"c05-p05","spec":"TASK 21 (B): Development stage","lessons":[],"summary":"Reflect on the development (build) stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"p","text":"TASK 21: make a subheading for each of the titles in Task 21 and, in full sentences, answer the questions under it. Aim for **two to three sentences per bullet point**. The development stage is Task 16: building the program in Visual Studio and recording errors."},{"t":"table","head":["Question","What to include"],"rows":[["What went well?","A feature or technique that worked well, e.g. classes that made saving simple"],["What didn't go well?","Errors, time problems or features that were harder than expected, with corrective-action numbers"],["How could this be improved?","What you would do differently in development next time"]],"caption":"Development stage: the questions"},{"t":"example","title":"Worked example: Development stage (Ballyvaren practice)","steps":["Went well: 'Writing Athlete and EventResult classes with ToCsv and FromCsv methods meant that saving and loading each list needed only a few lines of code. Because every form used the shared DataStore lists, a result recorded on one screen appeared immediately on the leaderboard.'","Didn't go well: 'Several logic errors were only found during testing: editing an athlete added a new one instead (Corrective Action 1), 6th place scored 0 points (Corrective Action 2) and the leaderboard was sorted the wrong way round (Corrective Action 3).'","Improve: 'Each method could be tested with boundary values, such as positions 1 and 6, as soon as it is written, rather than waiting for the testing stage. Using breakpoints to step through new methods would find logic errors earlier.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*During development, … worked well because…*","*The most difficult part was…, which caused…*","*This could be improved by…*"],"ordered":false},{"t":"tip","text":"Refer to real evidence in your write-up: a figure, a test number, a corrective action or a design change. A reflection that could be about anybody's project scores poorly."},{"t":"key","title":"What good work includes","items":["Specific features named (a screen, a method, a calculation) rather than 'the code worked'.","Honest about code that could be simpler or more efficient."]},{"t":"note","text":"**Typical length:** Around half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 21 (B) checklist","items":["Subheading 'Development stage'","What went well (2–3 sentences)","What didn't go well (2–3 sentences)","How it could be improved (2–3 sentences)"]}],"diagram":{"kind":"cycle","title":"Development stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write a 'what went well' answer for a development stage where the two name boxes were validated by one shared method.","m":2,"a":"'Both name boxes on the Athletes screen are checked by one CheckName method, which carries out the presence, length and comma checks and is called once for the first name and once for the surname. A separate ShowError method displays the message and moves the cursor to the box that needs to be corrected, so every error message on the screen behaves in the same way. This avoided repeating the same code twice and made it quick to add a new rule to both boxes at once.'"}],"videos":[],"terms":[]},{"id":"c05-p06","spec":"TASK 21 (C): Testing stage","lessons":[],"summary":"Reflect on the testing stage: what went well, what did not, and how it could be improved, in two to three sentences per question.","blocks":[{"t":"p","text":"TASK 21: make a subheading for each of the titles in Task 21 and, in full sentences, answer the questions under it. Aim for **two to three sentences per bullet point**. The testing stage is Tasks 17–19: test cases, the test table and corrective actions."},{"t":"table","head":["Question","What to include"],"rows":[["What went well?","Coverage, use of test cases, boundary tests that found real errors"],["What didn't go well?","Tests that were missed, hard to carry out, or not realistic"],["How could this be improved?","More or better tests next time, real users, timed tests"]],"caption":"Testing stage: the questions"},{"t":"example","title":"Worked example: Testing stage (Ballyvaren practice)","steps":["Went well: 'Using test cases meant each test only changed one value, so it was always clear which input caused a result. Testing extreme data such as 6th place found a real error in the points calculation (Corrective Action 2), and Test Case 4 allowed the house totals to be checked against totals worked out by hand.'","Didn't go well: 'The non-functional requirements were harder to test. Requirement 17 could only be tested with one classmate, rather than with PE staff on a real sports day.'","Improve: 'The system could be tested by several people who have not seen it before, timing each one, to give a fairer result for learnability. A test with two laptops recording different events at the same time would show how the results would be combined.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The testing was effective because…*","*Some aspects were difficult to test, such as…*","*Testing could be improved by…*"],"ordered":false},{"t":"tip","text":"Refer to real evidence in your write-up: a figure, a test number, a corrective action or a design change. A reflection that could be about anybody's project scores poorly."},{"t":"key","title":"What good work includes","items":["Says how the testing was done (black and white box; valid, invalid, null and extreme data) and what it found.","Names a kind of testing that was missing and how it would be added."]},{"t":"note","text":"**Typical length:** Around half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 21 (C) checklist","items":["Subheading 'Testing stage'","What went well (2–3 sentences)","What didn't go well (2–3 sentences)","How it could be improved (2–3 sentences)"]}],"diagram":{"kind":"cycle","title":"Testing stage: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write a 'how could this be improved' answer for a testing stage where only valid data was tested for most inputs.","m":2,"a":"'Most inputs were only tested with valid data, so it is not certain that the validation rejects every invalid entry. Next time each input would be tested with valid, invalid, null and extreme data, for example Years 8, 12 and 13, so that both ends of every range check are proven. A white-box test of positions 1 and 6 would also show that the first and last items of the points table are used correctly.'"}],"videos":[],"terms":[]},{"id":"c05-p07","spec":"TASK 21 (D): Further Developments","lessons":[],"summary":"Explain how the overall program could be developed further: what you would add and why.","blocks":[{"t":"p","text":"Under the subheading **Further Developments**, answer: how could the **overall program** be developed further? Explain **what** and **why**, two to three sentences per point. Task 20(C) covered developments requirement by requirement; here look at the system as a whole, for example new users, new screens, a different way of storing data or running on other devices."},{"t":"table","head":["Development","What","Why"],"rows":[["Shared database","Store athletes and results in a database on the school network instead of CSV files on one laptop","Staff at the track and at the field events could record results at the same time on different devices"],["Tablet version","A simple app for recording places at the finish line","Staff would not need to carry a laptop around the field"],["Live display","Show the leaderboard on a large screen or the school website, updating as results arrive","Pupils and parents could follow the competition during the day"],["Records","Store the best time or distance ever for each event and highlight new school records","Adds interest and saves the Head of PE looking up old records by hand"],["Accessibility","Larger-text option, keyboard shortcuts, high-contrast theme for use outdoors","Easier to read in bright sunlight and suits more staff"]],"caption":"Whole-system developments (Ballyvaren practice)"},{"t":"example","title":"Worked example: one development paragraph","steps":["What: 'The overall program could be developed further by storing athletes and results in a shared database instead of in CSV files on one laptop.'","How: 'Each laptop at the track and at the field events would read and write the same database, and the duplicate-position check would run against every result recorded so far, wherever it was entered.'","Why: 'This would allow several members of staff to record results at once, so the leaderboard would always be up to date, which the current version cannot do.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*The overall system could be developed further by…*","*This would involve…*","*This would benefit … because…*"],"ordered":false},{"t":"tip","text":"Link at least one development to a limitation you found in testing or in Task 23 (robustness). It shows that your evaluation joins up."},{"t":"key","title":"What good work includes","items":["Two or three larger developments for the whole system, each with what and why."]},{"t":"note","text":"**Typical length:** Half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 21 (D) checklist","items":["Subheading 'Further Developments'","At least two developments for the whole system","What each one is","Why each one would help","Two to three sentences per point"]}],"diagram":{"kind":"compare","title":"Now and next","caption":"Toggle between the current system and a developed one.","states":[{"label":"Current system","points":["One laptop","CSV files","Staff enter every result","House totals and top five","No school records"],"art":null},{"label":"Developed system","points":["Several devices sharing a database","Duplicate checks across every device","Live leaderboard on a big screen","Year-group leaderboards","School records highlighted"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write a further-developments paragraph (what, how, why) for adding school records to the Ballyvaren system.","m":2,"a":"'The overall system could be developed further by keeping a record of the best time or distance ever achieved in each event. This would involve a new Record class (event name, athlete name, year achieved, performance) saved in records.csv, and a check each time a result is saved: for a track event a smaller time beats the record, and for a field event a larger distance does. This would benefit the Head of PE, who could announce new school records on the day instead of checking old paper records afterwards, and it would encourage athletes to aim for them.'"}],"videos":[],"terms":[]},{"id":"c05-p08","spec":"TASK 21 (E): Personal Reflection","lessons":[],"summary":"Conclude with your overall thoughts on your performance across the project, and what went well, what didn't, and how it could be improved.","blocks":[{"t":"p","text":"Under the subheading **Personal Reflection**, conclude with your overall thoughts on your performance, then answer: what went well? What didn't go well? How could this be improved? Two to three sentences per bullet point."},{"t":"p","text":"Task 21 (E) looks back over the **whole project**: design, development and testing together. Task 24 then asks for a shorter, more personal paragraph about *how you worked* (help, what was easy, what was difficult). Keep the two different: here, judge the project; there, reflect on yourself."},{"t":"note","text":"The booklet says Task 24 is the only place you can write in the first person. Check with your teacher whether Task 21 (E) should also avoid I/We; if in doubt, keep it professional, e.g. 'Overall, the project…'."},{"t":"example","title":"Worked example (Ballyvaren practice, professional style)","steps":["Overall: 'Overall, the project produced a working sports day results system that fully meets 14 of its 17 requirements, with two partially met (8 and 15) and one not met (17).'","Went well: 'The planning in the design stage, particularly the control tables and pseudocode, meant that the build followed the designs closely. Testing with boundary data found and fixed three real errors.'","Didn't go well: 'Time management was a problem near the end, so the learnability requirement was only tested with one person and Help buttons were not added to the login and leaderboard screens.'","Improve: 'A plan for each stage, with time kept back for testing, would allow more thorough testing of the non-functional requirements.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*Overall, the project…*","*The strongest part of the project was…, because…*","*The weakest part was…, which meant…*","*In a future project, …*"],"ordered":false},{"t":"key","title":"What good work includes","items":["An overall judgement first, then what went well, what didn't and how to improve."]},{"t":"note","text":"**Typical length:** Half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 21 (E) checklist","items":["Subheading 'Personal Reflection'","Overall conclusion on performance","What went well (2–3 sentences)","What didn't go well (2–3 sentences)","How it could be improved (2–3 sentences)"]}],"diagram":{"kind":"cycle","title":"Personal reflection: three questions","caption":"Click each question: two or three sentences each.","items":[{"label":"Went well","detail":"Say what, with evidence, and why it went well."},{"label":"Didn't go well","detail":"Say what, with evidence, and the effect it had."},{"label":"Improve","detail":"Say exactly what you would do differently next time and why."}]},"check":[],"exam":[],"practice":[{"q":"Write an overall conclusion sentence and a 'how could this be improved' answer for a project where every functional requirement was met but the write-up was rushed.","m":2,"a":"Overall: 'Overall, the project produced a system that meets all twelve functional requirements, although the evaluation and testing evidence are less detailed than the design.' Improve: 'Screenshots should be collected and labelled during development and testing rather than at the end, so that the write-up can be completed alongside the program. Planning when each chapter will be finished would leave time to review the whole document before submission.'"}],"videos":[],"terms":[]},{"id":"c05-p09","spec":"TASK 22: Performance","lessons":[],"summary":"In short paragraphs, answer: is the system reliable and efficient, and does it take a long time to load or save files? Justify each answer.","blocks":[{"t":"p","text":"Under a heading **Performance**, answer each of these questions in a short paragraph. Is the system **reliable** and **efficient**? Does it take a long time to **load or save files**? **Justify why.**"},{"t":"table","head":["Question","Evidence to use","Ballyvaren example"],"rows":[["Is it reliable?","Tests that passed; how many times you ran it without a crash; corrective actions that removed errors","All 22 tests match after the three corrective actions; it ran through every test case without crashing"],["Is it efficient?","How data is stored and processed; reused methods; responsiveness","Athletes and results are held in lists in memory, so searching and working out the leaderboard for a few hundred results is instant; the points table is used by one reusable method"],["Load and save time?","Timed test results; size of the files","Test 22: saving took under 1 second; results.csv for a whole sports day is a few kilobytes"],["Justify why","Explain the reason behind each answer","The whole file is rewritten on every save: fast for one school's sports day, but slower with tens of thousands of results"]],"caption":"Answering the performance questions"},{"t":"example","title":"Worked example: one paragraph (Ballyvaren practice)","steps":["'The system is efficient when loading and saving. Saving a result took less than one second in Test 22 and loading at start-up was not noticeable, because athletes.csv and results.csv are small text files of a few kilobytes. This is because each athlete and each result is stored as one short line of text and the lists are kept in memory while the program runs.'","'However, the whole results file is rewritten every time a result is saved, and the leaderboard recalculates every house total from every result each time it opens. For one sports day this is not a problem, but with several years of results a database would be more efficient.'"]},{"t":"tip","text":"Time it. Use a stopwatch (or your phone) to time loading and saving, and quote the result. 'Fast' is an opinion; 'under 1 second in Test 22' is evidence."},{"t":"key","title":"What good work includes","items":["Separate short paragraphs for reliability, efficiency and load/save time, each backed by test evidence."]},{"t":"note","text":"**Typical length:** Half a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 22 checklist","items":["Heading 'Performance'","Paragraph: is it reliable? (justified)","Paragraph: is it efficient? (justified)","Paragraph: load and save time (timed evidence)"]}],"diagram":{"kind":"compare","title":"Reliable vs efficient","caption":"Toggle between the two ideas.","states":[{"label":"Reliable","points":["Does the same correct thing every time","Doesn't crash","Evidence: test table, corrective actions, repeated runs"],"art":null},{"label":"Efficient","points":["Does the job quickly without wasting time or memory","Evidence: timed load/save, small files, reusable methods","Limit: how it would cope with much more data"],"art":null}]},"check":[],"exam":[],"practice":[{"q":"Write the 'Is the system reliable?' paragraph for the Ballyvaren practice system.","m":2,"a":"'The system is reliable. All 22 tests in the test table matched the expected outcomes after three corrective actions, and the program did not crash during testing, even when text such as \"nine\" was entered as a year group or \"fast\" as a time, because int.TryParse and decimal.TryParse are used instead of int.Parse. File operations are inside try…catch blocks, so a missing logins file or a damaged results file produces a clear message rather than a crash. Its reliability has only been shown on one laptop, however, and it has not been used on a real sports day.'"}],"videos":[],"terms":[]},{"id":"c05-p10","spec":"TASK 23: Robustness","lessons":[],"summary":"In short paragraphs, answer: can someone break the system, where, how would you prevent it, why wasn't it fully robust, does it crash, how do you know, and what limits your testing?","blocks":[{"t":"p","text":"Under a heading **Robustness**, answer each question in a short paragraph. Can someone break the system? Where can this occur? How would you ensure this doesn't happen? Why didn't you make it fully robust (talk about limitations and constraints)? Does the system crash? Justify how you know. What limitations are there to seeing this (maybe it was not tested in a real-life scenario)?"},{"t":"table","head":["Question","Ballyvaren example answer (practice)"],"rows":[["Can someone break it? Where?","Yes: if results.csv is edited by hand and a line is damaged, the program will not start; if two laptops record results separately, their files have to be combined by hand and the duplicate checks do not cover both."],["How would you prevent it?","Keep the files in a folder staff cannot edit; skip and report damaged lines instead of stopping; move to a shared database."],["Why not fully robust?","Time constraints and the scope of a GCSE project: a single-user, single-laptop system was built first."],["Does it crash? How do you know?","No crashes in any of the tests, including invalid, null and extreme data (Tests 2–4, 6–9, 13–18); every file operation is inside try…catch."],["Limitations to seeing this","Testing was done by the developer and one classmate, on one laptop, with 8 athletes and 16 results, not by PE staff on a busy sports day with hundreds of results."]],"caption":"Robustness questions"},{"t":"h","text":"Where systems usually break"},{"t":"list","items":["Inputs with no validation: a number box with text, a blank box, a very long entry, a comma in a CSV file.","Files: missing, open in another program, damaged, or in a folder without permission.","Lists: an empty list, or nothing selected when a button needs a selected item.","Navigation: closing a form in an unexpected order, or opening the same form twice."],"ordered":false},{"t":"tip","text":"Try to break your own program before you write this section. Type silly data into every box, click buttons in the wrong order, rename the data file. Record what happened: it is honest evidence."},{"t":"key","title":"What good work includes","items":["Answers each booklet question in its own short paragraph, including where the system could be broken and why it was not made fully robust."]},{"t":"note","text":"**Typical length:** Half a page to a page. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 23 checklist","items":["Heading 'Robustness'","Can it be broken, and where","How to prevent it","Why it is not fully robust (limitations/constraints)","Does it crash, and how I know","Limits of my testing"]}],"diagram":{"kind":"hotspot","title":"Weak points to check","caption":"Click each part of the system to see how it could break and how it is protected.","rows":[[{"label":"Inputs","detail":"Protected by validation: TryParse, range, presence and duplicate checks.","span":2},{"label":"Files","detail":"Protected by try…catch; still breaks if edited by hand.","span":2}],[{"label":"Lists","detail":"Empty list or no selection: check Count and the selected item before using them.","span":2},{"label":"Several laptops","detail":"Not protected: results recorded on two laptops are in two separate files.","span":2}]],"links":[]},"check":[],"exam":[],"practice":[{"q":"Write the 'Does the system crash? Justify how you know' paragraph for the Ballyvaren practice system, and the paragraph on the limitations of that evidence.","m":3,"a":"'The system did not crash at any point during testing. Every input on the Athletes and Results screens was tested with valid, invalid, null and extreme data (Tests 6–9 and 13–18): for example, typing \"nine\" into the year group box shows a message instead of crashing because int.TryParse is used. File errors are handled by try…catch blocks, which was confirmed by deleting logins.txt, which produced the message \"The logins file is missing\".'\n\n'However, these tests were carried out by the developer and one classmate on a single laptop with 8 athletes and 16 results. The system has not been used on a real sports day, so problems that only appear with hundreds of results, several members of staff or unexpected user behaviour may not have been found.'"}],"videos":[],"terms":[]},{"id":"c05-p11","spec":"TASK 24: Personal Evaluation / Reflection","lessons":[],"summary":"Write a short first-person paragraph on your personal performance: how much help you needed, what you found easy and why, what was difficult and how you overcame it.","blocks":[{"t":"p","text":"Under a heading **Personal Evaluation/Reflection**, give a short paragraph on your personal performance when completing the controlled assessment. This is the **only time you can write in the first person** (for example, *I found…*)."},{"t":"table","head":["Booklet question","What to write about"],"rows":[["Did you need a lot of help?","How independently you worked, honestly"],["What did you find easy? Why?","A task or skill that went smoothly and the reason (e.g. practice in Unit 4)"],["What was difficult and how did you overcome it?","A real difficulty and the steps *you* took: researching an error message online, revising theory notes, using the debugger"],["If notes, what topic(s) helped?","Name the topic, e.g. Unit 4 notes on validation, arrays, file handling or searching and sorting"]],"caption":"The Task 24 questions"},{"t":"p","text":"The booklet advises you not to answer this with 'I needed a lot of guidance' or 'I asked the teacher'. Focus on what **you** did to solve problems, such as researching on Google or checking your theory notes. Keep it truthful: the reflection must describe what really happened."},{"t":"example","title":"Worked example (fictional pupil, Ballyvaren practice)","steps":["'I found the design stage straightforward because I had practised writing requirements and control tables in class, so I knew what level of detail was needed.'","'The most difficult part was the leaderboard, which listed the houses in the wrong order. I set a breakpoint in the sort and stepped through it, which showed that my comparison was the wrong way round.'","'I also revised my Unit 4 notes on arrays, which helped me understand why the points for 1st place are stored at index 0.'","'If I did the project again, I would test each method as soon as I wrote it, because several logic errors only appeared during the testing stage.'"]},{"t":"h","text":"Sentence starters"},{"t":"list","items":["*I found … easy because…*","*The most difficult part for me was…*","*To overcome this, I researched… / revised my notes on…*","*The topic that helped most was…*","*If I did this project again, I would…*"],"ordered":false},{"t":"key","title":"What good work includes","items":["A short, honest first-person paragraph about how the work went and what helped."]},{"t":"note","text":"**Typical length:** One paragraph. These are patterns from complete write-ups, not targets or rules: your scenario decides what is needed."},{"t":"todo","title":"TASK 24 checklist","items":["Heading 'Personal Evaluation/Reflection'","Written in the first person","How independently I worked","What I found easy and why","What was difficult and how I overcame it","Topics or research that helped"]}],"diagram":{"kind":"flow","direction":"lr","title":"Shape of the reflection","caption":"Step through a short, complete reflection.","nodes":[{"id":"a","label":"How I worked","detail":"How much help, how independently.","shape":"start"},{"id":"b","label":"What was easy","detail":"…and why.","shape":"process"},{"id":"c","label":"What was hard","detail":"A real difficulty.","shape":"process"},{"id":"d","label":"How I overcame it","detail":"Research, notes (which topic), debugging.","shape":"process"},{"id":"e","label":"Next time","detail":"One thing I would do differently.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[],"exam":[],"practice":[{"q":"Rewrite this weak reflection so it answers the booklet's questions: 'It was hard. I got a lot of help. It went OK in the end.'","m":2,"a":"'I worked on most of the project independently, although some parts took longer than I planned. I found building the forms easy because the control tables told me exactly which controls to add and what to name them. The most difficult part was the house totals, which were wrong at first. I overcame this by using breakpoints to watch the totals change as each result was added, which showed that one house name had been typed in lower case, and I fixed it by choosing houses from a drop-down list. Revising my Unit 4 notes on loops and selection also helped me trace the code. Next time I would test each calculation as soon as I wrote it.'"}],"videos":[],"terms":[]}]},{"id":"c06","n":6,"title":"Before you submit","intro":"Extra help that is not a booklet task: frequently asked questions and the full checklist from the guidance booklet, with final checks before you upload your Word and PDF copies.","pages":[{"id":"c06-p01","spec":"Questions pupils ask (not a booklet task)","lessons":[],"summary":"Answers to common questions about the controlled assessment, taken from the guidance booklet, plus the questions only your teacher can answer.","blocks":[{"t":"p","text":"These answers come from the student guidance booklet. Where a question depends on CCEA's rules or your school's arrangements, the answer is: **ask your teacher**. Rules can change from year to year, and your teacher has the current CCEA instructions."},{"t":"table","head":["Question","Answer (from the booklet)"],"rows":[["Can I put my name on my work?","No. Use your candidate number and the centre number only: front page, header, folder and file names."],["Does a logo on the front page get marks?","No. You can add an image or logo, but it does not give extra marks."],["Can I write 'I' or 'we'?","Only in the personal reflection (Task 24). Everywhere else write professionally: 'The system will…'."],["How many inputs should Task 10 list?","Roughly 50 across all screens, including buttons, because a click is an input."],["Do wireframes and final designs go in the Write Up?","Make them in separate documents (Initial Designs and Final Designs folders), then collate them into one document at Task 15."],["Flowcharts or pseudocode?","Either, with at least one process per screen. Flowcharts suit simple screens; pseudocode is quicker for long processes."],["How many corrective actions do I need?","3–5 documented from your testing (Task 19B), each with screenshots of the failure and the fix."],["What if my program ends up different from my designs?","Go back to User Feedback II (Task 15) and explain the changes and that the client agreed."],["What format do I submit?","Both Microsoft Word and PDF, uploaded to Google Classroom."],["Which programming language?","C#, using Microsoft Visual Studio (Windows Forms)."]],"caption":"Frequently asked questions"},{"t":"h","text":"Ask your teacher about"},{"t":"list","items":["How long you have for each stage. Finish each one by the deadline your teacher gives you.","Which resources (notes, this book, the internet) you may use during the controlled assessment sessions, and how to acknowledge any source you use.","Where your Visual Studio project should be saved.","Whether you may take work home or must work only in supervised lessons.","Anything in this year's scenario you do not understand. Your teacher can explain what a task requires but cannot tell you how to answer it or correct your work."],"ordered":false},{"t":"warn","text":"Do not share your files, code or write-up with other pupils, and do not post the scenario or your work online. Work that is not your own can be treated as malpractice."},{"t":"todo","title":"FAQ checklist","items":["I have read the FAQs","I have asked my teacher how long each stage should take and what resources are allowed","I know how to acknowledge any source I use"]}],"diagram":{"kind":"match","title":"Quick quiz on the rules","caption":"Match each question to the booklet's answer.","pairs":[["Name on the front page?","Never: candidate and centre number only"],["First person allowed?","Only in Task 24"],["Corrective actions in testing?","3–5"],["Submission formats?","Word and PDF"],["Inputs in Task 10?","Roughly 50, including buttons"]]},"check":[],"exam":[],"practice":[{"q":"A friend's front page has their name and a logo, their requirements say 'I will make…', and they have one corrective action. Using the FAQs, list what they should fix.","m":2,"a":"1 Remove the name and use the candidate number and the centre number (the logo can stay but earns no marks). 2 Rewrite the requirements professionally: 'The system will…', with no I/We (first person only in Task 24). 3 Document 3–5 corrective actions from testing, each with screenshots of the failure and the fix, and label the failed rows in the test table."}],"videos":[],"terms":[]},{"id":"c06-p02","spec":"Before you submit (not a booklet task)","lessons":[],"summary":"The booklet's full task checklist, plus final checks on the document, the evidence and the program before you upload the Word and PDF copies.","blocks":[{"t":"p","text":"This is the booklet's checklist (page 24) for the whole controlled assessment. Tick each task only when it is complete in **your** Write Up, for **this year's CCEA scenario**, not the Ballyvaren practice."},{"t":"todo","title":"Controlled assessment checklist (booklet page 24)","items":["TASK 1: Created a Word document within the CA folder","TASK 2: Created a title page","TASK 3: Added a header and footer","TASK 4: Inserted a table of contents","TASK 5: Design chapter subtitle page","TASK 6: Wrote the introduction","TASK 7: Functional requirements in a numbered list","TASK 8: Non-functional requirements in a numbered list","TASK 9: Wrote about the target audience","TASK 10: Listed and described all data requirements","TASK 11: Wireframe diagrams / initial designs","TASK 12: User Feedback I","TASK 13A: Final designs","TASK 13B: Control tables","TASK 13C: Flowcharts / pseudocode","TASK 14: Navigational structure","TASK 15: Submission onto Google Classroom","TASK 16: Built the project in Visual Studio and recorded errors","TASK 17: Testing subtitle page","TASK 18A: User requirements copied from the design chapter","TASK 18B: Test cases","TASK 19: Test table completed, with corrective actions","TASK 20 Part A: Functional and non-functional requirements evaluated","TASK 20 Part B: Justified with examples","TASK 20 Part C: Further developments explained","TASK 21 Part A: Design stage","TASK 21 Part B: Development stage","TASK 21 Part C: Testing","TASK 21 Part D: Further developments","TASK 21 Part E: Personal reflection","TASK 22: Performance paragraph","TASK 23: Robustness paragraph","TASK 24: Personal reflection / personal performance paragraph","SUBMITTED"]},{"t":"h","text":"Final checks on the document"},{"t":"table","head":["Check","How"],"rows":[["No name anywhere","Front page, header, file names, screenshots, File › Info › Properties"],["Contents up to date","References › Update Table › Update entire table"],["Headings consistent","Heading 1 for chapters, Heading 2 for sections; nothing formatted by hand"],["Requirement numbers match","Same numbers in Design, Testing and Evaluation"],["Every figure referenced","Each screenshot has a figure number that the test table or text refers to"],["Professional style","Search (Ctrl + F) for ' I ' and ' we ': only Task 24 should have them"],["PDF checked","Open the PDF and scroll through every page; shapes and pictures sometimes move"]],"caption":"Document checks"},{"t":"h","text":"Final checks on the program"},{"t":"list","items":["It runs from a fresh start (close Visual Studio, reopen the solution, press F5).","Every screen in the navigation structure opens and has a way back.","Data files are where the program expects them.","Your teacher knows where the Visual Studio project is saved."],"ordered":false},{"t":"warn","text":"Leave time. Collating, updating the contents, exporting to PDF and checking it always takes longer than expected. Finish well before the deadline your teacher gives you."},{"t":"key","title":"Submit","items":["Save the final Write Up as Word (.docx) and as PDF.","Upload both to the Google Classroom assignment and click Turn in.","Tick SUBMITTED."]}],"diagram":{"kind":"timeline","title":"The whole assessment","caption":"Click each stage to check you have everything.","items":[{"label":"Set up","detail":"Tasks 1–5: folder, Write Up, front page, header/footer, contents, Design subtitle page."},{"label":"Design","detail":"Tasks 6–15: introduction, requirements, audience, data, wireframes, feedback, final designs, control tables, processes, navigation, approval, submission."},{"label":"Build","detail":"Task 16: working C# program and Corrective Actions document."},{"label":"Test","detail":"Tasks 17–19: subtitle page, requirements, test cases, test table, corrective actions."},{"label":"Evaluate","detail":"Tasks 20–24: requirements, stages, further developments, performance, robustness, personal reflection."},{"label":"Submit","detail":"Word and PDF on Google Classroom."}]},"check":[],"exam":[],"practice":[{"q":"You have one lesson left and your evaluation is half finished. Put these jobs in a sensible order and explain why: finish Task 21, update contents, export PDF, check PDF, finish Task 20, write Task 24, upload.","m":2,"a":"1 Finish Task 20 (evaluating every requirement carries the most evidence). 2 Finish Task 21. 3 Write Task 24 (short). 4 Update the table of contents. 5 Save as Word and export to PDF. 6 Check the PDF page by page. 7 Upload both and turn in. The contents are updated only once the text is complete, so the page numbers are right, and the PDF is checked before uploading because exporting can move pictures."}],"videos":[],"terms":[]}]}],"glossary":[]};

DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));

      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }

  }

    const nx = -uy, ny = ux;

  };

    const act = () => onPick(t.name);
    g.addEventListener('click', act);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  });

}
function wireProjects(root, p) {

/* ---------- "Your turn: build it": practice items as task cards with a worked-solution reveal ---------- */
const TT_CODE = new Map();
function ttLang(code, fence) {

  if (m) return m;

  if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER)\b/i.test(code)) return 'sql';
  if (/\b(private|public|static)\s+(void|int|string|bool|double)\b|\busing System\b|MessageBox\.Show|Console\.|\b(int|string|double|bool)\s+\w+\s*[=;]|\bnew\s+\w+\(/.test(code)) return 'cs';

function solutionHTML(a, qi) {
  const out = [], re = /```([\w#+-]*)[ \t]*\n?([\s\S]*?)```/g; let at = 0, m, k = 0;
  const text = s => String(s).split(/\n+/).map(x => x.trim()).filter(Boolean).map(x => `<p>${inline(x)}</p>`).join('');
  while ((m = re.exec(String(a || '')))) {
    out.push(text(String(a).slice(at, m.index)));
    const code = m[2].replace(/\s+$/, ''), lang = ttLang(code, m[1]), id = `${qi}-${k++}`;
    TT_CODE.set(id, code);
    out.push(blockHTML({ t: 'code', lang, code, title: lang === 'vba' ? 'VBA' : '' }, 'x').replace('data-code="x"', `data-ttcode="${id}"`));
    at = re.lastIndex;

}

}
