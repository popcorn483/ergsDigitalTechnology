ngth` (the last pass reads `cars[7]`, which does not exist, and the program crashes); not using a loop when the question asks for one; using a different array name from the question; and putting the final outputs inside the loop."},{"t":"key","title":"Key points","items":["Array: many values, one data type, one identifier; elements accessed by index from 0.","Last index = Length − 1.","Loop patterns: initialise all, total, count, average, maximum/minimum."]}],"diagram":{"kind":"table-reveal","title":"Trace table: finding the tallest","caption":"Dry run the 'best so far' code for heights = {151, 163, 148, 170, 159}. Click the hidden cells to check.","head":["i","heights[i]","heights[i] > tallest?","tallest","Output"],"rows":[["–","–","–","151",""],["1","163","True","163",""],["2","148","False","163",""],["3","170","True","170",""],["4","159","False","170",""],["5","–","loop ends (5 < 5 is False)","170","Tallest: 170"]],"hidden":[[1,2],[1,3],[2,2],[2,3],[3,2],[3,3],[4,2],[4,3],[5,4]]},"check":[{"q":"string[] towns = { \"Newry\", \"Larne\", \"Strabane\" }; What is towns[1]?","o":["Strabane","An error","Newry","Larne"],"a":3,"why":"Arrays are zero-indexed, so index 1 is the second element."},{"q":"An array has 30 elements. What is the index of the last one?","o":["29","0","30","31"],"a":0,"why":"Indexes run from 0 to Length − 1."},{"q":"Which loop visits every element of a 10-element array called scores?","o":["for (int i = 1; i <= 9; i++)","for (int i = 0; i < 10; i++)","for (int i = 1; i < 10; i++)","for (int i = 0; i <= 10; i++)"],"a":1,"why":"Indexes 0–9; starting at 1 skips the first, and <= 10 goes out of range."},{"q":"Which statement about arrays is true?","o":["The first element has index 1","The index of an element holds its value","All elements normally share one data type","Once filled, the elements cannot be changed"],"a":2,"why":"Arrays store values of one data type; elements can be updated, and indexing starts at 0."}],"exam":[{"year":2022,"paper":"Unit 4","q":"7","marks":18,"summary":"Array indexing, an algorithm for weekly totals and an average, and user-defined functions","tip":"Use the array name given and a loop over every index; the average is calculated after the loop.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"9","marks":18,"summary":"Updating an array element, resetting every element to zero with a loop and finding the maximum","tip":"Resetting needs a loop over every index, not one statement; the maximum starts from the first element.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"7","marks":35,"summary":"Arrays in pseudocode with FOR and WHILE totals and a minimum, plus sorting and searching","tip":"With a WHILE loop, initialise the index, test it against the array length and increase it inside the loop.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"8","marks":20,"summary":"Properties of arrays, initialising them, counting matching elements and totals with a WHILE loop","tip":"Know that contents can change and that indexes start at 0; keep outputs after the loop.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"An array rainfall holds 7 daily readings (mm) for Belleek. Write pseudocode to output the total rainfall and the number of days with more than 10 mm.","m":5,"a":"total ← 0 and wetDays ← 0 before the loop (1) / FOR i ← 0 TO 6 (1) / total ← total + rainfall[i] (1) / IF rainfall[i] > 10 THEN wetDays ← wetDays + 1 (1) / OUTPUT total and wetDays after the loop (1)."},{"q":"Write a C# statement that changes the fifth element of the array heights to 162.","m":1,"a":"heights[4] = 162; (1) – the fifth element has index 4."}],"videos":[{"title":"One-dimensional arrays – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D17-video"},{"title":"Programming constructs (CCEA) – arrays","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/6"}],"terms":["Array","Element","Index"]},{"id":"c04-p07","spec":"String manipulation functions, including splitting, concatenating, character searching and substring searching","lessons":["D18"],"summary":"Strings are sequences of characters indexed from 0; C# lets you join them, find their length, extract substrings, search for characters or substrings and split them at a separator.","blocks":[{"t":"p","text":"A [[string]] is a sequence of characters written inside double quotation marks, such as `\"BT74 6AA\"`. Each character has an index, starting at 0, just like an array. C# provides built-in [[string functions|String function]] (methods) to work with text."},{"t":"table","head":["Operation","C#","Example with town = \"Enniskillen\"","Result"],"rows":[["Length","`town.Length`","`town.Length`","11"],["One character","`town[i]`","`town[0]`  /  `town[town.Length - 1]`","E  /  n"],["[[Concatenation]] (join)","`+`","`\"Visit \" + town`","Visit Enniskillen"],["[[Substring]]","`Substring(start, length)`","`town.Substring(0, 5)`","Ennis"],["Substring to the end","`Substring(start)`","`town.Substring(5)`","killen"],["Character search","`IndexOf('k')`","`town.IndexOf('k')`","5 (−1 if absent)"],["Substring search","`Contains(\"kill\")`","`town.Contains(\"kill\")`","True"],["Change case","`ToUpper()` / `ToLower()`","`town.ToUpper()`","ENNISKILLEN"]]},{"t":"h","text":"Splitting"},{"t":"p","text":"`Split(',')` breaks a string into an **array** of strings wherever the separator appears. This is how a line from a comma-separated (CSV) file is turned into separate fields."},{"t":"code","lang":"cs","title":"Split, concatenate and search","code":"string line = \"Murphy,11B,87\";\nstring[] parts = line.Split(',');\nConsole.WriteLine(parts[0]);           // Murphy\nConsole.WriteLine(parts[2]);           // 87\n\nstring first = \"Aoife\";\nstring surname = \"Taylor\";\nint year = 22;\nstring username = first[0] + surname + year;\nConsole.WriteLine(username);           // ATaylor22\n\nstring email = \"j.smith@school.ni\";\nConsole.WriteLine(email.IndexOf(\"@\")); // 7"},{"t":"note","text":"Joining a `char` to a string gives a string, but adding two `char` values gives a number (their character codes added together). `first[0] + surname` is safe because `surname` is a string. Use `first.Substring(0, 1)` if you want to be certain."},{"t":"h","text":"Strings in validation"},{"t":"list","items":["Length check: `password.Length >= 8`.","Presence check: `name != \"\"` (or `name.Length > 0`).","Format check: `email.Contains(\"@\")`, or test a particular character such as `code[0] == 'B'`.","Case-insensitive input: `answer = Console.ReadLine().ToUpper();` so 'y' and 'Y' both work."],"ordered":false},{"t":"key","title":"Key points","items":["Index from 0; last character is at `Length - 1`.","`Substring(start, length)` – the second number is how many characters, not an end position.","`IndexOf` returns a position or −1; `Contains` returns true/false; `Split` returns an array."]},{"t":"tip","text":"When a question asks you to 'name a string function and describe its use', give the name, what it returns and an example from the scenario, e.g. 'Length returns the number of characters in the password, so it can check there are at least 8'."}],"diagram":{"kind":"table-reveal","title":"What does each expression return?","caption":"postcode = \"BT74 6AA\" (8 characters, including the space). Work out each result, then click to check.","head":["Expression","Result"],"rows":[["postcode.Length","8"],["postcode[1]","T"],["postcode.Substring(0, 4)","BT74"],["postcode.Substring(5)","6AA"],["postcode.IndexOf(' ')","4"],["postcode.IndexOf('Z')","-1"],["postcode.Contains(\"74\")","True"],["postcode.ToLower()","bt74 6aa"],["\"Ballymena,Antrim\".Split(',')[1]","Antrim"]],"hidden":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},"check":[{"q":"What is \"Antrim\".Substring(2, 2)?","o":["tri","ntr","nt","tr"],"a":3,"why":"Start at index 2 ('t') and take 2 characters."},{"q":"What does \"Derry\".Length return?","o":["5","0","4","6"],"a":0,"why":"D-e-r-r-y is five characters."},{"q":"\"a,b,c\".Split(',') returns…","o":["the number 3","an array of three strings: \"a\", \"b\", \"c\"","an array with one string \"a,b,c\"","the string \"abc\""],"a":1,"why":"Split breaks the string at each comma into an array."},{"q":"Joining two strings together is called…","o":["indexing","iteration","concatenation","splitting"],"a":2,"why":"Concatenation joins strings, using + in C#."}],"exam":[{"year":2022,"paper":"Unit 4","q":"4","marks":17,"summary":"A tiered pricing algorithm, a validation loop and string functions for joining two messages and counting characters","tip":"Joining is concatenation (+); counting characters uses Length – name the function and show how it is used.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"5","marks":8,"summary":"Length, presence and format checks for a password, and two string functions that would help","tip":"Name real functions (e.g. Length, Contains/IndexOf) and say exactly what each checks in the password.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"A school creates usernames from the first letter of a pupil's first name, their surname and their year of entry, e.g. Niamh Kelly, 2026 → NKelly2026. Write C# statements to create and output the username from variables firstName, surname and year.","m":3,"a":"Takes the first character, e.g. firstName.Substring(0, 1) or firstName[0] (1) / concatenates it with surname and year using + (1) / stores in username and outputs it with Console.WriteLine(username) (1)."},{"q":"Explain how Split could be used to process the line \"Lisburn,Cat,4\" from a file of pet records.","m":2,"a":"line.Split(',') breaks the line at each comma (1) into an array of fields, so parts[0] = \"Lisburn\", parts[1] = \"Cat\", parts[2] = \"4\", which can be used separately (1)."}],"videos":[{"title":"String manipulation – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D18-video"},{"title":"Programming constructs (CCEA) – revision guide","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/1"},{"title":"The use of basic string manipulation (GCSE, language-neutral)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=2315"}],"terms":["String","String function","Concatenation","Substring"]},{"id":"c04-p08","spec":"Building reusable code that utilises user-defined functions or methods","lessons":["D19"],"summary":"A subroutine is a named, reusable block of code; a function returns a value and a procedure does not; parameters pass data in, making code shorter, easier to test and easier to maintain.","blocks":[{"t":"p","text":"A [[subroutine]] is a named, self-contained block of code that carries out one task. It is written (defined) once and can be **called** by name as many times as needed. In C# subroutines are called **methods**. Two types matter:"},{"t":"compare","head":["Function","Procedure"],"rows":[["Returns a value?","Yes – one value, sent back with `return`","No"],["C# return type","`int`, `double`, `string`, `bool`…","`void`"],["Called like","`double t = AddVat(40, 0.2);`","`ShowMenu();`"]]},{"t":"p","text":"[[Parameters|Parameter]] are the variables, listed with their data types in the definition, that receive data passed into the subroutine. The actual values passed when it is called are **arguments**. Variables declared inside a subroutine are **local**: they exist only while it runs and cannot be seen elsewhere."},{"t":"code","lang":"cs","title":"A function and a procedure (C# 10 top-level program)","code":"static double AddVat(double price, double rate)\n{\n    double total = price + price * rate;\n    return total;\n}\n\nstatic void ShowMenu()\n{\n    Console.WriteLine(\"1. Book a lesson\");\n    Console.WriteLine(\"2. Cancel a lesson\");\n    Console.WriteLine(\"3. Quit\");\n}\n\nShowMenu();\ndouble bill = AddVat(40, 0.2);\nConsole.WriteLine(\"Bill: £\" + bill);","output":"1. Book a lesson\n2. Cancel a lesson\n3. Quit\nBill: £48"},{"t":"note","text":"In a C# 10 top-level program these are local functions, so they can be declared after the code that calls them. Inside a class with a `Main` method they are written as `static` methods of the class instead; the syntax of the method itself is the same."},{"t":"h","text":"Why use user-defined functions?"},{"t":"list","items":["**Reuse**: written once, called many times – shorter programs with no repeated code; can be reused in other programs.","**Testing**: each function can be tested on its own ([[unit testing]]) before it is combined with others.","**Maintenance**: a fix or change is made in one place and every call benefits.","**Readability**: a good name (`CalculateDiscount`) explains what the code does.","**Teamwork**: a problem is [[decomposed|Decomposition]] into functions that different programmers can write at the same time."],"ordered":false},{"t":"p","text":"These are different from [[built-in functions|Built-in function]] provided by the language, such as `Console.WriteLine`, `Convert.ToInt32`, `Math.Round(x, 2)`, `Math.Sqrt` and `Math.Pow`, which you call but do not write."},{"t":"key","title":"Key points","items":["Subroutine = named block of code for one task; in C# a method.","Function returns a value (`return`); procedure does not (`void`).","Parameters receive values passed in; local variables exist only inside the subroutine.","Benefits: reuse, independent testing, one-place maintenance, readability, teamwork."]},{"t":"tip","text":"For 'two advantages' questions give two **different** benefits, each with a reason – 'easier to test because each function can be tested separately' is better than 'easier'."}],"diagram":{"kind":"flow","title":"What happens when a function is called","direction":"tb","caption":"Step through the call double bill = AddVat(40, 0.2);","nodes":[{"id":"a","label":"Main code reaches AddVat(40, 0.2)","detail":"The arguments 40 and 0.2 are worked out.","shape":"start"},{"id":"b","label":"Parameters receive the arguments","detail":"price = 40, rate = 0.2. These are local to AddVat.","shape":"process"},{"id":"c","label":"Function body runs","detail":"total = 40 + 40 × 0.2 = 48 (a local variable).","shape":"process"},{"id":"d","label":"return total","detail":"48 is sent back to where the function was called; local variables are discarded.","shape":"io"},{"id":"e","label":"bill = 48","detail":"The returned value is assigned in the main code, which carries on from the next line.","shape":"end"}],"edges":[["a","b"],["b","c"],["c","d"],["d","e"]]},"check":[{"q":"A subroutine that carries out a task and sends back one value is a…","o":["parameter","constant","procedure","function"],"a":3,"why":"Functions return a value; procedures do not."},{"q":"In static int Total(int a, int b), what are a and b?","o":["Parameters","Indexes","Return values","Constants"],"a":0,"why":"They are listed in the definition to receive the values passed in."},{"q":"Which C# keyword marks a subroutine that returns nothing?","o":["static","void","return","null"],"a":1,"why":"A void method is a procedure."},{"q":"Which is a benefit of user-defined functions?","o":["The code always runs faster","No testing is needed","Each part can be tested separately","Programs no longer need variables"],"a":2,"why":"Independent (unit) testing is a key benefit."}],"exam":[{"year":2022,"paper":"Unit 4","q":"7","marks":18,"summary":"Array work followed by defining a function and explaining the benefits of functions","tip":"A definition needs 'named block of code' plus 'returns a value'; each benefit needs a reason.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"4","marks":23,"summary":"Decomposition, abstraction, flowcharts, errors, two advantages of user-defined functions and a menu validation loop","tip":"Two distinct advantages, e.g. reuse without rewriting and testing each function separately.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"Write a C# function called Area that takes the width and height of a rectangle as parameters and returns its area.","m":3,"a":"static double Area(double width, double height) – correct header with return type and two parameters (1) / calculates width * height (1) / returns the result with return (1)."},{"q":"Describe the difference between a function and a procedure.","m":2,"a":"Both are named subroutines that perform a task (1); a function returns a value to the code that called it but a procedure does not (1)."}],"videos":[{"title":"Subroutines: user-defined functions and procedures – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D19-video"},{"title":"Programming constructs (CCEA) – revision guide","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/1"}],"terms":["Subroutine","Function","Procedure","Parameter","Built-in function","Unit testing","Decomposition"]},{"id":"c04-p09","spec":"Basic file handling","lessons":["D20"],"summary":"Files give persistent storage: a program opens a file in read, write or append mode, reads or writes lines, then closes it.","blocks":[{"t":"p","text":"Variables are held in RAM, which is volatile – everything is lost when the program closes. [[File handling]] lets a program save data to a file on secondary storage (non-volatile), so it can be loaded next time, used for reports later or shared with another program."},{"t":"list","items":["**Open** the file, choosing a mode.","**Read** from it or **write** to it.","**Close** it – always. Unclosed files may not have all their data saved and can stay locked."],"ordered":true},{"t":"table","head":["Mode","C#","Effect"],"rows":[["Read","`new StreamReader(\"scores.txt\")`","Reads an existing file from the start"],["Write","`new StreamWriter(\"scores.txt\")`","Creates a new file, or **overwrites** an existing one"],["Append","`new StreamWriter(\"scores.txt\", true)`","Adds to the end, keeping existing data"]],"caption":"StreamReader and StreamWriter are in System.IO (included automatically in .NET 6+ console projects; otherwise add using System.IO;)."},{"t":"code","lang":"cs","title":"Write, append, then read a CSV file","code":"StreamWriter sw = new StreamWriter(\"scores.txt\");        // write mode\nsw.WriteLine(\"Aoife,87\");\nsw.WriteLine(\"Ben,74\");\nsw.Close();\n\nStreamWriter sa = new StreamWriter(\"scores.txt\", true);  // append mode\nsa.WriteLine(\"Cara,91\");\nsa.Close();\n\nStreamReader sr = new StreamReader(\"scores.txt\");        // read mode\nstring line = sr.ReadLine();\nwhile (line != null)\n{\n    string[] parts = line.Split(',');\n    Console.WriteLine(parts[0] + \" scored \" + parts[1]);\n    line = sr.ReadLine();\n}\nsr.Close();","output":"Aoife scored 87\nBen scored 74\nCara scored 91"},{"t":"p","text":"Each line of the file is one [[record]]; commas separate its fields, and `Split(',')` separates them again when reading. `ReadLine()` returns `null` when the end of the file is reached, which ends the WHILE loop. Other useful functions: `ReadToEnd()` (whole file as one string), `File.ReadAllLines()` (every line into an array), `File.Exists()` (check a file is there) and `File.Delete()`."},{"t":"warn","text":"Opening a missing file for reading causes an execution (run-time) error that crashes the program. Check `File.Exists(\"scores.txt\")` first or trap the error with `try … catch`. And remember: `new StreamWriter(name)` without `true` wipes the existing contents."},{"t":"key","title":"Key points","items":["Files give persistent storage; RAM is volatile.","Open → read/write → close.","Write overwrites; append adds to the end; read starts at the beginning.","One record per line, fields separated by commas, split with Split(',')."]},{"t":"tip","text":"'Name two file handling functions other than read and write': open, close, append, delete, or check a file exists – and describe what each does in one sentence."}],"diagram":{"kind":"flow","title":"Reading a file line by line","direction":"tb","caption":"Step through the read loop from the code above.","nodes":[{"id":"o","label":"Open scores.txt for reading","detail":"new StreamReader(\"scores.txt\") – an error if the file does not exist.","shape":"start"},{"id":"r1","label":"line ← first line","detail":"sr.ReadLine() reads \"Aoife,87\".","shape":"io"},{"id":"d","label":"line ≠ null?","detail":"null means the end of the file has been reached.","shape":"decision"},{"id":"s","label":"Split line into fields","detail":"parts[0] = name, parts[1] = score.","shape":"process"},{"id":"out","label":"OUTPUT name and score","detail":"e.g. Aoife scored 87","shape":"io"},{"id":"r2","label":"line ← next line","detail":"Without this the loop would never end.","shape":"io"},{"id":"c","label":"Close the file","detail":"sr.Close() releases the file.","shape":"end"}],"edges":[["o","r1"],["r1","d"],["d","s","yes"],["s","out"],["out","r2"],["r2","d"],["d","c","no"]]},"check":[{"q":"Which C# statement opens results.txt so new data is added to the end?","o":["new StreamReader(\"results.txt\")","new StreamWriter(\"results.txt\")","File.Delete(\"results.txt\")","new StreamWriter(\"results.txt\", true)"],"a":3,"why":"The true argument selects append mode."},{"q":"Why do programs store data in files?","o":["So data is kept after the program ends","To translate the code","To avoid using variables","To make loops run faster"],"a":0,"why":"Files provide persistent storage; RAM is volatile."},{"q":"What does sr.ReadLine() return when there are no more lines?","o":["\"\"","null","-1","0"],"a":1,"why":"null signals the end of the file."}],"exam":[{"year":2022,"paper":"Unit 4","q":"9","marks":7,"summary":"Naming and describing two file handling functions, then describing three types of error","tip":"Functions other than read and write: open, close, append, delete – each with a description.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"6","marks":10,"summary":"A candle shop billing algorithm, then explaining how orders could be stored in a file for later reports","tip":"Explain that data is written to a file so it persists after the program ends and can be read back later.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"Describe the difference between opening a file in write mode and in append mode.","m":2,"a":"Write mode creates the file or overwrites/erases any existing contents (1); append mode keeps the existing data and adds new data to the end (1)."},{"q":"A Portrush surf school wants to keep a list of bookings between sessions. Describe the three steps the program must take to add a new booking to an existing file.","m":3,"a":"Open the file in append mode (1) / write the new booking as a line/record, e.g. with WriteLine (1) / close the file so the data is saved (1)."}],"videos":[{"title":"Basic file handling – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D20-video"},{"title":"Programming constructs (CCEA) – file handling","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/11"}],"terms":["File handling","Record"]}],"topic":"T44","topicName":"Programming constructs","links":{"tests":[{"id":"TH","title":"Unit 4 test H: Programming, errors, testing and evaluation","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TH"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}},{"id":"c05","n":5,"title":"Simple error handling techniques","intro":"How programs protect themselves from bad data and how programmers find and fix mistakes: validation checks and loops, syntax, execution and logic errors, and try … catch error trapping.","pages":[{"id":"c05-p01","spec":"Data validation, including presence, length, type and format checks","lessons":["D21"],"summary":"Validation is an automatic check that input is sensible and follows rules (presence, length, type, format, range) before it is used; a validation loop keeps asking until the input passes.","blocks":[{"t":"p","text":"Computers process exactly what they are given: wrong data in means wrong results out (**garbage in, garbage out**). [[Validation]] is an automatic check, carried out by the program, that input data is sensible and obeys set rules **before** it is stored or processed."},{"t":"table","head":["Check","What it tests","Example rule","C# condition for valid data"],"rows":[["[[Presence check]]","Something has been entered","Surname must not be blank","`surname != \"\"`"],["[[Length check]]","The number of characters is acceptable","Password at least 8 characters","`password.Length >= 8`"],["[[Type check]]","The data is the correct data type","Quantity must be a whole number","`int.TryParse(input, out qty)`"],["[[Format check]]","The data matches a pattern","Email contains @; code starts with BT","`email.Contains(\"@\")`"],["[[Range check]]","A value lies between limits","Frames from 10 to 40","`frames >= 10 && frames <= 40`"]]},{"t":"note","text":"The specification names presence, length, type and format checks. Range checks appear in CCEA past papers too, so learn all five."},{"t":"h","text":"Validation loops"},{"t":"p","text":"A [[validation loop]] repeats the input while the data is invalid, giving an error message each time. Use a WHILE loop (you do not know how many attempts will be needed), not a FOR loop. Notice that the condition describes **invalid** data, so a range check uses OR: `frames < 10 || frames > 40`."},{"t":"code","lang":"cs","title":"Type and range check in one validation loop","code":"Console.Write(\"Frames (10-40): \");\nint frames;\nbool isNumber = int.TryParse(Console.ReadLine(), out frames);\nwhile (!isNumber || frames < 10 || frames > 40)\n{\n    Console.WriteLine(\"Error: enter a whole number from 10 to 40\");\n    Console.Write(\"Frames (10-40): \");\n    isNumber = int.TryParse(Console.ReadLine(), out frames);\n}\nConsole.WriteLine(\"Accepted: \" + frames);","output":"Frames (10-40): ten\nError: enter a whole number from 10 to 40\nFrames (10-40): 55\nError: enter a whole number from 10 to 40\nFrames (10-40): 25\nAccepted: 25"},{"t":"p","text":"`int.TryParse` attempts the conversion: it returns `true` and puts the number in `frames` if the text is a whole number, or returns `false` (setting `frames` to 0) if it is not – so letters never crash the program."},{"t":"warn","text":"Validation **cannot** prove data is correct, only that it is reasonable. An age of 21 typed instead of 22 passes every check. Examiners regularly see answers that claim validation makes data accurate."},{"t":"key","title":"Key points","items":["Presence = not blank; length = number of characters; type = right data type; format = right pattern; range = within limits.","Validation loop: WHILE invalid → error message → input again.","Valid ≠ correct: validation only checks data is sensible."]},{"t":"tip","text":"In 'write a validation loop' questions, marks usually go for: the first input, a correct WHILE condition (watch AND vs OR), an error message inside the loop, re-input inside the loop, and the right variable names from the question."}],"diagram":{"kind":"table-reveal","title":"Trace table: the validation loop","caption":"The user types ten, 55, 8 and then 40. Trace the loop and click hidden cells to check each value.","head":["Input","isNumber","frames","Loop condition (invalid?)","Output"],"rows":[["ten","False","0","True","Error: enter a whole number from 10 to 40"],["55","True","55","True","Error: enter a whole number from 10 to 40"],["8","True","8","True","Error: enter a whole number from 10 to 40"],["40","True","40","False","Accepted: 40"]],"hidden":[[0,1],[0,3],[1,3],[2,3],[3,3],[3,4]]},"check":[{"q":"Which check makes sure a password has at least 8 characters?","o":["Length check","Range check","Presence check","Type check"],"a":0,"why":"A length check counts characters."},{"q":"A program asks for an age from 11 to 18. Which condition keeps a validation loop running while the age is invalid?","o":["age < 11 && age > 18","age < 11 || age > 18","age >= 11 && age <= 18","age > 11 || age < 18"],"a":1,"why":"An age is invalid if it is below 11 OR above 18; no number can be both, so && would never loop."},{"q":"Why can validation not guarantee that data is correct?","o":["Validation checks data after it is stored","Validation is only done by humans","Data can be sensible but still wrong, e.g. 21 typed instead of 22","Validation only works on numbers"],"a":2,"why":"Validation checks against rules, not against the truth."},{"q":"Which check is 'the postcode must start with BT'?","o":["Range check","Presence check","Length check","Format check"],"a":3,"why":"It checks the pattern of the data."}],"exam":[{"year":2019,"paper":"Unit 4","q":"1","marks":18,"summary":"Data types, range and presence checks, extending a program, IDE features and translation","tip":"Describe each check in terms of what it tests and use the scenario's field in the example.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2022,"paper":"Unit 4","q":"4","marks":17,"summary":"Tiered pricing, then a validation loop that only accepts 1 to 50, data types and string functions","tip":"WHILE the value is below 1 OR above 50: error message and re-input inside the loop.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"5","marks":8,"summary":"Length, presence and format checks for a password and string functions to carry them out","tip":"Each check must be applied to the password rules given in the question.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"3","marks":17,"summary":"Travel insurance costs, validation, a real data type and a WHILE loop range check","tip":"Use WHILE (not FOR) and test for invalid values with the correct boundaries.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"6","marks":25,"summary":"Tent hire algorithm, Boolean data, constants, true/false statements about validation and a Y/N validation loop","tip":"Validation does not make data correct; the Y/N loop must repeat while the answer is not Y AND not N.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"A Bangor sailing club records a member's phone number. Describe two different validation checks that could be used on the phone number.","m":4,"a":"Any two, each named (1) and described for the phone number (1): presence check – the field is not left blank / length check – exactly 11 characters / type or format check – only digits, or starts with 07."},{"q":"Write pseudocode that asks the user to enter Y or N and keeps asking, with an error message, until Y or N is entered.","m":5,"a":"INPUT answer (1) / WHILE answer ≠ \"Y\" AND answer ≠ \"N\" (1 for WHILE, 1 for correct AND condition) / OUTPUT error message inside loop (1) / INPUT answer again inside loop, END WHILE (1)."}],"videos":[{"title":"Validation, error types and error trapping – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D21-video"},{"title":"Simple error handling techniques (CCEA) – data validation","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zgkhw6f/revision/2"},{"title":"Defensive design considerations (GCSE)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-gcse-j277-slr-2-3-defensive-design-considerations-part-1/"}],"terms":["Validation","Presence check","Length check","Type check","Format check","Range check","Validation loop"]},{"id":"c05-p02","spec":"Detection and correction techniques for syntax, execution and logic errors","lessons":["D21"],"summary":"Syntax errors break the language's rules and stop the program compiling; execution (run-time) errors crash a running program; logic errors give wrong results and are found by testing, dry runs and debugging tools.","blocks":[{"t":"p","text":"Programs almost never work first time. You need to recognise the three types of error, know how each is **detected** and how it is **corrected**."},{"t":"table","head":["Error","What it is","Examples in C#","How it is detected"],"rows":[["[[Syntax error]]","Code breaks the grammar rules of the language, so it cannot be translated and will not run","Missing `;`, `Consle.WriteLine`, missing `}` or `)`, `if (x = 5)`","The compiler/IDE: error list with line numbers, red underlining"],["[[Execution error]] (run-time)","The program translates and starts, but crashes while running","Divide by zero, opening a missing file, `scores[10]` in a 10-element array, `Convert.ToInt32(\"ten\")`","The program stops with an exception message"],["[[Logic error]]","The program runs to the end but gives the wrong result, because the reasoning is wrong","`>` instead of `>=`, wrong formula, `total / 5` with ints dropping the decimals, output inside a loop","Testing against expected results, dry runs, trace tables, breakpoints"]]},{"t":"code","lang":"cs","title":"Spot the logic error","code":"// Should give the average of three marks\nint a = 70, b = 65, c = 80;\ndouble average = a + b + c / 3;\nConsole.WriteLine(average);","output":"161"},{"t":"p","text":"There is no crash and no error message, but the answer is clearly wrong. Division happens before addition, so only `c` is divided (80 / 3 = 26 with integer division) and 70 + 65 + 26 = 161. The fix is `(a + b + c) / 3.0`, which gives 71.666…"},{"t":"h","text":"Techniques for finding and fixing errors"},{"t":"list","items":["**Read the error message**: it names the type of problem and the line number. Fix the first error first – one missing bracket can cause several messages.","**IDE features**: syntax highlighting, error underlining and auto-complete prevent and reveal syntax errors.","**[[Breakpoints|Breakpoint]] and stepping**: pause the program at a line, step through one statement at a time and watch variable values change.","**[[Dry runs|Dry run]] and [[trace tables|Trace table]]**: follow the code by hand with test values and compare with the expected result.","**Testing**: use valid, invalid and extreme data so every path is executed; compare the actual with the expected outcome.","**Error trapping and validation** stop many execution errors happening at all.","Change one thing at a time and retest after every fix."],"ordered":false},{"t":"key","title":"Key points","items":["Syntax: breaks the rules → won't run → found by the translator.","Execution: crashes while running → found when it happens; prevented by validation and error trapping.","Logic: runs but wrong output → found by testing, dry runs, trace tables, breakpoints."]},{"t":"tip","text":"In 6-mark quality-of-written-communication questions, cover each error type with a definition, an example **and** how it is detected and dealt with. Use the technical terms – exception, trace table, breakpoint, test data."},{"t":"warn","text":"A logic error does not 'stop the program' or 'produce an error message' – that is the most common confusion with execution errors."}],"diagram":{"kind":"compare","title":"Three types of error","caption":"Toggle between the error types to compare when they appear and how they are found.","states":[{"label":"Syntax","points":["When: during translation, before the program runs","Symptom: compiler error list; program will not run","Example: Console.WriteLine(\"Hi\") with no semicolon","Fix: read the message and line number, correct the spelling or punctuation"],"art":null},{"label":"Execution","points":["When: while the program is running","Symptom: program crashes with an exception","Example: total / count when count is 0","Fix: validation, checks such as File.Exists, try … catch error trapping"],"art":null},{"label":"Logic","points":["When: the program runs to the end","Symptom: wrong output, no error message","Example: a + b + c / 3 for an average","Fix: test with expected results, dry run with a trace table, use breakpoints"],"art":null}]},"check":[{"q":"A program runs but calculates the wrong VAT. What type of error is this?","o":["Logic error","Translation error","Syntax error","Execution error"],"a":0,"why":"It runs without crashing but gives the wrong answer."},{"q":"Which is an execution (run-time) error?","o":["Misspelling Console as Consle","Dividing a number by zero while the program runs","Using > instead of >=","A missing closing bracket"],"a":1,"why":"Division by zero crashes the program as it runs."},{"q":"Which tool lets a programmer pause a program at a chosen line and inspect variables?","o":["Auto-complete","Compiler","Breakpoint","Syntax highlighting"],"a":2,"why":"A breakpoint stops execution at that line."},{"q":"When is a syntax error detected?","o":["Only when the user enters invalid data","Only during testing with extreme data","After the program has finished","When the code is translated, before it can run"],"a":3,"why":"The translator rejects code that breaks the rules."}],"exam":[{"year":2019,"paper":"Unit 4","q":"5","marks":4,"summary":"Explaining the difference between syntax and logic errors","tip":"Syntax: breaks the language rules so it will not run; logic: runs but gives incorrect output.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2022,"paper":"Unit 4","q":"9","marks":7,"summary":"File handling functions and describing three types of programming error","tip":"Give each error type a definition plus an example.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"4","marks":23,"summary":"Decomposition and abstraction, flowchart symbols, syntax and logic errors in given code, functions and a menu validation loop","tip":"Identify the exact faulty line and give the corrected statement.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"6","marks":6,"summary":"Extended writing on execution and logic errors and how each is handled","tip":"For each type: what it is, an example, and how it is detected and fixed, written in clear connected prose.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"3","marks":15,"summary":"Musician hire algorithm, variables and data types, IDE aids and syntax versus logic errors","tip":"Link IDE features to the error they help with, e.g. error highlighting for syntax.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"Give one example each of a syntax error, an execution error and a logic error in a program that calculates the average number of goals scored per match by a Dungannon football team.","m":3,"a":"Syntax: e.g. missing semicolon or misspelt keyword (1) / execution: dividing goals by a number of matches that is 0 (1) / logic: dividing by the wrong number or adding instead of dividing, so the average is wrong (1)."},{"q":"Describe two techniques a programmer could use to find a logic error.","m":4,"a":"Any two, named (1) and described (1): dry run with a trace table – following the code by hand and recording variable values to see where they differ from expected / breakpoints and stepping – pausing the program and watching variables / testing with data whose expected result is known and comparing with actual output."}],"videos":[{"title":"Validation, error types and error trapping – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D21-video"},{"title":"Simple error handling techniques (CCEA) – program errors","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zgkhw6f/revision/3"}],"terms":["Syntax error","Execution error","Logic error","Breakpoint","Dry run","Trace table"]},{"id":"c05-p03","spec":"Simple error trapping techniques","lessons":["D21"],"summary":"Error trapping (exception handling) uses try … catch to catch a run-time error and respond with a helpful message instead of crashing, making a program more robust.","blocks":[{"t":"p","text":"When an execution error happens in C#, the program **throws** an [[exception]]. If nothing deals with it, the program crashes. [[Error trapping]] means writing code that detects the error and handles it – showing a helpful message and carrying on – instead of crashing."},{"t":"h","text":"try … catch"},{"t":"list","items":["Put the statements that might fail inside a `try` block.","If an exception is thrown, the rest of the `try` block is skipped and the matching `catch` block runs.","If nothing goes wrong, the `catch` blocks are skipped.","You can have several `catch` blocks for different exceptions, e.g. `FormatException`, `DivideByZeroException`, `FileNotFoundException`, `IndexOutOfRangeException`."],"ordered":false},{"t":"code","lang":"cs","title":"Trapping bad input and division by zero","code":"try\n{\n    Console.Write(\"Total points: \");\n    int points = Convert.ToInt32(Console.ReadLine());\n    Console.Write(\"Matches played: \");\n    int matches = Convert.ToInt32(Console.ReadLine());\n    Console.WriteLine(\"Points per match: \" + points / matches);\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"Please type whole numbers only.\");\n}\ncatch (DivideByZeroException)\n{\n    Console.WriteLine(\"Matches played cannot be 0.\");\n}\nConsole.WriteLine(\"Program continues...\");","output":"Total points: 30\nMatches played: 0\nMatches played cannot be 0.\nProgram continues..."},{"t":"h","text":"Error trapping in a loop"},{"t":"p","text":"Combine try … catch with a loop so the user can try again until the input works:"},{"t":"code","lang":"cs","code":"int age = 0;\nbool valid = false;\nwhile (!valid)\n{\n    try\n    {\n        Console.Write(\"Age: \");\n        age = Convert.ToInt32(Console.ReadLine());\n        valid = true;\n    }\n    catch (FormatException)\n    {\n        Console.WriteLine(\"That is not a whole number - try again.\");\n    }\n}\nConsole.WriteLine(\"Age entered: \" + age);"},{"t":"h","text":"How error trapping improves a program"},{"t":"list","items":["The program does not crash, so it is more [[robust|Robustness]].","The user gets a clear message explaining what went wrong and how to fix it.","Work and data entered so far are not lost.","The program can recover, e.g. ask again or create a missing file."],"ordered":false},{"t":"note","text":"Error trapping and validation work together: validation checks that data follows the rules; error trapping catches problems that still occur at run time, such as a missing file."},{"t":"key","title":"Key points","items":["An exception is thrown when a run-time error occurs.","try: code that might fail. catch: what to do if it does.","Benefits: no crash, helpful message, no lost data – a more robust program."]},{"t":"tip","text":"A full answer to 'describe error trapping' says what it is (detecting a run-time error), how (try … catch) and what happens instead of a crash (a message, recovery)."}],"diagram":{"kind":"flow","title":"How try … catch works","direction":"tb","caption":"Step through the points-per-match program for an input of 0 matches.","nodes":[{"id":"t","label":"Enter try block","detail":"Statements that might fail are inside try.","shape":"start"},{"id":"i","label":"Input points and matches","detail":"Letters here would throw a FormatException.","shape":"io"},{"id":"c","label":"points / matches","detail":"matches = 0, so a DivideByZeroException is thrown.","shape":"process"},{"id":"d","label":"Exception thrown?","detail":"If yes, the rest of the try block is skipped.","shape":"decision"},{"id":"ok","label":"Output points per match","detail":"Only reached if no exception occurred; the catch blocks are skipped.","shape":"io"},{"id":"k","label":"Matching catch block runs","detail":"\"Matches played cannot be 0.\" – no crash.","shape":"process"},{"id":"e","label":"Program continues","detail":"Execution carries on after the try … catch.","shape":"end"}],"edges":[["t","i"],["i","c"],["c","d"],["d","ok","no"],["d","k","yes"],["ok","e"],["k","e"]]},"check":[{"q":"What is error trapping?","o":["Detecting a run-time error and handling it so the program does not crash","Checking that input data follows rules","Testing every path through the code","Removing syntax errors before compiling"],"a":0,"why":"It deals with exceptions while the program runs."},{"q":"In C#, which block contains the code that runs when an exception is caught?","o":["try","catch","throw","else"],"a":1,"why":"The catch block handles the exception."},{"q":"Which exception occurs when Convert.ToInt32 is given \"ten\"?","o":["DivideByZeroException","FileNotFoundException","FormatException","IndexOutOfRangeException"],"a":2,"why":"The text is not in a valid number format."}],"exam":[{"year":2022,"paper":"Unit 4","q":"10","marks":9,"summary":"Matching five testing methods to descriptions, then describing error trapping and how it improves a program","tip":"Define error trapping (catching a run-time error) and give one clear improvement, such as the program not crashing and the user being told what to do.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"}],"practice":[{"q":"Describe error trapping and explain one way it improves a program.","m":3,"a":"Code that detects/catches a run-time error or exception (1) and handles it, e.g. with try … catch, instead of letting the program crash (1) / improvement: the program keeps running/is more robust and the user is shown a helpful message (1)."},{"q":"A Ballycastle ferry booking program reads timetable.txt when it starts. Explain how error trapping could be used if the file is missing.","m":2,"a":"Place the code that opens the file in a try block (1); catch the FileNotFoundException and display a message / create a new empty file instead of crashing (1)."}],"videos":[{"title":"Validation, error types and error trapping – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D21-video"},{"title":"Simple error handling techniques (CCEA) – error trapping","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zgkhw6f/revision/4"}],"terms":["Exception","Error trapping","Robustness"]}],"topic":"T45","topicName":"Simple error handling techniques","links":{"tests":[{"id":"TH","title":"Unit 4 test H: Programming, errors, testing and evaluation","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TH"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}},{"id":"c06","n":6,"title":"Developing test plans and testing a solution","intro":"How programmers test iteratively at unit, integration and system level, compare white box and black box approaches, write test plans and choose valid, extreme, invalid and null test data.","pages":[{"id":"c06-p01","spec":"Explain the following iterative approaches to testing: white box; black box; system, unit and integration testing","lessons":["D22"],"summary":"Testing is iterative – repeated throughout and after development; white box testing examines the code's logic, black box testing checks inputs against expected outputs, and testing moves from unit to integration to system level.","blocks":[{"t":"p","text":"Testing finds errors before users do and checks that a program meets its requirements. It is [[iterative testing|Iterative testing]]: you write a part, test it, fix it, retest it and only then move on – and the finished system is tested again at the end. Each cycle improves the solution."},{"t":"h","text":"White box and black box testing"},{"t":"compare","head":["White box testing","Black box testing"],"rows":[["Looks at","The internal code, logic and structure","Only inputs and outputs – the code is not seen"],["Usually done by","The programmer","Independent testers or end users"],["Aim","Execute every path, branch and condition","Check each function behaves as the requirements say"],["Typical tools","Dry runs, trace tables, breakpoints","A test plan of inputs with expected outputs"]]},{"t":"p","text":"Example: for the kayak hire program (£12/h up to 2 h, £10/h for 3–5 h, £8/h above 5 h), a white box tester reads the ELSE IF chain and chooses hours so that **every branch** runs. A black box tester just enters 4 hours and checks the screen shows £40, as the price list says."},{"t":"h","text":"Unit, integration and system testing"},{"t":"list","items":["**[[Unit testing]]** – testing one module, function or method on its own, as soon as it is written, usually by its developer.","**[[Integration testing]]** – testing that separately written units work correctly **together**, especially the data passed between them.","**[[System testing]]** – testing the complete, finished system against its specification and requirements, using the full test plan with valid, invalid and extreme data."],"ordered":true},{"t":"p","text":"The usual order is unit → integration → system: small parts first, then how they connect, then the whole. Problems found at one level are fixed and the earlier tests repeated – that is what makes the process iterative."},{"t":"key","title":"Key points","items":["Iterative testing: test → fix → retest, throughout and after development.","White box: code visible, tests paths. Black box: code hidden, tests inputs vs outputs.","Unit (one part) → integration (parts together) → system (whole solution)."]},{"t":"tip","text":"'Describe two differences between black and white box testing' – make each difference a contrast: 'white box looks at the code, whereas black box only considers inputs and outputs'."},{"t":"warn","text":"Do not mix up integration and system testing. Integration is about the **connections** between modules; system testing is about the **whole** system meeting the requirements."}],"diagram":{"kind":"layers","title":"Levels of testing","caption":"Click each level. Testing builds upwards from single units to the whole system; any fix sends you back to retest.","items":[{"label":"System testing","detail":"The complete booking system is tested against the specification using the full test plan: every requirement, valid/invalid/extreme data, high volumes."},{"label":"Integration testing","detail":"Combined units are tested together, e.g. the cost function is passed hours from the input module and its result is written to the bookings file correctly."},{"label":"Unit testing","detail":"Each function is tested on its own, e.g. CalculateCost(4) returns 40, CalculateCost(6) returns 48."},{"label":"Iteration","detail":"At every level: test → find error → fix → retest. Testing runs throughout development, not just at the end."}]},"check":[{"q":"Which type of testing examines the internal logic of the code?","o":["White box testing","System testing","User acceptance","Black box testing"],"a":0,"why":"White box testers can see and trace the code."},{"q":"Testing that separately written modules work together correctly is…","o":["unit testing","integration testing","system testing","black box testing"],"a":1,"why":"Integration testing checks the connections between units."},{"q":"Which statement describes iterative testing?","o":["Testing every input value possible","Testing only once, at the end","Testing, fixing and retesting repeatedly during and after development","Testing only by users"],"a":2,"why":"Iterative means repeated cycles."},{"q":"Black box testing is usually carried out by…","o":["the CPU","the compiler","the original programmer reading the code","independent testers or users who do not see the code"],"a":3,"why":"Black box testers only use inputs and outputs."}],"exam":[{"year":2019,"paper":"Unit 4","q":"10","marks":8,"summary":"Black and white box testing, a test table completed by dry running, and system versus integration testing","tip":"Contrast the approaches directly; for integration, mention modules working together.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2022,"paper":"Unit 4","q":"10","marks":9,"summary":"Matching five testing methods to their descriptions, then error trapping","tip":"Learn a one-line definition of each testing method.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"10","marks":9,"summary":"Completing sentences about types of testing and choosing invalid and extreme test data","tip":"Use the exact terms: unit, integration, system; extreme data sits on the boundary.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"8","marks":18,"summary":"String and Boolean data types, unit testing, a test plan and black versus white box testing","tip":"Unit testing = one module on its own; differences must be contrasts.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"9","marks":11,"summary":"Components of a test plan and black versus white box testing","tip":"Name the columns of a test plan and give two contrasting differences.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"Describe two differences between black box testing and white box testing.","m":4,"a":"White box testing looks at the code/internal logic whereas black box only considers inputs and outputs (2) / white box is usually done by the programmer whereas black box is done by independent testers or users (2). Other valid contrast: white box aims to test every path; black box checks the requirements are met."},{"q":"A Derry escape room company has a booking program built from separate modules. Explain the difference between integration testing and system testing.","m":2,"a":"Integration testing checks that the separate modules work together correctly, e.g. data is passed between them properly (1); system testing checks the complete booking system as a whole meets the original requirements (1)."}],"videos":[{"title":"Testing approaches, test plans and test data – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D22-video"},{"title":"Developing test plans and testing a solution (CCEA) – software testing","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/z9jf2nb/revision/1"}],"terms":["Iterative testing","White box testing","Black box testing","Unit testing","Integration testing","System testing"]},{"id":"c06-p02","spec":"Create and use a test plan that identifies test procedures for use during and after development to check a system against success criteria","lessons":["D22"],"summary":"A test plan is a table listing each test's number, purpose, test data, data type, expected outcome, actual outcome and action taken, used during and after development to check the system against its success criteria.","blocks":[{"t":"p","text":"A [[test plan]] is written **before** testing begins. It lists the tests that will be carried out, so testing is planned and thorough rather than random, and it links each test back to the **success criteria** (the user requirements). It is used during development (testing each part as it is built) and after development (testing the finished system)."},{"t":"h","text":"Columns of a test plan"},{"t":"list","items":["**Test number** – so each test can be referred to.","**Purpose / description** – what is being tested and which requirement it checks.","**Test data** – the exact value(s) entered.","**Type of test data** – valid, extreme, invalid or null.","**Expected outcome** – precisely what should happen.","**Actual outcome** – what really happened (filled in when the test is run).","**Action / comment** – any correction made; then the test is repeated."],"ordered":false},{"t":"table","head":["No.","Purpose","Test data","Type","Expected outcome","Actual outcome","Action"],"rows":[["1","Accept a typical age","14","Valid","Age accepted","Age accepted","None"],["2","Accept lowest age","11","Extreme","Age accepted","Error message shown","Changed > 11 to >= 11; retested – accepted"],["3","Reject age too high","19","Invalid","\"Age must be 11–18\" and re-input","As expected","None"],["4","Reject text","ten","Invalid","\"Enter a number\" and re-input","Program crashed","Added int.TryParse type check; retested"],["5","Reject a blank entry","(nothing)","Null","\"Age is required\" and re-input","As expected","None"]],"caption":"Part of a test plan for a youth club registration program (ages 11–18)."},{"t":"p","text":"Notice that tests 2 and 4 failed. The action column records the fix and that the test was **repeated** – evidence of iterative testing. These results later feed into the evaluation of the solution."},{"t":"key","title":"Key points","items":["Plan the tests before testing: number, purpose, data, type, expected, actual, action.","Each test links to a success criterion / requirement.","Failed tests lead to a correction and a retest."]},{"t":"warn","text":"Vague expected outcomes earn no marks. 'It works' or 'error' is not enough – write 'error message \"Age must be 11–18\" is displayed and the user is asked again'."},{"t":"tip","text":"In Unit 5, moderators often find extreme data and the action/retest column missing. Include tests on every boundary and record what you changed."}],"diagram":{"kind":"table-reveal","title":"Complete the test plan","caption":"A program accepts a number of tickets from 1 to 8. Decide the type of data and the expected outcome for each test, then click to check.","head":["No.","Test data","Type","Expected outcome"],"rows":[["1","4","Valid","Accepted; cost calculated"],["2","1","Extreme","Accepted (lower boundary)"],["3","8","Extreme","Accepted (upper boundary)"],["4","9","Invalid","Error message: 1–8 tickets only; re-input"],["5","0","Invalid","Error message: 1–8 tickets only; re-input"],["6","four","Invalid","Error message: enter a whole number; re-input"],["7","(blank)","Null","Error message: a number is required; re-input"]],"hidden":[[0,2],[0,3],[1,2],[1,3],[2,2],[3,2],[3,3],[4,2],[5,2],[5,3],[6,2],[6,3]]},"check":[{"q":"When should a test plan be written?","o":["Before testing is carried out","Only if errors are found","During the evaluation only","After the program is released"],"a":0,"why":"Planning first makes testing thorough and linked to the requirements."},{"q":"Which column is completed only when the test is actually run?","o":["Expected outcome","Actual outcome","Purpose","Test data"],"a":1,"why":"The actual outcome records what really happened."},{"q":"Which is the best expected outcome for entering 25 into an age field that accepts 11–18?","o":["It works","Error","Error message \"Age must be 11 to 18\" is shown and the age is re-entered","25"],"a":2,"why":"Expected outcomes must be specific."}],"exam":[{"year":2019,"paper":"Unit 4","q":"9","marks":19,"summary":"Test strategies, data types, a validation loop, design and discount selection","tip":"Link each test to the scenario's rules and give specific expected outcomes.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2024,"paper":"Unit 4","q":"8","marks":18,"summary":"Data types, unit testing, completing a test plan and black versus white box testing","tip":"Each row needs suitable data, its type and a precise expected outcome.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"9","marks":11,"summary":"Naming the components of a test plan and comparing black and white box testing","tip":"List columns such as test data, expected outcome and actual outcome, each with its purpose.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"State four items of information that should be recorded for each test in a test plan.","m":4,"a":"Any four (1 each): test number / purpose or description / test data / type of test data / expected outcome / actual outcome / action taken or comments."},{"q":"A program for a Newcastle (Co. Down) mountain-rescue team accepts a group size from 2 to 12. Complete one test plan row that tests the upper boundary: test data, type of test data and expected outcome.","m":3,"a":"Test data 12 (1) / extreme or boundary data (1) / expected outcome: group size accepted and processed (1)."}],"videos":[{"title":"Testing approaches, test plans and test data – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D22-video"},{"title":"Developing test plans and testing a solution (CCEA) – test plans","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/z9jf2nb/revision/3"}],"terms":["Test plan","Success criteria","Expected outcome"]},{"id":"c06-p03","spec":"Devise and use the following types of test data: valid, invalid and extreme","lessons":["D22"],"summary":"Valid data should be accepted, extreme data sits exactly on the limits and should be accepted, and invalid data should be rejected; null (blank) input is also tested.","blocks":[{"t":"p","text":"Good test data is chosen deliberately so that every rule and every path in the program is tried. There are three main types, plus null data."},{"t":"table","head":["Type","Meaning","Expected result","Example: mark out of 0–100"],"rows":[["[[Valid data]] (normal)","Typical data inside the accepted range","Accepted and processed","57"],["[[Extreme data]] (boundary)","Valid data exactly on the limits of the range","Accepted","0 and 100"],["[[Invalid data]] (erroneous)","Data that breaks the rules: out of range or the wrong type","Rejected with an error message","101, −1, \"sixty\""],["[[Null data]]","Nothing entered","Rejected with an error message","(blank)"]]},{"t":"p","text":"Values **just outside** the limits (here −1 and 101) are especially useful because they catch boundary mistakes such as `<` written instead of `<=`. Some textbooks call these 'invalid boundary' or 'erroneous boundary' data."},{"t":"example","title":"Worked example: choosing test data","context":"A Fermanagh gym app accepts a member's age from 16 to 70.","steps":["Valid: a typical age well inside the range, e.g. 35.","Extreme: the boundaries themselves – 16 and 70. Both must be accepted.","Invalid (out of range): 15 and 71 – just outside each limit – and a silly value such as 200.","Invalid (wrong type): \"thirty\" – checks the type check.","Null: leave the box empty – checks the presence check."],"answer":"At least one value of each type, plus both boundaries."},{"t":"p","text":"Text fields need test data too. For a password of 8–20 characters: valid = 12 characters, extreme = exactly 8 and exactly 20, invalid = 7 or 21 characters, null = blank."},{"t":"key","title":"Key points","items":["Valid: typical, accepted. Extreme: on the boundary, accepted. Invalid: wrong, rejected. Null: blank, rejected.","Test both boundaries and the values just beyond them.","Test data must come from the rules in the scenario."]},{"t":"warn","text":"Extreme data is **valid** – it is on the edge of the range, not outside it. Giving 101 as extreme data for a 0–100 range is the most common mistake."},{"t":"tip","text":"Always state the type and say why: '16 – extreme, because it is the lowest age the gym accepts'."}],"diagram":{"kind":"match","title":"Match the test data","caption":"A booking program accepts 1 to 8 tickets. Match each test value to its type.","pairs":[["5","Valid (normal) data"],["8","Extreme (boundary) data"],["9","Invalid data – out of range"],["\"two\"","Invalid data – wrong type"],["(blank)","Null data"]]},"check":[{"q":"A form accepts a quantity from 1 to 50. Which value is extreme data?","o":["0","25","51","50"],"a":3,"why":"50 is on the upper limit and should be accepted."},{"q":"Which statement about extreme data is true?","o":["It is valid data on the limits of the accepted range","It is always very large","It is the same as null data","It should be rejected"],"a":0,"why":"Extreme data is on the boundary and accepted."},{"q":"A program accepts ages from 11 to 18. Which is invalid data?","o":["18","19","11","15"],"a":1,"why":"19 is outside the range."},{"q":"What is null test data?","o":["A very large number","The value 0","Nothing entered at all","A negative number"],"a":2,"why":"Null means the input is left blank."}],"exam":[{"year":2019,"paper":"Unit 4","q":"3","marks":3,"summary":"Matching test cases to their categories of test data","tip":"Remember extreme data is accepted; invalid data is rejected.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2022,"paper":"Unit 4","q":"2","marks":14,"summary":"Data type for a race time, an algorithm for the lowest of three times, and choosing test data","tip":"Give actual values for each type, taken from the scenario's rules.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"10","marks":9,"summary":"Completing sentences about testing and giving invalid and extreme test data","tip":"Extreme values must sit exactly on the boundary.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"A Lough Neagh boat trip program accepts a number of passengers from 1 to 12. Give one example of valid, extreme and invalid test data and explain each choice.","m":6,"a":"Valid e.g. 6 (1) – a typical value inside the range, should be accepted (1) / extreme 1 or 12 (1) – on the boundary, should be accepted (1) / invalid e.g. 13, 0 or \"six\" (1) – outside the range/wrong type, should be rejected (1)."}],"videos":[{"title":"Testing approaches, test plans and test data – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D22-video"},{"title":"Developing test plans and testing a solution (CCEA) – test plans","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/z9jf2nb/revision/3"}],"terms":["Valid data","Extreme data","Invalid data","Null data"]}],"topic":"T46","topicName":"Developing test plans and testing a solution","links":{"tests":[{"id":"TH","title":"Unit 4 test H: Programming, errors, testing and evaluation","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TH"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}},{"id":"c07","n":7,"title":"Evaluation of digitally authored systems","intro":"How a finished solution is judged against the original requirements: does it meet the design criteria, is it complete, is it efficient and is it robust?","pages":[{"id":"c07-p01","spec":"Explain how evaluation is used to ensure that a solution: meets the original design criteria; is a full and complete solution; is an efficient solution; and is a robust solution","lessons":["D23"],"summary":"Evaluation judges a solution against the original user requirements and design criteria, using test results and stakeholder feedback, to decide whether it is complete and what must be improved.","blocks":[{"t":"p","text":"[[Evaluation]] means judging **how well** a solution solves the original problem. It is not a description of the program; it is a verdict backed by evidence. Evaluation happens during development (to refine each version) and at the end (to decide whether the solution is finished and what could be improved)."},{"t":"h","text":"What the solution is measured against"},{"t":"list","items":["The [[user requirements]] – the agreed list of what the system must do, written at the start with the client.","The **design criteria** (success criteria) – measurable targets taken from the requirements, e.g. 'a booking can be made in under one minute'.","The original design – screen layouts, algorithms and data structures that were planned."],"ordered":false},{"t":"h","text":"Evidence used"},{"t":"list","items":["Test plan results: actual outcomes compared with expected outcomes.","Feedback from [[stakeholders]] – the client, end users and developers – e.g. from questionnaires, interviews or watching users try the system.","Measurements such as response times or the number of steps a task takes."],"ordered":false},{"t":"h","text":"Meets the design criteria and is full and complete"},{"t":"p","text":"Work through the requirements as a checklist. For each one, decide whether it is **fully met, partly met or not met** and point to the evidence. A solution is **full and complete** only when every requirement is implemented and working. If a feature is missing, the requirements show exactly what still has to be added, and the evaluation records it as a further improvement."},{"t":"table","head":["Requirement (Erne kayak hire)","Met?","Evidence","Improvement"],"rows":[["Calculate cost from hours using the three price bands","Fully","Tests 1–6 gave the expected costs for 2, 3, 5 and 6 hours","None"],["Store every booking in a file for monthly reports","Fully","Bookings appended and read back correctly (tests 9–10)","Add a date filter"],["Email a receipt to the customer","Not met","Feature not implemented","Add in the next version"],["Staff can use it without training","Partly","2 of 3 staff needed help finding the cancel option","Move Cancel onto the main menu"]],"caption":"An evaluative table: a judgement, evidence and an improvement for each requirement."},{"t":"key","title":"Key points","items":["Evaluation = judging the solution against the original requirements and design criteria.","Use evidence: test results and stakeholder feedback.","Complete = every requirement implemented and working; missing features become improvements."]},{"t":"tip","text":"Be **evaluative, not descriptive**. 'The program has a menu' earns little; 'Requirement 3 is fully met – all four menu options worked in tests 4–7' earns credit."},{"t":"warn","text":"When asked how the requirements help when a feature is missing, do not just list what the requirements contain – explain that they are the agreed standard, so comparing against them reveals the gap and shows what must be added."}],"diagram":{"kind":"cycle","title":"Evaluation throughout development","caption":"Click each stage. Evaluation is not a single step at the end – it feeds back into each new version.","items":[{"label":"Requirements","detail":"Agree with the client what the system must do; set measurable design criteria."},{"label":"Design","detail":"Plan the algorithms, data and interface to meet each criterion."},{"label":"Develop and test","detail":"Build a version; run the test plan; record actual outcomes."},{"label":"Evaluate","detail":"Compare the version with every requirement: met, partly met or not met, with evidence from tests and users."},{"label":"Refine","detail":"Fix failures and add missing features, then test and evaluate again."}]},"check":[{"q":"What is a solution judged against during evaluation?","o":["The original user requirements and design criteria","Other programs on the market","The number of lines of code","The programmer's opinion"],"a":0,"why":"Requirements are the agreed standard."},{"q":"A solution is 'full and complete' when…","o":["it has been compiled","every requirement has been implemented and works","it has no comments","it has been used for a month"],"a":1,"why":"Completeness means all required features are present and working."},{"q":"Which is evidence for an evaluation?","o":["The name of the programmer","A screenshot of the code editor","Test plan results and user feedback","The size of the program file"],"a":2,"why":"Evaluation needs evidence of how well requirements are met."}],"exam":[{"year":2019,"paper":"Unit 4","q":"11","marks":10,"summary":"The purpose of evaluation, the stakeholders involved and how the requirements and original plan are used","tip":"Explain that the solution is compared with the requirements, and name the stakeholders who give feedback.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2023,"paper":"Unit 4","q":"11","marks":7,"summary":"How the requirements and design documents are used to evaluate a solution","tip":"Show the comparison: each requirement checked against what was built, with gaps identified.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"10","marks":4,"summary":"How user requirements help when features are missing, and testing robustness","tip":"Explain how the requirements are used, not just what they are.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"Explain how the user requirements are used when evaluating a solution.","m":2,"a":"The requirements are the agreed standard/checklist the solution is compared against (1); each one is checked to see whether it is fully, partly or not met, so missing features or improvements are identified (1)."},{"q":"Give two reasons why a solution should be evaluated.","m":2,"a":"Any two: to check it meets the original requirements/design criteria (1) / to identify missing features or errors still to fix (1) / to identify future improvements (1) / to confirm the client is satisfied (1)."}],"videos":[{"title":"Evaluating a solution – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D23-video"},{"title":"Developing test plans and testing a solution (CCEA) – evaluating coded solutions","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/z9jf2nb/revision/4"}],"terms":["Evaluation","User requirements","Stakeholders","Success criteria"]},{"id":"c07-p02","spec":"Explain how evaluation is used to ensure that a solution: meets the original design criteria; is a full and complete solution; is an efficient solution; and is a robust solution","lessons":["D23"],"summary":"An efficient solution works quickly without wasting resources or user effort; a robust solution copes with invalid, unexpected and large volumes of data without failing – both are judged using test evidence.","blocks":[{"t":"h","text":"Is it efficient?"},{"t":"p","text":"An [[efficient solution]] does its job quickly and without wasting resources – processor time, memory, storage – **or the user's time and effort**. Evaluating efficiency means asking:"},{"t":"list","items":["Are response times acceptable, even with a realistic amount of data?","Can users complete tasks in few steps (e.g. one menu choice rather than three screens)?","Is the code well structured: loops instead of repeated statements, arrays instead of many variables, user-defined functions that are reused, no unnecessary work (e.g. a search that stops once the item is found)?"],"ordered":false},{"t":"code","lang":"cs","title":"Same result, more efficient code","code":"// Inefficient: 7 variables and 7 additions written out\n// int total = mon + tue + wed + thu + fri + sat + sun;\n\n// Efficient: one array and a loop - works for any number of days\nint[] cars = { 120, 95, 143, 101, 88, 60, 72 };\nint total = 0;\nfor (int i = 0; i < cars.Length; i++)\n{\n    total = total + cars[i];\n}\nConsole.WriteLine(total);","output":"679"},{"t":"h","text":"Is it robust?"},{"t":"p","text":"A [[robust|Robustness]] solution keeps working correctly when things go wrong: it copes with invalid, unexpected and extreme input, missing files and large volumes of data **without crashing or producing wrong results**. Robustness is improved by validation and error trapping and is proved by testing:"},{"t":"list","items":["Test with valid, extreme, invalid and null data – every rule should acc
