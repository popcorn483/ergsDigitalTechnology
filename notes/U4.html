he list in place, so no extra memory is needed; quick to detect a list that is already sorted.","**Disadvantages**: slow on large lists because it makes many comparisons and swaps. The number of comparisons grows roughly with the square of the number of items."],"ordered":false},{"t":"tip","text":"When asked to show a bubble sort, write out the **whole list after each pass**. If asked how the algorithm knows it has finished, the answer is: *a complete pass with no swaps*."},{"t":"key","title":"Key points","items":["Compare adjacent pairs; swap if out of order; one sweep is a pass.","After each pass the largest unsorted item is in its final place.","Stop when a pass makes no swaps (at most n − 1 passes).","Simple and memory-efficient, but slow on large lists."]}],"diagram":{"kind":"sort","algo":"bubble","data":[24,11,30,8,19,15],"title":"Bubble sort, step by step","caption":"Step or play through every comparison and swap. Notice the largest value reaching the end after pass 1, and the sort stopping after a pass with no swaps."},"check":[{"q":"In a bubble sort, what is compared at each step?","o":["The first and last items","Two adjacent items","The middle item and the target","Every item with the smallest item"],"a":1,"why":"Neighbours are compared and swapped if needed."},{"q":"How does a bubble sort know the list is sorted?","o":["After exactly one pass","When a full pass makes no swaps","When the first item is smallest","When the middle item is found"],"a":1,"why":"No swaps in a pass means everything is in order."},{"q":"After pass 1 of an ascending bubble sort on 7, 2, 9, 4, 1, the list is…","o":["2, 7, 4, 1, 9","1, 2, 4, 7, 9","2, 4, 7, 1, 9","7, 2, 4, 1, 9"],"a":0,"why":"9 bubbles to the end: 2, 7, 4, 1, 9."},{"q":"Why is a temporary variable used when swapping?","o":["To count the passes","So one value is not overwritten and lost","To make the loop run faster","To store the target"],"a":1,"why":"Without temp, both positions would end up holding the same value."}],"exam":[{"year":2025,"paper":"Unit 4","q":"1","marks":5,"summary":"Short questions: a string data type, a compound AND condition, the output of an IF, a NOT/AND truth table and recognising a bubble sort.","tip":"Recognise the compare-neighbours-and-swap description.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"7","marks":35,"summary":"Arrays, defining pseudocode, FOR and WHILE totals, finding a minimum, bubble sort and linear and binary search.","tip":"Judge statements about bubble sort and show the list after each pass.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2023,"paper":"Unit 4","q":"9","marks":18,"summary":"Arrays (update, reset to zero, find the maximum), the steps of a bubble sort and searching sorted data.","tip":"Put the bubble sort steps in the correct order.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2019,"paper":"Unit 4","q":"12","marks":8,"summary":"Linear compared with binary search, and showing the passes of a sort.","tip":"Write out the full list after each pass.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2019-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2019-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2022,"paper":"Unit 4","q":"5","marks":6,"summary":"Extended writing (QWC): describe bubble sort and insertion sort and compare their efficiency.","tip":"Describe each method precisely before comparing.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"}],"practice":[{"q":"A Limavady running club stores race times 52, 47, 60, 41, 55. Show the list after each pass of a bubble sort into ascending order.","m":4,"a":"Pass 1: 47, 52, 41, 55, 60 (1); pass 2: 47, 41, 52, 55, 60 (1); pass 3: 41, 47, 52, 55, 60 (1); pass 4: no swaps, so sorted (1)."},{"q":"Describe how a bubble sort puts a list into ascending order.","m":4,"a":"Compare the first two items (1); swap them if the first is larger (1); move along and repeat for each adjacent pair to the end of the list (1); repeat passes until a pass makes no swaps (1)."}],"videos":[{"title":"Sorting algorithms: bubble sort and insertion sort – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D11-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"},{"title":"OCR GCSE (J277) 2.1 Bubble sort","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-gcse-j277-slr-2-1-bubble-sort/"}],"terms":["Bubble sort","Pass"]},{"id":"c03-p05","spec":"Create and evaluate algorithms, including those for basic sorting: simple sorting techniques such as the bubble sort and the insertion sort","lessons":["D11"],"summary":"An insertion sort builds a sorted section at the start of the list, taking each next item and inserting it into its correct place; it is usually faster than a bubble sort, especially on nearly sorted data.","blocks":[{"t":"p","text":"The [[insertion sort]] works the way many people sort a hand of playing cards: pick up one card at a time and slide it into the right place among the cards already held."},{"t":"h","text":"How an insertion sort works"},{"t":"list","items":["Treat the **first item** on its own as a sorted list.","Take the **next item** from the unsorted part.","Compare it with the items in the sorted part, moving from right to left, and **shift each larger item one place right**.","**Insert** the item into the gap left behind.","Repeat until every item has been inserted."],"ordered":true},{"t":"table","head":["Step","Sorted part | unsorted part"],"rows":[["Start","24 | 11  30  8  19  15"],["Insert 11","11  24 | 30  8  19  15"],["Insert 30","11  24  30 | 8  19  15"],["Insert 8","8  11  24  30 | 19  15"],["Insert 19","8  11  19  24  30 | 15"],["Insert 15","8  11  15  19  24  30"]],"caption":"Insertion sort on the same six values"},{"t":"code","lang":"cs","code":"int[] items = { 24, 11, 30, 8, 19, 15 };\nfor (int i = 1; i < items.Length; i++)\n{\n    int current = items[i];\n    int j = i - 1;\n    while (j >= 0 && items[j] > current)\n    {\n        items[j + 1] = items[j];   // shift larger item right\n        j = j - 1;\n    }\n    items[j + 1] = current;        // insert into the gap\n}\nConsole.WriteLine(string.Join(\", \", items));","title":"Insertion sort in C#","output":"8, 11, 15, 19, 24, 30"},{"t":"h","text":"Comparing the two sorts"},{"t":"compare","head":["Bubble sort","Insertion sort"],"rows":[["Method","Compare and swap neighbours in repeated passes","Insert each item into a growing sorted section"],["Comparisons on the six values above","14 (4 passes)","12"],["Already or nearly sorted data","Quick if a swapped flag is used","Very quick: each item needs only one comparison"],["Large unsorted lists","Slow","Also slow, but usually faster than bubble"],["Memory","Sorts in place","Sorts in place"],["Ease of coding","Simplest","Simple"]]},{"t":"p","text":"Both sorts move items the same number of times on the same data, but the insertion sort usually needs **fewer comparisons**, so it is generally the more efficient of the two. For very large data sets, faster algorithms such as merge sort are used instead, though these are beyond the Unit 4 specification."},{"t":"tip","text":"In the extended question on the two sorts, describe each method in steps first, then compare them on **efficiency** (number of comparisons, nearly sorted data) and **simplicity**. A comparison with no description cannot reach the top level."},{"t":"key","title":"Key points","items":["Insertion sort: the first item is a sorted list; insert each following item into its correct place.","Larger items in the sorted part shift one place right to make a gap.","Usually fewer comparisons than a bubble sort; very fast on nearly sorted data.","Both sorts are simple and sort in place, but both are slow on large lists."]}],"diagram":{"kind":"sort","algo":"insertion","data":[24,11,30,8,19,15],"title":"Insertion sort, step by step","caption":"Same six values as the bubble sort. Step through and compare the number of comparisons at the end with the bubble sort's 14."},"check":[{"q":"What does an insertion sort do with each new item?","o":["Swaps it with the last item","Inserts it into the correct place in the sorted part","Compares it with the middle item","Moves it to the end of the list"],"a":1,"why":"Each item is inserted into the growing sorted section."},{"q":"What is the list after inserting 30 in step 2 of: 24 | 11 30 8 19 15?","o":["11 24 30 | 8 19 15","11 24 | 30 8 19 15","8 11 24 30 | 19 15","24 30 11 | 8 19 15"],"a":0,"why":"30 is larger than 24, so it stays where it is at the end of the sorted part."},{"q":"On which data does an insertion sort perform best?","o":["Data in reverse order","Data that is already nearly sorted","Data with many duplicates only","Random data"],"a":1,"why":"Each item needs only one comparison if it is already in place."},{"q":"Which statement comparing the sorts is correct?","o":["Bubble sort needs extra memory; insertion does not","Insertion sort usually makes fewer comparisons than bubble sort","Insertion sort only works on sorted data","Bubble sort is always faster"],"a":1,"why":"Insertion sort is generally more efficient."}],"exam":[{"year":2022,"paper":"Unit 4","q":"5","marks":6,"summary":"Extended writing (QWC): describe bubble sort and insertion sort and compare their efficiency.","tip":"Describe the insertion step precisely (shift larger items, insert into the gap); compare on comparisons and nearly sorted data.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"7","marks":35,"summary":"Arrays, defining pseudocode, FOR and WHILE totals, finding a minimum, bubble sort and linear and binary search.","tip":"Know which statements belong to which sort.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"}],"practice":[{"q":"Show the stages of an insertion sort on the list 9, 4, 7, 1, 6.","m":4,"a":"4 9 | 7 1 6 (1); 4 7 9 | 1 6 (1); 1 4 7 9 | 6 (1); 1 4 6 7 9 (1)."},{"q":"Describe the bubble sort and the insertion sort and compare their efficiency. (6 marks, quality of written communication)","m":6,"a":"Bubble: compare adjacent items and swap if out of order (1); repeat passes until no swaps (1). Insertion: build a sorted section; take each item and insert it in its correct place, shifting larger items (1)(1). Comparison: insertion usually makes fewer comparisons so is more efficient (1); insertion very fast on nearly sorted data / both slow on large lists / both sort in place (1). Levelled."}],"videos":[{"title":"Sorting algorithms: bubble sort and insertion sort – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D11-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"},{"title":"OCR GCSE (J277) 2.1 Insertion sort","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=2016"}],"terms":["Insertion sort"]},{"id":"c03-p06","spec":"Create and evaluate algorithms, including those for basic searching: simple searching techniques such as linear and binary searching","lessons":["D12"],"summary":"A linear search checks each item in turn from the start until the target is found or the list ends; it works on unsorted data but may need to check every item.","blocks":[{"t":"p","text":"Searching means finding whether a **target** value is in a list and, if so, where. The simplest method is the [[linear search]]."},{"t":"h","text":"How a linear search works"},{"t":"list","items":["Start at the **first** item.","Compare it with the target. If they match, report the position and **stop**.","Otherwise move to the **next** item and repeat.","If the **end of the list** is reached without a match, report that the target is not there."],"ordered":true},{"t":"code","lang":"cs","code":"static int LinearSearch(int[] items, int target)\n{\n    for (int i = 0; i < items.Length; i++)\n    {\n        if (items[i] == target)\n        {\n            return i;        // found: return the position\n        }\n    }\n    return -1;               // not found\n}\n\nint[] tickets = { 412, 87, 903, 255, 61, 730 };\nConsole.WriteLine(LinearSearch(tickets, 255));\nConsole.WriteLine(LinearSearch(tickets, 100));","title":"Linear search in C#","output":"3\n-1"},{"t":"p","text":"The function returns the [[index]] (position, starting from 0) of the target, or −1 to mean 'not found'. Using a **found flag** in a WHILE loop is an equally good design: it stops as soon as the item is found rather than always checking every item."},{"t":"code","lang":"ps","code":"found ← FALSE\nposition ← 0\nWHILE found = FALSE AND position < LENGTH(list)\n    IF list[position] = target THEN\n        found ← TRUE\n    ELSE\n        position ← position + 1\n    END IF\nEND WHILE\nIF found THEN OUTPUT \"Found at \", position ELSE OUTPUT \"Not found\"","title":"Linear search in pseudocode with a found flag"},{"t":"h","text":"Evaluating the linear search"},{"t":"list","items":["**Works on any list**, sorted or unsorted: no need to sort first.","**Simple** to understand and code.","**Slow for large lists**: on average it checks half the list, and in the worst case (target last or missing) it checks **every** item. For 1000 items that is up to 1000 comparisons."],"ordered":false},{"t":"tip","text":"A complete description of a linear search mentions the **start** (first item), the **comparison** with the target, moving to the **next** item, and **both** stopping conditions: found, or end of list."},{"t":"key","title":"Key points","items":["Check each item in turn from the start.","Stop when the target is found or the end of the list is reached.","Works on unsorted data and is simple to code.","Inefficient for large lists: up to n comparisons for n items."]}],"diagram":{"kind":"sort","algo":"linear","data":[412,87,903,255,61,730],"target":255,"title":"Linear search for 255","caption":"Step through: each item is compared with the target in turn until 255 is found at position 3 (counting from 0)."},"check":[{"q":"Which is true of a linear search?","o":["The data must be sorted first","It checks each item in turn from the start","It always checks the middle item first","It halves the list each time"],"a":1,"why":"Linear = one after another."},{"q":"What is the maximum number of comparisons a linear search makes on 500 items?","o":["9","250","500","1000"],"a":2,"why":"Worst case: every item is checked."},{"q":"When does a linear search stop?","o":["Only at the end of the list","When the target is found or the end of the list is reached","After half of the list","When it finds a larger value"],"a":1,"why":"Two stopping conditions."}],"exam":[{"year":2019,"paper":"Unit 4","q":"12","marks":8,"summary":"Linear compared with binary search, and showing the passes of a sort.","tip":"Linear works on unsorted data but is slower on large lists.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2019-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2019-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"7","marks":35,"summary":"Arrays, defining pseudocode, FOR and WHILE totals, finding a minimum, bubble sort and linear and binary search.","tip":"Describe the method and its stopping conditions.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2022,"paper":"Unit 4","q":"1(d)–(g)","marks":4,"summary":"Short questions on abstraction, decomposition, search efficiency and ASCII.","tip":"Know which search is more efficient on large, sorted lists.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"}],"practice":[{"q":"A Strabane library's catalogue is not sorted. Describe how a linear search would find a book with ID 7702.","m":3,"a":"Start with the first ID in the list (1); compare it with 7702 and if equal, stop/found (1); otherwise move to the next ID and repeat until found or the end of the list is reached (1)."},{"q":"Give one advantage and one disadvantage of a linear search.","m":2,"a":"Advantage: works on unsorted data / simple to code (1). Disadvantage: slow for large lists / may have to check every item (1)."}],"videos":[{"title":"Searching algorithms: linear and binary search – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D12-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"},{"title":"OCR GCSE (J277) 2.1 Linear search","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/ocr-gcse-j277-slr-2-1-linear-search/"}],"terms":["Linear search","Index"]},{"id":"c03-p07","spec":"Create and evaluate algorithms, including those for basic searching: simple searching techniques such as linear and binary searching","lessons":["D12"],"summary":"A binary search works only on sorted data: it checks the middle item and discards the half that cannot contain the target, halving the list each step, so it is far faster than a linear search on large lists.","blocks":[{"t":"p","text":"A [[binary search]] is much faster than a linear search, but it has one condition: **the data must already be sorted**."},{"t":"h","text":"How a binary search works"},{"t":"list","items":["Find the **middle** item of the list.","If it is the target, the search is over.","If the target is **smaller**, discard the middle item and everything **above** it; if **larger**, discard the middle item and everything **below** it.","Repeat on the half that is left.","Stop when the item is found, or when there are no items left (not found)."],"ordered":true},{"t":"example","title":"Worked example: find 40 in 3 8 12 19 27 31 40 52 61 77","steps":["Positions 0–9. Middle = (0 + 9) div 2 = 4, which holds 27. 40 > 27, so keep positions 5–9.","Middle = (5 + 9) div 2 = 7, which holds 52. 40 < 52, so keep positions 5–6.","Middle = (5 + 6) div 2 = 5, which holds 31. 40 > 31, so keep position 6.","Middle = 6, which holds 40. Found."],"answer":"Found at position 6 after 4 comparisons; a linear search would need 7."},{"t":"code","lang":"cs","code":"int[] items = { 3, 8, 12, 19, 27, 31, 40, 52, 61, 77 };\nint target = 40;\nint low = 0, high = items.Length - 1, found = -1;\nwhile (low <= high && found == -1)\n{\n    int mid = (low + high) / 2;      // integer division\n    if (items[mid] == target)\n        found = mid;\n    else if (items[mid] < target)\n        low = mid + 1;               // discard the lower half\n    else\n        high = mid - 1;              // discard the upper half\n}\nConsole.WriteLine(found == -1 ? \"Not found\" : \"Found at \" + found);","title":"Binary search in C#","output":"Found at 6"},{"t":"h","text":"Comparing the searches"},{"t":"compare","head":["Linear search","Binary search"],"rows":[["Data must be sorted?","No","Yes"],["Method","Check every item in turn","Check the middle and discard half each time"],["Worst case for 1000 items","1000 comparisons","10 comparisons"],["Worst case for 1 000 000 items","1 000 000 comparisons","20 comparisons"],["Ease of coding","Very simple","More complex"]]},{"t":"tip","text":"The condition for a binary search, **the list must be sorted**, is asked for almost every time. When tracing, write down the low, high and middle positions at each step."},{"t":"warn","text":"Do not say a binary search 'splits the list into two and searches both halves'. It **discards** one half every time; that is why it is fast."},{"t":"key","title":"Key points","items":["Binary search needs sorted data.","Check the middle item; discard the half that cannot contain the target; repeat.","Each step halves the items left, so it is very fast on large lists.","Linear search is simpler and works on unsorted data, but is slower."]}],"diagram":{"kind":"sort","algo":"binary","data":[3,8,12,19,27,31,40,52,61,77],"target":40,"title":"Binary search for 40","caption":"Step through the low, high and middle positions. Each comparison throws away half of what is left."},"check":[{"q":"What must be true before a binary search can be used?","o":["The list must contain no duplicates","The list must be sorted","The list must have an even number of items","The target must be in the list"],"a":1,"why":"Binary search relies on order to discard halves."},{"q":"In a binary search for 12 in 3 8 12 19 27 31 40, which item is checked first?","o":["3","12","19","40"],"a":2,"why":"Middle of 7 items (positions 0–6) is position 3, value 19."},{"q":"About how many comparisons does a binary search need at most for 1000 sorted items?","o":["10","100","500","1000"],"a":0,"why":"2¹⁰ = 1024, so about 10 halvings."},{"q":"The middle item is larger than the target. What happens next?","o":["Search the upper half","Search the lower half","Restart from the first item","The target is not in the list"],"a":1,"why":"The target must be below the middle item."}],"exam":[{"year":2019,"paper":"Unit 4","q":"12","marks":8,"summary":"Linear compared with binary search, and showing the passes of a sort.","tip":"Advantages of binary: far fewer comparisons on large lists; condition: sorted data.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2019-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2019-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"7","marks":35,"summary":"Arrays, defining pseudocode, FOR and WHILE totals, finding a minimum, bubble sort and linear and binary search.","tip":"Describe both searches and state the sorted-data condition.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2023,"paper":"Unit 4","q":"9","marks":18,"summary":"Arrays (update, reset to zero, find the maximum), the steps of a bubble sort and searching sorted data.","tip":"For sorted data, choose binary search and justify it with efficiency.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2022,"paper":"Unit 4","q":"1(d)–(g)","marks":4,"summary":"Short questions on abstraction, decomposition, search efficiency and ASCII.","tip":"Binary search is the more efficient on a large sorted list.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"}],"practice":[{"q":"The sorted list of membership numbers at a Newcastle (Co. Down) golf club is: 104 118 135 160 172 189 203 240 256. Show the middle value checked at each step of a binary search for 240.","m":3,"a":"172 (positions 0–8, mid 4) (1); 203 (positions 5–8, mid 6) (1); 240 (positions 7–8, mid 7), found (1)."},{"q":"Give two advantages of a binary search over a linear search, and one condition that must be met to use it.","m":3,"a":"Far fewer comparisons on large lists (1); much faster / time grows slowly as the list grows (1); the data must be sorted (1)."}],"videos":[{"title":"Searching algorithms: linear and binary search – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D12-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"},{"title":"OCR GCSE (J277) 2.1 Binary search","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=2018"}],"terms":["Binary search"]},{"id":"c03-p08","spec":"Use a dry run to test a solution","lessons":["D13"],"summary":"A dry run is working through an algorithm by hand, recording every variable and output in a trace table, to check the logic and expected output without running the program.","blocks":[{"t":"p","text":"A [[dry run]] means working through an algorithm or program **by hand, one line at a time, without a computer**, keeping track of the value of every variable. It is a form of [[desk checking]]. The record you keep is a [[trace table]]."},{"t":"h","text":"Why dry-run?"},{"t":"list","items":["It finds **logic errors**: places where the program would run but give the wrong answer.","It checks that the algorithm produces the **expected output** for chosen test data.","It can be done **at the design stage**, before any code exists, so errors are cheap to fix.","It lets you check **every path** through selection statements and the **exact number of times** a loop repeats."],"ordered":false},{"t":"h","text":"Building a trace table"},{"t":"list","items":["One column for each variable, one for any condition being tested, and one for output.","Write a new row each time a value changes.","For loops, test the condition **every** time, including the last time when it becomes false."],"ordered":false},{"t":"example","title":"Worked example: trace this algorithm","steps":["a ← 1. Check a < 20: 1 < 20 is true, so enter the loop.","a ← 1 × 2 = 2; 2 < 20 true. a ← 4; true. a ← 8; true. a ← 16; 16 < 20 true.","a ← 16 × 2 = 32; 32 < 20 is false, so leave the loop.","OUTPUT a."],"context":"a ← 1 / WHILE a < 20 / a ← a * 2 / END WHILE / OUTPUT a","answer":"Output: 32 (not 16; the loop body runs once more after 16)."},{"t":"code","lang":"cs","code":"for (int i = 5; i < 8; i++)\n{\n    Console.WriteLine(i * 3);\n}","title":"Predict the output","output":"15\n18\n21"},{"t":"p","text":"For a FOR loop, write the counter values first (here 5, 6, 7: the loop stops before 8), then the work done for each. For **nested** loops, the inner loop runs completely for **each** value of the outer loop."},{"t":"tip","text":"When asked how a dry run helps, give **two separate points**, e.g. *it finds logic errors* **and** *it checks the expected output is produced*. Examiners noted many answers made only one point."},{"t":"warn","text":"The most common trace slip is stopping a WHILE loop one step too early. Write the condition and its true/false value in its own column every time round."},{"t":"key","title":"Key points","items":["Dry run = stepping through an algorithm by hand, recording variable values.","A trace table has a column per variable, the condition and the output.","It finds logic errors and confirms the expected output before or without running code.","Check loop conditions every time, including the final false test."]}],"diagram":{"kind":"table-reveal","title":"Trace table: total of 1 to 4","caption":"total ← 0 / FOR n ← 1 TO 4 / total ← total + n / NEXT n / OUTPUT total. Predict each value, then click to check it.","head":["Line","n","total","Output"],"rows":[["total ← 0","","0",""],["n = 1","1","1",""],["n = 2","2","3",""],["n = 3","3","6",""],["n = 4","4","10",""],["OUTPUT total","","","10"]],"hidden":[[1,2],[2,2],[3,2],[4,2],[5,3]]},"check":[{"q":"What is a dry run?","o":["Running a program with no input","Working through an algorithm by hand, recording variable values","Compiling a program without errors","Testing a program on the end user's computer"],"a":1,"why":"Done by hand, line by line."},{"q":"What is the output of: x ← 3 / WHILE x < 30 / x ← x * 3 / END WHILE / OUTPUT x?","o":["9","27","81","30"],"a":2,"why":"3 → 9 → 27 → 81; 81 < 30 is false, so output 81."},{"q":"Which error type is a dry run best at finding?","o":["Syntax errors","Logic errors","Hardware faults","Spelling errors in comments"],"a":1,"why":"Logic errors give wrong results that a trace exposes."},{"q":"How many lines does for (int i = 2; i <= 10; i += 2) print?","o":["4","5","8","10"],"a":1,"why":"i = 2, 4, 6, 8, 10."}],"exam":[{"year":2025,"paper":"Unit 4","q":"5","marks":7,"summary":"Explain desk checking, complete a trace table and give the final value of a variable.","tip":"Two distinct points about a dry run; every row of the trace table correct.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2025,"paper":"Unit 4","q":"2","marks":12,"summary":"Loop output, nested loops, counting loop repetitions, an infinite loop and fixing a loop condition.","tip":"Give exactly the values the loop outputs; long or padded lists lost marks.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"1","marks":4,"summary":"Dry-run a nested IF statement in a shape calculator.","tip":"Follow each condition exactly with the given values.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"2","marks":3,"summary":"Trace the output of FOR and WHILE loops.","tip":"Write the counter values first.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2022,"paper":"Unit 4","q":"8","marks":9,"summary":"Complete a flowchart using selection and iteration, then carry out dry runs.","tip":"Record each decision outcome as you trace.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2023,"paper":"Unit 4","q":"2","marks":4,"summary":"Trace the output of nested selection statements.","tip":"Check each branch in order.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"A Craigavon shop's loyalty algorithm is: points ← 0 / FOR visit ← 1 TO 3 / points ← points + visit * 10 / NEXT visit / OUTPUT points. Complete a trace table and state the output.","m":3,"a":"visit 1: points 10 (1); visit 2: points 30, visit 3: points 60 (1); output 60 (1)."},{"q":"Explain two ways a dry run helps a programmer test a solution.","m":2,"a":"It finds logic errors by showing where values go wrong (1); it checks the algorithm gives the expected output for test data (1); it can be done before coding / without a computer (1). Any two."}],"videos":[{"title":"Dry runs, trace tables, data requirements and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D13-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"},{"title":"Cambridge IGCSE Topic 7 Trace tables","source":"Video – Craig'n'Dave","url":"https://craigndave.org/videos/cambridge-igcse-topic-7-trace-tables/"}],"terms":["Dry run","Desk checking","Trace table"]},{"id":"c03-p09","spec":"Identify data requirements for a solution and develop an appropriate user interface","lessons":["D13"],"summary":"Before coding, list every input, processed value and output with a name, data type, example and validation rule, then design a user interface with clear prompts, sensible layout and helpful messages for the intended user.","blocks":[{"t":"p","text":"Two design jobs come before any code is written: deciding **what data** the solution needs, and deciding **how the user will interact** with it."},{"t":"h","text":"Identifying data requirements"},{"t":"p","text":"[[Data requirements]] list every item of data the solution uses: the **inputs**, the values **processed or stored** along the way, and the **outputs**. For each item record a meaningful name, its data type, an example value and a validation rule. This table is often called a [[data dictionary]]."},{"t":"table","head":["Name","Purpose","Data type","Example","Validation"],"rows":[["numNights","Input: nights booked","Integer","3","Range check 1–14"],["pitchSize","Input: S, M or L","Character","M","Lookup: S, M or L only"],["equipment","Input: equipment hired?","Boolean","true","Y/N only"],["arrivalDate","Input: date of arrival","Date/time","14/07/2027","Not in the past"],["COST_PER_NIGHT","Constant used in the calculation","Real","18.50","Fixed value"],["totalCost","Output: amount to pay","Real","60.50","Calculated, not input"]],"caption":"Data requirements for a campsite booking program"},{"t":"p","text":"Working this out early means every variable has the right data type, validation is planned rather than bolted on, and the programmer knows exactly which inputs and outputs the interface must provide."},{"t":"h","text":"Developing an appropriate user interface"},{"t":"list","items":["**Clear prompts** that say what to enter and in what format, e.g. 'Arrival date (dd/mm/yyyy)'.","**Logical layout**: inputs in the order the user thinks of them; related items grouped; consistent fonts and colours.","**Suitable controls** in a GUI: a drop-down for pitch size, a tick box for equipment, a date picker for dates. These stop invalid entries being typed at all.","**Helpful error messages** that explain what went wrong and how to fix it, not just 'Error'.","**Clear output**: results labelled and formatted, e.g. 'Total to pay: £60.50'.","**Suits the target user**: age, ability, accessibility needs such as text size and colour contrast."],"ordered":false},{"t":"example","title":"Worked example: improving a prompt","steps":["Poor: `Enter:` followed by a blank. The user does not know what or how.","Better: `Number of nights (1–14):` tells the user what to type and the allowed range.","If 20 is typed: `Bookings are for 1 to 14 nights. Please try again.` explains the problem and the fix."]},{"t":"tip","text":"If asked to design or evaluate an interface, link each feature to the **user** in the scenario: 'a drop-down list for pitch size means the user cannot type an invalid size'."},{"t":"key","title":"Key points","items":["Data requirements: every input, processed/stored value and output with name, type, example and validation.","Planning data first gives correct data types and planned validation.","A good interface has clear prompts, logical layout, suitable controls, helpful messages and clear output.","Design for the intended user, including accessibility."]}],"diagram":{"kind":"compare","title":"Two interfaces for the same booking","caption":"Switch between the designs and spot what makes the second one appropriate for its users.","states":[{"label":"Poor design","points":["Prompt: 'Enter:' with no hint of what is wanted","Pitch size typed as free text, so 'medium', 'Med' and 'M' all appear","Date typed in any format","Error message: 'Invalid'","Output: '60.5'","Small grey text on a grey background"],"art":null},{"label":"Appropriate design","points":["Prompt: 'Number of nights (1–14):'","Pitch size chosen from a drop-down: Small, Medium, Large","Arrival date chosen with a date picker","Error message: 'Bookings are for 1 to 14 nights. Please try again.'","Output: 'Total to pay: £60.50'","Large, high-contrast text and a logical top-to-bottom order"],"art":null}]},"check":[{"q":"Which is part of identifying data requirements?","o":["Choosing the screen colour","Listing each input and output with its data type and validation","Compiling the program","Writing the evaluation"],"a":1,"why":"Data requirements describe every item of data."},{"q":"Which interface feature stops a user typing an invalid pitch size?","o":["A longer prompt","A drop-down list of allowed sizes","A bigger font","An output label"],"a":1,"why":"The user can only pick a valid option."},{"q":"Which is the most helpful error message for an age of 140?","o":["Error","Invalid input","Age must be from 0 to 120. Please re-enter.","Program terminated"],"a":2,"why":"It says what is wrong and how to fix it."}],"exam":[{"year":2025,"paper":"Unit 4","q":"6","marks":25,"summary":"A tent-hire algorithm, the Boolean data type, constants, validation true/false statements and a Y/N validation loop.","tip":"Identify the data each step needs and its type before writing the algorithm.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2023,"paper":"Unit 4","q":"4","marks":23,"summary":"Decomposition and abstraction in a scenario, flowchart symbols, syntax and logic errors, functions and a menu validation loop.","tip":"A clear menu with validation of the choice.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"A Kilkeel kayak-hire program needs the number of hours, whether a buoyancy aid is needed and the customer's mobile number. For each item give a suitable name, data type and validation rule.","m":6,"a":"e.g. numHours (1), integer with range check 1–8 (1); needsAid (1), Boolean / Y-N check (1); mobileNumber (1), string with length check 11 digits / format check (1)."},{"q":"Describe two features of an appropriate user interface for a program used by Year 8 pupils.","m":4,"a":"Clear prompts saying what to enter and in what format (1) so pupils know exactly what to type (1); drop-down lists/buttons instead of typing (1) which prevents invalid entries (1); helpful error messages (1) that explain how to correct a mistake (1); large clear text/simple layout (1) suited to their age (1). Any two with explanation."}],"videos":[{"title":"Dry runs, trace tables, data requirements and interfaces – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D13-video"},{"title":"Digital design principles (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zts8v9q/revision/1"}],"terms":["Data requirements","Data dictionary"]}],"topic":"T43","topicName":"Digital design principles","links":{"tests":[{"id":"TG","title":"Unit 4 test G: Digital design principles","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TG"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}},{"id":"c04","n":4,"title":"Programming constructs","intro":"The building blocks of every C# program: variables, constants and operators; input, output and assignment; sequence, selection and iteration; arrays; strings; user-defined functions; and files.","pages":[{"id":"c04-p01","spec":"Demonstrate understanding of and use the functionality of variables, constants, and Boolean and arithmetic operators","lessons":["D14"],"summary":"A variable is a named memory location whose value can change as the program runs; a constant is a named value that stays fixed, which makes code easier to read and maintain.","blocks":[{"t":"p","text":"Every program needs somewhere to keep data while it works. A [[variable]] is a named location in memory (RAM) that holds one value. The value can change as the program runs: a score goes up, a running total grows, a name is replaced by the next pupil's name."},{"t":"h","text":"Declaring and naming variables"},{"t":"list","items":["In C# you **declare** a variable by giving its data type and its [[identifier]] (name): `int tickets;` or `string surname;`.","Give it a starting value (**initialise** it) before you use it: `int total = 0;`. C# will not let you read a local variable that has never been given a value.","Use meaningful identifiers such as `totalCost` or `numPupils`, not `x` or `t`. They make the code self-explanatory and are expected in exam answers.","Identifiers cannot contain spaces or start with a digit, and C# is case-sensitive: `Total` and `total` are different variables."],"ordered":false},{"t":"h","text":"Constants"},{"t":"p","text":"A [[constant]] is a named value that is set once and cannot change while the program runs. In C# you put `const` in front of the declaration. By convention constants are written in capitals with underscores, for example `VAT_RATE`. If any line of code tries to change a constant, the program will not compile."},{"t":"code","lang":"cs","title":"Variables and a constant in action","code":"const double TICKET_PRICE = 7.5;          // constant: never changes\nint tickets = 2;                          // variable\ndouble total = tickets * TICKET_PRICE;    // 15\ntickets = tickets + 3;                    // variable changes to 5\ntotal = tickets * TICKET_PRICE;           // 37.5\nConsole.WriteLine(tickets + \" tickets cost £\" + total);","output":"5 tickets cost £37.5"},{"t":"table","head":["Benefit of a constant","Why it helps"],"rows":[["Readability","`VAT_RATE` explains itself; a bare `0.2` (a 'magic number') does not."],["Easier maintenance","If the value changes (e.g. the ticket price rises), you edit **one** line and every use updates."],["Safety","The value cannot be changed by mistake while the program runs."]],"caption":"Learn at least two of these – exam questions ask for advantages, not a definition."},{"t":"key","title":"Key points","items":["Variable: named memory location; its value **can change** during execution.","Constant: named value that **stays the same** for the whole run.","Initialise variables (e.g. `total = 0`) before use; give everything meaningful identifiers.","Constants improve readability, are changed in one place and cannot be altered by accident."]},{"t":"warn","text":"When asked for an **advantage** of a constant, many candidates just say what a constant is. 'It stays the same' earns nothing on its own – say *why that helps*, e.g. 'the VAT rate only needs to be updated in one place'."},{"t":"tip","text":"To decide whether a value should be a constant, ask: 'Could this change while one run of the program is happening?' A price list or a conversion rate – constant. A user's input, a counter or a total – variable."}],"diagram":{"kind":"table-reveal","title":"Trace table: tickets and total","caption":"Dry run the six lines of code above. Click each hidden cell to check your value. Blank cells mean the value has not changed.","head":["Line","TICKET_PRICE","tickets","total","Output"],"rows":[["1","7.5","","",""],["2","","2","",""],["3","","","15",""],["4","","5","",""],["5","","","37.5",""],["6","","","","5 tickets cost £37.5"]],"hidden":[[2,3],[3,2],[4,3],[5,4]]},"check":[{"q":"Which of these should be stored as a constant in a cinema booking program?","o":["The price of a standard ticket","The customer's name","A running total of takings","The number of seats a customer books"],"a":0,"why":"The ticket price is fixed while the program runs; the others change with every booking."},{"q":"What is a variable?","o":["A value typed in by the user","A named memory location whose value can change while the program runs","A value that can never change","A line of code that repeats"],"a":1,"why":"A variable is a named store in memory; its contents can be changed."},{"q":"Which is the best identifier for a variable holding the number of pupils on a trip?","o":["n","Number of pupils","numPupils","2pupils"],"a":2,"why":"numPupils is meaningful and legal; identifiers cannot contain spaces or start with a digit."},{"q":"A programmer stores the VAT rate as a constant. Which is an advantage?","o":["It uses less memory than a variable","It makes the program run faster","The user can change it while the program runs","If the rate changes it only needs updating in one place"],"a":3,"why":"Maintenance: one edit updates every calculation that uses the constant."}],"exam":[{"year":2019,"paper":"Unit 4","q":"2","marks":13,"summary":"Telling variables from constants in a program, comparing the two, then writing a miles-to-kilometres algorithm with a running total","tip":"Compare both ways: a variable can change during execution, a constant cannot. The algorithm marks need the total initialised to 0 before the loop.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2023,"paper":"Unit 4","q":"3","marks":12,"summary":"Data types, defining a constant and giving one benefit, then a sales total and average algorithm","tip":"A benefit must be an advantage such as 'only changed in one place', not a definition.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"6","marks":25,"summary":"Tent hire costs algorithm including the use of constants, Boolean data and validation","tip":"Give two different advantages of constants; examiners reported many answers simply restated what a constant is.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"A program for an Armagh bowling alley stores the price of a game (£6.50) and the number of games a customer plays. State which should be a variable and which should be a constant, and justify each choice.","m":4,"a":"Price of a game – constant (1) because it stays the same while the program runs / is the same for every customer (1). Number of games – variable (1) because it is input and changes from customer to customer (1)."},{"q":"Give two advantages of using a constant for the VAT rate in a shop's billing program.","m":2,"a":"Any two: if the rate changes it only has to be edited in one place (1) / the name makes the code easier to read than the number 0.2 (1) / it cannot be changed accidentally while the program runs (1)."}],"videos":[{"title":"Variables, constants, operators, input, output and assignment – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D14-video"},{"title":"Programming constructs (CCEA) – revision guide","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/1"}],"terms":["Variable","Identifier","Constant"]},{"id":"c04-p02","spec":"Demonstrate understanding of and use the functionality of variables, constants, and Boolean and arithmetic operators","lessons":["D14"],"summary":"Arithmetic operators calculate (+ − * / DIV MOD powers), relational operators compare two values, and Boolean operators AND, OR and NOT combine conditions.","blocks":[{"t":"p","text":"An operator is a symbol that tells the program to do something with values. You need three families: [[arithmetic operators|Arithmetic operator]] for calculations, [[relational operators|Relational operator]] for comparisons and [[Boolean operators|Boolean operator]] for combining conditions."},{"t":"h","text":"Arithmetic operators"},{"t":"table","head":["Operation","Pseudocode","C#","Example → result"],"rows":[["Add, subtract","+  −","+  -","`7 + 2` → 9"],["Multiply","*","*","`7 * 2` → 14"],["Divide","/","/ (at least one value a double)","`7.0 / 2` → 3.5"],["Integer division","DIV","/ (both values int)","`7 / 2` → 3"],["Modulus (remainder)","MOD","%","`7 % 2` → 1"],["Power (exponent)","^","`Math.Pow(x, y)`","`Math.Pow(2, 3)` → 8"]]},{"t":"p","text":"[[DIV]] gives the whole number of times one number goes into another and throws the remainder away. [[MOD]] gives only the remainder. Together they solve 'how many full groups and how many left over' problems. Calculations follow the usual order: brackets, powers, multiply and divide, then add and subtract."},{"t":"example","title":"Worked example: minibuses for a school trip","context":"47 pupils are going to the Ulster Folk Museum. Each minibus seats 12.","steps":["Full minibuses = 47 DIV 12 = 3 (3 × 12 = 36).","Pupils left over = 47 MOD 12 = 11 (47 − 36).","So 4 minibuses are needed: 3 full ones and one carrying 11.","In C#: `int buses = 47 / 12;` and `int leftOver = 47 % 12;`"],"answer":"47 DIV 12 = 3, 47 MOD 12 = 11"},{"t":"tip","text":"`n MOD 2 = 0` is the standard test for an even number. MOD is also used to check whether one number divides exactly into another."},{"t":"h","text":"Relational and Boolean operators"},{"t":"list","items":["Relational operators compare two values and give **True** or **False**: `==` equal to, `!=` not equal to, `<`, `>`, `<=`, `>=`.","Boolean operators combine conditions: `&&` (AND – both must be true), `||` (OR – at least one true), `!` (NOT – reverses the result).","Example: `age >= 11 && age <= 18` is True only for ages 11 to 18 inclusive."],"ordered":false},{"t":"warn","text":"In C#, `=` **assigns** a value and `==` **compares** two values. Writing `if (score = 10)` is a syntax error. Also, dividing two `int` values in C# silently performs DIV: `250 / 3` gives 83, not 83.33."},{"t":"key","title":"Key points","items":["DIV = whole-number part of a division; MOD = remainder.","In C#, `/` with two ints is DIV; `%` is MOD; powers use `Math.Pow`.","Relational operators give True/False; AND, OR and NOT combine conditions."]}],"diagram":{"kind":"table-reveal","title":"Evaluate the expressions","caption":"Work out each result, then click the cell to check. In C#, numbers without a decimal point are ints.","head":["C# expression","Pseudocode","Result"],"rows":[["17 / 5","17 DIV 5","3"],["17 % 5","17 MOD 5","2"],["17.0 / 5","17 / 5","3.4"],["Math.Pow(2, 5)","2 ^ 5","32"],["3 + 4 * 2","3 + 4 * 2","11"],["(3 + 4) * 2","(3 + 4) * 2","14"],["14 > 9 && 3 == 4","14 > 9 AND 3 = 4","False"],["7 != 7 || 8 >= 8","7 ≠ 7 OR 8 ≥ 8","True"],["!(5 < 2)","NOT (5 < 2)","True"]],"hidden":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],[8,2]]},"check":[{"q":"What is 23 MOD 5?","o":["3","4.6","5","4"],"a":0,"why":"5 goes into 23 four times (20) with 3 left over; MOD gives the remainder."},{"q":"In C#, what is the value of 9 / 2 when both values are int?","o":["5","4","1","4.5"],"a":1,"why":"Integer division discards the remainder, so 9 / 2 is 4."},{"q":"Which condition is True only when temp is between 5 and 25 inclusive?","o":["temp > 5 && temp < 25","temp >= 5 || temp <= 25","temp >= 5 && temp <= 25","temp == 5 && temp == 25"],"a":2,"why":"Both limits must hold (AND), and inclusive limits need >= and <=. The OR version is true for every number."},{"q":"Which C# operator tests whether two values are equal?","o":["!=","=>","=","=="],"a":3,"why":"== compares; = assigns."}],"exam":[{"year":2025,"paper":"Unit 4","q":"1","marks":5,"summary":"Short questions including a string data type, evaluating a compound AND condition, the output of an IF statement and a NOT/AND table","tip":"Evaluate each part of a compound condition separately, then combine: AND needs both parts true.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"Egg boxes hold 6 eggs. A farm in Tyrone collects 152 eggs. Using DIV and MOD, write two pseudocode statements to calculate the number of full boxes and the number of eggs left over, and state both results.","m":4,"a":"fullBoxes ← 152 DIV 6 (1) / leftOver ← 152 MOD 6 (1) / fullBoxes = 25 (1) / leftOver = 2 (1)."},{"q":"Explain the difference between = and == in C#.","m":2,"a":"= assigns/stores a value in a variable (1); == compares two values and gives True or False (1)."}],"videos":[{"title":"Variables, constants, operators, input, output and assignment – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D14-video"},{"title":"Programming constructs (CCEA) – revision guide","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/1"}],"terms":["Arithmetic operator","DIV","MOD","Relational operator","Boolean operator"]},{"id":"c04-p03","spec":"Input, output and assignment statements","lessons":["D14"],"summary":"Input statements take data from the user into a variable, assignment statements store a value in a variable, and output statements display results.","blocks":[{"t":"p","text":"Almost every program follows the pattern **input → process → output**. Three kinds of statement make that happen."},{"t":"table","head":["Statement","What it does","Pseudocode","C#"],"rows":[["[[Input]]","Takes data from the user (usually the keyboard) and stores it in a variable","INPUT miles","`string s = Console.ReadLine();`"],["[[Assignment]]","Stores a value, or the result of a calculation, in a variable","km ← miles * 1.609","`km = miles * 1.609;`"],["[[Output]]","Displays data or results on the screen","OUTPUT km","`Console.WriteLine(km);`"]]},{"t":"h","text":"Input needs converting"},{"t":"p","text":"`Console.ReadLine()` always returns text (a string). To do arithmetic with it you must convert it: `Convert.ToInt32(...)` for whole numbers and `Convert.ToDouble(...)` for decimals. `Console.Write` shows a prompt and leaves the cursor on the same line; `Console.WriteLine` moves to a new line afterwards."},{"t":"code","lang":"cs","title":"Input, assignment and output together","code":"const double MILES_TO_KM = 1.609;\nConsole.Write(\"Name: \");\nstring name = Console.ReadLine();                        // input\nConsole.Write(\"Miles walked: \");\ndouble miles = Convert.ToDouble(Console.ReadLine());      // input + conversion\ndouble km = miles * MILES_TO_KM;                          // assignment\nConsole.WriteLine(name + \" walked \" + Math.Round(km, 2) + \" km\");   // output","output":"Name: Orla\nMiles walked: 3\nOrla walked 4.83 km"},{"t":"h","text":"Reading an assignment"},{"t":"p","text":"An assignment is read **right to left**: the expression on the right is worked out first, then the result is stored in the variable on the left, replacing what was there. That is why `count = count + 1` makes sense – it takes the current value, adds 1 and stores the answer back in `count`. In pseudocode the arrow `←` shows this direction clearly."},{"t":"p","text":"Joining text and values in an output, as in `name + \" walked \"`, is called [[concatenation]]. C# converts the number to text automatically when it is joined to a string."},{"t":"key","title":"Key points","items":["Input: user → variable. Assignment: value → variable. Output: value → screen.","Convert keyboard input with `Convert.ToInt32` or `Convert.ToDouble` before calculating.","Assignment works right to left; every C# statement ends with a semicolon."]},{"t":"tip","text":"In algorithm questions, use the variable names given in the question and remember the final OUTPUT statement – it is usually worth a mark of its own. Write calculations with variable names (`total ← nights * hireCost`), not with the numbers from the example."}],"diagram":{"kind":"flow","title":"Input – process – output","direction":"tb","caption":"Step through the walking-distance program to see which statement does which job.","nodes":[{"id":"s","label":"Start","detail":"The constant MILES_TO_KM is set to 1.609.","shape":"start"},{"id":"i1","label":"INPUT name","detail":"Console.ReadLine() returns text such as \"Orla\"; it is assigned to name.","shape":"io"},{"id":"i2","label":"INPUT miles","detail":"The text \"3\" is converted with Convert.ToDouble and stored in miles as 3.","shape":"io"},{"id":"p","label":"km ← miles * MILES_TO_KM","detail":"Assignment: 3 × 1.609 = 4.827 is worked out, then stored in km.","shape":"process"},{"id":"o","label":"OUTPUT name, km","detail":"Concatenation builds \"Orla walked 4.83 km\" (km rounded to 2 decimal places).","shape":"io"},{"id":"e","label":"End","detail":"The program finishes; the variables are lost because RAM is volatile.","shape":"end"}],"edges":[["s","i1"],["i1","i2"],["i2","p"],["p","o"],["o","e"]]},"check":[{"q":"Which statement is an assignment?","o":["total ← price * quantity","IF total > 10 THEN","OUTPUT total","INPUT total"],"a":0,"why":"Assignment stores the result of the right-hand side in a variable."},{"q":"What type of value does Console.ReadLine() return?","o":["double","string","bool","int"],"a":1,"why":"It always returns text, which you convert if you need a number."},{"q":"count is 4. After count = count + 1 runs, count holds…","o":["count + 1","4","5","1"],"a":2,"why":"The right side (4 + 1) is worked out first, then stored back in count."}],"exam":[{"year":2023,"paper":"Unit 4","q":"3","marks":12,"summary":"Data types and constants, then an algorithm that inputs sales figures and outputs their total and average","tip":"Credit went for initialising the total, the input inside the loop, the assignment that adds to the total and the output statements after the loop.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"Write pseudocode that inputs the length and width of a classroom in metres and outputs its area.","m":3,"a":"INPUT length, INPUT width (1) / area ← length * width (1) / OUTPUT area (1)."},{"q":"A pupil writes `int age = Console.ReadLine();` in C#. Explain why this will not work and write a corrected statement.","m":2,"a":"ReadLine returns a string, which cannot be stored in an int variable (1) / int age = Convert.ToInt32(Console.ReadLine()); (1)."}],"videos":[{"title":"Variables, constants, operators, input, output and assignment – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D14-video"},{"title":"Programming constructs (CCEA) – revision guide","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/1"}],"terms":["Input","Assignment","Output","Concatenation"]},{"id":"c04-p04","spec":"Controlling the flow of a program through sequence, selection and iteration","lessons":["D15"],"summary":"Sequence runs statements in order; selection uses IF, ELSE IF and ELSE (including nested IFs) to choose which statements run depending on whether a condition is True.","blocks":[{"t":"p","text":"Programs are built from three control structures: [[sequence]], [[selection]] and [[iteration]]. Sequence means statements are carried out one after another in the order written – so order matters: a total must be calculated before it is output. Selection lets the program choose a path."},{"t":"h","text":"IF, IF–ELSE and ELSE IF"},{"t":"p","text":"An IF statement tests a condition (an expression that is True or False). If it is True, the block in curly brackets runs. An ELSE block gives the alternative when the condition is False. An ELSE IF chain checks several conditions **in order**; only the first True branch runs and the rest are skipped, so later conditions do not need to repeat earlier checks."},{"t":"code","lang":"cs","title":"Kayak hire on Lough Erne: tiered pricing","code":"Console.Write(\"Hours booked: \");\nint hours = Convert.ToInt32(Console.ReadLine());\nint rate;\nif (hours <= 2)\n{\n    rate = 12;\n}\nelse if (hours <= 5)\n{\n    rate = 10;\n}\nelse\n{\n    rate = 8;\n}\nint cost = hours * rate;\nConsole.WriteLine(\"Cost: £\" + cost);","output":"Hours booked: 4\nCost: £40"},{"t":"p","text":"For 4 hours, `hours <= 2` is False, so the program moves on; `hours <= 5` is True, so the rate is 10 and the ELSE is skipped. Cost = 4 × 10 = £40. For 6 hours both tests are False, so the ELSE sets the rate to 8: £48."},{"t":"h","text":"Nested IF"},{"t":"p","text":"A [[nested IF]] is an IF inside another IF. The inner condition is only tested when the outer one is True – useful when a second decision depends on the first."},{"t":"code","lang":"ps","title":"Nested IF in pseudocode","code":"INPUT member\nINPUT age\nIF member = \"Y\" THEN\n    IF age < 18 THEN\n        OUTPUT \"Junior member: £3\"\n    ELSE\n        OUTPUT \"Member: £5\"\n    END IF\nELSE\n    OUTPUT \"Visitor: £8\"\nEND IF"},{"t":"tip","text":"If a question says **use only one condition in each IF**, obey it: write separate IFs such as `IF numPupils < 20 THEN … END IF` and `IF numPupils >= 20 THEN … END IF`. Tick off every bullet point in the question – each one usually maps to a mark."},{"t":"warn","text":"Check boundaries: `>` and `>=` give different results at the limit. Test a value from every band and the values on each boundary (here 2, 3, 5 and 6 hours)."},{"t":"key","title":"Key points","items":["Sequence: statements run in order. Selection: a condition decides which statements run.","ELSE IF conditions are checked top to bottom; only the first True branch runs; ELSE has no condition.","A nested IF is only reached when the outer condition is True."]}],"diagram":{"kind":"flow","title":"Kayak hire pricing","direction":"tb","caption":"Step through the ELSE IF chain. Try it for 2, 4 and 6 hours.","nodes":[{"id":"s","label":"Start","detail":"","shape":"start"},{"id":"in","label":"INPUT hours","detail":"Converted to an int.","shape":"io"},{"id":"d1","label":"hours <= 2?","detail":"First condition. For 2 hours this is True.","shape":"decision"},{"id":"r1","label":"rate ← 12","detail":"Up to 2 hours: £12 per hour.","shape":"process"},{"id":"d2","label":"hours <= 5?","detail":"Only reached when hours > 2, so this branch covers 3–5 hours.","shape":"decision"},{"id":"r2","label":"rate ← 10","detail":"3 to 5 hours: £10 per hour.","shape":"process"},{"id":"r3","label":"rate ← 8","detail":"The ELSE branch: more than 5 hours, £8 per hour.","shape":"process"},{"id":"c","label":"cost ← hours * rate","detail":"Sequence resumes: the same calculation for every branch.","shape":"process"},{"id":"o","label":"OUTPUT cost","detail":"2 h → £24, 4 h → £40, 6 h → £48.","shape":"io"},{"id":"e","label":"End","detail":"","shape":"end"}],"edges":[["s","in"],["in","d1"],["d1","r1","yes"],["d1","d2","no"],["d2","r2","yes"],["d2","r3","no"],["r1","c"],["r2","c"],["r3","c"],["c","o"],["o","e"]]},"check":[{"q":"x = 7. IF x > 10 THEN OUTPUT \"A\" ELSE IF x > 5 THEN OUTPUT \"B\" ELSE OUTPUT \"C\". What is output?","o":["C","B and C","A","B"],"a":3,"why":"x > 10 is False; x > 5 is True, so B is output and the ELSE is skipped."},{"q":"In an ELSE IF chain, how many branches run?","o":["Only the first branch whose condition is True (or the ELSE)","All of them","None, unless there is an ELSE","Every branch whose condition is True"],"a":0,"why":"Once a True condition is found, the rest of the chain is skipped."},{"q":"Which construct runs statements one after another in the order written?","o":["Iteration","Sequence","Nesting","Selection"],"a":1,"why":"That is the definition of sequence."},{"q":"Using the kayak program, what does 5 hours cost?","o":["£25","£40","£50","£60"],"a":2,"why":"5 <= 5 is True so the rate is £10: 5 × 10 = £50."}],"exam":[{"year":2019,"paper":"Unit 4","q":"4","marks":3,"summary":"Describing sequence, selection and iteration","tip":"One clear sentence for each construct: in order / choosing a path using a condition / repeating.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2023,"paper":"Unit 4","q":"2","marks":4,"summary":"Dry running nested selection to predict outputs","tip":"Follow the outer condition first; the inner IF is only reached when the outer one is True.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"1","marks":4,"summary":"Dry running a nested IF in a shape calculator","tip":"Work through the conditions with the given values in order, writing down which branch runs.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2022,"paper":"Unit 4","q":"4","marks":17,"summary":"Tiered pricing algorithm, a validation loop for 1–50, data types and string functions","tip":"Each price band needs a correctly bounded condition; calculate the total using variable names and output it.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"3","marks":15,"summary":"Musician hire cost algorithm using one condition per IF, plus variables, data types and errors","tip":"Examiners penalised IFs with two conditions when the question said one; include the calculation and output after the IFs.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"A cinema in Omagh charges £6 for a child (under 16) and £9 for an adult. On Tuesdays every ticket is £5. Write pseudocode that inputs the day and age and outputs the price, using a nested IF.","m":5,"a":"INPUT day and INPUT age (1) / IF day = \"Tuesday\" THEN price ← 5 (1) / ELSE nested IF age < 16 THEN price ← 6 (1) / ELSE price ← 9, END IFs closed correctly (1) / OUTPUT price (1)."},{"q":"Explain why the order of conditions matters in an ELSE IF chain.","m":2,"a":"Conditions are tested from the top and only the first True branch runs (1); if a wider condition such as hours <= 5 came first, values meant for the narrower band (hours <= 2) would never reach it (1)."}],"videos":[{"title":"Selection: IF, ELSE IF and nested IF – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D15-video"},{"title":"Programming constructs (CCEA) – program flow","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/4"}],"terms":["Sequence","Selection","Iteration","Nested IF"]},{"id":"c04-p05","spec":"Controlling the flow of a program through sequence, selection and iteration","lessons":["D16"],"summary":"Iteration repeats code: FOR loops repeat a set number of times, WHILE loops repeat while a condition is True (and may run zero times), and REPEAT…UNTIL / do…while always runs at least once.","blocks":[{"t":"p","text":"[[Iteration]] means repeating a block of code. Instead of writing the same lines ten times, you write them once inside a loop. There are two kinds."},{"t":"compare","head":["Count-controlled (bounded)","Condition-controlled (unbounded)"],"rows":[["Repeats","A known number of times","Until a condition changes"],["Loop","FOR","WHILE, REPEAT…UNTIL (C#: do…while)"],["Example","Input 5 marks","Keep reading scores until −1 is typed"]]},{"t":"code","lang":"cs","title":"FOR loop: total five marks","code":"int total = 0;\nfor (int count = 1; count <= 5; count++)\n{\n    Console.Write(\"Mark: \");\n    int mark = Convert.ToInt32(Console.ReadLine());\n    total = total + mark;\n}\nConsole.WriteLine(\"Average: \" + (double)total / 5);"},{"t":"h","text":"WHILE loops and sentinel values"},{"t":"p","text":"A WHILE loop checks its condition **before** each repetition, so it may run zero times. Something inside the loop must eventually make the condition False. A [[sentinel value]] is a special input, such as −1, that tells the loop the data has finished."},{"t":"code","lang":"cs","title":"WHILE loop with a sentinel, a running total and a counter","code":"int count = 0;\nint total = 0;\nConsole.Write(\"Score (-1 to stop): \");\nint score = Convert.ToInt32(Console.ReadLine());\nwhile (score != -1)\n{\n    total = total + score;\n    count = count + 1;\n    Console.Write(\"Score (-1 to stop): \");\n    score = Convert.ToInt32(Console.ReadLine());\n}\nConsole.WriteLine(count + \" scores, total \" + total);","output":"Score (-1 to stop): 8\nScore (-1 to stop): 5\nScore (-1 to stop): -1\n2 scores, total 13"},{"t":"p","text":"REPEAT…UNTIL tests at the **end**, so the body always runs at least once – ideal for 'ask, then check'. C# writes it as `do { … } while (condition);`, which repeats **while** the condition is True, so the condition is the opposite of the UNTIL one."},{"t":"list","items":["[[Running total|Running total]]: initialise `total = 0` before the loop, add inside it.","Counter: `count = count + 1` inside the loop, often inside an IF to count only matching items.","Calculations that use the final total (such as an average) and final outputs go **after** the loop."],"ordered":false},{"t":"warn","text":"An [[infinite loop]] never stops because its condition never becomes False – for example the loop forgets to input the next value, or the test can never be met: `x = 10; while (x != 0) { x = x - 3; }` jumps from 1 to −2 and never equals 0. Off-by-one errors are common too: `for (int i = 1; i < 10; i++)` stops at 9, not 10."},{"t":"key","title":"Key points","items":["FOR = count-controlled; WHILE and REPEAT = condition-controlled.","WHILE tests first (0 or more runs); REPEAT…UNTIL/do…while tests last (1 or more runs).","Initialise before, update inside, output after the loop."]}],"diagram":{"kind":"table-reveal","title":"Trace table: a FOR loop","caption":"Code: int total = 0; for (int i = 1; i <= 4; i++) { total = total + i * 2; } Console.WriteLine(total); – click each hidden cell to check your trace.","head":["i","i <= 4?","total","Output"],"rows":[["–","–","0",""],["1","True","2",""],["2","True","6",""],["3","True","12",""],["4","True","20",""],["5","False","20",""],["","","","20"]],"hidden":[[1,2],[2,2],[3,2],[4,2],[5,0],[5,1],[6,3]]},"check":[{"q":"How many times does for (int i = 3; i < 7; i++) run its body?","o":["5","7","3","4"],"a":3,"why":"i takes the values 3, 4, 5 and 6."},{"q":"Which loop always runs its body at least once?","o":["REPEAT…UNTIL / do…while","None of them","FOR","WHILE"],"a":0,"why":"The condition is tested at the end, after the first run."},{"q":"x = 10. WHILE x > 0: x = x − 3. After the loop, x is…","o":["1","−2","−1","0"],"a":1,"why":"x goes 10, 7, 4, 1, −2; −2 > 0 is False so the loop stops."},{"q":"Where should the statement that outputs a final total be placed?","o":["Inside the loop condition","Inside the loop","After the loop","Before the loop"],"a":2,"why":"Output inside the loop prints a partial total every time round."}],"exam":[{"year":2019,"paper":"Unit 4","q":"2","marks":13,"summary":"Variables and constants, then a miles-to-km algorithm with a loop and running total","tip":"Initialise the total to 0 before the loop, add to it inside, and output after the loop.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2024,"paper":"Unit 4","q":"2","marks":3,"summary":"Tracing FOR and WHILE loops to predict their outputs","tip":"Track the loop variable each time round and check the condition before each repetition.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"2","marks":12,"summary":"Loop output, nested loops, counting repetitions, an infinite loop and fixing a loop condition","tip":"Explain why the condition never becomes False, then give a corrected condition that uses the right comparison.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"},{"year":2023,"paper":"Unit 4","q":"3","marks":12,"summary":"An algorithm to total and average sales figures","tip":"Outputs placed inside the loop did not get credit; divide by the number of items after the loop.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"Write pseudocode that inputs numbers until 0 is entered and then outputs how many numbers were entered and their total.","m":5,"a":"count ← 0 and total ← 0 before the loop (1) / INPUT number before the loop (1) / WHILE number ≠ 0 (1) / inside: total ← total + number, count ← count + 1, INPUT number (1) / after END WHILE: OUTPUT count and total (1)."},{"q":"Describe the difference between a WHILE loop and a REPEAT…UNTIL loop.","m":2,"a":"A WHILE loop tests its condition at the start, so it may not run at all (1); REPEAT…UNTIL tests at the end, so it always runs at least once (1)."}],"videos":[{"title":"Iteration: FOR, WHILE and REPEAT loops – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D16-video"},{"title":"Programming constructs (CCEA) – iteration","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zs3qrwx/revision/5"}],"terms":["Iteration","Count-controlled loop","Condition-controlled loop","Sentinel value","Running total","Infinite loop"]},{"id":"c04-p06","spec":"One-dimensional array structures","lessons":["D17"],"summary":"A one-dimensional array stores many values of the same data type under one identifier; each element is reached by its index, starting at 0, and loops process every element.","blocks":[{"t":"p","text":"Suppose a car park counts cars every day for a week. Seven separate variables (`day1`, `day2`…) would be clumsy, and a loop could not process them. An [[array]] solves this: it is a data structure that holds a collection of values of the **same data type** under **one identifier**."},{"t":"list","items":["Each value is an [[element]].","Its position is its [[index]]. Arrays in C# are **zero-indexed**: the first element is `cars[0]` and the last element of a 7-element array is `cars[6]`.","The index is the position, **not** the value stored there.","In C# an array has a fixed size set when it is created; `cars.Length` gives the number of elements. The elements can be changed at any time."],"ordered":false},{"t":"code","lang":"cs","title":"Creating, reading and updating an array","code":"int[] votes = { 12, 30, 25, 18, 27 };   // 5 elements, indexes 0-4\nConsole.WriteLine(votes[0]);            // 12 (first element)\nConsole.WriteLine(votes[4]);            // 27 (last element)\nvotes[2] = 26;                          // update the third element\nConsole.WriteLine(votes.Length);        // 5\nstring[] names = new string[3];         // 3 empty elements\nnames[0] = \"Ciara\";"},{"t":"h","text":"Processing an array with a loop"},{"t":"p","text":"The real power comes from a loop whose counter is used as the index. A FOR loop from 0 to `Length - 1` visits every element. The same pattern can set every element to 0 (initialise), total the elements, count elements that meet a condition, or find the largest or smallest value."},{"t":"code","lang":"cs","title":"Total, average and count","code":"int[] cars = { 120, 95, 143, 101, 88, 60, 72 };\nint total = 0;\nint busyDays = 0;\nfor (int i = 0; i < cars.Length; i++)\n{\n    total = total + cars[i];\n    if (cars[i] > 100)\n    {\n        busyDays = busyDays + 1;\n    }\n}\nConsole.WriteLine(\"Total: \" + total);\nConsole.WriteLine(\"Average: \" + (double)total / cars.Length);\nConsole.WriteLine(\"Busy days: \" + busyDays);","output":"Total: 679\nAverage: 97\nBusy days: 3"},{"t":"h","text":"Finding the maximum: the 'best so far' pattern"},{"t":"code","lang":"cs","code":"int[] heights = { 151, 163, 148, 170, 159 };\nint tallest = heights[0];\nfor (int i = 1; i < heights.Length; i++)\n{\n    if (heights[i] > tallest)\n    {\n        tallest = heights[i];\n    }\n}\nConsole.WriteLine(\"Tallest: \" + tallest);","output":"Tallest: 170"},{"t":"p","text":"Start with the first element as the best so far, then compare each remaining element and replace the best when a bigger one is found. Starting at 0 instead would fail for a minimum, or if every value were negative. A WHILE loop works too: set `i = 0`, loop `while (i < cars.Length)` and add `i = i + 1` at the end of the body."},{"t":"warn","text":"Common errors: using `i <= cars.Le
