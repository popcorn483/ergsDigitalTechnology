ept or reject correctly.","Try unexpected actions: letters in number fields, very long text, pressing Enter on a blank prompt, deleting the data file.","**[[High-volume testing]]**: enter or load large amounts of data to check the system still performs and does not fail.","Check that error messages are helpful and the user can recover."],"ordered":false},{"t":"compare","head":["Efficient","Robust"],"rows":[["Question","Does it work without wasting time, resources or effort?","Does it keep working with bad, unexpected or large amounts of data?"],["Evidence","Response times, number of steps, code structure","Invalid/extreme/null and high-volume test results; no crashes"],["Improved by","Loops, arrays, functions, simpler interface","Validation, error trapping, testing every path"]]},{"t":"key","title":"Key points","items":["Efficient: fast, economical with resources and with the user's effort.","Robust: copes with invalid, unexpected and high volumes of data without failing.","Both are judged with evidence from testing."]},{"t":"tip","text":"For 'how could robustness be tested?', refer to at least **two** kinds of data (e.g. invalid and high volumes) and say what result would show the system is robust – it rejects the bad data with a message and does not crash."}],"diagram":{"kind":"compare","title":"Four evaluation questions","caption":"Toggle through the four things evaluation must check, with the evidence for each.","states":[{"label":"Meets design criteria","points":["Does it do what the requirements and design said?","Each criterion: fully / partly / not met","Evidence: test results, client sign-off"],"art":null},{"label":"Full and complete","points":["Are all required features present and working?","Missing features listed against the requirements","Evidence: every function in the test plan passed"],"art":null},{"label":"Efficient","points":["Fast responses; no wasted resources","Few steps for the user","Code uses loops, arrays and reusable functions"],"art":null},{"label":"Robust","points":["Copes with invalid, extreme, null and unexpected data","Survives high volumes of data","Validation and error trapping prevent crashes"],"art":null}]},"check":[{"q":"Which describes a robust solution?","o":["It was written quickly","It uses few lines of code","It has a colourful interface","It copes with invalid and unexpected data without crashing"],"a":3,"why":"Robustness is about handling errors and unexpected input."},{"q":"Which change makes a program more efficient?","o":["Replacing seven separate variables and additions with an array and a loop","Adding more screens before each task","Removing validation","Copying the same code into five places"],"a":0,"why":"Arrays and loops avoid repetition and scale to any amount of data."},{"q":"Which test is designed to check robustness?","o":["Entering one typical value","Entering large volumes of valid, invalid and unexpected data","Reading the code","Asking the client their favourite colour"],"a":1,"why":"Robustness testing uses large volumes and bad data."},{"q":"A program accepts letters in a number field and then crashes. What does this show?","o":["It has a syntax error","It is not efficient","It is not robust","It is complete"],"a":2,"why":"Failing on unexpected input means it is not robust."}],"exam":[{"year":2022,"paper":"Unit 4","q":"11","marks":7,"summary":"Judging evaluation statements and explaining complete, robust and efficient solutions","tip":"Define each quality with a link to the scenario, e.g. robust = handles invalid data without crashing.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"9","marks":7,"summary":"Evaluation and how the robustness of a solution can be tested","tip":"Mention testing with high volumes and with invalid/unexpected data, and the expected result.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"},{"year":2025,"paper":"Unit 4","q":"10","marks":4,"summary":"How user requirements help when features are missing, and testing robustness","tip":"Refer to at least two kinds of data when describing robustness testing.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes"}],"practice":[{"q":"Describe how a developer could test the robustness of a booking system for a Carrickfergus bowling club.","m":2,"a":"Enter invalid/unexpected data, e.g. letters for the number of players or a blank name, and check it is rejected without crashing (1) / enter or load a high volume of bookings and check the system still works correctly (1)."},{"q":"Explain what is meant by an efficient solution.","m":2,"a":"It carries out its tasks quickly/with acceptable response times (1) without wasting resources such as memory or processing, or the user's time, e.g. few steps for each task (1)."}],"videos":[{"title":"Evaluating a solution – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D23-video"},{"title":"Developing test plans and testing a solution (CCEA) – evaluating coded solutions","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/z9jf2nb/revision/4"}],"terms":["Efficient solution","Robustness","High-volume testing"]}],"topic":"T47","topicName":"Evaluation of digitally authored systems","links":{"tests":[{"id":"TH","title":"Unit 4 test H: Programming, errors, testing and evaluation","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TH"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}}],"glossary":[{"term":"Abstraction","def":"Removing or hiding details of a problem that are not needed to solve it, so the focus is on what is important.","alt":"","page":"c03-p01"},{"term":"Algorithm","def":"A precise, step-by-step set of instructions that solves a problem.","alt":"","page":"c03-p01"},{"term":"Arithmetic operator","def":"A symbol that performs a calculation: + (add), − (subtract), * (multiply), / (divide), DIV, MOD and ^ (power).","alt":"","page":"c04-p02"},{"term":"Array","def":"A data structure that stores a fixed number of values of the same data type under a single identifier, each accessed by its index.","alt":"List (in pseudocode)","page":"c04-p06"},{"term":"ASCII","def":"American Standard Code for Information Interchange: a character set using 7 bits (128 characters) or 8 bits in extended ASCII (256 characters), mainly for English.","alt":"","page":"c02-p06"},{"term":"Assignment","def":"A statement that stores a value, or the result of an expression, in a variable (← in pseudocode, = in C#).","alt":"","page":"c04-p03"},{"term":"Binary","def":"The base-2 number system, using only the digits 0 and 1, with each column worth twice the column to its right.","alt":"base 2","page":"c02-p01"},{"term":"Binary search","def":"A search of a sorted list that repeatedly checks the middle item and discards the half that cannot contain the target.","alt":"","page":"c03-p07"},{"term":"Bit","def":"A single binary digit, 0 or 1; the smallest unit of data.","alt":"binary digit","page":"c02-p01"},{"term":"Black box testing","def":"Testing that checks the outputs produced for given inputs against the requirements, without looking at the code; often done by independent testers or users.","alt":"Functional testing","page":"c06-p01"},{"term":"Boolean","def":"A data type with only two possible values, true or false.","alt":"bool","page":"c02-p07"},{"term":"Boolean operator","def":"An operator that combines or reverses Boolean values: AND (true only if both inputs are true), OR (true if at least one is true) and NOT (reverses the input).","alt":"logical operator","page":"c02-p08"},{"term":"Breakpoint","def":"A marker set in an IDE that pauses execution at a chosen line so the programmer can inspect variable values and step through the code.","alt":"","page":"c01-p03"},{"term":"Bubble sort","def":"A sort that repeatedly passes through a list comparing adjacent items and swapping them if they are in the wrong order, until a pass makes no swaps.","alt":"","page":"c03-p04"},{"term":"Built-in function","def":"A function provided by the programming language or its libraries, e.g. Math.Round or Convert.ToInt32, that the programmer can call without writing it.","alt":"Library function","page":"c04-p08"},{"term":"Byte","def":"A group of 8 bits; it can store 256 different values (0–255) or one ASCII character.","alt":"","page":"c02-p01"},{"term":"Carry","def":"The digit passed to the next column on the left when a column total in binary addition is 2 or more.","alt":"","page":"c02-p05"},{"term":"Character","def":"A data type for a single letter, digit or symbol.","alt":"char","page":"c02-p07"},{"term":"Character set","def":"A defined list of characters that a computer recognises, each with its own unique binary code.","alt":"","page":"c02-p06"},{"term":"Class","def":"A blueprint or template that defines the properties and methods that objects of that type will have.","alt":"template for objects","page":"c01-p02"},{"term":"Code outlining","def":"An editor feature that lets blocks of code be collapsed and expanded to make long programs easier to navigate.","alt":"","page":"c01-p03"},{"term":"Compiler","def":"A translator that converts the whole of a program into machine code before it is run, producing a separate executable file.","alt":"","page":"c01-p04"},{"term":"Computational thinking","def":"An approach to solving problems so that a computer can help, using ideas such as decomposition and abstraction to produce an algorithm.","alt":"","page":"c03-p01"},{"term":"Concatenation","def":"Joining two or more strings together end to end to make one string; + in C#.","alt":"","page":"c04-p07"},{"term":"Condition-controlled loop","def":"A loop that repeats until (or while) a condition is met, so the number of repetitions is not known in advance, e.g. WHILE or REPEAT…UNTIL.","alt":"Unbounded / indefinite iteration","page":"c04-p05"},{"term":"Constant","def":"A named value that is set once and cannot be changed while the program is running.","alt":"A value that stays the same throughout the execution of a program.","page":"c04-p01"},{"term":"Count-controlled loop","def":"A loop that repeats a fixed, known number of times, e.g. a FOR loop.","alt":"Bounded / definite iteration","page":"c04-p05"},{"term":"Data dictionary","def":"A table describing each data item in a solution, e.g. its name, purpose, data type, example value and validation rule.","alt":"","page":"c03-p09"},{"term":"Data requirements","def":"The items of data a solution needs (inputs, processed and stored values, outputs), each with its name, data type and validation.","alt":"","page":"c03-p09"},{"term":"Data type","def":"The kind of value a variable holds, which determines how much memory it uses and which operations can be carried out on it.","alt":"","page":"c02-p07"},{"term":"Date/time","def":"A data type for storing a date and/or a time, allowing date calculations and formatting.","alt":"DateTime","page":"c02-p07"},{"term":"Debugger","def":"An IDE tool that lets the programmer pause a program at breakpoints, step through it line by line and watch variable values, to find errors.","alt":"","page":"c01-p03"},{"term":"Decomposition","def":"Breaking a large, complex problem down into smaller, more manageable sub-problems that can be solved separately.","alt":"","page":"c03-p01"},{"term":"Denary","def":"The base-10 number system, using the digits 0–9, with each column worth ten times the column to its right.","alt":"decimal","page":"c02-p01"},{"term":"Desk checking","def":"Checking an algorithm or code by hand, without running it on a computer, to find errors.","alt":"","page":"c03-p08"},{"term":"DIV","def":"Integer division: gives the whole-number part of a division and discards any remainder, e.g. 17 DIV 5 = 3. In C#, / between two ints.","alt":"","page":"c04-p02"},{"term":"Dry run","def":"Working through an algorithm or program by hand, line by line, recording the values of variables to check its logic and output.","alt":"","page":"c03-p08"},{"term":"Efficient solution","def":"A solution that carries out its tasks quickly without wasting resources (processor time, memory, storage) or the user's time and effort.","alt":"","page":"c07-p02"},{"term":"Element","def":"One individual value stored in an array.","alt":"","page":"c04-p06"},{"term":"Encapsulation","def":"Keeping an object's data inside the object so that it can only be accessed or changed through the object's own methods.","alt":"data hiding","page":"c01-p02"},{"term":"Error trapping","def":"Code that detects a run-time error (exception) and handles it, e.g. with try … catch, so the program displays a helpful message instead of crashing.","alt":"Exception handling","page":"c05-p03"},{"term":"Evaluation","def":"Judging how well a solution meets the original user requirements and design criteria, using evidence such as test results and user feedback, and identifying improvements.","alt":"","page":"c07-p01"},{"term":"Exception","def":"An error event raised (thrown) by a program when something goes wrong at run time, such as a FormatException or DivideByZeroException.","alt":"","page":"c05-p03"},{"term":"Executable file","def":"A file of machine code produced by a compiler that can be run without the source code or a translator.","alt":".exe","page":"c01-p04"},{"term":"Execution error","def":"An error that occurs while the program is running and causes it to crash, e.g. dividing by zero or opening a file that does not exist.","alt":"Run-time error","page":"c05-p02"},{"term":"Expected outcome","def":"The precise result that should happen when a test is carried out, written before the test is run so it can be compared with the actual outcome.","alt":"","page":"c06-p02"},{"term":"Extreme data","def":"Valid test data on the limits (boundaries) of the accepted range, which should be accepted.","alt":"Boundary data","page":"c06-p03"},{"term":"File handling","def":"Opening, reading from, writing to, appending to and closing files so that data is stored permanently between runs of a program.","alt":"","page":"c04-p09"},{"term":"Flowchart","def":"A diagram that represents an algorithm using standard symbols for start/stop, input/output, process and decision, joined by flow lines.","alt":"flow diagram","page":"c03-p02"},{"term":"Format check","def":"A validation check that makes sure data matches a required pattern, e.g. an email address containing @.","alt":"Picture check","page":"c05-p01"},{"term":"Function","def":"A subroutine that performs a task and returns a single value to the code that called it.","alt":"","page":"c04-p08"},{"term":"Hexadecimal","def":"The base-16 number system, using 0–9 and A–F (10–15); one hex digit represents one nibble, so it is used as a shorthand for binary.","alt":"hex","page":"c02-p03"},{"term":"High-level language","def":"A programming language that uses English-like keywords and is independent of the processor, e.g. C# or Python.","alt":"","page":"c01-p04"},{"term":"High-volume testing","def":"Testing a system with a large quantity of data to check that it still performs correctly and does not fail.","alt":"Volume / stress testing","page":"c07-p02"},{"term":"IDE","def":"Integrated development environment: a single application that provides a code editor, translator, debugger and other tools for developing programs.","alt":"integrated development environment","page":"c01-p03"},{"term":"Identifier","def":"The name given to a variable, constant, array or subroutine so that it can be referred to in the code; it should be meaningful.","alt":"","page":"c04-p01"},{"term":"Index","def":"The number giving an element's position in an array or a character's position in a string; in C# indexes start at 0.","alt":"Subscript","page":"c03-p06"},{"term":"Infinite loop","def":"A loop that never ends because its terminating condition can never be met.","alt":"","page":"c04-p05"},{"term":"Inheritance","def":"Where a new class takes on the properties and methods of an existing class and can add its own.","alt":"","page":"c01-p02"},{"term":"Input","def":"A statement that takes data from the user (e.g. the keyboard) and stores it in a variable; in C#, Console.ReadLine().","alt":"","page":"c04-p03"},{"term":"Insertion sort","def":"A sort that builds a sorted section at the start of the list by taking each next item and inserting it into its correct position.","alt":"","page":"c03-p05"},{"term":"Integer","def":"A data type for whole numbers, positive or negative, with no fractional part.","alt":"int","page":"c02-p07"},{"term":"Integration testing","def":"Testing that separately developed modules work correctly together, including the data passed between them.","alt":"","page":"c06-p01"},{"term":"IntelliSense","def":"An editor feature that suggests or completes keywords, variable and method names as code is typed and shows the parameters a method needs.","alt":"auto-complete","page":"c01-p03"},{"term":"Interpreter","def":"A translator that translates and executes a program one line at a time, without producing an executable file.","alt":"","page":"c01-p04"},{"term":"Invalid data","def":"Test data that breaks the rules, e.g. outside the accepted range or of the wrong type, which the program should reject.","alt":"Erroneous data","page":"c06-p03"},{"term":"Iteration","def":"A control structure in which a block of statements is repeated, using a loop such as FOR or WHILE.","alt":"repetition, looping","page":"c03-p02"},{"term":"Iterative testing","def":"Testing carried out repeatedly throughout development and after it: each part is tested, errors are fixed and the tests are repeated until the part works.","alt":"","page":"c06-p01"},{"term":"Kilobyte","def":"1024 bytes; in the same way a megabyte is 1024 KB, a gigabyte 1024 MB and a terabyte 1024 GB.","alt":"KB","page":"c02-p04"},{"term":"Length check","def":"A validation check that makes sure the number of characters entered is acceptable, e.g. a password of at least 8 characters.","alt":"","page":"c05-p01"},{"term":"Linear search","def":"A search that checks each item in turn from the start until the target is found or the end of the list is reached.","alt":"sequential search","page":"c03-p06"},{"term":"Logic error","def":"An error in the program's reasoning that lets it run without crashing but produces incorrect results.","alt":"","page":"c05-p02"},{"term":"Machine code","def":"Binary instructions that a processor can execute directly.","alt":"binary instructions","page":"c01-p04"},{"term":"Method","def":"A procedure or function defined in a class that describes an action an object can carry out.","alt":"","page":"c01-p02"},{"term":"MOD","def":"Modulus: gives the remainder after division, e.g. 17 MOD 5 = 2. In C# the operator is %.","alt":"","page":"c04-p02"},{"term":"Nested IF","def":"An IF statement placed inside another IF statement, so the inner condition is only tested if the outer condition is True.","alt":"","page":"c04-p04"},{"term":"Nibble","def":"A group of 4 bits (half a byte); it can be represented by one hexadecimal digit.","alt":"","page":"c02-p03"},{"term":"Null data","def":"A test in which no data is entered, to check that a blank input is rejected or handled.","alt":"","page":"c06-p03"},{"term":"Object","def":"A single instance created from a class, with its own values for the class's properties.","alt":"instance of a class","page":"c01-p02"},{"term":"Object-oriented programming","def":"A paradigm in which a program is built from objects, made from classes, that combine data (properties) with the methods that act on it.","alt":"OOP","page":"c01-p02"},{"term":"Output","def":"A statement that displays data or results to the user, e.g. on screen with Console.WriteLine().","alt":"","page":"c04-p03"},{"term":"Overflow","def":"When the result of a calculation is too large to be stored in the number of bits available, so the extra bit is lost and the stored result is wrong.","alt":"","page":"c02-p05"},{"term":"Parameter","def":"A variable in a subroutine's definition that receives a value (argument) passed in when the subroutine is called.","alt":"","page":"c04-p08"},{"term":"Pass","def":"One complete sweep through a list during a sorting algorithm.","alt":"","page":"c03-p04"},{"term":"Presence check","def":"A validation check that makes sure data has been entered and a field has not been left blank.","alt":"","page":"c05-p01"},{"term":"Procedural programming","def":"A paradigm in which the program is a sequence of imperative commands, executed in order and organised into procedures and functions that act on separately stored data.","alt":"step-by-step instructions grouped into procedures/functions","page":"c01-p01"},{"term":"Procedure","def":"A subroutine that performs a task but does not return a value (void in C#).","alt":"","page":"c04-p08"},{"term":"Programming paradigm","def":"A style or approach to programming that determines how a solution is structured, e.g. procedural or object-oriented.","alt":"approach to programming","page":"c01-p01"},{"term":"Property","def":"An item of data held by an object, defined in its class.","alt":"attribute","page":"c01-p02"},{"term":"Pseudocode","def":"A language-independent, structured English-like way of writing an algorithm using programming-style keywords.","alt":"","page":"c03-p02"},{"term":"Range check","def":"A validation check that makes sure a value lies between a lower and an upper limit.","alt":"","page":"c05-p01"},{"term":"Real","def":"A data type for numbers that have a fractional (decimal) part.","alt":"float / double","page":"c02-p07"},{"term":"Record","def":"A collection of related fields about one item; in a text file, usually one line with fields separated by commas.","alt":"","page":"c04-p09"},{"term":"Refinement","def":"Improving a design in stages, for example after dry runs or user feedback, by adding missing steps, correcting logic or simplifying it.","alt":"","page":"c03-p03"},{"term":"Relational operator","def":"A comparison operator that gives True or False: = (== in C#), ≠ (!=), <, >, <= and >=.","alt":"Comparison operator","page":"c04-p02"},{"term":"Robustness","def":"The ability of a solution to cope with invalid, unexpected or extreme data and high volumes of data without crashing or giving wrong results.","alt":"Robust solution","page":"c07-p02"},{"term":"Running total","def":"A variable, initialised to 0 before a loop, to which each value is added inside the loop.","alt":"","page":"c04-p05"},{"term":"Selection","def":"A control structure in which a condition is tested to decide which statements are executed, e.g. IF … ELSE.","alt":"Branching / decision","page":"c03-p02"},{"term":"Sentinel value","def":"A special input value, such as −1 or 0, that signals the end of the data and stops a loop.","alt":"Rogue value","page":"c04-p05"},{"term":"Sequence","def":"A control structure in which statements are executed one after another in the order they are written.","alt":"","page":"c03-p02"},{"term":"Source code","def":"The program as written by the programmer in a high-level language, before translation.","alt":"","page":"c01-p03"},{"term":"Stakeholders","def":"People with an interest in a system, such as the client, the end users and the developers.","alt":"","page":"c07-p01"},{"term":"String","def":"A data type that holds a sequence of characters (letters, digits, symbols, spaces) written inside quotation marks.","alt":"","page":"c02-p07"},{"term":"String function","def":"A built-in function or method that works with text, e.g. Length, Substring, IndexOf, Contains, Split, ToUpper.","alt":"String handling function","page":"c04-p07"},{"term":"Subroutine","def":"A named, self-contained block of code that performs a specific task and can be called whenever it is needed.","alt":"Sub-program / method","page":"c04-p08"},{"term":"Substring","def":"A part of a string; in C#, Substring(start, length) extracts length characters beginning at index start.","alt":"","page":"c04-p07"},{"term":"Success criteria","def":"Measurable statements, based on the user requirements, that a solution must meet to be judged successful.","alt":"Design criteria","page":"c06-p02"},{"term":"Syntax error","def":"An error where the code breaks the grammar rules of the programming language, so it cannot be translated and the program will not run.","alt":"","page":"c05-p02"},{"term":"Syntax highlighting","def":"An editor feature that displays keywords, strings, comments and other parts of the code in different colours.","alt":"colour coding","page":"c01-p03"},{"term":"System testing","def":"Testing the complete, integrated system as a whole against its specification and requirements.","alt":"","page":"c06-p01"},{"term":"Test plan","def":"A planned table of tests showing, for each test, its number, purpose, test data, type of data, expected outcome, actual outcome and any action taken.","alt":"","page":"c06-p02"},{"term":"Top-down design","def":"Designing a solution by breaking the main task into sub-tasks, and those into smaller sub-tasks, often shown as a structure diagram.","alt":"stepwise refinement","page":"c03-p01"},{"term":"Trace table","def":"A table used in a dry run to record the value of each variable, condition and output at each step.","alt":"","page":"c03-p08"},{"term":"Translator","def":"Software that converts source code into machine code, e.g. a compiler or an interpreter.","alt":"","page":"c01-p04"},{"term":"Truth table","def":"A table showing the output of a Boolean expression for every possible combination of inputs.","alt":"","page":"c02-p08"},{"term":"Type check","def":"A validation check that makes sure data is of the correct data type, e.g. a whole number rather than text.","alt":"","page":"c05-p01"},{"term":"Unicode","def":"An international character set that aims to give every character in every writing system, including emoji, a unique code; it uses up to 32 bits per character and its first 128 codes match ASCII.","alt":"","page":"c02-p06"},{"term":"Unit testing","def":"Testing a single module, function or method on its own to check that it works correctly before it is combined with others.","alt":"Module testing","page":"c06-p01"},{"term":"User requirements","def":"The agreed list of what a system must do, drawn up with the client at the start of a project and used to judge the finished solution.","alt":"","page":"c07-p01"},{"term":"Valid data","def":"Typical, sensible test data within the accepted range that the program should accept and process.","alt":"Normal data","page":"c06-p03"},{"term":"Validation","def":"An automatic check carried out by a program to make sure input data is sensible, reasonable and follows set rules before it is processed; it cannot guarantee the data is correct.","alt":"","page":"c05-p01"},{"term":"Validation loop","def":"A loop (usually WHILE) that repeats the input, with an error message, for as long as the data entered is invalid.","alt":"","page":"c05-p01"},{"term":"Variable","def":"A named location in memory that stores a value which can change while the program is running.","alt":"","page":"c04-p01"},{"term":"White box testing","def":"Testing that examines the internal code, logic and structure of a program so that every path and condition is executed; usually done by the programmer.","alt":"Structural / glass box testing","page":"c06-p01"}]};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);

  if (parent) parent.appendChild(e);

}
function svgRoot(W, H, label) { return sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': label || '' }); }
function svBtn(parent, label, act, cls) {

  while (q.length) { const v = q.shift(); for (const k of out[v]) { if (back.has(k)) continue; const w = edges[k].b; rank[w] = Math.max(rank[w], rank[v] + 1); if (--fin[w] === 0) q.push(w); } }
  const R = Math.max(0, ...rank) + 1, layers = Array.from({ length: R }, () => []);
  nodes.forEach((n, i) => layers[rank[i]].push(i));
  for (let r = 1; r < R; r++) {

    const bc = v => { const ps = edges.filter((e, k) => !back.has(k) && e.b === v && pos.has(e.a)).map(e => pos.get(e.a)); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 1e3; };

  const cnt = el('span', { class: 'muted' });

    const hasBack = back.size > 0, longE = edges.some((e, k) => !back.has(k) && rank[e.b] - rank[e.a] > 1);

    else { gapA = 44; nw = clamp((W - 20 - (R - 1) * gapA) / R, 104, 170); gapC = 22; }

    bs.forEach((b, i) => { b.setAttribute('aria-selected', String(i === lv)); b.tabIndex = i === lv ? 0 : -1; });
    const L = levels[lv]; if (!L) return;

    const id = new Map(N.map((n, i) => [n, i])), E = F.map(f => ({ f, a: id.get(f.a), b: id.get(f.b) }));

    const startOrder = N.map((n, i) => i).sort((x, y) => (N[x].type === 'ent' ? 0 : 1) - (N[y].type === 'ent' ? 0 : 1) || outs[y].length - outs[x].length);
    startOrder.forEach(v => { if (!vs[v]) dfs(v); });
    const DE = E.map((e, k) => rev.has(k) ? { s: e.b, t: e.a, k } : { s: e.a, t: e.b, k }).filter(e => e.s !== e.t);

    const key = x => x.n || x;
    for (let sweep = 0; sweep < 4; sweep++) {

      for (let r = down ? 1 : R - 2; down ? r < R : r >= 0; r += down ? 1 : -1) {
        const ref = layers[r + (down ? -1 : 1)], posR = new Map(ref.map((x, j) => [key(x), j]));
        layers[r] = layers[r].map((x, j) => { const ps = nb(x).filter(([y, d]) => d === (down ? -1 : 1) && posR.has(y)).map(([y]) => posR.get(y)); return [x, ps.length ? ps.reduce((a, c) => a + c, 0) / ps.length : j, j]; }).sort((p, q) => p[1] - q[1] || p[2] - q[2]).map(z => z[0]);
      }
    }
    const pos = new Map();
    const cols = R * 112 + (R - 1) * 120 <= W;
    let SW = W, SH;
    const DW = 30;
    if (cols) {
      const nw = clamp((W - (R - 1) * 120) / R, 110, 170), gap = R > 1 ? clamp((W - R * nw) / (R - 1), 120, 220) : 0, cpl = Math.floor((nw - 16) / 7);
      N.forEach(n => { n.w = nw; n.lines = wrapText(n.label, cpl, 3); n.h = n.lines.length * 15 + (n.type === 'proc' ? 40 : 24); });
      const hOf = x => x.dummy ? 28 : x.n.h, colH = layers.map(Lr => Lr.reduce((a, x) => a + hOf(x), 0) + (Lr.length - 1) * 40), H0 = Math.max(...colH);
      const xs = (W - (R * nw + (R - 1) * gap)) / 2;
      layers.forEach((Lr, c) => { let y = 16 + (H0 - colH[c]) / 2; Lr.forEach(x => { pos.set(key(x), { x: xs + c * (nw + gap) + nw / 2, y: y + hOf(x) / 2 }); y += hOf(x) + 40; }); });
      SH = H0 + 32;
    } else {
      let y = 12;
      layers.forEach(Lr => {
        const real = Lr.filter(x => !x.dummy).length, dum = Lr.length - real;
        const nw = Math.min(170, (W - (Lr.length - 1) * 18 - dum * DW) / Math.max(1, real)), cpl = Math.floor((nw - 12) / 6.8);
        Lr.forEach(x => { if (!x.dummy) { x.n.w = nw; x.n.lines = wrapText(x.n.label, cpl, 4); x.n.h = x.n.lines.length * 15 + (x.n.type === 'proc' ? 40 : 24); } });
        const rh = Math.max(24, ...Lr.filter(x => !x.dummy).map(x => x.n.h)), tw = real * nw + dum * DW + (Lr.length - 1) * 18;
        let x0 = (W - tw) / 2;
        Lr.forEach(x => { const w = x.dummy ? DW : nw; pos.set(key(x), { x: x0 + w / 2, y: y + rh / 2 }); x0 += w + 18; });
        y += rh + 78;
      });
      SH = y - 78 + 14;
    }
    const svg = svgRoot(SW, SH, (L.label || 'DFD')); const defs = sv('defs', {}, svg); marker(defs, mid, 'sv-mk'); marker(defs, mid + 'on', 'sv-mk on');
    const fg = sv('g', {}, svg), ng = sv('g', {}, svg), lg = sv('g', {}, svg);
    const clip = (n, p, toward) => { const dx = toward.x - p.x, dy = toward.y - p.y; const sx = n.w / 2 / Math.abs(dx || 1e-9), sy = n.h / 2 / Math.abs(dy || 1e-9), s = Math.min(sx, sy, 1); return { x: p.x + dx * s, y: p.y + dy * s }; };
    const pairCount = new Map(), pairIdx = new Map();
    E.forEach(e => { const k = [e.a, e.b].sort().join('|'); pairCount.set(k, (pairCount.get(k) || 0) + 1); });
    E.forEach((e, k) => {
      const f = e.f, pk = [e.a, e.b].sort().join('|'), m = pairCount.get(pk), j = pairIdx.get(pk) || 0; pairIdx.set(pk, j + 1);
      const c = chains.get(k) || { dir: true, ch: [] };
      let pts = [pos.get(f.a), ...(c.dir ? c.ch : c.ch.slice().reverse()).map(x => pos.get(x)), pos.get(f.b)].map(p => ({ x: p.x, y: p.y }));
      // parallel offset, measured in the canonical direction so opposite flows separate
      const can = e.a < e.b ? [pts[0], pts[pts.length - 1]] : [pts[pts.length - 1], pts[0]];
      const dx0 = can[1].x - can[0].x, dy0 = can[1].y - can[0].y, l0 = Math.hypot(dx0, dy0) || 1;
      const off = (j - (m - 1) / 2) * 22, ox = -dy0 / l0 * off, oy = dx0 / l0 * off;
      pts = pts.map(p => ({ x: p.x + ox, y: p.y + oy }));
      pts[0] = clip(f.a, pts[0], pts[1]); pts[pts.length - 1] = clip(f.b, pts[pts.length - 1], pts[pts.length - 2]);
      const on = sel && (sel === f.a || sel === f.b);
      let d = `M${pts[0].x},${pts[0].y}`;
      for (let q = 1; q < pts.length; q++) d += ` L${pts[q].x},${pts[q].y}`;
      sv('path', { d, class: 'sv-line' + (on ? ' on' : ''), 'marker-end': `url(#${mid}${on ? 'on' : ''})`, 'stroke-linejoin': 'round' }, fg);
      // label on the longest segment
      let best = 0, bl = -1; for (let q = 0; q < pts.length - 1; q++) { const ll = Math.hypot(pts[q + 1].x - pts[q].x, pts[q + 1].y - pts[q].y); if (ll > bl) { bl = ll; best = q; } }
      const A = pts[best], Bq = pts[best + 1]; let lx = (A.x + Bq.x) / 2, ly = (A.y + Bq.y) / 2;
      if (m > 1 && off) { const sg = Math.sign(off), lw = Math.min(16, f.label.length) * 6.4 + 10; if (Math.abs(oy) < Math.abs(ox)) lx += sg * Math.sign(ox || 1) * (lw / 2 + 2); else ly += sg * Math.sign(oy || 1) * 12; }
      edgeLabel(lg, lx, ly, f.label, 16);
    });
    N.forEach(n => {
      const p = pos.get(n), l = p.x - n.w / 2, t = p.y - n.h / 2;
      const g = svBtn(ng, `${{ ent: 'External entity', proc: 'Process', store: 'Data store' }[n.type]}: ${n.label}`, () => { sel = n; draw(); showN(n, F); }, sel === n ? 'on' : '');
      if (n.type === 'ent') sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 2, class: 'shp ent' }, g);
      else if (n.type === 'proc') { sv('rect', { x: l, y: t, width: n.w, height: n.h, rx: 10, class: 'shp' }, g); sv('line', { x1: l, x2: l + n.w, y1: t + 22, y2: t + 22, class: 'dfd-rule' }, g); sv('text', { x: p.x, y: t + 11.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      else { sv('rect', { x: l, y: t, width: n.w, height: n.h, class: 'shp store' }, g); sv('line', { x1: l + 34, x2: l + 34, y1: t, y2: t + n.h, class: 'dfd-rule' }, g); sv('text', { x: l + 17, y: p.y, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dfd-id', text: n.id }, g); }
      svText(g, n.lines, n.type === 'store' ? l + 34 + (n.w - 34) / 2 : p.x, n.type === 'proc' ? p.y + 11 : p.y, null, 15);
    });
    wrap.innerHTML = ''; wrap.append(svg);
  }
  function showN(n, F) {
    const ins = F.filter(f => f.b === n), outs = F.filter(f => f.a === n);
    const nm = x => x.type === 'proc' ? `${x.id} ${x.label}` : x.type === 'store' ? `${x.id} ${x.label}` : x.label;
    cx.detailHTML(`<strong>${esc(nm(n))} · ${{ ent: 'external entity', proc: 'process', store: 'data store' }[n.type]}</strong><div>${ins.length ? 'In: ' + ins.map(f => `<b>${esc(f.label)}</b> from ${esc(nm(f.a))}`).join('; ') : 'No data flows in.'}</div><div>${outs.length ? 'Out: ' + outs.map(f => `<b>${esc(f.label)}</b> to ${esc(nm(f.b))}`).join('; ') : 'No data flows out.'}</div>`);
  }
  draw(); cx.onResize(draw);
  cx.detail(levels[0] ? levels[0].label : '', 'Select a box to see the data flowing in and out of it.');
};

/* ---- 15 table-reveal ---- */
DIAG['table-reveal'] = (d, st, cx) => {
  const head = d.head || [], rows = d.rows || [], hidden = (d.hidden || []).filter(h => rows[h[0]] && rows[h[0]][h[1]] != null);
  const key = (r, c) => r + ',' + c, H = new Set(hidden.map(h => key(h[0], h[1]))), shown = new Set();
  const order = hidden.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const wrapT = el('div', { class: 'tw plain' }); const tb = el('table'); wrapT.append(tb);
  tb.innerHTML = `<thead><tr>${head.map(h => `<th scope="col">${inline(h)}</th>`).join('')}</tr></thead>`;
  const body = el('tbody'); tb.append(body);
  const cells = new Map();
  rows.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => { const td = el('td', { style: 'font-variant-numeric:tabular-nums' }); cells.set(key(ri, ci), td); tr.append(td); }); body.append(tr); });
  const next = el('button', { type: 'button', class: 'btn pri' }, 'Reveal next'), all = el('button', { type: 'button', class: 'btn' }, 'Reveal all'), hide = el('button', { type: 'button', class: 'btn' }, 'Hide again'), cnt = el('span', { class: 'muted' });
  st.append(wrapT, el('div', { class: 'btns' }, next, all, hide, cnt));
  function paint() {
    rows.forEach((r, ri) => r.forEach((c, ci) => {
      const k = key(ri, ci), td = cells.get(k);
      if (H.has(k) && !shown.has(k)) { td.className = ''; td.innerHTML = ''; const b = el('button', { type: 'button', class: 'cellbtn', 'aria-label': `Reveal ${plain(head[ci] || 'cell')} in row ${ri + 1}` }, '?'); b.addEventListener('click', () => reveal(ri, ci, true)); td.append(b); }
      else { td.innerHTML = inline(c); td.className = H.has(k) ? 'shown' : ''; }
    }));
    cnt.textContent = `${shown.size} of ${H.size} revealed`;
    next.disabled = all.disabled = shown.size === H.size; hide.disabled = !shown.size;
  }
  function reveal(r, c, focusNext) {
    shown.add(key(r, c)); paint();
    cx.detail(`${plain(head[c] || '')}, row ${r + 1}`, String(rows[r][c]));
    if (focusNext) { const nb = body.querySelector('.cellbtn'); if (nb) nb.focus(); else next.focus(); }
  }
  next.addEventListener('click', () => { const h = order.find(h => !shown.has(key(h[0], h[1]))); if (h) reveal(h[0], h[1]); });
  all.addEventListener('click', () => { order.forEach(h => shown.add(key(h[0], h[1]))); paint(); cx.detail('', 'All cells revealed.'); });
  hide.addEventListener('click', () => { shown.clear(); paint(); cx.detail('', 'Work out each hidden cell, then select it to check.'); });
  paint(); cx.detail('', 'Work out each hidden cell, then select it to check.');
};

  if (books.length) {
    h.push('<b>Revision notebooks</b>');
    books.forEach(x => {
      const here = x.id === BK.id;
      const href = here ? '#' + PAGES[cur].p.id : (ON_WEB && x.file && /^[\w.-]+\.html$/i.test(x.file) ? x.file : safeUrl(x.url));
      if (!href) return;

    });

function setLib(open) { libMenu.hidden = !open; libBtn.setAttribute('aria-expanded', String(open)); if (open) { const a = libMenu.querySelector('a'); a && a.focus(); } }
