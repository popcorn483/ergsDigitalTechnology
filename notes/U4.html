<meta charset="utf-8">
<title>GCSE Unit 4 Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: an e-reader. Sticky slim top bar, outline rail on the left, ONE A4 sheet at a time on a quiet desk. */
:root{
  --desk:#E2E6EC; --paper:#FFFFFF; --paper-2:#F4F6F9; --ink:#1B2230; --ink-2:#465063; --ink-3:#687386;
  --line:#D3D9E2; --line-2:#E7EBF0; --bar:#FBFCFD;
  --accent:#2445B4; --accent-ink:#FFFFFF; --accent-soft:#E5EAFA;
  --mark:#FFE27A; --mark-ink:#1B2230;
  --good:#18744A; --good-soft:#E0F2E8; --bad:#B3261E; --bad-soft:#FBE6E4;
  --warn:#8E5300; --warn-soft:#FFF0D6; --note:#5A49B5; --note-soft:#EEEBFB;
  --c1:#2F5FD0; --c2:#0E8079; --c3:#B87200; --c4:#C2416B; --c5:#6E54C9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 28px rgba(20,30,50,.10);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
  --barh:52px; --railw:300px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --desk:#0E1117; --paper:#181C24; --paper-2:#1F2430; --ink:#E5E8EE; --ink-2:#B2B9C6; --ink-3:#8A93A3;
  --line:#2F3644; --line-2:#252B36; --bar:#141820;
  --accent:#93ABFF; --accent-ink:#0E1117; --accent-soft:#232C4C;
  --mark:#6A5A14; --mark-ink:#FFF4C7;
  --good:#5CC58E; --good-soft:#163024; --bad:#FF8F85; --bad-soft:#3B1E1C;
  --warn:#F1B44E; --warn-soft:#382B13; --note:#B7AAFF; --note-soft:#28244A;
  --c1:#7D9DFF; --c2:#3CC5BA; --c3:#EDB14C; --c4:#F07EA1; --c5:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark; }

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{height:var(--barh);display:flex;align-items:center;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.ib{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--paper-2);color:var(--ink)}
.ib[disabled]{opacity:.35;cursor:default;background:transparent}
.ib svg{width:20px;height:20px}
.ib[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.bt{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.bt b{font-family:var(--serif);font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;gap:2px;flex:none}
.pn{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);min-width:58px;text-align:center;white-space:nowrap}
.pn b{color:var(--ink);font-weight:700}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--good);transition:width .3s;max-width:100%}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);align-items:start}
body.rail-off .shell{grid-template-columns:minmax(0,1fr)}
body.rail-off .rail{display:none}
.rail{position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--barh) - env(safe-area-inset-top,0px));overflow:auto;background:var(--paper-2);border-right:1px solid var(--line);padding:18px 14px 28px max(14px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.r-head{padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.r-qual{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.r-title{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25;margin:4px 0 12px;text-wrap:balance}
.meter{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.r-prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.r-ch{margin:12px 0 4px}
.r-ch h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 4px;font-weight:700;display:flex;gap:6px}
.r-ch h2 span{color:var(--ink);letter-spacing:0;text-transform:none;font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3}
.r-pg{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13.5px;line-height:1.35}
.r-pg:hover{background:var(--line-2);color:var(--ink)}
.r-pg[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.tk{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tk svg{width:10px;height:10px;opacity:0}
.r-pg.done .tk{background:var(--good);border-color:var(--good);color:var(--paper)}
.r-pg.done .tk svg{opacity:1}
.r-pg[aria-current="page"] .tk{border-color:var(--accent)}
.r-foot{margin-top:18px;padding:12px 6px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:70}

main{min-width:0;padding-block:32px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

@media (max-width:999px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:80;top:0;left:0;bottom:0;height:auto;width:min(340px,88vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.rail-open .rail{transform:none}
  body.rail-off .rail{display:block}
}

/* ---------- the sheet ---------- */
.sheet{max-width:820px;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;aspect-ratio:210/297;padding:48px 64px 40px;display:flex;flex-direction:column;font-family:var(--serif);font-size:16.5px;line-height:1.68;overflow-wrap:break-word}
.sheet > *{min-width:0}
.strip{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;border-bottom:2px solid var(--ink);font-weight:700}
.strip span:last-child{letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chintro{margin:18px 0 0;padding:14px 16px;background:var(--paper-2);border-radius:6px;font-size:15px;color:var(--ink-2)}
.chintro b{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sheet h1{font-size:30px;line-height:1.2;font-weight:700;margin:22px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.sheet h1:focus{outline:none}
.sheet h1 .cont{font-weight:400;color:var(--ink-3);font-size:.7em}
.lede{font-size:18px;line-height:1.5;color:var(--ink-2);margin:0 0 20px;font-style:italic}
.notes{display:flex;flex-direction:column;gap:14px}
.notes p{margin:0}
.notes h2{font-size:20px;margin:12px 0 -4px;line-height:1.3;text-wrap:balance}
.notes ul,.notes ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.notes code,.sheet code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);border:1px solid var(--line-2);padding:.05em .35em;border-radius:4px}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:help;text-align:inherit}
.term:hover{background:var(--accent-soft)}
.boxed{border-radius:8px;padding:14px 18px;background:var(--paper-2);border:1px solid var(--line)}
.boxed > b{display:block;font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.key{border:1.5px solid var(--ink);background:var(--paper)}
.key ul{gap:6px}
.call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border-radius:8px;padding:12px 16px;font-size:15.5px}
.call b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.call.tip{background:var(--accent-soft)}.call.tip b{color:var(--accent)}
.call.warn{background:var(--warn-soft)}.call.warn b{color:var(--warn)}
.call.note{background:var(--note-soft)}.call.note b{color:var(--note)}
@media (max-width:520px){.call{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tw table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.tw th,.tw td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.tw thead th{background:var(--paper-2);font-size:13px;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:700}
.tw.plain td:first-child{font-weight:400}
.tw caption{caption-side:bottom;text-align:left;font-size:13px;color:var(--ink-3);padding:8px 12px;font-style:italic}
figure{margin:0}

.ex{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex-h{padding:10px 16px;background:var(--paper-2);font-family:var(--sans);font-weight:700;border-bottom:1px solid var(--line)}
.ex-b{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.ex-ctx{color:var(--ink-2)}
.ex ol{counter-reset:st;list-style:none;padding:0}
.ex ol li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;animation:rise .25s ease}
.ex ol li::before{content:counter(st);font-family:var(--sans);font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:3px}
.ex-ans{border-top:1px dashed var(--line);padding-top:10px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;line-height:1.3;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
@keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.code{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;max-width:100%;background:var(--paper-2)}
.mcq fieldset{min-width:0;max-width:100%}.mcq legend{max-width:100%;overflow-wrap:anywhere;white-space:normal}
.code-h{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;font-family:var(--sans);font-size:13px;border-bottom:1px solid var(--line)}
.code-h span:last-child{color:var(--ink-3);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.code pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;tab-size:4}
.code pre code{background:none;border:0;padding:0;font-size:inherit;display:block;min-width:max-content}
.ln{display:block;padding:0 16px}
.numbered .ln{padding-left:0}
.numbered .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--ink-3);opacity:.7;user-select:none}
.h-k{color:var(--c5);font-weight:600}.h-s{color:var(--c2)}.h-c{color:var(--ink-3);font-style:italic}.h-n{color:var(--c3)}.h-f{color:var(--c1)}.h-t{color:var(--c4)}.h-o{color:var(--c4)}.h-r{color:var(--c1);font-weight:600}.h-a{color:var(--c3)}
.out{border-top:1px solid var(--line);background:var(--paper)}
.out b{display:block;padding:6px 16px 0;font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.out pre{padding:4px 16px 12px}

/* ---------- sections ---------- */
.sec{margin-top:34px}
.sec > h2{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--ink);padding-top:10px}
.sec > h2 small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:400;margin-left:auto}
.mcq{display:flex;flex-direction:column;gap:20px;font-family:var(--sans);font-size:15px}
.mcq fieldset{border:0;margin:0;padding:0;min-width:0}
.mcq legend{font-weight:700;margin-bottom:8px;padding:0;display:flex;gap:8px}
.mcq legend span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;line-height:1.4}
.opt i{font-style:normal;font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right i{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong i{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.why{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--paper-2);font-size:14.5px}
.why b.ok{color:var(--good)}.why b.no{color:var(--bad)}
.exq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-family:var(--sans)}
.exq li{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.exq .meta{font-size:12.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.exq .meta b{color:var(--ink)}
.exq .sum{font-family:var(--serif);font-size:16px}
.exq .tipbox{background:var(--accent-soft);border-radius:6px;padding:9px 12px;font-size:14.5px}
.lk{font-family:var(--sans);font-size:14px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700}
.lk:hover{text-decoration:underline}
.lk svg{width:13px;height:13px}
.prac{display:flex;flex-direction:column;gap:14px}
.pq{border-left:3px solid var(--ink);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px}
.pq-q{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.pq-q span{flex:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pq-a{background:var(--good-soft);border-radius:6px;padding:10px 14px;font-size:15px}
.pq-a ul{margin:0;padding-left:1.2em}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vid{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);font-family:var(--sans);background:var(--paper)}
.vid:hover{border-color:var(--accent)}
.vid .src{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.vid .src .s-hub{color:var(--accent)}.vid .src .s-bbc{color:var(--c4)}.vid .src .s-yt{color:var(--bad)}.vid .src .s-cc{color:var(--c2)}
.vid .t{font-weight:700;line-height:1.35;font-size:14.5px}
.vid .go{margin-top:auto;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:4px}
.vid .go svg{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:5px 12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:auto;padding-top:40px}
.done-row{display:flex;justify-content:center;margin:12px 0 22px}
.donebtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:700;border:1.5px solid var(--good);color:var(--good);background:var(--paper);border-radius:999px;padding:9px 18px}
.donebtn svg{width:16px;height:16px}
.donebtn[aria-pressed="true"]{background:var(--good);color:var(--paper)}
.nextprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--sans)}
.np{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--ink);min-width:0}
.np:hover{border-color:var(--accent)}
.np small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.np span{font-size:14px;line-height:1.35}
.np.nx{text-align:right;grid-column:2}
.folio{text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
@media (max-width:520px){.nextprev{grid-template-columns:minmax(0,1fr)}.np.nx{grid-column:1}}

@media (max-width:699px){
  main{padding:0}
  .sheet{aspect-ratio:auto;border-radius:0;box-shadow:none;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:16px;min-height:calc(100vh - var(--barh))}
  .sheet h1{font-size:25px}
  .lede{font-size:16.5px}
  .bt span{display:none}
}
@media (max-width:420px){ .pn{min-width:44px;font-size:12px} .sep{display:none} .bar-in{gap:2px} .ib{width:34px} }

/* ---------- drawers & popover ---------- */
.drawer{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-family:var(--serif);font-size:19px;flex:1}
.dr-s{padding:12px 18px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper-2);font-size:15px}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.dr-b{flex:1;overflow:auto;padding:8px 18px 28px;overscroll-behavior:contain}
.az{display:flex;flex-wrap:wrap;gap:2px}
.az button{border:0;background:none;width:24px;height:26px;border-radius:5px;font-size:13px;font-weight:700;color:var(--accent);padding:0}
.az button[disabled]{color:var(--line);cursor:default}
.az button:hover:not([disabled]){background:var(--accent-soft)}
.gl-l{font-family:var(--serif);font-size:22px;font-weight:700;margin:16px 0 4px;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.gl-e{padding:10px 0;border-bottom:1px solid var(--line-2)}
.gl-e dt{font-weight:700;font-size:15.5px}
.gl-e dd{margin:2px 0 0;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink-2)}
.gl-e .alt{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:4px}
.gl-e a{font-size:13px;font-weight:700;text-decoration:none}
.res{list-style:none;margin:0;padding:0}
.res a{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink);border-radius:6px}
.res a:hover{background:var(--paper-2)}
.res small{color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.res b{font-size:15px;line-height:1.35}
.res span{font-family:var(--serif);font-size:14px;color:var(--ink-2);line-height:1.5}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.pop{position:fixed;z-index:100;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;font-family:var(--sans);display:flex;flex-direction:column;gap:6px}
.pop h3{margin:0;font-family:var(--serif);font-size:17px;padding-right:28px}
.pop p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.55}
.pop .alt{font-size:13px;color:var(--ink-3)}
.pop .x{position:absolute;top:6px;right:6px;width:30px;height:30px}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.empty{padding:60px 20px;text-align:center;font-family:var(--sans);color:var(--ink-2)}

/* ---------- diagrams ---------- */
.dg{margin-top:30px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--sans);font-size:14.5px;line-height:1.45;overflow:hidden}
.dg-head{padding:12px 16px 10px;border-bottom:1px solid var(--line-2);background:var(--paper-2)}
.dg-kicker{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.dg-head h3{margin:2px 0 0;font-family:var(--serif);font-size:18px;line-height:1.3;text-wrap:balance}
.dg-stage{padding:16px;container-type:inline-size;display:flex;flex-direction:column;gap:12px;min-width:0}
.dg-scroll{overflow-x:auto;min-width:0}
.dg-scroll svg{margin:0 auto;height:auto}
.dg-detail{margin:0 16px 14px;padding:10px 14px;border-radius:8px;background:var(--paper-2);min-height:3.2em;font-size:14.5px}
.dg-detail strong{display:block;font-size:13px;letter-spacing:.03em;color:var(--accent)}
.dg-detail:empty{display:none}
.dg figcaption{padding:10px 16px 12px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-3);font-style:italic}
.dg-err{color:var(--bad)}
.dg .btn{font-size:13.5px;padding:5px 11px}
.stat{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
/* svg parts */
.sv-btn{cursor:pointer;outline:none}
.sv-btn .shp{fill:var(--paper);stroke:var(--ink-3);stroke-width:1.5;transition:fill .15s,stroke .15s}
.sv-btn text{fill:var(--ink);font-family:var(--sans);font-size:13px}
.sv-btn:hover .shp{stroke:var(--accent)}
.sv-btn:focus-visible .shp{stroke:var(--accent);stroke-width:3}
.sv-btn.on .shp{fill:var(--accent);stroke:var(--accent)}
.sv-btn.on text{fill:var(--accent-ink);font-weight:700}
.sv-btn.seen .shp{fill:var(--accent-soft);stroke:var(--accent)}
.sv-line{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.sv-line.on{stroke:var(--accent);stroke-width:2.5}
.sv-track{stroke:var(--line);stroke-width:10;fill:none}
.sv-chev{stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-mk{fill:var(--ink-3)}.sv-mk.on{fill:var(--accent)}
.sv-lbl{pointer-events:none}
.sv-lbl rect{fill:var(--paper);opacity:.92}
.sv-lbl text{fill:var(--ink-2);font-size:12px;font-family:var(--sans)}
.sv-center{fill:var(--ink-2);font-size:13px;font-family:var(--sans)}
.sv-center.big{fill:var(--ink);font-family:var(--serif);font-size:17px;font-weight:700}
.sv-ax{stroke:var(--line);stroke-width:1}
.sv-ax-t{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
/* hotspot */
.hs{position:relative;display:flex;flex-direction:column;gap:26px}
.hs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hs-row{display:flex;gap:12px;position:relative}
.hs-part{flex:1 1 0;min-width:0;border:1.5px solid var(--ink-3);background:var(--paper);border-radius:8px;padding:12px 8px;font-weight:700;font-size:14px;line-height:1.3;min-height:54px;position:relative;z-index:1}
.hs-part:hover{border-color:var(--accent)}
.hs-part.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hs-part.near{background:var(--accent-soft);border-color:var(--accent)}
/* layers */
.lay{display:flex;flex-direction:column;gap:4px}
.lay button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1.5px solid transparent;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--ink)}
.lay button span{font-weight:400;font-size:12px;color:var(--ink-3);white-space:nowrap}
.lay button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* compare */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmp{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cmp-art{flex:0 1 240px;min-width:0;max-width:100%}
.cmp-art svg{width:100%;height:auto}
.cmp ul{flex:1 1 240px;min-width:0;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.art-l{stroke:var(--accent);stroke-width:2.2;fill:none}
.art-n{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.art-t{fill:var(--ink-2);font-size:10px;font-family:var(--sans)}
.art-hub{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.art-term{fill:var(--ink-2)}
/* bits */
.bits{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 8px}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 46px;min-width:30px}
.bit small{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.bit button{width:100%;aspect-ratio:3/4;max-height:58px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink-3);padding:0}
.bit button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bit.nib{margin-left:8px}
.bpt{align-self:flex-end;font-size:26px;line-height:1;font-weight:700;color:var(--c4);margin:0 -1px 10px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rd{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.rd.cur{border-color:var(--accent);background:var(--accent-soft)}
.rd small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.rd b{font-family:var(--mono);font-size:19px;font-weight:600}
.rd div{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
/* pixels */
.px-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.px-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);width:min(100%,320px);touch-action:none;user-select:none}
.px-grid button{border:0;padding:0;aspect-ratio:1;min-width:0;border-radius:0}
.px-grid button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:1}
.px-side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);padding:0}
.pal.dense button{width:15px;height:15px;border-radius:2px}
.pal button[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.rowcodes{font-family:var(--mono);font-size:12.5px;line-height:1.35;color:var(--ink-2);white-space:pre;overflow-x:auto}
/* wave */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink-2)}
.ctl label b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.chk input{accent-color:var(--accent)}
.wv-orig{stroke:var(--c1);stroke-width:2;fill:none;opacity:.55}
.wv-step{stroke:var(--c4);stroke-width:2.2;fill:none}
.wv-dot{fill:var(--c4)}
.wv-stem{stroke:var(--c4);stroke-width:1;opacity:.45}
.wv-lvl{stroke:var(--line-2);stroke-width:1}
.calcbox{font-size:14px;background:var(--paper-2);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
/* sort */
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:6px}
.barc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.barc .b{width:100%;max-width:48px;border-radius:4px 4px 0 0;background:var(--c1);opacity:.35;transition:height .25s,background .2s,opacity .2s;display:flex;align-items:flex-end;justify-content:center;min-height:20px}
.barc .b span{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);padding-bottom:2px}
.barc.cmp .b{background:var(--c3);opacity:1}
.barc.swap .b{background:var(--c4);opacity:1}
.barc.sorted .b{background:var(--c2);opacity:.9}
.barc.found .b{background:var(--good);opacity:1}
.barc.out .b{opacity:.12}
.barc.range .b{opacity:.6}
.barc .ix{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.barc .ptr{font-size:10.5px;font-weight:700;color:var(--accent);height:14px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* calc */
.cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cin label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink-2)}
.cin input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--paper-2);font-variant-numeric:tabular-nums;width:100%;min-width:0}
.cres{border:1.5px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cres small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.cres b{font-size:22px;font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}
.ctab td,.ctab th{font-variant-numeric:tabular-nums}
.ctab td:first-child{font-weight:700}
/* match */
.mt{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px 12px}
.mt-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mt button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.mt button.term-b{font-weight:700}
.mt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mt button.ok{border-color:var(--good);background:var(--good-soft);cursor:default}
.mt button.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.mt button i{font-style:normal;flex:none;font-size:11px;font-weight:700;background:var(--good);color:var(--paper);border-radius:10px;padding:1px 6px;margin-top:1px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;position:relative}
.tl::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:var(--line);border-radius:2px}
.tl li{flex:1 1 0;min-width:0;position:relative}
.tl button{width:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;text-align:center;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink-2)}
.tl button::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ink-3);margin-top:3px;box-sizing:border-box}
.tl button.seen::before{border-color:var(--accent)}
.tl button.on{color:var(--accent)}
.tl button.on::before{background:var(--accent);border-color:var(--accent);width:22px;height:22px;margin-top:0}
@container (max-width:520px){
  .tl{flex-direction:column;gap:2px}
  .tl::before{left:9px;right:auto;top:0;bottom:0;width:3px;height:auto}
  .tl button{flex-direction:row;align-items:center;text-align:left;padding:6px 0;gap:12px}
  .tl button::before{flex:none;margin:0 0 0 1px}
  .tl button.on::before{margin-left:-2px}
}
/* gantt */
.gt .gt-bar{fill:color-mix(in srgb,var(--c1) 30%,var(--paper));stroke:var(--c1);stroke-width:1.5}
.gt.crit .gt-bar{fill:var(--c4);stroke:var(--c4)}
.gt.sel .gt-bar{stroke:var(--ink);stroke-width:2.5}
.gt:focus-visible .gt-bar{stroke:var(--accent);stroke-width:3}
.gt-in{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--sans);pointer-events:none}
.gt.crit .gt-in{fill:var(--paper)}
.gt-out{fill:var(--ink-2);font-size:12px;font-weight:700;font-family:var(--sans)}
.gt-float{fill:none;stroke:var(--ink-3);stroke-dasharray:3 3;stroke-width:1.2}
.gt-lab{fill:var(--ink)!important;font-size:12.5px!important}
/* dfd */
.sv-btn .shp.ent{fill:var(--paper-2)}
.sv-btn.on .shp.ent{fill:var(--accent)}
.dfd-rule{stroke:var(--ink-3);stroke-width:1.2}
.sv-btn.on .dfd-rule{stroke:var(--accent-ink)}
.dfd-id{fill:var(--ink-2);font-size:11.5px;font-weight:700;font-family:var(--sans)}
.sv-btn.on .dfd-id{fill:var(--accent-ink)}
/* ---------- hub links: learn panel, chapter card, library menu ---------- */
.learn{margin:0 0 24px;border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;font-family:var(--sans);display:flex;flex-direction:column;gap:8px}
.learn-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;line-height:1.35}
.learn-h b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.learn-h span{color:var(--ink-2);min-width:0}
.learn-h span em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700;margin-right:4px}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl a{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:4px 11px 4px 10px;line-height:1.3}
.hl a:hover{border-color:var(--accent);color:var(--accent)}
.hl a svg{width:12px;height:12px;color:var(--ink-3)}
.hl a:hover svg{color:var(--accent)}
.learn details{font-size:13px;border-top:1px solid var(--line-2);padding-top:8px}
.learn summary{cursor:pointer;color:var(--ink-2);font-weight:700}
.learn details[open] summary{margin-bottom:8px}
.more-l{display:flex;flex-direction:column;gap:10px}
.chcard{margin:18px 0 0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;font-family:var(--sans)}
.chcard-h{padding:12px 16px 10px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.chcard-h small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.chcard-h p{margin:4px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink-2)}
.chcard-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line-2)}
.cl{background:var(--paper);padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cl > b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cl a.lk{font-size:14px;line-height:1.35;align-items:flex-start}
.cl a.lk svg{margin-top:3px;flex:none}
.cl .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cl .fname{font-family:var(--mono);font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.libwrap{position:relative;flex:none}
.libmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:95;width:min(320px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;font-family:var(--sans)}
.libmenu > b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.libmenu a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.libmenu a:hover{background:var(--paper-2)}
.libmenu a small{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.libmenu a span{font-size:14px;font-weight:700;line-height:1.3}
.libmenu a[aria-current="page"]{background:var(--accent-soft)}
.libmenu a[aria-current="page"] small::after{content:" · open now";color:var(--accent)}

<script>
const BOOK = {"book":{"id":"U4","title":"Unit 4: Digital Development Concepts (Programming)","qual":"CCEA GCSE Digital Technology","hub":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP","edition":"2026–27","lessonNames":{"D01":"Programming paradigms: procedural and object-oriented","D02":"Development environments, editing features and translators","D03":"Binary, units of data and denary–binary conversion","D04":"Hexadecimal","D05":"Binary addition and overflow","D06":"Character sets: ASCII and Unicode","D07":"Data types","D08":"Boolean operators and truth tables","D09":"Computational thinking: abstraction and decomposition","D10":"Designing algorithms: flowcharts and pseudocode","D11":"Sorting algorithms: bubble sort and insertion sort","D12":"Searching algorithms: linear and binary search","D13":"Dry runs, trace tables, data requirements and interfaces","D14":"Variables, constants, operators, input, output and assignment","D15":"Selection: IF, ELSE IF and nested IF","D16":"Iteration: FOR, WHILE and REPEAT loops","D17":"One-dimensional arrays","D18":"String manipulation","D19":"Subroutines: user-defined functions and procedures","D20":"Basic file handling","D21":"Validation, error types and error trapping","D22":"Testing approaches, test plans and test data","D23":"Evaluating a solution"}},"chapters":[{"id":"c01","n":1,"title":"Contemporary trends in software development","intro":"The two programming paradigms you need to describe, procedural and object-oriented, and the software development environment you program in: its editing features and how high-level code is translated and run.","pages":[{"id":"c01-p01","spec":"Describe the following programming paradigms: procedural programming and object-oriented programming","lessons":["D01"],"summary":"Procedural programming is an imperative style in which the program is a sequence of commands, organised top-down into procedures and functions that work on data passed to them.","blocks":[{"t":"p","text":"A [[programming paradigm]] is a style or approach to programming. It decides how a programmer breaks a problem down and how the finished code is organised. The CCEA specification asks you to describe two paradigms: **procedural** and **object-oriented**. C#, the language you use in this course, supports both, so you will write in both styles."},{"t":"h","text":"What makes a program procedural?"},{"t":"list","items":["**Imperative**: every statement is a command telling the computer exactly what to do, for example *input this*, *add that*, *output the result*.","**Sequential**: the statements run one after another in the order they are written. The order of the instructions *is* the flow of the program, changed only by [[selection|Selection]] and [[iteration|Iteration]].","**Procedures and functions**: related instructions are grouped into named blocks called [[procedures|Procedure]] and [[functions|Function]]. Each does one task and can be called from anywhere in the program, as often as needed.","**Top-down design**: the main task is broken into smaller sub-tasks, and each sub-task becomes a procedure or function. This is [[top-down design]].","**Data is kept separate from the code**: values are stored in [[variables|Variable]] and passed into procedures and functions as [[parameters|Parameter]]."],"ordered":false},{"t":"code","lang":"cs","code":"static double Area(double width, double height)\n{\n    return width * height;          // a function: returns a value\n}\n\nstatic void ShowBanner()\n{\n    Console.WriteLine(\"== Carpet calculator ==\");   // a procedure: no value returned\n}\n\nShowBanner();\nConsole.Write(\"Width (m): \");\ndouble w = Convert.ToDouble(Console.ReadLine());\nConsole.Write(\"Length (m): \");\ndouble l = Convert.ToDouble(Console.ReadLine());\nConsole.WriteLine(\"Carpet needed: \" + Area(w, l) + \" m²\");","title":"A procedural program in C#","output":"== Carpet calculator ==\nWidth (m): 4\nLength (m): 3.5\nCarpet needed: 14 m²"},{"t":"p","text":"Read the program from the top: it runs the banner procedure, asks for two inputs, then calls the `Area` function and outputs the answer. The data (`w` and `l`) lives in variables in the main program and is **passed to** the function. That separation of data and code is the clearest sign of the procedural style."},{"t":"h","text":"Where it works well"},{"t":"p","text":"Procedural code suits smaller, linear tasks with a clear start and end: a calculation, a quiz, a file-processing job. It is quick to write and easy to follow. As programs grow, though, many procedures may share and change the same data, which makes large programs harder to maintain. That is one reason the object-oriented paradigm was developed."},{"t":"tip","text":"Examiners reported that answers on procedural programming were often too thin: 'step-by-step instructions' alone is a Level 1 answer. Use the words **imperative**, **sequence**, **procedures and functions**, **top-down** and **data passed as parameters**."},{"t":"key","title":"Key points","items":["A paradigm is a style of programming; CCEA asks for procedural and object-oriented.","Procedural = imperative commands executed in sequence.","Code is organised top-down into procedures and functions that can be called repeatedly.","Data is held separately in variables and passed into the procedures that use it."]}],"diagram":{"kind":"flow","direction":"tb","title":"Top-down structure of a procedural program","caption":"Step through the carpet calculator. The main program runs in sequence and calls a procedure and a function; data flows in as parameters and back as a return value.","nodes":[{"id":"s","label":"Start main program","detail":"Execution begins at the first statement and continues in order.","shape":"start"},{"id":"b","label":"Call ShowBanner()","detail":"A procedure: it carries out a task (outputting a title) but returns no value.","shape":"process"},{"id":"i","label":"Input width and length","detail":"Console.ReadLine() returns text, so each value is converted to a double and stored in a variable.","shape":"io"},{"id":"f","label":"Call Area(w, l)","detail":"A function: w and l are passed in as parameters, it multiplies them and returns the result to the line that called it.","shape":"process"},{"id":"o","label":"Output the area","detail":"The returned value is joined to a message and displayed.","shape":"io"},{"id":"e","label":"End","detail":"The last statement has run, so the program stops.","shape":"end"}],"edges":[["s","b"],["b","i"],["i","f"],["f","o","returns 14"],["o","e"]]},"check":[{"q":"Which phrase best describes procedural programming?","o":["Programs built from objects that send messages","A sequence of commands grouped into procedures and functions","Code that is translated one line at a time","Programs that can only be written in pseudocode"],"a":1,"why":"Procedural programs are imperative sequences of commands, organised into procedures and functions."},{"q":"What does 'imperative' mean in this context?","o":["The program must be compiled","Each statement is a command telling the computer what to do","The program uses a graphical interface","The data and code are combined in objects"],"a":1,"why":"Imperative languages issue commands."},{"q":"In a procedural program, how does a function usually get the data it works on?","o":["It reads its own private properties","It inherits it from a parent class","The data is passed in as parameters","It is typed in by the programmer at run time"],"a":2,"why":"Data is kept separate and passed into procedures and functions as parameters."}],"exam":[{"year":2025,"paper":"Unit 4","q":"7","marks":6,"summary":"Extended writing (QWC): describe procedural programming and object-oriented programming.","tip":"Top answers gave both paradigms similar depth. For procedural, credit came from imperative commands, sequence, procedures/functions and top-down design, not just 'step by step'.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"5","marks":9,"summary":"Complete sentences about programming paradigms, then judge statements about compilers and interpreters.","tip":"Use the exact vocabulary: procedural, sequence, class, object, method, inheritance.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"}],"practice":[{"q":"A programmer in Omagh is writing a procedural program to calculate the cost of school uniform orders. Describe three features of procedural programming.","m":3,"a":"Statements are commands executed in sequence / one after another (1); code is grouped into procedures and functions that can be called when needed (1); the problem is broken down top-down into sub-tasks (1); data is held separately in variables and passed to procedures as parameters (1). Max 3."},{"q":"Explain the difference between a procedure and a function in a procedural program.","m":2,"a":"Both are named blocks of code that perform a task and can be called (1); a function returns a value to the calling code, a procedure does not (1)."}],"videos":[{"title":"Programming paradigms: procedural and object-oriented – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D01-video"},{"title":"Contemporary trends in software development (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zc8pjty/revision/1"}],"terms":["Programming paradigm","Procedural programming","Selection","Iteration","Procedure","Function","Top-down design","Variable","Parameter"]},{"id":"c01-p02","spec":"Describe the following programming paradigms: procedural programming and object-oriented programming","lessons":["D01"],"summary":"Object-oriented programming builds a program from objects: instances of classes that bundle data (properties) with the methods that act on it, using encapsulation and inheritance.","blocks":[{"t":"p","text":"In [[object-oriented programming]] (OOP) the programmer starts by asking *what things (objects) are in this problem?* rather than *what steps are needed?* A school system might contain pupils, classes and teachers; a game might contain players, enemies and levels. Each becomes an object that holds its own data and the code that works on that data."},{"t":"h","text":"Classes and objects"},{"t":"list","items":["A [[class]] is a **blueprint** or template. It defines what every object of that type will know and do.","An [[object]] is **one instance** made from a class, with its own values. Many objects can be made from one class.","[[Properties|Property]] (attributes) are the **data** an object holds, such as a pupil's name and form.","[[Methods|Method]] are the **actions** an object can carry out, such as `AddMerit()` or `Report()`.","Objects work together by calling each other's methods (sometimes called *sending messages*)."],"ordered":false},{"t":"code","lang":"cs","code":"Pupil p1 = new Pupil(\"Aoife\", \"11B\");\nPupil p2 = new Pupil(\"Conor\", \"11C\");\np1.AddMerit();\np1.AddMerit();\nConsole.WriteLine(p1.Report());\nConsole.WriteLine(p2.Report());\n\nclass Pupil\n{\n    public string Name;\n    public string Form;\n    private int merits;              // encapsulated: only methods change it\n\n    public Pupil(string name, string form)   // constructor\n    {\n        Name = name;\n        Form = form;\n        merits = 0;\n    }\n\n    public void AddMerit()\n    {\n        merits = merits + 1;\n    }\n\n    public string Report()\n    {\n        return Name + \" (\" + Form + \") has \" + merits + \" merits\";\n    }\n}","title":"One class, two objects","output":"Aoife (11B) has 2 merits\nConor (11C) has 0 merits"},{"t":"h","text":"Two key features"},{"t":"p","text":"**[[Encapsulation]]** keeps an object's data inside it, so the data can only be read or changed through the object's own methods. In the example, `merits` is `private`: no other part of the program can set it to 500. This protects the data from accidental change."},{"t":"p","text":"**[[Inheritance]]** lets a new class take on all the properties and methods of an existing class and then add its own. A `Prefect` class could inherit from `Pupil` and add a `Duty` property, without rewriting any of the pupil code."},{"t":"compare","head":["Procedural","Object-oriented"],"rows":[["Built from","Sequences of commands in procedures and functions","Objects made from classes"],["Data and code","Kept separate; data passed to procedures","Combined inside each object"],["Design starts with","The steps (top-down)","The objects in the problem"],["Reuse","Functions can be reused","Classes reused and extended by inheritance"],["Best suited to","Smaller, linear tasks","Large, complex systems, GUIs and games"]]},{"t":"p","text":"Because each class is self-contained, it can be written and tested on its own and **reused** in other programs, which makes large programs quicker to build and more reliable. Every form, button and text box you drag onto a C# Windows Form is an object made from a class in the .NET library."},{"t":"warn","text":"Do not mix up class and object. The **class** is the blueprint; the **object** is the thing built from it. 'An object is a template for a class' is the wrong way round and loses the mark."},{"t":"key","title":"Key points","items":["OOP builds programs from objects; design starts with the objects in the problem.","Class = blueprint; object = an instance of a class with its own data.","Properties are an object's data; methods are its actions.","Encapsulation protects an object's data; inheritance lets a class reuse and extend another class."]}],"diagram":{"kind":"hotspot","title":"Classes, objects and inheritance","caption":"Click each part. Pupil is the class (blueprint); p1 and p2 are objects made from it; Prefect inherits everything from Pupil and adds its own data.","rows":[[{"label":"Class: Pupil","detail":"The blueprint. Properties: Name, Form, merits (private). Methods: AddMerit(), Report(). Writing the class does not create any pupils.","span":2}],[{"label":"Object p1","detail":"new Pupil(\"Aoife\", \"11B\") creates an instance with its own data. After two calls to AddMerit() its merits value is 2."},{"label":"Object p2","detail":"A second instance of the same class: Conor in 11C. Its merits value is separate from p1's and is still 0."}],[{"label":"Class: Prefect","detail":"Inherits Name, Form, merits, AddMerit() and Report() from Pupil and adds a Duty property and an AssignDuty() method. In C#: class Prefect : Pupil.","span":2}]],"links":[["Class: Pupil","Object p1"],["Class: Pupil","Object p2"],["Class: Pupil","Class: Prefect"]]},"check":[{"q":"Which statement about classes and objects is correct?","o":["An object is a blueprint used to make classes","A class is a blueprint; an object is an instance of a class","A class and an object are the same thing","Objects cannot hold data"],"a":1,"why":"Classes are templates; objects are made from them."},{"q":"A Car class has Colour and Speed, and an Accelerate() routine. What is Accelerate()?","o":["A property","A method","A parameter","An object"],"a":1,"why":"Actions an object can perform are methods."},{"q":"Which OOP feature lets a Minibus class reuse all the code of a Vehicle class?","o":["Encapsulation","Iteration","Inheritance","Concatenation"],"a":2,"why":"Inheritance passes a class's properties and methods on to a new class."},{"q":"Making a property private so it can only be changed through the object's methods is called…","o":["encapsulation","decomposition","compilation","abstraction"],"a":0,"why":"Encapsulation protects an object's data."}],"exam":[{"year":2025,"paper":"Unit 4","q":"7","marks":6,"summary":"Extended writing (QWC): describe procedural programming and object-oriented programming.","tip":"OOP answers scored well when they used class, object, property, method, encapsulation and inheritance accurately; keep procedural to the same depth.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2024,"paper":"Unit 4","q":"5","marks":9,"summary":"Complete sentences about programming paradigms, then judge statements about compilers and interpreters.","tip":"The gaps needed the precise terms (class, object, method, inheritance).","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"}],"practice":[{"q":"A Fermanagh bike-hire company is writing its booking system using object-oriented programming. A Bike class is created. (a) State the difference between a class and an object. (b) Give one property and one method the Bike class could have.","m":4,"a":"(a) A class is a blueprint/template that defines properties and methods (1); an object is an instance created from the class with its own data (1). (b) Property, e.g. FrameSize / BikeID / Available (1); method, e.g. Hire() / Return() / CalculateCost() (1)."},{"q":"Describe procedural programming and object-oriented programming. (6 marks, quality of written communication)","m":6,"a":"Level 3 answer covers both in similar depth. Procedural: imperative commands executed in sequence (1); grouped into procedures and functions called when needed (1); top-down design (1); data kept separate and passed as parameters (1). OOP: program built from interacting objects (1); class is a template, object an instance (1); properties hold data and methods are actions (1); encapsulation protects data (1); inheritance lets classes reuse code (1); classes can be reused in other programs (1)."}],"videos":[{"title":"Programming paradigms: procedural and object-oriented – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D01-video"},{"title":"Contemporary trends in software development (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zc8pjty/revision/1"},{"title":"OCR A Level SLR7 – Object-oriented languages, part 1 (enrichment)","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=1842"}],"terms":["Object-oriented programming","Class","Object","Property","Method","Encapsulation","Inheritance"]},{"id":"c01-p03","spec":"Explain the significance of the following aspects of software development environments: editing features; high-level code translation and execution","lessons":["D02"],"summary":"An IDE brings together an editor, translator and debugger; its editing features such as IntelliSense, syntax highlighting, error underlining, line numbers and code outlining help programmers write correct code faster.","blocks":[{"t":"p","text":"You write C# in Visual Studio, which is an [[integrated development environment|IDE]] (IDE): one application that holds every tool needed to develop a program. The specification asks you to explain the **significance** of its features, which means saying *how each one helps the programmer*, not just naming it."},{"t":"h","text":"What is in an IDE?"},{"t":"list","items":["**Code editor**: where [[source code]] is typed, with the editing features below.","**Translator**: a compiler or interpreter that turns the source code into code the computer can run (see the next page).","**[[Debugger]]**: lets you set [[breakpoints|Breakpoint]], step through the code one line at a time and watch the values of variables change. It is the main tool for tracking down logic errors.","**GUI designer and toolbox**: drag buttons, labels and text boxes onto a form.","**Solution (project) explorer**: organises all the files in a project.","**Error list and run-time environment**: run the program inside the IDE and see a list of errors with line numbers."],"ordered":false},{"t":"h","text":"Editing features and why they matter"},{"t":"table","head":["Feature","What it does","Why it helps"],"rows":[["[[IntelliSense]] / auto-complete","Suggests keywords, variable and method names as you type, and shows the parameters a method needs","Faster typing; fewer spelling and syntax errors; you do not have to remember every name"],["[[Syntax highlighting]]","Shows keywords, strings, comments and numbers in different colours","Code is easier to read; a missing quotation mark shows up because the colour runs on"],["Error underlining","A wavy red line appears under code that breaks the language rules, as you type","Syntax errors are spotted and fixed immediately, before you try to run"],["Line numbering","Numbers every line in the margin","Go straight to the line named in an error message; refer to lines when working in a team"],["[[Code outlining]]","Collapses and expands blocks such as methods, loops and IF statements","Long programs are easier to navigate; you can hide finished sections"],["Auto-indent and bracket matching","Indents blocks automatically and highlights the partner of a bracket","Structure is clear; mismatched { } are easy to see"]],"caption":"Visual Studio's main editing features"},{"t":"example","title":"Worked example: answering a 'significance' question","steps":["Name the feature: *IntelliSense*.","Say what it does: *it lists matching variable and method names as the programmer types*.","Say why that matters: *so names are spelt the same every time, reducing syntax errors and speeding up coding*."],"context":"Asked: explain how one feature of an IDE helps a programmer (2 marks).","answer":"Name + what it does + benefit gives a complete answer."},{"t":"tip","text":"Mark schemes credit **IntelliSense** and **auto-complete** by name. For 'explain' or 'describe' questions always add the benefit: *fewer errors*, *quicker to write*, *easier to read* or *easier to find errors*."},{"t":"key","title":"Key points","items":["An IDE combines a code editor, translator, debugger, GUI designer and project tools in one application.","Editing features: IntelliSense/auto-complete, syntax highlighting, error underlining, line numbering, code outlining, auto-indent.","Their significance: code is written faster, with fewer errors, and is easier to read and navigate.","The debugger (breakpoints, stepping, watching variables) helps find logic errors."]}],"diagram":{"kind":"hotspot","title":"Inside an IDE window","caption":"Click each part of a typical Visual Studio screen to see what it does and how it helps.","rows":[[{"label":"Solution explorer","detail":"Lists every file in the project (forms, classes, resources) so you can open and organise them."},{"label":"Code editor","detail":"Where source code is typed. Provides IntelliSense, syntax highlighting, error underlining, line numbers, code outlining and auto-indent.","span":2}],[{"label":"Toolbox","detail":"Controls such as Button, TextBox and Label that can be dragged onto a form in the GUI designer."},{"label":"IntelliSense pop-up","detail":"Appears as you type, listing matching names and the parameters a method expects. Press Tab to accept."},{"label":"Debugger","detail":"Set a breakpoint, run, then step line by line and watch variable values in the Locals/Watch window. Used to find logic errors."}],[{"label":"Error list","detail":"Shows every error and warning with its line number. Double-click an entry to jump to the line.","span":2},{"label":"Run / Build","detail":"Compiles the source code and runs the program inside the IDE."}]],"links":[["Code editor","IntelliSense pop-up"],["Code editor","Error list"],["Code editor","Debugger"]]},"check":[{"q":"Which IDE feature suggests names and shows a method's parameters while you type?","o":["Code outlining","IntelliSense","Line numbering","Breakpoint"],"a":1,"why":"IntelliSense (auto-complete) offers suggestions as you type."},{"q":"How does line numbering help a programmer?","o":["It translates code into machine code","It finds the line referred to in an error message quickly","It hides finished methods","It colours keywords"],"a":1,"why":"Error messages give line numbers; line numbering lets you jump straight there."},{"q":"Which tool lets you pause a program and step through it one line at a time?","o":["Debugger","Syntax highlighter","Toolbox","Solution explorer"],"a":0,"why":"The debugger uses breakpoints and stepping."},{"q":"Collapsing a long method so only its first line shows is called…","o":["syntax highlighting","auto-indent","code outlining","compiling"],"a":2,"why":"Code outlining collapses and expands blocks."}],"exam":[{"year":2019,"paper":"Unit 4","q":"1","marks":18,"summary":"Data types, range and presence checks, extending a program, then naming IDE editing features and describing translation.","tip":"Name a genuine editor feature (e.g. IntelliSense, colour coding) and say what it does for the programmer.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2019-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2019-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2025,"paper":"Unit 4","q":"3","marks":15,"summary":"An algorithm for hiring musicians, variables and data types, two IDE aids for the programmer, and syntax versus logic errors.","tip":"Two distinct features, each with how it helps; IntelliSense/auto-complete was credited by name.","url":"https://ccea.org.uk/key-stage-4/gcse/subjects/gcse-digital-technology-2017/past-papers-mark-schemes","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2025-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2025-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2023,"paper":"Unit 4","q":"8","marks":6,"summary":"Extended writing (QWC) on editing features, high-level code translation and execution.","tip":"Explain why each feature matters to the programmer and link translation to running the program; lists of names stay in the lowest level.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"Pupils in a Newry school use an IDE to write C# programs. Describe two editing features of the IDE and explain how each helps the pupils.","m":4,"a":"IntelliSense/auto-complete suggests names and keywords as they type (1) so there are fewer spelling/syntax errors and code is written faster (1); syntax highlighting colours keywords, strings and comments (1) so code is easier to read and mistakes stand out (1); line numbering (1) lets them find the line in an error message (1); code outlining (1) lets them collapse blocks to navigate long programs (1). Any two features with explanation."},{"q":"State two tools, other than the code editor, found in an IDE.","m":2,"a":"Any two: compiler/interpreter (translator) (1); debugger with breakpoints/stepping (1); GUI designer/toolbox (1); solution/project explorer (1); error list/run-time environment (1)."}],"videos":[{"title":"Development environments, editing features and translators – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D02-video"},{"title":"Contemporary trends in software development (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zc8pjty/revision/1"},{"title":"OCR GCSE (J277) 2.5 IDE","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=2279"}],"terms":["IDE","Source code","Debugger","Breakpoint","IntelliSense","Syntax highlighting","Code outlining"]},{"id":"c01-p04","spec":"Explain the significance of the following aspects of software development environments: editing features; high-level code translation and execution","lessons":["D02"],"summary":"High-level source code must be translated into machine code before the processor can run it; a compiler translates the whole program into an executable first, while an interpreter translates and runs it a line at a time.","blocks":[{"t":"p","text":"Programmers write in a [[high-level language]] such as C# or Python because it uses English-like keywords and is easy to read, write and debug. The processor, however, can only execute [[machine code]]: binary instructions specific to that type of processor. So every high-level program must be **translated** before it can run. The software that does this is a [[translator]]."},{"t":"h","text":"Compilers"},{"t":"list","items":["A [[compiler]] translates the **whole program** into machine code **before** it is run.","It reports all the syntax errors it finds as a list once it has finished; the program will not compile until they are fixed.","It produces an [[executable file]] (for example an .exe) that is kept separately from the source code.","The finished program runs **quickly**, because no translation happens while it runs, and it can be given to users **without the source code**, which protects the programmer's work.","Compiling takes time, and the program must be recompiled after every change."],"ordered":false},{"t":"h","text":"Interpreters"},{"t":"list","items":["An [[interpreter]] translates and executes the program **one line (statement) at a time**.","It stops as soon as it meets an error and shows where it is, which makes it convenient while developing and testing.","No executable file is produced: the source code is translated **every time** the program runs.","Interpreted programs run **more slowly**, and the user needs the interpreter installed and access to the source code."],"ordered":false},{"t":"compare","head":["Compiler","Interpreter"],"rows":[["How much is translated","The whole program at once","One line at a time, as it runs"],["Errors","Listed after compiling; nothing runs until fixed","Program stops at the first error reached"],["Output","A separate executable machine-code file","No file; translated on every run"],["Speed of execution","Fast","Slower"],["Source code needed to run?","No, only the executable","Yes, plus the interpreter"],["Best for","Distributing finished programs","Developing and testing"]]},{"t":"note","text":"Strictly, Visual Studio compiles C# into an intermediate language, and the .NET runtime turns that into machine code just before it runs. For GCSE, treat C# as a **compiled** language and Python and JavaScript as **interpreted**."},{"t":"p","text":"The **significance** for a developer: an IDE lets you build (compile) and run with one click, see the error list with line numbers, and use the debugger on the running program. Interpreting suits quick testing; compiling suits handing a fast, finished product to customers."},{"t":"warn","text":"A common error is to say an interpreter 'creates an executable'. Only a compiler produces a stand-alone executable file."},{"t":"key","title":"Key points","items":["The CPU only executes machine code, so high-level source code must be translated.","Compiler: translates the whole program first, creates an executable, runs fast, source code not needed by the user.","Interpreter: translates and runs line by line, stops at the first error, no executable, slower.","IDEs include the translator so code can be built, run and debugged in one place."]}],"diagram":{"kind":"compare","title":"Compiler or interpreter?","caption":"Switch between the two translators to see what happens to the same C# source code.","states":[{"label":"Compiler","points":["Input: the complete source code","Translates every statement before anything runs","Lists all syntax errors with line numbers at the end","Output: an executable machine-code file","The .exe runs quickly and can be shared without the source code","Any change means recompiling"],"art":null},{"label":"Interpreter","points":["Input: the source code, one statement at a time","Translates a line, runs it, then moves to the next","Stops at the first error and reports where it is","No executable file is kept","Runs more slowly: lines are translated on every run","Users need the interpreter and the source code"],"art":null}]},"check":[{"q":"Why must a C# program be translated before it runs?","o":["The CPU can only execute machine code","C# code is too long to store","To add comments to the code","To remove logic errors"],"a":0,"why":"Processors execute binary machine code only."},{"q":"Which translator produces a stand-alone executable file?","o":["Interpreter","Debugger","Compiler","Editor"],"a":2,"why":"A compiler translates the whole program into an executable."},{"q":"Which is an advantage of an interpreter while a program is being developed?","o":["The program runs faster","It stops at the line with the error, so the error is easy to find","The source code is hidden from users","It creates an .exe file"],"a":1,"why":"Line-by-line translation pinpoints where an error occurs."},{"q":"A games company wants to sell a program without revealing its source code. Which translator should it use?","o":["Interpreter","Compiler","Either, it makes no difference","Neither: it should sell the pseudocode"],"a":1,"why":"Customers receive only the compiled executable."}],"exam":[{"year":2022,"paper":"Unit 4","q":"3","marks":6,"summary":"Complete a paragraph on translating high-level code, then questions on IDE features.","tip":"Use the precise terms: source code, machine code, translator, compiler, interpreter.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2022-Summer/Modified/0/GCSE-Digital%20Technology-478-Summer2022-Unit%204,%20Digital%20Development%20Concepts%20(MV18)-Paper.pdf"},{"year":2024,"paper":"Unit 4","q":"5","marks":9,"summary":"Complete sentences on programming paradigms, then decide whether statements about compilers and interpreters are true or false.","tip":"Key facts: compiler translates the whole program and produces an executable; interpreter works line by line, produces no executable and runs more slowly.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf","ms":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2024-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2024-Unit%204,%20Digital%20Development%20Concepts-MS.pdf"},{"year":2023,"paper":"Unit 4","q":"8","marks":6,"summary":"Extended writing (QWC) on editing features, high-level code translation and execution.","tip":"Explain why translation is needed, contrast compiler and interpreter, and say how the IDE supports running the code.","url":"https://ccea.org.uk/downloads/docs/Past-Papers/cleared/GCSE/GCSE%20Digital%20Technology%20(2017)/2023-Summer/Standard/0/GCSE-Digital%20Technology-478-Summer2023-Unit%204,%20Digital%20Development%20Concepts-Paper.pdf"}],"practice":[{"q":"A software house in Derry~Londonderry is developing a timetable app in a high-level language. (a) Explain why the code must be translated. (b) Describe how a compiler translates the code. (c) Give one reason the company would distribute the compiled version.","m":5,"a":"(a) The processor can only execute machine code/binary (1), so high-level source code must be converted by a translator (1). (b) The compiler translates the whole program at once before it runs (1) and produces a separate executable/machine-code file (1). (c) It runs faster / users cannot see or change the source code / users do not need a translator (1)."},{"q":"Give two differences between a compiler and an interpreter.","m":2,"a":"Compiler translates the whole program at once, interpreter one line at a time (1); compiler creates an executable file, interpreter does not (1); compiled code runs faster (1); interpreter stops at the first error, compiler lists errors after translation (1). Any two."}],"videos":[{"title":"Development environments, editing features and translators – narrated lesson","source":"Hub video","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#D02-video"},{"title":"Contemporary trends in software development (CCEA)","source":"BBC Bitesize","url":"https://www.bbc.co.uk/bitesize/guides/zc8pjty/revision/1"},{"title":"OCR GCSE (J277) 2.5 Compilers and interpreters","source":"Video – Craig'n'Dave","url":"https://craigndave.org/?p=2024"}],"terms":["High-level language","Machine code","Translator","Compiler","Interpreter","Executable file"]}],"topic":"T41","topicName":"Contemporary trends in software development","links":{"tests":[{"id":"TF","title":"Unit 4 test F: Software trends and digital data","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#TF"}],"papers":[{"id":"P3","title":"Unit 4 Practice Paper","url":"https://claude.ai/artifact/TBq7fpKDyTvbJrtFT8kaMP#P3"}]}},{"id":"c02","n":2,"title":"Digital data","intro":"How numbers and characters are represented in binary: conversions between denary, binary and hexadecimal, units of data, binary addition and overflow, ASCII and Unicode, data types and Boolean logic.","pages":[{"id":"c02-p01","spec":"Describe how a number is converted to a binary pattern for storage in a computer","lessons":["D03"],"summary":"Computers store numbers as patterns of bits because their circuits are made of two-state switches; each binary column is worth double the one to its right, and n bits give 2ⁿ different patterns.","blocks":[{"t":"p","text":"Inside a processor and memory are billions of tiny switches called transistors. Each one is either **on** or **off**, so a computer can only store two states. We write these as **1** and **0**. A single 1 or 0 is a [[bit]] (short for *binary digit*). Every number, character, image and sound in a computer is stored as a pattern of bits."},{"t":"h","text":"Denary and binary"},{"t":"p","text":"You count in [[denary]] (base 10): ten digits, 0 to 9, and each column is worth **ten times** the column to its right (1, 10, 100, 1000…). [[Binary]] (base 2) uses only two digits, 0 and 1, and each column is worth **twice** the column to its right."},{"t":"table","head":["128","64","32","16","8","4","2","1"],"rows":[["0","0","1","1","0","1","1","0"]],"caption":"54 stored in one byte: 32 + 16 + 4 + 2 = 54"},{"t":"p","text":"To store a number, the computer works out which place values add up to it, puts a 1 in those columns and a 0 everywhere else. The table above shows 54 as the 8-bit pattern `00110110`. Eight bits is a [[byte]], the usual unit for storing a small number or a character."},{"t":"h","text":"How many values can be stored?"},{"t":"p","text":"Each extra bit **doubles** the number of different patterns. With *n* bits there are **2ⁿ** patterns. One byte has 2⁸ = 256 patterns, so it can hold the whole numbers **0 to 255**. The largest 8-bit value, `11111111`, is 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255."},{"t":"table","head":["Bits","Patterns (2ⁿ)","Range of whole numbers"],"rows":[["1","2","0–1"],["4 (a nibb
