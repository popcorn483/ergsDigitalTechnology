name: Update topic PowerPoint and past-paper lists

on:
  push:
    branches: [main]
    paths:
      - "notes/slides/**"
      - "!notes/slides/manifest.json"
      - "papers/**"
      - "!papers/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List uploaded PowerPoints
        run: python3 tools/slides_manifest.py
      - name: List uploaded past papers
        run: python3 tools/papers_manifest.py
      - name: Commit the list if it changed
        run: |
          if ! git diff --quiet -- notes/slides/manifest.json papers/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add notes/slides/manifest.json papers/manifest.json
            git commit -m "Update topic PowerPoint and past-paper lists"
            git push
          fi
