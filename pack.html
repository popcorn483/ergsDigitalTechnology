<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic past paper – Mr Butler's</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16213A"><link rel="icon" href="app-icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png">
<style>@font-face{font-family:'Lemon Milk';src:url('fonts/lemonmilk-bold.woff') format('woff');font-weight:700;font-display:swap}@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/AtkinsonHyperlegible-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/AtkinsonHyperlegible-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/AtkinsonHyperlegible-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{--desk:#E6EAF0;--paper:#fff;--paper-2:#F4F6F9;--ink:#172033;--ink-2:#465063;--ink-3:#687386;--line:#D3D9E2;--accent:#1F5FBF;--accent-ink:#fff;--accent-soft:#E4ECFA;
--ok:#18744A;--ok-soft:#E1F3EA;--warn:#8E5300;--warn-soft:#FFF0D6;--err:#B3261E;--err-soft:#FDE7E5;--navy:#16213A;
--card-shadow:0 1px 2px rgba(20,30,50,.05),0 10px 30px -14px rgba(20,30,50,.22);
--sans:'Atkinson Hyperlegible','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#0E1117;--paper:#181C24;--paper-2:#1F2430;--ink:#E5E8EE;--ink-2:#B2B9C6;--ink-3:#8A93A3;--line:#2F3644;--accent:#8AB6FF;--accent-ink:#0E1117;--accent-soft:#232C4C;--ok:#7FD6A4;--ok-soft:#173226;--warn:#F1B44E;--warn-soft:#382B13;--err:#FF9C94;--err-soft:#3B1B1A;--card-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--desk:#0E1117;--paper:#181C24;--paper-2:#1F2430;--ink:#E5E8EE;--ink-2:#B2B9C6;--ink-3:#8A93A3;--line:#2F3644;--accent:#8AB6FF;--accent-ink:#0E1117;--accent-soft:#232C4C;--ok:#7FD6A4;--ok-soft:#173226;--warn:#F1B44E;--warn-soft:#382B13;--err:#FF9C94;--err-soft:#3B1B1A;--card-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%} body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
a{color:var(--accent)} .back{display:inline-block;margin-bottom:14px;font-weight:700;text-decoration:none}
.brand{display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--ink-3);margin:0 0 4px}
h1{font-family:'Lemon Milk',var(--sans);font-weight:700;letter-spacing:.03em;font-size:clamp(24px,5vw,34px);line-height:1.1;margin:0}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:72ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs a{font-weight:700;text-decoration:none;color:var(--ink-2);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
/* topic packs */
.tp-intro{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:16px}
.tp-intro h2{margin:0;font-size:22px} .tp-intro p{margin:0;color:var(--ink-2);max-width:72ch}
.hrow{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;margin:0 0 8px} .hrow h2{margin:0;font-size:19px;line-height:1.25}
.ib{flex:none;width:32px;height:32px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--ink-3);cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.ip{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px;color:var(--ink-2);max-width:78ch}
.ip p{margin:0 0 6px}.ip p:last-child{margin:0}.ip ul{margin:0;padding-left:18px}.ip li{margin:0 0 4px}
.steps{padding:4px 14px}
.st{border-top:1px solid var(--line)}.st:first-child{border-top:0}
.st-h{font:inherit;width:100%;display:flex;align-items:center;gap:10px;padding:10px 0;background:none;border:0;color:var(--ink);cursor:pointer;text-align:left;min-height:46px}
.st-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink-3);border:1px solid var(--line)}
.st.open .st-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .st.has:not(.open) .st-n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.st-l{font-weight:700;font-size:15px;flex:none}.st-v{flex:1;min-width:0;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-v:not(:empty)::before{content:'· ';color:var(--ink-3)}
.st-c{flex:none;width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin:-4px 6px 0 auto;transition:transform .15s}
.st.open .st-c{transform:rotate(-135deg);margin-top:4px}
.st-b{padding:0 0 12px}
.tp-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.tp-opts.tp-topics{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tp-opt{font:inherit;font-size:15px;text-align:left;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:0;min-height:44px;line-height:1.3}
.tp-opt small{color:var(--ink-3);font-size:12.5px;line-height:1.3}
.tp-opt:hover{border-color:var(--accent)}
.tp-opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tp-topic{flex-direction:row;align-items:flex-start;gap:10px}.tp-topic>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.tp-n{flex:none;font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.tp-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.tp-head h3{margin:0;font-size:20px}
#tp-count{font-weight:700} #tp-count2{color:var(--ink-3);font-size:14px;display:block}
.tp-dls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px}
.tp-title{margin:0;font-size:17px;line-height:1.3}
.tp-dl{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:10px;padding:8px 10px;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-align:center;line-height:1.2}
.tp-dl b{display:flex;gap:8px;align-items:center;color:var(--accent)} .tp-dl small{color:var(--ink-2);font-size:13px;line-height:1.35}
.tp-dl.pri{background:var(--accent);color:var(--accent-ink)}
.tp-dl:disabled{opacity:.55;cursor:default} .tp-dl.working{opacity:1;cursor:progress}
.tp-dl svg{flex:none}
.tp-status{border-radius:10px;padding:10px 12px;margin:6px 0 4px;background:var(--paper-2);border:1px solid var(--line);font-size:15px}
.tp-status.busy{background:var(--accent-soft);border-color:var(--accent)} .tp-status.ok{background:var(--ok-soft);border-color:var(--ok)} .tp-status.warn{background:var(--warn-soft);border-color:var(--warn)} .tp-status.err{background:var(--err-soft);border-color:var(--err);color:var(--ink)}
.tp-status progress{display:block;width:100%;height:8px;margin-top:8px;accent-color:var(--accent)}
.tp-tools{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:6px 0;font-size:15px}
.tp-tools label{display:flex;gap:8px;align-items:center}
.tp-tools select,.tp-mini{min-height:36px;font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);color:var(--ink);cursor:pointer}
.tp-tools .sp{flex:1}
#tp-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
details.qs{margin:8px 0 0} details.qs>summary{list-style:none;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:700;min-height:44px}
details.qs>summary::-webkit-details-marker{display:none}
.qs-more{color:var(--accent);white-space:nowrap}.qs-more::after{content:' ▸'}details.qs[open] .qs-more::after{content:' ▾'}
details.qs[open]>summary{margin-bottom:6px}
details.about{margin:4px 0 12px;font-size:14px;color:var(--ink-2)} details.about>summary{cursor:pointer;font-weight:700;color:var(--ink-3);padding:6px 0}
details.about ul{margin:6px 0 0;padding-left:18px} details.about li{margin:0 0 4px}
#tp-list li{border-bottom:1px solid var(--line)}
.tp-q{display:grid;grid-template-columns:auto 2.2em 1fr;gap:4px 8px;align-items:start;padding:9px 2px;cursor:pointer}
.tp-q input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.tp-num{font-weight:700;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.tp-qt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tp-qt b{font-size:15px} .tp-sum{color:var(--ink-2);font-size:14px}
.tp-flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tp-flag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--paper-2);color:var(--ink-3)}
.tp-flag.ok{background:var(--ok-soft);color:var(--ok)} .tp-flag.warn{background:var(--warn-soft);color:var(--warn)}
#tp-list li.off .tp-qt{opacity:.5} #tp-list li.off .tp-num{color:var(--ink-3)}
.tp-reps{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.tp-rep h4{margin:0;font-size:13px} .tp-rep p{margin:0 0 4px;font-size:13px;color:var(--ink-2)} .tp-rep p.warn{color:var(--warn)}
.small{font-size:14px;color:var(--ink-3)} code{font-size:13px;overflow-wrap:anywhere;background:var(--paper-2);padding:1px 4px;border-radius:4px}
details.how summary{cursor:pointer;font-weight:700;color:var(--ink-2)} details.how ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2)}
/* scheme of work */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.bar label{display:flex;gap:8px;align-items:center;font-size:15px} .bar input{width:4.2em;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);color:var(--ink)}
.seg button,.prb{font:inherit;font-weight:700;padding:6px 12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pr{margin-left:auto}
.u{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.u h2{margin:0 0 10px;font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.k{font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:6px}
.note{color:var(--ink-2);margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px} th,td{text-align:left;vertical-align:top;padding:8px 6px;border-top:1px solid var(--line)}
th{font-size:13px;font-weight:700;color:var(--ink-3);border-top:0}
td.n,th.n{width:2.2em;color:var(--ink-3)} td.w,th.w{width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700} .t{font-weight:600;text-decoration:none} .sub{display:block;color:var(--ink-3);font-size:13px}
.u ul{margin:0;padding:0;list-style:none} .u li{margin:0 0 2px} .u li a,.u li .lc{font-variant-numeric:tabular-nums;font-weight:600;text-decoration:none;margin-right:4px}
.u li .lc{color:var(--accent);font-family:var(--mono,monospace);font-size:13px}
.foot{color:var(--ink-3);font-size:14px}
[hidden]{display:none!important}
/* exam countdown */
.cd{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0 12px;box-shadow:var(--card-shadow)}
.cd .hrow{margin-bottom:6px}.cd .hrow h2{font-size:16px}.cd-st{display:none}
#cd-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cd-c{background:var(--paper-2);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;min-width:0;line-height:1.3}
.cd-c.soon{border-top-color:var(--warn)} .cd-c.past{opacity:.6;border-top-color:var(--line)} .cd-c.none{border-top-color:var(--line);border-top-style:dashed}
.cd-k{display:flex;justify-content:space-between;gap:4px;font-size:13px}.cd-k span{color:var(--ink-3);font-weight:700;font-size:11px}
.cd-big{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}.cd-c.none .cd-big{font-size:13px;color:var(--ink-3)}
.cd-w{font-size:12px;color:var(--ink-2)} .cd-t{font-size:11.5px;color:var(--ink-3)}
details.cd-ed{margin-top:6px} details.cd-ed>summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:13px;display:inline-block}
details.cd-ed table{margin:6px 0;font-size:14px} details.cd-ed td,details.cd-ed th{padding:4px 6px} details.cd-ed th{font-size:13.5px;color:var(--ink);font-weight:400}
details.cd-ed input{font:inherit;font-size:14px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);color:var(--ink);max-width:100%}
details.cd-ed input[type=number]{width:4em} .cd-hl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){#cd-list{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:4px}.cd-c{flex:0 0 128px;scroll-snap-align:start}}
.cd-sow{margin:-4px 0 10px;font-size:14.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:6px 10px}.cd-sow.warn{background:var(--warn-soft);color:var(--ink)}
/* build a test */
.bt-unit{border:1.5px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin:0 0 10px;min-width:0} .bt-unit.on{border-color:var(--accent)}
.bt-unit legend{padding:0 6px} .bt-unit:not(.on){border-color:transparent;padding:0 12px 2px;background:var(--paper-2)} .bt-ul{display:flex;gap:8px;align-items:baseline;cursor:pointer;flex-wrap:wrap} .bt-ul input,.bt-t input,.bt-chk input{width:18px;height:18px;accent-color:var(--accent);align-self:center;flex:none}
.bt-ul span{color:var(--ink-2);font-size:14px}
.bt-ut{display:flex;gap:8px;margin:2px 0 8px}
.bt-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.bt-t{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;background:var(--paper-2);cursor:pointer;min-width:0}
.bt-tt{display:flex;flex-direction:column;min-width:0}.bt-tt b{font-size:14.5px;line-height:1.3}.bt-tt small{color:var(--ink-3);font-size:12.5px}
.bt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px;align-items:start}
.bt-f{display:flex;flex-direction:column;gap:3px;font-size:15px;min-width:0}.bt-f>span{font-weight:700;font-size:13px;color:var(--ink-3)}
.bt-f select,.bt-f input[type=number]{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);color:var(--ink);max-width:100%}
.bt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bt-row input[type=number]{width:5.5em}
.bt-chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer} .bt-chk small{display:block;color:var(--ink-3);font-size:13px}
.bt-go{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.bt-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dim{opacity:.5}
.ws{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.ws .ws-h{margin:0;font-size:16px}.ws-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px;margin:8px 0 10px}
.bt-mixset{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 0}
.bt-tps{display:flex;flex-direction:column;gap:6px}.bt-tp{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--ink)}.bt-tp>span{color:var(--ink);font-weight:700}.bt-tq{display:flex;flex-wrap:wrap;gap:6px 10px;margin:-2px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}.bt-tq:last-of-type{border-bottom:0}.bt-tql{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-2)}.bt-tql select{font:inherit;font-weight:400;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}.bt-tp small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}.bt-tp small.over{color:var(--warn);font-weight:700}.bt-tp .bt-spin button{width:32px;height:32px;font-size:16px}.bt-tp .bt-spin input{height:32px;width:2.8em}
.bt-sps{display:flex;flex-wrap:wrap;gap:8px 18px}.bt-sp{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700;color:var(--ink-2)}
.bt-sp small{font-weight:400;color:var(--ink-3);font-size:12px}.bt-sp small.over{color:var(--warn);font-weight:700}
.bt-spin{display:flex;align-items:center;gap:0}.bt-spin button{font:inherit;font-weight:700;font-size:18px;width:36px;height:36px;border:1px solid var(--line);background:var(--paper);color:var(--accent);cursor:pointer}
.bt-spin button:first-child{border-radius:8px 0 0 8px}.bt-spin button:last-child{border-radius:0 8px 8px 0}
.bt-spin input{font:inherit;width:3.2em;height:36px;text-align:center;border:1px solid var(--line);border-left:0;border-right:0;background:var(--paper);color:var(--ink);-moz-appearance:textfield}
.bt-spin input::-webkit-inner-spin-button{-webkit-appearance:none}
.bt-ty{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;background:var(--paper-2);color:var(--ink-3);border:1px solid var(--line);vertical-align:1px}
.bt-ty.mc{background:var(--accent-soft);color:var(--accent);border-color:transparent}.bt-ty.long{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bt-checks{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin:8px 0 4px}
.vs-lead{margin:0 0 8px}.vs-me{margin:0 0 8px}
.bt-btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}.bt-btn:disabled{opacity:.5;cursor:default}
.bt-btn.sec{background:var(--paper);color:var(--accent)}

<script>
/* Teacher area: the ⓘ info buttons. A button.ib (aria-controls -> div.ip) opens its note; a second tap, Escape or a tap

/* Teacher area: topic packs. Builds a PDF in the browser (pdf-lib, lib/pdf-lib.min.js) of every CCEA past-paper question the

   Data: papers/topics.json (topic -> questions), folders.json + manifest.json (which PDFs), crops.json (where each question and
   mark scheme sits: [[page, top, bottom]] as fractions of the page height from the top), pages.json (the page, when a question
   could not be cut out), reports.json (examiner-report comments). The crops are embedded as vector page parts (embedPages with
   a bounding box), never rasterised. Inlined into teacher.html by notes/front/sow.py. */
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);

  const COURSE_NAME = { gcse: 'GCSE', gce: 'A level' };

  const NO_REPORT = { gcse: ['2021', 'Specimen'], gce: ['Summer 2021', 'Summer 2022 Resit', 'Specimen'] };   /* CCEA published none */
  const store = { get(k, d) { try { const v = localStorage.getItem('teacher.' + k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('teacher.' + k, v); } catch (e) { } } };

  /* ------------------------------------------------------------------ helpers on one question */
  const serLabel = s => /^\d{4}$/.test(s) ? 'Summer ' + s : s;
  const qLabel = q => 'Q' + q;
  function info(book, it) {
    const [b, s] = [book.id, it.s], folder = D.folders[b + '|' + s], files = folder ? D.manifest[folder] || {} : {};
    const cr = D.crops[it.k] || {}, pg = D.pages[it.k] || {}, rep = (D.reports.crops || {})[it.k] || null;
    const segs = a => Array.isArray(a) && a.length ? a.filter(x => Array.isArray(x) && x.length === 3) : null;
    const marks = Number.isInteger(it.m) ? it.m : (Number.isInteger(cr.marks) ? cr.marks : null);
    const rkey = book.course + '|' + s, rfile = (D.reports.files || {})[rkey] || null;
    const none = ((D.reports.none || NO_REPORT)[book.course] || []).includes(s) || /specimen|resit/i.test(s) || /\b2021\b/.test(s);
    const report = rep ? 'crop' : rfile ? 'nocomment' : none ? 'none' : 'missing';
    return { paper: files.paper || null, ms: files.ms || null, cp: segs(cr.paper), cm: segs(cr.ms), cs: segs(cr.stem), px: cr.px || [], sx: cr.sx || [], mx: cr.mx || [], pg: cr.pg || [], sg: cr.sg || [], pp: +pg.paper || null, pm: +pg.ms || null,
             marks, rep, rfile, report, series: serLabel(s), head: `${serLabel(s)} · ${book.short} · ${qLabel(it.q)}${marks ? ` · ${marks} mark${marks === 1 ? '' : 's'}` : ''}` };
  }
  const yr = s => { const m = /(20\d\d)/.exec(s); return m ? +m[1] : 0; };
  function ordered(book, topic) {
    const it = topic.items.slice();   /* topics.json is newest first, specimens last */
    if (S.order === 'old') it.sort((a, b) => (yr(a.s) || 9999) - (yr(b.s) || 9999) || (/resit/i.test(a.s) - /resit/i.test(b.s)) || topic.items.indexOf(a) - topic.items.indexOf(b));
    return it;
  }

  /* ------------------------------------------------------------------ the step flow */
  const ui = {};
  /* collapsible steps: the current step shows its options; a step with a choice is one row ("Course · GCSE ▾") that reopens on a tap */
  function Steps(root) {
    const all = () => [...root.querySelectorAll(':scope > .st')], get = n => all().find(x => +x.dataset.step === n);
    const api = {
      open(n) { all().forEach(x => { const on = +x.dataset.step === n; x.classList.toggle('open', on); x.querySelector('.st-h').setAttribute('aria-expanded', String(on)); x.querySelector('.st-b').hidden = !on; }); },
      val(n, v) { const x = get(n); if (!x) return; x.querySelector('.st-v').textContent = v || ''; x.classList.toggle('has', !!v); },
      show(n, on) { const x = get(n); if (x) x.hidden = !on; },
    };
    all().forEach(x => x.querySelector('.st-h').addEventListener('click', () => { const n = +x.dataset.step; api.open(x.classList.contains('open') && x.classList.contains('has') ? 0 : n); }));
    return api;
  }
  function pressed(group, val) { group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === val))); }

  function renderCourses() {
    ui.course.innerHTML = '';
    for (const c of ['gcse', 'gce']) {
      const bs = D.topics.books.filter(b => b.course === c); if (!bs.length) continue;
      const n = bs.reduce((a, b) => a + b.topics.reduce((x, t) => x + t.items.length, 0), 0);
      ui.course.append(el('button', { type: 'button', class: 'tp-opt', 'data-v': c, 'aria-pressed': 'false', onclick: () => pickCourse(c) },
        el('b', { text: COURSE_NAME[c] }), el('small', { text: bs.map(b => b.short).join(', ') + ' · ' + n + ' questions' })));
    }
  }
  function pickCourse(c, keep) {
    const same = S.course === c && S.book && S.book.course === c;
    S.course = c; store.set('course', c); pressed(ui.course, c);
    ui.unit.innerHTML = '';
    for (const b of D.topics.books.filter(b => b.course === c)) {
      const n = b.topics.reduce((x, t) => x + t.items.length, 0);
      ui.unit.append(el('button', { type: 'button', class: 'tp-opt', 'data-v': b.id, 'aria-pressed': 'false', onclick: () => pickBook(b.id) },
        el('b', { text: b.short }), el('small', { text: b.title + ' · ' + n + ' questions' })));

    if (same) pressed(ui.unit, S.book.id);
    if (!keep && !same) { S.book = S.topic = null; ui.steps.val(2, ''); ui.steps.val(3, ''); ui.steps.show(3, false); ui.packWrap.hidden = true; }
    if (!keep) ui.steps.open(2);
  }
  function pickBook(id, keep) {
    const b = D.topics.books.find(x => x.id === id); if (!b) return;
    const same = S.book === b && S.topic;
    S.book = b; store.set('book', id); pressed(ui.unit, id);
    ui.topic.innerHTML = '';
    for (const t of b.topics) {
      const tot = t.items.reduce((a, it) => a + (info(b, it).marks || 0), 0);
      ui.topic.append(el('button', { type: 'button', class: 'tp-opt tp-topic', 'data-v': String(t.n), 'aria-pressed': 'false', onclick: () => pickTopic(t.n) },
        el('span', { class: 'tp-n', text: String(t.n) }), el('span', {}, el('b', { text: t.title }), el('small', { text: `${t.items.length} question${t.items.length === 1 ? '' : 's'} · ${tot} marks` }))));
    }

  }
  function pickTopic(n, restore) {

    S.topic = t; S.off = new Set(); store.set('topic', S.book.id + '|' + n); pressed(ui.topic, String(n));
    ui.steps.val(3, t.title); ui.steps.open(0); ui.qs.open = false;

  }
  function chosen() { return ordered(S.book, S.topic).filter(it => !S.off.has(it.k)); }
  function renderSummary() {
    const its = chosen(), inf = its.map(it => info(S.book, it));
    const known = inf.filter(x => x.marks !== null), tot = known.reduce((a, x) => a + x.marks, 0);
    const reps = inf.filter(x => x.report === 'crop').length, whole = inf.filter(x => x.paper && !x.cp).length, nopaper = inf.filter(x => !x.paper).length;
    const all = S.topic.items.length, pl = n => n === 1 ? '' : 's';
    ui.count.textContent = (its.length < all ? `${its.length} of ${all} question${pl(all)} selected` : `${all} question${pl(all)}`) + ` · ${known.length < inf.length ? 'at least ' : ''}${tot} marks · ${reps} with examiner comment${pl(reps)}`;
    const notes = [];
    if (whole) notes.push(`${whole} shown as the whole page (not cut out automatically)`);
    if (nopaper) notes.push(`${nopaper} whose paper is not uploaded yet`);

  }
  function renderPack() {
    const b = S.book, t = S.topic;
    ui.packTitle.textContent = `${b.short} – ${t.title}`;
    ui.list.innerHTML = '';
    ordered(b, t).forEach(it => {
      const x = info(b, it);
      const flags = [];
      if (!x.paper) flags.push(['warn', 'Paper not uploaded']);
      else if (!x.cp) flags.push(['warn', x.pp ? 'Whole page ' + x.pp : 'Not located']);
      if (x.report === 'crop') flags.push(['ok', x.rep.found === it.q ? 'Report comment' : `Report: ${qLabel(x.rep.found)} comment`]);
      else if (x.report === 'nocomment') flags.push(['mute', 'No report comment']);

      cb.addEventListener('change', () => { cb.checked ? S.off.delete(it.k) : S.off.add(it.k); row.classList.toggle('off', !cb.checked); number(); renderSummary(); });
      const row = el('li', { class: S.off.has(it.k) ? 'off' : '' },
        el('label', { class: 'tp-q' }, cb, el('span', { class: 'tp-num' }),
          el('span', { class: 'tp-qt' }, el('b', { text: x.head }), el('span', { class: 'tp-sum', text: it.t || '' }),
            el('span', { class: 'tp-flags' }, ...flags.map(([k, v]) => el('span', { class: 'tp-flag ' + k, text: v }))))));

    });

  }
  function number() { let i = 0; ui.list.querySelectorAll('li').forEach(li => { li.querySelector('.tp-num').textContent = li.classList.contains('off') ? '–' : String(++i); }); }

  /* ------------------------------------------------------------------ progress and errors */
  let ST = null;   /* the status box in use: the topic packs' or the test builder's {box, text, bar} */
  function setStatus(msg, kind, frac) {
    const st = ST || { box: ui.status, text: ui.statusText, bar: ui.bar }; if (!st.box) return;
    st.box.hidden = !msg; st.box.className = 'tp-status' + (kind ? ' ' + kind : '');
    st.text.textContent = msg || '';
    st.bar.hidden = frac === undefined || frac === null; if (!st.bar.hidden) st.bar.value = Math.max(0, Math.min(1, frac));

  /* ------------------------------------------------------------------ building the PDF */
  let LIB = null;
  const pdfLib = () => LIB || (LIB = new Promise((ok, no) => {
    if (window.PDFLib) return ok(window.PDFLib);

    s.onload = () => window.PDFLib ? ok(window.PDFLib) : no(new Error('pdf-lib did not load'));

  const VARIANT = {

    questions: { name: 'Questions only', sub: 'Pupil worksheet', file: ' (worksheet)' },
    answers: { name: 'Mark schemes and reports', sub: 'Answers, numbered to match the worksheet', file: ' (mark schemes and reports)' },
  };

  /* the blocks for one question: head / label / seg {src, page, t, b, hl} / note */
  function blocks(variant, n, book, it, layout, noStem) {
    const x = info(book, it), out = [];

    const squeeze = (layout || S.layout) === 'compact' && variant !== 'questions';
    const segOf = (src, C, hl, X, G) => C.flatMap(([p, t, b], i) => {
      const lr = (X && X[i]) || [0, 1], h = (hl || []).filter(z => z[0] === p).map(z => [z[1], z[2]]), mk = (a, z) => ({ k: 'seg', src, page: p, t: a, b: z, l: lr[0], r: lr[1], hl: h });
      const gs = squeeze && G && G[i] ? G[i].filter(g => g[0] > t && g[1] < b && g[1] > g[0]) : [];
      if (!gs.length) return [mk(t, b)];
      const out = []; let a = t; gs.forEach(g => { out.push(mk(a, g[0]), { k: 'squeeze' }); a = g[1]; }); out.push(mk(a, b)); return out;
    });
    const whole = (src, p, what) => [{ k: 'label', text: `${what}: whole page ${p} (this question could not be cut out automatically)`, tone: 'warn' }, { k: 'seg', src, page: p, t: 0, b: 1, hl: [] }];
    const question = () => {
      if (!x.paper) return [{ k: 'note', text: `The ${x.series} ${book.short} question paper is not uploaded yet.` }];
      if (x.cp) return [...(x.cs && !noStem ? [{ k: 'label', text: `From the start of Q${String(it.q).match(/^\d+/)}`, tone: 'mute' }, ...segOf(x.paper, x.cs, null, x.sx, x.sg), { k: 'gap' }] : []), ...segOf(x.paper, x.cp, null, x.px, x.pg)];
      if (x.pp) return whole(x.paper, x.pp, 'Question paper');

    };
    const box = (kind, title, sub, items) => [{ k: 'box', kind, title, sub }, ...items, { k: 'boxend' }];
    const scheme = () => {
      if (!x.ms) return box('ms', 'Mark scheme', '', [{ k: 'note', text: `The ${x.series} ${book.short} mark scheme is not uploaded yet.` }]);
      if (x.cm) return box('ms', 'Mark scheme', '', segOf(x.ms, x.cm, null, x.mx));
      if (x.pm) return box('ms', 'Mark scheme', `whole page ${x.pm}: not cut out automatically`, [{ k: 'seg', src: x.ms, page: x.pm, t: 0, b: 1, hl: [] }]);
      return box('ms', 'Mark scheme', '', [{ k: 'note', text: 'Not located in the mark scheme: see the mark scheme itself.' }]);
    };
    const report = () => {
      if (x.report === 'none') return [];
      if (x.report === 'missing') return box('er', 'Examiner’s comment', x.series, [{ k: 'note', text: `Examiner report not uploaded yet: upload CCEA’s ${x.series} report to ${REPORT_DIR[book.course]}.` }]);
      if (x.report === 'nocomment') return box('er', 'Examiner’s comment', x.series, [{ k: 'note', text: `The ${x.series} examiner report has no comment on this question.` }]);
      const f = x.rep.found, own = f === it.q;
      return box('er', 'Examiner’s comment', x.series + (own ? '' : ` · comment on ${qLabel(f)}${x.rep.hl ? ', the lines about this part highlighted' : ''}`), segOf(x.rep.report_file, x.rep.report, x.rep.hl));
    };
    const hd = { k: 'head', n, text: `${x.series} · ${book.short} · ${qLabel(it.q)}`, marks: x.marks };
    if (variant === 'answers' && noStem) {   /* a test's mark scheme: just the answers, no tinted boxes or reports (prints cleanly, uses less paper) */
      const sc = scheme(); out.push(hd, ...sc.filter(z => z.k !== 'box' && z.k !== 'boxend'));
    } else if (variant === 'answers') out.push(hd, ...scheme(), { k: 'gap' }, ...report());

  }

  /* topic worksheets (papers/worksheets.json): key terms and exam tips from the workbook, plus a few CCEA questions */
  let WSD = null;
  const hashSeed = str => [...str].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) >>> 0, 7) || 1;
  async function wsJob() {
    WSD = WSD || await getJ('papers/worksheets.json', true);

    const nT = +S.wsTerms || d.terms.length, nQ = S.wsQs === '0' ? 0 : +S.wsQs || 9999, nTip = +S.wsTips || d.tips.length;
    const step = d.terms.length / Math.max(1, Math.min(nT, d.terms.length));
    const terms = (nT >= d.terms.length ? d.terms.slice() : Array.from({ length: nT }, (_, i) => d.terms[Math.floor(i * step)])).sort((a, b) => a[0].localeCompare(b[0]));
    let a = hashSeed(book.id + topic.n + terms.length) >>> 0; const R = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const perm = terms.map((_, i) => i); for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    const qs = chosen().slice(0, nQ);

      txt(page, 'Date', M.l + 398, y - 12, 10, bold, C.ink); page.drawLine({ start: { x: M.l + 426, y: y - 14 }, end: { x: W - M.r, y: y - 14 }, thickness: .6, color: C.ink3 }); y -= 30; }
    if (variant !== 'questions') {   /* key */
      let kx = M.l; for (const [k, t] of [['ms', 'Mark scheme'], ['er', 'Examiner’s comment']]) { page.drawRectangle({ x: kx, y: y - 11, width: 11, height: 11, color: C[k].fill, borderColor: C[k].edge, borderWidth: .8 }); txt(page, t, kx + 16, y - 9.5, 9, reg, C.ink2); kx += 30 + tw(t, 9, reg); }
      y -= 22;
    }
    page.drawLine({ start: { x: M.l, y }, end: { x: W - M.r, y }, thickness: .8, color: C.line }); y -= 14;
    if (job.test) {   /* the test cover: instructions, then a marks table (per question, or per topic for long tests) */
      const T = job.test, pupil = variant === 'questions';
      if (pupil) {
        const ins = [`Time allowed: ${T.minutes ? hm(T.minutes) : '________'}.`, `Total marks: ${tot}.`, 'Answer all questions in the spaces provided. The marks for each question are shown in brackets on the right.'];
        for (const ln of ins.flatMap(t => wrap(reg, 10, t, CW))) { txt(page, ln, M.l, y - 10, 10, reg, C.ink); y -= 14; }
        y -= 8;
      }
      txt(page, pupil ? 'MARKS (FOR THE TEACHER)' : 'MARKS SUMMARY', M.l, y - 10, 9, bold, C.ink2); y -= 18;
      let cols = T.perTopic ? (pupil ? [['Topic', .56], ['Questions', .18], ['Available', .13], ['Awarded', .13]] : [['Topic', .6], ['Questions', .2], ['Marks', .2]])
                              : (pupil ? [['Q', .07], ['Topic', .53], ['Available', .2], ['Awarded', .2]] : [['Q', .07], ['Topic', .43], ['From', .32], ['Marks', .18]]);
      const rows = T.rows.map(r => T.perTopic ? (pupil ? [r.label, r.qs, String(r.marks), ''] : [r.label, r.qs, String(r.marks)]) : (pupil ? [r.qs, r.label, String(r.marks), ''] : [r.qs, r.label, r.sub, String(r.marks)]));
      rows.push(T.perTopic ? (pupil ? ['Total', '', String(tot), ''] : ['Total', '', String(tot)]) : (pupil ? ['', 'Total', String(tot), ''] : ['', 'Total', '', String(tot)]));
      const RH = 17, numeric = i => /^(Available|Awarded|Marks|Q|Questions)$/.test(cols[i][0]);
      const row = (cells, head, last) => {
        if (room() < RH + 2) newPage();
        if (head) page.drawRectangle({ x: M.l, y: y - RH, width: CW, height: RH, color: C.qbg });
        let cxp = M.l; cells.forEach((c, i) => { const w = cols[i][1] * CW, f = head || last ? bold : reg, sz = head ? 8.5 : 9.5;
          const t = wrap(f, sz, c, w - 10)[0] || '', tx = numeric(i) ? cxp + w / 2 - tw(t, sz, f) / 2 : cxp + 5;
          txt(page, t, tx, y - RH + 5.5, sz, f, head ? C.ink2 : C.ink);
          if (i) page.drawLine({ start: { x: cxp, y }, end: { x: cxp, y: y - RH }, thickness: .5, color: C.line });
          cxp += w; });
        page.drawLine({ start: { x: M.l, y: y - RH }, end: { x: W - M.r, y: y - RH }, thickness: last ? 1 : .5, color: last ? C.ink3 : C.line });
        y -= RH;
      };
      page.drawLine({ start: { x: M.l, y }, end: { x: W - M.r, y }, thickness: .5, color: C.line });
      row(cols.map(c => c[0]), true); rows.forEach((r, i) => row(r, false, i === rows.length - 1));
      y -= 12;
      if (T.types && T.types.length) {   /* count and marks per question type */
        cols = [['Question type', .6], ['Questions', .2], ['Marks', .2]];
        if (room() < RH * (T.types.length + 2) + 4) newPage();
        page.drawLine({ start: { x: M.l, y }, end: { x: W - M.r, y }, thickness: .5, color: C.line });
        row(cols.map(c => c[0]), true); T.types.forEach(t => row([t.label, String(t.n), String(t.marks)], false, false));
        y -= 12;
      }
      if (T.note) { for (const ln of wrap(ital, 8.5, T.note, CW)) { txt(page, ln, M.l, y - 9, 8.5, ital, C.ink3); y -= 11.5; } y -= 6; }
      if (LAY !== 'compact') newPage();   /* standard: the cover page stands alone */
    }
    }
    const pageMarks = new Map();   /* tests: marks of the questions that start on each page */
    for (let qi = 0; qi < plan.length; qi++) {
      if (qi % 4 === 0) { setStatus(`Placing question ${qi + 1} of ${plan.length}`, 'busy', .75 + qi / plan.length * .23); await tick(); }
      const bl = plan[qi];
      if (LAY !== 'compact' && qi > 0) newPage();   /* standard: every question starts on its own page */
      for (let i = 0; i < bl.length; i++) {
        const b = bl[i];
        if (b.k === 'head' && TEST) {   /* tests: a small number and the source, in grey */
          if (room() < chain(bl, i)) newPage();
          const r = 8, cxn = M.l + r, cyn = y - r, ns = String(b.n), nf = ns.length > 2 ? 7 : 8.5;
          page.drawCircle({ x: cxn, y: cyn, size: r, color: C.ink });
          txt(page, ns, cxn - tw(ns, nf, bold) / 2, cyn - nf * .36, nf, bold, rgb(1, 1, 1));
          txt(page, b.text, M.l + 2 * r + 6, y - 11, 8, reg, C.ink3);
          const qm = info(its[qi].book, its[qi].it).marks; if (qm) pageMarks.set(page, (pageMarks.get(page) || 0) + qm);
          y -= 20;
        } else if (b.k === 'head') {
          if (room() < chain(bl, i)) newPage();
          const r = 11, cxn = M.l + r, cyn = y - r;
          page.drawCircle({ x: cxn, y: cyn, size: r, color: C.navy });
          const ns = String(b.n), nf = ns.length > 2 ? 8.5 : 10; txt(page, ns, cxn - tw(ns, nf, bold) / 2, cyn - nf * .36, nf, bold, rgb(1, 1, 1));
          txt(page, b.text, M.l + 2 * r + 9, y - 15, 11.5, bold, C.ink);
          if (b.marks) { const mt = `[${b.marks} mark${b.marks === 1 ? '' : 's'}]`; txt(page, mt, W - M.r - tw(mt, 10, bold), y - 15, 10, bold, C.ink2); }
          page.drawLine({ start: { x: M.l + 2 * r + 9, y: y - 23 }, end: { x: W - M.r, y: y - 23 }, thickness: .6, color: C.line });
          y -= 32;
        } else if (b.k === 'box') {
          if (room() < chain(bl, i)) newPage();
          bx = { kind: b.kind, title: b.title, sub: b.sub }; openFrag(false);
        } else if (b.k === 'boxend') {
          closeFrag(false); bx = null;
        } else if (b.k === 'label') {
          if (room() < chain(bl, i)) newPage();
          const f = b.tone === 'mute' ? ital : bold, c = b.tone === 'warn' ? C.warn : b.tone === 'mute' ? C.ink3 : C.acc;
          for (const ln of wrap(f, 8.5, b.text, cw())) { txt(page, ln, cx(), y - 9, 8.5, f, c); y -= 11.5; }
          y -= 3;
        } else if (b.k === 'note') {
          const lines = wrap(ital, 9.5, b.text, cw() - 4);
          if (room() < lines.length * 12.5 + 4) newPage();
          for (const ln of lines) { txt(page, ln, cx() + 2, y - 10, 9.5, ital, C.ink2); y -= 12.5; }
          y -= 4;
        } else if (b.k === 'gap') {
          y -= LAY === 'compact' ? 5 : 8;
        } else if (b.k === 'squeeze') {   /* answer space taken out: a short dashed rule shows where */
          page.drawLine({ start: { x: cx() + cw() * .3, y: y - 3 }, end: { x: cx() + cw() * .7, y: y - 3 }, thickness: .6, color: C.line, dashArray: [3, 3] });
          y -= 8;
        } else if (b.k === 'seg') {

          if (room() < h && room() < h * SHRINK) newPage();

          const x = cx() + (cw() - w) / 2;
          page.drawPage(b.emb, { x, y: y - h, width: w, height: h });
          for (const [ht, hb] of b.hl) {   /* highlight the lines about this part (fractions of the source page) */
            const a = Math.max(ht, b.t), z = Math.min(hb, b.b); if (z <= a) continue;
            const k = h / (b.b - b.t);
            page.drawRectangle({ x, y: y - (z - b.t) * k, width: w, height: (z - a) * k, color: rgb(1, .78, .16), opacity: .5, blendMode: BlendMode.Multiply });

      }
      if (bx) { closeFrag(false); bx = null; }
      y -= TEST ? 12 : LAY === 'compact' ? 10 : 14;
    }
    if (job.test && variant === 'questions') {
      reflect();
      /* marks per page, bottom right, for quick totting up */
      for (const [p, m] of pageMarks) { const t1 = 'Marks on this page', t2 = `/ ${m}`, bw = 36, x2 = W - M.r - tw(t2, 8.5, bold), xb = x2 - 4 - bw, x1 = xb - 6 - tw(t1, 8, reg);
        txt(p, t1, x1, 17, 8, reg, C.ink3); p.drawRectangle({ x: xb, y: 12, width: bw, height: 16, borderColor: C.ink3, borderWidth: .7 }); txt(p, t2, x2, 17, 8.5, bold, C.ink2); }

    /* after the questions: how pupils check their work now and learn from it once it is marked */
    function reflect() {   /* compact, two columns, so it usually fits under the last question */
      const need = 190; if (room() < need) newPage(); else y -= 4;
      page.drawLine({ start: { x: M.l, y }, end: { x: W - M.r, y }, thickness: .8, color: C.ink3 }); y -= 16;

      txt(page, 'Before you hand in', L, y, 10, bold, C.ink);
      let yl = y - 15; for (const t of ['I have answered every question', 'One point for each mark: [3] = three points', 'I have used the key terms, spelt correctly', '“Explain” answers give a reason (“because…”)']) { tick(t, L, yl); yl -= 13; }

  }

  let busy = false;
  async function download(variant, btn, job, opt) {
    opt = opt || {}; const dls = opt.dls || ui.dl;
    if (busy) return; busy = true; ST = opt.status || null; dls.forEach(b => { b.disabled = true; }); btn.classList.add('working');
    try {
      const r = await build(variant, job);
      if (r && opt.done) opt.done(r);
      if (r) setStatus(`Downloaded “${r.name}”: ${r.pages} page${r.pages === 1 ? '' : 's'}, ${r.kb >= 1024 ? (r.kb / 1024).toFixed(1) + ' MB' : r.kb + ' KB'}.` +
        (r.failed.length ? ` ${r.failed.length} PDF${r.failed.length === 1 ? '' : 's'} could not be loaded (${r.failed.map(f => f.split('/').pop()).join(', ')}); the pack says so where they belong.` : ''), r.failed.length ? 'warn' : 'ok');
    } catch (e) {
      console.error(e); setStatus('The pack could not be made: ' + String(e && e.message ? e.message : e).replace(/\.$/, '') + '. Try again; if it keeps failing, try fewer questions or another browser.', 'err');
    } finally { busy = false; ST = null; btn.classList.remove('working'); if (opt.after) opt.after(); else renderSummary(); }
  }

  /* ------------------------------------------------------------------ examiner reports panel */
  function renderReports() {
    const files = D.reports.files || {}, box = ui.reports; box.innerHTML = '';
    for (const c of ['gcse', 'gce']) {
      const have = Object.keys(files).filter(k => k.startsWith(c + '|')).map(k => k.split('|')[1]).sort((a, b) => yr(a) - yr(b));
      const want = [...new Set(D.topics.books.filter(b => b.course === c).flatMap(b => b.topics.flatMap(t => t.items.map(i => i.s))))]
        .filter(s => !((D.reports.none || NO_REPORT)[c] || []).includes(s) && !/specimen|resit/i.test(s) && !/\b2021\b/.test(s));
      const miss = want.filter(s => !have.includes(s)).sort((a, b) => yr(a) - yr(b));
      const nComments = Object.keys(D.reports.crops || {}).filter(k => D.topics.books.some(b => b.course === c && k.startsWith(b.id + '|'))).length;
      box.append(el('div', { class: 'tp-rep' },
        el('h4', { text: `${COURSE_NAME[c]}: ${have.length} report${have.length === 1 ? '' : 's'} uploaded` }),
        el('p', { text: have.length ? `${have.map(serLabel).join(', ')}. ${nComments} questions have a comment found in them.` : 'None yet.' }),
        miss.length ? el('p', { class: 'warn', text: `Missing: ${miss.map(serLabel).join(', ')}. Upload CCEA’s Chief Examiner’s report for each to ${REPORT_DIR[c]} (any file name with the year, e.g. “Summer ${yr(miss[miss.length - 1]) || 2025}.pdf”).` }) : null));
    }
  }

  /* ------------------------------------------------------------------ start */
  /* pack.html (pupils): one topic's CCEA questions or mark schemes as a PDF: pack.html?b=U1&t=3 (&v=questions|answers starts it) */
  async function pupilStart() {
    const q = new URLSearchParams(location.search), bid = q.get('b'), tn = +q.get('t'), st = { box: $('#pk-status'), text: $('#pk-status-t'), bar: $('#pk-bar') };
    const say = (m, k) => { ST = st; setStatus(m, k); ST = null; };
    try {
      const [topics, folders, manifest, crops, pages, reports] = await Promise.all(['papers/topics.json', 'papers/folders.json', 'papers/manifest.json', 'papers/crops.json', 'papers/pages.json', 'papers/reports.json'].map((u, i) => getJ(u, i < 2)));
      D = { topics, folders: folders || {}, manifest: manifest || {}, crops: crops || {}, pages: pages || {}, reports: reports || { files: {}, crops: {} } };
    } catch (e) { say('The questions could not be loaded. Check you are online and try again.', 'err'); return; }
    const book = D.topics.books.find(b => b.id === bid), topic = book && book.topics.find(t => t.n === tn);
    if (!topic || !topic.items.length) { $('#pk-title').textContent = 'No CCEA questions for this topic'; say('This topic has no CCEA past-paper questions yet.', 'warn'); return; }
    S.book = book; S.topic = topic; S.layout = 'compact'; S.order = 'new'; S.off = new Set();
    $('#pk-unit').textContent = book.short + ': ' + book.title; $('#pk-title').textContent = topic.title;
    const n = topic.items.length; $('#pk-sub').textContent = `${n} CCEA past-paper question${n === 1 ? '' : 's'} on this topic, newest first.`;
    const btns = [...document.querySelectorAll('[data-pk]')];
    btns.forEach(b => { b.disabled = false; b.addEventListener('click', () => download(b.dataset.pk, b, packJob(), { dls: btns, status: st, after: () => btns.forEach(x => { x.disabled = false; }) })); });
    const v = q.get('v'), go = btns.find(b => b.dataset.pk === v); if (go) go.click();
  }
  async function start() {
    if ($('#pk-root')) return pupilStart();
    ui.course = $('#tp-course'); ui.unit = $('#tp-unit'); ui.unitWrap = $('#tp-s2'); ui.topic = $('#tp-topic'); ui.topicWrap = $('#tp-s3'); ui.packWrap = $('#tp-s4'); ui.steps = Steps($('#tp-steps')); ui.qs = $('#tp-qs');
    ui.packTitle = $('#tp-title'); ui.count = $('#tp-count'); ui.count2 = $('#tp-count2'); ui.list = $('#tp-list'); ui.status = $('#tp-status'); ui.statusText = $('#tp-status-t'); ui.bar = $('#tp-bar');
    ui.reports = $('#tp-reports'); ui.dl = [...document.querySelectorAll('[data-dl]')];
    ui.dl.forEach(b => b.addEventListener('click', () => download(b.dataset.dl, b, packJob())));
    const lay = $('#tp-layout'); if (lay) { lay.value = S.layout; lay.addEventListener('change', () => { S.layout = lay.value; store.set('layout', S.layout); }); }
    const ord = $('#tp-order'); ord.value = S.order; ord.addEventListener('change', () => { S.order = ord.value; store.set('order', S.order); if (S.topic) renderPack(); });
    $('#tp-all').addEventListener('click', () => { S.off = new Set(); renderPack(); });
    /* topic worksheet options and downloads */
    S.wsMode = store.get('ws.mode', 'match'); S.wsTerms = store.get('ws.terms', '12'); S.wsTips = store.get('ws.tips', '8'); S.wsQs = store.get('ws.qs', '6');
    [['#ws-mode', 'wsMode', 'ws.mode'], ['#ws-terms', 'wsTerms', 'ws.terms'], ['#ws-tips', 'wsTips', 'ws.tips'], ['#ws-qs', 'wsQs', 'ws.qs']].forEach(([id, k, sk]) => { const e = $(id); if (!e) return; e.value = S[k]; if (e.value !== S[k]) { S[k] = e.value; } e.addEventListener('change', () => { S[k] = e.value; store.set(sk, e.value); }); });
    const wsb = [...document.querySelectorAll('[data-ws]')], wst = { box: $('#ws-status'), text: $('#ws-status-t'), bar: $('#ws-bar') };
    wsb.forEach(b => b.addEventListener('click', async () => download(b.dataset.ws, b, await wsJob(), { dls: wsb, status: wst, after: () => { wsb.forEach(x => { x.disabled = false; }); renderSummary(); } })));
    $('#tp-none').addEventListener('click', () => { S.off = new Set(S.topic.items.map(i => i.k)); renderPack(); });

      const [topics, folders, manifest, crops, pages, reports] = await Promise.all(['papers/topics.json', 'papers/folders.json', 'papers/manifest.json', 'papers/crops.json', 'papers/pages.json', 'papers/reports.json'].map((u, i) => getJ(u, i < 2)));
      D = { topics, folders: folders || {}, manifest: manifest || {}, crops: crops || {}, pages: pages || {}, reports: reports || { files: {}, crops: {} } };
    } catch (e) {

    }

    if (c && D.topics.books.some(b => b.course === c)) {
      pickCourse(c, true);
      if (bk && D.topics.books.some(b => b.id === bk && b.course === c)) { pickBook(bk, true); if (tp && tp.split('|')[0] === bk) { const n = +tp.split('|')[1]; if (S.book.topics.some(t => t.n === n)) pickTopic(n, true); } }
      if (!S.book) ui.steps.open(2); else if (!S.topic) ui.steps.open(3);
    }
  }
  /* shared with teacher_tests.js (test builder, exam trends): the data, the per-question facts and the PDF engine */
  let readyOk; const API = window.TeacherPacks = { ready: new Promise(r => { readyOk = r; }), info, blocks, build, download, yr, serLabel, qLabel, el, store,
    Steps,
    open(bookId, n) {   /* pre-select a topic in the Topic packs tab */
      const b = D.topics.books.find(x => x.id === bookId); if (!b) return;
      pickCourse(b.course); pickBook(bookId); if (b.topics.some(t => t.n === n)) pickTopic(n, true);

    } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
