<!doctype html>
<html lang="en-GB" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Digital Technology Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky circuit-green header; lesson rail beside content on wide screens, single column on phones. Copper is the one accent. */
:root {
  --paper: #f3f6f1; --card: #ffffff; --ink: #15221c; --muted: #56675e; --line: #d5ddd5; --soft: #e4ece6;
  --pcb: #11503e; --pcb-ink: #f2f7f3; --copper: #a95a24; --copper-soft: #f5e6da;
  --ok: #2c7a4b; --ok-soft: #e1f1e7; --warn: #a76d12; --warn-soft: #fbf0db; --bad: #b0352d; --bad-soft: #f9e3e1;
  --code-bg: #f7f9f6; --kw: #8a3fb5; --str: #2c7a4b; --num: #a95a24; --com: #7a8a82;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1512; --card: #15201b; --ink: #e5eee8; --muted: #9bb0a4; --line: #27362f; --soft: #1b2a23;
  --pcb: #1d6b53; --pcb-ink: #eef6f1; --copper: #e39a63; --copper-soft: #3a2719;
  --ok: #5cc68a; --ok-soft: #173326; --warn: #e6b04f; --warn-soft: #3a2d14; --bad: #ef7d74; --bad-soft: #3d1c1a;
  --code-bg: #101a15; --kw: #d19bf0; --str: #7fd6a3; --num: #f0ae7a; --com: #7f9488; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1512; --card: #15201b; --ink: #e5eee8; --muted: #9bb0a4; --line: #27362f; --soft: #1b2a23;
  --pcb: #1d6b53; --pcb-ink: #eef6f1; --copper: #e39a63; --copper-soft: #3a2719;
  --ok: #5cc68a; --ok-soft: #173326; --warn: #e6b04f; --warn-soft: #3a2d14; --bad: #ef7d74; --bad-soft: #3d1c1a;
  --code-bg: #101a15; --kw: #d19bf0; --str: #7fd6a3; --num: #f0ae7a; --com: #7f9488; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--pcb); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--copper); }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: 0.88em; }
.eyebrow { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--copper); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--pcb); color: var(--pcb-ink); }
.top-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; margin-right: auto; }
.chip-logo { width: 34px; height: 34px; border-radius: 6px; background: var(--pcb-ink); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.05rem; display: block; line-height: 1.1; }
.brand small { font: 0.72rem var(--f-mono); opacity: .8; }
@media (max-width: 1340px) { .brand small { display: none; } }
nav.main { display: flex; gap: 2px; flex-wrap: wrap; }
nav.main a { color: var(--pcb-ink); text-decoration: none; padding: 6px 7px; border-radius: 6px; font-size: .86rem; white-space: nowrap; }
nav.main a[aria-current="page"], nav.main a:hover { background: rgba(255,255,255,.15); }
.seg { display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; color: var(--pcb-ink); padding: 5px 11px; font-size: .82rem; }
.seg button[aria-pressed="true"] { background: var(--pcb-ink); color: var(--pcb); font-weight: 700; }
@media (max-width: 760px) { header.top { position: static; } nav.main { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; } }

.wrap { max-width: 1260px; margin: 0 auto; padding-block: 26px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cols { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
.rail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; padding-right: 6px; }
.rail h4 { font: 600 .68rem/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 4px; }
.rail a { display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .88rem; line-height: 1.3; }
.rail a span { font: .72rem var(--f-mono); color: var(--muted); padding-top: 2px; min-width: 24px; }
.rail a:hover { background: var(--soft); }
.rail a[aria-current="page"] { background: var(--pcb); color: var(--pcb-ink); }
.rail a[aria-current="page"] span { color: var(--pcb-ink); }
.mob-jump { display: none; }
@media (max-width: 900px) { .mob-jump { display: block; width: 100%; } }

.stack { display: grid; gap: 18px; min-width: 0; }
.stack > *, .panel > * { min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.lead { font-size: 1.07rem; max-width: 70ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: .93rem; }
.btn:hover { border-color: var(--pcb); }
.btn.primary { background: var(--pcb); color: var(--pcb-ink); border-color: var(--pcb); }
.btn.sm { padding: 5px 10px; font-size: .84rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; font: .72rem var(--f-mono); padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.tag.t { background: var(--copper-soft); color: var(--copper); }
.tag.g { background: var(--ok-soft); color: var(--ok); }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: end; padding-bottom: 24px; border-bottom: 2px solid var(--pcb); }
@media (max-width: 800px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.facts div { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div:nth-child(3n) { border-right: 0; }
.facts div:nth-last-child(-n+3) { border-bottom: 0; }
.facts b { display: block; font: 800 1.55rem/1 var(--f-display); color: var(--pcb); font-variant-numeric: tabular-nums; }
.facts span { font-size: .8rem; color: var(--muted); }
:root[data-theme="dark"] .facts b { color: var(--ok); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .facts b { color: var(--ok); } }
.unitcard { display: grid; gap: 10px; text-decoration: none; color: var(--ink); align-content: start; border-top: 6px solid var(--pcb); }
.unitcard:hover { border-color: var(--pcb); }
.unitcard .n { font: 600 .74rem var(--f-mono); color: var(--copper); }
.topic-card { display: grid; gap: 6px; text-decoration: none; color: var(--ink); align-content: start; }
.topic-card:hover { border-color: var(--pcb); }
.topic-card .n { font: 600 .74rem var(--f-mono); color: var(--copper); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Lesson */
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; font-weight: 700; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--copper); }
.spec-list { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.spec-list li { padding-left: 22px; position: relative; }
.spec-list li::before { content: ""; position: absolute; left: 4px; top: .55em; width: 9px; height: 9px; border: 2px solid var(--pcb); border-radius: 50%; }
.plan-step { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.plan-step:last-child { border-bottom: 0; }
.plan-step .t { font: 600 .76rem var(--f-mono); color: var(--copper); padding-top: 3px; }
.kw { display: flex; gap: 6px; flex-wrap: wrap; }

/* Slides */
.deck { display: grid; gap: 12px; }
.deck > * { min-width: 0; }
.slide { aspect-ratio: 16 / 9; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-rows: auto minmax(0,1fr) auto; overflow: hidden; }
.slide .sh { background: var(--pcb); color: var(--pcb-ink); padding: 13px 22px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.slide .sh h2 { font-size: clamp(1.05rem, 2.5vw, 1.9rem); }
.slide .sh .mono { opacity: .75; font-size: .74rem; white-space: nowrap; }
.slide .sb { padding: clamp(10px, 2.2vw, 28px) clamp(14px, 3vw, 34px); overflow: auto; font-size: clamp(.8rem, 1.5vw, 1.2rem); display: grid; gap: .7em; align-content: start; }
.slide .sb.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 700px) { .slide .sb.split { grid-template-columns: minmax(0,1fr); } }
.slide .sb ul { margin: 0; padding-left: 1.1em; display: grid; gap: .4em; }
.slide .sb li::marker { color: var(--copper); }
.slide .sb table { font-size: .9em; }
.slide .sf { padding: 6px 22px; font: .68rem var(--f-mono); color: var(--muted); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.slide.title-slide .sb { align-content: center; gap: 12px; }
.slide.title-slide .sb h2 { font-size: clamp(1.4rem, 4vw, 2.9rem); }
.deck-ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
.dots button { width: 12px; height: 12px; border-radius: 50%; border: 0; background: var(--line); padding: 0; }
.dots button[aria-current="true"] { background: var(--copper); }
.notes { background: var(--warn-soft); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; font-size: .92rem; }
.deck:fullscreen { background: var(--paper); padding: 2vh 3vw; align-content: center; }
.deck:fullscreen .slide { max-height: 88vh; width: auto; margin: 0 auto; }
.deck:fullscreen .notes { display: none; }

/* Code */
.code { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; min-width: 0; }
.code .ch { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); font: 600 .7rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.code pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: .82em/1.5 var(--f-mono); white-space: pre; color: var(--ink); }
.code .k { color: var(--kw); font-weight: 600; } .code .s { color: var(--str); } .code .nu { color: var(--num); } .code .c { color: var(--com); font-style: italic; }
.out { border-top: 1px dashed var(--line); padding: 8px 12px; font: .8em/1.5 var(--f-mono); white-space: pre-wrap; background: var(--card); max-height: 220px; overflow: auto; }
.out input { font: inherit; border: 1px solid var(--copper); border-radius: 4px; padding: 2px 6px; background: var(--paper); color: var(--ink); width: 14em; max-width: 100%; }
.out .err { color: var(--bad); }

/* Questions and activities */
.q { display: grid; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q-head { display: flex; gap: 12px; align-items: baseline; }
.q-num { font: 700 .95rem var(--f-mono); color: var(--copper); min-width: 2.4em; }
.q-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.marks { font: .78rem var(--f-mono); color: var(--muted); white-space: nowrap; }
textarea { width: 100%; min-height: 76px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
.ms { background: var(--ok-soft); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: .93rem; overflow-wrap: anywhere; }
.ms b { color: var(--ok); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 10px 12px; width: 100%; }
.opt span { overflow-wrap: anywhere; }
.opt .k { font: 700 .8rem var(--f-mono); color: var(--muted); padding-top: 2px; }
.opt:hover:not([disabled]) { border-color: var(--pcb); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { font-size: .92rem; overflow-wrap: anywhere; } .fb.r { color: var(--ok); } .fb.w { color: var(--bad); }
.score { display: flex; gap: 16px; align-items: center; padding: 14px 18px; border-radius: var(--r); background: var(--soft); flex-wrap: wrap; }
.score b { font: 800 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stem { background: var(--soft); border-radius: 8px; padding: 10px 14px; font-style: italic; }
.bank { display: flex; gap: 6px; flex-wrap: wrap; }
.bank span { border: 1px dashed var(--muted); padding: 3px 10px; border-radius: 6px; font-size: .9rem; }
.timer { font: 700 1.3rem var(--f-mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: .88rem; }
.chips button[aria-pressed="true"] { background: var(--pcb); color: var(--pcb-ink); border-color: var(--pcb); }
.matchgame { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 10px; }
@media (max-width: 640px) { .matchgame { grid-template-columns: minmax(0,1fr); } }
.matchgame .col { display: grid; gap: 8px; align-content: start; }
.mg { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 10px 12px; text-align: left; font-size: .93rem; }
.mg.sel { border-color: var(--copper); box-shadow: 0 0 0 2px var(--copper); }
.mg.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); cursor: default; }
.mg.no { background: var(--bad-soft); border-color: var(--bad); }
.cloze-line { line-height: 2.4; }
.cloze-line input { font: inherit; width: 9.5em; max-width: 100%; border: 0; border-bottom: 2px solid var(--muted); background: transparent; color: var(--ink); text-align: center; padding: 0 4px; }
.cloze-line input.r { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.cloze-line input.w { border-color: var(--bad); color: var(--bad); }
.tfrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tfrow:last-child { border-bottom: 0; }
.tfrow .chips button { padding: 4px 12px; }
.tfrow .chips button.r { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tfrow .chips button.w { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.sheet-head { display: grid; gap: 12px; border-bottom: 3px solid var(--pcb); padding-bottom: 12px; }
.secthead { display: flex; gap: 10px; align-items: baseline; margin-top: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.secthead .l { font: 700 .8rem var(--f-mono); color: var(--card); background: var(--copper); border-radius: 4px; padding: 1px 7px; }
.secthead .m { margin-left: auto; font: .76rem var(--f-mono); color: var(--muted); }
.wm { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap: 8px 16px; align-items: center; }
@media (max-width: 640px) { .wm { grid-template-columns: minmax(0,1fr); } }
.wm select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.wm .d b { color: var(--copper); margin-right: 6px; font-family: var(--f-mono); }

/* Past papers */
.heat td { text-align: center; font: .76rem var(--f-mono); padding: 5px 4px; }
.heat td:first-child, .heat th:first-child { text-align: left; font-family: var(--f-body); font-size: .85rem; white-space: nowrap; }
.h0 { color: var(--muted); } .h1 { background: var(--ok-soft); } .h2 { background: var(--ok); color: var(--card); font-weight: 700; }
.pp-year { display: grid; gap: 10px; }

/* Tracker */
.rag { display: flex; gap: 4px; }
.rag button { width: 34px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font: 700 .75rem var(--f-mono); color: var(--muted); }
.rag button.r[aria-pressed="true"] { background: var(--bad); color: var(--card); border-color: var(--bad); }
.rag button.a[aria-pressed="true"] { background: var(--warn); color: var(--card); border-color: var(--warn); }
.rag button.g[aria-pressed="true"] { background: var(--ok); color: var(--card); border-color: var(--ok); }
.bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--soft); }
.bar i { display: block; }

/* Glossary and flashcards */
/* Diagrams, video, podcast, fact file, media */
.diagram { max-width: 820px; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; }
.diagram svg, .diag-sb svg { width: 100%; height: auto; display: block; }
.diagram figcaption { font-size: .85rem; color: var(--muted); }
.diag-sb { display: grid; place-items: center; padding: 8px 4% !important; }
.diag-sb svg { max-height: 100%; }
.player { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.player:fullscreen { background: #000; padding: 2vh 2vw; align-content: center; }
.player:fullscreen .stage .slide { max-height: 78vh; margin: 0 auto; }
.stage { position: relative; }
.stage .slide { border: 0; }
.caption { min-height: 3.2em; background: #101814; color: #f2f7f3; border-radius: 8px; padding: 8px 14px; font-size: 1.02rem; line-height: 1.45; text-align: center; display: grid; place-items: center; }
.caption:empty { visibility: hidden; }
.pbar { display: flex; gap: 3px; height: 8px; }
.pbar button { border: 0; padding: 0; border-radius: 3px; background: var(--soft); min-width: 4px; }
.pbar button.done { background: var(--copper-soft); }
.pbar button.on { background: var(--copper); }
.pctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pctl select { font: inherit; font-size: .85rem; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); max-width: 210px; }

@keyframes sIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes sBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes stepIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.slide.in { animation: sIn .35s ease both; }

.flip .ff, .flip .fb { position: absolute; inset: 0; display: grid; place-items: center; padding: .6em .8em; border-radius: 10px; backface-visibility: hidden; transition: transform .45s ease; text-align: center; }

/* phones: slides grow to fit their content and text stays readable */
