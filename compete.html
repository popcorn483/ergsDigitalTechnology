<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>House competition</title>
<meta name="robots" content="noindex">
<link rel="icon" href="app-icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/AtkinsonHyperlegible-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/AtkinsonHyperlegible-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--sans:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;--bg:#EEF2F7;--paper:#fff;--ink:#16213A;--ink-2:#3B4660;--ink-3:#5F6A7A;--line:#D3D9E2;--accent:#1F5FBF;--accent-2:#E8F0FC;--ok:#17784A;--ok-2:#E6F4EC;--bad:#B3261E;--bad-2:#FCEBEA;--gold:#C99A06;--blue:#1F5FBF;--red:#C0392B;--green:#1E8E4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1524;--paper:#18213A;--ink:#EEF2FA;--ink-2:#C9D1E3;--ink-3:#97A2BA;--line:#2D3A58;--accent:#6EA2FF;--accent-2:#1D2C4D;--ok:#5FD39A;--ok-2:#173528;--bad:#FF8A80;--bad-2:#3D1D1D}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top a{color:var(--ink-2);text-decoration:none;font-weight:700;font-size:15px;padding:6px 4px}
.top .t{flex:1;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}
h2{font-size:19px;margin:0 0 10px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7A3FC4;margin:0 0 6px}
.muted{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chip.due{background:#FFF3D6;color:#7A5200}
.rub{width:100%;border-collapse:collapse;font-size:15px}
.rub td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.rub td:last-child{white-space:nowrap;font-weight:700;text-align:right}
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.houses button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;font-size:15px}
.houses button small{font-weight:400;color:var(--ink-3);font-size:12px}
.houses button[aria-pressed="true"]{border-color:var(--h);background:color-mix(in srgb,var(--h) 14%,var(--paper));box-shadow:inset 0 0 0 1px var(--h)}
@media (max-width:420px){.houses{grid-template-columns:repeat(2,1fr)}}
label.f{display:block;font-weight:700;margin:16px 0 6px}
label.f small{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=url],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
textarea{min-height:180px;resize:vertical;line-height:1.5}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--bg)}
.drop img{max-width:100%;max-height:340px;border-radius:10px;display:block;margin:0 auto 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:#7A3FC4;border-color:#7A3FC4;color:#fff;width:100%;margin-top:18px}
.btn:disabled{opacity:.5;cursor:default}
.note{background:#FFF3D6;border-radius:12px;padding:10px 12px;font-size:15px;margin:12px 0}
.okbox{background:var(--ok-2);border-radius:12px;padding:12px;margin:12px 0;color:var(--ink)}
.err{background:var(--bad-2);border-radius:12px;padding:12px;margin:12px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px;margin:12px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
ul{padding-left:20px;margin:8px 0}
li{margin:4px 0}
.wc{font-size:13px;color:var(--ink-3);text-align:right;margin-top:4px}
</style>
</head>
<body>
<header class="top"><a href="index.html">← Home</a><span class="t">House competition</span><span style="width:60px"></span></header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
  var H = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var HOUSES = [['Belmore', 'Gold · Hare', 'var(--gold)'], ['Benaughlin', 'Blue · Eagle', 'var(--blue)'], ['Cuilcagh', 'Red · Fox', 'var(--red)'], ['Trien', 'Green · Stag', 'var(--green)']];
  var RID = (new URLSearchParams(location.search).get('r') || '').replace(/[^A-Za-z0-9]/g, '');
  var me = null; try { me = JSON.parse(LS.get('mrb-pupil') || 'null'); } catch (e) { }
  var runs = []; try { runs = JSON.parse(LS.get('mrb-mycomps') || '[]') || []; } catch (e) { }
  var run = runs.filter(function (r) { return r.id === RID; })[0];
  var main = $('#main'), URL0 = LS.get('mrb-act-url') || '', C = null, img = null;
  var nice = function (d) { var x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); };
  if (!run) { main.innerHTML = '<div class="card"><h1>Competition not found</h1><p>It may have closed. Go back to the home page to see the competitions open for your year.</p><a class="btn" href="index.html">Home</a></div>'; return; }
  if (!me || !me.id) { main.innerHTML = '<div class="card"><h1>' + H(run.title) + '</h1><div class="err">Sign in on the home page first, so your entry counts for your house.</div><a class="btn" href="index.html">Home</a></div>'; return; }
  Promise.all([fetch('activity.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).catch(function () { return null; }), fetch('competitions/catalogue.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).catch(function () { return { comps: [] }; })])
    .then(function (a) { if (a[0] && a[0].url) URL0 = String(a[0].url).trim(); C = (a[1].comps || []).filter(function (c) { return c.id === run.comp; })[0] || (a[1].comps || []).filter(function (c) { return c.title === run.title; })[0] || { title: run.title, brief: '', entry: { kind: 'image-or-link', help: '' }, rubric: [] }; paint(); });

  function paint() {
    document.title = run.title + ' · House competition';
    var kind = (C.entry && C.entry.kind) || 'image-or-link', house = run.house || LS.get('mrb-house') || '';
    var wantImg = /image/.test(kind), wantLink = /link/.test(kind), wantText = kind === 'text';
    var max = (C.rubric || []).reduce(function (s, r) { return s + (+r.max || 0); }, 0);
    main.innerHTML = '<div class="card"><p class="eyebrow">Inter-house competition · ' + H(run.cat || C.category || '') + '</p><h1>' + H(run.title || C.title) + '</h1>' +
      '<div class="chips"><span class="chip due">Closes ' + H(nice(run.closes)) + '</span>' + (C.group ? '<span class="chip">' + H(C.group) + '</span>' : '') + (C.time ? '<span class="chip">' + H(C.time) + '</span>' : '') + '</div>' +
      (run.note ? '<div class="note">' + H(run.note) + '</div>' : '') + '<p style="margin-top:14px">' + H(C.brief) + '</p>' +
      (C.entry && C.entry.help ? '<h2 style="margin-top:16px">How to enter</h2><p>' + H(C.entry.help) + '</p>' : '') + '</div>' +
      ((C.rubric || []).length ? '<div class="card"><h2>How it’s judged' + (max ? ' (out of ' + max + ')' : '') + '</h2><table class="rub">' + C.rubric.map(function (r) { return '<tr><td><b>' + H(r.c) + '</b><br><span class="muted">' + H(r.look) + '</span></td><td>' + H(r.max) + '</td></tr>'; }).join('') + '</table><p class="muted" style="margin:10px 0 0;font-size:14px">Every entry earns a point for your house. Places 1st to 4th earn more.</p></div>' : '') +
      '<div class="card"><h2>Your entry</h2>' + (run.entered ? '<div class="okbox">✓ You entered on ' + new Date(run.entered).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + '. Sending it again replaces your entry, until it closes.</div>' : '') +
      '<label class="f">Your house</label><div class="houses" role="group" aria-label="Your house">' + HOUSES.map(function (h) { return '<button type="button" style="--h:' + h[2] + '" aria-pressed="' + (house === h[0]) + '" data-h="' + h[0] + '">' + h[0] + '<small>' + h[1] + '</small></button>'; }).join('') + '</div>' +
      '<label class="f" for="et">Title of your entry <small>(optional)</small></label><input type="text" id="et" maxlength="80" placeholder="Give it a name">' +
      (wantImg ? '<label class="f">Picture or screenshot</label><div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a picture"><div id="pv"></div><b>Tap to choose a picture</b><br><span class="muted" style="font-size:14px">PNG or JPG. It’s resized to send quickly.</span><input type="file" id="file" accept="image/*" hidden></div>' : '') +
      (wantImg && wantLink ? '<div class="or">or</div>' : '') +
      (wantLink ? '<label class="f" for="el">Link to your work <small>(share it so “anyone with the link” can view)</small></label><input type="url" id="el" placeholder="https://…" inputmode="url">' : '') +
      (wantText ? '<label class="f" for="ex">Your entry</label><textarea id="ex" maxlength="3000"></textarea><div class="wc" id="wc">0 words</div>' : '<label class="f" for="ex">Anything the judges should know? <small>(optional)</small></label><textarea id="ex" maxlength="1000" style="min-height:90px" placeholder="e.g. how to play your game, what you’re proudest of"></textarea>') +
      '<div id="msg"></div><button type="button" class="btn pri" id="go">' + (run.entered ? 'Update my entry' : 'Send my entry') + '</button>' +
      '<p class="muted" style="font-size:14px;margin:12px 0 0">Only your teacher sees entries. Don’t include photos of people’s faces or anyone’s personal details. Use your own work, or credit anything you used.</p></div>';
    main.querySelectorAll('.houses button').forEach(function (b) { b.onclick = function () { house = b.dataset.h; LS.set('mrb-house', house); main.querySelectorAll('.houses button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }; });
    var drop = $('#drop'), file = $('#file');
    if (drop) { drop.onclick = function (e) { if (e.target !== file) file.click(); }; drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
      file.onchange = function () { var f = file.files[0]; if (!f) return; shrink(f).then(function (d) { img = d; $('#pv').innerHTML = '<img alt="Your picture" src="' + d + '">'; }).catch(function () { say('err', 'Couldn’t read that picture. Try a PNG or JPG.'); }); }; }
    var ex = $('#ex'), wc = $('#wc'); if (wc) ex.oninput = function () { var n = (ex.value.trim().match(/\S+/g) || []).length; wc.textContent = n + ' word' + (n === 1 ? '' : 's'); };
    $('#go').onclick = function () {
      var link = $('#el') ? $('#el').value.trim() : '', text = ex.value.trim();
      if (!house) return say('err', 'Pick your house first.');
      if (link && !/^https:\/\/\S+$/.test(link)) return say('err', 'That link should start with https://');
      if (wantText && text.length < 20) return say('err', 'Write your entry in the box first.');
      if (!wantText && !img && !link) return say('err', wantImg && wantLink ? 'Add a picture or a link first.' : wantImg ? 'Add a picture first.' : 'Add the link first.');
      if (!URL0) return say('err', 'Can’t reach the school server. Try again later.');
      var go = $('#go'); go.disabled = true; go.textContent = 'Sending…';
      var body = JSON.stringify({ kind: 'compentry', book: 'home', id: me.id, name: me.name, cls: me.cls, rid: RID, house: house, title: $('#et').value.trim(), link: link, text: text, img: img || '' });
      fetch(URL0, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' } }).then(function (r) { return r.json(); }).then(function (j) { done(j); })
        .catch(function () { fetch(URL0, { method: 'POST', mode: 'no-cors', body: body }).then(function () { done({ ok: true, unsure: true }); }).catch(function () { done({ ok: false, error: 'You seem to be offline. Try again when you’re connected.' }); }); });
    };
  }
  function done(j) {
    var go = $('#go');
    if (!j || !j.ok) { go.disabled = false; go.textContent = run.entered ? 'Update my entry' : 'Send my entry'; return say('err', (j && j.error) || 'That didn’t send. Try again.'); }
    run.entered = Date.now(); run.house = LS.get('mrb-house') || run.house;
    var all = []; try { all = JSON.parse(LS.get('mrb-mycomps') || '[]'); } catch (e) { } all.forEach(function (r) { if (r.id === RID) { r.entered = run.entered; r.house = run.house; } }); LS.set('mrb-mycomps', JSON.stringify(all));
    main.innerHTML = '<div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h1>Entry ' + (j.updated ? 'updated' : 'received') + '!</h1><p>Good luck, ' + H((me.name || '').split(' ')[0]) + '. You’ve earned a point for ' + H(run.house || 'your house') + ' just by entering.</p><p class="muted">Winners are announced after it closes on ' + H(nice(run.closes)) + '. You can change your entry until then.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn" href="index.html">Home</a><button type="button" class="btn" id="again">Change my entry</button></div></div>';
    $('#again').onclick = function () { img = null; paint(); };
    window.scrollTo(0, 0);
  }
  function say(k, t) { var m = $('#msg'); if (m) { m.innerHTML = '<div class="' + (k === 'err' ? 'err' : 'okbox') + '">' + H(t) + '</div>'; m.scrollIntoView({ block: 'nearest' }); } }
  function shrink(f) {   /* resize to at most 1600px and re-encode, so uploads are small */
    return new Promise(function (ok, no) { var r = new FileReader(); r.onerror = no; r.onload = function () { var im = new Image(); im.onerror = no; im.onload = function () {
      var s = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      var png = /png|gif/.test(f.type) && c.width * c.height < 1.2e6 ? c.toDataURL('image/png') : null;   /* keep pixel art crisp */
      ok(png && png.length < 2.5e6 ? png : c.toDataURL('image/jpeg', 0.85)); }; im.src = r.result; }; r.readAsDataURL(f); });
  }
})();
</script>
</body>
</html>
